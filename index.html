<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الجمعية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 10px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 8px; font-size: 20px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 15px; font-size: 12px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 14px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; }
        .btn { width: 100%; padding: 10px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 6px; }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: #95a5a6; }
        .btn-success { background: #27ae60; }
        .btn-warning { background: #f39c12; }
        .btn-danger { background: #e74c3c; }
        .btn-info { background: #3498db; }
        .btn-small { width: auto; padding: 5px 10px; font-size: 12px; margin: 2px; display: inline-block; border-radius: 4px; border: none; color: white; cursor: pointer; }
        .error { background: #fee; color: #c33; padding: 8px; border-radius: 6px; margin-bottom: 10px; display: none; text-align: center; font-size: 13px; }
        
        .member-card { 
            background: #f8f9fa; 
            padding: 8px 10px; 
            border-radius: 6px; 
            margin-bottom: 6px; 
            border-right: 4px solid #667eea;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .member-card:hover { background: #e9ecef; }
        .member-card .info { flex: 1; min-width: 0; }
        .member-card .name { font-weight: bold; font-size: 13px; color: #2c3e50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .member-card .details { font-size: 11px; color: #7f8c8d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .member-card .actions { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
        
        .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; }
        .badge-head { background: #667eea; color: white; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-modal { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 6px; margin-bottom: 12px; }
        .stat-box { background: #e3f2fd; padding: 8px 5px; border-radius: 6px; text-align: center; cursor: pointer; }
        .stat-box h4 { font-size: 16px; color: #1976d2; }
        .stat-box p { font-size: 10px; color: #666; }
        
        .filter-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
        .filter-row select, .filter-row input { flex: 1; min-width: 100px; padding: 7px; font-size: 13px; }
        
        .whatsapp-btn { background: #25D366; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .export-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        .export-buttons button { flex: 1; min-width: 90px; }
        
        .sector-selector { background: #f8f9fa; padding: 8px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #667eea; }
        .sector-selector h4 { font-size: 12px; color: #667eea; margin-bottom: 6px; }
        .sector-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
        .sector-buttons button { flex: 1; min-width: 70px; padding: 5px; font-size: 11px; }
        .sector-buttons button.active { background: #667eea; color: white; }
        
        .results-count { background: #e3f2fd; padding: 6px; border-radius: 4px; margin-bottom: 10px; text-align: center; font-size: 12px; color: #1976d2; }
        
        #loginScreen, #dashboard, #membersSection { display: none; }
        #loginScreen.active, #dashboard.active, #membersSection.active { display: block; }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="active">
        <h1>️ نظام إدارة الجمعية</h1>
        <p class="subtitle">تسجيل دخول المستخدمين</p>
        <div class="error" id="errorMsg"></div>
        <div class="input-group">
            <label>البريد الإلكتروني:</label>
            <input type="email" id="email" placeholder="example@email.com">
        </div>
        <div class="input-group">
            <label>كلمة المرور:</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn" onclick="doLogin()">تسجيل الدخول</button>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboard">
        <h1>مرحباً، <span id="userName"></span></h1>
        <p class="subtitle" id="userRole">👑 مدير عام</p>
        <button class="btn" onclick="showMembers()">👥 إدارة الأعضاء</button>
        <button class="btn btn-secondary" onclick="doLogout()" style="margin-top: 10px;">تسجيل الخروج</button>
    </div>

    <!-- قسم الأعضاء -->
    <div id="membersSection">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h2>👥 الأعضاء</h2>
            <button class="btn btn-secondary btn-small" onclick="showDashboard()">← رجوع</button>
        </div>
        
        <div class="stats-row">
            <div class="stat-box" onclick="quickFilter('all')"><h4 id="totalCount">0</h4><p>الكل</p></div>
            <div class="stat-box" onclick="quickFilter('active')"><h4 id="activeCount">0</h4><p>نشط</p></div>
            <div class="stat-box" onclick="quickFilter('young')"><h4 id="youngCount">0</h4><p>شباب</p></div>
            <div class="stat-box" onclick="quickFilter('senior')"><h4 id="seniorCount">0</h4><p>كبار</p></div>
            <div class="stat-box" onclick="quickFilter('sub_both')"><h4 id="bothCount">0</h4><p>مزدوج</p></div>
        </div>

        <div class="sector-selector" id="sectorSelector">
            <h4>🎯 اختر القطاع للعرض:</h4>
            <div class="sector-buttons">
                <button class="btn btn-small" onclick="selectSector('all')" id="sector-all">الكل</button>
                <button class="btn btn-small" onclick="selectSector('الحارة 1')" id="sector-الحارة 1">الحارة 1</button>
                <button class="btn btn-small" onclick="selectSector('الحارة 2')" id="sector-الحارة 2">الحارة 2</button>
                <button class="btn btn-small" onclick="selectSector('الوادي')" id="sector-الوادي">الوادي</button>
                <button class="btn btn-small" onclick="selectSector('المنصورة')" id="sector-المنصورة">المنصورة</button>
                <button class="btn btn-small" onclick="selectSector('الجبل')" id="sector-الجبل">الجبل</button>
                <button class="btn btn-small" onclick="selectSector('دمر')" id="sector-دمر">دمر</button>
            </div>
        </div>

        <div class="filter-row">
            <input type="text" id="searchInput" placeholder="🔍 ابحث بالاسم، الكود، الهاتف..." oninput="doSearch()">
        </div>
        
        <div class="filter-row">
            <select id="filterStatus" onchange="applyFilters()">
                <option value="">كل الحالات</option>
                <option value="active">نشط</option>
                <option value="exempt">معفي</option>
                <option value="suspended">متوقف</option>
                <option value="withdrawn">منسحب</option>
                <option value="deceased">متوفي</option>
            </select>
            <select id="filterSubscription" onchange="applyFilters()">
                <option value="">كل الاشتراكات</option>
                <option value="both">مزدوج</option>
                <option value="association">جمعية فقط</option>
                <option value="death">وفاة فقط</option>
            </select>
        </div>

        <div class="export-buttons">
            <button class="btn btn-success btn-small" onclick="openAddMemberModal()">+ إضافة عضو</button>
            <button class="btn btn-info btn-small" onclick="exportToExcel()">تصدير Excel</button>
            <button class="btn btn-warning btn-small" onclick="resetFilters()">إعادة ضبط</button>
        </div>
        
        <div class="results-count" id="resultsCount">جاري التحميل...</div>
        <div id="membersList"></div>
    </div>
</div>

<!-- النافذة المنبثقة للإضافة والتعديل -->
<div id="memberModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">إضافة عضو جديد</h3>
            <button class="close-modal" onclick="closeMemberModal()">×</button>
        </div>
        <form id="memberForm" onsubmit="saveMember(event)">
            <input type="hidden" id="memberId">
            <div class="form-row">
                <div class="input-group"><label>كود الأسرة *</label><input type="text" id="familyCode" required></div>
                <div class="input-group"><label>كود الفرد *</label><input type="text" id="memberCode" required></div>
            </div>
            <div class="input-group"><label>الاسم الثلاثي *</label><input type="text" id="memberName" required></div>
            <div class="form-row">
                <div class="input-group"><label>تاريخ الميلاد</label><input type="date" id="birthDate" onchange="calculateAge()"></div>
                <div class="input-group"><label>العمر</label><input type="number" id="memberAge" readonly></div>
            </div>
            <div class="form-row">
                <div class="input-group"><label>نوع العضو</label>
                    <select id="memberType">
                        <option value="normal">عادي</option>
                        <option value="young">شاب (&lt;30)</option>
                        <option value="senior">كبير (&gt;60)</option>
                    </select>
                </div>
                <div class="input-group"><label>صلة القرابة</label>
                    <select id="relation">
                        <option value="رب أسرة">رب أسرة</option>
                        <option value="زوجة">زوجة</option>
                        <option value="ابن">ابن</option>
                        <option value="بنت">بنت</option>
                    </select>
                </div>
            </div>
            <div class="input-group"><label>القطاع</label>
                <select id="memberSector">
                    <option value="الحارة 1">الحارة 1</option>
                    <option value="الحارة 2">الحارة 2</option>
                    <option value="الوادي">الوادي</option>
                    <option value="المنصورة">المنصورة</option>
                    <option value="الجبل">الجبل</option>
                    <option value="دمر">دمر</option>
                </select>
            </div>
            <div class="form-row">
                <div class="input-group"><label>رقم الجوال</label><input type="tel" id="memberPhone"></div>
                <div class="input-group"><label>حالة العضو</label>
                    <select id="memberStatus">
                        <option value="active">نشط</option>
                        <option value="exempt">معفي</option>
                        <option value="suspended">متوقف</option>
                        <option value="withdrawn">منسحب</option>
                        <option value="deceased">متوفي</option>
                    </select>
                </div>
            </div>
            <div class="input-group"><label>نوع الاشتراك:</label>
                <div style="display:flex;gap:15px;margin:8px 0;">
                    <label><input type="checkbox" id="subAssociation"> جمعية</label>
                    <label><input type="checkbox" id="subDeath"> وفاة</label>
                </div>
            </div>
            <button type="submit" class="btn btn-success">حفظ البيانات</button>
        </form>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBwBOJjthFdSc7jv0dGL325kcaNqzD9dII",
    authDomain: "jam3iyati-b7528.firebaseapp.com",
    projectId: "jam3iyati-b7528",
    storageBucket: "jam3iyati-b7528.firebasestorage.app",
    messagingSenderId: "499100272911",
    appId: "1:499100272911:web:5bda121dbffa085770567a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let allMembers = [];
let filteredMembers = [];
let currentSector = 'all';
let userRole = 'admin';

auth.onAuthStateChanged(user => {
    if (user) { 
        currentUser = user; 
        loadUserRole();
        showDashboard(); 
    } else { 
        showLogin(); 
    }
});

async function loadUserRole() {
    try {
        const doc = await db.collection('users').doc(currentUser.uid).get();
        if (doc.exists) {
            const data = doc.data();
            userRole = data.role || 'admin';
            currentSector = data.sector || 'all';
            document.getElementById('userRole').textContent = 
                userRole === 'admin' ? '👑 مدير عام' : `👔 معتمد - ${currentSector}`;
            updateSectorButtons();
        }
    } catch (e) { console.error(e); }
}

function showLogin() {
    document.getElementById('loginScreen').classList.add('active');
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('membersSection').classList.remove('active');
}

function showDashboard() {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('membersSection').classList.remove('active');
    document.getElementById('dashboard').classList.add('active');
    if (currentUser) document.getElementById('userName').textContent = currentUser.email.split('@')[0];
}

function showMembers() {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('membersSection').classList.add('active');
    loadMembers();
}

function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    
    auth.signInWithEmailAndPassword(email, password)
        .catch(error => {
            errorMsg.textContent = 'خطأ: ' + error.message;
            errorMsg.style.display = 'block';
        });
}

function doLogout() { auth.signOut(); }

async function loadMembers() {
    const container = document.getElementById('membersList');
    document.getElementById('resultsCount').textContent = 'جاري التحميل...';
    
    try {
        let query = db.collection('members');
        if (userRole !== 'admin' && currentSector !== 'all') {
            query = query.where('sector', '==', currentSector);
        }
        
        const snapshot = await query.get();
        allMembers = [];
        snapshot.forEach(doc => {
            allMembers.push({ id: doc.id, ...doc.data() });
        });
        
        applyFilters();
    } catch (error) {
        container.innerHTML = '<p style="text-align:center;color:#e74c3c;">خطأ: ' + error.message + '</p>';
    }
}

function applyFilters() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
    const status = document.getElementById('filterStatus').value;
    const subscription = document.getElementById('filterSubscription').value;
    
    filteredMembers = allMembers.filter(m => {
        if (currentSector !== 'all' && m.sector !== currentSector) return false;
        
        if (searchTerm) {
            const name = (m.name || '').toLowerCase();
            const code = `${m.familyCode}-${m.memberCode}`.toLowerCase();
            const phone = (m.phone || '').toLowerCase();
            if (!name.includes(searchTerm) && !code.includes(searchTerm) && !phone.includes(searchTerm)) return false;
        }
        
        if (status && m.status !== status) return false;
        if (subscription === 'both' && !(m.hasAssociation && m.hasDeath)) return false;
        if (subscription === 'association' && !(m.hasAssociation && !m.hasDeath)) return false;
        if (subscription === 'death' && !(!m.hasAssociation && m.hasDeath)) return false;
        
        return true;
    });
    
    updateStats();
    displayMembers();
}

function displayMembers() {
    const container = document.getElementById('membersList');
    document.getElementById('resultsCount').textContent = `عرض ${filteredMembers.length} من أصل ${allMembers.length} عضو`;
    
    if (filteredMembers.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">لا توجد نتائج</p>';
        return;
    }
    
    let html = '';
    filteredMembers.forEach(m => {
        const fullCode = `${m.familyCode}-${m.memberCode}`;
        const statusColors = {'active':'#27ae60','exempt':'#f39c12','suspended':'#e67e22','withdrawn':'#95a5a6','deceased':'#34495e'};
        const statusColor = statusColors[m.status] || '#667eea';
        const subIcon = (m.hasAssociation && m.hasDeath) ? '🔵🔴' : (m.hasAssociation ? '🔵' : (m.hasDeath ? '🔴' : '⚪'));
        
        html += `
            <div class="member-card">
                <div class="info" onclick="viewMember('${m.id}')">
                    <div class="name">${m.name} ${m.relation === 'رب أسرة' ? '<span class="badge badge-head">رب</span>' : ''}</div>
                    <div class="details">${fullCode} • ${m.sector||'-'} • ${subIcon}</div>
                </div>
                <div class="actions">
                    <button class="btn-small btn-warning" onclick="editMember('${m.id}')">✏️</button>
                    <button class="btn-small btn-danger" onclick="deleteMember('${m.id}')">🗑️</button>
                    ${m.phone ? `<button class="whatsapp-btn" onclick="sendWhatsApp('${m.phone}','${m.name}')">📱</button>` : ''}
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
}

function updateStats() {
    let active = 0, young = 0, senior = 0, both = 0;
    filteredMembers.forEach(m => {
        if (m.status === 'active') active++;
        if (m.memberType === 'young' || m.memberAge < 30) young++;
        if (m.memberType === 'senior' || m.memberAge > 60) senior++;
        if (m.hasAssociation && m.hasDeath) both++;
    });
    document.getElementById('totalCount').textContent = filteredMembers.length;
    document.getElementById('activeCount').textContent = active;
    document.getElementById('youngCount').textContent = young;
    document.getElementById('seniorCount').textContent = senior;
    document.getElementById('bothCount').textContent = both;
}

function editMember(id) {
    const m = allMembers.find(x => x.id === id);
    if (!m) return;
    document.getElementById('modalTitle').textContent = 'تعديل بيانات عضو';
    document.getElementById('memberId').value = id;
    document.getElementById('familyCode').value = m.familyCode || '';
    document.getElementById('memberCode').value = m.memberCode || '';
    document.getElementById('memberName').value = m.name || '';
    document.getElementById('birthDate').value = m.birthDate || '';
    document.getElementById('memberAge').value = m.memberAge || '';
    document.getElementById('relation').value = m.relation || 'رب أسرة';
    document.getElementById('memberSector').value = m.sector || 'الحارة 1';
    document.getElementById('memberPhone').value = m.phone || '';
    document.getElementById('subAssociation').checked = m.hasAssociation || false;
    document.getElementById('subDeath').checked = m.hasDeath || false;
    document.getElementById('memberStatus').value = m.status || 'active';
    document.getElementById('memberModal').classList.add('active');
}

function deleteMember(id) {
    if (confirm('هل أنت متأكد من حذف هذا العضو؟')) {
        db.collection('members').doc(id).delete().then(() => {
            alert('تم الحذف بنجاح');
            loadMembers();
        });
    }
}

function openAddMemberModal() {
    document.getElementById('modalTitle').textContent = 'إضافة عضو جديد';
    document.getElementById('memberForm').reset();
    document.getElementById('memberId').value = '';
    document.getElementById('memberModal').classList.add('active');
}

function closeMemberModal() { document.getElementById('memberModal').classList.remove('active'); }

function saveMember(e) {
    e.preventDefault();
    const id = document.getElementById('memberId').value;
    const data = {
        familyCode: document.getElementById('familyCode').value,
        memberCode: document.getElementById('memberCode').value,
        name: document.getElementById('memberName').value,
        birthDate: document.getElementById('birthDate').value,
        memberAge: parseInt(document.getElementById('memberAge').value) || 0,
        relation: document.getElementById('relation').value,
        sector: document.getElementById('memberSector').value,
        phone: document.getElementById('memberPhone').value,
        hasAssociation: document.getElementById('subAssociation').checked,
        hasDeath: document.getElementById('subDeath').checked,
        status: document.getElementById('memberStatus').value,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    const action = id ? db.collection('members').doc(id).update(data) : db.collection('members').add(data);
    action.then(() => {
        alert('تم الحفظ بنجاح');
        closeMemberModal();
        loadMembers();
    });
}

function doSearch() { applyFilters(); }
function selectSector(s) { currentSector = s; updateSectorButtons(); applyFilters(); }
function updateSectorButtons() {
    ['all', 'الحارة 1', 'الحارة 2', 'الوادي', 'المنصورة', 'الجبل', 'دمر'].forEach(s => {
        const btn = document.getElementById(`sector-${s}`);
        if (btn) btn.classList.toggle('active', s === currentSector);
    });
}
function calculateAge() {
    const b = new Date(document.getElementById('birthDate').value);
    if (!isNaN(b)) document.getElementById('memberAge').value = new Date().getFullYear() - b.getFullYear();
}
function resetFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterSubscription').value = '';
    currentSector = 'all';
    updateSectorButtons();
    applyFilters();
}
function viewMember(id) {
    const m = allMembers.find(x => x.id === id);
    if (m) alert(`👤 ${m.name}\n🔑 ${m.familyCode}-${m.memberCode}\n🏢 القطاع: ${m.sector}\n📱 الهاتف: ${m.phone||'-'}`);
}
function sendWhatsApp(phone, name) {
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent('مرحباً ' + name)}`, '_blank');
}
function exportToExcel() {
    const ws = XLSX.utils.json_to_sheet(filteredMembers);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "الأعضاء");
    XLSX.writeFile(wb, "members.xlsx");
}
