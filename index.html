async function importBackupFile(input){
  const file=input.files[0];if(!file)return;
  const text=await file.text();
  try{
    const parsed=JSON.parse(text);const d=parsed.data||parsed;
    if(!d.people&&!d.graves)throw new Error('ملف غير صالح');
    if(!confirm('سيتم الدمج. متابعة؟')){input.value='';return;}
    const gFp=new Set(S.graves.map(g=>normAr(`${g.number}|${g.location||''}`)));
    const pFp=new Set(S.people.map(p=>normAr(`${p.name}|${p.birth||''}`)));
    const fFp=new Set(S.families.map(f=>normAr(f.name)));
    let added=0;
    for(const g of (d.graves||[])){if(gFp.has(normAr(`${g.number}|${g.location||''}`)))continue;delete g.id;await dbPut('graves',g);added++;}
    for(const p of (d.people||[])){if(pFp.has(normAr(`${p.name}|${p.birth||''}`)))continue;delete p.id;await dbPut('people',p);added++;}
    for(const f of (d.families||[])){if(fFp.has(normAr(f.name)))continue;delete f.id;await dbPut('families',f);added++;}
    for(const b of (d.burials||[])){delete b.id;await dbPut('burials',b);}
    for(const fl of (d.fields||[])){delete fl.id;await dbPut('fields',fl);}
    await loadAll();closeSheet();toast(`✅ ${added}`);
    renderHome();
  }catch(e){toast('خطأ: '+e.message,'error');}
  input.value='';
}

async function clearAllData(){
  if(!confirm('حذف كل البيانات؟'))return;
  if(!confirm('تأكيد نهائي!'))return;
  for(const s of STORES)await dbClear(s);
  await loadAll();closeSheet();toast('🗑️');
  renderHome();go('pg-home');
}

/* ============ WHATSAPP SHARE ============ */
function shareFamilyWA(id){
  const f=S.families.find(x=>x.id===id);if(!f)return;
  const members=S.people.filter(p=>p.familyId===id);
  let txt=`*${f.name}*\n`;
  if(f.code)txt+=`الرمز: ${f.code}\n`;
  txt+=`\n*الأفراد (${members.length}):*\n`;
  members.slice(0,50).forEach((p,i)=>{
    txt+=`${i+1}. ${p.name}${p.relation?' ('+p.relation+')':''}${p.status==='متوفى'?' ⚰️':''}\n`;
  });
  if(members.length>50)txt+=`\n... و${members.length-50}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank');
}
function shareBurialWA(id){
  const b=S.burials.find(x=>x.id===id);if(!b)return;
  const txt=`🪦 *سجل دفن*\n\n*الاسم:* ${b.personName}\n*القبر:* ${b.graveNumber}\n*تاريخ الدفن:* ${b.burialDate}\n${b.age?'*العمر:* '+b.age+'\n':''}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank');
}

/* ============ SEARCH ============ */
const globalSearch=debounce(q=>{
  $('searchClear').style.display=q?'block':'none';
  if(S.page==='pg-graves')renderGraves();
  else if(S.page==='pg-people')renderPeople();
  else if(S.page==='pg-families')renderFamilies();
  else if(S.page==='pg-burials')renderBurials();
},200);
function clearSearch(){$('globalSearch').value='';globalSearch('');}

/* ============ URL HASH (#grave-Z001) ============ */
function checkUrlHash(){
  const hash=location.hash;
  if(!hash)return;
  const m=hash.match(/^#grave-(.+)$/);
  if(m){
    const num=decodeURIComponent(m[1]);
    const g=S.graves.find(x=>String(x.number)===String(num));
    if(g){
      setTimeout(()=>openGraveSheet(g.id),500);
      history.replaceState(null,'',location.pathname);
    }
  }
}

/* ============ INIT ============ */
async function init(){
  const savedTheme=localStorage.getItem('zt');
  if(savedTheme)document.documentElement.setAttribute('data-theme',savedTheme);
  try{
    await openDB();
    await loadAll();
    renderHome();
    $('fab').style.display='none';

    // نسخ احتياطي تلقائي كل 24 ساعة
    setInterval(async()=>{
      const last=localStorage.getItem('lastBackupTime');
      const now=Date.now();
      if(!last||(now-new Date(last).getTime())>86400000){
        if(fsFileHandle)await saveToBackupFile();
      }
    },3600000);

    // عرض إشعار النسخة
    const last=localStorage.getItem('lastBackupTime');
    if(!last){
      setTimeout(()=>{
        if(S.graves.length+S.people.length>0){
          toast('💡 ثبّت ملف نسخة احتياطية من الإعدادات','warning',5000);
        }
      },3000);
    }

    // دعم URL hash
    checkUrlHash();
    window.addEventListener('hashchange',checkUrlHash);
  }catch(e){
    console.error(e);
    toast('خطأ في التحميل: '+e.message,'error',5000);
  }
  go('pg-home');
}
document.addEventListener('DOMContentLoaded',init);
</script>
