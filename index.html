<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الجمعية - الأعضاء</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: #95a5a6; }
        .btn-success { background: #27ae60; }
        .btn-warning { background: #f39c12; }
        .btn-danger { background: #e74c3c; }
        .btn-info { background: #3498db; }
        .btn-small { width: auto; padding: 8px 15px; font-size: 14px; margin: 5px; display: inline-block; }
        .error { background: #fee; color: #c33; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .success { background: #efe; color: #3a3; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .loading { text-align: center; color: #667eea; margin: 15px 0; display: none; }
        .member-card { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-right: 4px solid #667eea; }
        .member-card h4 { color: #2c3e50; margin-bottom: 5px; }
        .member-card p { color: #7f8c8d; font-size: 13px; margin: 3px 0; }
        .member-actions { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-right: 5px; }
        .badge-active { background: #d4edda; color: #155724; }
        .badge-young { background: #d1ecf1; color: #0c5460; }
        .badge-senior { background: #fff3cd; color: #856404; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-modal { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        .search-box { margin-bottom: 20px; }
        .filter-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-row select, .filter-row input { flex: 1; min-width: 150px; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: #e3f2fd; padding: 15px; border-radius: 10px; text-align: center; }
        .stat-box h4 { font-size: 24px; color: #1976d2; }
        .stat-box p { font-size: 12px; color: #666; }
        .whatsapp-btn { background: #25D366; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; margin-right: 5px; }
        .import-section { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 2px dashed #667eea; }
        .export-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .export-buttons button { flex: 1; min-width: 150px; }
        #loginScreen, #dashboard, #membersSection { display: none; }
        #loginScreen.active, #dashboard.active, #membersSection.active { display: block; }
    </style>
</head>
<body>

<div class="container">
    <!-- تسجيل الدخول -->
    <div id="loginScreen" class="active">
        <h1>🏛️ نظام إدارة الجمعية</h1>
        <p class="subtitle">تسجيل دخول المستخدمين</p>
        <div class="error" id="errorMsg"></div>
        <div class="input-group">
            <label>البريد الإلكتروني:</label>
            <input type="email" id="email" placeholder="example@email.com">
        </div>
        <div class="input-group">
            <label>كلمة المرور:</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn" onclick="doLogin()">تسجيل الدخول</button>
        <div class="loading" id="loading">جاري تسجيل الدخول...</div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboard">
        <h1>مرحباً، <span id="userName"></span></h1>
        <p class="subtitle">👑 مدير عام</p>
        
        <button class="btn" onclick="showMembers()">👥 إدارة الأعضاء</button>
        <button class="btn btn-secondary" onclick="doLogout()" style="margin-top: 10px;">تسجيل الخروج</button>
    </div>

    <!-- قسم الأعضاء -->
    <div id="membersSection">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>👥 إدارة الأعضاء</h2>
            <button class="btn btn-secondary btn-small" onclick="showDashboard()">← رجوع</button>
        </div>
        
        <!-- إحصائيات سريعة -->
        <div class="stats-row">
            <div class="stat-box"><h4 id="totalCount">0</h4><p>إجمالي الأعضاء</p></div>
            <div class="stat-box"><h4 id="youngCount">0</h4><p>أعضاء شباب</p></div>
            <div class="stat-box"><h4 id="seniorCount">0</h4><p>كبار السن</p></div>
            <div class="stat-box"><h4 id="activeCount">0</h4><p>نشطين</p></div>
        </div>

        <!-- استيراد/تصدير -->
        <div class="import-section no-print">
            <h3>📥 استيراد وتصدير البيانات</h3>
            <div class="form-row">
                <div>
                    <label>استيراد من Excel:</label>
                    <input type="file" id="importFile" accept=".xlsx,.xls" onchange="handleImport(event)">
                    <small style="color: #666;">📋 حمّل ملف Excel لاستيراد الأعضاء</small>
                </div>
                <div>
                    <label>تصدير البيانات:</label>
                    <div class="export-buttons">
                        <button class="btn btn-info btn-small" onclick="exportToExcel()">📊 Excel الكل</button>
                        <button class="btn btn-warning btn-small" onclick="exportFilteredMembers()"> Excel النشطين فقط</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="filter-row no-print">
            <input type="text" id="searchInput" placeholder=" ابحث بالاسم أو الكود أو الهاتف..." oninput="searchMembers()">
        </div>
        
        <div class="filter-row no-print">
            <select id="filterSector" onchange="filterMembers()">
                <option value="">كل القطاعات</option>
                <option value="الحارة 1">الحارة 1</option>
                <option value="الحارة 2">الحارة 2</option>
                <option value="الوادي">الوادي</option>
                <option value="المنصورة">المنصورة</option>
                <option value="الجبل">الجبل</option>
                <option value="دمر">دمر</option>
            </select>
            <select id="filterType" onchange="filterMembers()">
                <option value="">كل الأنواع</option>
                <option value="young">شاب (أقل من 30)</option>
                <option value="senior">كبير (فوق 60)</option>
                <option value="normal">عادي</option>
            </select>
            <select id="filterStatus" onchange="filterMembers()">
                <option value="">كل الحالات</option>
                <option value="active">نشط</option>
                <option value="exempt">معفي</option>
                <option value="suspended">متوقف</option>
            </select>
        </div>
        
        <div class="export-buttons no-print">
            <button class="btn btn-success" onclick="openAddMemberModal()">+ إضافة عضو جديد</button>
            <button class="btn btn-info" onclick="sendWhatsAppBulk()"> واتساب جماعي</button>
        </div>
        
        <div id="membersList" style="margin-top: 20px;"></div>
    </div>
</div>

<!-- نافذة إضافة/تعديل عضو -->
<div id="memberModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">إضافة عضو جديد</h3>
            <button class="close-modal" onclick="closeMemberModal()">×</button>
        </div>
        <form id="memberForm" onsubmit="saveMember(event)">
            <input type="hidden" id="memberId">
            
            <div class="form-row">
                <div class="input-group">
                    <label>كود الأسرة *</label>
                    <input type="text" id="familyCode" required placeholder="A001">
                </div>
                <div class="input-group">
                    <label>كود الفرد *</label>
                    <input type="text" id="memberCode" required placeholder="F001">
                </div>
            </div>
            
            <div class="input-group">
                <label>الاسم الثلاثي *</label>
                <input type="text" id="memberName" required placeholder="الاسم الكامل">
            </div>
            
            <div class="form-row">
                <div class="input-group">
                    <label>تاريخ الميلاد</label>
                    <input type="date" id="birthDate" onchange="calculateAge()">
                </div>
                <div class="input-group">
                    <label>العمر (يُحسب تلقائياً)</label>
                    <input type="number" id="memberAge" readonly placeholder="0">
                </div>
            </div>
            
            <div class="form-row">
                <div class="input-group">
                    <label>نوع العضو</label>
                    <select id="memberType">
                        <option value="normal">عادي</option>
                        <option value="young">شاب (أقل من 30)</option>
                        <option value="senior">كبير السن (فوق 60)</option>
                        <option value="disabled">معاق</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>صلة القرابة</label>
                    <select id="relation">
                        <option value="رب أسرة">رب أسرة</option>
                        <option value="زوجة">زوجة</option>
                        <option value="ابن">ابن</option>
                        <option value="بنت">بنت</option>
                    </select>
                </div>
            </div>
            
            <div class="input-group">
                <label>القطاع</label>
                <select id="memberSector">
                    <option value="الحارة 1">الحارة 1</option>
                    <option value="الحارة 2">الحارة 2</option>
                    <option value="الوادي">الوادي</option>
                    <option value="المنصورة">المنصورة</option>
                    <option value="الجبل">الجبل</option>
                    <option value="دمر">دمر</option>
                </select>
            </div>
            
            <div class="form-row">
                <div class="input-group">
                    <label>رقم الجوال</label>
                    <input type="tel" id="memberPhone" placeholder="09xxxxxxxx">
                </div>
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="memberEmail" placeholder="email@example.com">
                </div>

            <div class="input-group">
                <label>العنوان التفصيلي</label>
                <textarea id="memberAddress" rows="2" placeholder="العنوان الكامل"></textarea>
            </div>
            
            <div class="form-row">
                <div class="input-group">
                    <label>المهنة</label>
                    <input type="text" id="memberJob" placeholder="المهنة">
                </div>
                <div class="input-group">
                    <label>تاريخ الانضمام</label>
                    <input type="date" id="joinDate">
                </div>

            <div class="input-group">
                <label>نوع الاشتراك:</label>
                <div style="display: flex; gap: 15px; margin: 10px 0;">
                    <label><input type="checkbox" id="subAssociation"> جمعية</label>
                    <label><input type="checkbox" id="subDeath"> وفاة</label>
                </div>
            </div>

                <div class="input-group">
                    <label>تاريخ اشتراك الجمعية</label>
                    <input type="date" id="associationDate">
                </div>
                <div class="input-group">
                    <label>تاريخ اشتراك الوفاة</label>
                    <input type="date" id="deathDate">
                </div>
            </div>
            
            <div class="input-group">
                <label>حالة العضو:</label>
                <select id="memberStatus">
                    <option value="active">نشط</option>
                    <option value="exempt">معفي</option>
                    <option value="suspended">متوقف</option>
                    <option value="withdrawn">منسحب</option>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBwBOJjthFdSc7jv0dGL325kcaNqzD9dII",
    authDomain: "jam3iyati-b7528.firebaseapp.com",
    projectId: "jam3iyati-b7528",
    storageBucket: "jam3iyati-b7528.firebasestorage.app",
    messagingSenderId: "499100272911",
    appId: "1:499100272911:web:5bda121dbffa085770567a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let currentUser = null;
let allMembers = [];

auth.onAuthStateChanged(user => {
    if (user) { currentUser = user; showDashboard(); }
    else { showLogin(); }
});

function showLogin() {
    document.getElementById('loginScreen').classList.add('active');
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('membersSection').classList.remove('active');
}

function showDashboard() {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('membersSection').classList.remove('active');
    document.getElementById('dashboard').classList.add('active');
    if (currentUser) document.getElementById('userName').textContent = currentUser.email.split('@')[0];
}

function showMembers() {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('membersSection').classList.add('active');
    loadMembers();
}

function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const loading = document.getElementById('loading');
    
    if (!email || !password) {
        errorMsg.textContent = '⚠️ أدخل البريد وكلمة المرور';
        errorMsg.style.display = 'block';
        return;
    }
    
    loading.style.display = 'block';
    auth.signInWithEmailAndPassword(email, password)
        .then(() => { loading.style.display = 'none'; })
        .catch(error => {
            errorMsg.textContent = '❌ خطأ: ' + error.message;
            errorMsg.style.display = 'block';
            loading.style.display = 'none';
        });
}

function doLogout() { auth.signOut(); }

// حساب العمر تلقائياً
function calculateAge() {
    const birthDate = document.getElementById('birthDate').value;
    if (!birthDate) return;
    
    const today = new Date();
    const birth = new Date(birthDate);
    let age = today.getFullYear() - birth.getFullYear();
    const monthDiff = today.getMonth() - birth.getMonth();
    
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
        age--;
    }
    
    document.getElementById('memberAge').value = age;
    
    if (age < 30) document.getElementById('memberType').value = 'young';
    else if (age > 60) document.getElementById('memberType').value = 'senior';
    else document.getElementById('memberType').value = 'normal';
}

// === استيراد من Excel (مطابق للشيت الفعلي) ===
function handleImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
            
            // قراءة رؤوس الأعمدة
            const headers = jsonData[0];
            console.log('رؤوس الأعمدة:', headers);
            
            // البحث عن أرقام الأعمدة تلقائياً
            const colIndex = {
                memberCode: headers.findIndex(h => h && h.toString().includes('رقم') && h.toString().includes('الفرد')),
                familyCode: headers.findIndex(h => h && h.toString().includes('كود') && h.toString().includes('الأسرة')),
                name: headers.findIndex(h => h && h.toString().includes('الاسم') && h.toString().includes('الثلاثي')),
                status: headers.findIndex(h => h && h.toString().includes('حالة') && h.toString().includes('العضو')),
                relation: headers.findIndex(h => h && h.toString().includes('صلة') && h.toString().includes('القرابة')),
                gender: headers.findIndex(h => h && h.toString().includes('الجنس')),
                sector: headers.findIndex(h => h && h.toString().includes('القطاع')),
                birthDate: headers.findIndex(h => h && h.toString().includes('تاريخ') && h.toString().includes('الميلاد')),
                age: headers.findIndex(h => h && h.toString().includes('العمر')),
                subscriptionType: headers.findIndex(h => h && h.toString().includes('نوع') && h.toString().includes('الاشتراك')),
                joinDate: headers.findIndex(h => h && h.toString().includes('تاريخ') && h.toString().includes('الاشتراك')),
                phone: headers.findIndex(h => h && h.toString().includes('الجوال')),
                notes: headers.findIndex(h => h && h.toString().includes('ملاحظات'))
            };
            
            console.log('أرقام الأعمدة:', colIndex);
            
            const membersData = jsonData.slice(1);
            let imported = 0;
            let errors = 0;
            
            membersData.forEach((row, index) => {
                if (!row[colIndex.memberCode] || !row[colIndex.familyCode] || !row[colIndex.name]) {
                    errors++;
                    return;
                }
                
                // قراءة حالة_العضو من العمود الصحيح
                const memberStatusRaw = row[colIndex.status] || 'نشط';
                let memberStatus = 'active'; // القيمة الافتراضية
                
                // تحويل الحالة من العربية إلى الإنجليزية
                if (memberStatusRaw === 'نشط') memberStatus = 'active';
                else if (memberStatusRaw === 'معفي') memberStatus = 'exempt';
                else if (memberStatusRaw === 'متوقف') memberStatus = 'suspended';
                else if (memberStatusRaw === 'منسحب') memberStatus = 'withdrawn';
                else if (memberStatusRaw === 'متوفي') memberStatus = 'deceased';
                
                // قراءة نوع الاشتراك
                const subTypeRaw = row[colIndex.subscriptionType] || '';
                let hasAssociation = false;
                let hasDeath = false;
                
                if (subTypeRaw.includes('جمعية') || subTypeRaw.includes('كلاهما')) hasAssociation = true;
                if (subTypeRaw.includes('وفاة') || subTypeRaw.includes('كلاهما')) hasDeath = true;
                
                // قراءة القطاع
                const sectorRaw = row[colIndex.sector] || '';
                let sectorMapped = sectorRaw;
                
                // تحويل أسماء القطاعات إذا لزم الأمر
                if (sectorRaw.includes('الحارة') || sectorRaw.includes('حارة')) {
                    if (sectorRaw.includes('1')) sectorMapped = 'الحارة 1';
                    else if (sectorRaw.includes('2')) sectorMapped = 'الحارة 2';
                }
                
                const memberData = {
                    familyCode: row[colIndex.familyCode] || '',
                    memberCode: row[colIndex.memberCode] || '',
                    name: row[colIndex.name] || '',
                    relation: row[colIndex.relation] || 'رب أسرة',
                    gender: row[colIndex.gender] || '',
                    sector: sectorMapped,
                    phone: row[colIndex.phone] || '',
                    birthDate: row[colIndex.birthDate] ? formatDate(row[colIndex.birthDate]) : '',
                    memberAge: row[colIndex.age] || 0,
                    memberType: 'normal',
                    job: '',
                    address: '',
                    joinDate: row[colIndex.joinDate] ? formatDate(row[colIndex.joinDate]) : new Date().toISOString().split('T')[0],
                    hasAssociation: hasAssociation,
                    hasDeath: hasDeath,
                    associationDate: '',
                    deathDate: '',
                    status: memberStatus,
                    notes: row[colIndex.notes] || '',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                
                db.collection('members').add(memberData)
                    .then(() => { imported++; })
                    .catch((err) => { 
                        console.error('خطأ في الصف', index + 2, err);
                        errors++; 
                    });
            });
            
            setTimeout(() => {
                alert(`✅ تم استيراد ${imported} عضو\n❌ أخطاء: ${errors}`);
                loadMembers();
            }, 3000);
            
        } catch (error) {
            alert('❌ خطأ في قراءة الملف: ' + error.message);
            console.error('Error:', error);
        }
    };
    reader.readAsArrayBuffer(file);
}

// === تحويل التاريخ من Excel ===
function formatDate(dateValue) {
    if (!dateValue) return '';
    
    // إذا كان النص
    if (typeof dateValue === 'string') {
        // محاولة تحليل التاريخ
        const parts = dateValue.split('/');
        if (parts.length === 3) {
            // DD/MM/YYYY
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }
        return dateValue;
    }
    
    // إذا كان رقم (تاريخ Excel)
    if (typeof dateValue === 'number') {
        const date = new Date(Math.round((dateValue - 25569) * 86400 * 1000));
        return date.toISOString().split('T')[0];
    }
    
    return '';
}

// === تصدير إلى Excel (الكل) ===
function exportToExcel() {
    const data = allMembers.map(m => ({
        'كود الأسرة': m.familyCode,
        'كود الفرد': m.memberCode,
        'الاسم': m.name,
        'صلة القرابة': m.relation,
        'القطاع': m.sector,
        'الهاتف': m.phone,
        'البريد': m.email,
        'تاريخ الميلاد': m.birthDate,
        'العمر': m.memberAge,
        'النوع': m.memberType,
        'المهنة': m.job,
        'العنوان': m.address,
        'تاريخ الانضمام': m.joinDate,
        'اشتراك جمعية': m.hasAssociation ? 'نعم' : 'لا',
        'اشتراك وفاة': m.hasDeath ? 'نعم' : 'لا',
        'تاريخ اشتراك جمعية': m.associationDate,
        'تاريخ اشتراك وفاة': m.deathDate,
        'حالة_العضو': { 'active': 'نشط', 'exempt': 'معفي', 'suspended': 'متوقف', 'withdrawn': 'منسحب', 'deceased': 'متوفي' }[m.status] || m.status,
        'ملاحظات': m.notes
    }));
    
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'الأعضاء');
    XLSX.writeFile(wb, `أعضاء_الجمعية_${new Date().toISOString().split('T')[0]}.xlsx`);
}

// === تصدير Excel للنشطين فقط (الفلتر) ===
function exportFilteredMembers() {
    // الفلتر: حالة_العضو لا تساوي فراغ
    const filteredMembers = allMembers.filter(m => m.status && m.status.trim() !== '');
    
    if (filteredMembers.length === 0) {
        alert('لا يوجد أعضاء نشطين للتصدير');
        return;
    }
    
    const exportData = filteredMembers.map(m => ({
        'كود الأسرة': m.familyCode,
        'كود الفرد': m.memberCode,
        'الاسم الثلاثي': m.name,
        'صلة القرابة': m.relation || '',
        'القطاع': m.sector || '',
        'رقم الجوال': m.phone || '',
        'البريد الإلكتروني': m.email || '',
        'تاريخ الميلاد': m.birthDate || '',
        'العمر': m.memberAge || '',
        'نوع العضو': { 'young': 'شاب', 'senior': 'كبير', 'normal': 'عادي', 'disabled': 'معاق' }[m.memberType] || 'عادي',
        'المهنة': m.job || '',
        'العنوان': m.address || '',
        'تاريخ الانضمام': m.joinDate || '',
        'مشترك جمعية': m.hasAssociation ? 'نعم' : 'لا',
        'مشترك وفاة': m.hasDeath ? 'نعم' : 'لا',
        'تاريخ اشتراك جمعية': m.associationDate || '',
        'تاريخ اشتراك وفاة': m.deathDate || '',
        'حالة_العضو': { 'active': 'نشط', 'exempt': 'معفي', 'suspended': 'متوقف', 'withdrawn': 'منسحب', 'deceased': 'متوفي' }[m.status] || m.status,
        'ملاحظات': m.notes || ''
    }));
    
    const ws = XLSX.utils.json_to_sheet(exportData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'الأعضاء النشطين');
    XLSX.writeFile(wb, `الأعضاء_النشطين_${new Date().toISOString().split('T')[0]}.xlsx`);
    
    alert(`✅ تم تصدير ${filteredMembers.length} عضو نشط إلى Excel`);
}

// === واتساب جماعي ===
function sendWhatsAppBulk() {
    const message = prompt('أدخل الرسالة الموحدة:', 'مرحباً،\n\nهذه رسالة من نظام إدارة الجمعية.\n\nشكراً لتعاونكم');
    if (!message) return;
    
    const phones = allMembers.filter(m => m.phone && m.status === 'active').map(m => m.phone);
    
    if (phones.length === 0) {
        alert('لا يوجد أعضاء نشطين لديهم أرقام هواتف');
        return;
    }
    
    let count = 0;
    phones.forEach((phone, index) => {
        setTimeout(() => {
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
            count++;
            if (count === phones.length) {
                alert(`✅ تم فتح ${count} محادثة واتساب`);
            }
        }, index * 2000);
    });
}

// === بقية الدوال ===

function loadMembers() {
    const container = document.getElementById('membersList');
    container.innerHTML = '<div class="loading" style="display:block;">جاري تحميل الأعضاء...</div>';
    
    db.collection('members').get()
        .then(snapshot => {
            allMembers = [];
            snapshot.forEach(doc => {
                allMembers.push({ id: doc.id, ...doc.data() });
            });
            
            allMembers.sort((a, b) => {
                const codeA = (a.familyCode || '') + (a.memberCode || '');
                const codeB = (b.familyCode || '') + (b.memberCode || '');
                return codeA.localeCompare(codeB);
            });
            
            updateStats();
            displayMembers(allMembers);
        })
        .catch(error => {
            console.error('Error:', error);
            container.innerHTML = '<p style="text-align:center;color:#e74c3c;">خطأ: ' + error.message + '</p>';
        });
}

function updateStats() {
    const today = new Date();
    let youngCount = 0, seniorCount = 0, activeCount = 0;
    
    allMembers.forEach(m => {
        if (m.status === 'active') activeCount++;
        
        if (m.birthDate) {
            const birth = new Date(m.birthDate);
            const age = today.getFullYear() - birth.getFullYear();
            if (age < 30) youngCount++;
            else if (age > 60) seniorCount++;
        } else if (m.memberType === 'young') youngCount++;
        else if (m.memberType === 'senior') seniorCount++;
    });
    
    document.getElementById('totalCount').textContent = allMembers.length;
    document.getElementById('youngCount').textContent = youngCount;
    document.getElementById('seniorCount').textContent = seniorCount;
    document.getElementById('activeCount').textContent = activeCount;
}

function displayMembers(members) {
    const container = document.getElementById('membersList');
    
    if (members.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">لا يوجد أعضاء</p>';
        return;
    }
    
    let html = '';
    members.forEach(m => {
        const fullCode = `${m.familyCode}-${m.memberCode}`;
        const subText = (m.hasAssociation && m.hasDeath) ? 'مزدوج' : 
                       (m.hasAssociation ? 'جمعية' : 
                       (m.hasDeath ? 'وفاة' : 'غير مشترك'));
        
        const statusText = {
            'active': 'نشط',
            'exempt': 'معفي',
            'suspended': 'متوقف',
            'withdrawn': 'منسحب',
            'deceased': 'متوفي'
        }[m.status] || m.status;
        
        const typeBadge = m.memberType === 'young' ? '<span class="badge badge-young">شاب</span>' : 
                         m.memberType === 'senior' ? '<span class="badge badge-senior">كبير</span>' : '';
        
        html += `
            <div class="member-card">
                <h4>${m.name} ${typeBadge} <span class="badge badge-active">${statusText}</span></h4>
                <p> <strong>${fullCode}</strong> | 🏢 ${m.sector || '-'} |  ${m.memberAge || '-'} سنة</p>
                <p>📱 ${m.phone || '-'} ${m.phone ? `<button class="whatsapp-btn" onclick="sendWhatsApp('${m.phone}', '${m.name}')">واتساب</button>` : ''}</p>
                <p> الاشتراك: ${subText} |  الانضمام: ${m.joinDate || '-'}</p>
                ${m.notes ? `<p>📝 ${m.notes}</p>` : ''}
                <div class="member-actions">
                    <button class="btn btn-info btn-small" onclick="viewMember('${m.id}')">عرض</button>
                    <button class="btn btn-warning btn-small" onclick="editMember('${m.id}')">️ تعديل</button>
                    <button class="btn btn-danger btn-small" onclick="deleteMember('${m.id}')">🗑️ حذف</button>
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
}

function searchMembers() {
    const term = document.getElementById('searchInput').value.toLowerCase().trim();
    if (!term) { displayMembers(allMembers); return; }
    
    const filtered = allMembers.filter(m => {
        const fullCode = `${m.familyCode}-${m.memberCode}`.toLowerCase();
        return m.name.toLowerCase().includes(term) || 
               fullCode.includes(term) ||
               (m.phone && m.phone.includes(term)) ||
               (m.email && m.email.toLowerCase().includes(term));
    });
    
    displayMembers(filtered);
}

function filterMembers() {
    const sector = document.getElementById('filterSector').value;
    const type = document.getElementById('filterType').value;
    const status = document.getElementById('filterStatus').value;
    
    let filtered = allMembers;
    if (sector) filtered = filtered.filter(m => m.sector === sector);
    if (type) filtered = filtered.filter(m => m.memberType === type);
    if (status) filtered = filtered.filter(m => m.status === status);
    
    displayMembers(filtered);
}

function sendWhatsApp(phone, name) {
    const message = `مرحباً ${name}،\n\nهذه رسالة من نظام إدارة الجمعية.\n\nمع خالص التحية`;
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
}

function openAddMemberModal() {
    document.getElementById('modalTitle').textContent = 'إضافة عضو جديد';
    document.getElementById('memberForm').reset();
    document.getElementById('memberId').value = '';
    document.getElementById('joinDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('memberModal').classList.add('active');
}

function closeMemberModal() {
    document.getElementById('memberModal').classList.remove('active');
}

function saveMember(event) {
    event.preventDefault();
    
    const memberId = document.getElementById('memberId').value;
    const memberData = {
        familyCode: document.getElementById('familyCode').value,
        memberCode: document.getElementById('memberCode').value,
        name: document.getElementById('memberName').value,
        birthDate: document.getElementById('birthDate').value,
        memberAge: parseInt(document.getElementById('memberAge').value) || 0,
        memberType: document.getElementById('memberType').value,
        relation: document.getElementById('relation').value,
        sector: document.getElementById('memberSector').value,
        phone: document.getElementById('memberPhone').value,
        email: document.getElementById('memberEmail').value,
        address: document.getElementById('memberAddress').value,
        job: document.getElementById('memberJob').value,
        joinDate: document.getElementById('joinDate').value,
        hasAssociation: document.getElementById('subAssociation').checked,
        hasDeath: document.getElementById('subDeath').checked,
        associationDate: document.getElementById('associationDate').value,
        deathDate: document.getElementById('deathDate').value,
        status: document.getElementById('memberStatus').value,
        notes: document.getElementById('memberNotes').value,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    if (memberId) {
        db.collection('members').doc(memberId).update(memberData)
            .then(() => {
                alert('✅ تم تعديل العضو بنجاح');
                closeMemberModal();
                loadMembers();
            })
            .catch(error => {
                console.error('Error:', error);
                alert(' خطأ: ' + error.message);
            });
    } else {
        memberData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        db.collection('members').add(memberData)
            .then(() => {
                alert('✅ تم إضافة العضو بنجاح');
                closeMemberModal();
                loadMembers();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('❌ خطأ: ' + error.message);
            });
    }
}

function viewMember(memberId) {
    db.collection('members').doc(memberId).get()
        .then(doc => {
            if (doc.exists) {
                const m = doc.data();
                const fullCode = `${m.familyCode}-${m.memberCode}`;
                alert(`
الاسم: ${m.name}
الكود: ${fullCode}
تاريخ الميلاد: ${m.birthDate || '-'}
العمر: ${m.memberAge || '-'} سنة
النوع: ${m.memberType || 'عادي'}
القطاع: ${m.sector || '-'}
الهاتف: ${m.phone || '-'}
البريد: ${m.email || '-'}
العنوان: ${m.address || '-'}
المهنة: ${m.job || '-'}
تاريخ الانضمام: ${m.joinDate || '-'}
الاشتراك: ${(m.hasAssociation ? 'جمعية ' : '') + (m.hasDeath ? 'وفاة' : '') || 'غير مشترك'}
الحالة: ${m.status}
ملاحظات: ${m.notes || '-'}
                `);
            }
        });
}

function editMember(memberId) {
    db.collection('members').doc(memberId).get()
        .then(doc => {
            if (doc.exists) {
                const m = doc.data();
                document.getElementById('modalTitle').textContent = 'تعديل عضو';
                document.getElementById('memberId').value = memberId;
                document.getElementById('familyCode').value = m.familyCode || '';
                document.getElementById('memberCode').value = m.memberCode || '';
                document.getElementById('memberName').value = m.name || '';
                document.getElementById('birthDate').value = m.birthDate || '';
                document.getElementById('memberAge').value = m.memberAge || '';
                document.getElementById('memberType').value = m.memberType || 'normal';
                document.getElementById('relation').value = m.relation || 'رب أسرة';
                document.getElementById('memberSector').value = m.sector || 'الحارة 1';
                document.getElementById('memberPhone').value = m.phone || '';
                document.getElementById('memberEmail').value = m.email || '';
                document.getElementById('memberAddress').value = m.address || '';
                document.getElementById('memberJob').value = m.job || '';
                document.getElementById('joinDate').value = m.joinDate || '';
                document.getElementById('subAssociation').checked = m.hasAssociation || false;
                document.getElementById('subDeath').checked = m.hasDeath || false;
                document.getElementById('associationDate').value = m.associationDate || '';
                document.getElementById('deathDate').value = m.deathDate || '';
                document.getElementById('memberStatus').value = m.status || 'active';
                document.getElementById('memberNotes').value = m.notes || '';
                document.getElementById('memberModal').classList.add('active');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('❌ خطأ: ' + error.message);
        });
}

function deleteMember(memberId) {
    if (confirm('هل أنت متأكد من حذف هذا العضو؟')) {
        db.collection('members').doc(memberId).delete()
            .then(() => {
                alert('✅ تم الحذف');
                loadMembers();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('❌ خطأ: ' + error.message);
            });
    }
}

document.querySelectorAll('.modal').forEach(modal => {
    modal.addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });
});
