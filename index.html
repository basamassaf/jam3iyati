<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d7377">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>زعورة v7.1 — إدارة المقبرة والعائلات</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#0d7377; --primary-2:#0f766e; --primary-soft:#ecfeff;
  --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --danger:#dc2626; --success:#16a34a;
  --warning:#f59e0b; --info:#2563eb;
  --radius:16px; --radius-sm:12px;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow:0 8px 24px rgba(15,23,42,.08);
  --safe:env(safe-area-inset-bottom,0);
}
[data-theme="dark"]{
  --bg:#0b1220; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
  --border:#334155; --primary-soft:#0f2e2e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  background:var(--bg);color:var(--text);direction:rtl;font-size:15px;line-height:1.5;
  min-height:100vh;padding-bottom:calc(78px + var(--safe));
  transition:background .2s,color .2s;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{outline:0}

/* HEADER */
.app-header{
  position:sticky;top:0;z-index:30;
  background:var(--card);border-bottom:1px solid var(--border);
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0));
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow-sm);
}
.app-header .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.app-header .logo{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;flex-shrink:0;
}
.app-header h1{font-size:15px;font-weight:800;line-height:1.1}
.app-header .sub{font-size:10px;color:var(--muted);font-weight:600}
.icon-btn{
  width:38px;height:38px;border-radius:12px;
  background:var(--bg);color:var(--text);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:.15s;flex-shrink:0;
}
.icon-btn:active{transform:scale(.92)}

/* SEARCH */
.search-wrap{padding:10px 12px 0;max-width:820px;margin:0 auto}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:10px 14px;box-shadow:var(--shadow-sm);
}
.search-box .ico{color:var(--muted);font-size:17px}
.search-box input{flex:1;background:none;border:0;font-size:15px;min-width:0}
.search-box .clear{color:var(--muted);font-size:18px;padding:4px}

/* MAIN */
main{max-width:820px;margin:0 auto;padding:12px}
.page{display:none;animation:fade .2s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* CARDS */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:12px;
  box-shadow:var(--shadow-sm);
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:12px;
}
.card-head h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}

/* STATS */
.stats-scroll{
  display:flex;gap:10px;overflow-x:auto;
  margin:0 -12px 14px;padding:0 12px 6px;
  scroll-snap-type:x mandatory;scrollbar-width:none;
}
.stats-scroll::-webkit-scrollbar{display:none}
.stat{
  flex:0 0 auto;min-width:120px;scroll-snap-align:start;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.stat::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--primary)}
.stat.green::before{background:var(--success)}
.stat.red::before{background:var(--danger)}
.stat.orange::before{background:var(--warning)}
.stat.blue::before{background:var(--info)}
.stat .val{font-size:24px;font-weight:800;line-height:1.1;color:var(--primary)}
.stat.green .val{color:var(--success)}
.stat.red .val{color:var(--danger)}
.stat.orange .val{color:var(--warning)}
.stat.blue .val{color:var(--info)}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}

/* LIST */
.list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.item{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:.15s;min-height:64px;
}
.item:last-child{border-bottom:0}
.item:active{background:var(--bg)}
.item .av{
  width:46px;height:46px;border-radius:13px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;background:var(--primary-soft);color:var(--primary);font-weight:800;
}
.item .av.green{background:#dcfce7;color:#166534}
.item .av.red{background:#fee2e2;color:#991b1b}
.item .av.orange{background:#fef3c7;color:#92400e}
.item .av.blue{background:#dbeafe;color:#1e40af}
.item .body{flex:1;min-width:0}
.item .ttl{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .trail{color:var(--muted);font-size:20px;font-weight:300;flex-shrink:0}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap}
.badge.success{background:#dcfce7;color:#166534}
.badge.danger{background:#fee2e2;color:#991b1b}
.badge.warning{background:#fef3c7;color:#92400e}
.badge.info{background:#dbeafe;color:#1e40af}
.badge.muted{background:#f1f5f9;color:#475569}

/* CHIPS */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:7px 14px;border-radius:20px;
  background:var(--card);border:1px solid var(--border);
  font-size:12px;font-weight:700;color:var(--muted);transition:.15s;
}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:6px;padding:11px 18px;border-radius:13px;
  font-size:14px;font-weight:700;transition:.15s;min-height:44px;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff}
.btn.success{background:var(--success);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.warning{background:var(--warning);color:#fff}
.btn.info{background:var(--info);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:12px;border-radius:10px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

/* FAB */
.fab{
  position:fixed;bottom:calc(88px + var(--safe));left:18px;
  width:56px;height:56px;border-radius:18px;
  background:var(--primary);color:#fff;
  font-size:26px;font-weight:300;
  box-shadow:0 10px 28px rgba(13,115,119,.4);
  z-index:25;display:flex;align-items:center;justify-content:center;
  transition:.15s;
}
.fab:active{transform:scale(.92)}

/* BOTTOM NAV */
.bnav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--card);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:6px 6px calc(6px + var(--safe));
  box-shadow:0 -4px 20px rgba(15,23,42,.05);
}
.bnav button{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:6px 2px;border-radius:12px;
  color:var(--muted);font-size:10px;font-weight:700;
  transition:.15s;position:relative;min-width:0;
}
.bnav button .i{font-size:22px;line-height:1;transition:.15s}
.bnav button.on{color:var(--primary)}
.bnav button.on .i{transform:scale(1.1)}
.bnav button .nb{
  position:absolute;top:3px;right:calc(50% - 18px);
  background:var(--danger);color:#fff;border-radius:10px;
  padding:0 5px;font-size:9px;font-weight:700;
  min-width:16px;text-align:center;line-height:16px;height:16px;
}

/* SHEET */
.sheet-back{
  position:fixed;inset:0;background:rgba(15,23,42,.55);
  z-index:90;opacity:0;pointer-events:none;transition:.2s;
  backdrop-filter:blur(3px);
}
.sheet-back.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:91;
  background:var(--card);border-radius:24px 24px 0 0;
  max-height:94vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding-bottom:calc(16px + var(--safe));
  box-shadow:0 -20px 60px rgba(15,23,42,.2);
}
.sheet.on{transform:translateY(0)}
.sheet-grip{width:44px;height:5px;background:var(--border);border-radius:3px;margin:12px auto 0}
.sheet-hd{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--card);z-index:2;
  border-radius:24px 24px 0 0;
}
.sheet-hd h2{font-size:16px;font-weight:800}
.sheet-bd{padding:16px 18px}
.sheet-ft{
  display:flex;gap:10px;padding:12px 18px;
  border-top:1px solid var(--border);
  position:sticky;bottom:0;background:var(--card);
}
.sheet-ft .btn{flex:1}

/* FORM */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld label .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{
  width:100%;padding:12px 14px;
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:12px;font-size:15px;transition:.15s;font-family:inherit;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  border-color:var(--primary);background:var(--card);
  box-shadow:0 0 0 3px rgba(13,115,119,.12);
}
.fld textarea{resize:vertical;min-height:70px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld-row.three{grid-template-columns:1fr 1fr 1fr}
.fld-hint{font-size:11px;color:var(--muted);margin-top:4px}
.fld-readonly{background:var(--primary-soft)!important;color:var(--primary);font-weight:700}

/* EMPTY */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ico{font-size:52px;opacity:.4;display:block;margin-bottom:10px}
.empty h3{font-size:15px;font-weight:700;margin-bottom:4px}
.empty p{font-size:12px}

/* TOAST */
.toasts{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:9999;display:flex;flex-direction:column;gap:8px;
  pointer-events:none;width:calc(100% - 28px);max-width:400px;
}
.toast{
  background:var(--text);color:var(--card);
  padding:12px 18px;border-radius:14px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow);
  animation:slideDown .25s ease;pointer-events:auto;
}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--danger);color:#fff}
.toast.warning{background:var(--warning);color:#fff}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* LOADER */
.loader{
  position:fixed;inset:0;background:rgba(15,23,42,.4);
  backdrop-filter:blur(3px);z-index:9998;
  display:none;align-items:center;justify-content:center;
}
.loader.on{display:flex}
.spin{
  width:38px;height:38px;border:3px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* VIEW TOGGLE */
.view-toggle{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.view-toggle button{padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;color:var(--muted);transition:.15s}
.view-toggle button.on{background:var(--card);color:var(--primary);box-shadow:var(--shadow-sm)}

/* GRID VIEW */
.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.gcell{
  background:var(--card);border:2px solid var(--border);
  border-radius:10px;padding:8px 6px;text-align:center;
  cursor:pointer;transition:.15s;
}
.gcell:active{transform:scale(.95)}
.gcell .n{font-weight:800;font-size:14px;color:var(--text)}
.gcell .o{font-size:9px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcell.occupied{border-color:var(--danger);background:#fef2f2}
.gcell.occupied .n{color:var(--danger)}
.gcell.available{border-color:var(--success);background:#f0fdf4}
.gcell.available .n{color:var(--success)}
.gcell.reuse{border-color:var(--warning);background:#fffbeb}
.gcell.reuse .n{color:var(--warning)}

/* IMPORT */
.import-box{
  background:var(--bg);border:2px dashed var(--border);
  border-radius:14px;padding:18px;text-align:center;
  transition:.15s;cursor:pointer;
}
.import-box:active{transform:scale(.98);border-color:var(--primary)}
.import-box.dragover{border-color:var(--primary);background:var(--primary-soft)}
.import-box .i{font-size:32px;margin-bottom:6px;display:block}
.import-box .t{font-size:14px;font-weight:700;margin-bottom:2px}
.import-box .s{font-size:11px;color:var(--muted)}
.import-result{
  margin-top:10px;padding:12px;border-radius:12px;
  font-size:12px;line-height:1.7;
}
.import-result.success{background:#f0fdf4;color:#166534;border:1px solid #86efac}
.import-result.error{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5}

@media print{
  .app-header,.bnav,.fab,.search-wrap,.view-toggle,.chips{display:none!important}
  main{padding:0;max-width:100%}
  body{background:#fff;padding-bottom:0}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="logo">🏘️</div>
    <div>
      <h1>زعورة</h1>
      <div class="sub" id="hdrSub">v7.1 — إدارة المقبرة والعائلات</div>
    </div>
  </div>
  <button class="icon-btn" onclick="toggleTheme()" title="الوضع">🌓</button>
  <button class="icon-btn" onclick="openSettings()" title="إعدادات">⚙️</button>
</header>

<div class="search-wrap">
  <div class="search-box">
    <span class="ico">🔍</span>
    <input id="globalSearch" placeholder="ابحث في كل شيء…" oninput="globalSearch(this.value)">
    <button class="clear" onclick="clearSearch()" style="display:none" id="searchClear">✕</button>
  </div>
</div>

<main>
  <!-- HOME -->
  <section id="pg-home" class="page active">
    <div class="stats-scroll" id="homeStats"></div>

    <div class="card">
      <div class="card-head"><h2>⚡ إجراءات سريعة</h2></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn success" onclick="openBurialSheet()">📜 تسجيل دفن</button>
        <button class="btn primary" onclick="openGraveSheet()">➕ إضافة قبر</button>
        <button class="btn info" onclick="openPersonSheet()">👤 إضافة فرد</button>
        <button class="btn warning" onclick="openImportSheet()">📥 استيراد Excel</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>📊 توزيع القبور</h2>
        <span class="badge muted" id="graveTotalBadge">0</span>
      </div>
      <div id="graveDist"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>👨‍👩‍👧 أكبر العائلات</h2>
        <button class="btn ghost sm" onclick="go('pg-families')">الكل</button>
      </div>
      <div id="topFamilies"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>🕐 آخر النشاطات</h2></div>
      <div id="recentActs"></div>
    </div>
  </section>

  <!-- GRAVES -->
  <section id="pg-graves" class="page">
    <div class="stats-scroll" id="graveStats"></div>
    <div class="card" style="padding:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px">
        <div class="view-toggle">
          <button data-v="list" onclick="setGraveView('list')" id="gvList">📋 قائمة</button>
          <button data-v="grid" onclick="setGraveView('grid')" id="gvGrid">⊞ شبكة</button>
        </div>
        <div style="font-size:11px;color:var(--muted)" id="graveCounter"></div>
      </div>
      <div class="chips" id="graveChips"></div>
    </div>
    <div id="graveContent"></div>
  </section>

  <!-- PEOPLE -->
  <section id="pg-people" class="page">
    <div class="stats-scroll" id="peopleStats"></div>
    <div class="card" style="padding:12px">
      <div class="chips" id="peopleChips"></div>
    </div>
    <div id="peopleContent"></div>
  </section>

  <!-- FAMILIES -->
  <section id="pg-families" class="page">
    <div class="stats-scroll" id="familyStats"></div>
    <div class="card" style="padding:12px">
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button class="btn ghost sm" onclick="sortFamilies('size')" id="famSortSize">الأكبر أولاً</button>
        <button class="btn ghost sm" onclick="sortFamilies('name')" id="famSortName">أبجدي</button>
      </div>
    </div>
    <div id="familyContent"></div>
  </section>

  <!-- BURIALS -->
  <section id="pg-burials" class="page">
    <div class="stats-scroll" id="burialStats"></div>
    <div class="card" style="padding:12px">
      <div class="chips" id="burialChips"></div>
    </div>
    <div id="burialContent"></div>
  </section>
</main>

<button class="fab" id="fab" onclick="handleFab()">+</button>

<nav class="bnav">
  <button data-pg="pg-home" class="on" onclick="go('pg-home')"><span class="i">🏠</span>الرئيسية</button>
  <button data-pg="pg-graves" onclick="go('pg-graves')"><span class="i">⚰️</span>القبور<span class="nb" id="nbGraves" style="display:none">0</span></button>
  <button data-pg="pg-people" onclick="go('pg-people')"><span class="i">👥</span>الأفراد</button>
  <button data-pg="pg-families" onclick="go('pg-families')"><span class="i">👨‍👩‍👧</span>العائلات</button>
  <button data-pg="pg-burials" onclick="go('pg-burials')"><span class="i">📜</span>الدفن</button>
</nav>

<div class="sheet-back" id="sheetBack" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grip"></div>
  <div class="sheet-hd">
    <h2 id="sheetTitle">…</h2>
    <button class="icon-btn" onclick="closeSheet()">✕</button>
  </div>
  <div class="sheet-bd" id="sheetBody"></div>
  <div class="sheet-ft" id="sheetFoot"></div>
</div>

<div class="toasts" id="toasts"></div>
<div class="loader" id="loader"><div class="spin"></div></div>

<script>
'use strict';

/* ============================================================
   CONFIG
   ============================================================ */
const DB_NAME = 'zaoura_v71';
const DB_VER = 1;
const STORES = ['graves','people','burials','families','fields','logs'];

const C = {
  GRAVE_TYPE: ['عام','خاص','عائلي'],
  GRAVE_STATUS: ['متاح','مشغول','إعادة استخدام','مهجور','مهدّم'],
  GENDER: ['ذكر','أنثى'],
  PERSON_STATUS: ['حي','متوفى','مسافر','غير معروف'],
  RELATION: ['رب أسرة','زوجة','زوج','ابن','بنت','أب','أم','أخ','أخت','جد','جدة','حفيد','حفيدة','أخرى']
};

const S = {
  graves: [], people: [], burials: [], families: [],
  fields: [],
  page: 'pg-home',
  graveView: 'list',
  graveFilter: 'all',
  peopleFilter: 'all',
  burialYear: '',
  familySort: 'size',
  editing: null
};

/* ============================================================
   INDEXEDDB
   ============================================================ */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORES.forEach(n=>{ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:'id',autoIncrement:true}); });
    };
    r.onsuccess = ()=>{ db = r.result; res(db); };
    r.onerror = ()=> rej(r.error);
  });
}
const t = (s,m='readonly')=>db.transaction(s,m).objectStore(s);
const dbAll = s => new Promise((res,rej)=>{ const q=t(s).getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); });
const dbGet = (s,id) => new Promise((res,rej)=>{ const q=t(s).get(id); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
const dbPut = (s,o) => new Promise((res,rej)=>{ const q=t(s,'readwrite').put(o); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
const dbDel = (s,id) => new Promise((res,rej)=>{ const q=t(s,'readwrite').delete(id); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
const dbClear = s => new Promise((res,rej)=>{ const q=t(s,'readwrite').clear(); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });

/* ============================================================
   UTILITIES
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanName = v => String(v??'').trim().replace(/\s+/g,' ');
const normAr = v => String(v??'').toLowerCase().trim()
  .replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/[ىي]/g,'ي')
  .replace(/[ًٌٍَُِّْـ]/g,'');

const fmtDate = d => {
  if(!d) return '—';
  try { return new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'}); }
  catch(e){ return d; }
};

const calcAge = (birth, death, status) => {
  if(!birth) return '';
  if(!death && status === 'متوفى') return '';
  const b = new Date(birth); if(isNaN(b)) return '';
  const d = death ? new Date(death) : new Date();
  if(isNaN(d)) return '';
  let a = d.getFullYear() - b.getFullYear();
  if(d.getMonth()<b.getMonth() || (d.getMonth()===b.getMonth() && d.getDate()<b.getDate())) a--;
  return a>=0 ? a : '';
};

const addYears = (d,y) => {
  if(!d) return '';
  const dd = new Date(d+'T00:00:00'); if(isNaN(dd)) return '';
  dd.setFullYear(dd.getFullYear() + Number(y||10));
  return dd.toISOString().slice(0,10);
};

// ✅ v7.1: يقبل صيغة "1948-01-01 00:00:00" و "1948-01-01T00:00:00"
const toDate = v => {
  if(!v) return '';
  if(typeof v === 'string' && v.trim().startsWith('=')) return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number'){
    const d = new Date((v-25569)*86400000);
    return isNaN(d)?'':d.toISOString().slice(0,10);
  }
  const s = String(v).trim();
  const dtMatch = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]|$)/);
  if(dtMatch) return `${dtMatch[1]}-${dtMatch[2].padStart(2,'0')}-${dtMatch[3].padStart(2,'0')}`;
  const m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
};

const debounce = (fn,d=200) => { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),d); }; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const graveStatusOf = g => {
  if(!g) return 'متاح';
  if(g.status === 'مشغول' && g.availableDate && new Date(g.availableDate) <= new Date())
    return 'إعادة استخدام';
  return g.status || 'متاح';
};

const statusClass = s => {
  if(['متاح','فارغ'].includes(s)) return 'success';
  if(s === 'مشغول') return 'danger';
  if(s === 'إعادة استخدام') return 'warning';
  return 'muted';
};

// ✅ v7.1: تنظيف رقم الهاتف
function cleanPhone(v){
  if(!v) return '';
  let s = String(v).trim();
  s = s.replace(/\.0+$/,'');
  s = s.replace(/[\s\-\(\)\u200f\u200e]/g,'');
  if(s.startsWith('+963')) s = '0' + s.slice(4);
  return s;
}

// ✅ v7.1: كشف معادلات Excel
function isFormula(v){
  if(v === null || v === undefined) return true;
  const s = String(v).trim();
  return !s || s.startsWith('=') || s.includes('openpyxl') || s.includes('ArrayFormula');
}

/* ============================================================
   LOAD DATA
   ============================================================ */
async function loadAll(){
  const [graves, people, burials, families, fields] = await Promise.all([
    dbAll('graves'), dbAll('people'), dbAll('burials'), dbAll('families'), dbAll('fields')
  ]);
  S.graves = graves.sort((a,b) => String(a.number||'').localeCompare(String(b.number||''),'ar',{numeric:true}));
  S.people = people.sort((a,b) => String(a.name||'').localeCompare(String(b.name||''),'ar'));
  S.burials = burials.sort((a,b) => (b.burialDate||'').localeCompare(a.burialDate||''));
  S.families = families.sort((a,b) => String(a.name||'').localeCompare(String(b.name||''),'ar'));
  S.fields = fields;
}

function setGraveView(v){
  S.graveView = v;
  $('gvList').classList.toggle('on', v==='list');
  $('gvGrid').classList.toggle('on', v==='grid');
  renderGraves();
}

function setGraveFilter(k){ S.graveFilter = k; renderGraves(); }

function filterGraves(q){
  const s = q ? normAr(q) : '';
  return S.graves.filter(g => {
    if(s){
      const hay = normAr(`${g.number||''} ${g.owner||''} ${g.location||''} ${g.lastBuried||''} ${g.section||''}`);
      if(!hay.includes(s)) return false;
    }
    const st = graveStatusOf(g);
    if(S.graveFilter === 'occupied' && st !== 'مشغول') return false;
    if(S.graveFilter === 'available' && st !== 'متاح') return false;
    if(S.graveFilter === 'reuse' && st !== 'إعادة استخدام') return false;
    if(S.graveFilter === 'private' && g.type !== 'خاص') return false;
    if(S.graveFilter === 'public' && g.type !== 'عام') return false;
    return true;
  });
}

function renderGraves(){
  const G = S.graves;
  const occupied = G.filter(g => graveStatusOf(g) === 'مشغول').length;
  const available = G.filter(g => graveStatusOf(g) === 'متاح').length;
  const reuse = G.filter(g => graveStatusOf(g) === 'إعادة استخدام').length;

  $('graveStats').innerHTML = `

    { k:'available', l:'🕊️ متاحة' },
    { k:'reuse', l:'🔄 إعادة' },
    { k:'private', l:'👤 خاصة' },
    { k:'public', l:'🏛️ عامة' }
  ];
  $('graveChips').innerHTML = chips.map(c =>

  }

  if(S.graveView === 'grid'){
    el.innerHTML = `<div class="card" style="padding:12px"><div class="grid-view">${list.slice(0,500).map(g => {
      const st = graveStatusOf(g);
      const cls = st==='مشغول'?'occupied' : st==='متاح'?'available' : 'reuse';
      return `<div class="gcell ${cls}" onclick="openGraveSheet(${g.id})">
        <div class="n">${esc(g.number||'?')}</div>
        <div class="o">${esc((g.owner||'').slice(0,10)||'—')}</div>
      </div>`;
    }).join('')}</div></div>`;
  } else {
    el.innerHTML = `<div class="list">${list.slice(0,300).map(g => {
      const st = graveStatusOf(g);
      const cls = st==='مشغول'?'red' : st==='متاح'?'green' : 'orange';
      const icon = st==='مشغول'?'🪦' : st==='متاح'?'🕊️' : '🔄';
      return `<div class="item" onclick="openGraveSheet(${g.id})">
        <div class="av ${cls}">${icon}</div>

          <div class="sub">${esc(g.owner||'بدون مالك')}${g.location?' • '+esc(g.location):''}</div>
        </div>

function openGraveSheet(id){

  const g = isNew ? { status:'متاح', type:'عام', years:10 } : S.graves.find(x => x.id === id);
  if(!g) return;
  S.editing = { type:'grave', id: isNew ? null : id };

  const customFields = S.fields.filter(f => f.entity === 'grave');
  const body = `
    <div class="fld">
      <label>رقم القبر <span class="req">*</span></label>
      <input id="gNumber" value="${esc(g.number||'')}" placeholder="مثال: Z-125" inputmode="text">
    </div>
    <div class="fld-row">
      <div class="fld"><label>النوع</label>
        <select id="gType">${C.GRAVE_TYPE.map(t => `<option ${g.type===t?'selected':''}>${t}</option>`).join('')}</select>
      </div>
      <div class="fld"><label>الحالة</label>
        <select id="gStatus">${C.GRAVE_STATUS.map(t => `<option ${g.status===t?'selected':''}>${t}</option>`).join('')}</select>
      </div>
    </div>
    <div class="fld-row">
      <div class="fld"><label>القطاع / الصف</label>
        <input id="gSection" value="${esc(g.section||'')}" placeholder="مثال: صف اول">
      </div>
      <div class="fld"><label>الموقع الدقيق</label>
        <input id="gLocation" value="${esc(g.location||'')}" placeholder="مثال: شرق المسجد">
      </div>
    </div>
    <div class="fld"><label>المالك / العائلة</label>
      <input id="gOwner" value="${esc(g.owner||'')}" placeholder="اسم صاحب القبر">
    </div>
    <div class="fld"><label>آخر مدفون</label>
      <input id="gLastBuried" value="${esc(g.lastBuried||'')}" placeholder="اسم آخر متوفى">
    </div>
    <div class="fld-row">
      <div class="fld"><label>تاريخ آخر دفن</label>
        <input id="gLastBurialDate" type="date" value="${esc(g.lastBurialDate||'')}">
      </div>
      <div class="fld"><label>سنوات الإعادة</label>
        <input id="gYears" type="number" inputmode="numeric" value="${g.years||10}">
      </div>
    </div>
    <div class="fld"><label>تاريخ الإتاحة (تلقائي)</label>
      <input id="gAvailableDate" type="date" value="${esc(g.availableDate||'')}" readonly class="fld-readonly">
      <div class="fld-hint">يُحسب من تاريخ آخر دفن + سنوات الإعادة</div>
    </div>
    <div class="fld"><label>ملاحظات</label>
      <textarea id="gNotes" placeholder="أي تفاصيل إضافية…">${esc(g.notes||'')}</textarea>
    </div>
    ${renderCustomFieldsBlock('grave', g)}
  `;

  const foot = isNew
    ? `<button class="btn ghost" onclick="closeSheet()">إلغاء</button>
       <button class="btn primary" onclick="saveGrave()">💾 حفظ</button>`
    : `<button class="btn danger sm" onclick="deleteGrave(${id})">🗑️</button>
       <button class="btn ghost" onclick="closeSheet()">إلغاء</button>
       <button class="btn primary" onclick="saveGrave(${id})">💾 حفظ</button>`;

  openSheet(isNew ? '➕ إضافة قبر' : '✏️ قبر ' + (g.number||''), body, foot, {focus:'gNumber'});

  const calc = () => {
    const d = $('gLastBurialDate').value;
    const y = Number($('gYears').value)||10;
    $('gAvailableDate').value = d ? addYears(d,y) : '';
  };
  $('gLastBurialDate').addEventListener('change', calc);
  $('gYears').addEventListener('input', calc);
}

async function saveGrave(id){
  const number = cleanName($('gNumber').value);
  if(!number){ toast('رقم القبر مطلوب','error'); return; }
  const obj = {
    number,
    type: $('gType').value,
    status: $('gStatus').value,
    section: $('gSection').value.trim(),
    location: $('gLocation').value.trim(),
    owner: $('gOwner').value.trim(),
    lastBuried: $('gLastBuried').value.trim(),
    lastBurialDate: $('gLastBurialDate').value,
    years: Number($('gYears').value)||10,
    availableDate: $('gAvailableDate').value,
    notes: $('gNotes').value.trim(),
    custom: collectCustomFields(),
    updatedAt: new Date().toISOString()
  };
  try{
    if(id){ obj.id = id; const old = await dbGet('graves',id); if(old) obj.createdAt = old.createdAt; }
    else obj.createdAt = new Date().toISOString();
    await dbPut('graves', obj);
    await loadAll();
    closeSheet();
    toast(id ? '✅ تم التعديل' : '✅ تمت الإضافة');
    renderGraves(); renderHome();
  }catch(e){ toast('خطأ: '+e.message,'error'); }
}

async function deleteGrave(id){
  if(!confirm('حذف هذا القبر نهائياً؟')) return;
  await dbDel('graves', id);
  await loadAll();
  closeSheet();
  toast('🗑️ تم الحذف');
  renderGraves(); renderHome();
}

/* ============================================================

function setPeopleFilter(k){ S.peopleFilter = k; renderPeople(); }

function filterPeople(q){
  const s = q ? normAr(q) : '';
  return S.people.filter(p => {
    if(s){
      const hay = normAr(`${p.name||''} ${p.phone||''} ${p.sector||''} ${p.relation||''} ${p.code||''}`);
      if(!hay.includes(s)) return false;
    }
    if(S.peopleFilter === 'alive' && p.status !== 'حي') return false;
    if(S.peopleFilter === 'dead' && p.status !== 'متوفى') return false;
    if(S.peopleFilter === 'male' && p.gender !== 'ذكر') return false;
    if(S.peopleFilter === 'female' && p.gender !== 'أنثى') return false;
    return true;
  });
}

function renderPeople(){

  const dead = P.filter(p => p.status === 'متوفى').length;
  const male = P.filter(p => p.gender === 'ذكر').length;

      <textarea id="pNotes">${esc(p.notes||'')}</textarea></div>

       <button class="btn primary" onclick="savePerson()">💾 حفظ</button>`

       <button class="btn ghost" onclick="closeSheet()">إلغاء</button>

async function savePerson(id){
  const name = cleanName($('pName').value);
  if(!name){ toast('الاسم مطلوب','error'); return; }
  const obj = {
    name,
    gender: $('pGender').value,
    status: $('pStatus').value,
    familyId: $('pFamilyId').value ? Number($('pFamilyId').value) : null,
    relation: $('pRelation').value,
    birth: $('pBirth').value,
    death: $('pDeath').value,
    fatherId: $('pFatherId').value ? Number($('pFatherId').value) : null,
    motherId: $('pMotherId').value ? Number($('pMotherId').value) : null,
    phone: cleanPhone($('pPhone').value),
    sector: $('pSector').value.trim(),
    notes: $('pNotes').value.trim(),
    custom: collectCustomFields(),
    updatedAt: new Date().toISOString()
  };
  try{
    if(id){ obj.id = id; const old = await dbGet('people',id); if(old){ obj.createdAt = old.createdAt; obj.code = old.code; } }
    else obj.createdAt = new Date().toISOString();
    await dbPut('people', obj);
    await loadAll();
    closeSheet();
    toast(id ? '✅ تم التعديل' : '✅ تمت الإضافة');
    renderPeople(); renderHome();
  }catch(e){ toast('خطأ: '+e.message,'error'); }
}

async function deletePerson(id){
  if(!confirm('حذف هذا الفرد نهائياً؟')) return;
  const rel = S.people.filter(x => x.fatherId===id || x.motherId===id);
  if(rel.length && !confirm(`مرتبط بـ ${rel.length} من الأبناء. متابعة؟`)) return;
  for(const c of rel){
    if(c.fatherId===id){ c.fatherId=null; await dbPut('people',c); }
    if(c.motherId===id){ c.motherId=null; await dbPut('people',c); }
  }
  await dbDel('people', id);
  await loadAll();
  closeSheet();
  toast('🗑️ تم الحذف');
  renderPeople(); renderHome();
}

  const isNew = !id;

  const graveOpts = S.graves.map(g => {

    return `<option value="${g.id}" ${sel?'selected':''}>${esc(g.number)} — ${esc(g.owner||graveStatusOf(g))}</option>`;
  }).join('');

  const peopleOpts = S.people.map(p => `<option value="${p.id}" ${b.personId===p.id?'selected':''}>${esc(p.name)}</option>`).join('');

  const body = `
    <div class="fld"><label>ربط مع فرد <span style="color:var(--muted);font-weight:500">(اختياري)</span></label>

    </div>
    <div class="fld-row">
      <div class="fld"><label>العمر</label>
        <input id="bAge" type="number" inputmode="numeric" value="${esc(b.age||'')}"></div>
      <div class="fld"><label>سنوات الإعادة</label>
        <input id="bYears" type="number" inputmode="numeric" value="${b.years||10}"></div>
    </div>
    <div class="fld"><label>مصدر المعلومة</label>
      <select id="bSource">
        ${['الشاهدة','سجل رسمي','رواية أهلية','أخرى'].map(s => `<option ${b.source===s?'selected':''}>${s}</option>`).join('')}
      </select></div>
    <div class="fld"><label>ملاحظات</label>
      <textarea id="bNotes">${esc(b.notes||'')}</textarea></div>
  `;

       <button class="btn success" onclick="saveBurial()">📜 تسجيل</button>`
    : `<button class="btn danger sm" onclick="deleteBurial(${id})">🗑️</button>
       <button class="btn ghost" onclick="closeSheet()">إلغاء</button>
       <button class="btn success" onclick="saveBurial(${id})">💾 حفظ</button>`;

  openSheet(isNew ? '📜 تسجيل دفن' : '✏️ تعديل سجل', body, foot, {focus:'bPersonName'});

  $('bPersonId').addEventListener('change', () => {
    const pid = Number($('bPersonId').value);
    if(!pid) return;
    const p = S.people.find(x => x.id === pid);
    if(!p) return;
    if(!$('bPersonName').value) $('bPersonName').value = p.name;
    if(p.birth && !$('bAge').value){
      const age = calcAge(p.birth, $('bDeathDate').value || new Date(), 'متوفى');
      if(age) $('bAge').value = age;
    }
  });
}

async function saveBurial(id){
  const personName = cleanName($('bPersonName').value);
  const graveId = Number($('bGraveId').value);
  const burialDate = $('bBurialDate').value;
  if(!personName){ toast('اسم المتوفى مطلوب','error'); return; }
  if(!graveId){ toast('اختر القبر','error'); return; }
  if(!burialDate){ toast('تاريخ الدفن مطلوب','error'); return; }

  const grave = S.graves.find(g => g.id === graveId);
  const years = Number($('bYears').value)||grave.years||10;

  const obj = {
    personId: $('bPersonId').value ? Number($('bPersonId').value) : null,
    personName,
    graveId,
    graveNumber: grave.number,
    deathDate: $('bDeathDate').value,
    burialDate,
    age: $('bAge').value,
    years,
    source: $('bSource').value,
    notes: $('bNotes').value.trim(),
    year: new Date(burialDate).getFullYear(),
    updatedAt: new Date().toISOString()
  };

  try{
    if(id){ obj.id = id; const old = await dbGet('burials',id); if(old) obj.createdAt = old.createdAt; }
    else obj.createdAt = new Date().toISOString();
    await dbPut('burials', obj);

    const gUpd = { ...grave };
    gUpd.status = 'مشغول';
    gUpd.lastBuried = personName;
    gUpd.lastBurialDate = burialDate;
    gUpd.availableDate = addYears(burialDate, years);
    await dbPut('graves', gUpd);

    await loadAll();
    closeSheet();
    toast('📜 تم تسجيل الدفن');
    renderBurials(); renderHome(); renderGraves();
  }catch(e){ toast('خطأ: '+e.message,'error'); }
}

async function deleteBurial(id){
  if(!confirm('حذف هذا السجل؟')) return;
  await dbDel('burials', id);
  await loadAll();
  closeSheet();
  toast('🗑️ تم الحذف');
  renderBurials(); renderHome();
}

function renderCustomFieldsBlock(entity, obj){
  const fields = S.fields.filter(f => f.entity === entity);
  if(!fields.length) return '';
  return `<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
    <div style="font-weight:800;font-size:13px;margin-bottom:10px">⚙️ حقول مخصصة</div>
    ${fields.map(f => renderCustomField(f, obj.custom?.[f.key])).join('')}
  </div>`;
}

function renderCustomField(f, val){
  val = val ?? '';
  if(f.type === 'select'){
    return `<div class="fld"><label>${esc(f.label)}</label>
      <select data-cf="${esc(f.key)}">
        <option value="">— اختر —</option>
        ${(f.options||[]).map(o => `<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select></div>`;
  }
  if(f.type === 'textarea'){
    return `<div class="fld"><label>${esc(f.label)}</label>
      <textarea data-cf="${esc(f.key)}">${esc(val)}</textarea></div>`;
  }
  const type = f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
  return `<div class="fld"><label>${esc(f.label)}</label>
    <input data-cf="${esc(f.key)}" type="${type}" value="${esc(val)}"></div>`;
}

function collectCustomFields(){
  const out = {};
  document.querySelectorAll('[data-cf]').forEach(el => {
    if(el.value) out[el.dataset.cf] = el.value;
  });
  return out;
}

function normKey(k){ return normAr(String(k||'')).replace(/[^\u0621-\u064Aa-z0-9]/g,''); }

function gv(row, ...aliases){
  if(!row) return '';
  const normalized = {};
  for(const k of Object.keys(row)){ normalized[normKey(k)] = row[k]; }
  for(const a of aliases){
    const key = normKey(a);
    if(key in normalized){
      const v = normalized[key];
      if(v === null || v === undefined) continue;
      const s = String(v).trim();
      if(!s || s.startsWith('=') || s.includes('openpyxl') || s.includes('ArrayFormula')) continue;
      return s;
    }
  }
  return '';
}

async function importXLSX(kind, input){
  const file = input.files[0];
  if(!file) return;
  showLoad(true);
  const log = $('importLog');
  log.innerHTML = '<div style="color:var(--muted)">⏳ جاري قراءة الملف…</div>';

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });

    if(!rows.length){
      log.innerHTML = '<div class="import-result error">❌ الملف فارغ</div>';
      showLoad(false); input.value = ''; return;
    }

    const result = await processImport(kind, rows);
    const cls = result.ok > 0 ? 'success' : 'error';
    log.innerHTML = `
      <div class="import-result ${cls}">
        <div style="font-weight:800;margin-bottom:6px">📊 نتيجة الاستيراد</div>
        <div>✅ نجح: <b>${result.ok}</b></div>
        <div>⏭️ تُخطّي: <b>${result.skip}</b></div>
        ${result.errors.length ? `<div style="margin-top:6px">⚠️ أخطاء: ${result.errors.length}</div>
          <details style="margin-top:4px"><summary style="cursor:pointer">عرض التفاصيل</summary>
            <div style="font-size:11px;margin-top:4px;max-height:100px;overflow:auto">
              ${result.errors.slice(0,20).map(e => '• '+esc(e)).join('<br>')}
              ${result.errors.length > 20 ? '<br>…' : ''}
            </div>
          </details>` : ''}
      </div>
    `;
    if(result.ok > 0) toast(`✅ نجح ${result.ok} سجل`);
    await loadAll();
    renderHome();
    if(S.page === 'pg-graves') renderGraves();
    if(S.page === 'pg-people') renderPeople();
    if(S.page === 'pg-burials') renderBurials();
    if(S.page === 'pg-families') renderFamilies();
  } catch(e){
    console.error(e);
    log.innerHTML = `<div class="import-result error">❌ ${esc(e.message)}</div>`;
    toast('خطأ: '+e.message, 'error');
  }
  showLoad(false);
  input.value = '';
}

async function processImport(kind, rows){
  let ok = 0, skip = 0;
  const errors = [];

  /* ============ أفراد ============ */
  if(kind === 'people'){
    const nameToId = new Map();
    S.people.forEach(p => nameToId.set(normAr(p.name), p.id));

    // المرور الأول: أضف كل الأفراد
    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const name = cleanName(gv(r, ...COLS.people.name));
      if(!name){ skip++; continue; }
      if(nameToId.has(normAr(name))){ skip++; continue; }

      try{
        const familyCode = gv(r, ...COLS.people.familyCode).trim();
        let familyId = null;
        if(familyCode){
          let fam = S.families.find(f => (f.code||'') === familyCode || normAr(f.name) === normAr(familyCode));
          if(!fam){
            const newFamId = await dbPut('families', {
              name: familyCode, code: familyCode, village:'', notes:'',
              createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
            });
            fam = { id: newFamId, name: familyCode, code: familyCode };
            S.families.push(fam);
          }
          familyId = fam.id;
        }

        const p = {
          code: gv(r, ...COLS.people.code),
          name,
          gender: gv(r, ...COLS.people.gender) || 'ذكر',
          status: gv(r, ...COLS.people.status) || 'حي',
          familyId,
          relation: gv(r, ...COLS.people.relation),
          birth: toDate(gv(r, ...COLS.people.birth)),
          death: toDate(gv(r, ...COLS.people.death)),
          fatherId: null, motherId: null,
          phone: cleanPhone(gv(r, ...COLS.people.phone)),
          sector: gv(r, ...COLS.people.sector),
          notes: gv(r, ...COLS.people.notes),
          custom: {
            'كود الأسرة': familyCode,
            'حالة الجوال': gv(r, ...COLS.people.phoneStatus),
            'حالة العضو': gv(r, ...COLS.people.memberStatus),
            'نوع العضو': gv(r, ...COLS.people.memberType),
            'نوع الاشتراك': gv(r, ...COLS.people.subType),
            'تاريخ الاشتراك': toDate(gv(r, ...COLS.people.subDate)),
            'تاريخ إضافة الاشتراك': toDate(gv(r, ...COLS.people.subDate2)),
            'سبب الخصم': gv(r, ...COLS.people.deduction),
            'خصم اللجنة': gv(r, ...COLS.people.committee),
            'تاريخ تغيير الحالة': toDate(gv(r, ...COLS.people.statusChange))
          },
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };

        const newId = await dbPut('people', p);
        nameToId.set(normAr(name), newId);
        ok++;
      }catch(e){ errors.push(`صف ${i+2}: ${e.message}`); }
    }
  }

  /* ============ قبور ============ */
  else if(kind === 'graves'){
    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const number = cleanName(gv(r, ...COLS.graves.number));
      if(!number){ skip++; continue; }
      if(S.graves.some(g => String(g.number) === String(number))){ skip++; continue; }

      try{
        const lastDate = toDate(gv(r, ...COLS.graves.lastDate));
        const years = 10;

        let status = gv(r, ...COLS.graves.status);
        if(!status || status.startsWith('=')){
          const lastBuried = gv(r, ...COLS.graves.lastBuried);
          status = lastBuried ? 'مشغول' : 'متاح';
        }

        const grave = {
          number,
          type: gv(r, ...COLS.graves.type) || 'عام',
          status,
          section: gv(r, ...COLS.graves.location),
          location: gv(r, ...COLS.graves.location),
          owner: gv(r, ...COLS.graves.owner) || gv(r, ...COLS.graves.familyName),
          lastBuried: gv(r, ...COLS.graves.lastBuried),
          lastBurialDate: lastDate,
          years,
          availableDate: lastDate ? addYears(lastDate, years) : '',
          notes: gv(r, ...COLS.graves.notes),
          custom: {
            'رقم المقبرة': gv(r, ...COLS.graves.cemeteryCode),
            'اسم المقبرة': gv(r, ...COLS.graves.cemeteryName),
            'الضيعة': gv(r, ...COLS.graves.village),
            'العائلة': gv(r, ...COLS.graves.familyName),
            'حالة إضافية': gv(r, ...COLS.graves.graveNote),
            'جواز الاستخدام': toDate(gv(r, ...COLS.graves.usableUntil))
          },
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };

        await dbPut('graves', grave);
        ok++;
      }catch(e){ errors.push(`صف ${i+2}: ${e.message}`); }
    }
  }

  /* ============ دفن ============ */
  else if(kind === 'burials'){
    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const personName = cleanName(gv(r, ...COLS.burials.personName));
      const graveNumber = cleanName(gv(r, ...COLS.burials.graveNumber));
      const burialDate = toDate(gv(r, ...COLS.burials.burialDate));

      if(!personName || !graveNumber){ skip++; continue; }

      if(S.burials.some(b =>
        normAr(b.personName) === normAr(personName) &&
        String(b.graveNumber) === String(graveNumber) &&
        b.burialDate === burialDate
      )){ skip++; continue; }

      try{
        let grave = S.graves.find(g => String(g.number) === String(graveNumber));
        if(!grave){
          const newGraveId = await dbPut('graves', {
            number: graveNumber, type:'عام', status:'مشغول',
            section:'', location:'', owner:'', lastBuried: personName,
            lastBurialDate: burialDate, years:10,
            availableDate: burialDate ? addYears(burialDate, 10) : '',
            notes:'', custom:{},
            createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
          });
          grave = { id: newGraveId, number: graveNumber, years: 10 };
          S.graves.push(grave);
        }

        const age = gv(r, ...COLS.burials.age);
        const personId = (() => {
          const p = S.people.find(pp => normAr(pp.name) === normAr(personName));
          return p ? p.id : null;
        })();
        const years = grave.years || 10;

        await dbPut('burials', {
          externalId: gv(r, ...COLS.burials.externalId),
          personName,
          personId,
          graveId: grave.id,
          graveNumber: grave.number,
          deathDate: toDate(gv(r, ...COLS.burials.deathDate)),
          burialDate,
          age: isFormula(age) ? '' : age,
          years,
          source: gv(r, ...COLS.burials.source) || 'الشهادة',
          notes: gv(r, ...COLS.burials.notes),
          year: burialDate ? new Date(burialDate).getFullYear() : null,
          custom: {
            'رقم الوثيقة': gv(r, ...COLS.burials.documentNum),
            'صورة الشاهد': gv(r, ...COLS.burials.witnessPhoto),
            'عدد المدفونين': gv(r, ...COLS.burials.buriedCount)
          },
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });

        const updated = { ...(S.graves.find(x => x.id === grave.id) || grave) };
        updated.status = 'مشغول';
        updated.lastBuried = personName;
        updated.lastBurialDate = burialDate;
        updated.availableDate = addYears(burialDate, years);
        await dbPut('graves', updated);

        ok++;
      }catch(e){ errors.push(`صف ${i+2}: ${e.message}`); }
    }
  }

  return { ok, skip, errors };
}

function exportExcel(){
  const wb = XLSX.utils.book_new();

  const graves = S.graves.map(g => ({
    'رقم القبر': g.number, 'النوع': g.type, 'الحالة': graveStatusOf(g),
    'القطاع': g.section||'', 'الموقع': g.location||'', 'المالك': g.owner||'',
    'آخر مدفون': g.lastBuried||'', 'تاريخ آخر دفن': g.lastBurialDate||'',
    'تاريخ الإتاحة': g.availableDate||'', 'ملاحظات': g.notes||'',
    ...(g.custom||{})
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(graves), 'القبور');

  const people = S.people.map(p => ({
    'كود': p.code||'', 'الاسم': p.name, 'الجنس': p.gender, 'الحالة': p.status,
    'العائلة': S.families.find(f=>f.id===p.familyId)?.name||'',
    'الصلة': p.relation||'', 'الميلاد': p.birth||'', 'الوفاة': p.death||'',
    'العمر': calcAge(p.birth,p.death,p.status), 'الهاتف': p.phone||'',
    'القطاع': p.sector||'', 'ملاحظات': p.notes||'',
    ...(p.custom||{})
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(people), 'الأفراد');

  const fams = S.families.map(f => ({
    'الاسم': f.name, 'الرمز': f.code||'',
    'عدد الأفراد': S.people.filter(p=>p.familyId===f.id).length,
    'القرية': f.village||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(fams), 'العائلات');

  const b = S.burials.map(x => ({
    'المتوفى': x.personName, 'القبر': x.graveNumber,
    'الوفاة': x.deathDate||'', 'الدفن': x.burialDate||'',
    'العمر': x.age||'', 'المصدر': x.source||'',
    ...(x.custom||{})
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(b), 'الدفن');

  XLSX.writeFile(wb, `زعورة_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('📊 تم تصدير Excel');
}

function exportBackup(){
  const data = { version:'7.1', date: new Date().toISOString(), data: {
    graves: S.graves, people: S.people, burials: S.burials,
    families: S.families, fields: S.fields
  }};
  const blob = new Blob([JSON.stringify(data,null,2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `zaoura_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('💾 تم التصدير');
}

async function importBackupFile(input){
  const file = input.files[0]; if(!file) return;
  const text = await file.text();
  try{
    const parsed = JSON.parse(text);
    const d = parsed.data || parsed;
    if(!d.people && !d.graves) throw new Error('ملف غير صالح');
    if(!confirm('سيتم دمج البيانات. متابعة؟')){ input.value=''; return; }
    const gFp = new Set(S.graves.map(g=>normAr(`${g.number}|${g.location||''}`)));
    const pFp = new Set(S.people.map(p=>normAr(`${p.name}|${p.birth||''}`)));
    const fFp = new Set(S.families.map(f=>normAr(f.name)));
    let added = 0;
    for(const g of (d.graves||[])){
      if(gFp.has(normAr(`${g.number}|${g.location||''}`))) continue;
      delete g.id; await dbPut('graves', g); added++;
    }
    for(const p of (d.people||[])){
      if(pFp.has(normAr(`${p.name}|${p.birth||''}`))) continue;
      delete p.id; await dbPut('people', p); added++;
    }
    for(const f of (d.families||[])){
      if(fFp.has(normAr(f.name))) continue;
      delete f.id; await dbPut('families', f); added++;
    }
    for(const b of (d.burials||[])){ delete b.id; await dbPut('burials', b); }
    for(const fl of (d.fields||[])){ delete fl.id; await dbPut('fields', fl); }
    await loadAll();
    closeSheet();
    toast(`✅ تم دمج ${added} سجل`);
    renderHome();
  }catch(e){ toast('خطأ: '+e.message,'error'); }
  input.value = '';
}

async function clearAllData(){
  if(!confirm('حذف كل البيانات نهائياً؟')) return;
  if(!confirm('تأكيد أخير — لا يمكن التراجع!')) return;
  for(const s of STORES){ await dbClear(s); }
  await loadAll();
  closeSheet();
  toast('🗑️ تم حذف كل البيانات', 'warning');
  renderHome();
  go('pg-home');
}

/* ============================================================
   WHATSAPP SHARE
   ============================================================ */
function shareFamilyWA(id){
  const f = S.families.find(x => x.id === id);
  if(!f) return;
  const members = S.people.filter(p => p.familyId === id);
  let txt = `*${f.name}*\n`;
  if(f.code) txt += `الرمز: ${f.code}\n`;
  txt += `\n*أفراد العائلة (${members.length}):*\n`;
  members.slice(0,50).forEach((p,i) => {
    txt += `${i+1}. ${p.name}${p.relation?' ('+p.relation+')':''}${p.status==='متوفى'?' ⚰️':''}\n`;
  });
  if(members.length > 50) txt += `\n... و${members.length-50} آخرين`;
  txt += `\n\n_زعورة v7.1_`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

function shareBurialWA(id){
  const b = S.burials.find(x => x.id === id);
  if(!b) return;
  const txt = `🪦 *سجل دفن*\n\n*الاسم:* ${b.personName}\n*القبر:* ${b.graveNumber}\n*تاريخ الدفن:* ${b.burialDate}\n${b.age?'*العمر:* '+b.age+' سنة\n':''}${b.notes?'\n_'+b.notes+'_':''}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

const globalSearch = debounce(q => {
  $('searchClear').style.display = q ? 'block' : 'none';
  if(S.page === 'pg-graves') renderGraves();
  else if(S.page === 'pg-people') renderPeople();
  else if(S.page === 'pg-families') renderFamilies();
  else if(S.page === 'pg-burials') renderBurials();
}, 200);

function clearSearch(){
  $('globalSearch').value = '';
  globalSearch('');
}

   INIT
   ============================================================ */
async function init(){
  const savedTheme = localStorage.getItem('zt');
  if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  try{
    await openDB();
    await loadAll();
    renderHome();
    $('fab').style.display = 'none';
  }catch(e){
    console.error(e);
    toast('خطأ في تحميل البيانات: '+e.message, 'error', 5000);
  }

  go('pg-home');
}

document.addEventListener('DOMContentLoaded', init);
