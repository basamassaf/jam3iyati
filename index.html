<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قرية زعورة - شجرة العائلة</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Tahoma, Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: #172b4d;
}

.app {
  width: min(1400px, calc(100% - 24px));
  margin: 12px auto;
  background: #f5f7fb;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 15px 50px #0006;
}

header {
  padding: 25px;
  color: white;
  text-align: center;
  background: linear-gradient(135deg, #1a237e, #3949ab);
}

header h1 {
  margin-bottom: 8px;
}

header p {
  opacity: .9;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  background: white;
}

nav button,
.action-button {
  border: 0;
  border-radius: 8px;
  padding: 11px 16px;
  color: white;
  background: #1a237e;
  cursor: pointer;
  font-weight: bold;
}

nav button:hover,
.action-button:hover {
  opacity: .85;
}

.content {
  padding: 18px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}

.stat {
  padding: 18px;
  border-radius: 12px;
  color: white;
  text-align: center;
}

.stat strong {
  display: block;
  margin-bottom: 6px;
  font-size: 28px;
}

.blue { background: linear-gradient(135deg, #3498db, #2980b9); }
.green { background: linear-gradient(135deg, #27ae60, #229954); }
.gray { background: linear-gradient(135deg, #596275, #303952); }
.purple { background: linear-gradient(135deg, #8e44ad, #6c3483); }

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 15px;
}

.toolbar input {
  flex: 1;
  min-width: 220px;
  padding: 12px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
}

.toolbar button {
  border: 0;
  border-radius: 8px;
  padding: 10px 15px;
  color: white;
  background: #3498db;
  cursor: pointer;
}

.tree-wrapper {
  height: 650px;
  overflow: hidden;
  position: relative;
  border: 2px solid #e5e7eb;
  border-radius: 14px;
  background-color: #fff9e6;
  background-image:
    linear-gradient(#ddd 1px, transparent 1px),
    linear-gradient(90deg, #ddd 1px, transparent 1px);
  background-size: 25px 25px;
}

.tree {
  min-width: 1100px;
  padding: 35px;
  transform-origin: top center;
  transition: transform .25s;
}

.generation {
  display: flex;
  justify-content: center;
  gap: 35px;
  margin-bottom: 55px;
  position: relative;
}

.generation:not(:last-child)::after {
  content: "";
  position: absolute;
  bottom: -35px;
  width: 3px;
  height: 35px;
  background: #9ca3af;
}

.family-group {
  position: relative;
  display: flex;
  justify-content: center;
  gap: 12px;
}

.family-group::after {
  content: "";
  position: absolute;
  bottom: -25px;
  left: 50%;
  width: 2px;
  height: 25px;
  background: #9ca3af;
}

.person {
  width: 150px;
  min-height: 82px;
  padding: 10px;
  border: 3px solid #3498db;
  border-radius: 12px;
  background: white;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 4px 10px #0002;
  transition: .2s;
}

.person:hover {
  transform: translateY(-5px) scale(1.03);
  border-color: #f39c12;
}

.person.dead {
  border-color: #596275;
  background: #eeeeee;
}

.person .icon {
  font-size: 22px;
}

.person .name {
  margin: 5px 0;
  font-weight: bold;
}

.person small {
  color: #6b7280;
  font-size: 11px;
}

.person.dead small {
  color: #374151;
}

.empty {
  padding: 70px;
  color: #777;
  text-align: center;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  align-items: center;
  justify-content: center;
  padding: 15px;
  background: #0009;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(450px, 100%);
  padding: 22px;
  border-radius: 14px;
  background: white;
}

.modal-box h2 {
  margin-bottom: 15px;
  color: #1a237e;
}

.modal-box p {
  padding: 7px 0;
  border-bottom: 1px solid #eee;
}

.close {
  float: left;
  border: 0;
  background: none;
  color: #888;
  font-size: 25px;
  cursor: pointer;
}

@media (max-width: 700px) {
  .content {
    padding: 10px;
  }

  .tree-wrapper {
    height: 550px;
  }

  .person {
    width: 125px;
  }

  .generation {
    gap: 15px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header>
    <h1>🏛️ قرية زعورة</h1>
    <p>نظام إدارة شجرة العائلة والمقبرة</p>
  </header>

  <nav>
    <button onclick="showPage('home')">الرئيسية</button>
    <button onclick="showPage('treePage')">شجرة العائلة</button>
    <button onclick="showPage('people')">الأفراد</button>
    <button onclick="showPage('cemetery')">المقبرة</button>
  </nav>

  <main class="content">

    <section id="home">
      <div class="stats">
        <div class="stat blue">
          <strong id="totalPeople">0</strong>
          <span>إجمالي الأفراد</span>
        </div>

        <div class="stat green">
          <strong id="alivePeople">0</strong>
          <span>الأحياء</span>
        </div>

        <div class="stat gray">
          <strong id="deadPeople">0</strong>
          <span>المتوفون</span>
        </div>

        <div class="stat purple">
          <strong>0</strong>
          <span>القبور</span>
        </div>
      </div>

      <div class="empty">
        اختر "شجرة العائلة" من القائمة لعرض الشجرة.
      </div>
    </section>

    <section id="treePage" style="display:none">

      <div class="toolbar">
        <input
          id="search"
          type="search"
          placeholder="ابحث عن اسم..."
          oninput="searchPerson()"
        >

        <button onclick="zoomTree(0.1)">تكبير +</button>
        <button onclick="zoomTree(-0.1)">تصغير −</button>
        <button onclick="resetTree()">إعادة ضبط</button>
      </div>

      <div class="tree-wrapper">
        <div id="tree" class="tree"></div>
      </div>

    </section>

    <section id="people" style="display:none">
      <h2>الأفراد</h2>
      <div id="peopleList" style="margin-top:15px"></div>
    </section>

    <section id="cemetery" style="display:none">
      <h2>المقبرة</h2>
      <div class="empty">سيتم إضافة إدارة القبور في المرحلة التالية.</div>
    </section>

  </main>
</div>

<div id="modal" class="modal" onclick="closeModal(event)">
  <div class="modal-box">
    <button class="close" onclick="hideModal()">×</button>
    <h2 id="modalName"></h2>
    <div id="modalDetails"></div>
  </div>
</div>

<script>
const people = [
  {
    id: 1,
    name: "علي محمد",
    gender: "male",
    birth: "1920",
    death: "1990",
    status: "dead",
    spouse: "فاطمة أحمد",
    children: [3, 4]
  },
  {
    id: 2,
    name: "فاطمة أحمد",
    gender: "female",
    birth: "1925",
    death: "",
    status: "alive",
    spouse: "علي محمد",
    children: [3, 4]
  },
  {
    id: 3,
    name: "محمد علي",
    gender: "male",
    birth: "1950",
    death: "",
    status: "alive",
    spouse: "مريم سالم",
    children: [5, 6]
  },
  {
    id: 4,
    name: "أحمد علي",
    gender: "male",
    birth: "1955",
    death: "",
    status: "alive",
    spouse: "",
    children: []
  },
  {
    id: 5,
    name: "خالد محمد",
    gender: "male",
    birth: "1980",
    death: "",
    status: "alive",
    spouse: "",
    children: []
  },
  {
    id: 6,
    name: "سالم محمد",
    gender: "male",
    birth: "1985",
    death: "",
    status: "alive",
    spouse: "",
    children: []
  }
];

let treeScale = 1;

function getPerson(id) {
  return people.find(person => person.id === id);
}

function renderTree() {
  const tree = document.getElementById("tree");

  const grandParents = people.filter(person => person.id === 1 || person.id === 2);
  const parents = people.filter(person => person.id === 3 || person.id === 4);
  const children = people.filter(person => person.id === 5 || person.id === 6);

  tree.innerHTML = `
    <div class="generation">
      ${createFamilyGroup(grandParents)}
    </div>

    <div class="generation">
      ${createFamilyGroup(parents)}
    </div>

    <div class="generation">
      ${createFamilyGroup(children)}
    </div>
  `;

  document.getElementById("tree").style.transform =
    `scale(${treeScale})`;
}

function createFamilyGroup(group) {
  return `
    <div class="family-group">
      ${group.map(createPersonCard).join("")}
    </div>
  `;
}

function createPersonCard(person) {
  const isDead = person.status === "dead";

  return `
    <div
      class="person ${isDead ? "dead" : ""}"
      data-name="${person.name}"
      onclick="showPerson(${person.id})"
    >
      <div class="icon">${person.gender === "male" ? "👨" : "👩"}</div>
      <div class="name">${person.name}</div>
      <small>
        ${isDead ? "متوفى " + person.death : "مواليد " + person.birth}
      </small>
    </div>
  `;
}

function showPerson(id) {
  const person = getPerson(id);

  document.getElementById("modalName").textContent = person.name;

  document.getElementById("modalDetails").innerHTML = `
    <p><strong>الجنس:</strong> ${person.gender === "male" ? "ذكر" : "أنثى"}</p>
    <p><strong>تاريخ الميلاد:</strong> ${person.birth || "غير مسجل"}</p>
    <p><strong>تاريخ الوفاة:</strong> ${person.death || "غير مسجل"}</p>
    <p><strong>الحالة:</strong> ${
      person.status === "dead" ? "متوفى" : "على قيد الحياة"
    }</p>
    <p><strong>الزوج أو الزوجة:</strong> ${
      person.spouse || "غير مسجل"
    }</p>
    <p><strong>عدد الأبناء:</strong> ${person.children.length}</p>
  `;

  document.getElementById("modal").classList.add("show");
}

function hideModal() {
  document.getElementById("modal").classList.remove("show");
}

function closeModal(event) {
  if (event.target.id === "modal") {
    hideModal();
  }
}

function showPage(pageId) {
  document.querySelectorAll("main section").forEach(section => {
    section.style.display = "none";
  });

  document.getElementById(pageId).style.display = "block";

  if (pageId === "treePage") {
    renderTree();
  }

  if (pageId === "people") {
    renderPeople();
  }
}

function zoomTree(amount) {
  treeScale += amount;

  if (treeScale < 0.5) treeScale = 0.5;
  if (treeScale > 1.8) treeScale = 1.8;

  document.getElementById("tree").style.transform =
    `scale(${treeScale})`;
}

function resetTree() {
  treeScale = 1;
  document.getElementById("search").value = "";
  renderTree();
}

function searchPerson() {
  const search = document
    .getElementById("search")
    .value
    .trim()
    .toLowerCase();

  document.querySelectorAll(".person").forEach(card => {
    const name = card.dataset.name.toLowerCase();

    if (!search || name.includes(search)) {
      card.style.opacity = "1";
      card.style.transform = "scale(1.05)";
    } else {
      card.style.opacity = ".25";
      card.style.transform = "scale(1)";
    }
  });
}

function renderPeople() {
  const list = document.getElementById("peopleList");

  list.innerHTML = people.map(person => `
    <div class="person" style="display:inline-block;margin:8px">
      <div class="icon">${person.gender === "male" ? "👨" : "👩"}</div>
      <div class="name">${person.name}</div>
      <small>
        ${person.status === "dead" ? "متوفى" : "على قيد الحياة"}
      </small>
    </div>
  `).join("");
}

function updateStats() {
  document.getElementById("totalPeople").textContent = people.length;

  document.getElementById("alivePeople").textContent =
    people.filter(person => person.status === "alive").length;

  document.getElementById("deadPeople").textContent =
    people.filter(person => person.status === "dead").length;
}

updateStats();
renderTree();
</script>

</body>
</html>
