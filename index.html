<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الجمعية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 20px;
        }
        .container { 
            max-width: 450px; 
            width: 100%;
            background: #fff; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
        }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; font-size: 24px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-size: 14px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; }
        input:focus { outline: none; border-color: #667eea; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error { background: #fee; color: #c33; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; text-align: center; }
        .loading { text-align: center; color: #667eea; margin-top: 15px; display: none; }
        .dashboard { display: none; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-box { background: #f8f9fa; padding: 15px; border-radius: 10px; text-align: center; }
        .stat-box h3 { font-size: 12px; color: #7f8c8d; margin-bottom: 5px; }
        .stat-box p { font-size: 24px; font-weight: bold; color: #2c3e50; }
        .menu { margin-top: 20px; }
        .menu-item { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
        .menu-item h4 { color: #2c3e50; margin-bottom: 5px; }
        .menu-item p { color: #7f8c8d; font-size: 12px; }
        .logout { background: #e74c3c; margin-top: 20px; }
        .success { background: #efe; color: #3a3; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; text-align: center; }
        .info { background: #e3f2fd; color: #1976d2; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginScreen">
        <h1>🏛️ نظام إدارة الجمعية</h1>
        <p class="subtitle">تسجيل دخول المستخدمين</p>
        
        <div class="info" id="infoMsg">
            💡 ملاحظة: إذا لم يعمل، استخدم VPN أو افتح من الكمبيوتر
        </div>
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>
        
        <div class="input-group">
            <label>البريد الإلكتروني:</label>
            <input type="email" id="email" placeholder="example@email.com" value="1980basam@gmail.com">
        </div>
        <div class="input-group">
            <label>كلمة المرور:</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn" id="loginBtn" onclick="doLogin()">تسجيل الدخول</button>
        <div class="loading" id="loading">جاري تسجيل الدخول...</div>
    </div>

    <div id="dashboard" class="dashboard">
        <h1>مرحباً، <span id="userName"></span></h1>
        <p class="subtitle" id="userRole">جاري التحميل...</p>
        <div class="stats">
            <div class="stat-box"><h3>الأعضاء النشطين</h3><p>0</p></div>
            <div class="stat-box"><h3>إجمالي المحصّل</h3><p>0 ل.س</p></div>
        </div>
        <div class="menu">
            <div class="menu-item"><h4> إدارة الأعضاء</h4><p>إضافة، تعديل، بحث</p></div>
            <div class="menu-item"><h4>💰 تسجيل دفعة</h4><p>تسجيل دفعة جديدة</p></div>
            <div class="menu-item"><h4>📊 التقارير</h4><p>عرض الإحصائيات</p></div>
        </div>
        <button class="btn logout" onclick="doLogout()">تسجيل الخروج</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBwBOJjthFdSc7jv0dGL325kcaNqzD9dII",
        authDomain: "jam3iyati-b7528.firebaseapp.com",
        projectId: "jam3iyati-b7528",
        storageBucket: "jam3iyati-b7528.firebasestorage.app",
        messagingSenderId: "499100272911",
        appId: "1:499100272911:web:5bda121dbffa085770567a"
    };

    let auth, db;
    
    // تهيئة Firebase مع معالجة الأخطاء
    try {
        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();
        
        console.log('✅ Firebase initialized successfully');
        
        // إعدادات للتشغيل المحلي
        if (window.location.protocol === 'file:' || window.location.protocol === 'content:') {
            console.warn('⚠️ Running from local file - some features may not work');
        }
        
    } catch (error) {
        console.error('❌ Firebase initialization error:', error);
        document.getElementById('infoMsg').innerHTML = 
            '❌ خطأ في Firebase: ' + error.message + '<br>' +
            '💡 الحل: استخدم VPN أو افتح من الكمبيوتر';
    }

    // التحقق من حالة تسجيل الدخول
    if (auth) {
        auth.onAuthStateChanged(function(user) {
            if (user) {
                console.log('✅ User logged in:', user.email);
                showDashboard(user);
            } else {
                console.log('🚪 No user logged in');
            }
        });
    }

    function doLogin() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const loading = document.getElementById('loading');
        const loginBtn = document.getElementById('loginBtn');

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        if (!email || !password) {
            errorMsg.textContent = '⚠️ الرجاء إدخال البريد وكلمة المرور';
            errorMsg.style.display = 'block';
            return;
        }

        if (!auth) {
            errorMsg.textContent = ' Firebase غير مهيأ - تحقق من الإنترنت أو استخدم VPN';
            errorMsg.style.display = 'block';
            return;
        }

        loading.style.display = 'block';
        loginBtn.disabled = true;

        console.log('🔐 Attempting login for:', email);

        // Timeout بعد 10 ثواني
        const timeout = setTimeout(function() {
            console.error(' Login timeout');
            errorMsg.innerHTML = '⏰ انتهت المهلة<br>' +
                                '💡 الحل:<br>' +
                                '1. استخدم VPN<br>' +
                                '2. أو افتح من الكمبيوتر<br>' +
                                '3. أو ارفع الملف على Netlify';
            errorMsg.style.display = 'block';
            loading.style.display = 'none';
            loginBtn.disabled = false;
        }, 10000);

        auth.signInWithEmailAndPassword(email, password)
            .then(function(userCredential) {
                clearTimeout(timeout);
                console.log('✅ Login successful');
                
                successMsg.textContent = '✅ تم تسجيل الدخول بنجاح!';
                successMsg.style.display = 'block';
                loading.style.display = 'none';
                
                setTimeout(function() {
                    showDashboard(userCredential.user);
                }, 500);
            })
            .catch(function(error) {
                clearTimeout(timeout);
                console.error('❌ Login error:', error.code, error.message);
                
                let msg = '';
                switch(error.code) {
                    case 'auth/user-not-found':
                        msg = '❌ المستخدم غير موجود';
                        break;
                    case 'auth/wrong-password':
                        msg = '❌ كلمة المرور غير صحيحة';
                        break;
                    case 'auth/invalid-email':
                        msg = '❌ البريد غير صالح';
                        break;
                    case 'auth/too-many-requests':
                        msg = '⏳ محاولات كثيرة، انتظر دقيقة';
                        break;
                    case 'auth/network-request-failed':
                        msg = '🌐 خطأ في الاتصال<br>' +
                             '💡 استخدم VPN أو جرب لاحقاً';
                        break;
                    case 'auth/invalid-credential':
                        msg = '❌ بيانات الدخول غير صحيحة<br>' +
                             'تحقق من البريد وكلمة المرور';
                        break;
                    case 'auth/cors-unsupported':
                        msg = '️ مشكلة CORS - الملف محلي<br>' +
                             '💡 الحل: ارفع الملف على Netlify أو استخدم Local Server';
                        break;
                    default:
                        msg = '❌ ' + error.code + ': ' + error.message;
                }
                
                errorMsg.innerHTML = msg;
                errorMsg.style.display = 'block';
                loading.style.display = 'none';
                loginBtn.disabled = false;
            });
    }

    function showDashboard(user) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('userName').textContent = user.email.split('@')[0];
        document.getElementById('userRole').textContent = 'جاري التحميل...';

        if (!db) {
            document.getElementById('userRole').textContent = '👑 مدير (Firestore غير متوفر)';
            return;
        }

        const timeout = setTimeout(function() {
            console.log('⏰ Firestore timeout');
            document.getElementById('userRole').textContent = '👑 مدير (Firestore غير متاح)';
        }, 5000);

        db.collection('users').doc(user.uid).get()
            .then(function(doc) {
                clearTimeout(timeout);
                if (doc.exists) {
                    const data = doc.data();
                    console.log('✅ User data:', data);
                    const roles = { 
                        'admin': '👑 مدير عام', 
                        'collector': '💼 معتمد', 
                        'treasurer': '💰 أمين صندوق' 
                    };
                    document.getElementById('userRole').textContent = roles[data.role] || 'مستخدم';
                } else {
                    console.log('⚠️ Document not found');
                    document.getElementById('userRole').textContent = ' مدير (وثيقة غير موجودة)';
                }
            })
            .catch(function(error) {
                clearTimeout(timeout);
                console.error('❌ Firestore error:', error);
                document.getElementById('userRole').textContent = '👑 مدير (خطأ في Firestore)';
            });
    }

    function doLogout() {
        if (auth) {
            auth.signOut().then(function() {
                console.log('🚪 Logged out');
                location.reload();
            });
        } else {
            location.reload();
        }
    }

    // Enter key support
    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            doLogin();
        }
    });

    // عرض معلومات التشخيص
    window.addEventListener('load', function() {
        console.log('📱 Protocol:', window.location.protocol);
        console.log('🌐 URL:', window.location.href);
        console.log(' Firebase SDK loaded:', typeof firebase !== 'undefined');
    });
</script>

</body>
</html>
