<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d7377">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>زعورة v7.0 — إدارة المقبرة والعائلات</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --primary:#0d7377; --primary-2:#0f766e; --primary-soft:#ecfeff;
  --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --danger:#dc2626; --success:#16a34a;
  --warning:#f59e0b; --info:#2563eb;
  --radius:16px; --radius-sm:12px;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow:0 8px 24px rgba(15,23,42,.08);
  --safe:env(safe-area-inset-bottom,0);
}
[data-theme="dark"]{
  --bg:#0b1220; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
  --border:#334155; --primary-soft:#0f2e2e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  background:var(--bg);color:var(--text);direction:rtl;font-size:15px;line-height:1.5;
  min-height:100vh;padding-bottom:calc(78px + var(--safe));
  transition:background .2s,color .2s;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{outline:0}

/* ============ HEADER ============ */
.app-header{
  position:sticky;top:0;z-index:30;
  background:var(--card);border-bottom:1px solid var(--border);
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0));
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow-sm);
}
.app-header .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.app-header .logo{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;flex-shrink:0;
}
.app-header h1{font-size:15px;font-weight:800;line-height:1.1}
.app-header .sub{font-size:10px;color:var(--muted);font-weight:600}
.icon-btn{
  width:38px;height:38px;border-radius:12px;
  background:var(--bg);color:var(--text);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:.15s;flex-shrink:0;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn.primary{background:var(--primary);color:#fff}

/* ============ SEARCH ============ */
.search-wrap{padding:10px 12px 0;max-width:820px;margin:0 auto}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:10px 14px;
  box-shadow:var(--shadow-sm);
}
.search-box .ico{color:var(--muted);font-size:17px}
.search-box input{flex:1;background:none;border:0;font-size:15px;min-width:0}
.search-box .clear{color:var(--muted);font-size:18px;padding:4px}

/* ============ MAIN ============ */
main{max-width:820px;margin:0 auto;padding:12px}
.page{display:none;animation:fade .2s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ CARDS ============ */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:12px;
  box-shadow:var(--shadow-sm);
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:12px;
}
.card-head h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}

/* ============ STATS ============ */
.stats-scroll{
  display:flex;gap:10px;overflow-x:auto;
  margin:0 -12px 14px;padding:0 12px 6px;
  scroll-snap-type:x mandatory;scrollbar-width:none;
}
.stats-scroll::-webkit-scrollbar{display:none}
.stat{
  flex:0 0 auto;min-width:120px;scroll-snap-align:start;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.stat::before{
  content:'';position:absolute;top:0;right:0;
  width:4px;height:100%;background:var(--primary);
}
.stat.green::before{background:var(--success)}
.stat.red::before{background:var(--danger)}
.stat.orange::before{background:var(--warning)}
.stat.blue::before{background:var(--info)}
.stat .val{font-size:24px;font-weight:800;line-height:1.1;color:var(--primary)}
.stat.green .val{color:var(--success)}
.stat.red .val{color:var(--danger)}
.stat.orange .val{color:var(--warning)}
.stat.blue .val{color:var(--info)}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}

/* ============ LIST ============ */
.list{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);
}
.item{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:.15s;min-height:64px;
}
.item:last-child{border-bottom:0}
.item:active{background:var(--bg)}
.item .av{
  width:46px;height:46px;border-radius:13px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;background:var(--primary-soft);color:var(--primary);
  font-weight:800;
}
.item .av.green{background:#dcfce7;color:#166534}
.item .av.red{background:#fee2e2;color:#991b1b}
.item .av.orange{background:#fef3c7;color:#92400e}
.item .av.blue{background:#dbeafe;color:#1e40af}
.item .body{flex:1;min-width:0}
.item .ttl{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .trail{color:var(--muted);font-size:20px;font-weight:300;flex-shrink:0}

/* ============ BADGES ============ */
.badge{
  display:inline-flex;align-items:center;
  padding:2px 9px;border-radius:8px;
  font-size:10px;font-weight:700;white-space:nowrap;
}
.badge.success{background:#dcfce7;color:#166534}
.badge.danger{background:#fee2e2;color:#991b1b}
.badge.warning{background:#fef3c7;color:#92400e}
.badge.info{background:#dbeafe;color:#1e40af}
.badge.muted{background:#f1f5f9;color:#475569}

/* ============ FILTER CHIPS ============ */
.chips{
  display:flex;gap:6px;overflow-x:auto;
  padding-bottom:8px;margin-bottom:8px;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:7px 14px;border-radius:20px;
  background:var(--card);border:1px solid var(--border);
  font-size:12px;font-weight:700;color:var(--muted);transition:.15s;
}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:6px;padding:11px 18px;border-radius:13px;
  font-size:14px;font-weight:700;transition:.15s;
  min-height:44px;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff}
.btn.success{background:var(--success);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.warning{background:var(--warning);color:#fff}
.btn.info{background:var(--info);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:12px;border-radius:10px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ============ FAB ============ */
.fab{
  position:fixed;bottom:calc(88px + var(--safe));left:18px;
  width:56px;height:56px;border-radius:18px;
  background:var(--primary);color:#fff;
  font-size:26px;font-weight:300;
  box-shadow:0 10px 28px rgba(13,115,119,.4);
  z-index:25;display:flex;align-items:center;justify-content:center;
  transition:.15s;
}
.fab:active{transform:scale(.92)}

/* ============ BOTTOM NAV ============ */
.bnav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--card);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:6px 6px calc(6px + var(--safe));
  box-shadow:0 -4px 20px rgba(15,23,42,.05);
}
.bnav button{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:6px 2px;border-radius:12px;
  color:var(--muted);font-size:10px;font-weight:700;
  transition:.15s;position:relative;min-width:0;
}
.bnav button .i{font-size:22px;line-height:1;transition:.15s}
.bnav button.on{color:var(--primary)}
.bnav button.on .i{transform:scale(1.1)}
.bnav button .nb{
  position:absolute;top:3px;right:calc(50% - 18px);
  background:var(--danger);color:#fff;
  border-radius:10px;padding:0 5px;font-size:9px;
  font-weight:700;min-width:16px;text-align:center;
  line-height:16px;height:16px;
}

/* ============ SHEET (Bottom Sheet) ============ */
.sheet-back{
  position:fixed;inset:0;background:rgba(15,23,42,.55);
  z-index:90;opacity:0;pointer-events:none;transition:.2s;
  backdrop-filter:blur(3px);
}
.sheet-back.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:91;
  background:var(--card);
  border-radius:24px 24px 0 0;
  max-height:94vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding-bottom:calc(16px + var(--safe));
  box-shadow:0 -20px 60px rgba(15,23,42,.2);
}
.sheet.on{transform:translateY(0)}
.sheet-grip{
  width:44px;height:5px;background:var(--border);
  border-radius:3px;margin:12px auto 0;
}
.sheet-hd{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--card);z-index:2;
  border-radius:24px 24px 0 0;
}
.sheet-hd h2{font-size:16px;font-weight:800}
.sheet-bd{padding:16px 18px}
.sheet-ft{
  display:flex;gap:10px;padding:12px 18px;
  border-top:1px solid var(--border);
  position:sticky;bottom:0;background:var(--card);
}
.sheet-ft .btn{flex:1}

/* ============ FORM ============ */
.fld{margin-bottom:14px}
.fld label{
  display:block;font-size:12px;font-weight:700;
  color:var(--muted);margin-bottom:6px;
}
.fld label .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{
  width:100%;padding:12px 14px;
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:12px;font-size:15px;
  transition:.15s;font-family:inherit;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  border-color:var(--primary);background:var(--card);
  box-shadow:0 0 0 3px rgba(13,115,119,.12);
}
.fld textarea{resize:vertical;min-height:70px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld-row.three{grid-template-columns:1fr 1fr 1fr}
.fld-hint{font-size:11px;color:var(--muted);margin-top:4px}

/* ============ EMPTY ============ */
.empty{
  text-align:center;padding:50px 20px;
  color:var(--muted);
}
.empty .ico{font-size:52px;opacity:.4;display:block;margin-bottom:10px}
.empty h3{font-size:15px;font-weight:700;margin-bottom:4px}
.empty p{font-size:12px}

/* ============ TOAST ============ */
.toasts{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:9999;display:flex;flex-direction:column;gap:8px;
  pointer-events:none;width:calc(100% - 28px);max-width:400px;
}
.toast{
  background:var(--text);color:var(--card);
  padding:12px 18px;border-radius:14px;
  font-size:13px;font-weight:600;
  box-shadow:var(--shadow);
  animation:slideDown .25s ease;
  pointer-events:auto;
}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--danger);color:#fff}
.toast.warning{background:var(--warning);color:#fff}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* ============ LOADER ============ */
.loader{
  position:fixed;inset:0;background:rgba(15,23,42,.4);
  backdrop-filter:blur(3px);z-index:9998;
  display:none;align-items:center;justify-content:center;
}
.loader.on{display:flex}
.spin{
  width:38px;height:38px;border:3px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ VIEW MODES ============ */
.view-toggle{
  display:inline-flex;background:var(--bg);
  border-radius:10px;padding:3px;gap:2px;
}
.view-toggle button{
  padding:5px 10px;border-radius:8px;
  font-size:11px;font-weight:700;color:var(--muted);
  transition:.15s;
}
.view-toggle button.on{background:var(--card);color:var(--primary);box-shadow:var(--shadow-sm)}

/* Grid view for graves (audit mode) */
.grid-view{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
  gap:6px;
}
.gcell{
  background:var(--card);border:2px solid var(--border);
  border-radius:10px;padding:8px 6px;text-align:center;
  cursor:pointer;transition:.15s;
}
.gcell:active{transform:scale(.95)}
.gcell .n{font-weight:800;font-size:14px;color:var(--text)}
.gcell .o{font-size:9px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcell.occupied{border-color:var(--danger);background:#fef2f2}
.gcell.occupied .n{color:var(--danger)}
.gcell.available{border-color:var(--success);background:#f0fdf4}
.gcell.available .n{color:var(--success)}
.gcell.reuse{border-color:var(--warning);background:#fffbeb}
.gcell.reuse .n{color:var(--warning)}

/* Field builder */
.field-row-builder{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;background:var(--bg);
  border-radius:10px;margin-bottom:6px;
}
.field-row-builder .info{flex:1;min-width:0}
.field-row-builder .lbl{font-weight:700;font-size:13px}
.field-row-builder .sub{font-size:11px;color:var(--muted)}

/* Family tree (simple) */
.ftree{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0}
.ftree .gen{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ftree .person{
  background:var(--card);border:2px solid var(--primary);
  border-radius:24px;padding:6px 14px;
  font-size:12px;font-weight:700;
  display:flex;align-items:center;gap:6px;
  box-shadow:var(--shadow-sm);cursor:pointer;
}
.ftree .person.male{border-color:var(--info);background:#eff6ff;color:#1e3a8a}
.ftree .person.female{border-color:#ec4899;background:#fdf2f8;color:#831843}
.ftree .conn{width:2px;height:14px;background:var(--border)}
.ftree .lbl{font-size:10px;color:var(--muted);font-weight:700;text-align:center;margin:4px 0}

/* Print */
@media print{
  .app-header,.bnav,.fab,.search-wrap,.view-toggle,.chips{display:none!important}
  main{padding:0;max-width:100%}
  .card{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid}
  body{background:#fff}
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="app-header">
  <div class="brand">
    <div class="logo">🏘️</div>
    <div>
      <h1>زعورة</h1>
      <div class="sub" id="hdrSub">v7.0 — نظام إدارة المقبرة</div>
    </div>
  </div>
  <button class="icon-btn" onclick="toggleTheme()" title="الوضع">🌓</button>
  <button class="icon-btn" onclick="openSettings()" title="إعدادات">⚙️</button>
</header>

<!-- ===== SEARCH ===== -->
<div class="search-wrap">
  <div class="search-box">
    <span class="ico">🔍</span>
    <input id="globalSearch" placeholder="ابحث في كل شيء…" oninput="globalSearch(this.value)">
    <button class="clear" onclick="clearSearch()" style="display:none" id="searchClear">✕</button>
  </div>
</div>

<!-- ===== MAIN ===== -->
<main>

  <!-- ============ DASHBOARD ============ -->
  <section id="pg-home" class="page active">
    <div class="stats-scroll" id="homeStats"></div>

    <div class="card">
      <div class="card-head"><h2>⚡ إجراءات سريعة</h2></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn success" onclick="openBurialSheet()">📜 تسجيل دفن</button>
        <button class="btn primary" onclick="openGraveSheet()">➕ إضافة قبر</button>
        <button class="btn info" onclick="openPersonSheet()">👤 إضافة فرد</button>
        <button class="btn warning" onclick="startAuditMode()">🚶 وضع المسح</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>📊 توزيع القبور</h2>
        <span class="badge muted" id="graveTotalBadge">0</span>
      </div>
      <div id="graveDist"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>👨‍👩‍👧 أكبر العائلات</h2>
        <button class="btn ghost sm" onclick="go('pg-families')">الكل</button>
      </div>
      <div id="topFamilies"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>🕐 آخر النشاطات</h2></div>
      <div id="recentActs"></div>
    </div>
  </section>

  <!-- ============ GRAVES ============ -->
  <section id="pg-graves" class="page">
    <div class="stats-scroll" id="graveStats"></div>

    <div class="card" style="padding:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px">
        <div class="view-toggle">
          <button data-v="list" onclick="setGraveView('list')" id="gvList">📋 قائمة</button>
          <button data-v="grid" onclick="setGraveView('grid')" id="gvGrid">⊞ شبكة</button>
        </div>
        <div style="font-size:11px;color:var(--muted)" id="graveCounter"></div>
      </div>
      <div class="chips" id="graveChips"></div>
    </div>

    <div id="graveContent"></div>
  </section>

  <!-- ============ PEOPLE ============ -->
  <section id="pg-people" class="page">
    <div class="stats-scroll" id="peopleStats"></div>

    <div class="card" style="padding:12px">
      <div class="chips" id="peopleChips"></div>
    </div>

    <div id="peopleContent"></div>
  </section>

  <!-- ============ FAMILIES ============ -->
  <section id="pg-families" class="page">
    <div class="stats-scroll" id="familyStats"></div>

    <div class="card" style="padding:12px">
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button class="btn ghost sm" onclick="sortFamilies('size')" id="famSortSize">الأكبر أولاً</button>
        <button class="btn ghost sm" onclick="sortFamilies('name')" id="famSortName">أبجدي</button>
      </div>
    </div>

    <div id="familyContent"></div>
  </section>

  <!-- ============ BURIALS ============ -->
  <section id="pg-burials" class="page">
    <div class="stats-scroll" id="burialStats"></div>

    <div class="card" style="padding:12px">
      <div class="chips">
        <button class="chip on" onclick="setBurialYear('',this)">الكل</button>
        <button class="chip" onclick="setBurialYear(new Date().getFullYear(),this)">هذا العام</button>
        <button class="chip" onclick="setBurialYear(new Date().getFullYear()-1,this)">العام الماضي</button>
      </div>
    </div>

    <div id="burialContent"></div>
  </section>

</main>

<!-- ===== FAB ===== -->
<button class="fab" id="fab" onclick="handleFab()">+</button>

<!-- ===== BOTTOM NAV ===== -->
<nav class="bnav">
  <button data-pg="pg-home" class="on" onclick="go('pg-home')"><span class="i">🏠</span>الرئيسية</button>
  <button data-pg="pg-graves" onclick="go('pg-graves')"><span class="i">⚰️</span>القبور<span class="nb" id="nbGraves" style="display:none">0</span></button>
  <button data-pg="pg-people" onclick="go('pg-people')"><span class="i">👥</span>الأفراد</button>
  <button data-pg="pg-families" onclick="go('pg-families')"><span class="i">👨‍👩‍👧</span>العائلات</button>
  <button data-pg="pg-burials" onclick="go('pg-burials')"><span class="i">📜</span>الدفن</button>
</nav>

<!-- ===== SHEET ===== -->
<div class="sheet-back" id="sheetBack" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grip"></div>
  <div class="sheet-hd">
    <h2 id="sheetTitle">…</h2>
    <button class="icon-btn" onclick="closeSheet()">✕</button>
  </div>
  <div class="sheet-bd" id="sheetBody"></div>
  <div class="sheet-ft" id="sheetFoot"></div>
</div>

<div class="toasts" id="toasts"></div>
<div class="loader" id="loader"><div class="spin"></div></div>

<script>
/* ============================================================
   zَaoura v7.0 — Mobile-First Cemetery & Family Manager
   Architecture: IndexedDB + Modular Services + Sheet UI
   ============================================================ */
'use strict';

/* ---------- CONSTANTS ---------- */
const DB_NAME = 'zaoura_v7';
const DB_VER = 1;
const STORES = ['graves','people','burials','families','fields','settings','logs'];

const C = {
  GRAVE_TYPE: ['عام','خاص','عائلي'],
  GRAVE_STATUS: ['متاح','مشغول','إعادة استخدام','مهجور','مهدّم'],
  GENDER: ['ذكر','أنثى'],
  PERSON_STATUS: ['حي','متوفى','مسافر','غير معروف'],
  RELATION: ['رب أسرة','زوجة','زوج','ابن','بنت','أب','أم','أخ','أخت','جد','جدة','حفيد','حفيدة','أخرى']
};

/* ---------- STATE ---------- */
const S = {
  graves: [], people: [], burials: [], families: [],
  fields: [],
  settings: {},
  page: 'pg-home',
  graveView: 'list',
  graveFilter: 'all',
  peopleFilter: 'all',
  burialYear: '',
  familySort: 'size',
  editing: null, // {type, id}
  auditMode: false,
  auditQueue: []
};

/* ============================================================
   INDEXEDDB LAYER
   ============================================================ */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORES.forEach(n=>{ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:'id',autoIncrement:true}); });
    };
    r.onsuccess = ()=>{ db = r.result; res(db); };
    r.onerror = ()=> rej(r.error);
  });
}
const t = (s,m='readonly')=>db.transaction(s,m).objectStore(s);
const dbAll = s => new Promise((res,rej)=>{ const q=t(s).getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); });
const dbGet = (s,id) => new Promise((res,rej)=>{ const q=t(s).get(id); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
const dbPut = (s,o) => new Promise((res,rej)=>{ const q=t(s,'readwrite').put(o); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
const dbDel = (s,id) => new Promise((res,rej)=>{ const q=t(s,'readwrite').delete(id); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
const dbClear = s => new Promise((res,rej)=>{ const q=t(s,'readwrite').clear(); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });

/* ============================================================
   UTILITIES
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanName = v => String(v??'').trim().replace(/\s+/g,' ');
const normAr = v => String(v??'').toLowerCase().trim()
  .replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/[ىي]/g,'ي')
  .replace(/[ًٌٍَُِّْـ]/g,'');

const fmtDate = d => {
  if(!d) return '—';
  try { return new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'}); }
  catch(e){ return d; }
};
const calcAge = (birth, death, status) => {
  if(!birth) return '';
  if(!death && status === 'متوفى') return '';
  const b = new Date(birth); if(isNaN(b)) return '';
  const d = death ? new Date(death) : new Date();
  if(isNaN(d)) return '';
  let a = d.getFullYear() - b.getFullYear();
  if(d.getMonth()<b.getMonth() || (d.getMonth()===b.getMonth() && d.getDate()<b.getDate())) a--;
  return a>=0 ? a : '';
};
const addYears = (d,y) => {
  if(!d) return '';
  const dd = new Date(d+'T00:00:00'); if(isNaN(dd)) return '';
  dd.setFullYear(dd.getFullYear() + Number(y||10));
  return dd.toISOString().slice(0,10);
};
const toDate = v => {
  if(!v) return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number'){ const d = new Date((v-25569)*86400000); return isNaN(d)?'':d.toISOString().slice(0,10); }
  const s = String(v).trim();
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){ const [y,m,d]=s.split('-'); return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  const m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
};
const debounce = (fn,d=200) => { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),d); }; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const graveStatusOf = g => {
  if(!g) return 'متاح';
  if(g.status === 'مشغول' && g.availableDate && new Date(g.availableDate) <= new Date())
    return 'إعادة استخدام';
  return g.status || 'متاح';
};

const statusClass = s => {
  if(['متاح','فارغ'].includes(s)) return 'success';
  if(s === 'مشغول') return 'danger';
  if(s === 'إعادة استخدام') return 'warning';
  if(s === 'مهجور' || s === 'مهدّم') return 'muted';
  return 'muted';
};

/* ============================================================
   TOAST / LOADER
   ============================================================ */
function toast(msg, type='success', dur=2500){
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>el.remove(),300); }, dur);
}
const showLoad = v => $('loader').classList.toggle('on', v);

/* ============================================================
   SHEET (Bottom Sheet)
   ============================================================ */
function openSheet(title, bodyHTML, footHTML='', opts={}){
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = bodyHTML;
  $('sheetFoot').innerHTML = footHTML;
  $('sheetFoot').style.display = footHTML ? 'flex' : 'none';
  $('sheetBack').classList.add('on');
  $('sheet').classList.add('on');
  document.body.style.overflow = 'hidden';
  if(opts.focus){
    setTimeout(()=>{ const el = $(opts.focus); if(el) el.focus(); }, 250);
  }
}
function closeSheet(){
  $('sheetBack').classList.remove('on');
  $('sheet').classList.remove('on');
  document.body.style.overflow = '';
  S.editing = null;
}

/* ============================================================
   THEME
   ============================================================ */
function toggleTheme(){
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('zt', t);
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function go(page){
  S.page = page;
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === page));
  document.querySelectorAll('.bnav button').forEach(b => b.classList.toggle('on', b.dataset.pg === page));
  window.scrollTo(0,0);
  $('fab').style.display = (page === 'pg-home') ? 'none' : 'flex';
  if(page === 'pg-graves') renderGraves();
  if(page === 'pg-people') renderPeople();
  if(page === 'pg-families') renderFamilies();
  if(page === 'pg-burials') renderBurials();
}

function handleFab(){
  if(S.page === 'pg-graves') openGraveSheet();
  else if(S.page === 'pg-people') openPersonSheet();
  else if(S.page === 'pg-families') openFamilySheet();
  else if(S.page === 'pg-burials') openBurialSheet();
}

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadAll(){
  const [graves, people, burials, families, fields] = await Promise.all([
    dbAll('graves'), dbAll('people'), dbAll('burials'), dbAll('families'), dbAll('fields')
  ]);
  S.graves = graves.sort((a,b) => String(a.number||'').localeCompare(String(b.number||''),'ar',{numeric:true}));
  S.people = people.sort((a,b) => String(a.name||'').localeCompare(String(b.name||''),'ar'));
  S.burials = burials.sort((a,b) => (b.burialDate||'').localeCompare(a.burialDate||''));
  S.families = families.sort((a,b) => String(a.name||'').localeCompare(String(b.name||''),'ar'));
  S.fields = fields;
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderHome(){
  const G = S.graves, P = S.people, B = S.burials, F = S.families;
  const occupied = G.filter(g => graveStatusOf(g) === 'مشغول').length;
  const available = G.filter(g => ['متاح'].includes(graveStatusOf(g))).length;
  const reuse = G.filter(g => graveStatusOf(g) === 'إعادة استخدام').length;
  const privateG = G.filter(g => g.type === 'خاص').length;
  const publicG = G.filter(g => g.type === 'عام').length;

  $('homeStats').innerHTML = `
    <div class="stat"><div class="val">${G.length}</div><div class="lbl">⚰️ إجمالي القبور</div></div>
    <div class="stat red"><div class="val">${occupied}</div><div class="lbl">🪦 مشغولة</div></div>
    <div class="stat green"><div class="val">${available}</div><div class="lbl">🕊️ متاحة</div></div>
    <div class="stat orange"><div class="val">${reuse}</div><div class="lbl">🔄 للإعادة</div></div>
    <div class="stat blue"><div class="val">${P.length}</div><div class="lbl">👥 الأفراد</div></div>
    <div class="stat"><div class="val">${F.length}</div><div class="lbl">👨‍👩‍👧 العائلات</div></div>
    <div class="stat"><div class="val">${B.length}</div><div class="lbl">📜 سجلات الدفن</div></div>
  `;

  $('graveTotalBadge').textContent = G.length + ' قبر';

  // توزيع القبور
  const dist = [
    { l:'عام', v: publicG, c:'blue' },
    { l:'خاص', v: privateG, c:'orange' },
    { l:'مشغول', v: occupied, c:'red' },
    { l:'متاح', v: available, c:'green' }
  ];
  $('graveDist').innerHTML = dist.map(d => {
    const pct = G.length ? Math.round(d.v/G.length*100) : 0;
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px">
        <span>${d.l}</span>
        <span>${d.v} (${pct}%)</span>
      </div>
      <div style="background:var(--bg);height:8px;border-radius:4px;overflow:hidden">
        <div style="height:100%;background:var(--${d.c==='blue'?'info':d.c});width:${pct}%;border-radius:4px;transition:.4s"></div>
      </div>
    </div>`;
  }).join('');

  // أكبر العائلات
  const famCounts = S.families.map(f => ({
    ...f,
    members: S.people.filter(p => p.familyId === f.id).length
  })).sort((a,b) => b.members - a.members).slice(0,5);

  $('topFamilies').innerHTML = famCounts.length ? famCounts.map(f => `
    <div class="item" onclick="openFamilyView(${f.id})">
      <div class="av">👨‍👩‍👧</div>
      <div class="body">
        <div class="ttl">${esc(f.name||'')}</div>
        <div class="sub">${f.members} فرد${f.code?' • '+esc(f.code):''}</div>
      </div>
      <span class="trail">›</span>
    </div>
  `).join('') : emptySmall('لا توجد عائلات بعد');

  // آخر النشاطات (من سجلات الدفن الأخيرة)
  const recent = S.burials.slice(0,5);
  $('recentActs').innerHTML = recent.length ? recent.map(b => `
    <div class="item" onclick="openBurialView(${b.id})">
      <div class="av red">🪦</div>
      <div class="body">
        <div class="ttl">${esc(b.personName||'')}</div>
        <div class="sub">${esc(b.graveNumber||'')} • ${fmtDate(b.burialDate)}</div>
      </div>
      <span class="trail">›</span>
    </div>
  `).join('') : emptySmall('لا توجد سجلات دفن بعد');

  updateNavBadges();
}

const emptySmall = msg => `<div style="text-align:center;padding:16px;color:var(--muted);font-size:12px">${msg}</div>`;

function updateNavBadges(){
  const nb = $('nbGraves');
  if(S.graves.length){
    nb.style.display = 'block';
    nb.textContent = S.graves.length > 999 ? '999+' : S.graves.length;
  } else nb.style.display = 'none';
}

/* ============================================================
   GRAVES
   ============================================================ */
function setGraveView(v){
  S.graveView = v;
  $('gvList').classList.toggle('on', v==='list');
  $('gvGrid').classList.toggle('on', v==='grid');
  renderGraves();
}

function filterGraves(q){
  const s = q ? normAr(q) : '';
  return S.graves.filter(g => {
    if(s){
      const hay = normAr(`${g.number||''} ${g.owner||''} ${g.location||''} ${g.lastBuried||''} ${g.section||''}`);
      if(!hay.includes(s)) return false;
    }
    const st = graveStatusOf(g);
    if(S.graveFilter === 'occupied' && st !== 'مشغول') return false;
    if(S.graveFilter === 'available' && st !== 'متاح') return false;
    if(S.graveFilter === 'reuse' && st !== 'إعادة استخدام') return false;
    if(S.graveFilter === 'private' && g.type !== 'خاص') return false;
    if(S.graveFilter === 'public' && g.type !== 'عام') return false;
    return true;
  });
}

function renderGraves(){
  // Stats
  const G = S.graves;
  const occupied = G.filter(g => graveStatusOf(g) === 'مشغول').length;
  const available = G.filter(g => graveStatusOf(g) === 'متاح').length;
  const reuse = G.filter(g => graveStatusOf(g) === 'إعادة استخدام').length;
  const priv = G.filter(g => g.type === 'خاص').length;
  $('graveStats').innerHTML = `
    <div class="stat"><div class="val">${G.length}</div><div class="lbl">الإجمالي</div></div>
    <div class="stat red"><div class="val">${occupied}</div><div class="lbl">مشغول</div></div>
    <div class="stat green"><div class="val">${available}</div><div class="lbl">متاح</div></div>
    <div class="stat orange"><div class="val">${reuse}</div><div class="lbl">إعادة</div></div>
    <div class="stat blue"><div class="val">${priv}</div><div class="lbl">خاص</div></div>
  `;

  // Chips
  const chips = [
    { k:'all', l:'الكل' },
    { k:'occupied', l:'🪦 مشغولة' },
    { k:'available', l:'🕊️ متاحة' },
    { k:'reuse', l:'🔄 إعادة' },
    { k:'private', l:'👤 خاصة' },
    { k:'public', l:'🏛️ عامة' }
  ];
  $('graveChips').innerHTML = chips.map(c => 
    `<button class="chip ${S.graveFilter===c.k?'on':''}" onclick="setGraveFilter('${c.k}')">${c.l}</button>`
  ).join('');

  // Content
  const list = filterGraves($('globalSearch').value);
  $('graveCounter').textContent = `${list.length} قبر`;

  const el = $('graveContent');
  if(!list.length){
    el.innerHTML = emptyState('⚰️','لا توجد قبور','أضف قبراً جديداً للبدء');
    return;
  }

  if(S.graveView === 'grid'){
    el.innerHTML = `<div class="card" style="padding:12px">
      <div class="grid-view">${list.map(g => {
        const st = graveStatusOf(g);
        const cls = st==='مشغول'?'occupied' : st==='متاح'?'available' : 'reuse';
        return `<div class="gcell ${cls}" onclick="openGraveSheet(${g.id})">
          <div class="n">${esc(g.number||'?')}</div>
          <div class="o">${esc((g.owner||'').slice(0,10)||'—')}</div>
        </div>`;
      }).join('')}</div></div>`;
  } else {
    el.innerHTML = `<div class="list">${list.map(g => {
      const st = graveStatusOf(g);
      const cls = st==='مشغول'?'red' : st==='متاح'?'green' : 'orange';
      const icon = st==='مشغول'?'🪦' : st==='متاح'?'🕊️' : '🔄';
      return `<div class="item" onclick="openGraveSheet(${g.id})">
        <div class="av ${cls}">${icon}</div>
        <div class="body">
          <div class="ttl">قبر ${esc(g.number||'')} <span class="badge ${statusClass(st)}">${st}</span></div>
          <div class="sub">${esc(g.owner||'بدون مالك')}${g.location?' • '+esc(g.location):''}</div>
        </div>
        <span class="trail">›</span>
      </div>`;
    }).join('')}</div>`;
  }
}

function setGraveFilter(k){
  S.graveFilter = k;
  renderGraves();
}

/* ============================================================
   GRAVE FORM (Bottom Sheet)
   ============================================================ */
function openGraveSheet(id){
  const isNew = !id;
  const g = isNew ? { status:'متاح', type:'عام', years:10 } : S.graves.find(x => x.id === id);
  if(!g) return;
  S.editing = { type:'grave', id: isNew ? null : id };

  const customFields = S.fields.filter(f => f.entity === 'grave');
  const body = `
    <div class="fld">
      <label>رقم القبر <span class="req">*</span></label>
      <input id="gNumber" value="${esc(g.number||'')}" placeholder="مثال: 125" inputmode="text">
    </div>
    <div class="fld-row">
      <div class="fld"><label>النوع</label>
        <select id="gType">${C.GRAVE_TYPE.map(t => `<option ${g.type===t?'selected':''}>${t}</option>`).join('')}</select>
      </div>
      <div class="fld"><label>الحالة</label>
        <select id="gStatus">${C.GRAVE_STATUS.map(t => `<option ${g.status===t?'selected':''}>${t}</option>`).join('')}</select>
      </div>
    </div>
    <div class="fld-row">
      <div class="fld"><label>القطاع / الصف</label>
        <input id="gSection" value="${esc(g.section||'')}" placeholder="مثال: A1">
      </div>
      <div class="fld"><label>الموقع الدقيق</label>
        <input id="gLocation" value="${esc(g.location||'')}" placeholder="مثال: شرق المسجد">
      </div>
    </div>
    <div class="fld"><label>المالك / العائلة</label>
      <input id="gOwner" value="${esc(g.owner||'')}" placeholder="اسم صاحب القبر">
    </div>
    <div class="fld"><label>آخر مدفون</label>
      <input id="gLastBuried" value="${esc(g.lastBuried||'')}" placeholder="اسم آخر متوفى">
    </div>
    <div class="fld-row">
      <div class="fld"><label>تاريخ آخر دفن</label>
        <input id="gLastBurialDate" type="date" value="${esc(g.lastBurialDate||'')}">
      </div>
      <div class="fld"><label>سنوات الإعادة</label>
        <input id="gYears" type="number" inputmode="numeric" value="${g.years||10}">
      </div>
    </div>
    <div class="fld"><label>تاريخ الإتاحة (تلقائي)</label>
      <input id="gAvailableDate" type="date" value="${esc(g.availableDate||'')}" readonly style="background:var(--primary-soft)">
      <div class="fld-hint">يُحسب من تاريخ آخر دفن + سنوات الإعادة</div>
    </div>
    <div class="fld"><label>ملاحظات</label>
      <textarea id="gNotes" placeholder="أي تفاصيل إضافية…">${esc(g.notes||'')}</textarea>
    </div>
    ${customFields.length ? `<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
      <div style="font-weight:800;font-size:13px;margin-bottom:10px">⚙️ حقول مخصصة</div>
      ${customFields.map(f => renderCustomField(f, g.custom?.[f.key])).join('')}
    </div>` : ''}
  `;

  const foot = isNew
    ? `<button class="btn ghost" onclick="closeSheet()">إلغاء</button>
       <button class="btn primary" onclick="saveGrave()">💾 حفظ</button>`
    : `<button class="btn danger sm" onclick="deleteGrave(${id})">🗑️</button>
       <button class="btn ghost" onclick="closeSheet()">إلغاء</button>
       <button class="btn primary" onclick="saveGrave(${id})">💾 حفظ</button>`;

  openSheet(isNew ? '➕ إضافة قبر' : '✏️ تعديل قبر ' + (g.number||''), body, foot, {focus:'gNumber'});

  // Auto-calc availableDate
  const calc = () => {
    const d = $('gLastBurialDate').value;
    const y = Number($('gYears').value)||10;
    $('gAvailableDate').value = d ? addYears(d,y) : '';
  };
  $('gLastBurialDate').addEventListener('change', calc);
  $('gYears').addEventListener('input', calc);
}

function renderCustomField(f, val){
  val = val ?? '';
  if(f.type === 'select'){
    return `<div class="fld"><label>${esc(f.label)}</label>
      <select data-cf="${esc(f.key)}">
        <option value="">— اختر —</option>
        ${(f.options||[]).map(o => `<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select></div>`;
  }
  if(f.type === 'textarea'){
    return `<div class="fld"><label>${esc(f.label)}</label>
      <textarea data-cf="${esc(f.key)}">${esc(val)}</textarea></div>`;
  }
  const type = f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
  return `<div class="fld"><label>${esc(f.label)}</label>
    <input data-cf="${esc(f.key)}" type="${type}" value="${esc(val)}"></div>`;

   ============================================================ */
function filterPeople(q){
  const s = q ? normAr(q) : '';
  return S.people.filter(p => {
    if(s){
      const hay = normAr(`${p.name||''} ${p.phone||''} ${p.sector||''} ${p.relation||''}`);
      if(!hay.includes(s)) return false;
    }
    if(S.peopleFilter === 'alive' && p.status !== 'حي') return false;
    if(S.peopleFilter === 'dead' && p.status !== 'متوفى') return false;
    if(S.peopleFilter === 'male' && p.gender !== 'ذكر') return false;
    if(S.peopleFilter === 'female' && p.gender !== 'أنثى') return false;
    return true;
  });
}

function renderPeople(){
  const P = S.people;
  const alive = P.filter(p => p.status === 'حي').length;
  const dead = P.filter(p => p.status === 'متوفى').length;
  const male = P.filter(p => p.gender === 'ذكر').length;
  const female = P.filter(p => p.gender === 'أنثى').length;

  $('peopleStats').innerHTML = `
    <div class="stat"><div class="val">${P.length}</div><div class="lbl">الإجمالي</div></div>
    <div class="stat green"><div class="val">${alive}</div><div class="lbl">أحياء</div></div>
    <div class="stat red"><div class="val">${dead}</div><div class="lbl">متوفون</div></div>
    <div class="stat blue"><div class="val">${male}</div><div class="lbl">ذكور</div></div>
    <div class="stat orange"><div class="val">${female}</div><div class="lbl">إناث</div></div>
  `;

  const chips = [
    { k:'all', l:'الكل' },
    { k:'alive', l:'🟢 أحياء' },
    { k:'dead', l:'🔴 متوفون' },
    { k:'male', l:'♂ ذكور' },
    { k:'female', l:'♀ إناث' }
  ];
  $('peopleChips').innerHTML = chips.map(c =>
    `<button class="chip ${S.peopleFilter===c.k?'on':''}" onclick="setPeopleFilter('${c.k}')">${c.l}</button>`
  ).join('');

  const list = filterPeople($('globalSearch').value);
  const el = $('peopleContent');
  if(!list.length){
    el.innerHTML = emptyState('👥','لا يوجد أفراد','أضف فرداً جديداً للبدء');
    return;
  }

  el.innerHTML = `<div class="list">${list.slice(0,300).map(p => {
    const fam = S.families.find(f => f.id === p.familyId);
    const age = calcAge(p.birth, p.death, p.status);
    const isDead = p.status === 'متوفى';
    const genderIcon = p.gender === 'أنثى' ? '👩' : '👨';
    return `<div class="item" onclick="openPersonSheet(${p.id})">
      <div class="av ${isDead?'red':(p.gender==='أنثى'?'orange':'')}">${isDead?'⚰️':genderIcon}</div>
      <div class="body">
        <div class="ttl">${esc(p.name||'')}</div>
        <div class="sub">${fam?esc(fam.name)+' • ':''}${age?age+' سنة • ':''}${esc(p.relation||p.status||'')}</div>
      </div>
      <span class="trail">›</span>
    </div>`;
  }).join('')}</div>
  ${list.length>300?`<div style="text-align:center;padding:14px;font-size:12px;color:var(--muted)">يتم عرض أول 300 من ${list.length}. استخدم البحث.</div>`:''}`;

async function savePerson(id){
  const name = cleanName($('pName').value);

  };

async function deletePerson(id){
  if(!confirm('حذف هذا الفرد نهائياً؟')) return;
  // إلغاء الروابط
  const rel = S.people.filter(x => x.fatherId===id || x.motherId===id);
  if(rel.length && !confirm(`مرتبط بـ ${rel.length} من الأبناء. متابعة؟`)) return;
  for(const c of rel){
    if(c.fatherId===id){ c.fatherId=null; await dbPut('people',c); }
    if(c.motherId===id){ c.motherId=null; await dbPut('people',c); }
  }
  await dbDel('people', id);
  await loadAll();
  closeSheet();
  toast('🗑️ تم الحذف');
  renderPeople();
  renderHome();
}

    : `<button class="btn danger sm" onclick="deleteBurial(${id})">🗑️</button>
       <button class="btn ghost" onclick="closeSheet()">إلغاء</button>
       <button class="btn success" onclick="saveBurial(${id})">💾 حفظ</button>`;

  openSheet(isNew ? '📜 تسجيل دفن' : '✏️ تعديل سجل', body, foot, {focus:'bPersonName'});

  // Auto-fill age from selected person
  $('bPersonId').addEventListener('change', () => {
    const pid = Number($('bPersonId').value);
    if(!pid) return;
    const p = S.people.find(x => x.id === pid);
    if(!p) return;
    if(!$('bPersonName').value) $('bPersonName').value = p.name;
    if(p.birth && !$('bAge').value){
      const age = calcAge(p.birth, $('bDeathDate').value || new Date(), 'متوفى');
      if(age) $('bAge').value = age;
    }
  });
}

async function saveBurial(id){
  const personName = cleanName($('bPersonName').value);
  const graveId = Number($('bGraveId').value);
  const burialDate = $('bBurialDate').value;
  if(!personName){ toast('اسم المتوفى مطلوب','error'); return; }
  if(!graveId){ toast('اختر القبر','error'); return; }
  if(!burialDate){ toast('تاريخ الدفن مطلوب','error'); return; }

  const grave = S.graves.find(g => g.id === graveId);
  const years = Number($('bYears').value)||grave.years||10;

  const obj = {
    personId: $('bPersonId').value ? Number($('bPersonId').value) : null,
    personName,
    graveId,
    graveNumber: grave.number,
    deathDate: $('bDeathDate').value,
    burialDate,
    age: $('bAge').value,
    years,
    source: $('bSource').value,
    notes: $('bNotes').value.trim(),
    year: new Date(burialDate).getFullYear(),
    updatedAt: new Date().toISOString()
  };

  try{
    if(id) obj.id = id;
    else obj.createdAt = new Date().toISOString();
    await dbPut('burials', obj);

    // تحديث القبر
    const gUpd = { ...grave };
    gUpd.status = 'مشغول';
    gUpd.lastBuried = personName;
    gUpd.lastBurialDate = burialDate;
    gUpd.availableDate = addYears(burialDate, years);
    await dbPut('graves', gUpd);

    await loadAll();
    closeSheet();
    toast('📜 تم تسجيل الدفن');
    renderBurials();
    renderHome();
    renderGraves();
  }catch(e){ toast('خطأ: '+e.message,'error'); }
}

async function deleteBurial(id){
  if(!confirm('حذف هذا السجل؟')) return;
  await dbDel('burials', id);
  await loadAll();
  closeSheet();
  toast('🗑️ تم الحذف');
  renderBurials();
  renderHome();
}

async function saveField(){
  const label = cleanName($('fldLabel').value);
  if(!label){ toast('الاسم مطلوب','error'); return; }
  const entity = $('fldEntity').value;
  const type = $('fldType').value;
  const options = type === 'select' ? $('fldOptions').value.split(',').map(x => x.trim()).filter(Boolean) : [];
  const obj = {
    key: 'cf_' + uid(),
    label,
    entity,
    type,
    options,
    createdAt: new Date().toISOString()
  };
  await dbPut('fields', obj);
  await loadAll();
  closeSheet();
  toast('✅ تمت إضافة الحقل');
  openSettings();
}

function startAuditMode(){
  if(!S.graves.length){ toast('لا توجد قبور لمسحها','warning'); return; }
  S.auditQueue = S.graves.filter(g => graveStatusOf(g) === 'متاح').map(g => g.id);
  if(!S.auditQueue.length) S.auditQueue = S.graves.map(g => g.id);
  S.auditIndex = 0;
  go('pg-graves');
  S.graveView = 'grid';
  setGraveView('grid');
  renderGraves();
  toast(`🚶 وضع المسح: ${S.auditQueue.length} قبر جاهز`, 'success', 4000);
}

/* ============================================================
   EXPORTS
   ============================================================ */
function exportExcel(){
  const wb = XLSX.utils.book_new();
  // Graves
  const graves = S.graves.map(g => ({
    'رقم القبر': g.number, 'النوع': g.type, 'الحالة': graveStatusOf(g),
    'القطاع': g.section||'', 'الموقع': g.location||'', 'المالك': g.owner||'',
    'آخر مدفون': g.lastBuried||'', 'تاريخ آخر دفن': g.lastBurialDate||'',
    'تاريخ الإتاحة': g.availableDate||'', 'ملاحظات': g.notes||'',
    ...(g.custom||{})
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(graves), 'القبور');
  // People
  const people = S.people.map(p => ({
    'الاسم': p.name, 'الجنس': p.gender, 'الحالة': p.status,
    'العائلة': S.families.find(f=>f.id===p.familyId)?.name||'',
    'الصلة': p.relation||'', 'الميلاد': p.birth||'', 'الوفاة': p.death||'',
    'العمر': calcAge(p.birth,p.death,p.status), 'الهاتف': p.phone||'',
    'القطاع': p.sector||'', 'ملاحظات': p.notes||'',
    ...(p.custom||{})
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(people), 'الأفراد');
  // Families
  const fams = S.families.map(f => ({
    'الاسم': f.name, 'الرمز': f.code||'',
    'عدد الأفراد': S.people.filter(p=>p.familyId===f.id).length,
    'القرية': f.village||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(fams), 'العائلات');
  // Burials
  const b = S.burials.map(x => ({
    'المتوفى': x.personName, 'القبر': x.graveNumber,
    'الوفاة': x.deathDate||'', 'الدفن': x.burialDate||'',
    'العمر': x.age||'', 'المصدر': x.source||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(b), 'الدفن');

  XLSX.writeFile(wb, `زعورة_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('📊 تم تصدير Excel');
}

function exportBackup(){
  const data = { version:'7.0', date: new Date().toISOString(), data: {
    graves: S.graves, people: S.people, burials: S.burials,
    families: S.families, fields: S.fields
  }};
  const blob = new Blob([JSON.stringify(data,null,2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `zaoura_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('💾 تم التصدير');
}

function importBackupClick(){ $('fileBackup').click(); }

async function importBackupFile(input){
  const file = input.files[0]; if(!file) return;
  const text = await file.text();
  try{
    const parsed = JSON.parse(text);
    const d = parsed.data || parsed;
    if(!d.people && !d.graves) throw new Error('ملف غير صالح');
    if(!confirm('سيتم دمج البيانات. متابعة؟')){ input.value=''; return; }
    // Simple merge by fingerprint
    const gFp = new Set(S.graves.map(g=>normAr(`${g.number}|${g.location||''}`)));
    const pFp = new Set(S.people.map(p=>normAr(`${p.name}|${p.birth||''}`)));
    const fFp = new Set(S.families.map(f=>normAr(f.name)));
    let added = 0;
    for(const g of (d.graves||[])){
      if(gFp.has(normAr(`${g.number}|${g.location||''}`))) continue;
      delete g.id; await dbPut('graves', g); added++;
    }
    for(const p of (d.people||[])){
      if(pFp.has(normAr(`${p.name}|${p.birth||''}`))) continue;
      delete p.id; await dbPut('people', p); added++;
    }
    for(const f of (d.families||[])){
      if(fFp.has(normAr(f.name))) continue;
      delete f.id; await dbPut('families', f); added++;
    }
    for(const b of (d.burials||[])){ delete b.id; await dbPut('burials', b); }
    for(const fl of (d.fields||[])){ delete fl.id; await dbPut('fields', fl); }
    await loadAll();
    closeSheet();
    toast(`✅ تم دمج ${added} سجل`);
    renderAll();
  }catch(e){ toast('خطأ: '+e.message,'error'); }
  input.value = '';
}

async function clearAllData(){
  if(!confirm('حذف كل البيانات نهائياً؟')) return;
  if(!confirm('تأكيد أخير — لا يمكن التراجع!')) return;
  for(const s of STORES){ await dbClear(s); }
  await loadAll();
  closeSheet();
  toast('🗑️ تم حذف كل البيانات', 'warning');
  renderAll();
}

/* ============================================================
   SHARE TO WHATSAPP
   ============================================================ */
function shareFamily(id){
  const f = S.families.find(x => x.id === id);
  if(!f) return;
  const members = S.people.filter(p => p.familyId === id);
  let txt = `*${f.name}*\n`;
  if(f.code) txt += `الرمز: ${f.code}\n`;
  txt += `\n*أفراد العائلة (${members.length}):*\n`;
  members.slice(0,50).forEach((p,i) => {
    txt += `${i+1}. ${p.name}${p.relation?' ('+p.relation+')':''}${p.status==='متوفى'?' ⚰️':''}\n`;
  });
  if(members.length > 50) txt += `\n... و${members.length-50} آخرين`;
  txt += `\n\n_زعورة v7.0_`;
  const url = `https://wa.me/?text=${encodeURIComponent(txt)}`;
  window.open(url, '_blank');
}

function shareBurialWA(id){
  const b = S.burials.find(x => x.id === id);
  if(!b) return;
  const txt = `🪦 *سجل دفن*\n\n*الاسم:* ${b.personName}\n*القبر:* ${b.graveNumber}\n*تاريخ الدفن:* ${b.burialDate}\n${b.age?'*العمر:* '+b.age+' سنة\n':''}${b.notes?'\n_'+b.notes+'_':''}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}
