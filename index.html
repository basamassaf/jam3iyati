<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قرية زعورة - شجرة العائلة والمقبرة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; padding: 10px; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        
        .header { background: linear-gradient(135deg, #2c3e50 0%, #4a6274 100%); color: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
        .header h1 { font-size: 22px; margin-bottom: 5px; }
        .header p { font-size: 13px; opacity: 0.9; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 3px solid #e0e0e0; flex-wrap: wrap; }
        .tab { padding: 10px 15px; cursor: pointer; border: none; background: none; font-size: 13px; font-weight: bold; color: #7f8c8d; border-bottom: 3px solid transparent; margin-bottom: -3px; }
        .tab.active { color: #2c3e50; border-bottom-color: #667eea; }
        .tab:hover { background: #f5f5f5; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 15px; }
        .stat-box { padding: 10px; border-radius: 8px; text-align: center; color: white; cursor: pointer; transition: all 0.3s; }
        .stat-box:hover { transform: translateY(-2px); }
        .stat-box h3 { font-size: 22px; margin-bottom: 3px; }
        .stat-box p { font-size: 11px; opacity: 0.9; }
        .stat-total { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .stat-occupied { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        .stat-available { background: linear-gradient(135deg, #27ae60 0%, #229954 100%); }
        .stat-empty { background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%); }
        .stat-families { background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); }
        .stat-alive { background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%); }
        .stat-deceased { background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); }
        
        .search-box { margin-bottom: 10px; }
        .search-box input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 14px; }
        .search-box input:focus { outline: none; border-color: #667eea; }
        
        .filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .filters select { flex: 1; min-width: 100px; padding: 7px; border: 2px solid #ddd; border-radius: 6px; font-size: 12px; }
        
        /* شجرة العائلة */
        .tree-family { background: #fff8e7; padding: 12px; border-radius: 8px; margin-bottom: 12px; border-right: 4px solid #f39c12; }
        .tree-family h3 { color: #856404; margin-bottom: 8px; font-size: 15px; }
        .tree-grandparents { background: #e8f5e9; padding: 8px; border-radius: 6px; margin-bottom: 8px; border-right: 3px solid #27ae60; }
        .tree-grandparents h4 { color: #2e7d32; font-size: 12px; margin-bottom: 5px; }
        .tree-couple { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
        .tree-person { background: white; padding: 6px 10px; border-radius: 6px; border: 2px solid #667eea; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .tree-person:hover { background: #667eea; color: white; }
        .tree-person.deceased { border-color: #2c3e50; background: #f0f0f0; }
        .tree-person.head { background: #667eea; color: white; }
        .tree-children { background: #f8f9fa; padding: 8px; border-radius: 6px; margin-top: 8px; }
        .tree-children h4 { font-size: 12px; color: #667eea; margin-bottom: 5px; }
        .tree-children-list { display: flex; flex-wrap: wrap; gap: 5px; }
        .child-card { background: white; padding: 4px 8px; border-radius: 4px; border-right: 2px solid #3498db; font-size: 11px; cursor: pointer; }
        .child-card:hover { background: #3498db; color: white; }
        .child-card.deceased { border-right-color: #2c3e50; background: #f0f0f0; }
        .connector { text-align: center; color: #667eea; font-size: 16px; margin: 3px 0; }
        
        /* القبور */
        .grave-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
        .grave-card { background: white; border: 2px solid #ddd; border-radius: 6px; padding: 8px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .grave-card:hover { transform: translateY(-2px); box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
        .grave-card.occupied { border-color: #e74c3c; background: #fdf2f2; }
        .grave-card.available { border-color: #27ae60; background: #f2fdf2; }
        .grave-card.empty { border-color: #95a5a6; background: #f9f9f9; border-style: dashed; }
        .grave-card.private { border-color: #f39c12; }
        .grave-number { font-weight: bold; font-size: 14px; color: #2c3e50; }
        .grave-status { font-size: 10px; margin-top: 3px; }
        .grave-type { font-size: 9px; color: #7f8c8d; }
        .grave-name { font-size: 10px; color: #2c3e50; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* العائلات */
        .family-card { background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 8px; border-right: 4px solid #667eea; cursor: pointer; }
        .family-card:hover { background: #e9ecef; }
        .family-card h4 { color: #2c3e50; font-size: 14px; margin-bottom: 3px; }
        .family-card p { color: #7f8c8d; font-size: 11px; margin: 2px 0; }
        
        .section-block { background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-right: 4px solid #667eea; }
        .section-block h3 { color: #2c3e50; margin-bottom: 8px; font-size: 14px; }
        
        .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; margin: 2px; }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-info { background: #3498db; color: white; }
        .btn-small { padding: 4px 8px; font-size: 11px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 10px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 15px; border-radius: 10px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .close-btn { background: none; border: none; font-size: 22px; cursor: pointer; }
        
        .form-group { margin-bottom: 8px; }
        .form-group label { display: block; margin-bottom: 3px; font-weight: bold; font-size: 12px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 6px; border: 2px solid #ddd; border-radius: 5px; font-size: 13px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; font-size: 11px; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-color { width: 15px; height: 15px; border-radius: 3px; }
        
        .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; margin: 1px; }
        .badge-active { background: #d4edda; color: #155724; }
        .badge-deceased { background: #343a40; color: #fff; }
        .badge-young { background: #d1ecf1; color: #0c5460; }
        
        .results-count { background: #e3f2fd; padding: 6px; border-radius: 5px; margin-bottom: 10px; text-align: center; font-size: 12px; color: #1976d2; }
        
        .export-buttons { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .export-buttons button { flex: 1; min-width: 100px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏛️ قرية زعورة</h1>
        <p>شجرة العائلة والمقبرة - نظام متكامل</p>
    </div>
    
    <div class="tabs">
        <button class="tab active" onclick="switchTab('tree')">🌳 شجرة العائلة</button>
        <button class="tab" onclick="switchTab('cemetery')">⚰️ المقبرة</button>
        <button class="tab" onclick="switchTab('families')">👪 العائلات</button>
        <button class="tab" onclick="switchTab('stats')">📊 إحصائيات</button>
    </div>
    
    <!-- شجرة العائلة -->
    <div id="tree" class="tab-content active">
        <div class="search-box">
            <input type="text" id="treeSearch" placeholder="🔍 ابحث عن عائلة أو شخص..." oninput="searchTree()">
        </div>
        <div class="filters">
            <select id="filterTreeSector" onchange="filterTree()">
                <option value="">كل القطاعات</option>
                <option value="الجبل">الجبل</option>
                <option value="الحارة1">الحارة 1</option>
                <option value="الحارة2">الحارة 2</option>
                <option value="الوادي">الوادي</option>
                <option value="المنصورة">المنصورة</option>
                <option value="دمر">دمر</option>
            </select>
            <select id="filterTreeFamily" onchange="filterTree()">
                <option value="">كل العائلات</option>
            </select>
        </div>
        <div class="export-buttons">
            <button class="btn btn-success" onclick="openAddPersonModal()">+ إضافة فرد</button>
            <button class="btn btn-warning" onclick="openAddGrandparentModal()">👴 إضافة جد</button>
            <button class="btn btn-info" onclick="exportTreeExcel()">📊 Excel</button>
        </div>
        <div class="results-count" id="treeResults"></div>
        <div id="treeContainer"></div>
    </div>
    
    <!-- المقبرة -->
    <div id="cemetery" class="tab-content">
        <div class="legend">
            <div class="legend-item"><div class="legend-color" style="background:#e74c3c;"></div>مشغول</div>
            <div class="legend-item"><div class="legend-color" style="background:#27ae60;"></div>متاح</div>
            <div class="legend-item"><div class="legend-color" style="background:#95a5a6;border:2px dashed #7f8c8d;"></div>فارغ</div>
            <div class="legend-item"><div class="legend-color" style="background:#f39c12;"></div>خاص</div>
        </div>
        
        <div class="search-box">
            <input type="text" id="graveSearch" placeholder="🔍 ابحث برقم القبر أو اسم المدفون..." oninput="searchGraves()">
        </div>
        
        <div class="filters">
            <select id="filterGraveLocation" onchange="filterGraves()">
                <option value="">كل المواقع</option>
                <option value="صف أول (شمال تحت)">صف أول (شمال تحت)</option>
                <option value="صف ثاني فوق">صف ثاني فوق</option>
                <option value="صف النسوان">صف النسوان</option>
                <option value="صف ثالث فوق">صف ثالث فوق</option>
                <option value="صف رابع فوق">صف رابع فوق</option>
                <option value="صف خامس فوق">صف خامس فوق</option>
            </select>
            <select id="filterGraveType" onchange="filterGraves()">
                <option value="">كل الأنواع</option>
                <option value="خاص">خاص</option>
                <option value="عام">عام</option>
                <option value="غير محدد">غير محدد</option>
            </select>
            <select id="filterGraveStatus" onchange="filterGraves()">
                <option value="">كل الحالات</option>
                <option value="مشغول">مشغول</option>
                <option value="متاح">متاح</option>
                <option value="فارغ">فارغ</option>
            </select>
            <select id="filterGraveFamily" onchange="filterGraves()">
                <option value="">كل العائلات</option>
            </select>
        </div>
        
        <div class="export-buttons">
            <button class="btn btn-success" onclick="openAddGraveModal()">+ إضافة قبر</button>
            <button class="btn btn-info" onclick="exportGravesExcel()">📊 Excel</button>
        </div>
        
        <div class="results-count" id="graveResults"></div>
        <div id="graveContainer"></div>
    </div>
    
    <!-- العائلات -->
    <div id="families" class="tab-content">
        <div class="search-box">
            <input type="text" id="familySearch" placeholder="🔍 ابحث عن عائلة..." oninput="searchFamilies()">
        </div>
        <div class="filters">
            <select id="filterFamilySector" onchange="filterFamilies()">
                <option value="">كل القطاعات</option>
                <option value="الجبل">الجبل</option>
                <option value="الحارة1">الحارة 1</option>
                <option value="الحارة2">الحارة 2</option>
                <option value="الوادي">الوادي</option>
                <option value="المنصورة">المنصورة</option>
                <option value="دمر">دمر</option>
            </select>
        </div>
        <button class="btn btn-success" onclick="openAddFamilyModal()" style="margin-bottom:10px;">+ إضافة عائلة</button>
        <div id="familiesContainer"></div>
    </div>
    
    <!-- الإحصائيات -->
    <div id="stats" class="tab-content">
        <div class="stats">
            <div class="stat-box stat-families"><h3 id="statFamilies">0</h3><p>العائلات</p></div>
            <div class="stat-box stat-total"><h3 id="statPeople">0</h3><p>إجمالي الأفراد</p></div>
            <div class="stat-box stat-alive"><h3 id="statAlive">0</h3><p>الأحياء</p></div>
            <div class="stat-box stat-deceased"><h3 id="statDeceased">0</h3><p>المتوفين</p></div>
            <div class="stat-box stat-occupied"><h3 id="statGraves">0</h3><p>القبور</p></div>
            <div class="stat-box stat-available"><h3 id="statAvailable">0</h3><p>قبور متاحة</p></div>
            <div class="stat-box stat-empty"><h3 id="statEmpty">0</h3><p>قبور فارغة</p></div>
        </div>
        <div id="statsDetails"></div>
    </div>
</div>

<!-- نافذة تفاصيل الشخص -->
<div id="personModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="personModalTitle">تفاصيل الشخص</h3>
            <button class="close-btn" onclick="closeModal('personModal')">×</button>
        </div>
        <div id="personDetails"></div>
        <div style="margin-top:10px;">
            <button class="btn btn-warning" onclick="editPerson()">✏️ تعديل</button>
            <button class="btn btn-danger" onclick="deletePerson()">🗑️ حذف</button>
        </div>
    </div>
</div>

<!-- نافذة إضافة/تعديل فرد -->
<div id="addPersonModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="addPersonTitle">إضافة فرد</h3>
            <button class="close-btn" onclick="closeModal('addPersonModal')">×</button>
        </div>
        <form onsubmit="savePerson(event)">
            <input type="hidden" id="personEditId">
            <div class="form-row">
                <div class="form-group"><label>رقم الفرد *</label><input type="text" id="pCode" required placeholder="F001"></div>
                <div class="form-group"><label>كود الأسرة *</label><input type="text" id="pFamily" required placeholder="A001"></div>
            </div>
            <div class="form-group"><label>الاسم الثلاثي *</label><input type="text" id="pName" required></div>
            <div class="form-row">
                <div class="form-group"><label>صلة القرابة</label><select id="pRelation"><option>رب أسرة</option><option>زوجة</option><option>ابن</option><option>بنت</option><option>جد</option><option>جدة</option></select></div>
                <div class="form-group"><label>الجنس</label><select id="pGender"><option>ذكر</option><option>أنثى</option></select></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>القطاع</label><select id="pSector"><option>الجبل</option><option>الحارة1</option><option>الحارة2</option><option>الوادي</option><option>المنصورة</option><option>دمر</option></select></div>
                <div class="form-group"><label>تاريخ الميلاد</label><input type="date" id="pBirth"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>الحالة</label><select id="pStatus"><option>حي</option><option>متوفى</option></select></div>
                <div class="form-group"><label>تاريخ الوفاة</label><input type="date" id="pDeath"></div>
            </div>
            <div class="form-group"><label>الجوال</label><input type="tel" id="pPhone"></div>
            <div class="form-group"><label>ملاحظات</label><textarea id="pNotes" rows="2"></textarea></div>
            <button type="submit" class="btn btn-success" style="width:100%;">حفظ</button>
        </form>
    </div>
</div>

<!-- نافذة إضافة جد -->
<div id="addGrandparentModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>إضافة جد / جدة</h3>
            <button class="close-btn" onclick="closeModal('addGrandparentModal')">×</button>
        </div>
        <form onsubmit="saveGrandparent(event)">
            <div class="form-group"><label>الأسرة *</label><select id="gpFamily" required></select></div>
            <div class="form-group"><label>اسم الجد/الجدة *</label><input type="text" id="gpName" required></div>
            <div class="form-row">
                <div class="form-group"><label>الجيل</label><select id="gpGeneration"><option>الجد الأول</option><option>الجد الثاني</option><option>الجد الثالث</option></select></div>
                <div class="form-group"><label>الجنس</label><select id="gpGender"><option>ذكر</option><option>أنثى</option></select></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>تاريخ الميلاد</label><input type="date" id="gpBirth"></div>
                <div class="form-group"><label>تاريخ الوفاة</label><input type="date" id="gpDeath"></div>
            </div>
            <div class="form-group"><label>ملاحظات</label><textarea id="gpNotes" rows="2"></textarea></div>
            <button type="submit" class="btn btn-success" style="width:100%;">حفظ</button>
        </form>
    </div>
</div>

<!-- نافذة تفاصيل القبر -->
<div id="graveModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="graveModalTitle">تفاصيل القبر</h3>
            <button class="close-btn" onclick="closeModal('graveModal')">×</button>
        </div>
        <div id="graveDetails"></div>
        <div style="margin-top:10px;">
            <button class="btn btn-warning" onclick="editGrave()">✏️ تعديل</button>
            <button class="btn btn-danger" onclick="deleteGrave()">🗑️ حذف</button>
        </div>
    </div>
</div>

<!-- نافذة إضافة/تعديل قبر -->
<div id="addGraveModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="addGraveTitle">إضافة قبر</h3>
            <button class="close-btn" onclick="closeModal('addGraveModal')">×</button>
        </div>
        <form onsubmit="saveGrave(event)">
            <input type="hidden" id="graveEditId">
            <div class="form-row">
                <div class="form-group"><label>رقم القبر *</label><input type="text" id="gNumber" required placeholder="Z-001"></div>
                <div class="form-group"><label>الموقع</label><input type="text" id="gLocation" placeholder="صف أول (شمال تحت)"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>النوع</label><select id="gType"><option value="غير محدد">غير محدد</option><option value="عام">عام</option><option value="خاص">خاص</option></select></div>
                <div class="form-group"><label>الحالة</label><select id="gStatus"><option value="فارغ">فارغ</option><option value="متاح">متاح</option><option value="مشغول">مشغول</option></select></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>العائلة</label><input type="text" id="gFamily" placeholder="آل الخطيب"></div>
                <div class="form-group"><label>المالك</label><input type="text" id="gOwner"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>آخر مدفون</label><input type="text" id="gLastBuried"></div>
                <div class="form-group"><label>تاريخ الدفن</label><input type="date" id="gLastDate"></div>
            </div>
            <div class="form-group"><label>ملاحظات</label><textarea id="gNotes" rows="2"></textarea></div>
            <button type="submit" class="btn btn-success" style="width:100%;">حفظ</button>
        </form>
    </div>
</div>

<!-- نافذة إضافة عائلة -->
<div id="addFamilyModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>إضافة عائلة</h3>
            <button class="close-btn" onclick="closeModal('addFamilyModal')">×</button>
        </div>
        <form onsubmit="saveFamily(event)">
            <div class="form-row">
                <div class="form-group"><label>كود الأسرة *</label><input type="text" id="fCode" required placeholder="A001"></div>
                <div class="form-group"><label>اسم العائلة *</label><input type="text" id="fName" required placeholder="عساف"></div>
            </div>
            <div class="form-group"><label>القطاع</label><select id="fSector"><option>الجبل</option><option>الحارة1</option><option>الحارة2</option><option>الوادي</option><option>المنصورة</option><option>دمر</option></select></div>
            <div class="form-group"><label>ملاحظات</label><textarea id="fNotes" rows="2"></textarea></div>
            <button type="submit" class="btn btn-success" style="width:100%;">حفظ</button>

// ========== التبويبات ==========
function switchTab(tabName) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(tabName).classList.add('active');
    
    if (tabName === 'tree') displayTree();
    if (tabName === 'cemetery') displayGraves();
    if (tabName === 'families') displayFamilies();
    if (tabName === 'stats') updateStats();
}

// ========== شجرة العائلة ==========
function displayTree() {
    const container = document.getElementById('treeContainer');
    const search = document.getElementById('treeSearch').value.toLowerCase();
    const sector = document.getElementById('filterTreeSector').value;
    const familyFilter = document.getElementById('filterTreeFamily').value;
    
    // تجميع حسب الأسرة
    const byFamily = {};
    persons.forEach(p => {
        if (search && !p.name.toLowerCase().includes(search) && !p.id.toLowerCase().includes(search)) return;
        if (sector && p.sector !== sector) return;
        if (familyFilter && p.family !== familyFilter) return;
        
        if (!byFamily[p.family]) byFamily[p.family] = [];
        byFamily[p.family].push(p);
    });
    
    let html = '';
    const familyCodes = Object.keys(byFamily).sort();
    
    familyCodes.forEach(familyCode => {
        const family = families.find(f => f.code === familyCode);
        const familyName = family ? family.name : familyCode;
        const members = byFamily[familyCode];
        
        // الأجداد
        const gps = grandparents.filter(gp => gp.family === familyCode);
        
        // رب الأسرة
        const head = members.find(m => m.relation === 'رب أسرة');
        const wife = members.find(m => m.relation === 'زوجة');
        const children = members.filter(m => m.relation === 'ابن' || m.relation === 'بنت');
        
        html += `<div class="tree-family">`;
        html += `<h3>👪 عائلة ${familyName} (${familyCode}) - ${members.length} فرد</h3>`;
        
        // الأجداد
        if (gps.length > 0) {
            html += `<div class="tree-grandparents">`;
            html += `<h4>👴 الأجداد</h4>`;
            gps.forEach(gp => {
                const isDeceased = gp.death ? true : false;
                html += `<div class="tree-person ${isDeceased ? 'deceased' : ''}" onclick="viewGrandparent('${gp.id}')" style="margin:3px;">
                    ${isDeceased ? '⚰️' : '👴'} ${gp.name} - ${gp.generation}
                </div>`;
            });
            html += `</div>`;
        }
        
        // الزوجان
        if (head || wife) {
            html += `<div class="tree-couple">`;
            if (head) {
                const isDeceased = head.status === 'متوفى';
                html += `<div class="tree-person head ${isDeceased ? 'deceased' : ''}" onclick="viewPerson('${head.id}')">
                    👨 ${head.name} ${isDeceased ? '⚰️' : ''}
                </div>`;
            }
            if (wife) {
                const isDeceased = wife.status === 'متوفى';
                html += `<div class="connector"></div>`;
                html += `<div class="tree-person ${isDeceased ? 'deceased' : ''}" onclick="viewPerson('${wife.id}')">
                    👩 ${wife.name} ${isDeceased ? '⚰️' : ''}
                </div>`;
            }
            html += `</div>`;
        }
        
        // الأبناء
        if (children.length > 0) {
            html += `<div class="tree-children">`;
            html += `<h4>👶 الأبناء (${children.length})</h4>`;
            html += `<div class="tree-children-list">`;
            children.forEach(c => {
                const isDeceased = c.status === 'متوفى';
                const icon = c.gender === 'ذكر' ? '👦' : '👧';
                html += `<div class="child-card ${isDeceased ? 'deceased' : ''}" onclick="viewPerson('${c.id}')">
                    ${icon} ${c.name} ${isDeceased ? '⚰️' : ''}
                </div>`;
            });
            html += `</div></div>`;
        }
        
        html += `</div>`;
    });
    
    container.innerHTML = html || '<p style="text-align:center;color:#999;">لا توجد نتائج</p>';
    document.getElementById('treeResults').textContent = `عرض ${familyCodes.length} عائلة`;
}

function searchTree() { displayTree(); }
function filterTree() { displayTree(); }

function viewPerson(personId) {
    const p = persons.find(x => x.id === personId);
    if (!p) return;
    currentPersonId = personId;
    
    const family = families.find(f => f.code === p.family);
    const age = p.birth ? calculateAge(p.birth, p.status === 'متوفى' ? null : null) : '-';
    
    document.getElementById('personModalTitle').textContent = 'تفاصيل الشخص';
    document.getElementById('personDetails').innerHTML = `
        <div style="background:#f8f9fa;padding:15px;border-radius:8px;">
            <h3 style="color:#2c3e50;margin-bottom:10px;">👤 ${p.name}</h3>
            <p><strong>الكود:</strong> ${p.id}</p>
            <p><strong>العائلة:</strong> ${family ? family.name : p.family} (${p.family})</p>
            <p><strong>صلة القرابة:</strong> ${p.relation}</p>
            <p><strong>الجنس:</strong> ${p.gender}</p>
            <p><strong>القطاع:</strong> ${p.sector}</p>
            <p><strong>تاريخ الميلاد:</strong> ${p.birth || '-'}</p>
            <p><strong>العمر:</strong> ${age} سنة</p>
            <p><strong>الحالة:</strong> <span class="badge ${p.status === 'حي' ? 'badge-active' : 'badge-deceased'}">${p.status}</span></p>
            <p><strong>الجوال:</strong> ${p.phone || '-'}</p>
            ${p.notes ? `<p><strong>ملاحظات:</strong> ${p.notes}</p>` : ''}
        </div>
    `;
    document.getElementById('personModal').classList.add('active');
}

function viewGrandparent(gpId) {
    const gp = grandparents.find(x => x.id === gpId);
    if (!gp) return;
    
    const family = families.find(f => f.code === gp.family);
    
    document.getElementById('personModalTitle').textContent = 'تفاصيل الجد/الجدة';
    document.getElementById('personDetails').innerHTML = `
        <div style="background:#e8f5e9;padding:15px;border-radius:8px;">
            <h3 style="color:#2e7d32;margin-bottom:10px;"> ${gp.name}</h3>
            <p><strong>الجيل:</strong> ${gp.generation}</p>
            <p><strong>العائلة:</strong> ${family ? family.name : gp.family}</p>
            <p><strong>الجنس:</strong> ${gp.gender}</p>
            <p><strong>تاريخ الميلاد:</strong> ${gp.birth || '-'}</p>
            <p><strong>تاريخ الوفاة:</strong> ${gp.death || '-'}</p>
            ${gp.notes ? `<p><strong>ملاحظات:</strong> ${gp.notes}</p>` : ''}
        </div>
    `;
    document.getElementById('personModal').classList.add('active');
}

function calculateAge(birth, death) {
    const birthDate = new Date(birth);
    const endDate = death ? new Date(death) : new Date();
    let age = endDate.getFullYear() - birthDate.getFullYear();
    const m = endDate.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && endDate.getDate() < birthDate.getDate())) age--;
    return age;
}

function savePerson(e) {
    e.preventDefault();
    const editId = document.getElementById('personEditId').value;
    const personData = {
        id: document.getElementById('pFamily').value + '-' + document.getElementById('pCode').value,
        family: document.getElementById('pFamily').value,
        name: document.getElementById('pName').value,
        relation: document.getElementById('pRelation').value,
        gender: document.getElementById('pGender').value,
        sector: document.getElementById('pSector').value,
        birth: document.getElementById('pBirth').value,
        status: document.getElementById('pStatus').value,
        phone: document.getElementById('pPhone').value,
        notes: document.getElementById('pNotes').value
    };
    
    if (editId) {
        const index = persons.findIndex(p => p.id === editId);
        if (index !== -1) persons[index] = personData;
        alert('✅ تم التعديل');
    } else {
        persons.push(personData);
        alert('✅ تم الإضافة');
    }
    
    closeModal('addPersonModal');
    displayTree();
}

function saveGrandparent(e) {
    e.preventDefault();
    grandparents.push({
        id: 'GP' + String(grandparents.length + 1).padStart(3, '0'),
        family: document.getElementById('gpFamily').value,
        name: document.getElementById('gpName').value,
        generation: document.getElementById('gpGeneration').value,
        gender: document.getElementById('gpGender').value,
        birth: document.getElementById('gpBirth').value,
        death: document.getElementById('gpDeath').value,
        notes: document.getElementById('gpNotes').value
    });
    alert('✅ تم إضافة الجد');
    closeModal('addGrandparentModal');
    displayTree();
}

function editPerson() {
    const p = persons.find(x => x.id === currentPersonId);
    if (!p) return;
    
    document.getElementById('addPersonTitle').textContent = 'تعديل فرد';
    document.getElementById('personEditId').value = p.id;
    document.getElementById('pCode').value = p.id.split('-')[1];
    document.getElementById('pFamily').value = p.family;
    document.getElementById('pName').value = p.name;
    document.getElementById('pRelation').value = p.relation;
    document.getElementById('pGender').value = p.gender;
    document.getElementById('pSector').value = p.sector;
    document.getElementById('pBirth').value = p.birth || '';
    document.getElementById('pStatus').value = p.status;
    document.getElementById('pPhone').value = p.phone || '';
    document.getElementById('pNotes').value = p.notes || '';
    
    closeModal('personModal');
    document.getElementById('addPersonModal').classList.add('active');
}

function deletePerson() {
    if (!confirm('هل أنت متأكد من الحذف؟')) return;
    persons = persons.filter(p => p.id !== currentPersonId);
    alert('✅ تم الحذف');
    closeModal('personModal');
    displayTree();
}

// ========== المقبرة ==========
function displayGraves() {
    const container = document.getElementById('graveContainer');
    const search = document.getElementById('graveSearch').value.toLowerCase();
    const location = document.getElementById('filterGraveLocation').value;
    const type = document.getElementById('filterGraveType').value;
    const status = document.getElementById('filterGraveStatus').value;
    const family = document.getElementById('filterGraveFamily').value;
    
    let filtered = graves.filter(g => {
        if (search) {
            const match = g.number.toLowerCase().includes(search) || 
                         (g.lastBuried && g.lastBuried.toLowerCase().includes(search)) ||
                         (g.family && g.family.toLowerCase().includes(search));
            if (!match) return false;
        }
        if (location && g.location !== location) return false;
        if (type && g.type !== type) return false;
        if (status && g.status !== status) return false;
        if (family && g.family !== family) return false;
        return true;
    });
    
    // تجميع حسب الموقع
    const byLocation = {};
    filtered.forEach(g => {
        const loc = g.location || 'غير محدد';
        if (!byLocation[loc]) byLocation[loc] = [];
        byLocation[loc].push(g);
    });
    
    let html = '';
    for (const [loc, gravesList] of Object.entries(byLocation)) {
        html += `<div class="section-block">`;
        html += `<h3>📍 ${loc} (${gravesList.length} قبر)</h3>`;
        html += `<div class="grave-grid">`;
        
        gravesList.forEach(g => {
            const statusClass = g.status === 'مشغول' ? 'occupied' : g.status === 'متاح' ? 'available' : 'empty';
            const typeClass = g.type === 'خاص' ? 'private' : '';
            const statusText = g.status === 'مشغول' ? '🔒 مشغول' : g.status === 'متاح' ? '✅ متاح' : '⚪ فارغ';
            const typeText = g.type === 'غير محدد' ? '❓' : (g.type === 'خاص' ? '🏷️ خاص' : '🌐 عام');
            
            html += `<div class="grave-card ${statusClass} ${typeClass}" onclick="viewGrave('${g.id}')">
                <div class="grave-number">${g.number}</div>
                <div class="grave-type">${typeText}</div>
                <div class="grave-status">${statusText}</div>
                ${g.lastBuried ? `<div class="grave-name">${g.lastBuried}</div>` : ''}
            </div>`;
        });
        
        html += `</div></div>`;
    }
    
    container.innerHTML = html || '<p style="text-align:center;color:#999;">لا توجد نتائج</p>';
    document.getElementById('graveResults').textContent = `عرض ${filtered.length} قبر`;
}

function searchGraves() { displayGraves(); }
function filterGraves() { displayGraves(); }

function viewGrave(graveId) {
    const g = graves.find(x => x.id === graveId);
    if (!g) return;
    currentGraveId = graveId;
    
    document.getElementById('graveModalTitle').textContent = 'تفاصيل القبر ' + g.number;
    document.getElementById('graveDetails').innerHTML = `
        <div style="background:#f8f9fa;padding:15px;border-radius:8px;">
            <h3 style="color:#2c3e50;margin-bottom:10px;">⚰️ القبر: ${g.number}</h3>
            <p><strong>الموقع:</strong> ${g.location || 'غير محدد'}</p>
            <p><strong>النوع:</strong> ${g.type === 'غير محدد' ? '❓ غير محدد' : (g.type === 'خاص' ? '🏷️ خاص' : '🌐 عام')}</p>
            <p><strong>الحالة:</strong> ${g.status === 'مشغول' ? ' مشغول' : g.status === 'متاح' ? '✅ متاح' : '⚪ فارغ'}</p>
            <p><strong>العائلة:</strong> ${g.family || '-'}</p>
            <p><strong>المالك:</strong> ${g.owner || '-'}</p>
            <p><strong>آخر مدفون:</strong> ${g.lastBuried || '-'}</p>
            <p><strong>تاريخ الدفن:</strong> ${g.lastDate || '-'}</p>
            ${g.notes ? `<p><strong>ملاحظات:</strong> ${g.notes}</p>` : ''}
        </div>
    `;
    document.getElementById('graveModal').classList.add('active');
}

function openAddGraveModal() {
    document.getElementById('addGraveTitle').textContent = 'إضافة قبر';
    document.getElementById('graveEditId').value = '';
    document.getElementById('gNumber').value = '';
    document.getElementById('gLocation').value = '';
    document.getElementById('gType').value = 'غير محدد';
    document.getElementById('gStatus').value = 'فارغ';
    document.getElementById('gFamily').value = '';
    document.getElementById('gOwner').value = '';
    document.getElementById('gLastBuried').value = '';
    document.getElementById('gLastDate').value = '';
    document.getElementById('gNotes').value = '';
    document.getElementById('addGraveModal').classList.add('active');
}

function saveGrave(e) {
    e.preventDefault();
    const editId = document.getElementById('graveEditId').value;
    const graveData = {
        id: document.getElementById('gNumber').value,
        number: document.getElementById('gNumber').value,
        location: document.getElementById('gLocation').value,
        type: document.getElementById('gType').value,
        status: document.getElementById('gStatus').value,
        family: document.getElementById('gFamily').value,
        owner: document.getElementById('gOwner').value,
        lastBuried: document.getElementById('gLastBuried').value,
        lastDate: document.getElementById('gLastDate').value,
        notes: document.getElementById('gNotes').value
    };
    
    if (editId) {
        const index = graves.findIndex(g => g.id === editId);
        if (index !== -1) graves[index] = graveData;
        alert('✅ تم التعديل');
    } else {
        graves.push(graveData);
        alert('✅ تم الإضافة');
    }
    
    closeModal('addGraveModal');
    displayGraves();
}

function editGrave() {
    const g = graves.find(x => x.id === currentGraveId);
    if (!g) return;
    
    document.getElementById('addGraveTitle').textContent = 'تعديل قبر';
    document.getElementById('graveEditId').value = g.id;
    document.getElementById('gNumber').value = g.number;
    document.getElementById('gLocation').value = g.location || '';
    document.getElementById('gType').value = g.type;
    document.getElementById('gStatus').value = g.status;
    document.getElementById('gFamily').value = g.family || '';
    document.getElementById('gOwner').value = g.owner || '';
    document.getElementById('gLastBuried').value = g.lastBuried || '';
    document.getElementById('gLastDate').value = g.lastDate || '';
    document.getElementById('gNotes').value = g.notes || '';
    
    closeModal('graveModal');
    document.getElementById('addGraveModal').classList.add('active');
}

function deleteGrave() {
    if (!confirm('هل أنت متأكد من الحذف؟')) return;
    graves = graves.filter(g => g.id !== currentGraveId);
    alert('✅ تم الحذف');
    closeModal('graveModal');
    displayGraves();
}

// ========== العائلات ==========
function displayFamilies() {
    const container = document.getElementById('familiesContainer');
    const search = document.getElementById('familySearch').value.toLowerCase();
    const sector = document.getElementById('filterFamilySector').value;
    
    let filtered = families.filter(f => {
        if (search && !f.name.toLowerCase().includes(search) && !f.code.toLowerCase().includes(search)) return false;
        if (sector && f.sector !== sector) return false;
        return true;
    });
    
    let html = '';
    filtered.forEach(f => {
        const memberCount = persons.filter(p => p.family === f.code).length;
        const aliveCount = persons.filter(p => p.family === f.code && p.status === 'حي').length;
        const deceasedCount = persons.filter(p => p.family === f.code && p.status === 'متوفى').length;
        const graveCount = graves.filter(g => g.family && g.family.includes(f.name)).length;
        
        html += `<div class="family-card" onclick="viewFamily('${f.code}')">
            <h4>👪 ${f.name} (${f.code})</h4>
            <p> ${f.sector} | 👥 ${memberCount} فرد | ✅ ${aliveCount} حي | ⚰️ ${deceasedCount} متوفي</p>
            <p>️ ${graveCount} قبر مرتبط</p>
            ${f.notes ? `<p>📝 ${f.notes}</p>` : ''}
        </div>`;
    });
    
    container.innerHTML = html || '<p style="text-align:center;color:#999;">لا توجد نتائج</p>';
}

function searchFamilies() { displayFamilies(); }
function filterFamilies() { displayFamilies(); }

function viewFamily(familyCode) {
    const f = families.find(x => x.code === familyCode);
    if (!f) return;
    
    const members = persons.filter(p => p.family === familyCode);
    const graves_list = graves.filter(g => g.family && g.family.includes(f.name));
    
    alert(`عائلة ${f.name} (${f.code})\n\n📍 القطاع: ${f.sector}\n👥 الأفراد: ${members.length}\n✅ أحياء: ${members.filter(m => m.status === 'حي').length}\n⚰️ متوفين: ${members.filter(m => m.status === 'متوفى').length}\n⚰️ قبور: ${graves_list.length}\n\n${f.notes ? 'ملاحظات: ' + f.notes : ''}`);
}

function openAddFamilyModal() {
    document.getElementById('fCode').value = '';
    document.getElementById('fName').value = '';
    document.getElementById('fSector').value = 'الجبل';
    document.getElementById('fNotes').value = '';
    document.getElementById('addFamilyModal').classList.add('active');
}

function saveFamily(e) {
    e.preventDefault();
    families.push({
        code: document.getElementById('fCode').value,
        name: document.getElementById('fName').value,
        sector: document.getElementById('fSector').value,
        notes: document.getElementById('fNotes').value
    });
    alert('✅ تم إضافة العائلة');
    closeModal('addFamilyModal');
    displayFamilies();
}

// ========== الإحصائيات ==========
function updateStats() {
    document.getElementById('statFamilies').textContent = families.length;
    document.getElementById('statPeople').textContent = persons.length;
    document.getElementById('statAlive').textContent = persons.filter(p => p.status === 'حي').length;
    document.getElementById('statDeceased').textContent = persons.filter(p => p.status === 'متوفى').length;
    document.getElementById('statGraves').textContent = graves.length;
    document.getElementById('statAvailable').textContent = graves.filter(g => g.status === 'متاح').length;
    document.getElementById('statEmpty').textContent = graves.filter(g => g.status === 'فارغ').length;
    
    // تفاصيل حسب القطاع
    const sectors = {};
    persons.forEach(p => {
        if (!sectors[p.sector]) sectors[p.sector] = {total: 0, alive: 0, deceased: 0};
        sectors[p.sector].total++;
        if (p.status === 'حي') sectors[p.sector].alive++;
        else sectors[p.sector].deceased++;
    });
    
    let html = '<h3 style="margin-bottom:15px;">📊 تفاصيل حسب القطاع</h3>';
    for (const [sector, data] of Object.entries(sectors)) {
        html += `<div class="section-block"><h3>${sector}</h3><p>إجمالي: ${data.total} | أحياء: ${data.alive} | متوفين: ${data.deceased}</p></div>`;
    }
    document.getElementById('statsDetails').innerHTML = html;
}

// ========== تصدير Excel ==========
function exportTreeExcel() {
    const data = persons.map(p => {
        const family = families.find(f => f.code === p.family);
        return {
            'الكود': p.id,
            'الأسرة': p.family,
            'الاسم': p.name,
            'صلة القرابة': p.relation,
            'الجنس': p.gender,
            'القطاع': p.sector,
            'تاريخ الميلاد': p.birth,
            'الحالة': p.status,
            'الجوال': p.phone,
            'ملاحظات': p.notes
        };
    });
    
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'الأفراد');
    XLSX.writeFile(wb, `زعورة_شجرة_العائلة_${new Date().toISOString().split('T')[0]}.xlsx`);
    alert('✅ تم التصدير');
}

function exportGravesExcel() {
    const data = graves.map(g => ({
        'رقم القبر': g.number,
        'الموقع': g.location,
        'النوع': g.type,
        'الحالة': g.status,
        'العائلة': g.family,
        'المالك': g.owner,
        'آخر مدفون': g.lastBuried,
        'تاريخ الدفن': g.lastDate,
        'ملاحظات': g.notes
    }));
    
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'القبور');
    XLSX.writeFile(wb, `زعورة_المقبرة_${new Date().toISOString().split('T')[0]}.xlsx`);
    alert('✅ تم التصدير');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

// تهيئة
function init() {
    // ملء قائمة العائلات في الفلاتر
    const familySelects = ['filterTreeFamily', 'filterGraveFamily'];
    familySelects.forEach(id => {
        const select = document.getElementById(id);
        if (select) {
            const uniqueFamilies = [...new Set(graves.map(g => g.family).filter(f => f))];
            select.innerHTML = '<option value="">كل العائلات</option>' + 
                uniqueFamilies.map(f => `<option value="${f}">${f}</option>`).join('');
        }
    });
    
    displayTree();
}

init();
</script>
