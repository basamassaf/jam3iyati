<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الجمعية - الأعضاء</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: #95a5a6; }
        .btn-success { background: #27ae60; }
        .btn-warning { background: #f39c12; }
        .btn-danger { background: #e74c3c; }
        .btn-small { width: auto; padding: 8px 15px; font-size: 14px; margin: 5px; display: inline-block; }
        .error { background: #fee; color: #c33; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .success { background: #efe; color: #3a3; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .loading { text-align: center; color: #667eea; margin: 15px 0; display: none; }
        .member-card { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-right: 4px solid #667eea; }
        .member-card h4 { color: #2c3e50; margin-bottom: 5px; }
        .member-card p { color: #7f8c8d; font-size: 13px; margin: 3px 0; }
        .member-actions { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-right: 5px; }
        .badge-active { background: #d4edda; color: #155724; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-modal { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        .search-box { margin-bottom: 20px; }
        #loginScreen, #dashboard, #membersSection { display: none; }
        #loginScreen.active, #dashboard.active, #membersSection.active { display: block; }
    </style>
</head>
<body>

<div class="container">
    <!-- تسجيل الدخول -->
    <div id="loginScreen" class="active">
        <h1>🏛️ نظام إدارة الجمعية</h1>
        <p class="subtitle">تسجيل دخول المستخدمين</p>
        <div class="error" id="errorMsg"></div>
        <div class="input-group">
            <label>البريد الإلكتروني:</label>
            <input type="email" id="email" placeholder="example@email.com">
        </div>
        <div class="input-group">
            <label>كلمة المرور:</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn" onclick="doLogin()">تسجيل الدخول</button>
        <div class="loading" id="loading">جاري تسجيل الدخول...</div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboard">
        <h1>مرحباً، <span id="userName"></span></h1>
        <p class="subtitle"> مدير عام</p>
        
        <button class="btn" onclick="showMembers()"> إدارة الأعضاء</button>
        <button class="btn btn-secondary" onclick="doLogout()" style="margin-top: 10px;">تسجيل الخروج</button>
    </div>

    <!-- قسم الأعضاء -->
    <div id="membersSection">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2> إدارة الأعضاء</h2>
            <button class="btn btn-secondary btn-small" onclick="showDashboard()">← رجوع</button>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 ابحث بالاسم أو الكود..." oninput="searchMembers()">
        </div>
        
        <button class="btn btn-success" onclick="openAddMemberModal()">+ إضافة عضو جديد</button>
        
        <div id="membersList" style="margin-top: 20px;"></div>
    </div>
</div>

<!-- نافذة إضافة/تعديل عضو -->
<div id="memberModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">إضافة عضو جديد</h3>
            <button class="close-modal" onclick="closeMemberModal()">×</button>
        </div>
        <form id="memberForm" onsubmit="saveMember(event)">
            <input type="hidden" id="memberId">
            
            <div class="form-row">
                <div class="input-group">
                    <label>كود الأسرة *</label>
                    <input type="text" id="familyCode" required placeholder="مثال: A005">
                </div>
                <div class="input-group">
                    <label>كود الفرد *</label>
                    <input type="text" id="memberCode" required placeholder="مثال: F001">
                </div>
            </div>
            
            <div class="input-group">
                <label>الاسم الثلاثي *</label>
                <input type="text" id="memberName" required placeholder="الاسم الكامل">
            </div>
            
            <div class="form-row">
                <div class="input-group">
                    <label>صلة القرابة</label>
                    <select id="relation">
                        <option value="رب أسرة">رب أسرة</option>
                        <option value="زوجة">زوجة</option>
                        <option value="ابن">ابن</option>
                        <option value="بنت">بنت</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>القطاع</label>
                    <select id="memberSector">
                        <option value="الحارة 1">الحارة 1</option>
                        <option value="الحارة 2">الحارة 2</option>
                        <option value="الوادي">الوادي</option>
                        <option value="المنصورة">المنصورة</option>
                        <option value="الجبل">الجبل</option>
                        <option value="دمر">دمر</option>
                    </select>
                </div>
            </div>
            
            <div class="input-group">
                <label>رقم الجوال</label>
                <input type="tel" id="memberPhone" placeholder="09xxxxxxxx">
            </div>
            
            <div class="input-group">
                <label>نوع الاشتراك:</label>
                <div style="display: flex; gap: 15px; margin: 10px 0;">
                    <label><input type="checkbox" id="subAssociation"> جمعية</label>
                    <label><input type="checkbox" id="subDeath"> وفاة</label>
                </div>
            </div>
            
            <div class="form-row">
                <div class="input-group">
                    <label>تاريخ اشتراك الجمعية</label>
                    <input type="date" id="associationDate">
                </div>
                <div class="input-group">
                    <label>تاريخ اشتراك الوفاة</label>
                    <input type="date" id="deathDate">
                </div>
            </div>
            
            <div class="input-group">
                <label>حالة العضو:</label>
                <select id="memberStatus">
                    <option value="active">نشط</option>
                    <option value="exempt">معفي</option>
                    <option value="suspended">متوقف</option>
                    <option value="withdrawn">منسحب</option>
                    <option value="deceased">متوفي</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>ملاحظات:</label>
                <textarea id="memberNotes" rows="2"></textarea>
            </div>
            
            <button type="submit" class="btn btn-success">حفظ</button>
            <button type="button" class="btn btn-secondary" onclick="closeMemberModal()">إلغاء</button>
        </form>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBwBOJjthFdSc7jv0dGL325kcaNqzD9dII",
    authDomain: "jam3iyati-b7528.firebaseapp.com",
    projectId: "jam3iyati-b7528",
    storageBucket: "jam3iyati-b7528.firebasestorage.app",
    messagingSenderId: "499100272911",
    appId: "1:499100272911:web:5bda121dbffa085770567a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let currentUser = null;
let allMembers = [];

// التحقق من تسجيل الدخول
auth.onAuthStateChanged(user => {
    if (user) {
        currentUser = user;
        showDashboard();
    } else {
        showLogin();
    }
});

function showLogin() {
    document.getElementById('loginScreen').classList.add('active');
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('membersSection').classList.remove('active');
}

function showDashboard() {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('membersSection').classList.remove('active');
    document.getElementById('dashboard').classList.add('active');
    if (currentUser) {
        document.getElementById('userName').textContent = currentUser.email.split('@')[0];
    }
}

function showMembers() {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('membersSection').classList.add('active');
    loadMembers();
}

function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const loading = document.getElementById('loading');
    
    if (!email || !password) {
        errorMsg.textContent = '⚠️ أدخل البريد وكلمة المرور';
        errorMsg.style.display = 'block';
        return;
    }
    
    loading.style.display = 'block';
    auth.signInWithEmailAndPassword(email, password)
        .then(() => {
            loading.style.display = 'none';
        })
        .catch(error => {
            errorMsg.textContent = '❌ خطأ: ' + error.message;
            errorMsg.style.display = 'block';
            loading.style.display = 'none';
        });
}

function doLogout() {
    auth.signOut();
}

// === قسم الأعضاء ===

function loadMembers() {
    const container = document.getElementById('membersList');
    container.innerHTML = '<div class="loading" style="display:block;">جاري تحميل الأعضاء...</div>';
    
    db.collection('members').get()
        .then(snapshot => {
            allMembers = [];
            snapshot.forEach(doc => {
                allMembers.push({ id: doc.id, ...doc.data() });
            });
            
            // ترتيب يدوي حسب الكود
            allMembers.sort((a, b) => {
                const codeA = (a.familyCode || '') + (a.memberCode || '');
                const codeB = (b.familyCode || '') + (b.memberCode || '');
                return codeA.localeCompare(codeB);
            });
            
            displayMembers(allMembers);
        })
        .catch(error => {
            console.error('Error:', error);
            container.innerHTML = '<p style="text-align:center;color:#e74c3c;">خطأ: ' + error.message + '</p>';
        });
}

function displayMembers(members) {
    const container = document.getElementById('membersList');
    
    if (members.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">لا يوجد أعضاء - اضغط "إضافة عضو جديد"</p>';
        return;
    }
    
    let html = '';
    members.forEach(m => {
        const fullCode = `${m.familyCode}-${m.memberCode}`;
        const subText = (m.hasAssociation && m.hasDeath) ? 'مزدوج' : 
                       (m.hasAssociation ? 'جمعية' : 
                       (m.hasDeath ? 'وفاة' : 'غير مشترك'));
        
        const statusText = {
            'active': 'نشط',
            'exempt': 'معفي',
            'suspended': 'متوقف',
            'withdrawn': 'منسحب',
            'deceased': 'متوفي'
        }[m.status] || m.status;
        
        html += `
            <div class="member-card">
                <h4>${m.name} <span class="badge badge-active">${statusText}</span></h4>
                <p>🔑 <strong>${fullCode}</strong> | 🏢 ${m.sector || '-'}</p>
                <p>📱 ${m.phone || 'غير متوفر'}</p>
                <p> الاشتراك: ${subText}</p>
                <p>📅 اشتراك الجمعية: ${m.associationDate || '-'} | الوفاة: ${m.deathDate || '-'}</p>
                ${m.notes ? `<p>📝 ${m.notes}</p>` : ''}
                <div class="member-actions">
                    <button class="btn btn-warning btn-small" onclick="editMember('${m.id}')">✏️ تعديل</button>
                    <button class="btn btn-danger btn-small" onclick="deleteMember('${m.id}')">🗑️ حذف</button>
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
}

function searchMembers() {
    const term = document.getElementById('searchInput').value.toLowerCase().trim();
    
    if (!term) {
        displayMembers(allMembers);
        return;
    }
    
    const filtered = allMembers.filter(m => {
        const fullCode = `${m.familyCode}-${m.memberCode}`.toLowerCase();
        return m.name.toLowerCase().includes(term) || 
               fullCode.includes(term) ||
               (m.phone && m.phone.includes(term));
    });
    
    displayMembers(filtered);
}

function openAddMemberModal() {
    document.getElementById('modalTitle').textContent = 'إضافة عضو جديد';
    document.getElementById('memberForm').reset();
    document.getElementById('memberId').value = '';
    document.getElementById('memberModal').classList.add('active');
}

function closeMemberModal() {
    document.getElementById('memberModal').classList.remove('active');
}

function saveMember(event) {
    event.preventDefault();
    
    const memberId = document.getElementById('memberId').value;
    const memberData = {
        familyCode: document.getElementById('familyCode').value,
        memberCode: document.getElementById('memberCode').value,
        name: document.getElementById('memberName').value,
        relation: document.getElementById('relation').value,
        sector: document.getElementById('memberSector').value,
        phone: document.getElementById('memberPhone').value,
        hasAssociation: document.getElementById('subAssociation').checked,
        hasDeath: document.getElementById('subDeath').checked,
        associationDate: document.getElementById('associationDate').value,
        deathDate: document.getElementById('deathDate').value,
        status: document.getElementById('memberStatus').value,
        notes: document.getElementById('memberNotes').value,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    if (memberId) {
        // تعديل عضو موجود
        db.collection('members').doc(memberId).update(memberData)
            .then(() => {
                alert('✅ تم تعديل العضو بنجاح');
                closeMemberModal();
                loadMembers();
            })
            .catch(error => {
                console.error('Error updating member:', error);
                alert('❌ خطأ في التعديل: ' + error.message);
            });
    } else {
        // إضافة عضو جديد
        memberData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        db.collection('members').add(memberData)
            .then(() => {
                alert('✅ تم إضافة العضو بنجاح');
                closeMemberModal();
                loadMembers();
            })
            .catch(error => {
                console.error('Error adding member:', error);
                alert('❌ خطأ في الإضافة: ' + error.message);
            });
    }
}

function editMember(memberId) {
    db.collection('members').doc(memberId).get()
        .then(doc => {
            if (doc.exists) {
                const m = doc.data();
                document.getElementById('modalTitle').textContent = 'تعديل عضو';
                document.getElementById('memberId').value = memberId;
                document.getElementById('familyCode').value = m.familyCode || '';
                document.getElementById('memberCode').value = m.memberCode || '';
                document.getElementById('memberName').value = m.name || '';
                document.getElementById('relation').value = m.relation || 'رب أسرة';
                document.getElementById('memberSector').value = m.sector || 'الحارة 1';
                document.getElementById('memberPhone').value = m.phone || '';
                document.getElementById('subAssociation').checked = m.hasAssociation || false;
                document.getElementById('subDeath').checked = m.hasDeath || false;
                document.getElementById('associationDate').value = m.associationDate || '';
                document.getElementById('deathDate').value = m.deathDate || '';
                document.getElementById('memberStatus').value = m.status || 'active';
                document.getElementById('memberNotes').value = m.notes || '';
                document.getElementById('memberModal').classList.add('active');
            } else {
                alert('❌ العضو غير موجود');
            }
        })
        .catch(error => {
            console.error('Error loading member:', error);
            alert('❌ خطأ في تحميل البيانات: ' + error.message);
        });
}

function deleteMember(memberId) {
    if (confirm('هل أنت متأكد من حذف هذا العضو؟')) {
        db.collection('members').doc(memberId).delete()
            .then(() => {
                alert('✅ تم حذف العضو بنجاح');
                loadMembers();
            })
            .catch(error => {
                console.error('Error deleting member:', error);
                alert('❌ خطأ في الحذف: ' + error.message);
            });
    }
}

// إغلاق النوافذ عند النقر خارجها
document.querySelectorAll('.modal').forEach(modal => {
    modal.addEventListener('click', function(e) {
        if (e.target === this) {
            this.classList.remove('active');
        }
    });
});
</script>

</body>
</html>
