<div class="actions">
<button onclick="downloadBackup()">⬇ تحميل نسخة JSON</button>
<label class="btn secondary">⬆ استعادة JSON
<input type="file" accept=".json" onchange="restoreBackup(this)" hidden>
</label>
<button class="danger" onclick="clearAll()">حذف جميع البيانات</button>
</div>
</div>
</section>

<section id="people" class="page">
<div class="card">
<h2>إضافة أو تعديل فرد</h2>
<form id="peopleForm">
<input type="hidden" id="personId">
<div class="grid">
<label>الاسم الثلاثي<input id="pName" required></label>
<label>الجنس<select id="pGender"><option>ذكر</option><option>أنثى</option></select></label>
<label>تاريخ الميلاد<input id="pBirth" type="date"></label>
<label>تاريخ الوفاة<input id="pDeath" type="date"></label>
<label>كود الأسرة<input id="pFamily"></label>
<label>رقم الفرد<input id="pMember"></label>
<label>القطاع<select id="pSector"><option>الجبل</option><option>الحارة1</option><option>الحارة2</option><option>الوادي</option><option>المنصورة</option><option>دمر</option></select></label>
<label>الحالة<select id="pStatus"><option>حي</option><option>متوفى</option><option>معفي</option><option>منسحب</option></select></label>
<label>صلة القرابة<select id="pRelation"><option value="">غير محدد</option><option>رب أسرة</option><option>زوجة</option><option>ابن</option><option>بنت</option></select></label>
<label>الأب<select id="pFather"></select></label>
<label>الأم<select id="pMother"></select></label>
<label>الهاتف<input id="pPhone"></label>
<label>ملاحظات<textarea id="pNotes"></textarea></label>
</div>
<div class="actions"><button>حفظ</button><button type="button" class="light" onclick="resetPerson()">إلغاء</button></div>
</form>
</div>
<div class="card">
<div class="toolbar"><input id="peopleSearch" placeholder="بحث بالاسم أو كود الأسرة أو القطاع" oninput="renderPeople()"></div>
<div id="peopleStats" class="cards"></div>
<div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الجنس</th><th>الأسرة</th><th>القرابة</th><th>القطاع</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="peopleBody"></tbody></table></div>
</div>
</section>

<section id="family" class="page">
<div class="card">
<label>اختر فرداً
<select id="familySelect" onchange="renderFamily()"></select>
</label>
</div>
<div class="card" id="familyTree"></div>
</section>

<section id="cemeteries" class="page">
<div class="card">
<h2>إضافة أو تعديل مدفن</h2>
<form id="cemForm">
<input type="hidden" id="cemId">
<div class="grid">
<label>اسم المدفن<input id="cemName" required></label>
<label>الموقع<input id="cemLocation"></label>
<label>تاريخ الافتتاح<input id="cemOpen" type="date"></label>
<label>المساحة<input id="cemArea" type="number"></label>
<label>المسؤول<input id="cemManager"></label>
<label>الهاتف<input id="cemPhone"></label>
<label>الوضع القانوني<input id="cemLegal" value="وقفية"></label>
<label>ملاحظات<textarea id="cemNotes"></textarea></label>
</div>
<div class="actions"><button>حفظ</button><button type="button" class="light" onclick="resetCem()">إلغاء</button></div>
</form>
</div>
<div class="card"><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الموقع</th><th>المسؤول</th><th>عدد القبور</th><th>إجراءات</th></tr></thead><tbody id="cemBody"></tbody></table></div></div>
</section>

<section id="graves" class="page">

<h2>إضافة أو تعديل قبر</h2>
<form id="graveForm">
<input type="hidden" id="graveId">
<div class="grid">
<label>رقم القبر<input id="gNumber" required></label>
<label>المدفن<select id="gCemetery"></select></label>
<label>الموقع<input id="gLocation"></label>
<label>النوع<select id="gType"><option>عام</option><option>خاص</option></select></label>
<label>العائلة<input id="gFamily"></label>
<label>المالك<input id="gOwner"></label>
<label>الحالة<select id="gStatus"><option>فارغ</option><option>متاح</option><option>مشغول</option></select></label>
<label>مدة إعادة الاستخدام<input id="gYears" type="number" value="10"></label>
<label>آخر مدفون<input id="gLast"></label>
<label>تاريخ آخر دفن<input id="gDate" type="date"></label>
<label>تاريخ الإتاحة<input id="gAvailable" type="date"></label>
<label>ملاحظات<textarea id="gNotes"></textarea></label>
</div>
<div class="actions"><button>حفظ</button><button type="button" class="light" onclick="resetGrave()">إلغاء</button></div>
</form>
</div>
<div class="card">
<div class="toolbar"><input id="graveSearch" placeholder="بحث برقم القبر أو العائلة أو المالك" oninput="renderGraves()"></div>
<div class="table-wrap"><table><thead><tr><th>الرقم</th><th>المدفن</th><th>العائلة</th><th>الحالة</th><th>الإتاحة</th><th>إجراءات</th></tr></thead><tbody id="graveBody"></tbody></table></div>
</div>
</section>

<form id="burialForm">
<div class="grid">
<label>القبر<select id="bGrave" required></select></label>
<label>الشخص<select id="bPerson"></select></label>
<label>اسم المتوفى<input id="bName" required></label>
<label>تاريخ الوفاة<input id="bDeath" type="date"></label>
<label>تاريخ الدفن<input id="bDate" type="date" required></label>
<label>العمر<input id="bAge" type="number"></label>
<label>المصدر<select id="bSource"><option>الشاهدة</option><option>سجل رسمي</option><option>رواية أهلية</option></select></label>
<label>ملاحظات<textarea id="bNotes"></textarea></label>
</div>
<div class="actions"><button>حفظ وتحديث القبر</button></div>
</form>
</div>
<div class="card"><div class="table-wrap"><table><thead><tr><th>المتوفى</th><th>القبر</th><th>تاريخ الوفاة</th><th>تاريخ الدفن</th><th>المصدر</th><th>إجراء</th></tr></thead><tbody id="burialBody"></tbody></table></div></div>
</section>

<label>نوع البيانات
<select id="importType">

<option value="cemeteries">المدافن</option>
<option value="graves">القبور</option>

</select>

</div>

<div id="importResult"></div>
</div>

</main>
<footer>نظام إدارة قرية زعورة</footer>

<script>
const empty={people:[],cemeteries:[],graves:[],burials:[]};
let data=JSON.parse(localStorage.getItem("zaouraData")||"null")||empty;

const \$=id=>document.getElementById(id);
const newId=()=>Date.now()+Math.floor(Math.random()*100000);
const save=()=>{localStorage.setItem("zaouraData",JSON.stringify(data));refresh()};
const esc=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));
const dateAdd=(date,years)=>{
  if(!date)return "";
  const d=new Date(date);
  d.setFullYear(d.getFullYear()+Number(years||0));
  return d.toISOString().slice(0,10);
};

function badge(value){
  const c=["حي","فارغ"].includes(value)?"green":
    ["متوفى","مشغول"].includes(value)?"red":
    ["معفي","منسحب","متاح لإعادة الاستخدام"].includes(value)?"orange":"blue";
  return `<span class="badge ${c}">${esc(value)}</span>`;
}

function removeItem(type,itemId){
  if(!confirm("هل تريد حذف هذا السجل؟"))return;
  data[type]=data[type].filter(x=>x.id!=itemId);
  save();
}

function fillPeopleLists(){
  const options='<option value="">— لا يوجد —</option>'+
    data.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");

  \$("pFather").innerHTML=options;
  \$("pMother").innerHTML=options;

  \$("familySelect").innerHTML=data.people.length
    ?data.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")
    :'<option value="">لا توجد بيانات</option>';
}

function resetPerson(){
  \$("peopleForm").reset();
  \$("personId").value="";
  fillPeopleLists();
}

function editPerson(itemId){
  const p=data.people.find(x=>x.id==itemId);
  if(!p)return;

  \$("personId").value=p.id;
  \$("pName").value=p.name||"";
  \$("pGender").value=p.gender||"ذكر";
  \$("pBirth").value=p.birth||"";
  \$("pDeath").value=p.death||"";
  \$("pFamily").value=p.familyCode||"";
  \$("pMember").value=p.memberCode||"";
  \$("pSector").value=p.sector||"الجبل";
  \$("pStatus").value=p.status||"حي";
  \$("pRelation").value=p.relation||"";
  \$("pPhone").value=p.phone||"";
  \$("pNotes").value=p.notes||"";
  fillPeopleLists();
  \$("pFather").value=p.father||"";
  \$("pMother").value=p.mother||"";
  window.scrollTo({top:0,behavior:"smooth"});
}

\$("peopleForm").onsubmit=e=>{
  e.preventDefault();

  const p={
    id:Number(\$("personId").value)||newId(),
    name:\$("pName").value.trim(),
    gender:\$("pGender").value,
    birth:\$("pBirth").value,
    death:\$("pDeath").value,
    familyCode:\$("pFamily").value.trim(),
    memberCode:\$("pMember").value.trim(),
    sector:\$("pSector").value,
    status:\$("pStatus").value,
    relation:\$("pRelation").value,
    father:Number(\$("pFather").value)||null,
    mother:Number(\$("pMother").value)||null,
    phone:\$("pPhone").value.trim(),
    notes:\$("pNotes").value.trim()
  };

  const index=data.people.findIndex(x=>x.id===p.id);
  index>=0?data.people[index]=p:data.people.push(p);
  resetPerson();
  save();
};

function renderPeople(){
  const q=(\$("peopleSearch").value||"").toLowerCase();
  const rows=data.people.filter(p=>
    `${p.name} ${p.familyCode} ${p.sector}`.toLowerCase().includes(q)
  );

  \$("peopleBody").innerHTML=rows.map(p=>\`
    <tr>
      <td>\${esc(p.name)}</td>
      <td>\${esc(p.gender)}</td>
      <td>\${esc(p.familyCode)}</td>
      <td>\${esc(p.relation||"—")}</td>
      <td>\${esc(p.sector)}</td>
      <td>\${badge(p.status)}</td>
      <td>
        <button onclick="editPerson(\${p.id})">تعديل</button>
        <button class="danger" onclick="removeItem('people',\${p.id})">حذف</button>
      </td>
    </tr>\`).join("");

  \$("peopleStats").innerHTML=\`
    <div class="stat">إجمالي الأفراد<b>\${data.people.length}</b></div>
    <div class="stat">الذكور<b>\${data.people.filter(p=>p.gender==="ذكر").length}</b></div>
    <div class="stat">الإناث<b>\${data.people.filter(p=>p.gender==="أنثى").length}</b></div>
    <div class="stat">الأحياء<b>\${data.people.filter(p=>p.status==="حي").length}</b></div>\`;
}

function resetCem(){
  \$("cemForm").reset();
  \$("cemId").value="";
  \$("cemLegal").value="وقفية";
}

function editCem(itemId){
  const c=data.cemeteries.find(x=>x.id==itemId);
  if(!c)return;

  \$("cemId").value=c.id;
  \$("cemName").value=c.name||"";
  \$("cemLocation").value=c.location||"";
  \$("cemOpen").value=c.openDate||"";
  \$("cemArea").value=c.area||"";
  \$("cemManager").value=c.manager||"";
  \$("cemPhone").value=c.phone||"";
  \$("cemLegal").value=c.legalStatus||"";
  \$("cemNotes").value=c.notes||"";
}

\$("cemForm").onsubmit=e=>{
  e.preventDefault();

  const c={
    id:Number(\$("cemId").value)||newId(),
    name:\$("cemName").value.trim(),
    location:\$("cemLocation").value.trim(),
    openDate:\$("cemOpen").value,
    area:Number(\$("cemArea").value)||0,
    manager:\$("cemManager").value.trim(),
    phone:\$("cemPhone").value.trim(),
    legalStatus:\$("cemLegal").value.trim(),
    notes:\$("cemNotes").value.trim()
  };

  const index=data.cemeteries.findIndex(x=>x.id===c.id);
  index>=0?data.cemeteries[index]=c:data.cemeteries.push(c);
  resetCem();
  save();
};

function renderCemeteries(){
  \$("cemBody").innerHTML=data.cemeteries.map(c=>\`
    <tr>
      <td>\${esc(c.name)}</td>
      <td>\${esc(c.location)}</td>
      <td>\${esc(c.manager)}</td>
      <td>\${data.graves.filter(g=>g.cemeteryId==c.id).length}</td>
      <td>
        <button onclick="editCem(\${c.id})">تعديل</button>
        <button class="danger" onclick="removeItem('cemeteries',\${c.id})">حذف</button>
      </td>
    </tr>\`).join("");
}

function fillCemeteries(){
  \$("gCemetery").innerHTML=data.cemeteries.map(c=>
    `<option value="${c.id}">${esc(c.name)}</option>`).join("");
}

function resetGrave(){
  \$("graveForm").reset();
  \$("graveId").value="";
  \$("gYears").value=10;
}

function editGrave(itemId){
  const g=data.graves.find(x=>x.id==itemId);
  if(!g)return;

  \$("graveId").value=g.id;
  \$("gNumber").value=g.number||"";
  \$("gCemetery").value=g.cemeteryId||"";
  \$("gLocation").value=g.location||"";
  \$("gType").value=g.type||"عام";
  \$("gFamily").value=g.family||"";
  \$("gOwner").value=g.owner||"";
  \$("gStatus").value=g.status||"فارغ";
  \$("gYears").value=g.years||10;
  \$("gLast").value=g.lastBuried||"";
  \$("gDate").value=g.lastBurialDate||"";
  \$("gAvailable").value=g.availableDate||"";
  \$("gNotes").value=g.notes||"";
}

\$("graveForm").onsubmit=e=>{
  e.preventDefault();

  const g={
    id:Number(\$("graveId").value)||newId(),
    number:\$("gNumber").value.trim(),
    cemeteryId:Number(\$("gCemetery").value)||null,
    location:\$("gLocation").value.trim(),
    type:\$("gType").value,
    family:\$("gFamily").value.trim(),
    owner:\$("gOwner").value.trim(),
    status:\$("gStatus").value,
    years:Number(\$("gYears").value)||10,
    lastBuried:\$("gLast").value.trim(),
    lastBurialDate:\$("gDate").value,
    availableDate:\$("gAvailable").value,
    notes:\$("gNotes").value.trim()
  };

  const duplicate=data.graves.some(x=>x.number===g.number&&x.id!==g.id);
  if(duplicate)return alert("رقم القبر موجود مسبقاً.");

  const index=data.graves.findIndex(x=>x.id===g.id);
  index>=0?data.graves[index]=g:data.graves.push(g);
  resetGrave();
  save();
};

function currentGraveStatus(g){
  if(g.status==="مشغول"&&g.availableDate&&new Date(g.availableDate)<=new Date())
    return "متاح لإعادة الاستخدام";
  return g.status;
}

function renderGraves(){
  const q=(\$("graveSearch").value||"").toLowerCase();

  \$("graveBody").innerHTML=data.graves.filter(g=>
    `${g.number} ${g.family} ${g.owner}`.toLowerCase().includes(q)
  ).map(g=>{
    const c=data.cemeteries.find(x=>x.id==g.cemeteryId);
    return \`
    <tr>
      <td>\${esc(g.number)}</td>
      <td>\${esc(c?.name||"غير مرتبط")}</td>
      <td>\${esc(g.family)}</td>
      <td>\${badge(currentGraveStatus(g))}</td>
      <td>\${esc(g.availableDate||"—")}</td>
      <td>
        <button onclick="editGrave(\${g.id})">تعديل</button>
        <button class="danger" onclick="removeItem('graves',\${g.id})">حذف</button>
      </td>
    </tr>\`;
  }).join("");
}

function fillBurialLists(){
  \$("bGrave").innerHTML=data.graves.map(g=>
    `<option value="${g.id}">${esc(g.number)}</option>`).join("");

  \$("bPerson").innerHTML='<option value="">غير مرتبط</option>'+
    data.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
}

\$("bPerson").onchange=()=>{
  const p=data.people.find(x=>x.id==\$("bPerson").value);
  if(p){
    \$("bName").value=p.name;
    \$("bDeath").value=p.death||"";
    \$("bAge").value=ageAtDeath(p.birth,p.death);
  }
};

function ageAtDeath(birth,death){
  if(!birth||!death)return"";
  const a=new Date(birth),b=new Date(death);
  let age=b.getFullYear()-a.getFullYear();
  if(b.getMonth()<a.getMonth()||
    b.getMonth()===a.getMonth()&&b.getDate()<a.getDate())age--;
  return age>=0?age:"";
}

\$("burialForm").onsubmit=e=>{
  e.preventDefault();

  const grave=data.graves.find(g=>g.id==\$("bGrave").value);
  if(!grave)return alert("اختر القبر.");

  const person=data.people.find(p=>p.id==\$("bPerson").value);
  const cem=data.cemeteries.find(c=>c.id==grave.cemeteryId);

  const burial={
    id:newId(),
    graveId:grave.id,
    graveNumber:grave.number,
    cemeteryName:cem?.name||"",
    personName:\$("bName").value.trim(),
    personId:person?.id||null,
    deathDate:\$("bDeath").value,
    burialDate:\$("bDate").value,
    age:Number(\$("bAge").value)||null,
    source:\$("bSource").value,
    year:new Date(\$("bDate").value).getFullYear(),
    notes:\$("bNotes").value.trim()
  };

  data.burials.push(burial);
  grave.status="مشغول";
  grave.lastBuried=burial.personName;
  grave.lastBurialDate=burial.burialDate;
  grave.availableDate=dateAdd(burial.burialDate,grave.years);

  if(person){
    person.status="متوفى";
    if(!person.death)person.death=burial.deathDate;
  }

  \$("burialForm").reset();
  save();
};

function renderBurials(){
  \$("burialBody").innerHTML=data.burials.map(b=>\`
    <tr>
      <td>\${esc(b.personName)}</td>
      <td>\${esc(b.graveNumber)}</td>
      <td>\${esc(b.deathDate||"—")}</td>
      <td>\${esc(b.burialDate)}</td>
      <td>\${esc(b.source)}</td>
      <td><button class="danger" onclick="removeItem('burials',\${b.id})">حذف</button></td>
    </tr>\`).join("");
}

function personCard(p,selected=false){
  if(!p)return"";
  const icon=p.gender==="أنثى"?"👩":"👨";
  return \`<div class="person \${p.gender==="أنثى"?"female":""} \${selected?"selected":""}" onclick="editPerson(\${p.id})">
    \${icon}<br>\${esc(p.name)}<br>\${badge(p.status)}
  </div>\`;
}

function descendants(personId,level=0){
  if(level>3)return"";
  const children=data.people.filter(p=>p.father==personId||p.mother==personId);
  if(!children.length)return"";

  return \`<div class="tree-group">
    <b>\${level===0?"الأبناء":"الأحفاد"}</b>
    <div class="children">
      \${children.map(c=>\`
        <div>
          \${personCard(c)}
          \${descendants(c.id,level+1)}
        </div>\`).join("")}
    </div>
  </div>\`;
}

function renderFamily(){
  const p=data.people.find(x=>x.id==\$("familySelect").value)||data.people[0];

  if(!p){
    \$("familyTree").innerHTML='<p class="muted">لا توجد بيانات أفراد.</p>';
    return;
  }

  const father=data.people.find(x=>x.id==p.father);
  const mother=data.people.find(x=>x.id==p.mother);

  const spouses=data.people.filter(x=>
    x.id!==p.id&&
    ((x.gender==="أنثى"&&data.people.some(c=>c.father==p.id&&c.mother==x.id))||
     (x.gender==="ذكر"&&data.people.some(c=>c.mother==p.id&&c.father==x.id)))
  );

  \$("familyTree").innerHTML=\`
    <div class="family">
      <div class="parents">\${personCard(father)}\${personCard(mother)}</div>
      <div>⬇</div>
      \${personCard(p,true)}
      \${spouses.length?`<div class="wives">${spouses.map(x=>personCard(x)).join("")}</div>`:""}
      <div>⬇</div>
      \${descendants(p.id)}
    </div>\`;
}

function refresh(){
  renderPeople();
  renderCemeteries();
  fillCemeteries();
  renderGraves();
  fillPeopleLists();
  fillBurialLists();
  renderBurials();
  renderFamily();

  \$("homeStats").innerHTML=[
    ["الأفراد",data.people.length],
    ["الأحياء",data.people.filter(p=>p.status==="حي").length],
    ["المدافن",data.cemeteries.length],
    ["القبور",data.graves.length],
    ["سجلات الدفن",data.burials.length]
  ].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join("");
}

function downloadBackup(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="zaoura-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function restoreBackup(input){
  const file=input.files[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{
    try{
      const restored=JSON.parse(reader.result);

      if(!restored.people||!restored.cemeteries||
         !restored.graves||!restored.burials)
        throw new Error("البنية غير صحيحة");

      data=restored;
      save();
      alert("تمت استعادة النسخة بنجاح.");
    }catch(error){
      alert("ملف JSON غير صالح: "+error.message);
    }
  };

  reader.readAsText(file);
}

function clearAll(){
  if(!confirm("سيتم حذف جميع البيانات نهائياً. هل أنت متأكد؟"))return;
  data=JSON.parse(JSON.stringify(empty));
  save();
}

function getVal(row,...keys){
  for(const key of keys){
    const normalized=String(key).replace(/[\s\_]/g,"").toLowerCase();

    const found=Object.keys(row).find(k=>
      String(k).replace(/[\s_]/g,"").toLowerCase()===normalized
    );

    if(found&&String(row[found]).trim()!=="")
      return row[found];
  }

  return"";
}

function excelDate(value){
  if(value===null||value===undefined||value==="")return"";

  if(value instanceof Date&&!isNaN(value))
    return value.toISOString().slice(0,10);

  const text=String(value).trim();

  if(/^\d+(\\.\d+)?\$/.test(text)){
    const serial=Number(text);
    const d=new Date(Date.UTC(1899,11,30)+serial\*86400000);
    if(!isNaN(d))return d.toISOString().slice(0,10);
  }

  const normalized=text.replace(/[./]/g,"-");
  const m=normalized.match(/^(\d{4})-(\d{1,2})-(\d{1,2})\$/);

  if(m){
    return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  }

  return text;
}

function importExcel(){
  if(typeof XLSX==="undefined"){
    alert("تعذر تحميل مكتبة Excel. تحقق من اتصال الإنترنت.");
    return;
  }

  const file=\$("excelFile").files[0];
  if(!file){
    alert("اختر ملف Excel أولاً.");
    return;
  }

  const type=\$("importType").value;
  const reader=new FileReader();

  reader.onload=event=>{
    try{
      const workbook=XLSX.read(event.target.result,{
        type:"array",
        cellDates:true
      });

      const sheet=workbook.Sheets[workbook.SheetNames[0]];
      const rows=XLSX.utils.sheet\_to\_json(sheet,{
        defval:"",
        raw:false
      });

      let ok=0,skip=0,errors=0;
      const importedPeople=[];

      rows.forEach(row=>{
        try{
          if(type==="people"){
            const name=String(getVal(row,"الاسم","الاسم الثلاثي","name")).trim();
            const birth=excelDate(getVal(row,"تاريخ الميلاد","birth","dateOfBirth"));

            if(!name||data.people.some(p=>p.name===name&&p.birth===birth)){
              skip++;return;
            }

            const p={
              id:newId(),
              name,
              gender:String(getVal(row,"الجنس","gender")||"ذكر"),
              birth,
              death:excelDate(getVal(row,"تاريخ الوفاة","death","dateOfDeath")),
              familyCode:String(getVal(row,"كود الأسرة","familyCode","كود\_الأسرة")),
              memberCode:String(getVal(row,"رقم الفرد","memberCode")),
              sector:String(getVal(row,"القطاع","sector")),
              status:String(getVal(row,"الحالة","حالة العضو","status")||"حي"),
              relation:String(getVal(row,"صلة القرابة","القرابة","relation")),
              father:null,
              mother:null,
              phone:String(getVal(row,"الهاتف","الجوال","phone")),
              notes:String(getVal(row,"ملاحظات","notes"))
            };

            data.people.push(p);
            importedPeople.push({
              person:p,
              fatherName:String(getVal(row,"الأب","اسم الأب","father")),
              motherName:String(getVal(row,"الأم","اسم الأم","mother"))
            });
            ok++;
          }

          else if(type==="cemeteries"){
            const name=String(getVal(row,"اسم المدفن","المدفن","name")).trim();

            if(!name||data.cemeteries.some(c=>c.name===name)){
              skip++;return;
            }

            data.cemeteries.push({
              id:newId(),
              name,
              location:String(getVal(row,"الموقع","location")),
              openDate:excelDate(getVal(row,"تاريخ الافتتاح","openDate")),
              area:Number(getVal(row,"المساحة","area"))||0,
              manager:String(getVal(row,"المسؤول","manager")),
              phone:String(getVal(row,"الهاتف","phone")),
              legalStatus:String(getVal(row,"الوضع القانوني","legalStatus")||"وقفية"),
              notes:String(getVal(row,"ملاحظات","notes"))
            });
            ok++;
          }

          else if(type==="graves"){
            const number=String(getVal(row,"رقم القبر","رقم\_القبر","graveNumber")).trim();

            if(!number||data.graves.some(g=>g.number===number)){
              skip++;return;
            }

            const cemeteryName=String(getVal(row,"المدفن","اسم المدفن","cemetery")).trim();
            const cemetery=data.cemeteries.find(c=>c.name===cemeteryName);

            data.graves.push({
              id:newId(),
              number,
              cemeteryId:cemetery?.id||Number(cemeteryName)||null,
              location:String(getVal(row,"الموقع","location")),
              type:String(getVal(row,"النوع","type")||"عام"),
              family:String(getVal(row,"العائلة","family")),
              owner:String(getVal(row,"المالك","owner")),
              status:String(getVal(row,"الحالة","status")||"فارغ"),
              years:Number(getVal(row,"السنوات","مدة إعادة الاستخدام","years"))||10,
              lastBuried:String(getVal(row,"آخر مدفون","lastBuried")),
              lastBurialDate:excelDate(getVal(row,"تاريخ آخر دفن","lastBurialDate")),
              availableDate:excelDate(getVal(row,"تاريخ الإتاحة","availableDate")),
              notes:String(getVal(row,"ملاحظات","notes"))
            });
            ok++;
          }

          else if(type==="burials"){
            const number=String(getVal(row,"رقم القبر","رقم\_القبر","graveNumber")).trim();
            const grave=data.graves.find(g=>g.number===number);

            if(!grave){
              skip++;return;
            }

            const burialDate=excelDate(getVal(row,"تاريخ الدفن","burialDate"));

            data.burials.push({
              id:newId(),
              graveId:grave.id,
              graveNumber:number,
              cemeteryName:String(getVal(row,"اسم المدفن","المدفن","cemetery")),
              personName:String(getVal(row,"اسم المتوفى","الاسم","personName")),
              personId:null,
              deathDate:excelDate(getVal(row,"تاريخ الوفاة","deathDate")),
              burialDate,
              age:Number(getVal(row,"العمر","age"))||null,
              source:String(getVal(row,"المصدر","source")||"Excel"),
              year:Number(getVal(row,"السنة","year"))||(
                burialDate?new Date(burialDate).getFullYear():null
              ),
              notes:String(getVal(row,"ملاحظات","notes"))
            });

            grave.status="مشغول";
            grave.lastBurialDate=burialDate;
            grave.lastBuried=String(getVal(row,"اسم المتوفى","الاسم","personName"));
            grave.availableDate=dateAdd(burialDate,grave.years);
            ok++;
          }
        }catch(error){
          errors++;
        }
      });

      /* ربط الأب والأم بعد استيراد جميع الأفراد */
      importedPeople.forEach(item=>{
        const father=data.people.find(p=>p.name===item.fatherName);
        const mother=data.people.find(p=>p.name===item.motherName);

        if(father)item.person.father=father.id;
        if(mother)item.person.mother=mother.id;
      });

      save();

      \$("importResult").innerHTML=\`
        <div class="alert">
          تم استيراد \${ok} صف بنجاح،
          وتجاوز \${skip} صف مكرر أو غير صالح،
          وحدثت \${errors} أخطاء.
        </div>\`;
    }catch(error){
      \$("importResult").innerHTML=
        `<div class="alert error">تعذر قراءة الملف: ${esc(error.message)}</div>`;
    }
  };

  reader.readAsArrayBuffer(file);
}

document.querySelectorAll("nav button").forEach(button=>{
  button.onclick=()=>{
    document.querySelectorAll(".page").forEach(page=>page.classList.remove("active"));
    document.querySelectorAll("nav button").forEach(btn=>btn.classList.remove("active"));

    \$(button.dataset.page).classList.add("active");
    button.classList.add("active");
    refresh();
  };
});

refresh();
</script>
