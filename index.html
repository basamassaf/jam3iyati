<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الجمعية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 10px; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; font-size: 22px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 20px; font-size: 13px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #2c3e50; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: #95a5a6; }
        .btn-success { background: #27ae60; }
        .btn-warning { background: #f39c12; }
        .btn-danger { background: #e74c3c; }
        .btn-info { background: #3498db; }
        .btn-small { width: auto; padding: 6px 12px; font-size: 13px; margin: 3px; display: inline-block; }
        .error { background: #fee; color: #c33; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; text-align: center; }
        .success { background: #efe; color: #3a3; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; text-align: center; }
        .loading { text-align: center; color: #667eea; margin: 15px 0; }
        .member-card { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-right: 4px solid #667eea; }
        .member-card h4 { color: #2c3e50; margin-bottom: 4px; font-size: 15px; }
        .member-card p { color: #7f8c8d; font-size: 12px; margin: 2px 0; }
        .member-actions { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
        .badge { display: inline-block; padding: 3px 7px; border-radius: 4px; font-size: 11px; font-weight: bold; margin: 2px; }
        .badge-active { background: #d4edda; color: #155724; }
        .badge-young { background: #d1ecf1; color: #0c5460; }
        .badge-senior { background: #fff3cd; color: #856404; }
        .badge-head { background: #667eea; color: white; }
        .badge-sub { background: #e9ecef; color: #495057; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-modal { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .stat-box { background: #e3f2fd; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .stat-box:hover { transform: translateY(-2px); box-shadow: 0 3px 10px rgba(0,0,0,0.15); }
        .stat-box.active-filter { background: #667eea; color: white; }
        .stat-box.active-filter h4, .stat-box.active-filter p { color: white; }
        .stat-box h4 { font-size: 22px; color: #1976d2; }
        .stat-box p { font-size: 11px; color: #666; }
        .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .filter-row select, .filter-row input { flex: 1; min-width: 120px; padding: 8px; font-size: 14px; }
        .whatsapp-btn { background: #25D366; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .export-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .export-buttons button { flex: 1; min-width: 120px; }
        .family-group { background: #fff3cd; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-right: 4px solid #f39c12; }
        .family-group h4 { color: #856404; margin-bottom: 8px; }
        .family-member { background: white; padding: 8px; border-radius: 6px; margin-bottom: 5px; border-right: 3px solid #667eea; }
        .view-toggle { display: flex; gap: 5px; margin-bottom: 12px; }
        .view-toggle button { flex: 1; padding: 8px; }
        .view-toggle button.active { background: #667eea; }
        #loginScreen, #dashboard, #membersSection { display: none; }
        #loginScreen.active, #dashboard.active, #membersSection.active { display: block; }
        .cache-indicator { position: fixed; top: 10px; left: 10px; background: #27ae60; color: white; padding: 8px 12px; border-radius: 8px; font-size: 12px; display: none; z-index: 1000; }
        .results-count { background: #e3f2fd; padding: 8px; border-radius: 6px; margin-bottom: 10px; text-align: center; font-size: 13px; color: #1976d2; }
    </style>
</head>
<body>

<div class="cache-indicator" id="cacheIndicator">⚡ تم التحميل من الذاكرة المؤقتة</div>

<div class="container">
    <div id="loginScreen" class="active">
        <h1>🏛️ نظام إدارة الجمعية</h1>
        <p class="subtitle">تسجيل دخول المستخدمين</p>
        <div class="error" id="errorMsg"></div>
        <div class="input-group">
            <label>البريد الإلكتروني:</label>
            <input type="email" id="email" placeholder="example@email.com">
        </div>
        <div class="input-group">
            <label>كلمة المرور:</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn" onclick="doLogin()">تسجيل الدخول</button>
    </div>

    <div id="dashboard">
        <h1>مرحباً، <span id="userName"></span></h1>
        <p class="subtitle">👑 مدير عام</p>
        <button class="btn" onclick="showMembers()">👥 إدارة الأعضاء</button>
        <button class="btn btn-secondary" onclick="doLogout()" style="margin-top: 10px;">تسجيل الخروج</button>
    </div>

    <div id="membersSection">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2>👥 إدارة الأعضاء</h2>
            <button class="btn btn-secondary btn-small" onclick="showDashboard()">← رجوع</button>
        </div>
        
        <!-- إحصائيات ديناميكية -->
        <div class="stats-row" id="statsRow">
            <div class="stat-box" onclick="quickFilter('all')">
                <h4 id="totalCount">0</h4>
                <p>الكل</p>
            </div>
            <div class="stat-box" onclick="quickFilter('active')">
                <h4 id="activeCount">0</h4>
                <p>نشط</p>
            </div>
            <div class="stat-box" onclick="quickFilter('young')">
                <h4 id="youngCount">0</h4>
                <p>شباب</p>
            </div>
            <div class="stat-box" onclick="quickFilter('senior')">
                <h4 id="seniorCount">0</h4>
                <p>كبار</p>
            </div>
            <div class="stat-box" onclick="quickFilter('sub_both')">
                <h4 id="bothCount">0</h4>
                <p>مزدوج</p>
            </div>
            <div class="stat-box" onclick="quickFilter('sub_assoc')">
                <h4 id="assocCount">0</h4>
                <p>جمعية فقط</p>
            </div>
            <div class="stat-box" onclick="quickFilter('sub_death')">
                <h4 id="deathCount">0</h4>
                <p>وفاة فقط</p>
            </div>
            <div class="stat-box" onclick="quickFilter('new_members')">
                <h4 id="newCount">0</h4>
                <p>جدد (2024+)</p>
            </div>
        </div>

        <!-- بحث -->
        <div class="filter-row">
            <input type="text" id="searchInput" placeholder="🔍 ابحث بالاسم، الكود، الهاتف، العنوان..." oninput="debounceSearch()">
        </div>
        
        <!-- فلاتر متقدمة -->
        <div class="filter-row">
            <select id="filterSector" onchange="applyFilters()">
                <option value="">كل القطاعات</option>
                <option value="الحارة 1">الحارة 1</option>
                <option value="الحارة 2">الحارة 2</option>
                <option value="الوادي">الوادي</option>
                <option value="المنصورة">المنصورة</option>
                <option value="الجبل">الجبل</option>
                <option value="دمر">دمر</option>
            </select>
            <select id="filterStatus" onchange="applyFilters()">
                <option value="">كل الحالات</option>
                <option value="active">نشط</option>
                <option value="exempt">معفي</option>
                <option value="suspended">متوقف</option>
                <option value="withdrawn">منسحب</option>
                <option value="deceased">متوفي</option>
            </select>
        </div>
        
        <div class="filter-row">
            <select id="filterSubscription" onchange="applyFilters()">
                <option value="">كل الاشتراكات</option>
                <option value="both">مزدوج (جمعية + وفاة)</option>
                <option value="association">جمعية فقط</option>
                <option value="death">وفاة فقط</option>
                <option value="none">غير مشترك</option>
            </select>
            <select id="filterRelation" onchange="applyFilters()">
                <option value="">كل الصلات</option>
                <option value="رب أسرة">رب أسرة</option>
                <option value="زوجة">زوجة</option>
                <option value="ابن">ابن</option>
                <option value="بنت">بنت</option>
            </select>
        </div>

        <div class="filter-row">
            <select id="filterType" onchange="applyFilters()">
                <option value="">كل الأنواع</option>
                <option value="young">شاب (&lt;30)</option>
                <option value="senior">كبير (&gt;60)</option>
                <option value="normal">عادي</option>
            </select>
            <select id="filterYear" onchange="applyFilters()">
                <option value="">كل السنوات</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
                <option value="older">أقدم</option>
            </select>
        </div>
        
        <div class="view-toggle">
            <button class="btn btn-small" id="viewIndividual" onclick="setView('individual')">👤 أفراد</button>
            <button class="btn btn-small" id="viewFamily" onclick="setView('family')">👨‍‍👧‍ أسر</button>
        </div>

        <div class="export-buttons">
            <button class="btn btn-success btn-small" onclick="openAddMemberModal()">+ إضافة</button>
            <button class="btn btn-info btn-small" onclick="exportToExcel()">📊 Excel</button>
            <button class="btn btn-warning btn-small" onclick="resetFilters()">🔄 إعادة تعيين</button>
        </div>
        
        <div class="results-count" id="resultsCount">جاري التحميل...</div>
        <div id="membersList"></div>
    </div>
</div>

<!-- نافذة إضافة/تعديل -->
<div id="memberModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">إضافة عضو جديد</h3>
            <button class="close-modal" onclick="closeMemberModal()">×</button>
        </div>
        <form id="memberForm" onsubmit="saveMember(event)">
            <input type="hidden" id="memberId">
            <div class="form-row">
                <div class="input-group"><label>كود الأسرة *</label><input type="text" id="familyCode" required></div>
                <div class="input-group"><label>كود الفرد *</label><input type="text" id="memberCode" required></div>
            </div>
            <div class="input-group"><label>الاسم الثلاثي *</label><input type="text" id="memberName" required></div>
            <div class="form-row">
                <div class="input-group"><label>تاريخ الميلاد</label><input type="date" id="birthDate" onchange="calculateAge()"></div>
                <div class="input-group"><label>العمر</label><input type="number" id="memberAge" readonly></div>
            </div>
            <div class="form-row">
                <div class="input-group"><label>نوع العضو</label>
                    <select id="memberType">
                        <option value="normal">عادي</option>
                        <option value="young">شاب (&lt;30)</option>
                        <option value="senior">كبير (&gt;60)</option>
                        <option value="disabled">معاق</option>
                    </select>
                </div>
                <div class="input-group"><label>صلة القرابة</label>
                    <select id="relation">
                        <option value="رب أسرة">رب أسرة</option>
                        <option value="زوجة">زوجة</option>
                        <option value="ابن">ابن</option>
                        <option value="بنت">بنت</option>
                    </select>
                </div>
            </div>
            <div class="input-group"><label>القطاع</label>
                <select id="memberSector">
                    <option value="الحارة 1">الحارة 1</option>
                    <option value="الحارة 2">الحارة 2</option>
                    <option value="الوادي">الوادي</option>
                    <option value="المنصورة">المنصورة</option>
                    <option value="الجبل">الجبل</option>
                    <option value="دمر">دمر</option>
                </select>
            </div>
            <div class="form-row">
                <div class="input-group"><label>رقم الجوال</label><input type="tel" id="memberPhone"></div>
                <div class="input-group"><label>البريد</label><input type="email" id="memberEmail"></div>
            </div>
            <div class="input-group"><label>العنوان</label><textarea id="memberAddress" rows="2"></textarea></div>
            <div class="form-row">
                <div class="input-group"><label>المهنة</label><input type="text" id="memberJob"></div>
                <div class="input-group"><label>تاريخ الانضمام</label><input type="date" id="joinDate"></div>
            </div>
            <div class="input-group"><label>نوع الاشتراك:</label>
                <div style="display:flex;gap:15px;margin:8px 0;">
                    <label><input type="checkbox" id="subAssociation"> جمعية</label>
                    <label><input type="checkbox" id="subDeath"> وفاة</label>
                </div>
            </div>
            <div class="form-row">
                <div class="input-group"><label>تاريخ اشتراك الجمعية</label><input type="date" id="associationDate"></div>
                <div class="input-group"><label>تاريخ اشتراك الوفاة</label><input type="date" id="deathDate"></div>
            </div>
            <div class="input-group"><label>حالة العضو:</label>
                <select id="memberStatus">
                    <option value="active">نشط</option>
                    <option value="exempt">معفي</option>
                    <option value="suspended">متوقف</option>
                    <option value="withdrawn">منسحب</option>
                    <option value="deceased">متوفي</option>
                </select>
            </div>
            <div class="input-group"><label>ملاحظات:</label><textarea id="memberNotes" rows="2"></textarea></div>
            <button type="submit" class="btn btn-success">حفظ</button>
            <button type="button" class="btn btn-secondary" onclick="closeMemberModal()">إلغاء</button>
        </form>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBwBOJjthFdSc7jv0dGL325kcaNqzD9dII",
    authDomain: "jam3iyati-b7528.firebaseapp.com",
    projectId: "jam3iyati-b7528",
    storageBucket: "jam3iyati-b7528.firebasestorage.app",
    messagingSenderId: "499100272911",
    appId: "1:499100272911:web:5bda121dbffa085770567a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let allMembers = [];
let filteredMembers = [];
let currentView = 'individual';
let searchTimeout = null;

// ========== تسجيل الدخول ==========
auth.onAuthStateChanged(user => {
    if (user) { currentUser = user; showDashboard(); }
    else { showLogin(); }
});

function showLogin() {
    document.getElementById('loginScreen').classList.add('active');
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('membersSection').classList.remove('active');
}

function showDashboard() {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('membersSection').classList.remove('active');
    document.getElementById('dashboard').classList.add('active');
    if (currentUser) document.getElementById('userName').textContent = currentUser.email.split('@')[0];
}

function showMembers() {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('membersSection').classList.add('active');
    loadMembers();
}

function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    
    if (!email || !password) {
        errorMsg.textContent = '⚠️ أدخل البريد وكلمة المرور';
        errorMsg.style.display = 'block';
        return;
    }
    
    auth.signInWithEmailAndPassword(email, password)
        .catch(error => {
            errorMsg.textContent = '❌ خطأ: ' + error.message;
            errorMsg.style.display = 'block';
        });
}

function doLogout() { auth.signOut(); }

// ========== تحميل الأعضاء مع Cache ==========
async function loadMembers() {
    const container = document.getElementById('membersList');
    const resultsCount = document.getElementById('resultsCount');
    resultsCount.textContent = 'جاري التحميل...';
    container.innerHTML = '<div class="loading">⏳ جاري تحميل الأعضاء...</div>';
    
    // محاولة التحميل من Cache أولاً (سرعة)
    const cached = localStorage.getItem('membersCache');
    const cacheTime = localStorage.getItem('membersCacheTime');
    const now = Date.now();
    
    if (cached && cacheTime && (now - parseInt(cacheTime)) < 300000) { // 5 دقائق
        allMembers = JSON.parse(cached);
        document.getElementById('cacheIndicator').style.display = 'block';
        setTimeout(() => document.getElementById('cacheIndicator').style.display = 'none', 2000);
        filteredMembers = [...allMembers];
        updateStats();
        displayMembers();
        return;
    }
    
    // تحميل من Firebase
    try {
        const snapshot = await db.collection('members').get();
        allMembers = [];
        snapshot.forEach(doc => {
            allMembers.push({ id: doc.id, ...doc.data() });
        });
        
        // ترتيب
        allMembers.sort((a, b) => {
            const codeA = (a.familyCode || '') + (a.memberCode || '');
            const codeB = (b.familyCode || '') + (b.memberCode || '');
            return codeA.localeCompare(codeB);
        });
        
        // حفظ في Cache
        localStorage.setItem('membersCache', JSON.stringify(allMembers));
        localStorage.setItem('membersCacheTime', now.toString());
        
        filteredMembers = [...allMembers];
        updateStats();
        displayMembers();
    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = '<p style="text-align:center;color:#e74c3c;">خطأ: ' + error.message + '</p>';
        resultsCount.textContent = 'حدث خطأ في التحميل';
    }
}

// ========== حساب العمر ==========
function calculateAge() {
    const birthDate = document.getElementById('birthDate').value;
    if (!birthDate) return;
    
    const today = new Date();
    const birth = new Date(birthDate);
    let age = today.getFullYear() - birth.getFullYear();
    const monthDiff = today.getMonth() - birth.getMonth();
    
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
        age--;
    }
    
    document.getElementById('memberAge').value = age;
    
    if (age < 30) document.getElementById('memberType').value = 'young';
    else if (age > 60) document.getElementById('memberType').value = 'senior';
    else document.getElementById('memberType').value = 'normal';
}

// ========== البحث مع Debounce ==========
function debounceSearch() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        applyFilters();
    }, 300); // 300ms تأخير
}

// ========== الفلترة السريعة ==========
function quickFilter(type) {
    // إعادة تعيين كل الفلاتر
    document.getElementById('filterSector').value = '';
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterSubscription').value = '';
    document.getElementById('filterRelation').value = '';
    document.getElementById('filterType').value = '';
    document.getElementById('filterYear').value = '';
    document.getElementById('searchInput').value = '';
    
    // تطبيق الفلتر المختار
    if (type === 'active') {
        document.getElementById('filterStatus').value = 'active';
    } else if (type === 'young') {
        document.getElementById('filterType').value = 'young';
    } else if (type === 'senior') {
        document.getElementById('filterType').value = 'senior';
    } else if (type === 'sub_both') {
        document.getElementById('filterSubscription').value = 'both';
    } else if (type === 'sub_assoc') {
        document.getElementById('filterSubscription').value = 'association';
    } else if (type === 'sub_death') {
        document.getElementById('filterSubscription').value = 'death';
    } else if (type === 'new_members') {
        document.getElementById('filterYear').value = '2024';
    }
    
    applyFilters();
}

// ========== تطبيق الفلاتر ==========
function applyFilters() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
    const sector = document.getElementById('filterSector').value;
    const status = document.getElementById('filterStatus').value;
    const subscription = document.getElementById('filterSubscription').value;
    const relation = document.getElementById('filterRelation').value;
    const type = document.getElementById('filterType').value;
    const year = document.getElementById('filterYear').value;
    
    filteredMembers = allMembers.filter(m => {
        // البحث
        if (searchTerm) {
            const fullCode = `${m.familyCode}-${m.memberCode}`.toLowerCase();
            const searchMatch = 
                m.name.toLowerCase().includes(searchTerm) || 
                fullCode.includes(searchTerm) ||
                (m.phone && m.phone.includes(searchTerm)) ||
                (m.email && m.email.toLowerCase().includes(searchTerm)) ||
                (m.address && m.address.toLowerCase().includes(searchTerm)) ||
                (m.sector && m.sector.toLowerCase().includes(searchTerm));
            if (!searchMatch) return false;
        }
        
        // القطاع
        if (sector && m.sector !== sector) return false;
        
        // الحالة
        if (status && m.status !== status) return false;
        
        // الاشتراك
        if (subscription) {
            const hasAssoc = m.hasAssociation || false;
            const hasDeath = m.hasDeath || false;
            if (subscription === 'both' && !(hasAssoc && hasDeath)) return false;
            if (subscription === 'association' && !(hasAssoc && !hasDeath)) return false;
            if (subscription === 'death' && !(hasDeath && !hasAssoc)) return false;
            if (subscription === 'none' && (hasAssoc || hasDeath)) return false;
        }
        
        // صلة القرابة
        if (relation && m.relation !== relation) return false;
        
        // النوع
        if (type && m.memberType !== type) return false;
        
        // السنة
        if (year) {
            const joinYear = m.joinDate ? new Date(m.joinDate).getFullYear() : null;
            if (year === 'older') {
                if (joinYear && joinYear >= 2021) return false;
            } else {
                if (joinYear !== parseInt(year)) return false;
            }
        }
        
        return true;
    });
    
    updateStats();
    displayMembers();
}

// ========== إعادة تعيين ==========
function resetFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('filterSector').value = '';
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterSubscription').value = '';
    document.getElementById('filterRelation').value = '';
    document.getElementById('filterType').value = '';
    document.getElementById('filterYear').value = '';
    filteredMembers = [...allMembers];
    updateStats();
    displayMembers();
}

// ========== تحديث الإحصائيات ==========
function updateStats() {
    const today = new Date();
    let youngCount = 0, seniorCount = 0, activeCount = 0;
    let bothCount = 0, assocCount = 0, deathCount = 0, newCount = 0;
    
    filteredMembers.forEach(m => {
        if (m.status === 'active') activeCount++;
        
        // النوع حسب العمر
        if (m.birthDate) {
            const birth = new Date(m.birthDate);
            const age = today.getFullYear() - birth.getFullYear();
            if (age < 30) youngCount++;
            else if (age > 60) seniorCount++;
        } else if (m.memberType === 'young') youngCount++;
        else if (m.memberType === 'senior') seniorCount++;
        
        // الاشتراك
        const hasAssoc = m.hasAssociation || false;
        const hasDeath = m.hasDeath || false;
        if (hasAssoc && hasDeath) bothCount++;
        else if (hasAssoc) assocCount++;
        else if (hasDeath) deathCount++;
        
        // الجدد
        if (m.joinDate) {
            const joinYear = new Date(m.joinDate).getFullYear();
            if (joinYear >= 2024) newCount++;
        }
    });
    
    document.getElementById('totalCount').textContent = filteredMembers.length;
    document.getElementById('activeCount').textContent = activeCount;
    document.getElementById('youngCount').textContent = youngCount;
    document.getElementById('seniorCount').textContent = seniorCount;
    document.getElementById('bothCount').textContent = bothCount;
    document.getElementById('assocCount').textContent = assocCount;
    document.getElementById('deathCount').textContent = deathCount;
    document.getElementById('newCount').textContent = newCount;
}

// ========== تغيير العرض ==========
function setView(view) {
    currentView = view;
    document.getElementById('viewIndividual').classList.toggle('active', view === 'individual');
    document.getElementById('viewFamily').classList.toggle('active', view === 'family');
    displayMembers();
}

// ========== عرض الأعضاء ==========
function displayMembers() {
    const container = document.getElementById('membersList');
    const resultsCount = document.getElementById('resultsCount');
    
    resultsCount.textContent = `عرض ${filteredMembers.length} من ${allMembers.length} عضو`;
    
    if (filteredMembers.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#999;padding:30px;">لا توجد نتائج - جرب تغيير الفلاتر</p>';
        return;
    }
    
    if (currentView === 'family') {
        displayFamilyView(container);
    } else {
        displayIndividualView(container);
    }
}

function displayIndividualView(container) {
    let html = '';
    filteredMembers.forEach(m => {
        const fullCode = `${m.familyCode}-${m.memberCode}`;
        const subText = (m.hasAssociation && m.hasDeath) ? 'مزدوج' : 
                       (m.hasAssociation ? 'جمعية' : (m.hasDeath ? 'وفاة' : 'غير مشترك'));
        
        const statusText = {
            'active': 'نشط', 'exempt': 'معفي', 'suspended': 'متوقف',
            'withdrawn': 'منسحب', 'deceased': 'متوفي'
        }[m.status] || m.status;
        
        const typeBadge = m.memberType === 'young' ? '<span class="badge badge-young">شاب</span>' : 
                         m.memberType === 'senior' ? '<span class="badge badge-senior">كبير</span>' : '';
        const headBadge = m.relation === 'رب أسرة' ? '<span class="badge badge-head">رب أسرة</span>' : '';
        
        html += `
            <div class="member-card">
                <h4>${m.name} ${typeBadge} ${headBadge} <span class="badge badge-active">${statusText}</span></h4>
                <p>🔑 <strong>${fullCode}</strong> | 🏢 ${m.sector || '-'} | 🎂 ${m.memberAge || '-'} سنة</p>
                <p> ${m.relation || '-'} |  ${subText}</p>
                <p>📱 ${m.phone || '-'} ${m.phone ? `<button class="whatsapp-btn" onclick="sendWhatsApp('${m.phone}', '${m.name}')">واتساب</button>` : ''}</p>
                ${m.notes ? `<p> ${m.notes}</p>` : ''}
                <div class="member-actions">
                    <button class="btn btn-info btn-small" onclick="viewMember('${m.id}')">عرض</button>
                    <button class="btn btn-warning btn-small" onclick="editMember('${m.id}')">✏️ تعديل</button>
                    <button class="btn btn-danger btn-small" onclick="deleteMember('${m.id}')">🗑️ حذف</button>
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
}

function displayFamilyView(container) {
    // تجميع حسب كود الأسرة
    const families = {};
    filteredMembers.forEach(m => {
        if (!families[m.familyCode]) families[m.familyCode] = [];
        families[m.familyCode].push(m);
    });
    
    let html = '';
    Object.keys(families).sort().forEach(familyCode => {
        const members = families[familyCode];
        const head = members.find(m => m.relation === 'رب أسرة');
        const familyName = head ? head.name : familyCode;
        
        html += `<div class="family-group">`;
        html += `<h4>👨‍👩‍👧‍👦 أسرة ${familyCode} - ${familyName} (${members.length} أفراد)</h4>`;
        
        members.forEach(m => {
            const fullCode = `${m.familyCode}-${m.memberCode}`;
            const subText = (m.hasAssociation && m.hasDeath) ? 'مزدوج' : 
                           (m.hasAssociation ? 'جمعية' : (m.hasDeath ? 'وفاة' : '-'));
            const headBadge = m.relation === 'رب أسرة' ? '<span class="badge badge-head">رب أسرة</span>' : '';
            
            html += `
                <div class="family-member">
                    <strong>${m.name}</strong> ${headBadge}
                    <span class="badge badge-sub">${m.relation}</span>
                    <span class="badge badge-active">${m.status === 'active' ? 'نشط' : m.status}</span>
                    <small>🔑 ${fullCode} | 📋 ${subText} | 📱 ${m.phone || '-'}</small>
                </div>
            `;
        });
        
        html += `</div>`;
    });
    
    container.innerHTML = html;
}

// ========== تصدير Excel ==========
function exportToExcel() {
    const data = filteredMembers.map(m => ({
        'كود الأسرة': m.familyCode,
        'كود الفرد': m.memberCode,
        'الاسم': m.name,
        'صلة القرابة': m.relation,
        'القطاع': m.sector,
        'الهاتف': m.phone,
        'تاريخ الميلاد': m.birthDate,
        'العمر': m.memberAge,
        'نوع العضو': m.memberType,
        'تاريخ الانضمام': m.joinDate,
        'مشترك جمعية': m.hasAssociation ? 'نعم' : 'لا',
        'مشترك وفاة': m.hasDeath ? 'نعم' : 'لا',
        'حالة_العضو': { 'active': 'نشط', 'exempt': 'معفي', 'suspended': 'متوقف', 'withdrawn': 'منسحب', 'deceased': 'متوفي' }[m.status] || m.status,
        'ملاحظات': m.notes
    }));
    
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'الأعضاء');
    XLSX.writeFile(wb, `أعضاء_${new Date().toISOString().split('T')[0]}.xlsx`);
    alert(`✅ تم تصدير ${data.length} عضو`);
}

// ========== واتساب ==========
function sendWhatsApp(phone, name) {
    const message = `مرحباً ${name}،\n\nهذه رسالة من نظام إدارة الجمعية.`;
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
}

// ========== إدارة الأعضاء ==========
function openAddMemberModal() {
    document.getElementById('modalTitle').textContent = 'إضافة عضو جديد';
    document.getElementById('memberForm').reset();
    document.getElementById('memberId').value = '';
    document.getElementById('joinDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('memberModal').classList.add('active');
}

function closeMemberModal() {
    document.getElementById('memberModal').classList.remove('active');
}

function saveMember(event) {
    event.preventDefault();
    
    const memberId = document.getElementById('memberId').value;
    const memberData = {
        familyCode: document.getElementById('familyCode').value,
        memberCode: document.getElementById('memberCode').value,
        name: document.getElementById('memberName').value,
        birthDate: document.getElementById('birthDate').value,
        memberAge: parseInt(document.getElementById('memberAge').value) || 0,
        memberType: document.getElementById('memberType').value,
        relation: document.getElementById('relation').value,
        sector: document.getElementById('memberSector').value,
        phone: document.getElementById('memberPhone').value,
        email: document.getElementById('memberEmail').value,
        address: document.getElementById('memberAddress').value,
        job: document.getElementById('memberJob').value,
        joinDate: document.getElementById('joinDate').value,
        hasAssociation: document.getElementById('subAssociation').checked,
        hasDeath: document.getElementById('subDeath').checked,
        associationDate: document.getElementById('associationDate').value,
        deathDate: document.getElementById('deathDate').value,
        status: document.getElementById('memberStatus').value,
        notes: document.getElementById('memberNotes').value,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    const savePromise = memberId 
        ? db.collection('members').doc(memberId).update(memberData)
        : db.collection('members').add({...memberData, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    
    savePromise.then(() => {
        alert('✅ تم الحفظ بنجاح');
        closeMemberModal();
        // تحديث Cache
        localStorage.removeItem('membersCache');
        loadMembers();
    }).catch(error => {
        alert('❌ خطأ: ' + error.message);
    });
}

function viewMember(memberId) {
    const m = allMembers.find(x => x.id === memberId);
    if (!m) return;
    
    const fullCode = `${m.familyCode}-${m.memberCode}`;
    const subText = (m.hasAssociation && m.hasDeath) ? 'مزدوج' : 
                   (m.hasAssociation ? 'جمعية' : (m.hasDeath ? 'وفاة' : 'غير مشترك'));
    
    alert(`
 ${m.name}
🔑 ${fullCode}
🏢 ${m.sector || '-'} | 👥 ${m.relation || '-'}
🎂 ${m.birthDate || '-'} (${m.memberAge || '-'} سنة)
 ${m.phone || '-'}
📧 ${m.email || '-'}
 الاشتراك: ${subText}
 الانضمام: ${m.joinDate || '-'}
📊 الحالة: ${m.status}
📝 ${m.notes || 'لا ملاحظات'}
    `.trim());
}

function editMember(memberId) {
    const m = allMembers.find(x => x.id === memberId);
    if (!m) return;
    
    document.getElementById('modalTitle').textContent = 'تعديل عضو';
    document.getElementById('memberId').value = memberId;
    document.getElementById('familyCode').value = m.familyCode || '';
    document.getElementById('memberCode').value = m.memberCode || '';
    document.getElementById('memberName').value = m.name || '';
    document.getElementById('birthDate').value = m.birthDate || '';
    document.getElementById('memberAge').value = m.memberAge || '';
    document.getElementById('memberType').value = m.memberType || 'normal';
    document.getElementById('relation').value = m.relation || 'رب أسرة';
    document.getElementById('memberSector').value = m.sector || 'الحارة 1';
    document.getElementById('memberPhone').value = m.phone || '';
    document.getElementById('memberEmail').value = m.email || '';
    document.getElementById('memberAddress').value = m.address || '';
    document.getElementById('memberJob').value = m.job || '';
    document.getElementById('joinDate').value = m.joinDate || '';
    document.getElementById('subAssociation').checked = m.hasAssociation || false;
    document.getElementById('subDeath').checked = m.hasDeath || false;
    document.getElementById('associationDate').value = m.associationDate || '';
    document.getElementById('deathDate').value = m.deathDate || '';
    document.getElementById('memberStatus').value = m.status || 'active';
    document.getElementById('memberNotes').value = m.notes || '';
    document.getElementById('memberModal').classList.add('active');
}

function deleteMember(memberId) {
    if (!confirm('هل أنت متأكد من حذف هذا العضو؟')) return;
    
    db.collection('members').doc(memberId).delete()
        .then(() => {
            allMembers = allMembers.filter(m => m.id !== memberId);
            filteredMembers = filteredMembers.filter(m => m.id !== memberId);
            localStorage.removeItem('membersCache');
            updateStats();
            displayMembers();
            alert('✅ تم الحذف');
        })
        .catch(error => {
            alert('❌ خطأ: ' + error.message);
        });
}

document.querySelectorAll('.modal').forEach(modal => {
    modal.addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });
});
