<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d7377">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>زعورة v7.3</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{
  --primary:#0d7377;--primary-2:#0f766e;--primary-soft:#ecfeff;
  --bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;
  --border:#e2e8f0;--danger:#dc2626;--success:#16a34a;--warning:#f59e0b;--info:#2563eb;
  --radius:16px;--shadow:0 8px 24px rgba(15,23,42,.08);--shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --safe:env(safe-area-inset-bottom,0);
}
[data-theme="dark"]{--bg:#0b1220;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;--primary-soft:#0f2e2e}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);direction:rtl;font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:calc(78px + var(--safe));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{outline:0}

.app-header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0));display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-sm)}
.app-header .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.app-header .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.app-header h1{font-size:15px;font-weight:800;line-height:1.1}
.app-header .sub{font-size:10px;color:var(--muted);font-weight:600}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:18px;transition:.15s;flex-shrink:0}
.icon-btn:active{transform:scale(.92)}

.search-wrap{padding:10px 12px 0;max-width:820px;margin:0 auto}
.search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow-sm)}
.search-box .ico{color:var(--muted);font-size:17px}
.search-box input{flex:1;background:none;border:0;font-size:15px;min-width:0}
.search-box .clear{color:var(--muted);font-size:18px;padding:4px}

main{max-width:820px;margin:0 auto;padding:12px}
.page{display:none;animation:fade .2s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-head h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}

.stats-scroll{display:flex;gap:10px;overflow-x:auto;margin:0 -12px 14px;padding:0 12px 6px;scrollbar-width:none}
.stats-scroll::-webkit-scrollbar{display:none}
.stat{flex:0 0 auto;min-width:120px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--primary)}
.stat.green::before{background:var(--success)}.stat.red::before{background:var(--danger)}
.stat.orange::before{background:var(--warning)}.stat.blue::before{background:var(--info)}
.stat .val{font-size:24px;font-weight:800;line-height:1.1;color:var(--primary)}
.stat.green .val{color:var(--success)}.stat.red .val{color:var(--danger)}
.stat.orange .val{color:var(--warning)}.stat.blue .val{color:var(--info)}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}

.list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s;min-height:64px}
.item:last-child{border-bottom:0}
.item:active{background:var(--bg)}
.item .av{width:46px;height:46px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--primary-soft);color:var(--primary);font-weight:800;overflow:hidden}
.item .av img{width:100%;height:100%;object-fit:cover}
.item .av.green{background:#dcfce7;color:#166534}.item .av.red{background:#fee2e2;color:#991b1b}
.item .av.orange{background:#fef3c7;color:#92400e}.item .av.blue{background:#dbeafe;color:#1e40af}
.item .body{flex:1;min-width:0}
.item .ttl{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .trail{color:var(--muted);font-size:20px;font-weight:300;flex-shrink:0}

.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap}
.badge.success{background:#dcfce7;color:#166534}.badge.danger{background:#fee2e2;color:#991b1b}
.badge.warning{background:#fef3c7;color:#92400e}.badge.info{background:#dbeafe;color:#1e40af}
.badge.muted{background:#f1f5f9;color:#475569}.badge.purple{background:#e9d5ff;color:#6b21a8}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--muted);transition:.15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip.highlight{background:var(--warning);color:#fff;border-color:var(--warning)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:13px;font-size:14px;font-weight:700;transition:.15s;min-height:44px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff}.btn.success{background:var(--success);color:#fff}
.btn.danger{background:var(--danger);color:#fff}.btn.warning{background:var(--warning);color:#fff}
.btn.info{background:var(--info);color:#fff}.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:12px;border-radius:10px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

.fab{position:fixed;bottom:calc(88px + var(--safe));left:18px;width:56px;height:56px;border-radius:18px;background:var(--primary);color:#fff;font-size:26px;font-weight:300;box-shadow:0 10px 28px rgba(13,115,119,.4);z-index:25;display:flex;align-items:center;justify-content:center;transition:.15s}
.fab:active{transform:scale(.92)}

.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--safe));box-shadow:0 -4px 20px rgba(15,23,42,.05)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:10px;font-weight:700;transition:.15s;position:relative;min-width:0}
.bnav button .i{font-size:22px;line-height:1;transition:.15s}
.bnav button.on{color:var(--primary)}
.bnav button.on .i{transform:scale(1.1)}
.bnav button .nb{position:absolute;top:3px;right:calc(50% - 18px);background:var(--danger);color:#fff;border-radius:10px;padding:0 5px;font-size:9px;font-weight:700;min-width:16px;text-align:center;line-height:16px;height:16px}

.sheet-back{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:90;opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(3px)}
.sheet-back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:91;background:var(--card);border-radius:24px 24px 0 0;max-height:94vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(16px + var(--safe));box-shadow:0 -20px 60px rgba(15,23,42,.2)}
.sheet.on{transform:translateY(0)}
.sheet.wide{max-height:98vh}
.sheet-grip{width:44px;height:5px;background:var(--border);border-radius:3px;margin:12px auto 0}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2;border-radius:24px 24px 0 0}
.sheet-hd h2{font-size:16px;font-weight:800}
.sheet-bd{padding:16px 18px}
.sheet-ft{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
.sheet-ft .btn{flex:1;min-width:100px}

.fld{margin-bottom:14px;position:relative}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld label .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{width:100%;padding:12px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;font-size:15px;transition:.15s;font-family:inherit}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--primary);background:var(--card);box-shadow:0 0 0 3px rgba(13,115,119,.12)}
.fld textarea{resize:vertical;min-height:70px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld-row.three{grid-template-columns:1fr 1fr 1fr}
.fld-hint{font-size:11px;color:var(--muted);margin-top:4px}
.fld-readonly{background:var(--primary-soft)!important;color:var(--primary);font-weight:700}

.options-list{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1.5px solid var(--primary);border-radius:12px;max-height:220px;overflow-y:auto;z-index:100;box-shadow:var(--shadow);margin-top:4px;display:none}
.options-list.on{display:block}
.option-item{padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--border);font-size:14px}
.option-item:hover,.option-item:active{background:var(--primary-soft)}
.option-item:last-child{border-bottom:0}
.option-item small{color:var(--muted);font-size:11px;flex-shrink:0}

.tree-wrap{overflow:auto;padding:10px;background:var(--bg);border-radius:12px;max-height:65vh}
.tree-node{margin-bottom:8px}
.tree-person{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card);border:2px solid var(--border);border-radius:24px;font-weight:700;font-size:13px;cursor:pointer;transition:.15s;margin-bottom:6px}
.tree-person:active{transform:scale(.97)}
.tree-person.male{border-color:var(--info);background:#eff6ff;color:#1e3a8a}
.tree-person.female{border-color:#ec4899;background:#fdf2f8;color:#831843}
.tree-person.dead{opacity:.55;border-style:dashed}
.tree-person small{color:var(--muted);font-size:10px;font-weight:600}
.tree-level{margin-right:18px;border-right:2px dashed var(--border);padding-right:12px;padding-top:4px}
.tree-level-title{font-size:11px;font-weight:800;color:var(--muted);margin:6px 0 4px}

.member-group{margin-bottom:16px}
.member-group-title{font-size:12px;font-weight:800;color:var(--muted);padding:6px 10px;background:var(--bg);border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ico{font-size:52px;opacity:.4;display:block;margin-bottom:10px}
.empty h3{font-size:15px;font-weight:700;margin-bottom:4px}
.empty p{font-size:12px}

.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 28px);max-width:400px}
.toast{background:var(--text);color:var(--card);padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:slideDown .25s ease;pointer-events:auto}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--danger);color:#fff}
.toast.warning{background:var(--warning);color:#fff}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

.loader{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(3px);z-index:9998;display:none;align-items:center;justify-content:center}
.loader.on{display:flex}
.spin{width:38px;height:38px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.view-toggle{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.view-toggle button{padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;color:var(--muted);transition:.15s}
.view-toggle button.on{background:var(--card);color:var(--primary);box-shadow:var(--shadow-sm)}

.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.gcell{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;transition:.15s}
.gcell:active{transform:scale(.95)}
.gcell .n{font-weight:800;font-size:14px;color:var(--text)}
.gcell .o{font-size:9px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcell.occupied{border-color:var(--danger);background:#fef2f2}
.gcell.occupied .n{color:var(--danger)}
.gcell.available{border-color:var(--success);background:#f0fdf4}
.gcell.available .n{color:var(--success)}
.gcell.reuse{border-color:var(--warning);background:#fffbeb}
.gcell.reuse .n{color:var(--warning)}
.gcell.empty-grave{border-color:var(--info);background:#eff6ff}
.gcell.empty-grave .n{color:var(--info)}

.import-box{background:var(--bg);border:2px dashed var(--border);border-radius:14px;padding:18px;text-align:center;transition:.15s;cursor:pointer;margin-top:10px}
.import-box:active{transform:scale(.98);border-color:var(--primary)}
.import-box .i{font-size:32px;margin-bottom:6px;display:block}
.import-box .t{font-size:14px;font-weight:700;margin-bottom:2px}
.import-box .s{font-size:11px;color:var(--muted)}
.import-result{margin-top:10px;padding:12px;border-radius:12px;font-size:12px;line-height:1.7}
.import-result.success{background:#f0fdf4;color:#166534;border:1px solid #86efac}
.import-result.error{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5}

.alert-row{padding:12px;background:#fef3c7;border:1px solid #fcd34d;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.alert-row .info{flex:1;min-width:0}
.alert-row .nm{font-weight:700;font-size:13px}
.alert-row .sb{font-size:11px;color:#78350f}

.img-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg)}
.img-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.img-thumb .rm{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:rgba(220,38,38,.9);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}

.backup-status{padding:10px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--muted);margin-bottom:10px;border:1px dashed var(--border)}

@media print{.app-header,.bnav,.fab,.search-wrap,.view-toggle,.chips{display:none!important}main{padding:0;max-width:100%}body{background:#fff;padding-bottom:0}}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="logo">🏘️</div>
    <div>
      <h1>زعورة</h1>
      <div class="sub">v7.3 — إدارة المقبرة والعائلات</div>
    </div>
  </div>
  <button class="icon-btn" onclick="openDashboard()" title="إحصائيات">📊</button>
  <button class="icon-btn" onclick="toggleTheme()" title="الوضع">🌓</button>
  <button class="icon-btn" onclick="openSettings()" title="إعدادات">⚙️</button>
</header>

<div class="search-wrap">
  <div class="search-box">
    <span class="ico">🔍</span>
    <input id="globalSearch" placeholder="ابحث بالاسم، الكود، رقم القبر…" oninput="globalSearch(this.value)">
    <button class="clear" onclick="clearSearch()" style="display:none" id="searchClear">✕</button>
  </div>
</div>

<main>
  <!-- HOME -->
  <section id="pg-home" class="page active">
    <div class="stats-scroll" id="homeStats"></div>
    <div class="card">
      <div class="card-head"><h2>⚡ إجراءات سريعة</h2></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn success" onclick="openBurialSheet()">📜 تسجيل دفن</button>
        <button class="btn primary" onclick="openGraveSheet()">➕ إضافة قبر</button>
        <button class="btn info" onclick="openPersonSheet()">👤 إضافة فرد</button>
        <button class="btn warning" onclick="openImportSheet()">📥 استيراد</button>
      </div>
    </div>
    <div class="card" id="ageAlertCard" style="display:none">
      <div class="card-head">
        <h2>🔔 تنبيه السن القانوني (18-30)</h2>
        <button class="btn warning sm" onclick="openAgeAlertSheet()">عرض</button>
      </div>
      <div id="ageAlertPreview"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>📊 توزيع القبور</h2><span class="badge muted" id="graveTotalBadge">0</span></div>
      <div id="graveDist"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>📸 آخر الصور المضافة</h2></div>
      <div id="recentImages"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>👨‍👩‍👧 أكبر العائلات</h2><button class="btn ghost sm" onclick="go('pg-families')">الكل</button></div>
      <div id="topFamilies"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>🕐 آخر النشاطات</h2></div>
      <div id="recentActs"></div>
    </div>
  </section>

  <!-- GRAVES -->
  <section id="pg-graves" class="page">
    <div class="stats-scroll" id="graveStats"></div>
    <div class="card" style="padding:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px">
        <div class="view-toggle">
          <button data-v="list" onclick="setGraveView('list')" id="gvList">📋 قائمة</button>
          <button data-v="grid" onclick="setGraveView('grid')" id="gvGrid">⊞ شبكة</button>
        </div>
        <button class="btn info sm" onclick="openGraveMap()">🗺️ خريطة</button>
        <div style="font-size:11px;color:var(--muted)" id="graveCounter"></div>
      </div>
      <div class="chips" id="graveChips"></div>
    </div>
    <div id="graveContent"></div>
  </section>

  <!-- PEOPLE -->
  <section id="pg-people" class="page">
    <div class="stats-scroll" id="peopleStats"></div>
    <div class="card" style="padding:12px">
      <div style="font-size:11px;font-weight:800;color:var(--muted);margin-bottom:4px">الحالة</div>
      <div class="chips" id="peopleChips"></div>
      <div style="font-size:11px;font-weight:800;color:var(--muted);margin:8px 0 4px">الفئة العمرية</div>
      <div class="chips" id="peopleAgeChips"></div>
      <div style="font-size:11px;font-weight:800;color:var(--muted);margin:8px 0 4px">الترتيب</div>
      <div class="chips" id="peopleSortChips"></div>
      <button class="btn success sm block" style="margin-top:8px" onclick="exportPeopleWA()">📱 تصدير القائمة الحالية</button>
    </div>
    <div id="peopleContent"></div>
  </section>

  <!-- FAMILIES -->
  <section id="pg-families" class="page">
    <div class="stats-scroll" id="familyStats"></div>
    <div class="card" style="padding:12px">
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
        <button class="btn ghost sm" onclick="sortFamilies('size')" id="famSortSize">الأكبر أولاً</button>
        <button class="btn ghost sm" onclick="sortFamilies('name')" id="famSortName">أبجدي</button>
        <button class="btn ghost sm" onclick="sortFamilies('code')" id="famSortCode">حسب الكود</button>
      </div>
    </div>
    <div id="familyContent"></div>
  </section>

<script>
'use strict';
const DB_NAME='zaoura_v73',DB_VER=1;
const STORES=['graves','people','burials','families','fields'];
const C={
  GRAVE_TYPE:['عام','خاص','عائلي'],
  GRAVE_STATUS:['فارغ','مشغول','متاح للإعادة','مهجور','مهدّم'],
  GENDER:['ذكر','أنثى'],
  PERSON_STATUS:['حي','متوفى','مسافر','غير معروف'],
  RELATION:['رب أسرة','زوجة','زوج','ابن','بنت','أب','أم','أخ','أخت','جد','جدة','حفيد','حفيدة','أخرى']
};

const S={
  graves:[],people:[],burials:[],families:[],fields:[],
  page:'pg-home',graveView:'list',graveFilter:'all',
  peopleFilter:'all',peopleAgeFilter:'all',peopleSort:'name',
  burialYear:'',familySort:'size',editing:null,treeRoot:null
};

let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{const d=e.target.result;
      STORES.forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id',autoIncrement:true});});};
    r.onsuccess=()=>{db=r.result;res(db);};
    r.onerror=()=>rej(r.error);
  });
}
const t=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const dbAll=s=>new Promise((res,rej)=>{const q=t(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});
const dbGet=(s,id)=>new Promise((res,rej)=>{const q=t(s).get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
const dbPut=(s,o)=>new Promise((res,rej)=>{const q=t(s,'readwrite').put(o);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
const dbDel=(s,id)=>new Promise((res,rej)=>{const q=t(s,'readwrite').delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error);});
const dbClear=s=>new Promise((res,rej)=>{const q=t(s,'readwrite').clear();q.onsuccess=()=>res();q.onerror=()=>rej(q.error);});

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanName=v=>String(v??'').trim().replace(/\s+/g,' ');
const normAr=v=>String(v??'').toLowerCase().trim().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/[ىي]/g,'ي').replace(/[ًٌٍَُِّْـ]/g,'');
const fmtDate=d=>{if(!d)return '—';try{return new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'});}catch(e){return d;}};

function calcAge(birth,death,status){
  if(!birth)return '';
  if(!death&&status==='متوفى')return '';
  const b=new Date(birth);if(isNaN(b))return '';
  const d=death?new Date(death):new Date();if(isNaN(d))return '';
  let a=d.getFullYear()-b.getFullYear();
  if(d.getMonth()<b.getMonth()||(d.getMonth()===b.getMonth()&&d.getDate()<b.getDate()))a--;
  return a>=0?a:'';
}
function addYears(d,y){if(!d)return '';const dd=new Date(d+'T00:00:00');if(isNaN(dd))return '';dd.setFullYear(dd.getFullYear()+Number(y||10));return dd.toISOString().slice(0,10);}

function toDate(v){
  if(!v)return '';
  if(typeof v==='string'&&v.trim().startsWith('='))return '';
  if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  if(typeof v==='number'){const d=new Date((v-25569)*86400000);return isNaN(d)?'':d.toISOString().slice(0,10);}
  const s=String(v).trim();
  const m1=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]|$)/);
  if(m1)return `${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;
  const m2=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m2)return `${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
  const d=new Date(s);
  if(!isNaN(d)&&d.getFullYear()>1900&&d.getFullYear()<2100)return d.toISOString().slice(0,10);
  return '';
}
const debounce=(fn,d=200)=>{let t;return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),d);};};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function graveStatusOf(g){
  if(!g)return 'فارغ';
  if(g.status==='مشغول'&&g.availableDate&&new Date(g.availableDate)<=new Date())return 'متاح للإعادة';
  return g.status||'فارغ';
}
function statusClass(s){
  if(s==='فارغ')return 'info';
  if(s==='متاح للإعادة')return 'warning';
  if(s==='مشغول')return 'danger';
  return 'muted';
}
function cleanPhone(v){
  if(!v)return '';
  let s=String(v).trim().replace(/\.0+$/,'').replace(/[\s\-\(\)\u200f\u200e]/g,'');
  if(s.startsWith('+963'))s='0'+s.slice(4);
  return s;
}
function isFormula(v){if(v===null||v===undefined)return true;const s=String(v).trim();return !s||s.startsWith('=')||s.includes('openpyxl')||s.includes('ArrayFormula');}

function toast(msg,type='success',dur=2500){
  const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;
  $('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='.3s';setTimeout(()=>el.remove(),300);},dur);
}
const showLoad=v=>$('loader').classList.toggle('on',v);

function openSheet(title,bodyHTML,footHTML='',opts={}){
  $('sheetTitle').textContent=title;
  $('sheetBody').innerHTML=bodyHTML;
  $('sheetFoot').innerHTML=footHTML;
  $('sheetFoot').style.display=footHTML?'flex':'none';
  $('sheetBack').classList.add('on');
  $('sheet').classList.add('on');
  if(opts.wide)$('sheet').classList.add('wide');else $('sheet').classList.remove('wide');
  document.body.style.overflow='hidden';
  if(opts.focus)setTimeout(()=>{const el=$(opts.focus);if(el)el.focus();},250);
}
function closeSheet(){
  $('sheetBack').classList.remove('on');
  $('sheet').classList.remove('on');
  document.body.style.overflow='';
  S.editing=null;S.treeRoot=null;
}
function toggleTheme(){
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('zt',t);
}

function go(page){
  S.page=page;
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===page));
  document.querySelectorAll('.bnav button').forEach(b=>b.classList.toggle('on',b.dataset.pg===page));
  window.scrollTo(0,0);
  $('fab').style.display=(page==='pg-home')?'none':'flex';
  if(page==='pg-graves')renderGraves();
  if(page==='pg-people')renderPeople();
  if(page==='pg-families')renderFamilies();
  if(page==='pg-burials')renderBurials();
}
function handleFab(){
  if(S.page==='pg-graves')openGraveSheet();
  else if(S.page==='pg-people')openPersonSheet();
  else if(S.page==='pg-families')openFamilySheet();
  else if(S.page==='pg-burials')openBurialSheet();

async function loadAll(){
  const [graves,people,burials,families,fields]=await Promise.all([
    dbAll('graves'),dbAll('people'),dbAll('burials'),dbAll('families'),dbAll('fields')
  ]);
  S.graves=graves.sort((a,b)=>String(a.number||'').localeCompare(String(b.number||''),'ar',{numeric:true}));
  S.people=people;
  S.burials=burials.sort((a,b)=>(b.burialDate||'').localeCompare(a.burialDate||''));
  S.families=families;
  S.fields=fields;
}

/* ============ ضغط الصور ============ */
async function compressImage(file,maxWidth=1000,quality=0.7){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let {width,height}=img;
        if(width>maxWidth){height=Math.round(height*maxWidth/width);width=maxWidth;}
        canvas.width=width;canvas.height=height;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function pickImage(callback){
  const input=document.createElement('input');
  input.type='file';input.accept='image/*';input.capture='environment';
  input.onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    showLoad(true);
    try{const compressed=await compressImage(file);callback(compressed);}
    catch(err){toast('فشل ضغط الصورة','error');}
    showLoad(false);
  };
  input.click();
}
function renderImageGrid(images,onRemove){
  if(!images||!images.length)return '<div style="color:var(--muted);font-size:12px;text-align:center;padding:12px">لا توجد صور</div>';
  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px">
    ${images.map((img,i)=>`<div class="img-thumb">
      <img src="${img}" onclick="viewFullImage(${i})">
      <button class="rm" onclick="${onRemove}(${i})">✕</button>
    </div>`).join('')}
  </div>`;
}
function viewFullImage(idx){
  const imgs=window._currentImages||[];
  if(!imgs[idx])return;
  const body=`<div style="text-align:center"><img src="${imgs[idx]}" style="max-width:100%;border-radius:12px"></div>`;
  openSheet('صورة',body,'<button class="btn ghost" onclick="closeSheet()">إغلاق</button>',{wide:true});
}
function getLocation(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation)return reject(new Error('الجهاز لا يدعم تحديد الموقع'));
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
      e=>reject(new Error('تعذّر تحديد الموقع')),
      {enableHighAccuracy:true,timeout:15000,maximumAge:0}
    );
  });
}
/* ============ DASHBOARD ============ */
function renderHome(){
  const G=S.graves,P=S.people,B=S.burials,F=S.families;
  const occupied=G.filter(g=>graveStatusOf(g)==='مشغول').length;
  const emptyG=G.filter(g=>graveStatusOf(g)==='فارغ').length;
  const reuse=G.filter(g=>graveStatusOf(g)==='متاح للإعادة').length;
  const broken=G.filter(g=>['مهجور','مهدّم'].includes(graveStatusOf(g))).length;
  const totalImages=G.reduce((s,g)=>s+(g.images?.length||0),0)+P.reduce((s,p)=>s+(p.images?.length||0),0);

  $('homeStats').innerHTML=`
    <div class="stat"><div class="val">${G.length}</div><div class="lbl">⚰️ القبور</div></div>
    <div class="stat red"><div class="val">${occupied}</div><div class="lbl">🪦 مشغولة</div></div>
    <div class="stat blue"><div class="val">${emptyG}</div><div class="lbl">⚪ فارغة</div></div>
    <div class="stat orange"><div class="val">${reuse}</div><div class="lbl">🔄 للإعادة</div></div>
    <div class="stat green"><div class="val">${P.length}</div><div class="lbl">👥 الأفراد</div></div>
    <div class="stat"><div class="val">${F.length}</div><div class="lbl">👨‍👩‍👧 العائلات</div></div>
    <div class="stat"><div class="val">${B.length}</div><div class="lbl">📜 الدفن</div></div>
    <div class="stat blue"><div class="val">${totalImages}</div><div class="lbl">📸 صور</div></div>
  `;
  $('graveTotalBadge').textContent=G.length+' قبر';

  const dist=[
    {l:'مشغول',v:occupied,c:'danger'},
    {l:'فارغ',v:emptyG,c:'info'},
    {l:'إعادة استخدام',v:reuse,c:'warning'},
    {l:'مهجور/مهدّم',v:broken,c:'muted'}
  ];
  $('graveDist').innerHTML=dist.map(d=>{
    const pct=G.length?Math.round(d.v/G.length*100):0;
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px">
        <span>${d.l}</span><span>${d.v} (${pct}%)</span></div>
      <div style="background:var(--bg);height:8px;border-radius:4px;overflow:hidden">
        <div style="height:100%;background:var(--${d.c});width:${pct}%;border-radius:4px"></div></div></div>`;
  }).join('');

  // آخر الصور
  const withImages=[
    ...G.filter(g=>g.images?.length).slice(-3).map(g=>({type:'grave',item:g,img:g.images[g.images.length-1]})),
    ...P.filter(p=>p.images?.length).slice(-3).map(p=>({type:'person',item:p,img:p.images[p.images.length-1]}))
  ].slice(-6).reverse();
  if(withImages.length){
    $('recentImages').innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px">
      ${withImages.map(w=>`<div class="img-thumb" onclick="open${w.type==='grave'?'Grave':'Person'}Sheet(${w.item.id})">
        <img src="${w.img}">
        <div style="position:absolute;bottom:0;right:0;left:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;padding:4px;font-size:10px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(w.item.number||w.item.name||'')}</div>
      </div>`).join('')}
    </div>`;
  } else {
    $('recentImages').innerHTML=emptySmall('لا توجد صور بعد — أضف صورة من أي قبر أو فرد');
  }

  // أكبر العائلات
  const famCounts=F.map(f=>({...f,members:P.filter(p=>p.familyId===f.id).length}))
    .sort((a,b)=>b.members-a.members).slice(0,5);
  $('topFamilies').innerHTML=famCounts.length?famCounts.map(f=>`
    <div class="item" onclick="openFamilyView(${f.id})">
      <div class="av">👨‍👩‍👧</div>
      <div class="body">
        <div class="ttl">${esc(f.name||'')}</div>
        <div class="sub">${f.members} فرد${f.code?' • '+esc(f.code):''}</div>
      </div>
      <span class="trail">›</span>
    </div>`).join(''):emptySmall('لا توجد عائلات بعد');

  // آخر النشاطات
  const recent=B.slice(0,5);
  $('recentActs').innerHTML=recent.length?recent.map(b=>`
    <div class="item" onclick="openBurialView(${b.id})">
      <div class="av red">🪦</div>
      <div class="body">
        <div class="ttl">${esc(b.personName||'')}</div>
        <div class="sub">${esc(b.graveNumber||'')} • ${fmtDate(b.burialDate)}</div>
      </div>
      <span class="trail">›</span>
    </div>`).join(''):emptySmall('لا توجد سجلات دفن بعد');

  // تنبيه السن
  const adults=P.filter(p=>{
    if(p.status!=='حي'||!p.birth)return false;
    const a=calcAge(p.birth,null,'حي');
    return a!==''&&a>=18&&a<=30;
  });
  if(adults.length){
    $('ageAlertCard').style.display='block';

      <div style="font-size:13px;color:var(--muted);margin-bottom:8px">

      </div>
      ${adults.slice(0,3).map(p=>`<div style="padding:6px 0;font-size:13px;border-top:1px solid var(--border)">
        <b>${esc(p.name)}</b> <span style="color:var(--muted)">- ${calcAge(p.birth,null,'حي')} سنة</span>
      </div>`).join('')}
    `;
  } else $('ageAlertCard').style.display='none';

  updateNavBadges();
}
const emptySmall=msg=>`<div style="text-align:center;padding:16px;color:var(--muted);font-size:12px">${msg}</div>`;
const emptyState=(icon,title,sub)=>`<div class="empty"><span class="ico">${icon}</span><h3>${title}</h3><p>${sub}</p></div>`;
function updateNavBadges(){
  const nb=$('nbGraves');
  if(S.graves.length){nb.style.display='block';nb.textContent=S.graves.length>999?'999+':S.graves.length;}

/* ============ GRAVES ============ */
function setGraveView(v){S.graveView=v;$('gvList').classList.toggle('on',v==='list');$('gvGrid').classList.toggle('on',v==='grid');renderGraves();}
function setGraveFilter(k){S.graveFilter=k;renderGraves();}

function filterGraves(q){
  const s=q?normAr(q):'';
  return S.graves.filter(g=>{
    if(s){
      const hist=(g.previousBurials||[]).map(h=>h.name).join(' ');
      const hay=normAr(`${g.number||''} ${g.owner||''} ${g.location||''} ${g.lastBuried||''} ${g.section||''} ${hist}`);
      if(!hay.includes(s))return false;
    }
    const st=graveStatusOf(g);
    if(S.graveFilter==='occupied'&&st!=='مشغول')return false;
    if(S.graveFilter==='empty'&&st!=='فارغ')return false;
    if(S.graveFilter==='reuse'&&st!=='متاح للإعادة')return false;
    if(S.graveFilter==='broken'&&!['مهجور','مهدّم'].includes(st))return false;
    if(S.graveFilter==='private'&&g.type!=='خاص')return false;
    if(S.graveFilter==='public'&&g.type!=='عام')return false;
    if(S.graveFilter==='photos'&&(!g.images||!g.images.length))return false;
    if(S.graveFilter==='gps'&&(!g.lat||!g.lng))return false;
    return true;
  });
}

function renderGraves(){
  const G=S.graves;
  const occupied=G.filter(g=>graveStatusOf(g)==='مشغول').length;
  const emptyG=G.filter(g=>graveStatusOf(g)==='فارغ').length;
  const reuse=G.filter(g=>graveStatusOf(g)==='متاح للإعادة').length;
  const broken=G.filter(g=>['مهجور','مهدّم'].includes(graveStatusOf(g))).length;
  const withImg=G.filter(g=>g.images?.length).length;
  $('graveStats').innerHTML=`
    <div class="stat"><div class="val">${G.length}</div><div class="lbl">الإجمالي</div></div>
    <div class="stat red"><div class="val">${occupied}</div><div class="lbl">مشغول</div></div>
    <div class="stat blue"><div class="val">${emptyG}</div><div class="lbl">فارغ</div></div>
    <div class="stat orange"><div class="val">${reuse}</div><div class="lbl">إعادة</div></div>
    <div class="stat"><div class="val">${broken}</div><div class="lbl">مهدّم</div></div>
    <div class="stat green"><div class="val">${withImg}</div><div class="lbl">📸 صور</div></div>
  `;

  const chips=[
    {k:'all',l:'الكل'},
    {k:'occupied',l:'🪦 مشغولة'},
    {k:'empty',l:'⚪ فارغة'},
    {k:'reuse',l:'🔄 إعادة'},
    {k:'broken',l:'🔨 مهجورة'},
    {k:'private',l:'👤 خاصة'},
    {k:'public',l:'🏛️ عامة'},
    {k:'photos',l:'📸 بها صور'},
    {k:'gps',l:'📍 محددة GPS'}
  ];
  $('graveChips').innerHTML=chips.map(c=>
    `<button class="chip ${S.graveFilter===c.k?'on':''}" onclick="setGraveFilter('${c.k}')">${c.l}</button>`
  ).join('');

  const list=filterGraves($('globalSearch').value);
  $('graveCounter').textContent=`${list.length} قبر`;
  const el=$('graveContent');
  if(!list.length){el.innerHTML=emptyState('⚰️','لا توجد قبور','أضف قبراً أو استورد Excel');return;}

  if(S.graveView==='grid'){
    el.innerHTML=`<div class="card" style="padding:12px"><div class="grid-view">${list.slice(0,500).map(g=>{
      const st=graveStatusOf(g);
      const cls=st==='مشغول'?'occupied':st==='فارغ'?'empty-grave':st==='متاح للإعادة'?'reuse':'available';
      return `<div class="gcell ${cls}" onclick="openGraveSheet(${g.id})">
        <div class="n">${esc(g.number||'?')}</div>
        <div class="o">${g.images?.length?'📸 ':''}${g.lat?'📍 ':''}${esc((g.lastBuried||g.owner||'').slice(0,10)||'—')}</div>
      </div>`;
    }).join('')}</div></div>`;
  } else {
    el.innerHTML=`<div class="list">${list.slice(0,300).map(g=>{
      const st=graveStatusOf(g);

      const icon=st==='مشغول'?'🪦':st==='فارغ'?'⚪':st==='متاح للإعادة'?'🔄':'🔨';
      const firstImg=g.images?.[0];
      return `<div class="item" onclick="openGraveSheet(${g.id})">

  }
}

async function addGraveImage(){
  pickImage(async dataUrl=>{
    const g=S.editing?.id?S.graves.find(x=>x.id===S.editing.id):null;
    if(!g){toast('احفظ القبر أولاً','warning');return;}
    g.images=(g.images||[]).concat([dataUrl]);
    window._currentImages=g.images;
    await dbPut('graves',g);
    await loadAll();
    const el=$('graveImages');
    if(el)el.innerHTML=renderImageGrid(g.images,'removeGraveImage');
    toast('📸 تمت الإضافة');
  });
}
async function removeGraveImage(idx){
  const g=S.editing?.id?S.graves.find(x=>x.id===S.editing.id):null;
  if(!g)return;
  if(!confirm('حذف الصورة؟'))return;
  g.images=(g.images||[]).filter((_,i)=>i!==idx);
  window._currentImages=g.images;
  await dbPut('graves',g);
  await loadAll();
  const el=$('graveImages');
  if(el)el.innerHTML=renderImageGrid(g.images,'removeGraveImage');
  toast('🗑️');
}
async function setGraveGPS(){
  showLoad(true);
  try{
    const loc=await getLocation();
    $('gCoords').value=loc.lat.toFixed(6)+', '+loc.lng.toFixed(6);
    $('gLat').value=loc.lat;$('gLng').value=loc.lng;
    toast(`📍 دقة ±${Math.round(loc.acc)} م`,'success');
  }catch(e){toast(e.message,'error');}
  showLoad(false);
}
async function generateQR(text){
  if(!window.QRCode)return '';
  const canvas=document.createElement('canvas');
  await QRCode.toCanvas(canvas,text,{width:300,margin:2,color:{dark:'#0d7377',light:'#ffffff'}});
  return canvas.toDataURL('image/png');
}
async function printQR(graveNumber){
  const url=`${location.origin}${location.pathname}#grave-${graveNumber}`;
  const qr=await generateQR(url);
  if(!qr)return;
  const w=window.open('','_blank');
  w.document.write(`<html dir="rtl"><head><title>QR - قبر ${graveNumber}</title>
    <style>body{font-family:sans-serif;text-align:center;padding:40px}
    img{width:400px}h1{color:#0d7377}hr{margin:20px 0}</style></head>
    <body><h1>⚰️ قبر ${graveNumber}</h1><img src="${qr}"><hr>
    <p style="font-size:20px;color:#64748b">امسح الرمز لعرض التفاصيل</p>
    <p style="font-size:14px;color:#94a3b8">زعورة v7.3</p>
    <script>setTimeout(()=>window.print(),500)<\/script></body></html>`);
  w.document.close();
}

async function saveGrave(id){
  const number=cleanName($('gNumber').value);
  if(!number){toast('رقم القبر مطلوب','error');return;}
  const old=id?await dbGet('graves',id):null;
  const obj={
    number,
    type:$('gType').value,
    status:$('gStatus').value,
    section:$('gSection').value.trim(),
    location:$('gLocation').value.trim(),
    owner:$('gOwner').value.trim(),
    lastBuried:$('gLastBuried').value.trim(),
    lastBurialDate:$('gLastBurialDate').value,
    years:Number($('gYears').value)||10,
    availableDate:$('gAvailableDate').value,
    notes:$('gNotes').value.trim(),
    previousBurials:old?.previousBurials||[],
    images:old?.images||[],
    lat:$('gLat').value?Number($('gLat').value):null,
    lng:$('gLng').value?Number($('gLng').value):null,
    custom:collectCustomFields(),
    updatedAt:new Date().toISOString()
  };
  try{
    if(id){obj.id=id;obj.createdAt=old?.createdAt;}

    await dbPut('graves',obj);
    await loadAll();closeSheet();
    toast(id?'✅ تم التعديل':'✅ تمت الإضافة');
    renderGraves();renderHome();
  }catch(e){toast('خطأ: '+e.message,'error');}
}
async function deleteGrave(id){

  await dbDel('graves',id);
  await loadAll();closeSheet();toast('🗑️');

/* ============ PEOPLE ============ */
function setPeopleFilter(k){S.peopleFilter=k;renderPeople();}
function setPeopleAgeFilter(k){S.peopleAgeFilter=k;renderPeople();}
function setPeopleSort(k){S.peopleSort=k;renderPeople();}

function filterPeople(q){
  const s=q?normAr(q):'';
  return S.people.filter(p=>{
    if(s){
      const fam=S.families.find(f=>f.id===p.familyId);
      const hay=normAr(`${p.name||''} ${p.phone||''} ${p.sector||''} ${p.relation||''} ${p.code||''} ${fam?.name||''} ${fam?.code||''}`);
      if(!hay.includes(s))return false;
    }
    if(S.peopleFilter==='alive'&&p.status!=='حي')return false;
    if(S.peopleFilter==='dead'&&p.status!=='متوفى')return false;
    if(S.peopleFilter==='male'&&p.gender!=='ذكر')return false;
    if(S.peopleFilter==='female'&&p.gender!=='أنثى')return false;
    if(S.peopleFilter==='photos'&&(!p.images||!p.images.length))return false;
    if(S.peopleAgeFilter!=='all'){
      const a=calcAge(p.birth,p.death,p.status);
      if(a==='')return false;
      if(S.peopleAgeFilter==='18+'&&a<18)return false;
      if(S.peopleAgeFilter==='under18'&&a>=18)return false;
      if(S.peopleAgeFilter==='18-30'&&(a<18||a>30))return false;
      if(S.peopleAgeFilter==='60+'&&a<60)return false;
    }
    return true;
  });
}

function sortPeople(list){
  const arr=[...list];
  switch(S.peopleSort){
    case 'name':arr.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ar'));break;
    case 'code':arr.sort((a,b)=>String(a.code||'zzz').localeCompare(String(b.code||'zzz'),'ar',{numeric:true}));break;
    case 'family':{
      const sz={};S.families.forEach(f=>sz[f.id]=S.people.filter(p=>p.familyId===f.id).length);
      arr.sort((a,b)=>(sz[b.familyId]||0)-(sz[a.familyId]||0));break;
    }
    case 'oldest':arr.sort((a,b)=>(a.birth||'9999').localeCompare(b.birth||'9999'));break;
    case 'youngest':arr.sort((a,b)=>(b.birth||'0000').localeCompare(a.birth||'0000'));break;
  }
  return arr;
}

function renderPeople(){
  const P=S.people;
  const alive=P.filter(p=>p.status==='حي').length;
  const dead=P.filter(p=>p.status==='متوفى').length;
  const over18=P.filter(p=>{
    if(p.status!=='حي')return false;
    const a=calcAge(p.birth,null,'حي');
    return a!==''&&a>=18;
  }).length;

  $('peopleStats').innerHTML=`
    <div class="stat"><div class="val">${P.length}</div><div class="lbl">الإجمالي</div></div>
    <div class="stat green"><div class="val">${alive}</div><div class="lbl">أحياء</div></div>
    <div class="stat red"><div class="val">${dead}</div><div class="lbl">متوفون</div></div>
    <div class="stat orange"><div class="val">${over18}</div><div class="lbl">18+</div></div>
  `;

  const chips=[
    {k:'all',l:'الكل'},{k:'alive',l:'🟢 أحياء'},{k:'dead',l:'🔴 متوفون'},
    {k:'male',l:'♂ ذكور'},{k:'female',l:'♀ إناث'},{k:'photos',l:'📸 بصور'}
  ];
  $('peopleChips').innerHTML=chips.map(c=>
    `<button class="chip ${S.peopleFilter===c.k?'on':''}" onclick="setPeopleFilter('${c.k}')">${c.l}</button>`
  ).join('');

  const ageChips=[
    {k:'all',l:'كل الأعمار'},{k:'18+',l:'🎓 18+'},{k:'18-30',l:'⭐ 18-30'},
    {k:'under18',l:'🧒 تحت 18'},{k:'60+',l:'🧓 60+'}
  ];
  $('peopleAgeChips').innerHTML=ageChips.map(c=>
    `<button class="chip ${S.peopleAgeFilter===c.k?'on':''}" onclick="setPeopleAgeFilter('${c.k}')">${c.l}</button>`

  const sortChips=[
    {k:'name',l:'🔤 أبجدي'},{k:'code',l:'#️⃣ الكود'},
    {k:'family',l:'👨‍👩‍👧 أكبر عائلة'},{k:'oldest',l:'⬆️ الأكبر'},

  $('peopleSortChips').innerHTML=sortChips.map(c=>

    const firstImg=p.images?.[0];

      <div class="av ${isDead?'red':(p.gender==='أنثى'?'orange':'')}">${firstImg?`<img src="${firstImg}">`:(isDead?'⚰️':(p.gender==='أنثى'?'👩':'👨'))}</div>
      <div class="body">
        <div class="ttl">${esc(p.name||'')}</div>
        <div class="sub">${fam?esc(fam.name)+' • ':''}${age!==''?age+' سنة • ':''}${esc(p.relation||p.status||'')}</div>
      </div>
      <span class="trail">›</span>
    </div>`;
  }).join('')}</div>
  ${list.length>300?`<div style="text-align:center;padding:14px;font-size:12px;color:var(--muted)">عرض أول 300 من ${list.length}</div>`:''}`;

    ?`<button class="btn ghost" onclick="closeSheet()">إلغاء</button>
      <button class="btn primary" onclick="savePerson()">💾 حفظ</button>`
    :`<button class="btn danger sm" onclick="deletePerson(${id})">🗑️</button>
      <button class="btn info" onclick="openTreeSheet(${id})">🌳</button>
      <button class="btn primary" onclick="savePerson(${id})">💾 حفظ</button>`;

  openSheet(isNew?'➕ إضافة فرد':'✏️ '+esc(p.name||''),body,foot,{focus:'pName'});

  const closer=e=>{
    if(!e.target.closest('#fatherOptions,#pFatherInput'))$('fatherOptions')?.classList.remove('on');
    if(!e.target.closest('#motherOptions,#pMotherInput'))$('motherOptions')?.classList.remove('on');
  };
  document.addEventListener('click',closer);
  const origClose=window.closeSheet;
  window.closeSheet=function(){document.removeEventListener('click',closer);origClose();window.closeSheet=origClose;};
}

function onParentInput(kind){
  const inputEl=$(kind==='father'?'pFatherInput':'pMotherInput');
  const idEl=$(kind==='father'?'pFatherId':'pMotherId');
  const nameEl=$(kind==='father'?'pFatherName':'pMotherName');
  const hintEl=$(kind==='father'?'fatherHint':'motherHint');
  const optEl=$(kind==='father'?'fatherOptions':'motherOptions');
  const q=inputEl.value.trim();
  const gender=kind==='father'?'ذكر':'أنثى';
  const editId=S.editing?.id;

  const match=q?S.people.find(p=>p.gender===gender&&cleanName(p.name)===cleanName(q)&&p.id!==editId):null;
  if(match){idEl.value=match.id;nameEl.value='';hintEl.style.display='none';}
  else if(q){idEl.value='';nameEl.value=q;hintEl.style.display='block';hintEl.textContent=`⚠️ "${q}" غير مسجل — سيُحفظ كاسم فقط`;}
  else{idEl.value='';nameEl.value='';hintEl.style.display='none';}

  const matches=S.people.filter(p=>p.gender===gender&&p.id!==editId).filter(p=>!q||normAr(p.name).includes(normAr(q))).slice(0,50);
  if(!matches.length){
    optEl.innerHTML='<div style="padding:12px;color:var(--muted);font-size:13px">لا نتائج مطابقة — سيُحفظ كاسم</div>';
  } else {
    optEl.innerHTML=matches.map(p=>{
      const fam=S.families.find(f=>f.id===p.familyId);
      return `<div class="option-item" onclick="selectParent('${kind}',${p.id},'${esc(p.name).replace(/'/g,"&#39;")}')">
        <span>${esc(p.name)}</span>
        <small>${p.birth?p.birth.slice(0,4):''} ${fam?'• '+esc(fam.name):''}</small>
      </div>`;
    }).join('');
  }
  optEl.classList.add('on');
}
function selectParent(kind,id,name){
  $(kind==='father'?'pFatherInput':'pMotherInput').value=name;
  $(kind==='father'?'pFatherId':'pMotherId').value=id;
  $(kind==='father'?'pFatherName':'pMotherName').value='';
  $(kind==='father'?'fatherHint':'motherHint').style.display='none';
  $(kind==='father'?'fatherOptions':'motherOptions').classList.remove('on');
}

async function addPersonImage(){
  pickImage(async dataUrl=>{

    if(!p){toast('احفظ الفرد أولاً','warning');return;}

async function removePersonImage(idx){
  const p=S.editing?.id?S.people.find(x=>x.id===S.editing.id):null;
  if(!p)return;
  if(!confirm('حذف الصورة؟'))return;
  p.images=(p.images||[]).filter((_,i)=>i!==idx);

async function savePerson(id){
  const name=cleanName($('pName').value);
  if(!name){toast('الاسم مطلوب','error');return;}
  const old=id?await dbGet('people',id):null;
  const fatherId=$('pFatherId').value?Number($('pFatherId').value):null;
  const fatherName=fatherId?null:($('pFatherInput').value.trim()||null);
  const motherId=$('pMotherId').value?Number($('pMotherId').value):null;
  const motherName=motherId?null:($('pMotherInput').value.trim()||null);
  const obj={
    name,gender:$('pGender').value,status:$('pStatus').value,
    familyId:$('pFamilyId').value?Number($('pFamilyId').value):null,
    relation:$('pRelation').value,
    birth:$('pBirth').value,death:$('pDeath').value,
    fatherId,fatherName,motherId,motherName,
    phone:cleanPhone($('pPhone').value),
    sector:$('pSector').value.trim(),
    notes:$('pNotes').value.trim(),
    images:old?.images||[],
    custom:collectCustomFields(),
    updatedAt:new Date().toISOString()
  };
  try{
    if(id){obj.id=id;if(old){obj.createdAt=old.createdAt;obj.code=old.code;}}
    else obj.createdAt=new Date().toISOString();
    await dbPut('people',obj);
    await loadAll();closeSheet();
    toast(id?'✅ تم التعديل':'✅ تمت الإضافة');
    renderPeople();renderHome();
  }catch(e){toast('خطأ: '+e.message,'error');}
}
async function deletePerson(id){
  if(!confirm('حذف هذا الفرد؟'))return;
  const rel=S.people.filter(x=>x.fatherId===id||x.motherId===id);
  if(rel.length&&!confirm(`مرتبط بـ ${rel.length} من الأبناء. متابعة؟`))return;
  for(const c of rel){
    if(c.fatherId===id){c.fatherId=null;await dbPut('people',c);}
    if(c.motherId===id){c.motherId=null;await dbPut('people',c);}
  }
  await dbDel('people',id);
  await loadAll();closeSheet();toast('🗑️');
  renderPeople();renderHome();
}

function sortFamilies(k){S.familySort=k;renderFamilies();}

function renderFamilies(){
  const F=S.families;
  const total=F.reduce((s,f)=>s+S.people.filter(p=>p.familyId===f.id).length,0);
  $('familyStats').innerHTML=`
    <div class="stat"><div class="val">${F.length}</div><div class="lbl">عائلة</div></div>
    <div class="stat blue"><div class="val">${total}</div><div class="lbl">مرتبطون</div></div>
  `;

  let list=F.map(f=>({...f,members:S.people.filter(p=>p.familyId===f.id).length}));
  const q=$('globalSearch').value;
  if(q){
    const s=normAr(q);
    list=list.filter(f=>{
      if(normAr(`${f.name||''} ${f.code||''}`).includes(s))return true;
      return S.people.some(p=>p.familyId===f.id&&normAr(p.name).includes(s));
    });
  }

  if(S.familySort==='size')list.sort((a,b)=>b.members-a.members);
  else if(S.familySort==='name')list.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ar'));
  else if(S.familySort==='code')list.sort((a,b)=>String(a.code||'zzz').localeCompare(String(b.code||'zzz'),'ar',{numeric:true}));

  $('famSortSize').classList.toggle('on',S.familySort==='size');
  $('famSortName').classList.toggle('on',S.familySort==='name');
  $('famSortCode').classList.toggle('on',S.familySort==='code');

  const el=$('familyContent');
  if(!list.length){el.innerHTML=emptyState('👨‍👩‍👧','لا توجد عائلات','أضف عائلة');return;}

  el.innerHTML=`<div class="list">${list.slice(0,300).map(f=>`
    <div class="item" onclick="openFamilyView(${f.id})">
      <div class="av">👨‍👩‍👧</div>
      <div class="body">
        <div class="ttl">${esc(f.name||'')}</div>
        <div class="sub">${f.members} فرد${f.code?' • '+esc(f.code):''}${f.village?' • '+esc(f.village):''}</div>
      </div>
      <span class="trail">›</span>
    </div>`).join('')}</div>`;
}

function openFamilyView(id){
  const f=S.families.find(x=>x.id===id);
  if(!f)return;
  let members=S.people.filter(p=>p.familyId===id);

  const order={'أب':0,'أم':0,'رب أسرة':1,'زوج':2,'زوجة':2,'ابن':3,'بنت':3,'أخ':4,'أخت':4};
  members.sort((a,b)=>{
    const oa=order[a.relation]??99,ob=order[b.relation]??99;
    if(oa!==ob)return oa-ob;
    return (a.birth||'9999').localeCompare(b.birth||'9999');
  });

  const groups={
    head:members.filter(p=>p.relation==='رب أسرة'||['أب','أم'].includes(p.relation)),
    spouses:members.filter(p=>['زوج','زوجة'].includes(p.relation)),
    children:members.filter(p=>['ابن','بنت','حفيد','حفيدة'].includes(p.relation)),
    others:members.filter(p=>!['رب أسرة','أب','أم','زوج','زوجة','ابن','بنت','حفيد','حفيدة'].includes(p.relation))
  };

  const renderGroup=(title,list,icon)=>{
    if(!list.length)return '';
    return `<div class="member-group">
      <div class="member-group-title"><span>${icon} ${title}</span><span>${list.length}</span></div>
      <div class="list">${list.map(p=>{
        const firstImg=p.images?.[0];

          <div class="body">
            <div class="ttl">${esc(p.name||'')}</div>
            <div class="sub">${p.birth?'('+calcAge(p.birth,p.death,p.status)+' سنة) ':''}${esc(p.relation||'')}</div>
          </div>
          <span class="trail">›</span>
        </div>`;
      }).join('')}</div>
    </div>`;
  };

  const head=groups.head[0];
  const body=`
    <div class="fld-row">
      <div class="fld"><label>الاسم</label><input value="${esc(f.name||'')}" readonly class="fld-readonly"></div>
      <div class="fld"><label>الرمز</label><input value="${esc(f.code||'')}" readonly class="fld-readonly"></div>
    </div>
    ${f.notes?`<div class="fld"><label>ملاحظات</label><div style="padding:10px;background:var(--bg);border-radius:10px;font-size:13px">${esc(f.notes)}</div></div>`:''}
    <div style="display:flex;gap:8px;margin:12px 0">
      <div style="flex:1;text-align:center;padding:12px;background:var(--primary-soft);border-radius:12px">
        <div style="font-size:22px;font-weight:800;color:var(--primary)">${members.length}</div>
        <div style="font-size:11px;color:var(--muted);font-weight:700">الأفراد</div>
      </div>
      <div style="flex:1;text-align:center;padding:12px;background:#f0fdf4;border-radius:12px">
        <div style="font-size:22px;font-weight:800;color:var(--success)">${members.filter(p=>p.status==='حي').length}</div>
        <div style="font-size:11px;color:var(--muted);font-weight:700">أحياء</div>
      </div>
      <div style="flex:1;text-align:center;padding:12px;background:#fef2f2;border-radius:12px">
        <div style="font-size:22px;font-weight:800;color:var(--danger)">${members.filter(p=>p.status==='متوفى').length}</div>
        <div style="font-size:11px;color:var(--muted);font-weight:700">متوفون</div>
      </div>
    </div>
    ${renderGroup('رب الأسرة',groups.head,'👤')}
    ${renderGroup('الزوج/الزوجة',groups.spouses,'💑')}
    ${renderGroup('الأبناء',groups.children,'👶')}
    ${renderGroup('آخرون',groups.others,'👥')}
    ${!members.length?emptySmall('لا يوجد أفراد بعد'):''}
  `;

  const foot=`
    <button class="btn ghost sm" onclick="openFamilySheet(${id})">✏️</button>
    ${head?`<button class="btn info sm" onclick="openTreeSheet(${head.id})">🌳 الشجرة</button>`:''}
    <button class="btn primary" onclick="shareFamilyWA(${id})">📱 واتساب</button>
  `;
  openSheet(f.name||'عائلة',body,foot);

async function saveBurial(id){
  const personName=cleanName($('bPersonName').value);
  const graveId=Number($('bGraveId').value);
  const burialDate=$('bBurialDate').value;
  if(!personName){toast('الاسم مطلوب','error');return;}
  if(!graveId){toast('اختر القبر','error');return;}
  if(!burialDate){toast('تاريخ الدفن مطلوب','error');return;}

  const grave=S.graves.find(g=>g.id===graveId);
  const years=Number($('bYears').value)||grave.years||10;

  const prevBurials=[...(grave.previousBurials||[])];
  if(grave.status==='مشغول'&&grave.lastBuried&&grave.lastBuried!==personName){
    prevBurials.push({name:grave.lastBuried,date:grave.lastBurialDate||''});
  }

  const obj={
    personId:$('bPersonId').value?Number($('bPersonId').value):null,
    personName,graveId,graveNumber:grave.number,
    deathDate:$('bDeathDate').value,
    burialDate,age:$('bAge').value,
    years,source:$('bSource').value,
    notes:$('bNotes').value.trim(),
    year:new Date(burialDate).getFullYear(),
    updatedAt:new Date().toISOString()
  };
  try{
    if(id){obj.id=id;const old=await dbGet('burials',id);if(old)obj.createdAt=old.createdAt;}
    else obj.createdAt=new Date().toISOString();
    await dbPut('burials',obj);

    const gUpd={...grave};
    gUpd.status='مشغول';gUpd.lastBuried=personName;
    gUpd.lastBurialDate=burialDate;gUpd.availableDate=addYears(burialDate,years);
    gUpd.previousBurials=prevBurials;
    await dbPut('graves',gUpd);

    await loadAll();closeSheet();toast('📜 تم التسجيل');
    renderBurials();renderHome();renderGraves();
  }catch(e){toast('خطأ: '+e.message,'error');}
}

  if(!confirm('حذف هذا السجل؟'))return;
  await dbDel('burials',id);
  await loadAll();closeSheet();toast('🗑️');
  renderBurials();renderHome();
}

  const body=`

/* ============ FAMILY TREE ============ */
function openTreeSheet(personId){
  const root=S.people.find(p=>p.id===personId);
  if(!root)return;

  const ancestors=[];
  let cur=root;
  const seenUp=new Set([root.id]);
  for(let i=0;i<5;i++){
    const f=cur.fatherId?S.people.find(p=>p.id===cur.fatherId):null;
    const m=cur.motherId?S.people.find(p=>p.id===cur.motherId):null;
    if(!f&&!m&&!cur.fatherName&&!cur.motherName)break;
    ancestors.push({father:f,mother:m,fatherName:cur.fatherName,motherName:cur.motherName});
    const next=f&&!seenUp.has(f.id)?f:(m&&!seenUp.has(m.id)?m:null);
    if(!next)break;
    seenUp.add(next.id);
    cur=next;
  }
  ancestors.reverse();

  let topId=personId;
  if(ancestors.length){
    const top=ancestors[0];
    if(top.father)topId=top.father.id;
    else if(top.mother)topId=top.mother.id;
  }
  const fullVisited=new Set();
  const fullTree=buildTree(topId,fullVisited);

  const body=`
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
      🌳 الشجرة التراكمية — ${ancestors.length?ancestors.length+' جيل للأعلى + ':''}كل الأبناء والأحفاد
    </div>
    ${ancestors.length?`
      <div style="margin-bottom:14px;padding:12px;background:var(--bg);border-radius:12px">
        <div style="font-size:11px;font-weight:800;color:var(--muted);margin-bottom:8px">⬆️ الأسلاف</div>
        ${ancestors.map(a=>`
          <div style="margin-bottom:6px;font-size:13px">
            ${a.father?`<span class="tree-person male" style="padding:4px 10px;font-size:12px">👨 ${esc(a.father.name)}</span>`:(a.fatherName?`<span class="tree-person male" style="padding:4px 10px;font-size:12px;opacity:.7">👨 ${esc(a.fatherName)} <small>(غير مسجل)</small></span>`:'')}
            ${a.mother?`<span class="tree-person female" style="padding:4px 10px;font-size:12px">👩 ${esc(a.mother.name)}</span>`:(a.motherName?`<span class="tree-person female" style="padding:4px 10px;font-size:12px;opacity:.7">👩 ${esc(a.motherName)} <small>(غير مسجل)</small></span>`:'')}
          </div>`).join('')}
      </div>
    `:''}
    <div class="tree-wrap">${renderTreeHTML(fullTree,0)}</div>
  `;

  const foot=`
    <button class="btn ghost" onclick="closeSheet()">إغلاق</button>
    <button class="btn primary" onclick="shareTreeWA(${personId})">📱 واتساب</button>
  `;
  openSheet('🌳 شجرة '+root.name,body,foot,{wide:true});
}

function buildTree(personId,visited){
  if(visited.has(personId))return null;
  visited.add(personId);
  const p=S.people.find(x=>x.id===personId);
  if(!p)return null;
  const children=S.people
    .filter(x=>x.fatherId===personId||x.motherId===personId)
    .map(c=>buildTree(c.id,visited))
    .filter(Boolean);
  return {person:p,children};
}

function renderTreeHTML(node,level){
  if(!node)return '';
  const p=node.person;
  const isDead=p.status==='متوفى';
  const cls=p.gender==='أنثى'?'female':'male';
  const age=calcAge(p.birth,p.death,p.status);
  const icon=isDead?'⚰️':(p.gender==='أنثى'?'👩':'👨');
  let html=`<div class="tree-node">
    <div class="tree-person ${cls} ${isDead?'dead':''}" onclick="closeSheet();setTimeout(()=>openPersonSheet(${p.id}),150)">
      <span>${icon}</span>
      <span>${esc(p.name)}</span>
      ${age!==''?`<small>${age}س</small>`:''}
    </div>`;
  if(node.children.length){
    html+=`<div class="tree-level">
      <div class="tree-level-title">👶 الأبناء (${node.children.length})</div>
      ${node.children.map(c=>renderTreeHTML(c,level+1)).join('')}
    </div>`;
  }
  html+='</div>';
  return html;
}

function shareTreeWA(personId){
  const root=S.people.find(p=>p.id===personId);
  if(!root)return;
  const visited=new Set();
  const tree=buildTree(personId,visited);
  let txt=`🌳 *شجرة ${root.name}*\n\n`;
  function walk(node,level){
    if(!node)return;
    const indent='  '.repeat(level);
    const icon=node.person.gender==='أنثى'?'👩':'👨';
    const dead=node.person.status==='متوفى'?' ⚰️':'';
    txt+=`${indent}${icon} ${node.person.name}${dead}\n`;
    node.children.forEach(c=>walk(c,level+1));
  }
  walk(tree,0);
  txt+=`\n_زعورة v7.3_`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank');
}

/* ============ AUTO LINK ============ */
async function autoLinkFamilyChildren(){
  const familyHeads={};
  for(const f of S.families){
    const head=S.people.find(p=>p.familyId===f.id&&p.relation==='رب أسرة'&&p.gender==='ذكر');
    const wife=S.people.find(p=>p.familyId===f.id&&p.relation==='زوجة');
    if(head)familyHeads[f.id]={fatherId:head.id,motherId:wife?.id||null};
  }
  let linked=0,ambiguous=0;
  for(const p of S.people){
    if(!p.familyId)continue;
    if(!['ابن','بنت','حفيد','حفيدة'].includes(p.relation))continue;
    if(p.fatherId||p.fatherName)continue;
    const link=familyHeads[p.familyId];
    if(!link||link.fatherId===p.id){ambiguous++;continue;}
    p.fatherId=link.fatherId;
    if(!p.motherId&&link.motherId&&link.motherId!==p.id)p.motherId=link.motherId;
    await dbPut('people',p);
    linked++;
  }
  return {linked,ambiguous};
}

async function autoLinkByName(){
  let linked=0;
  for(const p of S.people){
    let changed=false;
    if(p.fatherName&&!p.fatherId){
      const f=S.people.find(x=>x.gender==='ذكر'&&cleanName(x.name)===cleanName(p.fatherName)&&x.id!==p.id);
      if(f){p.fatherId=f.id;changed=true;}
    }
    if(p.motherName&&!p.motherId){
      const m=S.people.find(x=>x.gender==='أنثى'&&cleanName(x.name)===cleanName(p.motherName)&&x.id!==p.id);
      if(m){p.motherId=m.id;changed=true;}
    }
    if(changed){await dbPut('people',p);linked++;}
  }
  return linked;
}

async function runAutoLink(){
  showLoad(true);
  try{
    const r=await autoLinkFamilyChildren();
    await loadAll();
    toast(`✅ تم ربط ${r.linked} من الأبناء`,'success',4000);
    if(r.ambiguous)toast(`⚠️ ${r.ambiguous} غير واضح`,'warning',4000);
  }catch(e){toast('خطأ: '+e.message,'error');}
  showLoad(false);
  renderHome();renderPeople();
}
async function runLinkByName(){
  showLoad(true);
  try{
    const n=await autoLinkByName();
    await loadAll();
    toast(`✅ تم ربط ${n} اسم`,'success');
  }catch(e){toast('خطأ: '+e.message,'error');}
  showLoad(false);
  renderHome();renderPeople();
}

/* ============ BACKUP (File System Access API) ============ */
let fsFileHandle=null;

async function pickBackupFile(){
  if(!('showSaveFilePicker' in window)){
    toast('استخدم Chrome أو Edge للحفظ المباشر','warning',5000);
    return false;
  }
  try{
    fsFileHandle=await window.showSaveFilePicker({
      suggestedName:'zaoura_backup.json',
      types:[{description:'Zaoura Backup',accept:{'application/json':['.json']}}]
    });
    localStorage.setItem('backupFileName',fsFileHandle.name);
    toast('✅ تم تثبيت ملف النسخة','success',3000);
    return true;
  }catch(e){
    if(e.name!=='AbortError')toast('لم يتم الاختيار','warning');
    return false;
  }
}

async function saveToBackupFile(){
  if(!fsFileHandle){
    const ok=await pickBackupFile();
    if(!ok)return false;
  }
  try{
    const data={version:'7.3',date:new Date().toISOString(),data:{
      graves:S.graves,people:S.people,burials:S.burials,
      families:S.families,fields:S.fields
    }};
    const writable=await fsFileHandle.createWritable();
    await writable.write(JSON.stringify(data,null,2));
    await writable.close();
    localStorage.setItem('lastBackupTime',new Date().toISOString());
    toast('💾 تم الحفظ (استبدال)','success');
    return true;
  }catch(e){
    if(e.name==='NotFoundError'||e.name==='NotAllowedError'){
      fsFileHandle=null;
      toast('الملف غير متاح','warning');
    } else toast('فشل: '+e.message,'error');
    return false;
  }
}

async function setupBackupFile(){
  if(!('showSaveFilePicker' in window)){
    toast('استخدم Chrome/Edge','warning',5000);
    return;
  }
  await pickBackupFile();
  openSettings();
}
async function quickBackup(){
  const ok=await saveToBackupFile();
  if(ok)setTimeout(openSettings,300);
}

function normKey(k){return normAr(String(k||'')).replace(/[^\u0621-\u064Aa-z0-9]/g,'');}
function gv(row,...aliases){
  if(!row)return '';
  const normalized={};
  for(const k of Object.keys(row)){normalized[normKey(k)]=row[k];}
  for(const a of aliases){
    const key=normKey(a);
    if(key in normalized){
      const v=normalized[key];
      if(v===null||v===undefined)continue;
      const s=String(v).trim();
      if(!s||s.startsWith('=')||s.includes('openpyxl')||s.includes('ArrayFormula'))continue;
      return s;
    }
  }
  return '';
}

async function importXLSX(kind,input){
  const file=input.files[0];if(!file)return;
  showLoad(true);
  const log=$('importLog');
  log.innerHTML='<div style="color:var(--muted)">⏳ جاري القراءة…</div>';
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
    if(!rows.length){log.innerHTML='<div class="import-result error">❌ الملف فارغ</div>';showLoad(false);input.value='';return;}
    const result=await processImport(kind,rows);
    const cls=result.ok>0?'success':'error';
    log.innerHTML=`<div class="import-result ${cls}">
      <div style="font-weight:800;margin-bottom:6px">📊 النتيجة</div>
      <div>✅ نجح: <b>${result.ok}</b></div>
      <div>⏭️ تُخطّي: <b>${result.skip}</b></div>
      ${result.errors.length?`<div>⚠️ أخطاء: ${result.errors.length}</div>
        <details style="margin-top:4px"><summary style="cursor:pointer">عرض</summary>
          <div style="font-size:11px;max-height:100px;overflow:auto">
            ${result.errors.slice(0,20).map(e=>'• '+esc(e)).join('<br>')}</div>
        </details>`:''}
    </div>`;
    if(result.ok>0)toast(`✅ نجح ${result.ok}`);
    await loadAll();renderHome();
    if(S.page==='pg-graves')renderGraves();
    if(S.page==='pg-people')renderPeople();
    if(S.page==='pg-burials')renderBurials();
    if(S.page==='pg-families')renderFamilies();
  }catch(e){
    console.error(e);
    log.innerHTML=`<div class="import-result error">❌ ${esc(e.message)}</div>`;
    toast('خطأ','error');
  }
  showLoad(false);input.value='';
}

async function processImport(kind,rows){
  let ok=0,skip=0;const errors=[];
  if(kind==='people'){
    const nameToId=new Map();S.people.forEach(p=>nameToId.set(normAr(p.name),p.id));
    for(let i=0;i<rows.length;i++){
      const r=rows[i];
      const name=cleanName(gv(r,...COLS.people.name));
      if(!name){skip++;continue;}
      if(nameToId.has(normAr(name))){skip++;continue;}
      try{
        const familyCode=gv(r,...COLS.people.familyCode).trim();
        let familyId=null;
        if(familyCode){
          let fam=S.families.find(f=>(f.code||'')===familyCode||normAr(f.name)===normAr(familyCode));
          if(!fam){
            const newFamId=await dbPut('families',{name:familyCode,code:familyCode,village:'',notes:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
            fam={id:newFamId,name:familyCode,code:familyCode};S.families.push(fam);
          }
          familyId=fam.id;
        }
        const newId=await dbPut('people',{
          code:gv(r,...COLS.people.code),name,
          gender:gv(r,...COLS.people.gender)||'ذكر',
          status:gv(r,...COLS.people.status)||'حي',
          familyId,relation:gv(r,...COLS.people.relation),
          birth:toDate(gv(r,...COLS.people.birth)),
          death:toDate(gv(r,...COLS.people.death)),
          fatherId:null,motherId:null,fatherName:null,motherName:null,
          phone:cleanPhone(gv(r,...COLS.people.phone)),
          sector:gv(r,...COLS.people.sector),
          notes:gv(r,...COLS.people.notes),
          images:[],
          custom:{
            'كود الأسرة':familyCode,
            'حالة الجوال':gv(r,...COLS.people.phoneStatus),
            'حالة العضو':gv(r,...COLS.people.memberStatus),
            'نوع العضو':gv(r,...COLS.people.memberType),
            'نوع الاشتراك':gv(r,...COLS.people.subType),
            'تاريخ الاشتراك':toDate(gv(r,...COLS.people.subDate)),
            'تاريخ إضافة الاشتراك':toDate(gv(r,...COLS.people.subDate2)),
            'سبب الخصم':gv(r,...COLS.people.deduction),
            'خصم اللجنة':gv(r,...COLS.people.committee),
            'تاريخ تغيير الحالة':toDate(gv(r,...COLS.people.statusChange))
          },
          createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
        });
        nameToId.set(normAr(name),newId);ok++;
      }catch(e){errors.push(`صف ${i+2}: ${e.message}`);}
    }
  }
  else if(kind==='graves'){
    for(let i=0;i<rows.length;i++){
      const r=rows[i];
      const number=cleanName(gv(r,...COLS.graves.number));
      if(!number){skip++;continue;}
      if(S.graves.some(g=>String(g.number)===String(number))){skip++;continue;}
      try{
        const lastDate=toDate(gv(r,...COLS.graves.lastDate));
        let status=gv(r,...COLS.graves.status);
        if(!status||status.startsWith('=')){
          const lb=gv(r,...COLS.graves.lastBuried);
          status=lb?'مشغول':'فارغ';
        }
        status=status.replace(/[⚪✅🔒🔄\s]/g,'').trim();
        if(!['فارغ','مشغول','متاح للإعادة','مهجور','مهدّم'].includes(status)){
          if(status.includes('متاح'))status='فارغ';
          else if(status.includes('مشغول'))status='مشغول';
          else status='فارغ';
        }
        await dbPut('graves',{
          number,
          type:gv(r,...COLS.graves.type)||'عام',
          status,
          section:gv(r,...COLS.graves.location),
          location:gv(r,...COLS.graves.location),
          owner:gv(r,...COLS.graves.owner)||gv(r,...COLS.graves.familyName),
          lastBuried:gv(r,...COLS.graves.lastBuried),
          lastBurialDate:lastDate,
          years:10,
          availableDate:lastDate?addYears(lastDate,10):'',
          notes:gv(r,...COLS.graves.notes),
          previousBurials:[],
          images:[],
          lat:null,lng:null,
          custom:{
            'رقم المقبرة':gv(r,...COLS.graves.cemeteryCode),
            'اسم المقبرة':gv(r,...COLS.graves.cemeteryName),
            'الضيعة':gv(r,...COLS.graves.village),
            'العائلة':gv(r,...COLS.graves.familyName),
            'حالة إضافية':gv(r,...COLS.graves.graveNote),
            'جواز الاستخدام':toDate(gv(r,...COLS.graves.usableUntil))
          },
          createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
        });
        ok++;
      }catch(e){errors.push(`صف ${i+2}: ${e.message}`);}
    }
  }
  else if(kind==='burials'){
    for(let i=0;i<rows.length;i++){
      const r=rows[i];
      const personName=cleanName(gv(r,...COLS.burials.personName));
      const graveNumber=cleanName(gv(r,...COLS.burials.graveNumber));
      const burialDate=toDate(gv(r,...COLS.burials.burialDate));
      if(!personName||!graveNumber){skip++;continue;}
      if(S.burials.some(b=>normAr(b.personName)===normAr(personName)&&String(b.graveNumber)===String(graveNumber)&&b.burialDate===burialDate)){skip++;continue;}
      try{
        let grave=S.graves.find(g=>String(g.number)===String(graveNumber));
        if(!grave){
          const newGid=await dbPut('graves',{
            number:graveNumber,type:'عام',status:'مشغول',section:'',location:'',owner:'',
            lastBuried:personName,lastBurialDate:burialDate,years:10,
            availableDate:burialDate?addYears(burialDate,10):'',
            notes:'',previousBurials:[],images:[],lat:null,lng:null,custom:{},
            createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
          });
          grave={id:newGid,number:graveNumber,years:10};S.graves.push(grave);
        }
        const age=gv(r,...COLS.burials.age);
        const personId=(()=>{const p=S.people.find(pp=>normAr(pp.name)===normAr(personName));return p?p.id:null;})();
        const years=grave.years||10;
        await dbPut('burials',{
          externalId:gv(r,...COLS.burials.externalId),
          personName,personId,graveId:grave.id,graveNumber:grave.number,
          deathDate:toDate(gv(r,...COLS.burials.deathDate)),
          burialDate,age:isFormula(age)?'':age,years,
          source:gv(r,...COLS.burials.source)||'الشهادة',
          notes:gv(r,...COLS.burials.notes),
          year:burialDate?new Date(burialDate).getFullYear():null,
          custom:{'رقم الوثيقة':gv(r,...COLS.burials.documentNum),'صورة الشاهد':gv(r,...COLS.burials.witnessPhoto),'عدد المدفونين':gv(r,...COLS.burials.buriedCount)},
          createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
        });
        const updated={...(S.graves.find(x=>x.id===grave.id)||grave)};
        updated.status='مشغول';updated.lastBuried=personName;
        updated.lastBurialDate=burialDate;updated.availableDate=addYears(burialDate,years);
        await dbPut('graves',updated);
        ok++;
      }catch(e){errors.push(`صف ${i+2}: ${e.message}`);}
    }
  }
  return {ok,skip,errors};
}
