<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام إدارة قرية زعورة</title>

  <!-- مكتبة قراءة ملفات Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #075985;
      --primary-dark: #0c4a6e;
      --green: #15803d;
      --red: #b91c1c;
      --orange: #c2410c;
      --yellow: #a16207;
      --gray: #64748b;
      --light: #f1f5f9;
      --border: #cbd5e1;
      --text: #172033;
      --white: #fff;
      --shadow: 0 3px 14px #0001;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #eef2f7;
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
    }

    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: white;
      padding: 22px 18px;
      box-shadow: var(--shadow);
    }

    header h1 { margin: 0 0 7px; font-size: 25px; }
    header p { margin: 0; opacity: .9; }

    main {
      max-width: 1600px;
      margin: auto;
      padding: 16px;
    }

    .toolbar, .card {
      background: var(--white);
      border-radius: 12px;
      padding: 15px;
      box-shadow: var(--shadow);
      margin-bottom: 15px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button, .file-label {
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
      color: white;
      background: var(--primary);
      font-size: 14px;
      display: inline-block;
    }

    button:hover, .file-label:hover { filter: brightness(.92); }
    button.green { background: var(--green); }
    button.red { background: var(--red); }
    button.orange { background: var(--orange); }
    button.gray { background: var(--gray); }
    button.small { padding: 6px 9px; font-size: 12px; }

    input[type=file] { display: none; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 15px;
    }

    .tab {
      background: #dbeafe;
      color: var(--primary-dark);
      border: 1px solid #bfdbfe;
    }

    .tab.active {
      background: var(--primary);
      color: white;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      border-radius: 10px;
      color: white;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .stat h3 { margin: 0 0 7px; font-size: 14px; }
    .stat strong { font-size: 25px; }
    .blue { background: var(--primary); }
    .green-bg { background: var(--green); }
    .red-bg { background: var(--red); }
    .orange-bg { background: var(--orange); }
    .gray-bg { background: var(--gray); }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px;
      background: white;
      font: inherit;
    }

    .filters input, .filters select {
      width: auto;
      min-width: 170px;
    }

    textarea { min-height: 75px; resize: vertical; }

    .table-wrap {
      overflow-x: auto;
      background: white;
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 950px;
    }

    th, td {
      border-bottom: 1px solid #e2e8f0;
      padding: 9px;
      text-align: right;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      background: #e0f2fe;
      color: var(--primary-dark);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:hover td { background: #f8fafc; }

    .badge {
      border-radius: 20px;
      padding: 4px 9px;
      font-size: 12px;
      display: inline-block;
      color: white;
    }

    .badge.green { background: var(--green); }
    .badge.red { background: var(--red); }
    .badge.orange { background: var(--orange); }
    .badge.gray { background: var(--gray); }
    .badge.blue { background: var(--primary); }

    .empty {
      text-align: center;
      padding: 30px;
      color: var(--gray);
    }

    dialog {
      border: 0;
      border-radius: 12px;
      width: min(850px, 95vw);
      padding: 0;
      box-shadow: 0 15px 50px #0005;
    }

    dialog::backdrop { background: #0008; }

    .modal-head {
      padding: 15px 18px;
      color: white;
      background: var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-head h2 { margin: 0; font-size: 19px; }

    .modal-body { padding: 18px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
    }

    .form-group.full { grid-column: 1 / -1; }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: #334155;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-start;
      margin-top: 16px;
    }

    .family-tree {
      display: grid;
      gap: 12px;
      margin-top: 15px;
    }

    .person-node {
      padding: 11px;
      border-radius: 9px;
      border: 2px solid;
      cursor: pointer;
      background: white;
      box-shadow: var(--shadow);
    }

    .person-node.male { border-color: #2563eb; }
    .person-node.female { border-color: #db2777; }
    .person-node.selected {
      border-color: #ca8a04;
      background: #fef9c3;
    }

    .children {
      margin-right: 25px;
      border-right: 3px solid #94a3b8;
      padding-right: 12px;
      display: grid;
      gap: 8px;
    }

    .notice {
      padding: 10px;
      border-radius: 8px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    @media (max-width: 650px) {
      main { padding: 9px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: auto; }
      .filters input, .filters select { width: 100%; }
      header h1 { font-size: 20px; }
    }
  </style>
</head>

<body>
<header>
  <h1>نظام إدارة قرية زعورة</h1>
  <p>إدارة الأفراد والمدافن والقبور وسجلات الدفن</p>
</header>

<main>
  <div class="toolbar">
    <button class="green" onclick="openPersonModal()">إضافة فرد</button>
    <button class="green" onclick="openCemeteryModal()">إضافة مدفن</button>
    <button class="green" onclick="openGraveModal()">إضافة قبر</button>
    <button class="green" onclick="openBurialModal()">إضافة سجل دفن</button>

    <label class="file-label orange">
      استيراد Excel
      <input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
    </label>

    <button class="gray" onclick="backupJSON()">تحميل نسخة احتياطية</button>

    <label class="file-label gray">
      استعادة نسخة JSON
      <input type="file" id="jsonFile" accept=".json">
    </label>

    <button class="red" onclick="clearAllData()">حذف كل البيانات</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="peopleTab">الأفراد</button>
    <button class="tab" data-tab="cemeteriesTab">المدافن</button>
    <button class="tab" data-tab="gravesTab">القبور</button>
    <button class="tab" data-tab="burialsTab">سجلات الدفن</button>
    <button class="tab" data-tab="familyTab">شجرة العائلة</button>
  </div>

  <section id="peopleTab" class="tab-content active">
    <div id="peopleStats" class="stats"></div>
    <div class="card">
      <div class="filters">
        <input id="peopleSearch" placeholder="بحث بالاسم أو الكود أو الهاتف">
        <select id="peopleStatusFilter">
          <option value="">كل الحالات</option>
          <option>حي</option>
          <option>متوفى</option>
          <option>معفي</option>
          <option>منسحب</option>
        </select>
        <select id="peopleSectorFilter">
          <option value="">كل القطاعات</option>
          <option>الجبل</option>
          <option>الحارة1</option>
          <option>الحارة2</option>
          <option>الوادي</option>
          <option>المنصورة</option>
          <option>دمر</option>
        </select>
      </div>
      <div id="peopleTable"></div>
    </div>
  </section>

  <section id="cemeteriesTab" class="tab-content">
    <div id="cemeteryStats" class="stats"></div>
    <div class="card">
      <input id="cemeterySearch" placeholder="بحث في المدافن">
    </div>
    <div id="cemeteriesTable"></div>
  </section>

  <section id="gravesTab" class="tab-content">
    <div id="graveStats" class="stats"></div>
    <div class="card">
      <div class="filters">
        <input id="graveSearch" placeholder="بحث برقم القبر أو العائلة أو آخر مدفون">
        <select id="graveStatusFilter">
          <option value="">كل الحالات</option>
          <option>فارغ</option>
          <option>متاح</option>
          <option>مشغول</option>
          <option>متاح لإعادة الاستخدام</option>
        </select>
      </div>
      <div id="gravesTable"></div>
    </div>
  </section>

  <section id="burialsTab" class="tab-content">
    <div id="burialStats" class="stats"></div>
    <div class="card">
      <input id="burialSearch" placeholder="بحث باسم المتوفى أو رقم القبر">
    </div>
    <div id="burialsTable"></div>
  </section>

  <section id="familyTab" class="tab-content">
    <div class="card">
      <div class="filters">
        <input id="familySearch" placeholder="ابحث باسم الفرد أو كود الأسرة">
        <button onclick="drawFamilyTree()">عرض الشجرة</button>
      </div>
      <div id="familyTree"></div>
    </div>
  </section>
</main>

<dialog id="modal">
  <div class="modal-head">
    <h2 id="modalTitle"></h2>
    <button class="small red" onclick="closeModal()">إغلاق</button>
  </div>
  <div id="modalBody" class="modal-body"></div>
</dialog>

<script>
"use strict";

/* =========================
   التخزين والبيانات
========================= */

const STORAGE_KEY = "zaoura_manager_v1";

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  people: [],
  cemeteries: [],
  graves: [],
  burials: []
};

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  renderAll();
}

function nextId(list) {
  return list.length ? Math.max(...list.map(x => Number(x.id) || 0)) + 1 : 1;
}

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function val(obj, ...names) {
  if (!obj) return "";
  const normalized = {};

  for (const key of Object.keys(obj)) {
    normalized[normalizeHeader(key)] = obj[key];
  }

  for (const name of names) {
    const key = normalizeHeader(name);
    if (normalized[key] !== undefined && normalized[key] !== null) {
      return normalized[key];
    }
  }

  return "";
}

function normalizeHeader(value) {
  return String(value ?? "")
    .trim()
    .toLowerCase()
    .replace(/[\s_\-ـ]/g, "")
    .replace(/[أإآ]/g, "ا")
    .replace(/ة/g, "ه")
    .replace(/[ًٌٍَُِّْـ]/g, "");
}

function cleanName(value) {
  return String(value ?? "")
    .trim()
    .replace(/\s+/g, " ")
    .replace(/[أإآ]/g, "ا")
    .replace(/ة/g, "ه")
    .replace(/[ًٌٍَُِّْـ]/g, "");
}

/* =========================
   التواريخ
========================= */

function normalizeExcelDate(value) {
  if (value === null || value === undefined || value === "") return "";

  if (value instanceof Date && !isNaN(value)) {
    return value.toISOString().slice(0, 10);
  }

  if (typeof value === "number") {
    const epoch = new Date(Date.UTC(1899, 11, 30));
    const date = new Date(epoch.getTime() + value * 86400000);
    return isNaN(date) ? "" : date.toISOString().slice(0, 10);
  }

  const text = String(value).trim();

  if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(text)) {
    const [y, m, d] = text.split("-");
    return `${y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
  }

  const match = text.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if (match) {
    const [, d, m, y] = match;
    return `${y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
  }

  return "";
}

function dateAdd(date, years) {
  if (!date) return "";
  const d = new Date(date + "T00:00:00");
  if (isNaN(d)) return "";
  d.setFullYear(d.getFullYear() + Number(years || 0));
  return d.toISOString().slice(0, 10);
}

function graveStatus(grave) {
  if (
    grave.status === "مشغول" &&
    grave.availableDate &&
    new Date(grave.availableDate + "T00:00:00") <= new Date()
  ) {
    return "متاح لإعادة الاستخدام";
  }
  return grave.status || "فارغ";
}

function calculateAge(birth, death) {
  if (!birth || !death) return "";
  const b = new Date(birth);
  const d = new Date(death);
  let age = d.getFullYear() - b.getFullYear();
  const beforeBirthday =
    d.getMonth() < b.getMonth() ||
    (d.getMonth() === b.getMonth() && d.getDate() < b.getDate());
  if (beforeBirthday) age--;
  return age >= 0 ? age : "";
}

/* =========================
   التنسيق والبحث
========================= */

function badge(status) {
  const colors = {
    "حي": "green",
    "فارغ": "green",
    "متاح": "green",
    "متوفى": "red",
    "مشغول": "red",
    "منسحب": "gray",
    "معفي": "orange",
    "متاح لإعادة الاستخدام": "orange",
    "خاص": "blue",
    "عام": "gray"
  };
  return `<span class="badge ${colors[status] || "gray"}">${esc(status || "-")}</span>`;
}

function actionButtons(type, id) {
  return `
    <button class="small" onclick="editItem('${type}', ${id})">تعديل</button>
    <button class="small red" onclick="deleteItem('${type}', ${id})">حذف</button>
  `;
}

function matches(text, query) {
  return cleanName(text).includes(cleanName(query));
}

function stat(title, number, cls) {
  return `<div class="stat ${cls}">
    <h3>${title}</h3>
    <strong>${number}</strong>
  </div>`;
}

/* =========================
   التبويبات
========================= */

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(x => x.classList.remove("active"));

    button.classList.add("active");
    document.getElementById(button.dataset.tab).classList.add("active");

    if (button.dataset.tab === "familyTab") drawFamilyTree();
  });
});

/* =========================
   عرض الأفراد
========================= */

function renderPeople() {
  const search = document.getElementById("peopleSearch").value;
  const status = document.getElementById("peopleStatusFilter").value;
  const sector = document.getElementById("peopleSectorFilter").value;

  const list = data.people.filter(p => {
    const text = `${p.name} ${p.familyCode} ${p.memberCode} ${p.phone}`;
    return matches(text, search) &&
      (!status || p.status === status) &&
      (!sector || p.sector === sector);
  });

  document.getElementById("peopleStats").innerHTML =
    stat("إجمالي الأفراد", data.people.length, "blue") +
    stat("أحياء", data.people.filter(x => x.status === "حي").length, "green-bg") +
    stat("متوفون", data.people.filter(x => x.status === "متوفى").length, "red-bg") +
    stat("أسر", new Set(data.people.map(x => x.familyCode).filter(Boolean)).size, "orange-bg");

  document.getElementById("peopleTable").innerHTML = list.length ? `
    <div class="table-wrap"><table>
      <thead><tr>
        <th>الاسم</th><th>الجنس</th><th>الميلاد</th><th>الوفاة</th>
        <th>كود الأسرة</th><th>رقم الفرد</th><th>القطاع</th>
        <th>الحالة</th><th>القرابة</th><th>الهاتف</th><th>إجراءات</th>
      </tr></thead>
      <tbody>
        ${list.map(p => `<tr>
          <td>${esc(p.name)}</td>
          <td>${esc(p.gender)}</td>
          <td>${esc(p.birth || "-")}</td>
          <td>${esc(p.death || "-")}</td>
          <td>${esc(p.familyCode || "-")}</td>
          <td>${esc(p.memberCode || "-")}</td>
          <td>${esc(p.sector || "-")}</td>
          <td>${badge(p.status)}</td>
          <td>${esc(p.relation || "-")}</td>
          <td>${esc(p.phone || "-")}</td>
          <td>${actionButtons("person", p.id)}</td>
        </tr>`).join("")}
      </tbody>
    </table></div>
  ` : `<div class="empty">لا توجد بيانات</div>`;
}

/* =========================
   عرض المدافن
========================= */

function renderCemeteries() {
  const q = document.getElementById("cemeterySearch").value;

  const list = data.cemeteries.filter(c =>
    matches(`${c.name} ${c.location} ${c.manager}`, q)
  );

  document.getElementById("cemeteryStats").innerHTML =
    stat("إجمالي المدافن", data.cemeteries.length, "blue") +
    stat("إجمالي القبور", data.graves.length, "green-bg") +
    stat("القبور المشغولة", data.graves.filter(g => graveStatus(g) === "مشغول").length, "red-bg");

  document.getElementById("cemeteriesTable").innerHTML = list.length ? `
    <div class="table-wrap"><table>
      <thead><tr>
        <th>اسم المدفن</th><th>الموقع</th><th>تاريخ الافتتاح</th>
        <th>المساحة</th><th>المسؤول</th><th>الهاتف</th>
        <th>الوضع القانوني</th><th>عدد القبور</th><th>إجراءات</th>
      </tr></thead>
      <tbody>
        ${list.map(c => `<tr>
          <td>${esc(c.name)}</td>
          <td>${esc(c.location)}</td>
          <td>${esc(c.openDate || "-")}</td>
          <td>${esc(c.area || "-")}</td>
          <td>${esc(c.manager || "-")}</td>
          <td>${esc(c.phone || "-")}</td>
          <td>${esc(c.legalStatus || "-")}</td>
          <td>${data.graves.filter(g => Number(g.cemeteryId) === Number(c.id)).length}</td>
          <td>${actionButtons("cemetery", c.id)}</td>
        </tr>`).join("")}
      </tbody>
    </table></div>
  ` : `<div class="empty">لا توجد بيانات</div>`;
}

/* =========================
   عرض القبور
========================= */

function renderGraves() {
  const search = document.getElementById("graveSearch").value;
  const filter = document.getElementById("graveStatusFilter").value;

  const list = data.graves.filter(g => {
    const current = graveStatus(g);
    return matches(`${g.number} ${g.family} ${g.owner} ${g.lastBuried}`, search) &&
      (!filter || current === filter);
  });

  document.getElementById("graveStats").innerHTML =
    stat("إجمالي القبور", data.graves.length, "blue") +
    stat("فارغة", data.graves.filter(x => graveStatus(x) === "فارغ").length, "green-bg") +
    stat("مشغولة", data.graves.filter(x => graveStatus(x) === "مشغول").length, "red-bg") +
    stat("قابلة لإعادة الاستخدام", data.graves.filter(x => graveStatus(x) === "متاح لإعادة الاستخدام").length, "orange-bg");

  document.getElementById("gravesTable").innerHTML = list.length ? `
    <div class="table-wrap"><table>
      <thead><tr>
        <th>رقم القبر</th><th>المدفن</th><th>الموقع</th><th>النوع</th>
        <th>العائلة</th><th>المالك</th><th>الحالة</th><th>السنوات</th>
        <th>آخر مدفون</th><th>تاريخ آخر دفن</th><th>تاريخ الإتاحة</th><th>إجراءات</th>
      </tr></thead>
      <tbody>
        ${list.map(g => {
          const c = data.cemeteries.find(x => Number(x.id) === Number(g.cemeteryId));
          return `<tr>
            <td>${esc(g.number)}</td>
            <td>${esc(c?.name || "-")}</td>
            <td>${esc(g.location || "-")}</td>
            <td>${badge(g.type)}</td>
            <td>${esc(g.family || "-")}</td>
            <td>${esc(g.owner || "-")}</td>
            <td>${badge(graveStatus(g))}</td>
            <td>${esc(g.years || 0)}</td>
            <td>${esc(g.lastBuried || "-")}</td>
            <td>${esc(g.lastBurialDate || "-")}</td>
            <td>${esc(g.availableDate || "-")}</td>
            <td>${actionButtons("grave", g.id)}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table></div>
  ` : `<div class="empty">لا توجد بيانات</div>`;
}

/* =========================
   عرض سجلات الدفن
========================= */

function renderBurials() {
  const q = document.getElementById("burialSearch").value;

  const list = data.burials.filter(b =>
    matches(`${b.personName} ${b.graveNumber} ${b.cemeteryName}`, q)
  );

  document.getElementById("burialStats").innerHTML =

function cemeteryOptions(selected) {

      ${esc(c.name)}
    </option>`
  ).join("");
}

function peopleOptions(selected) {
  return data.people.map(p =>
    `<option value="${p.id}" ${Number(p.id) === Number(selected) ? "selected" : ""}>
      ${esc(p.name)}${p.familyCode ? " - " + esc(p.familyCode) : ""}
    </option>`
  ).join("");
}

function graveOptions(selected) {
  return data.graves.map(g =>
    `<option value="${g.id}" ${Number(g.id) === Number(selected) ? "selected" : ""}>
      ${esc(g.number)} - ${esc(data.cemeteries.find(c => c.id === g.cemeteryId)?.name || "")}
    </option>`
  ).join("");
}

function findPerson(id) {
  return data.people.find(p => Number(p.id) === Number(id));
}

function findPersonId(name, familyCode = "") {
  const n = cleanName(name);
  if (!n) return null;

  const exactFamily = data.people.find(p =>
    cleanName(p.name) === n &&
    familyCode &&
    cleanName(p.familyCode) === cleanName(familyCode)
  );

  return exactFamily?.id ||
    data.people.find(p => cleanName(p.name) === n)?.id ||
    null;
}

function editItem(type, id) {
  if (type === "person") openPersonModal(id);
  if (type === "cemetery") openCemeteryModal(id);
  if (type === "grave") openGraveModal(id);
  if (type === "burial") openBurialModal(id);
}

function deleteItem(type, id) {
  if (!confirm("هل أنت متأكد من الحذف؟")) return;

  if (type === "person") {
    data.people = data.people.filter(x => x.id !== id);
    data.burials.forEach(b => {
      if (b.personId === id) b.personId = null;
    });
  }

  if (type === "cemetery") {
    if (data.graves.some(g => Number(g.cemeteryId) === Number(id))) {
      alert("لا يمكن حذف مدفن يحتوي على قبور.");
      return;
    }
    data.cemeteries = data.cemeteries.filter(x => x.id !== id);
  }

  if (type === "grave") {
    if (data.burials.some(b => Number(b.graveId) === Number(id))) {
      alert("لا يمكن حذف قبر لديه سجلات دفن.");
      return;
    }
    data.graves = data.graves.filter(x => x.id !== id);
  }

  if (type === "burial") {
    data.burials = data.burials.filter(x => x.id !== id);
  }

  save();
}

function drawFamilyTree() {
  const q = document.getElementById("familySearch").value;
  const target = data.people.find(p =>
    matches(`${p.name} ${p.familyCode}`, q)
  ) || data.people[0];

  const container = document.getElementById("familyTree");

  if (!target) {
    container.innerHTML = `<div class="empty">لا توجد بيانات أفراد.</div>`;
    return;
  }

  const father = findPerson(target.father);
  const mother = findPerson(target.mother);

  const children = data.people.filter(p =>
    Number(p.father) === Number(target.id) ||
    Number(p.mother) === Number(target.id)
  );

  const siblings = target.familyCode
    ? data.people.filter(p =>
        p.id !== target.id &&
        p.familyCode === target.familyCode &&
        (p.relation === "ابن" || p.relation === "بنت")
      )
    : [];

  function node(p) {
    if (!p) return "";
    return `
      <div class="person-node ${p.gender === "أنثى" ? "female" : "male"}
        ${p.id === target.id ? "selected" : ""}"
        onclick="openPersonModal(${p.id})">
        <strong>${esc(p.name)}</strong><br>
        <small>${esc(p.relation || "")} | ${badge(p.status)}</small>
      </div>`;
  }

  container.innerHTML = `
    <div class="notice">
      انقر على أي فرد لفتح نموذج التعديل. يتم تجميع الأبناء وفق روابط الأب والأم.
    </div>

    <div class="family-tree">
      ${father || mother ? `
        <div>
          <h3>الوالدان</h3>
          ${node(father)}
          ${node(mother)}
        </div>
      ` : ""}

      <div>
        <h3>الفرد المختار</h3>
        ${node(target)}
      </div>

      ${children.length ? `
        <div>
          <h3>الأبناء</h3>
          <div class="children">${children.map(node).join("")}</div>
        </div>
      ` : ""}

      ${siblings.length ? `
        <div>
          <h3>أفراد الأسرة</h3>
          <div class="children">${siblings.map(node).join("")}</div>
        </div>
      ` : ""}
    </div>`;
}

/* =========================
   استيراد Excel
========================= */

document.getElementById("excelFile").addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;

  if (typeof XLSX === "undefined") {
    alert("لم يتم تحميل مكتبة Excel. افتح الملف مع اتصال بالإنترنت.");
    return;
  }

  try {
    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, {
      type: "array",
      cellDates: true,
      raw: true,
      dateNF: "yyyy-mm-dd"
    });

    const report = [];

    for (const sheetName of workbook.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(
        workbook.Sheets[sheetName],
        { defval: "", raw: true }
      );

      const sheet = normalizeHeader(sheetName);

      if (sheet.includes("افراد") || sheet.includes("اشخاص") || sheet.includes("people")) {
        importPeople(rows, report);
      } else if (sheet.includes("مدافن") || sheet.includes("cemet")) {
        importCemeteries(rows, report);
      } else if (sheet.includes("قبور") || sheet.includes("graves")) {
        importGraves(rows, report);
      } else if (sheet.includes("دفن") || sheet.includes("burial")) {
        importBurials(rows, report);
      } else {
        /* محاولة تحديد نوع الجدول من أسماء الأعمدة */
        if (rows[0]) {
          const keys = Object.keys(rows[0]).map(normalizeHeader).join(" ");
          if (keys.includes("الجنس") || keys.includes("تاريخالميلاد")) {
            importPeople(rows, report);
          } else if (keys.includes("رقمالقبر") && keys.includes("اخرمدفون")) {
            importGraves(rows, report);
          } else if (keys.includes("تاريخالدفن")) {
            importBurials(rows, report);
          } else if (keys.includes("اسممدفن") || keys.includes("الوضعالقانوني")) {
            importCemeteries(rows, report);
          }
        }
      }
    }

    save();
    alert("تم الاستيراد:\n\n" + report.join("\n"));
  } catch (error) {
    console.error(error);
    alert("حدث خطأ أثناء قراءة ملف Excel: " + error.message);
  }

  event.target.value = "";
});

function importPeople(rows, report) {
  let added = 0, duplicate = 0, failed = 0;

  for (const row of rows) {
    const name = String(val(row, "الاسم", "اسم الفرد", "الاسم الثلاثي", "name")).trim();

    if (!name) {
      failed++;
      continue;
    }

    const birth = normalizeExcelDate(
      val(row, "تاريخ الميلاد", "الميلاد", "birth", "date of birth")
    );

    const duplicateRow = data.people.find(p =>
      cleanName(p.name) === cleanName(name) &&
      p.birth === birth
    );

    if (duplicateRow) {
      duplicate++;
      continue;
    }

    const familyCode = String(val(row, "كود الأسرة", "كود الاسرة", "familyCode")).trim();

    data.people.push({
      id: nextId(data.people),
      name,
      gender: String(val(row, "الجنس", "gender")).trim(),
      birth,
      death: normalizeExcelDate(val(row, "تاريخ الوفاة", "الوفاة", "death")),
      familyCode,
      memberCode: String(val(row, "رقم الفرد", "رقم العضو", "memberCode")).trim(),
      sector: String(val(row, "القطاع", "sector")).trim(),
      status: String(val(row, "الحالة", "status")).trim() || "حي",
      relation: String(val(row, "صلة القرابة", "القرابة", "relation")).trim(),
      father: null,
      mother: null,
      phone: String(val(row, "الهاتف", "رقم الهاتف", "phone")).trim(),
      notes: String(val(row, "ملاحظات", "notes")).trim()
    });

    added++;
  }

  /* الربط بعد اكتمال إدخال جميع الأفراد */
  for (const p of data.people) {
    const source = rows.find(r =>
      cleanName(val(r, "الاسم", "اسم الفرد", "الاسم الثلاثي", "name")) === cleanName(p.name)
    );

    if (!source) continue;

    p.father = findPersonId(
      val(source, "الأب", "اسم الأب", "father"),
      p.familyCode
    );

    p.mother = findPersonId(
      val(source, "الأم", "اسم الأم", "mother"),
      p.familyCode
    );
  }

  report.push(`الأفراد: أضيف ${added}، مكرر ${duplicate}، فاشل ${failed}`);
}

function importCemeteries(rows, report) {
  let added = 0, duplicate = 0, failed = 0;

  for (const row of rows) {
    const name = String(val(row, "اسم المدفن", "المدفن", "name")).trim();

    if (!name) {
      failed++;
      continue;
    }

    if (data.cemeteries.some(c => cleanName(c.name) === cleanName(name))) {
      duplicate++;
      continue;
    }

    data.cemeteries.push({
      id: nextId(data.cemeteries),
      name,
      location: String(val(row, "الموقع", "location")).trim(),
      openDate: normalizeExcelDate(val(row, "تاريخ الافتتاح", "openDate")),
      area: Number(val(row, "المساحة", "area")) || 0,
      manager: String(val(row, "المسؤول", "المدير", "manager")).trim(),
      phone: String(val(row, "الهاتف", "phone")).trim(),
      legalStatus: String(val(row, "الوضع القانوني", "legalStatus")).trim(),
      notes: String(val(row, "ملاحظات", "notes")).trim()
    });

    added++;
  }

  report.push(`المدافن: أضيف ${added}، مكرر ${duplicate}، فاشل ${failed}`);
}

function importGraves(rows, report) {
  let added = 0, duplicate = 0, failed = 0;

  for (const row of rows) {
    const number = String(val(row, "رقم القبر", "رقم", "number")).trim();
    const cemeteryName = String(val(row, "اسم المدفن", "المدفن", "cemetery")).trim();

    if (!number) {
      failed++;
      continue;
    }

    const cemetery = data.cemeteries.find(c =>
      cleanName(c.name) === cleanName(cemeteryName)
    );

    const cemeteryId = cemetery?.id ||
      (data.cemeteries.length === 1 ? data.cemeteries[0].id : null);

    if (!cemeteryId) {
      failed++;
      continue;
    }

    if (data.graves.some(g =>
      g.number === number && Number(g.cemeteryId) === Number(cemeteryId)
    )) {
      duplicate++;
      continue;
    }

    const years = Number(val(row, "السنوات", "مدة إعادة الاستخدام", "years")) || 10;
    const lastDate = normalizeExcelDate(
      val(row, "تاريخ آخر دفن", "اخر تاريخ دفن", "lastBurialDate")
    );

    let status = String(val(row, "الحالة", "status")).trim() || "فارغ";
    const availableDate = normalizeExcelDate(
      val(row, "تاريخ الإتاحة", "تاريخ الاتاحة", "availableDate")
    ) || dateAdd(lastDate, years);

    data.graves.push({
      id: nextId(data.graves),
      number,
      cemeteryId,
      location: String(val(row, "الموقع", "location")).trim(),
      type: String(val(row, "النوع", "type")).trim() || "عام",
      family: String(val(row, "العائلة", "الأسرة", "family")).trim(),
      owner: String(val(row, "المالك", "owner")).trim(),
      status,
      years,
      lastBuried: String(val(row, "آخر مدفون", "اخر مدفون", "lastBuried")).trim(),
      lastBurialDate: lastDate,
      availableDate
    });

    added++;
  }

  report.push(`القبور: أضيف ${added}، مكرر ${duplicate}، فاشل ${failed}`);
}

function importBurials(rows, report) {
  let added = 0, duplicate = 0, failed = 0;

  for (const row of rows) {
    const personName = String(val(
      row, "اسم المتوفى", "اسم المتوفي", "المتوفى", "personName"
    )).trim();

    const graveNumber = String(val(row, "رقم القبر", "graveNumber")).trim();
    const burialDate = normalizeExcelDate(
      val(row, "تاريخ الدفن", "burialDate")
    );

    if (!personName || !graveNumber || !burialDate) {
      failed++;
      continue;
    }

    const grave = data.graves.find(g => g.number === graveNumber);

    if (!grave) {
      failed++;
      continue;
    }

    const duplicateRow = data.burials.find(b =>
      b.graveNumber === graveNumber &&
      cleanName(b.personName) === cleanName(personName) &&
      b.burialDate === burialDate
    );

    if (duplicateRow) {
      duplicate++;
      continue;
    }

    const person = data.people.find(p =>
      cleanName(p.name) === cleanName(personName)
    );

    const deathDate = normalizeExcelDate(
      val(row, "تاريخ الوفاة", "الوفاة", "deathDate")
    );

    const burial = {
      id: nextId(data.burials),
      graveId: grave.id,
      graveNumber: grave.number,
      cemeteryName: data.cemeteries.find(c => c.id === grave.cemeteryId)?.name || "",
      personName,
      personId: person?.id || null,
      deathDate,
      burialDate,
      age: Number(val(row, "العمر", "age")) ||
        calculateAge(person?.birth, deathDate) || 0,
      source: String(val(row, "المصدر", "source")).trim(),
      year: Number(val(row, "السنة", "year")) || Number(burialDate.slice(0, 4)),
      notes: String(val(row, "ملاحظات", "notes")).trim()
    };

    data.burials.push(burial);

    grave.status = "مشغول";
    grave.lastBuried = personName;
    grave.lastBurialDate = burialDate;
    grave.availableDate = dateAdd(burialDate, Number(grave.years || 10));

    if (person) {
      person.status = "متوفى";
      if (!person.death && deathDate) person.death = deathDate;
    }

    added++;
  }

  report.push(`سجلات الدفن: أضيف ${added}، مكرر ${duplicate}، فاشل ${failed}`);
}

/* =========================
   النسخ الاحتياطي
========================= */

function backupJSON() {
  const backup = {
    app: "نظام إدارة قرية زعورة",
    version: 1,
    createdAt: new Date().toISOString(),
    data
  };

  const blob = new Blob(
    [JSON.stringify(backup, null, 2)],
    { type: "application/json;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `zaoura-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById("jsonFile").addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const restored = parsed.data || parsed;

      if (
        !Array.isArray(restored.people) ||
        !Array.isArray(restored.cemeteries) ||
        !Array.isArray(restored.graves) ||
        !Array.isArray(restored.burials)
      ) {
        throw new Error("بنية الملف غير صحيحة");
      }

      if (!confirm("سيتم استبدال البيانات الحالية. هل تريد المتابعة؟")) return;

      data = restored;
      save();
      alert("تمت استعادة النسخة الاحتياطية بنجاح.");
    } catch (error) {
      alert("تعذر استعادة الملف: " + error.message);
    }
  };

  reader.readAsText(file, "utf-8");
  event.target.value = "";
});

function clearAllData() {
  if (!confirm("سيتم حذف جميع الأفراد والمدافن والقبور وسجلات الدفن. هل أنت متأكد؟")) {
    return;
  }

  data = {
    people: [],
    cemeteries: [],
    graves: [],
    burials: []
  };

  save();
}

[
  "peopleSearch",

function renderAll() {
  renderPeople();
  renderCemeteries();
  renderGraves();
  renderBurials();
  drawFamilyTree();
}

renderAll();
