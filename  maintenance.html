<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d5c46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مهام الصيانة">
<title>مهام الصيانة - jam3iyati</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
<style>
:root{
  --emerald-900:#0d3d2e;
  --emerald-800:#0d5c46;
  --emerald-700:#127a5d;
  --emerald-600:#1a9b76;
  --emerald-500:#22b88d;
  --emerald-100:#d4f4e8;
  --emerald-50:#eefaf5;
  --copper-700:#8b5a2b;
  --copper-600:#b87333;
  --copper-500:#d49249;
  --copper-300:#e8b878;
  --copper-100:#f5e6d3;
  --danger:#c0392b;
  --danger-light:#fdecea;
  --warn:#d97706;
  --warn-light:#fef3e2;
  --ok:#15803d;
  --ok-light:#dcfce7;
  --gray-900:#0f172a;
  --gray-700:#334155;
  --gray-500:#64748b;
  --gray-300:#cbd5e1;
  --gray-200:#e2e8f0;
  --gray-100:#f1f5f9;
  --gray-50:#f8fafc;
  --white:#fff;
  --shadow-sm:0 1px 3px rgba(13,92,70,.08);
  --shadow-md:0 4px 14px rgba(13,92,70,.12);
  --shadow-lg:0 10px 30px rgba(13,92,70,.18);
  --radius:14px;
  --radius-sm:10px;
  --radius-lg:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Segoe UI',Tahoma,'Arial',sans-serif;
  background:linear-gradient(160deg,#f0f7f4 0%,#f8fafc 100%);
  color:var(--gray-900);
  min-height:100vh;
  padding-bottom:90px;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ============ الرأس ============ */
.app-header{
  background:linear-gradient(135deg,var(--emerald-800),var(--emerald-700));
  color:#fff;
  padding:18px 16px 22px;
  border-radius:0 0 24px 24px;
  box-shadow:var(--shadow-lg);
  position:relative;
  overflow:hidden;
}
.app-header::before{
  content:'';
  position:absolute;
  top:-40%;left:-10%;
  width:220px;height:220px;
  background:radial-gradient(circle,rgba(212,146,73,.25),transparent 70%);
  border-radius:50%;
}
.app-header::after{
  content:'';
  position:absolute;
  bottom:-60%;right:-20%;
  width:260px;height:260px;
  background:radial-gradient(circle,rgba(34,184,141,.2),transparent 70%);
  border-radius:50%;
}
.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  position:relative;
  z-index:1;
  margin-bottom:14px;
}
.header-title{
  display:flex;
  align-items:center;
  gap:10px;
}
.header-icon{
  font-size:26px;
  background:rgba(255,255,255,.15);
  width:42px;height:42px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(10px);
}
.header-title h1{
  font-size:17px;
  font-weight:700;
  letter-spacing:.2px;
}
.header-title p{
  font-size:11px;
  opacity:.85;
  margin-top:2px;
}
.header-date{
  background:rgba(255,255,255,.15);
  padding:6px 12px;
  border-radius:20px;
  font-size:11px;
  font-weight:600;
  backdrop-filter:blur(10px);
  white-space:nowrap;
}

/* ============ إحصائيات ============ */
.stats-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  position:relative;
  z-index:1;
}
.stat{
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.18);
  border-radius:12px;
  padding:10px 6px;
  text-align:center;
  backdrop-filter:blur(10px);
  transition:.2s;
}
.stat:active{transform:scale(.96)}
.stat-num{
  font-size:20px;
  font-weight:800;
  line-height:1;
}
.stat-lbl{
  font-size:10px;
  opacity:.9;
  margin-top:4px;
  font-weight:500;
}
.stat.high .stat-num{color:#ffb3a7}
.stat.med .stat-num{color:#ffe08a}
.stat.done .stat-num{color:#a7f3c9}

/* ============ شريط البحث ============ */
.search-wrap{
  padding:14px 16px 8px;
}
.search-box{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--white);
  border-radius:14px;
  padding:12px 14px;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--gray-200);
  transition:.2s;
}
.search-box:focus-within{
  border-color:var(--emerald-600);
  box-shadow:0 0 0 3px rgba(26,155,118,.1);
}
.search-box svg{
  width:18px;height:18px;
  color:var(--gray-500);
  flex-shrink:0;
}
.search-box input{
  flex:1;
  border:none;
  outline:none;
  font-size:14px;
  background:transparent;
  font-family:inherit;
}

/* ============ الفلاتر ============ */
.filters{
  padding:0 16px 12px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.chip{
  padding:7px 14px;
  border-radius:20px;
  border:1px solid var(--gray-200);
  background:var(--white);
  font-size:12px;
  font-weight:600;
  color:var(--gray-700);
  cursor:pointer;
  white-space:nowrap;
  transition:.2s;
  font-family:inherit;
}
.chip.active{
  background:var(--emerald-700);
  color:#fff;
  border-color:var(--emerald-700);
  box-shadow:0 4px 10px rgba(13,92,70,.25);
}

/* ============ قائمة المهام ============ */
.tasks-list{
  padding:0 16px 20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.task-card{
  background:var(--white);
  border-radius:var(--radius);
  padding:14px;
  box-shadow:var(--shadow-sm);
  border-right:5px solid var(--gray-300);
  position:relative;
  transition:.25s;
  animation:fadeUp .3s ease;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.task-card:active{transform:scale(.99)}
.task-card.p-high{border-right-color:var(--danger);background:linear-gradient(90deg,var(--white) 60%,var(--danger-light) 100%)}
.task-card.p-med{border-right-color:var(--warn);background:linear-gradient(90deg,var(--white) 60%,var(--warn-light) 100%)}
.task-card.p-low{border-right-color:var(--ok);background:linear-gradient(90deg,var(--white) 60%,var(--ok-light) 100%)}
.task-card.is-done{
  opacity:.65;
  border-right-color:var(--emerald-500);
  background:var(--emerald-50);
}
.task-card.is-done .task-name{text-decoration:line-through;color:var(--gray-500)}

.task-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:8px;
}
.task-name{
  font-size:15px;
  font-weight:700;
  color:var(--gray-900);
  line-height:1.3;
  flex:1;
}
.task-badges{
  display:flex;
  gap:4px;
  flex-shrink:0;
}
.mini-badge{
  font-size:10px;
  font-weight:700;
  padding:3px 8px;
  border-radius:8px;
  white-space:nowrap;
}
.mb-high{background:var(--danger);color:#fff}
.mb-med{background:var(--warn);color:#fff}
.mb-low{background:var(--ok);color:#fff}
.mb-done{background:var(--emerald-600);color:#fff}

.task-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px 12px;
  font-size:11.5px;
  color:var(--gray-500);
  margin-bottom:10px;
}
.task-meta span{
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.task-meta svg{width:12px;height:12px}

.task-note{
  background:var(--gray-50);
  border-radius:8px;
  padding:8px 10px;
  font-size:12px;
  color:var(--gray-700);
  margin-bottom:10px;
  border-right:3px solid var(--copper-500);
  line-height:1.5;
}
.task-parts{
  background:var(--copper-100);
  border-radius:8px;
  padding:8px 10px;
  font-size:12px;
  color:var(--copper-700);
  margin-bottom:10px;
  font-weight:600;
}

.task-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.btn{
  border:none;
  border-radius:10px;
  padding:8px 12px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  transition:.2s;
  flex:1;
  min-width:auto;
}
.btn:active{transform:scale(.96)}
.btn svg{width:14px;height:14px}
.btn-done{background:var(--ok);color:#fff}
.btn-undo{background:var(--warn);color:#fff}
.btn-note{background:var(--copper-600);color:#fff}
.btn-print{background:var(--emerald-700);color:#fff}
.btn-del{background:var(--gray-100);color:var(--danger);flex:0 0 auto;padding:8px 10px}

.empty{
  text-align:center;
  padding:50px 20px;
  color:var(--gray-500);
}
.empty-icon{font-size:50px;margin-bottom:12px;opacity:.4}
.empty p{font-size:14px}

/* ============ شريط سفلي ============ */
.bottom-nav{
  position:fixed;
  bottom:0;left:0;right:0;
  background:var(--white);
  box-shadow:0 -4px 20px rgba(0,0,0,.08);
  display:flex;
  justify-content:space-around;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  z-index:50;
  border-top:1px solid var(--gray-200);
}
.nav-item{
  flex:1;
  text-align:center;
  padding:6px 4px;
  cursor:pointer;
  border-radius:12px;
  transition:.2s;
  color:var(--gray-500);
}
.nav-item.active{color:var(--emerald-700);background:var(--emerald-50)}
.nav-item svg{
  width:22px;height:22px;
  display:block;
  margin:0 auto 3px;
}
.nav-item span{font-size:10.5px;font-weight:700}

/* ============ زر عائم ============ */
.fab{
  position:fixed;
  bottom:calc(80px + env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%);
  width:58px;height:58px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--copper-600),var(--copper-500));
  color:#fff;
  border:none;
  box-shadow:0 8px 24px rgba(184,115,51,.4);
  cursor:pointer;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:60;
  transition:.25s;
}
.fab.show{display:flex}
.fab:active{transform:translateX(-50%) scale(.92)}
.fab svg{width:28px;height:28px}

/* ============ النوافذ المنبثقة ============ */
.sheet-bg{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  backdrop-filter:blur(3px);
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet-bg.open{display:flex}
.sheet{
  background:var(--white);
  width:100%;
  max-width:520px;
  border-radius:24px 24px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:92vh;
  overflow-y:auto;
  animation:slideUp .3s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}
.sheet-handle{
  width:42px;height:5px;
  background:var(--gray-300);
  border-radius:3px;
  margin:0 auto 16px;
}
.sheet-title{
  font-size:17px;
  font-weight:800;
  color:var(--emerald-800);
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:8px;
}
.sheet-title svg{width:20px;height:20px}

/* ============ حقول النموذج ============ */
.field{margin-bottom:14px}
.field label{
  display:block;
  font-size:12.5px;
  font-weight:700;
  color:var(--gray-700);
  margin-bottom:6px;
}
.field label .req{color:var(--danger)}
.field input,
.field select,
.field textarea{
  width:100%;
  padding:11px 13px;
  border:1.5px solid var(--gray-200);
  border-radius:11px;
  font-size:14px;
  font-family:inherit;
  background:var(--white);
  color:var(--gray-900);
  transition:.2s;
  outline:none;
}
.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--emerald-600);
  box-shadow:0 0 0 3px rgba(26,155,118,.1);
}
.field textarea{resize:vertical;min-height:70px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============ الأزرار الكبيرة ============ */
.btn-lg{
  width:100%;
  padding:14px;
  border-radius:13px;
  border:none;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  font-family:inherit;
  transition:.2s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn-lg:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--emerald-700),var(--emerald-600));color:#fff;box-shadow:0 6px 16px rgba(13,92,70,.25)}
.btn-copper{background:linear-gradient(135deg,var(--copper-700),var(--copper-500));color:#fff;box-shadow:0 6px 16px rgba(184,115,51,.25)}
.btn-ghost{background:var(--gray-100);color:var(--gray-700)}

/* ============ قائمة المواد ============ */
.material-row{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--gray-50);
  border-radius:11px;
  padding:10px;
  margin-bottom:8px;
  border:1px solid var(--gray-200);
}
.material-row .mat-name{
  flex:1;
  font-size:13px;
  font-weight:600;
  color:var(--gray-900);
}
.material-row .mat-unit{
  font-size:11px;
  color:var(--gray-500);
  background:var(--white);
  padding:3px 8px;
  border-radius:6px;
  border:1px solid var(--gray-200);
}
.material-row input.qty{
  width:60px;
  padding:7px;
  text-align:center;
  border:1.5px solid var(--gray-300);
  border-radius:8px;
  font-size:13px;
  font-weight:700;
  font-family:inherit;
}
.mat-del{
  background:var(--danger-light);
  color:var(--danger);
  border:none;
  width:30px;height:30px;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ============ رسالة Toast ============ */
.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%) translateY(-100px);
  background:var(--emerald-800);
  color:#fff;
  padding:12px 20px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  z-index:200;
  box-shadow:var(--shadow-lg);
  transition:.35s cubic-bezier(.16,1,.3,1);
  max-width:90%;
  text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:linear-gradient(135deg,var(--emerald-700),var(--emerald-600))}
.toast.error{background:linear-gradient(135deg,#991b1b,var(--danger))}
.toast.warn{background:linear-gradient(135deg,#92400e,var(--warn))}

/* ============ صفحة المواد والإعدادات ============ */
.page{
  display:none;
  padding:16px;
  animation:fadeUp .3s;
}
.page.active{display:block}

.section{
  background:var(--white);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--gray-200);
}
.section-title{
  font-size:14px;
  font-weight:800;
  color:var(--emerald-800);
  margin-bottom:12px;
  padding-bottom:10px;
  border-bottom:2px solid var(--emerald-100);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.section-title button{
  background:var(--copper-600);
  color:#fff;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  font-size:11.5px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
}

/* ============ صفحة الطباعة ============ */
.print-page{
  padding:20px;
  background:var(--gray-100);
  min-height:100vh;
}
.print-toolbar{
  display:flex;
  gap:8px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.print-toolbar .btn{flex:1;min-width:130px;padding:12px}

.gov-paper{
  background:#fff;
  width:100%;
  max-width:800px;
  margin:0 auto;
  padding:22mm 18mm 18mm;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
  direction:rtl;
  font-family:'Traditional Arabic','Sakkal Majalla','Amiri','Segoe UI',Tahoma,serif;
  color:#000;
  line-height:1.7;
  position:relative;
}

.gov-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
  position:relative;
  min-height:70px;
}
.gov-eagle{
  position:absolute;
  left:50%;
  top:0;
  transform:translateX(-50%);
  width:64px;
  height:auto;
}
.gov-header-right{
  text-align:right;
  font-size:13px;
  font-weight:700;
  line-height:1.65;
  margin-right:auto;
  padding-right:8px;
}
.gov-header-left{
  text-align:left;
  font-size:13px;
  font-weight:700;
  padding-left:8px;
  padding-top:8px;
}

.gov-date-line{
  text-align:right;
  font-size:13px;
  font-weight:700;
  margin:6px 0 20px;
  padding-right:8px;
}

.gov-salutation{
  text-align:center;
  font-size:16px;
  font-weight:800;
  margin:8px 0 14px;
}

.gov-body{
  font-size:14.5px;
  font-weight:600;
  text-align:justify;
  margin-bottom:18px;
  padding:0 6px;
  line-height:1.9;
}

.gov-table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:22px;
  font-size:13px;
}
.gov-table th,
.gov-table td{
  border:1px solid #000;
  padding:5px 8px;
  text-align:center;
  font-weight:700;
  vertical-align:middle;
}
.gov-table th{
  background:#f3f3f3;
  font-weight:800;
  font-size:12.5px;
}
.gov-table td.mat-name{
  text-align:right;
  padding-right:10px;
}
.gov-table td.mat-qty{
  width:60px;
  font-weight:800;
}

.gov-signatures{
  display:flex;
  justify-content:space-between;
  margin-top:28px;
  padding:0 20px;
  font-size:13.5px;
  font-weight:700;
  text-align:center;
  line-height:1.8;
}
.gov-sign-box{
  flex:1;
  max-width:45%;
}
.gov-sign-box .role{display:block;margin-bottom:2px}
.gov-sign-box .name{font-weight:800;font-size:14px}

.gov-divider{
  border:none;
  border-top:1.5px solid #000;
  margin:22px 0 14px;
}

.gov-sub{
  font-size:13.5px;
  font-weight:800;
  margin:14px 0 6px;
}
.gov-end{
  text-align:center;
  font-size:12px;
  font-weight:700;
  margin-top:35px;
  color:#666;
  border-top:1px dashed #999;
  padding-top:10px;
}

/* ============ الطباعة ============ */
@media print{
  @page{size:A4;margin:15mm}
  body{background:#fff;padding:0}
  .no-print{display:none !important}
  .print-page{background:#fff;padding:0;min-height:auto}
  .gov-paper{
    box-shadow:none;
    padding:0;
    max-width:100%;
    width:100%;
  }
  .gov-eagle{width:56px}
}

/* ============ شاشات أصغر ============ */
@media (max-width:400px){
  .stat-num{font-size:17px}
  .stat-lbl{font-size:9px}
  .header-title h1{font-size:15px}
  .gov-header-right, .gov-header-left{font-size:11px}
  .gov-eagle{width:54px}
}
</style>
</head>
<body>

<!-- ════════ صفحة المهام الرئيسية ════════ -->
<div id="pageHome" class="page active">

  <header class="app-header">
    <div class="header-top">
      <div class="header-title">

<script>
/* ═══════════════════════════════════════════════════════

   المهام + المواد + الإعدادات + الحفظ
   ═══════════════════════════════════════════════════════ */

/* ═══ الحالة العامة ═══ */
const STORAGE_KEYS = {

  MATERIALS: 'mt_materials_v1',
  SETTINGS: 'mt_settings_v1',
  COUNTER: 'mt_counter_v1'

let state = {

  counter: 1,

];

/* ═══ الإعدادات الافتراضية ═══ */
const DEFAULT_SETTINGS = {
  header1: 'مديرية التربية في محافظة دمشق',
  header2: 'دائرة المعلوماتية',
  header3: 'شعبة الصيانة (ورشة الكهرباء)',
  sign1: 'بسام عساف',
  sign2: 'فراس صالح',
  sign3: 'علي العباس'
};

/* ═══════════════════════════════════════════════════════
   التحميل والحفظ
   ═══════════════════════════════════════════════════════ */
function loadState(){
  try{
    state.tasks = JSON.parse(localStorage.getItem(STORAGE_KEYS.TASKS) || '[]');
    state.materials = JSON.parse(localStorage.getItem(STORAGE_KEYS.MATERIALS) || 'null') || DEFAULT_MATERIALS;
    state.settings = JSON.parse(localStorage.getItem(STORAGE_KEYS.SETTINGS) || 'null') || DEFAULT_SETTINGS;
    state.counter = parseInt(localStorage.getItem(STORAGE_KEYS.COUNTER) || '1');
  }catch(e){
    console.error('خطأ تحميل:', e);
    state.tasks = [];
    state.materials = DEFAULT_MATERIALS;
    state.settings = DEFAULT_SETTINGS;
    state.counter = 1;
  }
}

function saveTasks(){
  localStorage.setItem(STORAGE_KEYS.TASKS, JSON.stringify(state.tasks));
}
function saveMaterials(){
  localStorage.setItem(STORAGE_KEYS.MATERIALS, JSON.stringify(state.materials));
}
function saveSettings(){
  localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(state.settings));
}
function saveCounter(){
  localStorage.setItem(STORAGE_KEYS.COUNTER, String(state.counter));
}

/* ═══════════════════════════════════════════════════════
   رسائل Toast
   ═══════════════════════════════════════════════════════ */
let toastTimer = null;
function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

/* ═══════════════════════════════════════════════════════
   التنقل بين الصفحات
   ═══════════════════════════════════════════════════════ */
function switchPage(pageId){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.nav-item[data-page="${pageId}"]`).classList.add('active');
  if(pageId === 'pageMaterials') renderMaterials();
  if(pageId === 'pageSettings') loadSettingsToForm();
  window.scrollTo(0, 0);
}

/* ═══════════════════════════════════════════════════════
   فتح/إغلاق النوافذ (Sheets)
   ═══════════════════════════════════════════════════════ */
function openSheet(id){
  document.getElementById(id).classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSheet(id){
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow = '';
}

/* ═══════════════════════════════════════════════════════
   التاريخ في الرأس
   ═══════════════════════════════════════════════════════ */
function updateHeaderDate(){
  const d = new Date();
  const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  document.getElementById('headerDate').textContent = 
    days[d.getDay()] + ' ' + d.toLocaleDateString('ar-SY');
}

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}/${m}/${day}`;
}

function openTaskSheet(taskId){
  state.editingTaskId = taskId || null;
  const title = document.getElementById('taskSheetTitle');
  const fName = document.getElementById('fName');
  const fBuilding = document.getElementById('fBuilding');
  const fRoom = document.getElementById('fRoom');
  const fType = document.getElementById('fType');
  const fPriority = document.getElementById('fPriority');
  const fArea = document.getElementById('fArea');
  const fContact = document.getElementById('fContact');
  const fNotes = document.getElementById('fNotes');
  
  if(taskId){
    const t = state.tasks.find(x => x.id === taskId);
    if(!t) return;
    title.textContent = '✏️ تعديل المهمة';
    fName.value = t.name || '';
    fBuilding.value = t.building || '';
    fRoom.value = t.room || '';
    fType.value = t.type || 'كشف عطل';
    fPriority.value = t.priority || 'med';
    fArea.value = t.area || 'أخرى';
    fContact.value = t.contact || '';
    fNotes.value = t.notes || '';
  }else{
    title.textContent = '➕ مهمة جديدة';
    fName.value = '';
    fBuilding.value = '';
    fRoom.value = '';
    fType.value = 'كشف عطل';
    fPriority.value = 'med';
    fArea.value = 'المزة - أبو زهير';
    fContact.value = '';
    fNotes.value = '';
  }
  
  openSheet('taskSheetBg');
  setTimeout(() => fName.focus(), 350);
}

function saveTask(){
  const name = document.getElementById('fName').value.trim();
  if(!name){
    showToast('الرجاء إدخال اسم المدرسة', 'error');
    document.getElementById('fName').focus();
    return;
  }
  
  const data = {
    name: name,
    building: document.getElementById('fBuilding').value.trim(),
    room: document.getElementById('fRoom').value.trim(),
    type: document.getElementById('fType').value,
    priority: document.getElementById('fPriority').value,
    area: document.getElementById('fArea').value,
    contact: document.getElementById('fContact').value.trim(),
    notes: document.getElementById('fNotes').value.trim()
  };
  
  if(state.editingTaskId){
    const t = state.tasks.find(x => x.id === state.editingTaskId);
    if(t){
      Object.assign(t, data);
      showToast('✅ تم تحديث المهمة', 'success');
    }
  }else{
    const task = {
      id: Date.now(),
      number: state.counter++,
      ...data,
      materials: [],
      technician: '',
      status: 'pending',
      createdAt: todayISO(),
      doneAt: ''
    };
    state.tasks.unshift(task);
    saveCounter();
    showToast('✅ تمت إضافة المهمة', 'success');
  }
  
  saveTasks();
  closeSheet('taskSheetBg');
  renderTasks();
  updateStats();
}

   ═══════════════════════════════════════════════════════ */
function toggleTaskDone(id){
  const t = state.tasks.find(x => x.id === id);
  if(!t) return;
  if(t.status === 'done'){
    t.status = 'pending';
    t.doneAt = '';
    showToast('↩️ تم إرجاع المهمة', 'warn');
  }else{
    t.status = 'done';
    t.doneAt = todayISO();
    showToast('✅ تم إنجاز المهمة', 'success');
  }
  saveTasks();
  renderTasks();
  updateStats();
  if(document.getElementById('detailSheetBg').classList.contains('open')){
    openDetail(id);
  }
}

function deleteTask(id){
  if(!confirm('هل تريد حذف هذه المهمة نهائياً؟')) return;
  state.tasks = state.tasks.filter(x => x.id !== id);
  saveTasks();
  renderTasks();
  updateStats();
  closeSheet('detailSheetBg');
  showToast('🗑️ تم حذف المهمة', 'warn');
}

function openMaterialsForTask(taskId){
  const t = state.tasks.find(x => x.id === taskId);
  if(!t) return;
  state.currentTaskId = taskId;
  if(!t.materials) t.materials = [];
  
  document.getElementById('fTechnician').value = t.technician || '';
  
  // تعبئة select المواد
  const sel = document.getElementById('matSelect');
  sel.innerHTML = '<option value="">-- اختر مادة --</option>' + 
    state.materials.map(m => `<option value="${m.id}">${escapeHtml(m.name)} (${escapeHtml(m.unit)})</option>`).join('');
  
  renderTaskMaterials();
  closeSheet('detailSheetBg');
  setTimeout(() => openSheet('matSheetBg'), 200);
}

function renderTaskMaterials(){
  const t = state.tasks.find(x => x.id === state.currentTaskId);
  if(!t) return;
  const container = document.getElementById('taskMaterialsList');
  
  if(!t.materials || t.materials.length === 0){
    container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--gray-500);font-size:13px">لا توجد مواد مضافة بعد</div>';
    return;
  }
  
  container.innerHTML = t.materials.map((m, idx) => `
    <div class="material-row">
      <span class="mat-name">${escapeHtml(m.name)}</span>
      <span class="mat-unit">${escapeHtml(m.unit || 'عدد')}</span>
      <input type="number" class="qty" value="${m.qty || 1}" min="1" onchange="updateMatQty(${idx}, this.value)">
      <button class="mat-del" onclick="removeTaskMaterial(${idx})">✕</button>
    </div>
  `).join('');
}

function addMaterialToTask(){
  const sel = document.getElementById('matSelect');
  const matId = sel.value;
  if(!matId) return;
  const mat = state.materials.find(m => m.id === parseInt(matId));
  if(!mat) return;
  
  const t = state.tasks.find(x => x.id === state.currentTaskId);
  if(!t) return;
  if(!t.materials) t.materials = [];
  
  // هل المادة موجودة؟
  const exists = t.materials.find(m => m.name === mat.name);
  if(exists){
    showToast('⚠️ المادة موجودة مسبقاً', 'warn');
    sel.value = '';
    return;
  }
  
  t.materials.push({ name: mat.name, unit: mat.unit, qty: 1 });
  renderTaskMaterials();
  sel.value = '';
  showToast('✅ أُضيفت: ' + mat.name, 'success');
}

function updateMatQty(idx, val){
  const t = state.tasks.find(x => x.id === state.currentTaskId);
  if(!t || !t.materials) return;
  const q = parseInt(val) || 1;
  t.materials[idx].qty = q < 1 ? 1 : q;
}

function removeTaskMaterial(idx){
  const t = state.tasks.find(x => x.id === state.currentTaskId);
  if(!t) return;
  t.materials.splice(idx, 1);
  renderTaskMaterials();
  showToast('🗑️ حُذفت المادة', 'warn');
}

function saveTaskMaterials(){
  const t = state.tasks.find(x => x.id === state.currentTaskId);
  if(!t) return;
  t.technician = document.getElementById('fTechnician').value.trim();
  saveTasks();
  showToast('✅ تم حفظ المواد', 'success');
  closeSheet('matSheetBg');
  setTimeout(() => openDetail(t.id), 200);
}

function printTask(taskId){

  // عدد الصفوف = أكبر عمود
  const rowsCount = Math.max(col1.length, col2.length, 1);
  
  // بناء صفوف الجدول

        <td class="mat-qty">${m1 ? escapeHtml(String(m1.qty || 1)) : ''}</td>
        <td class="mat-name">${m2 ? escapeHtml(m2.name) : ''}</td>

  if(t.building){
    schoolLine = `مدرسة ${escapeHtml(t.name)} / ${escapeHtml(t.building)}`;
  }else{
    schoolLine = `مدرسة ${escapeHtml(t.name)}`;
  }
  
  const roomLine = t.room 
    ? `على قاعة ${escapeHtml(t.room)}` 
    : 'على قاعة ................';
  
  const html = `
    <div class="gov-header">
      <div class="gov-eagle">${EAGLE_SVG}</div>
      <div class="gov-header-right">
        ${escapeHtml(settings.header1 || '')}<br>
        ${escapeHtml(settings.header2 || '')}<br>
        ${escapeHtml(settings.header3 || '')}
      </div>
      <div class="gov-header-left">
        رقم ( ${t.number || ''} )
      </div>
    </div>
    
    <div class="gov-date-line">
      التاريخ: ${escapeHtml(t.createdAt || todayISO())}
    </div>
    
    <div class="gov-salutation">السيد مدير التربية المحترم</div>
    
    <div class="gov-body">
      ــ بعد الكشف في ${schoolLine} ${roomLine} رقم ( ${escapeHtml(t.room || '1')} ) تبين الحاجة للمواد التالية:
    </div>
    
    <table class="gov-table">
      <thead>
        <tr>
          <th>اسم المادة والقياس</th>
          <th style="width:60px">العدد</th>
          <th>اسم المادة والقياس</th>
          <th style="width:60px">العدد</th>
        </tr>
      </thead>
      <tbody>
        ${tableRows}
      </tbody>
    </table>

      <div class="gov-sign-box">
        <span class="role">القائم بالكشف</span>
        <span class="name">الفني ${escapeHtml(t.technician || '.....................')}</span>
      </div>
      <div class="gov-sign-box">
        <span class="role">رئيس شعبة الصيانة</span>
        <span class="name">${escapeHtml(settings.sign2 || '')}</span>
      </div>
    </div>
    
    <div style="text-align:center;font-size:13px;font-weight:700;margin:22px 0 6px">
      يرجى الاطلاع والتوجيه
    </div>
    
    <hr class="gov-divider">
    
    <div style="text-align:right;font-size:13.5px;font-weight:800;padding-right:8px">
      رئيس دائرة المعلوماتية<br>
      ${escapeHtml(settings.sign3 || '')}
    </div>
    
    <hr class="gov-divider" style="margin-top:24px">
    
    <div class="gov-sub" style="text-align:right">
      أقترح السيد معاون مدير التربية لشؤون التعليم المهني والفني:
    </div>
    
    <div style="height:60px"></div>
    
    <hr class="gov-divider">
    
    <div class="gov-sub" style="text-align:right">
      قرار السيد المدير
    </div>
    
    <div style="height:50px"></div>
    
    <div class="gov-end">إنهاء</div>
    
    <div style="text-align:right;font-size:13px;font-weight:800;margin-top:18px;padding-right:8px">
      رئيس ورشة الكهرباء: ${escapeHtml(settings.sign1 || '')}
    </div>
  `;
  
  document.getElementById('govPaper').innerHTML = html;
  document.getElementById('printPage').style.display = 'block';
  document.body.style.overflow = 'hidden';
  document.querySelector('.bottom-nav').style.display = 'none';
  document.querySelector('.fab').style.display = 'none';
}

function closePrint(){
  document.getElementById('printPage').style.display = 'none';
  document.body.style.overflow = '';
  document.querySelector('.bottom-nav').style.display = '';
  if(document.querySelector('.page.active')?.id === 'pageHome'){
    document.querySelector('.fab').style.display = 'flex';
  }
}

/* ═══════════════════════════════════════════════════════
   تحسين: زر العودة في طباعة الجوال
   ═══════════════════════════════════════════════════════ */
window.addEventListener('popstate', () => {
  if(document.getElementById('printPage').style.display === 'block'){
    closePrint();
  }
});

/* ═══════════════════════════════════════════════════════
   اختصار: Ctrl+P من داخل التطبيق
   ═══════════════════════════════════════════════════════ */
document.addEventListener('keydown', (e) => {
  if((e.ctrlKey || e.metaKey) && e.key === 'p'){
    if(document.getElementById('printPage').style.display === 'block'){
      // اترك المتصفح يكمل العملية الطبيعية
      return;
    }
  }
  // اختصار Ctrl+K لفتح مهمة جديدة
  if((e.ctrlKey || e.metaKey) && e.key === 'k'){
    e.preventDefault();
    if(document.querySelector('.page.active')?.id === 'pageHome'){
      openTaskSheet();
    }
  }
});

/* ═══════════════════════════════════════════════════════
   إصلاح: عند تغيير حجم الطباعة
   ═══════════════════════════════════════════════════════ */
window.addEventListener('beforeprint', () => {
  if(document.getElementById('printPage').style.display !== 'block'){
    return;
  }
});

/* ═══════════════════════════════════════════════════════
   إضافة: CSS للشعار داخل القالب
   ═══════════════════════════════════════════════════════ */
(function injectEagleStyles(){
  const style = document.createElement('style');
  style.textContent = `
    .gov-eagle-svg{
      width:100%;
      height:auto;
      display:block;
    }
    .gov-eagle{
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }
    @media print{
      .gov-eagle-svg{
        width:52px;
      }
    }
  `;
  document.head.appendChild(style);
})();

/* ═══════════════════════════════════════════════════════
   تحسين التواريخ في العرض
   ═══════════════════════════════════════════════════════ */
(function fixDatesDisplay(){
  const origRender = window.renderTasks;
  if(typeof origRender === 'function'){
    window.renderTasks = function(){
      origRender.apply(this, arguments);
    };
  }
})();

/* ═══════════════════════════════════════════════════════
   PWA: تفعيل التثبيت على الجوال
   ═══════════════════════════════════════════════════════ */
if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent(`
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {
      e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
    });
  `)).catch(() => {});
}

/* ═══════════════════════════════════════════════════════
   عرض إرشاد التثبيت مرة واحدة
   ═══════════════════════════════════════════════════════ */
(function showInstallHint(){
  const shown = localStorage.getItem('mt_install_hint_shown');
  if(shown) return;
  if(window.matchMedia('(display-mode: standalone)').matches) return;
  if(navigator.standalone === true) return;
  
  setTimeout(() => {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isAndroid = /Android/.test(navigator.userAgent);
    if(!isIOS && !isAndroid) return;
    
    const msg = isIOS 
      ? '💡 لإضافة التطبيق لشاشتك: اضغط زر المشاركة ⎙ ثم "إضافة إلى الشاشة الرئيسية"'
      : '💡 لإضافة التطبيق لشاشتك: اضغط ⋮ ثم "إضافة إلى الشاشة الرئيسية"';
    
    showToast(msg, 'success');
    localStorage.setItem('mt_install_hint_shown', '1');
  }, 4000);
})();

/* ═══════════════════════════════════════════════════════
   إصلاح التوافق: احفظ آخر تبويب
   ═══════════════════════════════════════════════════════ */
(function rememberTab(){
  const saved = localStorage.getItem('mt_current_page');
  if(saved && document.getElementById(saved)){
    setTimeout(() => switchPage(saved), 100);
  }
  const origSwitch = window.switchPage;
  window.switchPage = function(pageId){
    localStorage.setItem('mt_current_page', pageId);
    origSwitch.apply(this, arguments);
  };
})();
