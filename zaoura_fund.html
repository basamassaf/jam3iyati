async function saveDeath() {
  const name = cleanText($('dName').value);
  const date = $('dDate').value;
  const year = Number($('dYear').value);
  const comp = Number($('dComp').value) || 0;
  const recipient = cleanText($('dRecipient').value);
  const notes = cleanText($('dNotes').value);

  if (!name) { toast('اسم المتوفى مطلوب', 'error'); return; }
  if (!date) { toast('التاريخ مطلوب', 'error'); return; }

  const affected = estimateAffected(year);
  const c = getConstants(year);
  const inst = c ? c.deathInstallment : 5000;

  if (!confirm('تسجيل وفاة "' + name + '"؟\nسيُضاف قسط ' + fmtNum(inst) + ' × ' + affected + ' عضو')) return;

  showLoad(true);
  try {
    const death = {
      deceasedName: name, deathDate: date, year: year,
      compensation: comp, recipient: recipient, notes: notes,
      affectedCount: affected, installmentAmount: inst,
      recordedBy: S.currentUser.id, recordedByName: S.currentUser.name,
      createdAt: new Date().toISOString()
    };
    const id = await dbPut('deaths', death);
    death.id = id;
    S.deaths.push(death);

    if (comp > 0) {
      await ledgerAdd({
        fund: 'death', year: year, type: 'compensation',
        debit: comp, ref: 'DEATH-' + id, refId: id,
        description: 'تعويض وفاة ' + name, date: date
      });
    }

    WALLET_CACHE.invalidateAll();
    await logAudit('add', 'death', id, { name: name });
    vibrate(100);
    toast('⚰️ تم التسجيل', 'success', 3000);
    closeSheetAll();
    renderDeaths();
  } catch (e) { toast('خطأ: ' + e.message, 'error'); }
  showLoad(false);
}

async function saveIncome(id) {
  const amount = Number($('iAmount').value);
  if (!amount || amount <= 0) { toast('المبلغ مطلوب', 'error'); return; }
  const fund = $('iFund').value;
  const y = S.currentYear;

  showLoad(true);
  try {
    const obj = {
      fund: fund, category: cleanText($('iCategory').value),
      amount: amount, date: $('iDate').value, year: y,
      notes: cleanText($('iNotes').value),
      recordedByName: S.currentUser.name,
      createdAt: new Date().toISOString()
    };

    let newId;
    if (id) {
      obj.id = id;
      await dbPut('incomes', obj);
      const i = S.incomes.findIndex(x => x.id === id);
      if (i > -1) S.incomes[i] = obj;
      newId = id;
    } else {
      newId = await dbPut('incomes', obj);
      obj.id = newId;
      S.incomes.push(obj);
    }

    await ledgerAdd({
      fund: fund, year: y, type: 'income', credit: amount,
      ref: 'INC-' + newId, refId: newId,
      description: obj.category || 'إيراد', date: obj.date
    });

    toast('✅ تم', 'success', 2000);
    closeSheetAll();
    renderInOut();
  } catch (e) { toast('خطأ', 'error'); }
  showLoad(false);
}

async function deleteIncomeRecord(id) {
  if (!confirm('حذف؟')) return;
  try {
    const oldLedger = S.ledger.filter(l => l.refId === id && l.type === 'income');
    for (const l of oldLedger) {
      await dbDel('ledger', l.id);
      const i = S.ledger.findIndex(x => x.id === l.id);
      if (i > -1) S.ledger.splice(i, 1);
    }
    await dbDel('incomes', id);
    S.incomes = S.incomes.filter(x => x.id !== id);
    toast('🗑️');
    closeSheetAll();
    renderInOut();
  } catch (e) { toast('خطأ', 'error'); }
}

async function saveExpense(id) {
  const desc = cleanText($('eDesc').value);
  const amount = Number($('eAmount').value);
  if (!desc) { toast('الوصف مطلوب', 'error'); return; }
  if (!amount || amount <= 0) { toast('المبلغ مطلوب', 'error'); return; }
  const fund = $('eFund').value;
  const y = S.currentYear;

  showLoad(true);
  try {
    const obj = {
      fund: fund, category: cleanText($('eCategory').value),
      description: desc, amount: amount,
      date: $('eDate').value, year: y,
      recordedByName: S.currentUser.name,
      createdAt: new Date().toISOString()
    };

    let newId;
    if (id) {
      obj.id = id;
      await dbPut('expenses', obj);
      const i = S.expenses.findIndex(x => x.id === id);
      if (i > -1) S.expenses[i] = obj;
      newId = id;
    } else {
      newId = await dbPut('expenses', obj);
      obj.id = newId;
      S.expenses.push(obj);
    }

    await ledgerAdd({
      fund: fund, year: y, type: 'expense', debit: amount,
      ref: 'EXP-' + newId, refId: newId,
      description: desc, date: obj.date
    });

    toast('✅ تم', 'success', 2000);
    closeSheetAll();
    renderInOut();
  } catch (e) { toast('خطأ', 'error'); }
  showLoad(false);
}

async function deleteExpense(id) {
  if (!confirm('حذف؟')) return;
  try {
    const oldLedger = S.ledger.filter(l => l.refId === id && l.type === 'expense');
    for (const l of oldLedger) {
      await dbDel('ledger', l.id);
      const i = S.ledger.findIndex(x => x.id === l.id);
      if (i > -1) S.ledger.splice(i, 1);
    }
    await dbDel('expenses', id);
    S.expenses = S.expenses.filter(x => x.id !== id);
    toast('🗑️');
    closeSheetAll();
    renderInOut();
  } catch (e) { toast('خطأ', 'error'); }
}

async function saveMember(id) {

      code: cleanText($('mCode').value),

      name: name,
      gender: $('mGender').value,

      createdAt: old ? old.createdAt : new Date().toISOString()
    };

    let newId;

  }
  let html = '<div class="list">';
  list.slice(0, 300).forEach(function(m) {
    const st = m.memberStatus || 'نشط';
    const w = computeMemberWallet(m.id);
    const rem = w ? Math.max(0, w.summary.totalBalance) : 0;
    let accent = 'green';
    if (st === 'متوفى') accent = 'red';
    else if (st === 'منسحب') accent = 'gray';
    else if (st === 'متوقف') accent = 'orange';
    else if (rem > 0) accent = 'red';

    html += '<div class="item" onclick="closeSheetAll();setTimeout(function(){openMemberDetail(' + m.id + ')},150)">';

    html += '<div class="sub">' + esc(m.code || '') + ' • ' + esc(m.sector || '') + '</div></div>';
    if (rem > 0) html += '<div style="font-weight:800;color:var(--death);font-size:13px">' + fmtShort(rem) + '</div>';
    html += '</div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function filterAllMembersList() {
  const q = $('allMembersSearch').value;
  const all = window._allMembersList || [];
  let filtered = all;
  if (q) {
    const s = normAr(q);
    filtered = all.filter(m => normAr(m.name + ' ' + (m.code || '') + ' ' + (m.phone || '')).indexOf(s) > -1);
  }
  renderAllMembersList(filtered);
}

function buildAnnualReport(year) {
  const y = year || S.currentYear;
  const assocSummary = getFundSummary('assoc', y);
  const deathSummary = getFundSummary('death', y);
  const donationSummary = getFundSummary('donation', y);
  const assocBalance = getFundBalance('assoc');
  const deathBalance = getFundBalance('death');
  const donationBalance = getFundBalance('donation');
  const deathsThisYear = S.deaths.filter(d => Number(d.year) === y);

  return {
    year: y,
    assoc: { collected: assocSummary.collected, incomes: assocSummary.incomes, expenses: assocSummary.expenses, cumulative: assocBalance.balance },
    death: { collected: deathSummary.collected, incomes: deathSummary.incomes, expenses: deathSummary.expenses, compensations: deathSummary.compensations, cumulative: deathBalance.balance },
    donation: { collected: donationSummary.collected, cumulative: donationBalance.balance },
    deaths: { count: deathsThisYear.length }
  };
}

function getFundSummary(fund, year) {
  const y = year || S.currentYear;
  const payments = S.payments.filter(p => p.fund === fund && Number(p.forYear || p.year) === y);
  const incomes = S.incomes.filter(i => i.fund === fund && Number(i.year) === y);
  const expenses = S.expenses.filter(e => e.fund === fund && Number(e.year) === y);
  const compensations = fund === 'death' ? S.deaths.filter(d => Number(d.year) === y) : [];
  const sum = arr => arr.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  return {
    collected: sum(payments),
    incomes: sum(incomes),
    expenses: sum(expenses),
    compensations: compensations.reduce((s, d) => s + (Number(d.compensation) || 0), 0)
  };
}

function openLateReportSheet() {
  if (!isManager() && !isPresident()) { toast('غير مصرح', 'error'); return; }

    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return null;
    if (!m.assocStartYear && !m.deathStartYear) return null;
    const w = computeMemberWallet(m.id);
    const rem = w ? Math.max(0, w.summary.totalBalance) : 0;
    if (rem <= 0) return null;
    return { member: m, rem: rem };
  }).filter(x => x !== null).sort((a, b) => b.rem - a.rem);

  const total = list.reduce((s, x) => s + x.rem, 0);

function shareLatePayersWA() {
  const list = S.members.map(function(m) {
    const st = m.memberStatus || 'نشط';
    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return null;
    if (!m.assocStartYear && !m.deathStartYear) return null;
    const w = computeMemberWallet(m.id);
    const rem = w ? Math.max(0, w.summary.totalBalance) : 0;
    if (rem <= 0) return null;
    return { name: m.name, sector: m.sector || '', rem: rem };
  }).filter(x => x !== null).sort((a, b) => b.rem - a.rem);

  if (!list.length) { toast('لا يوجد متأخرون', 'success'); return; }
  let txt = '⚠️ *المتأخرون — ' + S.currentYear + '*\nعدد: ' + list.length + '\n\n';
  list.slice(0, 40).forEach(function(p, i) {
    txt += (i + 1) + '. ' + p.name;
    if (p.sector) txt += ' (' + p.sector + ')';
    txt += ' — ' + fmtNum(p.rem) + '\n';
  });
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
}

async function saveUser(id) {
  if (!isManager()) { toast('غير مصرح', 'error'); return; }
  const name = cleanText($('uName').value);
  const pin = $('uPin').value.trim();
  if (!name) { toast('الاسم مطلوب', 'error'); return; }
  if (pin && !/^\d{4}$/.test(pin)) { toast('PIN: 4 أرقام', 'error'); return; }

  const role = $('uRole').value;
  const sector = $('uSector').value;

  try {
    const old = id ? await dbGet('users', id) : null;
    const obj = {
      name: name, phone: cleanPhone($('uPhone').value),
      role: role, sector: sector,
      hasPin: pin ? true : (old ? old.hasPin : false),
      pinHash: pin ? await hashPin(pin) : (old ? old.pinHash : null),
      createdAt: old ? old.createdAt : new Date().toISOString()
    };
    if (id) {
      obj.id = id;
      await dbPut('users', obj);
      const i = S.users.findIndex(x => x.id === id);
      if (i > -1) S.users[i] = obj;
      if (S.currentUser && S.currentUser.id === id) { S.currentUser = obj; S.currentRole = ROLES[role]; }
    } else {
      const newId = await dbPut('users', obj);
      obj.id = newId;
      S.users.push(obj);
    }
    toast('✅ تم', 'success', 2000);
    closeSheetAll();
    go(S.page);
  } catch (e) { toast('خطأ', 'error'); }
}

async function deleteUser(id) {
  if (!isManager()) return;
  const u = S.users.find(x => x.id === id);
  if (!u) return;
  if (u.role === 'manager' && S.users.filter(x => x.role === 'manager').length <= 1) { toast('لا يمكن حذف آخر مدير', 'error'); return; }
  if (!confirm('حذف "' + u.name + '"؟')) return;
  try {
    await dbDel('users', id);
    S.users = S.users.filter(x => x.id !== id);
    toast('🗑️');
    closeSheetAll();
    go(S.page);
  } catch (e) {}
}

function exportBackup() {
  if (!isManager()) return;
  try {
    const data = {
      version: APP_VERSION, date: new Date().toISOString(),
      members: S.members, payments: S.payments, allocations: S.allocations,
      deaths: S.deaths, ledger: S.ledger, deliveries: S.deliveries,
      incomes: S.incomes, expenses: S.expenses, users: S.users,
      constants: S.constants, auditLog: S.auditLog
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'zaoura_backup_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    toast('💾 تم');
  } catch (e) { toast('خطأ', 'error'); }
}

async function importBackup(input) {
  if (!isManager()) return;
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  const text = await file.text();
  try {
    const data = JSON.parse(text);
    if (!data.members && !data.users) throw new Error('ملف غير صالح');
    if (!confirm('استبدال كل البيانات؟')) return;
    if (!confirm('تأكيد أخير!')) return;
    showLoad(true);
    for (const s of STORE_NAMES) await dbClear(s);
    const toRestore = ['members', 'payments', 'allocations', 'deaths', 'ledger', 'deliveries', 'incomes', 'expenses', 'users', 'constants', 'auditLog'];
    for (const key of toRestore) {
      if (Array.isArray(data[key])) {
        for (const item of data[key]) { delete item.id; await dbPut(key, item); }
      }
    }
    await loadAll();
    WALLET_CACHE.invalidateAll();
    toast('✅ تمت الاستعادة');
    closeSheetAll();
    setTimeout(function() { location.reload(); }, 1000);
  } catch (e) { showLoad(false); toast('خطأ: ' + e.message, 'error', 5000); }
}

async function saveChangePin() {
  const o = $('oldPin').value.trim();
  const n = $('newPin').value.trim();
  const n2 = $('newPin2').value.trim();
  if (!/^\d{4}$/.test(o)) { toast('الحالية: 4 أرقام', 'error'); return; }
  if (!/^\d{4}$/.test(n)) { toast('الجديدة: 4 أرقام', 'error'); return; }
  if (n !== n2) { toast('غير متطابقتين', 'error'); return; }
  const u = S.currentUser;
  if (u.pinHash) {
    const ok = await verifyPin(o, u.pinHash);
    if (!ok) { toast('الحالية خطأ', 'error'); return; }
  }
  try {
    u.pinHash = await hashPin(n);
    u.hasPin = true;
    await dbPut('users', u);
    const i = S.users.findIndex(x => x.id === u.id);
    if (i > -1) S.users[i] = u;
    toast('✅ تم');
    closeSheetAll();
  } catch (e) { toast('خطأ', 'error'); }
}

function getDependentsOf(memberId) {
  const member = getMemberById(memberId);
  if (!member || !member.dependentsIds || !member.dependentsIds.length) return [];
  return S.members.filter(m => member.dependentsIds.indexOf(m.id) > -1);
}

function getPayerOf(memberId) {
  const member = getMemberById(memberId);
  if (!member || !member.payerId) return null;
  return getMemberById(member.payerId);
}

function getPayerGroupTotal(payerId) {
  const payer = getMemberById(payerId);
  if (!payer) return null;

  const dependents = getDependentsOf(payerId);
  const all = [payer].concat(dependents);

  let totalDue = 0, totalPaid = 0, totalRem = 0;
  const perMember = [];

  all.forEach(function(m) {
    const w = computeMemberWallet(m.id);
    const due = w ? w.summary.totalDue : 0;
    const paid = w ? w.summary.totalPaid : 0;
    const rem = Math.max(0, due - paid);

    totalDue += due;
    totalPaid += paid;
    totalRem += rem;

    perMember.push({ member: m, due: due, paid: paid, rem: rem, isPayer: m.id === payerId });
  });

  return {
    payer: payer, dependents: dependents, all: all,
    totalDue: totalDue, totalPaid: totalPaid, totalRem: totalRem,
    perMember: perMember
  };
}

async function saveUnifiedPayment(payerId) {
  const amount = Number($('unifiedAmount').value);
  const notes = cleanText($('unifiedNotes').value);
  if (!amount || amount <= 0) { toast('المبلغ مطلوب', 'error'); return; }

  const group = getPayerGroupTotal(payerId);
  if (!group) return;

  showLoad(true);
  try {
    const batchId = 'batch_' + Date.now();
    let remaining = amount;
    let recordedCount = 0;

    const sortedMembers = group.all.slice().sort(function(a, b) {
      const wa = computeMemberWallet(a.id);
      const wb = computeMemberWallet(b.id);
      const ra = wa ? Math.max(0, wa.summary.totalBalance) : 0;
      const rb = wb ? Math.max(0, wb.summary.totalBalance) : 0;
      return rb - ra;
    });

    for (const m of sortedMembers) {
      if (remaining <= 0) break;
      const w = computeMemberWallet(m.id);
      if (!w) continue;
      const memberRem = Math.max(0, w.summary.totalBalance);
      if (memberRem <= 0) continue;
      const toPay = Math.min(remaining, memberRem);

      await recordPayment(m.id, toPay, { notes: notes || 'دفعة موحّدة', preferredFund: 'all' });
      remaining -= toPay;
      recordedCount++;
    }

    vibrate(100);
    toast('✅ تم تسجيل ' + recordedCount + ' دفعة', 'success', 3000);

    if (remaining > 0) {
      setTimeout(function() { toast('💰 رصيد مقدم: ' + fmtNum(remaining) + ' ل.س', 'info', 3500); }, 500);
    }

    closeSheetAll();
    go(S.page);
  } catch (e) {
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
  showLoad(false);
}

/* ═══════════════════════════════════════════════════════════
   📌 الوفيات التفصيلية + تتبع التعويضات

function estimateAffectedMembers(year) {
  return S.members.filter(m =>
    m.deathStartYear && m.deathStartYear <= year &&
    !m.deathExempt && m.memberStatus !== 'متوفى'
  ).length;
}

function getDeathCollectionStatus(deathId) {
  const d = S.deaths.find(x => x.id === deathId);
  if (!d) return null;
  const year = Number(d.year);
  const instAmount = d.installmentAmount || 5000;
  const affected = estimateAffectedMembers(year);

  let totalCollected = 0;
  let membersPaid = 0;
  let membersDue = 0;

  S.members.forEach(function(m) {
    if (m.memberStatus === 'متوفى' && m.deathDate) {
      const dy = parseInt(m.deathDate.substring(0, 4));
      if (dy < year) return;
    }
    if (!m.deathStartYear || m.deathStartYear > year) return;
    if (m.deathExempt) return;
    if (m.memberStatus === 'معفى') return;

    const w = computeMemberWallet(m.id);
    if (!w) return;

    const yearData = w.funds.death.years[year];
    if (!yearData) return;

    const yearDue = yearData.due;
    const yearPaid = yearData.paid;
    if (yearDue > 0 && yearPaid >= yearDue) { membersPaid++; }
    else if (yearDue > 0 && yearPaid < yearDue) { membersDue++; }

    const deathsInYear = S.deaths.filter(x => Number(x.year) === year).sort((a, b) =>
      (a.deathDate || '').localeCompare(b.deathDate || '')
    );
    const deathIndex = deathsInYear.findIndex(x => x.id === deathId);
    if (deathIndex < 0) return;

    if (yearPaid <= 0) return;

    let remaining = yearPaid;
    for (let i = 0; i < deathsInYear.length; i++) {
      if (remaining <= 0) break;
      const take = Math.min(remaining, instAmount);
      if (i === deathIndex) { totalCollected += take; }
      remaining -= take;
    }
  });

  return {
    death: d,
    year: year,
    installment: instAmount,
    affectedCount: affected,
    expectedTotal: affected * instAmount,
    collected: totalCollected,
    remaining: (affected * instAmount) - totalCollected,
    compensation: Number(d.compensation) || 0,
    netImpact: totalCollected - (Number(d.compensation) || 0),
    membersPaid: membersPaid,
    membersDue: membersDue
  };
}

function openDeathMembersList(deathId) {
  const d = S.deaths.find(x => x.id === deathId);
  if (!d) return;
  const year = Number(d.year);

  const list = S.members.filter(function(m) {
    if (m.memberStatus === 'متوفى' && m.deathDate) {
      const dy = parseInt(m.deathDate.substring(0, 4));
      if (dy < year) return false;
    }
    if (!m.deathStartYear || m.deathStartYear > year) return false;
    if (m.deathExempt) return false;
    if (m.memberStatus === 'معفى') return false;
    return true;
  }).map(function(m) {
    const w = computeMemberWallet(m.id);
    const yearData = (w && w.funds.death.years[year]) || { due: 0, paid: 0 };
    const paid = yearData.paid;
    const due = yearData.due;
    const remaining = Math.max(0, due - paid);

    const deathsInYear = S.deaths.filter(x => Number(x.year) === year).sort((a, b) =>
      (a.deathDate || '').localeCompare(b.deathDate || '')
    );
    const deathIndex = deathsInYear.findIndex(x => x.id === deathId);
    const instAmount = d.installmentAmount || 5000;

    let paidForThisDeath = 0;
    if (paid > 0 && deathIndex >= 0) {
      let rem = paid;
      for (let i = 0; i < deathsInYear.length; i++) {
        if (rem <= 0) break;
        const take = Math.min(rem, instAmount);
        if (i === deathIndex) paidForThisDeath = take;
        rem -= take;
      }
    }

    return {
      member: m,
      paidForThis: paidForThisDeath,
      remainingForThis: instAmount - paidForThisDeath,
      isPaid: paidForThisDeath >= instAmount
    };
  });

  list.sort((a, b) => {
    if (a.isPaid !== b.isPaid) return a.isPaid ? 1 : -1;
    return String(a.member.name).localeCompare(String(b.member.name), 'ar');
  });

  const paidCount = list.filter(x => x.isPaid).length;
  const unpaidCount = list.length - paidCount;

  let html = '';
  html += '<div style="padding:14px;background:var(--death-soft);border-radius:12px;margin-bottom:14px;text-align:center">';
  html += '<div style="font-weight:800;font-size:15px">' + esc(d.deceasedName) + '</div>';
  html += '<div style="font-size:12px;color:var(--muted);margin-top:4px">' + d.year + ' — ' + fmtNum(d.installmentAmount || 5000) + ' ل.س/عضو</div></div>';

  html += '<div class="stats-scroll">';
  html += '<div class="stat green"><div class="val">' + paidCount + '</div><div class="lbl">✅ سدّدوا</div></div>';
  html += '<div class="stat red"><div class="val">' + unpaidCount + '</div><div class="lbl">⏳ لم يسدّدوا</div></div>';
  html += '<div class="stat"><div class="val">' + list.length + '</div><div class="lbl">📊 الإجمالي</div></div>';
  html += '</div>';

  const filterUnpaid = window._deathFilterUnpaid === deathId;
  if (filterUnpaid) html += '<div style="text-align:center;margin-bottom:10px"><span class="badge danger">عرض غير المسدَّدين</span></div>';

  const displayList = filterUnpaid ? list.filter(x => !x.isPaid) : list;

  html += '<div class="list">';
  displayList.slice(0, 300).forEach(function(x) {
    const m = x.member;
    html += '<div class="item" onclick="closeSheet();setTimeout(function(){openMemberDetail(' + m.id + ')},150)">';
    html += '<div class="av ' + (x.isPaid ? 'green' : 'red') + '">' + (x.isPaid ? '✅' : '⏳') + '</div>';
    html += '<div class="body"><div class="ttl">' + esc(m.name) + '</div>';
    html += '<div class="sub">' + esc(m.code || '') + ' • ' + esc(m.sector || '') + '</div></div>';
    html += '<div style="text-align:left">';
    if (x.isPaid) html += '<div style="color:var(--success);font-weight:800;font-size:13px">' + fmtNum(x.paidForThis) + '</div>';
    else html += '<div style="color:var(--death);font-weight:800;font-size:13px">' + fmtNum(x.remainingForThis) + '</div>';
    html += '</div></div>';
  });
  html += '</div>';

  let foot = '';
  if (filterUnpaid) foot += '<button class="btn ghost sm" onclick="window._deathFilterUnpaid=null;closeSheet();setTimeout(function(){openDeathMembersList(' + deathId + ')},150)">الكل</button>';
  else if (unpaidCount > 0) foot += '<button class="btn danger sm" onclick="window._deathFilterUnpaid=' + deathId + ';closeSheet();setTimeout(function(){openDeathMembersList(' + deathId + ')},150)">غير المسدَّدين (' + unpaidCount + ')</button>';
  foot += '<button class="btn ghost" onclick="closeSheet();setTimeout(function(){openDeathDetailAdvanced(' + deathId + ')},150)">رجوع</button>';

  openSheet('👥 مشتركو الوفاة', html, foot, { wide: true });
}

async function deleteDeathConfirmed(id) {
  const d = S.deaths.find(x => x.id === id);
  if (!d) return;
  if (!confirm('⚠️ حذف وفاة "' + d.deceasedName + '"؟')) return;
  if (!confirm('تأكيد أخير!')) return;

  try {
    const oldLedger = S.ledger.filter(l => l.refId === id && l.type === 'compensation');
    for (const l of oldLedger) {
      await dbDel('ledger', l.id);
      const i = S.ledger.findIndex(x => x.id === l.id);
      if (i > -1) S.ledger.splice(i, 1);
    }
    await dbDel('deaths', id);
    S.deaths = S.deaths.filter(x => x.id !== id);
    WALLET_CACHE.invalidateAll();
    await logAudit('delete', 'death', id, { name: d.deceasedName });
    toast('🗑️ تم الحذف', 'success', 2500);
    closeSheetAll();
    renderDeaths();
  } catch (e) { toast('خطأ', 'error'); }
}

function getDeathsStats(year) {
  const y = year || S.currentYear;
  const yearDeaths = S.deaths.filter(d => Number(d.year) === y);

  const totalCompensation = yearDeaths.reduce((s, d) => s + (Number(d.compensation) || 0), 0);
  const totalInstallments = yearDeaths.reduce((s, d) => {
    const affected = d.affectedCount || estimateAffectedMembers(d.year);
    const inst = d.installmentAmount || 5000;
    return s + (affected * inst);
  }, 0);

  return {
    year: y,
    count: yearDeaths.length,
    totalCompensation: totalCompensation,
    totalInstallments: totalInstallments,
    netImpact: totalInstallments - totalCompensation
  };
}

S.filters.collectExtra = 'all';

function computeCollectCountsAdvanced() {
  const role = S.currentRole;
  const user = S.currentUser;
  const mySector = user.sector;
  const isManager = role.key === 'manager' || role.key === 'president';
  const sectorFilter = isManager ? S.filters.collectSector : mySector;

  let all = 0, late = 0, paid = 0, newC = 0, fees = 0;
  let paidByMe = 0, paidByOthers = 0, neverPaid = 0;

  const myPayments = S.payments.filter(p => p.collectorId === user.id);
  const myPaidIds = new Set(myPayments.map(p => p.memberId));
  const allPaidIds = new Set(S.payments.map(p => p.memberId).filter(x => x));

  S.members.forEach(function(m) {
    const st = m.memberStatus || 'نشط';
    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return;
    if (!m.assocStartYear && !m.deathStartYear) return;

    if (isManager) {
      if (sectorFilter && sectorFilter !== 'all' && m.sector !== sectorFilter) return;
    } else if (mySector && m.sector !== mySector) return;

    all++;

    const w = computeMemberWallet(m.id);
    if (w) {
      const rem = w.summary.totalBalance;
      if (rem > 0) late++;
      else if (rem <= 0 && w.summary.totalPaid > 0) paid++;
    }

    if (m.assocStartYear === S.currentYear || m.deathStartYear === S.currentYear) newC++;

    const aY = (w && m.assocStartYear) ? w.funds.assoc.years[m.assocStartYear] : null;
    const dY = (w && m.deathStartYear) ? w.funds.death.years[m.deathStartYear] : null;
    if ((aY && aY.paid < aY.due) || (dY && dY.paid < dY.due)) fees++;

    if (myPaidIds.has(m.id)) paidByMe++;
    else if (allPaidIds.has(m.id)) paidByOthers++;

    if (!allPaidIds.has(m.id)) neverPaid++;
  });

  return { all, late, paid, new: newC, fees, paidByMe, paidByOthers, neverPaid };
}

function renderCollectListAdvanced() {
  const role = S.currentRole;
  const user = S.currentUser;
  const mySector = user.sector;
  const isManager = role.key === 'manager' || role.key === 'president';
  const filter = S.filters.collect;
  const extra = S.filters.collectExtra || 'all';
  const sectorFilter = isManager ? S.filters.collectSector : (S.filters.collectSector === 'mysector' ? mySector : null);

  let list = S.members.filter(function(m) {
    const st = m.memberStatus || 'نشط';
    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return false;
    if (!m.assocStartYear && !m.deathStartYear) return false;

    if (isManager) {
      if (sectorFilter && sectorFilter !== 'all' && m.sector !== sectorFilter) return false;
    } else if (mySector && S.filters.collectSector !== 'all') {
      if (m.sector !== mySector) return false;
    }
    return true;
  });

  /* الفلتر الأساسي */
  if (filter === 'late') {
    list = list.filter(function(m) {
      const w = computeMemberWallet(m.id);
      return w && w.summary.totalBalance > 0;
    });
  } else if (filter === 'paid') {
    list = list.filter(function(m) {
      const w = computeMemberWallet(m.id);
      return w && w.summary.totalBalance <= 0 && w.summary.totalPaid > 0;
    });
  } else if (filter === 'new') {
    list = list.filter(m => m.assocStartYear === S.currentYear || m.deathStartYear === S.currentYear);
  } else if (filter === 'fees') {
    list = list.filter(function(m) {
      const w = computeMemberWallet(m.id);
      if (!w) return false;
      const aY = m.assocStartYear ? w.funds.assoc.years[m.assocStartYear] : null;
      const dY = m.deathStartYear ? w.funds.death.years[m.deathStartYear] : null;
      return (aY && aY.paid < aY.due) || (dY && dY.paid < dY.due);
    });
  }

  /* الفلتر المتقدم */
  if (extra === 'paidByMe') {
    const myPaidIds = new Set(S.payments.filter(p => p.collectorId === user.id).map(p => p.memberId));
    list = list.filter(m => myPaidIds.has(m.id));
  } else if (extra === 'paidByOthers') {
    const allPaidIds = new Set(S.payments.map(p => p.memberId).filter(x => x));
    const myPaidIds = new Set(S.payments.filter(p => p.collectorId === user.id).map(p => p.memberId));
    list = list.filter(m => allPaidIds.has(m.id) && !myPaidIds.has(m.id));
  } else if (extra === 'neverPaid') {
    const allPaidIds = new Set(S.payments.map(p => p.memberId).filter(x => x));
    list = list.filter(m => !allPaidIds.has(m.id));
  }

  /* البحث */
  if (S.search) {
    const s = normAr(S.search);
    list = list.filter(m => normAr(m.name + ' ' + (m.code || '') + ' ' + (m.phone || '')).indexOf(s) > -1);
  }

  /* الترتيب */
  list.sort(function(a, b) {
    const wa = computeMemberWallet(a.id);
    const wb = computeMemberWallet(b.id);
    const ra = wa ? Math.max(0, wa.summary.totalBalance) : 0;
    const rb = wb ? Math.max(0, wb.summary.totalBalance) : 0;
    if (ra !== rb) return rb - ra;
    return String(a.name).localeCompare(String(b.name), 'ar');
  });

  const el = $('collectListContent');
  if (!el) return;

  if (!list.length) {
    el.innerHTML = '<div class="empty"><span class="ico">👥</span><h3>لا يوجد أعضاء</h3><p>جرّب فلاتر أخرى</p></div>';
    return;
  }

  el.innerHTML = '<div style="font-size:11px;color:var(--muted-2);font-weight:700;margin-bottom:6px;padding:0 4px">📊 ' + list.length + ' عضو</div>' +
    '<div class="list">' + list.slice(0, 100).map(renderCollectMemberRowAdvanced).join('') + '</div>' +
    (list.length > 100 ? '<div style="text-align:center;padding:14px;color:var(--muted);font-size:12px">و ' + (list.length - 100) + ' عضو — استخدم البحث</div>' : '');
}

function renderCollectMemberRowAdvanced(m) {
  const w = computeMemberWallet(m.id);
  const remA = w ? Math.max(0, w.funds.assoc.balance) : 0;
  const remD = w ? Math.max(0, w.funds.death.balance) : 0;

  const lastPayment = S.payments
    .filter(p => p.memberId === m.id)
    .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''))[0];

  const subs = [];

  if (m.deathStartYear) subs.push('⚰️');

  html += '<div style="font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.name) + '</div>';
  html += '<div style="font-size:10px;color:var(--muted-2);margin-top:2px;font-family:\'SF Mono\',monospace">' + esc(m.code || '') + ' • ' + esc(m.sector || '') + '</div>';

  if (lastPayment) {
    html += '<div style="font-size:10px;color:' + (isMine ? 'var(--success)' : 'var(--primary)') + ';margin-top:4px">';
    html += isMine ? '✅' : '🔄';

    if (!isMine && lastPayment.collectorName) html += ' عند ' + esc(lastPayment.collectorName);

    html += '<div style="font-size:10px;color:var(--death);margin-top:4px;font-weight:700">⚠️ لم يدفع بعد</div>';
  }

  html += '</div>';
  html += '<div style="text-align:left;flex-shrink:0;min-width:80px">';
  if (isLate) {
    html += '<div style="font-weight:800;color:var(--death);font-family:\'SF Mono\',monospace;font-size:14px">' + fmtNum(totalRem) + '</div>';
    if (remD > 0) html += '<div style="font-size:9px;color:var(--death);margin-top:1px">⚰️ ' + fmtShort(remD) + '</div>';

  } else {
    html += '<div style="color:var(--success);font-size:20px">✓</div>';
  }
  html += '</div></div>';

  return html;
}

function getUniqueCollectors() {
  const collectors = new Map();
  S.users.forEach(function(u) {
    const role = ROLES[u.role];
    if (role && role.canCollect) {
      collectors.set('id:' + u.id, { key: 'id:' + u.id, name: u.name, userId: u.id });
    }
  });
  S.payments.forEach(function(p) {
    if (!p.collectorId && p.collectorName) {
      const key = 'name:' + normAr(p.collectorName);
      if (!collectors.has(key)) {
        collectors.set(key, { key: key, name: p.collectorName, userId: null });
      }
    }
  });
  return Array.from(collectors.values()).sort((a, b) => String(a.name).localeCompare(String(b.name), 'ar'));
}

function gv(row) {
  if (!row) return '';
  const aliases = Array.prototype.slice.call(arguments, 1);
  const normalized = {};
  for (const k of Object.keys(row)) {
    normalized[normAr(k).replace(/[^\u0621-\u064Aa-z0-9]/g, '')] = row[k];
  }
  for (const a of aliases) {
    const key = normAr(a).replace(/[^\u0621-\u064Aa-z0-9]/g, '');
    if (key in normalized) {
      const v = normalized[key];
      if (v === null || v === undefined) continue;
      const s = String(v).trim();
      if (!s || s.indexOf('=') === 0 || s.indexOf('openpyxl') > -1) continue;
      return s;
    }
  }
  return '';
}

async function importMembers(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  const dryRun = $('membersDryRun') ? $('membersDryRun').checked : false;

  showLoad(true);
  const log = $('importMembersLog');
  log.innerHTML = '<div style="color:var(--muted)">⏳ جاري القراءة...</div>';

  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });

    if (!rows.length) {
      log.innerHTML = '<div style="color:var(--danger)">❌ الملف فارغ</div>';
      showLoad(false);
      return;
    }

    const existingByCode = new Map();
    const existingByName = new Map();
    S.members.forEach(function(m) {
      if (m.code) existingByCode.set(String(m.code).trim(), m);
      if (m.name) existingByName.set(normAr(m.name), m);
    });

    let added = 0, updated = 0, skipped = 0;
    const tc = { both: 0, assoc: 0, death: 0, none: 0 };

    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      const name = cleanText(gv(r, 'الاسم الثلاثي', 'الاسم_الثلاثي', 'الاسم'));
      if (!name) { skipped++; continue; }

      const code = cleanText(gv(r, 'رقم الفرد', 'رقم_الفرد', 'الكود'));
      const subDate = toDate(gv(r, 'تاريخ الاشتراك', 'تاريخ_الاشتراك'));
      const subYear = subDate ? new Date(subDate).getFullYear() : null;

      const subTypeRaw = gv(r, 'نوع الاشتراك', 'نوع_الاشتراك');
      const subType = normAr(subTypeRaw || '');
      const subTypeDefined = subType.length > 0;

      const hasAssocWord = /جمعي/.test(subType);
      const hasDeathWord = /وفا/.test(subType);
      const isBoth = subType.indexOf('كلاهما') > -1 || (hasAssocWord && hasDeathWord);
      const isNone = subType.indexOf('غير') > -1 && subType.indexOf('مشترك') > -1;

      let hasAssoc = false, hasDeath = false;
      if (isNone) { tc.none++; }
      else if (isBoth) { hasAssoc = true; hasDeath = true; tc.both++; }
      else if (hasAssocWord) { hasAssoc = true; tc.assoc++; }
      else if (hasDeathWord) { hasDeath = true; tc.death++; }

      const memberTypeStr = normAr(gv(r, 'نوع العضو', 'نوع_العضو') || '');
      const memberType = memberTypeStr.indexOf('مخفض') > -1 ? 'مخفض' : 'عادي';

      const statusRaw = cleanText(gv(r, 'حالة العضو', 'الحالة'));
      let memberStatus = 'نشط';
      const stN = normAr(statusRaw);
      if (stN.indexOf('منسحب') > -1) memberStatus = 'منسحب';
      else if (stN.indexOf('متوقف') > -1) memberStatus = 'متوقف';
      else if (stN.indexOf('معف') > -1) memberStatus = 'معفى';
      else if (stN.indexOf('متوف') > -1) memberStatus = 'متوفى';

      const statusDate = toDate(gv(r, 'تاريخ الحالة', 'تاريخ_الحالة'));

      let found = null;
      if (code && existingByCode.has(String(code).trim())) found = existingByCode.get(String(code).trim());
      else if (existingByName.has(normAr(name))) found = existingByName.get(normAr(name));

      if (found) {
        let changed = false;
        if (subTypeDefined && subYear) {
          const newAssoc = hasAssoc ? subYear : null;
          const newDeath = hasDeath ? subYear : null;
          if (found.assocStartYear !== newAssoc) { found.assocStartYear = newAssoc; changed = true; }
          if (found.deathStartYear !== newDeath) { found.deathStartYear = newDeath; changed = true; }
        }
        if (memberStatus && found.memberStatus !== memberStatus) { found.memberStatus = memberStatus; changed = true; }

        if (changed) {
          found.updatedAt = new Date().toISOString();
          if (!dryRun) await dbPut('members', found);
          updated++;
        } else skipped++;
        continue;
      }

      try {
        const member = {
          code: code, name: name,
          familyCode: cleanText(gv(r, 'كود الأسرة', 'كود_الأسرة')),
          gender: gv(r, 'الجنس') || 'ذكر',
          status: gv(r, 'الحياة') || 'حي',
          relation: gv(r, 'صلة القرابة', 'صلة_القرابة') || 'رب أسرة',
          birth: toDate(gv(r, 'تاريخ الميلاد', 'تاريخ_الميلاد')),
          sector: cleanText(gv(r, 'القطاع')),
          phone: cleanPhone(gv(r, 'الجوال', 'الهاتف')),
          assocStartYear: hasAssoc ? subYear : null,
          deathStartYear: hasDeath ? subYear : null,
          memberType: memberType,
          memberStatus: memberStatus,
          stopYear: (memberStatus === 'منسحب' || memberStatus === 'متوقف') ? (statusDate ? new Date(statusDate).getFullYear() : null) : null,
          deathDate: memberStatus === 'متوفى' ? (statusDate || '') : '',
          assocExempt: memberStatus === 'معفى',
          deathExempt: memberStatus === 'معفى',
          dependentsIds: [],
          notes: cleanText(gv(r, 'ملاحظات')),
          createdAt: new Date().toISOString()
        };
        if (!dryRun) {
          const newId = await dbPut('members', member);
          member.id = newId;
          S.members.push(member);
          if (code) existingByCode.set(String(code).trim(), member);
          existingByName.set(normAr(name), member);
        }
        added++;
      } catch (e) { skipped++; }
    }

    log.innerHTML = '<div style="padding:12px;background:var(--donation-soft);border-radius:12px;color:#166534">' +
      '<div style="font-weight:800;margin-bottom:6px">📊 النتيجة ' + (dryRun ? '(تجربة)' : '') + '</div>' +
      '<div>➕ أُضيف: <b>' + added + '</b> | ✏️ حُدّث: <b>' + updated + '</b> | ⏭️ تُخطّي: <b>' + skipped + '</b></div>' +
      '<div style="margin-top:6px;font-size:11px">✅ كليهما: ' + tc.both + ' • 💰 جمعية: ' + tc.assoc + ' • ⚰️ وفاة: ' + tc.death + ' • ❌ لا شيء: ' + tc.none + '</div>' +
      '</div>';

    toast(dryRun ? '🧪 تجربة: ' + added + ' + ' + updated : '✅ أُضيف ' + added + ' | حُدّث ' + updated, 'success', 4000);
    if (!dryRun) {
      WALLET_CACHE.invalidateAll();
      await loadAll();
      go(S.page);
    }
  } catch (e) {
    log.innerHTML = '<div style="color:var(--danger)">❌ ' + esc(e.message) + '</div>';
  }
  showLoad(false);
}

async function importPayments(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  const dryRun = $('paymentsDryRun') ? $('paymentsDryRun').checked : false;

  showLoad(true);
  const log = $('importPayLog');
  log.innerHTML = '<div style="color:var(--muted)">⏳</div>';

  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });

    const memberByCode = new Map();
    const memberByName = new Map();
    S.members.forEach(function(m) {
      if (m.code) memberByCode.set(String(m.code), m);
      if (m.name) memberByName.set(normAr(m.name), m);
    });

    let added = 0, skip = 0, notFound = 0, dup = 0;
    const notFoundNames = [];

    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      const memberName = cleanText(gv(r, 'اسم المشترك', 'اسم العضو', 'العضو', 'المشترك'));
      if (!memberName) { skip++; continue; }

      const amountStr = String(gv(r, 'المبلغ', 'القيمة') || '').replace(/[,،\s]/g, '');
      const amount = Number(amountStr);
      if (!amount) { skip++; continue; }

      let member = memberByCode.get(memberName) || memberByName.get(normAr(memberName));
      if (!member) {
        const s = normAr(memberName);
        member = S.members.find(m => {
          const n = normAr(m.name);
          return n === s || n.indexOf(s) > -1 || s.indexOf(n) > -1;
        });
      }
      if (!member) {
        notFound++;
        if (notFoundNames.length < 10) notFoundNames.push(memberName);
        skip++;
        continue;
      }

      const typeStr = normAr(gv(r, 'نوع القسط', 'النوع', 'الصندوق') || '');
      let fund = 'assoc';
      if (/وفا/.test(typeStr)) fund = 'death';
      else if (/تبرع|صدقه/.test(typeStr)) fund = 'donation';

      const date = toDate(gv(r, 'التاريخ')) || today();
      const yearStr = String(gv(r, 'السنة', 'سنة') || '').replace(/[^\d]/g, '');
      const forYear = Number(yearStr) || (date ? new Date(date).getFullYear() : S.currentYear);

      const isDup = S.payments.some(p =>
        p.memberId === member.id &&
        Number(p.amount) === amount &&
        p.date === date &&
        p.fund === fund
      );
      if (isDup) { dup++; skip++; continue; }

      if (!dryRun) {
        try {
          await recordPayment(member.id, amount, {
            notes: 'استيراد — ' + (cleanText(gv(r, 'اسم المعتمد', 'المعتمد')) || 'مستورد'),
            date: date,
            preferredFund: fund
          });
          added++;
        } catch (e) { skip++; }
      } else added++;
    }

    const nfHTML = notFoundNames.length
      ? '<div style="margin-top:8px;padding:8px;background:var(--death-soft);border-radius:8px;color:#991b1b;font-size:11px;max-height:120px;overflow:auto"><b>أسماء غير موجودة:</b><br>' + notFoundNames.map(n => '• ' + esc(n)).join('<br>') + '</div>'
      : '';

    log.innerHTML = '<div style="padding:12px;background:var(--donation-soft);border-radius:12px;color:#166534">' +
      '<div>➕ أُضيفت: <b>' + added + '</b></div>' +
      '<div style="color:#92400e">🔁 مكرر: <b>' + dup + '</b></div>' +
      '<div>⏭️ تُخطّي: <b>' + skip + '</b></div>' +
      (notFound > 0 ? '<div style="color:#b91c1c">❓ غير موجود: <b>' + notFound + '</b></div>' : '') +
      nfHTML + '</div>';

    toast(dryRun ? '🧪 تجربة: ' + added : '✅ أُضيفت ' + added, 'success', 4000);
    if (!dryRun) {
      WALLET_CACHE.invalidateAll();
      await loadAll();
      go(S.page);
    }
  } catch (e) {
    log.innerHTML = '<div style="color:var(--danger)">❌ ' + esc(e.message) + '</div>';
  }
  showLoad(false);
}

    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      const name = cleanText(gv(r, 'اسم المتوفى', 'الاسم', 'المتوفى'));
      if (!name) { skip++; continue; }

      const date = toDate(gv(r, 'تاريخ الوفاة', 'التاريخ')) || today();
      const yearStr = String(gv(r, 'السنة', 'سنة') || '').replace(/[^\d]/g, '');
      const year = Number(yearStr) || new Date(date).getFullYear();

      const compStr = String(gv(r, 'التعويض', 'قيمة التعويض') || '').replace(/[,،\s]/g, '');
      const comp = compStr ? Number(compStr) : 0;

      const recipient = cleanText(gv(r, 'مَن استلم', 'المستلم')) || '';

      const isDup = S.deaths.some(d =>
        normAr(d.deceasedName) === normAr(name) && Number(d.year) === year
      );
      if (isDup) { dup++; skip++; continue; }

      try {
        const affected = estimateAffectedMembers(year);
        const c = getConstants(year);
        const inst = c ? c.deathInstallment : 5000;

        const death = {
          deceasedName: name,
          deathDate: date,
          year: year,
          compensation: comp,
          recipient: recipient,
          notes: cleanText(gv(r, 'ملاحظات')),
          affectedCount: affected,
          installmentAmount: inst,
          recordedByName: S.currentUser.name + ' (استيراد)',
          imported: true,
          createdAt: new Date().toISOString()
        };

        if (!dryRun) {
          const newId = await dbPut('deaths', death);
          death.id = newId;
          S.deaths.push(death);

          if (comp > 0) {
            await ledgerAdd({
              fund: 'death',
              year: year,
              type: 'compensation',
              debit: comp,
              ref: 'DEATH-' + newId,
              refId: newId,
              description: 'تعويض وفاة ' + name + ' (استيراد)',
              date: date
            });
          }
        }
        added++;
      } catch (e) { skip++; }
    }

    log.innerHTML = '<div style="padding:12px;background:var(--donation-soft);border-radius:12px;color:#166534">' +
      '<div>➕ أُضيف: <b>' + added + '</b></div>' +
      '<div style="color:#92400e">🔁 مكرر: <b>' + dup + '</b></div>' +
      '<div>⏭️ تُخطّي: <b>' + skip + '</b></div></div>';

    toast(dryRun ? '🧪 تجربة: ' + added : '✅ أُضيفت ' + added, 'success', 4000);
    if (!dryRun) {
      WALLET_CACHE.invalidateAll();
      await loadAll();
      go(S.page);
    }
  } catch (e) {
    log.innerHTML = '<div style="color:var(--danger)">❌ ' + esc(e.message) + '</div>';
  }
  showLoad(false);
}

function getFundLedgerEntries(fund, limit) {
  limit = limit || 200;
  return S.ledger
    .filter(l => l.fund === fund)
    .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''))
    .slice(0, limit);
}

function getFundYearsBreakdown(fund) {
  const years = {};
  S.ledger.filter(l => l.fund === fund).forEach(function(l) {
    const y = Number(l.year);
    if (!y) return;
    if (!years[y]) years[y] = { credit: 0, debit: 0, net: 0, count: 0 };
    years[y].credit += Number(l.credit) || 0;
    years[y].debit += Number(l.debit) || 0;
    years[y].net = years[y].credit - years[y].debit;
    years[y].count++;
  });
  return years;
}

function getRecentActivity(hours) {
  hours = hours || 24;
  const cutoff = new Date(Date.now() - hours * 60 * 60 * 1000).toISOString();
  const activities = [];

  S.payments.filter(p => (p.createdAt || '') >= cutoff).forEach(function(p) {
    const m = getMemberById(p.memberId);
    if (m) activities.push({
      type: 'payment',
      icon: '💰',
      color: 'success',
      title: 'دفعة من ' + m.name,
      desc: fmtNum(p.amount) + ' ل.س — ' + (p.collectorName || ''),
      time: p.createdAt,
      ts: p.createdAt
    });
  });

  S.deliveries.filter(d => (d.createdAt || '') >= cutoff).forEach(function(d) {
    activities.push({
      type: 'delivery',
      icon: d.receivedAt ? '✅' : d.rejectedAt ? '❌' : '📤',
      color: d.receivedAt ? 'success' : d.rejectedAt ? 'danger' : 'warning',
      title: d.fromUserName + ' → ' + (d.toUserName || 'أمين'),
      desc: fmtNum(d.amount) + ' ل.س — ' + (FUNDS[d.fund] || {}).name,
      time: d.createdAt,
      ts: d.createdAt
    });
  });

  S.deaths.filter(d => (d.createdAt || '') >= cutoff).forEach(function(d) {
    activities.push({
      type: 'death',
      icon: '⚰️',
      color: 'danger',
      title: 'وفاة: ' + d.deceasedName,
      desc: (d.compensation ? fmtNum(d.compensation) + ' ل.س' : 'بدون تعويض'),
      time: d.createdAt,
      ts: d.createdAt
    });
  });

  S.members.filter(m => (m.createdAt || '') >= cutoff).forEach(function(m) {
    activities.push({
      type: 'member',
      icon: '👤',
      color: 'info',
      title: 'عضو جديد: ' + m.name,
      desc: (m.sector || '') + ' — ' + (m.code || ''),
      time: m.createdAt,
      ts: m.createdAt
    });
  });

  return activities.sort((a, b) => b.ts.localeCompare(a.ts)).slice(0, 30);
}

function getTodayStats() {
  const todayStr = today();
  const todayPayments = S.payments.filter(p => p.date === todayStr);
  const todayDeliveries = S.deliveries.filter(d => d.date === todayStr);

  return {
    paymentsCount: todayPayments.length,
    paymentsAmount: todayPayments.reduce((s, p) => s + (Number(p.amount) || 0), 0),
    deliveriesCount: todayDeliveries.length,
    collectorsActive: new Set(todayPayments.map(p => p.collectorId).filter(x => x)).size
  };
}

/* ═══ التنبيهات المتقدمة ═══ */

renderNotifications = function() {
  const notifs = [];
  const y = S.currentYear;

  /* متأخرون */
  if (isManager() || isPresident()) {
    const stats = getMembersStats(y);
    if (stats.late > 0) {
      notifs.push({
        icon: '⚠️',
        color: 'danger',
        title: stats.late + ' عضو متأخر',
        desc: 'إجمالي: ' + fmtNum(stats.lateTotal) + ' ل.س',
        action: function() { go('pg-collect'); }
      });
    }
  }

  /* تسليمات معلقة */
  if (canReceive()) {
    const pending = S.deliveries.filter(d => !d.receivedAt && !d.rejectedAt);
    if (pending.length > 0) {
      const total = pending.reduce((s, d) => s + (Number(d.amount) || 0), 0);
      notifs.push({
        icon: '📬',
        color: 'warning',
        title: pending.length + ' تسليم بانتظارك',
        desc: 'إجمالي: ' + fmtNum(total) + ' ل.س',
        action: function() { go('pg-deliveries'); }
      });
    }
  }

  /* عهدة */
  if (canDeliver()) {
    const c = getMyCustody();
    if (c.all.balance > 0) {
      notifs.push({
        icon: '💼',
        color: 'warning',
        title: 'لديك عهدة',
        desc: fmtNum(c.all.balance) + ' ل.س — يُنصح بالتسليم',
        action: function() { go('pg-custody'); }
      });
    }
  }

  /* وفيات الشهر */
  const now = new Date();
  const monthDeaths = S.deaths.filter(d => {
    if (!d.deathDate) return false;
    const dd = new Date(d.deathDate);
    return dd.getMonth() === now.getMonth() && dd.getFullYear() === now.getFullYear();
  });
  if (monthDeaths.length > 0) {
    notifs.push({
      icon: '⚰️',
      color: 'danger',
      title: monthDeaths.length + ' وفاة هذا الشهر',
      desc: monthDeaths.slice(0, 2).map(d => d.deceasedName).join('، '),
      action: function() { go('pg-deaths'); }
    });
  }

  /* دفعات اليوم */
  if (isManager() || isPresident()) {
    const todayStats = getTodayStats();
    if (todayStats.paymentsCount > 0) {
      notifs.push({
        icon: '💰',
        color: 'success',
        title: todayStats.paymentsCount + ' دفعة اليوم',
        desc: 'إجمالي: ' + fmtNum(todayStats.paymentsAmount) + ' ل.س',
        action: function() { openLiveDashboard(); }
      });
    }
  }

  /* لوحة المدير الحية */
  if (isManager() || isPresident()) {
    notifs.push({
      icon: '🔴',
      color: 'primary',
      title: 'لوحة المدير الحية',
      desc: 'عرض آخر 24 ساعة',
      action: function() { openLiveDashboard(); }
    });
  }

  /* زر الروابط للمدير */
  if (isManager()) {
    notifs.push({
      icon: '🔗',
      color: 'info',
      title: 'إدارة الروابط',
      desc: 'من يدفع عن من',
      action: function() { openGroupsViewSheet(); }
    });
  }

  let html = '';
  if (notifs.length) {
    html += '<div style="display:grid;gap:8px">';
    notifs.forEach(function(n, i) {
      html += '<div class="card" onclick="notifAction(' + i + ')" style="cursor:pointer;display:flex;align-items:center;gap:12px;margin:0;border-right:4px solid var(--' + n.color + ')">';
      html += '<div style="font-size:32px">' + n.icon + '</div>';
      html += '<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14px">' + esc(n.title) + '</div>';
      if (n.desc) html += '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + esc(n.desc) + '</div>';
      html += '</div>';
      html += '<div style="font-size:20px;color:var(--muted-2)">›</div></div>';
    });
    html += '</div>';
  } else {
    html = '<div class="empty"><span class="ico">✅</span><h3>لا توجد تنبيهات</h3><p>كل شيء تحت السيطرة</p></div>';
  }

  const activity = getRecentActivity(6);

    liveCard.style.borderRight = '4px solid var(--primary)';
    liveCard.innerHTML =
      '<div class="card-head"><h2 style="color:var(--primary)">🔴 مباشر الآن</h2>' +
      '<button class="btn ghost sm" onclick="openLiveDashboard()">التفاصيل ›</button></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">' +
      '<div style="text-align:center;padding:8px;background:var(--success-soft);border-radius:10px">' +
      '<div style="font-size:20px;font-weight:800;color:var(--success)">' + todayStats.paymentsCount + '</div>' +
      '<div style="font-size:10px;color:var(--muted)">دفعات اليوم</div></div>' +
      '<div style="text-align:center;padding:8px;background:var(--primary-soft);border-radius:10px">' +
      '<div style="font-size:20px;font-weight:800;color:var(--primary)">' + fmtShort(todayStats.paymentsAmount) + '</div>' +
      '<div style="font-size:10px;color:var(--muted)">مجموع اليوم</div></div>' +
      '</div>';

    if (activity.length > 0) {
      liveCard.innerHTML += '<div style="font-size:11px;color:var(--muted);font-weight:700;margin-top:10px;margin-bottom:6px">📊 آخر الحركات</div>';
      activity.slice(0, 3).forEach(function(a) {
        liveCard.innerHTML +=
          '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px">' +
          '<span>' + a.icon + '</span>' +
          '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(a.title) + '</span>' +
          '<span style="font-weight:800;color:var(--primary);font-size:11px">' + esc(a.desc.split(' — ')[0]) + '</span>' +
          '</div>';
      });
    }

    /* ضعها قبل قسم الصناديق */
    const fundCards = container.querySelectorAll('.fund-card');
    if (fundCards.length > 0) {
      container.insertBefore(liveCard, fundCards[0]);
    } else {
      container.appendChild(liveCard);
    }
  }
};

/* ═══════════════════════════════════════════════════════════

/* تحديث عرض قائمة المدفوعات لفتح الإيصال مباشرة */
function openPaymentsHistorySheet(memberId) {
  const payments = S.payments
    .filter(p => p.memberId === memberId)
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  if (!payments.length) {
    toast('لا توجد دفعات', 'info');
    return;
  }

  let html = '';
  const total = payments.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  html += '<div style="padding:14px;background:var(--primary-soft);border-radius:12px;margin-bottom:14px;text-align:center">';
  html += '<div style="font-size:11px;color:var(--muted)">إجمالي المدفوع</div>';
  html += '<div style="font-size:24px;font-weight:800;color:var(--primary);font-family:\'SF Mono\',monospace;margin-top:4px">' + fmtNum(total) + '</div>';
  html += '<div style="font-size:11px;color:var(--muted)">' + payments.length + ' دفعة</div>';
  html += '</div>';

  html += '<div class="list">';
  payments.forEach(function(p) {
    const fund = FUNDS[p.fund] || FUNDS.assoc;
    html += '<div class="item" onclick="closeSheet();setTimeout(function(){openPaymentReceipt(' + p.id + ')},150)">';
    html += '<div class="av ' + fund.color + '">' + fund.icon + '</div>';
    html += '<div class="body"><div class="ttl">' + fmtNum(p.amount) + ' ل.س</div>';
    html += '<div class="sub">' + fmtDate(p.date) + ' • ' + (p.collectorName || '') + '</div></div>';
    html += '<span class="trail">›</span></div>';
  });
  html += '</div>';

  openSheet('📜 سجل الدفعات', html, '<button class="btn ghost" onclick="closeSheetAll()">إغلاق</button>', { wide: true });
}

  buttonsSection.parentNode.insertBefore(extraBtns, buttonsSection.nextSibling);
};

function finalSelfTest() {
  const issues = [];

  const requiredFns = [
    'openDB', 'dbPut', 'dbGet', 'dbDel',
    'computeMemberWallet', 'getMembersStats', 'getFundBalance',
    'getUserCustody', 'renderHome', 'renderCollect', 'renderReports',
    'renderAdmin', 'renderNotifications', 'renderAccount',
    'recordPayment', 'openPaymentReceipt', 'sendReceiptWA',
    'openMemberStatement', 'sendStatementWA', 'openUnifiedPaymentSheet',
    'openLinkManagerSheet', 'openDeathDetailAdvanced', 'openDeathMembersList',
    'openImportSheet', 'importMembers', 'importPayments', 'importDeaths',
    'openFundLedgerSheetAdvanced', 'openLiveDashboard', 'getRecentActivity'
  ];

  const missing = [];
  requiredFns.forEach(function(fn) {
    if (typeof window[fn] !== 'function') missing.push(fn);
  });
  if (missing.length) issues.push('❌ دوال مفقودة: ' + missing.join(', '));

  if (S.members.length > 0) {
    try {
      const w = computeMemberWallet(S.members[0].id);
      if (!w) issues.push('⚠️ محرك المحفظة يُعيد null');
    } catch (e) {
      issues.push('❌ خطأ محرك المحفظة: ' + e.message);
    }
  }

  console.log('');
  console.log('═══════════════════════════════════════════');
  console.log('  🔍 الاختبار الذاتي v' + APP_VERSION);
  console.log('═══════════════════════════════════════════');
  if (issues.length === 0) console.log('  ✅ كل شيء يعمل');
  else {
    console.warn('  ⚠️ مشاكل:');
    issues.forEach(i => console.warn('    ' + i));
  }
  console.log('');
  console.log('  📊 الإحصائيات:');
  console.log('    👥 الأعضاء: ' + S.members.length);
  console.log('    💰 الدفعات: ' + S.payments.length);
  console.log('    📊 التخصيصات: ' + S.allocations.length);
  console.log('    ⚰️ الوفيات: ' + S.deaths.length);
  console.log('    📒 دفتر الأستاذ: ' + S.ledger.length);
  console.log('    📤 التسليمات: ' + S.deliveries.length);
  console.log('    📥 الواردات: ' + S.incomes.length);
  console.log('    💸 المصاريف: ' + S.expenses.length);
  console.log('    👤 المستخدمون: ' + S.users.length);
  console.log('═══════════════════════════════════════════');
  return { ok: issues.length === 0, issues: issues };
}
