<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>صندوق زعورة</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--primary:#7c3aed;--primary-2:#6d28d9;--primary-soft:#f5f3ff;--primary-dark:#4c1d95;--assoc:#2563eb;--assoc-soft:#dbeafe;--death:#dc2626;--death-soft:#fee2e2;--donation:#16a34a;--donation-soft:#dcfce7;--success:#16a34a;--danger:#dc2626;--warning:#f59e0b;--info:#2563eb;--muted:#64748b;--bg:#f8fafc;--card:#fff;--text:#0f172a;--border:#e2e8f0;--radius:16px;--shadow-sm:0 1px 3px rgba(15,23,42,.06);--shadow-lg:0 20px 60px rgba(15,23,42,.2);--safe:env(safe-area-inset-bottom,0)}
[data-theme="dark"]{--bg:#0b1220;--card:#1e293b;--text:#e2e8f0;--border:#334155;--primary-soft:#2e1065;--assoc-soft:#1e3a8a;--death-soft:#7f1d1d;--donation-soft:#14532d}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;background:var(--bg);color:var(--text);direction:rtl;font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:calc(78px + var(--safe))}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{outline:0}
.app-header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0));display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(124,58,237,.3)}
.app-header .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.app-header .logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.app-header .brand-text{flex:1;min-width:0}
.app-header h1{font-size:16px;font-weight:800}
.app-header .sub{font-size:11px;opacity:.9;font-weight:700;cursor:pointer;display:inline-block;padding:2px 8px;background:rgba(255,255,255,.15);border-radius:8px;margin-top:2px}
.app-header .icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.app-header .icon-btn:active{transform:scale(.92)}
.user-banner{background:var(--card);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;position:sticky;top:60px;z-index:29}
.user-banner .who{display:flex;align-items:center;gap:8px;color:var(--muted);flex-wrap:wrap}
.user-banner .who b{color:var(--text)}
.role-badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;background:var(--primary-soft);color:var(--primary)}
.search-wrap{padding:10px 12px 0;max-width:900px;margin:0 auto}
.search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow-sm)}
.search-box input{flex:1;background:none;border:0;font-size:15px;min-width:0}
.search-box .ico{color:var(--muted);font-size:17px}
.search-box .clear{color:var(--muted);font-size:18px;padding:4px}
main{max-width:900px;margin:0 auto;padding:12px}
.page{display:none}
.page.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.stats-scroll{display:flex;gap:10px;overflow-x:auto;margin:0 -12px 14px;padding:0 12px 6px;scrollbar-width:none}
.stats-scroll::-webkit-scrollbar{display:none}
.stat{flex:0 0 auto;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--primary)}
.stat.assoc::before{background:var(--assoc)}
.stat.death::before{background:var(--death)}
.stat.donation::before{background:var(--donation)}
.stat.green::before{background:var(--success)}
.stat.red::before{background:var(--danger)}
.stat.orange::before{background:var(--warning)}
.stat.blue::before{background:var(--info)}
.stat .val{font-size:20px;font-weight:800;line-height:1.1;color:var(--primary);word-break:break-all}
.stat.assoc .val{color:var(--assoc)}
.stat.death .val{color:var(--death)}
.stat.donation .val{color:var(--donation)}
.stat.green .val{color:var(--success)}
.stat.red .val{color:var(--danger)}
.stat.orange .val{color:var(--warning)}
.stat.blue .val{color:var(--info)}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600}
.list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;min-height:64px}
.item:last-child{border-bottom:0}
.item:active{background:var(--bg)}
.item .av{width:46px;height:46px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--primary-soft);color:var(--primary);font-weight:800;overflow:hidden}
.item .av.blue{background:var(--assoc-soft);color:var(--assoc)}
.item .av.red{background:var(--death-soft);color:var(--death)}
.item .av.green{background:var(--donation-soft);color:var(--donation)}
.item .av.orange{background:#fef3c7;color:#92400e}
.item .av.gray{background:#f1f5f9;color:#475569}
.item .body{flex:1;min-width:0}
.item .ttl{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .sub{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .trail{color:var(--muted);font-size:20px;flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap}
.badge.success{background:#dcfce7;color:#166534}
.badge.danger{background:#fee2e2;color:#991b1b}
.badge.warning{background:#fef3c7;color:#92400e}
.badge.info{background:#dbeafe;color:#1e40af}
.badge.muted{background:#f1f5f9;color:#475569}
.badge.primary{background:var(--primary-soft);color:var(--primary)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:13px;font-size:14px;font-weight:700;min-height:44px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff}
.btn.assoc{background:var(--assoc);color:#fff}
.btn.death{background:var(--death);color:#fff}
.btn.donation{background:var(--donation);color:#fff}
.btn.success{background:var(--success);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.warning{background:var(--warning);color:#fff}
.btn.info{background:var(--info);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:12px;border-radius:10px}
.btn.block{display:flex;width:100%}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border-radius:14px;background:var(--card);border:2px solid var(--border);cursor:pointer;text-align:center}
.quick-btn:active{transform:scale(.97);border-color:var(--primary)}
.quick-btn .ico{font-size:28px;line-height:1}
.quick-btn .lbl{font-size:12px;font-weight:800}
.quick-btn.assoc{border-color:var(--assoc)}
.quick-btn.assoc .lbl{color:var(--assoc)}
.quick-btn.death{border-color:var(--death)}
.quick-btn.death .lbl{color:var(--death)}
.quick-btn.donation{border-color:var(--donation)}
.quick-btn.donation .lbl{color:var(--donation)}
.fab{position:fixed;bottom:calc(88px + var(--safe));left:18px;width:60px;height:60px;border-radius:20px;background:var(--primary);color:#fff;font-size:28px;font-weight:300;box-shadow:0 12px 32px rgba(124,58,237,.5);z-index:25;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.92)}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:10px;font-weight:700;min-width:0}
.bnav button .i{font-size:22px;line-height:1}
.bnav button.on{color:var(--primary)}
.sheet-back{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:10100;opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(3px)}
.sheet-back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:10101;background:var(--card);border-radius:24px 24px 0 0;max-height:94vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(16px + var(--safe))}
.sheet.on{transform:translateY(0)}
.sheet.wide{max-height:98vh}
.sheet-grip{width:44px;height:5px;background:var(--border);border-radius:3px;margin:12px auto 0}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2}
.sheet-hd h2{font-size:16px;font-weight:800}
.sheet-bd{padding:16px 18px}
.sheet-ft{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
.sheet-ft .btn{flex:1;min-width:90px}
.fld{margin-bottom:14px;position:relative}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld label .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{width:100%;padding:12px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;font-size:15px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--primary);background:var(--card)}
.fld textarea{resize:vertical;min-height:70px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld-hint{font-size:11px;color:var(--muted);margin-top:4px}
.fld-readonly{background:var(--primary-soft)!important;color:var(--primary);font-weight:700}
.options-list{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1.5px solid var(--primary);border-radius:12px;max-height:250px;overflow-y:auto;z-index:100;margin-top:4px;display:none}
.options-list.on{display:block}
.option-item{padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--border);font-size:14px}
.option-item:active{background:var(--primary-soft)}
.option-item:last-child{border-bottom:0}
.option-item small{color:var(--muted);font-size:11px}
.amount-input{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--primary);border-radius:14px;padding:8px 16px}
.amount-input input{flex:1;border:0;background:none;font-size:26px;font-weight:800;color:var(--primary);text-align:center;padding:8px 0}
.amount-input .currency{font-size:14px;font-weight:800;color:var(--muted)}
.amount-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.amount-quick button{padding:6px 12px;border-radius:10px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700}
.balance-block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.balance-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
.balance-row:last-child{border-bottom:0}
.balance-row .lbl{color:var(--muted)}
.balance-row .val{font-weight:800}
.balance-row .val.green{color:var(--success)}
.balance-row .val.red{color:var(--danger)}
.balance-row .val.orange{color:var(--warning)}
.progress{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:8px}
.progress > div{height:100%;border-radius:5px}
.progress.assoc > div{background:var(--assoc)}
.progress.death > div{background:var(--death)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ico{font-size:52px;opacity:.4;display:block;margin-bottom:10px}
.empty h3{font-size:15px;font-weight:700;margin-bottom:4px;color:var(--text)}
.empty p{font-size:12px}
.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10200;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 28px);max-width:400px}
.toast{background:var(--text);color:var(--card);padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);pointer-events:auto}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--danger);color:#fff}
.toast.warning{background:var(--warning);color:#fff}
.toast.info{background:var(--info);color:#fff}
.loader{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(3px);z-index:10300;display:none;align-items:center;justify-content:center}
.loader.on{display:flex}
.spin{width:42px;height:42px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-screen{position:fixed;inset:0;z-index:10000;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.login-screen.on{display:flex}
.login-card{background:var(--card);color:var(--text);border-radius:24px;padding:28px 24px;max-width:400px;width:100%;margin:auto}
.login-card .logo-lg{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;margin:0 auto 16px}
.login-card h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:4px}
.login-card .sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:24px}
.users-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto}
.login-user{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--bg);border:2px solid transparent;cursor:pointer}
.login-user:active{border-color:var(--primary);background:var(--primary-soft)}
.login-user .av{width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0}
.login-user .info{flex:1;min-width:0}
.login-user .nm{font-weight:700;font-size:14px}
.login-user .role{font-size:11px;color:var(--muted);margin-top:2px}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.pin-btn{padding:16px;border-radius:14px;background:var(--bg);font-size:20px;font-weight:800}
.pin-btn:active{transform:scale(.95);background:var(--primary-soft)}
.pin-display{display:flex;justify-content:center;gap:10px;margin:20px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--border)}
.pin-dot.on{background:var(--primary)}
@media print{.app-header,.bnav,.fab,.search-wrap,.user-banner{display:none!important}main{padding:0;max-width:100%}body{background:#fff;padding-bottom:0}}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="logo-lg">🏘️</div>
    <h1>صندوق زعورة</h1>
    <div class="sub">نظام إدارة الصناديق والتكافل</div>
    <div id="loginUsers">
      <div class="users-list" id="loginUsersList"></div>
      <button class="btn ghost block" style="margin-top:14px" onclick="showAddFirstAdmin()">⚙️ إعداد أول مرة</button>
    </div>
    <div id="loginPin" style="display:none">
      <div style="text-align:center;margin-bottom:12px">
        <div style="font-size:44px" id="pinAvatar">👤</div>
        <div style="font-weight:800;font-size:16px;margin-top:6px" id="pinName">—</div>
        <div style="font-size:11px;color:var(--muted)" id="pinRole">—</div>
      </div>
      <div class="pin-display" id="pinDisplay"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
      <div style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:12px;min-height:18px" id="pinError"></div>
      <div class="pin-pad">
        <button class="pin-btn" onclick="pinPress('1')">1</button><button class="pin-btn" onclick="pinPress('2')">2</button><button class="pin-btn" onclick="pinPress('3')">3</button>
        <button class="pin-btn" onclick="pinPress('4')">4</button><button class="pin-btn" onclick="pinPress('5')">5</button><button class="pin-btn" onclick="pinPress('6')">6</button>
        <button class="pin-btn" onclick="pinPress('7')">7</button><button class="pin-btn" onclick="pinPress('8')">8</button><button class="pin-btn" onclick="pinPress('9')">9</button>
        <button class="pin-btn" onclick="pinBack()">⌫</button><button class="pin-btn" onclick="pinPress('0')">0</button><button class="pin-btn" onclick="pinBackLogin()">↩️</button>
      </div>
    </div>
  </div>
</div>

<header class="app-header" id="appHeader" style="display:none">
  <div class="brand">
    <div class="logo">🏘️</div>
    <div class="brand-text">
      <h1>صندوق زعورة</h1>
      <div class="sub" id="hdrYear" onclick="openYearPicker()">السنة ▼</div>
    </div>
  </div>
  <button class="icon-btn" onclick="openStatsSheet()">📊</button>
  <button class="icon-btn" onclick="toggleTheme()">🌓</button>
  <button class="icon-btn" onclick="openSettingsSheet()">⚙️</button>
</header>

<div class="user-banner" id="userBanner" style="display:none">
  <div class="who">
    <span>👤</span>
    <b id="currentUserName">—</b>
    <span class="role-badge" id="currentUserRole">—</span>
  </div>
  <button class="btn ghost sm" onclick="logout()">🚪</button>
</div>

<div class="search-wrap" id="searchWrap" style="display:none">
  <div class="search-box">
    <span class="ico">🔍</span>
    <input id="globalSearch" placeholder="ابحث..." oninput="globalSearch(this.value)">
    <button class="clear" onclick="clearSearch()" style="display:none" id="searchClear">✕</button>
  </div>
</div>

<main id="appMain" style="display:none">
  <section id="pg-home" class="page active">
    <div class="stats-scroll" id="homeStats"></div>
    <div class="card"><div class="card-head"><h2>⚡ إجراءات سريعة</h2></div><div class="quick-actions" id="homeQuickActions"></div></div>
    <div class="card"><div class="card-head"><h2>📊 أرصدة الصناديق</h2></div><div id="fundBalances"></div></div>
    <div class="card"><div class="card-head"><h2>🕐 آخر العمليات</h2></div><div id="recentOps"></div></div>
  </section>

  <section id="pg-members" class="page">
    <div class="stats-scroll" id="membersStats"></div>
    <div class="card" style="padding:12px">
      <div class="chips" id="membersChips"></div>
      <div class="chips" id="membersSectorChips"></div>
    </div>
    <div id="membersContent"></div>
  </section>

  <section id="pg-payments" class="page">
    <div class="stats-scroll" id="paymentsStats"></div>
    <div class="card" style="padding:12px"><div class="chips" id="paymentsChips"></div></div>
    <div id="paymentsContent"></div>
  </section>

  <section id="pg-reports" class="page"><div id="reportsContent"></div></section>

  <section id="pg-admin" class="page">
    <div class="card"><div class="card-head"><h2>⚙️ الإدارة</h2></div><div id="adminMenu"></div></div>
  </section>
</main>

<button class="fab" id="fab" onclick="handleFab()" style="display:none">+</button>

<nav class="bnav" id="appNav" style="display:none">

const DB_VERSION = 1;

/* ═══════════════════════════════════════════════════════
   INDEXEDDB
   ═══════════════════════════════════════════════════════ */
let db = null;

function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORE_NAMES.forEach(n => {
        if(!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath:'id', autoIncrement:true });
      });
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}

const tx = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
const dbAll = s => new Promise((res, rej) => { const q = tx(s).getAll(); q.onsuccess = () => res(q.result||[]); q.onerror = () => rej(q.error); });
const dbGet = (s, id) => new Promise((res, rej) => { const q = tx(s).get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const dbPut = (s, o) => new Promise((res, rej) => { const q = tx(s,'readwrite').put(o); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const dbDel = (s, id) => new Promise((res, rej) => { const q = tx(s,'readwrite').delete(id); q.onsuccess = () => res(); q.onerror = () => rej(q.error); });

/* ═══════════════════════════════════════════════════════
   أدوات
   ═══════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const cleanText = v => String(v ?? '').trim().replace(/\s+/g,' ');
const normAr = v => String(v ?? '').toLowerCase().trim().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/[ىي]/g,'ي').replace(/[ًٌٍَُِّْـ]/g,'');
const cleanPhone = v => { if(!v) return ''; let s = String(v).trim().replace(/\.0+$/,'').replace(/[\s\-\(\)\u200f\u200e]/g,''); if(s.startsWith('+963')) s = '0' + s.slice(4); return s; };
const today = () => new Date().toISOString().slice(0,10);
const debounce = (fn, d = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), d); }; };

function fmtDate(d){
  if(!d) return '—';
  try { return new Date(d).toLocaleDateString('ar-EG', { year:'numeric', month:'short', day:'numeric' }); }
  catch(e) { return d; }
}

function toDate(v){
  if(!v) return '';
  if(typeof v === 'string' && v.trim().startsWith('=')) return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number'){ const d = new Date((v-25569)*86400000); return isNaN(d)?'':d.toISOString().slice(0,10); }
  const s = String(v).trim();
  const m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]|$)/);
  if(m1) return `${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;
  const m2 = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m2) return `${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
  const d = new Date(s);
  if(!isNaN(d) && d.getFullYear() > 1900 && d.getFullYear() < 2100) return d.toISOString().slice(0,10);
  return '';
}

function fmtNum(n){
  if(n === null || n === undefined || n === '') return '0';
  const num = Number(n); if(isNaN(num)) return '0';
  return num.toLocaleString('en-US');
}
function fmtShort(n){
  if(!n && n !== 0) return '0';
  const num = Number(n);
  if(num >= 1000000) return (num/1000000).toFixed(1) + 'M';
  if(num >= 1000) return (num/1000).toFixed(1) + 'K';
  return String(num);
}
function calcAge(birth){
  if(!birth) return '';
  const b = new Date(birth); if(isNaN(b)) return '';
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  if(now.getMonth() < b.getMonth() || (now.getMonth() === b.getMonth() && now.getDate() < b.getDate())) age--;
  return age >= 0 ? age : '';
}

function toast(msg, type = 'success', dur = 2800){

function saveCurrentUser(u){
  S.currentUser = u;
  if(u) localStorage.setItem('zt_user', JSON.stringify({ id:u.id, name:u.name, role:u.role }));
  else localStorage.removeItem('zt_user');

const getMemberById = id => S.members.find(m => m.id === id);

/* ═══════════════════════════════════════════════════════
   ⭐⭐ الحسابات — القلب النابض للنظام ⭐⭐
   ═══════════════════════════════════════════════════════ */

const BASE_YEAR = 2025;

function getConstants(year){
  const c = S.constants.find(x => x.year === year);
  if(c) return c;
  const sorted = [...S.constants].sort((a,b) => b.year - a.year);
  return sorted[0] || null;
}

function computeMemberYear(member, year){
  const c = getConstants(year);
  if(!c) return { assoc:{ req:0, paid:0, rem:0 }, death:{ req:0, paid:0, rem:0 } };

  const assocFees = (member.memberType === 'مخفض' && c.assocYearlyReduced) ? c.assocYearlyReduced : c.assocYearly;
  const joinAssocFee = (member.memberType === 'مخفض' && c.joinAssocFeeReduced) ? c.joinAssocFeeReduced : c.joinAssocFee;

  const result = {
    year,
    assoc: { req: 0, paid: 0, rem: 0 },
    death: { req: 0, paid: 0, rem: 0 }
  };

  if(member.assocStartYear && year >= member.assocStartYear && year >= BASE_YEAR){
    result.assoc.req += assocFees;
    if(year === member.assocStartYear && member.assocStartYear >= BASE_YEAR){
      result.assoc.req += joinAssocFee;
    }
  }

  if(member.deathStartYear && year >= member.deathStartYear && year >= BASE_YEAR){
    if(year === member.deathStartYear && member.deathStartYear >= BASE_YEAR){
      result.death.req += ((member.memberType === 'مخفض' && c.joinDeathFeeReduced) ? c.joinDeathFeeReduced : c.joinDeathFee);
    }
    const yearDeaths = S.deaths.filter(d => d.year === year);
    result.death.req += yearDeaths.length * c.deathInstallment;
  }

  const memberPayments = S.payments.filter(p => p.memberId === member.id);
  result.assoc.paid = memberPayments
    .filter(p => p.fund === 'assoc')
    .reduce((s,p) => s + (Number(p.amount) || 0), 0);
  result.death.paid = memberPayments
    .filter(p => p.fund === 'death')
    .reduce((s,p) => s + (Number(p.amount) || 0), 0);

  return result;
}

function computeMemberFull(memberId){
  const member = getMemberById(memberId);
  if(!member) return null;

  const starts = [member.assocStartYear, member.deathStartYear].filter(x => x);
  if(!starts.length) return { member, years: [], total:{ assocReq:0, assocPaid:0, assocRem:0, deathReq:0, deathPaid:0, deathRem:0, totalRem:0, totalReq:0, totalPaid:0 } };

  const firstYear = Math.max(BASE_YEAR, Math.min(...starts));
  const years = [];
  for(let y = firstYear; y <= S.currentYear; y++){
    const yd = computeMemberYear(member, y);
    yd.year = y;
    years.push(yd);
  }

  const total = years.reduce((acc, y) => ({
    assocReq:  acc.assocReq  + y.assoc.req,
    assocPaid: acc.assocPaid + y.assoc.paid,
    assocRem:  acc.assocRem  + (y.assoc.req - y.assoc.paid),
    deathReq:  acc.deathReq  + y.death.req,
    deathPaid: acc.deathPaid + y.death.paid,
    deathRem:  acc.deathRem  + (y.death.req - y.death.paid)
  }), { assocReq:0, assocPaid:0, assocRem:0, deathReq:0, deathPaid:0, deathRem:0 });

  total.totalReq = total.assocReq + total.deathReq;
  total.totalPaid = total.assocPaid + total.deathPaid;
  total.totalRem = total.totalReq - total.totalPaid;

  return { member, years, total };
}

function getMembersStats(year){
  const y = year || S.currentYear;
  let onlyAssoc = 0, onlyDeath = 0, both = 0, none = 0, late = 0;
  let lateTotal = 0;

  for(const m of S.members){
    const hasAssoc = m.assocStartYear && m.assocStartYear <= y;
    const hasDeath = m.deathStartYear && m.deathStartYear <= y;
    if(hasAssoc && hasDeath) both++;
    else if(hasAssoc) onlyAssoc++;
    else if(hasDeath) onlyDeath++;
    else none++;
  }

  for(const m of S.members){
    if(!m.assocStartYear && !m.deathStartYear) continue;
    const full = computeMemberFull(m.id);
    if(full && full.total.totalRem > 0){ late++; lateTotal += full.total.totalRem; }
  }

  return { year:y, total:S.members.length, onlyAssoc, onlyDeath, both, none, late, lateTotal };
}

function getFundBalances(year){
  const y = year || S.currentYear;

  const assocPayments = S.payments.filter(p => p.year === y && p.fund === 'assoc').reduce((s,p) => s + (Number(p.amount)||0), 0);
  const assocIncomes = S.incomes.filter(i => i.year === y && i.fund === 'assoc').reduce((s,i) => s + (Number(i.amount)||0), 0);
  const assocExpenses = S.expenses.filter(e => e.year === y && e.fund === 'assoc').reduce((s,e) => s + (Number(e.amount)||0), 0);
  const assocBalance = assocPayments + assocIncomes - assocExpenses;

  const deathPayments = S.payments.filter(p => p.year === y && p.fund === 'death').reduce((s,p) => s + (Number(p.amount)||0), 0);
  const deathIncomes = S.incomes.filter(i => i.year === y && i.fund === 'death').reduce((s,i) => s + (Number(i.amount)||0), 0);
  const deathExpenses = S.expenses.filter(e => e.year === y && e.fund === 'death').reduce((s,e) => s + (Number(e.amount)||0), 0);
  const deathCompensations = S.deaths.filter(d => d.year === y).reduce((s,d) => s + (Number(d.compensation)||0), 0);
  const deathBalance = deathPayments + deathIncomes - deathExpenses - deathCompensations;

  const donations = S.payments.filter(p => p.year === y && p.fund === 'donation').reduce((s,p) => s + (Number(p.amount)||0), 0);

  return {
    year: y,
    assoc: { payments: assocPayments, incomes: assocIncomes, expenses: assocExpenses, balance: assocBalance },
    death: { payments: deathPayments, incomes: deathIncomes, expenses: deathExpenses, compensations: deathCompensations, balance: deathBalance },
    donations,
    total: assocBalance + deathBalance
  };
}

function getUserCustody(userId){
  const payments = S.payments.filter(p => p.collectorId === userId).reduce((s,p) => s + (Number(p.amount)||0), 0);
  const delivered = S.deliveries.filter(d => d.fromUserId === userId).reduce((s,d) => s + (Number(d.amount)||0), 0);
  const received = S.deliveries.filter(d => d.toUserId === userId).reduce((s,d) => s + (Number(d.amount)||0), 0);
  return { collected: payments, delivered, received, balance: payments - delivered + received };
}

let _pinAttempt = '';

function renderLogin(){
  _pinAttempt = ''; _pinTargetUser = null;
  $('loginUsers').style.display = 'block';
  $('loginPin').style.display = 'none';
  const list = $('loginUsersList');
  if(!S.users.length){

    return;
  }
  list.innerHTML = S.users.map(u => {
    const r = ROLES[u.role] || { name:'مستخدم', icon:'👤' };
    return `<div class="login-user" onclick="selectLoginUser(${u.id})">
      <div class="av">${r.icon}</div>
      <div class="info"><div class="nm">${esc(u.name)}</div><div class="role">${r.name}</div></div>

    </div>`;
  }).join('');
}

function selectLoginUser(id){
  const u = S.users.find(a => a.id === id);
  if(!u) return;
  _pinTargetUser = u; _pinAttempt = '';
  if(!u.hasPin){ doLogin(u); return; }
  $('loginUsers').style.display = 'none';
  $('loginPin').style.display = 'block';
  const r = ROLES[u.role] || { name:'مستخدم', icon:'👤' };
  $('pinAvatar').textContent = r.icon;
  $('pinName').textContent = u.name;
  $('pinRole').textContent = r.name;
  $('pinError').textContent = '';
  updatePinDisplay();
}
function pinPress(d){ if(_pinAttempt.length >= 4) return; _pinAttempt += d; updatePinDisplay(); if(_pinAttempt.length === 4) setTimeout(checkPin, 200); }
function pinBack(){ _pinAttempt = _pinAttempt.slice(0,-1); updatePinDisplay(); }
function pinBackLogin(){ $('loginPin').style.display = 'none'; $('loginUsers').style.display = 'block'; _pinAttempt=''; _pinTargetUser=null; }
function updatePinDisplay(){ document.querySelectorAll('#pinDisplay .pin-dot').forEach((d,i) => d.classList.toggle('on', i < _pinAttempt.length)); }
function checkPin(){
  if(!_pinTargetUser) return;
  if(_pinAttempt === String(_pinTargetUser.pin)){
    $('pinError').textContent = '✅ صحيح';
    $('pinError').style.color = 'var(--success)';
    setTimeout(() => doLogin(_pinTargetUser), 400);
  } else {
    $('pinError').textContent = '❌ خطأ';
    $('pinError').style.color = 'var(--danger)';
    _pinAttempt = '';
    updatePinDisplay();
  }
}
function doLogin(u){
  S.currentUser = u;
  saveCurrentUser(u);
  toast('👋 مرحباً ' + u.name, 'success', 2000);
  showMain();
}

async function saveFirstAdmin(){
  const name = cleanText($('fName').value);
  const pin = $('fPin').value.trim();
  const pin2 = $('fPin2').value.trim();
  if(!name){ toast('الاسم مطلوب','error'); return; }
  if(!/^\d{4}$/.test(pin)){ toast('كلمة المرور: 4 أرقام','error'); return; }
  if(pin !== pin2){ toast('كلمتا المرور غير متطابقتين','error'); return; }
  try{
    const user = { name, phone: cleanPhone($('fPhone').value), pin, hasPin:true, role:'president', createdAt: new Date().toISOString() };
    const newId = await dbPut('users', user);
    user.id = newId;
    S.users.push(user);
    closeSheet();
    toast('✅ تم الإنشاء', 'success', 3000);
    setTimeout(renderLogin, 400);
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

  $('appNav').style.display = 'none';
  $('fab').style.display = 'none';
  renderLogin();
}
function showMain(){
  $('loginScreen').classList.remove('on');
  $('appHeader').style.display = 'flex';
  $('userBanner').style.display = 'flex';
  $('searchWrap').style.display = 'block';
  $('appMain').style.display = 'block';
  $('appNav').style.display = 'flex';
  const u = S.currentUser;
  if(u){
    $('currentUserName').textContent = u.name;
    const r = ROLES[u.role] || { name:'مستخدم', icon:'👤' };
    $('currentUserRole').textContent = r.icon + ' ' + r.name;
  }
  $('hdrYear').textContent = 'السنة ' + S.currentYear + ' ▼';
  go('pg-home');
}
function logout(){
  if(!confirm('تسجيل الخروج؟')) return;
  saveCurrentUser(null);
  S.currentUser = null;
  showLogin();
}

/* ═══════════════════════════════════════════════════════
   نظام السنة
   ═══════════════════════════════════════════════════════ */
function changeYear(y){
  S.currentYear = Number(y);
  localStorage.setItem('zt_year', y);
  $('hdrYear').textContent = 'السنة ' + S.currentYear + ' ▼';
  if(S.page === 'pg-home') renderHome();
  if(S.page === 'pg-members') renderMembers();
  if(S.page === 'pg-payments') renderPayments();
  if(S.page === 'pg-reports') renderReports();
  toast('📅 السنة: ' + y, 'info', 1200);
}
function openYearPicker(){
  const years = [];
  for(let y = BASE_YEAR; y <= BASE_YEAR + 4; y++) years.push(y);
  const body = `
    <div style="text-align:center;padding:14px 0 18px">
      <div style="font-size:44px;margin-bottom:8px">📅</div>
      <div style="font-weight:800;font-size:15px">اختر السنة</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${years.map(y => `
        <button class="quick-btn ${y === S.currentYear ? 'assoc' : ''}" style="padding:20px;font-size:22px;font-weight:800;${y === S.currentYear ? 'border-color:var(--primary);background:var(--primary-soft)' : ''}" onclick="closeSheet();changeYear(${y})">${y}</button>
      `).join('')}
    </div>
  `;
  openSheet('📅 السنة', body, '<button class="btn ghost" onclick="closeSheet()">إلغاء</button>');
}

   الرئيسية

function renderHome(){

  const stats = getMembersStats(y);

      <div class="stat green"><div class="val">${fmtShort(custody.collected)}</div><div class="lbl">📥 حصّلت</div></div>
      <div class="stat orange"><div class="val">${fmtShort(custody.delivered)}</div><div class="lbl">📤 سلّمت</div></div>
      <div class="stat"><div class="val">${S.members.length}</div><div class="lbl">👥 الأعضاء</div></div>

  } else {
    statsHTML = `
      <div class="stat assoc"><div class="val">${fmtShort(balances.assoc.balance)}</div><div class="lbl">💰 رصيد الجمعية</div></div>
      <div class="stat death"><div class="val">${fmtShort(balances.death.balance)}</div><div class="lbl">⚰️ رصيد الوفاة</div></div>
      <div class="stat donation"><div class="val">${fmtShort(balances.donations)}</div><div class="lbl">💚 تبرعات</div></div>
      <div class="stat red"><div class="val">${stats.late}</div><div class="lbl">⚠️ متأخرون</div></div>
    `;
  }
  $('homeStats').innerHTML = statsHTML;

  const btns = [];
  if(hasPerm('payment.add')) btns.push(`<div class="quick-btn assoc" onclick="openPaymentSheet()"><div class="ico">💰</div><div class="lbl">دفعة</div></div>`);
  if(hasPerm('death.add')) btns.push(`<div class="quick-btn death" onclick="openDeathSheet()"><div class="ico">⚰️</div><div class="lbl">وفاة</div></div>`);
  if(hasPerm('income.add')) btns.push(`<div class="quick-btn donation" onclick="openIncomeSheet()"><div class="ico">📥</div><div class="lbl">إيراد</div></div>`);
  if(hasPerm('handover.send')) btns.push(`<div class="quick-btn" onclick="openDeliverySheet()"><div class="ico">📤</div><div class="lbl">تسليم</div></div>`);
  $('homeQuickActions').innerHTML = btns.join('') || '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:20px">لا توجد إجراءات متاحة</div>';

  $('fundBalances').innerHTML = `
    <div class="balance-block" style="border-right:4px solid var(--assoc)">
      <div style="font-weight:800;font-size:14px;color:var(--assoc);margin-bottom:8px">💰 صندوق الجمعية</div>
      <div class="balance-row"><span class="lbl">📥 اشتراكات</span><span class="val green">${fmtNum(balances.assoc.payments)}</span></div>
      <div class="balance-row"><span class="lbl">💚 إيرادات أخرى</span><span class="val green">${fmtNum(balances.assoc.incomes)}</span></div>
      <div class="balance-row"><span class="lbl">💸 مصاريف</span><span class="val red">-${fmtNum(balances.assoc.expenses)}</span></div>
      <div class="balance-row" style="border-top:2px solid var(--assoc);margin-top:6px;padding-top:8px">
        <span style="font-weight:800">💰 الرصيد</span>
        <span class="val" style="font-size:15px;color:${balances.assoc.balance >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmtNum(balances.assoc.balance)}</span>
      </div>
    </div>
    <div class="balance-block" style="border-right:4px solid var(--death)">
      <div style="font-weight:800;font-size:14px;color:var(--death);margin-bottom:8px">⚰️ صندوق الوفاة</div>
      <div class="balance-row"><span class="lbl">📥 أقساط</span><span class="val green">${fmtNum(balances.death.payments)}</span></div>
      <div class="balance-row"><span class="lbl">💸 مصاريف</span><span class="val red">-${fmtNum(balances.death.expenses)}</span></div>
      <div class="balance-row"><span class="lbl">📤 تعويضات</span><span class="val red">-${fmtNum(balances.death.compensations)}</span></div>
      <div class="balance-row" style="border-top:2px solid var(--death);margin-top:6px;padding-top:8px">
        <span style="font-weight:800">⚰️ الرصيد</span>
        <span class="val" style="font-size:15px;color:${balances.death.balance >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmtNum(balances.death.balance)}</span>
      </div>

  `;

  const ops = [];
  S.payments.slice(-20).forEach(p => {
    const m = p.memberId ? getMemberById(p.memberId) : null;
    ops.push({ icon: p.fund === 'death' ? '⚰️' : '💰', name: m?.name || 'عضو', label: p.fund === 'death' ? 'دفعة وفاة' : 'دفعة جمعية', amount: p.amount, date: p.date, ts: new Date(p.createdAt||0).getTime() });
  });
  S.incomes.slice(-10).forEach(i => ops.push({ icon:'📥', name: i.notes || 'إيراد', label: i.category || 'إيراد', amount:i.amount, date:i.date, ts: new Date(i.createdAt||0).getTime() }));
  S.deaths.slice(-10).forEach(d => ops.push({ icon:'🪦', name:d.deceasedName, label:'وفاة', amount:-d.compensation, date:d.deathDate, ts: new Date(d.createdAt||0).getTime() }));
  ops.sort((a,b) => b.ts - a.ts);
  const recent = ops.slice(0, 8);

  $('recentOps').innerHTML = recent.length ? `<div class="list">${recent.map(op => `
    <div class="item" style="cursor:default">
      <div class="av ${op.amount < 0 ? 'red' : 'green'}">${op.icon}</div>
      <div class="body"><div class="ttl">${esc(op.name)}</div><div class="sub">${esc(op.label)} • ${fmtDate(op.date)}</div></div>
      <div style="font-weight:800;font-size:13px;color:${op.amount < 0 ? 'var(--danger)' : 'var(--success)'}">${op.amount < 0 ? '' : '+'}${fmtNum(Math.abs(op.amount))}</div>
    </div>`).join('')}</div>` : '<div style="text-align:center;padding:20px;color:var(--muted);font-size:12px">لا توجد عمليات</div>';
}

/* ═══════════════════════════════════════════════════════
   الأعضاء
   ═══════════════════════════════════════════════════════ */
function setMembersFilter(k){ S.filters.members = k; renderMembers(); }
function setMembersSector(k){ S.filters.membersSector = k; renderMembers(); }

function renderMembers(){
  const y = S.currentYear;
  const stats = getMembersStats(y);

  $('membersStats').innerHTML = `
    <div class="stat assoc"><div class="val">${stats.onlyAssoc}</div><div class="lbl">💰 جمعية فقط</div></div>
    <div class="stat death"><div class="val">${stats.onlyDeath}</div><div class="lbl">⚰️ وفاة فقط</div></div>
    <div class="stat green"><div class="val">${stats.both}</div><div class="lbl">✅ كليهما</div></div>
    <div class="stat red"><div class="val">${stats.late}</div><div class="lbl">⚠️ متأخرون</div></div>
  `;

  const chips = [
    { k:'all', l:'الكل' },
    { k:'assoc', l:'💰 جمعية فقط' },
    { k:'death', l:'⚰️ وفاة فقط' },
    { k:'both', l:'✅ كليهما' },
    { k:'late', l:'⚠️ متأخرون' },
    { k:'none', l:'⚪ غير مشتركين' }
  ];
  $('membersChips').innerHTML = chips.map(c => 
    `<button class="chip ${S.filters.members === c.k ? 'on' : ''}" onclick="setMembersFilter('${c.k}')">${c.l}</button>`
  ).join('');

  const sectorChips = [{k:'all',l:'كل القطاعات'}, ...DEFAULT_SECTORS.map(s => ({k:s, l:s}))];
  $('membersSectorChips').innerHTML = sectorChips.map(c => 
    `<button class="chip ${S.filters.membersSector === c.k ? 'on' : ''}" onclick="setMembersSector('${c.k}')">${c.l}</button>`
  ).join('');

  // فلترة
  let list = S.members.map(m => {
    const full = computeMemberFull(m.id);
    return { member: m, full };
  });

  // ⭐⭐ قيود المعتمد — يرى فقط المشتركين في صندوقه/قطاعه ⭐⭐
  if(S.currentUser && S.currentUser.role === 'collector'){
    const cf = S.currentUser.collectFund;
    if(cf === 'assoc'){
      list = list.filter(x => x.member.assocStartYear);
    } else if(cf === 'death'){
      list = list.filter(x => x.member.deathStartYear);
    } else {
      list = list.filter(x => x.member.assocStartYear || x.member.deathStartYear);
    }
    const sec = S.currentUser.sector;
    if(sec) list = list.filter(x => x.member.sector === sec);
  }

  if(S.filters.members === 'assoc') list = list.filter(x => x.member.assocStartYear && !x.member.deathStartYear);
  if(S.filters.members === 'death') list = list.filter(x => x.member.deathStartYear && !x.member.assocStartYear);
  if(S.filters.members === 'both') list = list.filter(x => x.member.assocStartYear && x.member.deathStartYear);
  if(S.filters.members === 'late') list = list.filter(x => x.full && x.full.total.totalRem > 0);
  if(S.filters.members === 'none') list = list.filter(x => !x.member.assocStartYear && !x.member.deathStartYear);

  if(S.filters.membersSector !== 'all') list = list.filter(x => x.member.sector === S.filters.membersSector);

  if(S.search){
    const s = normAr(S.search);
    list = list.filter(x => normAr(`${x.member.name} ${x.member.code || ''} ${x.member.phone || ''}`).includes(s));
  }

  list.sort((a,b) => {
    const ra = a.full?.total.totalRem || 0;
    const rb = b.full?.total.totalRem || 0;
    if(ra !== rb) return rb - ra;
    return String(a.member.name).localeCompare(String(b.member.name),'ar');
  });

  const el = $('membersContent');
  if(!list.length){ el.innerHTML = `<div class="empty"><span class="ico">👥</span><h3>لا يوجد أعضاء</h3><p>أضف عضواً أو استورد ملف Excel</p></div>`; return; }

  el.innerHTML = `<div class="list">${list.slice(0, 300).map(({member, full}) => {
    const icons = [];
    if(member.assocStartYear) icons.push('💰');
    if(member.deathStartYear) icons.push('⚰️');
    const rem = full?.total.totalRem || 0;
    const hasUnpaid = rem > 0;

    return `<div class="item" onclick="openMemberDetail(${member.id})">
      <div class="av ${hasUnpaid ? 'red' : 'green'}">${icons.join('') || '⭐'}</div>
      <div class="body">
        <div class="ttl">${esc(member.name)}${member.memberType === 'مخفض' ? ' 🎓' : ''}</div>
        <div class="sub">${esc(member.code||'')} • ${esc(member.sector||'')} ${hasUnpaid ? '• متبقي ' + fmtShort(rem) : '• ✅'}</div>
      </div>
      <div style="text-align:left">
        ${hasUnpaid ? `<div style="font-weight:800;color:var(--danger);font-size:13px">${fmtShort(rem)}</div><div style="font-size:10px;color:var(--muted)">متبقي</div>` : `<div style="color:var(--success);font-size:16px">✅</div>`}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function openMemberDetail(id){
  const full = computeMemberFull(id);
  if(!full) return;
  const m = full.member;

  const body = `
    <div style="padding:16px;background:linear-gradient(135deg, var(--primary), var(--primary-2));color:#fff;border-radius:14px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0">${m.gender === 'أنثى' ? '👩' : '👨'}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:17px">${esc(m.name)}</div>
          <div style="font-size:12px;opacity:.9;margin-top:3px">${esc(m.code||'')} • ${esc(m.sector||'')}</div>
          <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
            ${m.assocStartYear ? `<span style="background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800">💰 منذ ${m.assocStartYear}</span>` : ''}
            ${m.deathStartYear ? `<span style="background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800">⚰️ منذ ${m.deathStartYear}</span>` : ''}
            ${m.memberType ? `<span style="background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800">${m.memberType === 'مخفض' ? '🎓 مخفض' : '👤 عادي'}</span>` : ''}
          </div>
        </div>
      </div>
    </div>

    <div style="padding:14px;background:var(--bg);border-radius:12px;margin-bottom:14px;text-align:center">
      <div style="font-size:11px;color:var(--muted);font-weight:700">إجمالي المتبقي</div>
      <div style="font-size:28px;font-weight:800;color:${full.total.totalRem > 0 ? 'var(--danger)' : 'var(--success)'};margin-top:4px">${fmtNum(full.total.totalRem)} ل.س</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">دُفع ${fmtNum(full.total.totalPaid)} من ${fmtNum(full.total.totalReq)}</div>
    </div>

    ${hasPerm('payment.add') ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      ${m.assocStartYear ? `<button class="btn assoc" onclick="closeSheet();setTimeout(()=>openPaymentSheet(${id},'assoc'),150)">💰 دفعة جمعية</button>` : ''}
      ${m.deathStartYear ? `<button class="btn death" onclick="closeSheet();setTimeout(()=>openPaymentSheet(${id},'death'),150)">⚰️ دفعة وفاة</button>` : ''}
    </div>` : ''}

    <div style="font-weight:800;font-size:14px;margin:16px 0 10px">📊 سجل الالتزامات</div>
    ${full.years.map(yr => `
      <div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:10px">
        <div style="font-weight:800;font-size:14px;margin-bottom:8px">📅 ${yr.year}</div>
        ${yr.assoc.req > 0 ? `
          <div style="padding:8px;background:var(--card);border-radius:8px;margin-bottom:6px">
            <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--assoc);margin-bottom:4px"><span>💰 الجمعية</span><span>${fmtNum(yr.assoc.paid)} / ${fmtNum(yr.assoc.req)}</span></div>
            <div class="progress assoc"><div style="width:${yr.assoc.req > 0 ? Math.min(100, Math.round(yr.assoc.paid/yr.assoc.req*100)) : 0}%"></div></div>
            ${yr.assoc.req - yr.assoc.paid > 0 ? `<div style="font-size:11px;color:var(--danger);margin-top:4px">متبقي: ${fmtNum(yr.assoc.req - yr.assoc.paid)}</div>` : '<div style="font-size:11px;color:var(--success);margin-top:4px">✅ مسدَّد</div>'}
          </div>
        ` : ''}
        ${yr.death.req > 0 ? `
          <div style="padding:8px;background:var(--card);border-radius:8px">
            <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--death);margin-bottom:4px"><span>⚰️ الوفاة</span><span>${fmtNum(yr.death.paid)} / ${fmtNum(yr.death.req)}</span></div>
            <div class="progress death"><div style="width:${yr.death.req > 0 ? Math.min(100, Math.round(yr.death.paid/yr.death.req*100)) : 0}%"></div></div>
            ${yr.death.req - yr.death.paid > 0 ? `<div style="font-size:11px;color:var(--danger);margin-top:4px">متبقي: ${fmtNum(yr.death.req - yr.death.paid)}</div>` : '<div style="font-size:11px;color:var(--success);margin-top:4px">✅ مسدَّد</div>'}

    </div>
  `;
  openSheet('👤 ' + m.name, body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide:true });
}

function showMemberPayments(memberId){
  const m = getMemberById(memberId);
  const list = S.payments.filter(p => p.memberId === memberId).sort((a,b) => (b.date||'').localeCompare(a.date||''));

  const body = list.length ? `<div class="list">${list.map(p => `
    <div class="item" style="cursor:default">
      <div class="av ${p.fund === 'death' ? 'red' : p.fund === 'donation' ? 'green' : 'blue'}">${p.fund === 'death' ? '⚰️' : p.fund === 'donation' ? '💚' : '💰'}</div>
      <div class="body"><div class="ttl">${fmtNum(p.amount)} ل.س</div><div class="sub">${p.fund === 'death' ? 'وفاة' : p.fund === 'donation' ? 'تبرع' : 'جمعية'} • ${fmtDate(p.date)} • ${esc(p.collectorName || '')}</div></div>
    </div>
  `).join('')}</div>` : '<div style="text-align:center;padding:30px;color:var(--muted)">لا توجد دفعات</div>';

  openSheet('📜 دفعات ' + m.name, body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide:true });
}

function openMemberSheet(id = null){
  if(!hasPerm('member.manage')){ toast('غير مصرح','error'); return; }
  const isNew = !id;
  const m = isNew ? { gender:'ذكر', status:'حي', relation:'رب أسرة', memberType:'عادي' } : S.members.find(x => x.id === id);

  const body = `

    <div class="fld"><label>الاسم الكامل <span class="req">*</span></label><input id="mName" value="${esc(m.name||'')}"></div>

      <div class="fld"><label>الجنس</label><select id="mGender"><option ${m.gender === 'ذكر' ? 'selected' : ''}>ذكر</option><option ${m.gender === 'أنثى' ? 'selected' : ''}>أنثى</option></select></div>
      <div class="fld"><label>الحالة</label><select id="mStatus">${['حي','متوفى','مسافر','غير معروف'].map(s => `<option ${m.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
    </div>

      <div class="fld"><label>الميلاد</label><input id="mBirth" type="date" value="${esc(m.birth||'')}"></div>
      <div class="fld"><label>القطاع</label><select id="mSector"><option value="">—</option>${sectorOpts}</select></div>
    </div>
    <div class="fld-row">
      <div class="fld"><label>الصلة</label><select id="mRelation">${['رب أسرة','زوجة','زوج','ابن','بنت','أب','أم','أخ','أخت','جد','جدة','حفيد','حفيدة','أخرى'].map(r => `<option ${m.relation === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
      <div class="fld"><label>الهاتف</label><input id="mPhone" value="${esc(m.phone||'')}" inputmode="tel"></div>
    </div>

    <div style="background:var(--assoc-soft);padding:12px;border-radius:12px;margin:14px 0">
      <div style="font-weight:800;font-size:13px;color:var(--assoc);margin-bottom:10px">💰 اشتراك الجمعية</div>
      <div class="fld-row">
        <div class="fld"><label>سنة بدء الاشتراك</label><input id="mAssocYear" type="tel" inputmode="numeric" value="${m.assocStartYear||''}" placeholder="اتركه فارغاً = غير مشترك" maxlength="4"></div>
        <div class="fld"><label>الحالة</label>
          <select id="mAssocActive" onchange="toggleAssocYear()">
            <option value="no" ${!m.assocStartYear ? 'selected' : ''}>غير مشترك</option>
            <option value="yes" ${m.assocStartYear ? 'selected' : ''}>مشترك</option>
          </select>
        </div>
      </div>
    </div>

    <div style="background:var(--death-soft);padding:12px;border-radius:12px;margin:14px 0">
      <div style="font-weight:800;font-size:13px;color:var(--death);margin-bottom:10px">⚰️ اشتراك الوفاة</div>
      <div class="fld-row">
        <div class="fld"><label>سنة بدء الاشتراك</label><input id="mDeathYear" type="tel" inputmode="numeric" value="${m.deathStartYear||''}" placeholder="اتركه فارغاً = غير مشترك" maxlength="4"></div>
        <div class="fld"><label>الحالة</label>
          <select id="mDeathActive" onchange="toggleDeathYear()">
            <option value="no" ${!m.deathStartYear ? 'selected' : ''}>غير مشترك</option>
            <option value="yes" ${m.deathStartYear ? 'selected' : ''}>مشترك</option>
          </select>
        </div>
      </div>
    </div>

    <div class="fld"><label>نوع العضو (يؤثر على الرسوم)</label>
      <select id="mType"><option value="عادي" ${m.memberType === 'عادي' ? 'selected' : ''}>عادي</option><option value="مخفض" ${m.memberType === 'مخفض' ? 'selected' : ''}>مخفض (طلاب/دخل محدود)</option></select>
    </div>

    <div class="fld"><label>ملاحظات</label><textarea id="mNotes">${esc(m.notes||'')}</textarea></div>
  `;

  const foot = isNew
    ? `<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn primary" onclick="saveMember()">💾 حفظ</button>`
    : `<button class="btn danger sm" onclick="deleteMember(${id})">🗑️</button><button class="btn primary" onclick="saveMember(${id})">💾 حفظ</button>`;

  openSheet(isNew ? '➕ عضو جديد' : '✏️ ' + esc(m.name), body, foot, { focus:'mName' });
  setTimeout(() => { toggleAssocYear(); toggleDeathYear(); }, 50);
}

function toggleAssocYear(){
  const active = $('mAssocActive').value === 'yes';
  $('mAssocYear').disabled = !active;
  if(!active) $('mAssocYear').value = '';
}
function toggleDeathYear(){
  const active = $('mDeathActive').value === 'yes';
  $('mDeathYear').disabled = !active;
  if(!active) $('mDeathYear').value = '';
}

async function saveMember(id = null){
  const name = cleanText($('mName').value);
  if(!name){ toast('الاسم مطلوب','error'); return; }

  const assocActive = $('mAssocActive').value === 'yes';
  const deathActive = $('mDeathActive').value === 'yes';
  const assocYear = assocActive ? Number($('mAssocYear').value) : null;
  const deathYear = deathActive ? Number($('mDeathYear').value) : null;

  if(assocActive && (!assocYear || assocYear < 2000 || assocYear > 2100)){ toast('سنة اشتراك الجمعية غير صحيحة','error'); return; }
  if(deathActive && (!deathYear || deathYear < 2000 || deathYear > 2100)){ toast('سنة اشتراك الوفاة غير صحيحة','error'); return; }

  try{
    const old = id ? await dbGet('members', id) : null;
    const obj = {
      code: cleanText($('mCode').value),
      familyCode: cleanText($('mFamily').value),
      name,
      gender: $('mGender').value,
      status: $('mStatus').value,
      birth: $('mBirth').value,
      sector: $('mSector').value,
      relation: $('mRelation').value,
      phone: cleanPhone($('mPhone').value),
      assocStartYear: assocYear,
      deathStartYear: deathYear,
      memberType: $('mType').value,
      notes: cleanText($('mNotes').value),
      createdAt: old ? old.createdAt : new Date().toISOString()
    };
    if(id){
      obj.id = id;
      await dbPut('members', obj);
      const i = S.members.findIndex(x => x.id === id);
      if(i > -1) S.members[i] = obj;
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('members', obj);
      obj.id = newId;
      S.members.push(obj);
      toast('✅ تمت الإضافة');
    }
    closeSheet();
    renderMembers();
    if(S.page === 'pg-home') renderHome();
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function deleteMember(id){
  if(!confirm('حذف هذا العضو؟')) return;
  if(!confirm('سيتم الحذف نهائياً. متابعة؟')) return;
  try{
    await dbDel('members', id);
    S.members = S.members.filter(x => x.id !== id);
    toast('🗑️ تم الحذف');
    closeSheet();
    renderMembers();
  } catch(e){ toast('خطأ','error'); }
}

/* ═══════════════════════════════════════════════════════
   الدفعات
   ═══════════════════════════════════════════════════════ */
function setPaymentsFilter(k){ S.filters.payments = k; renderPayments(); }

function renderPayments(){
  const y = S.currentYear;
  const yearPayments = S.payments.filter(p => p.year === y);

  $('paymentsStats').innerHTML = `
    <div class="stat assoc"><div class="val">${yearPayments.filter(p => p.fund === 'assoc').length}</div><div class="lbl">💰 جمعية</div></div>
    <div class="stat death"><div class="val">${yearPayments.filter(p => p.fund === 'death').length}</div><div class="lbl">⚰️ وفاة</div></div>
    <div class="stat donation"><div class="val">${yearPayments.filter(p => p.fund === 'donation').length}</div><div class="lbl">💚 تبرعات</div></div>
    <div class="stat blue"><div class="val">${yearPayments.length}</div><div class="lbl">📝 الإجمالي</div></div>
  `;

  const chips = [
    { k:'all', l:'📊 الكل' },
    { k:'assoc', l:'💰 جمعية' },
    { k:'death', l:'⚰️ وفاة' },
    { k:'donation', l:'💚 تبرعات' }
  ];
  $('paymentsChips').innerHTML = chips.map(c => 
    `<button class="chip ${S.filters.payments === c.k ? 'on' : ''}" onclick="setPaymentsFilter('${c.k}')">${c.l}</button>`
  ).join('');

  const filter = S.filters.payments || 'all';
  let list = filter === 'all' ? yearPayments : yearPayments.filter(p => p.fund === filter);

  if(S.search){
    const s = normAr(S.search);
    list = list.filter(p => {
      const m = p.memberId ? getMemberById(p.memberId) : null;
      return normAr(`${m?.name || ''} ${p.notes || ''}`).includes(s);
    });
  }

  list.sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
  list = list.slice(0, 300);

  const el = $('paymentsContent');
  if(!list.length){ el.innerHTML = `<div class="empty"><span class="ico">💰</span><h3>لا توجد دفعات في ${y}</h3></div>`; return; }

  el.innerHTML = `<div class="list">${list.map(p => {
    const m = p.memberId ? getMemberById(p.memberId) : null;
    const name = m?.name || p.notes || 'دفعة';
    let icon = '💰', color = 'blue';
    if(p.fund === 'death'){ icon = '⚰️'; color = 'red'; }
    else if(p.fund === 'donation'){ icon = '💚'; color = 'green'; }

    return `<div class="item" onclick="openPaymentDetail(${p.id})">
      <div class="av ${color}">${icon}</div>
      <div class="body">
        <div class="ttl">${esc(name)}</div>
        <div class="sub">${fmtNum(p.amount)} ل.س • ${fmtDate(p.date)} • ${esc(p.collectorName||'')}</div>
      </div>
      <span class="trail">›</span>
    </div>`;
  }).join('')}</div>`;
}

function openPaymentDetail(id){
  const p = S.payments.find(x => x.id === id);
  if(!p) return;
  const m = p.memberId ? getMemberById(p.memberId) : null;
  const canEdit = hasPerm('payment.edit');
  const canDelete = hasPerm('payment.edit');

  const fundLabel = p.fund === 'death' ? 'دفعة وفاة' : p.fund === 'donation' ? 'تبرع' : 'دفعة جمعية';

  const body = `
    <div style="padding:14px;background:var(--primary-soft);border-radius:12px;margin-bottom:14px;text-align:center">
      <div style="font-size:32px;margin-bottom:6px">${p.fund === 'death' ? '⚰️' : p.fund === 'donation' ? '💚' : '💰'}</div>
      <div style="font-weight:800;font-size:16px">${esc(m?.name || p.notes || 'دفعة')}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${fundLabel}</div>
    </div>
    <div class="balance-block">
      <div class="balance-row"><span class="lbl">💰 المبلغ</span><span class="val green">${fmtNum(p.amount)} ل.س</span></div>
      <div class="balance-row"><span class="lbl">📅 التاريخ</span><span class="val">${fmtDate(p.date)}</span></div>
      <div class="balance-row"><span class="lbl">📅 السنة</span><span class="val">${p.year}</span></div>
      <div class="balance-row"><span class="lbl">👤 المعتمد</span><span class="val">${esc(p.collectorName||'—')}</span></div>
      ${p.notes ? `<div class="balance-row"><span class="lbl">📝 ملاحظات</span><span class="val">${esc(p.notes)}</span></div>` : ''}
      <div class="balance-row"><span class="lbl">🕐 التسجيل</span><span class="val" style="font-size:11px">${p.createdAt ? new Date(p.createdAt).toLocaleString('ar-EG') : '—'}</span></div>
    </div>
  `;

  const btns = [];
  if(canEdit) btns.push(`<button class="btn warning" onclick="closeSheet();setTimeout(()=>openPaymentForm(${id}),150)">✏️ تعديل</button>`);
  if(canDelete) btns.push(`<button class="btn danger" onclick="deletePayment(${id})">🗑️ حذف</button>`);
  btns.push(`<button class="btn ghost" onclick="closeSheet()">إغلاق</button>`);

  openSheet('📄 تفاصيل الدفعة', body, btns.join(''), { wide:true });
}

function openPaymentForm(id = null){
  if(!hasPerm('payment.edit')){ toast('غير مصرح','error'); return; }
  const p = id ? S.payments.find(x => x.id === id) : null;
  if(!p) return;

  const body = `
    <div class="fld"><label>المبلغ (يمكن 0)</label>
      <div class="amount-input"><input id="edAmount" type="tel" inputmode="numeric" value="${p.amount}"><span class="currency">ل.س</span></div>
    </div>
    <div class="fld-row">
      <div class="fld"><label>التاريخ</label><input id="edDate" type="date" value="${p.date}"></div>
      <div class="fld"><label>السنة</label><select id="edYear">${[2025,2026,2027,2028,2029].map(y => `<option value="${y}" ${y===p.year?'selected':''}>${y}</option>`).join('')}</select></div>
    </div>
    <div class="fld"><label>ملاحظات</label><textarea id="edNotes">${esc(p.notes||'')}</textarea></div>
  `;

  const foot = `<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn primary" onclick="savePaymentEdit(${id})">💾 حفظ</button>`;
  openSheet('✏️ تعديل دفعة', body, foot);
}

async function savePaymentEdit(id){
  const amount = Number($('edAmount').value);
  const date = $('edDate').value;
  const year = Number($('edYear').value);
  const notes = cleanText($('edNotes').value);

  if(isNaN(amount) || amount < 0){ toast('المبلغ غير صحيح','error'); return; }
  if(!date){ toast('التاريخ مطلوب','error'); return; }

  try{
    const p = S.payments.find(x => x.id === id);
    if(!p) return;
    const old = { ...p };
    p.amount = amount; p.date = date; p.year = year; p.notes = notes;
    p.editedBy = S.currentUser.name;
    p.editedAt = new Date().toISOString();
    await dbPut('payments', p);
    await logAudit('update', 'payment', id, { old: { amount: old.amount, date: old.date }, new: { amount, date } });
    toast('✅ تم التعديل');
    closeSheet();
    renderPayments();
    if(S.page === 'pg-home') renderHome();
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function deletePayment(id){
  if(!hasPerm('payment.edit')){ toast('غير مصرح','error'); return; }
  if(!confirm('⚠️ حذف هذه الدفعة نهائياً؟')) return;
  if(!confirm('تأكيد أخير!')) return;
  try{
    const p = S.payments.find(x => x.id === id);
    await dbDel('payments', id);
    S.payments = S.payments.filter(x => x.id !== id);
    await logAudit('delete', 'payment', id, { amount: p?.amount });
    toast('🗑️ تم الحذف');
    closeSheet();
    renderPayments();
    if(S.page === 'pg-home') renderHome();
  } catch(e){ toast('خطأ','error'); }
}

function openPaymentSheet(memberId = null, fund = null){
  if(!hasPerm('payment.add')){ toast('غير مصرح','error'); return; }

  if(fund && memberId){
    openFundPaymentForm(fund, memberId);
    return;
  }

  const body = `
    <div style="text-align:center;padding:14px 0 18px">
      <div style="font-size:44px;margin-bottom:8px">💰</div>
      <div style="font-weight:800;font-size:15px">اختر نوع الدفعة</div>
    </div>
    <div style="display:grid;gap:10px">
      <button class="quick-btn assoc" style="padding:18px;flex-direction:row;justify-content:flex-start;gap:14px;text-align:right" onclick="closeSheet();setTimeout(()=>openFundPaymentForm('assoc',${memberId||'null'}),150)">
        <div style="font-size:32px">💰</div><div style="flex:1"><div style="font-weight:800;font-size:14px;color:var(--assoc)">دفعة جمعية</div><div style="font-size:11px;color:var(--muted)">اشتراك سنوي</div></div>
      </button>
      <button class="quick-btn death" style="padding:18px;flex-direction:row;justify-content:flex-start;gap:14px;text-align:right" onclick="closeSheet();setTimeout(()=>openFundPaymentForm('death',${memberId||'null'}),150)">
        <div style="font-size:32px">⚰️</div><div style="flex:1"><div style="font-weight:800;font-size:14px;color:var(--death)">دفعة وفاة</div><div style="font-size:11px;color:var(--muted)">أقساط الوفيات</div></div>
      </button>
      <button class="quick-btn donation" style="padding:18px;flex-direction:row;justify-content:flex-start;gap:14px;text-align:right" onclick="closeSheet();setTimeout(()=>openFundPaymentForm('donation',${memberId||'null'}),150)">
        <div style="font-size:32px">💚</div><div style="flex:1"><div style="font-weight:800;font-size:14px;color:var(--donation)">تبرع</div><div style="font-size:11px;color:var(--muted)">تبرع اختياري</div></div>
      </button>
    </div>
  `;
  openSheet('💰 تسجيل دفعة', body, '<button class="btn ghost" onclick="closeSheet()">إلغاء</button>');
}

function openFundPaymentForm(fund, memberId){
  const year = S.currentYear;
  const labels = { assoc:{ icon:'💰', name:'دفعة جمعية', color:'var(--assoc)' }, death:{ icon:'⚰️', name:'دفعة وفاة', color:'var(--death)' }, donation:{ icon:'💚', name:'تبرع', color:'var(--donation)' } };
  const L = labels[fund];

  const showSearch = fund !== 'donation';

  const body = `
    <div style="padding:14px;background:var(--bg);border-radius:14px;margin-bottom:14px;text-align:center;border:2px solid ${L.color}">
      <div style="font-size:32px">${L.icon}</div>
      <div style="font-size:15px;font-weight:800;color:${L.color};margin-top:4px">${L.name}</div>
    </div>
    ${showSearch ? `
      <div class="fld" style="position:relative">
        <label>العضو <span class="req">*</span></label>
        <input id="pMemberInput" placeholder="اكتب اسم العضو..." oninput="onMemberSearch('${fund}')" onfocus="onMemberSearch('${fund}')" autocomplete="off">
        <input type="hidden" id="pMemberId" value="${memberId || ''}">
        <div class="options-list" id="pMemberOptions"></div>
      </div>
    ` : `
      <div class="fld"><label>اسم المتبرع</label><input id="pDonorName" placeholder="اختياري"></div>
    `}
    <div id="pDuesBox" style="display:none;margin-bottom:14px"></div>
    <div class="fld" id="pAmountField" style="display:none">
      <label>المبلغ (يمكن 0 للأعضاء المعفيين)</label>
      <div class="amount-input" style="border-color:${L.color}">
        <input id="pAmount" type="tel" inputmode="numeric" placeholder="0" style="color:${L.color}">
        <span class="currency">ل.س</span>
      </div>
      <div class="amount-quick" id="pQuickButtons"></div>
    </div>
    <div class="fld-row" id="pDateRow" style="display:none">
      <div class="fld"><label>التاريخ</label><input id="pDate" type="date" value="${today()}"></div>
      <div class="fld"><label>السنة</label><select id="pYear">${[2025,2026,2027,2028,2029].map(y => `<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}</select></div>
    </div>
    <div class="fld" id="pNotesField" style="display:none"><label>ملاحظات</label><input id="pNotes" placeholder="اختياري"></div>
  `;

  const foot = `<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn primary" onclick="savePayment('${fund}')">💾 حفظ</button>`;
  openSheet(`${L.icon} ${L.name}`, body, foot, { focus: showSearch ? 'pMemberInput' : 'pDonorName' });
  window._currentFund = fund;

  if(fund === 'donation'){
    $('pAmountField').style.display = 'block';
    $('pDateRow').style.display = 'grid';
    $('pNotesField').style.display = 'block';
    $('pQuickButtons').innerHTML = `<button onclick="$('pAmount').value=5000">5,000</button><button onclick="$('pAmount').value=10000">10,000</button><button onclick="$('pAmount').value=50000">50,000</button><button onclick="$('pAmount').value=100000">100,000</button>`;
  } else if(memberId){
    const m = getMemberById(memberId);
    if(m){ $('pMemberInput').value = m.name; $('pMemberId').value = m.id; showMemberDuesInForm(fund, m.id); }
  }
}

function onMemberSearch(fund){
  const input = $('pMemberInput');
  const opts = $('pMemberOptions');
  if(!input || !opts) return;
  const q = input.value.trim();
  const isAssoc = fund === 'assoc';
  const isDeath = fund === 'death';

  let list = S.members.filter(m => {
    if(isAssoc) return m.assocStartYear;
    if(isDeath) return m.deathStartYear;
    return false;
  });

  // ⭐ المعتمد يرى فقط قطاعه
  if(S.currentUser && S.currentUser.role === 'collector' && S.currentUser.sector){
    list = list.filter(m => m.sector === S.currentUser.sector);
  }

  if(q){
    const s = normAr(q);
    list = list.filter(m => normAr(`${m.name} ${m.code||''} ${m.sector||''}`).includes(s));
  }
  list = list.slice(0, 30);

  if(!list.length){
    opts.innerHTML = `<div style="padding:12px;color:var(--muted);font-size:13px;text-align:center">${q ? '⚠️ لا نتائج' : 'اكتب اسماً'}</div>`;
  } else {
    opts.innerHTML = list.map(m => {
      const full = computeMemberFull(m.id);
      const data = isAssoc ? full?.total.assocRem : full?.total.deathRem;
      const rem = data || 0;
      return `<div class="option-item" onclick="selectPaymentMember(${m.id},'${esc(m.name).replace(/'/g,"&#39;")}')">
        <div style="flex:1;min-width:0"><div style="font-weight:700">${esc(m.name)}</div><div style="font-size:10px;color:var(--muted)">${esc(m.code||'')} • ${esc(m.sector||'')}</div></div>
        <small style="color:${rem > 0 ? 'var(--danger)' : 'var(--success)'};font-weight:700">${rem > 0 ? 'متبقي ' + fmtShort(rem) : '✅'}</small>
      </div>`;
    }).join('');
  }
  opts.classList.add('on');
}

function selectPaymentMember(id, name){
  $('pMemberInput').value = name;
  $('pMemberId').value = id;
  $('pMemberOptions').classList.remove('on');
  showMemberDuesInForm(window._currentFund, id);
}

function showMemberDuesInForm(fund, memberId){
  const m = getMemberById(memberId);
  if(!m) return;
  const full = computeMemberFull(memberId);
  if(!full) return;

  const isAssoc = fund === 'assoc';
  const fundColor = isAssoc ? 'var(--assoc)' : 'var(--death)';
  const fundIcon = isAssoc ? '💰' : '⚰️';
  const rem = isAssoc ? full.total.assocRem : full.total.deathRem;
  const req = isAssoc ? full.total.assocReq : full.total.deathReq;
  const paid = isAssoc ? full.total.assocPaid : full.total.deathPaid;

  const html = `
    <div style="padding:14px;background:var(--bg);border-radius:12px;border:2px solid ${fundColor}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div><div style="font-weight:800;font-size:15px">${esc(m.name)}</div><div style="font-size:11px;color:var(--muted)">${esc(m.code||'')} • ${esc(m.sector||'')}</div></div>
        <div style="font-size:24px">${fundIcon}</div>
      </div>
      <div style="padding:8px;background:var(--card);border-radius:8px">
        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span class="muted">إجمالي المطلوب</span><b>${fmtNum(req)}</b></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span class="muted">المدفوع</span><b style="color:var(--success)">${fmtNum(paid)}</b></div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:2px solid ${fundColor};margin-top:4px"><span style="font-weight:800">المتبقي</span><b style="font-weight:800;color:${rem > 0 ? 'var(--danger)' : 'var(--success)'}">${fmtNum(rem)} ل.س</b></div>
      </div>
    </div>
  `;

  $('pDuesBox').innerHTML = html;
  $('pDuesBox').style.display = 'block';

async function savePayment(fund){
  const isDonation = fund === 'donation';
  const memberId = isDonation ? null : Number($('pMemberId').value);
  const amount = Number($('pAmount').value);
  const date = $('pDate').value;
  const year = Number($('pYear').value);
  const notes = $('pNotes')?.value?.trim() || '';
  const donorName = isDonation ? ($('pDonorName')?.value?.trim() || '') : '';

  if(!isDonation && !memberId){ toast('اختر العضو','error'); return; }
  if(isNaN(amount) || amount < 0){ toast('المبلغ غير صحيح','error'); return; }
  if(!date){ toast('التاريخ مطلوب','error'); return; }

  if(amount === 0){
    if(!confirm('هل أنت متأكد من تسجيل دفعة بقيمة 0؟ (للأعضاء المعفيين)')) return;
  }

  showLoad(true);
  try{
    const payment = {
      memberId,
      fund,
      amount,
      date,
      year,
      forYear: year,
      notes: isDonation ? (donorName + (notes ? ' | ' + notes : '')) : notes,
      collectorId: S.currentUser.id,
      collectorName: S.currentUser.name,
      createdAt: new Date().toISOString()
    };
    const id = await dbPut('payments', payment);
    payment.id = id;
    S.payments.push(payment);

    await logAudit('add', 'payment', id, { fund, memberId, amount });
    toast('✅ تم تسجيل الدفعة', 'success', 2500);
    closeSheet();
    if(S.page === 'pg-home') renderHome();
    if(S.page === 'pg-members') renderMembers();
    if(S.page === 'pg-payments') renderPayments();
  } catch(e){ console.error(e); toast('خطأ: ' + e.message, 'error'); }
  showLoad(false);
}

async function logAudit(action, target, targetId, details = {}){
  try{
    const entry = {
      timestamp: new Date().toISOString(),
      userId: S.currentUser ? S.currentUser.id : null,
      userName: S.currentUser ? S.currentUser.name : 'system',
      action, target, targetId, details
    };
    await dbPut('auditLog', entry);
    S.auditLog.push(entry);
  } catch(e){ console.warn(e); }
}

function searchDeathMember(){
  const input = $('dMemberInput');
  const opts = $('dMemberOptions');
  if(!input || !opts) return;
  const q = input.value.trim();
  if(q.length < 1){ opts.classList.remove('on'); return; }

  const s = normAr(q);
  const list = S.members.filter(m => normAr(m.name).includes(s) || normAr(m.code||'').includes(s)).slice(0, 20);

  if(!list.length){ opts.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:13px;text-align:center">لا نتائج</div>'; opts.classList.add('on'); return; }

  opts.innerHTML = list.map(m => `
    <div class="option-item" onclick="pickDeathMember(${m.id},'${esc(m.name).replace(/'/g,"&#39;")}')">
      <div style="flex:1;min-width:0"><div style="font-weight:700">${esc(m.name)}</div><div style="font-size:10px;color:var(--muted)">${esc(m.code||'')} • ${esc(m.sector||'')}</div></div>
    </div>
  `).join('');
  opts.classList.add('on');
}

async function saveDeath(){
  const name = cleanText($('dName').value);
  const date = $('dDate').value;
  const year = Number($('dYear').value);
  const comp = Number($('dComp').value) || 0;
  const recipient = cleanText($('dRecipient').value);
  const notes = cleanText($('dNotes').value);
  const memberId = $('dMemberId').value ? Number($('dMemberId').value) : null;

  if(!name){ toast('اسم المتوفى مطلوب','error'); return; }
  if(!date){ toast('التاريخ مطلوب','error'); return; }

  const deathSubs = S.members.filter(m => m.deathStartYear && m.deathStartYear <= year).length;
  const c = getConstants(year);
  const inst = c?.deathInstallment || 5000;
  const totalImpact = deathSubs * inst;

  if(!confirm(`⚰️ تسجيل وفاة "${name}"\n\nعدد مشتركي الوفاة: ${deathSubs}\nسيُضاف قسط ${fmtNum(inst)} × ${deathSubs} = ${fmtNum(totalImpact)} ل.س على مستحقاتهم.\n\nمتابعة؟`)) return;

  try{
    const death = {
      deceasedName: name,
      memberId,
      deathDate: date,
      year,
      compensation: comp,
      recipient,
      notes,
      recordedBy: S.currentUser.id,
      recordedByName: S.currentUser.name,
      createdAt: new Date().toISOString()
    };
    const id = await dbPut('deaths', death);
    death.id = id;
    S.deaths.push(death);
    await logAudit('add', 'death', id, { name, year, comp });

    toast(`⚰️ تم تسجيل الوفاة (${deathSubs} قسط)`, 'success', 4000);
    closeSheet();
    if(S.page === 'pg-home') renderHome();
    if(S.page === 'pg-members') renderMembers();
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}
