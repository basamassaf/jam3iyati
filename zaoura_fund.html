function setPaymentsFilter(k){ S.filters.payments = k; renderPayments(); }

function renderPayments(){
  const year = S.currentYear;
  const summary = getFinancialSummary(year);

  $('paymentsStats').innerHTML = `
    <div class="stat assoc"><div class="val">${fmtShort(summary.assoc.income + summary.assoc.joins)}</div><div class="lbl">💰 جمعية</div></div>
    <div class="stat death"><div class="val">${fmtShort(summary.death.income + summary.death.joins)}</div><div class="lbl">⚰️ وفاة</div></div>
    <div class="stat donation"><div class="val">${fmtShort(summary.assoc.donations)}</div><div class="lbl">💚 تبرعات</div></div>
    <div class="stat orange"><div class="val">${S.assocPayments.filter(p => p.year === year).length}</div><div class="lbl">📝 دفعات</div></div>
  `;

  const chips = [
    { k:'assoc', l:'💰 جمعية' }, { k:'death', l:'⚰️ وفاة' },
    { k:'join', l:'📋 انضمام' }, { k:'donation', l:'💚 تبرعات' }
  ];
  $('paymentsChips').innerHTML = chips.map(c =>
    `<button class="chip ${S.filters.payments === c.k ? 'on' : ''}" onclick="setPaymentsFilter('${c.k}')">${c.l}</button>`
  ).join('');

  const el = $('paymentsContent');
  const filter = S.filters.payments;
  let list = [];

  if(filter === 'assoc'){
    list = S.assocPayments.filter(p => p.year === year && (!p.fund || p.fund === 'assoc'));
  } else if(filter === 'death'){
    list = S.assocPayments.filter(p => p.year === year && p.fund === 'death');
  } else if(filter === 'join'){
    list = S.assocPayments.filter(p => p.year === year && (p.fund === 'joinAssoc' || p.fund === 'joinDeath'));
  } else if(filter === 'donation'){
    list = S.donations.filter(d => d.year === year);
  }

  list.sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  list = list.slice(0, 200);

  if(!list.length){
    el.innerHTML = `<div class="empty"><span class="ico">💰</span><h3>لا توجد دفعات</h3></div>`;
    return;
  }

  el.innerHTML = `<div class="list">${list.map(p => {
    const isDonation = !p.personId && p.donorName;
    const person = p.personId ? getPersonById(p.personId) : null;
    const name = isDonation ? (p.donorName || 'متبرع') : (person?.name || '—');

    const icon = p.fund === 'death' ? '⚰️' : p.fund === 'joinAssoc' || p.fund === 'joinDeath' ? '📋' : isDonation ? '💚' : '💰';
    const color = p.fund === 'death' ? 'red' : p.fund === 'joinAssoc' || p.fund === 'joinDeath' ? 'orange' : isDonation ? 'green' : 'blue';

    return `<div class="item" style="cursor:default">
      <div class="av ${color}">${icon}</div>
      <div class="body">
        <div class="ttl">${esc(name)}</div>
        <div class="sub">${fmtDate(p.date)} • ${esc(p.collectorName || '')}${p.year ? ' • ' + p.year : ''}</div>
      </div>
      <div style="font-weight:800;font-size:14px;color:var(--${color === 'blue' ? 'assoc' : color === 'red' ? 'death' : color === 'green' ? 'donation' : 'warning'})">
        ${fmtNum(p.amount)}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function openLatePayerSheet(){
  const year = S.currentYear;
  const latePeople = [];

  for(const person of S.people){
    if(!person.joinedAssocYear && !person.joinedDeathYear) continue;
    const dues = computeMemberDues(person.id, year);
    if(!dues) continue;
    if(dues.total.remaining > 0){
      latePeople.push({ person, dues });
    }
  }

  latePeople.sort((a,b) => b.dues.total.remaining - a.dues.total.remaining);

  if(!latePeople.length){
    openSheet('⏰ المتأخرون',
      `<div class="empty"><span class="ico">🎉</span><h3>لا يوجد متأخرون!</h3><p>جميع المشتركين سدَّدوا التزاماتهم</p></div>`,
      '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>');

  }

  const totalRemaining = latePeople.reduce((s, p) => s + p.dues.total.remaining, 0);

      <div style="font-size:12px;color:var(--muted);margin-top:4px">عدد المتأخرين: <b>${latePeople.length}</b></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <button class="btn success block" onclick="shareLatePayers()">📱 واتساب</button>

    </div>

    <div class="list">
      ${latePeople.slice(0, 100).map(({person, dues}) => `
        <div class="item" onclick="closeSheet();setTimeout(()=>openSubscriberDetail(${person.id}),150)">
          <div class="av red">⚠️</div>
          <div class="body">
            <div class="ttl">${esc(person.name)}</div>
            <div class="sub">
              ${esc(person.code||'')} • ${esc(person.sector||'')}
              ${dues.assoc.remaining > 0 ? ` • 💰 ${fmtShort(dues.assoc.remaining)}` : ''}
              ${dues.death.remaining > 0 ? ` • ⚰️ ${fmtShort(dues.death.remaining)}` : ''}
              ${(dues.assoc.joinFeeRemaining + dues.death.joinFeeRemaining) > 0 ? ` • 📋 ${fmtShort(dues.assoc.joinFeeRemaining + dues.death.joinFeeRemaining)}` : ''}
            </div>
          </div>

  `;

  openSheet(`⏰ المتأخرون — ${year}`, body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide:true });
}

function shareLatePayers(){
  const year = S.currentYear;
  const latePeople = [];
  for(const person of S.people){
    if(!person.joinedAssocYear && !person.joinedDeathYear) continue;
    const dues = computeMemberDues(person.id, year);
    if(dues && dues.total.remaining > 0){
      latePeople.push({ name: person.name, code: person.code || '', remaining: dues.total.remaining });
    }
  }

  if(!latePeople.length){ toast('لا يوجد متأخرون','success'); return; }

  let txt = `⏰ *قائمة المتأخرين — ${year}*\nعدد: ${latePeople.length}\n\n`;
  latePeople.forEach((p, i) => {
    txt += `${i+1}. ${p.name}${p.code ? ' ('+p.code+')' : ''} — ${fmtNum(p.remaining)} ل.س\n`;
  });
  txt += `\n_صندوق زعورة_`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

/* ═══════════════════════════════════════════════════════
   التقارير
   ═══════════════════════════════════════════════════════ */
function openReport(type){
  const year = S.currentYear;
  if(type === 'assoc') openAssocReport(year);
  else if(type === 'death') openDeathReport(year);
  else if(type === 'donation') openDonationReport(year);
  else if(type === 'sector') openSectorReport(year);
  else if(type === 'late') openLatePayerSheet();
  else if(type === 'yearly') openYearlyReport(year);
  else if(type === 'stats') openStatsSheet();
  else if(type === 'assembly') openAssemblyReport(year);
}

function openAssocReport(year){
  const payments = S.assocPayments.filter(p => p.year === year && (!p.fund || p.fund === 'assoc'));
  const totalAmount = payments.reduce((s, p) => s + (Number(p.amount)||0), 0);
  const uniquePeople = new Set(payments.map(p => p.personId)).size;

  const bySector = {};
  payments.forEach(p => {
    const person = p.personId ? getPersonById(p.personId) : null;
    const sector = person?.sector || 'غير محدد';
    if(!bySector[sector]) bySector[sector] = { total:0, count:0 };
    bySector[sector].total += Number(p.amount) || 0;
    bySector[sector].count++;
  });

  const body = `
    <div style="text-align:center;padding:12px 0 16px">
      <div style="font-size:32px;font-weight:800;color:var(--assoc)">${fmtNum(totalAmount)} ل.س</div>
      <div style="font-size:12px;color:var(--muted)">إجمالي المحصّل في ${year}</div>
    </div>
    <div class="balance-block">
      <div class="balance-row"><span class="lbl">عدد الدفعات</span><span class="val">${payments.length}</span></div>
      <div class="balance-row"><span class="lbl">عدد الدافعين</span><span class="val">${uniquePeople}</span></div>
      <div class="balance-row"><span class="lbl">المتوسط</span><span class="val">${payments.length ? fmtNum(Math.round(totalAmount / payments.length)) : 0}</span></div>
    </div>
    <div style="font-weight:800;font-size:13px;margin:16px 0 10px">📍 حسب القطاع</div>
    <div class="balance-block">
      ${Object.entries(bySector).sort((a,b) => b[1].total - a[1].total).map(([sector, data]) => `
        <div class="balance-row"><span class="lbl">${esc(sector)} (${data.count})</span><span class="val" style="color:var(--assoc)">${fmtNum(data.total)}</span></div>
      `).join('')}
    </div>
  `;
  openSheet(`💰 تقرير الجمعية — ${year}`, body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide:true });
}

function openDeathReport(year){
  const deaths = S.deathEvents.filter(e => e.year === year).sort((a,b) => (a.deathDate||'').localeCompare(b.deathDate||''));
  const installments = S.deathInstallments.filter(i => i.year === year);
  const paid = installments.filter(i => i.status === 'paid').length;
  const pending = installments.length - paid;
  const totalComp = deaths.reduce((s, d) => s + (Number(d.compensation)||0), 0);
  const totalInst = installments.reduce((s, i) => s + (Number(i.amount)||0), 0);
  const totalPaid = installments.filter(i => i.status === 'paid').reduce((s, i) => s + (Number(i.amount)||0), 0);

  txt += `⚰️ *صندوق الوفاة:*\n`;

async function saveConstant(year){
  if(!hasPerm('constants.manage')) return;
  const obj = {
    year,
    assocYearly: Number($('cAssoc').value) || 0,
    assocYearlyReduced: Number($('cAssocRed').value) || 0,
    deathInstallment: Number($('cDeathInst').value) || 0,
    deathCompensation: Number($('cDeathComp').value) || 0,
    joinAssoc: Number($('cJoinAssoc').value) || 0,
    joinAssocReduced: Number($('cJoinAssocRed').value) || 0,
    joinDeath: Number($('cJoinDeath').value) || 0,
    joinDeathReduced: Number($('cJoinDeathRed').value) || 0,
    updatedAt: new Date().toISOString()
  };
  try{
    const existing = S.constants.find(x => x.year === year);
    if(existing){
      obj.id = existing.id;
      await dbPut('constants', obj);
      const i = S.constants.findIndex(x => x.year === year);
      if(i > -1) S.constants[i] = obj;
      toast(`✅ تم تعديل ${year}`);
    } else {
      const newId = await dbPut('constants', obj);
      obj.id = newId;
      S.constants.push(obj);
      toast(`✅ تم إضافة ${year}`);
    }
    logAudit('update', 'constant', year, obj);
    closeSheet();
    setTimeout(openConstantsSheet, 250);
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function deleteConstant(year){
  if(!hasPerm('constants.manage')) return;
  if(!confirm(`حذف ثوابت ${year}؟`)) return;
  try{
    const c = S.constants.find(x => x.year === year);
    if(!c) return;
    await dbDel('constants', c.id);
    S.constants = S.constants.filter(x => x.year !== year);
    toast('🗑️ تم الحذف');
    closeSheet();
    setTimeout(openConstantsSheet, 250);
  } catch(e){ toast('خطأ','error'); }
}

async function saveExpense(id = null){
  const description = cleanText($('expDesc').value);
  const amount = Number($('expAmount').value);
  const date = $('expDate').value;
  const year = Number($('expYear').value);
  const category = $('expCategory').value;
  const notes = cleanText($('expNotes').value);

  if(!description){ toast('الوصف مطلوب','error'); return; }
  if(!amount || amount <= 0){ toast('المبلغ مطلوب','error'); return; }
  if(!date){ toast('التاريخ مطلوب','error'); return; }

  try{
    const old = id ? await dbGet('expenses', id) : null;
    const expense = {
      description, amount, date, year, category, notes,
      createdBy: S.currentUser.id, createdByName: S.currentUser.name,
      updatedAt: new Date().toISOString(),
      createdAt: old ? old.createdAt : new Date().toISOString()
    };
    if(id){
      expense.id = id;
      await dbPut('expenses', expense);
      const i = S.expenses.findIndex(x => x.id === id);
      if(i > -1) S.expenses[i] = expense;
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('expenses', expense);
      expense.id = newId;
      S.expenses.push(expense);
      toast('✅ تم الحفظ');
    }
    logAudit(id ? 'update' : 'add', 'expense', expense.id, { description, amount });
    closeSheet();
    renderHome();
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function saveStoreMovement(){
  const itemId = Number($('stmItemId').value);
  const type = $('stmType').value;
  const quantity = Number($('stmQuantity').value);
  const price = $('stmPrice').value ? Number($('stmPrice').value) : null;
  const date = $('stmDate').value;
  const ref = cleanText($('stmRef').value);
  const notes = cleanText($('stmNotes').value);

  if(!itemId){ toast('اختر المادة','error'); return; }
  if(!quantity || quantity <= 0){ toast('الكمية مطلوبة','error'); return; }

  const item = S.storeItems.find(x => x.id === itemId);
  if(!item) return;

  const oldQty = Number(item.quantity) || 0;
  const newQty = type === 'in' ? oldQty + quantity : oldQty - quantity;

  if(newQty < 0){ toast('⚠️ الكمية غير كافية','error'); return; }

  try{
    const movement = {
      itemId, itemName: item.name, type, quantity,
      unitPrice: price !== null ? price : item.unitPrice,
      date, ref, notes,
      oldQuantity: oldQty, newQuantity: newQty,
      userId: S.currentUser.id, userName: S.currentUser.name,
      createdAt: new Date().toISOString()
    };
    const id = await dbPut('storeMovements', movement);
    movement.id = id;
    S.storeMovements.push(movement);

    item.quantity = newQty;
    if(price !== null && type === 'in') item.unitPrice = price;
    item.updatedAt = new Date().toISOString();
    await dbPut('storeItems', item);

    logAudit('add', 'storeMovement', id, { itemName: item.name, type, quantity });
    toast('✅ تم حفظ الحركة');
    closeSheet();
    renderHome();
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

      <input id="mtAttendees" type="tel" inputmode="numeric" value="${m.attendeesCount||''}"></div>
    <div class="fld"><label>جدول الأعمال</label>
      <textarea id="mtAgenda" rows="3" placeholder="بنود الاجتماع">${esc(m.agenda||'')}</textarea></div>
    <div class="fld"><label>النقاشات</label>
      <textarea id="mtDiscussion" rows="3">${esc(m.discussion||'')}</textarea></div>
    <div class="fld"><label>القرارات</label>
      <textarea id="mtDecisions" rows="3">${esc(m.decisions||'')}</textarea></div>
  `;

  const foot = isNew
    ? `<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn primary" onclick="saveMeeting()">💾 حفظ</button>`
    : `<button class="btn danger sm" onclick="deleteMeeting(${id})">🗑️</button>
       <button class="btn primary" onclick="saveMeeting(${id})">💾 حفظ</button>`;

  openSheet(isNew ? '➕ اجتماع جديد' : '✏️ تعديل اجتماع', body, foot, { focus:'mtTitle' });
}

async function saveMeeting(id = null){
  const title = cleanText($('mtTitle').value);
  if(!title){ toast('العنوان مطلوب','error'); return; }

  try{
    const old = id ? await dbGet('meetings', id) : null;
    const meeting = {
      title,
      type: $('mtType').value,
      date: $('mtDate').value,
      location: cleanText($('mtLocation').value),
      attendeesCount: Number($('mtAttendees').value) || 0,
      agenda: cleanText($('mtAgenda').value),
      discussion: cleanText($('mtDiscussion').value),
      decisions: cleanText($('mtDecisions').value),
      updatedAt: new Date().toISOString(),
      createdAt: old ? old.createdAt : new Date().toISOString()
    };

    if(id){
      meeting.id = id;
      await dbPut('meetings', meeting);
      const i = S.meetings.findIndex(x => x.id === id);
      if(i > -1) S.meetings[i] = meeting;
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('meetings', meeting);
      meeting.id = newId;
      S.meetings.push(meeting);
      toast('✅ تمت الإضافة');
    }
    logAudit(id ? 'update' : 'add', 'meeting', meeting.id, { title });
    closeSheet();
    setTimeout(openMeetingsSheet, 250);
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function deleteMeeting(id){
  if(!confirm('حذف هذا الاجتماع؟')) return;
  try{
    await dbDel('meetings', id);
    S.meetings = S.meetings.filter(x => x.id !== id);
    toast('🗑️ تم الحذف');
    closeSheet();
    setTimeout(openMeetingsSheet, 250);
  } catch(e){ toast('خطأ','error'); }
}

      <div style="font-weight:800;font-size:16px">${esc(m.title)}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">
        📅 ${fmtDate(m.date)} • ${esc(m.type||'')}${m.location ? ' • 📍 ' + esc(m.location) : ''}

    ${m.agenda ? `<div style="margin-bottom:14px"><div style="font-weight:800;font-size:13px;margin-bottom:6px">📋 جدول الأعمال</div><div style="padding:10px;background:var(--bg);border-radius:10px;font-size:13px;white-space:pre-wrap">${esc(m.agenda)}</div></div>` : ''}

function shareMeetingWA(id){
  const m = S.meetings.find(x => x.id === id);
  if(!m) return;

  let txt = `📋 *${m.title}*\n`;
  txt += `📅 ${fmtDate(m.date)}\n`;
  if(m.location) txt += `📍 ${m.location}\n`;
  if(m.attendeesCount) txt += `👥 الحضور: ${m.attendeesCount}\n`;
  if(m.decisions) txt += `\n*القرارات:*\n${m.decisions}\n`;
  txt += `\n_صندوق زعورة_`;

  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

async function saveHandover(){
  const toUserId = Number($('hoToUser').value);
  const amount = Number($('hoAmount').value);
  const fund = $('hoFund').value;
  const notes = cleanText($('hoNotes').value);

  if(!toUserId){ toast('اختر المستلم','error'); return; }
  if(!amount || amount <= 0){ toast('المبلغ مطلوب','error'); return; }

  const toUser = S.admins.find(a => a.id === toUserId);
  if(!toUser) return;

  try{
    const handover = {
      fromUserId: S.currentUser.id, fromUserName: S.currentUser.name,
      toUserId, toUserName: toUser.name,
      amount, fund, notes, date: today(),
      createdAt: new Date().toISOString()
    };
    const id = await dbPut('handovers', handover);
    handover.id = id;
    S.handovers.push(handover);

    logAudit('add', 'handover', id, { amount, to: toUser.name });
    toast('📤 تم تسجيل التسليم', 'success');

    // واتساب توثيق
    setTimeout(() => {
      if(confirm('📱 إرسال توثيق الاستلام واتساب؟')) {
        const txt = `📤 *توثيق تسليم*\n\nمن: ${S.currentUser.name}\nإلى: ${toUser.name}\nالمبلغ: ${fmtNum(amount)} ل.س\nالصندوق: ${fund === 'assoc' ? '💰 الجمعية' : '⚰️ الوفاة'}\nالتاريخ: ${today()}\n${notes ? 'ملاحظات: ' + notes : ''}\n\n_صندوق زعورة_`;
        window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
      }
    }, 400);

    closeSheet();
    renderHome();
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

/* ═══════════════════════════════════════════════════════
   النسخ الاحتياطي
   ═══════════════════════════════════════════════════════ */
function exportBackup(){
  const data = {
    version: '4.0',
    date: new Date().toISOString(),
    data: {
      people: S.people, sectors: S.sectors, admins: S.admins,
      constants: S.constants, subscriptions: S.subscriptions,
      assocPayments: S.assocPayments, deathEvents: S.deathEvents,
      deathInstallments: S.deathInstallments, donations: S.donations,
      expenses: S.expenses, handovers: S.handovers,
      storeItems: S.storeItems, storeMovements: S.storeMovements,
      meetings: S.meetings
    }
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `zaoura_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('💾 تم التنزيل');
}

async function importBackupFile(input){
  const file = input.files[0];
  if(!file) return;
  const text = await file.text();
  try{
    const parsed = JSON.parse(text);
    const d = parsed.data || parsed;
    if(!d.people && !d.graves) throw new Error('ملف غير صالح');
    if(!confirm('سيتم دمج البيانات. متابعة؟')) { input.value = ''; return; }

    const pFp = new Set(S.people.map(p => normAr(`${p.name}|${p.birth||''}`)));
    let added = 0;

    for(const p of (d.people||[])){
      if(pFp.has(normAr(`${p.name}|${p.birth||''}`))) continue;
      delete p.id;
      await dbPut('people', p);
      added++;
    }
    for(const s of (d.storeItems||[])){ delete s.id; await dbPut('storeItems', s); }
    for(const m of (d.meetings||[])){ delete m.id; await dbPut('meetings', m); }
    for(const c of (d.constants||[])){ delete c.id; await dbPut('constants', c); }

    await loadAll();
    closeSheet();
    toast(`✅ تم دمج ${added} سجل`);
    renderHome();
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
  input.value = '';
}

/* ═══════════════════════════════════════════════════════
   تهيئة الثوابت الافتراضية
   ═══════════════════════════════════════════════════════ */
async function ensureDefaultConstants(){
  const years = [2025,2026,2027,2028];
  let added = 0;
  for(const year of years){
    const existing = S.constants.find(c => c.year === year);
    if(!existing){
      const c = {
        year,
        assocYearly: 24000, assocYearlyReduced: 15000,
        deathInstallment: 5000, deathCompensation: 25000,
        joinAssoc: 100000, joinAssocReduced: 50000,
        joinDeath: 50000, joinDeathReduced: 25000,
        createdAt: new Date().toISOString()
      };
      const id = await dbPut('constants', c);
      c.id = id;
      S.constants.push(c);
      added++;
    }
  }
  if(added > 0) console.log(`✅ تم إضافة ${added} سنة`);
}

/* ═══════════════════════════════════════════════════════
   تحميل البيانات
   ═══════════════════════════════════════════════════════ */
async function loadAll(){
  const results = await Promise.all([
    dbAll('people'), dbAll('sectors'), dbAll('admins'), dbAll('constants'),
    dbAll('subscriptions'), dbAll('assocPayments'), dbAll('deathEvents'),
    dbAll('deathInstallments'), dbAll('donations'), dbAll('expenses'),
    dbAll('handovers'), dbAll('auditLog'),
    dbAll('storeItems'), dbAll('storeMovements'), dbAll('meetings'), dbAll('meetingDecisions')
  ]);

  S.people = results[0];
  S.sectors = results[1];
  S.admins = results[2];
  S.constants = results[3];
  S.subscriptions = results[4];
  S.assocPayments = results[5];
  S.deathEvents = results[6];
  S.deathInstallments = results[7];
  S.donations = results[8];
  S.expenses = results[9];
  S.handovers = results[10];
  S.auditLog = results[11];
  S.storeItems = results[12];
  S.storeMovements = results[13];
  S.meetings = results[14];
  S.meetingDecisions = results[15];
}

/* ═══════════════════════════════════════════════════════
   التشغيل النهائي
   ═══════════════════════════════════════════════════════ */
async function init(){
  const savedTheme = localStorage.getItem('zt_fund_theme');
  if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  try{
    await openDB();
    await loadAll();

    // قطاعات افتراضية
    if(S.sectors.length === 0){
      for(const s of DEFAULT_SECTORS) await dbPut('sectors', s);
      S.sectors = [...DEFAULT_SECTORS];
    }

    // ثوابت افتراضية
    await ensureDefaultConstants();

    // استرجاع المستخدم
    const su = restoreCurrentUser();
    if(su){
      const full = S.admins.find(a => a.id === su.id);
      if(full){ S.currentUser = full; showMainApp(); return; }
      saveCurrentUser(null);
    }
    showLogin();

  } catch(e){
    console.error('❌', e);
    toast('خطأ: ' + e.message, 'error', 5000);
  }
}

document.addEventListener('DOMContentLoaded', init);
