/* ═══ دالة استخراج القيمة من صف ═══ */
function gv(row, ...aliases) {
  if (!row) return '';
  const normalized = {};
  for (const k of Object.keys(row)) {
    normalized[normAr(k).replace(/[^\u0621-\u064Aa-z0-9]/g, '')] = row[k];
  }
  for (const a of aliases) {
    const key = normAr(a).replace(/[^\u0621-\u064Aa-z0-9]/g, '');
    if (key in normalized) {
      const v = normalized[key];
      if (v === null || v === undefined) continue;
      const s = String(v).trim();
      if (!s || s.indexOf('=') === 0 || s.indexOf('openpyxl') > -1) continue;
      return s;
    }
  }
  return '';
}

async function importMembers(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  
  showLoad(true);
  const log = $('importLog');
  log.innerHTML = '<div style="color:var(--muted)">⏳ جاري القراءة...</div>';
  
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
    
    if (!rows.length) { log.innerHTML = '<div style="color:var(--danger)">❌ الملف فارغ</div>'; showLoad(false); return; }
    
    let added = 0, updated = 0, skip = 0;
    const tc = { both: 0, assoc: 0, death: 0, none: 0 };
    
    const existing = new Map();
    S.members.forEach(function(m) {
      if (m.code) existing.set(String(m.code), m);
      existing.set(normAr(m.name), m);
    });
    
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      const name = cleanText(gv(r, 'الاسم الثلاثي', 'الاسم_الثلاثي', 'الاسم'));
      if (!name) { skip++; continue; }
      
      const code = cleanText(gv(r, 'رقم الفرد', 'رقم_الفرد', 'الكود'));
      const subDate = toDate(gv(r, 'تاريخ الاشتراك', 'تاريخ_الاشتراك'));
      const subYear = subDate ? new Date(subDate).getFullYear() : null;
      
      const subTypeRaw = gv(r, 'نوع الاشتراك', 'نوع_الاشتراك');
      const subType = normAr(subTypeRaw || '');
      const subTypeDefined = subType.length > 0;
      
      const hasAssocWord = /جمعي/.test(subType);
      const hasDeathWord = /وفا/.test(subType);
      const isBoth = subType.indexOf('كلاهما') > -1 || (hasAssocWord && hasDeathWord);
      const isNone = subType.indexOf('غير') > -1 && subType.indexOf('مشترك') > -1;
      
      let hasAssoc = false, hasDeath = false;
      if (isNone) { tc.none++; }
      else if (isBoth) { hasAssoc = true; hasDeath = true; tc.both++; }
      else if (hasAssocWord) { hasAssoc = true; tc.assoc++; }
      else if (hasDeathWord) { hasDeath = true; tc.death++; }
      
      const memberTypeStr = normAr(gv(r, 'نوع العضو', 'نوع_العضو') || '');
      const memberType = memberTypeStr.indexOf('مخفض') > -1 ? 'مخفض' : 'عادي';
      
      const statusRaw = cleanText(gv(r, 'حالة العضو', 'الحالة'));
      let memberStatus = 'نشط';
      const stN = normAr(statusRaw);
      if (stN.indexOf('منسحب') > -1) memberStatus = 'منسحب';
      else if (stN.indexOf('متوقف') > -1) memberStatus = 'متوقف';
      else if (stN.indexOf('معف') > -1) memberStatus = 'معفى';
      else if (stN.indexOf('متوف') > -1) memberStatus = 'متوفى';
      
      const statusDate = toDate(gv(r, 'تاريخ الحالة', 'تاريخ_الحالة'));
      
      let found = null;
      if (code && existing.has(String(code))) found = existing.get(String(code));
      else if (existing.has(normAr(name))) found = existing.get(normAr(name));
      
      if (found) {
        let changed = false;
        if (subTypeDefined && subYear) {
          const newAssoc = hasAssoc ? subYear : null;
          const newDeath = hasDeath ? subYear : null;
          if (found.assocStartYear !== newAssoc) { found.assocStartYear = newAssoc; changed = true; }
          if (found.deathStartYear !== newDeath) { found.deathStartYear = newDeath; changed = true; }
        }
        if (memberStatus && found.memberStatus !== memberStatus) { found.memberStatus = memberStatus; changed = true; }
        if (changed) { await dbPut('members', found); updated++; } else skip++;
        continue;
      }
      
      try {
        const member = {
          code: code, name: name,
          familyCode: cleanText(gv(r, 'كود الأسرة', 'كود_الأسرة')),
          gender: gv(r, 'الجنس') || 'ذكر',
          status: gv(r, 'الحياة') || 'حي',
          relation: gv(r, 'صلة القرابة', 'صلة_القرابة') || 'رب أسرة',
          birth: toDate(gv(r, 'تاريخ الميلاد', 'تاريخ_الميلاد')),
          sector: cleanText(gv(r, 'القطاع')),
          phone: cleanPhone(gv(r, 'الجوال', 'الهاتف')),
          assocStartYear: hasAssoc ? subYear : null,
          deathStartYear: hasDeath ? subYear : null,
          memberType: memberType,
          memberStatus: memberStatus,
          statusDate: statusDate,
          stopYear: (memberStatus === 'منسحب' || memberStatus === 'متوقف')
            ? (statusDate ? new Date(statusDate).getFullYear() : null)
            : null,
          deathDate: memberStatus === 'متوفى' ? (statusDate || '') : '',
          assocExempt: memberStatus === 'معفى',
          deathExempt: memberStatus === 'معفى',
          dependentsIds: [],
          notes: cleanText(gv(r, 'ملاحظات')),
          createdAt: new Date().toISOString()
        };
        const newId = await dbPut('members', member);
        member.id = newId;
        S.members.push(member);
        if (code) existing.set(String(code), member);
        existing.set(normAr(name), member);
        added++;
      } catch (e) { skip++; }
    }
    
    log.innerHTML = '<div style="padding:12px;background:var(--donation-soft);border-radius:12px;color:#166534">' +
      '<div style="font-weight:800;margin-bottom:6px">📊 النتيجة</div>' +
      '<div>➕ أُضيف: <b>' + added + '</b> | ✏️ حُدّث: <b>' + updated + '</b> | ⏭️ تُخطّي: <b>' + skip + '</b></div></div>' +
      '<div style="padding:12px;background:var(--info-soft);border-radius:12px;color:#1e40af;margin-top:10px;font-size:11px">' +
      '<div><b>نوع الاشتراك:</b> ✅ ' + tc.both + ' كليهما • 💰 ' + tc.assoc + ' جمعية • ⚰️ ' + tc.death + ' وفاة</div></div>';
    
    toast('✅ أُضيف ' + added + ' | حُدّث ' + updated, 'success', 4000);
    CACHE.invalidateAll();
    await loadAll();
    go(S.page);
  } catch (e) {
    log.innerHTML = '<div style="color:var(--danger)">❌ ' + esc(e.message) + '</div>';
  }
  showLoad(false);
}

            const n1 = normAr(d.deceasedName);
            const n2 = normAr(cleanName);
            return n1.indexOf(n2) > -1 || n2.indexOf(n1) > -1;
          });
        }
        
        if (matched) {
          if (!matched.manualEdit) {
            matched.compensation = amount;
            matched.updatedFromFinance = true;
            await dbPut('deaths', matched);
            compUpdated++;
          }
        } else {
          compNF++;
        }
        continue;
      }
      
      const isDup = isIncome
        ? S.incomes.some(inc => inc.fund === fund && Number(inc.amount) === amount && inc.date === date)
        : S.expenses.some(ex => ex.fund === fund && Number(ex.amount) === amount && ex.date === date);
      if (isDup) { dup++; skip++; continue; }
      
      try {
        if (isIncome) {
          const obj = {
            fund, category: category || 'إيراد',
            amount, date, year,
            notes: description + (party ? ' • ' + party : ''),
            recordedBy: S.currentUser.id,
            recordedByName: S.currentUser.name + ' (استيراد)',
            imported: true,
            createdAt: new Date().toISOString()
          };
          const newId = await dbPut('incomes', obj);
          obj.id = newId;
          S.incomes.push(obj);
          incAdded++;
        } else {
          const obj = {
            fund, category: category || 'مصروف',
            description: description + (party ? ' • ' + party : ''),
            amount, date, year,
            createdBy: S.currentUser.id,
            recordedByName: S.currentUser.name + ' (استيراد)',
            imported: true,
            createdAt: new Date().toISOString()
          };
          const newId = await dbPut('expenses', obj);
          obj.id = newId;
          S.expenses.push(obj);
          expAdded++;
        }
      } catch (e) { skip++; }
    }
    
    log.innerHTML = '<div style="padding:12px;background:var(--donation-soft);border-radius:12px;color:#166534">' +
      '<div>📥 واردات: <b>' + incAdded + '</b> | 📤 مصاريف: <b>' + expAdded + '</b></div>' +
      '<div style="color:var(--success);font-weight:800">⚰️ تعويضات محدَّثة: <b>' + compUpdated + '</b></div>' +
      (compNF ? '<div style="color:#b91c1c">❌ لم تُطابق: <b>' + compNF + '</b></div>' : '') +
      '<div style="color:#92400e">🔁 مكرر: <b>' + dup + '</b></div></div>';
    
    toast('✅ وارد ' + incAdded + ' • مصروف ' + expAdded, 'success', 5000);
    CACHE.invalidateAll();
    await loadAll();
    go(S.page);
  } catch (e) {
    log.innerHTML = '<div style="color:var(--danger)">❌ ' + esc(e.message) + '</div>';
  }
  showLoad(false);
}

function parseMovementType(typeStr) {
  const t = normAr(typeStr);
  if (/شراء|جديد/.test(t)) return 'new';
  if (/عائد|مرتجع|ارجاع/.test(t)) return 'in';
  if (/تلف|هدر|كسر/.test(t)) return 'damaged';
  if (/هبه وارد|هبه_وارده/.test(t)) return 'gift_in';
  if (/هبه صادر|هبه_صادره|اهداء/.test(t)) return 'gift_out';
  if (/بيع/.test(t)) return 'sale';
  if (/صرف|خارج|اخراج|استخدام/.test(t)) return 'out';
  return 'out';
}

async function importStore(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  
  showLoad(true);
  const log = $('importStoreLog');
  log.innerHTML = '<div style="color:var(--muted)">⏳</div>';
  
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
    
    let itemsAdded = 0, itemsFound = 0, movementsAdded = 0, skip = 0, dup = 0;
    
    const itemMap = {};
    S.storeItems.forEach(item => { itemMap[normAr(item.name)] = item; });
    
    const sortedRows = rows.slice().sort((a, b) => {
      const da = toDate(gv(a, 'التاريخ'));
      const db = toDate(gv(b, 'التاريخ'));
      if (da && db) return da.localeCompare(db);
      return 0;
    });
    
    for (let i = 0; i < sortedRows.length; i++) {
      const r = sortedRows[i];
      
      const itemName = cleanText(gv(r, 'الصنف', 'اسم_الصنف', 'المادة'));
      if (!itemName) { skip++; continue; }
      
      const quantity = Number(String(gv(r, 'الكمية') || '').replace(/[,،\s]/g, '')) || 0;
      if (quantity <= 0) { skip++; continue; }
      
      const category = cleanText(gv(r, 'الفئة', 'التصنيف')) || 'أخرى';
      const unit = cleanText(gv(r, 'الوحدة')) || 'قطعة';
      const movementType = parseMovementType(gv(r, 'نوع_الحركة', 'نوع الحركة', 'الحركة'));
      const user = cleanText(gv(r, 'المستخدم', 'المسؤول')) || 'استيراد';
      const date = toDate(gv(r, 'التاريخ')) || today();
      
      let item = itemMap[normAr(itemName)];
      
      if (!item) {
        try {
          const newItem = {
            name: itemName, category, unit,
            quantity: 0, minQty: 5,
            condition: 'جيد',
            notes: '',
            imported: true,
            totalOwned: 0,
            createdAt: new Date().toISOString()
          };
          const newId = await dbPut('storeItems', newItem);
          newItem.id = newId;
          S.storeItems.push(newItem);
          itemMap[normAr(itemName)] = newItem;
          item = newItem;
          itemsAdded++;
        } catch (e) { skip++; continue; }
      } else {
        itemsFound++;
      }
      
      const isDup = S.storeMovements.some(m =>
        m.itemId === item.id && m.type === movementType &&
        Number(m.quantity) === quantity && m.date === date
      );
      if (isDup) { dup++; continue; }
      
      const meta = MOVEMENT_TYPES.find(t => t.k === movementType);
      const sign = meta ? meta.sign : -1;
      const oldQty = Number(item.quantity) || 0;
      const newQty = oldQty + (sign * quantity);
      
      try {
        const movement = {
          itemId: item.id, itemName: item.name,
          type: movementType, quantity,
          price: 0, fund: null,
          party: '', ref: '', notes: user !== 'استيراد' ? 'المستخدم: ' + user : '',
          oldQuantity: oldQty,
          newQuantity: Math.max(0, newQty),
          userName: user, date,
          imported: true,
          createdAt: new Date().toISOString()
        };
        const mvId = await dbPut('storeMovements', movement);
        movement.id = mvId;
        S.storeMovements.push(movement);
        
        item.quantity = Math.max(0, newQty);
        if (movementType === 'new') item.totalOwned = (Number(item.totalOwned) || 0) + quantity;
        await dbPut('storeItems', item);
        movementsAdded++;
      } catch (e) { skip++; }
    }
    
    log.innerHTML = '<div style="padding:12px;background:var(--donation-soft);border-radius:12px;color:#166534">' +
      '<div>📦 مواد جديدة: <b>' + itemsAdded + '</b></div>' +
      '<div>📦 مواد موجودة: <b>' + itemsFound + '</b></div>' +
      '<div>🔄 حركات: <b>' + movementsAdded + '</b></div>' +
      '<div style="color:#92400e">🔁 مكرر: <b>' + dup + '</b></div>' +
      '<div>⏭️ تُخطّي: <b>' + skip + '</b></div></div>';
    
    toast('✅ ' + itemsAdded + ' مادة • ' + movementsAdded + ' حركة', 'success', 4000);
    CACHE.invalidateAll();
    await loadAll();
    go(S.page);
  } catch (e) {
    log.innerHTML = '<div style="color:var(--danger)">❌ ' + esc(e.message) + '</div>';
  }
  showLoad(false);
}

async function importBackup(input) {
  if (!hasPerm('admin.backup')) { toast('غير مصرح', 'error'); return; }
  
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  
  const text = await file.text();
  
  try {
    const data = JSON.parse(text);
    if (!data.members && !data.users) throw new Error('ملف غير صالح');
    
    if (!confirm('⚠️ سيتم استبدال كل البيانات الحالية.\n\nمتابعة؟')) return;
    if (!confirm('تأكيد أخير!')) return;
    
    showLoad(true);
    
    /* مسح كل المتاجر */
    for (const s of STORE_NAMES) {
      await dbClear(s);
    }
    
    /* استعادة البيانات */
    const toRestore = ['members', 'payments', 'deaths', 'incomes', 'expenses', 'deliveries', 'storeItems', 'storeMovements', 'meetings', 'constants', 'users', 'roles', 'customFields', 'settings'];
    
    for (const key of toRestore) {
      if (Array.isArray(data[key])) {
        for (const item of data[key]) {
          delete item.id;
          await dbPut(key, item);
        }
      }
    }
    
    await loadAll();
    CACHE.invalidateAll();
    
    toast('✅ تمت الاستعادة بنجاح', 'success', 4000);
    closeSheetAll();
    setTimeout(function() { location.reload(); }, 1000);
    
  } catch (e) {
    showLoad(false);
    toast('خطأ: ' + e.message, 'error', 5000);
  }
}

/* ═══════════════════════════════════════════════════════════════
   🔧 الإصلاح 1: المدير والأمناء في قائمة المحصّلين
   ═══════════════════════════════════════════════════════════════ */

/**
 * جلب كل الحصّالين (من له canCollect في دوره)
 */
function getAllPayersList() {
  return S.users.filter(function(u) {
    const role = getRoleByKey(u.role);
    return role && role.canCollect;
  });
}

/**
 * عهدة أي مستخدم (مدير، أمين، معتمد) - إصدار محسّن
 */
function getUserCustodyEnhanced(userId) {
  const user = S.users.find(u => u.id === userId);
  if (!user) return null;
  
  const userName = normAr(user.name);
  const matchName = function(name) {
    if (!name || !userName) return false;
    const n = normAr(name);
    return n === userName || n.indexOf(userName) > -1 || userName.indexOf(n) > -1;
  };
  
  /* الدفعات التي حصّلها */
  const payments = S.payments.filter(function(p) {
    return p.collectorId === userId || (!p.collectorId && matchName(p.collectorName));
  });
  
  /* التسليمات التي سلّمها (المستلمة) */
  const delivered = S.deliveries.filter(function(d) {
    return (d.fromUserId === userId || (!d.fromUserId && matchName(d.fromUserName)))
      && d.receivedAt;
  });
  
  /* التسليمات المعلقة */
  const pending = S.deliveries.filter(function(d) {
    return (d.fromUserId === userId || (!d.fromUserId && matchName(d.fromUserName)))
      && !d.receivedAt && !d.rejectedAt;
  });
  
  const sum = arr => arr.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  
  const byFund = function(fund) {
    const p = sum(payments.filter(x => x.fund === fund));
    const d = sum(delivered.filter(x => x.fund === fund));
    const pd = sum(pending.filter(x => x.fund === fund));
    return { collected: p, delivered: d, pending: pd, balance: p - d };
  };
  
  const assoc = byFund('assoc');
  const death = byFund('death');
  const donation = byFund('donation');
  
  return {
    user: user,
    assoc, death, donation,
    all: {
      collected: assoc.collected + death.collected + donation.collected,
      delivered: assoc.delivered + death.delivered + donation.delivered,
      pending: assoc.pending + death.pending + donation.pending,
      balance: assoc.balance + death.balance + donation.balance
    },
    paymentCount: payments.length,
    deliveryCount: delivered.length
  };
}

/* ═══ استبدال دالة عرض المحصّلين ═══ */

renderCollectors = function() {
  if (!hasPerm('reports.all')) {
    $('pg-collectors').innerHTML = '<div class="empty"><span class="ico">🔒</span><h3>غير مصرح</h3></div>';
    return;
  }
  
  const y = S.currentYear;
  
  /* ✅ إصلاح: اجمع كل من له canCollect (مدير + رئيس + أمناء + معتمدون) */
  const allPayers = getAllPayersList();
  
  /* احسب عهدة كل واحد */
  const list = allPayers.map(function(u) {
    const custody = getUserCustodyEnhanced(u.id);
    return { user: u, custody: custody };
  }).filter(x => x.custody && (x.custody.all.collected > 0 || x.custody.all.pending > 0));
  
  /* ترتيب حسب المبلغ المحصّل */
  list.sort((a, b) => b.custody.all.collected - a.custody.all.collected);
  
  const totalCollected = list.reduce((s, x) => s + x.custody.all.collected, 0);
  const totalDelivered = list.reduce((s, x) => s + x.custody.all.delivered, 0);
  const totalPending = list.reduce((s, x) => s + x.custody.all.pending, 0);
  
  let html = '';
  
  /* إحصائيات عامة */
  html += '<div class="stats-scroll">';
  html += '<div class="stat green"><div class="val">' + fmtShort(totalCollected) + '</div><div class="lbl">📥 حصّلوا</div></div>';
  html += '<div class="stat blue"><div class="val">' + fmtShort(totalDelivered) + '</div><div class="lbl">✅ استُلم</div></div>';
  html += '<div class="stat orange"><div class="val">' + fmtShort(totalPending) + '</div><div class="lbl">⏳ معلّق</div></div>';
  html += '<div class="stat"><div class="val">' + list.length + '</div><div class="lbl">👥 عدد</div></div>';
  html += '</div>';
  
  /* بطاقة كل حصّال */
  if (list.length) {
    html += '<div class="card">';
    html += '<div class="card-head"><h2>👥 كل المحصّلين (' + list.length + ')</h2></div>';
    html += '<div class="list" style="margin:-14px;border-radius:0;border:0">';
    
    list.forEach(function(x) {
      const role = getRoleByKey(x.user.role) || { icon: '👤', name: '' };
      const hasPending = x.custody.all.pending > 0;
      const hasBalance = x.custody.all.balance > 0;
      
      html += '<div class="item" onclick="openCollectorDetailEnhanced(' + x.user.id + ')">';
      html += '<div class="av ' + (hasPending || hasBalance ? 'orange' : 'green') + '">' + role.icon + '</div>';
      html += '<div class="body">';
      html += '<div class="ttl">' + esc(x.user.name) + ' <span class="badge primary" style="font-size:9px">' + role.name + '</span></div>';
      html += '<div class="sub">';
      html += '📥 ' + fmtShort(x.custody.all.collected);
      html += ' • ✅ ' + fmtShort(x.custody.all.delivered);
      if (hasPending) html += ' • ⏳ ' + fmtShort(x.custody.all.pending);
      if (hasBalance) html += ' • 💰 عهدة: ' + fmtShort(x.custody.all.balance);
      html += '</div></div>';
      html += '<span class="trail">›</span></div>';
    });
    
    html += '</div></div>';
  } else {
    html += '<div class="empty"><span class="ico">👥</span><h3>لا يوجد محصّلون بعد</h3><p>لم تُسجَّل أي دفعات بعد</p></div>';
  }
  
  $('pg-collectors').innerHTML = html;
};

  html += '</div>';
  html += '</div>';
  
  /* تفصيل حسب الصندوق */
  html += '<div class="balance-block">';
  html += '<div style="font-weight:800;margin-bottom:10px">📊 التفصيل حسب الصندوق</div>';

    html += '<div><div style="color:var(--muted);font-size:10px">💰 العهدة</div><div style="font-weight:800;color:' + (d.balance > 0 ? 'var(--warning)' : 'var(--success)') + ';font-family:\'SF Mono\',monospace">' + fmtNum(d.balance) + '</div></div>';
    html += '</div>';

  });
  
  html += '</div>';

  const recentPayments = S.payments

/**

function showImpersonateBanner() {
  const existing = $('impersonateBanner');
  if (existing) existing.remove();
  
  const impersonatorJson = localStorage.getItem('zt_impersonator');
  if (!impersonatorJson) return;
  
  const impersonator = JSON.parse(impersonatorJson);
  
  const div = document.createElement('div');
  div.id = 'impersonateBanner';
  div.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;' +
    'background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;' +
    'padding:8px 14px;display:flex;justify-content:space-between;' +
    'align-items:center;font-size:12px;font-weight:800;' +
    'box-shadow:0 4px 12px rgba(0,0,0,.2)';
  div.innerHTML = 
    '<span>🎭 تتصفح كـ: <b>' + esc(S.currentUser.name) + '</b></span>' +
    '<button onclick="returnToManager()" style="background:rgba(255,255,255,.25);' +
    'padding:6px 14px;border-radius:8px;color:#fff;font-weight:800;font-size:11px;' +
    'border:0;cursor:pointer;font-family:inherit">🔙 رجوع</button>';
  document.body.appendChild(div);
  
  /* إزاحة المحتوى للأسفل */
  document.querySelectorAll('.app-header, .user-banner, main').forEach(function(el) {
    if (el) el.style.marginTop = el.id === 'appHeader' ? '36px' : '';
  });
  const header = $('appHeader');
  if (header) header.style.marginTop = '36px';
  const userBanner = $('userBanner');
  if (userBanner) userBanner.style.marginTop = '36px';
}

function returnToManager() {
  const impersonatorJson = localStorage.getItem('zt_impersonator');
  if (!impersonatorJson) { toast('لا يوجد حساب محفوظ', 'error'); return; }
  
  try {
    const impersonator = JSON.parse(impersonatorJson);
    const manager = S.users.find(u => u.id === impersonator.id);
    if (!manager) { toast('المدير غير موجود', 'error'); return; }
    
    S.currentUser = manager;
    S.currentRole = getRoleByKey(manager.role);
    localStorage.setItem('zt_user', JSON.stringify({
      id: manager.id, name: manager.name, role: manager.role
    }));
    localStorage.removeItem('zt_impersonator');
    
    const banner = $('impersonateBanner');
    if (banner) banner.remove();
    const header = $('appHeader');
    if (header) header.style.marginTop = '';
    const userBanner = $('userBanner');
    if (userBanner) userBanner.style.marginTop = '';
    
    toast('🔙 رجعت لحسابك', 'success', 2500);
    setTimeout(function() { showMain(); }, 200);
  } catch (e) {
    console.error(e);
    toast('خطأ', 'error');
  }
}

/* استبدال impersonateUser */
const _origImpersonate13 = impersonateUser;
impersonateUser = function(userId) {
  if (!S.currentRole || S.currentRole.key !== 'manager') {
    toast('هذه الميزة للمدير فقط', 'error');
    return;
  }
  
  const target = S.users.find(u => u.id === userId);
  if (!target) { toast('المستخدم غير موجود', 'error'); return; }
  
  if (!confirm('🔑 الدخول بحساب "' + target.name + '"؟\n\nيمكنك الرجوع في أي وقت بزر "🔙 رجوع".')) return;
  
  localStorage.setItem('zt_impersonator', JSON.stringify({
    id: S.currentUser.id,
    name: S.currentUser.name,
    role: S.currentUser.role
  }));
  
  S.currentUser = target;
  S.currentRole = getRoleByKey(target.role);
  localStorage.setItem('zt_user', JSON.stringify({
    id: target.id, name: target.name, role: target.role
  }));
  
  closeSheetAll();
  toast('🎭 أنت الآن "' + target.name + '"', 'info', 3000);
  setTimeout(showMain, 200);
};

/* إضافة فلاتر جديدة إلى S.filters.collect */
S.filters.collectExtra = 'all'; /* all | paidByMe | paidByOthers | paidForMe */

/**
 * حساب عدد الأعضاء في كل فلتر إضافي
 */
function computeExtraCollectCounts() {
  const user = S.currentUser;
  const role = S.currentRole;
  const mySector = user.sector;
  const isManager = role.key === 'manager' || role.key === 'president';
  
  let myPaid = new Set(); /* من دفع لي */
  let paidByOthers = new Set(); /* من دفع عند غيري (من قطاعي) */
  let paidForMe = new Set(); /* من أنا دافع عنه (ولكن ليس هو) */
  
  /* من دفع لي شخصياً */
  S.payments.forEach(function(p) {
    if (p.collectorId === user.id) {
      myPaid.add(p.memberId);
    }
  });
  
  /* كل من له دفعات */
  const allPaidIds = new Set(S.payments.map(p => p.memberId).filter(x => x));
  
  /* من قطاعي ودفع عند غيري */
  S.members.forEach(function(m) {
    if (m.memberStatus === 'متوفى' || m.memberStatus === 'منسحب' || m.memberStatus === 'متوقف') return;
    if (!isManager && mySector && m.sector !== mySector) return;
    
    if (allPaidIds.has(m.id) && !myPaid.has(m.id)) {
      paidByOthers.add(m.id);
    }
  });
  
  /* من أنا دافع عنه */
  S.members.forEach(function(m) {
    if (m.payerId === user.id) {
      paidForMe.add(m.id);
    }
  });
  
  return {
    paidByMe: myPaid.size,
    paidByOthers: paidByOthers.size,
    paidForMe: paidForMe.size
  };
}

  html += '<button class="chip ' + (S.filters.collectExtra === 'paidByMe' ? 'on' : '') + '" onclick="setCollectExtraFilter(\'paidByMe\')">📥 دفعوا لي (' + extraCounts.paidByMe + ')</button>';
  html += '<button class="chip ' + (S.filters.collectExtra === 'paidByOthers' ? 'on' : '') + '" onclick="setCollectExtraFilter(\'paidByOthers\')">🔄 دفعوا عند غيري (' + extraCounts.paidByOthers + ')</button>';
  if (extraCounts.paidForMe > 0) {
    html += '<button class="chip ' + (S.filters.collectExtra === 'paidForMe' ? 'on' : '') + '" onclick="setCollectExtraFilter(\'paidForMe\')">💎 أدفع عنهم (' + extraCounts.paidForMe + ')</button>';
  }
  html += '<button class="chip ' + (S.filters.collectExtra === 'all' ? 'on' : '') + '" onclick="setCollectExtraFilter(\'all\')">❌ إلغاء الفلتر</button>';
  html += '</div>';
  
  /* فلتر القطاع */
  if (isManager) {
    html += '<div class="chips" style="margin-bottom:0">';
    html += '<button class="chip ' + (S.filters.collectSector === 'all' ? 'on' : '') + '" onclick="setCollectSector(\'all\')">📍 كل القطاعات</button>';

    html += '📍 قطاعي: ' + esc(mySector) + ' — <button onclick="toggleMySectorOnly()" style="background:none;border:0;color:var(--primary);font-weight:800;text-decoration:underline;font-size:12px;cursor:pointer">';

    html += '</button>';
    html += '</div>';
  }
  
  html += '</div>';
  
  /* بحث */

/* استبدال renderCollectList */
const _origRenderCollectList13 = renderCollectList;
renderCollectList = function() {
  const user = S.currentUser;
  const role = S.currentRole;
  const mySector = user.sector;
  const isManager = role.key === 'manager' || role.key === 'president';
  const filter = S.filters.collect;
  const extraFilter = S.filters.collectExtra || 'all';
  const sectorFilter = isManager ? S.filters.collectSector : (S.filters.collectSector === 'mysector' ? mySector : 'all');
  
  let list = S.members.filter(function(m) {
    const st = m.memberStatus || 'نشط';
    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return false;
    if (!m.assocStartYear && !m.deathStartYear) return false;
    
    if (isManager) {
      if (sectorFilter && sectorFilter !== 'all' && m.sector !== sectorFilter) return false;
    } else {
      /* للمعتمد: افتراضياً قطاعه فقط، مع إمكانية التوسيع */
      if (S.filters.collectSector !== 'all' && mySector && m.sector !== mySector) return false;
    }
    return true;
  });
  
  /* فلترة أساسية */
  if (filter === 'late') {
    list = list.filter(function(m) {
      const w = computeMemberWallet(m.id);
      return w && w.summary.totalBalance > 0;
    });
  } else if (filter === 'paid') {
    list = list.filter(function(m) {
      const w = computeMemberWallet(m.id);
      return w && w.summary.totalBalance <= 0 && w.summary.totalPaid > 0;
    });
  } else if (filter === 'new') {
    list = list.filter(m => m.assocStartYear === S.currentYear || m.deathStartYear === S.currentYear);
  } else if (filter === 'fees') {
    list = list.filter(function(m) {
      const w = computeMemberWallet(m.id);
      if (!w) return false;
      const aYear = m.assocStartYear;
      const dYear = m.deathStartYear;
      const aY = aYear ? w.funds.assoc.years[aYear] : null;
      const dY = dYear ? w.funds.death.years[dYear] : null;
      return (aY && aY.paid < aY.due) || (dY && dY.paid < dY.due);
    });
  }
  
  /* ✅ فلترة متقدمة */
  if (extraFilter === 'paidByMe') {
    const myPaidIds = new Set(S.payments.filter(p => p.collectorId === user.id).map(p => p.memberId));
    list = list.filter(m => myPaidIds.has(m.id));
  } else if (extraFilter === 'paidByOthers') {
    /* من قطاعي ودفع عند غيري */
    const allPaidIds = new Set(S.payments.map(p => p.memberId).filter(x => x));
    const myPaidIds = new Set(S.payments.filter(p => p.collectorId === user.id).map(p => p.memberId));
    list = list.filter(m => allPaidIds.has(m.id) && !myPaidIds.has(m.id));
  } else if (extraFilter === 'paidForMe') {
    list = list.filter(m => m.payerId === user.id);
  }
  
  /* بحث */
  if (S.search) {
    const s = normAr(S.search);
    list = list.filter(m =>
      normAr(m.name + ' ' + (m.code || '') + ' ' + (m.phone || '')).indexOf(s) > -1
    );
  }
  
  /* ترتيب */
  list.sort(function(a, b) {
    const wa = computeMemberWallet(a.id);
    const wb = computeMemberWallet(b.id);
    const ra = wa ? Math.max(0, wa.summary.totalBalance) : 0;
    const rb = wb ? Math.max(0, wb.summary.totalBalance) : 0;
    if (ra !== rb) return rb - ra;
    return String(a.name).localeCompare(String(b.name), 'ar');
  });
  
  const el = $('collectListContent');
  if (!el) return;
  
  if (!list.length) {
    el.innerHTML = '<div class="empty"><span class="ico">👥</span><h3>لا يوجد أعضاء</h3><p>جرّب فلاتر أخرى</p></div>';
    return;
  }
  
  el.innerHTML = '<div style="font-size:11px;color:var(--muted-2);font-weight:700;margin-bottom:6px;padding:0 4px">📊 ' + list.length + ' عضو</div>' +
    '<div class="list">' + list.slice(0, 500).map(renderCollectMemberRowEnhanced).join('') + '</div>';
};

/* ═══ صف عضو محسّن (يُظهر من دفع) ═══ */
function renderCollectMemberRowEnhanced(m) {
  const w = computeMemberWallet(m.id);
  const remA = w ? Math.max(0, w.funds.assoc.balance) : 0;
  const remD = w ? Math.max(0, w.funds.death.balance) : 0;
  const totalRem = remA + remD;
  const isLate = totalRem > 0;
  
  /* ✅ آخر دفعة له */
  const lastPayment = S.payments
    .filter(p => p.memberId === m.id)
    .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''))[0];
  
  const subs = [];
  if (m.assocStartYear) subs.push('💰');
  if (m.deathStartYear) subs.push('⚰️');
  
  let accent = isLate ? '#dc2626' : '#10b981';
  
  /* إن دفع عند غيري */
  const paidByMe = S.payments.some(p => p.memberId === m.id && p.collectorId === S.currentUser.id);
  const hasAnyPayment = S.payments.some(p => p.memberId === m.id);
  
  let html = '<div onclick="openMemberDetail(' + m.id + ')" style="background:var(--card);border-bottom:1px solid var(--border-2);padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;position:relative;min-height:64px">';

  html += '<div style="width:42px;height:42px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">' + (subs.join('') || '👤') + '</div>';
  
  html += '<div style="flex:1;min-width:0">';
  html += '<div style="font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.name) + '</div>';
  html += '<div style="font-size:10px;color:var(--muted-2);margin-top:2px;font-family:\'SF Mono\',monospace">' + esc(m.code || '') + ' • ' + esc(m.sector || '') + '</div>';
  
  /* ✅ إظهار معلومات آخر دفعة */
  if (lastPayment && hasAnyPayment) {
    const isMine = lastPayment.collectorId === S.currentUser.id;
    html += '<div style="font-size:10px;color:' + (isMine ? 'var(--success)' : 'var(--primary)') + ';margin-top:4px;display:flex;align-items:center;gap:4px">';
    html += isMine ? '✅' : '🔄';
    html += ' آخر دفعة: ' + fmtDate(lastPayment.date);
    if (!isMine && lastPayment.collectorName) {
      html += ' عند ' + esc(lastPayment.collectorName);
    }
    html += '</div>';
  } else if (isLate) {
    html += '<div style="font-size:10px;color:var(--death);margin-top:4px;font-weight:700">⚠️ لم يدفع بعد</div>';
  }
  
  html += '</div>';
  
  html += '<div style="text-align:left;flex-shrink:0;min-width:80px">';
  if (isLate) {
    html += '<div style="font-weight:800;color:var(--death);font-family:\'SF Mono\',monospace;font-size:14px">' + fmtNum(totalRem) + '</div>';
    html += '<div style="font-size:9px;color:var(--muted);margin-top:2px">متبقي</div>';
  } else {
    html += '<div style="color:var(--success);font-size:20px">✓</div>';
  }
  html += '</div></div>';
  
  return html;
}

/**
 * جلب كل الحصّالين الفريدين (من دفعات + تسليمات + أدوار)
 */
function getUniqueCollectors() {
  const collectors = new Map();
  
  /* من الأدوار */
  S.users.forEach(function(u) {
    const role = getRoleByKey(u.role);
    if (role && role.canCollect) {
      collectors.set('id:' + u.id, { key: 'id:' + u.id, name: u.name, userId: u.id });
    }
  });
  
  /* من الدفعات (بالاسم فقط) */
  S.payments.forEach(function(p) {
    if (!p.collectorId && p.collectorName) {
      const key = 'name:' + normAr(p.collectorName);
      if (!collectors.has(key)) {
        collectors.set(key, { key, name: p.collectorName, userId: null });
      }
    }
  });
  
  return Array.from(collectors.values()).sort((a, b) => 
    String(a.name).localeCompare(String(b.name), 'ar')
  );
}

/* ═══ عرض حسب المعتمد (مع التاريخ) ═══ */
function renderPaymentsByCollectorEnhanced(payments, s, container) {
  /* تجميع حسب المعتمد */
  const byCollector = {};
  
  payments.forEach(function(p) {
    let collectorKey, collectorName, userId;
    
    if (p.collectorId) {
      userId = p.collectorId;
      const user = S.users.find(u => u.id === userId);
      collectorKey = 'id:' + userId;
      collectorName = user ? user.name : (p.collectorName || 'غير معروف');
    } else {
      collectorKey = 'name:' + normAr(p.collectorName || 'غير معروف');
      collectorName = p.collectorName || 'غير معروف';
      userId = null;
    }
    
    if (!byCollector[collectorKey]) {
      byCollector[collectorKey] = {
        key: collectorKey,
        name: collectorName,
        userId: userId,
        total: 0,
        count: 0,
        byFund: { assoc: 0, death: 0, donation: 0 },
        payments: []
      };
    }
    
    byCollector[collectorKey].total += Number(p.amount) || 0;
    byCollector[collectorKey].count++;
    byCollector[collectorKey].byFund[p.fund] += Number(p.amount) || 0;
    byCollector[collectorKey].payments.push(p);
  });
  
  let list = Object.keys(byCollector).map(k => byCollector[k]);
  
  if (s) {
    list = list.filter(x => normAr(x.name).indexOf(s) > -1);
  }
  
  list.sort((a, b) => b.total - a.total);
  
  if (!list.length) {
    container.innerHTML = '<div class="empty"><span class="ico">💼</span><h3>لا نتائج</h3></div>';
    return;
  }
  
  let html = '<div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:8px;padding:0 4px">📊 ' + list.length + ' معتمد</div>';
  
  list.forEach(function(x) {
    const user = x.userId ? S.users.find(u => u.id === x.userId) : null;
    const role = user ? (getRoleByKey(user.role) || { icon: '👤' }) : { icon: '👤' };
    
    html += '<div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">';
    
    /* رأس المعتمد */
    html += '<div style="padding:12px 14px;background:var(--primary-soft);display:flex;justify-content:space-between;align-items:center">';
    html += '<div style="display:flex;align-items:center;gap:10px">';
    html += '<div style="font-size:22px">' + role.icon + '</div>';
    html += '<div><div style="font-weight:800;font-size:14px">' + esc(x.name) + '</div>';
    html += '<div style="font-size:11px;color:var(--muted);margin-top:2px">' + x.count + ' دفعة</div></div>';
    html += '</div>';
    html += '<div style="text-align:left">';
    html += '<div style="font-weight:800;color:var(--primary);font-family:\'SF Mono\',monospace;font-size:16px">' + fmtNum(x.total) + '</div>';
    html += '<div style="font-size:10px;color:var(--muted);margin-top:2px">ل.س</div>';
    html += '</div></div>';
    
    /* تفصيل الصناديق */
    const parts = [];
    if (x.byFund.assoc > 0) parts.push('💰 ' + fmtShort(x.byFund.assoc));
    if (x.byFund.death > 0) parts.push('⚰️ ' + fmtShort(x.byFund.death));
    if (x.byFund.donation > 0) parts.push('💚 ' + fmtShort(x.byFund.donation));
    
    if (parts.length) {
      html += '<div style="padding:8px 14px;background:var(--bg);font-size:11px;color:var(--muted);display:flex;gap:12px">';
      html += parts.join(' • ');
      html += '</div>';
    }
    
    /* ✅ الدفعات مرتّبة حسب التاريخ (الأحدث أولاً) */
    const sortedPayments = x.payments.slice().sort((a, b) => {
      const dateCompare = (b.date || '').localeCompare(a.date || '');
      if (dateCompare !== 0) return dateCompare;
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });

/* ═══ عرض حسب التاريخ ═══ */
function renderPaymentsByDate(payments, s, container) {
  let list = payments.slice();
  
  if (s) {
    list = list.filter(function(p) {
      const m = p.memberId ? S.members.find(x => x.id === p.memberId) : null;
      return normAr((m ? m.name : '') + ' ' + (p.collectorName || '') + ' ' + (p.notes || '')).indexOf(s) > -1;
    });
  }
  
  /* ✅ ترتيب حسب التاريخ (الأحدث أولاً) */
  list.sort(function(a, b) {
    const dateCompare = (b.date || '').localeCompare(a.date || '');
    if (dateCompare !== 0) return dateCompare;
    return (b.createdAt || '').localeCompare(a.createdAt || '');
  });
  
  if (!list.length) {

    html += '<div style="text-align:left">';
    html += '<div style="font-weight:800;color:var(--primary);font-family:\'SF Mono\',monospace;font-size:14px">' + fmtNum(dayTotal) + '</div>';

    html += '</div></div>';
    
    /* الدفعات */
    dayPayments.forEach(function(p) {
      const m = p.memberId ? S.members.find(x => x.id === p.memberId) : null;
      const fund = FUNDS[p.fund] || FUNDS.assoc;
      
      html += '<div class="item" style="border-bottom:1px solid var(--border-2);padding:10px 14px" onclick="openPaymentReceipt(' + p.id + ')">';
      html += '<div class="av ' + fund.color + '" style="width:36px;height:36px;font-size:16px">' + fund.icon + '</div>';
      html += '<div class="body">';
      html += '<div class="ttl" style="font-size:13px">' + esc(m ? m.name : 'دفعة') + '</div>';
      html += '<div class="sub" style="font-size:10px">' + esc(p.collectorName || '') + '</div>';

      html += '<div style="font-weight:800;color:var(--success);font-size:13px;font-family:\'SF Mono\',monospace">' + fmtNum(p.amount) + '</div>';
      html += '<span class="trail">›</span>';

  container.innerHTML = html;

/* ═══════════════════════════════════════════════════════════════
   ⚡ الجزء 1: حل مشكلة التعليق (Cache محسّن)
   ═══════════════════════════════════════════════════════════════ */

/**
 * Cache مؤقت للعهدات - يمنع إعادة الحساب المتكرر
 */
const CUSTODY_CACHE = {
  data: new Map(),
  timestamp: 0,
  ttl: 5000, /* 5 ثواني */
  
  get(userId) {
    const now = Date.now();
    if (now - this.timestamp > this.ttl) {
      this.data.clear();
      this.timestamp = now;
    }
    return this.data.get(userId);
  },
  
  set(userId, value) {
    this.data.set(userId, value);
    this.timestamp = Date.now();
  },
  
  clear() {
    this.data.clear();
    this.timestamp = 0;
  }
};

/**
 * getUserCustodyEnhanced مُحسّنة مع Cache
 */
const _origGetUserCustodyEnhanced = getUserCustodyEnhanced;
getUserCustodyEnhanced = function(userId) {
  /* Cache */
  const cached = CUSTODY_CACHE.get(userId);
  if (cached) return cached;
  
  const result = _origGetUserCustodyEnhanced(userId);
  if (result) CUSTODY_CACHE.set(userId, result);
  return result;
};

/**
 * Cache لقائمة كل الحصّالين
 */
let _allPayersCache = null;
let _allPayersCacheTimestamp = 0;

function getAllPayersListCached() {
  const now = Date.now();
  if (_allPayersCache && now - _allPayersCacheTimestamp < 10000) {
    return _allPayersCache;
  }
  _allPayersCache = getAllPayersList();
  _allPayersCacheTimestamp = now;
  return _allPayersCache;
}

/* استخدام النسخة المخزّنة */
getAllPayersList = function() {
  return getAllPayersListCached();
};

/**
 * مسح الـ Cache عند تغيير البيانات
 */
const _origInvalidateAllCache14 = CACHE.invalidateAll;
CACHE.invalidateAll = function() {
  _origInvalidateAllCache14.call(this);
  CUSTODY_CACHE.clear();
  _allPayersCache = null;
  _allPayersCacheTimestamp = 0;
};

/* ═══════════════════════════════════════════════════════════════
   ⚡ الجزء 2: تحسين عرض قائمة المحصّلين

renderCollectors = function() {
  if (!hasPerm('reports.all')) {
    $('pg-collectors').innerHTML = '<div class="empty"><span class="ico">🔒</span><h3>غير مصرح</h3></div>';
    return;
  }
  
  /* عرض مباشر بأرقام سريعة، ثم تحميل تفصيلي */
  let html = '';
  
  html += '<div class="card" style="padding:14px">';

  html += '<div id="collectorsContent">';

  }, 100);

function renderCollectorsData() {
  const allPayers = getAllPayersListCached();
  
  /* احسب عهدة كل واحد */
  const list = [];
  for (const u of allPayers) {
    const custody = getUserCustodyEnhanced(u.id);
    if (custody && (custody.all.collected > 0 || custody.all.pending > 0)) {
      list.push({ user: u, custody: custody });
    }
  }
  
  list.sort((a, b) => b.custody.all.collected - a.custody.all.collected);
  
  const totalCollected = list.reduce((s, x) => s + x.custody.all.collected, 0);
  const totalDelivered = list.reduce((s, x) => s + x.custody.all.delivered, 0);
  const totalPending = list.reduce((s, x) => s + x.custody.all.pending, 0);
  
  let html = '';
  
  html += '<div class="stats-scroll">';
  html += '<div class="stat green"><div class="val">' + fmtShort(totalCollected) + '</div><div class="lbl">📥 حصّلوا</div></div>';
  html += '<div class="stat blue"><div class="val">' + fmtShort(totalDelivered) + '</div><div class="lbl">✅ استُلم</div></div>';
  html += '<div class="stat orange"><div class="val">' + fmtShort(totalPending) + '</div><div class="lbl">⏳ معلّق</div></div>';
  html += '<div class="stat"><div class="val">' + list.length + '</div><div class="lbl">👥 عدد</div></div>';
  html += '</div>';
  
  if (list.length) {
    html += '<div class="list">';
    for (const x of list) {
      const role = getRoleByKey(x.user.role) || { icon: '👤', name: '' };
      const hasPending = x.custody.all.pending > 0;
      const hasBalance = x.custody.all.balance > 0;
      
      html += '<div class="item" onclick="openCollectorDetailEnhanced(' + x.user.id + ')">';
      html += '<div class="av ' + (hasPending || hasBalance ? 'orange' : 'green') + '">' + role.icon + '</div>';
      html += '<div class="body">';
      html += '<div class="ttl">' + esc(x.user.name) + ' <span class="badge primary" style="font-size:9px">' + role.name + '</span></div>';
      html += '<div class="sub">';
      html += '📥 ' + fmtShort(x.custody.all.collected);
      html += ' • ✅ ' + fmtShort(x.custody.all.delivered);
      if (hasPending) html += ' • ⏳ ' + fmtShort(x.custody.all.pending);
      if (hasBalance) html += ' • 💰 ' + fmtShort(x.custody.all.balance);
      html += '</div></div>';
      html += '<span class="trail">›</span></div>';
    }
    html += '</div>';
  } else {
    html += '<div class="empty"><span class="ico">👥</span><h3>لا يوجد محصّلون بعد</h3></div>';
  }
  
  const container = $('collectorsContent');
  if (container) container.innerHTML = html;
}

const PAY_FILTER = {

  collector: 'all',

  reset() {
    this.year = S.currentYear;
    this.fund = 'all';
    this.collector = 'all';
    this.view = 'collector';

  }
};

/* تهيئة */
if (!PAY_FILTER.year) PAY_FILTER.year = S.currentYear;

 * الصفحة الرئيسية للدفعات
 */
renderPayments = function() {
  const y = PAY_FILTER.year || S.currentYear;
  const fund = PAY_FILTER.fund;
  const view = PAY_FILTER.view;
  const collector = PAY_FILTER.collector;

        const cid = Number(collector.slice(3));
        if (p.collectorId !== cid) return false;
      } else if (collector.indexOf('name:') === 0) {
        const cname = collector.slice(5);
        if (normAr(p.collectorName || '') !== cname) return false;
      }
    }
    return true;
  });
  
  const sumByFund = f => filtered.filter(p => p.fund === f).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const totalAssoc = sumByFund('assoc');
  const totalDeath = sumByFund('death');
  const totalDon = sumByFund('donation');

  html += '<div class="chips" style="margin-bottom:12px">';
  html += '<button class="chip ' + (fund === 'all' ? 'on' : '') + '" onclick="setPayFilterFund(\'all\')">📋 الكل</button>';
  html += '<button class="chip ' + (fund === 'assoc' ? 'on' : '') + '" onclick="setPayFilterFund(\'assoc\')">💰 جمعية</button>';
  html += '<button class="chip ' + (fund === 'death' ? 'on' : '') + '" onclick="setPayFilterFund(\'death\')">⚰️ وفاة</button>';
  html += '<button class="chip ' + (fund === 'donation' ? 'on' : '') + '" onclick="setPayFilterFund(\'donation\')">💚 تبرعات</button>';
  html += '</div>';

  collectors.slice(0, 20).forEach(function(c) {
    html += '<button class="chip ' + (collector === c.key ? 'on' : '') + '" onclick="setPayFilterCollector(\'' + c.key.replace(/'/g, "\\'") + '\')">' + esc(c.name) + '</button>';

  html += '</div>';
  
  html += '</div>';
  
  /* === الإحصائيات === */
  html += '<div class="stats-scroll">';
  html += '<div class="stat assoc"><div class="val">' + fmtShort(totalAssoc) + '</div><div class="lbl">💰 جمعية</div></div>';

  PAY_FILTER.search = q;
  renderPayments();
}, 250);

function clearPaySearch() {
  PAY_FILTER.search = '';
  renderPayments();
}

/* ═══ تغيير الفلاتر ═══ */
function setPayFilterYear(y) {
  PAY_FILTER.year = y;
  renderPayments();
}

function setPayFilterFund(f) {
  PAY_FILTER.fund = f;
  renderPayments();
}

function setPayFilterCollector(c) {
  PAY_FILTER.collector = c;
  renderPayments();
}

function setPayView(v) {
  PAY_FILTER.view = v;
  renderPayments();
}

/* ═══ عرض الدفعات المُفلترة ═══ */
function renderPaymentsFiltered(payments, view) {
  const container = $('payContent');
  if (!container) return;
  
  const search = normAr(PAY_FILTER.search || '');
  
  /* بحث */
  let list = payments;
  if (search) {
    list = payments.filter(function(p) {
      const m = p.memberId ? S.members.find(x => x.id === p.memberId) : null;
      const text = (m ? m.name + ' ' + (m.code || '') : '') + ' ' + (p.collectorName || '') + ' ' + (p.notes || '');
      return normAr(text).indexOf(search) > -1;
    });
  }
  
  if (!list.length) {
    container.innerHTML = '<div class="empty"><span class="ico">💰</span><h3>لا توجد دفعات</h3><p>جرّب فلاتر أخرى</p></div>';
    return;
  }
  
  if (view === 'collector') renderPayViewCollector(list, container);
  else if (view === 'date') renderPayViewDate(list, container);
  else if (view === 'member') renderPayViewMember(list, container);
  else renderPayViewRaw(list, container);
}

/* ═══ العرض حسب المعتمد (مع التاريخ) ═══ */
function renderPayViewCollector(payments, container) {
  const byCollector = {};
  
  payments.forEach(function(p) {
    let key, name, userId;
    
    if (p.collectorId) {
      userId = p.collectorId;
      const user = S.users.find(u => u.id === userId);
      key = 'id:' + userId;
      name = user ? user.name : (p.collectorName || 'غير معروف');
    } else {
      key = 'name:' + normAr(p.collectorName || 'غير معروف');
      name = p.collectorName || 'غير معروف';
      userId = null;
    }
    
    if (!byCollector[key]) {
      byCollector[key] = {
        key, name, userId,
        total: 0, count: 0,
        byFund: { assoc: 0, death: 0, donation: 0 },
        payments: []
      };
    }
    
    byCollector[key].total += Number(p.amount) || 0;
    byCollector[key].count++;
    byCollector[key].byFund[p.fund] += Number(p.amount) || 0;
    byCollector[key].payments.push(p);
  });
  
  const list = Object.keys(byCollector).map(k => byCollector[k]);
  list.sort((a, b) => b.total - a.total);
  
  let html = '<div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:8px;padding:0 4px">📊 ' + list.length + ' معتمد</div>';
  
  list.forEach(function(x) {
    const user = x.userId ? S.users.find(u => u.id === x.userId) : null;
    const role = user ? (getRoleByKey(user.role) || { icon: '👤' }) : { icon: '👤' };
    
    html += '<div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">';
    
    /* رأس المعتمد */
    html += '<div style="padding:12px 14px;background:var(--primary-soft);display:flex;justify-content:space-between;align-items:center">';
    html += '<div style="display:flex;align-items:center;gap:10px">';
    html += '<div style="font-size:22px">' + role.icon + '</div>';
    html += '<div><div style="font-weight:800;font-size:14px">' + esc(x.name) + '</div>';
    html += '<div style="font-size:11px;color:var(--muted);margin-top:2px">' + x.count + ' دفعة</div></div>';
    html += '</div>';
    html += '<div style="text-align:left">';
    html += '<div style="font-weight:800;color:var(--primary);font-family:\'SF Mono\',monospace;font-size:16px">' + fmtNum(x.total) + '</div>';
    html += '</div></div>';
    
    /* تفصيل */
    const parts = [];
    if (x.byFund.assoc > 0) parts.push('💰 ' + fmtShort(x.byFund.assoc));
    if (x.byFund.death > 0) parts.push('⚰️ ' + fmtShort(x.byFund.death));
    if (x.byFund.donation > 0) parts.push('💚 ' + fmtShort(x.byFund.donation));
    
    if (parts.length) {
      html += '<div style="padding:8px 14px;background:var(--bg);font-size:11px;color:var(--muted)">';
      html += parts.join(' • ');
      html += '</div>';
    }
    
    /* الدفعات مرتّبة بالتاريخ */
    const sorted = x.payments.slice().sort((a, b) => {
      const dc = (b.date || '').localeCompare(a.date || '');
      if (dc !== 0) return dc;
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });
    
    sorted.slice(0, 15).forEach(function(p) {
      const m = p.memberId ? S.members.find(x => x.id === p.memberId) : null;
      const fund = FUNDS[p.fund] || FUNDS.assoc;
      
      html += '<div style="border-bottom:1px solid var(--border-2);padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer" onclick="openPaymentReceipt(' + p.id + ')">';
      html += '<div style="width:32px;height:32px;border-radius:8px;background:var(--' + fund.color + '-soft);display:flex;align-items:center;justify-content:center;font-size:14px">' + fund.icon + '</div>';
      html += '<div style="flex:1;min-width:0">';
      html += '<div style="font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m ? m.name : 'دفعة') + '</div>';
      html += '<div style="font-size:10px;color:var(--muted);margin-top:2px">' + fmtDate(p.date) + ' • ' + fund.name + '</div>';
      html += '</div>';
      html += '<div style="font-weight:800;color:var(--success);font-size:13px;font-family:\'SF Mono\',monospace">' + fmtNum(p.amount) + '</div>';
      html += '</div>';
    });
    
    if (sorted.length > 15) {
      html += '<div style="padding:10px;background:var(--bg);text-align:center;font-size:11px;color:var(--primary);font-weight:700">';
      html += 'و ' + (sorted.length - 15) + ' دفعة أخرى';
      html += '</div>';
    }
    
    html += '</div>';
  });
  
  container.innerHTML = html;
}

/* ═══ العرض حسب العضو ═══ */
function renderPayViewMember(payments, container) {
  const byMember = {};
  payments.forEach(function(p) {
    if (!p.memberId) return;
    if (!byMember[p.memberId]) {
      byMember[p.memberId] = { memberId: p.memberId, total: 0, count: 0, payments: [] };
    }
    byMember[p.memberId].total += Number(p.amount) || 0;
    byMember[p.memberId].count++;
    byMember[p.memberId].payments.push(p);
  });
  
  const list = Object.keys(byMember).map(k => byMember[k])
    .sort((a, b) => b.total - a.total);
  
  let html = '<div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:8px;padding:0 4px">📊 ' + list.length + ' عضو دفعوا</div>';
  html += '<div class="list">';
  
  list.forEach(function(x) {
    const m = S.members.find(m => m.id === x.memberId);

    html += '<div class="item" onclick="openMemberPaymentsList(' + m.id + ')">';

  });
  
  html += '</div>';
  container.innerHTML = html;
}

/**
 * الاستيراد الذكي للأعضاء - يحدّث الموجود ويضيف الجديد
 */
async function smartImportMembers(rows, options) {
  options = options || {};
  const dryRun = options.dryRun || false;
  const stats = {
    added: 0,
    updated: 0,
    skipped: 0,
    errors: [],
    addedNames: [],
    updatedNames: []
  };
  
  /* خريطة الأعضاء الحاليين */
  const existingByCode = new Map();
  const existingByName = new Map();
  
  S.members.forEach(function(m) {
    if (m.code) existingByCode.set(String(m.code).trim(), m);
    if (m.name) existingByName.set(normAr(m.name), m);
  });
  
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    
    /* اقرأ البيانات */
    const name = cleanText(gv(r, 'الاسم الثلاثي', 'الاسم_الثلاثي', 'الاسم', 'الاسم الكامل'));
    if (!name) { stats.skipped++; continue; }
    
    const code = cleanText(gv(r, 'رقم الفرد', 'رقم_الفرد', 'الكود', 'كود العضو', 'ID'));
    const familyCode = cleanText(gv(r, 'كود الأسرة', 'كود_الأسرة', 'الأسرة'));
    const gender = cleanText(gv(r, 'الجنس')) || 'ذكر';
    const status = cleanText(gv(r, 'الحياة', 'الحالة الحياتية')) || 'حي';
    const relation = cleanText(gv(r, 'صلة القرابة', 'صلة_القرابة', 'الصلة')) || 'رب أسرة';
    const birth = toDate(gv(r, 'تاريخ الميلاد', 'تاريخ_الميلاد', 'الميلاد'));
    const sector = cleanText(gv(r, 'القطاع', 'المنطقة'));
    const phone = cleanPhone(gv(r, 'الجوال', 'الهاتف', 'رقم الجوال'));
    const notes = cleanText(gv(r, 'ملاحظات', 'ملاحظة'));
    
    /* نوع الاشتراك */
    const subTypeRaw = gv(r, 'نوع الاشتراك', 'نوع_الاشتراك', 'الاشتراك');
    const subType = normAr(subTypeRaw || '');
    const hasAssocWord = /جمعي/.test(subType);
    const hasDeathWord = /وفا/.test(subType);
    const isBoth = subType.indexOf('كلاهما') > -1 || subType.indexOf('كلا') > -1 || (hasAssocWord && hasDeathWord);
    const isNone = subType.indexOf('غير') > -1 && subType.indexOf('مشترك') > -1;
    
    let hasAssoc = false, hasDeath = false;
    if (isNone) { hasAssoc = false; hasDeath = false; }
    else if (isBoth) { hasAssoc = true; hasDeath = true; }
    else if (hasAssocWord) { hasAssoc = true; }
    else if (hasDeathWord) { hasDeath = true; }
    
    /* تواريخ البدء */
    const assocStartDate = toDate(gv(r, 'تاريخ_بدء_الجمعية', 'بداية_الجمعية', 'سنة_الجمعية'));
    const deathStartDate = toDate(gv(r, 'تاريخ_بدء_الوفاة', 'بداية_الوفاة', 'سنة_الوفاة'));
    const subDate = toDate(gv(r, 'تاريخ_الاشتراك', 'تاريخ الاشتراك'));
    
    let assocStartYear = assocStartDate ? new Date(assocStartDate).getFullYear() : null;
    let deathStartYear = deathStartDate ? new Date(deathStartDate).getFullYear() : null;
    
    /* إذا كان هناك تاريخ اشتراك عام، استخدمه */
    if (subDate && !assocStartYear && !deathStartYear) {
      const y = new Date(subDate).getFullYear();
      if (hasAssoc) assocStartYear = y;
      if (hasDeath) deathStartYear = y;
    }
    
    /* إذا كان نوع الاشتراك محدد، طبّق */
    if (subType.length > 0) {
      if (!hasAssoc && !hasDeath) { assocStartYear = null; deathStartYear = null; }
      else {
        if (hasAssoc && !assocStartYear) assocStartYear = S.currentYear;
        if (hasDeath && !deathStartYear) deathStartYear = S.currentYear;
        if (!hasAssoc) assocStartYear = null;
        if (!hasDeath) deathStartYear = null;
      }
    }
    
    /* نوع العضو */
    const memberTypeStr = normAr(gv(r, 'نوع العضو', 'نوع_العضو', 'التصنيف') || '');
    const memberType = memberTypeStr.indexOf('مخفض') > -1 ? 'مخفض' : 'عادي';
    
    /* حالة العضوية */
    const memberStatusRaw = cleanText(gv(r, 'حالة العضو', 'حالة_العضوية', 'الوضع'));
    let memberStatus = 'نشط';
    const msn = normAr(memberStatusRaw);
    if (msn.indexOf('منسحب') > -1 || msn.indexOf('انسحاب') > -1) memberStatus = 'منسحب';
    else if (msn.indexOf('متوقف') > -1 || msn.indexOf('توقف') > -1) memberStatus = 'متوقف';
    else if (msn.indexOf('معف') > -1) memberStatus = 'معفى';
    else if (msn.indexOf('متوف') > -1) memberStatus = 'متوفى';
    
    const statusDate = toDate(gv(r, 'تاريخ_الحالة', 'تاريخ الحالة'));
    const deathDate = memberStatus === 'متوفى' ? (statusDate || toDate(gv(r, 'تاريخ_الوفاة'))) : '';
    
    /* === البحث عن العضو الموجود === */
    let existing = null;
    if (code && existingByCode.has(String(code).trim())) {
      existing = existingByCode.get(String(code).trim());
    } else if (existingByName.has(normAr(name))) {
      existing = existingByName.get(normAr(name));
    }
    
    /* === تحديد الإجراء === */
    if (existing) {
      /* تحديث */
      let changed = false;
      const changes = {};
      
      const updateField = (field, newVal, oldVal) => {
        if (newVal !== undefined && newVal !== null && newVal !== '' && newVal !== oldVal) {
          changes[field] = { from: oldVal, to: newVal };
          existing[field] = newVal;
          changed = true;
        }
      };
      
      /* حقول قد تتغير */
      updateField('code', code || existing.code, existing.code);
      updateField('familyCode', familyCode || existing.familyCode, existing.familyCode);
      updateField('name', name, existing.name);
      updateField('gender', gender, existing.gender);
      updateField('status', status, existing.status);
      updateField('relation', relation, existing.relation);
      updateField('birth', birth || existing.birth, existing.birth);
      updateField('sector', sector || existing.sector, existing.sector);
      updateField('phone', phone || existing.phone, existing.phone);
      updateField('memberType', memberType, existing.memberType);
      updateField('memberStatus', memberStatus, existing.memberStatus);
      updateField('assocStartYear', assocStartYear, existing.assocStartYear);
      updateField('deathStartYear', deathStartYear, existing.deathStartYear);
      updateField('deathDate', deathDate, existing.deathDate);
      updateField('stopYear', (memberStatus === 'منسحب' || memberStatus === 'متوقف') ? (statusDate ? new Date(statusDate).getFullYear() : null) : null, existing.stopYear);
      updateField('notes', notes, existing.notes);
      
      /* الإعفاء */
      const assocExemptRaw = gv(r, 'معفى_من_الجمعية', 'إعفاء_الجمعية');
      const deathExemptRaw = gv(r, 'معفى_من_الوفاة', 'إعفاء_الوفاة');
      if (assocExemptRaw) {
        const val = normAr(assocExemptRaw).indexOf('نعم') > -1 || assocExemptRaw === '1' || assocExemptRaw === 'true';
        if (val !== existing.assocExempt) {
          existing.assocExempt = val;
          changed = true;
        }
      }
      if (deathExemptRaw) {
        const val = normAr(deathExemptRaw).indexOf('نعم') > -1 || deathExemptRaw === '1' || deathExemptRaw === 'true';
        if (val !== existing.deathExempt) {
          existing.deathExempt = val;
          changed = true;
        }
      }
      
      if (changed) {
        existing.updatedAt = new Date().toISOString();
        existing.updatedFromExcel = true;
        
        if (!dryRun) {
          await dbPut('members', existing);
        }
        stats.updated++;
        if (stats.updatedNames.length < 10) stats.updatedNames.push(name);
      } else {
        stats.skipped++;
      }
    } else {
      /* إضافة جديد */
      try {
        const member = {
          code: code || '',
          name: name,
          familyCode: familyCode,
          gender: gender,
          status: status,
          relation: relation,
          birth: birth,
          sector: sector,
          phone: phone,
          assocStartYear: hasAssoc ? (assocStartYear || S.currentYear) : null,
          deathStartYear: hasDeath ? (deathStartYear || S.currentYear) : null,
          memberType: memberType,
          memberStatus: memberStatus,
          stopYear: (memberStatus === 'منسحب' || memberStatus === 'متوقف') ? (statusDate ? new Date(statusDate).getFullYear() : null) : null,
          deathDate: deathDate,
          assocExempt: false,
          deathExempt: false,
          dependentsIds: [],
          notes: notes,
          importedAt: new Date().toISOString(),
          createdAt: new Date().toISOString()
        };
        
        if (!dryRun) {
          const newId = await dbPut('members', member);
          member.id = newId;
          S.members.push(member);
          if (code) existingByCode.set(String(code).trim(), member);
          existingByName.set(normAr(name), member);
        }
        stats.added++;
        if (stats.addedNames.length < 10) stats.addedNames.push(name);
      } catch (e) {
        stats.errors.push('صف ' + (i + 2) + ': ' + e.message);
      }
    }
  }
  
  return stats;
}

async function runSmartImport(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  
  const type = $('smartImportType').value;
  const dryRun = $('smartDryRun').checked;
  
  if (!confirm('📥 استيراد ' + (type === 'members' ? 'الأعضاء' : type === 'payments' ? 'الدفعات' : 'الوفيات') + '؟\n\n' + (dryRun ? '🧪 تجربة بدون حفظ' : '⚠️ سيتم الحفظ الفعلي'))) return;
  
  showLoad(true);
  const resultEl = $('smartImportResult');
  resultEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted)">⏳ جاري المعالجة...</div>';
  
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
    
    if (!rows.length) {
      resultEl.innerHTML = '<div style="color:var(--death);padding:14px">❌ الملف فارغ</div>';
      showLoad(false);
      return;
    }
    
    let stats;
    
    if (type === 'members') {
      stats = await smartImportMembers(rows, { dryRun });
    } else if (type === 'payments') {
      stats = await smartImportPayments(rows, { dryRun });
    } else if (type === 'deaths') {
      stats = await smartImportDeaths(rows, { dryRun });
    }
    
    /* عرض النتائج */
    let html = '';
    
    html += '<div style="padding:14px;background:var(--' + (dryRun ? 'warning' : 'donation') + '-soft);border-radius:12px;margin-bottom:14px">';
    html += '<div style="font-weight:800;font-size:15px;color:var(--' + (dryRun ? 'warning' : 'success') + ');margin-bottom:10px">';
    html += dryRun ? '🧪 نتيجة التجربة (لم يُحفظ)' : '✅ نتيجة الاستيراد';
    html += '</div>';
    html += '</div>';
    
    html += '<div class="balance-block">';
    html += '<div class="balance-row"><span class="lbl">➕ أُضيف</span><span class="val green">' + stats.added + '</span></div>';
    html += '<div class="balance-row"><span class="lbl">✏️ حُدّث</span><span class="val orange">' + stats.updated + '</span></div>';
    html += '<div class="balance-row"><span class="lbl">⏭️ تُخطّي (لم يتغير)</span><span class="val">' + stats.skipped + '</span></div>';
    if (stats.duplicates) html += '<div class="balance-row"><span class="lbl">🔁 مكرر</span><span class="val">' + stats.duplicates + '</span></div>';
    if (stats.notFound) html += '<div class="balance-row"><span class="lbl">❓ غير موجود</span><span class="val red">' + stats.notFound + '</span></div>';
    if (stats.errors && stats.errors.length) html += '<div class="balance-row"><span class="lbl">❌ أخطاء</span><span class="val red">' + stats.errors.length + '</span></div>';
    html += '</div>';
    
    /* قوائم */
    if (stats.addedNames && stats.addedNames.length) {
      html += '<div style="padding:10px;background:var(--donation-soft);border-radius:10px;margin-bottom:10px;font-size:11px">';
      html += '<b>➕ آخر المضافين:</b><br>' + stats.addedNames.map(n => '• ' + esc(n)).join('<br>');
      html += '</div>';
    }
    
    if (stats.updatedNames && stats.updatedNames.length) {
      html += '<div style="padding:10px;background:var(--warning-soft);border-radius:10px;margin-bottom:10px;font-size:11px">';
      html += '<b>✏️ آخر المحدَّثين:</b><br>' + stats.updatedNames.map(n => '• ' + esc(n)).join('<br>');
      html += '</div>';
    }
    
    if (stats.errors && stats.errors.length) {
      html += '<div style="padding:10px;background:var(--death-soft);border-radius:10px;margin-bottom:10px;font-size:11px;color:#991b1b">';
      html += '<b>❌ أخطاء:</b><br>' + stats.errors.slice(0, 5).map(e => '• ' + esc(e)).join('<br>');
      html += '</div>';
    }
    
    if (dryRun) {
      html += '<div style="padding:10px;background:var(--info-soft);border-radius:10px;font-size:11px;color:#1e40af;margin-top:10px">';
      html += '💡 هذه تجربة فقط. أزل علامة "تجربة" ثم أعد الاستيراد للحفظ.';
      html += '</div>';
    } else {
      html += '<div style="padding:10px;background:var(--success-soft);border-radius:10px;font-size:11px;color:#065f46;margin-top:10px">';
      html += '✅ تم الحفظ. أغلق النافذة وابدأ الاستخدام.';
      html += '</div>';
      
      /* إعادة تحميل */
      await loadAll();
      CACHE.invalidateAll();
    }
    
    resultEl.innerHTML = html;
    showLoad(false);
    
    if (!dryRun) {
      toast('✅ أُضيف ' + stats.added + ' | حُدّث ' + stats.updated, 'success', 4000);
    } else {
      toast('🧪 تجربة: ' + stats.added + ' جديد + ' + stats.updated + ' محدَّث', 'info', 4000);
    }
    
  } catch (e) {
    console.error(e);
    resultEl.innerHTML = '<div style="padding:14px;background:var(--death-soft);border-radius:10px;color:#991b1b">❌ خطأ: ' + esc(e.message) + '</div>';
    showLoad(false);
  }
}

/* ═══ استيراد الدفعات الذكي ═══ */
async function smartImportPayments(rows, options) {
  const dryRun = options.dryRun || false;
  const stats = {
    added: 0, updated: 0, skipped: 0, duplicates: 0, notFound: 0,
    errors: [], addedNames: [], updatedNames: [], notFoundNames: []
  };
  
  /* خريطة الأعضاء */
  const memberByCode = new Map();
  const memberByName = new Map();
  S.members.forEach(function(m) {
    if (m.code) memberByCode.set(String(m.code).trim(), m);
    if (m.name) memberByName.set(normAr(m.name), m);
  });
  
  /* خريطة للدفعات المكررة */
  const existingPayments = new Set();
  S.payments.forEach(function(p) {
    const key = (p.memberId || '') + '|' + (p.amount || '') + '|' + (p.date || '') + '|' + (p.fund || '');
    existingPayments.add(key);
  });
  
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    
    const memberCode = cleanText(gv(r, 'رقم الفرد', 'الكود', 'كود العضو', 'ID'));
    const memberName = cleanText(gv(r, 'اسم المشترك', 'اسم العضو', 'العضو', 'الاسم'));
    
    if (!memberCode && !memberName) { stats.skipped++; continue; }
    
    /* ابحث عن العضو */
    let member = null;
    if (memberCode && memberByCode.has(String(memberCode).trim())) {
      member = memberByCode.get(String(memberCode).trim());
    } else if (memberName && memberByName.has(normAr(memberName))) {
      member = memberByName.get(normAr(memberName));
    }
    
    if (!member) {
      stats.notFound++;
      if (stats.notFoundNames.length < 10) stats.notFoundNames.push(memberName || memberCode);
      continue;
    }
    
    /* اقرأ الدفعة */
    const amountStr = String(gv(r, 'المبلغ', 'القيمة', 'Amount') || '').replace(/[,،\s]/g, '');
    const amount = Number(amountStr);
    if (!amount || amount <= 0) { stats.skipped++; continue; }
    
    const date = toDate(gv(r, 'تاريخ الدفع', 'التاريخ', 'تاريخ_الدفع')) || today();
    const yearStr = String(gv(r, 'السنة', 'سنة', 'العام') || '').replace(/[^\d]/g, '');
    const forYear = Number(yearStr) || new Date(date).getFullYear();
    
    /* الصندوق */
    const typeStr = normAr(gv(r, 'نوع القسط', 'النوع', 'الصندوق', 'نوع الدفعة') || '');
    let fund = 'assoc';
    if (/وفا/.test(typeStr)) fund = 'death';
    else if (/تبرع|صدقه/.test(typeStr)) fund = 'donation';
    
    /* المعتمد */
    const collectorName = cleanText(gv(r, 'اسم المعتمد', 'المعتمد', 'المحصل', 'الجابي')) || '';
    
    /* فحص التكرار */
    const key = member.id + '|' + amount + '|' + date + '|' + fund;
    if (existingPayments.has(key)) {
      stats.duplicates++;
      stats.skipped++;
      continue;
    }
    
    /* إضافة الدفعة */
    try {
      const payment = {
        memberId: member.id,
        fund: fund,
        amount: amount,
        date: date,
        year: forYear,
        forYear: forYear,
        notes: cleanText(gv(r, 'ملاحظات', 'ملاحظة')),
        collectorId: null,
        collectorName: collectorName || 'استيراد',
        imported: true,
        importedAt: new Date().toISOString(),
        createdAt: new Date().toISOString()
      };
      
      if (!dryRun) {
        const newId = await dbPut('payments', payment);
        payment.id = newId;
        S.payments.push(payment);
        existingPayments.add(key);
      }
      
      stats.added++;
      if (stats.addedNames.length < 10) stats.addedNames.push(member.name + ' — ' + fmtNum(amount));
    } catch (e) {
      stats.errors.push('صف ' + (i + 2) + ': ' + e.message);
    }
  }
  
  return stats;
}

/* ═══ استيراد الوفيات الذكي ═══ */
async function smartImportDeaths(rows, options) {
  const dryRun = options.dryRun || false;
  const stats = {
    added: 0, updated: 0, skipped: 0, duplicates: 0,
    errors: [], addedNames: [], updatedNames: []
  };
  
  /* خريطة للوفيات الموجودة */
  const existingDeaths = new Map();
  S.deaths.forEach(function(d) {
    const key = normAr(d.deceasedName) + '|' + d.year;
    existingDeaths.set(key, d);
  });
  
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    
    const name = cleanText(gv(r, 'اسم المتوفى', 'الاسم', 'المتوفى'));
    if (!name) { stats.skipped++; continue; }
    
    const date = toDate(gv(r, 'تاريخ الوفاة', 'التاريخ')) || today();
    const yearStr = String(gv(r, 'السنة', 'سنة') || '').replace(/[^\d]/g, '');
    const year = Number(yearStr) || new Date(date).getFullYear();
    
    const compStr = String(gv(r, 'التعويض', 'قيمة التعويض') || '').replace(/[,،\s]/g, '');
    const comp = compStr ? Number(compStr) : 0;
    
    const recipient = cleanText(gv(r, 'مَن استلم', 'المستلم', 'استلم')) || '';
    const notes = cleanText(gv(r, 'ملاحظات', 'ملاحظة')) || '';
    
    /* فحص التكرار */
    const key = normAr(name) + '|' + year;
    const existing = existingDeaths.get(key);
    
    if (existing) {
      /* قد يكون هناك تحديث لبيانات الوفاة */
      let changed = false;
      
      if (comp > 0 && existing.compensation !== comp) {
        existing.compensation = comp;
        changed = true;
      }
      if (recipient && existing.recipient !== recipient) {
        existing.recipient = recipient;
        changed = true;
      }
      if (notes && existing.notes !== notes) {
        existing.notes = notes;
        changed = true;
      }
      
      if (changed) {
        existing.updatedAt = new Date().toISOString();
        existing.updatedFromExcel = true;
        if (!dryRun) await dbPut('deaths', existing);
        stats.updated++;
        if (stats.updatedNames.length < 10) stats.updatedNames.push(name);
      } else {
        stats.duplicates++;
        stats.skipped++;
      }
      continue;
    }
    
    /* إضافة جديد */
    try {
      const death = {
        deceasedName: name,
        deathDate: date,
        year: year,
        compensation: comp,
        recipient: recipient,
        notes: notes,
        imported: true,
        importedAt: new Date().toISOString(),
        recordedBy: S.currentUser ? S.currentUser.id : null,
        recordedByName: S.currentUser ? S.currentUser.name + ' (استيراد)' : 'استيراد',
        createdAt: new Date().toISOString()
      };
      
      if (!dryRun) {
        const newId = await dbPut('deaths', death);
        death.id = newId;
        S.deaths.push(death);
      }
      
      stats.added++;
      if (stats.addedNames.length < 10) stats.addedNames.push(name);
    } catch (e) {
      stats.errors.push('صف ' + (i + 2) + ': ' + e.message);
    }
  }
  
  return stats;
}

/* ═══ إضافة زر الاستيراد الذكي للإدارة ═══ */
const _origRenderAdmin14 = renderAdmin;
renderAdmin = function() {
  _origRenderAdmin14();
  
  setTimeout(function() {
    const pg = $('pg-admin');
    if (!pg) return;
    if (pg.querySelector('[data-smart-import]')) return;
    
    /* ابحث عن بطاقة الاستيراد */
    const btns = pg.querySelectorAll('button');
    let importBtn = null;
    btns.forEach(b => {
      if (b.textContent.indexOf('استيراد Excel') > -1) importBtn = b;
    });
    
    if (importBtn) {
      const smartBtn = document.createElement('button');
      smartBtn.setAttribute('data-smart-import', 'true');
      smartBtn.className = 'btn info block';
      smartBtn.style.marginBottom = '8px';
      smartBtn.innerHTML = '🔄 الاستيراد الذكي (تحديث مستمر)';
      smartBtn.onclick = openSmartImportSheet;
      importBtn.parentNode.insertBefore(smartBtn, importBtn.nextSibling);
    }
  }, 150);
};
