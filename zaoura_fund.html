function openFundPaymentForm(fund, memberId){
  const year = S.currentYear;
  const labels = { assoc:{ icon:'💰', name:'دفعة جمعية', color:'var(--assoc)' }, death:{ icon:'⚰️', name:'دفعة وفاة', color:'var(--death)' }, donation:{ icon:'💚', name:'تبرع', color:'var(--donation)' } };
  const L = labels[fund];
  const showSearch = fund !== 'donation';

  const body = `
    <div style="padding:14px;background:var(--bg);border-radius:14px;margin-bottom:14px;text-align:center;border:2px solid ${L.color}">
      <div style="font-size:32px">${L.icon}</div>
      <div style="font-size:15px;font-weight:800;color:${L.color};margin-top:4px">${L.name}</div>
    </div>
    ${showSearch ? `
      <div class="fld" style="position:relative">
        <label>العضو <span class="req">*</span></label>
        <input id="pMemberInput" placeholder="اكتب اسم العضو..." oninput="onMemberSearch('${fund}')" onfocus="onMemberSearch('${fund}')" autocomplete="off">
        <input type="hidden" id="pMemberId" value="${memberId || ''}">
        <div class="options-list" id="pMemberOptions"></div>
      </div>
    ` : `
      <div class="fld"><label>اسم المتبرع</label><input id="pDonorName" placeholder="اختياري"></div>
    `}
    <div id="pDuesBox" style="display:none;margin-bottom:14px"></div>
    <div class="fld" id="pAmountField" style="display:none">
      <label>المبلغ (يمكن 0 للأعضاء المعفيين)</label>
      <div class="amount-input" style="border-color:${L.color}">
        <input id="pAmount" type="tel" inputmode="numeric" placeholder="0" style="color:${L.color}">
        <span class="currency">ل.س</span>
      </div>
      <div class="amount-quick" id="pQuickButtons"></div>
    </div>
    <div class="fld-row" id="pDateRow" style="display:none">
      <div class="fld"><label>التاريخ</label><input id="pDate" type="date" value="${today()}"></div>
      <div class="fld"><label>سنة الدفعة</label><select id="pForYear">${[2025,2026,2027,2028,2029].map(y => `<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}</select></div>
    </div>
    <div class="fld" id="pNotesField" style="display:none"><label>ملاحظات</label><input id="pNotes" placeholder="اختياري"></div>
  `;

  const foot = `<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn primary" onclick="savePayment('${fund}')">💾 حفظ</button>`;
  openSheet(`${L.icon} ${L.name}`, body, foot, { focus: showSearch ? 'pMemberInput' : 'pDonorName' });
  window._currentFund = fund;

  if(fund === 'donation'){
    $('pAmountField').style.display = 'block';
    $('pDateRow').style.display = 'grid';
    $('pNotesField').style.display = 'block';
    $('pQuickButtons').innerHTML = `<button onclick="$('pAmount').value=5000">5,000</button><button onclick="$('pAmount').value=10000">10,000</button><button onclick="$('pAmount').value=50000">50,000</button><button onclick="$('pAmount').value=100000">100,000</button>`;
  } else if(memberId){
    const m = getMemberById(memberId);
    if(m){ $('pMemberInput').value = m.name; $('pMemberId').value = m.id; showMemberDuesInForm(fund, m.id); }
  }
}

function onMemberSearch(fund){
  const input = $('pMemberInput');
  const opts = $('pMemberOptions');
  if(!input || !opts) return;
  const q = input.value.trim();
  const isAssoc = fund === 'assoc';
  const isDeath = fund === 'death';

  let list = S.members.filter(m => {
    if(isAssoc) return m.assocStartYear;
    if(isDeath) return m.deathStartYear;
    return false;
  });

  if(S.currentUser && S.currentUser.role === 'collector'){
    if(S.currentUser.collectFund === 'assoc') list = list.filter(m => m.assocStartYear);
    if(S.currentUser.collectFund === 'death') list = list.filter(m => m.deathStartYear);
    if(S.currentUser.sector) list = list.filter(m => m.sector === S.currentUser.sector);
  }

  if(q){
    const s = normAr(q);
    list = list.filter(m => normAr(`${m.name} ${m.code||''} ${m.sector||''} ${m.familyCode||''}`).includes(s));
  }
  list = list.slice(0, 30);

  if(!list.length){
    opts.innerHTML = `<div style="padding:12px;color:var(--muted);font-size:13px;text-align:center">${q ? '⚠️ لا نتائج' : 'اكتب اسماً'}</div>`;
  } else {
    opts.innerHTML = list.map(m => {
      const full = computeMemberFull(m.id);
      const rem = isAssoc ? (full?.total.assocRem || 0) : (full?.total.deathRem || 0);
      return `<div class="option-item" onclick="selectPaymentMember(${m.id},'${esc(m.name).replace(/'/g,"&#39;")}')">
        <div style="flex:1;min-width:0"><div style="font-weight:700">${esc(m.name)}</div><div style="font-size:10px;color:var(--muted)">${esc(m.code||'')} • ${esc(m.sector||'')}</div></div>
        <small style="color:${rem > 0 ? 'var(--danger)' : 'var(--success)'};font-weight:700">${rem > 0 ? 'متبقي ' + fmtShort(rem) : '✅'}</small>
      </div>`;
    }).join('');
  }
  opts.classList.add('on');
}

function selectPaymentMember(id, name){
  $('pMemberInput').value = name;
  $('pMemberId').value = id;
  $('pMemberOptions').classList.remove('on');
  showMemberDuesInForm(window._currentFund, id);
}

function showMemberDuesInForm(fund, memberId){
  const m = getMemberById(memberId);
  if(!m) return;
  const full = computeMemberFull(memberId);
  if(!full) return;

  const isAssoc = fund === 'assoc';
  const fundColor = isAssoc ? 'var(--assoc)' : 'var(--death)';
  const fundIcon = isAssoc ? '💰' : '⚰️';
  const rem = isAssoc ? full.total.assocRem : full.total.deathRem;
  const req = isAssoc ? full.total.assocReq : full.total.deathReq;
  const paid = isAssoc ? full.total.assocPaid : full.total.deathPaid;
  const yearlyReq = isAssoc ? full.total.assocYearlyReq : 0;
  const joinReq = isAssoc ? full.total.assocJoinReq : full.total.deathJoinReq;
  const installReq = isAssoc ? 0 : full.total.deathInstallReq;

  const html = `
    <div style="padding:14px;background:var(--bg);border-radius:12px;border:2px solid ${fundColor}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div><div style="font-weight:800;font-size:15px">${esc(m.name)}</div><div style="font-size:11px;color:var(--muted)">${esc(m.code||'')} • ${esc(m.sector||'')}</div></div>
        <div style="font-size:24px">${fundIcon}</div>
      </div>
      <div style="padding:10px;background:var(--card);border-radius:8px">
        ${yearlyReq > 0 ? `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px"><span class="muted">📅 اشتراكات سنوية</span><b>${fmtNum(yearlyReq)}</b></div>` : ''}
        ${joinReq > 0 ? `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px;color:var(--warning)"><span>🎫 رسوم انضمام</span><b>${fmtNum(joinReq)}</b></div>` : ''}
        ${installReq > 0 ? `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px"><span>📊 أقساط وفيات</span><b>${fmtNum(installReq)}</b></div>` : ''}
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-top:1px dashed var(--border);margin-top:4px"><span class="muted">إجمالي المطلوب</span><b>${fmtNum(req)}</b></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span class="muted">✅ المدفوع</span><b style="color:var(--success)">${fmtNum(paid)}</b></div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:2px solid ${fundColor};margin-top:4px"><span style="font-weight:800">المتبقي</span><b style="font-weight:800;color:${rem > 0 ? 'var(--danger)' : 'var(--success)'}">${fmtNum(rem)} ل.س</b></div>
      </div>
    </div>
  `;

  $('pDuesBox').innerHTML = html;
  $('pDuesBox').style.display = 'block';
  $('pAmountField').style.display = 'block';
  $('pDateRow').style.display = 'grid';
  $('pNotesField').style.display = 'block';

  const buttons = [];
  if(rem > 0) buttons.push(`<button onclick="$('pAmount').value=${rem}">💰 كامل ${fmtShort(rem)}</button>`);
  buttons.push(`<button onclick="$('pAmount').value=5000">5,000</button>`);
  buttons.push(`<button onclick="$('pAmount').value=10000">10,000</button>`);
  buttons.push(`<button onclick="$('pAmount').value=25000">25,000</button>`);
  buttons.push(`<button onclick="$('pAmount').value=0">0 (معفى)</button>`);
  $('pQuickButtons').innerHTML = buttons.join('');
  $('pAmount').value = rem > 0 ? rem : '';
}

async function savePayment(fund){
  const isDonation = fund === 'donation';
  const memberId = isDonation ? null : Number($('pMemberId').value);
  const amount = Number($('pAmount').value);
  const date = $('pDate').value;
  const forYear = Number($('pForYear').value);
  const notes = $('pNotes')?.value?.trim() || '';
  const donorName = isDonation ? ($('pDonorName')?.value?.trim() || '') : '';

  if(!isDonation && !memberId){ toast('اختر العضو','error'); return; }
  if(isNaN(amount) || amount < 0){ toast('المبلغ غير صحيح','error'); return; }
  if(!date){ toast('التاريخ مطلوب','error'); return; }

  if(amount === 0){
    if(!confirm('هل أنت متأكد من تسجيل دفعة بقيمة 0؟ (للأعضاء المعفيين)')) return;
  }

  showLoad(true);
  try{
    const payment = {
      memberId,
      fund, amount, date,
      year: forYear, forYear,
      notes: isDonation ? (donorName + (notes ? ' | ' + notes : '')) : notes,
      collectorId: S.currentUser.id,
      collectorName: S.currentUser.name,
      createdAt: new Date().toISOString()
    };
    const id = await dbPut('payments', payment);
    payment.id = id;
    S.payments.push(payment);

    await logAudit('add', 'payment', id, { fund, memberId, amount, forYear });
    toast('✅ تم تسجيل الدفعة', 'success', 2500);
    closeSheet();
    if(S.page === 'pg-home') renderHome();
    if(S.page === 'pg-members') renderMembers();
    if(S.page === 'pg-payments') renderPayments();
  } catch(e){ console.error(e); toast('خطأ: ' + e.message, 'error'); }
  showLoad(false);
}

function searchDeathMember(){
  const input = $('dMemberInput');
  const opts = $('dMemberOptions');
  if(!input || !opts) return;
  const q = input.value.trim();
  if(q.length < 1){ opts.classList.remove('on'); return; }

  const s = normAr(q);
  const list = S.members.filter(m => normAr(m.name).includes(s) || normAr(m.code||'').includes(s)).slice(0, 20);

  if(!list.length){ opts.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:13px;text-align:center">لا نتائج</div>'; opts.classList.add('on'); return; }

  opts.innerHTML = list.map(m => `
    <div class="option-item" onclick="pickDeathMember(${m.id},'${esc(m.name).replace(/'/g,"&#39;")}')">
      <div style="flex:1;min-width:0"><div style="font-weight:700">${esc(m.name)}</div><div style="font-size:10px;color:var(--muted)">${esc(m.code||'')} • ${esc(m.sector||'')}</div></div>
    </div>
  `).join('');
  opts.classList.add('on');
}

function pickDeathMember(id, name){
  $('dMemberInput').value = name;
  $('dMemberId').value = id;
  if(!$('dName').value) $('dName').value = name;
  $('dMemberOptions').classList.remove('on');
}

async function saveDeath(){
  const name = cleanText($('dName').value);
  const date = $('dDate').value;
  const year = Number($('dYear').value);
  const comp = Number($('dComp').value) || 0;
  const recipient = cleanText($('dRecipient').value);
  const notes = cleanText($('dNotes').value);
  const memberId = $('dMemberId').value ? Number($('dMemberId').value) : null;

  if(!name){ toast('اسم المتوفى مطلوب','error'); return; }
  if(!date){ toast('التاريخ مطلوب','error'); return; }

  // فحص التكرار
  const isDuplicate = S.deaths.some(d =>
    normAr(d.deceasedName) === normAr(name) &&
    Number(d.year) === year
  );
  if(isDuplicate){
    if(!confirm('⚠️ يوجد وفاة بنفس الاسم في هذه السنة. تسجيل مرة أخرى؟')) return;
  }

  const deathSubs = S.members.filter(m => m.deathStartYear && m.deathStartYear <= year && !m.deathExempt).length;
  const c = getConstants(year);
  const inst = c?.deathInstallment || 5000;
  const totalImpact = deathSubs * inst;

  if(!confirm(`⚰️ تسجيل وفاة "${name}"\n\nعدد مشتركي الوفاة: ${deathSubs}\nسيُضاف قسط ${fmtNum(inst)} × ${deathSubs} = ${fmtNum(totalImpact)} ل.س\n\nمتابعة؟`)) return;

  try{
    const death = {
      deceasedName: name,
      memberId,
      deathDate: date,
      year,
      compensation: comp,
      recipient,
      notes,
      recordedBy: S.currentUser.id,
      recordedByName: S.currentUser.name,
      createdAt: new Date().toISOString()
    };
    const id = await dbPut('deaths', death);
    death.id = id;
    S.deaths.push(death);
    await logAudit('add', 'death', id, { name, year, comp });

    toast(`⚰️ تم تسجيل الوفاة (${deathSubs} قسط)`, 'success', 4000);
    closeSheet();
    if(S.page === 'pg-home') renderHome();
    if(S.page === 'pg-members') renderMembers();
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function saveExpense(id = null){
  const fund = $('eFund').value;
  const category = $('eCategory').value;
  const description = cleanText($('eDesc').value);
  const amount = Number($('eAmount').value);
  const date = $('eDate').value;
  const year = Number($('eYear').value);
  const notes = cleanText($('eNotes').value);

  if(!description){ toast('الوصف مطلوب','error'); return; }
  if(!amount || amount <= 0){ toast('المبلغ مطلوب','error'); return; }

  try{
    const obj = { fund, category, description, amount, date, year, notes, recordedByName: S.currentUser.name };
    if(id){
      const old = await dbGet('expenses', id);
      obj.id = id;
      obj.createdAt = old.createdAt;
      obj.createdBy = old.createdBy;
      await dbPut('expenses', obj);
      const i = S.expenses.findIndex(x => x.id === id);
      if(i > -1) S.expenses[i] = obj;
      toast('✅ تم التعديل');
    } else {
      obj.createdAt = new Date().toISOString();
      obj.createdBy = S.currentUser.id;
      const newId = await dbPut('expenses', obj);
      obj.id = newId;
      S.expenses.push(obj);
      toast('✅ تم التسجيل');
    }
    await logAudit(id ? 'update' : 'add', 'expense', obj.id, { amount });
    closeSheet();
    if(S.page === 'pg-home') renderHome();
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function deleteExpense(id){
  if(!hasPerm('expense.add')) return;
  if(!confirm('حذف المصروف؟')) return;
  try{
    await dbDel('expenses', id);
    S.expenses = S.expenses.filter(x => x.id !== id);
    await logAudit('delete', 'expense', id, {});
    toast('🗑️');
    closeSheet();
    if(S.page === 'pg-home') renderHome();
  } catch(e){ toast('خطأ','error'); }
}

async function saveDelivery(){
  const fund = $('delFund').value;
  const toUserId = Number($('delTo').value);
  const amount = Number($('delAmount').value);
  const notes = cleanText($('delNotes').value);

  if(!toUserId){ toast('اختر المستلم','error'); return; }
  if(!amount || amount <= 0){ toast('المبلغ مطلوب','error'); return; }

  const toUser = S.users.find(u => u.id === toUserId);
  if(!toUser) return;

  try{
    const delivery = {
      fromUserId: S.currentUser.id,
      fromUserName: S.currentUser.name,
      toUserId,
      toUserName: toUser.name,
      fund, amount, notes,
      date: today(),
      createdAt: new Date().toISOString()
    };
    const id = await dbPut('deliveries', delivery);
    delivery.id = id;
    S.deliveries.push(delivery);
    await logAudit('add', 'delivery', id, { amount, to: toUser.name });
    toast('📤 تم تسجيل التسليم', 'success', 2500);

    setTimeout(() => {
      if(confirm('📱 إرسال توثيق واتساب؟')){
        const txt = `📤 *توثيق تسليم*\n\nمن: ${S.currentUser.name}\nإلى: ${toUser.name}\nالمبلغ: ${fmtNum(amount)} ل.س\nالصندوق: ${fund === 'assoc' ? '💰 الجمعية' : '⚰️ الوفاة'}\nالتاريخ: ${today()}\n${notes ? 'ملاحظات: ' + notes : ''}\n\n_صندوق زعورة_`;
        window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
      }
    }, 400);

    closeSheet();
    if(S.page === 'pg-home') renderHome();
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function saveStoreItem(id = null){
  const name = cleanText($('stiName').value);
  if(!name){ toast('اسم المادة مطلوب','error'); return; }

  try{
    const obj = {
      name,
      category: $('stiCategory').value,
      unit: cleanText($('stiUnit').value) || 'قطعة',
      quantity: Number($('stiQuantity').value) || 0,
      totalOwned: Number($('stiOwned').value) || 0,
      condition: $('stiCondition').value,
      notes: cleanText($('stiNotes').value)
    };
    if(id){
      obj.id = id;
      await dbPut('storeItems', obj);
      const i = S.storeItems.findIndex(x => x.id === id);
      if(i > -1) S.storeItems[i] = obj;
      toast('✅');
    } else {
      const newId = await dbPut('storeItems', obj);
      obj.id = newId;
      S.storeItems.push(obj);
      toast('✅');
    }
    closeSheet();
    setTimeout(openStoreSheet, 250);
  } catch(e){ toast('خطأ','error'); }
}

async function saveStoreMovement(){
  const itemId = Number($('stmItemId').value);
  const type = $('stmType').value;
  const qty = Number($('stmQty').value);

  if(!itemId){ toast('اختر المادة','error'); return; }
  if(!qty || qty <= 0){ toast('الكمية مطلوبة','error'); return; }

  const item = S.storeItems.find(x => x.id === itemId);
  if(!item) return;

  const oldQty = Number(item.quantity) || 0;
  let newQty = oldQty;
  if(type === 'out' || type === 'damaged') newQty = oldQty - qty;
  else if(type === 'in' || type === 'new') newQty = oldQty + qty;

  if(newQty < 0){ toast('الكمية غير كافية','error'); return; }

  try{
    const movement = {
      itemId, itemName: item.name, type, quantity: qty,
      ref: cleanText($('stmRef').value),
      notes: cleanText($('stmNotes').value),
      oldQuantity: oldQty, newQuantity: newQty,
      userName: S.currentUser.name,
      date: today(),
      createdAt: new Date().toISOString()
    };
    await dbPut('storeMovements', movement);
    S.storeMovements.push(movement);

    item.quantity = newQty;
    if(type === 'new') item.totalOwned = (item.totalOwned || 0) + qty;
    if(type === 'damaged') item.condition = 'يحتاج صيانة';
    await dbPut('storeItems', item);

    await logAudit('add', 'storeMovement', itemId, { type, qty });
    toast('✅ تم');
    closeSheet();
  } catch(e){ toast('خطأ','error'); }
}

      </div>
    `).join('')}
  `;

  const foot = `<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn primary" onclick="saveInventory()">💾 حفظ الجرد</button>`;
  openSheet('📋 الجرد السنوي', body, foot, { wide:true });

async function saveInventory(){
  let changed = 0;
  for(const item of S.storeItems){
    const input = $(`inv_${item.id}`);
    if(!input) continue;
    const actual = Number(input.value);
    if(isNaN(actual) || actual < 0) continue;
    const old = Number(item.quantity) || 0;
    if(actual === old) continue;

    const diff = actual - old;
    const movement = {
      itemId: item.id, itemName: item.name,
      type: diff > 0 ? 'in' : 'damaged',
      quantity: Math.abs(diff),
      ref: 'جرد سنوي',
      oldQuantity: old, newQuantity: actual,
      userName: S.currentUser.name,
      date: today(),
      createdAt: new Date().toISOString()
    };
    await dbPut('storeMovements', movement);
    S.storeMovements.push(movement);
    item.quantity = actual;
    await dbPut('storeItems', item);
    changed++;
  }
  toast(`✅ تم الجرد (${changed} تعديل)`, 'success', 3000);
  closeSheet();
}

async function saveUser(id = null){
  const name = cleanText($('uName').value);
  const pin = $('uPin').value.trim();
  if(!name){ toast('الاسم مطلوب','error'); return; }
  if(pin && !/^\d{4}$/.test(pin)){ toast('كلمة المرور: 4 أرقام','error'); return; }

  const role = $('uRole').value;
  const collectFund = role === 'collector' ? ($('uCollectFund')?.value || 'both') : null;
  const sector = role === 'collector' ? ($('uSector')?.value || '') : '';
  const memberId = role === 'member' ? (Number($('uMemberId')?.value) || null) : null;

  if(role === 'member' && !memberId){ toast('يجب ربط المشترك بعضو','error'); return; }

  try{
    const old = id ? await dbGet('users', id) : null;
    const obj = {
      name,
      phone: cleanPhone($('uPhone').value),
      role, collectFund, sector, memberId,
      hasPin: pin ? true : (old ? old.hasPin : false),
      pin: pin ? pin : (old ? old.pin : null),
      createdAt: old ? old.createdAt : new Date().toISOString()
    };
    if(id){
      obj.id = id;
      await dbPut('users', obj);
      const i = S.users.findIndex(x => x.id === id);
      if(i > -1) S.users[i] = obj;
      if(S.currentUser && S.currentUser.id === id) S.currentUser = obj;
      toast('✅');
    } else {
      const newId = await dbPut('users', obj);
      obj.id = newId;
      S.users.push(obj);
      toast('✅');
    }
    closeSheet();
    setTimeout(openUsersSheet, 250);
  } catch(e){ toast('خطأ','error'); }
}

async function deleteUser(id){
  if(!confirm('حذف المستخدم؟')) return;
  const u = S.users.find(x => x.id === id);
  if(u.role === 'president' && S.users.filter(x => x.role === 'president').length <= 1){
    toast('لا يمكن حذف الرئيس الوحيد','error');
    return;
  }
  try{
    await dbDel('users', id);
    S.users = S.users.filter(x => x.id !== id);
    toast('🗑️');
    closeSheet();
    setTimeout(openUsersSheet, 250);
  } catch(e){ toast('خطأ','error'); }
}

async function saveConstant(year){
  try{
    const obj = {
      year,
      assocYearly: Number($('cAssocY').value) || 0,
      assocYearlyReduced: Number($('cAssocYR').value) || 0,
      deathInstallment: Number($('cDeathInst').value) || 0,
      deathCompensation: Number($('cDeathComp').value) || 0,
      joinAssocFee: Number($('cJoinA').value) || 0,
      joinAssocFeeReduced: Number($('cJoinAR').value) || 0,
      joinDeathFee: Number($('cJoinD').value) || 0,
      joinDeathFeeReduced: Number($('cJoinDR').value) || 0
    };
    const existing = S.constants.find(x => x.year === year);
    if(existing){
      obj.id = existing.id;
      await dbPut('constants', obj);
      const i = S.constants.findIndex(x => x.year === year);
      if(i > -1) S.constants[i] = obj;
    } else {
      const newId = await dbPut('constants', obj);
      obj.id = newId;
      S.constants.push(obj);
    }
    await logAudit('update', 'constant', year, obj);
    toast(`✅ تم حفظ ثوابت ${year}`);
    closeSheet();
    setTimeout(openConstantsSheet, 250);
  } catch(e){ toast('خطأ','error'); }
}

async function saveCustomField(idx = null){
  const icon = cleanText($('cfIcon').value) || '📌';
  const label = cleanText($('cfLabel').value);
  const key = cleanText($('cfKey').value).replace(/[^a-zA-Z0-9]/g, '');
  const hint = cleanText($('cfHint').value);
  const required = $('cfRequired').checked;

  if(!label){ toast('اسم الحقل مطلوب','error'); return; }
  if(!key){ toast('المفتاح مطلوب (بالإنجليزية)','error'); return; }

  const duplicate = S.customFields.some((c, i) => i !== idx && c.key === key);
  if(duplicate){ toast('المفتاح مستخدم بالفعل','error'); return; }

  try{
    const obj = { icon, label, key, hint, required };
    if(idx !== null){
      obj.id = S.customFields[idx]?.id;
      S.customFields[idx] = obj;
      await dbPut('customFields', obj);
      toast('✅');
    } else {
      const newId = await dbPut('customFields', obj);
      obj.id = newId;
      S.customFields.push(obj);
      toast('✅');
    }
    closeSheet();
    setTimeout(openCustomFieldsSheet, 250);
  } catch(e){ toast('خطأ','error'); }
}

async function deleteCustomField(idx){
  if(!confirm('حذف هذا الحقل؟')) return;
  try{
    const cf = S.customFields[idx];
    if(cf?.id) await dbDel('customFields', cf.id);
    S.customFields.splice(idx, 1);
    toast('🗑️');
    closeSheet();
    setTimeout(openCustomFieldsSheet, 250);
  } catch(e){ toast('خطأ','error'); }
}

/* 👨‍👩‍👧 تقرير العائلات */
function openFamilyReport(){
  const families = {};
  S.members.forEach(m => {
    const key = m.familyCode || 'بدون كود';
    if(!families[key]) families[key] = { code: key, members: [] };
    families[key].members.push(m);
  });

  for(const key in families){
    const f = families[key];
    f.totalPaid = 0; f.totalRem = 0; f.paidCount = 0;
    f.members.forEach(m => {
      const full = computeMemberFull(m.id);
      if(full){
        f.totalPaid += full.total.totalPaid;
        f.totalRem += full.total.totalRem;
        if(full.total.totalPaid > 0) f.paidCount++;
      }
    });
  }

  const list = Object.values(families).sort((a,b) => b.members.length - a.members.length);

  const body = `
    <div style="padding:14px;background:var(--primary-soft);border-radius:12px;margin-bottom:14px;text-align:center">
      <div style="font-size:12px;color:var(--muted)">عدد الأسر</div>
      <div style="font-size:28px;font-weight:800;color:var(--primary)">${list.length}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">${S.members.length} عضو</div>
    </div>
    <div class="list">
      ${list.slice(0, 300).map(f => `
        <div class="item" onclick="openFamilyDetail('${esc(f.code).replace(/'/g,"\\'")}')">
          <div class="av">👨‍👩‍👧</div>
          <div class="body">
            <div class="ttl">عائلة ${esc(f.code)} <span class="badge primary">${f.members.length}</span></div>
            <div class="sub">${f.paidCount} دافع • دُفع ${fmtShort(f.totalPaid)}${f.totalRem > 0 ? ' • متبقي ' + fmtShort(f.totalRem) : ' • ✅'}</div>
          </div>
          <span class="trail">›</span>
        </div>
      `).join('')}
    </div>
  `;
  openSheet('👨‍👩‍👧 تقرير العائلات', body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide:true });
}

function openFamilyDetail(familyCode){
  const members = S.members.filter(m => (m.familyCode || 'بدون كود') === familyCode);
  if(!members.length) return;

  let totalPaid = 0, totalReq = 0, totalRem = 0;
  members.forEach(m => {
    const full = computeMemberFull(m.id);
    if(full){
      totalPaid += full.total.totalPaid;
      totalReq += full.total.totalReq;
      totalRem += full.total.totalRem;
    }
  });

  const body = `
    <div style="padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-radius:14px;margin-bottom:14px;text-align:center">
      <div style="font-size:28px">👨‍👩‍👧</div>
      <div style="font-weight:800;font-size:16px;margin-top:6px">عائلة ${esc(familyCode)}</div>
      <div style="font-size:12px;opacity:.9;margin-top:4px">${members.length} عضو</div>
    </div>

    <div class="balance-block">
      <div class="balance-row"><span class="lbl">إجمالي المطلوب</span><span class="val">${fmtNum(totalReq)}</span></div>
      <div class="balance-row"><span class="lbl">إجمالي المدفوع</span><span class="val green">${fmtNum(totalPaid)}</span></div>

        <span style="font-weight:800">المتبقي</span>
        <span class="val" style="color:${totalRem > 0 ? 'var(--danger)' : 'var(--success)'};font-size:15px">${fmtNum(totalRem)}</span>
      </div>
    </div>

    <div style="font-weight:800;font-size:14px;margin:16px 0 10px">👥 أعضاء الأسرة</div>

      ${members.map(m => {
        const full = computeMemberFull(m.id);
        const rem = full?.total.totalRem || 0;
        const icons = [];
        if(m.assocStartYear) icons.push('💰');
        if(m.deathStartYear) icons.push('⚰️');
        return `<div class="item" onclick="closeSheet();setTimeout(()=>openMemberDetail(${m.id}),150)">
          <div class="av ${rem > 0 ? 'red' : 'green'}">${icons.join('') || '👤'}</div>

          </div>
        </div>`;
      }).join('')}

  `;
  openSheet('👨‍👩‍👧 عائلة ' + familyCode, body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide:true });

async function importMembers(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';

  showLoad(true);
  const log = $('importLog');
  log.innerHTML = '<div style="color:var(--muted)">⏳ جاري القراءة…</div>';

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });

    if(!rows.length){
      log.innerHTML = '<div style="color:var(--danger)">❌ الملف فارغ</div>';
      showLoad(false);
      return;
    }

    console.log('📋 أعمدة الملف:', Object.keys(rows[0]));

    let added = 0, updated = 0, skip = 0;
    const typeCounts = { both:0, assoc:0, death:0, none:0, unknown:0 };

    const existing = new Map();
    S.members.forEach(m => {
      if(m.code) existing.set(String(m.code), m);
      existing.set(normAr(m.name), m);
    });

    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const name = cleanText(gv(r, 'الاسم الثلاثي','الاسم_الثلاثي','الاسم'));
      if(!name){ skip++; continue; }

      const code = cleanText(gv(r, 'رقم الفرد','رقم_الفرد','الكود','كود العضو'));
      const subDateStr = gv(r, 'تاريخ الاشتراك','تاريخ_الاشتراك','تاريخ الانضمام');
      const subDate = toDate(subDateStr);
      const subYear = subDate ? new Date(subDate).getFullYear() : null;

      const subTypeRaw = gv(r, 'نوع الاشتراك','نوع_الاشتراك');
      const subType = normAr(subTypeRaw || '');
      const subTypeDefined = subType.length > 0;

      const hasAssocWord = /جمعي/.test(subType);
      const hasDeathWord = /وفا/.test(subType);
      const isBoth = subType.includes('كلاهما') || subType === 'كلا' || subType.includes('الاثنين') || (hasAssocWord && hasDeathWord);
      const isNone = subType.includes('غير') && subType.includes('مشترك');

      let hasAssoc = false, hasDeath = false;
      if(isNone){ typeCounts.none++; }
      else if(isBoth){ hasAssoc = true; hasDeath = true; typeCounts.both++; }
      else if(hasAssocWord){ hasAssoc = true; typeCounts.assoc++; }
      else if(hasDeathWord){ hasDeath = true; typeCounts.death++; }
      else { typeCounts.unknown++; }

      const memberTypeRaw = gv(r, 'نوع العضو','نوع_العضو');
      const memberTypeStr = normAr(memberTypeRaw || '');
      const memberType = memberTypeStr.includes('مخفض') ? 'مخفض' : 'عادي';

      let existingMember = null;
      if(code && existing.has(String(code))) existingMember = existing.get(String(code));
      else if(existing.has(normAr(name))) existingMember = existing.get(normAr(name));

      if(existingMember){
        let changed = false;
        if(subTypeDefined && subYear){
          const newAssoc = hasAssoc ? subYear : null;
          const newDeath = hasDeath ? subYear : null;
          if(existingMember.assocStartYear !== newAssoc){ existingMember.assocStartYear = newAssoc; changed = true; }
          if(existingMember.deathStartYear !== newDeath){ existingMember.deathStartYear = newDeath; changed = true; }
        }
        if(memberTypeRaw && existingMember.memberType !== memberType){
          existingMember.memberType = memberType; changed = true;
        }
        if(changed){ await dbPut('members', existingMember); updated++; } else skip++;
        continue;
      }

      try{
        const member = {
          code, name,
          familyCode: cleanText(gv(r, 'كود الأسرة','كود_الأسرة')),
          gender: gv(r, 'الجنس') || 'ذكر',
          status: gv(r, 'الحالة') || 'حي',
          relation: gv(r, 'صلة القرابة','صلة_القرابة') || 'رب أسرة',
          birth: toDate(gv(r, 'تاريخ الميلاد','تاريخ_الميلاد')),
          sector: gv(r, 'القطاع'),
          phone: cleanPhone(gv(r, 'الجوال','الهاتف')),
          assocStartYear: hasAssoc ? subYear : null,
          deathStartYear: hasDeath ? subYear : null,
          memberType,
          memberStatus: 'نشط',
          assocExempt: false,
          deathExempt: false,
          custom: {},
          notes: cleanText(gv(r, 'ملاحظات')),
          createdAt: new Date().toISOString()
        };
        const newId = await dbPut('members', member);
        member.id = newId;
        S.members.push(member);
        if(code) existing.set(String(code), member);
        existing.set(normAr(name), member);
        added++;
      } catch(e){ console.warn('صف', i+2, e); skip++; }
    }

    log.innerHTML = `
      <div style="padding:12px;background:#f0fdf4;border-radius:12px;color:#166534">
        <div style="font-weight:800;margin-bottom:6px">📊 النتيجة</div>
        <div>➕ أُضيف: <b>${added}</b></div>
        <div>✏️ حُدّث: <b>${updated}</b></div>
        <div>⏭️ تُخطّي: <b>${skip}</b></div>
      </div>
      <div style="padding:12px;background:#eff6ff;border-radius:12px;color:#1e40af;margin-top:10px">
        <div style="font-weight:800;margin-bottom:6px">🔍 قراءة نوع الاشتراك:</div>
        <div>✅ كليهما: <b>${typeCounts.both}</b></div>
        <div>💰 جمعية: <b>${typeCounts.assoc}</b></div>
        <div>⚰️ وفاة: <b>${typeCounts.death}</b></div>
        <div>⚪ غير مشترك: <b>${typeCounts.none}</b></div>
        <div style="color:#b91c1c">❓ لم يُعرَّف: <b>${typeCounts.unknown}</b></div>
      </div>
    `;
    toast(`✅ أُضيف ${added} | حُدّث ${updated}`, 'success', 4000);
    await loadAll();
    renderMembers();
    if(S.page === 'pg-home') renderHome();
  } catch(e){

async function importPayments(input){

  log.innerHTML = '<div style="color:var(--muted)">⏳ جاري القراءة…</div>';

    console.log('📋 أعمدة الدفعات:', Object.keys(rows[0]||{}));

    const memberMap = new Map();
    S.members.forEach(m => {
      if(m.code) memberMap.set(String(m.code), m);
      if(m.name) memberMap.set(normAr(m.name), m);
    });

    let added = 0, skip = 0, notFound = 0, duplicated = 0;
    const notFoundNames = [];

    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const memberName = cleanText(gv(r, 'اسم المشترك','اسم العضو','العضو','المشترك','الاسم','كود العضو'));
      if(!memberName){ skip++; continue; }

      const amountStr = String(gv(r, 'المبلغ','القيمة','Amount') || '').replace(/[,،\s]/g,'');

      if(!amount){ skip++; continue; }

      let member = memberMap.get(memberName) || memberMap.get(normAr(memberName));
      if(!member){
        const s = normAr(memberName);
        member = S.members.find(m => {
          const n = normAr(m.name);
          return n === s || n.includes(s) || s.includes(n);
        });
      }
      if(!member){ notFound++; notFoundNames.push(memberName); skip++; continue; }

      const typeStr = normAr(gv(r, 'نوع القسط','النوع','نوع الدفعة','الصندوق') || '');

          collectorId: null,

/* دالة مساعدة لقراءة القيم من صف Excel */
function gv(row, ...aliases){
  if(!row) return '';
  const normalized = {};
  for(const k of Object.keys(row)){
    normalized[normAr(k).replace(/[^\u0621-\u064Aa-z0-9]/g,'')] = row[k];
  }
  for(const a of aliases){
    const key = normAr(a).replace(/[^\u0621-\u064Aa-z0-9]/g,'');
    if(key in normalized){
      const v = normalized[key];
      if(v === null || v === undefined) continue;
      const s = String(v).trim();
      if(!s || s.startsWith('=') || s.includes('openpyxl')) continue;
      return s;
    }
  }
  return '';
}

      storeItems: S.storeItems,
      storeMovements: S.storeMovements,
      meetings: S.meetings,
      constants: S.constants,
      users: S.users,
      customFields: S.customFields
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `zaoura_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    toast('💾 تم التنزيل');
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function importBackup(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';

  const text = await file.text();
  try{
    const data = JSON.parse(text);
    if(!data.members && !data.users) throw new Error('ملف غير صالح');
    if(!confirm('⚠️ سيتم استبدال كل البيانات الحالية. متابعة؟')) return;
    if(!confirm('تأكيد أخير!')) return;

    for(const s of STORE_NAMES){
      const store = tx(s, 'readwrite');
      await new Promise((res) => { const q = store.clear(); q.onsuccess = res; q.onerror = res; });
    }

    const toRestore = ['members','payments','deaths','incomes','expenses','deliveries','storeItems','storeMovements','meetings','constants','users','customFields'];
    for(const key of toRestore){
      if(Array.isArray(data[key])){
        for(const item of data[key]){ delete item.id; await dbPut(key, item); }
      }
    }

    await loadAll();
    toast('✅ تمت الاستعادة', 'success', 3000);
    closeSheet();
    setTimeout(() => location.reload(), 500);
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

/* ═══ تهيئة الثوابت الافتراضية ═══ */
async function ensureDefaultConstants(){
  const years = [];
  for(let y = BASE_YEAR; y <= BASE_YEAR + 4; y++) years.push(y);

  let added = 0;
  for(const year of years){
    if(!S.constants.find(c => c.year === year)){
      const c = {
        year,
        assocYearly: 24000, assocYearlyReduced: 15000,
        deathInstallment: 5000, deathCompensation: 25000,
        joinAssocFee: 100000, joinAssocFeeReduced: 50000,
        joinDeathFee: 50000, joinDeathFeeReduced: 25000,
        createdAt: new Date().toISOString()
      };
      const id = await dbPut('constants', c);
      c.id = id;
      S.constants.push(c);
      added++;
    }
  }
  if(added > 0) console.log(`✅ تم إضافة ${added} سنة`);
}

/* ═══ التشغيل ═══ */
async function init(){
  const savedTheme = localStorage.getItem('zt_theme');
  if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  const savedYear = localStorage.getItem('zt_year');
  if(savedYear) S.currentYear = Number(savedYear);

  try{
    await openDB();
    await loadAll();
    await ensureDefaultConstants();

    const su = restoreCurrentUser();
    if(su){
      const full = S.users.find(u => u.id === su.id);
      if(full){ S.currentUser = full; showMain(); return; }
      saveCurrentUser(null);
    }
    showLogin();
  } catch(e){
    console.error(e);
    toast('خطأ في التحميل: ' + e.message, 'error', 5000);
  }
}

document.addEventListener('DOMContentLoaded', init);

</script>
