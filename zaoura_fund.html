<style>
/* ═══════════════════════════════════════════════════════════════
   🎨 نظام التصميم — Design Tokens
   ═══════════════════════════════════════════════════════════════ */
:root {
  /* الألوان الأساسية */
  --primary: #6d28d9;
  --primary-2: #7c3aed;
  --primary-dark: #4c1d95;
  --primary-soft: #f5f3ff;
  --primary-light: #ede9fe;
  
  /* الصناديق */
  --assoc: #2563eb;
  --assoc-soft: #eff6ff;
  --assoc-light: #dbeafe;
  
  --death: #dc2626;
  --death-soft: #fef2f2;
  --death-light: #fee2e2;
  
  --donation: #16a34a;
  --donation-soft: #f0fdf4;
  --donation-light: #dcfce7;
  
  /* الحالات */
  --success: #10b981;
  --success-soft: #d1fae5;
  --warning: #f59e0b;
  --warning-soft: #fef3c7;
  --info: #3b82f6;
  --info-soft: #dbeafe;
  
  /* المحايد */
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --text-2: #475569;
  --muted: #64748b;
  --muted-2: #94a3b8;
  --border: #e2e8f0;
  --border-2: #f1f5f9;
  
  /* المسافات */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  
  /* الظلال */
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
  --shadow-md: 0 2px 8px rgba(15,23,42,.06);
  --shadow-lg: 0 8px 24px rgba(15,23,42,.12);
  --shadow-xl: 0 20px 50px rgba(15,23,42,.18);
  
  /* أمان الجوال */
  --safe-bottom: env(safe-area-inset-bottom, 0);
  --safe-top: env(safe-area-inset-top, 0);
  
  /* التمركز */
  --hdr-h: 56px;
  --bnav-h: 62px;
}

/* الوضع الليلي */
[data-theme="dark"] {
  --bg: #0a0f1c;
  --card: #131c31;
  --text: #f1f5f9;
  --text-2: #cbd5e1;
  --muted: #94a3b8;
  --muted-2: #64748b;
  --border: #1e293b;
  --border-2: #0f172a;
  --primary-soft: #2e1065;
  --assoc-soft: #1e3a8a;
  --death-soft: #7f1d1d;
  --donation-soft: #14532d;
}

/* ═══════════════════════════════════════════════════════════════
   🔄 إعادة الضبط
   ═══════════════════════════════════════════════════════════════ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html { font-size: 15px; }

body {
  font-family: system-ui, -apple-system, 'Segoe UI', Tahoma,
                'Noto Sans Arabic', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: calc(var(--bnav-h) + var(--safe-bottom));
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 0;
  background: none;
}

input, select, textarea { outline: none; }

a { color: inherit; text-decoration: none; }

/* ═══════════════════════════════════════════════════════════════
   📱 الهيدر العلوي
   ═══════════════════════════════════════════════════════════════ */
.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  padding: 10px 14px;
  padding-top: calc(10px + var(--safe-top));
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 20px rgba(109, 40, 217, 0.25);
  min-height: 56px;
}

.app-header .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}

.app-header .logo {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  flex-shrink: 0;
  backdrop-filter: blur(4px);
}

.app-header .brand-text {
  flex: 1;
  min-width: 0;
}

.app-header h1 {
  font-size: 15px;
  font-weight: 800;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.app-header .sub {
  font-size: 11px;
  opacity: 0.9;
  font-weight: 700;
  cursor: pointer;
  display: inline-block;
  padding: 2px 8px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 7px;
  margin-top: 3px;
  backdrop-filter: blur(4px);
}

.app-header .icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
  transition: transform 0.15s, background 0.15s;
}

.app-header .icon-btn:active {
  transform: scale(0.92);
  background: rgba(255, 255, 255, 0.24);
}

/* ═══════════════════════════════════════════════════════════════
   👤 شريط المستخدم
   ═══════════════════════════════════════════════════════════════ */
.user-banner {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  position: sticky;
  top: 56px;
  z-index: 29;
}

.user-banner .who {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  flex-wrap: wrap;
  min-width: 0;
}

.user-banner .who b {
  color: var(--text);
  font-weight: 800;
}

.role-badge {
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 800;
  background: var(--primary-soft);
  color: var(--primary);
  white-space: nowrap;
}

/* ═══════════════════════════════════════════════════════════════
   🏠 المحتوى الرئيسي
   ═══════════════════════════════════════════════════════════════ */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 12px;
}

.page { display: none; }
.page.active { display: block; animation: fadeIn 0.2s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════════════════════════════════
   🎴 البطاقات
   ═══════════════════════════════════════════════════════════════ */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.card-head h2 {
  font-size: 14px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text);
}

/* ═══════════════════════════════════════════════════════════════
   📊 الإحصائيات
   ═══════════════════════════════════════════════════════════════ */
.stats-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin: 0 -12px 12px;
  padding: 0 12px 4px;
  scrollbar-width: none;
}

.stats-scroll::-webkit-scrollbar { display: none; }

.stat {
  flex: 0 0 auto;
  min-width: 130px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}

.stat::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 4px;
  height: 100%;
  background: var(--primary);
}

.stat.assoc::before { background: var(--assoc); }
.stat.death::before { background: var(--death); }
.stat.donation::before { background: var(--donation); }
.stat.green::before { background: var(--success); }
.stat.red::before { background: var(--death); }
.stat.orange::before { background: var(--warning); }
.stat.blue::before { background: var(--assoc); }

.stat .val {
  font-size: 19px;
  font-weight: 800;
  line-height: 1.1;
  color: var(--primary);
  word-break: break-all;
  letter-spacing: -0.5px;
}

.stat.assoc .val { color: var(--assoc); }
.stat.death .val { color: var(--death); }
.stat.donation .val { color: var(--donation); }
.stat.green .val { color: var(--success); }
.stat.red .val { color: var(--death); }
.stat.orange .val { color: var(--warning); }
.stat.blue .val { color: var(--assoc); }

.stat .lbl {
  font-size: 10px;
  color: var(--muted);
  margin-top: 6px;
  font-weight: 700;
}

/* ═══════════════════════════════════════════════════════════════
   📋 القوائم
   ═══════════════════════════════════════════════════════════════ */
.list {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-2);
  cursor: pointer;
  min-height: 62px;
  transition: background 0.1s;
}

.item:last-child { border-bottom: 0; }
.item:active { background: var(--bg); }

.item .av {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 800;
  overflow: hidden;
}

.item .av.blue { background: var(--assoc-soft); color: var(--assoc); }
.item .av.red { background: var(--death-soft); color: var(--death); }
.item .av.green { background: var(--donation-soft); color: var(--donation); }
.item .av.orange { background: var(--warning-soft); color: #92400e; }
.item .av.gray { background: var(--border-2); color: var(--muted); }

.item .body { flex: 1; min-width: 0; }

.item .ttl {
  font-weight: 700;
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.item .sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item .trail {
  color: var(--muted-2);
  font-size: 20px;
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════════════════════════
   🏷️ الشارات
   ═══════════════════════════════════════════════════════════════ */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}

.badge.success { background: var(--success-soft); color: #065f46; }
.badge.danger { background: var(--death-light); color: #991b1b; }
.badge.warning { background: var(--warning-soft); color: #92400e; }
.badge.info { background: var(--info-soft); color: #1e40af; }
.badge.muted { background: var(--border-2); color: var(--muted); }
.badge.primary { background: var(--primary-soft); color: var(--primary); }

/* ═══════════════════════════════════════════════════════════════
   🎛️ الشرائح (Chips)
   ═══════════════════════════════════════════════════════════════ */
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 6px;
  scrollbar-width: none;
}

.chips::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  transition: all 0.15s;
}

.chip.on {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* ═══════════════════════════════════════════════════════════════
   🔘 الأزرار
   ═══════════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: var(--r-md);
  font-size: 14px;
  font-weight: 700;
  min-height: 42px;
  white-space: nowrap;
  transition: transform 0.1s, opacity 0.1s;
}

.btn:active { transform: scale(0.97); }

.btn.primary { background: var(--primary); color: #fff; }
.btn.assoc { background: var(--assoc); color: #fff; }
.btn.death { background: var(--death); color: #fff; }
.btn.donation { background: var(--donation); color: #fff; }
.btn.success { background: var(--success); color: #fff; }
.btn.danger { background: var(--death); color: #fff; }
.btn.warning { background: var(--warning); color: #fff; }
.btn.info { background: var(--info); color: #fff; }
.btn.ghost {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn.sm {
  padding: 6px 11px;
  min-height: 34px;
  font-size: 12px;
  border-radius: 9px;
}

.btn.lg {
  padding: 14px 22px;
  min-height: 52px;
  font-size: 15px;
  border-radius: var(--r-lg);
}

.btn.block { display: flex; width: 100%; }

/* ═══════════════════════════════════════════════════════════════
   ⚡ الأزرار السريعة
   ═══════════════════════════════════════════════════════════════ */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.quick-actions.two { grid-template-columns: repeat(2, 1fr); }

.quick-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 14px 8px;
  border-radius: var(--r-md);
  background: var(--card);
  border: 1.5px solid var(--border);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  font-family: inherit;
}

.quick-btn:active {
  transform: scale(0.97);
  border-color: var(--primary);
}

.quick-btn .ico { font-size: 26px; line-height: 1; }
.quick-btn .lbl { font-size: 11px; font-weight: 800; }

.quick-btn.assoc { border-color: var(--assoc); }
.quick-btn.assoc .lbl { color: var(--assoc); }
.quick-btn.death { border-color: var(--death); }
.quick-btn.death .lbl { color: var(--death); }
.quick-btn.donation { border-color: var(--donation); }
.quick-btn.donation .lbl { color: var(--donation); }

/* ═══════════════════════════════════════════════════════════════
   🎈 الزر العائم
   ═══════════════════════════════════════════════════════════════ */
.fab {
  position: fixed;
  bottom: calc(var(--bnav-h) + 20px + var(--safe-bottom));
  left: 16px;
  width: 56px;
  height: 56px;
  border-radius: 18px;
  background: var(--primary);
  color: #fff;
  font-size: 26px;
  font-weight: 300;
  box-shadow: 0 8px 24px rgba(109, 40, 217, 0.4);
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s;
}

.fab:active { transform: scale(0.9); }

/* ═══════════════════════════════════════════════════════════════
   📱 القائمة السفلية
   ═══════════════════════════════════════════════════════════════ */
.bnav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  padding: 6px 4px calc(6px + var(--safe-bottom));
  box-shadow: 0 -4px 12px rgba(15, 23, 42, 0.04);
}

.bnav button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px;
  border-radius: 10px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  min-width: 0;
  font-family: inherit;
  transition: color 0.15s;
}

.bnav button .i {
  font-size: 21px;
  line-height: 1;
  transition: transform 0.15s;
}

.bnav button.on { color: var(--primary); }
.bnav button.on .i { transform: translateY(-1px) scale(1.08); }

/* ═══════════════════════════════════════════════════════════════
   📄 الأوراق (Bottom Sheets)
   ═══════════════════════════════════════════════════════════════ */
.sheet-back {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  z-index: 10100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  backdrop-filter: blur(3px);
}

.sheet-back.on {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 10101;
  background: var(--card);
  border-radius: 22px 22px 0 0;
  max-height: 94vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
  padding-bottom: calc(16px + var(--safe-bottom));
}

.sheet.on { transform: translateY(0); }
.sheet.wide { max-height: 98vh; }

.sheet-grip {
  width: 42px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 10px auto 0;
}

.sheet-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--card);
  z-index: 2;
}

.sheet-hd h2 {
  font-size: 15px;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sheet-bd { padding: 16px; }

.sheet-ft {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  position: sticky;
  bottom: 0;
  background: var(--card);
  flex-wrap: wrap;
}

.sheet-ft .btn { flex: 1; min-width: 90px; }

/* ═══════════════════════════════════════════════════════════════
   📝 النماذج
   ═══════════════════════════════════════════════════════════════ */
.fld {
  margin-bottom: 14px;
  position: relative;
}

.fld label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 6px;
}

.fld label .req { color: var(--death); }

.fld input,
.fld select,
.fld textarea {
  width: 100%;
  padding: 11px 14px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  font-size: 14px;
  transition: border-color 0.15s, background 0.15s;
}

.fld input:focus,
.fld select:focus,
.fld textarea:focus {
  border-color: var(--primary);
  background: var(--card);
}

.fld input:disabled,
.fld select:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.fld textarea {
  resize: vertical;
  min-height: 70px;
}

.fld-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.fld-hint {
  font-size: 11px;
  color: var(--muted-2);
  margin-top: 4px;
}

/* ═══════════════════════════════════════════════════════════════
   🔽 القائمة المنسدلة
   ═══════════════════════════════════════════════════════════════ */
.options-list {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--card);
  border: 1.5px solid var(--primary);
  border-radius: var(--r-md);
  max-height: 250px;
  overflow-y: auto;
  z-index: 100;
  margin-top: 4px;
  display: none;
  box-shadow: var(--shadow-lg);
}

.options-list.on { display: block; }

.option-item {
  padding: 11px 14px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border-2);
  font-size: 14px;
  transition: background 0.1s;
}

.option-item:active { background: var(--primary-soft); }
.option-item:last-child { border-bottom: 0; }
.option-item small { color: var(--muted); font-size: 11px; }

/* ═══════════════════════════════════════════════════════════════
   💰 حقل المبلغ
   ═══════════════════════════════════════════════════════════════ */
.amount-input {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border: 2px solid var(--primary);
  border-radius: var(--r-lg);
  padding: 6px 14px;
}

.amount-input input {
  flex: 1;
  border: 0;
  background: none;
  font-size: 24px;
  font-weight: 800;
  color: var(--primary);
  text-align: center;
  padding: 8px 0;
  font-family: 'SF Mono', 'Courier New', monospace;
  letter-spacing: -1px;
}

.amount-input .currency {
  font-size: 13px;
  font-weight: 800;
  color: var(--muted);
}

.amount-quick {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.amount-quick button {
  padding: 6px 12px;
  border-radius: 9px;
  background: var(--primary-soft);
  color: var(--primary);
  font-size: 12px;
  font-weight: 800;
  font-family: inherit;
}

/* ═══════════════════════════════════════════════════════════════
   📊 بلوكات الرصيد
   ═══════════════════════════════════════════════════════════════ */
.balance-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px;
  margin-bottom: 10px;
}

.balance-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--border-2);
}

.balance-row:last-child { border-bottom: 0; }
.balance-row .lbl { color: var(--muted); }
.balance-row .val { font-weight: 800; font-family: 'SF Mono', 'Courier New', monospace; }

.balance-row .val.green { color: var(--success); }
.balance-row .val.red { color: var(--death); }
.balance-row .val.orange { color: var(--warning); }

/* ═══════════════════════════════════════════════════════════════
   📈 شريط التقدم
   ═══════════════════════════════════════════════════════════════ */
.progress {
  height: 8px;
  background: var(--border-2);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 8px;
}

.progress > div {
  height: 100%;
  border-radius: 4px;
  transition: width 0.3s;
}

.progress.assoc > div { background: var(--assoc); }
.progress.death > div { background: var(--death); }
.progress.donation > div { background: var(--donation); }

/* ═══════════════════════════════════════════════════════════════
   📭 الحالة الفارغة
   ═══════════════════════════════════════════════════════════════ */
.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
}

.empty .ico {
  font-size: 52px;
  opacity: 0.35;
  display: block;
  margin-bottom: 10px;
}

.empty h3 {
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 4px;
  color: var(--text);
}

.empty p { font-size: 12px; }

/* ═══════════════════════════════════════════════════════════════
   🔔 التنبيهات (Toasts)
   ═══════════════════════════════════════════════════════════════ */
.toasts {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  width: calc(100% - 28px);
  max-width: 400px;
}

.toast {
  background: var(--text);
  color: var(--card);
  padding: 12px 18px;
  border-radius: var(--r-md);
  font-size: 13px;
  font-weight: 700;
  box-shadow: var(--shadow-xl);
  pointer-events: auto;
  animation: toastIn 0.25s ease;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.toast.success { background: var(--success); color: #fff; }
.toast.error { background: var(--death); color: #fff; }
.toast.warning { background: var(--warning); color: #fff; }
.toast.info { background: var(--info); color: #fff; }

/* ═══════════════════════════════════════════════════════════════
   ⏳ التحميل
   ═══════════════════════════════════════════════════════════════ */
.loader {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(3px);
  z-index: 10300;
  display: none;
  align-items: center;
  justify-content: center;
}

.loader.on { display: flex; }

.spin {
  width: 42px;
  height: 42px;
  border: 3px solid rgba(255, 255, 255, 0.25);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════════════════════════════
   🔐 شاشة الدخول
   ═══════════════════════════════════════════════════════════════ */
.login-screen {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));

  align-items: center;

  padding: 20px;
  overflow-y: auto;
}

.login-card {

}

.users-list {

}

.login-user {

  gap: 12px;

  background: var(--bg);

}

.login-user:active {
  border-color: var(--primary);

}

.login-user .av {

.login-user .role { font-size: 11px; color: var(--muted); margin-top: 2px; }

.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 20px;
}

.pin-btn {
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--bg);
  font-size: 20px;
  font-weight: 800;
  font-family: inherit;
  transition: all 0.1s;
}

.pin-btn:active {
  transform: scale(0.95);
  background: var(--primary-soft);
}

.pin-display {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 20px 0;
}

.pin-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.15s;
}

.pin-dot.on { background: var(--primary); }

/* ═══════════════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════════════
   💾 IndexedDB
   ═══════════════════════════════════════════════════════════════ */
let db = null;

function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORE_NAMES.forEach(n => {
        if(!d.objectStoreNames.contains(n)){
          d.createObjectStore(n, { keyPath:'id', autoIncrement:true });
        }
      });
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}

const tx = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);

const dbAll = s => new Promise((res, rej) => {
  const q = tx(s).getAll();
  q.onsuccess = () => res(q.result || []);
  q.onerror = () => rej(q.error);
});

const dbGet = (s, id) => new Promise((res, rej) => {
  const q = tx(s).get(id);
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
});

const dbPut = (s, o) => new Promise((res, rej) => {
  const q = tx(s, 'readwrite').put(o);
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
});

const dbDel = (s, id) => new Promise((res, rej) => {
  const q = tx(s, 'readwrite').delete(id);
  q.onsuccess = () => res();
  q.onerror = () => rej(q.error);
});

function fmtDate(d){
  if(!d) return '—';
  try {
    return new Date(d).toLocaleDateString('ar-EG', {
      year:'numeric', month:'short', day:'numeric'
    });
  } catch(e){ return d; }
}

function fmtDateTime(d){
  if(!d) return '—';
  try {
    return new Date(d).toLocaleString('ar-EG');
  } catch(e){ return d; }
}

function toDate(v){
  if(!v) return '';
  if(typeof v === 'string' && v.trim().startsWith('=')) return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if(typeof v === 'number'){
    const d = new Date((v - 25569) * 86400000);
    return isNaN(d) ? '' : d.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  const m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]|$)/);
  if(m1) return `${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;
  const m2 = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m2) return `${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
  const d = new Date(s);
  if(!isNaN(d) && d.getFullYear() > 1900 && d.getFullYear() < 2100){
    return d.toISOString().slice(0, 10);
  }
  return '';
}

function fmtNum(n){
  if(n === null || n === undefined || n === '') return '0';
  const num = Number(n);
  if(isNaN(num)) return '0';
  return num.toLocaleString('en-US');
}

function fmtShort(n){
  if(!n && n !== 0) return '0';
  const num = Number(n);
  if(num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
  if(num >= 1000) return (num / 1000).toFixed(1) + 'K';
  return String(num);
}

let _scrollBeforeSheet = 0;

function openSheet(title, bodyHTML, footHTML = '', opts = {}){
  _scrollBeforeSheet = window.scrollY || window.pageYOffset || 0;
  
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = bodyHTML;
  $('sheetFoot').innerHTML = footHTML;
  $('sheetFoot').style.display = footHTML ? 'flex' : 'none';
  $('sheetBack').classList.add('on');
  $('sheet').classList.add('on');
  
  if(opts.wide) $('sheet').classList.add('wide');
  else $('sheet').classList.remove('wide');
  
  document.body.style.overflow = 'hidden';
  
  if(opts.focus){
    setTimeout(() => {
      const el = $(opts.focus);
      if(el) el.focus();
    }, 280);
  }
}

function closeSheet(){
  $('sheetBack').classList.remove('on');
  $('sheet').classList.remove('on');
  document.body.style.overflow = '';
  
  // استعادة موضع التمرير
  setTimeout(() => {
    if(_scrollBeforeSheet > 0){
      window.scrollTo({ top: _scrollBeforeSheet, behavior: 'instant' });
    }
  }, 50);
}

function getConstants(year){
  const c = S.constants.find(x => x.year === year);
  if(c) return c;
  const sorted = [...S.constants].sort((a, b) => b.year - a.year);
  return sorted[0] || null;
}

function getOpeningBalance(){
  const c = S.constants.find(x => x.year === 0);
  return c || { year: 0, assoc: 0, death: 0, donation: 0 };
}

/* ⭐ حساب مستحقات عضو لسنة واحدة */
function computeMemberYear(member, year){
  const c = getConstants(year);
  const empty = {
    year,
    assoc: { yearlyReq:0, joinReq:0, req:0, paid:0, rem:0 },
    death: { installReq:0, joinReq:0, req:0, paid:0, rem:0 }
  };
  if(!c) return empty;

  const status = member.memberStatus || 'نشط';
  
  // ⭐ متوفى: توقف من سنة الوفاة
  if(status === 'متوفى'){
    const deathYear = member.deathDate
      ? new Date(member.deathDate).getFullYear()
      : (member.stopYear || null);
    if(deathYear && year > deathYear){
      return { ...empty, skipped: true, reason: 'متوفى' };
    }
  }
  
  // ⭐ منسحب/متوقف: توقف من سنة التوقف
  const stopYear = member.stopYear;
  if((status === 'منسحب' || status === 'متوقف') && stopYear && year >= stopYear){
    return { ...empty, skipped: true, reason: status };
  }

  const isReduced = member.memberType === 'مخفض';
  const assocYearlyFee = (isReduced && c.assocYearlyReduced)
    ? c.assocYearlyReduced : c.assocYearly;
  const joinAssocFee = (isReduced && c.joinAssocFeeReduced)
    ? c.joinAssocFeeReduced : c.joinAssocFee;
  const joinDeathFee = (isReduced && c.joinDeathFeeReduced)
    ? c.joinDeathFeeReduced : c.joinDeathFee;

  const result = {
    year,
    assoc: { yearlyReq:0, joinReq:0, req:0, paid:0, rem:0 },
    death: { installReq:0, joinReq:0, req:0, paid:0, rem:0 }
  };

  // 💰 الجمعية
  if(member.assocStartYear &&
     year >= member.assocStartYear &&
     year >= BASE_YEAR &&
     !member.assocExempt){
    result.assoc.yearlyReq += assocYearlyFee;
    if(year === member.assocStartYear && member.assocStartYear >= BASE_YEAR){
      result.assoc.joinReq += joinAssocFee;
    }
  }

  // ⚰️ الوفاة
  if(member.deathStartYear &&
     year >= member.deathStartYear &&
     year >= BASE_YEAR &&
     !member.deathExempt){
    
    // إذا كان متوفى هذه السنة → لا قسم انضمام
    const isDeathYear = member.memberStatus === 'متوفى' &&
      member.deathDate &&
      new Date(member.deathDate).getFullYear() === year;
    
    if(!isDeathYear && year === member.deathStartYear && member.deathStartYear >= BASE_YEAR){
      result.death.joinReq += joinDeathFee;
    }
    
    // أقساط الوفيات (ما عدا سنة الوفاة نفسها)
    if(!isDeathYear){
      const yearDeaths = S.deaths.filter(d => Number(d.year) === year);
      result.death.installReq += yearDeaths.length * c.deathInstallment;
    }
  }

  result.assoc.req = result.assoc.yearlyReq + result.assoc.joinReq;
  result.death.req = result.death.installReq + result.death.joinReq;

  // ⭐ فلترة الدفعات حسب السنة
  const memberPayments = S.payments.filter(p =>
    p.memberId === member.id &&
    (Number(p.forYear) === year || Number(p.year) === year)
  );

  result.assoc.paid = memberPayments
    .filter(p => p.fund === 'assoc')
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);

  result.death.paid = memberPayments
    .filter(p => p.fund === 'death')
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);

  result.assoc.rem = result.assoc.req - result.assoc.paid;
  result.death.rem = result.death.req - result.death.paid;

  return result;
}

/* ⚡ حساب كل سنوات العضو مع Cache */
function computeMemberFull(memberId){
  if(CACHE.memberFull.has(memberId)){
    return CACHE.memberFull.get(memberId);
  }

  const member = getMemberById(memberId);
  if(!member) return null;

  const starts = [member.assocStartYear, member.deathStartYear].filter(x => x);
  if(!starts.length){
    const result = {
      member,
      years: [],
      total: {
        assocReq:0, assocPaid:0, assocRem:0,
        assocYearlyReq:0, assocJoinReq:0,
        deathReq:0, deathPaid:0, deathRem:0,
        deathInstallReq:0, deathJoinReq:0,
        totalRem:0, totalReq:0, totalPaid:0
      }
    };
    CACHE.memberFull.set(memberId, result);
    return result;
  }

  const firstYear = Math.max(BASE_YEAR, Math.min(...starts));
  const years = [];
  for(let y = firstYear; y <= S.currentYear; y++){
    const yd = computeMemberYear(member, y);
    yd.year = y;
    years.push(yd);
  }

  const total = years.reduce((acc, y) => ({
    assocReq:        acc.assocReq + y.assoc.req,
    assocPaid:       acc.assocPaid + y.assoc.paid,
    assocRem:        acc.assocRem + (y.assoc.req - y.assoc.paid),
    assocYearlyReq:  acc.assocYearlyReq + y.assoc.yearlyReq,
    assocJoinReq:    acc.assocJoinReq + y.assoc.joinReq,
    deathReq:        acc.deathReq + y.death.req,
    deathPaid:       acc.deathPaid + y.death.paid,
    deathRem:        acc.deathRem + (y.death.req - y.death.paid),
    deathInstallReq: acc.deathInstallReq + y.death.installReq,
    deathJoinReq:    acc.deathJoinReq + y.death.joinReq
  }), {
    assocReq:0, assocPaid:0, assocRem:0,
    assocYearlyReq:0, assocJoinReq:0,
    deathReq:0, deathPaid:0, deathRem:0,
    deathInstallReq:0, deathJoinReq:0
  });

  total.totalReq = total.assocReq + total.deathReq;
  total.totalPaid = total.assocPaid + total.deathPaid;
  total.totalRem = total.totalReq - total.totalPaid;

  // ⭐ تطبيق قرار المتأخرات
  if(member.debtAction === 'writeOff' || member.debtAction === 'deductFromComp'){
    total.totalRem = 0;
    total.debtWrittenOff = member.writtenOffAmount || 0;
  } else if(member.debtAction === 'partial'){
    const wo = member.writtenOffAmount || 0;
    total.totalRem = Math.max(0, total.totalRem - wo);
    total.debtWrittenOff = wo;
  }

  const result = { member, years, total };
  CACHE.memberFull.set(memberId, result);
  return result;
}

/* ⭐ إحصائيات الأعضاء */
function getMembersStats(year){
  const y = year || S.currentYear;
  
  if(CACHE.stats && CACHE.statsYear === y) return CACHE.stats;

  let onlyAssoc = 0, onlyDeath = 0, both = 0, none = 0, late = 0;
  let lateTotal = 0, active = 0, withdrawn = 0, deceased = 0;
  let exemptCount = 0, frozen = 0, newThisYear = 0;

  for(const m of S.members){
    const st = m.memberStatus || 'نشط';
    if(st === 'نشط') active++;
    else if(st === 'منسحب') withdrawn++;
    else if(st === 'متوقف') frozen++;
    else if(st === 'متوفى') deceased++;
    else if(st === 'معفى') exemptCount++;

    const hasAssoc = m.assocStartYear &&
                     m.assocStartYear <= y &&
                     !m.assocExempt;
    const hasDeath = m.deathStartYear &&
                     m.deathStartYear <= y &&
                     !m.deathExempt;
    
    if(hasAssoc && hasDeath) both++;
    else if(hasAssoc) onlyAssoc++;
    else if(hasDeath) onlyDeath++;
    else none++;
    
    // جديد هذه السنة
    if(m.assocStartYear === y || m.deathStartYear === y) newThisYear++;

    if(m.assocStartYear || m.deathStartYear){
      const full = computeMemberFull(m.id);
      if(full && full.total.totalRem > 0){
        late++;
        lateTotal += full.total.totalRem;
      }
    }
  }

  const result = {
    year: y,
    total: S.members.length,
    onlyAssoc, onlyDeath, both, none, late, lateTotal,
    active, withdrawn, deceased,
    exempt: exemptCount, frozen, newThisYear
  };

  CACHE.stats = result;
  CACHE.statsYear = y;
  return result;
}

/* ⭐ أرصدة الصندوق — سنة محددة */
function getFundBalances(year){
  const y = year || S.currentYear;

  if(CACHE.fundBalances && CACHE.fundBalancesYear === y){
    return CACHE.fundBalances;
  }

  const sum = (arr, key = 'amount') =>
    arr.reduce((s, x) => s + (Number(x[key]) || 0), 0);

  const assocPayments = sum(S.payments.filter(p =>
    Number(p.year) === y && p.fund === 'assoc'));
  const assocIncomes = sum(S.incomes.filter(i =>
    Number(i.year) === y && i.fund === 'assoc'));
  const assocExpenses = sum(S.expenses.filter(e =>
    Number(e.year) === y && e.fund === 'assoc'));
  const assocBalance = assocPayments + assocIncomes - assocExpenses;

  const deathPayments = sum(S.payments.filter(p =>
    Number(p.year) === y && p.fund === 'death'));
  const deathIncomes = sum(S.incomes.filter(i =>
    Number(i.year) === y && i.fund === 'death'));
  const deathExpenses = sum(S.expenses.filter(e =>
    Number(e.year) === y && e.fund === 'death'));
  const deathCompensations = sum(
    S.deaths.filter(d => Number(d.year) === y),
    'compensation'
  );
  const deathBalance = deathPayments + deathIncomes -
                       deathExpenses - deathCompensations;

  const donations = sum(S.payments.filter(p =>
    Number(p.year) === y && p.fund === 'donation'));

  const result = {
    year: y,
    assoc: {
      payments: assocPayments,
      incomes: assocIncomes,
      expenses: assocExpenses,
      balance: assocBalance
    },
    death: {
      payments: deathPayments,
      incomes: deathIncomes,
      expenses: deathExpenses,
      compensations: deathCompensations,
      balance: deathBalance
    },
    donations,
    total: assocBalance + deathBalance
  };

  CACHE.fundBalances = result;
  CACHE.fundBalancesYear = y;
  return result;
}

/* ⭐⭐ الرصيد الفعلي التراكمي (كل السنوات + افتتاحي) */
function getFundActual(fund){
  if(CACHE.actual && CACHE.actual[fund] !== undefined){
    // نستخدم cache جزئي
  }
  
  const opening = getOpeningBalance();
  const openingVal = Number(opening[fund]) || 0;

  const sum = arr => arr.reduce((s, x) => s + (Number(x.amount) || 0), 0);

  const payments = S.payments.filter(p => p.fund === fund);
  const incomes = S.incomes.filter(i => i.fund === fund);
  const expenses = S.expenses.filter(e => e.fund === fund);
  const compensations = fund === 'death' ? S.deaths : [];

  const collected = sum(payments);
  const totalIncomes = sum(incomes);
  const totalExpenses = sum(expenses);
  const totalComp = compensations.reduce((s, d) => s + (Number(d.compensation) || 0), 0);

  const balance = openingVal + collected + totalIncomes - totalExpenses - totalComp;

  return {
    fund,
    opening: openingVal,
    collected,
    incomes: totalIncomes,
    expenses: totalExpenses,
    compensations: totalComp,
    balance
  };
}

/* ⭐ سنوات صندوق واحد — مع الرصيد التراكمي */
function getFundYears(fund){
  const years = [2025, 2026, 2027, 2028, 2029];
  const opening = getOpeningBalance();
  const openingVal = Number(opening[fund]) || 0;
  let cum = openingVal;
  const result = [];

  years.forEach(y => {
    const sum = arr => arr.reduce((s, x) => s + (Number(x.amount) || 0), 0);

    const payments = S.payments.filter(p => Number(p.year) === y && p.fund === fund);
    const incomes = S.incomes.filter(i => Number(i.year) === y && i.fund === fund);
    const expenses = S.expenses.filter(e => Number(e.year) === y && e.fund === fund);
    const compensations = fund === 'death'
      ? S.deaths.filter(d => Number(d.year) === y)
      : [];

    const collected = sum(payments);
    const totalIncomes = sum(incomes);
    const totalExpenses = sum(expenses);
    const totalComp = compensations.reduce((s, d) => s + (Number(d.compensation) || 0), 0);

    const net = collected + totalIncomes - totalExpenses - totalComp;
    cum += net;

    if(collected !== 0 || totalIncomes !== 0 || totalExpenses !== 0 || totalComp !== 0){
      result.push({
        year: y,
        collected, incomes: totalIncomes,
        expenses: totalExpenses, compensations: totalComp,
        net, cumulative: cum
      });
    }
  });

  return { opening: openingVal, years: result, total: cum };
}

/* ⭐ عهدة المستخدم (مع دعم الأسماء) */
function getUserCustody(userId, fund){
  fund = fund || 'all';
  const user = S.users.find(u => u.id === userId);
  const userName = user ? normAr(user.name) : '';

  const matchName = name => {
    if(!name || !userName) return false;
    const n = normAr(name);
    return n === userName || n.includes(userName) || userName.includes(n);
  };

  let payments = S.payments.filter(p =>
    p.collectorId === userId ||
    (!p.collectorId && matchName(p.collectorName))
  );

  let delivered = S.deliveries.filter(d =>
    (d.fromUserId === userId || (!d.fromUserId && matchName(d.fromUserName))) &&
    d.receivedAt
  );

  let pending = S.deliveries.filter(d =>
    (d.fromUserId === userId || (!d.fromUserId && matchName(d.fromUserName))) &&
    !d.receivedAt && !d.rejectedAt
  );

  let received = S.deliveries.filter(d =>
    (d.toUserId === userId || (!d.toUserId && matchName(d.toUserName))) &&
    d.receivedAt
  );

  if(fund !== 'all'){
    payments = payments.filter(p => p.fund === fund);
    delivered = delivered.filter(d => d.fund === fund);
    pending = pending.filter(d => d.fund === fund);
    received = received.filter(d => d.fund === fund);
  }

  const collected = payments.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const deliveredSum = delivered.reduce((s, d) => s + (Number(d.amount) || 0), 0);
  const pendingSum = pending.reduce((s, d) => s + (Number(d.amount) || 0), 0);
  const receivedSum = received.reduce((s, d) => s + (Number(d.amount) || 0), 0);

  return {
    collected,
    delivered: deliveredSum,
    pending: pendingSum,
    received: receivedSum,
    balance: collected - deliveredSum + receivedSum
  };
}

/* ⭐ تفصيل عهدة المعتمد حسب الصندوق والسنة */
function getCollectorBreakdown(userId, year){
  const y = year || S.currentYear;
  const user = S.users.find(u => u.id === userId);
  const userName = user ? normAr(user.name) : '';

  const matchName = name => {
    if(!name || !userName) return false;
    const n = normAr(name);
    return n === userName || n.includes(userName) || userName.includes(n);
  };

  const myPayments = S.payments.filter(p =>
    (Number(p.forYear) === y || Number(p.year) === y) &&
    (p.collectorId === userId || (!p.collectorId && matchName(p.collectorName)))
  );

  const myDeliveries = S.deliveries.filter(d =>
    d.date && new Date(d.date).getFullYear() === y &&
    (d.fromUserId === userId || (!d.fromUserId && matchName(d.fromUserName)))
  );

  const byFund = fund => {
    const collected = myPayments
      .filter(p => p.fund === fund)
      .reduce((s, p) => s + (Number(p.amount) || 0), 0);
    const delivered = myDeliveries
      .filter(d => d.fund === fund && d.receivedAt)
      .reduce((s, d) => s + (Number(d.amount) || 0), 0);
    const pending = myDeliveries
      .filter(d => d.fund === fund && !d.receivedAt && !d.rejectedAt)
      .reduce((s, d) => s + (Number(d.amount) || 0), 0);
    return { collected, delivered, pending, rem: collected - delivered };
  };

  const assoc = byFund('assoc');
  const death = byFund('death');
  const donation = byFund('donation');

  return {
    year: y,
    assoc: { ...assoc, rem: assoc.collected - assoc.delivered },
    death: { ...death, rem: death.collected - death.delivered },
    donation: { ...donation, rem: donation.collected - donation.delivered },
    total: {
      collected: assoc.collected + death.collected + donation.collected,
      delivered: assoc.delivered + death.delivered + donation.delivered,
      pending: assoc.pending + death.pending + donation.pending,
      rem: (assoc.collected + death.collected + donation.collected) -
           (assoc.delivered + death.delivered + donation.delivered)
    }
  };
}

/* ⭐ كل المحصّلين */
function getAllCollectors(year){
  const y = year || S.currentYear;

  const matchUserToName = (id, name) => {
    let user = id ? S.users.find(u => u.id === id) : null;
    if(!user && name){
      const n = normAr(name);
      user = S.users.find(u => normAr(u.name) === n);
      if(!user){
        user = S.users.find(u => {
          const un = normAr(u.name);
          return un.includes(n) || n.includes(un);
        });
      }
    }
    return user;
  };

  const collectorMap = new Map();

  const addCollector = (id, name) => {
    const user = matchUserToName(id, name);
    const key = user ? `id:${user.id}` : `name:${normAr(name || '')}`;
    if(!collectorMap.has(key)){
      collectorMap.set(key, {
        id: user ? user.id : null,
        name: user ? user.name : (name || 'غير محدد'),
        user
      });
    }
  };

  S.payments.forEach(p => {
    const py = Number(p.forYear) || Number(p.year);
    if(py !== y) return;
    addCollector(p.collectorId, p.collectorName);
  });

  S.deliveries.forEach(d => {
    if(!d.date) return;
    const dy = new Date(d.date).getFullYear();
    if(dy !== y) return;
    addCollector(d.fromUserId, d.fromUserName);
  });

  const list = [];

  collectorMap.forEach((c, key) => {
    const matchPayment = p => {
      const py = Number(p.forYear) || Number(p.year);
      if(py !== y) return false;
      if(c.user){
        if(p.collectorId === c.user.id) return true;
        if(!p.collectorId && p.collectorName){
          return normAr(p.collectorName) === normAr(c.user.name);
        }
        return false;
      }
      if(p.collectorId) return false;
      return normAr(p.collectorName || '') === normAr(c.name);
    };

    const matchDelivery = d => {
      if(!d.date) return false;
      const dy = new Date(d.date).getFullYear();
      if(dy !== y) return false;
      if(c.user){
        if(d.fromUserId === c.user.id) return true;
        if(!d.fromUserId && d.fromUserName){
          return normAr(d.fromUserName) === normAr(c.user.name);
        }
        return false;
      }
      if(d.fromUserId) return false;
      return normAr(d.fromUserName || '') === normAr(c.name);
    };

    const payments = S.payments.filter(matchPayment);
    const deliveries = S.deliveries.filter(matchDelivery);

    const byFund = fund => {
      const p = payments.filter(x => x.fund === fund)
        .reduce((s, x) => s + (Number(x.amount) || 0), 0);
      const d = deliveries.filter(x => x.fund === fund && x.receivedAt)
        .reduce((s, x) => s + (Number(x.amount) || 0), 0);
      const pend = deliveries.filter(x => x.fund === fund && !x.receivedAt && !x.rejectedAt)
        .reduce((s, x) => s + (Number(x.amount) || 0), 0);
      return { collected: p, delivered: d, pending: pend };
    };

    const assoc = byFund('assoc');
    const death = byFund('death');
    const donation = byFund('donation');

    const total = {
      collected: assoc.collected + death.collected + donation.collected,
      delivered: assoc.delivered + death.delivered + donation.delivered,
      pending: assoc.pending + death.pending + donation.pending
    };
    total.rem = total.collected - total.delivered;

    if(total.collected === 0 && total.delivered === 0) return;

    list.push({
      id: c.id,
      name: c.name,
      user: c.user,
      role: c.user ? c.user.role : null,
      assoc, death, donation, total,
      paymentCount: payments.length,
      deliveryCount: deliveries.length
    });
  });

  list.sort((a, b) => b.total.pending - a.total.pending || b.total.collected - a.total.collected);
  return list;
}

function go(page){
  const prevPage = S.page;
  S.page = page;

  // حفظ موضع التمرير عند مغادرة صفحة
  if(prevPage && prevPage !== page){
    const pos = window.scrollY || window.pageYOffset || 0;
    if(pos > 10){
      localStorage.setItem('zt_scroll_' + prevPage, pos);
    }
  }

  $$('.page').forEach(p => p.classList.remove('active'));
  const target = $(page);
  if(!target){
    console.warn('⚠️ صفحة غير موجودة:', page);
    return;
  }
  target.classList.add('active');
  
  $$('.bnav button').forEach(b => {
    b.classList.toggle('on', b.dataset.pg === page);
  });

  window.scrollTo(0, 0);

  const fabPages = ['pg-collect', 'pg-inout'];
  $('fab').style.display = fabPages.includes(page) ? 'flex' : 'none';

  const renderers = {
    'pg-home':           renderHome,
    'pg-collect':        renderCollect,
    'pg-late':           renderLate,
    'pg-my-deliveries':  renderMyDeliveries,
    'pg-inbox':          renderInbox,
    'pg-inout':          renderInOut,
    'pg-members':        renderMembersPage,
    'pg-funds':          renderFundsHub,
    'pg-deaths':         renderDeathsPage,
    'pg-store':          renderStorePage,
    'pg-meetings':       renderMeetingsPage,
    'pg-reports':        renderReportsPage,
    'pg-archive':        renderArchivePage,
    'pg-admin':          renderAdminPage,
    'pg-my-account':     renderMyAccount,
    'pg-logs':           renderLogsPage,
    'pg-notifications':  renderNotificationsPage,
    'pg-collectors':     renderCollectorsPage
  };

  if(renderers[page]){
    try {
      renderers[page]();
    } catch(e){
      console.error('❌ خطأ في العرض:', page, e);
      target.innerHTML = `
        <div class="empty">
          <span class="ico">⚠️</span>
          <h3>خطأ في العرض</h3>
          <p>${esc(e.message)}</p>
        </div>`;
    }
  }

  // استعادة موضع التمرير عند العودة لصفحة
  if(prevPage !== page){
    const saved = localStorage.getItem('zt_scroll_' + page);
    if(saved && Number(saved) > 10){
      setTimeout(() => {
        window.scrollTo({ top: Number(saved), behavior: 'instant' });
      }, 100);
    }
  }
}

    });
  }

  // 3. مواد تحتاج صيانة
  const maintenance = S.storeItems.filter(i => i.condition === 'يحتاج صيانة');
  if(maintenance.length > 0){
    notifs.push({
      id: 'maintenance',
      icon: '🔧',
      title: `${maintenance.length} مادة تحتاج صيانة`,
      desc: maintenance.slice(0, 2).map(i => i.name).join('، '),
      color: 'warning',
      action: () => go('pg-store')
    });
  }

  // 4. وفيات هذا الشهر
  const thisMonth = new Date().getMonth();
  const thisYear = new Date().getFullYear();
  const monthDeaths = S.deaths.filter(d => {
    if(!d.deathDate) return false;
    const dd = new Date(d.deathDate);
    return dd.getMonth() === thisMonth && dd.getFullYear() === thisYear;
  });
  if(monthDeaths.length > 0){
    notifs.push({
      id: 'month_deaths',
      icon: '⚰️',
      title: `${monthDeaths.length} وفاة هذا الشهر`,
      desc: monthDeaths.map(d => d.deceasedName).slice(0, 2).join('، '),
      color: 'info',
      action: () => go('pg-deaths')
    });
  }

  // 5. أرصدة منخفضة
  const assocBalance = getFundActual('assoc').balance;
  if(assocBalance < 100000 && assocBalance >= 0){
    notifs.push({
      id: 'low_assoc',
      icon: '💰',
      title: 'رصيد الجمعية منخفض',
      desc: fmtNum(assocBalance) + ' ل.س',
      color: 'warning',
      action: () => go('pg-funds')
    });
  }

  return notifs;
}

async function ensureDefaultConstants(){
  const years = [];
  for(let y = BASE_YEAR; y <= BASE_YEAR + 4; y++) years.push(y);

  let added = 0;
  for(const year of years){
    if(!S.constants.find(c => c.year === year)){
      const c = {
        year,
        assocYearly: 24000,
        assocYearlyReduced: 15000,
        deathInstallment: 5000,
        deathCompensation: 25000,
        joinAssocFee: 100000,
        joinAssocFeeReduced: 50000,
        joinDeathFee: 50000,
        joinDeathFeeReduced: 25000,
        createdAt: new Date().toISOString()
      };
      const id = await dbPut('constants', c);
      c.id = id;
      S.constants.push(c);
      added++;
    }
  }
  if(added > 0) console.log(`✅ تم إضافة ${added} سنة`);
}

async function init(){
  const savedTheme = localStorage.getItem('zt_theme');
  if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  const savedYear = localStorage.getItem('zt_year');
  if(savedYear) S.currentYear = Number(savedYear);

  try {
    await openDB();
    await loadAll();
    await ensureDefaultConstants();

    const su = restoreCurrentUser();
    if(su){
      const full = S.users.find(u => u.id === su.id);
      if(full){
        S.currentUser = full;
        showMain();
        return;
      }
      saveCurrentUser(null);
    }
    showLogin();
  } catch(e){
    console.error('init error', e);
    toast('خطأ في التحميل: ' + e.message, 'error', 5000);
  }
}

    S.members.forEach(m => {
      const st = m.memberStatus || 'نشط';
      if(st === 'متوفى') counts.deceased++;
      else if(st === 'منسحب') counts.withdrawn++;
      else if(st === 'متوقف') counts.frozen++;
      else if(st === 'معفى') counts.unsubscribed++;
      else {
        if(m.assocStartYear || m.deathStartYear) counts.subscribed++;
        else counts.unsubscribed++;
      }
    });
    
    const options = [
      { k:'subscribed',   i:'👥', l:'المشتركون',    c:counts.subscribed,   color:'#2563eb' },
      { k:'unsubscribed', i:'⚪', l:'غير مشتركين',  c:counts.unsubscribed, color:'#64748b' },

    const body = opts.map(s => {

/* ⭐ قائمة الأعضاء */
function renderMembersList(){
  const f = S.filters;
  const currentYear = S.currentYear;
  
  let list = S.members.filter(m => {
    const st = m.memberStatus || 'نشط';
    
    if(f.members === 'deceased')  return st === 'متوفى';
    if(f.members === 'withdrawn') return st === 'منسحب';
    if(f.members === 'frozen')    return st === 'متوقف';
    
    if(['متوفى','منسحب','متوقف'].includes(st)) return false;
    
    if(f.members === 'subscribed'){
      return (m.assocStartYear || m.deathStartYear) && st !== 'معفى';
    }
    if(f.members === 'unsubscribed'){
      return (!m.assocStartYear && !m.deathStartYear) || st === 'معفى';
    }
    return false;
  });
  
  if(f.membersSector !== 'all'){
    list = list.filter(m => m.sector === f.membersSector);
  }
  
  if(f.membersYear !== 'all'){
    const targetYear = Number(f.membersYear);
    list = list.filter(m =>
      m.assocStartYear === targetYear ||
      m.deathStartYear === targetYear
    );
  }
  
  if(f.membersNew){
    list = list.filter(m =>
      m.assocStartYear === currentYear ||
      m.deathStartYear === currentYear
    );
  }
  
  if(S.search){
    const s = normAr(S.search);
    list = list.filter(m =>
      normAr(`${m.name} ${m.code||''} ${m.phone||''} ${m.familyCode||''}`).includes(s)
    );
  }
  
  // ترتيب: متأخرون أولاً
  list.sort((a, b) => {
    const fa = computeMemberFull(a.id);
    const fb = computeMemberFull(b.id);
    const ra = fa?.total.totalRem || 0;
    const rb = fb?.total.totalRem || 0;
    if(ra !== rb) return rb - ra;
    return String(a.name).localeCompare(String(b.name), 'ar');
  });
  
  const el = $('membersListContent');
  const countEl = $('membersCountDisplay');
  
  if(countEl) countEl.textContent = `📊 ${list.length} عضو`;
  
  if(!el) return;
  
  if(!list.length){
    el.innerHTML = `
      <div class="empty">
        <span class="ico">👥</span>
        <h3>لا يوجد أعضاء</h3>
        <p>${S.search ? 'جرّب بحثاً آخر' : 'في هذا التصنيف'}</p>
        <button onclick="resetMembersFilters()" style="
          margin-top:14px;background:var(--primary);color:#fff;border:0;
          padding:9px 20px;border-radius:10px;font-size:12px;font-weight:800;
          cursor:pointer;font-family:inherit;
        ">إزالة كل الفلاتر</button>
      </div>`;
    return;
  }
  
  el.innerHTML = `<div class="list">${list.slice(0, 500).map(m => renderMemberRow(m)).join('')}</div>`;
}

function resetMembersFilters(){
  S.filters.members = 'subscribed';
  S.filters.membersSector = 'all';
  S.filters.membersYear = 'all';
  S.filters.membersNew = false;
  S.search = '';
  renderMembersPage();
}

/* ⭐⭐⭐ بطاقة العضو — تصميم بنكي ⭐⭐⭐ */
function renderMemberRow(m){
  const full = computeMemberFull(m.id);
  const rem = full?.total.totalRem || 0;
  const hasUnpaid = rem > 0;
  const st = m.memberStatus || 'نشط';
  
  let accent = '#7c3aed';
  let statusLabel = '';
  
  if(st === 'متوفى'){ accent = '#dc2626'; statusLabel = 'متوفى'; }
  else if(st === 'منسحب'){ accent = '#94a3b8'; statusLabel = 'منسحب'; }
  else if(st === 'متوقف'){ accent = '#f59e0b'; statusLabel = 'متوقف'; }
  else if(st === 'معفى'){ accent = '#3b82f6'; statusLabel = 'معفى'; }
  
  const subs = [];
  if(m.assocStartYear) subs.push('ج');
  if(m.deathStartYear) subs.push('و');
  
  const isNew = m.assocStartYear === S.currentYear || m.deathStartYear === S.currentYear;

  return `
    <div onclick="openMemberDetail(${m.id})" style="
      background:var(--card);
      border-bottom:1px solid var(--border-2);
      padding:11px 16px 11px 18px;
      cursor:pointer;
      display:flex;align-items:center;gap:12px;
      position:relative;min-height:56px;
    ">
      <div style="position:absolute;right:0;top:0;bottom:0;width:3px;background:${accent}"></div>
      
      <div style="flex:1;min-width:0">
        <div style="
          font-size:13.5px;font-weight:700;color:var(--text);
          line-height:1.3;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
          display:flex;align-items:center;gap:5px;
        ">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name)}</span>
          ${isNew ? '<span class="badge success" style="font-size:8px;padding:1px 5px">جديد</span>' : ''}
          ${statusLabel ? `<span style="color:${accent};font-size:10px;font-weight:700">· ${statusLabel}</span>` : ''}
        </div>
        <div style="
          font-size:10px;color:var(--muted-2);margin-top:2px;
          font-family:'SF Mono','Courier New',monospace;
          direction:ltr;text-align:right;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
        ">${esc(m.code||'—')}${subs.length ? '  ' + subs.join('·') : ''}${m.sector ? '  ' + esc(m.sector) : ''}</div>
      </div>
      
      <div style="flex-shrink:0;text-align:left;direction:ltr;min-width:82px">
        ${hasUnpaid
          ? `<div style="
               font-size:14px;font-weight:800;color:var(--text);
               font-family:'SF Mono','Courier New',monospace;
               letter-spacing:-.4px;line-height:1.1;
             ">${fmtNum(rem)}</div>
             <div style="font-size:9px;color:var(--death);font-weight:700;text-align:right;margin-top:1px">متبقي</div>`
          : `<div style="
               font-size:11px;color:var(--success);font-weight:700;text-align:right;
             ">✓ مسدَّد</div>`}
      </div>
    </div>
  `;
}

function toggleMemberStatusFields(){
  const v = $('mMemberStatus')?.value;
  if(!v) return;
  const stopField = $('mStopYearField');
  const deathField = $('mDeathDateField');
  if(stopField) stopField.style.display = ['منسحب','متوقف'].includes(v) ? 'block' : 'none';
  if(deathField) deathField.style.display = v === 'متوفى' ? 'block' : 'none';
}

function toggleAssocYearField(){
  const on = $('mAssocActive')?.value === 'yes';
  if($('mAssocYear')){
    $('mAssocYear').disabled = !on;
    if(!on) $('mAssocYear').value = '';
  }
}

function toggleDeathYearField(){
  const on = $('mDeathActive')?.value === 'yes';
  if($('mDeathYear')){
    $('mDeathYear').disabled = !on;
    if(!on) $('mDeathYear').value = '';
  }
}

async function saveMember(id){
  const canEditAll = canEditMember();
  const canEditPhone = canEditMemberPhone();
  
  if(!canEditAll && !canEditPhone){
    toast('غير مصرح', 'error');
    return;
  }
  
  try {
    const old = id ? await dbGet('members', id) : null;
    let obj = old ? { ...old } : {};
    
    if(canEditPhone){
      obj.phone = cleanPhone($('mPhone')?.value || '');
    }
    
    if(canEditAll){
      const name = cleanText($('mName').value);
      if(!name){ toast('الاسم مطلوب', 'error'); return; }
      
      const assocActive = $('mAssocActive').value === 'yes';
      const deathActive = $('mDeathActive').value === 'yes';
      const memberStatus = $('mMemberStatus').value;
      const statusVal = memberStatus;
      
      // التحقق من تاريخ الوفاة
      if(memberStatus === 'متوفى' && !$('mDeathDate').value){
        toast('تاريخ الوفاة مطلوب', 'error'); return;
      }
      
      obj = {
        ...obj,
        code: cleanText($('mCode').value),
        familyCode: cleanText($('mFamily').value),
        name,
        gender: $('mGender').value,
        status: $('mStatus').value,
        birth: $('mBirth').value,
        sector: $('mSector').value,
        relation: $('mRelation').value,
        phone: cleanPhone($('mPhone').value),
        assocStartYear: assocActive ? Number($('mAssocYear').value) : null,
        deathStartYear: deathActive ? Number($('mDeathYear').value) : null,
        memberType: $('mType').value,
        memberStatus,
        stopYear: ['منسحب','متوقف'].includes(statusVal)
          ? Number($('mStopYear').value) || null
          : null,
        deathDate: memberStatus === 'متوفى' ? ($('mDeathDate').value || '') : '',
        assocExempt: $('mAssocExempt').checked,
        deathExempt: $('mDeathExempt').checked,
        notes: cleanText($('mNotes').value),
        custom: collectCustomFields('members')
      };
    }
    
    if(!obj.createdAt) obj.createdAt = new Date().toISOString();
    
    if(id){
      obj.id = id;
      await dbPut('members', obj);
      const i = S.members.findIndex(x => x.id === id);
      if(i > -1) S.members[i] = obj;
      CACHE.invalidateMember(id);
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('members', obj);
      obj.id = newId;
      S.members.push(obj);
      toast('✅ تمت الإضافة');
    }
    
    await logAudit(id ? 'update' : 'add', 'member', obj.id, { name: obj.name });
    CACHE.invalidateAll();
    
    closeSheet();
    go(S.page);
  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
}

async function deleteMember(id){
  if(!canEditMember()){ toast('غير مصرح', 'error'); return; }
  const m = getMemberById(id);
  if(!confirm(`حذف العضو "${m?.name}"؟`)) return;
  if(!confirm('تأكيد أخير!')) return;
  
  try {
    await dbDel('members', id);
    S.members = S.members.filter(x => x.id !== id);
    CACHE.invalidateAll();
    await logAudit('delete', 'member', id, { name: m?.name });
    toast('🗑️ تم الحذف');
    closeSheet();
    go(S.page);
  } catch(e){
    toast('خطأ', 'error');
  }
}

function selectDebtOption(key){
  $$('.debt-option').forEach(el => {
    el.style.borderColor = 'var(--border)';
    el.style.background = 'var(--card)';
  });
  const selected = document.querySelector(`.debt-option[data-key="${key}"]`);
  if(selected){
    selected.style.borderColor = 'var(--primary)';
    selected.style.background = 'var(--primary-soft)';
  }
  if(window._debtContext) window._debtContext.selectedAction = key;
  
  const partialBox = $('partialAmountBox');
  if(partialBox) partialBox.style.display = key === 'partial' ? 'block' : 'none';
}

async function confirmDebtAction(memberId){
  const ctx = window._debtContext;
  if(!ctx || !ctx.selectedAction){
    toast('اختر إجراءً', 'warning');
    return;
  }
  
  const m = getMemberById(memberId);
  if(!m) return;
  
  let writtenOffAmount = 0;
  if(ctx.selectedAction === 'writeOff' || ctx.selectedAction === 'deductFromComp'){
    writtenOffAmount = ctx.debt;
  } else if(ctx.selectedAction === 'partial'){
    writtenOffAmount = Number($('partialAmount').value) || 0;
    if(writtenOffAmount <= 0 || writtenOffAmount > ctx.debt){
      toast('قيمة غير صحيحة', 'error');
      return;
    }
  }
  
  m.debtAction = ctx.selectedAction;
  m.writtenOffAmount = writtenOffAmount;
  m.debtNote = cleanText($('debtNote')?.value || '');
  m.debtDecidedAt = new Date().toISOString();
  m.debtDecidedBy = S.currentUser.name;
  m.debtAmountBefore = ctx.debt;
  
  try {
    await dbPut('members', m);
    const i = S.members.findIndex(x => x.id === memberId);
    if(i > -1) S.members[i] = m;
    CACHE.invalidateMember(memberId);
    
    await logAudit('update', 'member_debt', memberId, {
      action: ctx.selectedAction,
      amount: writtenOffAmount,
      total: ctx.debt
    });
    
    toast('✅ تم الحفظ', 'success', 2500);
    closeSheet();
    setTimeout(() => openMemberDetail(memberId), 200);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

async function clearDebtAction(memberId){
  if(!confirm('إلغاء قرار المتأخرات؟')) return;
  const m = getMemberById(memberId);
  if(!m) return;
  
  delete m.debtAction;
  delete m.writtenOffAmount;
  delete m.debtNote;
  delete m.debtDecidedAt;
  delete m.debtDecidedBy;
  delete m.debtAmountBefore;
  
  await dbPut('members', m);
  CACHE.invalidateMember(memberId);
  toast('↩️ تم الإلغاء');
  closeSheet();
  setTimeout(() => openMemberDetail(memberId), 200);
}

function generateQR(container, data){
  const canvas = document.createElement('canvas');
  canvas.width = 140;
  canvas.height = 140;
  canvas.style.cssText = 'max-width:140px;border-radius:8px';
  
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, 140, 140);
  
  // نمط بديل (QR visual pattern)
  const hash = simpleHash(data);
  const size = 20;
  const cell = 7;
  const offset = (140 - size * cell) / 2;
  
  for(let i = 0; i < size; i++){
    for(let j = 0; j < size; j++){
      const bit = ((hash >> ((i * size + j) % 30)) & 1) ^ ((i + j) % 2);
      if(bit){
        ctx.fillStyle = '#6d28d9';
        ctx.fillRect(offset + i * cell, offset + j * cell, cell, cell);
      }
    }
  }
  
  ctx.strokeStyle = '#6d28d9';
  ctx.lineWidth = 2;
  ctx.strokeRect(offset - 2, offset - 2, size * cell + 4, size * cell + 4);
  
  container.appendChild(canvas);
}

function simpleHash(str){
  let h = 0;
  for(let i = 0; i < str.length; i++){
    h = ((h << 5) - h) + str.charCodeAt(i);
    h = h & h;
  }
  return Math.abs(h);
}

        </button>

          <div style="font-size:32px">💚</div>
          <div style="flex:1"><div style="font-weight:800;font-size:14px;color:var(--donation)">تبرع</div><div style="font-size:11px;color:var(--muted)">تبرع اختياري</div></div>

function onPaymentMemberSearch(fund){
  const input = $('pMemberInput');
  const opts = $('pMemberOptions');
  if(!input || !opts) return;
  
  const q = input.value.trim();
  const isAssoc = fund === 'assoc';
  const isDeath = fund === 'death';
  
  let list = S.members.filter(m => {
    if(isAssoc) return m.assocStartYear && !m.assocExempt;
    if(isDeath) return m.deathStartYear && !m.deathExempt;
    return false;
  });
  
  // قيود المعتمد
  const u = S.currentUser;
  if(u.role === 'collector' && u.sector){
    list = list.filter(m => m.sector === u.sector);
  }
  
  if(q){
    const s = normAr(q);
    list = list.filter(m => normAr(`${m.name} ${m.code||''} ${m.sector||''}`).includes(s));
  }
  list = list.slice(0, 30);
  
  if(!list.length){
    opts.innerHTML = `<div style="padding:12px;color:var(--muted);text-align:center">${q ? 'لا نتائج' : 'اكتب اسماً'}</div>`;
  } else {
    opts.innerHTML = list.map(m => {
      const full = computeMemberFull(m.id);
      const rem = isAssoc ? (full?.total.assocRem || 0) : (full?.total.deathRem || 0);
      return `
        <div class="option-item" onclick="pickPaymentMember(${m.id},'${esc(m.name).replace(/'/g,"&#39;")}','${fund}')">
          <div style="flex:1;min-width:0">
            <div style="font-weight:700">${esc(m.name)}</div>
            <div style="font-size:10px;color:var(--muted)">${esc(m.code||'')} • ${esc(m.sector||'')}</div>
          </div>
          <small style="color:${rem > 0 ? 'var(--death)' : 'var(--success)'};font-weight:700">
            ${rem > 0 ? 'متبقي ' + fmtShort(rem) : '✅'}
          </small>
        </div>
      `;
    }).join('');
  }
  opts.classList.add('on');
}

function pickPaymentMember(id, name, fund){
  $('pMemberInput').value = name;
  $('pMemberId').value = id;
  $('pMemberOptions').classList.remove('on');
  showPaymentDues(fund, id);
}

function showPaymentDues(fund, memberId){
  const m = getMemberById(memberId);
  if(!m) return;
  const full = computeMemberFull(memberId);
  if(!full) return;
  
  const isAssoc = fund === 'assoc';
  const color = isAssoc ? 'assoc' : 'death';
  const rem = isAssoc ? full.total.assocRem : full.total.deathRem;
  const req = isAssoc ? full.total.assocReq : full.total.deathReq;
  const paid = isAssoc ? full.total.assocPaid : full.total.deathPaid;
  
  $('pDuesBox').innerHTML = `
    <div style="padding:12px;background:var(--bg);border-radius:12px;border:2px solid var(--${color})">
      <div style="font-weight:800;font-size:15px;margin-bottom:8px">${esc(m.name)}</div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">
        <span class="muted">المطلوب</span><b>${fmtNum(req)}</b>
      </div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">
        <span class="muted">المدفوع</span><b style="color:var(--success)">${fmtNum(paid)}</b>
      </div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:2px solid var(--${color});margin-top:4px">
        <span style="font-weight:800">المتبقي</span>
        <b style="font-weight:800;color:${rem > 0 ? 'var(--death)' : 'var(--success)'};font-family:'SF Mono',monospace">${fmtNum(rem)} ل.س</b>
      </div>
    </div>
  `;
  
  $('pDuesBox').style.display = 'block';
  $('pAmountField').style.display = 'block';
  $('pDateRow').style.display = 'grid';
  $('pNotesField').style.display = 'block';
  
  const buttons = [];
  if(rem > 0) buttons.push(`<button onclick="$('pAmount').value=${rem}">💰 كامل ${fmtShort(rem)}</button>`);
  buttons.push(`<button onclick="$('pAmount').value=5000">5,000</button>`);
  buttons.push(`<button onclick="$('pAmount').value=10000">10,000</button>`);
  buttons.push(`<button onclick="$('pAmount').value=25000">25,000</button>`);
  buttons.push(`<button onclick="$('pAmount').value=0">0 (معفى)</button>`);
  $('pQuickButtons').innerHTML = buttons.join('');
  $('pAmount').value = rem > 0 ? rem : '';
}

/* ⭐⭐⭐ حفظ الدفعة ⭐⭐⭐ */
async function savePayment(fund){
  const u = S.currentUser;
  const isDonation = fund === 'donation';
  const memberId = isDonation ? null : Number($('pMemberId').value);
  const amount = Number($('pAmount').value);
  const date = $('pDate').value;
  const forYear = Number($('pForYear').value);
  const notes = $('pNotes')?.value?.trim() || '';
  const donorName = isDonation ? ($('pDonorName')?.value?.trim() || '') : '';
  
  if(!isDonation && !memberId){ toast('اختر العضو', 'error'); return; }
  if(isNaN(amount) || amount < 0){ toast('المبلغ غير صحيح', 'error'); return; }
  if(!date){ toast('التاريخ مطلوب', 'error'); return; }
  
  if(amount === 0){
    if(!confirm('تسجيل دفعة بقيمة 0؟ (للأعضاء المعفيين)')) return;
  }
  
  showLoad(true);
  try {
    const m = memberId ? getMemberById(memberId) : null;
    
    const payment = {
      memberId,
      fund,
      amount,
      date,
      year: forYear,
      forYear,
      notes: isDonation ? (donorName + (notes ? ' | ' + notes : '')) : notes,
      collectorId: u.id,
      collectorName: u.name,
      receiptNumber: await generateReceiptNumber(fund, forYear),
      createdAt: new Date().toISOString()
    };
    
    const id = await dbPut('payments', payment);
    payment.id = id;
    S.payments.push(payment);
    
    if(memberId) CACHE.invalidateMember(memberId);
    CACHE.invalidateAll();
    
    await logAudit('add', 'payment', id, { fund, memberId, amount, forYear });
    
    toast('✅ تم تسجيل الدفعة', 'success', 2500);
    closeSheet();
    
    // ⭐ عرض سؤال إرسال الوصل
    if(m && m.phone && amount > 0){
      setTimeout(() => {
        if(confirm(`📱 إرسال وصل الدفع لـ ${m.name}؟`)){
          sendPaymentReceipt(id);
        }
      }, 400);
    } else if(amount > 0){
      setTimeout(() => {
        if(confirm('📱 طباعة وصل الدفع؟')){
          printPaymentReceipt(id);
        }
      }, 400);
    }
    
    go(S.page);
  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
  showLoad(false);
}

/* ⭐ توليد رقم وصل تسلسلي */
async function generateReceiptNumber(fund, year){
  const fundPrefix = fund === 'assoc' ? 'J' : fund === 'death' ? 'W' : 'T';
  const yearPayments = S.payments.filter(p =>
    p.fund === fund &&
    (Number(p.forYear) === year || Number(p.year) === year)
  );
  const num = yearPayments.length + 1;
  return `${fundPrefix}-${year}-${String(num).padStart(4, '0')}`;
}

/* ⭐⭐⭐ وصل الدفع — واتساب ⭐⭐⭐ */
function sendPaymentReceipt(paymentId){
  const p = S.payments.find(x => x.id === paymentId);
  if(!p) return;
  const m = getMemberById(p.memberId);
  if(!m) return;
  
  const fundLabel = p.fund === 'assoc' ? '💰 الجمعية' : p.fund === 'death' ? '⚰️ الوفاة' : '💚 التبرعات';
  
  let txt = `🧾 *وصل دفع رسمي*\n`;
  txt += `🏘️ صندوق زعورة\n`;
  txt += `━━━━━━━━━━━━━━\n\n`;
  txt += `🔢 رقم الوصل: *${p.receiptNumber || '—'}*\n`;
  txt += `📅 التاريخ: ${fmtDate(p.date)}\n\n`;
  txt += `👤 العضو: *${m.name}*\n`;
  txt += `${m.code ? '🆔 ' + m.code + '\n' : ''}`;
  txt += `📍 القطاع: ${m.sector || '—'}\n\n`;
  txt += `📦 الصندوق: ${fundLabel}\n`;
  txt += `💰 المبلغ: *${fmtNum(p.amount)} ل.س*\n`;
  txt += `📅 عن سنة: ${p.forYear || p.year}\n`;
  txt += `👤 المعتمد: ${p.collectorName}\n\n`;
  
  // حساب المتبقي
  const full = computeMemberFull(m.id);
  if(full){
    const rem = p.fund === 'assoc' ? full.total.assocRem : full.total.deathRem;
    txt += `━━━━━━━━━━━━━━\n`;
    txt += `💰 المتبقي بعد الدفع: *${fmtNum(rem)} ل.س*\n`;
  }
  
  txt += `\n_نشكركم على الالتزام_\n_صندوق زعورة_`;
  
  const phone = m.phone.replace(/^0/,'').replace(/^\+963/,'');
  const url = `whatsapp://send?phone=963${phone}&text=${encodeURIComponent(txt)}`;
  
  if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
    window.location.href = url;
  } else {
    window.open(`https://wa.me/963${phone}?text=${encodeURIComponent(txt)}`, '_blank');
  }
}

/* ⭐⭐⭐ نموذج دفع سريع — من التحصيل ⭐⭐⭐ */

/* ═══════════════════════════════════════════════════════════════
   📌 [القسم 12] — شاشة التحصيل (للمعتمد/الأمين)
   ═══════════════════════════════════════════════════════════════ */

function renderCollect(){
  const u = S.currentUser;
  const isCollector = u.role === 'collector';
  
  let list = S.members;
  
  if(isCollector){
    list = list.filter(m => {
      const cf = u.collectFund;
      if(cf === 'assoc') return m.assocStartYear;
      if(cf === 'death') return m.deathStartYear;
      return m.assocStartYear || m.deathStartYear;
    });
    if(u.sector) list = list.filter(m => m.sector === u.sector);
  }
  
  const f = S.filters.collector || 'all';
  if(f === 'late'){
    list = list.filter(m => {
      const full = computeMemberFull(m.id);
      return full && full.total.totalRem > 0;
    });
  } else if(f === 'paid'){
    list = list.filter(m => {
      const full = computeMemberFull(m.id);
      return full && full.total.totalRem <= 0;
    });
  }
  
  if(S.search){
    const s = normAr(S.search);
    list = list.filter(m =>
      normAr(`${m.name} ${m.code||''} ${m.phone||''}`).includes(s)
    );
  }
  
  list.sort((a, b) => {
    const fa = computeMemberFull(a.id);
    const fb = computeMemberFull(b.id);
    const ra = fa?.total.totalRem || 0;
    const rb = fb?.total.totalRem || 0;
    if(ra !== rb) return rb - ra;
    return String(a.name).localeCompare(String(b.name), 'ar');
  });
  
  // إحصائيات
  const allList = isCollector
    ? S.members.filter(m => {
        const cf = u.collectFund;
        if(cf === 'assoc') return m.assocStartYear;
        if(cf === 'death') return m.deathStartYear;
        return m.assocStartYear || m.deathStartYear;
      }).filter(m => !u.sector || m.sector === u.sector)
    : S.members;
  
  const counts = {
    all: allList.length,
    late: allList.filter(m => {
      const full = computeMemberFull(m.id);
      return full && full.total.totalRem > 0;
    }).length,
    paid: allList.filter(m => {
      const full = computeMemberFull(m.id);
      return full && full.total.totalRem <= 0;
    }).length
  };
  
  $('pg-collect').innerHTML = `
    <div class="card" style="padding:10px;margin-bottom:8px">
      <div class="chips" style="margin-bottom:0">
        <button class="chip ${f === 'all' ? 'on' : ''}" onclick="setCollectorFilter('all')">📋 الكل (${counts.all})</button>
        <button class="chip ${f === 'late' ? 'on' : ''}" onclick="setCollectorFilter('late')">⏳ متأخرون (${counts.late})</button>
        <button class="chip ${f === 'paid' ? 'on' : ''}" onclick="setCollectorFilter('paid')">✅ مسددون (${counts.paid})</button>
      </div>
    </div>
    
    ${list.length ? `
      <div class="list">${list.slice(0, 500).map(m => renderCollectorMemberRow(m)).join('')}</div>
    ` : `
      <div class="empty">
        <span class="ico">👥</span>
        <h3>لا يوجد أعضاء</h3>
        <p>جرّب فلتراً آخر</p>
      </div>
    `}
  `;
}

function setCollectorFilter(f){
  S.filters.collector = f;
  renderCollect();
}

function renderCollectorMemberRow(m){
  const full = computeMemberFull(m.id);
  const rem = full?.total.totalRem || 0;
  const isLate = rem > 0;
  
  const icons = [];
  if(m.assocStartYear) icons.push('💰');
  if(m.deathStartYear) icons.push('⚰️');
  
  return `
    <div class="item" onclick="openQuickPaySheet(${m.id})">
      <div class="av ${isLate ? 'red' : 'green'}">${icons.join('') || '⭐'}</div>
      <div class="body">
        <div class="ttl">${esc(m.name)}</div>
        <div class="sub">${esc(m.sector||'')} ${isLate ? '• ⏳ متبقي' : '• ✅ مسدَّد'}</div>
      </div>
      <div style="text-align:left">
        ${isLate
          ? `<div style="font-weight:800;color:var(--death);font-size:14px;font-family:'SF Mono',monospace">${fmtShort(rem)}</div>
             <div style="font-size:10px;color:var(--muted)">ل.س</div>`
          : `<div style="color:var(--success);font-size:20px">✓</div>`}
      </div>
    </div>
  `;
}
