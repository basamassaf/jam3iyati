        <div class="quick-btn donation" onclick="openFundPaymentForm('donation', null)"><div class="ico">💚</div><div class="lbl">تبرع</div></div>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════
   📌 [قسم 10] — شاشة الأعضاء — بتصنيفات 5
   ✨ [NEW-003]
   ═══════════════════════════════════════════════════════════════ */

const MEMBER_TABS = [
  { k:'subscribed',   l:'💼 مشتركون' },
  { k:'unsubscribed', l:'⚪ غير مشتركين' },
  { k:'withdrawn',    l:'🚪 منسحبون' },
  { k:'frozen',       l:'⏸️ متوقفون' },
  { k:'deceased',     l:'⚰️ متوفون' }
];

function renderMembersPage(){
  const activeTab = S.filters.members || 'subscribed';
  const tabCounts = {
    subscribed: S.members.filter(m => m.assocStartYear || m.deathStartYear).length,
    unsubscribed: S.members.filter(m => !m.assocStartYear && !m.deathStartYear).length,
    withdrawn: S.members.filter(m => m.memberStatus === 'منسحب').length,
    frozen: S.members.filter(m => m.memberStatus === 'متوقف').length,
    deceased: S.members.filter(m => m.memberStatus === 'متوفى').length
  };

  $('pg-members').innerHTML = `
    <div class="card" style="padding:12px">
      <div class="chips">
        ${MEMBER_TABS.map(t => `
          <button class="chip ${activeTab === t.k ? 'on' : ''}" onclick="setMemberTab('${t.k}')">
            ${t.l} (${tabCounts[t.k] || 0})
          </button>
        `).join('')}
      </div>
      <div class="chips" style="margin-bottom:0">
        <button class="chip ${S.filters.membersSector === 'all' ? 'on' : ''}" onclick="setMemberSector('all')">📍 الكل</button>
        ${DEFAULT_SECTORS.map(s => `
          <button class="chip ${S.filters.membersSector === s ? 'on' : ''}" onclick="setMemberSector('${s}')">${s}</button>
        `).join('')}
      </div>
    </div>
    <div id="membersListContent"></div>
  `;

  renderMembersList();
}

function setMemberTab(k){
  S.filters.members = k;
  renderMembersPage();
}

function setMemberSector(s){
  S.filters.membersSector = s;
  renderMembersPage();
}

function renderMembersList(){
  const tab = S.filters.members || 'subscribed';
  const sector = S.filters.membersSector || 'all';

  let list = S.members.slice();

  // فلتر التصنيف
  if(tab === 'subscribed'){
    list = list.filter(m => m.assocStartYear || m.deathStartYear);
  } else if(tab === 'unsubscribed'){
    list = list.filter(m => !m.assocStartYear && !m.deathStartYear);
  } else if(tab === 'withdrawn'){
    list = list.filter(m => m.memberStatus === 'منسحب');
  } else if(tab === 'frozen'){
    list = list.filter(m => m.memberStatus === 'متوقف');
  } else if(tab === 'deceased'){
    list = list.filter(m => m.memberStatus === 'متوفى');
  }

  if(sector !== 'all') list = list.filter(m => m.sector === sector);

  if(S.search){
    const s = normAr(S.search);
    list = list.filter(m =>
      normAr(`${m.name} ${m.code||''} ${m.phone||''} ${m.familyCode||''}`).includes(s)
    );
  }

  // ترتيب: متأخرون أولاً
  list.sort((a, b) => {
    const fa = computeMemberFull(a.id);
    const fb = computeMemberFull(b.id);
    const ra = fa?.total.totalRem || 0;
    const rb = fb?.total.totalRem || 0;
    if(ra !== rb) return rb - ra;
    return String(a.name).localeCompare(String(b.name), 'ar');
  });

  const el = $('membersListContent');
  if(!list.length){
    el.innerHTML = `<div class="empty"><span class="ico">👥</span><h3>لا يوجد أعضاء</h3><p>في هذا التصنيف</p></div>`;
    return;
  }

  el.innerHTML = `<div class="list">${list.slice(0, 500).map(m => renderMemberRow(m)).join('')}</div>`;
}

function renderMemberRow(m){
  const full = computeMemberFull(m.id);
  const rem = full?.total.totalRem || 0;
  const hasUnpaid = rem > 0;
  const st = m.memberStatus || 'نشط';

  const icons = [];
  if(m.assocStartYear) icons.push('💰');
  if(m.deathStartYear) icons.push('⚰️');

  let statusBadge = '';
  if(st === 'متوفى')  statusBadge = '<span class="badge danger">⚰️</span>';
  else if(st === 'منسحب') statusBadge = '<span class="badge muted">🚪</span>';
  else if(st === 'متوقف') statusBadge = '<span class="badge warning">⏸️</span>';
  else if(st === 'معفى')  statusBadge = '<span class="badge info">🎗️</span>';

  return `
    <div class="item" onclick="openMemberDetail(${m.id})">
      <div class="av ${hasUnpaid ? 'red' : 'green'}">${icons.join('') || '⭐'}</div>
      <div class="body">
        <div class="ttl">${esc(m.name)} ${m.memberType === 'مخفض' ? '🎓' : ''} ${statusBadge}</div>
        <div class="sub">${esc(m.code||'')} • ${esc(m.sector||'')} ${hasUnpaid ? '• متبقي ' + fmtShort(rem) : '• ✅'}</div>
      </div>
      <div style="text-align:left">
        ${hasUnpaid
          ? `<div style="font-weight:800;color:var(--danger);font-size:13px">${fmtShort(rem)}</div>`
          : `<div style="color:var(--success);font-size:16px">✅</div>`}
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════
   👤 كشف حساب العضو — للمدير
   ═══════════════════════════════════════════════════════════════ */

function openMemberDetail(id){
  const full = computeMemberFull(id);
  if(!full) return;
  const m = full.member;
  const st = m.memberStatus || 'نشط';
  const showAllYears = window._showAllYears || false;

  let statusBar = '';
  if(st === 'متوفى')  statusBar = '<div style="padding:6px;background:#fee2e2;color:#991b1b;border-radius:8px;font-size:11px;font-weight:800;text-align:center;margin-bottom:10px">⚰️ متوفى' + (m.deathDate ? ' — ' + fmtDate(m.deathDate) : '') + '</div>';
  else if(st === 'منسحب') statusBar = '<div style="padding:6px;background:#f1f5f9;color:#475569;border-radius:8px;font-size:11px;font-weight:800;text-align:center;margin-bottom:10px">🚪 منسحب — توقف من ' + (m.stopYear||'?') + '</div>';
  else if(st === 'متوقف') statusBar = '<div style="padding:6px;background:#fef3c7;color:#92400e;border-radius:8px;font-size:11px;font-weight:800;text-align:center;margin-bottom:10px">⏸️ متوقف — من ' + (m.stopYear||'?') + '</div>';
  else if(st === 'معفى')  statusBar = '<div style="padding:6px;background:#dbeafe;color:#1e40af;border-radius:8px;font-size:11px;font-weight:800;text-align:center;margin-bottom:10px">🎗️ معفى من الرسوم</div>';

  const allYears = full.years.filter(yr => !yr.skipped && (yr.assoc.req > 0 || yr.death.req > 0));
  const unpaidYears = allYears.filter(yr => (yr.assoc.req - yr.assoc.paid) > 0 || (yr.death.req - yr.death.paid) > 0);
  const paidYears = allYears.filter(yr => (yr.assoc.req - yr.assoc.paid) <= 0 && (yr.death.req - yr.death.paid) <= 0);
  const displayYears = showAllYears ? allYears : unpaidYears;

  const body = `
    <div style="padding:16px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-radius:14px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0">
          ${m.gender === 'أنثى' ? '👩' : '👨'}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:17px">${esc(m.name)}</div>
          <div style="font-size:12px;opacity:.9;margin-top:3px">
            ${esc(m.code||'')} • ${esc(m.sector||'')}
            ${m.familyCode ? ' • 👨‍👩‍👧 ' + esc(m.familyCode) : ''}
          </div>
          <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
            ${m.assocStartYear ? `<span style="background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800">💰 منذ ${m.assocStartYear}</span>` : ''}
            ${m.deathStartYear ? `<span style="background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800">⚰️ منذ ${m.deathStartYear}</span>` : ''}
            ${m.memberType ? `<span style="background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800">${m.memberType === 'مخفض' ? '🎓 مخفض' : '👤 عادي'}</span>` : ''}
          </div>
        </div>
      </div>
    </div>

    ${statusBar}

    <div style="padding:14px;background:var(--bg);border-radius:12px;margin-bottom:14px;text-align:center">
      <div style="font-size:11px;color:var(--muted);font-weight:700">إجمالي المتبقي</div>
      <div style="font-size:28px;font-weight:800;color:${full.total.totalRem > 0 ? 'var(--danger)' : 'var(--success)'};margin-top:4px">${fmtNum(full.total.totalRem)} ل.س</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">دُفع ${fmtNum(full.total.totalPaid)} من ${fmtNum(full.total.totalReq)}</div>
    </div>

    ${full.total.assocReq > 0 ? `
      <div class="balance-block" style="border-right:4px solid var(--assoc)">
        <div style="font-weight:800;color:var(--assoc);margin-bottom:8px">💰 الجمعية</div>
        ${full.total.assocYearlyReq > 0 ? `<div class="balance-row"><span class="lbl">📅 اشتراكات سنوية</span><span class="val">${fmtNum(full.total.assocYearlyReq)}</span></div>` : ''}
        ${full.total.assocJoinReq > 0 ? `<div class="balance-row"><span class="lbl">🎫 رسوم انضمام</span><span class="val orange">${fmtNum(full.total.assocJoinReq)}</span></div>` : ''}
        <div class="balance-row"><span class="lbl">✅ دُفع</span><span class="val green">${fmtNum(full.total.assocPaid)}</span></div>
        <div class="balance-row" style="border-top:2px solid var(--assoc);padding-top:6px">
          <span style="font-weight:800">المتبقي</span>
          <span class="val" style="color:${full.total.assocRem > 0 ? 'var(--danger)' : 'var(--success)'}">${fmtNum(full.total.assocRem)}</span>
        </div>
      </div>
    ` : ''}

    ${full.total.deathReq > 0 ? `
      <div class="balance-block" style="border-right:4px solid var(--death)">
        <div style="font-weight:800;color:var(--death);margin-bottom:8px">⚰️ الوفاة</div>
        ${full.total.deathJoinReq > 0 ? `<div class="balance-row"><span class="lbl">🎫 رسوم انضمام</span><span class="val orange">${fmtNum(full.total.deathJoinReq)}</span></div>` : ''}
        ${full.total.deathInstallReq > 0 ? `<div class="balance-row"><span class="lbl">📊 أقساط الوفيات</span><span class="val">${fmtNum(full.total.deathInstallReq)}</span></div>` : ''}
        <div class="balance-row"><span class="lbl">✅ دُفع</span><span class="val green">${fmtNum(full.total.deathPaid)}</span></div>
        <div class="balance-row" style="border-top:2px solid var(--death);padding-top:6px">
          <span style="font-weight:800">المتبقي</span>
          <span class="val" style="color:${full.total.deathRem > 0 ? 'var(--danger)' : 'var(--success)'}">${fmtNum(full.total.deathRem)}</span>
        </div>
      </div>
    ` : ''}

    ${hasPerm('payment.add') ? `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
        ${m.assocStartYear && !m.assocExempt ? `<button class="btn assoc" onclick="closeSheet();setTimeout(()=>openFundPaymentForm('assoc',${id}),150)">💰 دفعة جمعية</button>` : ''}
        ${m.deathStartYear && !m.deathExempt ? `<button class="btn death" onclick="closeSheet();setTimeout(()=>openFundPaymentForm('death',${id}),150)">⚰️ دفعة وفاة</button>` : ''}
      </div>
    ` : ''}

    <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px">
      <div style="font-weight:800;font-size:14px">📊 كشف الحساب</div>
      ${paidYears.length ? `
        <button class="btn ghost sm" onclick="window._showAllYears=${!showAllYears};closeSheet();setTimeout(()=>openMemberDetail(${id}),150)">
          ${showAllYears ? '📁 إخفاء المسدَّد' : `📂 المسدَّد (${paidYears.length})`}
        </button>
      ` : ''}
    </div>

    ${displayYears.length ? displayYears.map(yr => {
      const hasUnpaidA = (yr.assoc.req - yr.assoc.paid) > 0;
      const hasUnpaidD = (yr.death.req - yr.death.paid) > 0;
      return `
        <div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:10px;${!hasUnpaidA && !hasUnpaidD ? 'opacity:.75' : ''}">
          <div style="font-weight:800;font-size:14px;margin-bottom:10px">
            📅 ${yr.year} ${!hasUnpaidA && !hasUnpaidD ? '<span class="badge success">✅ مسدَّد</span>' : ''}
          </div>
          ${yr.assoc.req > 0 ? `
            <div style="padding:8px;background:var(--card);border-radius:8px;margin-bottom:6px;border-right:3px solid var(--assoc)">
              <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--assoc);margin-bottom:4px">
                <span>💰 الجمعية</span><span>${fmtNum(yr.assoc.paid)} / ${fmtNum(yr.assoc.req)}</span>
              </div>
              ${yr.assoc.joinReq > 0 ? `<div style="font-size:10px;color:var(--warning);margin-top:2px">🎫 انضمام: ${fmtNum(yr.assoc.joinReq)}</div>` : ''}
              ${hasUnpaidA ? `<div style="font-size:11px;color:var(--danger);margin-top:4px;font-weight:700">متبقي: ${fmtNum(yr.assoc.req - yr.assoc.paid)}</div>` : '<div style="font-size:11px;color:var(--success);margin-top:4px">✅</div>'}
            </div>
          ` : ''}
          ${yr.death.req > 0 ? `
            <div style="padding:8px;background:var(--card);border-radius:8px;border-right:3px solid var(--death)">
              <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--death);margin-bottom:4px">
                <span>⚰️ الوفاة</span><span>${fmtNum(yr.death.paid)} / ${fmtNum(yr.death.req)}</span>
              </div>
              ${yr.death.joinReq > 0 ? `<div style="font-size:10px;color:var(--warning);margin-top:2px">🎫 انضمام: ${fmtNum(yr.death.joinReq)}</div>` : ''}
              ${hasUnpaidD ? `<div style="font-size:11px;color:var(--danger);margin-top:4px;font-weight:700">متبقي: ${fmtNum(yr.death.req - yr.death.paid)}</div>` : '<div style="font-size:11px;color:var(--success);margin-top:4px">✅</div>'}
            </div>
          ` : ''}
        </div>
      `;
    }).join('') : '<div style="text-align:center;padding:20px;background:#f0fdf4;border-radius:12px;color:#166534;font-weight:800">✅ كل السنوات مسدَّدة!</div>'}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px">
      ${canEditMember() ? `<button class="btn ghost block" onclick="closeSheet();setTimeout(()=>openMemberSheet(${id}),150)">📝 بيانات العضو</button>` : ''}
      <button class="btn ghost block" onclick="showMemberPaymentsList(${id})">📜 الدفعات</button>
    </div>

    ${m.phone ? `<a class="btn success block" style="margin-top:8px" href="https://wa.me/963${m.phone.replace(/^0/,'')}" target="_blank">📱 واتساب العضو</a>` : ''}
    <button class="btn info block" style="margin-top:8px" onclick="shareMemberStatement(${id})">🖨️ تصدير كشف الحساب</button>
  `;

  openSheet('👤 ' + m.name, body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide: true });
}

function showMemberPaymentsList(memberId){
  const m = getMemberById(memberId);
  const list = S.payments.filter(p => p.memberId === memberId)
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const body = list.length ? `<div class="list">${list.map(p => `
    <div class="item" style="cursor:default">
      <div class="av ${p.fund === 'death' ? 'red' : p.fund === 'donation' ? 'green' : 'blue'}">${p.fund === 'death' ? '⚰️' : p.fund === 'donation' ? '💚' : '💰'}</div>
      <div class="body">
        <div class="ttl">${fmtNum(p.amount)} ل.س</div>
        <div class="sub">${p.fund === 'death' ? 'وفاة' : p.fund === 'donation' ? 'تبرع' : 'جمعية'} • ${fmtDate(p.date)} • سنة ${p.forYear || p.year} • ${esc(p.collectorName || '')}</div>
      </div>
    </div>
  `).join('')}</div>` : '<div class="empty"><p>لا توجد دفعات</p></div>';

  openSheet('📜 دفعات ' + m.name, body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide: true });
}

function shareMemberStatement(id){
  const full = computeMemberFull(id);
  if(!full) return;
  const m = full.member;
  let txt = `👤 *كشف حساب: ${m.name}*\n`;
  txt += `الكود: ${m.code || '—'} • القطاع: ${m.sector || '—'}\n\n`;
  txt += `📊 *الملخص:*\n`;
  txt += `• إجمالي المطلوب: ${fmtNum(full.total.totalReq)}\n`;
  txt += `• دُفع: ${fmtNum(full.total.totalPaid)}\n`;
  txt += `• المتبقي: ${fmtNum(full.total.totalRem)}\n\n`;

  if(full.total.assocReq > 0){
    txt += `💰 *الجمعية:* دُفع ${fmtNum(full.total.assocPaid)} / متبقي ${fmtNum(full.total.assocRem)}\n`;
  }
  if(full.total.deathReq > 0){
    txt += `⚰️ *الوفاة:* دُفع ${fmtNum(full.total.deathPaid)} / متبقي ${fmtNum(full.total.deathRem)}\n`;
  }
  txt += `\n_صندوق زعورة_`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

    <div class="fld-row">
      <div class="fld"><label>الميلاد</label><input id="mBirth" type="date" value="${esc(m.birth||'')}" ${dis}></div>

        <select id="mSector" ${dis}><option value="">—</option>${sectorOpts}</select>
      </div>

    <div class="fld-row">
      <div class="fld"><label>الصلة</label>

          ${['رب أسرة','زوجة','زوج','ابن','بنت','أب','أم','أخ','أخت','جد','جدة','حفيد','حفيدة','أخرى'].map(r => `<option ${m.relation === r ? 'selected' : ''}>${r}</option>`).join('')}
        </select>

function toggleMemberStatusFields(){
  const v = $('mMemberStatus')?.value;
  if(!v) return;
  $('mStopYearField').style.display = ['منسحب','متوقف'].includes(v) ? 'block' : 'none';
  $('mDeathDateField').style.display = v === 'متوفى' ? 'block' : 'none';
}

function toggleAssocYearField(){
  const on = $('mAssocActive')?.value === 'yes';
  if($('mAssocYear')){
    $('mAssocYear').disabled = !on;
    if(!on) $('mAssocYear').value = '';
  }
}

function toggleDeathYearField(){
  const on = $('mDeathActive')?.value === 'yes';
  if($('mDeathYear')){
    $('mDeathYear').disabled = !on;
    if(!on) $('mDeathYear').value = '';
  }
}

async function saveMemberNew(id = null){
  const canEditAll = canEditMember();
  const canEditPhone = canEditMemberPhone();

  if(!canEditAll && !canEditPhone){
    toast('غير مصرح', 'error'); return;
  }

  try {
    const old = id ? await dbGet('members', id) : null;
    let obj = old ? { ...old } : {};

    // تحديث الجوال دائماً (إذا مسموح)
    if(canEditPhone){
      obj.phone = cleanPhone($('mPhone')?.value || '');
    }

    // باقي الحقول — للمدير فقط
    if(canEditAll){
      const name = cleanText($('mName').value);
      if(!name){ toast('الاسم مطلوب', 'error'); return; }

      const assocActive = $('mAssocActive').value === 'yes';
      const deathActive = $('mDeathActive').value === 'yes';
      const memberStatus = $('mMemberStatus').value;

      obj = {
        ...obj,
        code: cleanText($('mCode').value),
        familyCode: cleanText($('mFamily').value),
        name,
        gender: $('mGender').value,
        status: $('mStatus').value,
        birth: $('mBirth').value,
        sector: $('mSector').value,
        relation: $('mRelation').value,
        phone: cleanPhone($('mPhone').value),
        assocStartYear: assocActive ? Number($('mAssocYear').value) : null,
        deathStartYear: deathActive ? Number($('mDeathYear').value) : null,
        memberType: $('mType').value,
        memberStatus,
        stopYear: ['منسحب','متوقف'].includes(memberStatus) ? Number($('mStopYear').value) || null : null,
        deathDate: memberStatus === 'متوفى' ? ($('mDeathDate').value || '') : '',
        assocExempt: $('mAssocExempt').checked,
        deathExempt: $('mDeathExempt').checked,
        notes: cleanText($('mNotes').value),
        custom: {}
      };

      (S.customFields || []).forEach(cf => {
        const el = $(`cf_${cf.key}`);
        if(el) obj.custom[cf.key] = cleanText(el.value);
      });
    }

    if(!obj.createdAt) obj.createdAt = new Date().toISOString();

    if(id){
      obj.id = id;
      await dbPut('members', obj);
      const i = S.members.findIndex(x => x.id === id);
      if(i > -1) S.members[i] = obj;
      CACHE.invalidateMember(id);
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('members', obj);
      obj.id = newId;
      S.members.push(obj);
      toast('✅ تمت الإضافة');
    }

    await logAudit(id ? 'update' : 'add', 'member', obj.id, { name: obj.name });

    closeSheet();
    go(S.page);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

async function deleteMember(id){
  if(!canEditMember()){ toast('غير مصرح', 'error'); return; }
  if(!confirm('حذف هذا العضو؟')) return;
  if(!confirm('تأكيد أخير!')) return;
  try {
    await dbDel('members', id);
    S.members = S.members.filter(x => x.id !== id);
    CACHE.invalidateAll();
    toast('🗑️ تم الحذف');
    closeSheet();
    go(S.page);
  } catch(e){
    toast('خطأ', 'error');
  }
}

  if(!confirm('حذف هذه الوفاة؟')) return;
  if(!confirm('تأكيد أخير!')) return;
  try {
    await dbDel('deaths', id);
    S.deaths = S.deaths.filter(x => x.id !== id);
    CACHE.invalidateAll();
    toast('🗑️ تم الحذف');
    closeSheet();
    go(S.page);
  } catch(e){ toast('خطأ', 'error'); }
}

function openFamilyReportNew(){
  const families = {};
  S.members.forEach(m => {
    const key = m.familyCode || 'بدون كود';
    if(!families[key]) families[key] = { code: key, members: [] };
    families[key].members.push(m);
  });

  for(const key in families){
    const f = families[key];
    f.totalPaid = 0; f.totalRem = 0;
    f.members.forEach(m => {
      const full = computeMemberFull(m.id);
      if(full){
        f.totalPaid += full.total.totalPaid;
        f.totalRem += full.total.totalRem;
      }
    });
  }

  const list = Object.values(families).sort((a, b) => b.members.length - a.members.length);

  const body = `<div class="list">${list.map(f => `
    <div class="item">
      <div class="av">👨‍👩‍👧</div>
      <div class="body">
        <div class="ttl">عائلة ${esc(f.code)} <span class="badge primary">${f.members.length}</span></div>
        <div class="sub">دُفع ${fmtShort(f.totalPaid)}${f.totalRem > 0 ? ' • متبقي ' + fmtShort(f.totalRem) : ' • ✅'}</div>

  openSheet('👨‍👩‍👧 العائلات', body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide: true });
}

async function saveDeathNew(){
  const name = cleanText($('dName').value);
  const date = $('dDate').value;
  const year = Number($('dYear').value);
  const comp = Number($('dComp').value) || 0;
  const recipient = cleanText($('dRecipient').value);
  const notes = cleanText($('dNotes').value);

  if(!name){ toast('اسم المتوفى مطلوب', 'error'); return; }
  if(!date){ toast('التاريخ مطلوب', 'error'); return; }

  // فحص التكرار
  const isDup = S.deaths.some(d =>
    normAr(d.deceasedName) === normAr(name) && Number(d.year) === year
  );
  if(isDup){
    if(!confirm('⚠️ توجد وفاة بنفس الاسم في هذه السنة. متابعة؟')) return;
  }

  const deathSubs = S.members.filter(m =>
    m.deathStartYear && m.deathStartYear <= year && !m.deathExempt
  ).length;
  const c = getConstants(year);
  const inst = c?.deathInstallment || 5000;
  const totalImpact = deathSubs * inst;

  if(!confirm(`⚰️ تسجيل وفاة "${name}"\n\nعدد مشتركي الوفاة: ${deathSubs}\nسيُضاف قسط ${fmtNum(inst)} × ${deathSubs} = ${fmtNum(totalImpact)} ل.س\n\nمتابعة؟`)) return;

  try {
    const death = {
      deceasedName: name,
      deathDate: date,
      year,
      compensation: comp,
      recipient,
      notes,
      recordedBy: S.currentUser.id,
      recordedByName: S.currentUser.name,
      createdAt: new Date().toISOString()
    };
    const id = await dbPut('deaths', death);
    death.id = id;
    S.deaths.push(death);
    CACHE.invalidateAll();
    await logAudit('add', 'death', id, { name, year, comp });

    toast(`⚰️ تم التسجيل (${deathSubs} قسط)`, 'success', 4000);
    closeSheet();
    go(S.page);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

async function saveStoreMovementNew(){
  const itemId = Number($('stmItemId').value);
  const type = $('stmType').value;
  const qty = Number($('stmQty').value);

  if(!qty || qty <= 0){ toast('الكمية مطلوبة', 'error'); return; }

  const item = S.storeItems.find(x => x.id === itemId);
  if(!item) return;

  const oldQty = Number(item.quantity) || 0;
  let newQty = oldQty;
  if(type === 'out' || type === 'damaged') newQty = oldQty - qty;
  else newQty = oldQty + qty;

  if(newQty < 0){ toast('الكمية غير كافية', 'error'); return; }

  try {
    const movement = {
      itemId, itemName: item.name, type, quantity: qty,
      ref: cleanText($('stmRef').value),
      notes: cleanText($('stmNotes').value),
      oldQuantity: oldQty, newQuantity: newQty,
      userName: S.currentUser.name,
      date: today(),
      createdAt: new Date().toISOString()
    };
    await dbPut('storeMovements', movement);
    S.storeMovements.push(movement);

    item.quantity = newQty;
    if(type === 'new') item.totalOwned = (item.totalOwned || 0) + qty;
    if(type === 'damaged') item.condition = 'يحتاج صيانة';
    await dbPut('storeItems', item);

    toast('✅ تم');
    closeSheet();
    go(S.page);
  } catch(e){ toast('خطأ', 'error'); }
}

async function saveUserNew(id = null){
  const name = cleanText($('uName').value);
  const pin = $('uPin').value.trim();

  if(!name){ toast('الاسم مطلوب', 'error'); return; }
  if(pin && !/^\d{4}$/.test(pin)){ toast('المرور: 4 أرقام', 'error'); return; }

  const role = $('uRole').value;
  const collectFund = role === 'collector' ? ($('uCollectFund')?.value || 'both') : null;
  const sector = role === 'collector' ? ($('uSector')?.value || '') : '';
  const memberId = role === 'member' ? (Number($('uMemberId')?.value) || null) : null;

  if(role === 'member' && !memberId){ toast('اربط المشترك بعضو', 'error'); return; }

  try {
    const old = id ? await dbGet('users', id) : null;
    const obj = {
      name,
      phone: cleanPhone($('uPhone').value),
      role, collectFund, sector, memberId,
      hasPin: pin ? true : (old ? old.hasPin : false),
      pin: pin ? pin : (old ? old.pin : null),
      createdAt: old ? old.createdAt : new Date().toISOString()
    };
    if(id){
      obj.id = id;
      await dbPut('users', obj);
      const i = S.users.findIndex(x => x.id === id);
      if(i > -1) S.users[i] = obj;
      if(S.currentUser && S.currentUser.id === id) S.currentUser = obj;
    } else {
      const newId = await dbPut('users', obj);
      obj.id = newId;
      S.users.push(obj);
    }
    toast('✅');
    closeSheet();
    go(S.page);
  } catch(e){ toast('خطأ', 'error'); }
}

async function deleteUserNew(id){
  if(!confirm('حذف المستخدم؟')) return;
  const u = S.users.find(x => x.id === id);
  if(u.role === 'manager' && S.users.filter(x => x.role === 'manager').length <= 1){
    toast('لا يمكن حذف المدير الوحيد', 'error');
    return;
  }
  try {
    await dbDel('users', id);
    S.users = S.users.filter(x => x.id !== id);
    toast('🗑️');
    closeSheet();
    go(S.page);
  } catch(e){ toast('خطأ', 'error'); }
}

async function importMembersNew(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';

  showLoad(true);
  const log = $('importLogNew');
  log.innerHTML = '<div style="color:var(--muted)">⏳ جاري القراءة...</div>';

  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });

    if(!rows.length){
      log.innerHTML = '<div style="color:var(--danger)">❌ الملف فارغ</div>';
      showLoad(false);
      return;
    }

    let added = 0, updated = 0, skip = 0;
    const tc = { both:0, assoc:0, death:0, none:0, unknown:0 };

    const existing = new Map();
    S.members.forEach(m => {
      if(m.code) existing.set(String(m.code), m);
      existing.set(normAr(m.name), m);
    });

    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const name = cleanText(gv(r, 'الاسم الثلاثي','الاسم_الثلاثي','الاسم'));
      if(!name){ skip++; continue; }

      const code = cleanText(gv(r, 'رقم الفرد','رقم_الفرد','الكود','كود العضو'));
      const subDate = toDate(gv(r, 'تاريخ الاشتراك','تاريخ_الاشتراك','تاريخ الانضمام'));
      const subYear = subDate ? new Date(subDate).getFullYear() : null;

      const subTypeRaw = gv(r, 'نوع الاشتراك','نوع_الاشتراك');
      const subType = normAr(subTypeRaw || '');
      const subTypeDefined = subType.length > 0;

      const hasAssocWord = /جمعي/.test(subType);
      const hasDeathWord = /وفا/.test(subType);
      const isBoth = subType.includes('كلاهما') || subType === 'كلا' || (hasAssocWord && hasDeathWord);
      const isNone = subType.includes('غير') && subType.includes('مشترك');

      let hasAssoc = false, hasDeath = false;
      if(isNone){ tc.none++; }
      else if(isBoth){ hasAssoc = true; hasDeath = true; tc.both++; }
      else if(hasAssocWord){ hasAssoc = true; tc.assoc++; }
      else if(hasDeathWord){ hasDeath = true; tc.death++; }
      else { tc.unknown++; }

      const memberTypeStr = normAr(gv(r, 'نوع العضو','نوع_العضو') || '');
      const memberType = memberTypeStr.includes('مخفض') ? 'مخفض' : 'عادي';

      let found = null;
      if(code && existing.has(String(code))) found = existing.get(String(code));
      else if(existing.has(normAr(name))) found = existing.get(normAr(name));

      if(found){
        let changed = false;
        if(subTypeDefined && subYear){
          const newAssoc = hasAssoc ? subYear : null;
          const newDeath = hasDeath ? subYear : null;
          if(found.assocStartYear !== newAssoc){ found.assocStartYear = newAssoc; changed = true; }
          if(found.deathStartYear !== newDeath){ found.deathStartYear = newDeath; changed = true; }
        }
        if(changed){ await dbPut('members', found); updated++; } else skip++;
        continue;
      }

      try {
        const member = {
          code, name,
          familyCode: cleanText(gv(r, 'كود الأسرة','كود_الأسرة')),
          gender: gv(r, 'الجنس') || 'ذكر',
          status: gv(r, 'الحالة') || 'حي',
          relation: gv(r, 'صلة القرابة','صلة_القرابة') || 'رب أسرة',
          birth: toDate(gv(r, 'تاريخ الميلاد','تاريخ_الميلاد')),
          sector: gv(r, 'القطاع'),
          phone: cleanPhone(gv(r, 'الجوال','الهاتف')),
          assocStartYear: hasAssoc ? subYear : null,
          deathStartYear: hasDeath ? subYear : null,
          memberType,
          memberStatus: 'نشط',
          assocExempt: false,
          deathExempt: false,
          custom: {},
          notes: cleanText(gv(r, 'ملاحظات')),
          createdAt: new Date().toISOString()
        };
        const newId = await dbPut('members', member);
        member.id = newId;
        S.members.push(member);
        if(code) existing.set(String(code), member);
        existing.set(normAr(name), member);
        added++;
      } catch(e){ console.warn('صف', i+2, e); skip++; }
    }

    log.innerHTML = `
      <div style="padding:12px;background:#f0fdf4;border-radius:12px;color:#166534">
        <div style="font-weight:800;margin-bottom:6px">📊 النتيجة</div>
        <div>➕ أُضيف: <b>${added}</b></div>
        <div>✏️ حُدّث: <b>${updated}</b></div>
        <div>⏭️ تُخطّي: <b>${skip}</b></div>
      </div>
      <div style="padding:12px;background:#eff6ff;border-radius:12px;color:#1e40af;margin-top:10px">
        <div><b>قراءة نوع الاشتراك:</b></div>
        <div>✅ كليهما: ${tc.both} • 💰 جمعية: ${tc.assoc}</div>
        <div>⚰️ وفاة: ${tc.death} • ⚪ غير مشترك: ${tc.none}</div>
        <div style="color:#b91c1c">❓ لم يُعرَّف: ${tc.unknown}</div>
      </div>
    `;
    toast(`✅ أُضيف ${added} | حُدّث ${updated}`, 'success', 4000);
    CACHE.invalidateAll();
    await loadAll();
    go(S.page);
  } catch(e){
    console.error(e);
    log.innerHTML = `<div style="color:var(--danger)">❌ ${esc(e.message)}</div>`;
  }
  showLoad(false);
}

      if(m.code) memberMap.set(String(m.code), m);
      if(m.name) memberMap.set(normAr(m.name), m);
    });

    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const memberName = cleanText(gv(r, 'اسم المشترك','اسم العضو','العضو','المشترك','الاسم','كود العضو'));
      if(!memberName){ skip++; continue; }

      const amountStr = String(gv(r, 'المبلغ','القيمة','Amount') || '').replace(/[,،\s]/g,'');
      const amount = Number(amountStr);
      if(!amount){ skip++; continue; }

      let member = memberMap.get(memberName) || memberMap.get(normAr(memberName));
      if(!member){
        const s = normAr(memberName);
        member = S.members.find(m => {
          const n = normAr(m.name);
          return n === s || n.includes(s) || s.includes(n);
        });
      }
      if(!member){ notFound++; notFoundNames.push(memberName); skip++; continue; }

      const typeStr = normAr(gv(r, 'نوع القسط','النوع','نوع الدفعة','الصندوق') || '');

      const collectorName = cleanText(gv(r, 'اسم المعتمد','المعتمد','المحصل','الجباة')) || 'استيراد سابق';
      const notes = cleanText(gv(r, 'ملاحظات')) || '';

      // فحص التكرار
      const isDup = S.payments.some(p =>
        p.memberId === member.id &&
        Number(p.amount) === amount &&
        p.date === date &&
        Number(p.forYear || p.year) === forYear &&
        p.fund === fund
      );
      if(isDup){ dup++; skip++; continue; }

      try {
        const payment = {
          memberId: member.id,
          fund, amount, date,
          year: forYear, forYear,
          notes,
          collectorId: null,
          collectorName,
          imported: true,
          createdAt: new Date().toISOString()
        };
        const newId = await dbPut('payments', payment);
        payment.id = newId;
        S.payments.push(payment);
        added++;
      } catch(e){ skip++; }
    }

    const notFoundHTML = notFoundNames.length ? `
      <div style="margin-top:8px;padding:8px;background:#fef2f2;border-radius:8px;color:#991b1b;font-size:11px;max-height:120px;overflow:auto">

    await loadAll();
    go(S.page);
  } catch(e){
    console.error(e);
    log.innerHTML = `<div style="color:var(--danger)">❌ ${esc(e.message)}</div>`;

async function importFinanceNew(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';

  showLoad(true);
  const log = $('importFinLogNew');
  log.innerHTML = '<div style="color:var(--muted)">⏳</div>';

  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });

    let incAdded = 0, expAdded = 0, skip = 0, compUpdated = 0, compNF = 0, dup = 0;
    const notFoundComps = [];

    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const typeStr = normAr(gv(r, 'النوع','نوع الحركة','نوع') || '');
      const amountStr = String(gv(r, 'المبلغ','القيمة','Amount') || '').replace(/[,،\s]/g,'');
      const amount = Number(amountStr);
      if(!amount){ skip++; continue; }

      const fundStr = normAr(gv(r, 'نوع الصندوق','الصندوق','صندوق') || '');
      let fund = 'assoc';
      if(/وفا/.test(fundStr)) fund = 'death';
      else if(/تبرع/.test(fundStr)) fund = 'donation';

      const category = cleanText(gv(r, 'التصنيف','الفئة')) || (typeStr.includes('وارد') ? 'إيراد' : 'مصروف');
      const description = cleanText(gv(r, 'البيان','الوصف','التفاصيل','المصدر')) || category;
      const date = toDate(gv(r, 'التاريخ','تاريخ')) || today();
      const yearStr = String(gv(r, 'العام','السنة','سنة') || '').replace(/[^\d]/g,'');
      const year = Number(yearStr) || (date ? new Date(date).getFullYear() : S.currentYear);
      const notes = cleanText(gv(r, 'ملاحظات')) || '';

      // ⭐⭐ التعويضات → تحديث الوفاة
      if(/تعويض/.test(normAr(category))){
        const cleanName = description
          .replace(/^تعويض\s*(وفاة)?\s*/,'')
          .replace(/\(.*?\)/g,'').trim();

        let matched = S.deaths.find(d => normAr(d.deceasedName) === normAr(cleanName));
        if(!matched){
          matched = S.deaths.find(d => {
            const n1 = normAr(d.deceasedName);
            const n2 = normAr(cleanName);
            return n1.includes(n2) || n2.includes(n1);
          });
        }
        if(!matched){
          const words = normAr(cleanName).split(/\s+/).filter(w => w.length > 2);
          if(words.length){
            matched = S.deaths.find(d => {
              const n = normAr(d.deceasedName);
              return words.every(w => n.includes(w));
            });
          }
        }

        if(matched){
          matched.compensation = amount;
          matched.updatedFromFinance = true;
          await dbPut('deaths', matched);
          compUpdated++;
        } else {
          compNF++;
          notFoundComps.push(description);
        }
        continue;
      }

      const isIncome = /وارد|ايراد|إيراد|دخل/.test(typeStr);

      if(isIncome){
        const isDup = S.incomes.some(inc =>
          inc.fund === fund && Number(inc.amount) === amount && inc.date === date
        );
        if(isDup){ dup++; skip++; continue; }
      } else {
        const isDup = S.expenses.some(ex =>
          ex.fund === fund && Number(ex.amount) === amount && ex.date === date
        );
        if(isDup){ dup++; skip++; continue; }
      }

      try {
        if(isIncome){
          const obj = {
            fund, category, amount, date, year,
            notes: description + (notes ? ' | ' + notes : ''),
            recordedBy: S.currentUser.id,
            recordedByName: S.currentUser.name + ' (استيراد)',
            imported: true,
            createdAt: new Date().toISOString()
          };
          const newId = await dbPut('incomes', obj);
          obj.id = newId;
          S.incomes.push(obj);
          incAdded++;
        } else {
          const obj = {
            fund, category, description, amount, date, year, notes,
            createdBy: S.currentUser.id,
            recordedByName: S.currentUser.name + ' (استيراد)',
            imported: true,
            createdAt: new Date().toISOString()
          };
          const newId = await dbPut('expenses', obj);
          obj.id = newId;
          S.expenses.push(obj);
          expAdded++;
        }
      } catch(e){ skip++; }
    }

    const nf = notFoundComps.length ? `
      <div style="margin-top:8px;padding:8px;background:#fef2f2;border-radius:8px;color:#991b1b;font-size:11px;max-height:120px;overflow:auto">
        <b>تعويضات لم تُطابق (${compNF}):</b><br>
        ${notFoundComps.slice(0,10).map(n => '• ' + esc(n)).join('<br>')}
      </div>
    ` : '';

    log.innerHTML = `
      <div style="padding:12px;background:#f0fdf4;border-radius:12px;color:#166534">
        <div>📥 واردات: <b>${incAdded}</b> • 📤 مصاريف: <b>${expAdded}</b></div>
        <div style="color:var(--success);font-weight:800">⚰️ تعويضات محدَّثة: <b>${compUpdated}</b></div>
        ${compNF ? `<div style="color:#b91c1c">❌ لم تُطابق: <b>${compNF}</b></div>` : ''}
        <div style="color:#92400e">🔁 مكرر: <b>${dup}</b></div>
      </div>
      ${nf}
    `;
    toast(`✅ واردات ${incAdded} | مصاريف ${expAdded} | تعويضات ${compUpdated}`, 'success', 5000);
    CACHE.invalidateAll();
    await loadAll();
    go(S.page);
  } catch(e){
    console.error(e);
    log.innerHTML = `<div style="color:var(--danger)">❌ ${esc(e.message)}</div>`;
  }
  showLoad(false);
}

          createdAt: new Date().toISOString()
        };
        const newId = await dbPut('deliveries', delivery);
        delivery.id = newId;
        S.deliveries.push(delivery);
        added++;
      } catch(e){ skip++; }
    }

    log.innerHTML = `
      <div style="padding:12px;background:#f0fdf4;border-radius:12px;color:#166534">
        <div>➕ أُضيفت: <b>${added}</b></div>
        <div style="color:#92400e">🔁 مكرر: <b>${dup}</b></div>
        <div>⏭️ تُخطّي: <b>${skip}</b></div>
      </div>
    `;
    toast(`✅ أُضيفت ${added} تسليمة`, 'success', 4000);
    CACHE.invalidateAll();
    await loadAll();
    go(S.page);
  } catch(e){
    console.error(e);
    log.innerHTML = `<div style="color:var(--danger)">❌ ${esc(e.message)}</div>`;
  }
  showLoad(false);
}

/* دالة مساعدة للقراءة من Excel */
function gv(row, ...aliases){
  if(!row) return '';
  const normalized = {};
  for(const k of Object.keys(row)){
    normalized[normAr(k).replace(/[^\u0621-\u064Aa-z0-9]/g, '')] = row[k];
  }
  for(const a of aliases){
    const key = normAr(a).replace(/[^\u0621-\u064Aa-z0-9]/g, '');
    if(key in normalized){
      const v = normalized[key];
      if(v === null || v === undefined) continue;
      const s = String(v).trim();
      if(!s || s.startsWith('=') || s.includes('openpyxl')) continue;
      return s;
    }
  }
  return '';
}

/* ═══════════════════════════════════════════════════════════════
   📌 [قسم 21] — النسخ الاحتياطي (كامل)
   ═══════════════════════════════════════════════════════════════ */

function exportBackupNew(){
  try {
    const data = {
      version: '7.0',
      date: new Date().toISOString(),
      members: S.members,
      payments: S.payments,
      deaths: S.deaths,
      incomes: S.incomes,
      expenses: S.expenses,
      deliveries: S.deliveries,
      storeItems: S.storeItems,
      storeMovements: S.storeMovements,
      meetings: S.meetings,
      constants: S.constants,
      users: S.users,
      customFields: S.customFields
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `zaoura_backup_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    toast('💾 تم التنزيل');
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

async function importBackupNew(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';

  const text = await file.text();
  try {
    const data = JSON.parse(text);
    if(!data.members && !data.users) throw new Error('ملف غير صالح');
    if(!confirm('⚠️ سيتم استبدال كل البيانات. متابعة؟')) return;
    if(!confirm('تأكيد أخير!')) return;

    for(const s of STORE_NAMES){
      const store = tx(s, 'readwrite');
      await new Promise(res => {
        const q = store.clear();
        q.onsuccess = res;
        q.onerror = res;
      });
    }

    const toRestore = [
      'members','payments','deaths','incomes','expenses','deliveries',
      'storeItems','storeMovements','meetings','constants','users','customFields'
    ];
    for(const key of toRestore){
      if(Array.isArray(data[key])){
        for(const item of data[key]){
          delete item.id;
          await dbPut(key, item);
        }
      }
    }

    await loadAll();
    CACHE.invalidateAll();
    toast('✅ تمت الاستعادة', 'success', 3000);
    closeSheet();
    setTimeout(() => location.reload(), 500);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}
