  const list = [...S.meetings].sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const body = list.length ? `<div class="list">${list.map(m => `<div class="item" onclick="openMeetingDetail(${m.id})"><div class="av blue">📋</div><div class="body"><div class="ttl">${esc(m.title)}</div><div class="sub">${fmtDate(m.date)} • ${esc(m.type||'')}</div></div><span class="trail">›</span></div>`).join('')}</div>` : '<div style="text-align:center;padding:30px;color:var(--muted)">لا توجد اجتماعات</div>';
  const foot = hasPerm('meetings.manage') ? `<button class="btn primary" onclick="closeSheet();setTimeout(()=>openEditMeetingSheet(),150)">➕ اجتماع</button>` : '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>';
  openSheet('📋 الاجتماعات', body, foot, { wide:true });
}

function openEditMeetingSheet(id = null){
  if(!hasPerm('meetings.manage')){ toast('غير مصرح','error'); return; }
  const isNew = !id;
  const m = isNew ? {} : S.meetings.find(x => x.id === id);
  const body = `
    <div class="fld"><label>العنوان <span class="req">*</span></label><input id="mtTitle" value="${esc(m.title||'')}"></div>
    <div class="fld-row">
      <div class="fld"><label>النوع</label><select id="mtType">${['عمومية','لجنة إدارة','طارئة','أخرى'].map(t => `<option ${m.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="fld"><label>التاريخ</label><input id="mtDate" type="date" value="${esc(m.date||today())}"></div>
    </div>
    <div class="fld"><label>المكان</label><input id="mtLocation" value="${esc(m.location||'')}"></div>
    <div class="fld"><label>عدد الحاضرين</label><input id="mtAttendees" type="tel" inputmode="numeric" value="${m.attendeesCount||''}"></div>
    <div class="fld"><label>جدول الأعمال</label><textarea id="mtAgenda" rows="3">${esc(m.agenda||'')}</textarea></div>
    <div class="fld"><label>القرارات</label><textarea id="mtDecisions" rows="3">${esc(m.decisions||'')}</textarea></div>
  `;
  const foot = isNew
    ? `<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn primary" onclick="saveMeeting()">💾</button>`
    : `<button class="btn danger sm" onclick="deleteMeeting(${id})">🗑️</button><button class="btn primary" onclick="saveMeeting(${id})">💾</button>`;
  openSheet(isNew ? '➕ اجتماع' : '✏️ تعديل', body, foot, { focus:'mtTitle' });
}

async function saveMeeting(id = null){
  const title = cleanText($('mtTitle').value);
  if(!title){ toast('العنوان مطلوب','error'); return; }
  try{
    const meeting = {
      title,
      type: $('mtType').value,
      date: $('mtDate').value,
      location: cleanText($('mtLocation').value),
      attendeesCount: Number($('mtAttendees').value) || 0,
      agenda: cleanText($('mtAgenda').value),
      decisions: cleanText($('mtDecisions').value)
    };
    if(id){
      meeting.id = id;
      await dbPut('meetings', meeting);
      const i = S.meetings.findIndex(x => x.id === id);
      if(i > -1) S.meetings[i] = meeting;
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('meetings', meeting);
      meeting.id = newId;
      S.meetings.push(meeting);
      toast('✅ تمت الإضافة');
    }
    closeSheet();
    setTimeout(openMeetingsSheet, 250);
  } catch(e){ toast('خطأ','error'); }
}

async function deleteMeeting(id){
  if(!confirm('حذف؟')) return;
  try{
    await dbDel('meetings', id);
    S.meetings = S.meetings.filter(x => x.id !== id);
    toast('🗑️');
    closeSheet();
    setTimeout(openMeetingsSheet, 250);
  } catch(e){ toast('خطأ','error'); }
}

function openMeetingDetail(id){
  const m = S.meetings.find(x => x.id === id);
  if(!m) return;
  const body = `
    <div style="padding:14px;background:var(--primary-soft);border-radius:12px;margin-bottom:14px">
      <div style="font-weight:800;font-size:16px">${esc(m.title)}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">📅 ${fmtDate(m.date)} • ${esc(m.type||'')}${m.location ? ' • 📍 ' + esc(m.location) : ''}</div>
    </div>
    ${m.agenda ? `<div style="margin-bottom:14px"><div style="font-weight:800;font-size:13px;margin-bottom:6px">📋 جدول الأعمال</div><div style="padding:10px;background:var(--bg);border-radius:10px;font-size:13px;white-space:pre-wrap">${esc(m.agenda)}</div></div>` : ''}
    ${m.decisions ? `<div style="margin-bottom:14px"><div style="font-weight:800;font-size:13px;margin-bottom:6px">✅ القرارات</div><div style="padding:10px;background:#f0fdf4;border-radius:10px;font-size:13px;white-space:pre-wrap">${esc(m.decisions)}</div></div>` : ''}
  `;
  const foot = hasPerm('meetings.manage')
    ? `<button class="btn ghost sm" onclick="closeSheet();setTimeout(()=>openEditMeetingSheet(${id}),150)">✏️</button><button class="btn primary" onclick="shareMeetingWA(${id})">📱 واتساب</button>`
    : '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>';
  openSheet('📋 ' + m.title, body, foot, { wide:true });
}

function shareMeetingWA(id){
  const m = S.meetings.find(x => x.id === id);
  if(!m) return;
  let txt = `📋 *${m.title}*\n📅 ${fmtDate(m.date)}\n`;
  if(m.location) txt += `📍 ${m.location}\n`;
  if(m.decisions) txt += `\n*القرارات:*\n${m.decisions}\n`;
  txt += `\n_صندوق زعورة_`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

/* ═══════════════════════════════════════════════════════
   التسليمات
   ═══════════════════════════════════════════════════════ */
function openHandoversSheet(){
  const list = [...S.handovers].sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||'')).slice(0, 100);
  const body = list.length ? `<div class="list">${list.map(h => `<div class="item" style="cursor:default"><div class="av blue">📤</div><div class="body"><div class="ttl">${esc(h.fromUserName)} → ${esc(h.toUserName)}</div><div class="sub">${fmtDate(h.date)}${h.notes ? ' • ' + esc(h.notes) : ''}</div></div><div style="font-weight:800;color:var(--success)">${fmtNum(h.amount)}</div></div>`).join('')}</div>` : '<div style="text-align:center;padding:30px;color:var(--muted)">لا توجد تسليمات</div>';
  openSheet('📤 التسليمات', body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide:true });
}

function openHandoverSheet(){
  const myCollected = S.assocPayments.filter(p => p.collectorId === S.currentUser.id).reduce((s, p) => s + (Number(p.amount)||0), 0);
  const myDelivered = S.handovers.filter(h => h.fromUserId === S.currentUser.id).reduce((s, h) => s + (Number(h.amount)||0), 0);
  const myBalance = myCollected - myDelivered;

  const body = `
    <div style="padding:14px;background:var(--primary-soft);border-radius:12px;margin-bottom:14px">
      <div style="font-size:11px;color:var(--muted)">الرصيد في عهدتك</div>
      <div style="font-size:28px;font-weight:800;color:var(--primary);margin-top:4px">${fmtNum(myBalance)} ل.س</div>
    </div>
    <div class="fld"><label>أسلّم إلى <span class="req">*</span></label>
      <select id="hoToUser"><option value="">— اختر —</option>${S.admins.filter(a => a.role !== 'collector').map(a => `<option value="${a.id}">${ROLES[a.role].icon} ${esc(a.name)}</option>`).join('')}</select></div>
    <div class="fld"><label>المبلغ <span class="req">*</span></label><div class="amount-input"><input id="hoAmount" type="tel" inputmode="numeric" value="${myBalance > 0 ? myBalance : ''}"><span class="currency">ل.س</span></div></div>
    <div class="fld"><label>ملاحظات</label><input id="hoNotes"></div>
  `;
  const foot = `<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn success" onclick="saveHandover()">📤 تسجيل</button>`;
  openSheet('📤 تسليم الأموال', body, foot, { focus:'hoAmount' });
}

async function saveHandover(){
  const toUserId = Number($('hoToUser').value);
  const amount = Number($('hoAmount').value);
  if(!toUserId){ toast('اختر المستلم','error'); return; }
  if(!amount || amount <= 0){ toast('المبلغ مطلوب','error'); return; }
  const toUser = S.admins.find(a => a.id === toUserId);
  if(!toUser) return;

  try{
    const handover = {
      fromUserId: S.currentUser.id, fromUserName: S.currentUser.name,
      toUserId, toUserName: toUser.name,
      amount, notes: cleanText($('hoNotes').value),
      date: today(), createdAt: new Date().toISOString()
    };
    await dbPut('handovers', handover);
    S.handovers.push(handover);
    toast('📤 تم التسجيل');
    setTimeout(() => {
      const txt = `📤 *توثيق تسليم*\n\nمن: ${S.currentUser.name}\nإلى: ${toUser.name}\nالمبلغ: ${fmtNum(amount)} ل.س\nالتاريخ: ${today()}\n\n_صندوق زعورة_`;
      window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
    }, 400);
    closeSheet();
  } catch(e){ toast('خطأ','error'); }
}

/* ═══════════════════════════════════════════════════════
   سجل التدقيق
   ═══════════════════════════════════════════════════════ */
function openAuditSheet(){
  if(!hasPerm('audit.view')){ toast('غير مصرح','error'); return; }
  const list = [...S.auditLog].sort((a,b) => (b.timestamp||'').localeCompare(a.timestamp||'')).slice(0, 200);
  const icons = { add:'➕', update:'✏️', delete:'🗑️' };
  const body = list.length ? `<div class="list">${list.map(log => `<div class="item" style="cursor:default;padding:10px 14px"><div class="av" style="width:36px;height:36px;font-size:16px">${icons[log.action] || '📝'}</div><div class="body"><div class="ttl" style="font-size:12px">${esc(log.userName||'')} — ${log.action} ${esc(log.target||'')}</div><div class="sub" style="font-size:10px">${new Date(log.timestamp).toLocaleString('ar-EG')}</div></div></div>`).join('')}</div>` : '<div style="text-align:center;padding:30px;color:var(--muted)">لا يوجد سجل</div>';
  openSheet('📜 سجل التدقيق', body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide:true });
}

async function logAudit(action, target, targetId, details = {}){
  try{
    const entry = {
      timestamp: new Date().toISOString(),
      userId: S.currentUser ? S.currentUser.id : null,
      userName: S.currentUser ? S.currentUser.name : 'system',
      action, target, targetId, details
    };
    await dbPut('auditLog', entry);
    S.auditLog.push(entry);
  } catch(e){ console.warn(e); }
}

/* ═══════════════════════════════════════════════════════
   الإدارة
   ═══════════════════════════════════════════════════════ */
function renderAdminMenu(){
  const btns = [];
  if(hasPerm('constants.manage')) btns.push(`<button class="btn warning block" style="margin-bottom:8px" onclick="openConstantsSheet()">📅 الثوابت السنوية</button>`);
  if(hasPerm('admins.manage')) btns.push(`<button class="btn primary block" style="margin-bottom:8px" onclick="openAdminsSheet()">👥 الإداريون</button>`);
  if(hasPerm('person.manage')) btns.push(`<button class="btn success block" style="margin-bottom:8px" onclick="openImportPeopleSheet()">📥 استيراد الأفراد</button>`);
  btns.push(`<button class="btn info block" style="margin-bottom:8px" onclick="openStatsSheet()">📊 الإحصائيات</button>`);
  btns.push(`<button class="btn primary block" style="margin-bottom:8px" onclick="openStoreSheet()">📦 المستودع</button>`);
  btns.push(`<button class="btn primary block" style="margin-bottom:8px" onclick="openMeetingsSheet()">📋 الاجتماعات</button>`);
  btns.push(`<button class="btn primary block" style="margin-bottom:8px" onclick="openHandoversSheet()">📤 التسليمات</button>`);
  btns.push(`<button class="btn warning block" style="margin-bottom:8px" onclick="openExpensesListSheet()">💸 الصادرات</button>`);
  if(hasPerm('audit.view')) btns.push(`<button class="btn ghost block" style="margin-bottom:8px" onclick="openAuditSheet()">📜 سجل التدقيق</button>`);

  const counts = getSubscribersCount(S.currentYear);
  btns.push(`
    <div style="height:1px;background:var(--border);margin:16px 0"></div>
    <div style="font-size:12px;color:var(--muted);line-height:1.8;padding:8px">
      👥 الأفراد: <b>${S.people.length}</b><br>
      💰 في الجمعية: <b>${counts.assoc.total}</b><br>
      ⚰️ في الوفاة: <b>${counts.death.total}</b><br>
      📦 مواد المستودع: <b>${S.storeItems.length}</b><br>
      📋 الاجتماعات: <b>${S.meetings.length}</b>
    </div>
    <div style="height:1px;background:var(--border);margin:16px 0"></div>
    <button class="btn ghost block" style="margin-bottom:8px" onclick="toggleTheme()">🌓 تبديل الوضع</button>
  `);

  $('adminMenu').innerHTML = btns.join('');
}

function openSettingsSheet(){
  const btns = [];
  if(hasPerm('admins.manage')) btns.push(`<button class="btn primary block" style="margin-bottom:8px" onclick="closeSheet();setTimeout(openAdminsSheet,150)">👥 الإداريون</button>`);
  if(hasPerm('constants.manage')) btns.push(`<button class="btn warning block" style="margin-bottom:8px" onclick="closeSheet();setTimeout(openConstantsSheet,150)">📅 الثوابت</button>`);
  if(hasPerm('person.manage')) btns.push(`<button class="btn success block" style="margin-bottom:8px" onclick="closeSheet();setTimeout(openImportPeopleSheet,150)">📥 استيراد</button>`);

  const body = `
    ${btns.join('')}
    <button class="btn info block" style="margin-bottom:8px" onclick="closeSheet();setTimeout(openStatsSheet,150)">📊 الإحصائيات</button>
    <div style="height:1px;background:var(--border);margin:16px 0"></div>
    <button class="btn ghost block" style="margin-bottom:8px" onclick="toggleTheme()">🌓 تبديل الوضع</button>
    <button class="btn danger block" onclick="closeSheet();logout()">🚪 تسجيل الخروج</button>
  `;
  openSheet('⚙️ الإعدادات', body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>');
}

/* ═══════════════════════════════════════════════════════
   تحميل البيانات
   ═══════════════════════════════════════════════════════ */
async function loadAll(){
  const r = await Promise.all([
    dbAll('people'), dbAll('sectors'), dbAll('admins'), dbAll('constants'),
    dbAll('subscriptions'), dbAll('assocPayments'), dbAll('deathEvents'),
    dbAll('deathInstallments'), dbAll('donations'), dbAll('expenses'),
    dbAll('handovers'), dbAll('auditLog'),
    dbAll('storeItems'), dbAll('storeMovements'), dbAll('meetings')
  ]);
  S.people = r[0]; S.sectors = r[1]; S.admins = r[2]; S.constants = r[3];
  S.subscriptions = r[4]; S.assocPayments = r[5]; S.deathEvents = r[6];
  S.deathInstallments = r[7]; S.donations = r[8]; S.expenses = r[9];
  S.handovers = r[10]; S.auditLog = r[11];
  S.storeItems = r[12]; S.storeMovements = r[13]; S.meetings = r[14];
}

async function ensureDefaultConstants(){
  const years = [2025,2026,2027,2028];
  for(const year of years){
    if(!S.constants.find(c => c.year === year)){
      const c = {
        year,
        assocYearly: 24000, assocYearlyReduced: 15000,
        deathInstallment: 5000, deathCompensation: 25000,
        joinAssoc: 100000, joinAssocReduced: 50000,
        joinDeath: 50000, joinDeathReduced: 25000,
        createdAt: new Date().toISOString()
      };
      const id = await dbPut('constants', c);
      c.id = id;
      S.constants.push(c);
    }
  }
}

/* ═══════════════════════════════════════════════════════
   التشغيل
   ═══════════════════════════════════════════════════════ */
async function init(){
  const savedTheme = localStorage.getItem('zt_fund_theme');
  if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  const savedYear = localStorage.getItem('zt_current_year');
  if(savedYear) S.currentYear = Number(savedYear);

  try{
    await openDB();
    await loadAll();

    if(S.sectors.length === 0){
      for(const s of DEFAULT_SECTORS) await dbPut('sectors', s);
      S.sectors = [...DEFAULT_SECTORS];
    }

    await ensureDefaultConstants();

    const su = restoreCurrentUser();
    if(su){
      const full = S.admins.find(a => a.id === su.id);
      if(full){ S.currentUser = full; showMainApp(); return; }
      saveCurrentUser(null);
    }
    showLogin();
  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error', 5000);
  }
}

document.addEventListener('DOMContentLoaded', init);

</script>
</body>
