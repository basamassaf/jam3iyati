<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>صندوق زعورة</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════════
   🎨 Zaoura Fund v9.0 — نظام التصميم
   ═══════════════════════════════════════════════════════════════ */

:root {
  --primary: #6d28d9;
  --primary-2: #7c3aed;
  --primary-dark: #4c1d95;
  --primary-soft: #f5f3ff;
  --primary-light: #ede9fe;
  
  --assoc: #2563eb;
  --assoc-soft: #eff6ff;
  --assoc-light: #dbeafe;
  
  --death: #dc2626;
  --death-soft: #fef2f2;
  --death-light: #fee2e2;
  
  --donation: #16a34a;
  --donation-soft: #f0fdf4;
  --donation-light: #dcfce7;
  
  --success: #10b981;
  --success-soft: #d1fae5;
  --warning: #f59e0b;
  --warning-soft: #fef3c7;
  --info: #3b82f6;
  --info-soft: #dbeafe;
  
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --text-2: #475569;
  --muted: #64748b;
  --muted-2: #94a3b8;
  --border: #e2e8f0;
  --border-2: #f1f5f9;
  
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
  --shadow-md: 0 2px 8px rgba(15,23,42,.06);
  --shadow-lg: 0 8px 24px rgba(15,23,42,.12);
  --shadow-xl: 0 20px 50px rgba(15,23,42,.18);
  
  --safe-bottom: env(safe-area-inset-bottom, 0);
  --safe-top: env(safe-area-inset-top, 0);
  --hdr-h: 56px;
  --bnav-h: 62px;
}

[data-theme="dark"] {
  --bg: #0a0f1c;
  --card: #131c31;
  --text: #f1f5f9;
  --text-2: #cbd5e1;
  --muted: #94a3b8;
  --muted-2: #64748b;
  --border: #1e293b;
  --border-2: #0f172a;
  --primary-soft: #2e1065;
  --assoc-soft: #1e3a8a;
  --death-soft: #7f1d1d;
  --donation-soft: #14532d;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html { font-size: 15px; }

body {
  font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: calc(var(--bnav-h) + var(--safe-bottom));
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
input, select, textarea { outline: none; }
a { color: inherit; text-decoration: none; }

/* الهيدر */
.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  padding: 10px 14px;
  padding-top: calc(10px + var(--safe-top));
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 20px rgba(109, 40, 217, 0.25);
  min-height: 56px;
}

.app-header .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.app-header .logo {
  width: 38px; height: 38px; border-radius: 11px;
  background: rgba(255,255,255,.18);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; flex-shrink: 0;
}
.app-header .brand-text { flex: 1; min-width: 0; }
.app-header h1 { font-size: 15px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-header .sub {
  font-size: 11px; opacity: .9; font-weight: 700; cursor: pointer;
  display: inline-block; padding: 2px 8px;
  background: rgba(255,255,255,.15); border-radius: 7px; margin-top: 3px;
}
.app-header .icon-btn {
  width: 38px; height: 38px; border-radius: 11px;
  background: rgba(255,255,255,.14); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0; transition: transform .15s;
  position: relative;
}
.app-header .icon-btn:active { transform: scale(.92); }
.app-header .badge-num {
  position: absolute; top: 4px; left: 4px;
  background: #dc2626; color: #fff;
  font-size: 9px; font-weight: 800;
  min-width: 16px; height: 16px;
  border-radius: 8px; padding: 0 4px;
  display: none; align-items: center; justify-content: center;
}
.app-header .badge-num.on { display: flex; }

/* شريط المستخدم */
.user-banner {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  position: sticky;
  top: 56px;
  z-index: 29;
}
.user-banner .who { display: flex; align-items: center; gap: 8px; color: var(--muted); flex-wrap: wrap; min-width: 0; }
.user-banner .who b { color: var(--text); font-weight: 800; }
.role-badge {
  padding: 3px 10px; border-radius: 20px;
  font-size: 10px; font-weight: 800;
  background: var(--primary-soft); color: var(--primary);
  white-space: nowrap;
}

/* المحتوى */
main { max-width: 900px; margin: 0 auto; padding: 12px; }
.page { display: none; }
.page.active { display: block; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* البطاقات */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
}
.card-head h2 { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; }

/* الإحصائيات */
.stats-scroll {
  display: flex; gap: 8px; overflow-x: auto;
  margin: 0 -12px 12px; padding: 0 12px 4px;
  scrollbar-width: none;
}
.stats-scroll::-webkit-scrollbar { display: none; }

.stat {
  flex: 0 0 auto; min-width: 130px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px;
  box-shadow: var(--shadow-sm);
  position: relative; overflow: hidden;
}
.stat::before {
  content: ''; position: absolute; top: 0; right: 0;
  width: 4px; height: 100%; background: var(--primary);
}
.stat.assoc::before { background: var(--assoc); }
.stat.death::before { background: var(--death); }
.stat.donation::before { background: var(--donation); }
.stat.green::before { background: var(--success); }
.stat.red::before { background: var(--death); }
.stat.orange::before { background: var(--warning); }
.stat.blue::before { background: var(--assoc); }
.stat.purple::before { background: var(--primary); }

.stat .val {
  font-size: 19px; font-weight: 800;
  line-height: 1.1; color: var(--primary);
  word-break: break-all; letter-spacing: -.5px;
  font-family: 'SF Mono', 'Courier New', monospace;
}
.stat.assoc .val { color: var(--assoc); }
.stat.death .val { color: var(--death); }
.stat.donation .val { color: var(--donation); }
.stat.green .val { color: var(--success); }
.stat.red .val { color: var(--death); }
.stat.orange .val { color: var(--warning); }
.stat.blue .val { color: var(--assoc); }
.stat .lbl { font-size: 10px; color: var(--muted); margin-top: 6px; font-weight: 700; }

/* القوائم */
.list {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border-2);
  cursor: pointer;
  min-height: 58px;
  transition: background .1s;
}
.item:last-child { border-bottom: 0; }
.item:active { background: var(--bg); }
.item .av {
  width: 42px; height: 42px; border-radius: 12px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  background: var(--primary-soft); color: var(--primary);
  font-weight: 800; overflow: hidden;
}
.item .av.blue { background: var(--assoc-soft); color: var(--assoc); }
.item .av.red { background: var(--death-soft); color: var(--death); }
.item .av.green { background: var(--donation-soft); color: var(--donation); }
.item .av.orange { background: var(--warning-soft); color: #92400e; }
.item .av.gray { background: var(--border-2); color: var(--muted); }
.item .body { flex: 1; min-width: 0; }
.item .ttl {
  font-weight: 700; font-size: 14px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.item .sub {
  font-size: 11.5px; color: var(--muted); margin-top: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.item .trail { color: var(--muted-2); font-size: 20px; flex-shrink: 0; }

/* الشارات */
.badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 6px;
  font-size: 10px; font-weight: 800; white-space: nowrap;
}
.badge.success { background: var(--success-soft); color: #065f46; }
.badge.danger { background: var(--death-light); color: #991b1b; }
.badge.warning { background: var(--warning-soft); color: #92400e; }
.badge.info { background: var(--info-soft); color: #1e40af; }
.badge.muted { background: var(--border-2); color: var(--muted); }
.badge.primary { background: var(--primary-soft); color: var(--primary); }

/* الشرائح */
.chips {
  display: flex; gap: 6px; overflow-x: auto;
  padding-bottom: 6px; margin-bottom: 6px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 7px 14px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  font-size: 12px; font-weight: 700;
  color: var(--muted);
  transition: all .15s;
  font-family: inherit;
}
.chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }

/* الأزرار */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 18px;
  border-radius: var(--r-md);
  font-size: 14px; font-weight: 700;
  min-height: 42px; white-space: nowrap;
  transition: transform .1s;
  font-family: inherit;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--primary); color: #fff; }
.btn.assoc { background: var(--assoc); color: #fff; }
.btn.death { background: var(--death); color: #fff; }
.btn.donation { background: var(--donation); color: #fff; }
.btn.success { background: var(--success); color: #fff; }
.btn.danger { background: var(--death); color: #fff; }
.btn.warning { background: var(--warning); color: #fff; }
.btn.info { background: var(--info); color: #fff; }
.btn.ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn.sm { padding: 6px 11px; min-height: 34px; font-size: 12px; border-radius: 9px; }
.btn.lg { padding: 14px 22px; min-height: 52px; font-size: 15px; border-radius: var(--r-lg); }
.btn.block { display: flex; width: 100%; }

/* الأزرار السريعة */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.quick-actions.two { grid-template-columns: repeat(2, 1fr); }
.quick-btn {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 14px 8px;
  border-radius: var(--r-md);
  background: var(--card);
  border: 1.5px solid var(--border);
  cursor: pointer; text-align: center;
  transition: all .15s;
  font-family: inherit;
}
.quick-btn:active { transform: scale(.97); border-color: var(--primary); }
.quick-btn .ico { font-size: 26px; line-height: 1; }
.quick-btn .lbl { font-size: 11px; font-weight: 800; }
.quick-btn.assoc { border-color: var(--assoc); }
.quick-btn.assoc .lbl { color: var(--assoc); }
.quick-btn.death { border-color: var(--death); }
.quick-btn.death .lbl { color: var(--death); }
.quick-btn.donation { border-color: var(--donation); }
.quick-btn.donation .lbl { color: var(--donation); }

/* الزر العائم */
.fab {
  position: fixed;
  bottom: calc(var(--bnav-h) + 20px + var(--safe-bottom));
  left: 16px;
  width: 56px; height: 56px;
  border-radius: 18px;
  background: var(--primary);
  color: #fff; font-size: 26px; font-weight: 300;
  box-shadow: 0 8px 24px rgba(109, 40, 217, 0.4);
  z-index: 25;
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s;
}
.fab:active { transform: scale(.9); }

/* القائمة السفلية */
.bnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 30;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  padding: 6px 4px calc(6px + var(--safe-bottom));
  box-shadow: 0 -4px 12px rgba(15, 23, 42, 0.04);
}
.bnav button {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 2px;
  border-radius: 10px;
  color: var(--muted);
  font-size: 10px; font-weight: 700;
  min-width: 0;
  font-family: inherit;
  transition: color .15s;
}
.bnav button .i { font-size: 21px; line-height: 1; transition: transform .15s; }
.bnav button.on { color: var(--primary); }
.bnav button.on .i { transform: translateY(-1px) scale(1.08); }

/* الأوراق (Sheets) */
.sheet-back {
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.5);
  z-index: 10100;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
  backdrop-filter: blur(3px);
}
.sheet-back.on { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 10101;
  background: var(--card);
  border-radius: 22px 22px 0 0;
  max-height: 94vh; overflow-y: auto;
  transform: translateY(100%);
  transition: transform .28s cubic-bezier(.2,.9,.3,1);
  padding-bottom: calc(16px + var(--safe-bottom));
}
.sheet.on { transform: translateY(0); }
.sheet.wide { max-height: 98vh; }
.sheet-grip {
  width: 42px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 10px auto 0;
}
.sheet-hd {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  background: var(--card);
  z-index: 2;
}
.sheet-hd h2 {
  font-size: 15px; font-weight: 800;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1;
}
.sheet-hd .close-btn {
  width: 34px; height: 34px;
  background: var(--bg); color: var(--text);
  border-radius: 10px; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sheet-hd .back-btn {
  width: 34px; height: 34px;
  background: var(--primary-soft); color: var(--primary);
  border-radius: 10px; font-size: 16px;
  display: none; align-items: center; justify-content: center;
  flex-shrink: 0; margin-inline-end: 6px;
}
.sheet-hd .back-btn.on { display: flex; }
.sheet-bd { padding: 16px; }
.sheet-ft {
  display: flex; gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  position: sticky; bottom: 0;
  background: var(--card);
  flex-wrap: wrap;
}
.sheet-ft .btn { flex: 1; min-width: 90px; }

/* النماذج */
.fld { margin-bottom: 14px; position: relative; }
.fld label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.fld label .req { color: var(--death); }
.fld input, .fld select, .fld textarea {
  width: 100%;
  padding: 11px 14px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  font-size: 14px;
  transition: border-color .15s;
}
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--primary); background: var(--card); }
.fld input:disabled, .fld select:disabled { opacity: .6; cursor: not-allowed; }
.fld textarea { resize: vertical; min-height: 70px; }
.fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fld-hint { font-size: 11px; color: var(--muted-2); margin-top: 4px; }

/* القائمة المنسدلة */
.options-list {
  position: absolute; top: 100%; left: 0; right: 0;
  background: var(--card);
  border: 1.5px solid var(--primary);
  border-radius: var(--r-md);
  max-height: 250px; overflow-y: auto;
  z-index: 100; margin-top: 4px;
  display: none;
  box-shadow: var(--shadow-lg);
}
.options-list.on { display: block; }
.option-item {
  padding: 11px 14px;
  cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border-2);
  font-size: 14px;
  transition: background .1s;
}
.option-item:active { background: var(--primary-soft); }
.option-item:last-child { border-bottom: 0; }
.option-item small { color: var(--muted); font-size: 11px; }

/* حقل المبلغ */
.amount-input {
  display: flex; align-items: center; gap: 10px;
  background: var(--card);
  border: 2px solid var(--primary);
  border-radius: var(--r-lg);
  padding: 6px 14px;
}
.amount-input input {
  flex: 1;
  border: 0; background: none;
  font-size: 24px; font-weight: 800;
  color: var(--primary);
  text-align: center;
  padding: 8px 0;
  font-family: 'SF Mono', 'Courier New', monospace;
  letter-spacing: -1px;
}
.amount-input .currency { font-size: 13px; font-weight: 800; color: var(--muted); }
.amount-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.amount-quick button {
  padding: 6px 12px; border-radius: 9px;
  background: var(--primary-soft); color: var(--primary);
  font-size: 12px; font-weight: 800;
  font-family: inherit;
}

/* بلوكات الرصيد */
.balance-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px;
  margin-bottom: 10px;
}
.balance-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--border-2);
}
.balance-row:last-child { border-bottom: 0; }
.balance-row .lbl { color: var(--muted); }
.balance-row .val { font-weight: 800; font-family: 'SF Mono', 'Courier New', monospace; }
.balance-row .val.green { color: var(--success); }
.balance-row .val.red { color: var(--death); }
.balance-row .val.orange { color: var(--warning); }

/* شريط التقدم */
.progress {
  height: 8px; background: var(--border-2);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 8px;
}
.progress > div {
  height: 100%; border-radius: 4px;
  transition: width .3s;
}
.progress.assoc > div { background: var(--assoc); }
.progress.death > div { background: var(--death); }
.progress.donation > div { background: var(--donation); }

/* الحالة الفارغة */
.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
}
.empty .ico { font-size: 52px; opacity: .35; display: block; margin-bottom: 10px; }
.empty h3 { font-size: 15px; font-weight: 800; margin-bottom: 4px; color: var(--text); }
.empty p { font-size: 12px; }

/* التنبيهات */
.toasts {
  position: fixed; top: 14px; left: 50%;
  transform: translateX(-50%);
  z-index: 10200;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
  width: calc(100% - 28px);
  max-width: 400px;
}
.toast {
  background: var(--text); color: var(--card);
  padding: 12px 18px;
  border-radius: var(--r-md);
  font-size: 13px; font-weight: 700;
  box-shadow: var(--shadow-xl);
  pointer-events: auto;
  animation: toastIn .25s ease;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.toast.success { background: var(--success); color: #fff; }
.toast.error { background: var(--death); color: #fff; }
.toast.warning { background: var(--warning); color: #fff; }
.toast.info { background: var(--info); color: #fff; }

/* التحميل */
.loader {
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(3px);
  z-index: 10300;
  display: none;
  align-items: center; justify-content: center;
}
.loader.on { display: flex; }
.spin {
  width: 42px; height: 42px;
  border: 3px solid rgba(255,255,255,.25);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* شاشة الدخول */
.login-screen {
  position: fixed; inset: 0;
  z-index: 10000;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  display: none;
  align-items: center; justify-content: center;
  padding: 20px; overflow-y: auto;
}
.login-screen.on { display: flex; }
.login-card {
  background: var(--card); color: var(--text);
  border-radius: 24px;
  padding: 26px 22px;
  max-width: 400px; width: 100%;
  margin: auto;
  box-shadow: var(--shadow-xl);
}
.login-card .logo-lg {
  width: 64px; height: 64px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 32px;
  margin: 0 auto 16px;
  box-shadow: 0 8px 24px rgba(109, 40, 217, 0.35);
}
.login-card h1 { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 4px; }
.login-card .sub { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 22px; }
.users-list { display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto; }
.login-user {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  background: var(--bg);
  border: 2px solid transparent;
  cursor: pointer;
  transition: all .15s;
}
.login-user:active { border-color: var(--primary); background: var(--primary-soft); }
.login-user .av {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800;
  flex-shrink: 0;
}
.login-user .info { flex: 1; min-width: 0; }
.login-user .nm { font-weight: 700; font-size: 14px; }
.login-user .role { font-size: 11px; color: var(--muted); margin-top: 2px; }

.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
.pin-btn {
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--bg);
  font-size: 20px; font-weight: 800;
  font-family: inherit;
  transition: all .1s;
}
.pin-btn:active { transform: scale(.95); background: var(--primary-soft); }
.pin-display { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
.pin-dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--border);
  transition: background .15s;
}
.pin-dot.on { background: var(--primary); }

/* الطباعة */
@media print {
  .app-header, .bnav, .fab, .user-banner, .stats-scroll { display: none !important; }
  main { padding: 0; max-width: 100%; }
  body { background: #fff; padding-bottom: 0; }
}

/* الجوال الصغير */
@media (max-width: 360px) {
  html { font-size: 14px; }
  .stat .val { font-size: 17px; }
  .item { padding: 10px 12px; min-height: 54px; }
  .item .av { width: 38px; height: 38px; font-size: 16px; }
  .quick-actions { gap: 6px; }
  .quick-btn { padding: 12px 6px; }
  .quick-btn .ico { font-size: 22px; }
}

/* الفلتر الكبير (Bottom Filter) */
.filter-bar {
  background: var(--card);
  border-radius: var(--r-md);
  padding: 10px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.filter-btn {
  padding: 9px 10px;
  border-radius: 10px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  overflow: hidden;
}
.filter-btn.active {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary);
}
.filter-btn .lbl {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* الشريط الأفقي (Segment) */
.segment {
  display: flex;
  gap: 4px;
  background: var(--card);
  padding: 5px;
  border-radius: var(--r-md);
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  overflow-x: auto;
  scrollbar-width: none;
}
.segment::-webkit-scrollbar { display: none; }
.segment button {
  flex: 1;
  padding: 8px 10px;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.segment button.on {
  background: var(--primary);
  color: #fff;
}

/* ═══ Cache ═══ */
const CACHE = {
  memberFull: new Map(),
  stats: null, statsYear: null,
  fundBalances: null, fundBalancesYear: null,
  
  invalidateMember(memberId){
    this.memberFull.delete(memberId);

/* ═══════════════════════════════════════════════════════════════
   📌 القسم 2 — IndexedDB
   ═══════════════════════════════════════════════════════════════ */

let db = null;

function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORE_NAMES.forEach(n => {
        if(!d.objectStoreNames.contains(n)){
          d.createObjectStore(n, { keyPath:'id', autoIncrement:true });
        }
      });
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}

const tx = (s, m) => db.transaction(s, m || 'readonly').objectStore(s);

const dbAll = s => new Promise((res, rej) => {
  const q = tx(s).getAll();
  q.onsuccess = () => res(q.result || []);
  q.onerror = () => rej(q.error);
});

const dbGet = (s, id) => new Promise((res, rej) => {
  const q = tx(s).get(id);
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
});

const dbPut = (s, o) => new Promise((res, rej) => {
  const q = tx(s, 'readwrite').put(o);
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
});

const dbDel = (s, id) => new Promise((res, rej) => {
  const q = tx(s, 'readwrite').delete(id);
  q.onsuccess = () => res();
  q.onerror = () => rej(q.error);
});

/* ═══════════════════════════════════════════════════════════════
   📌 القسم 3 — الأدوات المساعدة
   ═══════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);

const esc = v => String(v == null ? '' : v)
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#39;');

const cleanText = v => String(v == null ? '' : v).trim().replace(/\s+/g, ' ');

const normAr = v => String(v == null ? '' : v)
  .toLowerCase().trim()
  .replace(/[أإآ]/g, 'ا')
  .replace(/ة/g, 'ه')
  .replace(/[ىي]/g, 'ي')
  .replace(/[ًٌٍَُِّْـ]/g, '');

const cleanPhone = v => {
  if(!v) return '';
  let s = String(v).trim()
    .replace(/\.0+$/, '')
    .replace(/[\s\-\(\)\u200f\u200e]/g, '');
  if(s.indexOf('+963') === 0) s = '0' + s.slice(4);
  return s;
};

const today = () => new Date().toISOString().slice(0, 10);

const debounce = (fn, d) => {
  d = d || 250;
  let t;
  return function(){
    const args = arguments;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(null, args); }, d);
  };
};

function fmtDate(d){
  if(!d) return '—';
  try {
    return new Date(d).toLocaleDateString('ar-EG', {
      year:'numeric', month:'short', day:'numeric'
    });
  } catch(e){ return d; }
}

function fmtDateTime(d){
  if(!d) return '—';
  try {
    return new Date(d).toLocaleString('ar-EG');
  } catch(e){ return d; }
}

function toDate(v){
  if(!v) return '';
  if(typeof v === 'string' && v.trim().indexOf('=') === 0) return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if(typeof v === 'number'){
    const d = new Date((v - 25569) * 86400000);
    return isNaN(d) ? '' : d.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  const m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]|$)/);
  if(m1) return m1[1] + '-' + m1[2].padStart(2, '0') + '-' + m1[3].padStart(2, '0');
  const m2 = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m2) return m2[3] + '-' + m2[2].padStart(2, '0') + '-' + m2[1].padStart(2, '0');
  const d = new Date(s);
  if(!isNaN(d) && d.getFullYear() > 1900 && d.getFullYear() < 2100){
    return d.toISOString().slice(0, 10);
  }
  return '';
}

function fmtNum(n){
  if(n === null || n === undefined || n === '') return '0';
  const num = Number(n);
  if(isNaN(num)) return '0';
  return num.toLocaleString('en-US');
}

function fmtShort(n){
  if(!n && n !== 0) return '0';
  const num = Number(n);
  if(isNaN(num)) return '0';
  if(num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
  if(num >= 1000) return (num / 1000).toFixed(1) + 'K';
  return String(num);
}

   📌 القسم 4 — نظام Sheets (مع Stack للرجوع المتسلسل)
   ═══════════════════════════════════════════════════════════════ */

let _sheetStack = [];
let _scrollBeforeSheet = 0;

function openSheet(title, bodyHTML, footHTML, opts){
  opts = opts || {};
  
  const sheet = $('sheet');
  const isOpen = sheet.classList.contains('on');
  
  // احفظ الحالة الحالية إذا كانت الورقة مفتوحة
  if(isOpen && !opts.noStack){
    _sheetStack.push({
      title: $('sheetTitle').textContent,
      body: $('sheetBody').innerHTML,
      foot: $('sheetFoot').innerHTML,
      footVisible: $('sheetFoot').style.display !== 'none',
      wide: sheet.classList.contains('wide')
    });
  } else if(!isOpen){
    _sheetStack = [];
    _scrollBeforeSheet = window.scrollY || window.pageYOffset || 0;
  }
  
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = bodyHTML;
  $('sheetFoot').innerHTML = footHTML || '';
  $('sheetFoot').style.display = footHTML ? 'flex' : 'none';
  $('sheetBack').classList.add('on');
  sheet.classList.add('on');
  
  if(opts.wide) sheet.classList.add('wide');
  else sheet.classList.remove('wide');
  
  $('sheetBody').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  
  updateBackBtn();
  
  if(opts.focus){
    setTimeout(function(){
      const el = $(opts.focus);
      if(el) el.focus();
    }, 280);
  }
}

function closeSheet(){
  // إذا كان هناك تاريخ → رجوع
  if(_sheetStack.length > 0){
    const prev = _sheetStack.pop();
    $('sheetTitle').textContent = prev.title;
    $('sheetBody').innerHTML = prev.body;
    $('sheetFoot').innerHTML = prev.foot;
    $('sheetFoot').style.display = prev.footVisible ? 'flex' : 'none';
    
    const sheet = $('sheet');
    if(prev.wide) sheet.classList.add('wide');
    else sheet.classList.remove('wide');
    
    $('sheetBody').scrollTop = 0;
    updateBackBtn();
    return;
  }
  
  // إغلاق كامل
  closeSheetAll();
}

function closeSheetAll(){
  _sheetStack = [];
  $('sheetBack').classList.remove('on');
  $('sheet').classList.remove('on');
  document.body.style.overflow = '';
  updateBackBtn();
  
  setTimeout(function(){
    if(_scrollBeforeSheet > 0){
      window.scrollTo({ top: _scrollBeforeSheet, behavior: 'instant' });
    }
  }, 50);
}

function updateBackBtn(){
  const btn = $('sheetBackBtn');
  if(!btn) return;
  if(_sheetStack.length > 0) btn.classList.add('on');
  else btn.classList.remove('on');
}

  if(!S.currentUser) return false;

  if(r === 'manager' || r === 'president' || r === 'auditor') return true;
  if(r === 'assocTreasurer') return fund === 'assoc';

function go(page){
  const prevPage = S.page;
  S.page = page;
  
  // احفظ موضع التمرير للصفحة السابقة
  if(prevPage && prevPage !== page){
    const pos = window.scrollY || window.pageYOffset || 0;
    if(pos > 10){
      localStorage.setItem('zt_scroll_' + prevPage, pos);
    }
  }
  
  // إخفاء كل الصفحات
  $$('.page').forEach(function(p){ p.classList.remove('active'); });
  
  // إظهار الصفحة المطلوبة
  const target = $(page);
  if(!target){
    console.warn('⚠️ صفحة غير موجودة:', page);
    return;
  }
  target.classList.add('active');
  
  // تحديث القائمة السفلية
  $$('.bnav button').forEach(function(b){
    b.classList.toggle('on', b.dataset.pg === page);
  });
  
  window.scrollTo(0, 0);
  
  // الزر العائم
  const fabPages = ['pg-collect', 'pg-inout'];
  $('fab').style.display = fabPages.indexOf(page) > -1 ? 'flex' : 'none';
  
  // العرض
  const renderers = {
    'pg-home':           renderHome,
    'pg-payments':       renderPayments,
    'pg-members':        renderMembers,
    'pg-collectors':     renderCollectors,
    'pg-funds':          renderFunds,
    'pg-collect':        renderCollect,
    'pg-late':           renderLate,
    'pg-my-deliveries':  renderMyDeliveries,
    'pg-inbox':          renderInbox,
    'pg-inout':          renderInOut,
    'pg-deaths':         renderDeaths,
    'pg-store':          renderStore,
    'pg-meetings':       renderMeetings,
    'pg-reports':        renderReports,
    'pg-logs':           renderLogs,
    'pg-archive':        renderArchive,
    'pg-notifications':  renderNotifications,
    'pg-admin':          renderAdmin,
    'pg-my-account':     renderMyAccount
  };
  
  if(renderers[page]){
    try {
      renderers[page]();
    } catch(e){
      console.error('❌ خطأ في العرض:', page, e);
      target.innerHTML = '<div class="empty"><span class="ico">⚠️</span>' +
                         '<h3>خطأ في العرض</h3><p>' + esc(e.message) + '</p></div>';
    }
  }
  
  // استعادة موضع التمرير
  if(prevPage !== page){
    const saved = localStorage.getItem('zt_scroll_' + page);
    if(saved && Number(saved) > 10){
      setTimeout(function(){
        window.scrollTo({ top: Number(saved), behavior: 'instant' });
      }, 100);
    }
  }
}

function getSmartNotifications(){
  const notifs = [];
  const y = S.currentYear;
  
  // 1. متأخرون
  const stats = getMembersStats(y);
  if(stats.late > 0){
    notifs.push({
      icon: '⚠️', color: 'danger',
      title: stats.late + ' عضو متأخر',
      desc: 'إجمالي: ' + fmtNum(stats.lateTotal) + ' ل.س',
      action: function(){ go('pg-members'); }
    });
  }
  
  // 2. تسليمات معلقة
  const pending = S.deliveries.filter(function(d){ return !d.receivedAt && !d.rejectedAt; });
  if(pending.length > 0){
    const total = pending.reduce(function(s, d){ return s + (Number(d.amount) || 0); }, 0);
    notifs.push({
      icon: '⏳', color: 'warning',
      title: pending.length + ' تسليم معلّق',
      desc: 'إجمالي: ' + fmtNum(total) + ' ل.س',
      action: function(){ go('pg-inbox'); }
    });
  }
  
  // 3. مواد تحتاج صيانة
  const maintenance = S.storeItems.filter(function(i){ return i.condition === 'يحتاج صيانة'; });
  if(maintenance.length > 0){
    notifs.push({
      icon: '🔧', color: 'warning',
      title: maintenance.length + ' مادة تحتاج صيانة',
      desc: maintenance.slice(0, 2).map(function(i){ return i.name; }).join('، '),
      action: function(){ go('pg-store'); }
    });
  }
  
  // 4. مواد كميتها منخفضة
  const lowStock = S.storeItems.filter(function(i){
    return Number(i.quantity) < Number(i.minQty || 5);
  });
  if(lowStock.length > 0){
    notifs.push({
      icon: '📦', color: 'danger',
      title: lowStock.length + ' مادة كميتها منخفضة',
      desc: lowStock.slice(0, 2).map(function(i){ return i.name; }).join('، '),
      action: function(){ go('pg-store'); }
    });
  }
  
  // 5. وفيات هذا الشهر
  const now = new Date();
  const monthDeaths = S.deaths.filter(function(d){
    if(!d.deathDate) return false;
    const dd = new Date(d.deathDate);
    return dd.getMonth() === now.getMonth() && dd.getFullYear() === now.getFullYear();
  });
  if(monthDeaths.length > 0){
    notifs.push({
      icon: '⚰️', color: 'info',
      title: monthDeaths.length + ' وفاة هذا الشهر',
      desc: monthDeaths.slice(0, 2).map(function(d){ return d.deceasedName; }).join('، '),
      action: function(){ go('pg-deaths'); }
    });
  }
  
  // 6. قرارات معلقة
  const pendingDecisions = S.meetings.filter(function(m){
    return m.decisionsList && m.decisionsList.some(function(d){ return d.status === 'قيد التنفيذ'; });
  });
  if(pendingDecisions.length > 0){
    let totalPending = 0;
    pendingDecisions.forEach(function(m){
      totalPending += m.decisionsList.filter(function(d){ return d.status === 'قيد التنفيذ'; }).length;
    });
    notifs.push({
      icon: '📋', color: 'warning',
      title: totalPending + ' قرار قيد التنفيذ',
      desc: 'من ' + pendingDecisions.length + ' اجتماع',
      action: function(){ go('pg-meetings'); }
    });
  }
  
  // 7. رصيد منخفض
  const assocBal = getFundActual('assoc').balance;
  if(assocBal >= 0 && assocBal < 100000){
    notifs.push({
      icon: '💰', color: 'warning',
      title: 'رصيد الجمعية منخفض',
      desc: fmtNum(assocBal) + ' ل.س',
      action: function(){ go('pg-funds'); }
    });
  }
  
  // 8. سجلات مستوردة (قابلة للتنظيف)
  const importedInc = S.incomes.filter(function(i){ return i.imported; }).length;
  const importedExp = S.expenses.filter(function(e){ return e.imported; }).length;
  if(importedInc + importedExp > 500){
    notifs.push({
      icon: '📥', color: 'info',
      title: 'سجلات مستوردة كثيرة',
      desc: importedInc + ' إيراد • ' + importedExp + ' مصروف',
      action: function(){ go('pg-logs'); }
    });
  }
  
  return notifs;
}

function updateNotificationBadge(){
  const notifs = getSmartNotifications();

   📌 القسم 13 — الحسابات (استبدال placeholders)

function getConstants(year){
  const c = S.constants.find(function(x){ return x.year === year; });
  if(c) return c;
  const sorted = S.constants.slice().sort(function(a, b){ return b.year - a.year; });
  return sorted[0] || null;
}

function getOpeningBalance(){
  const c = S.constants.find(function(x){ return x.year === 0; });
  return c || { year: 0, assoc: 0, death: 0, donation: 0 };
}

/* حساب مستحقات عضو لسنة */
function computeMemberYear(member, year){
  const c = getConstants(year);
  const empty = {
    year: year,
    assoc: { yearlyReq:0, joinReq:0, req:0, paid:0, rem:0 },
    death: { installReq:0, joinReq:0, req:0, paid:0, rem:0 }
  };
  if(!c) return empty;
  
  const status = member.memberStatus || 'نشط';
  
  // متوفى: توقف من سنة الوفاة
  if(status === 'متوفى'){
    const deathYear = member.deathDate
      ? new Date(member.deathDate).getFullYear()
      : (member.stopYear || null);
    if(deathYear && year > deathYear){
      return Object.assign({}, empty, { skipped: true, reason: 'متوفى' });
    }
  }
  
  // منسحب/متوقف
  const stopYear = member.stopYear;
  if((status === 'منسحب' || status === 'متوقف') && stopYear && year >= stopYear){
    return Object.assign({}, empty, { skipped: true, reason: status });
  }
  
  const isReduced = member.memberType === 'مخفض';
  const assocYearlyFee = (isReduced && c.assocYearlyReduced) ? c.assocYearlyReduced : c.assocYearly;
  const joinAssocFee = (isReduced && c.joinAssocFeeReduced) ? c.joinAssocFeeReduced : c.joinAssocFee;
  const joinDeathFee = (isReduced && c.joinDeathFeeReduced) ? c.joinDeathFeeReduced : c.joinDeathFee;
  
  const result = {
    year: year,
    assoc: { yearlyReq:0, joinReq:0, req:0, paid:0, rem:0 },
    death: { installReq:0, joinReq:0, req:0, paid:0, rem:0 }
  };
  
  // الجمعية
  if(member.assocStartYear && year >= member.assocStartYear && year >= BASE_YEAR && !member.assocExempt){
    result.assoc.yearlyReq += assocYearlyFee;
    if(year === member.assocStartYear && member.assocStartYear >= BASE_YEAR){
      result.assoc.joinReq += joinAssocFee;
    }
  }
  
  // الوفاة
  if(member.deathStartYear && year >= member.deathStartYear && year >= BASE_YEAR && !member.deathExempt){
    const isDeathYear = member.memberStatus === 'متوفى' &&
      member.deathDate &&
      new Date(member.deathDate).getFullYear() === year;
    
    if(!isDeathYear && year === member.deathStartYear && member.deathStartYear >= BASE_YEAR){
      result.death.joinReq += joinDeathFee;
    }
    
    if(!isDeathYear){
      const yearDeaths = S.deaths.filter(function(d){ return Number(d.year) === year; });
      result.death.installReq += yearDeaths.length * c.deathInstallment;
    }
  }
  
  result.assoc.req = result.assoc.yearlyReq + result.assoc.joinReq;
  result.death.req = result.death.installReq + result.death.joinReq;
  
  // الدفعات
  const memberPayments = S.payments.filter(function(p){
    return p.memberId === member.id &&
      (Number(p.forYear) === year || Number(p.year) === year);
  });
  
  result.assoc.paid = memberPayments
    .filter(function(p){ return p.fund === 'assoc'; })
    .reduce(function(s, p){ return s + (Number(p.amount) || 0); }, 0);
  
  result.death.paid = memberPayments
    .filter(function(p){ return p.fund === 'death'; })
    .reduce(function(s, p){ return s + (Number(p.amount) || 0); }, 0);
  
  result.assoc.rem = result.assoc.req - result.assoc.paid;
  result.death.rem = result.death.req - result.death.paid;
  
  return result;
}

/* حساب كامل للعضو */
function computeMemberFull(memberId){
  if(CACHE.memberFull.has(memberId)){
    return CACHE.memberFull.get(memberId);
  }
  
  const member = getMemberById(memberId);
  if(!member) return null;
  
  const starts = [member.assocStartYear, member.deathStartYear].filter(function(x){ return x; });
  
  if(!starts.length){
    const result = {
      member: member,
      years: [],
      total: {
        assocReq:0, assocPaid:0, assocRem:0,
        assocYearlyReq:0, assocJoinReq:0,
        deathReq:0, deathPaid:0, deathRem:0,
        deathInstallReq:0, deathJoinReq:0,
        totalRem:0, totalReq:0, totalPaid:0
      }
    };
    CACHE.memberFull.set(memberId, result);
    return result;
  }
  
  const firstYear = Math.max(BASE_YEAR, Math.min.apply(null, starts));
  const years = [];
  for(let y = firstYear; y <= S.currentYear; y++){
    const yd = computeMemberYear(member, y);
    yd.year = y;
    years.push(yd);
  }
  
  const total = {
    assocReq:0, assocPaid:0, assocRem:0,
    assocYearlyReq:0, assocJoinReq:0,
    deathReq:0, deathPaid:0, deathRem:0,
    deathInstallReq:0, deathJoinReq:0
  };
  
  years.forEach(function(y){
    total.assocReq += y.assoc.req;
    total.assocPaid += y.assoc.paid;
    total.assocRem += (y.assoc.req - y.assoc.paid);
    total.assocYearlyReq += y.assoc.yearlyReq;
    total.assocJoinReq += y.assoc.joinReq;
    total.deathReq += y.death.req;
    total.deathPaid += y.death.paid;
    total.deathRem += (y.death.req - y.death.paid);
    total.deathInstallReq += y.death.installReq;
    total.deathJoinReq += y.death.joinReq;
  });
  
  total.totalReq = total.assocReq + total.deathReq;
  total.totalPaid = total.assocPaid + total.deathPaid;
  total.totalRem = total.totalReq - total.totalPaid;
  
  // قرار المتأخرات
  if(member.debtAction === 'writeOff' || member.debtAction === 'deductFromComp'){
    total.totalRem = 0;
    total.debtWrittenOff = member.writtenOffAmount || 0;
  } else if(member.debtAction === 'partial'){
    const wo = member.writtenOffAmount || 0;
    total.totalRem = Math.max(0, total.totalRem - wo);
    total.debtWrittenOff = wo;
  }
  
  const result = { member: member, years: years, total: total };
  CACHE.memberFull.set(memberId, result);
  return result;
}

/* إحصائيات الأعضاء */
function getMembersStats(year){
  const y = year || S.currentYear;
  
  if(CACHE.stats && CACHE.statsYear === y) return CACHE.stats;
  
  let onlyAssoc = 0, onlyDeath = 0, both = 0, none = 0, late = 0;
  let lateTotal = 0, active = 0, withdrawn = 0, deceased = 0;
  let exemptCount = 0, frozen = 0, newThisYear = 0;
  
  S.members.forEach(function(m){
    const st = m.memberStatus || 'نشط';
    if(st === 'نشط') active++;
    else if(st === 'منسحب') withdrawn++;
    else if(st === 'متوقف') frozen++;
    else if(st === 'متوفى') deceased++;
    else if(st === 'معفى') exemptCount++;
    
    const hasAssoc = m.assocStartYear && m.assocStartYear <= y && !m.assocExempt;
    const hasDeath = m.deathStartYear && m.deathStartYear <= y && !m.deathExempt;
    
    if(hasAssoc && hasDeath) both++;
    else if(hasAssoc) onlyAssoc++;
    else if(hasDeath) onlyDeath++;
    else none++;
    
    if(m.assocStartYear === y || m.deathStartYear === y) newThisYear++;
    
    if(m.assocStartYear || m.deathStartYear){
      const full = computeMemberFull(m.id);
      if(full && full.total.totalRem > 0){
        late++;
        lateTotal += full.total.totalRem;
      }
    }
  });
  
  const result = {
    year: y, total: S.members.length,
    onlyAssoc: onlyAssoc, onlyDeath: onlyDeath, both: both, none: none,
    late: late, lateTotal: lateTotal,
    active: active, withdrawn: withdrawn, deceased: deceased,
    exempt: exemptCount, frozen: frozen, newThisYear: newThisYear
  };
  
  CACHE.stats = result;
  CACHE.statsYear = y;
  return result;
}

/* رصيد صندوق فعلي */
function getFundActual(fund){
  const opening = getOpeningBalance();
  const openingVal = Number(opening[fund]) || 0;
  
  const sum = function(arr){ return arr.reduce(function(s, x){ return s + (Number(x.amount) || 0); }, 0); };
  
  const collected = sum(S.payments.filter(function(p){ return p.fund === fund; }));
  const incomes = sum(S.incomes.filter(function(i){ return i.fund === fund; }));
  const expenses = sum(S.expenses.filter(function(e){ return e.fund === fund; }));
  const compensations = fund === 'death'
    ? S.deaths.reduce(function(s, d){ return s + (Number(d.compensation) || 0); }, 0)
    : 0;
  
  const balance = openingVal + collected + incomes - expenses - compensations;
  
  return {
    fund: fund,
    opening: openingVal,
    collected: collected,
    incomes: incomes,
    expenses: expenses,
    compensations: compensations,
    balance: balance
  };
}

/* سنوات صندوق */
function getFundYears(fund){
  const years = [2025, 2026, 2027, 2028, 2029];
  const opening = getOpeningBalance();
  const openingVal = Number(opening[fund]) || 0;
  let cum = openingVal;
  const result = [];
  
  years.forEach(function(y){
    const sum = function(arr){ return arr.reduce(function(s, x){ return s + (Number(x.amount) || 0); }, 0); };
    
    const payments = S.payments.filter(function(p){ return Number(p.year) === y && p.fund === fund; });
    const incomes = S.incomes.filter(function(i){ return Number(i.year) === y && i.fund === fund; });
    const expenses = S.expenses.filter(function(e){ return Number(e.year) === y && e.fund === fund; });
    const compensations = fund === 'death'
      ? S.deaths.filter(function(d){ return Number(d.year) === y; })
      : [];
    
    const collected = sum(payments);
    const totalIncomes = sum(incomes);
    const totalExpenses = sum(expenses);
    const totalComp = compensations.reduce(function(s, d){ return s + (Number(d.compensation) || 0); }, 0);
    
    const net = collected + totalIncomes - totalExpenses - totalComp;
    cum += net;
    
    if(collected !== 0 || totalIncomes !== 0 || totalExpenses !== 0 || totalComp !== 0){
      result.push({
        year: y,
        collected: collected, incomes: totalIncomes,
        expenses: totalExpenses, compensations: totalComp,
        net: net, cumulative: cum
      });
    }
  });
  
  return { opening: openingVal, years: result, total: cum };
}

/* عهدة المستخدم */
function getUserCustody(userId, fund){
  fund = fund || 'all';
  const user = S.users.find(function(u){ return u.id === userId; });
  const userName = user ? normAr(user.name) : '';
  
  const matchName = function(name){
    if(!name || !userName) return false;
    const n = normAr(name);
    return n === userName || n.indexOf(userName) > -1 || userName.indexOf(n) > -1;
  };
  
  let payments = S.payments.filter(function(p){
    return p.collectorId === userId || (!p.collectorId && matchName(p.collectorName));
  });
  
  let delivered = S.deliveries.filter(function(d){
    return (d.fromUserId === userId || (!d.fromUserId && matchName(d.fromUserName))) && d.receivedAt;
  });
  
  let pending = S.deliveries.filter(function(d){
    return (d.fromUserId === userId || (!d.fromUserId && matchName(d.fromUserName))) && !d.receivedAt && !d.rejectedAt;
  });
  
  let received = S.deliveries.filter(function(d){
    return (d.toUserId === userId || (!d.toUserId && matchName(d.toUserName))) && d.receivedAt;
  });
  
  if(fund !== 'all'){
    payments = payments.filter(function(p){ return p.fund === fund; });
    delivered = delivered.filter(function(d){ return d.fund === fund; });
    pending = pending.filter(function(d){ return d.fund === fund; });
    received = received.filter(function(d){ return d.fund === fund; });
  }
  
  const collected = payments.reduce(function(s, p){ return s + (Number(p.amount) || 0); }, 0);
  const deliveredSum = delivered.reduce(function(s, d){ return s + (Number(d.amount) || 0); }, 0);
  const pendingSum = pending.reduce(function(s, d){ return s + (Number(d.amount) || 0); }, 0);
  const receivedSum = received.reduce(function(s, d){ return s + (Number(d.amount) || 0); }, 0);
  
  return {
    collected: collected,
    delivered: deliveredSum,
    pending: pendingSum,
    received: receivedSum,
    balance: collected - deliveredSum + receivedSum
  };
}

/* تفصيل عهدة المعتمد */
function getCollectorBreakdown(userId, year){
  const y = year || S.currentYear;
  const user = S.users.find(function(u){ return u.id === userId; });
  const userName = user ? normAr(user.name) : '';
  
  const matchName = function(name){
    if(!name || !userName) return false;
    const n = normAr(name);
    return n === userName || n.indexOf(userName) > -1 || userName.indexOf(n) > -1;
  };
  
  const myPayments = S.payments.filter(function(p){
    return (Number(p.forYear) === y || Number(p.year) === y) &&
      (p.collectorId === userId || (!p.collectorId && matchName(p.collectorName)));
  });
  
  const myDeliveries = S.deliveries.filter(function(d){
    return d.date && new Date(d.date).getFullYear() === y &&
      (d.fromUserId === userId || (!d.fromUserId && matchName(d.fromUserName)));
  });
  
  const byFund = function(fund){
    const collected = myPayments
      .filter(function(p){ return p.fund === fund; })
      .reduce(function(s, p){ return s + (Number(p.amount) || 0); }, 0);
    const delivered = myDeliveries
      .filter(function(d){ return d.fund === fund && d.receivedAt; })
      .reduce(function(s, d){ return s + (Number(d.amount) || 0); }, 0);
    const pending = myDeliveries
      .filter(function(d){ return d.fund === fund && !d.receivedAt && !d.rejectedAt; })
      .reduce(function(s, d){ return s + (Number(d.amount) || 0); }, 0);
    return { collected: collected, delivered: delivered, pending: pending, rem: collected - delivered };
  };
  
  const assoc = byFund('assoc');
  const death = byFund('death');
  const donation = byFund('donation');
  
  return {
    year: y,
    assoc: assoc, death: death, donation: donation,
    total: {
      collected: assoc.collected + death.collected + donation.collected,
      delivered: assoc.delivered + death.delivered + donation.delivered,
      pending: assoc.pending + death.pending + donation.pending,
      rem: (assoc.collected + death.collected + donation.collected) -
           (assoc.delivered + death.delivered + donation.delivered)
    }
  };
}

/* كل المحصّلين */
function getAllCollectors(year){
  const y = year || S.currentYear;
  
  const userByNorm = {};
  S.users.forEach(function(u){ if(u.name) userByNorm[normAr(u.name)] = u; });
  
  const collectorMap = {};
  
  S.payments.forEach(function(p){
    const py = Number(p.forYear) || Number(p.year);
    if(py !== y) return;
    
    let user = null;
    if(p.collectorId) user = S.users.find(function(u){ return u.id === p.collectorId; });
    if(!user && p.collectorName) user = userByNorm[normAr(p.collectorName)];
    
    const key = user ? 'u:' + user.id : 'n:' + normAr(p.collectorName || '');
    
    if(!collectorMap[key]){
      collectorMap[key] = {
        id: user ? user.id : null,
        name: user ? user.name : (p.collectorName || 'غير محدد'),
        user: user
      };
    }
  });
  
  const list = [];
  
  Object.keys(collectorMap).forEach(function(key){
    const c = collectorMap[key];
    
    const matchPayment = function(p){
      const py = Number(p.forYear) || Number(p.year);
      if(py !== y) return false;
      if(c.user){
        if(p.collectorId === c.user.id) return true;
        if(!p.collectorId && p.collectorName) return normAr(p.collectorName) === normAr(c.user.name);
        return false;
      }
      if(p.collectorId) return false;
      return normAr(p.collectorName || '') === normAr(c.name);
    };
    
    const matchDelivery = function(d){
      if(!d.date) return false;
      const dy = new Date(d.date).getFullYear();
      if(dy !== y) return false;
      if(c.user){
        if(d.fromUserId === c.user.id) return true;
        if(!d.fromUserId && d.fromUserName) return normAr(d.fromUserName) === normAr(c.user.name);
        return false;
      }
      if(d.fromUserId) return false;
      return normAr(d.fromUserName || '') === normAr(c.name);
    };
    
    const payments = S.payments.filter(matchPayment);
    const deliveries = S.deliveries.filter(matchDelivery);
    
    const byFund = function(fund){
      const p = payments.filter(function(x){ return x.fund === fund; })
        .reduce(function(s, x){ return s + (Number(x.amount) || 0); }, 0);
      const d = deliveries.filter(function(x){ return x.fund === fund && x.receivedAt; })
        .reduce(function(s, x){ return s + (Number(x.amount) || 0); }, 0);
      const pend = deliveries.filter(function(x){ return x.fund === fund && !x.receivedAt && !x.rejectedAt; })
        .reduce(function(s, x){ return s + (Number(x.amount) || 0); }, 0);
      return { collected: p, delivered: d, pending: pend };
    };
    
    const assoc = byFund('assoc');
    const death = byFund('death');
    const donation = byFund('donation');
    
    const total = {
      collected: assoc.collected + death.collected + donation.collected,
      delivered: assoc.delivered + death.delivered + donation.delivered,
      pending: assoc.pending + death.pending + donation.pending
    };
    total.rem = total.collected - total.delivered;
    
    if(total.collected === 0 && total.delivered === 0) return;
    
    list.push({
      id: c.id, name: c.name, user: c.user,
      role: c.user ? c.user.role : null,
      assoc: assoc, death: death, donation: donation, total: total,
      paymentCount: payments.length,
      deliveryCount: deliveries.length
    });
  });
  
  list.sort(function(a, b){
    if(b.total.pending !== a.total.pending) return b.total.pending - a.total.pending;
    return b.total.collected - a.total.collected;
  });
  
  return list;
}

    else if(st === 'معفى') counts.unsubscribed++;
    else {
      if(m.assocStartYear || m.deathStartYear) counts.subscribed++;

function openMembersFilter(type){
  const f = S.filters;
  const y = S.currentYear;
  
  if(type === 'tab'){
    const counts = { subscribed:0, unsubscribed:0, withdrawn:0, frozen:0, deceased:0 };
    S.members.forEach(function(m){
      const st = m.memberStatus || 'نشط';
      if(st === 'متوفى') counts.deceased++;
      else if(st === 'منسحب') counts.withdrawn++;
      else if(st === 'متوقف') counts.frozen++;
      else if(st === 'معفى') counts.unsubscribed++;
      else {
        if(m.assocStartYear || m.deathStartYear) counts.subscribed++;
        else counts.unsubscribed++;
      }
    });
    
    const options = [
      { k:'subscribed', i:'👥', l:'المشتركون', c:counts.subscribed, color:'#2563eb' },
      { k:'unsubscribed', i:'⚪', l:'غير مشتركين', c:counts.unsubscribed, color:'#64748b' },
      { k:'withdrawn', i:'🚪', l:'منسحبون', c:counts.withdrawn, color:'#94a3b8' },
      { k:'frozen', i:'⏸️', l:'متوقفون', c:counts.frozen, color:'#f59e0b' },
      { k:'deceased', i:'⚰️', l:'متوفون', c:counts.deceased, color:'#dc2626' }
    ];
    
    let html = '';
    options.forEach(function(o){
      const isActive = f.members === o.k;
      html += '<div onclick="setMembersFilter(\'members\',\'' + o.k + '\')" style="display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--border-2);cursor:pointer;background:' + (isActive ? 'var(--primary-soft)' : 'var(--card)') + '">';
      html += '<div style="width:38px;height:38px;border-radius:10px;background:' + o.color + '15;color:' + o.color + ';display:flex;align-items:center;justify-content:center;font-size:19px">' + o.i + '</div>';
      html += '<div style="flex:1;font-size:14px;font-weight:700">' + o.l + '</div>';
      html += '<div style="background:' + (isActive ? o.color : 'var(--border-2)') + ';color:' + (isActive ? '#fff' : 'var(--muted)') + ';padding:4px 10px;border-radius:8px;font-size:12px;font-weight:800;min-width:38px;text-align:center">' + o.c + '</div>';
      if(isActive) html += '<span style="color:' + o.color + ';font-size:18px">✓</span>';
      html += '</div>';
    });
    
    openSheet('📋 التصنيف', html, '<button class="btn ghost" onclick="closeSheetAll()">إغلاق</button>');
    return;
  }
  
  if(type === 'sector'){
    const sectors = [];
    S.members.forEach(function(m){
      if(m.sector && sectors.indexOf(m.sector) === -1) sectors.push(m.sector);
    });
    sectors.sort();
    
    const opts = ['all'].concat(sectors);
    let html = '';
    
    opts.forEach(function(s){
      const isActive = f.membersSector === s;
      const label = s === 'all' ? 'كل القطاعات' : s;
      const count = s === 'all' ? S.members.length : S.members.filter(function(m){ return m.sector === s; }).length;
      
      html += '<div onclick="setMembersFilter(\'membersSector\',\'' + s.replace(/'/g, "\\'") + '\')" style="display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--border-2);cursor:pointer;background:' + (isActive ? 'var(--primary-soft)' : 'var(--card)') + '">';
      html += '<div style="font-size:20px">' + (s === 'all' ? '📍' : '🏘️') + '</div>';
      html += '<div style="flex:1;font-size:14px;font-weight:700">' + esc(label) + '</div>';
      html += '<div style="background:' + (isActive ? 'var(--primary)' : 'var(--border-2)') + ';color:' + (isActive ? '#fff' : 'var(--muted)') + ';padding:4px 10px;border-radius:8px;font-size:12px;font-weight:800;min-width:38px;text-align:center">' + count + '</div>';
      if(isActive) html += '<span style="color:var(--primary);font-size:18px">✓</span>';
      html += '</div>';
    });
    
    openSheet('📍 القطاع', html, '<button class="btn ghost" onclick="closeSheetAll()">إغلاق</button>');
    return;
  }
}

function setMembersFilter(key, value){
  S.filters[key] = value;
  closeSheetAll();
  setTimeout(renderMembers, 150);
}

function toggleMembersNewFilter(){
  S.filters.membersNew = !S.filters.membersNew;
  renderMembers();
}

const onMembersSearchChange = debounce(function(q){
  S.search = q;
  renderMembersList();
}, 250);

function clearMembersSearch(){
  S.search = '';
  renderMembers();
}

function renderMembersList(){
  const f = S.filters;
  const currentYear = S.currentYear;
  
  let list = S.members.filter(function(m){
    const st = m.memberStatus || 'نشط';
    
    if(f.members === 'deceased')  return st === 'متوفى';
    if(f.members === 'withdrawn') return st === 'منسحب';
    if(f.members === 'frozen')    return st === 'متوقف';
    
    if(st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return false;
    
    if(f.members === 'subscribed'){
      return (m.assocStartYear || m.deathStartYear) && st !== 'معفى';
    }
    if(f.members === 'unsubscribed'){
      return (!m.assocStartYear && !m.deathStartYear) || st === 'معفى';
    }
    return false;
  });
  
  if(f.membersSector !== 'all'){
    list = list.filter(function(m){ return m.sector === f.membersSector; });
  }
  
  if(f.membersNew){
    list = list.filter(function(m){
      return m.assocStartYear === currentYear || m.deathStartYear === currentYear;
    });
  }
  
  if(S.search){
    const s = normAr(S.search);
    list = list.filter(function(m){
      return normAr(m.name + ' ' + (m.code || '') + ' ' + (m.phone || '') + ' ' + (m.familyCode || '')).indexOf(s) > -1;
    });
  }
  
  list.sort(function(a, b){
    const fa = computeMemberFull(a.id);
    const fb = computeMemberFull(b.id);
    const ra = fa ? fa.total.totalRem : 0;
    const rb = fb ? fb.total.totalRem : 0;
    if(ra !== rb) return rb - ra;
    return String(a.name).localeCompare(String(b.name), 'ar');
  });
  
  const el = $('membersListContent');
  const countEl = $('membersCountDisplay');
  
  if(countEl) countEl.textContent = '📊 ' + list.length + ' عضو';
  
  if(!el) return;
  
  if(!list.length){
    el.innerHTML = '<div class="empty"><span class="ico">👥</span><h3>لا يوجد أعضاء</h3>' +
      '<p>' + (S.search ? 'جرّب بحثاً آخر' : 'في هذا التصنيف') + '</p></div>';
    return;
  }
  
  el.innerHTML = '<div class="list">' + list.slice(0, 500).map(renderMemberRow).join('') + '</div>';
}

/* بطاقة العضو - تصميم بنكي */
function renderMemberRow(m){
  const full = computeMemberFull(m.id);
  const rem = full ? full.total.totalRem : 0;
  const hasUnpaid = rem > 0;
  const st = m.memberStatus || 'نشط';
  
  let accent = '#7c3aed';
  let statusLabel = '';
  
  if(st === 'متوفى'){ accent = '#dc2626'; statusLabel = 'متوفى'; }
  else if(st === 'منسحب'){ accent = '#94a3b8'; statusLabel = 'منسحب'; }
  else if(st === 'متوقف'){ accent = '#f59e0b'; statusLabel = 'متوقف'; }
  else if(st === 'معفى'){ accent = '#3b82f6'; statusLabel = 'معفى'; }
  
  const subs = [];
  if(m.assocStartYear) subs.push('ج');
  if(m.deathStartYear) subs.push('و');
  
  const isNew = m.assocStartYear === S.currentYear || m.deathStartYear === S.currentYear;
  
  let html = '<div onclick="openMemberDetail(' + m.id + ')" style="background:var(--card);border-bottom:1px solid var(--border-2);padding:11px 16px 11px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;position:relative;min-height:56px">';
  html += '<div style="position:absolute;right:0;top:0;bottom:0;width:3px;background:' + accent + '"></div>';
  
  html += '<div style="flex:1;min-width:0">';
  html += '<div style="font-size:13.5px;font-weight:700;color:var(--text);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px">';
  html += '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.name) + '</span>';
  if(isNew) html += '<span class="badge success" style="font-size:8px;padding:1px 5px">جديد</span>';
  if(statusLabel) html += '<span style="color:' + accent + ';font-size:10px;font-weight:700">· ' + statusLabel + '</span>';
  html += '</div>';
  
  html += '<div style="font-size:10px;color:var(--muted-2);margin-top:2px;font-family:\'SF Mono\',monospace;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">';
  html += esc(m.code || '—');
  if(subs.length) html += '  ' + subs.join('·');
  if(m.sector) html += '  ' + esc(m.sector);
  html += '</div></div>';
  
  html += '<div style="flex-shrink:0;text-align:left;direction:ltr;min-width:82px">';
  if(hasUnpaid){
    html += '<div style="font-size:14px;font-weight:800;color:var(--text);font-family:\'SF Mono\',monospace;line-height:1.1">' + fmtNum(rem) + '</div>';
    html += '<div style="font-size:9px;color:var(--death);font-weight:700;text-align:right;margin-top:1px">متبقي</div>';
  } else {
    html += '<div style="font-size:11px;color:var(--success);font-weight:700;text-align:right">✓ مسدَّد</div>';
  }
  html += '</div></div>';
  
  return html;
}

function toggleMemberStatusFields(){
  const v = $('mMemberStatus') ? $('mMemberStatus').value : '';
  const stopField = $('mStopYearField');
  const deathField = $('mDeathDateField');
  if(stopField) stopField.style.display = (v === 'منسحب' || v === 'متوقف') ? 'block' : 'none';
  if(deathField) deathField.style.display = v === 'متوفى' ? 'block' : 'none';
}

function toggleAssocYearField(){
  const on = $('mAssocActive') ? $('mAssocActive').value === 'yes' : false;
  if($('mAssocYear')){
    $('mAssocYear').disabled = !on;
    if(!on) $('mAssocYear').value = '';
  }
}

function toggleDeathYearField(){
  const on = $('mDeathActive') ? $('mDeathActive').value === 'yes' : false;
  if($('mDeathYear')){
    $('mDeathYear').disabled = !on;
    if(!on) $('mDeathYear').value = '';
  }
}

async function saveMember(id){
  const canEditAll = canEditMember();
  const canEditPhone = canEditMemberPhone();
  
  if(!canEditAll && !canEditPhone){ toast('غير مصرح', 'error'); return; }
  
  try {
    const old = id ? await dbGet('members', id) : null;
    let obj = old ? Object.assign({}, old) : {};
    
    if(canEditPhone){
      obj.phone = cleanPhone($('mPhone') ? $('mPhone').value : '');
    }
    
    if(canEditAll){
      const name = cleanText($('mName').value);
      if(!name){ toast('الاسم مطلوب', 'error'); return; }
      
      const assocActive = $('mAssocActive').value === 'yes';
      const deathActive = $('mDeathActive').value === 'yes';
      const memberStatus = $('mMemberStatus').value;
      
      if(memberStatus === 'متوفى' && !$('mDeathDate').value){
        toast('تاريخ الوفاة مطلوب', 'error');
        return;
      }
      
      obj.code = cleanText($('mCode').value);
      obj.familyCode = cleanText($('mFamily').value);
      obj.name = name;
      obj.gender = $('mGender').value;
      obj.status = $('mStatus').value;
      obj.birth = $('mBirth').value;
      obj.sector = $('mSector').value;
      obj.relation = $('mRelation').value;
      obj.phone = cleanPhone($('mPhone').value);
      obj.assocStartYear = assocActive ? Number($('mAssocYear').value) : null;
      obj.deathStartYear = deathActive ? Number($('mDeathYear').value) : null;
      obj.memberType = $('mType').value;
      obj.memberStatus = memberStatus;
      obj.stopYear = (memberStatus === 'منسحب' || memberStatus === 'متوقف')
        ? Number($('mStopYear').value) || null
        : null;
      obj.deathDate = memberStatus === 'متوفى' ? ($('mDeathDate').value || '') : '';
      obj.assocExempt = $('mAssocExempt').checked;
      obj.deathExempt = $('mDeathExempt').checked;
      obj.notes = cleanText($('mNotes').value);
      
      if(typeof collectCustomFields === 'function'){
        obj.custom = collectCustomFields('members');
      }
    }
    
    if(!obj.createdAt) obj.createdAt = new Date().toISOString();
    
    if(id){
      obj.id = id;
      await dbPut('members', obj);
      const i = S.members.findIndex(function(x){ return x.id === id; });
      if(i > -1) S.members[i] = obj;
      CACHE.invalidateMember(id);
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('members', obj);
      obj.id = newId;
      S.members.push(obj);
      toast('✅ تمت الإضافة');
    }
    
    await logAudit(id ? 'update' : 'add', 'member', obj.id, { name: obj.name });
    CACHE.invalidateAll();
    
    closeSheetAll();
    go(S.page);
  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
}

async function deleteMember(id){
  if(!canEditMember()){ toast('غير مصرح', 'error'); return; }
  const m = getMemberById(id);
  if(!confirm('حذف العضو "' + (m ? m.name : '') + '"؟')) return;
  if(!confirm('تأكيد أخير!')) return;
  
  try {
    await dbDel('members', id);
    S.members = S.members.filter(function(x){ return x.id !== id; });
    CACHE.invalidateAll();
    await logAudit('delete', 'member', id, { name: m ? m.name : '' });
    toast('🗑️ تم الحذف');
    closeSheetAll();
    go(S.page);
  } catch(e){
    toast('خطأ', 'error');
  }
}

/* دفعات العضو */
function openMemberPaymentsList(memberId){
  const m = getMemberById(memberId);
  if(!m) return;
  
  const list = S.payments.filter(function(p){ return p.memberId === memberId; })
    .sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });
  
  const total = list.reduce(function(s, p){ return s + (Number(p.amount) || 0); }, 0);
  
  let html = '';
  
  if(list.length){
    html += '<div style="padding:12px;background:var(--donation-soft);border-radius:10px;margin-bottom:12px;text-align:center">';
    html += '<div style="font-size:11px;color:var(--muted)">إجمالي المدفوع</div>';
    html += '<div style="font-size:22px;font-weight:800;color:var(--success);font-family:\'SF Mono\',monospace">' + fmtNum(total) + '</div>';
    html += '<div style="font-size:11px;color:var(--muted)">' + list.length + ' دفعة</div></div>';
    
    html += '<div class="list">';
    list.forEach(function(p){
      const fundIcon = p.fund === 'death' ? '⚰️' : p.fund === 'donation' ? '💚' : '💰';
      const fundColor = p.fund === 'death' ? 'red' : p.fund === 'donation' ? 'green' : 'blue';
      html += '<div class="item" onclick="closeSheet();setTimeout(function(){openPaymentDetail(' + p.id + ')},150)">';
      html += '<div class="av ' + fundColor + '">' + fundIcon + '</div>';
      html += '<div class="body"><div class="ttl">' + fmtNum(p.amount) + ' ل.س</div>';
      html += '<div class="sub">' + fmtDate(p.date) + ' • سنة ' + (p.forYear || p.year) + '</div></div>';
      html += '<span class="trail">›</span></div>';
    });
    html += '</div>';
  } else {
    html = '<div class="empty"><p>لا توجد دفعات</p></div>';
  }
  
  openSheet('📜 دفعات ' + m.name, html, '<button class="btn ghost" onclick="closeSheetAll()">إغلاق</button>', { wide: true });
}

/* إدارة المتأخرات */
function openDebtManager(memberId){
  const m = getMemberById(memberId);
  if(!m) return;
  
  const full = computeMemberFull(memberId);
  const debt = full ? full.total.totalRem : 0;
  const isDeceased = m.memberStatus === 'متوفى';

      '<div style="text-align:center;padding:30px 20px"><div style="font-size:52px;margin-bottom:12px">✅</div>' +
      '<div style="font-weight:800;font-size:15px;margin-bottom:6px">لا توجد متأخرات</div>' +
      '<div style="font-size:12px;color:var(--muted)">' + esc(m.name) + ' سدَّد كل التزاماته</div></div>',

    { key: 'keep', icon: '💰', label: 'تبقى للمطالبة', desc: 'يُطالب بالسداد' }
  ];
  
  if(isDeceased){
    options.push({ key: 'deductFromComp', icon: '🪦', label: 'خصم من التعويض', desc: 'تُخصم من تعويض العائلة' });
  }

  html += '<div style="padding:14px;background:var(--warning-soft);border-radius:12px;margin-bottom:14px">';

  html += '<div style="font-size:32px">⚠️</div>';
  html += '<div style="flex:1"><div style="font-weight:800;font-size:14px;color:#92400e">متأخرات ' + esc(m.name) + '</div>';
  html += '<div style="font-size:22px;font-weight:800;color:var(--death);margin-top:4px;font-family:\'SF Mono\',monospace">' + fmtNum(debt) + ' ل.س</div></div>';
  html += '</div></div>';
  
  html += '<div style="font-weight:800;font-size:13px;margin-bottom:10px">اختر الإجراء:</div>';
  html += '<div style="display:grid;gap:8px">';
  
  options.forEach(function(o){
    const isSelected = currentAction === o.key;
    html += '<div class="debt-option" data-key="' + o.key + '" onclick="selectDebtOption(\'' + o.key + '\')" style="padding:12px;border:2px solid ' + (isSelected ? 'var(--primary)' : 'var(--border)') + ';border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:10px;background:' + (isSelected ? 'var(--primary-soft)' : 'var(--card)') + '">';
    html += '<div style="font-size:24px">' + o.icon + '</div>';
    html += '<div style="flex:1"><div style="font-weight:800;font-size:14px">' + o.label + '</div>';
    html += '<div style="font-size:11px;color:var(--muted)">' + o.desc + '</div></div></div>';
  });
  
  html += '</div>';
  
  html += '<div id="partialAmountBox" style="display:' + (currentAction === 'partial' ? 'block' : 'none') + ';margin-top:12px">';
  html += '<label style="font-size:12px;font-weight:700;color:var(--muted)">المبلغ المُسقَط:</label>';

  html += '<input id="partialAmount" type="tel" inputmode="numeric" value="' + (m.writtenOffAmount || 0) + '">';
  html += '<span class="currency">ل.س</span></div></div>';

    '<button class="btn primary" onclick="confirmDebtAction(' + memberId + ')">✅ حفظ</button>';
  
  openSheet('⚠️ إدارة المتأخرات', html, foot, { wide: true });
  
  window._debtContext = { memberId: memberId, debt: debt, isDeceased: isDeceased, selectedAction: currentAction || null };
}

function selectDebtOption(key){
  $$('.debt-option').forEach(function(el){
    el.style.borderColor = 'var(--border)';
    el.style.background = 'var(--card)';
  });
  const selected = document.querySelector('.debt-option[data-key="' + key + '"]');
  if(selected){
    selected.style.borderColor = 'var(--primary)';
    selected.style.background = 'var(--primary-soft)';
  }
  if(window._debtContext) window._debtContext.selectedAction = key;
  
  const box = $('partialAmountBox');
  if(box) box.style.display = key === 'partial' ? 'block' : 'none';
}

async function confirmDebtAction(memberId){
  const ctx = window._debtContext;
  if(!ctx || !ctx.selectedAction){ toast('اختر إجراءً', 'warning'); return; }
  
  const m = getMemberById(memberId);
  if(!m) return;
  
  let writtenOffAmount = 0;
  if(ctx.selectedAction === 'writeOff' || ctx.selectedAction === 'deductFromComp'){
    writtenOffAmount = ctx.debt;
  } else if(ctx.selectedAction === 'partial'){
    writtenOffAmount = Number($('partialAmount').value) || 0;
    if(writtenOffAmount <= 0 || writtenOffAmount > ctx.debt){
      toast('قيمة غير صحيحة', 'error');
      return;
    }
  }
  
  m.debtAction = ctx.selectedAction;
  m.writtenOffAmount = writtenOffAmount;
  m.debtNote = cleanText($('debtNote') ? $('debtNote').value : '');
  m.debtDecidedAt = new Date().toISOString();
  m.debtDecidedBy = S.currentUser.name;
  m.debtAmountBefore = ctx.debt;
  
  try {
    await dbPut('members', m);
    const i = S.members.findIndex(function(x){ return x.id === memberId; });
    if(i > -1) S.members[i] = m;
    CACHE.invalidateMember(memberId);
    
    await logAudit('update', 'member_debt', memberId, {
      action: ctx.selectedAction,
      amount: writtenOffAmount,
      total: ctx.debt
    });
    
    toast('✅ تم الحفظ', 'success', 2500);
    closeSheetAll();
    setTimeout(function(){ openMemberDetail(memberId); }, 200);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

async function clearDebtAction(memberId){
  if(!confirm('إلغاء قرار المتأخرات؟')) return;
  const m = getMemberById(memberId);
  if(!m) return;
  
  delete m.debtAction;
  delete m.writtenOffAmount;
  delete m.debtNote;
  delete m.debtDecidedAt;
  delete m.debtDecidedBy;
  delete m.debtAmountBefore;
  
  await dbPut('members', m);
  CACHE.invalidateMember(memberId);
  toast('↩️ تم الإلغاء');
  closeSheetAll();
  setTimeout(function(){ openMemberDetail(memberId); }, 200);
}

function performQuickSearch(q){
  const container = $('quickSearchResults');
  if(!container) return;
  const u = S.currentUser;
  
  if(!q || q.length < 1){
    container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted)"><div style="font-size:44px;opacity:.4">🔍</div><div style="font-weight:700;margin-top:10px">ابدأ الكتابة</div></div>';
    return;
  }
  
  const s = normAr(q);
  
  let list = S.members.filter(function(m){
    if(u.role === 'collector'){
      const cf = u.collectFund;
      if(cf === 'assoc' && !m.assocStartYear) return false;
      if(cf === 'death' && !m.deathStartYear) return false;
      if(!m.assocStartYear && !m.deathStartYear) return false;
      if(u.sector && m.sector !== u.sector) return false;
    }
    if(u.role === 'assocTreasurer' && !m.assocStartYear) return false;
    if(u.role === 'deathTreasurer' && !m.deathStartYear) return false;
    return true;
  });
  
  list = list.filter(function(m){
    return normAr(m.name + ' ' + (m.code || '') + ' ' + (m.phone || '') + ' ' + (m.familyCode || '') + ' ' + (m.sector || '')).indexOf(s) > -1;
  });
  
  list.sort(function(a, b){
    const fa = computeMemberFull(a.id);
    const fb = computeMemberFull(b.id);
    const ra = fa ? fa.total.totalRem : 0;
    const rb = fb ? fb.total.totalRem : 0;
    if(ra !== rb) return rb - ra;
    return String(a.name).localeCompare(String(b.name), 'ar');
  });
  
  if(!list.length){
    container.innerHTML = '<div class="empty"><span class="ico">🔍</span><h3>لا نتائج</h3></div>';
    return;
  }
  
  let html = '<div style="font-size:12px;color:var(--muted);padding:8px 0;font-weight:700">📊 ' + list.length + ' نتيجة</div>';
  html += '<div class="list">';
  list.slice(0, 100).forEach(function(m){
    const full = computeMemberFull(m.id);
    const rem = full ? full.total.totalRem : 0;
    const hasUnpaid = rem > 0;
    const icons = [];
    if(m.assocStartYear) icons.push('💰');
    if(m.deathStartYear) icons.push('⚰️');
    
    html += '<div class="item" onclick="closeSheetAll();setTimeout(function(){openQuickPaySheet(' + m.id + ')},150)">';
    html += '<div class="av ' + (hasUnpaid ? 'red' : 'green') + '">' + (icons.join('') || '⭐') + '</div>';
    html += '<div class="body"><div class="ttl">' + esc(m.name) + '</div>';
    html += '<div class="sub">' + esc(m.code || '') + ' • ' + esc(m.sector || '') + '</div></div>';
    html += '<div style="text-align:left">';
    if(hasUnpaid){
      html += '<div style="font-weight:800;color:var(--death);font-size:13px;font-family:\'SF Mono\',monospace">' + fmtShort(rem) + '</div>';
    } else {
      html += '<div style="color:var(--success);font-size:16px">✅</div>';
    }
    html += '</div></div>';
  });
  html += '</div>';
  
  container.innerHTML = html;
}
