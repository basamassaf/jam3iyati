function renderLate(){
  const u = S.currentUser;
  
  let list = S.members.filter(m => {
    if(u.role === 'collector'){
      const cf = u.collectFund;
      if(cf === 'assoc' && !m.assocStartYear) return false;
      if(cf === 'death' && !m.deathStartYear) return false;
      if(!m.assocStartYear && !m.deathStartYear) return false;
      if(u.sector && m.sector !== u.sector) return false;
    }
    return true;
  }).map(m => {
    const full = computeMemberFull(m.id);
    return { m, rem: full?.total.totalRem || 0 };
  }).filter(x => x.rem > 0)
    .sort((a, b) => b.rem - a.rem);
  
  const total = list.reduce((s, x) => s + x.rem, 0);
  
  $('pg-late').innerHTML = `
    <div style="padding:20px;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border-radius:20px;margin-bottom:14px;text-align:center">
      <div style="font-size:12px;opacity:.9;font-weight:700">⚠️ إجمالي المتأخرات</div>
      <div style="font-size:34px;font-weight:800;margin-top:4px;font-family:'SF Mono',monospace;letter-spacing:-1px">${fmtNum(total)}</div>
      <div style="font-size:12px;opacity:.85;margin-top:2px">عدد: ${list.length} عضو</div>
    </div>
    
    ${list.length ? `
      <button class="btn success block" style="margin-bottom:12px" onclick="shareLatePayersToWA()">📱 إرسال قائمة للمراجعة</button>
      <div class="list">
        ${list.map(({ m, rem }) => `
          <div class="item" onclick="openQuickPaySheet(${m.id})">
            <div class="av red">⚠️</div>
            <div class="body">
              <div class="ttl">${esc(m.name)}</div>
              <div class="sub">${esc(m.sector||'')}</div>
            </div>
            <div style="font-weight:800;color:var(--death);font-size:14px;font-family:'SF Mono',monospace">${fmtNum(rem)}</div>
          </div>
        `).join('')}
      </div>
    ` : `
      <div class="empty">
        <span class="ico">🎉</span>
        <h3>لا يوجد متأخرون</h3>
        <p>ممتاز! الجميع سدَّد التزاماته</p>
      </div>
    `}
  `;
}

function shareLatePayersToWA(){
  const u = S.currentUser;
  const list = S.members.filter(m => {
    if(u.role === 'collector'){
      const cf = u.collectFund;
      if(cf === 'assoc' && !m.assocStartYear) return false;
      if(cf === 'death' && !m.deathStartYear) return false;
      if(u.sector && m.sector !== u.sector) return false;
    }
    return true;
  }).map(m => {
    const full = computeMemberFull(m.id);
    return { name: m.name, code: m.code || '', rem: full?.total.totalRem || 0 };
  }).filter(x => x.rem > 0).sort((a, b) => b.rem - a.rem);
  
  if(!list.length){ toast('لا يوجد متأخرون', 'success'); return; }
  
  let txt = `⏰ *قائمة المتأخرين — ${S.currentYear}*\n`;
  txt += `عدد: ${list.length}\n`;
  if(u.sector) txt += `📍 القطاع: ${u.sector}\n`;
  txt += `\n`;
  list.forEach((p, i) => {
    txt += `${i+1}. ${p.name}`;
    if(p.code) txt += ` (${p.code})`;
    txt += ` — ${fmtNum(p.rem)} ل.س\n`;
  });
  txt += `\n_صندوق زعورة_`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

/* ⭐⭐⭐ نموذج التسليم — مع الوصل ⭐⭐⭐ */
function openDeliverySheet(){

  if(u.collectFund === 'assoc') recipientRole = 'assocTreasurer';
  else if(u.collectFund === 'death') recipientRole = 'deathTreasurer';
  
  const recipients = S.users.filter(usr => {
    if(usr.id === u.id) return false;
    if(recipientRole && usr.role !== recipientRole) return false;
    return ['assocTreasurer', 'deathTreasurer'].includes(usr.role);
  });
  
  if(!recipients.length){

  const body = `

    </div>

        ${bd.assoc.rem > 0 ? `<option value="assoc">💰 جمعية (${fmtNum(bd.assoc.rem)})</option>` : ''}
        ${bd.death.rem > 0 ? `<option value="death">⚰️ وفاة (${fmtNum(bd.death.rem)})</option>` : ''}
        ${bd.donation.rem > 0 ? `<option value="donation">💚 تبرع (${fmtNum(bd.donation.rem)})</option>` : ''}
        ${bd.total.rem <= 0 ? '<option value="">لا يوجد متبقي</option>' : ''}
      </select>
    </div>
    
    <div class="fld">
      <label>أسلّم إلى <span class="req">*</span></label>
      <select id="delTo">
        ${recipients.map(r => `<option value="${r.id}">${ROLES[r.role].icon} ${esc(r.name)}</option>`).join('')}
      </select>

      <label>المبلغ <span class="req">*</span></label>
      <div class="amount-input">

        <span class="currency">ل.س</span>

      <label>ملاحظات</label>

  openSheet('📤 تسليم للأمين', body, foot, { focus:'delAmount' });
}

async function saveDelivery(){
  const u = S.currentUser;
  const fund = $('delFund').value;
  const toUserId = Number($('delTo').value);
  const amount = Number($('delAmount').value);
  const notes = cleanText($('delNotes').value);
  
  if(!fund){ toast('اختر الصندوق', 'error'); return; }
  if(!toUserId){ toast('اختر المستلم', 'error'); return; }
  if(!amount || amount <= 0){ toast('المبلغ مطلوب', 'error'); return; }
  
  const toUser = S.users.find(x => x.id === toUserId);
  if(!toUser) return;
  
  try {
    const delivery = {
      fromUserId: u.id,
      fromUserName: u.name,
      toUserId,
      toUserName: toUser.name,
      fund,
      amount,
      notes,
      date: today(),
      deliveryNumber: await generateDeliveryNumber(),
      createdAt: new Date().toISOString()
    };
    
    const id = await dbPut('deliveries', delivery);
    delivery.id = id;
    S.deliveries.push(delivery);
    
    CACHE.invalidateAll();
    await logAudit('add', 'delivery', id, { amount, to: toUser.name, fund });
    
    toast('📤 تم التسجيل', 'success', 2500);
    closeSheet();
    
    setTimeout(() => {
      if(confirm('📱 توثيق واتساب للأمين؟')){
        sendDeliveryNotification(id);
      }
    }, 400);
    
    go(S.page);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

async function generateDeliveryNumber(){
  const todayStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const todayCount = S.deliveries.filter(d => d.date === today()).length;
  return `D-${todayStr}-${String(todayCount + 1).padStart(3, '0')}`;
}

function sendDeliveryNotification(deliveryId){
  const d = S.deliveries.find(x => x.id === deliveryId);
  if(!d) return;
  
  const fundLabel = d.fund === 'assoc' ? '💰 الجمعية' : d.fund === 'death' ? '⚰️ الوفاة' : '💚 التبرعات';
  
  let txt = `📤 *توثيق تسليم*\n`;
  txt += `🏘️ صندوق زعورة\n`;
  txt += `━━━━━━━━━━━━━━\n\n`;
  txt += `🔢 رقم التسليم: *${d.deliveryNumber || '—'}*\n`;
  txt += `📅 ${fmtDate(d.date)}\n\n`;
  txt += `👤 من: ${d.fromUserName}\n`;
  txt += `👤 إلى: ${d.toUserName}\n\n`;
  txt += `📦 الصندوق: ${fundLabel}\n`;
  txt += `💰 المبلغ: *${fmtNum(d.amount)} ل.س*\n\n`;
  if(d.notes) txt += `📝 ${d.notes}\n\n`;
  txt += `⏳ *بانتظار تأكيد الاستلام*\n\n`;
  txt += `_صندوق زعورة_`;
  
  const phone = S.users.find(u => u.id === d.toUserId)?.phone;
  if(phone){
    const p = phone.replace(/^0/,'').replace(/^\+963/,'');
    if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
      window.location.href = `whatsapp://send?phone=963${p}&text=${encodeURIComponent(txt)}`;
    } else {
      window.open(`https://wa.me/963${p}?text=${encodeURIComponent(txt)}`, '_blank');
    }
  } else {
    window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
  }
}

                <div class="ttl">${esc(d.fromUserName || 'معتمد')}</div>

              </div>
              <div style="font-weight:800;color:var(--success);font-size:14px;font-family:'SF Mono',monospace">${fmtNum(d.amount)}</div>
            </div>
          `).join('')}
        </div>

async function receiveDelivery(id){
  const d = S.deliveries.find(x => x.id === id);
  if(!d){ toast('التسليم غير موجود', 'error'); return; }
  
  if(!confirm(`استلام ${fmtNum(d.amount)} ل.س من ${d.fromUserName}؟`)) return;
  
  try {
    d.toUserId = S.currentUser.id;
    d.toUserName = S.currentUser.name;
    d.receivedAt = new Date().toISOString();
    d.receivedBy = S.currentUser.name;
    await dbPut('deliveries', d);
    CACHE.invalidateAll();
    
    toast('✅ تم الاستلام', 'success', 2500);
    
    setTimeout(() => {
      if(confirm(`📱 إرسال تأكيد للأخ ${d.fromUserName}؟`)){
        sendConfirmationWA(id);
      }
    }, 400);
    
    renderInbox();
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

function sendConfirmationWA(id){
  const d = S.deliveries.find(x => x.id === id);
  if(!d) return;
  
  const fundLabel = d.fund === 'assoc' ? '💰 الجمعية' : d.fund === 'death' ? '⚰️ الوفاة' : '💚 التبرعات';
  const isReceived = !!d.receivedAt;
  
  let txt = isReceived
    ? `✅ *تأكيد استلام*\n`
    : `📤 *توثيق تسليم*\n`;
  
  txt += `🏘️ صندوق زعورة\n`;
  txt += `━━━━━━━━━━━━━━\n\n`;
  
  if(d.deliveryNumber) txt += `🔢 ${d.deliveryNumber}\n`;
  
  if(isReceived){
    txt += `الأخ ${d.fromUserName}،\n`;
    txt += `تم استلام تسليمكم بنجاح.\n\n`;
    txt += `📦 *التفاصيل:*\n`;
    txt += `• الصندوق: ${fundLabel}\n`;
    txt += `• المبلغ: ${fmtNum(d.amount)} ل.س\n`;
    txt += `• التاريخ: ${fmtDate(d.receivedAt)}\n`;
    txt += `• المستلم: ${S.currentUser.name}\n\n`;
    txt += `شكراً لجهودكم 🌹\n`;
  } else {
    txt += `من: ${d.fromUserName}\n`;
    txt += `إلى: ${d.toUserName}\n`;
    txt += `📦 ${fundLabel}\n`;
    txt += `💰 ${fmtNum(d.amount)} ل.س\n`;
    txt += `📅 ${fmtDate(d.date)}\n\n`;
  }
  
  txt += `_صندوق زعورة_`;
  
  const phone = S.users.find(u => u.id === d.fromUserId)?.phone;
  if(phone){
    const p = phone.replace(/^0/,'').replace(/^\+963/,'');
    if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
      window.location.href = `whatsapp://send?phone=963${p}&text=${encodeURIComponent(txt)}`;
    } else {
      window.open(`https://wa.me/963${p}?text=${encodeURIComponent(txt)}`, '_blank');
    }
  } else {
    window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
  }
}

async function rejectDelivery(id){
  const d = S.deliveries.find(x => x.id === id);
  if(!d) return;
  const reason = prompt('سبب الرفض؟');
  if(!reason) return;
  
  try {
    d.rejectedAt = new Date().toISOString();
    d.rejectedBy = S.currentUser.name;
    d.rejectReason = reason;
    await dbPut('deliveries', d);
    toast('❌ تم الرفض', 'warning', 2500);
    renderInbox();
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

async function editDeliveryAmount(id){
  const d = S.deliveries.find(x => x.id === id);
  if(!d) return;
  const newAmount = prompt('المبلغ الجديد:', d.amount);
  if(newAmount === null) return;
  const n = Number(newAmount);
  if(isNaN(n) || n <= 0){ toast('قيمة غير صحيحة', 'error'); return; }
  d.amount = n;
  d.editedAt = new Date().toISOString();
  d.editedBy = S.currentUser.name;
  await dbPut('deliveries', d);
  CACHE.invalidateAll();
  toast('✅ تم التعديل');
  closeSheet();
  setTimeout(() => go(S.page), 200);
}

async function reverseDelivery(id){
  if(!confirm('عكس الاستلام؟ التسليم سيعود معلّقاً.')) return;
  const d = S.deliveries.find(x => x.id === id);
  if(!d) return;
  delete d.receivedAt;
  delete d.receivedBy;
  d.reversedAt = new Date().toISOString();
  d.reversedBy = S.currentUser.name;
  await dbPut('deliveries', d);
  CACHE.invalidateAll();
  toast('↩️ تم العكس');
  closeSheet();
  setTimeout(() => go(S.page), 200);
}

async function deleteDeliveryRecord(id){
  if(!confirm('⚠️ حذف التسليم نهائياً؟')) return;
  if(!confirm('تأكيد أخير!')) return;
  await dbDel('deliveries', id);
  S.deliveries = S.deliveries.filter(x => x.id !== id);
  CACHE.invalidateAll();
  toast('🗑️ تم الحذف');
  closeSheet();
  setTimeout(() => go(S.page), 200);
}

function performQuickSearch(q){
  const container = $('quickSearchResults');
  if(!container) return;
  const u = S.currentUser;
  
  if(!q || q.length < 1){
    container.innerHTML = `<div style="text-align:center;padding:30px;color:var(--muted)"><div style="font-size:44px;opacity:.4">🔍</div><div style="font-weight:700;margin-top:10px">ابدأ الكتابة</div></div>`;
    return;
  }
  
  const s = normAr(q);
  
  let list = S.members.filter(m => {
    if(u.role === 'collector'){
      const cf = u.collectFund;
      if(cf === 'assoc' && !m.assocStartYear) return false;
      if(cf === 'death' && !m.deathStartYear) return false;
      if(!m.assocStartYear && !m.deathStartYear) return false;
      if(u.sector && m.sector !== u.sector) return false;
    }
    if(u.role === 'assocTreasurer' && !m.assocStartYear) return false;
    if(u.role === 'deathTreasurer' && !m.deathStartYear) return false;
    return true;
  });
  
  list = list.filter(m =>
    normAr(`${m.name} ${m.code||''} ${m.phone||''} ${m.familyCode||''} ${m.sector||''}`).includes(s)
  );
  
  list.sort((a, b) => {
    const fa = computeMemberFull(a.id);
    const fb = computeMemberFull(b.id);
    const ra = fa?.total.totalRem || 0;
    const rb = fb?.total.totalRem || 0;
    if(ra !== rb) return rb - ra;
    return String(a.name).localeCompare(String(b.name), 'ar');
  });
  
  if(!list.length){
    container.innerHTML = `<div class="empty"><span class="ico">🔍</span><h3>لا نتائج</h3><p>جرّب اسماً آخر</p></div>`;
    return;
  }
  
  container.innerHTML = `
    <div style="font-size:12px;color:var(--muted);padding:8px 0;font-weight:700">📊 ${list.length} نتيجة</div>
    <div class="list">
      ${list.slice(0, 100).map(m => {
        const full = computeMemberFull(m.id);
        const rem = full?.total.totalRem || 0;
        const hasUnpaid = rem > 0;
        const icons = [];
        if(m.assocStartYear) icons.push('💰');
        if(m.deathStartYear) icons.push('⚰️');
        
        return `
          <div class="item" onclick="closeSheet();setTimeout(()=>openQuickPaySheet(${m.id}),150)">
            <div class="av ${hasUnpaid ? 'red' : 'green'}">${icons.join('') || '⭐'}</div>
            <div class="body">
              <div class="ttl">${esc(m.name)}</div>
              <div class="sub">${esc(m.code||'')} • ${esc(m.sector||'')}</div>
            </div>
            <div style="text-align:left">
              ${hasUnpaid
                ? `<div style="font-weight:800;color:var(--death);font-size:13px;font-family:'SF Mono',monospace">${fmtShort(rem)}</div>
                   <div style="font-size:10px;color:var(--muted)">متبقي</div>`
                : `<div style="color:var(--success);font-size:16px">✅</div>`}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/* 🎨 بطاقة الصندوق */
function renderFundCard(fund, data){
  const name = fund === 'assoc' ? 'الجمعية' : fund === 'death' ? 'الوفاة' : 'التبرعات';
  const icon = fund === 'assoc' ? '💰' : fund === 'death' ? '⚰️' : '💚';
  const accent = fund === 'assoc' ? '#3b82f6' : fund === 'death' ? '#ef4444' : '#10b981';
  const accentLight = fund === 'assoc' ? '#eff6ff' : fund === 'death' ? '#fef2f2' : '#ecfdf5';
  
  const totalCollected = (data.collected || 0) + (data.incomes || 0);
  
  let details = '';
  if(fund === 'death'){
    details = `
      <span>📥 ${fmtShort(totalCollected)}</span>
      <span>📤 ${fmtShort(data.compensations)}</span>
      <span>🏦 ${fmtShort(data.opening)}</span>
    `;
  } else {
    details = `
      <span>📥 ${fmtShort(totalCollected)}</span>
      <span>💸 ${fmtShort(data.expenses)}</span>
      <span>🏦 ${fmtShort(data.opening)}</span>
    `;
  }
  
  return `
    <div onclick="openFundLedgerSheet('${fund}')" style="
      background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;
      cursor:pointer;border:1.5px solid ${accent};display:flex;align-items:stretch;
      gap:12px;transition:transform .15s;box-shadow:0 1px 3px rgba(15,23,42,.04);
    ">
      <div style="width:44px;height:44px;background:${accentLight};border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;align-self:center">
        ${icon}
      </div>
      <div style="flex:1;min-width:0;text-align:left">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <div style="font-size:12px;font-weight:700;color:${accent}">${name}</div>
          <div style="font-size:14px;color:var(--muted-2)">›</div>
        </div>
        <div style="display:flex;align-items:baseline;gap:4px;margin-bottom:8px;justify-content:flex-end;direction:rtl">
          <span style="font-size:22px;font-weight:800;color:${accent};line-height:1;letter-spacing:-.5px;font-family:'SF Mono',monospace">${fmtNum(data.balance)}</span>
          <span style="font-size:10px;color:${accent};opacity:.7;font-weight:700">ل.س</span>
        </div>
        <div style="display:flex;gap:14px;font-size:11px;justify-content:flex-end;color:var(--muted);padding-top:8px;border-top:1px solid ${accentLight}">
          ${details}
        </div>
      </div>
    </div>
  `;
}

async function saveOpeningBalanceFromForm(){
  const data = {
    assoc: Number($('obAssoc').value) || 0,
    death: Number($('obDeath').value) || 0,
    donation: Number($('obDonation').value) || 0
  };
  
  try {
    let existing = S.constants.find(x => x.year === 0);
    const obj = { year: 0, ...data, note: 'رصيد افتتاحي قبل 2025' };
    
    if(existing){
      obj.id = existing.id;
      await dbPut('constants', obj);
      const i = S.constants.findIndex(x => x.year === 0);
      S.constants[i] = obj;
    } else {
      const id = await dbPut('constants', obj);
      obj.id = id;
      S.constants.push(obj);
    }
    
    CACHE.invalidateAll();
    toast('✅ تم الحفظ', 'success', 2500);
    closeSheet();
    go(S.page);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

/* ⭐ تفاصيل محصّل */
function openCollectorDetailSheet(key, year){
  const y = year || S.currentYear;
  
  let targetUser = null, targetName = '';
  if(key.startsWith('id:')){
    targetUser = S.users.find(u => u.id === Number(key.slice(3)));
  } else {
    targetName = key.slice(5);
  }
  
  const matchPayment = p => {
    const py = Number(p.forYear) || Number(p.year);
    if(py !== y) return false;
    if(targetUser){
      if(p.collectorId === targetUser.id) return true;
      if(!p.collectorId && p.collectorName) return normAr(p.collectorName) === normAr(targetUser.name);
      return false;
    }
    if(p.collectorId) return false;
    return normAr(p.collectorName || '') === normAr(targetName);
  };
  
  const matchDelivery = d => {
    if(!d.date) return false;
    const dy = new Date(d.date).getFullYear();
    if(dy !== y) return false;
    if(targetUser){
      if(d.fromUserId === targetUser.id) return true;
      if(!d.fromUserId && d.fromUserName) return normAr(d.fromUserName) === normAr(targetUser.name);
      return false;
    }
    if(d.fromUserId) return false;
    return normAr(d.fromUserName || '') === normAr(targetName);
  };
  
  const payments = S.payments.filter(matchPayment).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const deliveries = S.deliveries.filter(matchDelivery).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  
  const displayName = targetUser ? targetUser.name : (payments[0]?.collectorName || targetName || 'غير محدد');
  const roleName = targetUser ? (ROLES[targetUser.role]?.name || '') : '';
  
  const sum = arr => arr.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const byFund = fund => {
    const p = sum(payments.filter(x => x.fund === fund));
    const d = sum(deliveries.filter(x => x.fund === fund && x.receivedAt));
    const pend = sum(deliveries.filter(x => x.fund === fund && !x.receivedAt && !x.rejectedAt));
    return { collected: p, delivered: d, pending: pend };
  };
  
  const assoc = byFund('assoc');
  const death = byFund('death');
  const donation = byFund('donation');
  const totalCollected = assoc.collected + death.collected + donation.collected;
  const totalDelivered = assoc.delivered + death.delivered + donation.delivered;
  const totalPending = assoc.pending + death.pending + donation.pending;
  
  const isManager = S.currentUser.role === 'manager';

      <div style="font-weight:800;font-size:17px;margin-top:6px">${esc(displayName)}</div>
      ${roleName ? `<div style="font-size:12px;opacity:.9;margin-top:3px">${roleName}</div>` : ''}
      <div style="font-size:11px;opacity:.85;margin-top:6px">📅 سنة ${y}</div>
    </div>
    
    <div style="padding:14px;background:var(--bg);border-radius:12px;margin-bottom:14px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div style="text-align:center;padding:10px;background:var(--card);border-radius:10px">
          <div style="font-size:11px;color:var(--muted)">📥 حصّل</div>
          <div style="font-size:16px;font-weight:800;color:var(--success);font-family:'SF Mono',monospace">${fmtNum(totalCollected)}</div>
        </div>
        <div style="text-align:center;padding:10px;background:var(--card);border-radius:10px">
          <div style="font-size:11px;color:var(--muted)">✅ استُلم</div>
          <div style="font-size:16px;font-weight:800;color:var(--assoc);font-family:'SF Mono',monospace">${fmtNum(totalDelivered)}</div>
        </div>
      </div>
      ${totalPending > 0 ? `
        <div style="text-align:center;padding:10px;background:var(--warning-soft);border-radius:10px">
          <div style="font-size:11px;color:#92400e">⏳ معلّق</div>
          <div style="font-size:18px;font-weight:800;color:var(--warning);font-family:'SF Mono',monospace">${fmtNum(totalPending)}</div>
        </div>
      ` : `

          ✅ كل التسليمات مؤكدة

    ${assoc.collected > 0 ? `
      <div class="balance-block" style="border-right:4px solid var(--assoc)">
        <div style="font-weight:800;color:var(--assoc);margin-bottom:8px">💰 الجمعية</div>

function buildAnnualReport(year){
  const y = year || S.currentYear;
  
  const membersStats = {
    total: S.members.length,
    activeAssoc: 0, activeDeath: 0, activeBoth: 0,
    newThisYear: 0, withdrawnThisYear: 0,
    frozenThisYear: 0, deceasedThisYear: 0
  };
  
  S.members.forEach(m => {
    const st = m.memberStatus || 'نشط';
    const hasAssoc = m.assocStartYear && m.assocStartYear <= y && !m.assocExempt;
    const hasDeath = m.deathStartYear && m.deathStartYear <= y && !m.deathExempt;
    
    if(st !== 'منسحب' && st !== 'متوقف' && st !== 'متوفى'){
      if(hasAssoc && hasDeath) membersStats.activeBoth++;
      else if(hasAssoc) membersStats.activeAssoc++;
      else if(hasDeath) membersStats.activeDeath++;
    }
    
    if(m.assocStartYear === y || m.deathStartYear === y) membersStats.newThisYear++;
    if(st === 'منسحب' && m.stopYear === y) membersStats.withdrawnThisYear++;
    if(st === 'متوقف' && m.stopYear === y) membersStats.frozenThisYear++;
    if(st === 'متوفى' && m.deathDate){
      const dy = new Date(m.deathDate).getFullYear();
      if(dy === y) membersStats.deceasedThisYear++;
    }
  });
  
  const sum = arr => arr.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  
  const assoc = getFundYears('assoc').years.find(v => v.year === y);
  const death = getFundYears('death').years.find(v => v.year === y);
  const donation = getFundYears('donation').years.find(v => v.year === y);
  
  const opening = getOpeningBalance();
  
  return {
    year: y,
    membersStats,
    opening: { assoc: opening.assoc || 0, death: opening.death || 0, donation: opening.donation || 0 },
    assoc: assoc || { collected: 0, incomes: 0, expenses: 0, net: 0, cumulative: opening.assoc || 0 },
    death: death || { collected: 0, incomes: 0, expenses: 0, compensations: 0, net: 0, cumulative: opening.death || 0 },
    donation: donation || { collected: 0, incomes: 0, expenses: 0, net: 0, cumulative: opening.donation || 0 },
    deaths: {
      count: S.deaths.filter(d => Number(d.year) === y).length,
      list: S.deaths.filter(d => Number(d.year) === y),
      totalComp: S.deaths.filter(d => Number(d.year) === y).reduce((s, d) => s + (Number(d.compensation) || 0), 0)
    },
    collectors: getAllCollectors(y).filter(c => c.total.collected > 0).slice(0, 10)
  };
}

  txt += `📥 محصّل: ${fmtNum(r.assoc.collected)}\n`;

    txt += `━━━━━━━━━━━━━━━\n💚 *التبرعات*\n━━━━━━━━━━━━━━━\n`;

    txt += `💵 *الرصيد: ${fmtNum(r.donation.cumulative)}*\n\n`;
  }

  txt += `\n_صندوق زعورة_`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');

function openLatePayersReport(){
  const y = S.currentYear;
  const list = S.members.map(m => {
    const full = computeMemberFull(m.id);
    return { m, rem: full?.total.totalRem || 0 };
  }).filter(x => x.rem > 0).sort((a, b) => b.rem - a.rem);
  
  const total = list.reduce((s, x) => s + x.rem, 0);

      ${list.slice(0, 200).map(({ m, rem }) => `

      `).join('')}
    </div>
  ` : '<div class="empty"><span class="ico">🎉</span><h3>لا يوجد متأخرون</h3></div>';

function shareLatePayersReportWA(year){
  const y = year || S.currentYear;
  const list = S.members.map(m => {
    const full = computeMemberFull(m.id);
    return { name: m.name, code: m.code || '', rem: full?.total.totalRem || 0 };
  }).filter(x => x.rem > 0).sort((a, b) => b.rem - a.rem);
  
  if(!list.length){ toast('لا يوجد متأخرون', 'success'); return; }
  
  let txt = `⏰ *قائمة المتأخرين — ${y}*\nعدد: ${list.length}\n\n`;
  list.forEach((p, i) => {
    txt += `${i+1}. ${p.name}`;
    if(p.code) txt += ` (${p.code})`;
    txt += ` — ${fmtNum(p.rem)}\n`;
  });
  txt += `\n_صندوق زعورة_`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

function openFamilyReport(){
  const families = {};
  S.members.forEach(m => {
    const key = m.familyCode || 'بدون كود';
    if(!families[key]) families[key] = { code: key, members: [] };
    families[key].members.push(m);
  });
  
  for(const key in families){
    const f = families[key];
    f.totalPaid = 0; f.totalRem = 0;
    f.members.forEach(m => {
      const full = computeMemberFull(m.id);
      if(full){
        f.totalPaid += full.total.totalPaid;
        f.totalRem += full.total.totalRem;
      }
    });
  }
  
  const list = Object.values(families).sort((a, b) => b.members.length - a.members.length);
  
  const body = `<div class="list">
    ${list.map(f => `
      <div class="item" onclick="openFamilyDetail('${esc(f.code).replace(/'/g,"\\'")}')">
        <div class="av">👨‍👩‍👧</div>
        <div class="body">
          <div class="ttl">عائلة ${esc(f.code)} <span class="badge primary">${f.members.length}</span></div>
          <div class="sub">دُفع ${fmtShort(f.totalPaid)}${f.totalRem > 0 ? ' • متبقي ' + fmtShort(f.totalRem) : ' • ✅'}</div>
        </div>
        <span class="trail">›</span>
      </div>
    `).join('')}
  </div>`;
  
  openSheet('👨‍👩‍👧 العائلات', body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide: true });
}

function openFamilyDetail(familyCode){
  const members = S.members.filter(m => (m.familyCode || 'بدون كود') === familyCode);
  if(!members.length) return;
  
  let totalPaid = 0, totalReq = 0, totalRem = 0;
  members.forEach(m => {
    const full = computeMemberFull(m.id);
    if(full){
      totalPaid += full.total.totalPaid;
      totalReq += full.total.totalReq;
      totalRem += full.total.totalRem;
    }
  });
  
  const body = `
    <div style="padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:14px;margin-bottom:14px;text-align:center">
      <div style="font-size:28px">👨‍👩‍👧</div>
      <div style="font-weight:800;font-size:16px;margin-top:6px">عائلة ${esc(familyCode)}</div>
      <div style="font-size:12px;opacity:.9;margin-top:4px">${members.length} عضو</div>
    </div>
    
    <div class="balance-block">
      <div class="balance-row"><span class="lbl">إجمالي المطلوب</span><span class="val">${fmtNum(totalReq)}</span></div>
      <div class="balance-row"><span class="lbl">إجمالي المدفوع</span><span class="val green">${fmtNum(totalPaid)}</span></div>
      <div class="balance-row" style="border-top:2px solid var(--primary);padding-top:8px">
        <span style="font-weight:800">المتبقي</span>
        <span class="val" style="color:${totalRem > 0 ? 'var(--death)' : 'var(--success)'};font-size:15px">${fmtNum(totalRem)}</span>
      </div>
    </div>
    
    <div class="list">
      ${members.map(m => {
        const full = computeMemberFull(m.id);
        const rem = full?.total.totalRem || 0;
        const icons = [];
        if(m.assocStartYear) icons.push('💰');
        if(m.deathStartYear) icons.push('⚰️');
        return `
          <div class="item" onclick="closeSheet();setTimeout(()=>openMemberDetail(${m.id}),150)">
            <div class="av ${rem > 0 ? 'red' : 'green'}">${icons.join('') || '👤'}</div>

              <div class="ttl">${esc(m.name)}</div>
              <div class="sub">${esc(m.relation||'')}</div>
            </div>
            <div style="text-align:left">
              ${rem > 0 ? `<div style="font-weight:800;color:var(--death);font-size:12px;font-family:'SF Mono',monospace">${fmtShort(rem)}</div>` : '<div style="color:var(--success);font-size:14px">✅</div>'}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
  
  openSheet('👨‍👩‍👧 عائلة ' + familyCode, body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide: true });
}

function getAllLogs(filters){
  filters = filters || {};
  const y = filters.year || 'all';
  const fund = filters.fund || 'all';
  const type = filters.type || 'all';
  const logs = [];
  
  if(type === 'all' || type === 'payment'){
    S.payments.forEach(p => {
      const py = Number(p.forYear) || Number(p.year);
      if(y !== 'all' && py !== y) return;
      if(fund !== 'all' && p.fund !== fund) return;
      const m = p.memberId ? getMemberById(p.memberId) : null;
      logs.push({
        id: 'p_' + p.id, type: 'payment',
        icon: p.fund === 'assoc' ? '💰' : p.fund === 'death' ? '⚰️' : '💚',
        color: p.fund === 'assoc' ? 'blue' : p.fund === 'death' ? 'red' : 'green',
        title: m?.name || p.notes || 'دفعة',
        subtitle: (p.fund === 'assoc' ? 'دفعة جمعية' : p.fund === 'death' ? 'دفعة وفاة' : 'تبرع') + (p.collectorName ? ' • ' + p.collectorName : ''),
        amount: Number(p.amount) || 0, positive: true,
        date: p.date, year: py, fund: p.fund,
        source: p.imported ? 'imported' : 'manual',
        details: () => openPaymentDetail(p.id)
      });
    });
  }
  
  if(type === 'all' || type === 'income'){
    S.incomes.forEach(i => {
      if(y !== 'all' && Number(i.year) !== y) return;
      if(fund !== 'all' && i.fund !== fund) return;
      logs.push({
        id: 'i_' + i.id, type: 'income', icon: '📥', color: 'green',
        title: i.notes || i.category || 'إيراد',
        subtitle: (i.category || 'إيراد') + (i.recordedByName ? ' • ' + i.recordedByName : ''),
        amount: Number(i.amount) || 0, positive: true,
        date: i.date, year: Number(i.year), fund: i.fund,
        source: i.imported ? 'imported' : 'manual',
        details: () => openIncomeSheetFor(i.fund, i.id)
      });
    });
  }
  
  if(type === 'all' || type === 'expense'){
    S.expenses.forEach(e => {
      if(y !== 'all' && Number(e.year) !== y) return;
      if(fund !== 'all' && e.fund !== fund) return;
      logs.push({
        id: 'e_' + e.id, type: 'expense', icon: '💸', color: 'red',
        title: e.description,
        subtitle: (e.category || 'مصروف') + (e.recordedByName ? ' • ' + e.recordedByName : ''),
        amount: Number(e.amount) || 0, positive: false,
        date: e.date, year: Number(e.year), fund: e.fund,
        source: e.imported ? 'imported' : 'manual',
        details: () => openExpenseSheetFor(e.fund, e.id)
      });
    });
  }
  
  if(type === 'all' || type === 'death'){
    S.deaths.forEach(d => {
      if(y !== 'all' && Number(d.year) !== y) return;
      if(fund !== 'all' && fund !== 'death') return;
      logs.push({
        id: 'd_' + d.id, type: 'death', icon: '📤', color: 'red',
        title: 'تعويض ' + (d.deceasedName || ''),
        subtitle: d.recipient ? 'استلم: ' + d.recipient : 'وفاة',
        amount: Number(d.compensation) || 0, positive: false,
        date: d.deathDate, year: Number(d.year), fund: 'death',
        source: d.imported ? 'imported' : 'manual',
        details: () => openDeathDetail(d.id)
      });
    });
  }
  
  if(type === 'all' || type === 'delivery'){
    S.deliveries.forEach(d => {
      if(y !== 'all'){
        const dy = d.date ? new Date(d.date).getFullYear() : null;
        if(dy !== y) return;
      }
      if(fund !== 'all' && d.fund !== fund) return;
      logs.push({
        id: 'dv_' + d.id, type: 'delivery',
        icon: d.receivedAt ? '✅' : '⏳',
        color: d.receivedAt ? 'green' : 'orange',
        title: (d.fromUserName || '') + ' ← ' + (d.toUserName || ''),
        subtitle: 'تسليم ' + (d.fund === 'assoc' ? 'جمعية' : d.fund === 'death' ? 'وفاة' : 'تبرع'),
        amount: Number(d.amount) || 0, positive: true,
        date: d.date, year: d.date ? new Date(d.date).getFullYear() : null,
        fund: d.fund,
        source: d.imported ? 'imported' : 'manual',
        details: () => openDeliveryDetail(d.id)
      });
    });
  }
  
  logs.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return logs;
}

function renderLogsPage(){
  const filters = S.filters.logs;
  const logs = getAllLogs(filters);
  
  let totalIn = 0, totalOut = 0;
  logs.forEach(l => {
    if(l.positive) totalIn += l.amount;
    else totalOut += l.amount;
  });
  
  let displayed = logs;
  if(S.search){
    const s = normAr(S.search);
    displayed = logs.filter(l => normAr(l.title + ' ' + l.subtitle).includes(s));
  }
  
  const years = [2025, 2026, 2027, 2028, 2029];
  
  $('pg-logs').innerHTML = `
    <div class="stats-scroll">
      <div class="stat green"><div class="val">${fmtShort(totalIn)}</div><div class="lbl">📥 واردات</div></div>
      <div class="stat red"><div class="val">${fmtShort(totalOut)}</div><div class="lbl">📤 صادرات</div></div>
      <div class="stat"><div class="val">${logs.length}</div><div class="lbl">📋 عدد السجلات</div></div>
      <div class="stat blue"><div class="val">${fmtShort(totalIn - totalOut)}</div><div class="lbl">📊 الصافي</div></div>
    </div>
    
    <div class="card" style="padding:10px">

      <div class="chips" style="margin-bottom:10px">
        <button class="chip ${filters.year === 'all' ? 'on' : ''}" onclick="setLogFilter('year','all')">الكل</button>
        ${years.map(yy => `<button class="chip ${filters.year === yy ? 'on' : ''}" onclick="setLogFilter('year',${yy})">${yy}</button>`).join('')}

        <button class="chip ${filters.fund === 'assoc' ? 'on' : ''}" onclick="setLogFilter('fund','assoc')">💰 الجمعية</button>
        <button class="chip ${filters.fund === 'death' ? 'on' : ''}" onclick="setLogFilter('fund','death')">⚰️ الوفاة</button>
        <button class="chip ${filters.fund === 'donation' ? 'on' : ''}" onclick="setLogFilter('fund','donation')">💚 التبرعات</button>
      </div>
      
      <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px">📋 النوع</div>
      <div class="chips" style="margin-bottom:0">
        <button class="chip ${filters.type === 'all' ? 'on' : ''}" onclick="setLogFilter('type','all')">الكل</button>
        <button class="chip ${filters.type === 'payment' ? 'on' : ''}" onclick="setLogFilter('type','payment')">💰 دفعات</button>
        <button class="chip ${filters.type === 'income' ? 'on' : ''}" onclick="setLogFilter('type','income')">📥 إيرادات</button>
        <button class="chip ${filters.type === 'expense' ? 'on' : ''}" onclick="setLogFilter('type','expense')">💸 مصاريف</button>
        <button class="chip ${filters.type === 'death' ? 'on' : ''}" onclick="setLogFilter('type','death')">📤 تعويضات</button>
        <button class="chip ${filters.type === 'delivery' ? 'on' : ''}" onclick="setLogFilter('type','delivery')">📤 تسليمات</button>
      </div>
    </div>
    
    ${displayed.length ? `<div class="list">
      ${displayed.slice(0, 500).map(l => `
        <div class="item" onclick="openLogDetail('${l.id}')">
          <div class="av ${l.color}">${l.icon}</div>
          <div class="body">
            <div class="ttl">
              ${esc(l.title)}
              ${l.source === 'imported' ? '<span class="badge muted" style="font-size:9px">📥</span>' : ''}
            </div>
            <div class="sub">${fmtDate(l.date)} • ${esc(l.subtitle)}</div>
          </div>
          <div style="text-align:left">
            <div style="font-weight:800;font-size:13px;color:${l.positive ? 'var(--success)' : 'var(--death)'};font-family:'SF Mono',monospace">
              ${l.positive ? '+' : '-'}${fmtShort(l.amount)}
            </div>
            <div style="font-size:10px;color:var(--muted-2)">${l.year || '—'}</div>
          </div>
        </div>
      `).join('')}
    </div>` : `<div class="empty"><span class="ico">📋</span><h3>لا سجلات</h3><p>جرّب فلاتر أخرى</p></div>`}
  `;
}

function setLogFilter(key, value){
  S.filters.logs[key] = value;
  renderLogsPage();
}

function openLogDetail(logId){
  const filters = S.filters.logs;
  const logs = getAllLogs(filters);
  const log = logs.find(l => l.id === logId);
  if(!log || !log.details) return;
  log.details();
}

function toggleUserRoleFieldsNew(){

  $('collectorFieldsNew').style.display = role === 'collector' ? 'block' : 'none';
  $('memberLinkFieldsNew').style.display = role === 'member' ? 'block' : 'none';
}

async function saveUserNew(id){
  const name = cleanText($('uName').value);
  const pin = $('uPin').value.trim();
  if(!name){ toast('الاسم مطلوب', 'error'); return; }
  if(pin && !/^\d{4}$/.test(pin)){ toast('كلمة المرور: 4 أرقام', 'error'); return; }
  
  const role = $('uRole').value;
  const collectFund = role === 'collector' ? ($('uCollectFund')?.value || 'both') : null;
  const sector = role === 'collector' ? ($('uSector')?.value || '') : '';
  const memberId = role === 'member' ? (Number($('uMemberId')?.value) || null) : null;
  
  if(role === 'member' && !memberId){ toast('اربط المشترك بعضو', 'error'); return; }
  
  try {
    const old = id ? await dbGet('users', id) : null;
    const obj = {
      name,
      phone: cleanPhone($('uPhone').value),
      role, collectFund, sector, memberId,
      hasPin: pin ? true : (old ? old.hasPin : false),
      pin: pin ? pin : (old ? old.pin : null),
      createdAt: old ? old.createdAt : new Date().toISOString()
    };
    
    if(id){
      obj.id = id;
      await dbPut('users', obj);
      const i = S.users.findIndex(x => x.id === id);
      if(i > -1) S.users[i] = obj;
      if(S.currentUser && S.currentUser.id === id) S.currentUser = obj;
    } else {
      const newId = await dbPut('users', obj);
      obj.id = newId;
      S.users.push(obj);
    }
    
    toast('✅');
    closeSheet();
    go(S.page);
  } catch(e){
    toast('خطأ', 'error');
  }
}

async function deleteUserNew(id){
  if(!confirm('حذف المستخدم؟')) return;
  const u = S.users.find(x => x.id === id);
  if(u.role === 'manager' && S.users.filter(x => x.role === 'manager').length <= 1){

    S.users = S.users.filter(x => x.id !== id);

    closeSheet();
    go(S.page);
  } catch(e){
    toast('خطأ', 'error');

/* 🔑 الدخول كمستخدم آخر */
function impersonateUser(userId){
  if(S.currentUser.role !== 'manager'){
    toast('هذه الميزة للمدير فقط', 'error');
    return;
  }
  
  const target = S.users.find(u => u.id === userId);
  if(!target){ toast('المستخدم غير موجود', 'error'); return; }
  
  if(!confirm(`🔑 الدخول بحساب "${target.name}"؟\n\nسترى التطبيق كما يراه هو.`)) return;
  
  localStorage.setItem('zt_impersonator', JSON.stringify({
    id: S.currentUser.id,
    name: S.currentUser.name,
    role: S.currentUser.role
  }));
  
  S.currentUser = target;
  localStorage.setItem('zt_user', JSON.stringify({
    id: target.id, name: target.name, role: target.role
  }));
  
  closeSheet();
  toast(`🔑 أنت الآن "${target.name}"`, 'info', 3000);
  setTimeout(() => showMain(), 200);
}

function returnToManager(){
  const saved = localStorage.getItem('zt_impersonator');
  if(!saved){ toast('لا يوجد حساب محفوظ', 'error'); return; }
  
  const data = JSON.parse(saved);
  const manager = S.users.find(u => u.id === data.id);
  if(!manager){ toast('المدير غير موجود', 'error'); return; }
  
  S.currentUser = manager;
  localStorage.setItem('zt_user', JSON.stringify({
    id: manager.id, name: manager.name, role: manager.role
  }));
  localStorage.removeItem('zt_impersonator');
  
  toast('🔙 رجعت لحسابك', 'success', 2500);
  setTimeout(() => showMain(), 200);
}

const _origShowMainImpersonate = showMain;

async function saveConstantNew(year){
  try {
    const obj = {
      year,
      assocYearly: Number($('cAssocY').value) || 0,
      assocYearlyReduced: Number($('cAssocYR').value) || 0,
      deathInstallment: Number($('cDeathInst').value) || 0,
      deathCompensation: Number($('cDeathComp').value) || 0,
      joinAssocFee: Number($('cJoinA').value) || 0,
      joinAssocFeeReduced: Number($('cJoinAR').value) || 0,
      joinDeathFee: Number($('cJoinD').value) || 0,
      joinDeathFeeReduced: Number($('cJoinDR').value) || 0
    };
    
    const existing = S.constants.find(x => x.year === year);
    if(existing){
      obj.id = existing.id;
      await dbPut('constants', obj);
      const i = S.constants.findIndex(x => x.year === year);
      if(i > -1) S.constants[i] = obj;
    } else {
      const newId = await dbPut('constants', obj);
      obj.id = newId;
      S.constants.push(obj);
    }
    
    CACHE.invalidateAll();
    await logAudit('update', 'constant', year, obj);
    toast('✅ تم الحفظ');
    closeSheet();
    go(S.page);
  } catch(e){ toast('خطأ', 'error'); }
}

async function saveCustomFieldNew(idx){
  const label = cleanText($('cfLabel').value);
  const key = cleanText($('cfKey').value).replace(/[^a-zA-Z0-9]/g, '');
  if(!label){ toast('الاسم مطلوب', 'error'); return; }
  if(!key){ toast('المفتاح مطلوب', 'error'); return; }
  
  const icon = cleanText($('cfIcon').value) || '📌';
  const hint = cleanText($('cfHint').value);
  const required = $('cfRequired').checked;
  const target = $('cfTarget').value;
  const fieldType = $('cfFieldType').value;
  
  const dup = S.customFields.some((c, i) => c.key === key && (c.target || 'members') === target && i !== idx);
  if(dup){ toast('المفتاح مستخدم', 'error'); return; }
  
  try {
    const obj = { icon, label, key, hint, required, target, fieldType, order: 100 };
    
    if(idx !== null && idx !== undefined){
      obj.id = S.customFields[idx]?.id;
      await dbPut('customFields', obj);
      S.customFields[idx] = obj;
    } else {
      const newId = await dbPut('customFields', obj);
      obj.id = newId;
      S.customFields.push(obj);
    }
    
    toast('✅ تم الحفظ');
    closeSheet();
    setTimeout(openCustomFieldsSheetNew, 200);
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function deleteCustomFieldNew(idx){
  const cf = S.customFields[idx];
  if(!cf) return;
  
  if(!confirm(`حذف حقل "${cf.label}"؟`)) return;
  
  try {
    if(cf.id) await dbDel('customFields', cf.id);
    S.customFields.splice(idx, 1);
    toast('🗑️');
    closeSheet();
    setTimeout(openCustomFieldsSheetNew, 200);
  } catch(e){ toast('خطأ', 'error'); }
}

async function importMembersNew(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';
  
  showLoad(true);
  const log = $('importLogNew');
  log.innerHTML = '<div style="color:var(--muted)">⏳ جاري القراءة...</div>';
  
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });
    
    if(!rows.length){ log.innerHTML = '<div style="color:var(--danger)">❌ الملف فارغ</div>'; showLoad(false); return; }
    
    let added = 0, updated = 0, skip = 0;
    const tc = { both:0, assoc:0, death:0, none:0, unknown:0 };
    const statusCounts = { 'نشط':0, 'منسحب':0, 'متوقف':0, 'معفى':0, 'متوفى':0 };
    
    const existing = new Map();
    S.members.forEach(m => {
      if(m.code) existing.set(String(m.code), m);
      existing.set(normAr(m.name), m);
    });
    
    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const name = cleanText(gv(r, 'الاسم الثلاثي','الاسم_الثلاثي','الاسم'));
      if(!name){ skip++; continue; }
      
      const code = cleanText(gv(r, 'رقم الفرد','رقم_الفرد','الكود','كود العضو'));
      const subDate = toDate(gv(r, 'تاريخ الاشتراك','تاريخ_الاشتراك','تاريخ الانضمام'));
      const subYear = subDate ? new Date(subDate).getFullYear() : null;
      
      const subTypeRaw = gv(r, 'نوع الاشتراك','نوع_الاشتراك');
      const subType = normAr(subTypeRaw || '');
      const subTypeDefined = subType.length > 0;
      
      const hasAssocWord = /جمعي/.test(subType);
      const hasDeathWord = /وفا/.test(subType);
      const isBoth = subType.includes('كلاهما') || subType === 'كلا' || (hasAssocWord && hasDeathWord);
      const isNone = subType.includes('غير') && subType.includes('مشترك');
      
      let hasAssoc = false, hasDeath = false;
      if(isNone){ tc.none++; }
      else if(isBoth){ hasAssoc = true; hasDeath = true; tc.both++; }
      else if(hasAssocWord){ hasAssoc = true; tc.assoc++; }
      else if(hasDeathWord){ hasDeath = true; tc.death++; }
      else { tc.unknown++; }
      
      const memberTypeStr = normAr(gv(r, 'نوع العضو','نوع_العضو') || '');
      const memberType = memberTypeStr.includes('مخفض') ? 'مخفض' : 'عادي';
      
      // حالة العضو
      const statusRaw = cleanText(gv(r, 'حالة العضو','الحالة','الوضع'));
      let memberStatus = 'نشط';
      const stN = normAr(statusRaw);
      if(stN.includes('منسحب') || stN.includes('انسحاب')) memberStatus = 'منسحب';
      else if(stN.includes('متوقف') || stN.includes('وقف')) memberStatus = 'متوقف';
      else if(stN.includes('معف')) memberStatus = 'معفى';
      else if(stN.includes('متوف') || stN.includes('وفاه')) memberStatus = 'متوفى';
      else if(stN.includes('نشط') || stN.includes('فعال') || stN.includes('حي')) memberStatus = 'نشط';
      
      statusCounts[memberStatus] = (statusCounts[memberStatus] || 0) + 1;
      
      const statusDate = toDate(gv(r, 'تاريخ الحالة','تاريخ_الحالة','تاريخ التوقف','تاريخ الانسحاب'));
      
      let found = null;
      if(code && existing.has(String(code))) found = existing.get(String(code));
      else if(existing.has(normAr(name))) found = existing.get(normAr(name));
      
      if(found){
        let changed = false;
        if(subTypeDefined && subYear){
          const newAssoc = hasAssoc ? subYear : null;
          const newDeath = hasDeath ? subYear : null;
          if(found.assocStartYear !== newAssoc){ found.assocStartYear = newAssoc; changed = true; }
          if(found.deathStartYear !== newDeath){ found.deathStartYear = newDeath; changed = true; }
        }
        if(memberStatus && found.memberStatus !== memberStatus){ found.memberStatus = memberStatus; changed = true; }
        if(changed){ await dbPut('members', found); updated++; } else skip++;
        continue;
      }
      
      try {
        const member = {
          code, name,
          familyCode: cleanText(gv(r, 'كود الأسرة','كود_الأسرة')),
          gender: gv(r, 'الجنس') || 'ذكر',
          status: gv(r, 'الحياة') || 'حي',
          relation: gv(r, 'صلة القرابة','صلة_القرابة') || 'رب أسرة',
          birth: toDate(gv(r, 'تاريخ الميلاد','تاريخ_الميلاد')),
          sector: cleanText(gv(r, 'القطاع')),
          phone: cleanPhone(gv(r, 'الجوال','الهاتف')),
          assocStartYear: hasAssoc ? subYear : null,
          deathStartYear: hasDeath ? subYear : null,
          memberType,
          memberStatus,
          statusDate,
          stopYear: ['منسحب','متوقف'].includes(memberStatus)
            ? (statusDate ? new Date(statusDate).getFullYear() : null)
            : null,
          deathDate: memberStatus === 'متوفى' ? (statusDate || '') : '',
          assocExempt: memberStatus === 'معفى',
          deathExempt: memberStatus === 'معفى',
          custom: {},
          notes: cleanText(gv(r, 'ملاحظات')),
          createdAt: new Date().toISOString()
        };
        const newId = await dbPut('members', member);
        member.id = newId;
        S.members.push(member);
        if(code) existing.set(String(code), member);
        existing.set(normAr(name), member);
        added++;
      } catch(e){ console.warn('صف', i+2, e); skip++; }
    }
    
    const statusHTML = Object.entries(statusCounts).filter(([k,v]) => v > 0).map(([k,v]) => `${k}: <b>${v}</b>`).join(' | ');
    
    log.innerHTML = `
      <div style="padding:12px;background:var(--donation-soft);border-radius:12px;color:#166534">
        <div style="font-weight:800;margin-bottom:6px">📊 النتيجة</div>
        <div>➕ أُضيف: <b>${added}</b> | ✏️ حُدّث: <b>${updated}</b> | ⏭️ تُخطّي: <b>${skip}</b></div>
      </div>
      <div style="padding:12px;background:var(--info-soft);border-radius:12px;color:#1e40af;margin-top:10px;font-size:11px">
        <div><b>نوع الاشتراك:</b> ✅ ${tc.both} كليهما • 💰 ${tc.assoc} جمعية • ⚰️ ${tc.death} وفاة • ⚪ ${tc.none} غير مشترك • ❓ ${tc.unknown} غير معرّف</div>
        <div style="margin-top:6px"><b>حالات:</b> ${statusHTML}</div>
      </div>
    `;
    toast(`✅ أُضيف ${added} | حُدّث ${updated}`, 'success', 4000);
    CACHE.invalidateAll();
    await loadAll();
    go(S.page);
  } catch(e){
    console.error(e);
    log.innerHTML = `<div style="color:var(--danger)">❌ ${esc(e.message)}</div>`;
  }
  showLoad(false);
}

async function importPaymentsNew(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';
  
  showLoad(true);
  const log = $('importPayLogNew');
  log.innerHTML = '<div style="color:var(--muted)">⏳</div>';
  
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });
    
    const memberMap = new Map();
    S.members.forEach(m => {
      if(m.code) memberMap.set(String(m.code), m);
      if(m.name) memberMap.set(normAr(m.name), m);
    });
    
    let added = 0, skip = 0, notFound = 0, dup = 0;
    const notFoundNames = [];
    
    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const memberName = cleanText(gv(r, 'اسم المشترك','اسم العضو','العضو','المشترك','الاسم','كود العضو'));
      if(!memberName){ skip++; continue; }
      
      const amountStr = String(gv(r, 'المبلغ','القيمة','Amount') || '').replace(/[,،\s]/g,'');
      const amount = Number(amountStr);
      if(!amount){ skip++; continue; }
      
      let member = memberMap.get(memberName) || memberMap.get(normAr(memberName));
      if(!member){
        const s = normAr(memberName);
        member = S.members.find(m => {
          const n = normAr(m.name);
          return n === s || n.includes(s) || s.includes(n);
        });
      }
      if(!member){ notFound++; notFoundNames.push(memberName); skip++; continue; }
      
      const typeStr = normAr(gv(r, 'نوع القسط','النوع','نوع الدفعة','الصندوق') || '');
      let fund = 'assoc';
      if(/وفا/.test(typeStr)) fund = 'death';
      else if(/تبرع|صدقه/.test(typeStr)) fund = 'donation';
      
      const date = toDate(gv(r, 'التاريخ','تاريخ')) || today();
      const yearStr = String(gv(r, 'السنة','سنة','سنة الدفعة','العام') || '').replace(/[^\d]/g,'');
      const forYear = Number(yearStr) || (date ? new Date(date).getFullYear() : S.currentYear);
      
      const collectorName = cleanText(gv(r, 'اسم المعتمد','المعتمد','المحصل','الجباة')) || 'استيراد سابق';
      
      const isDup = S.payments.some(p =>
        p.memberId === member.id && Number(p.amount) === amount && p.date === date &&
        Number(p.forYear || p.year) === forYear && p.fund === fund
      );
      if(isDup){ dup++; skip++; continue; }
      
      try {
        const payment = {
          memberId: member.id,
          fund, amount, date,
          year: forYear, forYear,
          notes: cleanText(gv(r, 'ملاحظات')),
          collectorId: null,
          collectorName,
          imported: true,
          createdAt: new Date().toISOString()
        };
        const newId = await dbPut('payments', payment);
        payment.id = newId;
        S.payments.push(payment);
        added++;
      } catch(e){ skip++; }
    }
    
    const notFoundHTML = notFoundNames.length ? `
      <div style="margin-top:8px;padding:8px;background:var(--death-light);border-radius:8px;color:#991b1b;font-size:11px;max-height:120px;overflow:auto">
        <b>أول 10 أسماء غير موجودة:</b><br>
        ${notFoundNames.slice(0,10).map(n => '• ' + esc(n)).join('<br>')}
      </div>
    ` : '';
    
    log.innerHTML = `
      <div style="padding:12px;background:var(--donation-soft);border-radius:12px;color:#166534">
        <div>➕ أُضيفت: <b>${added}</b></div>
        <div style="color:#92400e">🔁 مكرر: <b>${dup}</b></div>
        <div>⏭️ تُخطّي: <b>${skip}</b></div>
        <div style="color:#b91c1c">❓ غير موجود: <b>${notFound}</b></div>
        ${notFoundHTML}
      </div>
    `;
    toast(`✅ أُضيفت ${added} دفعة`, 'success', 4000);
    CACHE.invalidateAll();
    await loadAll();
    go(S.page);
  } catch(e){
    console.error(e);
    log.innerHTML = `<div style="color:var(--danger)">❌ ${esc(e.message)}</div>`;
  }
  showLoad(false);
}

async function cleanImportedMovements(){
  if(!confirm('⚠️ حذف كل الحركات المالية المستوردة؟')) return;
  if(!confirm('تأكيد أخير!')) return;
  
  showLoad(true);
  try {
    let incDel = 0, expDel = 0;
    const toDelInc = S.incomes.filter(i => i.imported === true);
    for(const inc of toDelInc){ await dbDel('incomes', inc.id); incDel++; }
    const toDelExp = S.expenses.filter(e => e.imported === true);
    for(const exp of toDelExp){ await dbDel('expenses', exp.id); expDel++; }
    
    S.incomes = S.incomes.filter(i => i.imported !== true);
    S.expenses = S.expenses.filter(e => e.imported !== true);
    CACHE.invalidateAll();
    
    toast(`🗑️ حُذف: ${incDel} إيراد + ${expDel} مصروف`, 'success', 4000);
    showLoad(false);
    closeSheet();
    go(S.page);
  } catch(e){
    showLoad(false);
    toast('خطأ: ' + e.message, 'error');
  }
}

async function importFinanceNew(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';
  
  showLoad(true);
  const log = $('importFinLogNew');
  log.innerHTML = '<div style="color:var(--muted)">⏳</div>';
  
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });
    
    let incAdded = 0, expAdded = 0, skip = 0, compUpdated = 0, compNF = 0, dup = 0;
    const notFoundComps = [];
    
    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      
      const typeStr = cleanText(gv(r, 'النوع','نوع الحركة','نوع') || '');
      const typeN = normAr(typeStr);
      const isIncome = /وارد|ايراد|إيراد|دخل/.test(typeN);
      const isExpense = /صادر|مصروف|صرف/.test(typeN);
      if(!isIncome && !isExpense){ skip++; continue; }
      
      const amountStr = String(gv(r, 'المبلغ','القيمة','Amount') || '').replace(/[,،\s]/g,'');
      const amount = Number(amountStr);
      if(!amount){ skip++; continue; }
      
      const fundStr = cleanText(gv(r, 'نوع الصندوق','نوع_الصندوق','الصندوق','صندوق') || '');
      const fundN = normAr(fundStr);
      let fund = 'assoc';
      if(/تبرع/.test(fundN)) fund = 'donation';
      else if(/وفا/.test(fundN)) fund = 'death';
      else if(/جمعي/.test(fundN)) fund = 'assoc';
      
      const category = cleanText(gv(r, 'التصنيف','الفئة') || '');
      const categoryN = normAr(category);
      const description = cleanText(gv(r, 'البيان','الوصف','التفاصيل','المصدر') || '');
      const party = cleanText(gv(r, 'الطرف','الجهة','المستفيد') || '');
      const date = toDate(gv(r, 'التاريخ','تاريخ')) || today();
      const yearStr = String(gv(r, 'العام','السنة','سنة') || '').replace(/[^\d]/g,'');
      const year = Number(yearStr) || (date ? new Date(date).getFullYear() : S.currentYear);
      
      // التعويضات
      if(isExpense && /تعويض/.test(categoryN)){
        let rawName = description;
        if(!rawName || /^تعويض\s*وفا?ة?\s*[:\-–—\.•]*\s*$/i.test(rawName.trim())){
          rawName = party;
        }
        const cleanName = rawName.replace(/^تعويض\s*وفا?ة?\s*[\:\-–—\.•]*\s*/i,'').replace(/\(.*?\)/g,'').replace(/[\:\-–—\.•]\s*$/,'').trim();
        
        let matched = S.deaths.find(d => normAr(d.deceasedName) === normAr(cleanName));
        if(!matched){
          matched = S.deaths.find(d => {
            const n1 = normAr(d.deceasedName);
            const n2 = normAr(cleanName);
            return n1.includes(n2) || n2.includes(n1);
          });
        }
        
        if(matched){
          if(!matched.manualEdit){
            matched.compensation = amount;
            matched.updatedFromFinance = true;
            await dbPut('deaths', matched);
            compUpdated++;
          }
        } else {
          compNF++;
          notFoundComps.push(description || party);
        }
        continue;
      }
      
      // فحص التكرار
      const isDup = isIncome
        ? S.incomes.some(inc => inc.fund === fund && Number(inc.amount) === amount && inc.date === date)
        : S.expenses.some(ex => ex.fund === fund && Number(ex.amount) === amount && ex.date === date);
      if(isDup){ dup++; skip++; continue; }
      
      try {
        if(isIncome){
          const obj = {
            fund, category: category || 'إيراد',
            amount, date, year,
            notes: description + (party ? ' • ' + party : ''),
            recordedBy: S.currentUser.id,
            recordedByName: S.currentUser.name + ' (استيراد)',
            imported: true,
            createdAt: new Date().toISOString()
          };
          const newId = await dbPut('incomes', obj);
          obj.id = newId;
          S.incomes.push(obj);
          incAdded++;
        } else {
          const obj = {
            fund, category: category || 'مصروف',
            description: description + (party ? ' • ' + party : ''),
            amount, date, year,
            createdBy: S.currentUser.id,
            recordedByName: S.currentUser.name + ' (استيراد)',
            imported: true,
            createdAt: new Date().toISOString()
          };
          const newId = await dbPut('expenses', obj);
          obj.id = newId;
          S.expenses.push(obj);
          expAdded++;
        }
      } catch(e){ skip++; }
    }
    
    const nf = notFoundComps.length ? `

async function importDeliveriesNew(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';
  
  showLoad(true);
  const log = $('importDelivLogNew');
  log.innerHTML = '<div style="color:var(--muted)">⏳</div>';
  
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });
    
    let added = 0, skip = 0, dup = 0;
    
    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const collectorName = cleanText(gv(r, 'اسم المعتمد','المعتمد','من','من المعتمد','المحصل'));
      const amountStr = String(gv(r, 'المبلغ المراد تسليمه','المبلغ','القيمة') || '').replace(/[,،\s]/g,'');
      const amount = Number(amountStr);
      
      if(!collectorName || !amount){ skip++; continue; }
      
      const date = toDate(gv(r, 'التاريخ','تاريخ')) || today();
      const typeStr = normAr(gv(r, 'نوع القسط','النوع','الصندوق') || '');
      let fund = 'assoc';
      if(/وفا/.test(typeStr)) fund = 'death';
      
      const isDup = S.deliveries.some(d =>
        normAr(d.fromUserName) === normAr(collectorName) &&
        Number(d.amount) === amount && d.date === date
      );
      if(isDup){ dup++; skip++; continue; }
      
      try {
        const delivery = {
          fromUserId: null,
          fromUserName: collectorName,
          toUserId: null,
          toUserName: 'أمين (استيراد)',
          fund, amount,
          notes: 'حركة: ' + (cleanText(gv(r, 'رقم الحركة','ID','المعرف')) || '') + ' • ' + (cleanText(gv(r, 'الحالة','حالة')) || ''),
          date,
          imported: true,
          createdAt: new Date().toISOString()
        };
        const newId = await dbPut('deliveries', delivery);
        delivery.id = newId;
        S.deliveries.push(delivery);
        added++;
      } catch(e){ skip++; }
    }
    
    log.innerHTML = `
      <div style="padding:12px;background:var(--donation-soft);border-radius:12px;color:#166534">
        <div>➕ أُضيفت: <b>${added}</b></div>
        <div style="color:#92400e">🔁 مكرر: <b>${dup}</b></div>
        <div>⏭️ تُخطّي: <b>${skip}</b></div>
      </div>
    `;
    toast(`✅ أُضيفت ${added} تسليمة`, 'success', 4000);
    CACHE.invalidateAll();
    await loadAll();
    go(S.page);
  } catch(e){
    console.error(e);
    log.innerHTML = `<div style="color:var(--danger)">❌ ${esc(e.message)}</div>`;
  }
  showLoad(false);
}

/* دالة قراءة الخلايا من Excel */
function gv(row, ...aliases){
  if(!row) return '';
  const normalized = {};
  for(const k of Object.keys(row)){
    normalized[normAr(k).replace(/[^\u0621-\u064Aa-z0-9]/g, '')] = row[k];
  }
  for(const a of aliases){
    const key = normAr(a).replace(/[^\u0621-\u064Aa-z0-9]/g, '');
    if(key in normalized){
      const v = normalized[key];
      if(v === null || v === undefined) continue;
      const s = String(v).trim();
      if(!s || s.startsWith('=') || s.includes('openpyxl')) continue;
      return s;
    }
  }
  return '';
}

function exportBackupNew(){
  try {
    const data = {
      version: '8.0',
      date: new Date().toISOString(),
      members: S.members, payments: S.payments, deaths: S.deaths,
      incomes: S.incomes, expenses: S.expenses, deliveries: S.deliveries,
      storeItems: S.storeItems, storeMovements: S.storeMovements,
      meetings: S.meetings, constants: S.constants, users: S.users,
      customFields: S.customFields
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `zaoura_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    toast('💾 تم التنزيل');
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

async function importBackupNew(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';
  
  const text = await file.text();
  try {
    const data = JSON.parse(text);
    if(!data.members && !data.users) throw new Error('ملف غير صالح');
    if(!confirm('⚠️ سيتم استبدال كل البيانات. متابعة؟')) return;
    if(!confirm('تأكيد أخير!')) return;
    
    for(const s of STORE_NAMES){
      const store = tx(s, 'readwrite');
      await new Promise(res => { const q = store.clear(); q.onsuccess = res; q.onerror = res; });
    }
    
    const toRestore = ['members','payments','deaths','incomes','expenses','deliveries','storeItems','storeMovements','meetings','constants','users','customFields'];
    for(const key of toRestore){
      if(Array.isArray(data[key])){
        for(const item of data[key]){
          delete item.id;
          await dbPut(key, item);
        }
      }
    }
    
    await loadAll();
    CACHE.invalidateAll();
    toast('✅ تمت الاستعادة', 'success', 3000);
    closeSheet();
    setTimeout(() => location.reload(), 500);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

async function ensureDefaultConstants(){
  const years = [];
  for(let y = BASE_YEAR; y <= BASE_YEAR + 4; y++) years.push(y);
  
  let added = 0;
  for(const year of years){
    if(!S.constants.find(c => c.year === year)){
      const c = {
        year,
        assocYearly: 24000, assocYearlyReduced: 15000,
        deathInstallment: 5000, deathCompensation: 25000,
        joinAssocFee: 100000, joinAssocFeeReduced: 50000,
        joinDeathFee: 50000, joinDeathFeeReduced: 25000,
        createdAt: new Date().toISOString()
      };
      const id = await dbPut('constants', c);
      c.id = id;
      S.constants.push(c);
      added++;
    }
  }
  if(added > 0) console.log(`✅ تم إضافة ${added} سنة`);
}

async function init(){
  const savedTheme = localStorage.getItem('zt_theme');
  if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  
  const savedYear = localStorage.getItem('zt_year');
  if(savedYear) S.currentYear = Number(savedYear);
  
  try {
    await openDB();
    await loadAll();
    await ensureDefaultConstants();
    
    // ترحيل الحقول القديمة
    let migrated = 0;
    for(const cf of S.customFields){
      if(!cf.target){
        cf.target = 'members';
        if(!cf.fieldType) cf.fieldType = 'text';
        if(cf.id) await dbPut('customFields', cf);
        migrated++;
      }
    }
    if(migrated > 0) console.log(`📌 رُحّل ${migrated} حقل`);
    
    const su = restoreCurrentUser();
    if(su){
      const full = S.users.find(u => u.id === su.id);
      if(full){
        S.currentUser = full;
        showMain();
        return;
      }
      saveCurrentUser(null);
    }
    showLogin();
  } catch(e){
    console.error('init error', e);
    toast('خطأ في التحميل: ' + e.message, 'error', 5000);
  }
}

document.addEventListener('DOMContentLoaded', init);
