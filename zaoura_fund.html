<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>صندوق زعورة — نظام الاشتراكات</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════
   نظام الألوان — البنفسجي (لتمييزه عن تطبيق المقبرة)
   ═══════════════════════════════════════════════════════ */
:root{
  /* الألوان الأساسية */
  --primary:#7c3aed;        /* بنفسجي رئيسي */
  --primary-2:#6d28d9;
  --primary-soft:#f5f3ff;
  --primary-dark:#4c1d95;
  
  /* ألوان الصناديق */
  --assoc:#2563eb;          /* أزرق - جمعية */
  --assoc-soft:#dbeafe;
  --death:#dc2626;          /* أحمر - وفاة */
  --death-soft:#fee2e2;
  --donation:#16a34a;       /* أخضر - تبرع */
  --donation-soft:#dcfce7;
  
  /* ألوان الحالات */
  --success:#16a34a;
  --danger:#dc2626;
  --warning:#f59e0b;
  --info:#2563eb;
  --muted:#64748b;
  
  /* الأساسيات */
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#0f172a;
  --border:#e2e8f0;
  --radius:16px;
  --radius-sm:12px;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow:0 8px 24px rgba(15,23,42,.08);
  --shadow-lg:0 20px 60px rgba(15,23,42,.2);
  --safe:env(safe-area-inset-bottom,0);
}
[data-theme="dark"]{
  --bg:#0b1220;
  --card:#1e293b;
  --text:#e2e8f0;
  --border:#334155;
  --primary-soft:#2e1065;
  --assoc-soft:#1e3a8a;
  --death-soft:#7f1d1d;
  --donation-soft:#14532d;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  background:var(--bg);color:var(--text);direction:rtl;
  font-size:15px;line-height:1.5;min-height:100vh;
  padding-bottom:calc(78px + var(--safe));
  transition:background .2s,color .2s;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{outline:0}

/* ═══════════ HEADER ═══════════ */
.app-header{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;
  padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top,0));
  display:flex;align-items:center;gap:10px;
  box-shadow:0 4px 20px rgba(124,58,237,.3);
}
.app-header .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.app-header .logo{
  width:40px;height:40px;border-radius:12px;
  background:rgba(255,255,255,.2);
  backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.app-header .brand-text{flex:1;min-width:0}
.app-header h1{font-size:16px;font-weight:800;line-height:1.1}
.app-header .sub{font-size:10px;opacity:.85;font-weight:600;margin-top:2px}
.app-header .icon-btn{
  width:38px;height:38px;border-radius:12px;
  background:rgba(255,255,255,.15);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:.15s;flex-shrink:0;
}
.app-header .icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.25)}

/* شريط المستخدم الحالي */
.user-banner{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:8px 14px;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;font-size:12px;
  position:sticky;top:60px;z-index:29;
}
.user-banner .who{display:flex;align-items:center;gap:8px;color:var(--muted)}
.user-banner .who b{color:var(--text)}
.role-badge{
  padding:3px 10px;border-radius:20px;
  font-size:10px;font-weight:800;
  background:var(--primary-soft);color:var(--primary);
}
.role-badge.president{background:#fef3c7;color:#92400e}
.role-badge.manager{background:#dbeafe;color:#1e40af}
.role-badge.treasurer{background:#dcfce7;color:#166534}
.role-badge.collector{background:#f1f5f9;color:#475569}
.role-badge.auditor{background:#e9d5ff;color:#6b21a8}

/* ═══════════ SEARCH ═══════════ */
.search-wrap{padding:10px 12px 0;max-width:900px;margin:0 auto}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:10px 14px;
  box-shadow:var(--shadow-sm);
}
.search-box .ico{color:var(--muted);font-size:17px}
.search-box input{flex:1;background:none;border:0;font-size:15px;min-width:0}
.search-box .clear{color:var(--muted);font-size:18px;padding:4px}

/* ═══════════ MAIN ═══════════ */
main{max-width:900px;margin:0 auto;padding:12px}
.page{display:none;animation:fade .2s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ═══════════ CARDS ═══════════ */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:12px;
  box-shadow:var(--shadow-sm);
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:12px;
}
.card-head h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.card-head .actions{display:flex;gap:6px;flex-wrap:wrap}

/* ═══════════ STATS (البطاقات الرقمية) ═══════════ */
.stats-scroll{
  display:flex;gap:10px;overflow-x:auto;
  margin:0 -12px 14px;padding:0 12px 6px;
  scroll-snap-type:x mandatory;scrollbar-width:none;
}
.stats-scroll::-webkit-scrollbar{display:none}
.stat{
  flex:0 0 auto;min-width:130px;scroll-snap-align:start;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.stat::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--primary)}
.stat.assoc::before{background:var(--assoc)}
.stat.death::before{background:var(--death)}
.stat.donation::before{background:var(--donation)}
.stat.green::before{background:var(--success)}
.stat.red::before{background:var(--danger)}
.stat.orange::before{background:var(--warning)}
.stat.blue::before{background:var(--info)}
.stat .val{font-size:22px;font-weight:800;line-height:1.1;color:var(--primary);word-break:break-all}
.stat.assoc .val{color:var(--assoc)}
.stat.death .val{color:var(--death)}
.stat.donation .val{color:var(--donation)}
.stat.green .val{color:var(--success)}
.stat.red .val{color:var(--danger)}
.stat.orange .val{color:var(--warning)}
.stat.blue .val{color:var(--info)}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600}
.stat .sub{font-size:9px;color:var(--muted);margin-top:2px;opacity:.7}

/* ═══════════ LISTS ═══════════ */
.list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.item{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:.15s;min-height:64px;
}
.item:last-child{border-bottom:0}
.item:active{background:var(--bg)}
.item .av{
  width:46px;height:46px;border-radius:13px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;background:var(--primary-soft);color:var(--primary);font-weight:800;
  overflow:hidden;
}
.item .av img{width:100%;height:100%;object-fit:cover}
.item .av.blue{background:var(--assoc-soft);color:var(--assoc)}
.item .av.red{background:var(--death-soft);color:var(--death)}
.item .av.green{background:var(--donation-soft);color:var(--donation)}
.item .av.orange{background:#fef3c7;color:#92400e}
.item .av.gray{background:#f1f5f9;color:#475569}
.item .body{flex:1;min-width:0}
.item .ttl{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .sub{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .trail{color:var(--muted);font-size:20px;font-weight:300;flex-shrink:0}
.item .amount{
  font-weight:800;font-size:14px;color:var(--success);
  flex-shrink:0;text-align:left;
}
.item .amount.danger{color:var(--danger)}
.item .amount.assoc{color:var(--assoc)}
.item .amount.death{color:var(--death)}

/* ═══════════ BADGES ═══════════ */
.badge{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 9px;border-radius:8px;
  font-size:10px;font-weight:700;white-space:nowrap;
}
.badge.success{background:#dcfce7;color:#166534}
.badge.danger{background:#fee2e2;color:#991b1b}
.badge.warning{background:#fef3c7;color:#92400e}
.badge.info{background:#dbeafe;color:#1e40af}
.badge.muted{background:#f1f5f9;color:#475569}
.badge.primary{background:var(--primary-soft);color:var(--primary)}
.badge.assoc{background:var(--assoc-soft);color:var(--assoc)}
.badge.death{background:var(--death-soft);color:var(--death)}
.badge.donation{background:var(--donation-soft);color:var(--donation)}

/* ═══════════ CHIPS (الفلاتر) ═══════════ */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:7px 14px;border-radius:20px;
  background:var(--card);border:1px solid var(--border);
  font-size:12px;font-weight:700;color:var(--muted);transition:.15s;
  display:inline-flex;align-items:center;gap:5px;
}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip.on.assoc{background:var(--assoc);border-color:var(--assoc)}
.chip.on.death{background:var(--death);border-color:var(--death)}
.chip.on.donation{background:var(--donation);border-color:var(--donation)}
.chip .count{
  background:rgba(255,255,255,.25);
  padding:0 6px;border-radius:10px;
  font-size:10px;font-weight:800;
}
.chip:not(.on) .count{background:var(--bg);color:var(--muted)}

/* ═══════════ BUTTONS ═══════════ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:6px;padding:11px 18px;border-radius:13px;
  font-size:14px;font-weight:700;transition:.15s;
  min-height:44px;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff}
.btn.assoc{background:var(--assoc);color:#fff}
.btn.death{background:var(--death);color:#fff}
.btn.donation{background:var(--donation);color:#fff}
.btn.success{background:var(--success);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.warning{background:var(--warning);color:#fff}
.btn.info{background:var(--info);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:12px;border-radius:10px}
.btn.lg{padding:14px 22px;min-height:52px;font-size:15px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

/* شريط الإجراءات السريعة */
.quick-actions{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin-bottom:12px;
}
.quick-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:16px 10px;border-radius:14px;
  background:var(--card);border:2px solid var(--border);
  cursor:pointer;transition:.15s;text-align:center;
}
.quick-btn:active{transform:scale(.97);border-color:var(--primary)}
.quick-btn .ico{font-size:28px;line-height:1}
.quick-btn .lbl{font-size:12px;font-weight:800;color:var(--text)}
.quick-btn.assoc{border-color:var(--assoc)}
.quick-btn.assoc .lbl{color:var(--assoc)}
.quick-btn.death{border-color:var(--death)}
.quick-btn.death .lbl{color:var(--death)}
.quick-btn.donation{border-color:var(--donation)}
.quick-btn.donation .lbl{color:var(--donation)}

/* ═══════════ FAB ═══════════ */
.fab{
  position:fixed;bottom:calc(88px + var(--safe));left:18px;
  width:60px;height:60px;border-radius:20px;
  background:var(--primary);color:#fff;
  font-size:28px;font-weight:300;
  box-shadow:0 12px 32px rgba(124,58,237,.5);
  z-index:25;display:flex;align-items:center;justify-content:center;
  transition:.15s;
}
.fab:active{transform:scale(.92)}

/* ═══════════ BOTTOM NAV ═══════════ */
.bnav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--card);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + var(--safe));
  box-shadow:0 -4px 20px rgba(15,23,42,.05);
}
.bnav button{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:6px 2px;border-radius:12px;
  color:var(--muted);font-size:10px;font-weight:700;
  transition:.15s;position:relative;min-width:0;
}
.bnav button .i{font-size:22px;line-height:1;transition:.15s}
.bnav button.on{color:var(--primary)}
.bnav button.on .i{transform:scale(1.1)}
.bnav button .nb{
  position:absolute;top:3px;right:calc(50% - 20px);
  background:var(--danger);color:#fff;
  border-radius:10px;padding:0 5px;font-size:9px;
  font-weight:700;min-width:16px;text-align:center;
  line-height:16px;height:16px;
}

/* ═══════════ SHEET (Bottom Sheet) ═══════════ */
.sheet-back{
  position:fixed;inset:0;background:rgba(15,23,42,.55);
  z-index:90;opacity:0;pointer-events:none;transition:.2s;
  backdrop-filter:blur(3px);
}
.sheet-back.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:91;
  background:var(--card);
  border-radius:24px 24px 0 0;
  max-height:94vh;overflow-y:auto;
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding-bottom:calc(16px + var(--safe));
  box-shadow:0 -20px 60px rgba(15,23,42,.2);
}
.sheet.on{transform:translateY(0)}
.sheet.wide{max-height:98vh}
.sheet-grip{
  width:44px;height:5px;background:var(--border);
  border-radius:3px;margin:12px auto 0;
}
.sheet-hd{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--card);z-index:2;
  border-radius:24px 24px 0 0;
}
.sheet-hd h2{font-size:16px;font-weight:800}
.sheet-bd{padding:16px 18px}
.sheet-ft{
  display:flex;gap:10px;padding:12px 18px;
  border-top:1px solid var(--border);
  position:sticky;bottom:0;background:var(--card);
  flex-wrap:wrap;
}
.sheet-ft .btn{flex:1;min-width:90px}

/* ═══════════ FORMS ═══════════ */
.fld{margin-bottom:14px;position:relative}
.fld label{
  display:block;font-size:12px;font-weight:700;
  color:var(--muted);margin-bottom:6px;
}
.fld label .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{
  width:100%;padding:12px 14px;
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:12px;font-size:15px;
  transition:.15s;font-family:inherit;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  border-color:var(--primary);background:var(--card);
  box-shadow:0 0 0 3px rgba(124,58,237,.12);
}
.fld textarea{resize:vertical;min-height:70px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld-row.three{grid-template-columns:1fr 1fr 1fr}
.fld-hint{font-size:11px;color:var(--muted);margin-top:4px}
.fld-readonly{background:var(--primary-soft)!important;color:var(--primary);font-weight:700}

/* البحث مع القائمة المنسدلة */
.options-list{
  position:absolute;top:100%;left:0;right:0;
  background:var(--card);border:1.5px solid var(--primary);
  border-radius:12px;max-height:250px;overflow-y:auto;
  z-index:100;box-shadow:var(--shadow);margin-top:4px;display:none;
}
.options-list.on{display:block}
.option-item{
  padding:11px 14px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  gap:8px;border-bottom:1px solid var(--border);font-size:14px;
}
.option-item:hover,.option-item:active{background:var(--primary-soft)}
.option-item:last-child{border-bottom:0}
.option-item small{color:var(--muted);font-size:11px;flex-shrink:0}

/* مبلغ كبير (شاشة الدفع) */
.amount-input{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:2px solid var(--primary);
  border-radius:14px;padding:8px 16px;
}
.amount-input input{
  flex:1;border:0;background:none;
  font-size:28px;font-weight:800;color:var(--primary);
  text-align:center;padding:8px 0;
}
.amount-input .currency{font-size:14px;font-weight:800;color:var(--muted)}
.amount-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.amount-quick button{
  padding:6px 12px;border-radius:10px;
  background:var(--primary-soft);color:var(--primary);
  font-size:12px;font-weight:700;
}
.amount-quick button:active{transform:scale(.95)}

/* ═══════════ BALANCE / PROGRESS ═══════════ */
.balance-block{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:12px;margin-bottom:10px;
}
.balance-row{
  display:flex;justify-content:space-between;
  padding:6px 0;font-size:13px;border-bottom:1px solid var(--border);
}
.balance-row:last-child{border-bottom:0}
.balance-row .lbl{color:var(--muted)}
.balance-row .val{font-weight:800}
.balance-row .val.green{color:var(--success)}
.balance-row .val.red{color:var(--danger)}
.balance-row .val.orange{color:var(--warning)}

.progress{
  height:10px;background:var(--bg);
  border-radius:5px;overflow:hidden;margin-top:8px;
}
.progress > div{
  height:100%;border-radius:5px;
  transition:width .4s ease;
}
.progress.assoc > div{background:var(--assoc)}
.progress.death > div{background:var(--death)}
.progress.green > div{background:var(--success)}
.progress.warning > div{background:var(--warning)}

/* ═══════════ EMPTY STATE ═══════════ */
.empty{
  text-align:center;padding:50px 20px;
  color:var(--muted);
}
.empty .ico{font-size:52px;opacity:.4;display:block;margin-bottom:10px}
.empty h3{font-size:15px;font-weight:700;margin-bottom:4px;color:var(--text)}
.empty p{font-size:12px}

/* ═══════════ TOASTS ═══════════ */
.toasts{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:9999;display:flex;flex-direction:column;gap:8px;
  pointer-events:none;width:calc(100% - 28px);max-width:400px;
}
.toast{
  background:var(--text);color:var(--card);
  padding:12px 18px;border-radius:14px;
  font-size:13px;font-weight:600;
  box-shadow:var(--shadow-lg);
  animation:slideDown .25s ease;
  pointer-events:auto;
}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--danger);color:#fff}
.toast.warning{background:var(--warning);color:#fff}
.toast.info{background:var(--info);color:#fff}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* ═══════════ LOADER ═══════════ */
.loader{
  position:fixed;inset:0;background:rgba(15,23,42,.4);
  backdrop-filter:blur(3px);z-index:9998;
  display:none;align-items:center;justify-content:center;
}
.loader.on{display:flex}
.spin{
  width:42px;height:42px;
  border:3px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;

<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   🏘️ صندوق زعورة — نظام الاشتراكات
   Part 3: الأساس التقني
   ═══════════════════════════════════════════════════════ */

/* ──────────────── الإعدادات العامة ──────────────── */
const APP_NAME = 'صندوق زعورة';
const DB_NAME = 'zaoura_fund_v1';
const DB_VERSION = 1;
const STORE_NAMES = [
  'people',           // الأفراد
  'sectors',          // القطاعات
  'admins',           // الإداريون
  'constants',        // الثوابت السنوية
  'subscriptions',    // حالات الاشتراك لكل فرد في كل سنة
  'assocPayments',    // دفعات الجمعية
  'deathEvents',      // أحداث الوفاة
  'deathInstallments',// أقساط الوفاة
  'donations',        // التبرعات
  'expenses',         // المصاريف
  'handovers',        // عمليات التسليم
  'auditLog'          // سجل التدقيق
];

/* ──────────────── الأدوار والصلاحيات ──────────────── */
const ROLES = {
  president: { name: 'رئيس اللجنة',    icon: '👑', color: 'president' },
  manager:   { name: 'مدير',           icon: '🎯', color: 'manager' },
  assocTreasurer: { name: 'أمين الجمعية', icon: '💰', color: 'treasurer' },
  deathTreasurer: { name: 'أمين الوفاة',  icon: '⚰️', color: 'treasurer' },
  collector: { name: 'معتمد',           icon: '👤', color: 'collector' },
  auditor:   { name: 'مدقق',            icon: '👁️', color: 'auditor' }
};

/* الصلاحيات التفصيلية */
const PERMISSIONS = {
  president:       ['payment.add','death.add','donation.add','handover.receive','person.manage','subscription.manage','exemptions.manage','constants.manage','admins.manage','expenses.manage','reports.all','audit.view'],
  manager:         ['payment.add','death.add','donation.add','handover.receive','person.manage','subscription.manage','exemptions.manage','expenses.manage','reports.all','audit.view'],
  assocTreasurer:  ['payment.add','donation.add','handover.receive','reports.assoc'],
  deathTreasurer:  ['payment.add','death.add','handover.receive','reports.death'],
  collector:       ['payment.add','reports.own'],
  auditor:         ['reports.all','audit.view']
};

/* ──────────────── القطاعات الافتراضية ──────────────── */
const DEFAULT_SECTORS = [
  { id: 'S1', name: 'الجبل',    order: 1 },
  { id: 'S2', name: 'الحارة1',  order: 2 },
  { id: 'S3', name: 'الحارة2',  order: 3 },
  { id: 'S4', name: 'الوادي',   order: 4 },
  { id: 'S5', name: 'المنصورة', order: 5 },
  { id: 'S6', name: 'دمر',      order: 6 }
];

/* ──────────────── الحالات ──────────────── */
const STATUS = {
  active:    { label: 'نشط',         icon: '✅', cls: 'success' },
  exemptTemp:{ label: 'معاف مؤقت',   icon: '⏸️', cls: 'warning' },
  exemptPerm:{ label: 'معاف نهائي',  icon: '🚫', cls: 'muted' },
  withdrawn: { label: 'منسحب',       icon: '↩️', cls: 'muted' },
  stopped:   { label: 'متوقف',       icon: '💤', cls: 'muted' }
};

const PAYMENT_STATUS = {
  paid:    { label: 'مدفوع',   icon: '✅', cls: 'success' },
  pending: { label: 'مستحق',   icon: '⏳', cls: 'warning' },
  late:    { label: 'متأخر',   icon: '❌', cls: 'danger' },
  exempt:  { label: 'معفى',    icon: '🎁', cls: 'muted' }
};

/* ──────────────── الحالة العامة للتطبيق ──────────────── */
const S = {
  // البيانات
  people: [],
  sectors: [],
  admins: [],
  constants: [],
  subscriptions: [],
  assocPayments: [],
  deathEvents: [],
  deathInstallments: [],
  donations: [],
  expenses: [],
  handovers: [],
  auditLog: [],

  // المستخدم الحالي
  currentUser: null,
  currentYear: new Date().getFullYear(),

  // الواجهة
  page: 'pg-home',
  filters: {
    people: 'all',
    payments: 'all'
  },
  search: '',

  // مؤقت
  editing: null,
  pendingWorkbook: null
};

/* ═══════════════════════════════════════════════════════
   INDEXEDDB — طبقة قاعدة البيانات
   ═══════════════════════════════════════════════════════ */
let db = null;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    
    req.onupgradeneeded = e => {
      const database = e.target.result;
      STORE_NAMES.forEach(name => {
        if(!database.objectStoreNames.contains(name)){
          database.createObjectStore(name, { keyPath: 'id', autoIncrement: true });
        }
      });
    };
    
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

function tx(store, mode = 'readonly'){
  return db.transaction(store, mode).objectStore(store);
}

function dbAll(store){
  return new Promise((res, rej) => {
    const q = tx(store).getAll();
    q.onsuccess = () => res(q.result || []);
    q.onerror = () => rej(q.error);
  });
}

function dbGet(store, id){
  return new Promise((res, rej) => {
    const q = tx(store).get(id);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}

function dbPut(store, obj){
  return new Promise((res, rej) => {
    const q = tx(store, 'readwrite').put(obj);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}

function dbDel(store, id){
  return new Promise((res, rej) => {
    const q = tx(store, 'readwrite').delete(id);
    q.onsuccess = () => res();
    q.onerror = () => rej(q.error);
  });
}

function dbClear(store){
  return new Promise((res, rej) => {
    const q = tx(store, 'readwrite').clear();
    q.onsuccess = () => res();
    q.onerror = () => rej(q.error);
  });
}

/* ═══════════════════════════════════════════════════════
   🛠️ الأدوات العامة
   ═══════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);

/* تهريب HTML */
const esc = v => String(v ?? '')
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#39;');

/* تنظيف النص */
const cleanText = v => String(v ?? '').trim().replace(/\s+/g, ' ');

/* تطبيع النص العربي (للمقارنة) */
const normAr = v => String(v ?? '').toLowerCase().trim()
  .replace(/[أإآ]/g, 'ا')
  .replace(/ة/g, 'ه')
  .replace(/[ىي]/g, 'ي')
  .replace(/[ًٌٍَُِّْـ]/g, '');

/* تنظيف رقم الهاتف */
function cleanPhone(v){
  if(!v) return '';
  let s = String(v).trim().replace(/\.0+$/, '').replace(/[\s\-\(\)\u200f\u200e]/g, '');
  if(s.startsWith('+963')) s = '0' + s.slice(4);
  return s;
}

/* تنسيق التاريخ */
function fmtDate(d){
  if(!d) return '—';
  try{
    return new Date(d).toLocaleDateString('ar-EG', {
      year: 'numeric', month: 'short', day: 'numeric'
    });
  } catch(e){ return d; }
}

/* تاريخ اليوم YYYY-MM-DD */
function today(){
  return new Date().toISOString().slice(0, 10);
}

/* تحويل التاريخ من Excel */
function toDate(v){
  if(!v) return '';
  if(typeof v === 'string' && v.trim().startsWith('=')) return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if(typeof v === 'number'){
    const d = new Date((v - 25569) * 86400000);
    return isNaN(d) ? '' : d.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  const m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]|$)/);
  if(m1) return `${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;
  const m2 = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m2) return `${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
  const d = new Date(s);
  if(!isNaN(d) && d.getFullYear() > 1900 && d.getFullYear() < 2100){
    return d.toISOString().slice(0, 10);
  }
  return '';
}

/* حساب العمر */
function calcAge(birthDate){
  if(!birthDate) return '';
  const b = new Date(birthDate);
  if(isNaN(b)) return '';
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  if(now.getMonth() < b.getMonth() ||
     (now.getMonth() === b.getMonth() && now.getDate() < b.getDate())){
    age--;
  }
  return age >= 0 ? age : '';
}

/* تنسيق الأرقام */
function fmtNum(n){
  if(!n && n !== 0) return '0';
  return Number(n).toLocaleString('en-US');
}

/* تنسيق المبلغ مع العملة */
function fmtMoney(n){
  if(!n && n !== 0) return '0 ل.س';
  return fmtNum(n) + ' ل.س';
}

/* اختصار الرقم (1000 → 1K، 1000000 → 1M) */
function fmtShort(n){
  if(!n) return '0';
  const num = Number(n);
  if(num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
  if(num >= 1000) return (num / 1000).toFixed(1) + 'K';
  return String(num);
}

/* معرف فريد قصير */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* Debounce */
const debounce = (fn, delay = 250) => {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), delay);
  };
};

/* ═══════════════════════════════════════════════════════
   🍞 TOAST — الإشعارات
   ═══════════════════════════════════════════════════════ */
function toast(msg, type = 'success', duration = 2800){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = '.3s';
    setTimeout(() => el.remove(), 300);
  }, duration);
}

async function init(){
  loadTheme();
  
  try{
    await openDB();
    
    // تحميل كل البيانات
    await Promise.all([
      dbAll('people').then(d => S.people = d),
      dbAll('sectors').then(d => S.sectors = d),
      dbAll('admins').then(d => S.admins = d),
      dbAll('constants').then(d => S.constants = d),

      dbAll('assocPayments').then(d => S.assocPayments = d),
      dbAll('deathEvents').then(d => S.deathEvents = d),
      dbAll('deathInstallments').then(d => S.deathInstallments = d),
      dbAll('donations').then(d => S.donations = d),
      dbAll('expenses').then(d => S.expenses = d),
      dbAll('handovers').then(d => S.handovers = d),
      dbAll('auditLog').then(d => S.auditLog = d)
    ]);
    
    // إعداد القطاعات الافتراضية (أول مرة فقط)
    if(S.sectors.length === 0){
      for(const sec of DEFAULT_SECTORS){
        await dbPut('sectors', sec);
      }
      S.sectors = [...DEFAULT_SECTORS];
      console.log('✅ تم إعداد 6 قطاعات افتراضية');
    }
    
    // إعداد ثوابت افتراضية (أول مرة فقط)
    if(S.constants.length === 0){
      const currentY = new Date().getFullYear();
      const defaults = [
        { year: currentY - 1, assocYearly: 24000, deathInstallment: 5000, deathCompensation: 25000, joinAssoc: 100000, joinDeath: 50000, joinReduced: 50000 },
        { year: currentY,     assocYearly: 24000, deathInstallment: 5000, deathCompensation: 25000, joinAssoc: 100000, joinDeath: 50000, joinReduced: 50000 }
      ];
      for(const c of defaults){
        await dbPut('constants', c);
      }
      S.constants = [...defaults];
      console.log('✅ تم إعداد ثوابت افتراضية');
    }
    
    // استرجاع المستخدم
    const savedUser = restoreCurrentUser();
    if(savedUser){
      // تحقق أنه موجود فعلاً
      const fullUser = S.admins.find(a => a.id === savedUser.id);
      if(fullUser){
        S.currentUser = fullUser;
        showMainApp();
        console.log('✅ مرحباً', fullUser.name);
      } else {
        saveCurrentUser(null);
        showLogin();
      }
    } else {
      showLogin();
    }
    
  } catch(e){
    console.error('❌ خطأ في التهيئة:', e);
    toast('خطأ في التحميل: ' + e.message, 'error', 5000);
  }
}

/* حالة تسجيل الدخول المؤقتة */
let _pinAttempt = '';
let _pinTargetUser = null;

/* ──────────────── عرض شاشة الدخول ──────────────── */
function renderLoginScreen(){

    return `

          <div class="role">${roleInfo.name}${sectorTxt}</div>

      </div>
    `;
  }).join('');
}

/* ──────────────── اختيار مستخدم ──────────────── */
function selectLoginUser(userId){
  const user = S.admins.find(a => a.id === userId);
  if(!user) return;
  
  _pinTargetUser = user;
  _pinAttempt = '';
  
  // إذا لم يكن له PIN → دخول مباشر
  if(!user.hasPin){
    doLogin(user);
    return;
  }
  
  // عرض شاشة PIN
  $('loginUsers').style.display = 'none';
  $('loginPin').style.display = 'block';
  
  const roleInfo = ROLES[user.role] || { name: 'مستخدم', icon: '👤' };
  $('pinAvatar').textContent = roleInfo.icon;
  $('pinName').textContent = user.name;
  $('pinRole').textContent = roleInfo.name;
  $('pinError').textContent = '';
  
  updatePinDisplay();
}

/* ──────────────── إدخال PIN ──────────────── */
function pinPress(digit){
  if(_pinAttempt.length >= 4) return;
  _pinAttempt += digit;
  updatePinDisplay();
  
  // التحقق التلقائي عند 4 أرقام
  if(_pinAttempt.length === 4){
    setTimeout(() => checkPin(), 200);
  }
}

function pinBack(){
  _pinAttempt = _pinAttempt.slice(0, -1);
  updatePinDisplay();
  $('pinError').textContent = '';
}

function pinBackLogin(){
  $('loginPin').style.display = 'none';
  $('loginUsers').style.display = 'block';
  _pinAttempt = '';
  _pinTargetUser = null;
}

function updatePinDisplay(){
  const dots = document.querySelectorAll('#pinDisplay .pin-dot');
  dots.forEach((dot, i) => {
    dot.classList.toggle('on', i < _pinAttempt.length);
  });
}

function checkPin(){
  if(!_pinTargetUser) return;
  
  // مقارنة PIN (نصياً - للنظام الداخلي)
  if(_pinAttempt === String(_pinTargetUser.pin)){
    $('pinError').textContent = '✅ صحيح';
    $('pinError').style.color = 'var(--success)';
    setTimeout(() => doLogin(_pinTargetUser), 400);
  } else {
    $('pinError').textContent = '❌ خطأ، حاول مجدداً';
    $('pinError').style.color = 'var(--danger)';
    _pinAttempt = '';
    updatePinDisplay();
    
    // اهتزاز (إن مدعوم)
    if(navigator.vibrate) navigator.vibrate(200);
  }
}

/* ──────────────── تنفيذ الدخول ──────────────── */
function doLogin(user){
  S.currentUser = user;
  saveCurrentUser(user);
  
  // تحديث آخر دخول
  user.lastLogin = new Date().toISOString();
  dbPut('admins', user).catch(() => {});
  
  // سجل التدقيق
  logAudit('login', 'admin', user.id, { name: user.name });
  
  toast('👋 مرحباً ' + user.name, 'success', 2500);
  showMainApp();
}

    <button class="btn primary" onclick="openEditAdminSheet()">➕ إضافة إداري</button>
  `;
  
  openSheet('👥 إدارة الإداريين', body, foot, { wide: true });
}

/* ──────────────── إضافة / تعديل إداري ──────────────── */
function openEditAdminSheet(id = null){
  const isNew = !id;
  const admin = isNew ? { role: 'collector' } : S.admins.find(a => a.id === id);
  if(!admin) return;
  
  S.editing = { type: 'admin', id: isNew ? null : id };
  
  const sectorOpts = S.sectors.map(s => 
    `<option value="${s.id}" ${admin.sectorId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`
  ).join('');
  
  const roleOpts = Object.keys(ROLES).map(key => {
    const r = ROLES[key];
    return `<option value="${key}" ${admin.role === key ? 'selected' : ''}>${r.icon} ${r.name}</option>`;
  }).join('');
  
  const body = `
    <div class="fld">
      <label>الاسم <span class="req">*</span></label>
      <input id="adminName" value="${esc(admin.name || '')}" placeholder="الاسم الكامل" maxlength="50">
    </div>
    
    <div class="fld">
      <label>الهاتف</label>
      <input id="adminPhone" value="${esc(admin.phone || '')}" placeholder="09xxxxxxxx" inputmode="tel">
    </div>
    
    <div class="fld">
      <label>الدور <span class="req">*</span></label>
      <select id="adminRole">${roleOpts}</select>
    </div>
    
    <div class="fld" id="adminSectorField">
      <label>القطاع <span style="color:var(--muted);font-weight:500">(للمعتمد فقط)</span></label>
      <select id="adminSector">
        <option value="">— بدون —</option>
        ${sectorOpts}
      </select>
    </div>
    
    <div class="fld">
      <label>كلمة المرور (4 أرقام)</label>
      <input id="adminPin" type="tel" placeholder="${admin.hasPin ? 'اتركها فارغة للإبقاء' : '••••'}" 
             maxlength="4" inputmode="numeric" pattern="[0-9]*">
      <div class="fld-hint">
        ${admin.hasPin ? '🔒 لديها PIN — اترك الحقل فارغاً للإبقاء' : '🔓 بدون PIN (دخول مباشر)'}
      </div>
    </div>
  `;
  
  const foot = isNew
    ? `<button class="btn ghost" onclick="closeSheet()">إلغاء</button>
       <button class="btn primary" onclick="saveAdmin()">💾 حفظ</button>`
    : `<button class="btn ghost" onclick="closeSheet()">إلغاء</button>
       <button class="btn primary" onclick="saveAdmin(${id})">💾 حفظ</button>`;
  
  openSheet(isNew ? '➕ إضافة إداري' : '✏️ تعديل إداري', body, foot, { focus: 'adminName' });
  
  // إخفاء حقل القطاع إذا لم يكن معتمد
  const updateSectorVisibility = () => {
    const role = $('adminRole').value;
    $('adminSectorField').style.display = (role === 'collector') ? 'block' : 'none';
  };
  $('adminRole').addEventListener('change', updateSectorVisibility);
  updateSectorVisibility();
}

/* ──────────────── حفظ إداري ──────────────── */
async function saveAdmin(id = null){
  const name = cleanText($('adminName').value);
  const phone = cleanPhone($('adminPhone').value);
  const role = $('adminRole').value;
  const sectorId = $('adminSector').value || null;
  const pin = $('adminPin').value.trim();
  
  if(!name){
    toast('الاسم مطلوب', 'error');
    return;
  }
  
  // تحقق من PIN إذا أدخل
  if(pin && !/^\d{4}$/.test(pin)){
    toast('كلمة المرور: 4 أرقام بالضبط', 'error');
    return;
  }
  
  try{
    const old = id ? await dbGet('admins', id) : null;
    
    const admin = {
      name,
      phone,
      role,
      sectorId: role === 'collector' ? sectorId : null,
      hasPin: pin ? true : (old ? old.hasPin : false),
      pin: pin ? pin : (old ? old.pin : null),
      updatedAt: new Date().toISOString(),
      createdAt: old ? old.createdAt : new Date().toISOString(),
      lastLogin: old ? old.lastLogin : null,
      active: old ? old.active : true
    };
    
    if(id){
      admin.id = id;
      await dbPut('admins', admin);
      const idx = S.admins.findIndex(a => a.id === id);
      if(idx > -1) S.admins[idx] = admin;
      logAudit('update', 'admin', id, { name });
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('admins', admin);
      admin.id = newId;
      S.admins.push(admin);
      logAudit('add', 'admin', newId, { name });
      toast('✅ تمت الإضافة');
    }
    
    closeSheet();
    setTimeout(openAdminsSheet, 250);
    
    // تحديث المستخدم الحالي إذا عدّل نفسه
    if(S.currentUser && S.currentUser.id === id){
      S.currentUser = admin;
      saveCurrentUser(admin);
      showMainApp();
    }
    
  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
}

/* ──────────────── حذف إداري ──────────────── */
async function deleteAdmin(id){
  if(!confirm('هل تريد حذف هذا الإداري نهائياً؟')) return;
  if(!confirm('⚠️ تأكيد أخير — لا يمكن التراجع!')) return;
  
  try{
    const admin = S.admins.find(a => a.id === id);
    if(!admin) return;
    
    // لا تسمح بحذف الرئيس الأخير
    if(admin.role === 'president'){
      const presidents = S.admins.filter(a => a.role === 'president');
      if(presidents.length <= 1){
        toast('⚠️ لا يمكن حذف الرئيس الوحيد', 'error', 3500);
        return;
      }
    }
    
    await dbDel('admins', id);
    S.admins = S.admins.filter(a => a.id !== id);
    
    logAudit('delete', 'admin', id, { name: admin.name });
    toast('🗑️ تم الحذف');
    openAdminsSheet();
    
  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
}

/* ═══════════════════════════════════════════════════════
   📜 AUDIT LOG — سجل التدقيق
   ═══════════════════════════════════════════════════════ */
async function logAudit(action, target, targetId, details = {}){
  const entry = {
    timestamp: new Date().toISOString(),
    userId: S.currentUser ? S.currentUser.id : null,
    userName: S.currentUser ? S.currentUser.name : 'system',
    action,
    target,
    targetId,
    details
  };
  
  try{
    const id = await dbPut('auditLog', entry);
    entry.id = id;
    S.auditLog.push(entry);
    
    // حد أقصى 10,000 سجل
    if(S.auditLog.length > 10000){
      const oldest = S.auditLog.slice(0, S.auditLog.length - 10000);
      for(const old of oldest){
        await dbDel('auditLog', old.id);
      }
      S.auditLog = S.auditLog.slice(-10000);
    }
  } catch(e){
    console.warn('تعذر تسجيل التدقيق:', e);
  }
}

/* ═══════════════════════════════════════════════════════
   🎯 دالة مساعدة للاختبار — تخطي تسجيل الدخول
   ═══════════════════════════════════════════════════════ */
/* استخدمها في Console فقط للاختبار */
window.debugSkipLogin = function(){
  if(S.admins.length === 0){
    console.log('❌ لا يوجد إداريون');
    return;
  }
  const admin = S.admins[0];
  S.currentUser = admin;
  saveCurrentUser(admin);
  showMainApp();
  console.log('✅ دخلت كـ ' + admin.name);
};
document.addEventListener('DOMContentLoaded', init);
</script>
