function renderPayments(){
  const y = S.filters.payYear || S.currentYear;
  const fund = S.filters.payFund || 'all';
  const group = S.filters.payGroup || 'raw';
  
  const filtered = S.payments.filter(function(p){
    const py = Number(p.forYear) || Number(p.year);
    if(py !== y) return false;
    if(fund !== 'all' && p.fund !== fund) return false;
    return true;
  });
  
  const sumByFund = function(f){
    return filtered.filter(function(p){ return p.fund === f; })
      .reduce(function(s, p){ return s + (Number(p.amount) || 0); }, 0);
  };
  
  const totalAssoc = sumByFund('assoc');
  const totalDeath = sumByFund('death');
  const totalDon = sumByFund('donation');
  
  let html = '';
  
  // فلاتر
  html += '<div class="card" style="padding:10px;margin-bottom:8px">';
  html += '<div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px">📅 السنة</div>';
  html += '<div class="chips" style="margin-bottom:10px">';
  [2025,2026,2027,2028,2029].forEach(function(yy){
    html += '<button class="chip ' + (y === yy ? 'on' : '') + '" onclick="setPayFilter(\'payYear\',' + yy + ')">' + yy + '</button>';
  });
  html += '</div>';
  
  html += '<div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px">💰 الصندوق</div>';
  html += '<div class="chips" style="margin-bottom:0">';

  html += '<button class="chip ' + (fund === 'death' ? 'on' : '') + '" onclick="setPayFilter(\'payFund\',\'death\')">⚰️ وفاة</button>';
  html += '<button class="chip ' + (fund === 'donation' ? 'on' : '') + '" onclick="setPayFilter(\'payFund\',\'donation\')">💚 تبرعات</button>';
  html += '</div></div>';
  
  // إحصائيات
  html += '<div class="stats-scroll">';
  html += '<div class="stat assoc"><div class="val">' + fmtShort(totalAssoc) + '</div><div class="lbl">💰 جمعية</div></div>';
  html += '<div class="stat death"><div class="val">' + fmtShort(totalDeath) + '</div><div class="lbl">⚰️ وفاة</div></div>';
  html += '<div class="stat donation"><div class="val">' + fmtShort(totalDon) + '</div><div class="lbl">💚 تبرعات</div></div>';
  html += '<div class="stat"><div class="val">' + filtered.length + '</div><div class="lbl">📊 عدد الدفعات</div></div>';
  html += '</div>';
  
  // طريقة العرض
  html += '<div class="segment">';
  html += '<button class="' + (group === 'raw' ? 'on' : '') + '" onclick="setPayGroup(\'raw\')">📋 خام</button>';
  html += '<button class="' + (group === 'member' ? 'on' : '') + '" onclick="setPayGroup(\'member\')">👤 حسب العضو</button>';
  html += '<button class="' + (group === 'collector' ? 'on' : '') + '" onclick="setPayGroup(\'collector\')">💼 حسب المحصّل</button>';
  html += '</div>';
  
  // البحث
  html += '<div class="card" style="padding:10px 14px;margin-bottom:8px">';
  html += '<div style="display:flex;align-items:center;gap:10px">';
  html += '<span style="font-size:16px;color:var(--muted-2)">🔍</span>';
  html += '<input id="paySearchInput" placeholder="ابحث بالاسم أو الكود..." value="' + esc(S.filters.paySearch || '') + '" oninput="onPaySearch(this.value)" style="flex:1;border:0;background:transparent;font-size:14px">';
  html += '</div></div>';
  
  // المحتوى
  html += '<div id="payContent"></div>';
  
  $('pg-payments').innerHTML = html;
  
  renderPaymentsContent(filtered, group);
}

function setPayFilter(key, value){
  S.filters[key] = value;
  renderPayments();
}

function setPayGroup(g){
  S.filters.payGroup = g;
  renderPayments();
}

const onPaySearch = debounce(function(q){
  S.filters.paySearch = q;
  const y = S.filters.payYear || S.currentYear;
  const fund = S.filters.payFund || 'all';
  const filtered = S.payments.filter(function(p){
    const py = Number(p.forYear) || Number(p.year);
    if(py !== y) return false;
    if(fund !== 'all' && p.fund !== fund) return false;
    return true;
  });
  renderPaymentsContent(filtered, S.filters.payGroup);
}, 250);

function renderPaymentsContent(payments, group){
  const container = $('payContent');
  if(!container) return;
  
  const s = normAr(S.filters.paySearch || '');
  
  if(group === 'raw') renderRawPayments(payments, s, container);
  else if(group === 'member') renderPaymentsByMember(payments, s, container);
  else renderPaymentsByCollector(payments, s, container);
}

function renderRawPayments(payments, s, container){
  let list = payments;
  if(s){
    list = list.filter(function(p){
      const m = p.memberId ? getMemberById(p.memberId) : null;
      return normAr((m ? m.name : '') + ' ' + (p.collectorName || '') + ' ' + (p.notes || '')).indexOf(s) > -1;
    });
  }
  
  list = list.slice().sort(function(a, b){ return (b.createdAt || '').localeCompare(a.createdAt || ''); });
  
  if(!list.length){
    container.innerHTML = '<div class="empty"><span class="ico">💰</span><h3>لا توجد دفعات</h3></div>';
    return;
  }
  
  let html = '<div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;padding:0 4px">📊 ' + list.length + ' دفعة</div>';
  html += '<div class="list">';
  list.slice(0, 500).forEach(function(p){
    const m = p.memberId ? getMemberById(p.memberId) : null;
    const ic = p.fund === 'assoc' ? '💰' : p.fund === 'death' ? '⚰️' : '💚';
    const cl = p.fund === 'assoc' ? 'blue' : p.fund === 'death' ? 'red' : 'green';
    html += '<div class="item" onclick="closeSheetAll();setTimeout(function(){openPaymentDetail(' + p.id + ')},150)">';
    html += '<div class="av ' + cl + '">' + ic + '</div>';
    html += '<div class="body"><div class="ttl">' + esc(m ? m.name : (p.notes || 'دفعة')) + '</div>';
    html += '<div class="sub">' + fmtDate(p.date) + ' • ' + esc(p.collectorName || '') + '</div></div>';
    html += '<div style="font-weight:800;color:var(--success);font-size:13px;font-family:\'SF Mono\',monospace">' + fmtNum(p.amount) + '</div>';
    html += '<span class="trail">›</span></div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function renderPaymentsByMember(payments, s, container){
  const byMember = {};
  payments.forEach(function(p){
    if(!p.memberId) return;
    if(!byMember[p.memberId]){
      byMember[p.memberId] = { memberId: p.memberId, count: 0, total: 0, byFund: { assoc: 0, death: 0, donation: 0 } };
    }
    byMember[p.memberId].count++;
    byMember[p.memberId].total += Number(p.amount) || 0;
    byMember[p.memberId].byFund[p.fund] = (byMember[p.memberId].byFund[p.fund] || 0) + (Number(p.amount) || 0);
  });
  
  let list = Object.keys(byMember).map(function(k){
    const x = byMember[k];
    return { member: getMemberById(x.memberId), count: x.count, total: x.total, byFund: x.byFund };
  }).filter(function(x){ return x.member; });
  
  if(s){
    list = list.filter(function(x){ return normAr(x.member.name + ' ' + (x.member.code || '')).indexOf(s) > -1; });
  }
  
  list.sort(function(a, b){ return b.total - a.total; });
  
  if(!list.length){
    container.innerHTML = '<div class="empty"><span class="ico">👤</span><h3>لا نتائج</h3></div>';
    return;
  }
  
  let html = '<div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;padding:0 4px">📊 ' + list.length + ' عضو دفعوا</div>';
  html += '<div class="list">';
  list.slice(0, 500).forEach(function(x){
    const parts = [];
    if(x.byFund.assoc) parts.push('💰 ' + fmtShort(x.byFund.assoc));
    if(x.byFund.death) parts.push('⚰️ ' + fmtShort(x.byFund.death));
    if(x.byFund.donation) parts.push('💚 ' + fmtShort(x.byFund.donation));
    
    html += '<div class="item" onclick="closeSheetAll();setTimeout(function(){openMemberPaymentsList(' + x.member.id + ')},150)">';
    html += '<div class="av green">👤</div>';
    html += '<div class="body"><div class="ttl">' + esc(x.member.name) + '</div>';
    html += '<div class="sub">' + x.count + ' دفعة • ' + parts.join(' ') + '</div></div>';
    html += '<div style="font-weight:800;color:var(--success);font-size:13px;font-family:\'SF Mono\',monospace">' + fmtShort(x.total) + '</div>';
    html += '<span class="trail">›</span></div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function renderPaymentsByCollector(payments, s, container){
  const userByNorm = {};
  S.users.forEach(function(u){ if(u.name) userByNorm[normAr(u.name)] = u; });
  
  const byCollector = {};
  
  payments.forEach(function(p){
    let user = null;
    if(p.collectorId) user = S.users.find(function(u){ return u.id === p.collectorId; });
    if(!user && p.collectorName) user = userByNorm[normAr(p.collectorName)];
    
    const key = user ? 'u:' + user.id : 'n:' + normAr(p.collectorName || 'غير محدد');
    
    if(!byCollector[key]){
      byCollector[key] = {
        key: user ? 'id:' + user.id : 'name:' + (p.collectorName || ''),
        name: user ? user.name : (p.collectorName || 'غير محدد'),
        user: user,
        count: 0,
        total: 0,
        byFund: { assoc: 0, death: 0, donation: 0 }
      };
    }
    
    byCollector[key].count++;
    byCollector[key].total += Number(p.amount) || 0;
    byCollector[key].byFund[p.fund] = (byCollector[key].byFund[p.fund] || 0) + (Number(p.amount) || 0);
  });
  
  let list = Object.keys(byCollector).map(function(k){ return byCollector[k]; });
  
  if(s){
    list = list.filter(function(x){ return normAr(x.name).indexOf(s) > -1; });
  }
  
  list.sort(function(a, b){ return b.total - a.total; });
  
  if(!list.length){
    container.innerHTML = '<div class="empty"><span class="ico">💼</span><h3>لا نتائج</h3></div>';
    return;
  }
  
  let html = '<div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;padding:0 4px">📊 ' + list.length + ' محصّل</div>';
  html += '<div class="list">';
  
  list.forEach(function(x){
    const roleIcon = x.user ? (ROLES[x.user.role] ? ROLES[x.user.role].icon : '👤') : '👤';
    
    const parts = [];
    if(x.byFund.assoc) parts.push('💰 ' + fmtShort(x.byFund.assoc));
    if(x.byFund.death) parts.push('⚰️ ' + fmtShort(x.byFund.death));
    if(x.byFund.donation) parts.push('💚 ' + fmtShort(x.byFund.donation));
    
    html += '<div class="item" onclick="closeSheetAll();setTimeout(function(){openCollectorPaymentsList(\'' + x.key.replace(/'/g, "\\'") + '\', ' + (S.filters.payYear || S.currentYear) + ')},150)">';
    html += '<div class="av">' + roleIcon + '</div>';
    html += '<div class="body"><div class="ttl">' + esc(x.name) + '</div>';
    html += '<div class="sub">' + x.count + ' دفعة • ' + parts.join('  ') + '</div></div>';
    html += '<div style="font-weight:800;color:var(--success);font-size:13px;font-family:\'SF Mono\',monospace">' + fmtShort(x.total) + '</div>';
    html += '<span class="trail">›</span></div>';
    
    // شريط الإجراءات
    html += '<div style="display:flex;gap:4px;padding:0 12px 8px;margin-top:-4px">';
    html += '<button class="btn success sm" style="flex:1;font-size:11px;padding:6px" onclick="event.stopPropagation();shareCollectorReport(\'' + x.key.replace(/'/g, "\\'") + '\', ' + (S.filters.payYear || S.currentYear) + ')">📱 تقرير</button>';
    if(x.user && S.currentUser.role === 'manager'){
      html += '<button class="btn primary sm" style="font-size:11px;padding:6px 10px" onclick="event.stopPropagation();impersonateUser(' + x.user.id + ')">🔑</button>';
    }
    html += '</div>';
  });
  
  html += '</div>';
  container.innerHTML = html;
}

/* تقارير */
function shareCollectorReport(key, year){
  const y = year || S.currentYear;
  let targetUser = null, targetName = '';
  if(key.indexOf('id:') === 0) targetUser = S.users.find(function(u){ return u.id === Number(key.slice(3)); });
  else targetName = key.slice(5);
  
  const payments = S.payments.filter(function(p){
    const py = Number(p.forYear) || Number(p.year);
    if(py !== y) return false;
    if(targetUser){
      if(p.collectorId === targetUser.id) return true;
      if(!p.collectorId && p.collectorName) return normAr(p.collectorName) === normAr(targetUser.name);
      return false;
    }
    if(p.collectorId) return false;
    return normAr(p.collectorName || '') === normAr(targetName);
  });
  
  if(!payments.length){ toast('لا توجد دفعات', 'warning'); return; }
  
  const displayName = targetUser ? targetUser.name : targetName;
  const totalAssoc = payments.filter(function(p){ return p.fund === 'assoc'; }).reduce(function(s, p){ return s + (Number(p.amount) || 0); }, 0);
  const totalDeath = payments.filter(function(p){ return p.fund === 'death'; }).reduce(function(s, p){ return s + (Number(p.amount) || 0); }, 0);
  const totalDon = payments.filter(function(p){ return p.fund === 'donation'; }).reduce(function(s, p){ return s + (Number(p.amount) || 0); }, 0);
  const total = totalAssoc + totalDeath + totalDon;
  
  let txt = '📊 *تقرير تحصيلات ' + displayName + '*\n📅 سنة ' + y + '\n━━━━━━━━━━━━━━━\n\n';
  txt += '💰 جمعية: ' + fmtNum(totalAssoc) + ' ل.س\n';
  txt += '⚰️ وفاة: ' + fmtNum(totalDeath) + ' ل.س\n';
  if(totalDon > 0) txt += '💚 تبرعات: ' + fmtNum(totalDon) + ' ل.س\n';
  txt += '━━━━━━━━━━━━━━━\n📊 *الإجمالي: ' + fmtNum(total) + ' ل.س*\n';
  txt += '📋 عدد الدفعات: ' + payments.length + '\n\n_صندوق زعورة_';
  
  const phone = targetUser && targetUser.phone ? targetUser.phone.replace(/^0/, '').replace(/^\+963/, '') : null;
  
  if(phone){
    if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
      window.location.href = 'whatsapp://send?phone=963' + phone + '&text=' + encodeURIComponent(txt);
    } else {
      window.open('https://wa.me/963' + phone + '?text=' + encodeURIComponent(txt), '_blank');
    }
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
  }
}

async function savePaymentEdit(id){
  const amount = Number($('epAmount').value);
  const date = $('epDate').value;
  const forYear = Number($('epForYear').value);
  const notes = cleanText($('epNotes').value);
  
  if(isNaN(amount) || amount < 0){ toast('المبلغ غير صحيح', 'error'); return; }
  if(!date){ toast('التاريخ مطلوب', 'error'); return; }
  
  try {
    const p = S.payments.find(function(x){ return x.id === id; });
    if(!p) return;
    p.amount = amount;
    p.date = date;
    p.forYear = forYear;
    p.year = forYear;
    p.notes = notes;
    p.editedAt = new Date().toISOString();
    p.editedBy = S.currentUser.name;
    
    await dbPut('payments', p);
    CACHE.invalidateAll();
    if(p.memberId) CACHE.invalidateMember(p.memberId);
    
    toast('✅ تم التعديل', 'success', 2500);
    closeSheetAll();
    go(S.page);
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function deletePaymentRecord(id){
  const p = S.payments.find(function(x){ return x.id === id; });
  if(!p) return;
  const m = p.memberId ? getMemberById(p.memberId) : null;
  
  if(!confirm('⚠️ حذف الدفعة؟\n\n' + (m ? m.name + ' — ' : '') + fmtNum(p.amount) + ' ل.س')) return;
  if(!confirm('تأكيد أخير!')) return;
  
  try {
    await dbDel('payments', id);
    S.payments = S.payments.filter(function(x){ return x.id !== id; });
    CACHE.invalidateAll();
    if(p.memberId) CACHE.invalidateMember(p.memberId);
    
    toast('🗑️ تم الحذف', 'success', 2500);
    closeSheetAll();
    go(S.page);
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

function onPaymentMemberSearch(fund){
  const input = $('pMemberInput');
  const opts = $('pMemberOptions');
  if(!input || !opts) return;
  
  const q = input.value.trim();
  const isAssoc = fund === 'assoc';
  const isDeath = fund === 'death';
  
  let list = S.members.filter(function(m){
    if(isAssoc) return m.assocStartYear && !m.assocExempt;
    if(isDeath) return m.deathStartYear && !m.deathExempt;
    return false;
  });
  
  const u = S.currentUser;
  if(u.role === 'collector' && u.sector){
    list = list.filter(function(m){ return m.sector === u.sector; });
  }
  
  if(q){
    const s = normAr(q);
    list = list.filter(function(m){
      return normAr(m.name + ' ' + (m.code || '') + ' ' + (m.sector || '')).indexOf(s) > -1;
    });
  }
  
  list = list.slice(0, 30);
  
  if(!list.length){
    opts.innerHTML = '<div style="padding:12px;color:var(--muted);text-align:center">' + (q ? 'لا نتائج' : 'اكتب اسماً') + '</div>';
  } else {
    opts.innerHTML = list.map(function(m){
      const full = computeMemberFull(m.id);
      const rem = isAssoc ? (full ? full.total.assocRem : 0) : (full ? full.total.deathRem : 0);
      return '<div class="option-item" onclick="pickPaymentMember(' + m.id + ',\'' + esc(m.name).replace(/'/g, "&#39;") + '\',\'' + fund + '\')">' +
        '<div style="flex:1;min-width:0"><div style="font-weight:700">' + esc(m.name) + '</div>' +
        '<div style="font-size:10px;color:var(--muted)">' + esc(m.code || '') + ' • ' + esc(m.sector || '') + '</div></div>' +
        '<small style="color:' + (rem > 0 ? 'var(--death)' : 'var(--success)') + ';font-weight:700">' + (rem > 0 ? 'متبقي ' + fmtShort(rem) : '✅') + '</small></div>';
    }).join('');
  }
  opts.classList.add('on');
}

function pickPaymentMember(id, name, fund){
  $('pMemberInput').value = name;
  $('pMemberId').value = id;
  $('pMemberOptions').classList.remove('on');
  showPaymentDues(fund, id);
}

function showPaymentDues(fund, memberId){
  const m = getMemberById(memberId);
  if(!m) return;
  const full = computeMemberFull(memberId);
  if(!full) return;
  
  const isAssoc = fund === 'assoc';
  const color = isAssoc ? 'assoc' : 'death';
  const rem = isAssoc ? full.total.assocRem : full.total.deathRem;
  const req = isAssoc ? full.total.assocReq : full.total.deathReq;
  const paid = isAssoc ? full.total.assocPaid : full.total.deathPaid;
  
  $('pDuesBox').innerHTML = '<div style="padding:12px;background:var(--bg);border-radius:12px;border:2px solid var(--' + color + ')">' +
    '<div style="font-weight:800;font-size:15px;margin-bottom:8px">' + esc(m.name) + '</div>' +
    '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span style="color:var(--muted)">المطلوب</span><b>' + fmtNum(req) + '</b></div>' +
    '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span style="color:var(--muted)">المدفوع</span><b style="color:var(--success)">' + fmtNum(paid) + '</b></div>' +
    '<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:2px solid var(--' + color + ');margin-top:4px">' +
    '<span style="font-weight:800">المتبقي</span><b style="font-weight:800;color:' + (rem > 0 ? 'var(--death)' : 'var(--success)') + ';font-family:\'SF Mono\',monospace">' + fmtNum(rem) + ' ل.س</b></div></div>';
  
  $('pDuesBox').style.display = 'block';
  $('pAmountField').style.display = 'block';
  $('pDateRow').style.display = 'grid';
  $('pNotesField').style.display = 'block';
  
  const buttons = [];
  if(rem > 0) buttons.push('<button onclick="$(\'pAmount\').value=' + rem + '">💰 كامل ' + fmtShort(rem) + '</button>');
  buttons.push('<button onclick="$(\'pAmount\').value=5000">5,000</button>');
  buttons.push('<button onclick="$(\'pAmount\').value=10000">10,000</button>');
  buttons.push('<button onclick="$(\'pAmount\').value=25000">25,000</button>');
  buttons.push('<button onclick="$(\'pAmount\').value=0">0 (معفى)</button>');
  $('pQuickButtons').innerHTML = buttons.join('');
  $('pAmount').value = rem > 0 ? rem : '';
}

async function savePayment(fund){
  const u = S.currentUser;
  const isDonation = fund === 'donation';
  const memberId = isDonation ? null : Number($('pMemberId').value);
  const amount = Number($('pAmount').value);
  const date = $('pDate').value;
  const forYear = Number($('pForYear').value);
  const notes = $('pNotes') ? $('pNotes').value.trim() : '';
  const donorName = isDonation ? ($('pDonorName') ? $('pDonorName').value.trim() : '') : '';
  
  if(!isDonation && !memberId){ toast('اختر العضو', 'error'); return; }
  if(isNaN(amount) || amount < 0){ toast('المبلغ غير صحيح', 'error'); return; }
  if(!date){ toast('التاريخ مطلوب', 'error'); return; }
  
  if(amount === 0){
    if(!confirm('تسجيل دفعة بقيمة 0؟ (للأعضاء المعفيين)')) return;
  }
  
  showLoad(true);
  try {
    const m = memberId ? getMemberById(memberId) : null;
    
    const receiptNumber = await generateReceiptNumber(fund, forYear);
    
    const payment = {
      memberId: memberId,
      fund: fund,
      amount: amount,
      date: date,
      year: forYear,
      forYear: forYear,
      notes: isDonation ? (donorName + (notes ? ' | ' + notes : '')) : notes,
      collectorId: u.id,
      collectorName: u.name,
      receiptNumber: receiptNumber,
      createdAt: new Date().toISOString()
    };
    
    const id = await dbPut('payments', payment);
    payment.id = id;
    S.payments.push(payment);
    
    if(memberId) CACHE.invalidateMember(memberId);
    CACHE.invalidateAll();
    
    await logAudit('add', 'payment', id, { fund: fund, memberId: memberId, amount: amount, forYear: forYear });
    
    toast('✅ تم تسجيل الدفعة', 'success', 2500);
    closeSheetAll();
    
    // عرض خيار إرسال الوصل
    if(m && m.phone && amount > 0){
      setTimeout(function(){
        if(confirm('📱 إرسال وصل الدفع لـ ' + m.name + '؟')){
          sendPaymentReceiptWA(id);
        }
      }, 400);
    } else if(amount > 0){
      setTimeout(function(){
        if(confirm('🖨️ طباعة وصل الدفع؟')){
          printPaymentReceipt(id);
        }
      }, 400);
    }
    
    go(S.page);
  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
  showLoad(false);
}

async function generateReceiptNumber(fund, year){
  const prefix = fund === 'assoc' ? 'J' : fund === 'death' ? 'W' : 'T';
  const count = S.payments.filter(function(p){
    return p.fund === fund && (Number(p.forYear) === year || Number(p.year) === year);
  }).length + 1;
  return prefix + '-' + year + '-' + String(count).padStart(4, '0');
}

function openQuickPaySheet(memberId){
  const m = getMemberById(memberId);
  if(!m) return;
  const full = computeMemberFull(memberId);
  
  const options = [];
  if(m.assocStartYear && full && full.total.assocRem > 0){
    options.push({ icon:'💰', name:'جمعية', color:'assoc', rem: full.total.assocRem, fund:'assoc' });
  }
  if(m.deathStartYear && full && full.total.deathRem > 0){
    options.push({ icon:'⚰️', name:'وفاة', color:'death', rem: full.total.deathRem, fund:'death' });
  }

    if(m.assocStartYear) options.push({ icon:'💰', name:'جمعية', color:'assoc', rem:0, fund:'assoc' });
    if(m.deathStartYear) options.push({ icon:'⚰️', name:'وفاة', color:'death', rem:0, fund:'death' });

  html += '<div style="font-size:12px;color:var(--muted);margin-top:4px">' + esc(m.code || '') + ' • ' + esc(m.sector || '') + '</div>';

function renderCollect(){
  const u = S.currentUser;
  const isCollector = u.role === 'collector';
  
  let list = S.members;
  
  if(isCollector){
    list = list.filter(function(m){
      const cf = u.collectFund;
      if(cf === 'assoc') return m.assocStartYear;
      if(cf === 'death') return m.deathStartYear;
      return m.assocStartYear || m.deathStartYear;
    });
    if(u.sector) list = list.filter(function(m){ return m.sector === u.sector; });
  }
  
  const filter = S.filters.collector || 'all';
  if(filter === 'late'){
    list = list.filter(function(m){
      const full = computeMemberFull(m.id);
      return full && full.total.totalRem > 0;
    });
  } else if(filter === 'paid'){
    list = list.filter(function(m){
      const full = computeMemberFull(m.id);
      return full && full.total.totalRem <= 0;
    });
  }
  
  if(S.search){
    const s = normAr(S.search);
    list = list.filter(function(m){
      return normAr(m.name + ' ' + (m.code || '') + ' ' + (m.phone || '')).indexOf(s) > -1;
    });
  }
  
  list.sort(function(a, b){
    const fa = computeMemberFull(a.id);
    const fb = computeMemberFull(b.id);
    const ra = fa ? fa.total.totalRem : 0;
    const rb = fb ? fb.total.totalRem : 0;
    if(ra !== rb) return rb - ra;
    return String(a.name).localeCompare(String(b.name), 'ar');
  });
  
  const allList = isCollector
    ? S.members.filter(function(m){
        const cf = u.collectFund;
        if(cf === 'assoc') return m.assocStartYear;
        if(cf === 'death') return m.deathStartYear;
        return m.assocStartYear || m.deathStartYear;
      }).filter(function(m){ return !u.sector || m.sector === u.sector; })
    : S.members;
  
  const counts = {
    all: allList.length,
    late: allList.filter(function(m){
      const full = computeMemberFull(m.id);
      return full && full.total.totalRem > 0;
    }).length,
    paid: allList.filter(function(m){
      const full = computeMemberFull(m.id);
      return full && full.total.totalRem <= 0;
    }).length
  };
  
  let html = '';
  html += '<div class="card" style="padding:10px;margin-bottom:8px">';
  html += '<div class="chips" style="margin-bottom:0">';
  html += '<button class="chip ' + (filter === 'all' ? 'on' : '') + '" onclick="setCollectFilter(\'all\')">📋 الكل (' + counts.all + ')</button>';
  html += '<button class="chip ' + (filter === 'late' ? 'on' : '') + '" onclick="setCollectFilter(\'late\')">⏳ متأخرون (' + counts.late + ')</button>';

async function saveDelivery(){
  const u = S.currentUser;
  const fund = $('delFund').value;
  const toUserId = Number($('delTo').value);
  const amount = Number($('delAmount').value);
  const notes = cleanText($('delNotes').value);
  
  if(!fund){ toast('اختر الصندوق', 'error'); return; }
  if(!toUserId){ toast('اختر المستلم', 'error'); return; }
  if(!amount || amount <= 0){ toast('المبلغ مطلوب', 'error'); return; }
  
  const toUser = S.users.find(function(x){ return x.id === toUserId; });
  if(!toUser) return;
  
  try {
    const delivery = {
      fromUserId: u.id,
      fromUserName: u.name,
      toUserId: toUserId,
      toUserName: toUser.name,
      fund: fund,
      amount: amount,
      notes: notes,
      date: today(),
      deliveryNumber: await generateDeliveryNumber(),
      createdAt: new Date().toISOString()
    };
    
    const id = await dbPut('deliveries', delivery);
    delivery.id = id;
    S.deliveries.push(delivery);
    
    CACHE.invalidateAll();
    await logAudit('add', 'delivery', id, { amount: amount, to: toUser.name, fund: fund });
    
    toast('📤 تم التسجيل', 'success', 2500);
    closeSheetAll();
    
    setTimeout(function(){
      if(confirm('📱 توثيق واتساب للأمين؟')){
        sendDeliveryNotification(id);
      }
    }, 400);
    
    go(S.page);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

async function generateDeliveryNumber(){
  const todayStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  const count = S.deliveries.filter(function(d){ return d.date === today(); }).length + 1;
  return 'D-' + todayStr + '-' + String(count).padStart(3, '0');
}

function sendDeliveryNotification(deliveryId){
  const d = S.deliveries.find(function(x){ return x.id === deliveryId; });
  if(!d) return;
  
  const fundLabel = d.fund === 'assoc' ? '💰 الجمعية' : d.fund === 'death' ? '⚰️ الوفاة' : '💚 التبرعات';
  
  let txt = '📤 *توثيق تسليم*\n🏘️ صندوق زعورة\n━━━━━━━━━━━━━━\n\n';
  txt += '🔢 رقم التسليم: *' + (d.deliveryNumber || '—') + '*\n';
  txt += '📅 ' + fmtDate(d.date) + '\n\n';
  txt += '👤 من: ' + d.fromUserName + '\n';
  txt += '👤 إلى: ' + d.toUserName + '\n\n';

  txt += '💰 المبلغ: *' + fmtNum(d.amount) + ' ل.س*\n\n';

  const phone = toUser && toUser.phone ? toUser.phone.replace(/^0/, '').replace(/^\+963/, '') : null;
  
  if(phone){
    if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){

  const d = S.deliveries.find(function(x){ return x.id === id; });

  if(!confirm('استلام ' + fmtNum(d.amount) + ' ل.س من ' + d.fromUserName + '؟')) return;
  
  try {
    d.toUserId = S.currentUser.id;

async function editDeliveryAmount(id){
  const d = S.deliveries.find(function(x){ return x.id === id; });
  if(!d) return;
  const newAmount = prompt('المبلغ الجديد:', d.amount);
  if(newAmount === null) return;
  const n = Number(newAmount);
  if(isNaN(n) || n <= 0){ toast('قيمة غير صحيحة', 'error'); return; }
  d.amount = n;
  d.editedAt = new Date().toISOString();
  d.editedBy = S.currentUser.name;
  await dbPut('deliveries', d);
  CACHE.invalidateAll();
  toast('✅ تم التعديل');
  closeSheetAll();
  setTimeout(function(){ go(S.page); }, 200);
}

async function reverseDelivery(id){
  if(!confirm('عكس الاستلام؟ التسليم سيعود معلّقاً.')) return;
  const d = S.deliveries.find(function(x){ return x.id === id; });
  if(!d) return;
  delete d.receivedAt;
  delete d.receivedBy;
  d.reversedAt = new Date().toISOString();
  d.reversedBy = S.currentUser.name;
  await dbPut('deliveries', d);
  CACHE.invalidateAll();
  toast('↩️ تم العكس');
  closeSheetAll();
  setTimeout(function(){ go(S.page); }, 200);
}

async function deleteDeliveryRecord(id){
  if(!confirm('⚠️ حذف التسليم نهائياً؟')) return;
  if(!confirm('تأكيد أخير!')) return;
  await dbDel('deliveries', id);
  S.deliveries = S.deliveries.filter(function(x){ return x.id !== id; });
  CACHE.invalidateAll();
  toast('🗑️ تم الحذف');
  closeSheetAll();
  setTimeout(function(){ go(S.page); }, 200);
}

function renderDeaths(){
  const deaths = S.deaths.slice().sort(function(a, b){
    if((b.year || 0) !== (a.year || 0)) return (b.year || 0) - (a.year || 0);
    return (b.deathDate || '').localeCompare(a.deathDate || '');
  });
  
  const y = S.currentYear;
  const yearDeaths = deaths.filter(function(d){ return Number(d.year) === y; });
  const totalComp = yearDeaths.reduce(function(s, d){ return s + (Number(d.compensation) || 0); }, 0);
  const totalCompAll = deaths.reduce(function(s, d){ return s + (Number(d.compensation) || 0); }, 0);
  
  const filter = S.filters.deaths || 'year';
  const displayed = filter === 'year' ? yearDeaths : deaths;
  
  let html = '';
  
  html += '<div class="stats-scroll">';
  html += '<div class="stat red"><div class="val">' + yearDeaths.length + '</div><div class="lbl">🪦 وفيات ' + y + '</div></div>';
  html += '<div class="stat orange"><div class="val">' + fmtShort(totalComp) + '</div><div class="lbl">📤 تعويضات ' + y + '</div></div>';
  html += '<div class="stat"><div class="val">' + deaths.length + '</div><div class="lbl">📊 الإجمالي</div></div>';
  html += '<div class="stat purple"><div class="val">' + fmtShort(totalCompAll) + '</div><div class="lbl">💰 تعويضات كلي</div></div>';
  html += '</div>';
  
  html += '<div class="card" style="padding:10px;margin-bottom:8px"><div class="chips" style="margin-bottom:0">';
  html += '<button class="chip ' + (filter === 'year' ? 'on' : '') + '" onclick="setDeathFilter(\'year\')">📅 سنة ' + y + ' (' + yearDeaths.length + ')</button>';
  html += '<button class="chip ' + (filter === 'all' ? 'on' : '') + '" onclick="setDeathFilter(\'all\')">📋 الكل (' + deaths.length + ')</button>';
  html += '</div></div>';
  
  if(hasPerm('death.add')){
    html += '<button class="btn death block lg" onclick="openDeathSheet()" style="margin-bottom:12px">➕ تسجيل وفاة جديدة</button>';
  }
  
  if(displayed.length){
    html += '<div class="list">';
    displayed.slice(0, 200).forEach(function(d){
      const hasComp = Number(d.compensation) > 0;
      html += '<div class="item" onclick="openDeathDetail(' + d.id + ')">';
      html += '<div class="av red">🪦</div>';
      html += '<div class="body"><div class="ttl">' + esc(d.deceasedName) + '</div>';
      html += '<div class="sub">' + fmtDate(d.deathDate) + ' • ' + d.year + (d.recipient ? ' • استلم: ' + esc(d.recipient) : '') + (!hasComp ? ' • ⚠️ بلا تعويض' : '') + '</div></div>';
      html += '<div style="text-align:left;flex-shrink:0">';
      if(hasComp){
        html += '<div style="font-weight:800;color:var(--death);font-size:13px;font-family:\'SF Mono\',monospace">' + fmtShort(d.compensation) + '</div>';
        html += '<div style="font-size:9px;color:var(--muted-2);margin-top:2px">تعويض</div>';
      } else {
        html += '<div style="font-weight:800;color:var(--warning);font-size:13px">⚠️</div>';
      }
      html += '</div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="empty"><span class="ico">🪦</span><h3>لا توجد وفيات</h3><p>' + (filter === 'year' ? 'في سنة ' + y : 'لم يُسجَّل بعد') + '</p></div>';
  }
  
  $('pg-deaths').innerHTML = html;
}

function searchDeathMember(){
  const input = $('dMemberInput');
  const opts = $('dMemberOptions');
  if(!input || !opts) return;
  const q = input.value.trim();
  if(q.length < 1){ opts.classList.remove('on'); return; }
  
  const s = normAr(q);
  const list = S.members.filter(function(m){
    return normAr(m.name).indexOf(s) > -1 || normAr(m.code || '').indexOf(s) > -1;
  }).slice(0, 20);
  
  if(!list.length){
    opts.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:13px;text-align:center">لا نتائج</div>';
    opts.classList.add('on');
    return;
  }
  
  opts.innerHTML = list.map(function(m){
    return '<div class="option-item" onclick="pickDeathMember(' + m.id + ',\'' + esc(m.name).replace(/'/g, "&#39;") + '\')">' +
      '<div style="flex:1;min-width:0"><div style="font-weight:700">' + esc(m.name) + '</div>' +
      '<div style="font-size:10px;color:var(--muted)">' + esc(m.code || '') + ' • ' + esc(m.sector || '') + '</div></div></div>';
  }).join('');
  opts.classList.add('on');
}

function pickDeathMember(id, name){
  $('dMemberInput').value = name;
  $('dMemberId').value = id;
  if(!$('dName').value) $('dName').value = name;
  $('dMemberOptions').classList.remove('on');
}

async function saveDeath(){
  const name = cleanText($('dName').value);
  const date = $('dDate').value;
  const year = Number($('dYear').value);
  const comp = Number($('dComp').value) || 0;
  const recipient = cleanText($('dRecipient').value);
  const notes = cleanText($('dNotes').value);
  const memberId = $('dMemberId').value ? Number($('dMemberId').value) : null;
  const custom = typeof collectCustomFields === 'function' ? collectCustomFields('deaths') : {};
  
  if(!name){ toast('اسم المتوفى مطلوب', 'error'); return; }
  if(!date){ toast('التاريخ مطلوب', 'error'); return; }
  
  const isDup = S.deaths.some(function(d){
    return normAr(d.deceasedName) === normAr(name) && Number(d.year) === year;
  });
  if(isDup){
    if(!confirm('⚠️ توجد وفاة بنفس الاسم في سنة ' + year + '. متابعة؟')) return;
  }
  
  const deathSubs = S.members.filter(function(m){
    return m.deathStartYear && m.deathStartYear <= year && !m.deathExempt;
  }).length;
  const c = getConstants(year);
  const inst = c && c.deathInstallment ? c.deathInstallment : 5000;
  const totalImpact = deathSubs * inst;
  
  if(!confirm('⚰️ تسجيل وفاة "' + name + '"\n\nعدد مشتركي الوفاة: ' + deathSubs + '\nسيُضاف قسط ' + fmtNum(inst) + ' × ' + deathSubs + ' = ' + fmtNum(totalImpact) + ' ل.س\n\nمتابعة؟')) return;
  
  try {
    const death = {
      deceasedName: name,
      memberId: memberId,
      deathDate: date,
      year: year,
      compensation: comp,
      recipient: recipient,
      notes: notes,
      custom: custom,
      recordedBy: S.currentUser.id,
      recordedByName: S.currentUser.name,
      createdAt: new Date().toISOString()
    };
    
    const id = await dbPut('deaths', death);
    death.id = id;
    S.deaths.push(death);
    
    CACHE.invalidateAll();
    await logAudit('add', 'death', id, { name: name, year: year, comp: comp });
    
    // لو ربط بعضو — حدّث حالته
    if(memberId){
      const m = getMemberById(memberId);
      if(m){
        m.memberStatus = 'متوفى';
        m.deathDate = date;
        await dbPut('members', m);
        CACHE.invalidateMember(memberId);
      }
    }
    
    toast('⚰️ تم التسجيل (' + deathSubs + ' قسط)', 'success', 4000);
    closeSheetAll();
    go(S.page);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

  html += '<div style="font-size:12px;color:var(--muted);margin-top:4px">' + fmtDate(d.deathDate) + ' — ' + d.year + '</div></div>';

  html += '<div class="balance-block">';
  html += '<div class="balance-row"><span class="lbl">💰 التعويض</span>';
  html += '<span class="val" style="color:' + (hasComp ? 'var(--death)' : 'var(--warning)') + '">' + (hasComp ? fmtNum(d.compensation) + ' ل.س' : 'غير محدد') + '</span></div>';
  if(d.recipient) html += '<div class="balance-row"><span class="lbl">👤 استلم</span><span class="val">' + esc(d.recipient) + '</span></div>';
  if(d.notes) html += '<div class="balance-row"><span class="lbl">📝 ملاحظات</span><span class="val">' + esc(d.notes) + '</span></div>';
  if(linkedMember) html += '<div class="balance-row"><span class="lbl">👥 عضو مرتبط</span><span class="val">' + esc(linkedMember.name) + '</span></div>';
  if(d.recordedByName) html += '<div class="balance-row"><span class="lbl">👤 سُجّل بواسطة</span><span class="val" style="font-size:11px">' + esc(d.recordedByName) + '</span></div>';
  if(d.updatedFromFinance) html += '<div class="balance-row"><span class="lbl">📊 مُحدَّث من</span><span class="val" style="font-size:11px">الحركات المالية</span></div>';
  if(d.manualEdit) html += '<div class="balance-row"><span class="lbl">✏️ عُدّل يدوياً</span><span class="val" style="font-size:11px">' + esc(d.editedBy || '') + '</span></div>';
  html += '</div>';
  
  // حقول مخصصة
  if(typeof customRenderFields === 'function'){
    html += customRenderFields('deaths', d.custom || {});
  }
  
  if(canEdit || canDelete){
    html += '<div style="display:grid;gap:8px;margin-top:14px">';
    if(canEdit) html += '<button class="btn warning block lg" onclick="closeSheet();setTimeout(function(){openDeathEditSheet(' + id + ')},150)">✏️ تعديل الوفاة</button>';
    if(canDelete) html += '<button class="btn danger block" onclick="deleteDeathConfirmed(' + id + ')">🗑️ حذف نهائي</button>';
    html += '</div>';
  }
  
  openSheet('🪦 ' + d.deceasedName, html, '<button class="btn ghost" onclick="closeSheetAll()">إغلاق</button>', { wide: true });
}

function customRenderFields(target, values){
  const fields = typeof getCustomFields === 'function' ? getCustomFields(target) : [];
  if(!fields.length) return '';
  
  const withValues = fields.filter(function(f){ return values[f.key]; });
  if(!withValues.length) return '';
  
  let html = '<div class="balance-block" style="border-right:4px solid var(--primary)">';
  html += '<div style="font-weight:800;color:var(--primary);margin-bottom:8px">📌 حقول إضافية</div>';
  withValues.forEach(function(f){
    html += '<div class="balance-row"><span class="lbl">' + (f.icon || '📌') + ' ' + esc(f.label) + '</span><span class="val">' + esc(values[f.key]) + '</span></div>';
  });
  html += '</div>';
  return html;
}

async function saveDeathEdit(id){
  const d = S.deaths.find(function(x){ return x.id === id; });
  if(!d) return;
  
  const name = cleanText($('edName').value);
  const date = $('edDate').value;
  const year = Number($('edYear').value);
  const comp = Number($('edComp').value) || 0;
  const recipient = cleanText($('edRecipient').value);
  const notes = cleanText($('edNotes').value);
  const custom = typeof collectCustomFields === 'function' ? collectCustomFields('deaths') : {};
  
  if(!name){ toast('اسم المتوفى مطلوب', 'error'); return; }
  if(!date){ toast('التاريخ مطلوب', 'error'); return; }
  if(comp < 0){ toast('التعويض لا يمكن أن يكون سالباً', 'error'); return; }
  
  try {
    const old = Object.assign({}, d);
    d.deceasedName = name;
    d.deathDate = date;
    d.year = year;
    d.compensation = comp;
    d.recipient = recipient;
    d.notes = notes;
    d.custom = custom;
    d.editedAt = new Date().toISOString();
    d.editedBy = S.currentUser.name;
    d.manualEdit = true;
    
    await dbPut('deaths', d);
    
    const i = S.deaths.findIndex(function(x){ return x.id === id; });
    if(i > -1) S.deaths[i] = d;
    
    CACHE.invalidateAll();
    await logAudit('update', 'death', id, { old: { comp: old.compensation, name: old.deceasedName }, new: { comp: comp, name: name } });
    
    toast('✅ تم الحفظ', 'success', 2500);
    closeSheetAll();
    setTimeout(function(){ openDeathDetail(id); }, 200);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

async function deleteDeathConfirmed(id){
  const d = S.deaths.find(function(x){ return x.id === id; });
  if(!d) return;
  
  if(!confirm('⚠️ حذف وفاة "' + d.deceasedName + '"؟')) return;
  if(!confirm('تأكيد أخير!')) return;
  
  try {
    await dbDel('deaths', id);
    S.deaths = S.deaths.filter(function(x){ return x.id !== id; });
    CACHE.invalidateAll();
    await logAudit('delete', 'death', id, { name: d.deceasedName, comp: d.compensation });
    toast('🗑️ تم الحذف', 'success', 2500);
    closeSheetAll();
    go(S.page);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

];

function renderStore(){
  const items = S.storeItems;
  const totalQty = items.reduce(function(s, i){ return s + (Number(i.quantity) || 0); }, 0);
  const needMaintenance = items.filter(function(i){ return i.condition === 'يحتاج صيانة'; }).length;
  const totalValue = items.reduce(function(s, i){
    const qty = Number(i.quantity) || 0;
    const price = Number(i.lastPrice) || 0;
    return s + (qty * price);
  }, 0);
  
  let html = '';
  
  html += '<div class="stats-scroll">';
  html += '<div class="stat"><div class="val">' + items.length + '</div><div class="lbl">📦 أنواع</div></div>';
  html += '<div class="stat green"><div class="val">' + totalQty + '</div><div class="lbl">📊 كميات</div></div>';
  html += '<div class="stat orange"><div class="val">' + needMaintenance + '</div><div class="lbl">🔧 صيانة</div></div>';
  html += '<div class="stat purple"><div class="val">' + fmtShort(totalValue) + '</div><div class="lbl">💰 قيمة تقريبية</div></div>';
  html += '</div>';
  
  html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">';
  if(hasPerm('store.manage')){
    html += '<button class="btn primary block" onclick="openStoreItemSheet()">➕ مادة</button>';
    html += '<button class="btn info block" onclick="openStoreMovementsList()">🔄 السجل</button>';
    html += '<button class="btn warning block" onclick="openStoreReports()">📊 تقارير</button>';
  } else {
    html += '<button class="btn info block" style="grid-column:1/-1" onclick="openStoreMovementsList()">🔄 السجل</button>';
  }
  html += '</div>';
  
  if(items.length){
    html += '<div class="list">';
    items.forEach(function(item){
      const qty = Number(item.quantity) || 0;
      const isLow = qty === 0;
      const isWarning = item.condition === 'يحتاج صيانة';
      const icon = isLow ? '⚠️' : isWarning ? '🔧' : '📦';
      const color = isLow ? 'red' : isWarning ? 'orange' : 'green';
      html += '<div class="item" onclick="openStoreItemSheet(' + item.id + ')">';
      html += '<div class="av ' + color + '">' + icon + '</div>';
      html += '<div class="body"><div class="ttl">' + esc(item.name) + '</div>';
      html += '<div class="sub">' + qty + ' ' + esc(item.unit || '') + ' • ' + esc(item.category || '') + (item.condition ? ' • ' + esc(item.condition) : '') + '</div></div>';
      html += '<div style="text-align:left;flex-shrink:0">';
      html += '<div style="font-weight:800;font-family:\'SF Mono\',monospace;font-size:14px;color:' + (isLow ? 'var(--death)' : 'var(--text)') + '">' + qty + '</div>';
      html += '<div style="font-size:9px;color:var(--muted-2)">' + esc(item.unit || 'وحدة') + '</div></div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="empty"><span class="ico">📦</span><h3>المستودع فارغ</h3><p>أضف موادك الخدمية (كراسي، شوادر، طبخ، تابوت، مغسل)</p></div>';
  }
  
  $('pg-store').innerHTML = html;
}

  });

      '<button class="btn ghost sm" onclick="closeSheetAll();setTimeout(function(){openStoreMovementSheet(' + id + ')},150)">🔄 حركة</button>' +
      '<button class="btn primary" onclick="saveStoreItem(' + id + ')">💾</button>';
  
  openSheet(isNew ? '➕ مادة جديدة' : '✏️ ' + esc(item.name), html, foot, { wide: true, focus:'stiName' });

async function saveStoreItem(id){
  const name = cleanText($('stiName').value);
  if(!name){ toast('اسم المادة مطلوب', 'error'); return; }
  
  try {
    const obj = {
      name: name,
      category: $('stiCategory').value,
      unit: cleanText($('stiUnit').value) || 'قطعة',
      quantity: Number($('stiQuantity').value) || 0,
      minQty: Number($('stiMinQty').value) || 5,
      condition: $('stiCondition').value,
      notes: cleanText($('stiNotes').value),
      custom: typeof collectCustomFields === 'function' ? collectCustomFields('storeItems') : {}
    };
    
    if(id){
      obj.id = id;
      obj.totalOwned = S.storeItems.find(function(x){ return x.id === id; })?.totalOwned || obj.quantity;
      await dbPut('storeItems', obj);
      const i = S.storeItems.findIndex(function(x){ return x.id === id; });
      if(i > -1) S.storeItems[i] = obj;
      toast('✅ تم التعديل');
    } else {
      obj.totalOwned = obj.quantity;
      const newId = await dbPut('storeItems', obj);
      obj.id = newId;
      S.storeItems.push(obj);
      toast('✅ تمت الإضافة');
    }
    
    closeSheetAll();
    go(S.page);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

async function deleteStoreItem(id){
  if(!confirm('حذف المادة؟')) return;
  try {
    await dbDel('storeItems', id);
    S.storeItems = S.storeItems.filter(function(x){ return x.id !== id; });
    toast('🗑️');
    closeSheetAll();
    go(S.page);
  } catch(e){
    toast('خطأ', 'error');
  }
}

  html += '<option value="donation"' + (mov && mov.fund === 'donation' ? ' selected' : '') + '>💚 صندوق التبرعات</option>';
  html += '</select>';
  html += '<div class="fld-hint" id="stmFundHint"></div></div>';
  
  html += '<div class="fld" id="stmPartyBox" style="display:none">';
  html += '<label id="stmPartyLabel">الشخص <span class="req">*</span></label>';
  html += '<input id="stmParty" value="' + (mov && mov.party ? esc(mov.party) : '') + '" placeholder="اسم الشخص"></div>';
  
  html += '<div class="fld" id="stmRefBox">';
  html += '<label id="stmRefLabel">الجهة/الشخص</label>';

  openSheet(isEdit ? '✏️ تعديل حركة' : '🔄 حركة مستودع', html, foot, { wide: true, focus:'stmQty' });

function onStoreMovementTypeChange(){
  const type = $('stmType') ? $('stmType').value : '';
  if(!type) return;
  const meta = MOVEMENT_TYPES.find(function(t){ return t.k === type; });
  if(!meta) return;
  
  const priceBox = $('stmPriceBox');
  if(priceBox) priceBox.style.display = meta.hasPrice ? 'block' : 'none';
  
  const fundBox = $('stmFundBox');
  if(fundBox){
    fundBox.style.display = meta.hasFund ? 'block' : 'none';
    if(meta.hasFund){
      const label = $('stmFundLabel');
      const hint = $('stmFundHint');
      if(meta.toFund === 'expense'){
        if(label) label.innerHTML = 'الصندوق الدافع <span class="req">*</span>';
        if(hint) hint.textContent = 'سيُسجَّل مصروف من هذا الصندوق';
      } else if(meta.toFund === 'income'){
        if(label) label.innerHTML = 'الصندوق المستلم <span class="req">*</span>';
        if(hint) hint.textContent = 'سيُسجَّل إيراد إلى هذا الصندوق';
      }
    }
  }
  
  const partyBox = $('stmPartyBox');
  if(partyBox) partyBox.style.display = meta.hasParty ? 'block' : 'none';
  
  const refLabel = $('stmRefLabel');
  if(refLabel){
    if(type === 'out') refLabel.textContent = 'من استلم؟';
    else if(type === 'in') refLabel.textContent = 'من أعاد؟';
    else if(type === 'damaged') refLabel.textContent = 'سبب التلف';
    else refLabel.textContent = 'الجهة/الشخص';
  }
}

async function saveStoreMovement(movementId){
  const isEdit = !!movementId;
  
  const itemId = Number($('stmItemId').value);
  const type = $('stmType').value;
  const qty = Number($('stmQty').value);
  const price = Number($('stmPrice') ? $('stmPrice').value : 0) || 0;
  const fund = $('stmFund') ? $('stmFund').value : null;
  const party = cleanText($('stmParty') ? $('stmParty').value : '');
  const ref = cleanText($('stmRef').value);
  const notes = cleanText($('stmNotes').value);
  const custom = typeof collectCustomFields === 'function' ? collectCustomFields('storeMovements') : {};
  
  if(!itemId){ toast('اختر المادة', 'error'); return; }
  if(!qty || qty <= 0){ toast('الكمية مطلوبة', 'error'); return; }
  
  const meta = MOVEMENT_TYPES.find(function(t){ return t.k === type; });
  if(!meta){ toast('نوع حركة غير معروف', 'error'); return; }
  
  if(meta.hasPrice && !price && !isEdit){
    if(!confirm('لم تُدخل السعر. متابعة بدون تسجيل مالي؟')) return;
  }
  if(meta.hasFund && !fund){ toast('اختر الصندوق', 'error'); return; }
  if(meta.hasParty && !party){ toast('أدخل اسم الشخص', 'error'); return; }
  
  const item = S.storeItems.find(function(x){ return x.id === itemId; });
  if(!item){ toast('المادة غير موجودة', 'error'); return; }
  
  showLoad(true);
  
  try {
    // عكس الأثر القديم إن كان تعديل
    let oldMovement = null;
    if(isEdit){
      oldMovement = S.storeMovements.find(function(m){ return m.id === movementId; });
      if(oldMovement){
        const oldMeta = MOVEMENT_TYPES.find(function(t){ return t.k === oldMovement.type; });
        if(oldMeta){
          item.quantity = (Number(item.quantity) || 0) - (oldMeta.sign * oldMovement.quantity);
        }
        if(oldMovement.linkedIncomeId){
          await dbDel('incomes', oldMovement.linkedIncomeId);
          S.incomes = S.incomes.filter(function(i){ return i.id !== oldMovement.linkedIncomeId; });
        }
        if(oldMovement.linkedExpenseId){
          await dbDel('expenses', oldMovement.linkedExpenseId);
          S.expenses = S.expenses.filter(function(e){ return e.id !== oldMovement.linkedExpenseId; });
        }
      }
    }
    
    const newQty = (Number(item.quantity) || 0) + (meta.sign * qty);
    if(newQty < 0){
      toast('الكمية غير كافية', 'error');
      showLoad(false);
      return;
    }
    
    let linkedIncomeId = null;
    let linkedExpenseId = null;
    
    // سجّل الإيراد/المصروف
    if(meta.toFund === 'expense' && price > 0 && fund){
      const expObj = {
        fund: fund,
        category: 'مستودع',
        description: meta.l + ': ' + item.name + ' × ' + qty,
        amount: price,
        date: today(),
        year: S.currentYear,
        notes: (party ? 'من: ' + party + ' • ' : '') + (ref ? 'مرجع: ' + ref + ' • ' : '') + (notes || ''),
        linkedStoreMovementId: movementId || null,
        createdBy: S.currentUser.id,
        recordedByName: S.currentUser.name,
        createdAt: new Date().toISOString()
      };
      const expId = await dbPut('expenses', expObj);
      expObj.id = expId;
      S.expenses.push(expObj);
      linkedExpenseId = expId;
    }
    
    if(meta.toFund === 'income' && price > 0 && fund){
      const incObj = {
        fund: fund,
        category: 'مستودع - بيع',
        amount: price,
        date: today(),
        year: S.currentYear,
        notes: meta.l + ': ' + item.name + ' × ' + qty + (ref ? ' • ' + ref : '') + (notes ? ' • ' + notes : ''),
        linkedStoreMovementId: movementId || null,
        recordedBy: S.currentUser.id,
        recordedByName: S.currentUser.name,
        createdAt: new Date().toISOString()
      };
      const incId = await dbPut('incomes', incObj);
      incObj.id = incId;
      S.incomes.push(incObj);
      linkedIncomeId = incId;
    }
    
    // طبّق الكمية
    item.quantity = newQty;
    if(type === 'new' && price > 0){
      item.lastPrice = qty > 0 ? Math.round(price / qty) : 0;
      item.totalOwned = (Number(item.totalOwned) || 0) + qty;
    } else if(type === 'new'){
      item.totalOwned = (Number(item.totalOwned) || 0) + qty;
    }
    await dbPut('storeItems', item);
    
    const movement = {
      itemId: itemId,
      itemName: item.name,
      type: type,
      quantity: qty,
      price: price,
      fund: fund,
      party: party,
      ref: ref,
      notes: notes,
      custom: custom,
      oldQuantity: isEdit && oldMovement ? oldMovement.oldQuantity : (newQty - meta.sign * qty),
      newQuantity: newQty,
      linkedIncomeId: linkedIncomeId,
      linkedExpenseId: linkedExpenseId,
      userName: S.currentUser.name,
      date: today(),
      createdAt: isEdit && oldMovement ? oldMovement.createdAt : new Date().toISOString(),
      editedAt: isEdit ? new Date().toISOString() : null
    };
    
    if(isEdit){
      movement.id = movementId;
      await dbPut('storeMovements', movement);
      const i = S.storeMovements.findIndex(function(m){ return m.id === movementId; });
      if(i > -1) S.storeMovements[i] = movement;
    } else {
      const id = await dbPut('storeMovements', movement);
      movement.id = id;
      S.storeMovements.push(movement);
    }
    
    CACHE.invalidateAll();
    await logAudit(isEdit ? 'update' : 'add', 'storeMovement', movement.id, { type: type, qty: qty, price: price });
    
    toast(isEdit ? '✅ تم التعديل' : '✅ تم التسجيل', 'success', 2500);
    closeSheetAll();
    go(S.page);
  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
  
  showLoad(false);
}

async function deleteStoreMovement(movementId){
  const mov = S.storeMovements.find(function(m){ return m.id === movementId; });
  if(!mov){ toast('الحركة غير موجودة', 'error'); return; }
  
  if(!confirm('⚠️ حذف هذه الحركة؟\n\n' + mov.itemName + ' — ' + mov.quantity + '\n\nسيُعكس الأثر على المخزون والمالية.')) return;
  if(!confirm('تأكيد أخير!')) return;
  
  showLoad(true);
  
  try {
    const item = S.storeItems.find(function(x){ return x.id === mov.itemId; });
    const meta = MOVEMENT_TYPES.find(function(t){ return t.k === mov.type; });
    
    if(item && meta){
      item.quantity = (Number(item.quantity) || 0) - (meta.sign * mov.quantity);
      await dbPut('storeItems', item);
    }
    
    if(mov.linkedIncomeId){
      await dbDel('incomes', mov.linkedIncomeId);
      S.incomes = S.incomes.filter(function(i){ return i.id !== mov.linkedIncomeId; });
    }
    if(mov.linkedExpenseId){
      await dbDel('expenses', mov.linkedExpenseId);
      S.expenses = S.expenses.filter(function(e){ return e.id !== mov.linkedExpenseId; });
    }
    
    await dbDel('storeMovements', movementId);
    S.storeMovements = S.storeMovements.filter(function(m){ return m.id !== movementId; });
    
    CACHE.invalidateAll();
    await logAudit('delete', 'storeMovement', movementId, { item: mov.itemName, qty: mov.quantity });
    
    toast('🗑️ تم الحذف', 'success', 2000);
    closeSheetAll();
    go(S.page);
  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
  
  showLoad(false);
}

function openStoreReports(){
  const items = S.storeItems;
  const totalQty = items.reduce(function(s, i){ return s + (Number(i.quantity) || 0); }, 0);
  const totalOwned = items.reduce(function(s, i){ return s + (Number(i.totalOwned) || 0); }, 0);
  const lowStock = items.filter(function(i){ return Number(i.quantity) < Number(i.minQty || 5); });
  const damaged = items.filter(function(i){ return i.condition === 'يحتاج صيانة' || i.condition === 'تالف'; });
  
  const usageMap = {};
  S.storeMovements.filter(function(m){ return m.type === 'out'; }).forEach(function(m){
    usageMap[m.itemName] = (usageMap[m.itemName] || 0) + m.quantity;
  });
  const topUsed = Object.keys(usageMap).map(function(k){ return [k, usageMap[k]]; })
    .sort(function(a, b){ return b[1] - a[1]; }).slice(0, 5);
  
  let html = '';
  html += '<div class="stats-scroll">';
  html += '<div class="stat"><div class="val">' + items.length + '</div><div class="lbl">📦 أنواع</div></div>';
  html += '<div class="stat green"><div class="val">' + totalQty + '</div><div class="lbl">📊 كميات حالية</div></div>';
  html += '<div class="stat blue"><div class="val">' + totalOwned + '</div><div class="lbl">💼 إجمالي مملوك</div></div>';
  html += '<div class="stat red"><div class="val">' + lowStock.length + '</div><div class="lbl">⚠️ كميات منخفضة</div></div>';
  html += '</div>';
  
  if(lowStock.length){
    html += '<div class="card" style="border-right:4px solid var(--death)">';
    html += '<div class="card-head"><h2 style="color:var(--death)">⚠️ كميات منخفضة (' + lowStock.length + ')</h2></div>';
    html += '<div class="list" style="margin:-14px;border-radius:0;border:0">';
    lowStock.forEach(function(i){
      html += '<div class="item" style="cursor:default">';
      html += '<div class="av red">⚠️</div>';
      html += '<div class="body"><div class="ttl">' + esc(i.name) + '</div>';
      html += '<div class="sub">المتوفر: ' + i.quantity + ' • الحد الأدنى: ' + (i.minQty || 5) + '</div></div></div>';
    });
    html += '</div></div>';
  }
  
  if(damaged.length){
    html += '<div class="card" style="border-right:4px solid var(--warning)">';
    html += '<div class="card-head"><h2 style="color:var(--warning)">🔧 تحتاج صيانة (' + damaged.length + ')</h2></div>';
    html += '<div class="list" style="margin:-14px;border-radius:0;border:0">';
    damaged.forEach(function(i){
      html += '<div class="item" style="cursor:default">';
      html += '<div class="av orange">🔧</div>';
      html += '<div class="body"><div class="ttl">' + esc(i.name) + '</div>';
      html += '<div class="sub">' + esc(i.condition) + ' • ' + i.quantity + ' ' + esc(i.unit || '') + '</div></div></div>';
    });
    html += '</div></div>';
  }
  
  if(topUsed.length){
    html += '<div class="card">';
    html += '<div class="card-head"><h2>📊 الأكثر استخداماً</h2></div>';
    topUsed.forEach(function(t, i){
      html += '<div class="balance-row"><span class="lbl">' + (i + 1) + '. ' + esc(t[0]) + '</span><span class="val">' + t[1] + '</span></div>';
    });
    html += '</div>';
  }
  
  openSheet('📊 تقارير المستودع', html, '<button class="btn ghost" onclick="closeSheetAll()">إغلاق</button>', { wide: true });
}

function renderMeetings(){
  const list = S.meetings.slice().sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });
  
  const upcoming = list.filter(function(m){ return m.date >= today(); }).length;
  const withPending = list.filter(function(m){
    if(!m.decisionsList || !m.decisionsList.length) return false;
    return m.decisionsList.some(function(d){ return d.status === 'قيد التنفيذ'; });
  }).length;
  
  let html = '';
  
  if(list.length){
    html += '<div class="stats-scroll">';
    html += '<div class="stat"><div class="val">' + list.length + '</div><div class="lbl">📋 إجمالي</div></div>';
    html += '<div class="stat blue"><div class="val">' + upcoming + '</div><div class="lbl">📅 قادمة</div></div>';
    html += '<div class="stat orange"><div class="val">' + withPending + '</div><div class="lbl">⏳ قرارات معلقة</div></div>';
    html += '</div>';
  }
  
  if(hasPerm('meetings.manage')){
    html += '<button class="btn primary block lg" onclick="openEditMeetingSheet()" style="margin-bottom:12px">➕ اجتماع جديد</button>';
  }
  
  if(list.length){
    html += '<div class="list">';
    list.forEach(function(m){
      const decs = m.decisionsList || [];
      const pendingDecs = decs.filter(function(d){ return d.status === 'قيد التنفيذ'; }).length;
      const doneDecs = decs.filter(function(d){ return d.status === 'منفذ'; }).length;
      html += '<div class="item" onclick="openMeetingDetail(' + m.id + ')">';
      html += '<div class="av blue">📋</div>';
      html += '<div class="body"><div class="ttl">' + esc(m.title) + '</div>';
      html += '<div class="sub">' + fmtDate(m.date) + ' • ' + esc(m.type || '') + (m.attendeesCount ? ' • 👥 ' + m.attendeesCount : '') + (decs.length ? ' • ' + doneDecs + '/' + decs.length + ' قرار' : '') + '</div></div>';
      if(pendingDecs > 0) html += '<span class="badge warning" style="font-size:9px">' + pendingDecs + ' معلّق</span>';
      html += '<span class="trail">›</span></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="empty"><span class="ico">📋</span><h3>لا توجد اجتماعات</h3><p>وثّق قرارات اللجنة والاجتماعات العامة</p></div>';
  }
  
  $('pg-meetings').innerHTML = html;
}

async function saveMeeting(id){
  const title = cleanText($('mtTitle').value);
  if(!title){ toast('العنوان مطلوب', 'error'); return; }
  
  try {
    const decisionsText = cleanText($('mtDecisions').value);
    const oldMeeting = id ? S.meetings.find(function(x){ return x.id === id; }) : null;
    
    const lines = decisionsText.split('\n').map(function(l){ return l.trim(); }).filter(function(l){ return l; });
    const decisionsList = lines.map(function(line, i){
      const existing = (oldMeeting && oldMeeting.decisionsList || []).find(function(d){ return d.text === line; });
      return existing || {
        id: 'd_' + Date.now() + '_' + i,
        text: line,
        status: 'قيد التنفيذ',
        createdAt: new Date().toISOString()
      };
    });
    
    const obj = {
      title: title,
      type: $('mtType').value,
      date: $('mtDate').value,
      location: cleanText($('mtLocation').value),
      attendeesCount: Number($('mtAttendees').value) || 0,
      agenda: cleanText($('mtAgenda').value),
      decisions: decisionsText,
      decisionsList: decisionsList,
      custom: typeof collectCustomFields === 'function' ? collectCustomFields('meetings') : {}
    };
    
    if(id){
      obj.id = id;
      obj.createdAt = oldMeeting ? oldMeeting.createdAt : new Date().toISOString();
      await dbPut('meetings', obj);
      const i = S.meetings.findIndex(function(x){ return x.id === id; });
      if(i > -1) S.meetings[i] = obj;
      toast('✅');
    } else {
      obj.createdAt = new Date().toISOString();
      const newId = await dbPut('meetings', obj);
      obj.id = newId;
      S.meetings.push(obj);
      toast('✅');
    }
    
    await logAudit(id ? 'update' : 'add', 'meeting', obj.id, { title: title });
    closeSheetAll();
    go(S.page);
  } catch(e){
    toast('خطأ', 'error');
  }
}

async function deleteMeeting(id){
  if(!confirm('حذف الاجتماع؟')) return;
  try {
    await dbDel('meetings', id);
    S.meetings = S.meetings.filter(function(x){ return x.id !== id; });
    toast('🗑️');
    closeSheetAll();
    go(S.page);
  } catch(e){
    toast('خطأ', 'error');
  }
}

function openMeetingDetail(id){
  const m = S.meetings.find(function(x){ return x.id === id; });
  if(!m) return;
  
  const decs = m.decisionsList || [];
  const pending = decs.filter(function(d){ return d.status === 'قيد التنفيذ'; });
  const done = decs.filter(function(d){ return d.status === 'منفذ'; });
  
  let html = '';
  html += '<div style="padding:14px;background:var(--primary-soft);border-radius:12px;margin-bottom:14px">';
  html += '<div style="font-weight:800;font-size:16px">' + esc(m.title) + '</div>';
  html += '<div style="font-size:12px;color:var(--muted);margin-top:6px">📅 ' + fmtDate(m.date) + ' • ' + esc(m.type || '') + (m.location ? ' • 📍 ' + esc(m.location) : '') + '</div>';
  if(m.attendeesCount) html += '<div style="font-size:12px;color:var(--muted);margin-top:4px">👥 الحضور: ' + m.attendeesCount + '</div>';
  html += '</div>';
  
  if(decs.length){
    html += '<div class="card">';
    html += '<div class="card-head"><h2>✅ القرارات (' + done.length + '/' + decs.length + ')</h2>';
    html += '<div style="font-size:11px;color:var(--muted)">' + pending.length + ' معلّق</div></div>';

      '<button class="btn primary" onclick="shareMeetingWA(' + id + ')">📱 واتساب</button>'

async function toggleDecisionStatus(meetingId, decisionId){
  const m = S.meetings.find(function(x){ return x.id === meetingId; });
  if(!m || !m.decisionsList) return;
  
  const d = m.decisionsList.find(function(x){ return x.id === decisionId; });
  if(!d) return;
  
  if(d.status === 'منفذ'){
    d.status = 'قيد التنفيذ';
    delete d.doneAt;
    delete d.doneBy;
  } else {
    d.status = 'منفذ';
    d.doneAt = new Date().toISOString();
    d.doneBy = S.currentUser.name;
  }
  
  try {
    await dbPut('meetings', m);
    toast(d.status === 'منفذ' ? '✅ تم التنفيذ' : '↩️ رجع قيد التنفيذ', 'success', 2000);
    closeSheetAll();
    setTimeout(function(){ openMeetingDetail(meetingId); }, 200);
  } catch(e){
    toast('خطأ', 'error');
  }
}

function shareMeetingWA(id){
  const m = S.meetings.find(function(x){ return x.id === id; });
  if(!m) return;
  
  let txt = '📋 *' + m.title + '*\n📅 ' + fmtDate(m.date) + '\n';
  if(m.location) txt += '📍 ' + m.location + '\n';
  if(m.attendeesCount) txt += '👥 الحضور: ' + m.attendeesCount + '\n';
  if(m.agenda) txt += '\n*جدول الأعمال:*\n' + m.agenda + '\n';
  if(m.decisions) txt += '\n*القرارات:*\n' + m.decisions + '\n';
  txt += '\n_صندوق زعورة_';
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
}

function renderInOut(){
  const u = S.currentUser;

  const y = S.currentYear;
  
  const incomes = S.incomes.filter(function(i){ return i.fund === fund && Number(i.year) === y; })
    .sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });

    .sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });
  
  const totalInc = incomes.reduce(function(s, i){ return s + (Number(i.amount) || 0); }, 0);

  html += '</div>';

  html += '<button class="chip ' + (tab === 'out' ? 'on' : '') + '" onclick="setInOutTab(\'out\')">💸 المصاريف (' + expenses.length + ')</button>';

  html += '<button class="btn danger block" onclick="openExpenseSheetFor(\'' + fund + '\')">➕ مصروف</button>';

  if(tab === 'in'){
    if(incomes.length){
      html += '<div class="list">';
      incomes.forEach(function(i){
        html += '<div class="item" onclick="closeSheet();setTimeout(function(){openIncomeSheetFor(\'' + fund + '\',' + i.id + ')},150)">';
        html += '<div class="av green">📥</div>';
        html += '<div class="body"><div class="ttl">' + esc(i.notes || i.category || 'إيراد') + '</div>';
        html += '<div class="sub">' + fmtDate(i.date) + ' • ' + esc(i.category || '') + (i.imported ? ' • 📥' : '') + '</div></div>';
        html += '<div style="font-weight:800;color:var(--success);font-family:\'SF Mono\',monospace">+' + fmtNum(i.amount) + '</div></div>';
      });
      html += '</div>';
    } else {
      html += '<div class="empty"><span class="ico">📥</span><h3>لا توجد واردات</h3></div>';
    }
  } else {
    if(expenses.length){
      html += '<div class="list">';
      expenses.forEach(function(e){
        html += '<div class="item" onclick="closeSheet();setTimeout(function(){openExpenseSheetFor(\'' + fund + '\',' + e.id + ')},150)">';
        html += '<div class="av red">💸</div>';
        html += '<div class="body"><div class="ttl">' + esc(e.description) + '</div>';
        html += '<div class="sub">' + fmtDate(e.date) + ' • ' + esc(e.category || '') + (e.imported ? ' • 📥' : '') + '</div></div>';
        html += '<div style="font-weight:800;color:var(--death);font-family:\'SF Mono\',monospace">-' + fmtNum(e.amount) + '</div></div>';

async function saveIncomeNew(id){
  const amount = Number($('iAmount').value);
  if(!amount || amount <= 0){ toast('المبلغ مطلوب', 'error'); return; }
  
  try {
    const old = id ? await dbGet('incomes', id) : null;
    const obj = {
      fund: $('iFund').value,
      category: $('iCategory').value,
      amount: amount,
      date: $('iDate').value,
      year: Number($('iYear').value),
      notes: cleanText($('iNotes').value),
      custom: typeof collectCustomFields === 'function' ? collectCustomFields('incomes') : {},
      recordedBy: (old && old.recordedBy) || S.currentUser.id,
      recordedByName: (old && old.recordedByName) || S.currentUser.name,
      createdAt: (old && old.createdAt) || new Date().toISOString()
    };
    
    if(id){
      obj.id = id;
      await dbPut('incomes', obj);
      const i = S.incomes.findIndex(function(x){ return x.id === id; });
      if(i > -1) S.incomes[i] = obj;
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('incomes', obj);
      obj.id = newId;
      S.incomes.push(obj);
      toast('✅ تم التسجيل');
    }
    
    CACHE.invalidateAll();
    await logAudit(id ? 'update' : 'add', 'income', obj.id, { fund: obj.fund, amount: amount });
    closeSheetAll();
    go(S.page);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

  if(!confirm('حذف الإيراد؟')) return;
  try {
    await dbDel('incomes', id);
    S.incomes = S.incomes.filter(function(x){ return x.id !== id; });
    CACHE.invalidateAll();
    toast('🗑️');
    closeSheetAll();
    go(S.page);
  } catch(e){
    toast('خطأ', 'error');
  }
}

async function saveOpeningBalance(){
  const data = {
    assoc: Number($('obAssoc').value) || 0,
    death: Number($('obDeath').value) || 0,
    donation: Number($('obDonation').value) || 0
  };
  
  try {
    const existing = S.constants.find(function(x){ return x.year === 0; });
    const obj = Object.assign({ year: 0, note: 'رصيد افتتاحي قبل 2025' }, data);
    
    if(existing){
      obj.id = existing.id;
      await dbPut('constants', obj);
      const i = S.constants.findIndex(function(x){ return x.year === 0; });
      S.constants[i] = obj;
    } else {
      const id = await dbPut('constants', obj);
      obj.id = id;
      S.constants.push(obj);
    }
    
    CACHE.invalidateAll();
    toast('✅ تم الحفظ', 'success', 2500);
    closeSheetAll();
    go(S.page);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

function renderCollectors(){
  const y = S.currentYear;

      html += '<div class="sub">📥 ' + fmtShort(c.total.collected) + ' • ✅ ' + fmtShort(c.total.delivered) + (hasPending ? ' • ⏳ ' + fmtShort(c.total.pending) : ' • ✅ مسوّى') + '</div></div>';

function openCollectorDetail(key, year){
  const y = year || S.currentYear;
  
  let targetUser = null, targetName = '';
  if(key.indexOf('id:') === 0) targetUser = S.users.find(function(u){ return u.id === Number(key.slice(3)); });
  else targetName = key.slice(5);
  
  const matchPayment = function(p){
    const py = Number(p.forYear) || Number(p.year);
    if(py !== y) return false;
    if(targetUser){
      if(p.collectorId === targetUser.id) return true;
      if(!p.collectorId && p.collectorName) return normAr(p.collectorName) === normAr(targetUser.name);
      return false;
    }
    if(p.collectorId) return false;
    return normAr(p.collectorName || '') === normAr(targetName);
  };
  
  const matchDelivery = function(d){
    if(!d.date) return false;
    const dy = new Date(d.date).getFullYear();
    if(dy !== y) return false;
    if(targetUser){
      if(d.fromUserId === targetUser.id) return true;
      if(!d.fromUserId && d.fromUserName) return normAr(d.fromUserName) === normAr(targetUser.name);
      return false;
    }
    if(d.fromUserId) return false;
    return normAr(d.fromUserName || '') === normAr(targetName);
  };
  
  const payments = S.payments.filter(matchPayment).sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });
  const deliveries = S.deliveries.filter(matchDelivery).sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });
  
  const displayName = targetUser ? targetUser.name : (payments[0] ? payments[0].collectorName : targetName || 'غير محدد');
  const roleName = targetUser ? (ROLES[targetUser.role] ? ROLES[targetUser.role].name : '') : '';
  
  const sum = function(arr){ return arr.reduce(function(s, x){ return s + (Number(x.amount) || 0); }, 0); };
  const byFund = function(fund){
    const p = sum(payments.filter(function(x){ return x.fund === fund; }));
    const d = sum(deliveries.filter(function(x){ return x.fund === fund && x.receivedAt; }));
    const pend = sum(deliveries.filter(function(x){ return x.fund === fund && !x.receivedAt && !x.rejectedAt; }));
    return { collected: p, delivered: d, pending: pend };
  };
  
  const assoc = byFund('assoc');
  const death = byFund('death');
  const donation = byFund('donation');
  const totalCollected = assoc.collected + death.collected + donation.collected;
  const totalDelivered = assoc.delivered + death.delivered + donation.delivered;
  const totalPending = assoc.pending + death.pending + donation.pending;
  
  const isManager = S.currentUser.role === 'manager';
  
  let html = '';
  
  html += '<div style="padding:16px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:14px;margin-bottom:14px;text-align:center">';
  html += '<div style="font-size:32px">' + (targetUser ? (ROLES[targetUser.role] ? ROLES[targetUser.role].icon : '👤') : '👤') + '</div>';
  html += '<div style="font-weight:800;font-size:17px;margin-top:6px">' + esc(displayName) + '</div>';
  if(roleName) html += '<div style="font-size:12px;opacity:.9;margin-top:3px">' + roleName + '</div>';
  html += '<div style="font-size:11px;opacity:.85;margin-top:6px">📅 سنة ' + y + '</div></div>';
  
  html += '<div style="padding:14px;background:var(--bg);border-radius:12px;margin-bottom:14px">';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">';
  html += '<div style="text-align:center;padding:10px;background:var(--card);border-radius:10px">';
  html += '<div style="font-size:11px;color:var(--muted)">📥 حصّل</div>';
  html += '<div style="font-size:16px;font-weight:800;color:var(--success);font-family:\'SF Mono\',monospace">' + fmtNum(totalCollected) + '</div></div>';
  html += '<div style="text-align:center;padding:10px;background:var(--card);border-radius:10px">';
  html += '<div style="font-size:11px;color:var(--muted)">✅ استُلم</div>';
  html += '<div style="font-size:16px;font-weight:800;color:var(--assoc);font-family:\'SF Mono\',monospace">' + fmtNum(totalDelivered) + '</div></div>';
  html += '</div>';
  
  if(totalPending > 0){
    html += '<div style="text-align:center;padding:10px;background:var(--warning-soft);border-radius:10px">';
    html += '<div style="font-size:11px;color:#92400e">⏳ معلّق</div>';
    html += '<div style="font-size:18px;font-weight:800;color:var(--warning);font-family:\'SF Mono\',monospace">' + fmtNum(totalPending) + '</div></div>';
  } else {
    html += '<div style="text-align:center;padding:10px;background:var(--donation-light);border-radius:10px;color:#166534;font-weight:800">✅ كل التسليمات مؤكدة</div>';
  }
  html += '</div>';
  
  if(assoc.collected > 0){
    html += '<div class="balance-block" style="border-right:4px solid var(--assoc)">';
    html += '<div style="font-weight:800;color:var(--assoc);margin-bottom:8px">💰 الجمعية</div>';
    html += '<div class="balance-row"><span class="lbl">📥 حصّل</span><span class="val">' + fmtNum(assoc.collected) + '</span></div>';
    html += '<div class="balance-row"><span class="lbl">✅ استُلم</span><span class="val green">' + fmtNum(assoc.delivered) + '</span></div>';
    html += '<div class="balance-row"><span class="lbl">⏳ معلّق</span><span class="val orange">' + fmtNum(assoc.pending) + '</span></div>';
    html += '</div>';
  }
  
  if(death.collected > 0){
    html += '<div class="balance-block" style="border-right:4px solid var(--death)">';
    html += '<div style="font-weight:800;color:var(--death);margin-bottom:8px">⚰️ الوفاة</div>';
    html += '<div class="balance-row"><span class="lbl">📥 حصّل</span><span class="val">' + fmtNum(death.collected) + '</span></div>';
    html += '<div class="balance-row"><span class="lbl">✅ استُلم</span><span class="val green">' + fmtNum(death.delivered) + '</span></div>';
    html += '<div class="balance-row"><span class="lbl">⏳ معلّق</span><span class="val orange">' + fmtNum(death.pending) + '</span></div>';
    html += '</div>';
  }
  
  if(donation.collected > 0){
    html += '<div class="balance-block" style="border-right:4px solid var(--donation)">';
    html += '<div style="font-weight:800;color:var(--donation);margin-bottom:8px">💚 التبرعات</div>';
    html += '<div class="balance-row"><span class="lbl">📥 حصّل</span><span class="val">' + fmtNum(donation.collected) + '</span></div>';
    html += '<div class="balance-row"><span class="lbl">✅ استُلم</span><span class="val green">' + fmtNum(donation.delivered) + '</span></div>';
    html += '<div class="balance-row"><span class="lbl">⏳ معلّق</span><span class="val orange">' + fmtNum(donation.pending) + '</span></div>';
    html += '</div>';
  }
  
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px">';
  html += '<button class="btn info block" onclick="openCollectorPaymentsList(\'' + key.replace(/'/g, "\\'") + '\', ' + y + ')">📜 الدفعات (' + payments.length + ')</button>';
  html += '<button class="btn warning block" onclick="openCollectorDeliveriesList(\'' + key.replace(/'/g, "\\'") + '\', ' + y + ')">📤 التسليمات (' + deliveries.length + ')</button>';
  html += '</div>';
  
  html += '<button class="btn success block" style="margin-top:8px" onclick="shareCollectorReport(\'' + key.replace(/'/g, "\\'") + '\', ' + y + ')">📱 إرسال تقرير واتساب</button>';
  
  if(isManager && targetUser){
    html += '<button class="btn primary block" style="margin-top:8px" onclick="closeSheet();setTimeout(function(){impersonateUser(' + targetUser.id + ')},150)">🔑 الدخول بهذا الحساب</button>';
  }
  
  openSheet('👤 ' + displayName, html, '<button class="btn ghost" onclick="closeSheetAll()">إغلاق</button>', { wide: true });
}
