<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>صندوق زعورة v12</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --primary: #6d28d9;
  --primary-dark: #4c1d95;
  --primary-soft: #f5f3ff;
  --assoc: #2563eb;
  --assoc-soft: #eff6ff;
  --death: #dc2626;
  --death-soft: #fef2f2;
  --donation: #16a34a;
  --donation-soft: #ecfdf5;
  --success: #10b981;
  --success-soft: #d1fae5;
  --warning: #f59e0b;
  --warning-soft: #fef3c7;
  --info: #3b82f6;
  --info-soft: #dbeafe;
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --muted-2: #94a3b8;
  --border: #e2e8f0;
  --border-2: #f1f5f9;
  --r-md: 12px;
  --r-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
  --shadow-xl: 0 20px 50px rgba(15,23,42,.18);
  --safe-bottom: env(safe-area-inset-bottom, 0);
  --safe-top: env(safe-area-inset-top, 0);
  --bnav-h: 64px;
}
[data-theme="dark"] {
  --bg: #0a0f1c;
  --card: #131c31;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --muted-2: #64748b;
  --border: #1e293b;
  --border-2: #0f172a;
  --primary-soft: #2e1065;
  --assoc-soft: #1e3a8a;
  --death-soft: #7f1d1d;
  --donation-soft: #14532d;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 15px; }
body {
  font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
  background: var(--bg); color: var(--text); direction: rtl;
  line-height: 1.5; min-height: 100vh;
  padding-bottom: calc(var(--bnav-h) + var(--safe-bottom));
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
}
input, textarea { -webkit-user-select: text; user-select: text; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
input, select, textarea { outline: none; }

.app-header {
  position: sticky; top: 0; z-index: 30;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; padding: 10px 14px;
  padding-top: calc(10px + var(--safe-top));
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 4px 20px rgba(109,40,217,0.25); min-height: 56px;
}
.app-header .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.app-header .logo {
  width: 38px; height: 38px; border-radius: 11px;
  background: rgba(255,255,255,.18);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; flex-shrink: 0;
}
.app-header .brand-text { flex: 1; min-width: 0; }
.app-header h1 { font-size: 15px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-header .sub {
  font-size: 11px; opacity: .9; font-weight: 700; cursor: pointer;
  display: inline-block; padding: 2px 8px;
  background: rgba(255,255,255,.15); border-radius: 7px; margin-top: 3px;
}
.app-header .icon-btn {
  width: 38px; height: 38px; border-radius: 11px;
  background: rgba(255,255,255,.14); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0; position: relative;
}
.app-header .badge-num {
  position: absolute; top: 4px; left: 4px;
  background: #dc2626; color: #fff;
  font-size: 9px; font-weight: 800;
  min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px;
  display: none; align-items: center; justify-content: center;
}
.app-header .badge-num.on { display: flex; }

.user-banner {
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; font-size: 12px;
  position: sticky; top: 56px; z-index: 29;
}
.user-banner .who { display: flex; align-items: center; gap: 8px; color: var(--muted); flex-wrap: wrap; min-width: 0; }
.user-banner .who b { color: var(--text); font-weight: 800; }
.role-badge {
  padding: 3px 10px; border-radius: 20px;
  font-size: 10px; font-weight: 800;
  background: var(--primary-soft); color: var(--primary);
  white-space: nowrap;
}
.sector-badge {
  padding: 3px 10px; border-radius: 20px;
  font-size: 10px; font-weight: 800;
  background: var(--warning-soft); color: #92400e;
  white-space: nowrap;
}
main { max-width: 900px; margin: 0 auto; padding: 12px; }
.page { display: none; }
.page.active { display: block; }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 14px; margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
}
.card-head h2 { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; }

.stats-scroll {
  display: flex; gap: 8px; overflow-x: auto;
  margin: 0 -12px 12px; padding: 0 12px 4px; scrollbar-width: none;
}
.stats-scroll::-webkit-scrollbar { display: none; }
.stat {
  flex: 0 0 auto; min-width: 130px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 12px;
  box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
}
.stat::before {
  content: ''; position: absolute; top: 0; right: 0;
  width: 4px; height: 100%; background: var(--primary);
}
.stat.assoc::before { background: var(--assoc); }
.stat.death::before { background: var(--death); }
.stat.donation::before { background: var(--donation); }
.stat.green::before { background: var(--success); }
.stat.red::before { background: var(--death); }
.stat.orange::before { background: var(--warning); }
.stat.blue::before { background: var(--assoc); }
.stat.purple::before { background: var(--primary); }
.stat .val {
  font-size: 19px; font-weight: 800;
  line-height: 1.1; color: var(--primary);
  word-break: break-all;
  font-family: 'SF Mono', 'Courier New', monospace;
}
.stat.assoc .val { color: var(--assoc); }
.stat.death .val { color: var(--death); }
.stat.donation .val { color: var(--donation); }
.stat.green .val { color: var(--success); }
.stat.red .val { color: var(--death); }
.stat.orange .val { color: var(--warning); }
.stat.blue .val { color: var(--assoc); }
.stat .lbl { font-size: 10px; color: var(--muted); margin-top: 6px; font-weight: 700; }

.list {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-sm);
}
.item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-bottom: 1px solid var(--border-2);
  cursor: pointer; min-height: 58px;
}
.item:last-child { border-bottom: 0; }
.item:active { background: var(--bg); }
.item .av {
  width: 42px; height: 42px; border-radius: 12px;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 18px; background: var(--primary-soft); color: var(--primary);
  font-weight: 800; overflow: hidden;
}
.item .av.blue { background: var(--assoc-soft); color: var(--assoc); }
.item .av.red { background: var(--death-soft); color: var(--death); }
.item .av.green { background: var(--donation-soft); color: var(--donation); }
.item .av.orange { background: var(--warning-soft); color: #92400e; }
.item .av.gray { background: var(--border-2); color: var(--muted); }
.item .body { flex: 1; min-width: 0; }
.item .ttl {
  font-weight: 700; font-size: 14px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.item .sub {
  font-size: 11.5px; color: var(--muted); margin-top: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.item .trail { color: var(--muted-2); font-size: 20px; flex-shrink: 0; }

.badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 6px;
  font-size: 10px; font-weight: 800; white-space: nowrap;
}
.badge.success { background: var(--success-soft); color: #065f46; }
.badge.danger { background: var(--death-soft); color: #991b1b; }
.badge.warning { background: var(--warning-soft); color: #92400e; }
.badge.info { background: var(--info-soft); color: #1e40af; }
.badge.muted { background: var(--border-2); color: var(--muted); }
.badge.primary { background: var(--primary-soft); color: var(--primary); }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 7px 14px; border-radius: 20px;
  background: var(--card); border: 1px solid var(--border);
  font-size: 12px; font-weight: 700; color: var(--muted);
  font-family: inherit;
}
.chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 18px; border-radius: var(--r-md);
  font-size: 14px; font-weight: 700; min-height: 42px;
  white-space: nowrap; font-family: inherit;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--primary); color: #fff; }
.btn.assoc { background: var(--assoc); color: #fff; }
.btn.death { background: var(--death); color: #fff; }
.btn.donation { background: var(--donation); color: #fff; }
.btn.success { background: var(--success); color: #fff; }
.btn.danger { background: var(--death); color: #fff; }
.btn.warning { background: var(--warning); color: #fff; }
.btn.info { background: var(--info); color: #fff; }
.btn.ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn.sm { padding: 6px 11px; min-height: 34px; font-size: 12px; border-radius: 9px; }
.btn.lg { padding: 14px 22px; min-height: 52px; font-size: 15px; border-radius: var(--r-lg); }
.btn.block { display: flex; width: 100%; }

.quick-actions {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin-bottom: 12px;
}
.quick-actions.two { grid-template-columns: repeat(2, 1fr); }
.quick-btn {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 14px 8px; border-radius: var(--r-md);
  background: var(--card); border: 1.5px solid var(--border);
  cursor: pointer; text-align: center; font-family: inherit;
}
.quick-btn:active { transform: scale(.97); border-color: var(--primary); }
.quick-btn .ico { font-size: 26px; line-height: 1; }
.quick-btn .lbl { font-size: 11px; font-weight: 800; }
.quick-btn.assoc { border-color: var(--assoc); }
.quick-btn.assoc .lbl { color: var(--assoc); }
.quick-btn.death { border-color: var(--death); }
.quick-btn.death .lbl { color: var(--death); }
.quick-btn.donation { border-color: var(--donation); }
.quick-btn.donation .lbl { color: var(--donation); }

.fab {
  position: fixed; bottom: calc(var(--bnav-h) + 20px + var(--safe-bottom));
  left: 16px; width: 56px; height: 56px;
  border-radius: 18px; background: var(--primary);
  color: #fff; font-size: 26px; font-weight: 300;
  box-shadow: 0 8px 24px rgba(109,40,217,0.4);
  z-index: 25; display: flex; align-items: center; justify-content: center;
}
.fab:active { transform: scale(.9); }

.bnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 30; background: var(--card);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around;
  padding: 6px 4px calc(6px + var(--safe-bottom));
  box-shadow: 0 -4px 12px rgba(15,23,42,0.04);
}
.bnav button {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 2px; padding: 6px 2px;
  border-radius: 10px; color: var(--muted);
  font-size: 10px; font-weight: 700; min-width: 0;
  font-family: inherit;
}
.bnav button .i { font-size: 21px; line-height: 1; }
.bnav button.on { color: var(--primary); }

.sheet-back {
  position: fixed; inset: 0;
  background: rgba(15,23,42,0.5); z-index: 10100;
  opacity: 0; pointer-events: none;
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.sheet-back.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 10101; background: var(--card);
  border-radius: 22px 22px 0 0;
  max-height: 94vh; overflow-y: auto;
  transform: translateY(100%);
  padding-bottom: calc(16px + var(--safe-bottom));
}
.sheet.on { transform: translateY(0); }
.sheet.wide { max-height: 98vh; }
.sheet-grip { width: 42px; height: 4px; background: var(--border); border-radius: 2px; margin: 10px auto 0; }
.sheet-hd {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--card); z-index: 2;
}
.sheet-hd h2 { font-size: 15px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.sheet-hd .close-btn {
  width: 34px; height: 34px; background: var(--bg); color: var(--text);
  border-radius: 10px; font-size: 16px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sheet-bd { padding: 16px; }
.sheet-ft {
  display: flex; gap: 8px; padding: 12px 16px;
  border-top: 1px solid var(--border);
  position: sticky; bottom: 0; background: var(--card); flex-wrap: wrap;
}
.sheet-ft .btn { flex: 1; min-width: 90px; }

.fld { margin-bottom: 14px; position: relative; }
.fld label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.fld label .req { color: var(--death); }
.fld input, .fld select, .fld textarea {
  width: 100%; padding: 11px 14px;
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: var(--r-md); font-size: 14px;
}
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--primary); background: var(--card); }
.fld textarea { resize: vertical; min-height: 70px; }
.fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fld-hint { font-size: 11px; color: var(--muted-2); margin-top: 4px; }

.amount-input {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border: 2px solid var(--primary);
  border-radius: var(--r-lg); padding: 6px 14px;
}
.amount-input input {
  flex: 1; border: 0; background: none;
  font-size: 24px; font-weight: 800; color: var(--primary);
  text-align: center; padding: 8px 0;
  font-family: 'SF Mono', 'Courier New', monospace;
}
.amount-input .currency { font-size: 13px; font-weight: 800; color: var(--muted); }
.amount-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.amount-quick button {
  padding: 6px 12px; border-radius: 9px;
  background: var(--primary-soft); color: var(--primary);
  font-size: 12px; font-weight: 800; font-family: inherit;
}

.balance-block {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 12px; margin-bottom: 10px;
}
.balance-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0; font-size: 13px;
  border-bottom: 1px solid var(--border-2);
}
.balance-row:last-child { border-bottom: 0; }
.balance-row .lbl { color: var(--muted); }
.balance-row .val { font-weight: 800; font-family: 'SF Mono', 'Courier New', monospace; }
.balance-row .val.green { color: var(--success); }
.balance-row .val.red { color: var(--death); }
.balance-row .val.orange { color: var(--warning); }

.progress { height: 8px; background: var(--border-2); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.progress > div { height: 100%; border-radius: 4px; }

.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty .ico { font-size: 52px; opacity: .35; display: block; margin-bottom: 10px; }
.empty h3 { font-size: 15px; font-weight: 800; margin-bottom: 4px; color: var(--text); }
.empty p { font-size: 12px; }

.toasts {
  position: fixed; top: 14px; left: 50%;
  transform: translateX(-50%); z-index: 10200;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
  width: calc(100% - 28px); max-width: 400px;
}
.toast {
  background: var(--text); color: var(--card);
  padding: 12px 18px; border-radius: var(--r-md);
  font-size: 13px; font-weight: 700;
  box-shadow: var(--shadow-xl); pointer-events: auto;
}
.toast.success { background: var(--success); color: #fff; }
.toast.error { background: var(--death); color: #fff; }
.toast.warning { background: var(--warning); color: #fff; }
.toast.info { background: var(--info); color: #fff; }

.loader {
  position: fixed; inset: 0;
  background: rgba(15,23,42,0.4);
  backdrop-filter: blur(3px);
  z-index: 10300; display: none;
  align-items: center; justify-content: center;
}
.loader.on { display: flex; }
.spin {
  width: 42px; height: 42px;
  border: 3px solid rgba(255,255,255,.25);
  border-top-color: #fff; border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.login-screen {
  position: fixed; inset: 0; z-index: 10000;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  display: none; align-items: center; justify-content: center;
  padding: 20px; overflow-y: auto;
}
.login-screen.on { display: flex; }
.login-card {
  background: var(--card); color: var(--text);
  border-radius: 24px; padding: 26px 22px;
  max-width: 400px; width: 100%; margin: auto;
  box-shadow: var(--shadow-xl);
}
.login-card .logo-lg {
  width: 64px; height: 64px; border-radius: 20px;
  background: linear-gradient(135deg, var(--primary), #7c3aed);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 32px;
  margin: 0 auto 16px;
  box-shadow: 0 8px 24px rgba(109,40,217,0.35);
}
.login-card h1 { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 4px; }
.login-card .sub { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 22px; }
.users-list { display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto; }
.login-user {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--r-md);
  background: var(--bg); border: 2px solid transparent;
  cursor: pointer;
}
.login-user:active { border-color: var(--primary); background: var(--primary-soft); }
.login-user .av {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800; flex-shrink: 0;
}
.login-user .info { flex: 1; min-width: 0; }
.login-user .nm { font-weight: 700; font-size: 14px; }
.login-user .role { font-size: 11px; color: var(--muted); margin-top: 2px; }

.pin-header { text-align: center; margin-bottom: 16px; }
.pin-avatar { font-size: 44px; }
.pin-name { font-weight: 800; font-size: 16px; margin-top: 6px; }
.pin-role { font-size: 11px; color: var(--muted); margin-top: 2px; }
.pin-display { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--border); }
.pin-dot.on { background: var(--primary); }
.pin-error { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 12px; min-height: 18px; }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pin-btn {
  padding: 16px; border-radius: var(--r-md);
  background: var(--bg); font-size: 20px; font-weight: 800; font-family: inherit;
}
.pin-btn:active { transform: scale(.95); background: var(--primary-soft); }

.segment {
  display: flex; gap: 4px; background: var(--card);
  padding: 5px; border-radius: var(--r-md);
  margin-bottom: 10px; box-shadow: var(--shadow-sm);
  overflow-x: auto; scrollbar-width: none;
}
.segment::-webkit-scrollbar { display: none; }
.segment button {
  flex: 1; padding: 8px 10px; border-radius: 8px;
  background: transparent; color: var(--muted);
  font-size: 11px; font-weight: 800; cursor: pointer;
  font-family: inherit; white-space: nowrap;
}
.segment button.on { background: var(--primary); color: #fff; }

.fund-card {
  background: var(--card); border-radius: 14px;
  padding: 14px 16px; margin-bottom: 10px;
  cursor: pointer; border: 1.5px solid;
  display: flex; align-items: stretch; gap: 12px;
  box-shadow: var(--shadow-sm);
}

<script>
'use strict';

const APP_VERSION = '12.0';
const DB_NAME = 'zaoura_v12';
const DB_VERSION = 1;
const BASE_YEAR = 2025;
const PIN_SALT = 'ZAOURA_V12_SALT_2026';

const STORE_NAMES = [
  'members','payments','allocations','deaths','ledger',
  'deliveries','incomes','expenses','users','constants',
  'settings','auditLog','walletCache'
];

const FUNDS = {
  assoc:    { key: 'assoc',    icon: '💰', name: 'الجمعية',  color: 'assoc' },
  death:    { key: 'death',    icon: '⚰️', name: 'الوفاة',   color: 'death' },
  donation: { key: 'donation', icon: '💚', name: 'التبرعات', color: 'donation' }
};

const ROLES = {
  manager:        { key: 'manager',        icon: '🎯', name: 'مدير',         canCollect: true,  canReceive: true,  canDeliver: true,  needsSector: false },
  president:      { key: 'president',      icon: '👑', name: 'رئيس اللجنة',  canCollect: true,  canReceive: false, canDeliver: true,  needsSector: false },
  assocTreasurer: { key: 'assocTreasurer', icon: '💰', name: 'أمين الجمعية', canCollect: true,  canReceive: true,  canDeliver: true,  needsSector: false },
  deathTreasurer: { key: 'deathTreasurer', icon: '⚰️', name: 'أمين الوفاة',  canCollect: true,  canReceive: true,  canDeliver: true,  needsSector: false },
  collector:      { key: 'collector',      icon: '👤', name: 'معتمد',        canCollect: true,  canReceive: false, canDeliver: true,  needsSector: true  }
};

const DEFAULT_SECTORS = ['الجبل', 'الحارة1', 'الحارة2', 'الوادي', 'المنصورة', 'دمر'];

const WALLET_STATUS = {
  PAID: 'paid', PARTIAL: 'partial', DUE: 'due',
  EXEMPT: 'exempt', CREDIT: 'credit', EMPTY: 'empty'
};

const S = {
  members: [], payments: [], allocations: [], deaths: [], ledger: [],
  deliveries: [], incomes: [], expenses: [], users: [], constants: [],
  settings: [], auditLog: [], walletCache: [],
  currentUser: null,
  currentRole: null,
  currentYear: 2026,
  page: 'pg-home',
  search: '',
  filters: {
    collect: 'all', collectSector: 'all',
    deliveries: 'pending', deaths: 'year',
    inout: 'in', inoutFund: 'assoc'
  }
};

const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);

const esc = v => String(v == null ? '' : v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const cleanText = v => String(v == null ? '' : v).trim().replace(/\s+/g, ' ');

const normAr = v => String(v == null ? '' : v)
  .toLowerCase().trim()
  .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه')
  .replace(/[ىي]/g, 'ي').replace(/[ًٌٍَُِّْـ]/g, '');

const cleanPhone = v => {
  if (!v) return '';
  let s = String(v).trim().replace(/\.0+$/, '').replace(/[\s\-\(\)\u200f\u200e]/g, '');
  if (s.indexOf('+963') === 0) s = '0' + s.slice(4);
  return s;
};

const today = () => new Date().toISOString().slice(0, 10);

const fmtDate = d => {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' }); }
  catch (e) { return d; }
};

const fmtDateTime = d => {
  if (!d) return '—';
  try { return new Date(d).toLocaleString('ar-EG'); } catch (e) { return d; }
};

const toDate = v => {
  if (!v) return '';
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if (typeof v === 'number') {
    const d = new Date((v - 25569) * 86400000);
    return isNaN(d) ? '' : d.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  const m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m1) return m1[1] + '-' + m1[2].padStart(2, '0') + '-' + m1[3].padStart(2, '0');
  const m2 = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if (m2) return m2[3] + '-' + m2[2].padStart(2, '0') + '-' + m2[1].padStart(2, '0');
  const d = new Date(s);
  if (!isNaN(d) && d.getFullYear() > 1900 && d.getFullYear() < 2100) return d.toISOString().slice(0, 10);
  return '';
};

const fmtNum = n => {
  if (n === null || n === undefined || n === '') return '0';
  const num = Number(n);
  if (isNaN(num)) return '0';
  return num.toLocaleString('en-US');
};

const fmtShort = n => {
  if (!n && n !== 0) return '0';
  const num = Number(n);
  if (isNaN(num)) return '0';
  if (Math.abs(num) >= 1000000) return (num / 1000000).toFixed(1) + 'M';
  if (Math.abs(num) >= 1000) return (num / 1000).toFixed(1) + 'K';
  return String(Math.round(num));
};

const debounce = (fn, d) => {
  d = d || 250;
  let t;
  return function () {
    const args = arguments;
    clearTimeout(t);
    t = setTimeout(function () { fn.apply(null, args); }, d);
  };
};

const vibrate = (pattern) => {
  if (navigator.vibrate) { try { navigator.vibrate(pattern || 30); } catch (e) {} }
};

function toast(msg, type, dur) {
  type = type || 'success';
  dur = dur || 2800;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(function () {
    el.style.opacity = '0';
    setTimeout(function () { el.remove(); }, 300);
  }, dur);
}

const showLoad = v => $('loader').classList.toggle('on', v);

let _sheetStack = [];
let _scrollBeforeSheet = 0;

function openSheet(title, bodyHTML, footHTML, opts) {
  opts = opts || {};
  const sheet = $('sheet');
  const isOpen = sheet.classList.contains('on');

  if (isOpen && !opts.noStack) {
    _sheetStack.push({
      title: $('sheetTitle').textContent,
      body: $('sheetBody').innerHTML,
      foot: $('sheetFoot').innerHTML,
      footVisible: $('sheetFoot').style.display !== 'none',
      wide: sheet.classList.contains('wide')
    });
  } else if (!isOpen) {
    _sheetStack = [];
    _scrollBeforeSheet = window.scrollY || window.pageYOffset || 0;
  }

  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = bodyHTML;
  $('sheetFoot').innerHTML = footHTML || '';
  $('sheetFoot').style.display = footHTML ? 'flex' : 'none';
  $('sheetBack').classList.add('on');
  sheet.classList.add('on');
  if (opts.wide) sheet.classList.add('wide');
  else sheet.classList.remove('wide');
  $('sheetBody').scrollTop = 0;
  document.body.style.overflow = 'hidden';

  if (opts.focus) {
    setTimeout(function () {
      const el = $(opts.focus);
      if (el) el.focus();
    }, 280);
  }
}

function closeSheet() {
  if (_sheetStack.length > 0) {
    const prev = _sheetStack.pop();
    $('sheetTitle').textContent = prev.title;
    $('sheetBody').innerHTML = prev.body;
    $('sheetFoot').innerHTML = prev.foot;
    $('sheetFoot').style.display = prev.footVisible ? 'flex' : 'none';
    const sheet = $('sheet');
    if (prev.wide) sheet.classList.add('wide');
    else sheet.classList.remove('wide');
    $('sheetBody').scrollTop = 0;
    return;
  }
  closeSheetAll();
}

function closeSheetAll() {
  _sheetStack = [];
  $('sheetBack').classList.remove('on');
  $('sheet').classList.remove('on');
  document.body.style.overflow = '';
  setTimeout(function () {
    if (_scrollBeforeSheet > 0) window.scrollTo({ top: _scrollBeforeSheet, behavior: 'instant' });
  }, 50);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('zt_theme', next);
}

let db = null;

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORE_NAMES.forEach(n => {
        if (!d.objectStoreNames.contains(n)) {
          d.createObjectStore(n, { keyPath: 'id', autoIncrement: true });
        }
      });
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}

const tx = (s, m) => db.transaction(s, m || 'readonly').objectStore(s);

const dbAll = s => new Promise((res, rej) => {
  const q = tx(s).getAll();
  q.onsuccess = () => res(q.result || []);
  q.onerror = () => rej(q.error);
});

const dbGet = (s, id) => new Promise((res, rej) => {
  const q = tx(s).get(id);
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
});

const dbPut = (s, o) => new Promise((res, rej) => {
  const q = tx(s, 'readwrite').put(o);
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
});

const dbDel = (s, id) => new Promise((res, rej) => {
  const q = tx(s, 'readwrite').delete(id);
  q.onsuccess = () => res();
  q.onerror = () => rej(q.error);
});

const dbClear = s => new Promise((res, rej) => {
  const q = tx(s, 'readwrite').clear();
  q.onsuccess = () => res();
  q.onerror = () => rej(q.error);
});

async function loadAll() {
  const r = await Promise.all([
    dbAll('members'), dbAll('payments'), dbAll('allocations'),
    dbAll('deaths'), dbAll('ledger'), dbAll('deliveries'),
    dbAll('incomes'), dbAll('expenses'), dbAll('users'),
    dbAll('constants'), dbAll('settings'), dbAll('auditLog'),
    dbAll('walletCache')
  ]);
  S.members=r[0]; S.payments=r[1]; S.allocations=r[2];
  S.deaths=r[3]; S.ledger=r[4]; S.deliveries=r[5];
  S.incomes=r[6]; S.expenses=r[7]; S.users=r[8];
  S.constants=r[9]; S.settings=r[10]; S.auditLog=r[11];
  S.walletCache=r[12];
}

async function ensureDefaultConstants() {
  const years = [];
  for (let y = BASE_YEAR; y <= BASE_YEAR + 4; y++) years.push(y);
  let added = 0;
  for (const year of years) {
    if (!S.constants.find(c => c.year === year)) {
      const c = {
        year: year,
        assocYearly: 24000, assocYearlyReduced: 15000,
        deathInstallment: 5000, deathCompensation: 1500000,
        joinAssocFee: 49000, joinAssocFeeReduced: 25000,
        joinDeathFee: 50000, joinDeathFeeReduced: 25000,
        createdAt: new Date().toISOString()
      };
      const id = await dbPut('constants', c);
      c.id = id;
      S.constants.push(c);
      added++;
    }
  }
}

function getConstants(year) {
  const c = S.constants.find(x => x.year === year);
  if (c) return c;
  const sorted = S.constants.slice().sort((a, b) => b.year - a.year);
  return sorted[0] || null;
}

async function hashPin(pin) {
  const data = new TextEncoder().encode(String(pin) + PIN_SALT);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function verifyPin(pin, hash) {
  const h = await hashPin(pin);
  return h === hash;
}

async function logAudit(action, target, targetId, details) {
  details = details || {};
  try {
    const entry = {
      timestamp: new Date().toISOString(),
      userId: S.currentUser ? S.currentUser.id : null,
      userName: S.currentUser ? S.currentUser.name : 'system',
      action: action, target: target, targetId: targetId, details: details
    };
    const id = await dbPut('auditLog', entry);
    entry.id = id;
    S.auditLog.push(entry);
  } catch (e) {}
}

const WALLET_CACHE = {
  mem: new Map(),
  dirty: new Set(),
  flushTimer: null,

  get(memberId) {
    if (this.mem.has(memberId)) return this.mem.get(memberId);
    const fromDb = S.walletCache.find(w => w.memberId === memberId);
    if (fromDb) {
      this.mem.set(memberId, fromDb);
      return fromDb;
    }
    return null;
  },

  set(memberId, wallet) {
    const entry = { memberId: memberId, wallet: wallet, lastCalc: new Date().toISOString() };
    this.mem.set(memberId, entry);
    this.dirty.add(memberId);
    this.scheduleFlush();
  },

  invalidate(memberId) {
    this.mem.delete(memberId);
    const i = S.walletCache.findIndex(w => w.memberId === memberId);
    if (i > -1) {
      const entry = S.walletCache[i];
      if (entry.id) dbDel('walletCache', entry.id).catch(() => {});
      S.walletCache.splice(i, 1);
    }
  },

  invalidateAll() {
    this.mem.clear();
    this.dirty.clear();
    S.walletCache.forEach(w => {
      if (w.id) dbDel('walletCache', w.id).catch(() => {});
    });
    S.walletCache = [];
  },

  scheduleFlush() {
    if (this.flushTimer) clearTimeout(this.flushTimer);
    this.flushTimer = setTimeout(() => this.flush(), 500);
  },

  async flush() {
    const toSave = Array.from(this.dirty);
    this.dirty.clear();
    for (const memberId of toSave) {
      const entry = this.mem.get(memberId);
      if (!entry) continue;
      try {
        const existing = S.walletCache.find(w => w.memberId === memberId);
        if (existing && existing.id) entry.id = existing.id;
        const id = await dbPut('walletCache', entry);
        entry.id = id;
        const i = S.walletCache.findIndex(w => w.memberId === memberId);
        if (i > -1) S.walletCache[i] = entry;
        else S.walletCache.push(entry);
      } catch (e) {}
    }
  }
};

function isFundActive(member, fund, year) {
  if (year < BASE_YEAR) return false;
  const status = member.memberStatus || 'نشط';

  if (fund === 'assoc') {
    if (!member.assocStartYear) return false;
    if (member.assocStartYear > year) return false;
    if (member.assocExempt) return false;
    if (status === 'معفى') return false;
    if (status === 'متوفى' && member.deathDate) {
      const dy = parseInt(member.deathDate.substring(0, 4));
      if (dy < year) return false;
    }
    if ((status === 'منسحب' || status === 'متوقف') && member.stopYear) {
      if (member.stopYear <= year) return false;
    }
    return true;
  }

  if (fund === 'death') {
    if (!member.deathStartYear) return false;
    if (member.deathStartYear > year) return false;
    if (member.deathExempt) return false;
    if (status === 'معفى') return false;
    if (status === 'متوفى' && member.deathDate) {
      const dy = parseInt(member.deathDate.substring(0, 4));
      if (dy < year) return false;
    }
    if ((status === 'منسحب' || status === 'متوقف') && member.stopYear) {
      if (member.stopYear <= year) return false;
    }
    return true;
  }
  return false;
}

function computeMemberDuesInYear(member, year) {
  const result = {
    year: year,
    assoc: { annual: 0, join: 0, total: 0 },
    death: { installments: 0, join: 0, count: 0, total: 0 },
    total: 0, skipped: false
  };

  const yc = getConstants(year);
  if (!yc || !yc.assocYearly) { result.skipped = true; return result; }

  if (member.memberStatus === 'متوفى' && member.deathDate) {
    const dy = parseInt(member.deathDate.substring(0, 4));
    if (dy < year) { result.skipped = true; return result; }
  }

  if ((member.memberStatus === 'منسحب' || member.memberStatus === 'متوقف') && member.stopYear) {
    if (member.stopYear <= year) { result.skipped = true; return result; }
  }

  const isReduced = member.memberType === 'مخفض';

  if (isFundActive(member, 'assoc', year)) {
    const annual = isReduced && yc.assocYearlyReduced ? yc.assocYearlyReduced : yc.assocYearly;
    result.assoc.annual = annual;
    if (member.assocStartYear === year) {
      const joinFee = isReduced && yc.joinAssocFeeReduced ? yc.joinAssocFeeReduced : yc.joinAssocFee;
      result.assoc.join = joinFee;
    }
    result.assoc.total = result.assoc.annual + result.assoc.join;
  }

  if (isFundActive(member, 'death', year)) {
    if (member.deathStartYear === year) {
      const joinFee = isReduced && yc.joinDeathFeeReduced ? yc.joinDeathFeeReduced : yc.joinDeathFee;
      result.death.join = joinFee;
    }
    const deathsThisYear = S.deaths.filter(d => Number(d.year) === year);
    const deathInstallment = yc.deathInstallment || 5000;
    let payForCount = 0;
    for (const death of deathsThisYear) {
      let deceasedId = death.memberId;
      if (!deceasedId) {
        const dm = S.members.find(m => normAr(m.name) === normAr(death.deceasedName));
        if (dm) deceasedId = dm.id;
      }
      if (deceasedId === member.id) continue;
      if (member.memberStatus === 'متوفى' && member.deathDate && death.deathDate) {
        if (member.deathDate < death.deathDate) continue;
      }
      payForCount++;
    }
    result.death.installments = payForCount * deathInstallment;
    result.death.count = payForCount;
  }

  result.death.total = result.death.installments + result.death.join;
  result.total = result.assoc.total + result.death.total;
  return result;
}

function computeMemberPayments(memberId) {
  const result = {
    byYearAndFund: {},
    total: { assoc: 0, death: 0, donation: 0, all: 0 }
  };
  const memberAllocs = S.allocations.filter(a => a.memberId === memberId);
  for (const a of memberAllocs) {
    const y = Number(a.year);
    if (!y) continue;
    const fund = a.fund || 'assoc';
    const amount = Number(a.amount) || 0;
    if (!result.byYearAndFund[y]) result.byYearAndFund[y] = { assoc: 0, death: 0, donation: 0 };
    result.byYearAndFund[y][fund] += amount;
    result.total[fund] += amount;
    result.total.all += amount;
  }
  return result;
}

function computeMemberWallet(memberId, forceRecalc) {
  if (!forceRecalc) {
    const cached = WALLET_CACHE.get(memberId);
    if (cached && cached.wallet) return cached.wallet;
  }

  const member = S.members.find(m => m.id === memberId);
  if (!member) return null;

  const result = {
    member: member, memberId: memberId,
    funds: {
      assoc:    { due: 0, paid: 0, balance: 0, status: WALLET_STATUS.EMPTY, years: {} },
      death:    { due: 0, paid: 0, balance: 0, status: WALLET_STATUS.EMPTY, years: {} },
      donation: { due: 0, paid: 0, balance: 0, status: WALLET_STATUS.EMPTY, years: {} }
    },
    summary: { totalDue: 0, totalPaid: 0, totalBalance: 0, firstYear: null, lastYear: null },
    years: []
  };

  const starts = [member.assocStartYear, member.deathStartYear].filter(x => x);

  if (!starts.length) {
    const p = computeMemberPayments(memberId);
    result.funds.donation.paid = p.total.donation;
    result.funds.donation.balance = -p.total.donation;
    if (p.total.donation > 0) result.funds.donation.status = WALLET_STATUS.CREDIT;
    result.summary.totalPaid = p.total.all;
    result.summary.totalBalance = -p.total.donation;
    WALLET_CACHE.set(memberId, result);
    return result;
  }

  const firstYear = Math.max(BASE_YEAR, Math.min.apply(null, starts));
  const lastYear = S.currentYear;
  result.summary.firstYear = firstYear;
  result.summary.lastYear = lastYear;

  const payments = computeMemberPayments(memberId);

  for (let y = firstYear; y <= lastYear; y++) {
    const yr = {
      year: y,
      assoc: { due: 0, paid: 0, balance: 0 },
      death: { due: 0, paid: 0, balance: 0 },
      donation: { due: 0, paid: 0, balance: 0 },
      total: { due: 0, paid: 0, balance: 0 }
    };

    const dues = computeMemberDuesInYear(member, y);
    if (!dues.skipped) {
      yr.assoc.due = dues.assoc.total;
      yr.death.due = dues.death.total;
    }

    const paid = payments.byYearAndFund[y] || { assoc: 0, death: 0, donation: 0 };
    yr.assoc.paid = paid.assoc;
    yr.death.paid = paid.death;
    yr.donation.paid = paid.donation;

    yr.assoc.balance = yr.assoc.due - yr.assoc.paid;
    yr.death.balance = yr.death.due - yr.death.paid;
    yr.donation.balance = -yr.donation.paid;

    yr.total.due = yr.assoc.due + yr.death.due;
    yr.total.paid = yr.assoc.paid + yr.death.paid + yr.donation.paid;
    yr.total.balance = yr.assoc.balance + yr.death.balance + yr.donation.balance;

    result.funds.assoc.due += yr.assoc.due;
    result.funds.assoc.paid += yr.assoc.paid;
    result.funds.death.due += yr.death.due;
    result.funds.death.paid += yr.death.paid;
    result.funds.donation.paid += yr.donation.paid;

    result.funds.assoc.years[y] = { due: yr.assoc.due, paid: yr.assoc.paid, balance: yr.assoc.balance };
    result.funds.death.years[y] = { due: yr.death.due, paid: yr.death.paid, balance: yr.death.balance };

    result.years.push(yr);
  }

  result.funds.assoc.balance = result.funds.assoc.due - result.funds.assoc.paid;
  result.funds.death.balance = result.funds.death.due - result.funds.death.paid;
  result.funds.donation.balance = -result.funds.donation.paid;

  result.summary.totalDue = result.funds.assoc.due + result.funds.death.due;
  result.summary.totalPaid = result.funds.assoc.paid + result.funds.death.paid + result.funds.donation.paid;
  result.summary.totalBalance = result.funds.assoc.balance + result.funds.death.balance + result.funds.donation.balance;

  WALLET_CACHE.set(memberId, result);
  return result;
}

function getMembersStats(year) {
  const y = year || S.currentYear;
  let onlyAssoc = 0, onlyDeath = 0, both = 0, none = 0;
  let late = 0, lateTotal = 0;
  let active = 0, withdrawn = 0, deceased = 0, exempt = 0, frozen = 0;
  let newThisYear = 0;
  let totalDueAssoc = 0, totalDueDeath = 0, totalPaidAssoc = 0, totalPaidDeath = 0;

  for (const m of S.members) {
    const st = m.memberStatus || 'نشط';
    if (st === 'نشط') active++;
    else if (st === 'منسحب') withdrawn++;
    else if (st === 'متوقف') frozen++;
    else if (st === 'متوفى') deceased++;
    else if (st === 'معفى') exempt++;

    const hasAssoc = m.assocStartYear && m.assocStartYear <= y && !m.assocExempt && st !== 'معفى';
    const hasDeath = m.deathStartYear && m.deathStartYear <= y && !m.deathExempt && st !== 'معفى';

    if (hasAssoc && hasDeath) both++;
    else if (hasAssoc) onlyAssoc++;
    else if (hasDeath) onlyDeath++;
    else none++;

    if (m.assocStartYear === y || m.deathStartYear === y) newThisYear++;

    if (hasAssoc || hasDeath) {
      const w = computeMemberWallet(m.id);
      if (w) {
        totalDueAssoc += w.funds.assoc.due;
        totalDueDeath += w.funds.death.due;
        totalPaidAssoc += w.funds.assoc.paid;
        totalPaidDeath += w.funds.death.paid;
        const rem = w.summary.totalBalance;
        if (rem > 0) { late++; lateTotal += rem; }
      }
    }
  }

  return {
    year: y, total: S.members.length,
    onlyAssoc, onlyDeath, both, none,
    late, lateTotal,
    active, withdrawn, deceased, exempt, frozen,
    newThisYear,
    collectionRate: (totalDueAssoc + totalDueDeath) > 0
      ? Math.round((totalPaidAssoc + totalPaidDeath) / (totalDueAssoc + totalDueDeath) * 100)
      : 0
  };
}

async function ledgerAdd(entry) {

    credit: Number(entry.credit) || 0,

    userId: S.currentUser ? S.currentUser.id : null,
    createdAt: new Date().toISOString()
  };
  const id = await dbPut('ledger', e);
  e.id = id;
  S.ledger.push(e);
  return id;
}

function getFundBalance(fund) {
  const opening = { assoc: 0, death: 0, donation: 0 };
  const entries = S.ledger.filter(l => l.fund === fund);
  const totalCredit = entries.reduce((s, l) => s + (Number(l.credit) || 0), 0);
  const totalDebit = entries.reduce((s, l) => s + (Number(l.debit) || 0), 0);
  return {
    fund: fund, opening: opening[fund],
    credit: totalCredit, debit: totalDebit,
    balance: opening[fund] + totalCredit - totalDebit
  };
}

function getAllFundsBalances() {
  return {
    assoc: getFundBalance('assoc'),
    death: getFundBalance('death'),
    donation: getFundBalance('donation')
  };
}

function getUserCustody(userId) {
  const user = S.users.find(u => u.id === userId);
  if (!user) return emptyCustody();

  const userName = normAr(user.name);
  const matchName = name => {
    if (!name || !userName) return false;
    const n = normAr(name);
    return n === userName || n.indexOf(userName) > -1 || userName.indexOf(n) > -1;
  };

  const payments = S.payments.filter(p => p.collectorId === userId || (!p.collectorId && matchName(p.collectorName)));
  const delivered = S.deliveries.filter(d => (d.fromUserId === userId || (!d.fromUserId && matchName(d.fromUserName))) && d.receivedAt);
  const pending = S.deliveries.filter(d => (d.fromUserId === userId || (!d.fromUserId && matchName(d.fromUserName))) && !d.receivedAt && !d.rejectedAt);

  const sum = arr => arr.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const byFund = fund => {
    const p = sum(payments.filter(x => x.fund === fund));
    const d = sum(delivered.filter(x => x.fund === fund));
    const pd = sum(pending.filter(x => x.fund === fund));
    return { collected: p, delivered: d, pending: pd, balance: p - d };
  };

  const assoc = byFund('assoc');
  const death = byFund('death');
  const donation = byFund('donation');

  return {
    assoc, death, donation,
    all: {
      collected: assoc.collected + death.collected + donation.collected,
      delivered: assoc.delivered + death.delivered + donation.delivered,
      pending: assoc.pending + death.pending + donation.pending,
      balance: assoc.balance + death.balance + donation.balance
    },
    paymentCount: payments.length,
    deliveryCount: delivered.length
  };
}

function emptyCustody() {
  const empty = () => ({ collected: 0, delivered: 0, pending: 0, balance: 0 });
  return {
    assoc: empty(), death: empty(), donation: empty(),
    all: { collected: 0, delivered: 0, pending: 0, balance: 0 },
    paymentCount: 0, deliveryCount: 0
  };
}

function getMyCustody() {
  if (!S.currentUser) return emptyCustody();
  return getUserCustody(S.currentUser.id);
}

const getMemberById = id => S.members.find(m => m.id === id);

function computeAllocationPlan(memberId, amount, preferredFund) {
  const wallet = computeMemberWallet(memberId);
  if (!wallet) return { allocations: [], remaining: amount };

  const allocations = [];
  let remaining = Number(amount) || 0;
  const debts = [];

  wallet.years.forEach(yr => {
    if (yr.death.balance > 0) debts.push({ fund: 'death', year: yr.year, amount: yr.death.balance, priority: 0 });
    if (yr.assoc.balance > 0) debts.push({ fund: 'assoc', year: yr.year, amount: yr.assoc.balance, priority: 1 });
  });

  debts.sort((a, b) => {
    if (a.priority !== b.priority) return a.priority - b.priority;
    return a.year - b.year;
  });

  if (preferredFund && preferredFund !== 'all') {
    debts.sort((a, b) => {
      if (a.fund === preferredFund && b.fund !== preferredFund) return -1;
      if (a.fund !== preferredFund && b.fund === preferredFund) return 1;
      if (a.priority !== b.priority) return a.priority - b.priority;
      return a.year - b.year;
    });
  }

  for (const debt of debts) {
    if (remaining <= 0) break;
    const take = Math.min(remaining, debt.amount);
    allocations.push({ fund: debt.fund, year: debt.year, amount: take });
    remaining -= take;
  }

  return { allocations: allocations, remaining: remaining };
}

async function recordPayment(memberId, amount, options) {
  options = options || {};
  const notes = options.notes || '';
  const preferredFund = options.preferredFund || 'all';
  const date = options.date || today();

  const plan = computeAllocationPlan(memberId, amount, preferredFund);

  const payment = {
    memberId: memberId,
    amount: Number(amount),
    date: date,
    notes: notes,
    collectorId: S.currentUser ? S.currentUser.id : null,
    collectorName: S.currentUser ? S.currentUser.name : 'system',
    createdAt: new Date().toISOString()
  };
  const paymentId = await dbPut('payments', payment);
  payment.id = paymentId;
  S.payments.push(payment);

  const createdAllocs = [];
  for (const alloc of plan.allocations) {
    const allocEntry = {
      paymentId: paymentId,
      memberId: memberId,
      fund: alloc.fund,
      year: alloc.year,
      amount: alloc.amount,
      createdAt: new Date().toISOString()
    };
    const allocId = await dbPut('allocations', allocEntry);
    allocEntry.id = allocId;
    S.allocations.push(allocEntry);
    createdAllocs.push(allocEntry);
  }

  for (const alloc of createdAllocs) {
    await ledgerAdd({
      fund: alloc.fund,
      year: alloc.year,
      type: 'payment',
      credit: alloc.amount,
      ref: 'PAY-' + paymentId,
      refId: paymentId,
      description: 'دفعة',
      date: date
    });
  }

  WALLET_CACHE.invalidate(memberId);

  return { payment: payment, allocations: createdAllocs, remaining: plan.remaining };
}

function filterMembersForCollect(filter, sectorFilter, user) {
  const mySector = user ? user.sector : null;
  const isManager = user && (user.role === 'manager' || user.role === 'president');

  let list = S.members.filter(m => {
    const st = m.memberStatus || 'نشط';
    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return false;
    if (!m.assocStartYear && !m.deathStartYear) return false;
    if (isManager) {
      if (sectorFilter && sectorFilter !== 'all' && m.sector !== sectorFilter) return false;
    } else if (mySector && sectorFilter !== 'all') {
      if (m.sector !== mySector) return false;
    }
    return true;
  });

  if (filter === 'late') {
    list = list.filter(m => { const w = computeMemberWallet(m.id); return w && w.summary.totalBalance > 0; });
  } else if (filter === 'paid') {
    list = list.filter(m => { const w = computeMemberWallet(m.id); return w && w.summary.totalBalance <= 0 && w.summary.totalPaid > 0; });
  } else if (filter === 'new') {
    list = list.filter(m => m.assocStartYear === S.currentYear || m.deathStartYear === S.currentYear);
  }

  list.sort((a, b) => {
    const wa = computeMemberWallet(a.id);
    const wb = computeMemberWallet(b.id);
    const ra = wa ? Math.max(0, wa.summary.totalBalance) : 0;
    const rb = wb ? Math.max(0, wb.summary.totalBalance) : 0;
    if (ra !== rb) return rb - ra;
    return String(a.name).localeCompare(String(b.name), 'ar');
  });

  return list;
}

  if (pin !== pin2) { toast('غير متطابقتين', 'error'); return; }
  try {
    const pinHash = await hashPin(pin);
    const user = {
      name: name,
      phone: cleanPhone($('fPhone').value),
      pinHash: pinHash, hasPin: true, role: 'manager', sector: '',
      createdAt: new Date().toISOString()
    };
    const id = await dbPut('users', user);
    user.id = id;
    S.users.push(user);
    closeSheetAll();
    toast('✅ تم الإنشاء', 'success', 3000);
    setTimeout(renderLogin, 400);
  } catch (e) { toast('خطأ: ' + e.message, 'error'); }

function go(page) {
  S.page = page;
  $$('.page').forEach(function(p) { p.classList.remove('active'); });
  const target = $(page);
  if (!target) return;
  target.classList.add('active');
  $$('.bnav button').forEach(function(b) { b.classList.toggle('on', b.dataset.pg === page); });
  window.scrollTo(0, 0);
  $('fab').style.display = page === 'pg-collect' ? 'flex' : 'none';

  const renderers = {
    'pg-home':          renderHome,
    'pg-collect':       renderCollect,
    'pg-custody':       renderCustody,
    'pg-deliveries':    renderDeliveries,
    'pg-deaths':        renderDeaths,
    'pg-reports':       renderReports,
    'pg-inout':         renderInOut,
    'pg-account':       renderAccount,
    'pg-admin':         renderAdmin,
    'pg-notifications': renderNotifications
  };
  if (renderers[page]) {
    try { renderers[page](); }
    catch (e) {
      target.innerHTML = '<div class="empty"><span class="ico">⚠️</span><h3>خطأ</h3><p>' + esc(e.message) + '</p></div>';

  }
}

function computeCollectCounts() {
  const role = S.currentRole;
  const user = S.currentUser;
  const mySector = user.sector;
  const isManager = role.key === 'manager' || role.key === 'president';
  const sectorFilter = isManager ? S.filters.collectSector : mySector;

  let all = 0, late = 0, paid = 0, newC = 0;

  S.members.forEach(function(m) {
    const st = m.memberStatus || 'نشط';
    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return;
    if (!m.assocStartYear && !m.deathStartYear) return;
    if (isManager) {
      if (sectorFilter && sectorFilter !== 'all' && m.sector !== sectorFilter) return;
    } else if (mySector && m.sector !== mySector) return;

    all++;
    const w = computeMemberWallet(m.id);
    if (w) {
      const rem = w.summary.totalBalance;
      if (rem > 0) late++;
      else if (rem <= 0 && w.summary.totalPaid > 0) paid++;
    }
    if (m.assocStartYear === S.currentYear || m.deathStartYear === S.currentYear) newC++;
  });

  return { all, late, paid, new: newC };
}

function setCollectFilter(f) { S.filters.collect = f; renderCollect(); }
function setCollectSector(s) { S.filters.collectSector = s; renderCollect(); }

  const filter = S.filters.collect;
  const sectorFilter = isManager ? S.filters.collectSector : mySector;

  let list = filterMembersForCollect(filter, sectorFilter, user);

  if (S.search) {
    const s = normAr(S.search);
    list = list.filter(m => normAr(m.name + ' ' + (m.code || '') + ' ' + (m.phone || '')).indexOf(s) > -1);
  }

  const el = $('collectListContent');
  if (!el) return;
  if (!list.length) {
    el.innerHTML = '<div class="empty"><span class="ico">👥</span><h3>لا يوجد أعضاء</h3></div>';
    return;
  }
  el.innerHTML = '<div style="font-size:11px;color:var(--muted-2);font-weight:700;margin-bottom:6px;padding:0 4px">📊 ' + list.length + ' عضو</div>' +
    '<div class="list">' + list.slice(0, 100).map(renderCollectMemberRow).join('') + '</div>';
}

function renderCollectMemberRow(m) {
  const w = computeMemberWallet(m.id);
  const remA = w ? Math.max(0, w.funds.assoc.balance) : 0;
  const remD = w ? Math.max(0, w.funds.death.balance) : 0;
  const totalRem = remA + remD;
  const isLate = totalRem > 0;
  const subs = [];
  if (m.assocStartYear) subs.push('💰');
  if (m.deathStartYear) subs.push('⚰️');
  const accent = isLate ? '#dc2626' : '#10b981';

  let html = '<div onclick="openMemberDetail(' + m.id + ')" style="background:var(--card);border-bottom:1px solid var(--border-2);padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;position:relative;min-height:64px">';
  html += '<div style="position:absolute;right:0;top:0;bottom:0;width:3px;background:' + accent + '"></div>';
  html += '<div style="width:42px;height:42px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">' + (subs.join('') || '👤') + '</div>';
  html += '<div style="flex:1;min-width:0">';
  html += '<div style="font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.name) + '</div>';
  html += '<div style="font-size:10px;color:var(--muted-2);margin-top:2px">' + esc(m.code || '') + ' • ' + esc(m.sector || '') + '</div>';
  html += '</div>';
  html += '<div style="text-align:left;flex-shrink:0;min-width:80px">';
  if (isLate) {
    html += '<div style="font-weight:800;color:var(--death);font-size:14px">' + fmtNum(totalRem) + '</div>';
    html += '<div style="font-size:9px;color:var(--muted)">متبقي</div>';
  } else {
    html += '<div style="color:var(--success);font-size:20px">✓</div>';
  }
  html += '</div></div>';
  return html;
}

  else if (st === 'منسحب') html += '<div style="padding:8px;background:var(--border-2);color:var(--muted);border-radius:8px;font-size:12px;font-weight:800;text-align:center;margin-bottom:10px">🚪 منسحب</div>';

    html += '<div style="font-weight:800;color:var(--assoc);margin-bottom:8px">💰 الجمعية</div>';
    html += '<div class="balance-row"><span class="lbl">المطلوب</span><span class="val">' + fmtNum(wallet.funds.assoc.due) + '</span></div>';
    html += '<div class="balance-row"><span class="lbl">المدفوع</span><span class="val green">' + fmtNum(wallet.funds.assoc.paid) + '</span></div>';
    html += '<div class="balance-row"><span class="lbl">الرصيد</span><span class="val ' + (wallet.funds.assoc.balance > 0 ? 'red' : 'green') + '">' + fmtNum(wallet.funds.assoc.balance) + '</span></div>';
    html += '</div>';
  }

  if (wallet.funds.death.due > 0 || wallet.funds.death.paid > 0) {
    html += '<div style="border:2px solid var(--death);border-radius:14px;padding:14px;margin-bottom:12px">';
    html += '<div style="font-weight:800;color:var(--death);margin-bottom:8px">⚰️ الوفاة</div>';
    html += '<div class="balance-row"><span class="lbl">المطلوب</span><span class="val">' + fmtNum(wallet.funds.death.due) + '</span></div>';
    html += '<div class="balance-row"><span class="lbl">المدفوع</span><span class="val green">' + fmtNum(wallet.funds.death.paid) + '</span></div>';
    html += '<div class="balance-row"><span class="lbl">الرصيد</span><span class="val ' + (wallet.funds.death.balance > 0 ? 'red' : 'green') + '">' + fmtNum(wallet.funds.death.balance) + '</span></div>';
    html += '</div>';
  }

  const balance = wallet.summary.totalBalance;
  html += '<div class="balance-block" style="border:2px solid var(--primary);background:var(--primary-soft)">';
  html += '<div style="font-weight:800;font-size:14px;color:var(--primary);margin-bottom:8px">📊 الإجمالي</div>';
  html += '<div class="balance-row"><span class="lbl">المطلوب</span><span class="val">' + fmtNum(wallet.summary.totalDue) + '</span></div>';
  html += '<div class="balance-row"><span class="lbl">المدفوع</span><span class="val green">' + fmtNum(wallet.summary.totalPaid) + '</span></div>';
  html += '<div class="balance-row" style="border-top:2px solid var(--primary);padding-top:8px">';
  html += '<span style="font-weight:800">' + (balance > 0 ? '⚠️ متأخرات' : balance < 0 ? '💚 رصيد' : '✅ مسدَّد') + '</span>';

  html += '</div></div>';

  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px">';

function openPaySheet(memberId, fund) {
  if (!canCollect()) { toast('غير مصرح', 'error'); return; }
  const m = getMemberById(memberId);
  if (!m) return;

  const fundNames = { assoc: 'جمعية', death: 'وفاة' };
  const fundIcons = { assoc: '💰', death: '⚰️' };

  const w = computeMemberWallet(memberId);
  const fundData = w ? w.funds[fund] : null;
  const due = fundData ? fundData.due : 0;
  const paid = fundData ? fundData.paid : 0;
  const rem = Math.max(0, due - paid);

  let body = '';
  body += '<div style="padding:14px;background:var(--' + fund + '-soft);border-radius:12px;margin-bottom:14px;text-align:center">';
  body += '<div style="font-size:32px">' + fundIcons[fund] + '</div>';
  body += '<div style="font-weight:800;font-size:16px;margin-top:6px">' + esc(m.name) + '</div>';
  body += '<div style="font-size:12px;color:var(--muted)">دفعة ' + fundNames[fund] + '</div>';
  body += '</div>';

  body += '<div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:14px">';
  body += '<div class="balance-row"><span class="lbl">المطلوب</span><b>' + fmtNum(due) + '</b></div>';
  body += '<div class="balance-row"><span class="lbl">المدفوع</span><b style="color:var(--success)">' + fmtNum(paid) + '</b></div>';
  body += '<div class="balance-row" style="border-top:2px solid var(--' + fund + ');padding-top:8px"><b>المتبقي</b><b style="color:' + (rem > 0 ? 'var(--death)' : 'var(--success)') + '">' + fmtNum(rem) + ' ل.س</b></div>';
  body += '</div>';

  body += '<div class="fld"><label>المبلغ</label>';
  body += '<div class="amount-input"><input type="tel" id="payAmount" value="' + rem + '" inputmode="numeric"><span class="currency">ل.س</span></div>';
  body += '<div class="amount-quick">';
  if (rem > 0) body += '<button type="button" onclick="document.getElementById(\'payAmount\').value=' + rem + '">كامل ' + fmtShort(rem) + '</button>';
  body += '<button type="button" onclick="document.getElementById(\'payAmount\').value=5000">5,000</button>';
  body += '<button type="button" onclick="document.getElementById(\'payAmount\').value=24000">24,000</button>';
  body += '</div></div>';

  body += '<div class="fld"><label>ملاحظات (اختياري)</label><input type="text" id="payNotes" placeholder="..."></div>';

  openSheet(fundIcons[fund] + ' تسجيل دفعة', body,
    '<button class="btn ghost" onclick="closeSheetAll()">إلغاء</button>' +
    '<button class="btn primary" onclick="savePayment(' + memberId + ',\'' + fund + '\')">💾 حفظ</button>',
    { wide: true, focus: 'payAmount' });
}

async function savePayment(memberId, fund) {
  const amount = Number($('payAmount').value);
  const notes = cleanText($('payNotes').value);
  if (!amount || amount <= 0) { toast('المبلغ مطلوب', 'error'); return; }

  showLoad(true);
  try {
    const result = await recordPayment(memberId, amount, { notes: notes, preferredFund: fund });
    vibrate(50);
    toast('✅ تم تسجيل الدفعة', 'success', 2500);
    closeSheetAll();
    if (result.remaining > 0) {
      setTimeout(function() { toast('💰 رصيد مقدم: ' + fmtNum(result.remaining) + ' ل.س', 'info', 3500); }, 500);
    }
    go(S.page);
  } catch (e) {
    toast('خطأ: ' + e.message, 'error');
  }
  showLoad(false);
}

function openQuickPaySheet() {
  if (!canCollect()) { toast('غير مصرح', 'error'); return; }
  const role = S.currentRole;
  const user = S.currentUser;
  const mySector = user.sector;
  const isManager = role.key === 'manager' || role.key === 'president';

  let list = S.members.filter(m => {
    const st = m.memberStatus || 'نشط';
    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return false;
    if (!m.assocStartYear && !m.deathStartYear) return false;
    if (!isManager && mySector && m.sector !== mySector) return false;
    return true;
  });

  list = list.map(m => {
    const w = computeMemberWallet(m.id);
    return { m, rem: w ? Math.max(0, w.summary.totalBalance) : 0 };
  }).filter(x => x.rem > 0).sort((a, b) => b.rem - a.rem).slice(0, 50).map(x => x.m);

  let body = '<div class="card" style="padding:10px 14px;margin-bottom:12px"><div style="display:flex;align-items:center;gap:10px">';
  body += '<span style="font-size:16px">🔍</span>';
  body += '<input type="text" id="quickPaySearch" placeholder="ابحث..." oninput="filterQuickPayList()" style="flex:1;border:0;background:transparent;font-size:14px">';
  body += '</div></div>';
  body += '<div id="quickPayList"></div>';

  window._quickPayList = list;
  openSheet('⚡ دفعة سريعة', body, '<button class="btn ghost" onclick="closeSheetAll()">إلغاء</button>', { wide: true });
  setTimeout(renderQuickPayList, 100);
}

function renderQuickPayList(filtered) {
  const list = filtered || window._quickPayList || [];
  const container = $('quickPayList');
  if (!container) return;
  if (!list.length) {
    container.innerHTML = '<div class="empty"><span class="ico">✅</span><h3>لا يوجد متأخرون</h3></div>';
    return;
  }
  container.innerHTML = '<div class="list">' + list.map(function(m) {
    const w = computeMemberWallet(m.id);
    const rem = w ? Math.max(0, w.summary.totalBalance) : 0;
    return '<div class="item" onclick="closeSheetAll();setTimeout(function(){openMemberDetail(' + m.id + ')},150)">' +
      '<div class="av red">⚠️</div>' +
      '<div class="body"><div class="ttl">' + esc(m.name) + '</div>' +
      '<div class="sub">' + esc(m.sector || '') + '</div></div>' +
      '<div style="font-weight:800;color:var(--death);font-size:13px">' + fmtNum(rem) + '</div></div>';
  }).join('') + '</div>';
}

function filterQuickPayList() {
  const q = $('quickPaySearch').value;
  const all = window._quickPayList || [];
  let filtered = all;
  if (q) {
    const s = normAr(q);
    filtered = all.filter(m => normAr(m.name + ' ' + (m.code || '')).indexOf(s) > -1);
  }
  renderQuickPayList(filtered);
}

function sendStatementWA(memberId) {
  const w = computeMemberWallet(memberId);
  if (!w) return;
  const m = w.member;
  if (!m.phone) { toast('لا يوجد رقم جوال', 'warning'); return; }

  let txt = '📊 *كشف حساب*\n🏘️ صندوق زعورة\n━━━━━━━━━━━━━━\n\n';
  txt += '👤 *' + m.name + '*\n';
  if (m.code) txt += '🆔 ' + m.code + '\n';
  txt += '📍 ' + (m.sector || '—') + '\n\n';

  if (w.funds.assoc.due > 0) {
    txt += '💰 *الجمعية:*\n';
    txt += '• المطلوب: ' + fmtNum(w.funds.assoc.due) + '\n';
    txt += '• المدفوع: ' + fmtNum(w.funds.assoc.paid) + '\n';
    const rem = Math.max(0, w.funds.assoc.balance);
    txt += '• ' + (rem > 0 ? '⚠️ المتبقي: *' + fmtNum(rem) + '*' : '✅ مسدَّد') + '\n\n';
  }
  if (w.funds.death.due > 0) {
    txt += '⚰️ *الوفاة:*\n';
    txt += '• المطلوب: ' + fmtNum(w.funds.death.due) + '\n';
    txt += '• المدفوع: ' + fmtNum(w.funds.death.paid) + '\n';
    const rem = Math.max(0, w.funds.death.balance);
    txt += '• ' + (rem > 0 ? '⚠️ المتبقي: *' + fmtNum(rem) + '*' : '✅ مسدَّد') + '\n\n';
  }
  txt += '━━━━━━━━━━━━━━\n';
  const totalRem = Math.max(0, w.summary.totalBalance);
  txt += totalRem > 0 ? '⚠️ *الإجمالي المتبقي: ' + fmtNum(totalRem) + ' ل.س*' : '✅ *مسدَّد بالكامل*';
  txt += '\n\n_صندوق زعورة_';

  const phone = m.phone.replace(/^0/, '').replace(/^\+963/, '');
  if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    window.location.href = 'whatsapp://send?phone=963' + phone + '&text=' + encodeURIComponent(txt);
  } else {
    window.open('https://wa.me/963' + phone + '?text=' + encodeURIComponent(txt), '_blank');
  }
}

function openDeliverSheet(fundKey) {
  const custody = getMyCustody();
  if (!fundKey) {
    let html = '<div style="text-align:center;padding:14px 0 18px"><div style="font-size:44px">📤</div><div style="font-weight:800;font-size:15px;margin-top:8px">اختر الصندوق</div></div>';
    html += '<div style="display:grid;gap:10px">';
    ['assoc', 'death', 'donation'].forEach(function(f) {
      const meta = FUNDS[f];
      const bal = custody[f].balance;
      const disabled = bal <= 0;
      html += '<button class="quick-btn ' + meta.color + '" style="padding:18px;flex-direction:row;justify-content:space-between;text-align:right;' + (disabled ? 'opacity:.5' : '') + '"' + (disabled ? ' disabled' : '') + ' onclick="closeSheetAll();setTimeout(function(){openDeliverSheet(\'' + f + '\')},150)">';
      html += '<div style="display:flex;align-items:center;gap:14px"><div style="font-size:32px">' + meta.icon + '</div>';
      html += '<div><div style="font-weight:800">' + meta.name + '</div><div style="font-size:11px;color:var(--muted)">' + fmtNum(bal) + ' ل.س</div></div></div>';
      html += '<div>' + (disabled ? '—' : '›') + '</div></button>';
    });
    html += '</div>';
    openSheet('📤 تسليم للأمين', html, '<button class="btn ghost" onclick="closeSheetAll()">إلغاء</button>');
    return;
  }

  const meta = FUNDS[fundKey];
  const bal = custody[fundKey].balance;
  if (bal <= 0) { toast('لا يوجد رصيد', 'warning'); return; }

  const amirRoleKey = fundKey === 'death' ? 'deathTreasurer' : 'assocTreasurer';
  const amir = S.users.find(u => u.role === amirRoleKey);

  let html = '';
  html += '<div style="padding:14px;background:var(--' + fundKey + '-soft);border-radius:12px;margin-bottom:14px;text-align:center">';
  html += '<div style="font-size:32px">' + meta.icon + '</div>';
  html += '<div style="font-weight:800">تسليم ' + meta.name + '</div>';
  html += '<div style="font-size:12px;color:var(--muted)">إلى: ' + esc(amir ? amir.name : 'الأمين') + '</div></div>';

  html += '<div class="fld"><label>المبلغ</label><div class="amount-input"><input id="delAmount" type="tel" inputmode="numeric" value="' + bal + '"><span class="currency">ل.س</span></div></div>';
  html += '<div class="fld"><label>ملاحظات</label><input id="delNotes"></div>';

  openSheet(meta.icon + ' تسليم', html,
    '<button class="btn ghost" onclick="closeSheetAll()">إلغاء</button>' +
    '<button class="btn primary" onclick="saveDeliver(\'' + fundKey + '\')">📤 تسليم</button>',
    { focus: 'delAmount' });
}

async function saveDeliver(fundKey) {
  const amount = Number($('delAmount').value);
  const notes = cleanText($('delNotes').value);
  if (!amount || amount <= 0) { toast('المبلغ مطلوب', 'error'); return; }

  const custody = getMyCustody();
  if (amount > custody[fundKey].balance) { toast('المبلغ أكبر من العهدة', 'error'); return; }

  const amirRoleKey = fundKey === 'death' ? 'deathTreasurer' : 'assocTreasurer';
  const amir = S.users.find(u => u.role === amirRoleKey);

  try {
    const delivery = {
      fromUserId: S.currentUser.id,
      fromUserName: S.currentUser.name,
      toUserId: amir ? amir.id : null,
      toUserName: amir ? amir.name : 'الأمين',
      fund: fundKey, amount: amount, notes: notes, date: today(),
      createdAt: new Date().toISOString()
    };
    const id = await dbPut('deliveries', delivery);
    delivery.id = id;
    S.deliveries.push(delivery);
    vibrate(50);
    toast('✅ تم التسليم', 'success', 2500);
    closeSheetAll();
    go(S.page);
  } catch (e) { toast('خطأ: ' + e.message, 'error'); }
}

function renderDeliveries() {
  const role = S.currentRole;
  const user = S.currentUser;
  if (!canDeliver() && !canReceive()) {
    $('pg-deliveries').innerHTML = '<div class="empty"><span class="ico">🔒</span><h3>غير مصرح</h3></div>';
    return;
  }

  let myFunds = ['assoc', 'death', 'donation'];
  if (role.key === 'assocTreasurer') myFunds = ['assoc', 'donation'];
  if (role.key === 'deathTreasurer') myFunds = ['death'];

  const incoming = S.deliveries.filter(d => {
    if (myFunds.indexOf(d.fund) === -1) return false;
    if (d.toUserId === user.id) return true;
    if (!d.toUserId) return true;
    return false;
  }).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));

  const outgoing = S.deliveries.filter(d => d.fromUserId === user.id).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const pending = incoming.filter(d => !d.receivedAt && !d.rejectedAt);

  let html = '';
  html += '<div class="stats-scroll">';
  html += '<div class="stat orange"><div class="val">' + pending.length + '</div><div class="lbl">⏳ معلّق</div></div>';
  html += '<div class="stat green"><div class="val">' + incoming.filter(d => d.receivedAt).length + '</div><div class="lbl">✅ مستلم</div></div>';

function setDeliveriesTab(t) { S.filters.deliveries = t; renderDeliveries(); }

function renderDeliveriesContent() {
  const container = $('deliveriesContent');
  if (!container) return;
  const tab = S.filters.deliveries || 'pending';
  const role = S.currentRole;
  const user = S.currentUser;

  let myFunds = ['assoc', 'death', 'donation'];
  if (role.key === 'assocTreasurer') myFunds = ['assoc', 'donation'];
  if (role.key === 'deathTreasurer') myFunds = ['death'];

  let list = [];
  if (tab === 'pending') {
    list = S.deliveries.filter(d => {
      if (myFunds.indexOf(d.fund) === -1) return false;
      if (d.receivedAt || d.rejectedAt) return false;
      if (d.toUserId === user.id) return true;
      if (!d.toUserId) return true;
      return false;
    }).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  } else if (tab === 'received') {
    list = S.deliveries.filter(d => {
      if (myFunds.indexOf(d.fund) === -1) return false;
      if (!d.receivedAt) return false;
      if (d.toUserId === user.id) return true;
      if (!d.toUserId) return true;
      return false;
    });
  } else {
    list = S.deliveries.filter(d => d.fromUserId === user.id);
  }

  if (!list.length) {
    container.innerHTML = '<div class="empty"><span class="ico">📬</span><h3>لا توجد تسليمات</h3></div>';
    return;
  }

  let html = '';
  if (tab === 'pending') {
    list.forEach(function(d) {
      const fund = FUNDS[d.fund] || FUNDS.assoc;
      html += '<div class="card" style="border-right:4px solid var(--warning)">';
      html += '<div style="display:flex;justify-content:space-between;margin-bottom:10px">';
      html += '<div><div style="font-weight:800">' + esc(d.fromUserName) + '</div>';
      html += '<div style="font-size:11px;color:var(--muted)">' + fund.name + ' • ' + fmtDate(d.date) + '</div></div>';
      html += '<div style="font-weight:800;color:var(--' + fund.color + ')">' + fmtNum(d.amount) + '</div></div>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
      html += '<button class="btn success" onclick="receiveDelivery(' + d.id + ')">✅ استلمت</button>';
      html += '<button class="btn danger" onclick="rejectDelivery(' + d.id + ')">❌ رفض</button>';
      html += '</div></div>';
    });
  } else {
    html += '<div class="list">';
    list.forEach(function(d) {
      const fund = FUNDS[d.fund] || FUNDS.assoc;
      const statusIcon = d.receivedAt ? '✅' : d.rejectedAt ? '❌' : '⏳';
      const statusColor = d.receivedAt ? 'green' : d.rejectedAt ? 'red' : 'orange';
      html += '<div class="item">';
      html += '<div class="av ' + statusColor + '">' + statusIcon + '</div>';
      html += '<div class="body"><div class="ttl">' + (tab === 'outgoing' ? 'إلى: ' + esc(d.toUserName || '—') : 'من: ' + esc(d.fromUserName)) + '</div>';
      html += '<div class="sub">' + fund.name + ' • ' + fmtDate(d.date) + '</div></div>';
      html += '<div style="font-weight:800;color:var(--' + fund.color + ')">' + fmtNum(d.amount) + '</div></div>';
    });
    html += '</div>';
  }
  container.innerHTML = html;
}

async function receiveDelivery(id) {
  const d = S.deliveries.find(x => x.id === id);
  if (!d) return;
  if (!confirm('استلام ' + fmtNum(d.amount) + ' ل.س؟')) return;
  try {
    d.toUserId = S.currentUser.id;
    d.toUserName = S.currentUser.name;
    d.receivedAt = new Date().toISOString();
    await dbPut('deliveries', d);
    vibrate(50);
    toast('✅ تم الاستلام', 'success', 2500);
    renderDeliveries();
    updateNotifBadge();
  } catch (e) { toast('خطأ', 'error'); }
}

async function rejectDelivery(id) {
  const d = S.deliveries.find(x => x.id === id);
  if (!d) return;
  const reason = prompt('سبب الرفض؟');
  if (!reason) return;
  try {
    d.rejectedAt = new Date().toISOString();
    d.rejectReason = reason;
    await dbPut('deliveries', d);
    toast('❌ تم الرفض', 'warning', 2500);
    renderDeliveries();
  } catch (e) { toast('خطأ', 'error'); }
}

function renderDeaths() {
  const y = S.currentYear;
  const allDeaths = S.deaths.slice().sort(function(a, b) {
    if ((b.year || 0) !== (a.year || 0)) return (b.year || 0) - (a.year || 0);
    return (b.deathDate || '').localeCompare(a.deathDate || '');
  });
  const recentDeaths = allDeaths.filter(d => Number(d.year) >= 2025);
  const yearDeaths = recentDeaths.filter(d => Number(d.year) === y);
  const totalComp = yearDeaths.reduce((s, d) => s + (Number(d.compensation) || 0), 0);
  const filter = S.filters.deaths || 'year';
  let displayed;
  if (filter === 'year') displayed = yearDeaths;
  else if (filter === 'recent') displayed = recentDeaths;
  else displayed = allDeaths;

  let html = '';
  html += '<div class="stats-scroll">';
  html += '<div class="stat red"><div class="val">' + yearDeaths.length + '</div><div class="lbl">🪦 ' + y + '</div></div>';
  html += '<div class="stat orange"><div class="val">' + fmtShort(totalComp) + '</div><div class="lbl">📤 تعويضات</div></div>';
  html += '<div class="stat"><div class="val">' + recentDeaths.length + '</div><div class="lbl">📊 من 2025</div></div>';
  html += '<div class="stat purple"><div class="val">' + allDeaths.length + '</div><div class="lbl">📚 الكل</div></div>';
  html += '</div>';

  html += '<div class="card" style="padding:10px;margin-bottom:8px"><div class="chips">';
  html += '<button class="chip ' + (filter === 'year' ? 'on' : '') + '" onclick="setDeathFilter(\'year\')">📅 ' + y + '</button>';
  html += '<button class="chip ' + (filter === 'recent' ? 'on' : '') + '" onclick="setDeathFilter(\'recent\')">📋 من 2025</button>';
  html += '<button class="chip ' + (filter === 'all' ? 'on' : '') + '" onclick="setDeathFilter(\'all\')">📚 الكل</button>';
  html += '</div></div>';

  if (canCollect()) {
    html += '<button class="btn death block lg" onclick="openDeathSheet()" style="margin-bottom:12px">➕ تسجيل وفاة</button>';
  }

  if (displayed.length) {
    html += '<div class="list">';
    displayed.slice(0, 200).forEach(function(d) {
      const hasComp = Number(d.compensation) > 0;
      html += '<div class="item" onclick="openDeathDetail(' + d.id + ')">';
      html += '<div class="av red">🪦</div>';
      html += '<div class="body"><div class="ttl">' + esc(d.deceasedName) + '</div>';
      html += '<div class="sub">' + fmtDate(d.deathDate) + ' • ' + d.year + '</div></div>';
      html += '<div style="font-weight:800;color:var(--death);font-size:13px">' + (hasComp ? fmtShort(d.compensation) : '⚠️') + '</div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="empty"><span class="ico">🪦</span><h3>لا توجد وفيات</h3></div>';
  }

  $('pg-deaths').innerHTML = html;
}

function setDeathFilter(f) { S.filters.deaths = f; renderDeaths(); }

function estimateAffected(year) {
  return S.members.filter(m => m.deathStartYear && m.deathStartYear <= year && !m.deathExempt && m.memberStatus !== 'متوفى').length;
}
