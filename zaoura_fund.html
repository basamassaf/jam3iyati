function renderMembersList() {
  const f = S.filters;
  const currentYear = S.currentYear;
  
  let list = S.members.filter(function(m) {
    const st = m.memberStatus || 'نشط';
    
    if (f.members === 'deceased') return st === 'متوفى';
    if (f.members === 'withdrawn') return st === 'منسحب';
    if (f.members === 'frozen') return st === 'متوقف';
    
    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return false;
    
    if (f.members === 'subscribed') {
      return (m.assocStartYear || m.deathStartYear) && st !== 'معفى';
    }
    if (f.members === 'unsubscribed') {
      return (!m.assocStartYear && !m.deathStartYear) || st === 'معفى';
    }
    return false;
  });
  
  if (f.membersSector !== 'all') {
    list = list.filter(m => m.sector === f.membersSector);
  }
  
  if (S.search) {
    const s = normAr(S.search);
    list = list.filter(m =>
      normAr(m.name + ' ' + (m.code || '') + ' ' + (m.phone || '')).indexOf(s) > -1
    );
  }
  
  /* ترتيب حسب المتأخرات */
  list.sort(function(a, b) {
    const wa = computeMemberWallet(a.id);
    const wb = computeMemberWallet(b.id);
    const ra = wa ? Math.max(0, wa.summary.totalBalance) : 0;
    const rb = wb ? Math.max(0, wb.summary.totalBalance) : 0;
    if (ra !== rb) return rb - ra;
    return String(a.name).localeCompare(String(b.name), 'ar');
  });
  
  const el = $('membersListContent');
  const countEl = $('membersCountDisplay');
  
  if (countEl) countEl.textContent = '📊 ' + list.length + ' عضو';
  if (!el) return;
  
  if (!list.length) {
    el.innerHTML = '<div class="empty"><span class="ico">👥</span><h3>لا يوجد أعضاء</h3>' +
      '<p>' + (S.search ? 'جرّب بحثاً آخر' : 'في هذا التصنيف') + '</p></div>';
    return;
  }
  
  el.innerHTML = '<div class="list">' + list.slice(0, 500).map(renderMemberRow).join('') + '</div>';
}

function renderMemberRow(m) {
  const wallet = computeMemberWallet(m.id);
  const rem = wallet ? Math.max(0, wallet.summary.totalBalance) : 0;
  const credit = wallet ? Math.max(0, -wallet.summary.totalBalance) : 0;
  const hasUnpaid = rem > 0;
  const st = m.memberStatus || 'نشط';
  
  let accent = '#7c3aed';
  let statusLabel = '';
  
  if (st === 'متوفى') { accent = '#dc2626'; statusLabel = 'متوفى'; }
  else if (st === 'منسحب') { accent = '#94a3b8'; statusLabel = 'منسحب'; }
  else if (st === 'متوقف') { accent = '#f59e0b'; statusLabel = 'متوقف'; }
  else if (st === 'معفى') { accent = '#3b82f6'; statusLabel = 'معفى'; }
  
  const subs = [];
  if (m.assocStartYear) subs.push('💰');
  if (m.deathStartYear) subs.push('⚰️');
  
  const isNew = m.assocStartYear === S.currentYear || m.deathStartYear === S.currentYear;
  
  let html = '<div onclick="openMemberDetail(' + m.id + ')" style="background:var(--card);border-bottom:1px solid var(--border-2);padding:11px 16px 11px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;position:relative;min-height:56px">';
  html += '<div style="position:absolute;right:0;top:0;bottom:0;width:3px;background:' + accent + '"></div>';
  
  html += '<div style="flex:1;min-width:0">';
  html += '<div style="font-size:13.5px;font-weight:700;color:var(--text);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px">';
  html += '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.name) + '</span>';
  if (isNew) html += '<span class="badge success" style="font-size:8px;padding:1px 5px">جديد</span>';
  if (statusLabel) html += '<span style="color:' + accent + ';font-size:10px;font-weight:700">· ' + statusLabel + '</span>';
  html += '</div>';
  
  html += '<div style="font-size:10px;color:var(--muted-2);margin-top:2px;font-family:\'SF Mono\',monospace;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">';
  html += esc(m.code || '—');
  if (subs.length) html += '  ' + subs.join('·');
  if (m.sector) html += '  ' + esc(m.sector);
  html += '</div></div>';
  
  html += '<div style="flex-shrink:0;text-align:left;direction:ltr;min-width:82px">';
  if (hasUnpaid) {
    html += '<div style="font-size:14px;font-weight:800;color:var(--death);font-family:\'SF Mono\',monospace;line-height:1.1">' + fmtNum(rem) + '</div>';
    html += '<div style="font-size:9px;color:var(--death);font-weight:700;text-align:right;margin-top:1px">متبقي</div>';
  } else if (credit > 0) {
    html += '<div style="font-size:14px;font-weight:800;color:var(--success);font-family:\'SF Mono\',monospace;line-height:1.1">' + fmtNum(credit) + '</div>';
    html += '<div style="font-size:9px;color:var(--success);font-weight:700;text-align:right;margin-top:1px">رصيد</div>';
  } else {
    html += '<div style="font-size:11px;color:var(--success);font-weight:700;text-align:right">✓ مسدَّد</div>';
  }
  html += '</div></div>';
  
  return html;
}

/* ═══ تفاصيل العضو ═══ */
function openMemberDetail(id) {
  const wallet = computeMemberWallet(id);
  if (!wallet) return;
  
  const m = wallet.member;
  const st = m.memberStatus || 'نشط';
  
  let html = '';
  
  /* الهيدر */
  html += '<div style="padding:16px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:14px;margin-bottom:14px">';
  html += '<div style="display:flex;align-items:center;gap:12px">';
  html += '<div style="width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0">' + (m.gender === 'أنثى' ? '👩' : '👨') + '</div>';
  html += '<div style="flex:1;min-width:0">';
  html += '<div style="font-weight:800;font-size:17px">' + esc(m.name) + '</div>';
  html += '<div style="font-size:12px;opacity:.9;margin-top:3px">' + esc(m.code || '') + ' • ' + esc(m.sector || '') + '</div>';
  html += '</div></div></div>';
  
  /* الحالة */
  if (st === 'متوفى') {
    html += '<div style="padding:8px;background:var(--death-light);color:#991b1b;border-radius:8px;font-size:12px;font-weight:800;text-align:center;margin-bottom:10px">⚰️ متوفى' + (m.deathDate ? ' — ' + fmtDate(m.deathDate) : '') + '</div>';
  } else if (st === 'منسحب') {
    html += '<div style="padding:8px;background:var(--border-2);color:var(--muted);border-radius:8px;font-size:12px;font-weight:800;text-align:center;margin-bottom:10px">🚪 منسحب' + (m.stopYear ? ' — من ' + m.stopYear : '') + '</div>';
  } else if (st === 'متوقف') {
    html += '<div style="padding:8px;background:var(--warning-soft);color:#92400e;border-radius:8px;font-size:12px;font-weight:800;text-align:center;margin-bottom:10px">⏸️ متوقف' + (m.stopYear ? ' — من ' + m.stopYear : '') + '</div>';
  } else if (st === 'معفى') {
    html += '<div style="padding:8px;background:var(--info-soft);color:#1e40af;border-radius:8px;font-size:12px;font-weight:800;text-align:center;margin-bottom:10px">🎗️ معفى من الرسوم</div>';
  }
  
  /* المحافظ */
  if (wallet.funds.assoc.due > 0) html += renderWalletBlock('assoc', wallet.funds.assoc);
  if (wallet.funds.death.due > 0) html += renderWalletBlock('death', wallet.funds.death);
  if (wallet.funds.donation.paid > 0) html += renderWalletBlock('donation', wallet.funds.donation);
  
  /* الإجمالي */
  const balance = wallet.summary.totalBalance;
  html += '<div class="balance-block" style="border:2px solid var(--primary);background:var(--primary-soft)">';
  html += '<div style="font-weight:800;font-size:14px;color:var(--primary);margin-bottom:8px">📊 الإجمالي</div>';
  html += '<div class="balance-row"><span class="lbl">المطلوب</span><span class="val">' + fmtNum(wallet.summary.totalDue) + '</span></div>';
  html += '<div class="balance-row"><span class="lbl">المدفوع</span><span class="val green">' + fmtNum(wallet.summary.totalPaid) + '</span></div>';
  const bColor = balance > 0 ? 'red' : balance < 0 ? 'green' : 'green';
  const bLabel = balance > 0 ? '⚠️ متأخرات' : balance < 0 ? '💚 رصيد مقدم' : '✅ مسدَّد';
  html += '<div class="balance-row" style="border-top:2px solid var(--primary);padding-top:8px;margin-top:6px">';
  html += '<span style="font-weight:800">' + bLabel + '</span>';
  html += '<span class="val ' + bColor + '" style="font-size:16px">' + fmtNum(Math.abs(balance)) + ' ل.س</span>';
  html += '</div></div>';
  
  /* أزرار الدفع */
  if (hasPerm('payments.add')) {
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px">';
    if (wallet.funds.assoc.balance > 0 || m.assocStartYear) {
      html += '<button class="btn assoc" onclick="closeSheetAll();setTimeout(function(){openPaySheet(' + id + ',\'assoc\')},150)">💰 دفعة جمعية</button>';
    }
    if (wallet.funds.death.balance > 0 || m.deathStartYear) {
      html += '<button class="btn death" onclick="closeSheetAll();setTimeout(function(){openPaySheet(' + id + ',\'death\')},150)">⚰️ دفعة وفاة</button>';
    }
    html += '</div>';
  }
  
  /* أزرار سفلية */
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">';
  if (hasPerm('members.edit') || hasPerm('members.editPhone')) {
    html += '<button class="btn ghost block" onclick="closeSheetAll();setTimeout(function(){openMemberSheet(' + id + ')},150)">📝 تعديل</button>';
  }
  html += '<button class="btn ghost block" onclick="closeSheetAll();setTimeout(function(){openMemberStatement(' + id + ')},150)">📊 كشف</button>';
  html += '</div>';
  
  if (m.phone) {
    html += '<a class="btn success block" style="margin-top:8px" href="https://wa.me/963' + m.phone.replace(/^0/, '') + '" target="_blank">📱 واتساب العضو</a>';
  }
  
  openSheet('👤 ' + m.name, html, '<button class="btn ghost" onclick="closeSheetAll()">إغلاق</button>', { wide: true });
}

/* ═══ كشف حساب عضو ═══ */
function openMemberStatement(memberId) {
  const w = computeMemberWallet(memberId);
  if (!w) return;
  const m = w.member;
  
  let body = '';
  body += '<div style="padding:14px;background:var(--primary-soft);border-radius:12px;margin-bottom:14px;text-align:center">';
  body += '<div style="font-weight:800;font-size:16px">' + esc(m.name) + '</div>';
  body += '<div style="font-size:12px;color:var(--muted);margin-top:4px">' + esc(m.code || '') + ' • ' + esc(m.sector || '') + '</div>';
  body += '</div>';
  
  w.years.forEach(function(yr) {
    if (yr.total.due === 0 && yr.total.paid === 0) return;
    
    body += '<div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:10px">';
    body += '<div style="font-weight:800;font-size:14px;margin-bottom:8px">📅 ' + yr.year + (yr.total.balance <= 0 && yr.total.due > 0 ? ' ✅' : '') + '</div>';
    
    if (yr.assoc.due > 0) {
      body += '<div style="padding:6px 0;font-size:12px"><b>💰 الجمعية:</b> ' + fmtNum(yr.assoc.paid) + ' / ' + fmtNum(yr.assoc.due) + '</div>';
    }
    if (yr.death.due > 0) {
      body += '<div style="padding:6px 0;font-size:12px"><b>⚰️ الوفاة:</b> ' + fmtNum(yr.death.paid) + ' / ' + fmtNum(yr.death.due) + '</div>';
    }
    if (yr.donation.paid > 0) {
      body += '<div style="padding:6px 0;font-size:12px"><b>💚 تبرع:</b> ' + fmtNum(yr.donation.paid) + '</div>';
    }
    body += '</div>';
  });
  
  openSheet('📊 كشف حساب', body, '<button class="btn ghost" onclick="closeSheetAll()">إغلاق</button>', { wide: true });
}

  setTimeout(function() {
    const statusField = $('mMemberStatus');

      statusField.onchange = function() {
        const v = this.value;
        $('mStopYearField').style.display = (v === 'منسحب' || v === 'متوقف') ? 'block' : 'none';
        $('mDeathDateField').style.display = v === 'متوفى' ? 'block' : 'none';
      };
    }
  }, 100);

async function saveMember(id) {
  const canEditAll = hasPerm('members.edit');
  const canEditPhone = hasPerm('members.editPhone');
  
  if (!canEditAll && !canEditPhone) { toast('غير مصرح', 'error'); return; }
  
  try {
    const old = id ? await dbGet('members', id) : null;
    let obj = old ? Object.assign({}, old) : {};
    
    if (canEditPhone) {
      obj.phone = cleanPhone($('mPhone') ? $('mPhone').value : '');
    }
    
    if (canEditAll) {
      const name = cleanText($('mName').value);
      if (!name) { toast('الاسم مطلوب', 'error'); return; }
      
      const assocActive = $('mAssocActive').value === 'yes';
      const deathActive = $('mDeathActive').value === 'yes';
      const memberStatus = $('mMemberStatus').value;
      
      if (memberStatus === 'متوفى' && !$('mDeathDate').value) {
        toast('تاريخ الوفاة مطلوب', 'error');
        return;
      }
      
      obj.code = cleanText($('mCode').value);
      obj.familyCode = cleanText($('mFamily').value);
      obj.name = name;
      obj.gender = $('mGender').value;
      obj.status = $('mStatus').value;
      obj.birth = $('mBirth').value;
      obj.sector = $('mSector').value;
      obj.relation = $('mRelation').value;

function computeCollectCounts() {
  const user = S.currentUser;
  const role = S.currentRole;
  const mySector = user.sector;
  const isManager = role.key === 'manager' || role.key === 'president';
  const sectorFilter = isManager ? S.filters.collectSector : mySector;
  
  let all = 0, late = 0, paid = 0, newC = 0, fees = 0;
  const myPayments = S.payments.filter(p => p.collectorId === user.id);
  const myPaidMemberIds = new Set(myPayments.map(p => p.memberId));
  let myPaidCount = myPaidMemberIds.size;
  
  S.members.forEach(function(m) {
    const st = m.memberStatus || 'نشط';
    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return;
    if (!m.assocStartYear && !m.deathStartYear) return;
    
    if (!isManager && mySector && m.sector !== mySector) return;
    if (isManager && sectorFilter !== 'all' && m.sector !== sectorFilter) return;
    
    all++;
    
    const w = computeMemberWallet(m.id);
    if (w) {
      const rem = w.summary.totalBalance;
      if (rem > 0) late++;
      else if (rem <= 0 && w.summary.totalPaid > 0) paid++;
    }
    
    if (m.assocStartYear === S.currentYear || m.deathStartYear === S.currentYear) newC++;
    
    /* رسوم انتساب غير مدفوعة */
    const hasUnpaidFees = (m.assocStartYear && w && w.funds.assoc.years[m.assocStartYear] &&
      w.funds.assoc.years[m.assocStartYear].paid < w.funds.assoc.years[m.assocStartYear].due)
      || (m.deathStartYear && w && w.funds.death.years[m.deathStartYear] &&
        w.funds.death.years[m.deathStartYear].paid < w.funds.death.years[m.deathStartYear].due);
    if (hasUnpaidFees) fees++;
  });
  
  return { all, late, paid, new: newC, fees, 'my-paid': myPaidCount };
}

function setCollectFilter(f) {
  S.filters.collect = f;
  renderCollect();
}

function setCollectSector(s) {
  S.filters.collectSector = s;
  renderCollect();
}

const onCollectSearch = debounce(function(q) {
  S.search = q;
  renderCollectList();
}, 250);

function renderCollectList() {
  const user = S.currentUser;
  const role = S.currentRole;
  const mySector = user.sector;
  const isManager = role.key === 'manager' || role.key === 'president';
  const filter = S.filters.collect;
  const sectorFilter = isManager ? S.filters.collectSector : mySector;
  
  let list = S.members.filter(function(m) {
    const st = m.memberStatus || 'نشط';
    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return false;
    if (!m.assocStartYear && !m.deathStartYear) return false;
    
    if (!isManager && mySector && m.sector !== mySector) return false;
    if (isManager && sectorFilter !== 'all' && m.sector !== sectorFilter) return false;
    return true;
  });
  
  /* فلترة حسب الفلتر المختار */
  if (filter === 'late') {
    list = list.filter(function(m) {
      const w = computeMemberWallet(m.id);
      return w && w.summary.totalBalance > 0;
    });
  } else if (filter === 'paid') {
    list = list.filter(function(m) {
      const w = computeMemberWallet(m.id);
      return w && w.summary.totalBalance <= 0 && w.summary.totalPaid > 0;
    });
  } else if (filter === 'new') {
    list = list.filter(m => m.assocStartYear === S.currentYear || m.deathStartYear === S.currentYear);
  } else if (filter === 'fees') {
    list = list.filter(function(m) {
      const w = computeMemberWallet(m.id);
      if (!w) return false;
      const aYear = m.assocStartYear;
      const dYear = m.deathStartYear;
      const aY = aYear ? w.funds.assoc.years[aYear] : null;
      const dY = dYear ? w.funds.death.years[dYear] : null;
      return (aY && aY.paid < aY.due) || (dY && dY.paid < dY.due);
    });
  } else if (filter === 'my-paid') {
    const myPaidIds = new Set(S.payments.filter(p => p.collectorId === user.id).map(p => p.memberId));
    list = list.filter(m => myPaidIds.has(m.id));
  }
  
  /* بحث */
  if (S.search) {
    const s = normAr(S.search);
    list = list.filter(m =>
      normAr(m.name + ' ' + (m.code || '') + ' ' + (m.phone || '')).indexOf(s) > -1
    );
  }
  
  /* ترتيب */
  list.sort(function(a, b) {
    const wa = computeMemberWallet(a.id);
    const wb = computeMemberWallet(b.id);
    const ra = wa ? Math.max(0, wa.summary.totalBalance) : 0;
    const rb = wb ? Math.max(0, wb.summary.totalBalance) : 0;
    if (ra !== rb) return rb - ra;
    return String(a.name).localeCompare(String(b.name), 'ar');
  });
  
  const el = $('collectListContent');
  if (!el) return;
  
  if (!list.length) {
    el.innerHTML = '<div class="empty"><span class="ico">👥</span><h3>لا يوجد أعضاء</h3></div>';
    return;
  }
  
  el.innerHTML = '<div style="font-size:11px;color:var(--muted-2);font-weight:700;margin-bottom:6px;padding:0 4px">📊 ' + list.length + ' عضو</div>' +
    '<div class="list">' + list.slice(0, 500).map(renderCollectMemberRow).join('') + '</div>';
}

function renderCollectMemberRow(m) {
  const w = computeMemberWallet(m.id);
  const remA = w ? Math.max(0, w.funds.assoc.balance) : 0;
  const remD = w ? Math.max(0, w.funds.death.balance) : 0;
  const totalRem = remA + remD;
  const isLate = totalRem > 0;
  
  const subs = [];
  if (m.assocStartYear) subs.push('💰');
  if (m.deathStartYear) subs.push('⚰️');
  
  let accent = isLate ? '#dc2626' : '#10b981';
  
  let html = '<div onclick="openMemberDetail(' + m.id + ')" style="background:var(--card);border-bottom:1px solid var(--border-2);padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;position:relative;min-height:60px">';
  html += '<div style="position:absolute;right:0;top:0;bottom:0;width:3px;background:' + accent + '"></div>';
  
  html += '<div style="width:42px;height:42px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">' + (subs.join('') || '👤') + '</div>';
  
  html += '<div style="flex:1;min-width:0">';
  html += '<div style="font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.name) + '</div>';
  html += '<div style="font-size:10px;color:var(--muted-2);margin-top:2px;font-family:\'SF Mono\',monospace">' + esc(m.code || '') + ' • ' + esc(m.sector || '') + '</div>';
  if (remA > 0 || remD > 0) {
    html += '<div style="font-size:10px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap">';
    if (remA > 0) html += '<span>💰 ' + fmtNum(remA) + '</span>';
    if (remD > 0) html += '<span>⚰️ ' + fmtNum(remD) + '</span>';
    html += '</div>';
  }
  html += '</div>';
  
  html += '<div style="text-align:left;flex-shrink:0;min-width:80px">';
  if (isLate) {
    html += '<div style="font-weight:800;color:var(--death);font-family:\'SF Mono\',monospace;font-size:14px">' + fmtNum(totalRem) + '</div>';
    html += '<div style="font-size:9px;color:var(--muted);margin-top:2px">متبقي</div>';
  } else {
    html += '<div style="color:var(--success);font-size:20px">✓</div>';
  }
  html += '</div></div>';
  
  return html;
}

}

async function savePayment(memberId, fund) {
  const amount = Number($('payAmount').value);
  const notes = cleanText($('payNotes').value);
  
  if (!amount || amount <= 0) { toast('المبلغ مطلوب', 'error'); return; }
  
  const m = S.members.find(x => x.id === memberId);
  if (!m) return;
  
  try {
    /* تحديد السنة تلقائياً (الأقدم أولاً) */
    const w = computeMemberWallet(memberId);
    let forYear = S.currentYear;
    if (w) {
      const yearsWithDue = [];
      for (const [yStr, data] of Object.entries(w.funds[fund].years || {})) {
        const y = Number(yStr);
        const rem = data.due - data.paid;
        if (rem > 0) yearsWithDue.push({ year: y, due: rem });
      }
      if (yearsWithDue.length > 0) {
        yearsWithDue.sort((a, b) => a.year - b.year);
        forYear = yearsWithDue[0].year;
      }
    }
    
    const payment = {
      memberId: memberId,
      fund: fund,
      amount: amount,
      date: today(),
      year: forYear,
      forYear: forYear,
      notes: notes,
      collectorId: S.currentUser.id,
      collectorName: S.currentUser.name,
      createdAt: new Date().toISOString()
    };
    
    const id = await dbPut('payments', payment);
    payment.id = id;
    S.payments.push(payment);
    
    CACHE.invalidateAll();
    if (memberId) CACHE.invalidateMember(memberId);
    
    await logAudit('add', 'payment', id, { fund, memberId, amount, forYear });
    
    toast('✅ تم تسجيل الدفعة', 'success', 2500);
    closeSheetAll();
    go(S.page);
  } catch (e) {
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
}

async function saveDeath() {
  const name = cleanText($('dName').value);
  const date = $('dDate').value;
  const year = Number($('dYear').value);
  const comp = Number($('dComp').value) || 0;
  const recipient = cleanText($('dRecipient').value);
  const notes = cleanText($('dNotes').value);
  
  if (!name) { toast('اسم المتوفى مطلوب', 'error'); return; }
  if (!date) { toast('التاريخ مطلوب', 'error'); return; }
  
  const isDup = S.deaths.some(d =>
    normAr(d.deceasedName) === normAr(name) && Number(d.year) === year
  );
  if (isDup) {
    if (!confirm('⚠️ توجد وفاة بنفس الاسم في سنة ' + year + '. متابعة؟')) return;
  }
  
  const deathSubs = S.members.filter(m =>
    m.deathStartYear && m.deathStartYear <= year && !m.deathExempt && m.memberStatus !== 'متوفى'
  ).length;
  
  const c = getConstants(year);
  const inst = c && c.deathInstallment ? c.deathInstallment : 5000;
  const totalImpact = deathSubs * inst;
  
  if (!confirm('⚰️ تسجيل وفاة "' + name + '"\n\n' +
    'عدد مشتركي الوفاة: ' + deathSubs + '\n' +
    'سيُضاف قسط ' + fmtNum(inst) + ' × ' + deathSubs + ' = ' + fmtNum(totalImpact) + ' ل.س\n\n' +
    'متابعة؟')) return;
  
  try {
    const death = {
      deceasedName: name,
      deathDate: date,
      year: year,
      compensation: comp,
      recipient: recipient,
      notes: notes,
      recordedBy: S.currentUser.id,
      recordedByName: S.currentUser.name,
      createdAt: new Date().toISOString()
    };
    
    const id = await dbPut('deaths', death);
    death.id = id;
    S.deaths.push(death);
    
    CACHE.invalidateAll();
    await logAudit('add', 'death', id, { name: name, year: year, comp: comp });
    
    toast('⚰️ تم التسجيل (' + deathSubs + ' قسط)', 'success', 4000);
    closeSheetAll();
    go(S.page);
  } catch (e) {
    toast('خطأ: ' + e.message, 'error');
  }
}

async function saveDeathEdit(id) {
  const d = S.deaths.find(x => x.id === id);
  if (!d) return;
  
  const name = cleanText($('edName').value);
  const date = $('edDate').value;
  const year = Number($('edYear').value);
  const comp = Number($('edComp').value) || 0;
  const recipient = cleanText($('edRecipient').value);
  const notes = cleanText($('edNotes').value);
  
  if (!name || !date) { toast('الاسم والتاريخ مطلوبان', 'error'); return; }
  
  try {
    d.deceasedName = name;
    d.deathDate = date;
    d.year = year;
    d.compensation = comp;
    d.recipient = recipient;
    d.notes = notes;
    d.editedAt = new Date().toISOString();
    d.editedBy = S.currentUser.name;
    
    await dbPut('deaths', d);
    const i = S.deaths.findIndex(x => x.id === id);
    if (i > -1) S.deaths[i] = d;
    
    CACHE.invalidateAll();
    await logAudit('update', 'death', id, { name: name });

    closeSheetAll();
    setTimeout(function() { openDeathDetail(id); }, 200);
  } catch (e) {
    toast('خطأ: ' + e.message, 'error');
  }

async function deleteDeathConfirmed(id) {
  const d = S.deaths.find(x => x.id === id);
  if (!d) return;
  
  if (!confirm('⚠️ حذف وفاة "' + d.deceasedName + '"؟\n\nسيُعاد حساب أقساط كل المشتركين.')) return;
  if (!confirm('تأكيد أخير!')) return;
  
  try {
    await dbDel('deaths', id);
    S.deaths = S.deaths.filter(x => x.id !== id);
    CACHE.invalidateAll();
    await logAudit('delete', 'death', id, { name: d.deceasedName });
    toast('🗑️ تم الحذف', 'success', 2500);
    closeSheetAll();
    go(S.page);
  } catch (e) {
    toast('خطأ: ' + e.message, 'error');
  }
}

/* ═══ استلام تسليم ═══ */
async function receiveDelivery(id) {
  const d = S.deliveries.find(x => x.id === id);
  if (!d) return;
  
  if (!confirm('استلام ' + fmtNum(d.amount) + ' ل.س من ' + d.fromUserName + '؟')) return;
  
  try {
    d.toUserId = S.currentUser.id;
    d.toUserName = S.currentUser.name;
    d.receivedAt = new Date().toISOString();
    d.receivedBy = S.currentUser.name;
    
    await dbPut('deliveries', d);
    CACHE.invalidateAll();
    
    toast('✅ تم الاستلام', 'success', 2500);
    renderInbox();
  } catch (e) {
    toast('خطأ: ' + e.message, 'error');
  }
}

/* ═══ رفض تسليم ═══ */
async function rejectDelivery(id) {
  const d = S.deliveries.find(x => x.id === id);
  if (!d) return;
  const reason = prompt('سبب الرفض؟');
  if (!reason) return;
  
  try {
    d.rejectedAt = new Date().toISOString();
    d.rejectedBy = S.currentUser.name;
    d.rejectReason = reason;
    await dbPut('deliveries', d);
    CACHE.invalidateAll();
    toast('❌ تم الرفض', 'warning', 2500);
    renderInbox();
  } catch (e) {
    toast('خطأ: ' + e.message, 'error');
  }
}

  else if (d.rejectedAt) html += '<div class="badge danger" style="margin-top:6px">❌ مرفوض</div>';
  else html += '<div class="badge warning" style="margin-top:6px">⏳ معلّق</div>';
  html += '</div>';
  
  html += '<div class="balance-block">';
  html += '<div class="balance-row"><span class="lbl">💰 المبلغ</span><span class="val" style="color:var(--success)">' + fmtNum(d.amount) + ' ل.س</span></div>';
  html += '<div class="balance-row"><span class="lbl">📦 الصندوق</span><span class="val">' + fund.icon + ' ' + fund.name + '</span></div>';
  if (d.notes) html += '<div class="balance-row"><span class="lbl">📝 ملاحظات</span><span class="val">' + esc(d.notes) + '</span></div>';
  if (d.receivedAt) html += '<div class="balance-row"><span class="lbl">🕐 استُلم في</span><span class="val" style="font-size:11px">' + fmtDateTime(d.receivedAt) + '</span></div>';
  if (d.rejectReason) html += '<div class="balance-row"><span class="lbl">❌ سبب الرفض</span><span class="val">' + esc(d.rejectReason) + '</span></div>';
  html += '</div>';
  
  if (canReverse) {
    html += '<button class="btn info block" style="margin-top:14px" onclick="reverseDelivery(' + id + ')">↩️ عكس الاستلام</button>';
  }
  
  openSheet('📤 تفاصيل التسليم', html, '<button class="btn ghost" onclick="closeSheetAll()">إغلاق</button>', { wide: true });
}

async function reverseDelivery(id) {
  if (!confirm('عكس الاستلام؟ التسليم سيعود معلّقاً.')) return;
  const d = S.deliveries.find(x => x.id === id);
  if (!d) return;
  delete d.receivedAt;
  delete d.receivedBy;
  d.reversedAt = new Date().toISOString();
  d.reversedBy = S.currentUser.name;
  await dbPut('deliveries', d);
  CACHE.invalidateAll();
  toast('↩️ تم العكس');
  closeSheetAll();
  setTimeout(function() { go(S.page); }, 200);
}

   📌 المستودع

const MOVEMENT_TYPES = [
  { k: 'new',      i: '🆕', l: 'شراء جديد',      hasFund: true,  hasPrice: true,  sign: 1,  toFund: 'expense' },
  { k: 'in',       i: '📥', l: 'عائد للاستخدام', hasFund: false, hasPrice: false, sign: 1 },
  { k: 'out',      i: '📤', l: 'صرف للاستخدام',  hasFund: false, hasPrice: false, sign: -1 },
  { k: 'sale',     i: '💰', l: 'بيع',            hasFund: true,  hasPrice: true,  sign: -1, toFund: 'income' },
  { k: 'gift_in',  i: '🎁', l: 'هبة واردة',      hasFund: false, hasPrice: false, sign: 1,  hasParty: true },
  { k: 'gift_out', i: '🎀', l: 'هبة صادرة',      hasFund: false, hasPrice: false, sign: -1, hasParty: true },
  { k: 'damaged',  i: '💥', l: 'تلف',            hasFund: false, hasPrice: false, sign: -1 }
];

renderStore = function() {
  if (!hasPerm('store.view')) {
    $('pg-store').innerHTML = '<div class="empty"><span class="ico">🔒</span><h3>غير مصرح</h3></div>';
    return;
  }
  
  const items = S.storeItems;
  const totalQty = items.reduce((s, i) => s + (Number(i.quantity) || 0), 0);
  const lowStock = items.filter(i => Number(i.quantity) < Number(i.minQty || 5));
  const needMaintenance = items.filter(i => i.condition === 'يحتاج صيانة').length;
  
  let html = '';
  
  html += '<div class="stats-scroll">';
  html += '<div class="stat"><div class="val">' + items.length + '</div><div class="lbl">📦 أنواع</div></div>';
  html += '<div class="stat green"><div class="val">' + totalQty + '</div><div class="lbl">📊 كميات</div></div>';
  html += '<div class="stat red"><div class="val">' + lowStock.length + '</div><div class="lbl">⚠️ منخفضة</div></div>';
  html += '<div class="stat orange"><div class="val">' + needMaintenance + '</div><div class="lbl">🔧 صيانة</div></div>';
  html += '</div>';
  
  if (hasPerm('store.manage')) {
    html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">';
    html += '<button class="btn primary block" onclick="openStoreItemSheet()">➕ مادة</button>';
    html += '<button class="btn info block" onclick="openStoreMovementsList()">🔄 السجل</button>';
    html += '<button class="btn warning block" onclick="openStoreReports()">📊 تقارير</button>';
    html += '</div>';
  } else {
    html += '<button class="btn info block" style="margin-bottom:12px" onclick="openStoreMovementsList()">🔄 السجل</button>';
  }
  
  if (items.length) {
    html += '<div class="list">';
    items.forEach(function(item) {
      const qty = Number(item.quantity) || 0;
      const minQty = Number(item.minQty || 5);
      const isLow = qty === 0;
      const isWarning = qty > 0 && qty < minQty;
      const isDamaged = item.condition === 'يحتاج صيانة';
      
      let icon = '📦';
      let color = 'green';
      if (isLow) { icon = '⚠️'; color = 'red'; }
      else if (isDamaged) { icon = '🔧'; color = 'orange'; }
      else if (isWarning) { icon = '⚠️'; color = 'orange'; }
      
      html += '<div class="item" onclick="' + (hasPerm('store.manage') ? 'openStoreItemSheet(' + item.id + ')' : '') + '">';
      html += '<div class="av ' + color + '">' + icon + '</div>';
      html += '<div class="body"><div class="ttl">' + esc(item.name) + '</div>';
      html += '<div class="sub">' + qty + ' ' + esc(item.unit || '') + ' • ' + esc(item.category || '') + '</div></div>';
      html += '<div style="text-align:left;flex-shrink:0">';
      html += '<div style="font-weight:800;font-family:\'SF Mono\',monospace;font-size:14px;color:' + (isLow || isWarning ? 'var(--death)' : 'var(--text)') + '">' + qty + '</div>';
      html += '<div style="font-size:9px;color:var(--muted-2)">' + esc(item.unit || 'وحدة') + '</div></div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="empty"><span class="ico">📦</span><h3>المستودع فارغ</h3><p>أضف موادك (كراسي، شوادر، طبخ...)</p></div>';
  }
  
  $('pg-store').innerHTML = html;
};

      '<button class="btn primary" onclick="saveStoreItem(' + id + ')">💾</button>';
  
  openSheet(isNew ? '➕ مادة جديدة' : '✏️ ' + esc(item.name), html, foot, { wide: true, focus: 'stiName' });
}

async function saveStoreItem(id) {
  const name = cleanText($('stiName').value);
  if (!name) { toast('اسم المادة مطلوب', 'error'); return; }
  
  try {
    const obj = {
      name: name,
      category: $('stiCategory').value,
      unit: cleanText($('stiUnit').value) || 'قطعة',
      quantity: Number($('stiQuantity').value) || 0,
      minQty: Number($('stiMinQty').value) || 5,
      condition: $('stiCondition').value,
      notes: cleanText($('stiNotes').value)
    };
    
    if (id) {
      const old = S.storeItems.find(x => x.id === id);
      obj.id = id;
      obj.totalOwned = old ? old.totalOwned : obj.quantity;
      obj.lastPrice = old ? old.lastPrice : 0;
      obj.createdAt = old ? old.createdAt : new Date().toISOString();
      await dbPut('storeItems', obj);
      const i = S.storeItems.findIndex(x => x.id === id);
      if (i > -1) S.storeItems[i] = obj;
      toast('✅ تم التعديل');
    } else {
      obj.totalOwned = obj.quantity;
      obj.lastPrice = 0;
      obj.createdAt = new Date().toISOString();
      const newId = await dbPut('storeItems', obj);
      obj.id = newId;
      S.storeItems.push(obj);
      toast('✅ تمت الإضافة');
    }
    
    closeSheetAll();
    go(S.page);
  } catch (e) {
    toast('خطأ: ' + e.message, 'error');
  }
}

async function deleteStoreItem(id) {
  const item = S.storeItems.find(x => x.id === id);
  if (!item) return;
  if (!confirm('حذف المادة "' + item.name + '"؟\n\nسيُحذف كل سجل حركاتها.')) return;
  
  try {
    const movements = S.storeMovements.filter(m => m.itemId === id);
    for (const m of movements) {
      await dbDel('storeMovements', m.id);
    }
    S.storeMovements = S.storeMovements.filter(m => m.itemId !== id);
    
    await dbDel('storeItems', id);
    S.storeItems = S.storeItems.filter(x => x.id !== id);
    toast('🗑️ تم الحذف');
    closeSheetAll();
    go(S.page);
  } catch (e) {
    toast('خطأ', 'error');
  }
}

  const isEdit = !!movementId;

  html += '<option value="death"' + (mov && mov.fund === 'death' ? ' selected' : '') + '>⚰️ صندوق الوفاة</option>';
  html += '<option value="donation"' + (mov && mov.fund === 'donation' ? ' selected' : '') + '>💚 صندوق التبرعات</option>';

    : '<button class="btn ghost" onclick="closeSheetAll()">إلغاء</button>' +

function onStoreMovementTypeChange() {
  const type = $('stmType') ? $('stmType').value : '';
  if (!type) return;
  const meta = MOVEMENT_TYPES.find(t => t.k === type);
  if (!meta) return;
  
  const priceBox = $('stmPriceBox');
  if (priceBox) priceBox.style.display = meta.hasPrice ? 'block' : 'none';
  
  const fundBox = $('stmFundBox');
  if (fundBox) fundBox.style.display = meta.hasFund ? 'block' : 'none';
}

async function saveStoreMovement(movementId) {
  const isEdit = !!movementId;
  
  const itemId = Number($('stmItemId').value);
  const type = $('stmType').value;
  const qty = Number($('stmQty').value);
  const price = Number($('stmPrice') ? $('stmPrice').value : 0) || 0;
  const fund = $('stmFund') ? $('stmFund').value : null;
  const notes = cleanText($('stmNotes').value);
  
  if (!itemId) { toast('اختر المادة', 'error'); return; }
  if (!qty || qty <= 0) { toast('الكمية مطلوبة', 'error'); return; }
  
  const meta = MOVEMENT_TYPES.find(t => t.k === type);
  if (!meta) { toast('نوع حركة غير معروف', 'error'); return; }
  
  const item = S.storeItems.find(x => x.id === itemId);
  if (!item) { toast('المادة غير موجودة', 'error'); return; }
  
  showLoad(true);
  
  try {
    /* عكس الأثر القديم إن كان تعديل */
    let oldMovement = null;
    if (isEdit) {
      oldMovement = S.storeMovements.find(m => m.id === movementId);
      if (oldMovement) {
        const oldMeta = MOVEMENT_TYPES.find(t => t.k === oldMovement.type);
        if (oldMeta) {
          item.quantity = (Number(item.quantity) || 0) - (oldMeta.sign * oldMovement.quantity);
        }
        if (oldMovement.linkedIncomeId) {
          await dbDel('incomes', oldMovement.linkedIncomeId);
          S.incomes = S.incomes.filter(i => i.id !== oldMovement.linkedIncomeId);
        }
        if (oldMovement.linkedExpenseId) {
          await dbDel('expenses', oldMovement.linkedExpenseId);
          S.expenses = S.expenses.filter(e => e.id !== oldMovement.linkedExpenseId);
        }
      }
    }
    
    const newQty = (Number(item.quantity) || 0) + (meta.sign * qty);
    if (newQty < 0) {
      toast('الكمية غير كافية', 'error');
      showLoad(false);
      return;
    }
    
    let linkedIncomeId = null;
    let linkedExpenseId = null;
    
    /* سجّل الإيراد/المصروف */
    if (meta.toFund === 'expense' && price > 0 && fund) {
      const expObj = {
        fund: fund,
        category: 'مستودع',
        description: meta.l + ': ' + item.name + ' × ' + qty,
        amount: price,
        date: today(),
        year: S.currentYear,
        notes: notes,
        createdBy: S.currentUser.id,
        recordedByName: S.currentUser.name,
        createdAt: new Date().toISOString()
      };
      const expId = await dbPut('expenses', expObj);
      expObj.id = expId;
      S.expenses.push(expObj);
      linkedExpenseId = expId;
    }
    
    if (meta.toFund === 'income' && price > 0 && fund) {
      const incObj = {
        fund: fund,
        category: 'مستودع - بيع',
        amount: price,
        date: today(),
        year: S.currentYear,
        notes: meta.l + ': ' + item.name + ' × ' + qty + (notes ? ' • ' + notes : ''),
        recordedBy: S.currentUser.id,
        recordedByName: S.currentUser.name,
        createdAt: new Date().toISOString()
      };
      const incId = await dbPut('incomes', incObj);
      incObj.id = incId;
      S.incomes.push(incObj);
      linkedIncomeId = incId;
    }
    
    /* طبّق الكمية */
    item.quantity = newQty;
    if (type === 'new' && price > 0) {
      item.lastPrice = qty > 0 ? Math.round(price / qty) : 0;
      item.totalOwned = (Number(item.totalOwned) || 0) + qty;
    } else if (type === 'new') {
      item.totalOwned = (Number(item.totalOwned) || 0) + qty;
    }
    await dbPut('storeItems', item);
    
    const movement = {
      itemId: itemId,
      itemName: item.name,
      type: type,
      quantity: qty,
      price: price,
      fund: fund,
      notes: notes,
      oldQuantity: isEdit && oldMovement ? oldMovement.oldQuantity : (newQty - meta.sign * qty),
      newQuantity: newQty,
      linkedIncomeId: linkedIncomeId,
      linkedExpenseId: linkedExpenseId,
      userName: S.currentUser.name,
      date: today(),
      createdAt: isEdit && oldMovement ? oldMovement.createdAt : new Date().toISOString()
    };
    
    if (isEdit) {
      movement.id = movementId;
      await dbPut('storeMovements', movement);
      const i = S.storeMovements.findIndex(m => m.id === movementId);
      if (i > -1) S.storeMovements[i] = movement;
    } else {
      const id = await dbPut('storeMovements', movement);
      movement.id = id;
      S.storeMovements.push(movement);
    }
    
    CACHE.invalidateAll();
    await logAudit(isEdit ? 'update' : 'add', 'storeMovement', movement.id, { type, qty, price });
    
    toast(isEdit ? '✅ تم التعديل' : '✅ تم التسجيل', 'success', 2500);
    closeSheetAll();
    go(S.page);
  } catch (e) {
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
  
  showLoad(false);
}

async function deleteStoreMovement(movementId) {
  const mov = S.storeMovements.find(m => m.id === movementId);
  if (!mov) return;
  
  if (!confirm('⚠️ حذف هذه الحركة؟\n\nسيُعكس الأثر على المخزون والمالية.')) return;
  
  showLoad(true);
  
  try {
    const item = S.storeItems.find(x => x.id === mov.itemId);
    const meta = MOVEMENT_TYPES.find(t => t.k === mov.type);
    
    if (item && meta) {
      item.quantity = (Number(item.quantity) || 0) - (meta.sign * mov.quantity);
      await dbPut('storeItems', item);
    }
    
    if (mov.linkedIncomeId) {
      await dbDel('incomes', mov.linkedIncomeId);
      S.incomes = S.incomes.filter(i => i.id !== mov.linkedIncomeId);
    }
    if (mov.linkedExpenseId) {
      await dbDel('expenses', mov.linkedExpenseId);
      S.expenses = S.expenses.filter(e => e.id !== mov.linkedExpenseId);
    }
    
    await dbDel('storeMovements', movementId);
    S.storeMovements = S.storeMovements.filter(m => m.id !== movementId);
    
    CACHE.invalidateAll();
    toast('🗑️ تم الحذف');
    closeSheetAll();
    go(S.page);
  } catch (e) {
    toast('خطأ', 'error');
  }
  
  showLoad(false);
}

function openStoreMovementsList() {
  const list = S.storeMovements.slice()
    .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''))
    .slice(0, 300);
  
  const typeIcons = {};
  const typeNames = {};
  MOVEMENT_TYPES.forEach(t => { typeIcons[t.k] = t.i; typeNames[t.k] = t.l; });
  
  let html = '';
  if (list.length) {
    html = '<div class="list">';
    list.forEach(function(m) {
      const isPositive = (m.type === 'new' || m.type === 'in' || m.type === 'gift_in');
      html += '<div class="item" onclick="closeSheet();setTimeout(function(){openStoreMovementSheet(null, ' + m.id + ')}, 150)">';
      html += '<div class="av ' + (isPositive ? 'green' : 'red') + '">' + (typeIcons[m.type] || '📦') + '</div>';
      html += '<div class="body"><div class="ttl">' + esc(m.itemName) + ' — ' + (typeNames[m.type] || m.type) + '</div>';
      html += '<div class="sub">' + fmtDate(m.date) + ' • ' + esc(m.userName || '') + (m.price > 0 ? ' • 💰 ' + fmtNum(m.price) : '') + '</div></div>';
      html += '<div style="text-align:left;flex-shrink:0">';
      html += '<div style="font-weight:800;color:' + (isPositive ? 'var(--success)' : 'var(--death)') + ';font-size:13px">' + (isPositive ? '+' : '-') + m.quantity + '</div>';
      html += '</div></div>';
    });

/**
 * جلب المرؤوسين لعضو (من يدفع عنهم)
 */
function getDependentsOf(memberId) {
  const member = S.members.find(m => m.id === memberId);
  if (!member || !member.dependentsIds || !member.dependentsIds.length) return [];
  return S.members.filter(m => member.dependentsIds.indexOf(m.id) > -1);
}

/**
 * جلب الدافع لعضو (من يدفع عنه)
 */
function getPayerOf(memberId) {
  const member = S.members.find(m => m.id === memberId);
  if (!member || !member.payerId) return null;
  return S.members.find(m => m.id === member.payerId) || null;
}

/**
 * فحص إن كان العضو "دافعاً" (يدفع عن آخرين)
 */
function isPayer(memberId) {
  const member = S.members.find(m => m.id === memberId);
  return member && member.dependentsIds && member.dependentsIds.length > 0;
}

/**
 * مجموع مستحقات الدافع (له + مرؤوسيه)
 */
function getPayerGroupTotal(memberId) {
  const payer = S.members.find(m => m.id === memberId);
  if (!payer) return null;
  
  const dependents = getDependentsOf(memberId);
  const all = [payer].concat(dependents);
  
  let totalDue = 0, totalPaid = 0, totalRem = 0;
  const perMember = [];
  
  all.forEach(function(m) {
    const w = computeMemberWallet(m.id);
    const due = w ? w.summary.totalDue : 0;
    const paid = w ? w.summary.totalPaid : 0;
    const rem = Math.max(0, due - paid);
    
    totalDue += due;
    totalPaid += paid;
    totalRem += rem;
    
    perMember.push({
      member: m,
      due: due,
      paid: paid,
      rem: rem,
      isPayer: m.id === memberId
    });
  });
  
  return {
    payer: payer,
    dependents: dependents,
    all: all,
    totalDue: totalDue,
    totalPaid: totalPaid,
    totalRem: totalRem,
    perMember: perMember
  };
}

async function setPayer(memberId, payerId) {
  const m = S.members.find(x => x.id === memberId);
  const payer = S.members.find(x => x.id === payerId);
  if (!m || !payer) return;
  
  if (!confirm('تعيين "' + payer.name + '" كدافع عن "' + m.name + '"؟')) return;
  
  try {
    /* حدّث العضو */
    m.payerId = payerId;
    await dbPut('members', m);
    const i = S.members.findIndex(x => x.id === memberId);
    if (i > -1) S.members[i] = m;
    
    /* حدّث الدافع */
    if (!payer.dependentsIds) payer.dependentsIds = [];
    if (payer.dependentsIds.indexOf(memberId) === -1) {
      payer.dependentsIds.push(memberId);
    }
    await dbPut('members', payer);
    const j = S.members.findIndex(x => x.id === payerId);
    if (j > -1) S.members[j] = payer;
    
    CACHE.invalidateAll();
    await logAudit('update', 'link', memberId, { payerId: payerId });
    
    toast('✅ تم التعيين');
    closeSheetAll();
    setTimeout(function() { openLinkManagerSheet(memberId); }, 200);
  } catch (e) {
    toast('خطأ: ' + e.message, 'error');
  }
}

async function unlinkPayer(memberId) {
  const m = S.members.find(x => x.id === memberId);
  if (!m || !m.payerId) return;
  
  if (!confirm('إزالة الدافع؟')) return;
  
  const payerId = m.payerId;
  const payer = S.members.find(x => x.id === payerId);
  
  try {
    delete m.payerId;
    await dbPut('members', m);

  const group = getPayerGroupTotal(payerId);
  if (!group) return;
  
  const batchId = 'batch_' + Date.now();
  const createdPayments = [];
  
  showLoad(true);
  
  try {
    let remaining = amount;
    
    /* رتّب حسب الأقدم */
    const sortedMembers = group.all.slice().sort(function(a, b) {
      const wa = computeMemberWallet(a.id);
      const wb = computeMemberWallet(b.id);
      const ra = wa ? Math.max(0, wa.summary.totalBalance) : 0;
      const rb = wb ? Math.max(0, wb.summary.totalBalance) : 0;
      return rb - ra;
    });
    
    for (const m of sortedMembers) {
      if (remaining <= 0) break;
      
      const w = computeMemberWallet(m.id);
      if (!w) continue;
      
      /* وزّع على الجمعية والوفاة */
      const fundsToPay = [];
      if (w.funds.assoc.balance > 0) fundsToPay.push({ fund: 'assoc', amount: w.funds.assoc.balance });
      if (w.funds.death.balance > 0) fundsToPay.push({ fund: 'death', amount: w.funds.death.balance });
      
      /* وفاة أولاً (عاجل) */
      fundsToPay.sort(function(a, b) {
        if (a.fund === 'death') return -1;
        if (b.fund === 'death') return 1;
        return 0;
      });
      
      for (const f of fundsToPay) {
        if (remaining <= 0) break;
        
        const toPay = Math.min(remaining, f.amount);
        
        /* السنة: الأقدم أولاً */
        let forYear = S.currentYear;
        const yearsWithDue = [];
        for (const [yStr, data] of Object.entries(w.funds[f.fund].years || {})) {
          const y = Number(yStr);
          const rem = data.due - data.paid;
          if (rem > 0) yearsWithDue.push({ year: y });
        }
        if (yearsWithDue.length) {
          yearsWithDue.sort((a, b) => a.year - b.year);
          forYear = yearsWithDue[0].year;
        }
        
        const payment = {
          memberId: m.id,
          fund: f.fund,
          amount: toPay,
          date: today(),
          year: forYear,
          forYear: forYear,
          notes: notes || 'دفعة موحّدة',
          collectorId: S.currentUser.id,
          collectorName: S.currentUser.name,
          batchId: batchId,
          payerId: payerId,
          createdAt: new Date().toISOString()
        };
        
        const id = await dbPut('payments', payment);
        payment.id = id;
        S.payments.push(payment);
        createdPayments.push(payment);
        
        remaining -= toPay;
      }
    }
    
    CACHE.invalidateAll();
    await logAudit('add', 'payment_unified', batchId, {
      payerId: payerId,
      totalAmount: amount,
      paymentsCount: createdPayments.length,
      remaining: remaining
    });
    
    toast('✅ تم تسجيل ' + createdPayments.length + ' دفعة', 'success', 3000);
    closeSheetAll();
    go(S.page);
    
  } catch (e) {
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
  
  showLoad(false);
}

function buildAnnualReport(year) {
  const y = year || S.currentYear;
  const opening = getOpeningBalance();
  const sum = arr => arr.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  
  const assocYearly = getFundYearsLocal('assoc').years.find(v => v.year === y) || { collected: 0, incomes: 0, expenses: 0, net: 0, cumulative: opening.assoc || 0 };
  const deathYearly = getFundYearsLocal('death').years.find(v => v.year === y) || { collected: 0, incomes: 0, expenses: 0, compensations: 0, net: 0, cumulative: opening.death || 0 };
  const donationYearly = getFundYearsLocal('donation').years.find(v => v.year === y) || { collected: 0, incomes: 0, expenses: 0, net: 0, cumulative: opening.donation || 0 };
  
  const deathsThisYear = S.deaths.filter(d => Number(d.year) === y);
  
  return {
    year: y,
    opening: {
      assoc: opening.assoc || 0,
      death: opening.death || 0,
      donation: opening.donation || 0
    },
    assoc: assocYearly,
    death: deathYearly,
    donation: donationYearly,
    deaths: {
      count: deathsThisYear.length,
      totalComp: deathsThisYear.reduce((s, d) => s + (Number(d.compensation) || 0), 0),
      list: deathsThisYear
    }
  };
}

function setPayReportFilter(key, value) {
  window._payReportFilters[key] = value;
  openPaymentsReportSheet();
}

function buildPaymentsReportData() {
  const f = window._payReportFilters;
  const y = f.year;
  
  const memberPayments = {};
  
  S.payments.forEach(function(p) {
    const py = Number(p.forYear) || Number(p.year);
    if (py !== y) return;
    if (f.fund !== 'all' && p.fund !== f.fund) return;
    if (!p.memberId) return;
    
    if (!memberPayments[p.memberId]) {
      memberPayments[p.memberId] = {
        memberId: p.memberId,
        total: 0, count: 0,
        byFund: { assoc: 0, death: 0, donation: 0 },
        byCollector: {}
      };
    }
    
    const amount = Number(p.amount) || 0;
    memberPayments[p.memberId].total += amount;
    memberPayments[p.memberId].count++;
    memberPayments[p.memberId].byFund[p.fund] += amount;
    
    const cKey = p.collectorName || 'غير محدد';
    if (!memberPayments[p.memberId].byCollector[cKey]) {
      memberPayments[p.memberId].byCollector[cKey] = 0;
    }
    memberPayments[p.memberId].byCollector[cKey] += amount;
  });
  
  let allMembers = S.members.filter(function(m) {
    const st = m.memberStatus || 'نشط';
    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return false;
    if (f.fund === 'assoc') return m.assocStartYear;
    if (f.fund === 'death') return m.deathStartYear;
    return m.assocStartYear || m.deathStartYear;
  });
  
  let list = allMembers.map(function(m) {
    const p = memberPayments[m.id];
    return {
      member: m,
      total: p ? p.total : 0,
      count: p ? p.count : 0,
      byFund: p ? p.byFund : { assoc: 0, death: 0, donation: 0 },
      byCollector: p ? p.byCollector : {}
    };
  });
  
  if (f.mode === 'paid') list = list.filter(x => x.total > 0);
  else if (f.mode === 'unpaid') list = list.filter(x => x.total === 0);
  
  list.sort((a, b) => b.total - a.total);
  return list;
}

function renderPayReportContent() {
  const container = $('payReportContent');
  if (!container) return;
  
  const f = window._payReportFilters;
  const list = buildPaymentsReportData();
  
  const totalSum = list.reduce((s, x) => s + x.total, 0);
  const paidCount = list.filter(x => x.total > 0).length;
  const unpaidCount = list.filter(x => x.total === 0).length;
  
  let html = '';
  
  html += '<div style="padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:14px;margin-bottom:12px;text-align:center">';

  if (unpaidCount > 0) html += '<span>⏳ ' + unpaidCount + ' لم يدفعوا</span>';

  if (!list.length) {

    return;
  }
  
  html += '<div style="background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border)">';
  
  list.forEach(function(x, i) {
    const m = x.member;
    
    const collectorParts = [];
    Object.keys(x.byCollector).forEach(function(k) {
      collectorParts.push(k + ': ' + fmtShort(x.byCollector[k]));

    html += '<div style="padding:11px 12px;border-bottom:1px solid var(--border-2);display:flex;justify-content:space-between;gap:8px">';

    html += '<div style="font-size:10px;color:var(--muted-2);margin-top:2px;font-family:\'SF Mono\',monospace">' + esc(m.code || '') + ' • ' + esc(m.sector || '') + '</div>';
    if (collectorParts.length) {
      html += '<div style="font-size:10px;color:var(--primary);margin-top:4px">👤 ' + collectorParts.join(' • ') + '</div>';
    }
    html += '</div>';
    html += '<div style="text-align:left;flex-shrink:0">';
    if (x.total > 0) {
      html += '<div style="font-weight:800;color:var(--success);font-family:\'SF Mono\',monospace;font-size:13px">' + fmtNum(x.total) + '</div>';

    }
    html += '</div></div>';
  });
  
  html += '</div>';
  container.innerHTML = html;
}

function setAdvFilter(key, value) {
  window._advReportFilters[key] = value;
  openAdvancedReportSheet();
}

function buildAdvancedReportData() {
  const f = window._advReportFilters;
  const y = f.year;
  
  let list = S.members.filter(function(m) {
    const st = m.memberStatus || 'نشط';
    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return false;
    if (f.sector !== 'all' && m.sector !== f.sector) return false;
    if (f.fund === 'assoc' && !m.assocStartYear) return false;
    if (f.fund === 'death' && !m.deathStartYear) return false;
    if (f.fund === 'both') return m.assocStartYear && m.deathStartYear;
    return m.assocStartYear || m.deathStartYear;
  });
  
  list = list.map(function(m) {
    const w = computeMemberWallet(m.id);
    if (!w) return null;
    const yr = w.years.find(v => v.year === y);
    if (!yr) return null;
    
    let req = 0, paid = 0;
    if (f.fund === 'assoc') { req = yr.assoc.due; paid = yr.assoc.paid; }
    else if (f.fund === 'death') { req = yr.death.due; paid = yr.death.paid; }
    else { req = yr.total.due; paid = yr.total.paid; }
    
    const rem = req - paid;
    
    let status = 'unpaid';
    if (paid > 0 && rem > 0) status = 'partial';
    else if (paid > 0 && rem <= 0) status = 'paid';
    else if (req === 0) status = 'noreq';
    
    return { member: m, req, paid, rem, status };
  }).filter(x => x !== null);
  
  if (f.status === 'unpaid') list = list.filter(x => x.paid === 0 && x.req > 0);
  else if (f.status === 'partial') list = list.filter(x => x.paid > 0 && x.rem > 0);
  else if (f.status === 'paid') list = list.filter(x => x.paid > 0 && x.rem <= 0);
  
  list.sort((a, b) => b.rem - a.rem);
  return list;
}

function openUsersSheet() {
  if (!hasPerm('admin.users')) { toast('غير مصرح', 'error'); return; }
  
  let html = '';
  
  /* زر الإضافة */
  html += '<button class="btn primary block lg" style="margin-bottom:12px" onclick="closeSheet();setTimeout(function(){openEditUserSheet()},150)">➕ إضافة مستخدم</button>';
  
  /* قائمة المستخدمين */
  html += '<div class="list">';
  S.users.forEach(function(u) {
    const role = getRoleByKey(u.role) || { name: 'مستخدم', icon: '👤' };
    const isMe = S.currentUser && S.currentUser.id === u.id;
    
    let extra = '';
    if (u.sector) extra += ' • 📍 ' + u.sector;
    if (u.collectFund) {
      const f = u.collectFund === 'assoc' ? '💰' : u.collectFund === 'death' ? '⚰️' : '💰⚰️';
      extra += ' • ' + f;
    }
    
    html += '<div class="item" style="cursor:default">';
    html += '<div class="av">' + role.icon + '</div>';
    html += '<div class="body"><div class="ttl">' + esc(u.name) + (isMe ? ' <span class="badge primary">أنت</span>' : '') + '</div>';
    html += '<div class="sub">' + role.name + (u.phone ? ' • ' + esc(u.phone) : '') + extra + '</div></div>';
    
    if (S.currentRole && S.currentRole.key === 'manager' && !isMe) {
      html += '<button class="btn info sm" onclick="closeSheet();setTimeout(function(){impersonateUser(' + u.id + ')},150)">🔑</button>';
    }
    html += '<button class="btn ghost sm" onclick="closeSheet();setTimeout(function(){openEditUserSheet(' + u.id + ')},150)">✏️</button>';
    
    /* لا يمكن حذف آخر مدير */
    const canDelete = !isMe && !(u.role === 'manager' && S.users.filter(x => x.role === 'manager').length <= 1);
    if (canDelete) {
      html += '<button class="btn danger sm" onclick="deleteUser(' + u.id + ')">🗑️</button>';
    }
    html += '</div>';
  });
  html += '</div>';
  
  openSheet('👥 المستخدمون', html, '<button class="btn ghost" onclick="closeSheetAll()">إغلاق</button>', { wide: true });
}

  html += '<option value="both"' + (!u.collectFund || u.collectFund === 'both' ? ' selected' : '') + '>كلاهما</option>';

  html += '<input id="uPin" type="tel" maxlength="4" inputmode="numeric" placeholder="' + (u.hasPin ? 'اتركها للإبقاء' : '••••') + '">';
  html += '<div class="fld-hint">' + (u.hasPin ? '🔒 لديه PIN' : '🔓 بدون PIN') + '</div></div>';

    ? '<button class="btn ghost" onclick="closeSheetAll()">إلغاء</button><button class="btn primary" onclick="saveUser()">💾</button>'
    : '<button class="btn ghost" onclick="closeSheetAll()">إلغاء</button><button class="btn primary" onclick="saveUser(' + id + ')">💾</button>';
  
  openSheet(isNew ? '➕ مستخدم جديد' : '✏️ ' + esc(u.name), html, foot, { wide: true, focus: 'uName' });

function toggleUserRoleFields() {
  const roleKey = $('uRole') ? $('uRole').value : '';
  const role = getRoleByKey(roleKey);
  const collectorFields = $('collectorFields');
  if (collectorFields) {
    collectorFields.style.display = (role && role.canCollect) ? 'block' : 'none';
  }
}

async function saveUser(id) {
  if (!hasPerm('admin.users')) { toast('غير مصرح', 'error'); return; }
  
  const name = cleanText($('uName').value);
  const pin = $('uPin').value.trim();
  
  if (!name) { toast('الاسم مطلوب', 'error'); return; }
  if (pin && !/^\d{4}$/.test(pin)) { toast('كلمة المرور: 4 أرقام', 'error'); return; }
  
  const role = $('uRole').value;
  const collectFund = role === 'collector' || role === 'assocTreasurer' || role === 'deathTreasurer'
    ? ($('uCollectFund') ? $('uCollectFund').value : null)
    : null;
  const sector = $('uSector') ? $('uSector').value : '';
  
  try {
    const old = id ? await dbGet('users', id) : null;
    const obj = {
      name: name,
      phone: cleanPhone($('uPhone').value),
      role: role,
      collectFund: collectFund,
      sector: sector,
      hasPin: pin ? true : (old ? old.hasPin : false),
      pinHash: pin ? await hashPin(pin) : (old ? old.pinHash : null),
      createdAt: old ? old.createdAt : new Date().toISOString()
    };
    
    if (id) {
      obj.id = id;
      await dbPut('users', obj);
      const i = S.users.findIndex(x => x.id === id);
      if (i > -1) S.users[i] = obj;
      if (S.currentUser && S.currentUser.id === id) {
        S.currentUser = obj;
        S.currentRole = getRoleByKey(role);
      }
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('users', obj);
      obj.id = newId;
      S.users.push(obj);
      toast('✅ تمت الإضافة');
    }
    
    await logAudit(id ? 'update' : 'add', 'user', obj.id, { name: name, role: role });
    closeSheetAll();
    go(S.page);
  } catch (e) {
    toast('خطأ: ' + e.message, 'error');
  }
}

async function deleteUser(id) {
  if (!hasPerm('admin.users')) { toast('غير مصرح', 'error'); return; }
  
  const u = S.users.find(x => x.id === id);
  if (!u) return;
  
  /* لا يمكن حذف آخر مدير */
  if (u.role === 'manager' && S.users.filter(x => x.role === 'manager').length <= 1) {
    toast('لا يمكن حذف آخر مدير', 'error');
    return;
  }
  
  if (!confirm('حذف المستخدم "' + u.name + '"؟')) return;
  
  try {
    await dbDel('users', id);
    S.users = S.users.filter(x => x.id !== id);
    await logAudit('delete', 'user', id, { name: u.name });
    toast('🗑️ تم الحذف');
    closeSheetAll();
    go(S.page);
  } catch (e) {
    toast('خطأ', 'error');
  }
}

/* ═══ الدخول بحساب آخر (للمدير) ═══ */
function impersonateUser(userId) {
  if (!S.currentRole || S.currentRole.key !== 'manager') {
    toast('هذه الميزة للمدير فقط', 'error');
    return;
  }
  
  const target = S.users.find(u => u.id === userId);
  if (!target) { toast('المستخدم غير موجود', 'error'); return; }
  
  if (!confirm('🔑 الدخول بحساب "' + target.name + '"؟')) return;
  
  localStorage.setItem('zt_impersonator', JSON.stringify({
    id: S.currentUser.id,
    name: S.currentUser.name,
    role: S.currentUser.role
  }));
  
  S.currentUser = target;
  S.currentRole = getRoleByKey(target.role);
  localStorage.setItem('zt_user', JSON.stringify({
    id: target.id, name: target.name, role: target.role
  }));
  
  closeSheetAll();
  toast('🔑 أنت الآن "' + target.name + '"', 'info', 3000);
  setTimeout(showMain, 200);
}

async function saveConstant(year) {
  try {
    const obj = {
      year: year,
      assocYearly: Number($('cAssocY').value) || 0,
      assocYearlyReduced: Number($('cAssocYR').value) || 0,
      deathInstallment: Number($('cDeathInst').value) || 0,
      deathCompensation: Number($('cDeathComp').value) || 0,
      joinAssocFee: Number($('cJoinA').value) || 0,
      joinAssocFeeReduced: Number($('cJoinAR').value) || 0,
      joinDeathFee: Number($('cJoinD').value) || 0,
      joinDeathFeeReduced: Number($('cJoinDR').value) || 0
    };
    
    const existing = S.constants.find(x => x.year === year);
    if (existing) {
      obj.id = existing.id;
      await dbPut('constants', obj);
      const i = S.constants.findIndex(x => x.year === year);
      if (i > -1) S.constants[i] = obj;
    } else {
      const newId = await dbPut('constants', obj);
      obj.id = newId;
      S.constants.push(obj);
    }
    
    CACHE.invalidateAll();
    await logAudit('update', 'constant', year, obj);
    toast('✅ تم الحفظ');
    closeSheetAll();
    go(S.page);
  } catch (e) {
    toast('خطأ', 'error');
  }
}

async function confirmCloseYear(year) {
  const confirm = $('closeYearConfirm').value.trim();
  if (confirm !== String(year)) {
    toast('أدخل "' + year + '" للتأكيد', 'error');
    return;
  }
  
  if (!confirm || !window.confirm('⚠️ تأكيد أخير! سيتم إغلاق سنة ' + year + ' نهائياً.')) return;
  
  showLoad(true);
  
  try {
    /* حفظ السنة الحالية */
    const closingData = {
      year: year,
      closedAt: new Date().toISOString(),
      closedBy: S.currentUser.name,
      balances: {
        assoc: getFundActual('assoc').balance,
        death: getFundActual('death').balance,
        donation: getFundActual('donation').balance
      },
      stats: getMembersStats(year)
    };
    
    /* حفظ في settings */
    let closedYears = [];
    const setting = S.settings.find(s => s.key === 'closedYears');
    if (setting) {
      closedYears = setting.value || [];
    }
    
    if (closedYears.indexOf(year) === -1) {
      closedYears.push(year);
    }
    
    if (setting) {
      setting.value = closedYears;
      await dbPut('settings', setting);
    } else {
      const newSetting = { key: 'closedYears', value: closedYears };
      const id = await dbPut('settings', newSetting);
      newSetting.id = id;
      S.settings.push(newSetting);
    }
    
    /* سجل الإغلاق */
    const logSetting = { key: 'yearClose_' + year, value: closingData };
    const logId = await dbPut('settings', logSetting);
    logSetting.id = logId;
    S.settings.push(logSetting);
    
    await logAudit('closeYear', 'year', year, closingData);
    
    /* الانتقال للسنة التالية */
    S.currentYear = year + 1;
    localStorage.setItem('zt_year', S.currentYear);
    S.filters.payYear = S.currentYear;
    
    toast('✅ تم إغلاق سنة ' + year + ' — السنة الحالية: ' + S.currentYear, 'success', 4000);
    closeSheetAll();
    setTimeout(function() { location.reload(); }, 800);
    
  } catch (e) {
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
  
  showLoad(false);
}

function getUserCustodyForYear(userId, year) {
  const user = S.users.find(u => u.id === userId);
  if (!user) return null;
  
  const userName = normAr(user.name);
  const matchName = name => {
    if (!name || !userName) return false;
    const n = normAr(name);
    return n === userName || n.indexOf(userName) > -1 || userName.indexOf(n) > -1;
  };
  
  const payments = S.payments.filter(p => {
    const py = Number(p.forYear) || Number(p.year);
    if (py !== year) return false;
    return p.collectorId === userId || (!p.collectorId && matchName(p.collectorName));
  });
  
  const deliveries = S.deliveries.filter(d => {
    if (!d.date) return false;
    const dy = new Date(d.date).getFullYear();
    if (dy !== year) return false;
    return d.fromUserId === userId || (!d.fromUserId && matchName(d.fromUserName));
  });
  
  const sum = arr => arr.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  
  const byFund = fund => {
    const p = sum(payments.filter(x => x.fund === fund));
    const d = sum(deliveries.filter(x => x.fund === fund && x.receivedAt));
    const pd = sum(deliveries.filter(x => x.fund === fund && !x.receivedAt && !x.rejectedAt));
    return { collected: p, delivered: d, pending: pd };
  };
  
  const assoc = byFund('assoc');
  const death = byFund('death');
  const donation = byFund('donation');
  
  return {
    year: year,
    assoc, death, donation,
    total: {
      collected: assoc.collected + death.collected + donation.collected,
      delivered: assoc.delivered + death.delivered + donation.delivered,
      pending: assoc.pending + death.pending + donation.pending
    }
  };
}

renderInOut = function() {

        html += '<div class="av green">📥</div>';
        html += '<div class="body"><div class="ttl">' + esc(i.notes || i.category || 'إيراد') + '</div>';

    if (expenses.length) {

async function saveIncomeNew(id) {
  const amount = Number($('iAmount').value);
  if (!amount || amount <= 0) { toast('المبلغ مطلوب', 'error'); return; }
  
  try {
    const old = id ? await dbGet('incomes', id) : null;
    const obj = {
      fund: $('iFund').value,
      category: $('iCategory').value,
      amount: amount,
      date: $('iDate').value,
      year: Number($('iYear').value),
      notes: cleanText($('iNotes').value),
      recordedBy: (old && old.recordedBy) || S.currentUser.id,
      recordedByName: (old && old.recordedByName) || S.currentUser.name,
      createdAt: (old && old.createdAt) || new Date().toISOString()
    };
    
    if (id) {
      obj.id = id;
      await dbPut('incomes', obj);
      const i = S.incomes.findIndex(x => x.id === id);
      if (i > -1) S.incomes[i] = obj;
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('incomes', obj);
      obj.id = newId;
      S.incomes.push(obj);
      toast('✅ تم التسجيل');
    }
    
    CACHE.invalidateAll();
    await logAudit(id ? 'update' : 'add', 'income', obj.id, { fund: obj.fund, amount });
    closeSheetAll();
    go(S.page);
  } catch (e) {
    toast('خطأ: ' + e.message, 'error');
  }
}

async function deleteIncomeRecord(id) {
  if (!confirm('حذف الإيراد؟')) return;
  try {
    await dbDel('incomes', id);
    S.incomes = S.incomes.filter(x => x.id !== id);
    CACHE.invalidateAll();
    toast('🗑️');
    closeSheetAll();
    go(S.page);
  } catch (e) {
    toast('خطأ', 'error');
  }
}

renderLate = function() {
  const role = S.currentRole;
  const user = S.currentUser;
  const mySector = user.sector;
  const isManager = role.key === 'manager' || role.key === 'president';
  
  let list = S.members.filter(function(m) {
    const st = m.memberStatus || 'نشط';
    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return false;
    if (!isManager && mySector && m.sector !== mySector) return false;
    return true;
  }).map(function(m) {
    const w = computeMemberWallet(m.id);
    return { m, rem: w ? Math.max(0, w.summary.totalBalance) : 0 };
  }).filter(x => x.rem > 0);
  
  list.sort((a, b) => b.rem - a.rem);
  
  const total = list.reduce((s, x) => s + x.rem, 0);
  
  let html = '';
  html += '<div style="padding:20px;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border-radius:20px;margin-bottom:14px;text-align:center">';
  html += '<div style="font-size:12px;opacity:.9;font-weight:700">⚠️ إجمالي المتأخرات</div>';
  html += '<div style="font-size:34px;font-weight:800;margin-top:4px;font-family:\'SF Mono\',monospace">' + fmtNum(total) + '</div>';
  html += '<div style="font-size:12px;opacity:.85;margin-top:2px">عدد: ' + list.length + ' عضو</div></div>';
  
  if (list.length) {
    html += '<button class="btn success block" style="margin-bottom:12px" onclick="shareLatePayersWA()">📱 إرسال قائمة</button>';
    html += '<div class="list">';
    list.forEach(function(x) {
      html += '<div class="item" onclick="openMemberDetail(' + x.m.id + ')">';
      html += '<div class="av red">⚠️</div>';

function shareLatePayersWA() {
  const role = S.currentRole;
  const user = S.currentUser;
  const mySector = user.sector;
  const isManager = role.key === 'manager' || role.key === 'president';
  
  let list = S.members.filter(function(m) {
    const st = m.memberStatus || 'نشط';
    if (st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return false;
    if (!isManager && mySector && m.sector !== mySector) return false;
    return true;
  }).map(function(m) {
    const w = computeMemberWallet(m.id);
    return { name: m.name, code: m.code || '', sector: m.sector || '', rem: w ? Math.max(0, w.summary.totalBalance) : 0 };
  }).filter(x => x.rem > 0).sort((a, b) => b.rem - a.rem);
  
  if (!list.length) { toast('لا يوجد متأخرون', 'success'); return; }
  
  let txt = '⚠️ *قائمة المتأخرين — ' + S.currentYear + '*\nعدد: ' + list.length + '\n\n';
  list.slice(0, 40).forEach(function(p, i) {
    txt += (i + 1) + '. ' + p.name;
    if (p.sector) txt += ' (' + p.sector + ')';
    txt += ' — ' + fmtNum(p.rem) + '\n';
  });
  if (list.length > 40) txt += '\n_... + ' + (list.length - 40) + '_\n';
  txt += '\n_صندوق زعورة_';
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
}

renderNotifications = function() {
  const y = S.currentYear;
  const stats = getMembersStats(y);
  const user = S.currentUser;
  
  let notifs = [];
  
  /* متأخرون */
  if (stats.late > 0) {
    notifs.push({
      icon: '⚠️', title: stats.late + ' عضو متأخر',
      desc: 'إجمالي: ' + fmtNum(stats.lateTotal) + ' ل.س',
      action: function() { go('pg-late'); }
    });
  }
  
  /* تسليمات معلقة (للأمناء) */
  if (hasPerm('deliveries.receive')) {
    const pending = S.deliveries.filter(d => !d.receivedAt && !d.rejectedAt);
    if (pending.length > 0) {
      const total = pending.reduce((s, d) => s + (Number(d.amount) || 0), 0);
      notifs.push({
        icon: '⏳', title: pending.length + ' تسليم معلّق',
        desc: 'إجمالي: ' + fmtNum(total) + ' ل.س',
        action: function() { go('pg-inbox'); }
      });
    }
  }
  
  /* عهدتي (للمحصّلين) */
  const custody = getUserCustody(user.id);
  if (custody.all.balance > 0) {
    notifs.push({
      icon: '💼', title: 'لديك عهدة',
      desc: fmtNum(custody.all.balance) + ' ل.س — يُنصح بالتسليم',
      action: function() { go('pg-my-deliveries'); }
    });
  }
  
  /* وفيات هذا الشهر */
  const now = new Date();
  const monthDeaths = S.deaths.filter(d => {
    if (!d.deathDate) return false;
    const dd = new Date(d.deathDate);
    return dd.getMonth() === now.getMonth() && dd.getFullYear() === now.getFullYear();
  });
  if (monthDeaths.length > 0) {
    notifs.push({
      icon: '⚰️', title: monthDeaths.length + ' وفاة هذا الشهر',
      desc: monthDeaths.slice(0, 2).map(d => d.deceasedName).join('، '),
      action: function() { go('pg-deaths'); }
    });
  }
  
  let html = '';
  if (notifs.length) {
    html += '<div style="display:grid;gap:8px">';
    notifs.forEach(function(n, i) {
      html += '<div class="card" onclick="notifAction(' + i + ')" style="cursor:pointer;display:flex;align-items:center;gap:12px;margin-bottom:0">';
      html += '<div style="font-size:32px">' + n.icon + '</div>';
      html += '<div style="flex:1"><div style="font-weight:800;font-size:14px">' + esc(n.title) + '</div>';
      html += '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + esc(n.desc) + '</div></div>';
      html += '<div style="font-size:20px;color:var(--muted-2)">›</div></div>';
    });
    html += '</div>';
  } else {
    html = '<div class="empty"><span class="ico">✅</span><h3>لا توجد تنبيهات</h3><p>كل شيء تحت السيطرة</p></div>';
  }
  
  $('pg-notifications').innerHTML = html;
  window._currentNotifs = notifs;
};

function notifAction(i) {
  if (window._currentNotifs && window._currentNotifs[i] && window._currentNotifs[i].action) {
    window._currentNotifs[i].action();
  }
}

async function saveMeeting(id) {
  const title = cleanText($('mtTitle').value);
  if (!title) { toast('العنوان مطلوب', 'error'); return; }
  
  try {
    const decisionsText = $('mtDecisions').value.trim();
    const oldMeeting = id ? S.meetings.find(x => x.id === id) : null;
    
    const lines = decisionsText.split('\n').map(l => l.trim()).filter(l => l);
    const decisionsList = lines.map(function(line, i) {
      const existing = (oldMeeting && oldMeeting.decisionsList || []).find(d => d.text === line);
      return existing || {
        id: 'd_' + Date.now() + '_' + i,
        text: line,
        status: 'قيد التنفيذ',
        createdAt: new Date().toISOString()
      };
    });
    
    const obj = {
      title: title,
      type: $('mtType').value,
      date: $('mtDate').value,
      location: cleanText($('mtLocation').value),
      attendeesCount: Number($('mtAttendees').value) || 0,
      agenda: cleanText($('mtAgenda').value),
      decisions: decisionsText,
      decisionsList: decisionsList
    };
    
    if (id) {
      obj.id = id;
      obj.createdAt = oldMeeting ? oldMeeting.createdAt : new Date().toISOString();
      await dbPut('meetings', obj);
      const i = S.meetings.findIndex(x => x.id === id);
      if (i > -1) S.meetings[i] = obj;
      toast('✅ تم التعديل');
    } else {
      obj.createdAt = new Date().toISOString();
      const newId = await dbPut('meetings', obj);
      obj.id = newId;
      S.meetings.push(obj);
      toast('✅ تم التسجيل');
    }
    
    await logAudit(id ? 'update' : 'add', 'meeting', obj.id, { title });
    closeSheetAll();
    go(S.page);
  } catch (e) {
    toast('خطأ', 'error');
  }
}

async function deleteMeeting(id) {
  if (!confirm('حذف الاجتماع؟')) return;
  try {
    await dbDel('meetings', id);
    S.meetings = S.meetings.filter(x => x.id !== id);
    toast('🗑️');
    closeSheetAll();
    go(S.page);
  } catch (e) {
    toast('خطأ', 'error');
  }
}

function openMeetingDetail(id) {

  if (!m) return;
  
  const decs = m.decisionsList || [];
  const pending = decs.filter(d => d.status === 'قيد التنفيذ');
  const done = decs.filter(d => d.status === 'منفذ');
  
  let html = '';
  html += '<div style="padding:14px;background:var(--primary-soft);border-radius:12px;margin-bottom:14px">';

    html += '<div class="progress" style="margin-bottom:12px"><div style="width:' + (decs.length ? Math.round(done.length / decs.length * 100) : 0) + '%"></div></div>';
    
    decs.forEach(function(d) {
      const isDone = d.status === 'منفذ';
      html += '<div style="padding:10px;background:' + (isDone ? 'var(--donation-soft)' : 'var(--warning-soft)') + ';border-radius:10px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start">';
      html += '<div style="font-size:18px;flex-shrink:0">' + (isDone ? '✅' : '⏳') + '</div>';
      html += '<div style="flex:1;min-width:0">';
      html += '<div style="font-weight:700;font-size:13px;line-height:1.5">' + esc(d.text) + '</div>';
      html += '<div style="font-size:10px;color:var(--muted);margin-top:4px">' + (isDone ? 'منفذ ' + (d.doneAt ? fmtDate(d.doneAt) : '') : 'قيد التنفيذ') + (d.doneBy ? ' • ' + esc(d.doneBy) : '') + '</div></div>';
      
      if (hasPerm('meetings.manage')) {
        html += '<button onclick="toggleDecisionStatus(' + m.id + ',\'' + d.id + '\')" style="background:' + (isDone ? 'var(--border-2)' : 'var(--success)') + ';color:' + (isDone ? 'var(--muted)' : '#fff') + ';border:0;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit">' + (isDone ? '↩️' : '✓') + '</button>';
      }
      html += '</div>';
    });
    
    html += '</div>';
  } else if (m.decisions) {
    html += '<div class="card">';
    html += '<div class="card-head"><h2>✅ القرارات</h2></div>';
    html += '<div style="padding:10px;background:var(--bg);border-radius:10px;font-size:13px;white-space:pre-wrap;line-height:1.7">' + esc(m.decisions) + '</div></div>';
  }
  
  if (m.agenda) {
    html += '<div class="card">';
    html += '<div class="card-head"><h2>📋 جدول الأعمال</h2></div>';
    html += '<div style="padding:10px;background:var(--bg);border-radius:10px;font-size:13px;white-space:pre-wrap;line-height:1.7">' + esc(m.agenda) + '</div></div>';
  }
  
  const foot = hasPerm('meetings.manage')
    ? '<button class="btn ghost sm" onclick="closeSheet();setTimeout(function(){openEditMeetingSheet(' + id + ')},150)">✏️ تعديل</button>' +
      '<button class="btn primary" onclick="shareMeetingWA(' + id + ')">📱 واتساب</button>'
    : '<button class="btn ghost" onclick="closeSheetAll()">إغلاق</button>';
  
  openSheet('📋 ' + m.title, html, foot, { wide: true });
}

async function toggleDecisionStatus(meetingId, decisionId) {
  const m = S.meetings.find(x => x.id === meetingId);
  if (!m || !m.decisionsList) return;
  
  const d = m.decisionsList.find(x => x.id === decisionId);
  if (!d) return;
  
  if (d.status === 'منفذ') {
    d.status = 'قيد التنفيذ';
    delete d.doneAt;
    delete d.doneBy;
  } else {
    d.status = 'منفذ';
    d.doneAt = new Date().toISOString();
    d.doneBy = S.currentUser.name;
  }
  
  try {
    await dbPut('meetings', m);
    toast(d.status === 'منفذ' ? '✅ تم التنفيذ' : '↩️ رجع قيد التنفيذ', 'success', 2000);
    closeSheetAll();
    setTimeout(function() { openMeetingDetail(meetingId); }, 200);
  } catch (e) {
    toast('خطأ', 'error');
  }
}
