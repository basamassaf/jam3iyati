<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>صندوق زعورة v11</title>

<!-- مكتبة Excel (للتصدير/الاستيراد) -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════════
   🎨 Zaoura Fund v11 — نظام التصميم
   ═══════════════════════════════════════════════════════════════ */

:root {
  --primary: #6d28d9;
  --primary-2: #7c3aed;
  --primary-dark: #4c1d95;
  --primary-soft: #f5f3ff;
  --primary-light: #ede9fe;
  
  --assoc: #2563eb;
  --assoc-soft: #eff6ff;
  --assoc-light: #dbeafe;
  
  --death: #dc2626;
  --death-soft: #fef2f2;
  --death-light: #fee2e2;
  
  --donation: #16a34a;
  --donation-soft: #f0fdf4;
  --donation-light: #dcfce7;
  
  --success: #10b981;
  --success-soft: #d1fae5;
  --warning: #f59e0b;
  --warning-soft: #fef3c7;
  --info: #3b82f6;
  --info-soft: #dbeafe;
  
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --text-2: #475569;
  --muted: #64748b;
  --muted-2: #94a3b8;
  --border: #e2e8f0;
  --border-2: #f1f5f9;
  
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
  --shadow-md: 0 2px 8px rgba(15,23,42,.06);
  --shadow-lg: 0 8px 24px rgba(15,23,42,.12);
  --shadow-xl: 0 20px 50px rgba(15,23,42,.18);
  
  --safe-bottom: env(safe-area-inset-bottom, 0);
  --safe-top: env(safe-area-inset-top, 0);
  --bnav-h: 68px;
}

[data-theme="dark"] {
  --bg: #0a0f1c;
  --card: #131c31;
  --text: #f1f5f9;
  --text-2: #cbd5e1;
  --muted: #94a3b8;
  --muted-2: #64748b;
  --border: #1e293b;
  --border-2: #0f172a;
  --primary-soft: #2e1065;
  --assoc-soft: #1e3a8a;
  --death-soft: #7f1d1d;
  --donation-soft: #14532d;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html { font-size: 15px; }

body {
  font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: calc(var(--bnav-h) + var(--safe-bottom));
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
input, select, textarea { outline: none; }
a { color: inherit; text-decoration: none; }

/* ═══ الهيدر ═══ */
.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  padding: 10px 14px;
  padding-top: calc(10px + var(--safe-top));
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 20px rgba(109, 40, 217, 0.25);
  min-height: 56px;
}
.app-header .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.app-header .logo {
  width: 38px; height: 38px; border-radius: 11px;
  background: rgba(255,255,255,.18);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; flex-shrink: 0;
}
.app-header .brand-text { flex: 1; min-width: 0; }
.app-header h1 { font-size: 15px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-header .sub {
  font-size: 11px; opacity: .9; font-weight: 700; cursor: pointer;
  display: inline-block; padding: 2px 8px;
  background: rgba(255,255,255,.15); border-radius: 7px; margin-top: 3px;
}
.app-header .icon-btn {
  width: 38px; height: 38px; border-radius: 11px;
  background: rgba(255,255,255,.14); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0; transition: transform .15s;
  position: relative;
}
.app-header .icon-btn:active { transform: scale(.92); }
.app-header .badge-num {
  position: absolute; top: 4px; left: 4px;
  background: #dc2626; color: #fff;
  font-size: 9px; font-weight: 800;
  min-width: 16px; height: 16px;
  border-radius: 8px; padding: 0 4px;
  display: none; align-items: center; justify-content: center;
}
.app-header .badge-num.on { display: flex; }

/* ═══ شريط المستخدم ═══ */
.user-banner {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  position: sticky;
  top: 56px;
  z-index: 29;
}
.user-banner .who { display: flex; align-items: center; gap: 8px; color: var(--muted); flex-wrap: wrap; min-width: 0; }
.user-banner .who b { color: var(--text); font-weight: 800; }
.role-badge {
  padding: 3px 10px; border-radius: 20px;
  font-size: 10px; font-weight: 800;
  background: var(--primary-soft); color: var(--primary);
  white-space: nowrap;
}
.sector-badge {
  padding: 3px 10px; border-radius: 20px;
  font-size: 10px; font-weight: 800;
  background: var(--warning-soft); color: #92400e;
  white-space: nowrap;
}

/* ═══ المحتوى ═══ */
main { max-width: 900px; margin: 0 auto; padding: 12px; }
.page { display: none; }
.page.active { display: block; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* ═══ البطاقات ═══ */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
}
.card-head h2 { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; }

/* ═══ الإحصائيات ═══ */
.stats-scroll {
  display: flex; gap: 8px; overflow-x: auto;
  margin: 0 -12px 12px; padding: 0 12px 4px;
  scrollbar-width: none;
}
.stats-scroll::-webkit-scrollbar { display: none; }
.stat {
  flex: 0 0 auto; min-width: 130px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px;
  box-shadow: var(--shadow-sm);
  position: relative; overflow: hidden;
}
.stat::before {
  content: ''; position: absolute; top: 0; right: 0;
  width: 4px; height: 100%; background: var(--primary);
}
.stat.assoc::before { background: var(--assoc); }
.stat.death::before { background: var(--death); }
.stat.donation::before { background: var(--donation); }
.stat.green::before { background: var(--success); }
.stat.red::before { background: var(--death); }
.stat.orange::before { background: var(--warning); }
.stat.blue::before { background: var(--assoc); }
.stat.purple::before { background: var(--primary); }

.stat .val {
  font-size: 19px; font-weight: 800;
  line-height: 1.1; color: var(--primary);
  word-break: break-all; letter-spacing: -.5px;
  font-family: 'SF Mono', 'Courier New', monospace;
}
.stat.assoc .val { color: var(--assoc); }
.stat.death .val { color: var(--death); }
.stat.donation .val { color: var(--donation); }
.stat.green .val { color: var(--success); }
.stat.red .val { color: var(--death); }
.stat.orange .val { color: var(--warning); }
.stat.blue .val { color: var(--assoc); }
.stat .lbl { font-size: 10px; color: var(--muted); margin-top: 6px; font-weight: 700; }

/* ═══ القوائم ═══ */
.list {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border-2);
  cursor: pointer;
  min-height: 58px;
  transition: background .1s;
}
.item:last-child { border-bottom: 0; }
.item:active { background: var(--bg); }
.item .av {
  width: 42px; height: 42px; border-radius: 12px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  background: var(--primary-soft); color: var(--primary);
  font-weight: 800; overflow: hidden;
}
.item .av.blue { background: var(--assoc-soft); color: var(--assoc); }
.item .av.red { background: var(--death-soft); color: var(--death); }
.item .av.green { background: var(--donation-soft); color: var(--donation); }
.item .av.orange { background: var(--warning-soft); color: #92400e; }
.item .av.gray { background: var(--border-2); color: var(--muted); }
.item .body { flex: 1; min-width: 0; }
.item .ttl {
  font-weight: 700; font-size: 14px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.item .sub {
  font-size: 11.5px; color: var(--muted); margin-top: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.item .trail { color: var(--muted-2); font-size: 20px; flex-shrink: 0; }

/* ═══ الشارات ═══ */
.badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 6px;
  font-size: 10px; font-weight: 800; white-space: nowrap;
}
.badge.success { background: var(--success-soft); color: #065f46; }
.badge.danger { background: var(--death-light); color: #991b1b; }
.badge.warning { background: var(--warning-soft); color: #92400e; }
.badge.info { background: var(--info-soft); color: #1e40af; }
.badge.muted { background: var(--border-2); color: var(--muted); }
.badge.primary { background: var(--primary-soft); color: var(--primary); }

/* ═══ الشرائح ═══ */
.chips {
  display: flex; gap: 6px; overflow-x: auto;
  padding-bottom: 6px; margin-bottom: 6px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 7px 14px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  font-size: 12px; font-weight: 700;
  color: var(--muted);
  transition: all .15s;
  font-family: inherit;
}
.chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ═══ الأزرار ═══ */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 18px;
  border-radius: var(--r-md);
  font-size: 14px; font-weight: 700;
  min-height: 42px; white-space: nowrap;
  transition: transform .1s;
  font-family: inherit;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--primary); color: #fff; }
.btn.assoc { background: var(--assoc); color: #fff; }
.btn.death { background: var(--death); color: #fff; }
.btn.donation { background: var(--donation); color: #fff; }
.btn.success { background: var(--success); color: #fff; }
.btn.danger { background: var(--death); color: #fff; }
.btn.warning { background: var(--warning); color: #fff; }
.btn.info { background: var(--info); color: #fff; }
.btn.ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn.sm { padding: 6px 11px; min-height: 34px; font-size: 12px; border-radius: 9px; }
.btn.lg { padding: 14px 22px; min-height: 52px; font-size: 15px; border-radius: var(--r-lg); }
.btn.block { display: flex; width: 100%; }

/* ═══ الأزرار السريعة ═══ */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.quick-actions.two { grid-template-columns: repeat(2, 1fr); }
.quick-btn {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 14px 8px;
  border-radius: var(--r-md);
  background: var(--card);
  border: 1.5px solid var(--border);
  cursor: pointer; text-align: center;
  transition: all .15s;
  font-family: inherit;
}
.quick-btn:active { transform: scale(.97); border-color: var(--primary); }
.quick-btn .ico { font-size: 26px; line-height: 1; }
.quick-btn .lbl { font-size: 11px; font-weight: 800; }
.quick-btn.assoc { border-color: var(--assoc); }
.quick-btn.assoc .lbl { color: var(--assoc); }
.quick-btn.death { border-color: var(--death); }
.quick-btn.death .lbl { color: var(--death); }
.quick-btn.donation { border-color: var(--donation); }
.quick-btn.donation .lbl { color: var(--donation); }

/* ═══ الزر العائم ═══ */
.fab {
  position: fixed;
  bottom: calc(var(--bnav-h) + 20px + var(--safe-bottom));
  left: 16px;
  width: 56px; height: 56px;
  border-radius: 18px;
  background: var(--primary);
  color: #fff; font-size: 26px; font-weight: 300;
  box-shadow: 0 8px 24px rgba(109, 40, 217, 0.4);
  z-index: 25;
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s;
}
.fab:active { transform: scale(.9); }

/* ═══ القائمة السفلية ═══ */
.bnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 30;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  padding: 6px 4px calc(6px + var(--safe-bottom));
  box-shadow: 0 -4px 12px rgba(15, 23, 42, 0.04);
}
.bnav button {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 2px;
  border-radius: 10px;
  color: var(--muted);
  font-size: 10px; font-weight: 700;
  min-width: 0;
  font-family: inherit;
  transition: color .15s;
}
.bnav button .i { font-size: 21px; line-height: 1; transition: transform .15s; }
.bnav button.on { color: var(--primary); }
.bnav button.on .i { transform: translateY(-1px) scale(1.08); }

/* ═══ الأوراق (Sheets) ═══ */
.sheet-back {
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.5);
  z-index: 10100;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
  backdrop-filter: blur(3px);
}
.sheet-back.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 10101;
  background: var(--card);
  border-radius: 22px 22px 0 0;
  max-height: 94vh; overflow-y: auto;
  transform: translateY(100%);
  transition: transform .28s cubic-bezier(.2,.9,.3,1);
  padding-bottom: calc(16px + var(--safe-bottom));
}
.sheet.on { transform: translateY(0); }
.sheet.wide { max-height: 98vh; }
.sheet-grip {
  width: 42px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 10px auto 0;
}
.sheet-hd {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  background: var(--card);
  z-index: 2;
}
.sheet-hd h2 {
  font-size: 15px; font-weight: 800;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1;
}
.sheet-hd .close-btn {
  width: 34px; height: 34px;
  background: var(--bg); color: var(--text);
  border-radius: 10px; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sheet-hd .back-btn {
  width: 34px; height: 34px;
  background: var(--primary-soft); color: var(--primary);
  border-radius: 10px; font-size: 16px;
  display: none; align-items: center; justify-content: center;
  flex-shrink: 0; margin-inline-end: 6px;
}
.sheet-hd .back-btn.on { display: flex; }
.sheet-bd { padding: 16px; }
.sheet-ft {
  display: flex; gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  position: sticky; bottom: 0;
  background: var(--card);
  flex-wrap: wrap;
}
.sheet-ft .btn { flex: 1; min-width: 90px; }

/* ═══ النماذج ═══ */
.fld { margin-bottom: 14px; position: relative; }
.fld label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.fld label .req { color: var(--death); }
.fld input, .fld select, .fld textarea {
  width: 100%;
  padding: 11px 14px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  font-size: 14px;
  transition: border-color .15s;
}
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--primary); background: var(--card); }
.fld input:disabled, .fld select:disabled { opacity: .6; cursor: not-allowed; }
.fld textarea { resize: vertical; min-height: 70px; }
.fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fld-hint { font-size: 11px; color: var(--muted-2); margin-top: 4px; }

/* ═══ القائمة المنسدلة ═══ */
.options-list {
  position: absolute; top: 100%; left: 0; right: 0;
  background: var(--card);
  border: 1.5px solid var(--primary);
  border-radius: var(--r-md);
  max-height: 250px; overflow-y: auto;
  z-index: 100; margin-top: 4px;
  display: none;
  box-shadow: var(--shadow-lg);
}
.options-list.on { display: block; }
.option-item {
  padding: 11px 14px;
  cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border-2);
  font-size: 14px;
  transition: background .1s;
}
.option-item:active { background: var(--primary-soft); }
.option-item:last-child { border-bottom: 0; }
.option-item small { color: var(--muted); font-size: 11px; }

/* ═══ حقل المبلغ ═══ */
.amount-input {
  display: flex; align-items: center; gap: 10px;
  background: var(--card);
  border: 2px solid var(--primary);
  border-radius: var(--r-lg);
  padding: 6px 14px;
}
.amount-input input {
  flex: 1;
  border: 0; background: none;
  font-size: 24px; font-weight: 800;
  color: var(--primary);
  text-align: center;
  padding: 8px 0;
  font-family: 'SF Mono', 'Courier New', monospace;
  letter-spacing: -1px;
}
.amount-input .currency { font-size: 13px; font-weight: 800; color: var(--muted); }
.amount-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.amount-quick button {
  padding: 6px 12px; border-radius: 9px;
  background: var(--primary-soft); color: var(--primary);
  font-size: 12px; font-weight: 800;
  font-family: inherit;
}

/* ═══ بلوكات الرصيد ═══ */
.balance-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px;
  margin-bottom: 10px;
}
.balance-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--border-2);
}
.balance-row:last-child { border-bottom: 0; }
.balance-row .lbl { color: var(--muted); }
.balance-row .val { font-weight: 800; font-family: 'SF Mono', 'Courier New', monospace; }
.balance-row .val.green { color: var(--success); }
.balance-row .val.red { color: var(--death); }
.balance-row .val.orange { color: var(--warning); }

/* ═══ شريط التقدم ═══ */
.progress {
  height: 8px; background: var(--border-2);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 8px;
}
.progress > div {
  height: 100%; border-radius: 4px;
  transition: width .3s;
}
.progress.assoc > div { background: var(--assoc); }
.progress.death > div { background: var(--death); }
.progress.donation > div { background: var(--donation); }

/* ═══ الحالة الفارغة ═══ */
.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
}
.empty .ico { font-size: 52px; opacity: .35; display: block; margin-bottom: 10px; }
.empty h3 { font-size: 15px; font-weight: 800; margin-bottom: 4px; color: var(--text); }
.empty p { font-size: 12px; }

/* ═══ التنبيهات ═══ */
.toasts {
  position: fixed; top: 14px; left: 50%;
  transform: translateX(-50%);
  z-index: 10200;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
  width: calc(100% - 28px);
  max-width: 400px;
}
.toast {
  background: var(--text); color: var(--card);
  padding: 12px 18px;
  border-radius: var(--r-md);
  font-size: 13px; font-weight: 700;
  box-shadow: var(--shadow-xl);
  pointer-events: auto;
  animation: toastIn .25s ease;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.toast.success { background: var(--success); color: #fff; }
.toast.error { background: var(--death); color: #fff; }
.toast.warning { background: var(--warning); color: #fff; }
.toast.info { background: var(--info); color: #fff; }

/* ═══ التحميل ═══ */
.loader {
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(3px);
  z-index: 10300;
  display: none;
  align-items: center; justify-content: center;
}
.loader.on { display: flex; }
.spin {
  width: 42px; height: 42px;
  border: 3px solid rgba(255,255,255,.25);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══ شاشة الدخول ═══ */
.login-screen {
  position: fixed; inset: 0;
  z-index: 10000;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  display: none;
  align-items: center; justify-content: center;
  padding: 20px; overflow-y: auto;
}
.login-screen.on { display: flex; }
.login-card {
  background: var(--card); color: var(--text);
  border-radius: 24px;
  padding: 26px 22px;
  max-width: 400px; width: 100%;
  margin: auto;
  box-shadow: var(--shadow-xl);
}
.login-card .logo-lg {
  width: 64px; height: 64px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 32px;
  margin: 0 auto 16px;
  box-shadow: 0 8px 24px rgba(109, 40, 217, 0.35);
}
.login-card h1 { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 4px; }
.login-card .sub { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 22px; }
.users-list { display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto; }
.login-user {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  background: var(--bg);
  border: 2px solid transparent;
  cursor: pointer;
  transition: all .15s;
}
.login-user:active { border-color: var(--primary); background: var(--primary-soft); }
.login-user .av {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800;
  flex-shrink: 0;
}
.login-user .info { flex: 1; min-width: 0; }
.login-user .nm { font-weight: 700; font-size: 14px; }
.login-user .role { font-size: 11px; color: var(--muted); margin-top: 2px; }

.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
.pin-btn {
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--bg);
  font-size: 20px; font-weight: 800;
  font-family: inherit;
  transition: all .1s;
}
.pin-btn:active { transform: scale(.95); background: var(--primary-soft); }
.pin-display { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
.pin-dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--border);
  transition: background .15s;
}
.pin-dot.on { background: var(--primary); }

/* ═══ الفلتر ═══ */
.filter-bar {
  background: var(--card);
  border-radius: var(--r-md);
  padding: 10px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.filter-btn {
  padding: 9px 10px;
  border-radius: 10px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  overflow: hidden;
  transition: all .15s;
}
.filter-btn.active {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary);
}
.filter-btn .lbl {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.filter-btn .count {
  background: var(--border-2);
  color: var(--muted);
  padding: 1px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 800;
  min-width: 26px;
  text-align: center;
}
.filter-btn.active .count {
  background: var(--primary);
  color: #fff;
}

/* ═══ الشريط الأفقي (Segment) ═══ */
.segment {
  display: flex;
  gap: 4px;
  background: var(--card);
  padding: 5px;
  border-radius: var(--r-md);
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  overflow-x: auto;
  scrollbar-width: none;
}
.segment::-webkit-scrollbar { display: none; }
.segment button {
  flex: 1;
  padding: 8px 10px;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.segment button.on {
  background: var(--primary);
  color: #fff;
}

/* ═══ المحفظة ═══ */

.wallet-block.death { border-color: var(--death); }

.wallet-block .wallet-head {

.wallet-block .wallet-head .icon {

.wallet-block.death .icon { background: var(--death-soft); }
.wallet-block.donation .icon { background: var(--donation-soft); }

.wallet-block.death .title b { color: var(--death); }

.wallet-block .wallet-head .title small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.wallet-block .wallet-head .status {
  padding: 4px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 800;
}

/* ═══ الطباعة ═══ */
@media print {
  .app-header, .bnav, .fab, .user-banner, .stats-scroll { display: none !important; }
  main { padding: 0; max-width: 100%; }
  body { background: #fff; padding-bottom: 0; }

/* ═══ الجوال الصغير ═══ */
@media (max-width: 360px) {

/* ═══ تنظيف الهاتف ═══ */
const cleanPhone = v => {
  if (!v) return '';
  let s = String(v).trim()
    .replace(/\.0+$/, '')
    .replace(/[\s\-\(\)\u200f\u200e]/g, '');
  if (s.indexOf('+963') === 0) s = '0' + s.slice(4);
  return s;
};

/* ═══ التاريخ ═══ */
const today = () => new Date().toISOString().slice(0, 10);

const fmtDate = d => {
  if (!d) return '—';
  try {
    return new Date(d).toLocaleDateString('ar-EG', {
      year: 'numeric', month: 'short', day: 'numeric'
    });
  } catch (e) { return d; }
};

const fmtDateTime = d => {
  if (!d) return '—';
  try { return new Date(d).toLocaleString('ar-EG'); } catch (e) { return d; }
};

/* ═══ تحويل التاريخ من أي صيغة ═══ */
const toDate = v => {
  if (!v) return '';
  if (typeof v === 'string' && v.trim().indexOf('=') === 0) return '';
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if (typeof v === 'number') {
    const d = new Date((v - 25569) * 86400000);
    return isNaN(d) ? '' : d.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  const m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]|$)/);
  if (m1) return m1[1] + '-' + m1[2].padStart(2, '0') + '-' + m1[3].padStart(2, '0');
  const m2 = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if (m2) return m2[3] + '-' + m2[2].padStart(2, '0') + '-' + m2[1].padStart(2, '0');
  const d = new Date(s);
  if (!isNaN(d) && d.getFullYear() > 1900 && d.getFullYear() < 2100) {
    return d.toISOString().slice(0, 10);
  }
  return '';
};

/* ═══ تنسيق الأرقام ═══ */
const fmtNum = n => {
  if (n === null || n === undefined || n === '') return '0';
  const num = Number(n);
  if (isNaN(num)) return '0';
  return num.toLocaleString('en-US');
};

const fmtShort = n => {
  if (!n && n !== 0) return '0';
  const num = Number(n);
  if (isNaN(num)) return '0';
  if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
  if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
  return String(num);
};

/* ═══ Debounce ═══ */
const debounce = (fn, d) => {
  d = d || 250;
  let t;
  return function () {
    const args = arguments;
    clearTimeout(t);
    t = setTimeout(function () { fn.apply(null, args); }, d);
  };
};

function toast(msg, type, dur) {
  type = type || 'success';
  dur = dur || 2800;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(function () {
    el.style.opacity = '0';
    setTimeout(function () { el.remove(); }, 300);
  }, dur);
}

/* ═══════════════════════════════════════════════════════════════
   📌 نظام Sheets (الأوراق المنبثقة)
   ═══════════════════════════════════════════════════════════════ */

let _sheetStack = [];
let _scrollBeforeSheet = 0;

function openSheet(title, bodyHTML, footHTML, opts) {
  opts = opts || {};
  
  const sheet = $('sheet');
  const isOpen = sheet.classList.contains('on');
  
  if (isOpen && !opts.noStack) {
    _sheetStack.push({
      title: $('sheetTitle').textContent,
      body: $('sheetBody').innerHTML,
      foot: $('sheetFoot').innerHTML,
      footVisible: $('sheetFoot').style.display !== 'none',
      wide: sheet.classList.contains('wide')
    });
  } else if (!isOpen) {
    _sheetStack = [];
    _scrollBeforeSheet = window.scrollY || window.pageYOffset || 0;
  }
  
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = bodyHTML;
  $('sheetFoot').innerHTML = footHTML || '';
  $('sheetFoot').style.display = footHTML ? 'flex' : 'none';
  $('sheetBack').classList.add('on');
  sheet.classList.add('on');
  
  if (opts.wide) sheet.classList.add('wide');
  else sheet.classList.remove('wide');
  
  $('sheetBody').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  
  updateBackBtn();
  
  if (opts.focus) {
    setTimeout(function () {
      const el = $(opts.focus);
      if (el) el.focus();
    }, 280);
  }
}

function closeSheet() {
  if (_sheetStack.length > 0) {
    const prev = _sheetStack.pop();
    $('sheetTitle').textContent = prev.title;
    $('sheetBody').innerHTML = prev.body;
    $('sheetFoot').innerHTML = prev.foot;
    $('sheetFoot').style.display = prev.footVisible ? 'flex' : 'none';
    
    const sheet = $('sheet');
    if (prev.wide) sheet.classList.add('wide');
    else sheet.classList.remove('wide');
    
    $('sheetBody').scrollTop = 0;
    updateBackBtn();
    return;
  }
  closeSheetAll();
}

function closeSheetAll() {
  _sheetStack = [];
  $('sheetBack').classList.remove('on');
  $('sheet').classList.remove('on');
  document.body.style.overflow = '';
  updateBackBtn();
  
  setTimeout(function () {
    if (_scrollBeforeSheet > 0) {
      window.scrollTo({ top: _scrollBeforeSheet, behavior: 'instant' });
    }
  }, 50);
}

function updateBackBtn() {
  const btn = $('sheetBackBtn');
  if (!btn) return;
  if (_sheetStack.length > 0) btn.classList.add('on');
  else btn.classList.remove('on');
}

/* ═══════════════════════════════════════════════════════════════
   📌 IndexedDB
   ═══════════════════════════════════════════════════════════════ */

let db = null;

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORE_NAMES.forEach(n => {
        if (!d.objectStoreNames.contains(n)) {
          d.createObjectStore(n, { keyPath: 'id', autoIncrement: true });
        }
      });
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}

const tx = (s, m) => db.transaction(s, m || 'readonly').objectStore(s);

const dbAll = s => new Promise((res, rej) => {
  const q = tx(s).getAll();
  q.onsuccess = () => res(q.result || []);
  q.onerror = () => rej(q.error);
});

const dbGet = (s, id) => new Promise((res, rej) => {
  const q = tx(s).get(id);
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
});

const dbPut = (s, o) => new Promise((res, rej) => {
  const q = tx(s, 'readwrite').put(o);
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
});

const dbDel = (s, id) => new Promise((res, rej) => {
  const q = tx(s, 'readwrite').delete(id);
  q.onsuccess = () => res();
  q.onerror = () => rej(q.error);
});

const dbClear = s => new Promise((res, rej) => {
  const q = tx(s, 'readwrite').clear();
  q.onsuccess = () => res();
  q.onerror = () => rej(q.error);
});

/* ═══════════════════════════════════════════════════════════════
   📌 تشفير PIN (SHA-256)
   ═══════════════════════════════════════════════════════════════ */

const PIN_SALT = 'ZAOURA_FUND_V11_SALT_2026';

async function hashPin(pin) {
  const data = new TextEncoder().encode(String(pin) + PIN_SALT);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

async function verifyPin(pin, hash) {
  const h = await hashPin(pin);
  return h === hash;
}

function hasPerm(permission) {
  if (!S.currentUser || !S.currentRole) return false;
  
  /* المدير له كل الصلاحيات */
  if (S.currentRole.permissions && S.currentRole.permissions.indexOf('*') > -1) {
    return true;
  }
  
  return (S.currentRole.permissions || []).indexOf(permission) > -1;
}

/**
 * فحص صلاحية لدور محدد (بدون النظر للمستخدم الحالي)
 */
function roleHasPerm(role, permission) {
  if (!role) return false;
  if (role.permissions && role.permissions.indexOf('*') > -1) return true;
  return (role.permissions || []).indexOf(permission) > -1;
}

        color: '#7c3aed',
        isDefault: false,
        canCollect: false,
        needsSector: false,
        permissions: []
      }
    : getRoleById(roleId);
  
  if (!role) return;
  
  const isManager = role.key === 'manager';
  const isLocked = isManager; /* المدير لا يُعدَّل */
  
  let html = '';
  
  /* تحذير للمدير */
  if (isLocked) {
    html += '<div style="padding:10px;background:var(--warning-soft);border-radius:10px;margin-bottom:14px;font-size:12px;color:#92400e;font-weight:700">';
    html += '🔒 دور المدير لا يمكن تعديله — له كل الصلاحيات دائماً';
    html += '</div>';
  }
  
  /* معلومات أساسية */
  html += '<div class="fld"><label>اسم الدور <span class="req">*</span></label>';
  html += '<input id="roleName" value="' + esc(role.name || '') + '" placeholder="مثال: أمين المستودع"' + (isLocked ? ' disabled' : '') + '></div>';
  
  html += '<div class="fld-row">';
  html += '<div class="fld"><label>الأيقونة</label>';
  html += '<input id="roleIcon" value="' + esc(role.icon || '🎭') + '" maxlength="4"' + (isLocked ? ' disabled' : '') + '></div>';
  html += '<div class="fld"><label>اللون</label>';
  html += '<input id="roleColor" type="color" value="' + (role.color || '#7c3aed') + '" style="height:42px;padding:4px"' + (isLocked ? ' disabled' : '') + '></div>';
  html += '</div>';
  
  /* المفتاح (للدور الجديد فقط) */
  if (isNew) {
    html += '<div class="fld"><label>المفتاح (بالإنجليزية) <span class="req">*</span></label>';
    html += '<input id="roleKey" placeholder="warehouseKeeper" style="font-family:monospace;direction:ltr" maxlength="30">';
    html += '<div class="fld-hint">لا يمكن تغييره بعد الحفظ</div></div>';
  }
  
  /* خصائص الدور */
  if (!isLocked) {
    html += '<div style="padding:12px;background:var(--primary-soft);border-radius:12px;margin-bottom:14px">';
    html += '<div style="font-weight:800;font-size:12px;color:var(--primary);margin-bottom:10px">⚙️ خصائص الدور</div>';
    
    html += '<label style="display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px;font-weight:700;cursor:pointer">';
    html += '<input type="checkbox" id="roleCanCollect"' + (role.canCollect ? ' checked' : '') + ' style="width:auto">';
    html += '💰 يستطيع التحصيل من الأعضاء';
    html += '</label>';
    
    html += '<label style="display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px;font-weight:700;cursor:pointer">';
    html += '<input type="checkbox" id="roleNeedsSector"' + (role.needsSector ? ' checked' : '') + ' style="width:auto">';
    html += '📍 يحتاج قطاعاً مفضّلاً';
    html += '</label>';
    html += '</div>';
  }
  
  /* الصلاحيات */
  if (!isLocked) {
    html += '<div style="font-weight:800;font-size:14px;margin-bottom:12px">🔐 الصلاحيات</div>';
    
    /* أزرار سريعة */
    html += '<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">';
    html += '<button class="btn ghost sm" onclick="selectAllPerms()">✅ اختيار الكل</button>';
    html += '<button class="btn ghost sm" onclick="clearAllPerms()">❌ إلغاء الكل</button>';
    html += '</div>';
    
    /* المجموعات */
    PERMISSION_GROUPS.forEach(function(group) {
      const groupPerms = Object.keys(AVAILABLE_PERMISSIONS).filter(function(p) {
        return AVAILABLE_PERMISSIONS[p].group === group;
      });
      
      if (groupPerms.length === 0) return;
      
      const isChecked = role.permissions.indexOf('*') > -1
        ? true
        : groupPerms.some(p => role.permissions.indexOf(p) > -1);
      
      html += '<div style="border:1.5px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden">';
      html += '<div style="padding:10px 14px;background:var(--bg);display:flex;justify-content:space-between;align-items:center">';
      html += '<div style="font-weight:800;font-size:13px">' + group + '</div>';
      html += '<button class="btn ghost sm" onclick="togglePermGroup(\'' + group + '\')">' + (isChecked ? '✅' : '⚪') + '</button>';
      html += '</div>';
      html += '<div style="padding:8px 14px">';
      
      groupPerms.forEach(function(perm) {
        const meta = AVAILABLE_PERMISSIONS[perm];
        const isPermOn = role.permissions.indexOf('*') > -1 || role.permissions.indexOf(perm) > -1;
        
        html += '<label style="display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border-2)">';
        html += '<input type="checkbox" class="perm-checkbox" data-perm="' + perm + '" data-group="' + group + '"' + (isPermOn ? ' checked' : '') + ' style="width:auto">';
        html += '<span>' + meta.icon + '</span>';
        html += '<span style="flex:1">' + meta.label + '</span>';
        html += '<span style="font-size:10px;color:var(--muted-2);font-family:monospace">' + perm + '</span>';
        html += '</label>';
      });
      
      html += '</div></div>';
    });
  }
  
  /* الأزرار السفلية */
  let foot = '';
  if (!isNew && !isLocked) {
    const userCount = S.users.filter(u => u.role === role.key).length;
    if (userCount === 0 && !role.isDefault) {
      foot += '<button class="btn danger sm" onclick="deleteRole(' + role.id + ')">🗑️ حذف</button>';
    } else if (userCount > 0) {
      foot += '<button class="btn ghost sm" style="opacity:.5;cursor:not-allowed" title="يوجد ' + userCount + ' مستخدم بهذا الدور">🔒</button>';
    }
  }
  foot += '<button class="btn ghost" onclick="closeSheetAll()">إلغاء</button>';
  if (!isLocked) {
    foot += '<button class="btn primary" onclick="saveRole(' + (roleId || 'null') + ')">💾 حفظ</button>';
  }
  
  openSheet(isNew ? '➕ إضافة دور' : '✏️ تعديل: ' + esc(role.name), html, foot, { wide: true, focus: 'roleName' });
}

/* ═══ تفعيل/إلغاء مجموعة صلاحيات ═══ */
function togglePermGroup(group) {
  const checkboxes = document.querySelectorAll('.perm-checkbox[data-group="' + group + '"]');
  const allChecked = Array.from(checkboxes).every(cb => cb.checked);
  checkboxes.forEach(cb => cb.checked = !allChecked);
}

function selectAllPerms() {
  document.querySelectorAll('.perm-checkbox').forEach(cb => cb.checked = true);
}

function clearAllPerms() {
  document.querySelectorAll('.perm-checkbox').forEach(cb => cb.checked = false);
}

/* ═══ حفظ الدور ═══ */
async function saveRole(roleId) {
  if (!hasPerm('admin.roles')) { toast('غير مصرح', 'error'); return; }
  
  const name = cleanText($('roleName').value);
  if (!name) { toast('الاسم مطلوب', 'error'); return; }
  
  const icon = cleanText($('roleIcon').value) || '🎭';
  const color = $('roleColor').value || '#7c3aed';
  const canCollect = $('roleCanCollect') ? $('roleCanCollect').checked : false;
  const needsSector = $('roleNeedsSector') ? $('roleNeedsSector').checked : false;
  
  /* جمع الصلاحيات */
  const permissions = [];
  document.querySelectorAll('.perm-checkbox:checked').forEach(cb => {
    permissions.push(cb.dataset.perm);
  });
  
  if (permissions.length === 0) {
    toast('اختر صلاحية واحدة على الأقل', 'error');
    return;
  }
  
  try {
    if (roleId) {
      /* تعديل */
      const role = getRoleById(roleId);
      if (!role) return;
      
      /* حفظ القديم للمقارنة */
      const oldPerms = role.permissions.slice();
      
      role.name = name;
      role.icon = icon;
      role.color = color;
      role.canCollect = canCollect;
      role.needsSector = needsSector;
      role.permissions = permissions;
      role.updatedAt = new Date().toISOString();
      
      await dbPut('roles', role);
      
      const i = S.roles.findIndex(r => r.id === roleId);
      if (i > -1) S.roles[i] = role;
      
      await logAudit('update', 'role', roleId, {
        name: name,
        oldPerms: oldPerms.length,
        newPerms: permissions.length
      });
      
      /* تحديث دور المستخدم الحالي إن كان هو */
      if (S.currentUser && S.currentUser.role === role.key) {
        S.currentRole = role;
      }
      
      toast('✅ تم تعديل الدور');
    } else {
      /* جديد */
      const key = cleanText($('roleKey').value);
      if (!key) { toast('المفتاح مطلوب', 'error'); return; }
      if (!/^[a-zA-Z][a-zA-Z0-9]*$/.test(key)) {
        toast('المفتاح: حروف إنجليزية فقط، يبدأ بحرف', 'error');
        return;
      }
      if (getRoleByKey(key)) {
        toast('المفتاح مستخدم بالفعل', 'error');
        return;
      }
      
      const obj = {
        key: key,
        name: name,
        icon: icon,
        color: color,
        isDefault: false,
        canCollect: canCollect,
        needsSector: needsSector,
        permissions: permissions,
        createdAt: new Date().toISOString()
      };
      
      const id = await dbPut('roles', obj);
      obj.id = id;
      S.roles.push(obj);
      
      await logAudit('add', 'role', id, { name: name, key: key });
      toast('✅ تم إضافة الدور');
    }
    
    closeSheetAll();
    go(S.page);
  } catch (e) {
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
}

/* ═══ حذف دور ═══ */
async function deleteRole(roleId) {
  if (!hasPerm('admin.roles')) { toast('غير مصرح', 'error'); return; }
  
  const role = getRoleById(roleId);
  if (!role) return;
  
  if (role.isDefault) { toast('لا يمكن حذف دور افتراضي', 'error'); return; }
  if (role.key === 'manager') { toast('لا يمكن حذف دور المدير', 'error'); return; }
  
  const userCount = S.users.filter(u => u.role === role.key).length;
  if (userCount > 0) {
    toast('يوجد ' + userCount + ' مستخدم بهذا الدور — انقلهم أولاً', 'error', 4000);
    return;
  }
  
  if (!confirm('حذف دور "' + role.name + '"؟')) return;
  
  try {
    await dbDel('roles', roleId);
    S.roles = S.roles.filter(r => r.id !== roleId);
    await logAudit('delete', 'role', roleId, { name: role.name, key: role.key });
    toast('🗑️ تم الحذف');
    closeSheetAll();
    go(S.page);
  } catch (e) {
    toast('خطأ: ' + e.message, 'error');
  }
}

function saveCurrentUser(u) {
  S.currentUser = u;
  if (u) {
    localStorage.setItem('zt_user', JSON.stringify({
      id: u.id, name: u.name, role: u.role
    }));
  } else {
    localStorage.removeItem('zt_user');
  }
}

function restoreCurrentUser() {
  try {
    const s = localStorage.getItem('zt_user');
    return s ? JSON.parse(s) : null;
  } catch (e) { return null; }
}

/* ═══ عرض شاشة الدخول ═══ */
let _pinAttempt = '';
let _pinTargetUser = null;

function renderLogin() {
  _pinAttempt = '';
  _pinTargetUser = null;
  $('loginUsers').style.display = 'block';
  $('loginPin').style.display = 'none';
  const list = $('loginUsersList');
  
  if (!S.users.length) {
    list.innerHTML = '<div style="text-align:center;padding:24px 12px">' +
      '<div style="font-size:52px;margin-bottom:12px">🏘️</div>' +
      '<div style="font-weight:800;font-size:15px;margin-bottom:6px">مرحباً بك</div>' +
      '<div style="font-size:12px;color:var(--muted)">ابدأ بإعداد مدير النظام</div></div>';
    return;
  }
  
  list.innerHTML = S.users.map(function(u) {
    const role = getRoleByKey(u.role) || { name: 'مستخدم', icon: '👤' };
    return '<div class="login-user" onclick="selectLoginUser(' + u.id + ')">' +
      '<div class="av">' + role.icon + '</div>' +
      '<div class="info">' +
      '<div class="nm">' + esc(u.name) + '</div>' +
      '<div class="role">' + esc(role.name) + '</div>' +
      '</div>' +
      (u.hasPin
        ? '<span style="font-size:18px;color:var(--muted)">🔒</span>'
        : '<span style="font-size:18px;color:var(--success)">🔓</span>') +
      '</div>';
  }).join('');
}

function selectLoginUser(id) {
  const u = S.users.find(a => a.id === id);
  if (!u) return;
  _pinTargetUser = u;
  _pinAttempt = '';
  
  if (!u.hasPin) { doLogin(u); return; }
  
  $('loginUsers').style.display = 'none';
  $('loginPin').style.display = 'block';
  const role = getRoleByKey(u.role) || { name: 'مستخدم', icon: '👤' };
  $('pinAvatar').textContent = role.icon;
  $('pinName').textContent = u.name;
  $('pinRole').textContent = role.name;
  $('pinError').textContent = '';
  updatePinDisplay();
}

function pinPress(d) {
  if (_pinAttempt.length >= 4) return;
  _pinAttempt += d;
  updatePinDisplay();
  if (_pinAttempt.length === 4) setTimeout(checkPin, 200);
}

function pinBack() {
  _pinAttempt = _pinAttempt.slice(0, -1);
  updatePinDisplay();
}

function pinBackLogin() {
  $('loginPin').style.display = 'none';
  $('loginUsers').style.display = 'block';
  _pinAttempt = '';
  _pinTargetUser = null;
}

function updatePinDisplay() {
  $$('#pinDisplay .pin-dot').forEach(function(d, i) {
    d.classList.toggle('on', i < _pinAttempt.length);
  });
}

async function checkPin() {
  if (!_pinTargetUser) return;
  
  $('pinError').textContent = '⏳ جاري التحقق...';
  $('pinError').style.color = 'var(--muted)';
  
  let ok = false;
  if (_pinTargetUser.pinHash) {
    ok = await verifyPin(_pinAttempt, _pinTargetUser.pinHash);
  }
  
  if (ok) {
    $('pinError').textContent = '✅ صحيح';
    $('pinError').style.color = 'var(--success)';
    setTimeout(function() { doLogin(_pinTargetUser); }, 400);
  } else {
    $('pinError').textContent = '❌ خطأ';
    $('pinError').style.color = 'var(--death)';
    _pinAttempt = '';
    updatePinDisplay();
  }
}

function doLogin(u) {
  S.currentUser = u;
  S.currentRole = getRoleByKey(u.role);
  saveCurrentUser(u);
  toast('👋 مرحباً ' + u.name, 'success', 2000);
  showMain();
}

function logout() {
  if (!confirm('تسجيل الخروج؟')) return;
  saveCurrentUser(null);
  S.currentUser = null;
  S.currentRole = null;
  showLogin();
}

async function saveFirstAdmin() {
  const name = cleanText($('fName').value);
  const pin = $('fPin').value.trim();
  const pin2 = $('fPin2').value.trim();
  
  if (!name) { toast('الاسم مطلوب', 'error'); return; }
  if (!/^\d{4}$/.test(pin)) { toast('كلمة المرور: 4 أرقام', 'error'); return; }
  if (pin !== pin2) { toast('كلمتا المرور غير متطابقتين', 'error'); return; }
  
  try {
    const pinHash = await hashPin(pin);
    const user = {
      name: name,
      phone: cleanPhone($('fPhone').value),
      pinHash: pinHash,
      hasPin: true,
      role: 'manager',
      sector: '',
      collectFund: null,
      createdAt: new Date().toISOString()
    };
    const id = await dbPut('users', user);
    user.id = id;
    S.users.push(user);
    closeSheetAll();
    toast('✅ تم الإنشاء', 'success', 3000);
    setTimeout(renderLogin, 400);
  } catch (e) {
    toast('خطأ: ' + e.message, 'error');
  }
}

function go(page) {
  const prevPage = S.page;
  S.page = page;
  
  if (prevPage && prevPage !== page) {
    const pos = window.scrollY || window.pageYOffset || 0;
    if (pos > 10) localStorage.setItem('zt_scroll_' + prevPage, pos);
  }
  
  $$('.page').forEach(function(p) { p.classList.remove('active'); });
  
  const target = $(page);
  if (!target) {
    console.warn('⚠️ صفحة غير موجودة:', page);
    return;
  }
  target.classList.add('active');
  
  $$('.bnav button').forEach(function(b) {

/* ═══════════════════════════════════════════════════════════════
   📌 محرك المحفظة المزدوجة (الدوال الأساسية)
   ═══════════════════════════════════════════════════════════════ */

/* ═══ ثوابت حالات المحفظة ═══ */
const WALLET_STATUS = {
  PAID: 'paid',
  PARTIAL: 'partial',
  DUE: 'due',
  EXEMPT: 'exempt',
  CREDIT: 'credit',
  EMPTY: 'empty'
};

/* ═══ ثوابت سنة ═══ */
function getConstants(year) {
  const c = S.constants.find(x => x.year === year);
  if (c) return c;
  const sorted = S.constants.slice().sort((a, b) => b.year - a.year);
  return sorted[0] || null;
}

function getOpeningBalance() {
  const c = S.constants.find(x => x.year === 0);
  return c || { year: 0, assoc: 0, death: 0, donation: 0 };
}

/* ═══ فحص نشاط الصندوق لعضو في سنة ═══ */
function isFundActive(member, fund, year) {
  if (year < BASE_YEAR) return false;
  
  const status = member.memberStatus || 'نشط';
  
  if (fund === 'assoc') {
    if (!member.assocStartYear) return false;
    if (member.assocStartYear > year) return false;
    if (member.assocExempt) return false;
    if (status === 'معفى') return false;
    
    if (status === 'متوفى' && member.deathDate) {
      const dy = parseInt(member.deathDate.substring(0, 4));
      if (dy < year) return false;
    }
    
    if ((status === 'منسحب' || status === 'متوقف') && member.stopYear) {
      if (member.stopYear <= year) return false;
    }
    return true;
  }
  
  if (fund === 'death') {
    if (!member.deathStartYear) return false;
    if (member.deathStartYear > year) return false;
    if (member.deathExempt) return false;
    if (status === 'معفى') return false;
    
    if (status === 'متوفى' && member.deathDate) {
      const dy = parseInt(member.deathDate.substring(0, 4));
      if (dy < year) return false;
    }
    
    if ((status === 'منسحب' || status === 'متوقف') && member.stopYear) {
      if (member.stopYear <= year) return false;
    }
    return true;
  }
  
  return false;
}

/* ═══ المستحقات لسنة ═══ */
function computeMemberDuesInYear(member, year) {
  const result = {
    year: year,
    assoc: { annual: 0, join: 0, total: 0 },
    death: { installments: 0, join: 0, count: 0, total: 0 },
    total: 0,
    skipped: false,
    skipReason: ''
  };
  
  const yc = getConstants(year);
  if (!yc || !yc.assocYearly) {
    result.skipped = true;
    result.skipReason = 'لا ثوابت لهذه السنة';
    return result;
  }
  
  if (member.memberStatus === 'متوفى' && member.deathDate) {
    const dy = parseInt(member.deathDate.substring(0, 4));
    if (dy < year) {
      result.skipped = true;
      result.skipReason = 'متوفى قبل ' + year;
      return result;
    }
  }
  
  if ((member.memberStatus === 'منسحب' || member.memberStatus === 'متوقف') && member.stopYear) {
    if (member.stopYear <= year) {
      result.skipped = true;
      result.skipReason = member.memberStatus;
      return result;
    }
  }
  
  const isReduced = member.memberType === 'مخفض';
  
  /* الجمعية */
  if (isFundActive(member, 'assoc', year)) {
    const annual = isReduced && yc.assocYearlyReduced
      ? yc.assocYearlyReduced
      : yc.assocYearly;
    result.assoc.annual = annual;
    
    if (member.assocStartYear === year) {
      const joinFee = isReduced && yc.joinAssocFeeReduced
        ? yc.joinAssocFeeReduced
        : yc.joinAssocFee;
      result.assoc.join = joinFee;
    }
    result.assoc.total = result.assoc.annual + result.assoc.join;
  }
  
  /* الوفاة */
  if (isFundActive(member, 'death', year)) {
    if (member.deathStartYear === year) {
      const joinFee = isReduced && yc.joinDeathFeeReduced
        ? yc.joinDeathFeeReduced
        : yc.joinDeathFee;
      result.death.join = joinFee;
    }
    
    const deathsThisYear = S.deaths.filter(d => Number(d.year) === year);
    const deathInstallment = yc.deathInstallment || 5000;
    
    let payForCount = 0;
    for (const death of deathsThisYear) {
      let deceasedId = death.memberId;
      if (!deceasedId) {
        const dm = S.members.find(m => normAr(m.name) === normAr(death.deceasedName));
        if (dm) deceasedId = dm.id;
      }
      if (deceasedId === member.id) continue;
      
      if (!wasDeathActiveOnDate(member, death.deathDate, year)) continue;
      payForCount++;
    }
    
    result.death.installments = payForCount * deathInstallment;
    result.death.count = payForCount;
  }
  
  result.death.total = result.death.installments + result.death.join;
  result.total = result.assoc.total + result.death.total;
  
  return result;
}

function wasDeathActiveOnDate(member, dateStr, year) {
  if (!member.deathStartYear) return false;
  if (member.deathStartYear > year) return false;
  if (member.deathExempt) return false;
  
  const status = member.memberStatus || 'نشط';
  if (status === 'معفى') return false;
  
  if (status === 'متوفى' && member.deathDate && dateStr) {
    if (member.deathDate < dateStr) return false;
  }
  
  if ((status === 'منسحب' || status === 'متوقف') && member.stopYear) {
    if (member.stopYear <= year) return false;
  }
  
  return true;
}

/* ═══ المدفوعات لعضو ═══ */
function computeMemberPayments(memberId) {
  const result = {
    byYearAndFund: {},
    total: { assoc: 0, death: 0, donation: 0, all: 0 }
  };
  
  const payments = S.payments.filter(p => p.memberId === memberId);
  
  for (const p of payments) {
    const y = Number(p.forYear) || Number(p.year);
    if (!y) continue;
    const fund = p.fund || 'assoc';
    const amount = Number(p.amount) || 0;
    
    if (!result.byYearAndFund[y]) {
      result.byYearAndFund[y] = { assoc: 0, death: 0, donation: 0 };
    }
    
    result.byYearAndFund[y][fund] += amount;
    result.total[fund] += amount;
    result.total.all += amount;
  }
  
  return result;
}

/* ═══ محفظة العضو الكاملة ═══ */
function computeMemberWallet(memberId) {
  if (CACHE.memberWallet.has(memberId)) {
    return CACHE.memberWallet.get(memberId);
  }
  
  const member = S.members.find(m => m.id === memberId);
  if (!member) return null;
  
  const result = {
    member: member,
    funds: {
      assoc:    { due: 0, paid: 0, balance: 0, status: WALLET_STATUS.EMPTY, years: {} },
      death:    { due: 0, paid: 0, balance: 0, status: WALLET_STATUS.EMPTY, years: {} },
      donation: { due: 0, paid: 0, balance: 0, status: WALLET_STATUS.EMPTY, years: {} }
    },
    summary: {
      totalDue: 0,
      totalPaid: 0,
      totalBalance: 0,
      currentYearDue: 0,
      currentYearPaid: 0,
      currentYearBalance: 0,
      firstYear: null,
      lastYear: null
    },
    years: []
  };
  
  const starts = [member.assocStartYear, member.deathStartYear].filter(x => x);
  if (!starts.length) {
    const p = computeMemberPayments(memberId);
    result.funds.donation.paid = p.total.donation;
    result.funds.donation.balance = -p.total.donation;
    if (p.total.donation > 0) {
      result.funds.donation.status = WALLET_STATUS.CREDIT;
    }
    result.summary.totalPaid = p.total.all;
    result.summary.totalBalance = -p.total.donation;
    
    CACHE.memberWallet.set(memberId, result);
    return result;
  }
  
  const firstYear = Math.max(BASE_YEAR, Math.min.apply(null, starts));
  const lastYear = S.currentYear;
  
  result.summary.firstYear = firstYear;
  result.summary.lastYear = lastYear;
  
  const payments = computeMemberPayments(memberId);
  
  for (let y = firstYear; y <= lastYear; y++) {
    const yr = {
      year: y,
      assoc: { due: 0, paid: 0, balance: 0, status: WALLET_STATUS.EMPTY },
      death: { due: 0, paid: 0, balance: 0, status: WALLET_STATUS.EMPTY },
      donation: { due: 0, paid: 0, balance: 0, status: WALLET_STATUS.EMPTY },
      total: { due: 0, paid: 0, balance: 0 }
    };
    
    const dues = computeMemberDuesInYear(member, y);
    if (!dues.skipped) {
      yr.assoc.due = dues.assoc.total;
      yr.death.due = dues.death.total;
    }
    
    const paid = payments.byYearAndFund[y] || { assoc: 0, death: 0, donation: 0 };
    yr.assoc.paid = paid.assoc;
    yr.death.paid = paid.death;
    yr.donation.paid = paid.donation;
    
    yr.assoc.balance = yr.assoc.due - yr.assoc.paid;
    yr.death.balance = yr.death.due - yr.death.paid;
    yr.donation.balance = -yr.donation.paid;
    
    yr.total.due = yr.assoc.due + yr.death.due;
    yr.total.paid = yr.assoc.paid + yr.death.paid + yr.donation.paid;
    yr.total.balance = yr.assoc.balance + yr.death.balance + yr.donation.balance;
    
    yr.assoc.status = getYearFundStatus(yr.assoc.due, yr.assoc.paid);
    yr.death.status = getYearFundStatus(yr.death.due, yr.death.paid);
    if (yr.donation.paid > 0) yr.donation.status = WALLET_STATUS.CREDIT;
    
    result.funds.assoc.due += yr.assoc.due;
    result.funds.assoc.paid += yr.assoc.paid;
    result.funds.death.due += yr.death.due;
    result.funds.death.paid += yr.death.paid;
    result.funds.donation.paid += yr.donation.paid;
    
    result.funds.assoc.years[y] = { due: yr.assoc.due, paid: yr.assoc.paid, balance: yr.assoc.balance };
    result.funds.death.years[y] = { due: yr.death.due, paid: yr.death.paid, balance: yr.death.balance };
    
    if (y === S.currentYear) {
      result.summary.currentYearDue = yr.total.due;
      result.summary.currentYearPaid = yr.total.paid;
      result.summary.currentYearBalance = yr.total.balance;
    }
    
    result.years.push(yr);
  }
  
  result.funds.assoc.balance = result.funds.assoc.due - result.funds.assoc.paid;
  result.funds.death.balance = result.funds.death.due - result.funds.death.paid;
  result.funds.donation.balance = -result.funds.donation.paid;
  
  result.funds.assoc.status = getFundStatus(result.funds.assoc.due, result.funds.assoc.paid, member, 'assoc');
  result.funds.death.status = getFundStatus(result.funds.death.due, result.funds.death.paid, member, 'death');
  if (result.funds.donation.paid > 0) {
    result.funds.donation.status = WALLET_STATUS.CREDIT;
  }
  
  result.summary.totalDue = result.funds.assoc.due + result.funds.death.due;
  result.summary.totalPaid = result.funds.assoc.paid + result.funds.death.paid + result.funds.donation.paid;
  result.summary.totalBalance = result.funds.assoc.balance + result.funds.death.balance + result.funds.donation.balance;
  
  CACHE.memberWallet.set(memberId, result);
  return result;
}

function getYearFundStatus(due, paid) {
  if (due === 0 && paid === 0) return WALLET_STATUS.EMPTY;
  if (due === 0 && paid > 0) return WALLET_STATUS.CREDIT;
  if (paid >= due) return WALLET_STATUS.PAID;
  if (paid > 0) return WALLET_STATUS.PARTIAL;
  return WALLET_STATUS.DUE;
}

function getFundStatus(due, paid, member, fund) {
  if (member.memberStatus === 'معفى' ||
    (fund === 'assoc' && member.assocExempt) ||
    (fund === 'death' && member.deathExempt)) {
    return WALLET_STATUS.EXEMPT;
  }
  if (due === 0 && paid === 0) return WALLET_STATUS.EMPTY;
  if (due === 0 && paid > 0) return WALLET_STATUS.CREDIT;
  if (paid >= due) return WALLET_STATUS.PAID;
  if (paid > 0) return WALLET_STATUS.PARTIAL;
  return WALLET_STATUS.DUE;
}

/* ═══ إحصائيات الأعضاء ═══ */
function getMembersStats(year) {
  const y = year || S.currentYear;
  
  if (CACHE.stats && CACHE.statsYear === y) return CACHE.stats;
  
  let onlyAssoc = 0, onlyDeath = 0, both = 0, none = 0;
  let late = 0, lateTotal = 0;
  let active = 0, withdrawn = 0, deceased = 0, exempt = 0, frozen = 0;
  let newThisYear = 0;
  let totalDueAssoc = 0, totalDueDeath = 0, totalPaidAssoc = 0, totalPaidDeath = 0;
  
  for (const m of S.members) {
    const st = m.memberStatus || 'نشط';
    if (st === 'نشط') active++;
    else if (st === 'منسحب') withdrawn++;
    else if (st === 'متوقف') frozen++;
    else if (st === 'متوفى') deceased++;
    else if (st === 'معفى') exempt++;
    
    const hasAssoc = m.assocStartYear && m.assocStartYear <= y && !m.assocExempt && st !== 'معفى';
    const hasDeath = m.deathStartYear && m.deathStartYear <= y && !m.deathExempt && st !== 'معفى';
    
    if (hasAssoc && hasDeath) both++;
    else if (hasAssoc) onlyAssoc++;
    else if (hasDeath) onlyDeath++;
    else none++;
    
    if (m.assocStartYear === y || m.deathStartYear === y) newThisYear++;
    
    if (hasAssoc || hasDeath) {
      const w = computeMemberWallet(m.id);
      if (w) {
        totalDueAssoc += w.funds.assoc.due;
        totalDueDeath += w.funds.death.due;
        totalPaidAssoc += w.funds.assoc.paid;
        totalPaidDeath += w.funds.death.paid;
        
        const rem = w.summary.totalBalance;
        if (rem > 0) {
          late++;
          lateTotal += rem;
        }
      }
    }
  }
  
  const result = {
    year: y,
    total: S.members.length,
    onlyAssoc, onlyDeath, both, none,
    late, lateTotal,
    active, withdrawn, deceased, exempt, frozen,
    newThisYear,
    totalDueAssoc, totalDueDeath,
    totalPaidAssoc, totalPaidDeath,
    totalDue: totalDueAssoc + totalDueDeath,
    totalPaid: totalPaidAssoc + totalPaidDeath,
    collectionRate: (totalDueAssoc + totalDueDeath) > 0
      ? Math.round((totalPaidAssoc + totalPaidDeath) / (totalDueAssoc + totalDueDeath) * 100)
      : 0
  };
  
  CACHE.stats = result;
  CACHE.statsYear = y;
  return result;
}

/* ═══ رصيد صندوق فعلي ═══ */
function getFundActual(fund) {
  const opening = getOpeningBalance();
  const openingVal = Number(opening[fund]) || 0;
  
  const sum = arr => arr.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  
  const collected = sum(S.payments.filter(p => p.fund === fund));
  const incomes = sum(S.incomes.filter(i => i.fund === fund));
  const expenses = sum(S.expenses.filter(e => e.fund === fund));
  const compensations = fund === 'death'
    ? S.deaths.reduce((s, d) => s + (Number(d.compensation) || 0), 0)
    : 0;
  
  const balance = openingVal + collected + incomes - expenses - compensations;
  
  return {
    fund: fund,
    opening: openingVal,
    collected: collected,
    incomes: incomes,
    expenses: expenses,
    compensations: compensations,
    balance: balance
  };
}

/* ═══ عهدة المستخدم ═══ */
function getUserCustody(userId) {
  const user = S.users.find(u => u.id === userId);
  if (!user) {
    return {
      assoc: { collected: 0, delivered: 0, pending: 0, balance: 0 },
      death: { collected: 0, delivered: 0, pending: 0, balance: 0 },
      donation: { collected: 0, delivered: 0, pending: 0, balance: 0 },
      all: { collected: 0, delivered: 0, pending: 0, balance: 0 }
    };
  }
  
  const userName = normAr(user.name);
  const matchName = name => {
    if (!name || !userName) return false;
    const n = normAr(name);
    return n === userName || n.indexOf(userName) > -1 || userName.indexOf(n) > -1;
  };
  
  const payments = S.payments.filter(p =>
    p.collectorId === userId || (!p.collectorId && matchName(p.collectorName))
  );
  
  const delivered = S.deliveries.filter(d =>
    (d.fromUserId === userId || (!d.fromUserId && matchName(d.fromUserName)))
    && d.receivedAt
  );
  
  const pending = S.deliveries.filter(d =>
    (d.fromUserId === userId || (!d.fromUserId && matchName(d.fromUserName)))
    && !d.receivedAt && !d.rejectedAt
  );
  
  const sum = arr => arr.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  
  const byFund = fund => {
    const p = sum(payments.filter(x => x.fund === fund));
    const d = sum(delivered.filter(x => x.fund === fund));
    const pd = sum(pending.filter(x => x.fund === fund));
    return { collected: p, delivered: d, pending: pd, balance: p - d };
  };
  
  const assoc = byFund('assoc');
  const death = byFund('death');
  const donation = byFund('donation');
  
  return {
    assoc, death, donation,
    all: {
      collected: assoc.collected + death.collected + donation.collected,
      delivered: assoc.delivered + death.delivered + donation.delivered,
      pending: assoc.pending + death.pending + donation.pending,
      balance: assoc.balance + death.balance + donation.balance
    }
  };
}

/* ═══ بطاقة محفظة (للمشترك) ═══ */
function renderWalletBlock(fundKey, data) {
  const fund = FUNDS[fundKey];
  const due = data.due;
  const paid = data.paid;
  const balance = data.balance;
  const status = data.status;
  
  let statusLabel = '';
  let statusClass = '';
  
  if (status === WALLET_STATUS.PAID) { statusLabel = '✅ مسدَّد'; statusClass = 'paid'; }
  else if (status === WALLET_STATUS.PARTIAL) { statusLabel = '⏳ جزئي'; statusClass = 'due'; }
  else if (status === WALLET_STATUS.DUE) { statusLabel = '⚠️ متأخر'; statusClass = 'due'; }
  else if (status === WALLET_STATUS.CREDIT) { statusLabel = '💚 رصيد'; statusClass = 'paid'; }
  else if (status === WALLET_STATUS.EXEMPT) { statusLabel = '🎗️ معفى'; statusClass = 'paid'; }
  else { statusLabel = '— لا شيء'; statusClass = 'paid'; }
  
  let html = '<div class="wallet-block ' + fund.color + '">';
  html += '<div class="wallet-head">';
  html += '<div class="icon">' + fund.icon + '</div>';
  html += '<div class="title"><b>' + fund.name + '</b>';
  html += '<small>المطلوب: ' + fmtNum(due) + ' • المدفوع: ' + fmtNum(paid) + '</small>';
  html += '</div>';
  html += '<div class="status ' + statusClass + '">' + statusLabel + '</div>';
  html += '</div>';
  
  if (due > 0 || paid > 0) {
    html += '<div class="balance-row"><span class="lbl">الرصيد</span>';
    const bc = balance > 0 ? 'red' : 'green';
    html += '<span class="val ' + bc + '">' + (balance > 0 ? '-' + fmtNum(balance) : balance < 0 ? '+' + fmtNum(-balance) : '0') + ' ل.س</span>';
    html += '</div>';
    
    if (due > 0) {
      const pct = Math.min(100, Math.round((paid / due) * 100));
      html += '<div class="progress ' + fund.color + '"><div style="width:' + pct + '%"></div></div>';
    }
  }
  
  html += '</div>';
  return html;
}

/* ═══ دفتر الصندوق (مبسط - للتوسيع لاحقاً) ═══ */
function getFundYearsLocal(fund) {
  const years = [2025, 2026, 2027, 2028, 2029];
  const opening = getOpeningBalance();
  const openingVal = Number(opening[fund]) || 0;
  let cum = openingVal;
  const result = [];
  
  for (const y of years) {
    const sum = arr => arr.reduce((s, x) => s + (Number(x.amount) || 0), 0);
    
    const payments = S.payments.filter(p => Number(p.forYear || p.year) === y && p.fund === fund);
    const incomes = S.incomes.filter(i => Number(i.year) === y && i.fund === fund);
    const expenses = S.expenses.filter(e => Number(e.year) === y && e.fund === fund);
    const compensationsList = fund === 'death' ? S.deaths.filter(d => Number(d.year) === y) : [];
    
    const collected = sum(payments);
    const totalIncomes = sum(incomes);
    const totalExpenses = sum(expenses);
    const totalComp = compensationsList.reduce((s, d) => s + (Number(d.compensation) || 0), 0);
    
    const net = collected + totalIncomes - totalExpenses - totalComp;
    cum += net;
    
    if (collected !== 0 || totalIncomes !== 0 || totalExpenses !== 0 || totalComp !== 0) {
      result.push({
        year: y,
        collected, incomes: totalIncomes,
        expenses: totalExpenses, compensations: totalComp,
        net, cumulative: cum
      });
    }
  }
  
  return { opening: openingVal, years: result, total: cum };
}

async function saveDeliver(fundKey) {
  const amount = Number($('delAmount').value);
  const notes = cleanText($('delNotes').value);
  
  if (!amount || amount <= 0) { toast('المبلغ مطلوب', 'error'); return; }
  
  const custody = getUserCustody(S.currentUser.id);
  if (amount > custody[fundKey].balance) {
    toast('المبلغ أكبر من العهدة', 'error');
    return;
  }
  
  const amirRoleKey = fundKey === 'death' ? 'deathTreasurer' : 'assocTreasurer';
  const amir = S.users.find(u => u.role === amirRoleKey);
  
  try {
    const delivery = {
      fromUserId: S.currentUser.id,
      fromUserName: S.currentUser.name,
      toUserId: amir ? amir.id : null,
      toUserName: amir ? amir.name : 'الأمين المختص',
      fund: fundKey,
      amount: amount,
      notes: notes,
      date: today(),
      status: 'pending',
      createdAt: new Date().toISOString()
    };
    
    const id = await dbPut('deliveries', delivery);
    delivery.id = id;
    S.deliveries.push(delivery);
    
    CACHE.invalidateAll();
    await logAudit('add', 'delivery', id, { amount: amount, fund: fundKey });
    
    toast('✅ تم التسليم', 'success', 2500);
    closeSheetAll();
    go(S.page);
  } catch (e) {
    toast('خطأ: ' + e.message, 'error');
  }
}

    else if (st === 'منسحب') counts.withdrawn++;
    else if (st === 'متوقف') counts.frozen++;
    else if (st === 'معفى') counts.unsubscribed++;
    else {

  html += '<div class="chips" style="margin-bottom:8px">';
