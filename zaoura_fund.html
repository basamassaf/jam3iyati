<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>صندوق زعورة</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#7c3aed;--primary-2:#6d28d9;--primary-soft:#f5f3ff;--primary-dark:#4c1d95;
  --assoc:#2563eb;--assoc-soft:#dbeafe;
  --death:#dc2626;--death-soft:#fee2e2;
  --donation:#16a34a;--donation-soft:#dcfce7;
  --success:#16a34a;--danger:#dc2626;--warning:#f59e0b;--info:#2563eb;--muted:#64748b;
  --bg:#f8fafc;--card:#ffffff;--text:#0f172a;--border:#e2e8f0;
  --radius:16px;--shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow:0 8px 24px rgba(15,23,42,.08);--shadow-lg:0 20px 60px rgba(15,23,42,.2);
  --safe:env(safe-area-inset-bottom,0);
}
[data-theme="dark"]{
  --bg:#0b1220;--card:#1e293b;--text:#e2e8f0;--border:#334155;
  --primary-soft:#2e1065;--assoc-soft:#1e3a8a;--death-soft:#7f1d1d;--donation-soft:#14532d;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;background:var(--bg);color:var(--text);direction:rtl;font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:calc(78px + var(--safe));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{outline:0}

.app-header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0));display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(124,58,237,.3)}
.app-header .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.app-header .logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.app-header .brand-text{flex:1;min-width:0}
.app-header h1{font-size:16px;font-weight:800;line-height:1.1}
.app-header .sub{font-size:10px;opacity:.85;font-weight:600;margin-top:2px}
.app-header .icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.15s;flex-shrink:0}
.app-header .icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.25)}

.user-banner{background:var(--card);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;position:sticky;top:60px;z-index:29}
.user-banner .who{display:flex;align-items:center;gap:8px;color:var(--muted)}
.user-banner .who b{color:var(--text)}
.role-badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;background:var(--primary-soft);color:var(--primary)}

.search-wrap{padding:10px 12px 0;max-width:900px;margin:0 auto}
.search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow-sm)}
.search-box .ico{color:var(--muted);font-size:17px}
.search-box input{flex:1;background:none;border:0;font-size:15px;min-width:0}
.search-box .clear{color:var(--muted);font-size:18px;padding:4px}

main{max-width:900px;margin:0 auto;padding:12px}
.page{display:none;animation:fade .2s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-head h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}

.stats-scroll{display:flex;gap:10px;overflow-x:auto;margin:0 -12px 14px;padding:0 12px 6px;scrollbar-width:none}
.stats-scroll::-webkit-scrollbar{display:none}
.stat{flex:0 0 auto;min-width:130px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--primary)}
.stat.assoc::before{background:var(--assoc)}.stat.death::before{background:var(--death)}
.stat.donation::before{background:var(--donation)}.stat.green::before{background:var(--success)}
.stat.red::before{background:var(--danger)}.stat.orange::before{background:var(--warning)}
.stat.blue::before{background:var(--info)}
.stat .val{font-size:22px;font-weight:800;line-height:1.1;color:var(--primary);word-break:break-all}
.stat.assoc .val{color:var(--assoc)}.stat.death .val{color:var(--death)}
.stat.donation .val{color:var(--donation)}.stat.green .val{color:var(--success)}
.stat.red .val{color:var(--danger)}.stat.orange .val{color:var(--warning)}.stat.blue .val{color:var(--info)}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600}

.list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s;min-height:64px}
.item:last-child{border-bottom:0}
.item:active{background:var(--bg)}
.item .av{width:46px;height:46px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--primary-soft);color:var(--primary);font-weight:800;overflow:hidden}
.item .av.blue{background:var(--assoc-soft);color:var(--assoc)}
.item .av.red{background:var(--death-soft);color:var(--death)}
.item .av.green{background:var(--donation-soft);color:var(--donation)}
.item .av.orange{background:#fef3c7;color:#92400e}
.item .av.gray{background:#f1f5f9;color:#475569}
.item .body{flex:1;min-width:0}
.item .ttl{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .sub{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .trail{color:var(--muted);font-size:20px;font-weight:300;flex-shrink:0}

.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap}
.badge.success{background:#dcfce7;color:#166534}.badge.danger{background:#fee2e2;color:#991b1b}
.badge.warning{background:#fef3c7;color:#92400e}.badge.info{background:#dbeafe;color:#1e40af}
.badge.muted{background:#f1f5f9;color:#475569}.badge.primary{background:var(--primary-soft);color:var(--primary)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--muted);transition:.15s}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:13px;font-size:14px;font-weight:700;transition:.15s;min-height:44px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff}.btn.assoc{background:var(--assoc);color:#fff}
.btn.death{background:var(--death);color:#fff}.btn.donation{background:var(--donation);color:#fff}
.btn.success{background:var(--success);color:#fff}.btn.danger{background:var(--danger);color:#fff}
.btn.warning{background:var(--warning);color:#fff}.btn.info{background:var(--info);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:12px;border-radius:10px}
.btn.block{display:flex;width:100%}

.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border-radius:14px;background:var(--card);border:2px solid var(--border);cursor:pointer;transition:.15s;text-align:center}
.quick-btn:active{transform:scale(.97);border-color:var(--primary)}
.quick-btn .ico{font-size:28px;line-height:1}
.quick-btn .lbl{font-size:12px;font-weight:800;color:var(--text)}
.quick-btn.assoc{border-color:var(--assoc)}.quick-btn.assoc .lbl{color:var(--assoc)}
.quick-btn.death{border-color:var(--death)}.quick-btn.death .lbl{color:var(--death)}
.quick-btn.donation{border-color:var(--donation)}.quick-btn.donation .lbl{color:var(--donation)}

.fab{position:fixed;bottom:calc(88px + var(--safe));left:18px;width:60px;height:60px;border-radius:20px;background:var(--primary);color:#fff;font-size:28px;font-weight:300;box-shadow:0 12px 32px rgba(124,58,237,.5);z-index:25;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.92)}

.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe));box-shadow:0 -4px 20px rgba(15,23,42,.05)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:10px;font-weight:700;transition:.15s;position:relative;min-width:0}
.bnav button .i{font-size:22px;line-height:1;transition:.15s}
.bnav button.on{color:var(--primary)}
.bnav button.on .i{transform:scale(1.1)}

.sheet-back{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:10100;opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(3px)}
.sheet-back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:10101;background:var(--card);border-radius:24px 24px 0 0;max-height:94vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(16px + var(--safe));box-shadow:0 -20px 60px rgba(15,23,42,.2)}
.sheet.on{transform:translateY(0)}
.sheet.wide{max-height:98vh}
.sheet-grip{width:44px;height:5px;background:var(--border);border-radius:3px;margin:12px auto 0}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2;border-radius:24px 24px 0 0}
.sheet-hd h2{font-size:16px;font-weight:800}
.sheet-bd{padding:16px 18px}
.sheet-ft{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
.sheet-ft .btn{flex:1;min-width:90px}

.fld{margin-bottom:14px;position:relative}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld label .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{width:100%;padding:12px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;font-size:15px;transition:.15s;font-family:inherit}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--primary);background:var(--card);box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.fld textarea{resize:vertical;min-height:70px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld-hint{font-size:11px;color:var(--muted);margin-top:4px}
.fld-readonly{background:var(--primary-soft)!important;color:var(--primary);font-weight:700}

.options-list{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1.5px solid var(--primary);border-radius:12px;max-height:250px;overflow-y:auto;z-index:100;box-shadow:var(--shadow);margin-top:4px;display:none}
.options-list.on{display:block}
.option-item{padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--border);font-size:14px}
.option-item:hover,.option-item:active{background:var(--primary-soft)}
.option-item:last-child{border-bottom:0}
.option-item small{color:var(--muted);font-size:11px;flex-shrink:0}

.amount-input{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--primary);border-radius:14px;padding:8px 16px}
.amount-input input{flex:1;border:0;background:none;font-size:26px;font-weight:800;color:var(--primary);text-align:center;padding:8px 0}
.amount-input .currency{font-size:14px;font-weight:800;color:var(--muted)}
.amount-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.amount-quick button{padding:6px 12px;border-radius:10px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700}
.amount-quick button:active{transform:scale(.95)}

.balance-block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.balance-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
.balance-row:last-child{border-bottom:0}
.balance-row .lbl{color:var(--muted)}
.balance-row .val{font-weight:800}
.balance-row .val.green{color:var(--success)}
.balance-row .val.red{color:var(--danger)}
.balance-row .val.orange{color:var(--warning)}

.progress{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:8px}
.progress > div{height:100%;border-radius:5px;transition:width .4s ease}
.progress.assoc > div{background:var(--assoc)}
.progress.death > div{background:var(--death)}
.progress.green > div{background:var(--success)}
.progress.warning > div{background:var(--warning)}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ico{font-size:52px;opacity:.4;display:block;margin-bottom:10px}
.empty h3{font-size:15px;font-weight:700;margin-bottom:4px;color:var(--text)}
.empty p{font-size:12px}

.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10200;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 28px);max-width:400px}
.toast{background:var(--text);color:var(--card);padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);animation:slideDown .25s ease;pointer-events:auto}
.toast.success{background:var(--success);color:#fff}.toast.error{background:var(--danger);color:#fff}
.toast.warning{background:var(--warning);color:#fff}.toast.info{background:var(--info);color:#fff}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

.loader{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(3px);z-index:10300;display:none;align-items:center;justify-content:center}
.loader.on{display:flex}
.spin{width:42px;height:42px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.login-screen{position:fixed;inset:0;z-index:10000;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.login-screen.on{display:flex}
.login-card{background:var(--card);color:var(--text);border-radius:24px;padding:28px 24px;max-width:400px;width:100%;box-shadow:var(--shadow-lg);margin:auto}
.login-card .logo-lg{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;margin:0 auto 16px}
.login-card h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:4px}
.login-card .sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:24px}
.users-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto}
.login-user{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--bg);border:2px solid transparent;cursor:pointer;transition:.15s}
.login-user:active{transform:scale(.98);border-color:var(--primary);background:var(--primary-soft)}
.login-user .av{width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0}
.login-user .info{flex:1;min-width:0}
.login-user .nm{font-weight:700;font-size:14px}
.login-user .role{font-size:11px;color:var(--muted);margin-top:2px}

.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.pin-btn{padding:16px;border-radius:14px;background:var(--bg);font-size:20px;font-weight:800;transition:.15s}
.pin-btn:active{transform:scale(.95);background:var(--primary-soft)}
.pin-display{display:flex;justify-content:center;gap:10px;margin:20px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--border);transition:.2s}
.pin-dot.on{background:var(--primary);transform:scale(1.2)}

@media print{.app-header,.bnav,.fab,.search-wrap,.user-banner{display:none!important}main{padding:0;max-width:100%}body{background:#fff;padding-bottom:0}}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="logo-lg">🏘️</div>
    <h1>صندوق زعورة</h1>
    <div class="sub">نظام إدارة الاشتراكات والتكافل</div>
    <div id="loginUsers">
      <div class="users-list" id="loginUsersList"></div>
      <button class="btn ghost block" style="margin-top:14px" onclick="showAddFirstAdmin()">⚙️ إعداد أول مرة (إضافة مدير)</button>
    </div>
    <div id="loginPin" style="display:none">
      <div style="text-align:center;margin-bottom:12px">
        <div style="font-size:44px" id="pinAvatar">👤</div>
        <div style="font-weight:800;font-size:16px;margin-top:6px" id="pinName">—</div>
        <div style="font-size:11px;color:var(--muted)" id="pinRole">—</div>
      </div>
      <div class="pin-display" id="pinDisplay">
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
      </div>
      <div style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:12px;min-height:18px" id="pinError"></div>
      <div class="pin-pad">
        <button class="pin-btn" onclick="pinPress('1')">1</button>
        <button class="pin-btn" onclick="pinPress('2')">2</button>
        <button class="pin-btn" onclick="pinPress('3')">3</button>
        <button class="pin-btn" onclick="pinPress('4')">4</button>
        <button class="pin-btn" onclick="pinPress('5')">5</button>
        <button class="pin-btn" onclick="pinPress('6')">6</button>
        <button class="pin-btn" onclick="pinPress('7')">7</button>
        <button class="pin-btn" onclick="pinPress('8')">8</button>
        <button class="pin-btn" onclick="pinPress('9')">9</button>
        <button class="pin-btn" onclick="pinBack()" style="font-size:16px">⌫</button>
        <button class="pin-btn" onclick="pinPress('0')">0</button>
        <button class="pin-btn" onclick="pinBackLogin()" style="font-size:14px">↩️</button>
      </div>
    </div>
  </div>
</div>

<header class="app-header" id="appHeader" style="display:none">
  <div class="brand">
    <div class="logo">🏘️</div>
    <div class="brand-text">
      <h1>صندوق زعورة</h1>
      <div class="sub" id="hdrYear">— السنة</div>
    </div>
  </div>
  <button class="icon-btn" onclick="openStatsSheet()">📊</button>
  <button class="icon-btn" onclick="toggleTheme()">🌓</button>
  <button class="icon-btn" onclick="openSettingsSheet()">⚙️</button>
</header>

<div class="user-banner" id="userBanner" style="display:none">
  <div class="who">
    <span>👤 أنت:</span>
    <b id="currentUserName">—</b>
    <span class="role-badge" id="currentUserRole">—</span>
  </div>
  <button class="btn ghost sm" onclick="logout()">🚪 خروج</button>
</div>

<div class="search-wrap" id="searchWrap" style="display:none">
  <div class="search-box">
    <span class="ico">🔍</span>
    <input id="globalSearch" placeholder="ابحث بالاسم، الكود، رقم الهاتف…" oninput="globalSearch(this.value)">
    <button class="clear" onclick="clearSearch()" style="display:none" id="searchClear">✕</button>
  </div>
</div>

<main id="appMain" style="display:none">
  <section id="pg-home" class="page active">
    <div class="stats-scroll" id="homeStats"></div>
    <div class="card">
      <div class="card-head"><h2>⚡ إجراءات سريعة</h2></div>
      <div class="quick-actions" id="homeQuickActions"></div>
    </div>
    <div class="card" id="budgetCard">

'use strict';

/* ═══════════════════════════════════════════════════════

   الجزء 2: الأساس + DB + الأدوات + الدخول + الصلاحيات

const DB_NAME = 'zaoura_fund_v3';
const DB_VERSION = 1;
const STORE_NAMES = [

  'assocPayments','deathEvents','deathInstallments','donations',

const ROLES = {

const PERMISSIONS = {
  president:      ['payment.add','death.add','donation.add','handover.receive','person.manage','subscription.manage','exemptions.manage','constants.manage','admins.manage','expenses.manage','reports.all','audit.view','payments.edit','store.manage','meetings.manage'],
  manager:        ['payment.add','death.add','donation.add','handover.receive','person.manage','subscription.manage','exemptions.manage','expenses.manage','reports.all','audit.view','payments.edit','store.manage','meetings.manage'],
  assocTreasurer: ['payment.add','donation.add','handover.receive','reports.assoc','store.manage'],
  deathTreasurer: ['payment.add','death.add','handover.receive','reports.death'],

const DEFAULT_SECTORS = [
  { id:'S1', name:'الجبل',    order:1 },
  { id:'S2', name:'الحارة1',  order:2 },
  { id:'S3', name:'الحارة2',  order:3 },

  { id:'S5', name:'المنصورة', order:5 },

];

const STATUS = {

};

const S = {

/* ═══════════════════════════════════════════════════════
   INDEXEDDB
   ═══════════════════════════════════════════════════════ */
let db = null;

function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORE_NAMES.forEach(n => {
        if(!d.objectStoreNames.contains(n)){
          d.createObjectStore(n, { keyPath:'id', autoIncrement:true });
        }
      });
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}

const tx = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
const dbAll = s => new Promise((res, rej) => { const q = tx(s).getAll(); q.onsuccess = () => res(q.result||[]); q.onerror = () => rej(q.error); });
const dbGet = (s, id) => new Promise((res, rej) => { const q = tx(s).get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const dbPut = (s, o) => new Promise((res, rej) => { const q = tx(s,'readwrite').put(o); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const dbDel = (s, id) => new Promise((res, rej) => { const q = tx(s,'readwrite').delete(id); q.onsuccess = () => res(); q.onerror = () => rej(q.error); });
const dbClear = s => new Promise((res, rej) => { const q = tx(s,'readwrite').clear(); q.onsuccess = () => res(); q.onerror = () => rej(q.error); });

/* ═══════════════════════════════════════════════════════
   الأدوات
   ═══════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const cleanText = v => String(v ?? '').trim().replace(/\s+/g,' ');
const normAr = v => String(v ?? '').toLowerCase().trim()
  .replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/[ىي]/g,'ي').replace(/[ًٌٍَُِّْـ]/g,'');
const cleanPhone = v => {
  if(!v) return '';
  let s = String(v).trim().replace(/\.0+$/,'').replace(/[\s\-\(\)\u200f\u200e]/g,'');
  if(s.startsWith('+963')) s = '0' + s.slice(4);
  return s;
};
const today = () => new Date().toISOString().slice(0,10);
const debounce = (fn, d = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), d); }; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function fmtDate(d){
  if(!d) return '—';
  try{ return new Date(d).toLocaleDateString('ar-EG',{ year:'numeric', month:'short', day:'numeric' }); }
  catch(e){ return d; }
}

function toDate(v){
  if(!v) return '';
  if(typeof v === 'string' && v.trim().startsWith('=')) return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number'){ const d = new Date((v-25569)*86400000); return isNaN(d)?'':d.toISOString().slice(0,10); }
  const s = String(v).trim();
  const m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]|$)/);
  if(m1) return `${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;
  const m2 = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m2) return `${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
  const d = new Date(s);
  if(!isNaN(d) && d.getFullYear() > 1900 && d.getFullYear() < 2100) return d.toISOString().slice(0,10);
  return '';
}

function calcAge(birth){
  if(!birth) return '';
  const b = new Date(birth); if(isNaN(b)) return '';
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  if(now.getMonth() < b.getMonth() || (now.getMonth() === b.getMonth() && now.getDate() < b.getDate())) age--;
  return age >= 0 ? age : '';
}

function fmtNum(n){
  if(n === null || n === undefined || n === '') return '0';
  const num = Number(n); if(isNaN(num)) return '0';
  return num.toLocaleString('en-US');
}
const fmtMoney = n => fmtNum(n) + ' ل.س';
function fmtShort(n){
  if(!n && n !== 0) return '0';
  const num = Number(n);
  if(num >= 1000000) return (num/1000000).toFixed(1) + 'M';
  if(num >= 1000) return (num/1000).toFixed(1) + 'K';
  return String(num);
}

/* ═══════════════════════════════════════════════════════
   TOAST + LOADER + SHEET
   ═══════════════════════════════════════════════════════ */
function toast(msg, type = 'success', dur = 2800){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0'; el.style.transition = '.3s';
    setTimeout(() => el.remove(), 300);
  }, dur);
}
const showLoad = v => $('loader').classList.toggle('on', v);

function openSheet(title, bodyHTML, footHTML = '', opts = {}){
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = bodyHTML;
  $('sheetFoot').innerHTML = footHTML;
  $('sheetFoot').style.display = footHTML ? 'flex' : 'none';
  $('sheetBack').classList.add('on');
  $('sheet').classList.add('on');
  if(opts.wide) $('sheet').classList.add('wide');
  else $('sheet').classList.remove('wide');
  document.body.style.overflow = 'hidden';
  if(opts.focus) setTimeout(() => { const el = $(opts.focus); if(el) el.focus(); }, 250);
}

function closeSheet(){
  $('sheetBack').classList.remove('on');
  $('sheet').classList.remove('on');
  document.body.style.overflow = '';

/* ═══════════════════════════════════════════════════════
   الجلسة والصلاحيات
   ═══════════════════════════════════════════════════════ */
function saveCurrentUser(u){
  S.currentUser = u;
  if(u) localStorage.setItem('zt_fund_user', JSON.stringify({ id:u.id, name:u.name, role:u.role, sectorId:u.sectorId||null }));
  else localStorage.removeItem('zt_fund_user');
}
function restoreCurrentUser(){
  try{
    const s = localStorage.getItem('zt_fund_user');
    return s ? JSON.parse(s) : null;
  } catch(e){ return null; }
}
function hasPerm(p){
  if(!S.currentUser) return false;
  const perms = PERMISSIONS[S.currentUser.role] || [];
  return perms.includes(p);
}
const getPersonById = id => S.people.find(p => p.id === id);
const getSectorById = id => S.sectors.find(s => s.id === id);

/* ═══════════════════════════════════════════════════════
   تسجيل الدخول
   ═══════════════════════════════════════════════════════ */
let _pinAttempt = '';
let _pinTargetUser = null;

function renderLoginScreen(){
  _pinAttempt = ''; _pinTargetUser = null;
  $('loginUsers').style.display = 'block';
  $('loginPin').style.display = 'none';
  const list = $('loginUsersList');

  if(S.admins.length === 0){
    list.innerHTML = `
      <div style="text-align:center;padding:24px 12px">
        <div style="font-size:52px;margin-bottom:12px">🏘️</div>
        <div style="font-weight:800;font-size:15px;margin-bottom:6px">مرحباً بك</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.7">
          هذه أول مرة يُفتح فيها التطبيق.<br>ابدأ بإضافة مدير للنظام.
        </div>
      </div>`;
    return;
  }

  list.innerHTML = S.admins.map(u => {
    const r = ROLES[u.role] || { name:'مستخدم', icon:'👤' };
    const sec = u.sectorId ? getSectorById(u.sectorId) : null;
    const secTxt = sec ? ' • ' + sec.name : '';
    return `<div class="login-user" onclick="selectLoginUser(${u.id})">
      <div class="av">${r.icon}</div>
      <div class="info">
        <div class="nm">${esc(u.name)}</div>
        <div class="role">${r.name}${secTxt}</div>
      </div>
      ${u.hasPin ? '<span style="font-size:18px;color:var(--muted)">🔒</span>' : '<span style="font-size:18px;color:var(--success)">🔓</span>'}
    </div>`;
  }).join('');
}

function selectLoginUser(id){
  const u = S.admins.find(a => a.id === id);
  if(!u) return;
  _pinTargetUser = u; _pinAttempt = '';
  if(!u.hasPin){ doLogin(u); return; }
  $('loginUsers').style.display = 'none';
  $('loginPin').style.display = 'block';
  const r = ROLES[u.role] || { name:'مستخدم', icon:'👤' };
  $('pinAvatar').textContent = r.icon;
  $('pinName').textContent = u.name;
  $('pinRole').textContent = r.name;
  $('pinError').textContent = '';
  updatePinDisplay();
}

function pinPress(d){
  if(_pinAttempt.length >= 4) return;
  _pinAttempt += d;
  updatePinDisplay();
  if(_pinAttempt.length === 4) setTimeout(checkPin, 200);
}
function pinBack(){ _pinAttempt = _pinAttempt.slice(0,-1); updatePinDisplay(); $('pinError').textContent = ''; }
function pinBackLogin(){ $('loginPin').style.display = 'none'; $('loginUsers').style.display = 'block'; _pinAttempt = ''; _pinTargetUser = null; }
function updatePinDisplay(){
  document.querySelectorAll('#pinDisplay .pin-dot').forEach((d,i) => d.classList.toggle('on', i < _pinAttempt.length));
}
function checkPin(){
  if(!_pinTargetUser) return;
  if(_pinAttempt === String(_pinTargetUser.pin)){
    $('pinError').textContent = '✅ صحيح';
    $('pinError').style.color = 'var(--success)';
    setTimeout(() => doLogin(_pinTargetUser), 400);
  } else {
    $('pinError').textContent = '❌ خطأ، حاول مجدداً';
    $('pinError').style.color = 'var(--danger)';
    _pinAttempt = '';
    updatePinDisplay();
    if(navigator.vibrate) navigator.vibrate(200);
  }
}

function doLogin(u){
  S.currentUser = u;
  saveCurrentUser(u);
  u.lastLogin = new Date().toISOString();
  dbPut('admins', u).catch(() => {});
  logAudit('login', 'admin', u.id, { name:u.name });
  toast('👋 مرحباً ' + u.name, 'success', 2500);
  showMainApp();
}

async function saveFirstAdmin(){
  const name = cleanText($('firstAdminName').value);
  const phone = cleanPhone($('firstAdminPhone').value);
  const pin = $('firstAdminPin').value.trim();
  const pin2 = $('firstAdminPin2').value.trim();
  if(!name){ toast('الاسم مطلوب', 'error'); return; }
  if(!/^\d{4}$/.test(pin)){ toast('كلمة المرور: 4 أرقام بالضبط', 'error'); return; }
  if(pin !== pin2){ toast('كلمتا المرور غير متطابقتين', 'error'); return; }

  try{
    const admin = {
      name, phone, pin, hasPin:true, role:'president', sectorId:null,
      createdAt: new Date().toISOString(), lastLogin:null, active:true
    };
    const newId = await dbPut('admins', admin);
    admin.id = newId;
    S.admins.push(admin);
    closeSheet();
    toast('✅ تم إنشاء المدير بنجاح', 'success', 3000);
    setTimeout(renderLoginScreen, 400);
  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
}

async function saveAdmin(id = null){
  const name = cleanText($('adminName').value);
  const phone = cleanPhone($('adminPhone').value);
  const role = $('adminRole').value;
  const sectorId = $('adminSector').value || null;
  const pin = $('adminPin').value.trim();
  if(!name){ toast('الاسم مطلوب', 'error'); return; }
  if(pin && !/^\d{4}$/.test(pin)){ toast('كلمة المرور: 4 أرقام بالضبط', 'error'); return; }

  try{
    const old = id ? await dbGet('admins', id) : null;
    const admin = {
      name, phone, role,
      sectorId: role === 'collector' ? sectorId : null,
      hasPin: pin ? true : (old ? old.hasPin : false),
      pin: pin ? pin : (old ? old.pin : null),
      updatedAt: new Date().toISOString(),
      createdAt: old ? old.createdAt : new Date().toISOString(),
      lastLogin: old ? old.lastLogin : null,
      active: old ? old.active : true
    };
    if(id){
      admin.id = id;
      await dbPut('admins', admin);
      const i = S.admins.findIndex(a => a.id === id);
      if(i > -1) S.admins[i] = admin;
      logAudit('update', 'admin', id, { name });
      toast('✅ تم التعديل');
    } else {
      const nid = await dbPut('admins', admin);
      admin.id = nid;
      S.admins.push(admin);
      logAudit('add', 'admin', nid, { name });
      toast('✅ تمت الإضافة');
    }
    closeSheet();
    setTimeout(openAdminsSheet, 250);
    if(S.currentUser && S.currentUser.id === id){
      S.currentUser = admin;
      saveCurrentUser(admin);
      showMainApp();
    }
  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
}

async function deleteAdmin(id){
  if(!confirm('حذف هذا الإداري؟')) return;
  if(!confirm('تأكيد نهائي!')) return;
  try{
    const a = S.admins.find(x => x.id === id);
    if(!a) return;
    if(a.role === 'president'){
      const presidents = S.admins.filter(x => x.role === 'president');
      if(presidents.length <= 1){ toast('⚠️ لا يمكن حذف الرئيس الوحيد', 'error', 3500); return; }
    }
    await dbDel('admins', id);
    S.admins = S.admins.filter(x => x.id !== id);
    logAudit('delete', 'admin', id, { name:a.name });
    toast('🗑️ تم الحذف');
    openAdminsSheet();
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function logAudit(action, target, targetId, details = {}){
  const entry = {
    timestamp: new Date().toISOString(),
    userId: S.currentUser ? S.currentUser.id : null,
    userName: S.currentUser ? S.currentUser.name : 'system',
    action, target, targetId, details
  };
  try{
    const id = await dbPut('auditLog', entry);
    entry.id = id;
    S.auditLog.push(entry);
    if(S.auditLog.length > 10000){
      const old = S.auditLog.slice(0, S.auditLog.length - 10000);
      for(const o of old) await dbDel('auditLog', o.id);
      S.auditLog = S.auditLog.slice(-10000);
    }
  } catch(e){ console.warn(e); }
}

   دوال حساب المستحقات

function computeMemberDues(personId, year){
  const person = getPersonById(personId);
  if(!person) return null;

  const c = S.constants.find(x => x.year === year);
  if(!c) return null;

  const result = {
    year,
    assoc: { applicable:false, required:0, paid:0, remaining:0, percent:0, joinFee:0, joinFeePaid:0, joinFeeRemaining:0, isJoinYear:false },
    death: { applicable:false, required:0, paid:0, remaining:0, percent:0, installments:[], joinFee:0, joinFeePaid:0, joinFeeRemaining:0, isJoinYear:false },
    total: { required:0, paid:0, remaining:0 }
  };

  // ═══ الجمعية ═══
  const assocStart = person.joinedAssocYear || 9999;
  if(year >= assocStart && person.joinedAssocYear){
    result.assoc.applicable = true;
    result.assoc.isJoinYear = (year === assocStart);

    const type = person.memberTypeAssoc || 'عادي';
    result.assoc.required = (type === 'مخفض' && c.assocYearlyReduced)
      ? c.assocYearlyReduced
      : (c.assocYearly || 24000);

    result.assoc.paid = S.assocPayments
      .filter(p => p.personId === personId && p.year === year && (!p.fund || p.fund === 'assoc'))
      .reduce((s, p) => s + (Number(p.amount) || 0), 0);

    result.assoc.remaining = Math.max(0, result.assoc.required - result.assoc.paid);
    result.assoc.percent = result.assoc.required > 0
      ? Math.min(100, Math.round(result.assoc.paid / result.assoc.required * 100))
      : 0;

    // رسوم الانضمام
    if(result.assoc.isJoinYear){
      result.assoc.joinFee = (type === 'مخفض' && c.joinAssocReduced)
        ? c.joinAssocReduced
        : (c.joinAssoc || 100000);

      result.assoc.joinFeePaid = S.assocPayments
        .filter(p => p.personId === personId && p.fund === 'joinAssoc')
        .reduce((s, p) => s + (Number(p.amount) || 0), 0);

      result.assoc.joinFeeRemaining = Math.max(0, result.assoc.joinFee - result.assoc.joinFeePaid);
    }
  }

  // ═══ الوفاة ═══
  const deathStart = person.joinedDeathYear || 9999;
  if(year >= deathStart && person.joinedDeathYear){
    result.death.applicable = true;
    result.death.isJoinYear = (year === deathStart);

    const insts = S.deathInstallments.filter(i => i.personId === personId && i.year === year);
    result.death.installments = insts.map(i => ({
      id: i.id, eventName: i.eventName, deathDate: i.deathDate,
      amount: Number(i.amount) || 0, status: i.status, paidDate: i.paidDate
    }));

    result.death.required = insts.reduce((s, i) => s + (Number(i.amount) || 0), 0);
    result.death.paid = insts.filter(i => i.status === 'paid')
      .reduce((s, i) => s + (Number(i.amount) || 0), 0);
    result.death.remaining = result.death.required - result.death.paid;
    result.death.percent = result.death.required > 0
      ? Math.min(100, Math.round(result.death.paid / result.death.required * 100))
      : 0;

    // رسوم الانضمام
    if(result.death.isJoinYear){
      const type = person.memberTypeDeath || 'عادي';
      result.death.joinFee = (type === 'مخفض' && c.joinDeathReduced)
        ? c.joinDeathReduced
        : (c.joinDeath || 50000);

      result.death.joinFeePaid = S.assocPayments
        .filter(p => p.personId === personId && p.fund === 'joinDeath')
        .reduce((s, p) => s + (Number(p.amount) || 0), 0);

      result.death.joinFeeRemaining = Math.max(0, result.death.joinFee - result.death.joinFeePaid);
    }
  }

  // ═══ الإجمالي ═══
  result.total.required = result.assoc.required + result.assoc.joinFee
                        + result.death.required + result.death.joinFee;
  result.total.paid = result.assoc.paid + result.assoc.joinFeePaid
                    + result.death.paid + result.death.joinFeePaid;
  result.total.remaining = result.total.required - result.total.paid;

  return result;
}

function computeMemberFullHistory(personId){
  const person = getPersonById(personId);
  if(!person) return null;

  const startYear = Math.min(
    person.joinedAssocYear || 9999,
    person.joinedDeathYear || 9999
  );

  if(startYear === 9999){
    return { person, history:[], grandTotal:{ required:0, paid:0, remaining:0 } };
  }

  const history = [];
  for(let y = startYear; y <= S.currentYear; y++){
    const dues = computeMemberDues(personId, y);
    if(dues) history.push(dues);
  }

  const grandTotal = history.reduce((acc, h) => ({
    required: acc.required + h.total.required,
    paid: acc.paid + h.total.paid,
    remaining: acc.remaining + h.total.remaining
  }), { required:0, paid:0, remaining:0 });

  return { person, history, grandTotal };
}

function getMemberClassification(person){
  if(!person) return 'unknown';
  const startYear = Math.min(
    person.joinedAssocYear || 9999,
    person.joinedDeathYear || 9999
  );
  if(startYear === 9999) return 'not-member';
  if(startYear < 2025) return 'old';
  return 'new';
}

function getSubscribersCount(year){
  const y = year || S.currentYear;
  const subs = S.subscriptions.filter(s => s.year === y);
  const assocActive = subs.filter(s => s.assocStatus === 'active');
  const deathActive = subs.filter(s => s.deathStatus === 'active');
  const bothActive = subs.filter(s => s.assocStatus === 'active' && s.deathStatus === 'active');
  return {
    year: y, total: S.people.length,
    assoc: { active: assocActive.length },
    death: { active: deathActive.length },
    bothActive: bothActive.length
  };
}

function getFinancialSummary(year){
  const y = year || S.currentYear;
  const assocIncome = S.assocPayments.filter(p => p.year === y && (!p.fund || p.fund === 'assoc')).reduce((s,p) => s + (Number(p.amount)||0), 0);
  const joinAssocIncome = S.assocPayments.filter(p => p.year === y && p.fund === 'joinAssoc').reduce((s,p) => s + (Number(p.amount)||0), 0);
  const deathIncome = S.assocPayments.filter(p => p.year === y && p.fund === 'death').reduce((s,p) => s + (Number(p.amount)||0), 0);
  const joinDeathIncome = S.assocPayments.filter(p => p.year === y && p.fund === 'joinDeath').reduce((s,p) => s + (Number(p.amount)||0), 0);
  const donationsIncome = S.donations.filter(d => d.year === y).reduce((s,d) => s + (Number(d.amount)||0), 0);
  const assocExpenses = S.expenses.filter(e => e.year === y).reduce((s,e) => s + (Number(e.amount)||0), 0);
  const deathCompensations = S.deathEvents.filter(e => e.year === y).reduce((s,e) => s + (Number(e.compensation)||0), 0);

  const totalIncome = assocIncome + joinAssocIncome + deathIncome + joinDeathIncome + donationsIncome;
  const totalOutcome = assocExpenses + deathCompensations;

  return {
    year: y,
    assoc: {
      income: assocIncome, joins: joinAssocIncome, donations: donationsIncome,
      expenses: assocExpenses,
      balance: assocIncome + joinAssocIncome + donationsIncome - assocExpenses,
      totalIncome: assocIncome + joinAssocIncome + donationsIncome
    },
    death: {
      income: deathIncome, joins: joinDeathIncome, compensations: deathCompensations,
      balance: deathIncome + joinDeathIncome - deathCompensations,
      totalIncome: deathIncome + joinDeathIncome
    },
    total: { income: totalIncome, outcome: totalOutcome, balance: totalIncome - totalOutcome }
  };
}

function setPeopleFilter(k){ S.filters.people = k; renderPeople(); }

function renderPeople(){
  const alive = S.people.filter(p => p.status === 'حي').length;
  const dead = S.people.filter(p => p.status === 'متوفى').length;
  const youth = S.people.filter(p => {
    const a = calcAge(p.birth);
    return a !== '' && a >= 18 && a <= 30 && p.status === 'حي';
  }).length;

  $('peopleStats').innerHTML = `
    <div class="stat"><div class="val">${S.people.length}</div><div class="lbl">الإجمالي</div></div>
    <div class="stat green"><div class="val">${alive}</div><div class="lbl">أحياء</div></div>
    <div class="stat red"><div class="val">${dead}</div><div class="lbl">متوفون</div></div>
    <div class="stat orange"><div class="val">${youth}</div><div class="lbl">🎓 شباب</div></div>
  `;

  const chips = [
    { k:'all', l:'الكل' }, { k:'alive', l:'🟢 أحياء' }, { k:'dead', l:'🔴 متوفون' },
    { k:'members', l:'⭐ مشتركون' }, { k:'non-members', l:'⚪ غير مشتركين' }
  ];
  $('peopleChips').innerHTML = chips.map(c =>
    `<button class="chip ${S.filters.people === c.k ? 'on' : ''}" onclick="setPeopleFilter('${c.k}')">${c.l}</button>`
  ).join('');

  let list = [...S.people];
  const q = S.search;

  if(S.filters.people === 'alive') list = list.filter(p => p.status === 'حي');
  if(S.filters.people === 'dead') list = list.filter(p => p.status === 'متوفى');
  if(S.filters.people === 'members') list = list.filter(p => p.joinedAssocYear || p.joinedDeathYear);
  if(S.filters.people === 'non-members') list = list.filter(p => !p.joinedAssocYear && !p.joinedDeathYear);

  if(q){
    const s = normAr(q);
    list = list.filter(p => normAr(`${p.name||''} ${p.code||''} ${p.phone||''} ${p.familyCode||''} ${p.sector||''}`).includes(s));
  }

  list.sort((a,b) => String(a.name).localeCompare(String(b.name),'ar'));

  const el = $('peopleContent');
  if(!list.length){
    el.innerHTML = `<div class="empty"><span class="ico">👥</span><h3>لا يوجد أفراد</h3><p>أضف فرداً أو استورد Excel</p></div>`;
    return;
  }

  el.innerHTML = `<div class="list">${list.slice(0, 300).map(p => {
    const age = calcAge(p.birth);
    const isDead = p.status === 'متوفى';
    const tags = [];
    if(p.joinedAssocYear) tags.push('💰');
    if(p.joinedDeathYear) tags.push('⚰️');
    if(p.memberTypeAssoc === 'مخفض' || p.memberTypeDeath === 'مخفض') tags.push('🎓');
    return `<div class="item" onclick="openPersonSheet(${p.id})">
      <div class="av ${isDead ? 'red' : (p.gender === 'أنثى' ? 'orange' : '')}">
        ${isDead ? '⚰️' : (p.gender === 'أنثى' ? '👩' : '👨')}
      </div>
      <div class="body">
        <div class="ttl">${esc(p.name)} <span style="font-size:12px">${tags.join(' ')}</span></div>
        <div class="sub">
          ${esc(p.code||'')}${age !== '' ? ' • ' + age + ' سنة' : ''} • ${esc(p.sector||'—')} • ${esc(p.relation||'')}
        </div>
      </div>
      <span class="trail">›</span>
    </div>`;
  }).join('')}</div>
  ${list.length > 300 ? `<div style="text-align:center;padding:14px;font-size:12px;color:var(--muted)">عرض أول 300 من ${list.length}</div>` : ''}`;
}

async function savePerson(id = null){
  if(!hasPerm('person.manage')){ toast('غير مصرح','error'); return; }
  const name = cleanText($('pName').value);
  if(!name){ toast('الاسم مطلوب','error'); return; }

  try{
    const old = id ? await dbGet('people', id) : null;
    const person = {
      code: cleanText($('pCode').value),
      familyCode: cleanText($('pFamilyCode').value),
      name,
      gender: $('pGender').value,
      status: $('pStatus').value,
      birth: $('pBirth').value,
      sector: $('pSector').value,
      relation: $('pRelation').value,
      phone: cleanPhone($('pPhone').value),
      notes: cleanText($('pNotes').value),
      joinedAssocYear: $('pJoinedAssoc').value ? Number($('pJoinedAssoc').value) : null,
      joinedDeathYear: $('pJoinedDeath').value ? Number($('pJoinedDeath').value) : null,
      memberTypeAssoc: $('pMemberTypeAssoc').value || null,
      memberTypeDeath: $('pMemberTypeDeath').value || null,
      updatedAt: new Date().toISOString(),
      createdAt: old ? old.createdAt : new Date().toISOString()
    };

    if(id){
      person.id = id;
      await dbPut('people', person);
      const i = S.people.findIndex(p => p.id === id);
      if(i > -1) S.people[i] = person;
      logAudit('update', 'person', id, { name });
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('people', person);
      person.id = newId;
      S.people.push(person);
      logAudit('add', 'person', newId, { name });
      toast('✅ تمت الإضافة');
    }
    closeSheet();
    renderPeople();
    if(S.page === 'pg-home') renderHome();
  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
}

async function deletePerson(id){
  if(!hasPerm('person.manage')){ toast('غير مصرح','error'); return; }
  if(!confirm('حذف هذا الفرد؟')) return;
  if(!confirm('تأكيد نهائي!')) return;
  try{
    const p = S.people.find(x => x.id === id);
    await dbDel('people', id);
    S.people = S.people.filter(x => x.id !== id);
    logAudit('delete', 'person', id, { name: p?.name });
    toast('🗑️ تم الحذف');
    closeSheet();
    renderPeople();
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function importPeopleFile(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';

  showLoad(true);
  const log = $('importLog');
  log.innerHTML = '<div style="color:var(--muted)">⏳ جاري القراءة…</div>';

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });

    if(!rows.length){
      log.innerHTML = '<div style="color:var(--danger)">❌ الملف فارغ</div>';
      showLoad(false);
      return;
    }

    let added = 0, updated = 0, skip = 0;
    const existingByCode = new Map();
    const existingByName = new Map();
    for(const p of S.people){
      if(p.code) existingByCode.set(p.code, p);
      existingByName.set(normAr(p.name), p);
    }

    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const name = cleanText(gv(r, 'الاسم الثلاثي','الاسم_الثلاثي','الاسم'));
      if(!name){ skip++; continue; }

      const code = cleanText(gv(r, 'رقم الفرد','رقم_الفرد','الكود'));

      // تاريخ الاشتراك
      const subDateStr = gv(r, 'تاريخ الاشتراك','تاريخ_الاشتراك','تاريخ الانضمام','تاريخ_الانضمام');
      const subDate = toDate(subDateStr);
      const subYear = subDate ? new Date(subDate).getFullYear() : null;

      // نوع الاشتراك
      const subTypeStr = gv(r, 'نوع الاشتراك','نوع_الاشتراك','نوع العضو','نوع_العضو');
      let memberType = 'عادي';
      let appliesAssoc = false;
      let appliesDeath = false;

      if(subTypeStr){
        const t = normAr(subTypeStr);
        if(t.includes('كلاهما') || t.includes('كلا') || t.includes('الاثنين')){
          appliesAssoc = true; appliesDeath = true;
        } else if(t.includes('جمعية') && !t.includes('وفاة') && !t.includes('وفاء')){
          appliesAssoc = true;
        } else if(t.includes('وفاة') || t.includes('وفاء')){
          appliesDeath = true;
        } else if(t.includes('غير مشترك')){
          appliesAssoc = false; appliesDeath = false;
        }
        if(t.includes('مخفض')) memberType = 'مخفض';
        else if(t.includes('عادي') || t.includes('كامل')) memberType = 'عادي';
      }

      // إذا لم يُحدد شيء → نعتبره غير مشترك (لا نضع افتراضي)
      if(!subTypeStr){
        appliesAssoc = false;
        appliesDeath = false;
      }

      // بحث عن موجود
      let existing = null;
      if(code && existingByCode.has(code)) existing = existingByCode.get(code);
      else if(existingByName.has(normAr(name))) existing = existingByName.get(normAr(name));

      if(existing){
        let changed = false;
        if(appliesAssoc && !existing.joinedAssocYear && subYear){
          existing.joinedAssocYear = subYear;
          existing.memberTypeAssoc = memberType;
          changed = true;
        }
        if(appliesDeath && !existing.joinedDeathYear && subYear){
          existing.joinedDeathYear = subYear;
          existing.memberTypeDeath = memberType;
          changed = true;
        }
        if(changed){
          existing.updatedAt = new Date().toISOString();
          await dbPut('people', existing);
          updated++;
        } else {
          skip++;
        }
        continue;
      }

      // إضافة جديد
      try{
        const person = {
          code, name,
          familyCode: cleanText(gv(r, 'كود الأسرة','كود_الأسرة')),
          gender: gv(r, 'الجنس') || 'ذكر',
          status: gv(r, 'الحالة') || 'حي',
          relation: gv(r, 'صلة القرابة','صلة_القرابة') || 'رب أسرة',
          birth: toDate(gv(r, 'تاريخ الميلاد','تاريخ_الميلاد')),
          sector: gv(r, 'القطاع'),
          phone: cleanPhone(gv(r, 'الجوال','الهاتف')),
          notes: cleanText(gv(r, 'ملاحظات')),
          joinedAssocYear: appliesAssoc ? subYear : null,
          joinedDeathYear: appliesDeath ? subYear : null,
          memberTypeAssoc: appliesAssoc ? memberType : null,
          memberTypeDeath: appliesDeath ? memberType : null,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        const newId = await dbPut('people', person);
        person.id = newId;
        S.people.push(person);
        if(code) existingByCode.set(code, person);
        existingByName.set(normAr(name), person);
        added++;
      } catch(e){
        console.warn('صف ' + (i+2), e);
        skip++;
      }
    }

    log.innerHTML = `<div style="padding:12px;background:#f0fdf4;border-radius:12px;color:#166534">
      <div style="font-weight:800;margin-bottom:6px">📊 النتيجة</div>
      <div>➕ أُضيف: <b>${added}</b></div>
      <div>✏️ حُدّث: <b>${updated}</b></div>
      <div>⏭️ تُخطّي: <b>${skip}</b></div>
    </div>`;

    toast(`✅ أُضيف ${added} • حُدّث ${updated}`, 'success', 4000);
    await loadAll();
    renderPeople();
    if(S.page === 'pg-home') renderHome();
  } catch(e){
    console.error(e);
    log.innerHTML = `<div style="color:var(--danger)">❌ ${esc(e.message)}</div>`;
    toast('خطأ: ' + e.message, 'error');
  }
  showLoad(false);
}

function gv(row, ...aliases){
  if(!row) return '';
  const normalized = {};
  for(const k of Object.keys(row)){
    normalized[normAr(k).replace(/[^\u0621-\u064Aa-z0-9]/g,'')] = row[k];
  }
  for(const a of aliases){
    const key = normAr(a).replace(/[^\u0621-\u064Aa-z0-9]/g,'');
    if(key in normalized){
      const v = normalized[key];
      if(v === null || v === undefined) continue;
      const s = String(v).trim();
      if(!s || s.startsWith('=') || s.includes('openpyxl')) continue;
      return s;
    }
  }
  return '';
}

/* ═══════════════════════════════════════════════════════
   المشتركون

function setSubsFilter(k){ S.filters.subscribers = k; renderSubscribers(); }
function setSubsSector(k){ S.filters.subscriberSector = k; renderSubscribers(); }

function renderSubscribers(){
  const year = S.currentYear;
  const filter = S.filters.subscribers || 'all';
  const sectorFilter = S.filters.subscriberSector || 'all';

  const counts = getSubscribersCount(year);
  $('subStats').innerHTML = `
    <div class="stat assoc"><div class="val">${counts.assoc.active}</div><div class="lbl">💰 جمعية</div></div>
    <div class="stat death"><div class="val">${counts.death.active}</div><div class="lbl">⚰️ وفاة</div></div>
    <div class="stat green"><div class="val">${counts.bothActive}</div><div class="lbl">✅ كليهما</div></div>
    <div class="stat blue"><div class="val">${S.people.length}</div><div class="lbl">👥 سكان</div></div>
  `;

  const chips = [
    { k:'all', l:'الكل' }, { k:'assoc', l:'💰 جمعية' }, { k:'death', l:'⚰️ وفاة' },
    { k:'both', l:'✅ كليهما' }, { k:'late', l:'⚠️ متأخرون' }
  ];
  $('subChips').innerHTML = chips.map(c =>
    `<button class="chip ${filter === c.k ? 'on' : ''}" onclick="setSubsFilter('${c.k}')">${c.l}</button>`
  ).join('');

  const sectorChips = [
    { k:'all', l:'كل القطاعات' },
    ...S.sectors.map(s => ({ k:s.name, l:s.name }))
  ];
  $('subSectorChips').innerHTML = sectorChips.map(c =>
    `<button class="chip ${sectorFilter === c.k ? 'on' : ''}" onclick="setSubsSector('${c.k}')">${c.l}</button>`
  ).join('');

  // كل من لديه انضمام
  let list = S.people
    .filter(p => p.joinedAssocYear || p.joinedDeathYear)
    .map(p => {
      const dues = computeMemberDues(p.id, year);
      return { person: p, dues };
    });

  if(filter === 'assoc') list = list.filter(x => x.person.joinedAssocYear);
  if(filter === 'death') list = list.filter(x => x.person.joinedDeathYear);
  if(filter === 'both') list = list.filter(x => x.person.joinedAssocYear && x.person.joinedDeathYear);
  if(filter === 'late') list = list.filter(x => x.dues && x.dues.total.remaining > 0);

  if(sectorFilter !== 'all') list = list.filter(x => x.person.sector === sectorFilter);

  const q = S.search;
  if(q){
    const s = normAr(q);
    list = list.filter(x => normAr(`${x.person.name} ${x.person.code||''} ${x.person.sector||''}`).includes(s));
  }

  // ترتيب: متأخرون أولاً
  list.sort((a,b) => {
    const aRem = a.dues ? a.dues.total.remaining : 0;
    const bRem = b.dues ? b.dues.total.remaining : 0;
    if(aRem !== bRem) return bRem - aRem;
    return String(a.person.name).localeCompare(String(b.person.name),'ar');
  });

  const el = $('subContent');
  if(!list.length){
    el.innerHTML = `<div class="empty"><span class="ico">⭐</span><h3>لا يوجد مشتركون</h3><p>جرّب فلتراً آخر</p></div>`;
    return;
  }

  el.innerHTML = `<div class="list">${list.slice(0, 200).map(({person, dues}) => {
    const icons = [];
    if(person.joinedAssocYear) icons.push('💰');
    if(person.joinedDeathYear) icons.push('⚰️');

    const hasUnpaid = dues && dues.total.remaining > 0;

    const details = [];
    if(dues && dues.assoc.remaining > 0) details.push(`💰 ${fmtShort(dues.assoc.remaining)}`);
    if(dues && dues.death.remaining > 0) details.push(`⚰️ ${fmtShort(dues.death.remaining)}`);
    const joinRem = (dues?.assoc.joinFeeRemaining || 0) + (dues?.death.joinFeeRemaining || 0);
    if(joinRem > 0) details.push(`📋 ${fmtShort(joinRem)}`);

    return `<div class="item" onclick="openSubscriberDetail(${person.id})">
      <div class="av ${hasUnpaid ? 'red' : 'green'}">${icons.join('') || '⭐'}</div>
      <div class="body">
        <div class="ttl">${esc(person.name)}</div>
        <div class="sub">
          ${esc(person.code||'')} • ${esc(person.sector||'')}
          ${details.length ? ' • ' + details.join(' | ') : ' • ✅ مسدَّد'}
        </div>
      </div>
      <div style="text-align:left">
        ${hasUnpaid
          ? `<div style="font-weight:800;color:var(--danger);font-size:13px">${fmtShort(dues.total.remaining)}</div>
             <div style="font-size:10px;color:var(--muted)">متبقي</div>`
          : `<div style="font-weight:800;color:var(--success);font-size:13px">✅</div>`}
      </div>
    </div>`;
  }).join('')}</div>
  ${list.length > 200 ? `<div style="text-align:center;padding:14px;font-size:12px;color:var(--muted)">عرض أول 200 من ${list.length}</div>` : ''}`;
}

        <div style="width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0">
          ${person.gender === 'أنثى' ? '👩' : '👨'}

        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:17px">${esc(person.name)}</div>
          <div style="font-size:12px;opacity:.9;margin-top:3px">${esc(person.code||'')} • ${esc(person.sector||'')}</div>
          <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
            <span style="background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800">

            ${person.joinedAssocYear ? `<span style="background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800">💰 منذ ${person.joinedAssocYear}</span>` : ''}

      <button class="btn death" onclick="closeSheet();setTimeout(()=>openFundPaymentSheet('death',${personId}),150)">⚰️ دفعة وفاة</button>
    </div>

    <div style="font-weight:800;font-size:14px;margin:16px 0 10px">📊 السجل الكامل</div>
    ${history.map(h => `
      <div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:10px">
        <div style="font-weight:800;font-size:14px;margin-bottom:8px">📅 ${h.year}</div>

        ${h.assoc.applicable ? `
          <div style="padding:8px;background:var(--card);border-radius:8px;margin-bottom:6px">
            <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--assoc);margin-bottom:4px">
              <span>💰 الجمعية</span>

            <div class="progress assoc"><div style="width:${h.assoc.percent}%"></div></div>
            ${h.assoc.remaining > 0
              ? `<div style="font-size:11px;color:var(--danger);margin-top:4px">متبقي: ${fmtNum(h.assoc.remaining)} ل.س</div>`
              : h.assoc.required > 0 ? `<div style="font-size:11px;color:var(--success);margin-top:4px">✅ مسدَّد</div>` : ''}
            ${h.assoc.joinFee > 0 ? `
              <div style="font-size:11px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);display:flex;justify-content:space-between">

              <span>${fmtNum(h.death.paid)} / ${fmtNum(h.death.required)}</span>
            </div>
            <div class="progress death"><div style="width:${h.death.percent}%"></div></div>

    `).join('')}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px">
      <button class="btn ghost block" onclick="closeSheet();setTimeout(()=>openPersonSheet(${personId}),150)">📝 تعديل</button>

  openSheet('👤 ' + person.name, body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide:true });
}

function showMemberPaymentsLog(personId){
  const person = getPersonById(personId);
  if(!person) return;

  const allPayments = [];

  S.assocPayments.filter(p => p.personId === personId).forEach(p => {
    allPayments.push({
      fund: p.fund || 'assoc',
      amount: p.amount, date: p.date, year: p.year,
      collectorName: p.collectorName, notes: p.notes,
      createdAt: p.createdAt
    });
  });

  S.donations.filter(d => d.personId === personId).forEach(d => {
    allPayments.push({
      fund:'donation', amount: d.amount, date: d.date, year: d.year,
      collectorName: d.collectorName, notes: d.notes, createdAt: d.createdAt
    });
  });

  allPayments.sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || ''));

  const fundLabels = {
    'assoc':'💰 دفعة جمعية', 'joinAssoc':'📋 انضمام جمعية',
    'death':'⚰️ دفعة وفاة', 'joinDeath':'📋 انضمام وفاة',
    'donation':'💚 تبرع'
  };
  const fundIcons = { 'assoc':'💰', 'joinAssoc':'📋', 'death':'⚰️', 'joinDeath':'📋', 'donation':'💚' };
  const fundColors = { 'assoc':'blue', 'joinAssoc':'orange', 'death':'red', 'joinDeath':'orange', 'donation':'green' };

  const body = `
    <div style="padding:12px;background:var(--primary-soft);border-radius:12px;margin-bottom:14px">
      <div style="font-weight:800">${esc(person.name)}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${allPayments.length} دفعة مسجلة</div>
    </div>

    ${allPayments.length ? `
      <div class="list">
        ${allPayments.map(p => `
          <div class="item" style="cursor:default;padding:12px 14px">
            <div class="av ${fundColors[p.fund]}">${fundIcons[p.fund]}</div>
            <div class="body">
              <div class="ttl" style="font-size:13px">${fundLabels[p.fund]}</div>
              <div class="sub">${fmtDate(p.date)} • ${p.year} • ${esc(p.collectorName || '')}</div>
              ${p.notes ? `<div style="font-size:10px;color:var(--muted);margin-top:2px">📝 ${esc(p.notes)}</div>` : ''}
            </div>
            <div style="font-weight:800;font-size:14px">${fmtNum(p.amount)}</div>
          </div>
        `).join('')}
      </div>
    ` : '<div style="text-align:center;padding:40px;color:var(--muted)">لا توجد دفعات</div>'}
  `;

  openSheet('📜 سجل الدفعات', body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide:true });
}

function openFundPaymentSheet(fund, personId){
  const year = S.currentYear;
  const fundInfo = {
    'assoc': { label:'دفعة جمعية', icon:'💰', color:'var(--assoc)', softColor:'var(--assoc-soft)', btnClass:'assoc' },
    'death': { label:'دفعة وفاة', icon:'⚰️', color:'var(--death)', softColor:'var(--death-soft)', btnClass:'death' },
    'donation': { label:'تبرع', icon:'💚', color:'var(--donation)', softColor:'var(--donation-soft)', btnClass:'donation' }
  }[fund];

  const showPersonSearch = fund !== 'donation';

  const body = `
    <div style="padding:14px;background:${fundInfo.softColor};border-radius:14px;margin-bottom:14px;text-align:center;border:2px solid ${fundInfo.color}">
      <div style="font-size:32px">${fundInfo.icon}</div>
      <div style="font-size:15px;font-weight:800;color:${fundInfo.color};margin-top:4px">${fundInfo.label}</div>
    </div>

    ${showPersonSearch ? `
      <div class="fld" style="position:relative">
        <label>المشترك <span class="req">*</span></label>
        <input id="pfPersonInput" placeholder="اكتب اسم..." oninput="onPFPersonInput('${fund}')" onfocus="onPFPersonInput('${fund}')" autocomplete="off">
        <input type="hidden" id="pfPersonId" value="${personId || ''}">
        <div class="options-list" id="pfPersonOptions"></div>
      </div>
    ` : `
      <div class="fld">
        <label>اسم المتبرع</label>
        <input id="pfDonorName" placeholder="اختياري">
      </div>
    `}

    <div id="pfDuesBox" style="display:none;margin-bottom:14px"></div>

    <div class="fld" id="pfAmountField" style="display:none">
      <label>المبلغ <span class="req">*</span></label>
      <div class="amount-input" style="border-color:${fundInfo.color}">
        <input id="pfAmount" type="tel" inputmode="numeric" placeholder="0" style="color:${fundInfo.color}">
        <span class="currency">ل.س</span>
      </div>
      <div class="amount-quick" id="pfQuickButtons"></div>
    </div>

    <div class="fld-row" id="pfDateRow" style="display:none">
      <div class="fld"><label>التاريخ</label>
        <input id="pfDate" type="date" value="${today()}"></div>
      <div class="fld"><label>السنة</label>
        <select id="pfYear">
          ${[2025,2026,2027,2028].map(y => `<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="fld" id="pfNotesField" style="display:none">
      <label>ملاحظات</label>
      <input id="pfNotes" placeholder="اختياري">
    </div>
  `;

  const foot = `
    <button class="btn ghost" onclick="closeSheet()">إلغاء</button>
    <button class="btn ${fundInfo.btnClass}" onclick="saveFundPayment('${fund}')">💾 حفظ</button>
  `;

  openSheet(`${fundInfo.icon} ${fundInfo.label}`, body, foot, { focus: showPersonSearch ? 'pfPersonInput' : 'pfDonorName' });

  window._currentFund = fund;

  if(fund === 'donation'){
    $('pfAmountField').style.display = 'block';
    $('pfDateRow').style.display = 'grid';
    $('pfNotesField').style.display = 'block';
    $('pfQuickButtons').innerHTML = `
      <button onclick="$('pfAmount').value=5000">5,000</button>
      <button onclick="$('pfAmount').value=10000">10,000</button>
      <button onclick="$('pfAmount').value=50000">50,000</button>
      <button onclick="$('pfAmount').value=100000">100,000</button>
    `;
  } else if(personId){
    const p = getPersonById(personId);
    if(p){
      $('pfPersonInput').value = p.name;
      $('pfPersonId').value = p.id;
      showPFDues(fund, p.id);
    }
  }
}

function onPFPersonInput(fund){
  const input = $('pfPersonInput');
  const opts = $('pfPersonOptions');
  if(!input || !opts) return;

  const q = input.value.trim();
  const year = S.currentYear;
  const isAssoc = fund === 'assoc';
  const isDeath = fund === 'death';

  let list = S.people.filter(p => {
    if(isAssoc) return p.joinedAssocYear;
    if(isDeath) return p.joinedDeathYear;
    return false;
  });

  if(q){
    const s = normAr(q);
    list = list.filter(p => normAr(`${p.name} ${p.code||''} ${p.sector||''}`).includes(s));
  }

  list = list.slice(0, 30);

  if(!list.length){
    opts.innerHTML = `<div style="padding:12px;color:var(--muted);font-size:13px;text-align:center">${q ? '⚠️ لا نتائج' : 'اكتب اسماً للبحث'}</div>`;
  } else {
    opts.innerHTML = list.map(p => {
      const dues = computeMemberDues(p.id, year);
      let remaining = 0;
      if(isAssoc) remaining = dues ? (dues.assoc.remaining + dues.assoc.joinFeeRemaining) : 0;
      else if(isDeath) remaining = dues ? (dues.death.remaining + dues.death.joinFeeRemaining) : 0;

      return `<div class="option-item" onclick="selectPFPerson(${p.id},'${esc(p.name).replace(/'/g, "&#39;")}')">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700">${esc(p.name)}</div>
          <div style="font-size:10px;color:var(--muted)">${esc(p.code||'')} • ${esc(p.sector||'')}</div>
        </div>
        <small style="color:${remaining > 0 ? 'var(--danger)' : 'var(--success)'};font-weight:700;flex-shrink:0">
          ${remaining > 0 ? 'متبقي ' + fmtShort(remaining) : '✅'}
        </small>
      </div>`;
    }).join('');
  }
  opts.classList.add('on');
}

function selectPFPerson(id, name){
  $('pfPersonInput').value = name;
  $('pfPersonId').value = id;
  $('pfPersonOptions').classList.remove('on');
  showPFDues(window._currentFund, id);
}

function showPFDues(fund, personId){
  const person = getPersonById(personId);
  if(!person) return;

  const year = Number($('pfYear')?.value) || S.currentYear;
  const dues = computeMemberDues(personId, year);
  if(!dues) return;

  const isAssoc = fund === 'assoc';
  const fundColor = isAssoc ? 'var(--assoc)' : 'var(--death)';
  const fundIcon = isAssoc ? '💰' : '⚰️';
  const data = isAssoc ? dues.assoc : dues.death;

  const bodyHTML = `
    <div style="padding:14px;background:var(--bg);border-radius:12px;border:2px solid ${fundColor}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div>
          <div style="font-weight:800;font-size:15px">${esc(person.name)}</div>
          <div style="font-size:11px;color:var(--muted)">
            ${esc(person.code||'')} • ${esc(person.sector||'')}
          </div>
        </div>
        <div style="font-size:24px">${fundIcon}</div>
      </div>

      <div style="padding:8px;background:var(--card);border-radius:8px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">
          <span class="muted">المطلوب (${year})</span><b>${fmtNum(data.required)}</b>
        </div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">
          <span class="muted">المدفوع</span><b style="color:var(--success)">${fmtNum(data.paid)}</b>
        </div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:2px solid ${fundColor};margin-top:4px">
          <span style="font-weight:800">المتبقي</span>
          <b style="font-weight:800;color:${data.remaining > 0 ? 'var(--danger)' : 'var(--success)'}">${fmtNum(data.remaining)} ل.س</b>
        </div>
        <div class="progress ${isAssoc ? 'assoc' : 'death'}" style="margin-top:8px"><div style="width:${data.percent}%"></div></div>
      </div>

      ${data.installments?.length ? `
        <div style="padding:8px;background:var(--card);border-radius:8px;margin-bottom:8px">
          <div style="font-size:11px;font-weight:800;color:var(--muted);margin-bottom:6px">📋 الأقساط (${data.installments.length})</div>
          ${data.installments.map(i => `
            <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">
              <span>${esc(i.eventName || 'وفاة')}</span>
              <span style="color:${i.status === 'paid' ? 'var(--success)' : 'var(--danger)'};font-weight:700">
                ${i.status === 'paid' ? '✅' : '⏳'} ${fmtNum(i.amount)}
              </span>
            </div>
          `).join('')}
        </div>
      ` : ''}

      ${data.joinFee > 0 ? `
        <div style="padding:8px;background:var(--card);border-radius:8px;margin-top:8px;border:2px solid var(--warning)">
          <div style="font-size:11px;font-weight:800;color:var(--warning);margin-bottom:6px">📋 رسوم الانضمام (سنة ${person.joinedAssocYear || person.joinedDeathYear})</div>
          <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">
            <span class="muted">المطلوب</span><b>${fmtNum(data.joinFee)}</b>
          </div>
          <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">
            <span class="muted">المدفوع</span><b style="color:var(--success)">${fmtNum(data.joinFeePaid)}</b>
          </div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-top:1px dashed var(--border);margin-top:4px">
            <span style="font-weight:800">المتبقي</span>
            <b style="color:${data.joinFeeRemaining > 0 ? 'var(--danger)' : 'var(--success)'}">${fmtNum(data.joinFeeRemaining)} ل.س</b>
          </div>
        </div>
      ` : ''}
    </div>
  `;

  const box = $('pfDuesBox');
  if(box){
    box.innerHTML = bodyHTML;
    box.style.display = 'block';
  }

  $('pfAmountField').style.display = 'block';
  $('pfDateRow').style.display = 'grid';
  $('pfNotesField').style.display = 'block';

  // أزرار سريعة
  const totalRemaining = data.remaining + data.joinFeeRemaining;
  const buttons = [];
  if(totalRemaining > 0){
    buttons.push(`<button onclick="$('pfAmount').value=${totalRemaining}">💰 كامل ${fmtShort(totalRemaining)}</button>`);
    buttons.push(`<button onclick="$('pfAmount').value=${Math.round(totalRemaining / 2)}">نصف</button>`);
  }
  buttons.push(`<button onclick="$('pfAmount').value=5000">5,000</button>`);
  buttons.push(`<button onclick="$('pfAmount').value=10000">10,000</button>`);
  $('pfQuickButtons').innerHTML = buttons.join('');

  $('pfAmount').value = totalRemaining > 0 ? totalRemaining : '';
}

async function saveFundPayment(fund){
  const isDonation = fund === 'donation';
  const personId = isDonation ? null : Number($('pfPersonId').value);
  const amount = Number($('pfAmount').value);
  const date = $('pfDate').value;
  const year = Number($('pfYear').value);
  const notes = $('pfNotes')?.value?.trim() || '';
  const donorName = isDonation ? ($('pfDonorName')?.value?.trim() || '') : '';

  if(!isDonation && !personId){ toast('اختر المشترك', 'error'); return; }
  if(!amount || amount <= 0){ toast('المبلغ مطلوب', 'error'); return; }
  if(!date){ toast('التاريخ مطلوب', 'error'); return; }

  showLoad(true);

  try{
    let paymentInfo = null;

    if(isDonation){
      const record = {
        donorName: donorName || 'متبرع مجهول',
        personId: null, amount, date, year, notes,
        fund:'donation',
        collectorId: S.currentUser.id, collectorName: S.currentUser.name,
        createdAt: new Date().toISOString()
      };
      const id = await dbPut('donations', record);
      record.id = id;
      S.donations.push(record);

      paymentInfo = {
        personName: record.donorName, personCode: '',
        fund:'donation', amount, year, date,
        collectorName: S.currentUser.name, notes
      };
    }
    else if(fund === 'assoc'){
      const record = {
        personId, fund:'assoc', amount, date, year, notes,
        collectorId: S.currentUser.id, collectorName: S.currentUser.name,
        createdAt: new Date().toISOString()
      };
      const id = await dbPut('assocPayments', record);
      record.id = id;
      S.assocPayments.push(record);

      const person = getPersonById(personId);
      paymentInfo = {
        personName: person.name, personCode: person.code,
        fund:'assoc', amount, year, date,
        collectorName: S.currentUser.name, notes
      };
    }
    else if(fund === 'death'){
      const person = getPersonById(personId);

      // توزيع على الأقساط المعلقة
      const pending = S.deathInstallments
        .filter(i => i.personId === personId && i.year === year && i.status === 'pending')
        .sort((a,b) => (a.deathDate || '').localeCompare(b.deathDate || ''));

      let paidCount = 0;
      let remaining = amount;

      for(const inst of pending){
        if(remaining <= 0) break;
        const instAmount = Number(inst.amount) || 0;
        if(remaining >= instAmount){
          inst.status = 'paid';
          inst.paidDate = date;
          inst.collectorId = S.currentUser.id;
          inst.collectorName = S.currentUser.name;
          await dbPut('deathInstallments', inst);
          remaining -= instAmount;
          paidCount++;
        }
      }

      const record = {
        personId, fund:'death', amount, date, year, notes,
        paidCount,
        collectorId: S.currentUser.id, collectorName: S.currentUser.name,
        createdAt: new Date().toISOString()
      };
      const id = await dbPut('assocPayments', record);
      record.id = id;
      S.assocPayments.push(record);

      paymentInfo = {
        personName: person.name, personCode: person.code,
        fund:'death', amount, year, date,
        collectorName: S.currentUser.name, notes,
        paidCount
      };
    }

    logAudit('add', 'payment', null, { fund, personId, amount });
    toast('✅ تم تسجيل الدفعة', 'success', 3000);
    closeSheet();
    renderHome();
    if(S.page === 'pg-subscribers') renderSubscribers();
    if(S.page === 'pg-payments') renderPayments();

  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }

  showLoad(false);
}

async function saveDeathEvent(){
  const name = cleanText($('deName').value);
  const date = $('deDate').value;
  const year = Number($('deYear').value);
  const comp = Number($('deComp').value);
  const installment = Number($('deInstallment').value);
  const recipient = cleanText($('deRecipient').value);
  const notes = cleanText($('deNotes').value);

  if(!name){ toast('اسم المتوفى مطلوب','error'); return; }
  if(!date){ toast('التاريخ مطلوب','error'); return; }
  if(!comp || comp <= 0){ toast('التعويض مطلوب','error'); return; }
  if(!installment || installment <= 0){ toast('القسط مطلوب','error'); return; }

  if(!confirm(`⚠️ سيُضاف قسط ${fmtNum(installment)} ل.س لكل مشترك في الوفاة. متابعة؟`)) return;

  showLoad(true);
  try{
    const event = {
      deceasedName: name, deathDate: date, year,
      compensation: comp, installment, recipient, notes,
      createdBy: S.currentUser.id, createdByName: S.currentUser.name,
      createdAt: new Date().toISOString()
    };
    const eventId = await dbPut('deathEvents', event);
    event.id = eventId;
    S.deathEvents.push(event);

    // إضافة قسط لكل من له joinedDeathYear <= year
    let created = 0;
    for(const person of S.people){
      if(!person.joinedDeathYear) continue;
      if(person.joinedDeathYear > year) continue;

      const inst = {
        personId: person.id,
        eventId, eventName: name, deathDate: date, year,
        amount: installment,
        status:'pending', paidDate: null,
        createdAt: new Date().toISOString()
      };
      const iid = await dbPut('deathInstallments', inst);
      inst.id = iid;
      S.deathInstallments.push(inst);
      created++;
    }

    logAudit('add', 'deathEvent', eventId, { name, created });
    toast(`⚰️ أُضيف ${created} قسط`, 'success', 4000);
    closeSheet();
    renderHome();
    if(S.page === 'pg-payments') renderPayments();
  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
  showLoad(false);
}
