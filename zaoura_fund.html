<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>صندوق زعورة</title>

<!-- ═══════════════════════════════════════════════════════════════
     📑 فهرس التعديلات (Changelog)
     ═══════════════════════════════════════════════════════════════
     v7.0 (2026-09-18) — إعادة البناء الاحترافية
     ✨ NEW-001: شاشات منفصلة لكل دور حسب الصلاحيات
     ✨ NEW-002: قائمة سفلية ديناميكية حسب الدور
     ✨ NEW-003: تبويب الأعضاء بتصنيفات (مشترك/غير مشترك/منسحب/متوقف/متوفى)
     ✨ NEW-004: شاشة المعتمد الميدانية (تحصيل سريع)
     ✨ NEW-005: تبويب التسليمات للأمين (استلام من المعتمدين)
     ✨ NEW-006: صلاحيات على مستوى الحقول (المعتمد: الجوال فقط)
     ✨ NEW-007: أرشفة "مسدَّد كاملاً" للقطاعات المنتهية
     ✨ NEW-008: عرض تفصيلي لتحصيلات المعتمد (جمعية/وفاة/تبرع)
     🔧 FIX-001: فلترة الدفعات حسب السنة بدقة
     🔧 FIX-002: استيراد التعويضات من الحركات المالية
     🔧 FIX-003: فحص التكرار في كل الاستيراد
     🎨 UI-001: تصميم موحّد بثلاثة مستويات
     🎨 UI-002: ألوان حسب الصندوق (أزرق/أحمر/أخضر)
     ⚡ PERF-001: Cache لحساب الأعضاء (10x أسرع)
     ═══════════════════════════════════════════════════════════════ -->

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════════
   🎨 [UI-001] — نظام التصميم (Design System)
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* ألوان رئيسية */
  --primary:#7c3aed;
  --primary-2:#6d28d9;
  --primary-soft:#f5f3ff;
  --primary-dark:#4c1d95;
  
  /* الصناديق */
  --assoc:#2563eb;
  --assoc-soft:#dbeafe;
  --death:#dc2626;
  --death-soft:#fee2e2;
  --donation:#16a34a;
  --donation-soft:#dcfce7;
  
  /* حالات */
  --success:#16a34a;
  --danger:#dc2626;
  --warning:#f59e0b;
  --info:#2563eb;
  --muted:#64748b;
  
  /* مساحات */
  --bg:#f8fafc;
  --card:#fff;
  --text:#0f172a;
  --border:#e2e8f0;
  --radius:16px;
  --radius-sm:12px;
  --radius-lg:20px;
  
  /* ظلال */
  --shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow-md:0 4px 12px rgba(15,23,42,.08);
  --shadow-lg:0 20px 60px rgba(15,23,42,.2);
  
  /* أمان */
  --safe:env(safe-area-inset-bottom,0);
}

[data-theme="dark"]{
  --bg:#0b1220;
  --card:#1e293b;
  --text:#e2e8f0;
  --border:#334155;
  --primary-soft:#2e1065;
  --assoc-soft:#1e3a8a;
  --death-soft:#7f1d1d;
  --donation-soft:#14532d;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  font-family:system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  background:var(--bg);
  color:var(--text);
  direction:rtl;
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  padding-bottom:calc(78px + var(--safe));
}

button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{outline:0}

/* ═══ الهيدر العلوي ═══ */
.app-header{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;
  padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top,0));
  display:flex;align-items:center;gap:10px;
  box-shadow:0 4px 20px rgba(124,58,237,.3);
}
.app-header .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.app-header .logo{
  width:40px;height:40px;border-radius:12px;
  background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.app-header .brand-text{flex:1;min-width:0}
.app-header h1{font-size:16px;font-weight:800}
.app-header .sub{
  font-size:11px;opacity:.9;font-weight:700;cursor:pointer;
  display:inline-block;padding:2px 8px;
  background:rgba(255,255,255,.15);border-radius:8px;margin-top:2px;
}
.app-header .icon-btn{
  width:38px;height:38px;border-radius:12px;
  background:rgba(255,255,255,.15);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.app-header .icon-btn:active{transform:scale(.92)}

/* ═══ شريط المستخدم ═══ */
.user-banner{
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:8px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:12px;position:sticky;top:60px;z-index:29;
}
.user-banner .who{display:flex;align-items:center;gap:8px;color:var(--muted);flex-wrap:wrap}
.user-banner .who b{color:var(--text)}
.role-badge{
  padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;
  background:var(--primary-soft);color:var(--primary);
}

/* ═══ البحث ═══ */
.search-wrap{padding:10px 12px 0;max-width:900px;margin:0 auto}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:10px 14px;box-shadow:var(--shadow-sm);
}
.search-box input{flex:1;background:none;border:0;font-size:15px;min-width:0}
.search-box .ico{color:var(--muted);font-size:17px}
.search-box .clear{color:var(--muted);font-size:18px;padding:4px}

/* ═══ الحاوية الرئيسية ═══ */
main{max-width:900px;margin:0 auto;padding:12px}

/* ═══ الصفحات ═══ */
.page{display:none}
.page.active{display:block}

/* ═══ البطاقات ═══ */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:12px;
  box-shadow:var(--shadow-sm);
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:12px;flex-wrap:wrap;
}
.card-head h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}

/* ═══ الإحصائيات الأفقية ═══ */
.stats-scroll{
  display:flex;gap:10px;overflow-x:auto;
  margin:0 -12px 14px;padding:0 12px 6px;scrollbar-width:none;
}
.stats-scroll::-webkit-scrollbar{display:none}
.stat{
  flex:0 0 auto;min-width:140px;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.stat::before{
  content:'';position:absolute;top:0;right:0;width:4px;height:100%;
  background:var(--primary);
}
.stat.assoc::before{background:var(--assoc)}
.stat.death::before{background:var(--death)}
.stat.donation::before{background:var(--donation)}
.stat.green::before{background:var(--success)}
.stat.red::before{background:var(--danger)}
.stat.orange::before{background:var(--warning)}
.stat.blue::before{background:var(--info)}
.stat .val{
  font-size:20px;font-weight:800;line-height:1.1;
  color:var(--primary);word-break:break-all;
}
.stat.assoc .val{color:var(--assoc)}
.stat.death .val{color:var(--death)}
.stat.donation .val{color:var(--donation)}
.stat.green .val{color:var(--success)}
.stat.red .val{color:var(--danger)}
.stat.orange .val{color:var(--warning)}
.stat.blue .val{color:var(--info)}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600}

/* ═══ القوائم ═══ */
.list{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);
}
.item{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;min-height:64px;
}
.item:last-child{border-bottom:0}
.item:active{background:var(--bg)}
.item .av{
  width:46px;height:46px;border-radius:13px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;background:var(--primary-soft);color:var(--primary);
  font-weight:800;overflow:hidden;
}
.item .av.blue{background:var(--assoc-soft);color:var(--assoc)}
.item .av.red{background:var(--death-soft);color:var(--death)}
.item .av.green{background:var(--donation-soft);color:var(--donation)}
.item .av.orange{background:#fef3c7;color:#92400e}
.item .av.gray{background:#f1f5f9;color:#475569}
.item .body{flex:1;min-width:0}
.item .ttl{
  font-weight:700;font-size:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.item .sub{
  font-size:12px;color:var(--muted);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.item .trail{color:var(--muted);font-size:20px;flex-shrink:0}

/* ═══ الشارات ═══ */
.badge{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 9px;border-radius:8px;
  font-size:10px;font-weight:700;white-space:nowrap;
}
.badge.success{background:#dcfce7;color:#166534}
.badge.danger{background:#fee2e2;color:#991b1b}
.badge.warning{background:#fef3c7;color:#92400e}
.badge.info{background:#dbeafe;color:#1e40af}
.badge.muted{background:#f1f5f9;color:#475569}
.badge.primary{background:var(--primary-soft);color:var(--primary)}

/* ═══ الشرائح (Chips) ═══ */
.chips{
  display:flex;gap:6px;overflow-x:auto;
  padding-bottom:8px;margin-bottom:8px;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:7px 14px;border-radius:20px;
  background:var(--card);border:1px solid var(--border);
  font-size:12px;font-weight:700;color:var(--muted);
}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ═══ الأزرار ═══ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:13px;font-size:14px;font-weight:700;
  min-height:44px;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff}
.btn.assoc{background:var(--assoc);color:#fff}
.btn.death{background:var(--death);color:#fff}
.btn.donation{background:var(--donation);color:#fff}
.btn.success{background:var(--success);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.warning{background:var(--warning);color:#fff}
.btn.info{background:var(--info);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:12px;border-radius:10px}
.btn.lg{padding:14px 22px;min-height:52px;font-size:15px;border-radius:15px}
.btn.block{display:flex;width:100%}

/* ═══ أزرار كبيرة (Quick Actions) ═══ */
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.quick-actions.three{grid-template-columns:1fr 1fr 1fr}
.quick-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:16px 10px;border-radius:14px;
  background:var(--card);border:2px solid var(--border);
  cursor:pointer;text-align:center;
}
.quick-btn:active{transform:scale(.97);border-color:var(--primary)}
.quick-btn .ico{font-size:28px;line-height:1}
.quick-btn .lbl{font-size:12px;font-weight:800}
.quick-btn.assoc{border-color:var(--assoc)}
.quick-btn.assoc .lbl{color:var(--assoc)}
.quick-btn.death{border-color:var(--death)}
.quick-btn.death .lbl{color:var(--death)}
.quick-btn.donation{border-color:var(--donation)}
.quick-btn.donation .lbl{color:var(--donation)}

/* ═══ الزر العائم ═══ */
.fab{
  position:fixed;bottom:calc(88px + var(--safe));left:18px;
  width:60px;height:60px;border-radius:20px;
  background:var(--primary);color:#fff;font-size:28px;font-weight:300;
  box-shadow:0 12px 32px rgba(124,58,237,.5);
  z-index:25;display:flex;align-items:center;justify-content:center;
}
.fab:active{transform:scale(.92)}

/* ═══ القائمة السفلية ═══ */
.bnav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--card);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + var(--safe));
}
.bnav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:12px;
  color:var(--muted);font-size:10px;font-weight:700;min-width:0;
}
.bnav button .i{font-size:22px;line-height:1}
.bnav button.on{color:var(--primary)}
.bnav button.on .i{transform:scale(1.1)}

/* ═══ الأوراق (Sheets) ═══ */
.sheet-back{
  position:fixed;inset:0;background:rgba(15,23,42,.55);
  z-index:10100;opacity:0;pointer-events:none;transition:.2s;
  backdrop-filter:blur(3px);
}
.sheet-back.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:10101;
  background:var(--card);border-radius:24px 24px 0 0;
  max-height:94vh;overflow-y:auto;
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding-bottom:calc(16px + var(--safe));
}
.sheet.on{transform:translateY(0)}
.sheet.wide{max-height:98vh}
.sheet-grip{width:44px;height:5px;background:var(--border);border-radius:3px;margin:12px auto 0}
.sheet-hd{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 18px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--card);z-index:2;
}
.sheet-hd h2{font-size:16px;font-weight:800}
.sheet-bd{padding:16px 18px}
.sheet-ft{
  display:flex;gap:10px;padding:12px 18px;
  border-top:1px solid var(--border);
  position:sticky;bottom:0;background:var(--card);flex-wrap:wrap;
}
.sheet-ft .btn{flex:1;min-width:90px}

/* ═══ النماذج ═══ */
.fld{margin-bottom:14px;position:relative}
.fld label{
  display:block;font-size:12px;font-weight:700;
  color:var(--muted);margin-bottom:6px;
}
.fld label .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{
  width:100%;padding:12px 14px;
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:12px;font-size:15px;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  border-color:var(--primary);background:var(--card);
}
.fld input:disabled,.fld select:disabled{
  opacity:.6;cursor:not-allowed;
}
.fld textarea{resize:vertical;min-height:70px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld-hint{font-size:11px;color:var(--muted);margin-top:4px}

/* ═══ القائمة المنسدلة ═══ */
.options-list{
  position:absolute;top:100%;left:0;right:0;
  background:var(--card);border:1.5px solid var(--primary);
  border-radius:12px;max-height:250px;overflow-y:auto;
  z-index:100;margin-top:4px;display:none;
}
.options-list.on{display:block}
.option-item{
  padding:11px 14px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  gap:8px;border-bottom:1px solid var(--border);font-size:14px;
}
.option-item:active{background:var(--primary-soft)}
.option-item:last-child{border-bottom:0}
.option-item small{color:var(--muted);font-size:11px}

/* ═══ حقل المبلغ ═══ */
.amount-input{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:2px solid var(--primary);
  border-radius:14px;padding:8px 16px;
}
.amount-input input{
  flex:1;border:0;background:none;
  font-size:26px;font-weight:800;
  color:var(--primary);text-align:center;padding:8px 0;
}
.amount-input .currency{font-size:14px;font-weight:800;color:var(--muted)}
.amount-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.amount-quick button{
  padding:6px 12px;border-radius:10px;
  background:var(--primary-soft);color:var(--primary);
  font-size:12px;font-weight:700;
}

/* ═══ بلوك الرصيد ═══ */
.balance-block{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:12px;margin-bottom:10px;
}
.balance-row{
  display:flex;justify-content:space-between;
  padding:6px 0;font-size:13px;border-bottom:1px solid var(--border);
}
.balance-row:last-child{border-bottom:0}
.balance-row .lbl{color:var(--muted)}
.balance-row .val{font-weight:800}
.balance-row .val.green{color:var(--success)}
.balance-row .val.red{color:var(--danger)}
.balance-row .val.orange{color:var(--warning)}

/* ═══ شريط التقدم ═══ */
.progress{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:8px}
.progress > div{height:100%;border-radius:5px}
.progress.assoc > div{background:var(--assoc)}
.progress.death > div{background:var(--death)}

/* ═══ الحالة الفارغة ═══ */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ico{font-size:52px;opacity:.4;display:block;margin-bottom:10px}
.empty h3{font-size:15px;font-weight:700;margin-bottom:4px;color:var(--text)}
.empty p{font-size:12px}

/* ═══ التنبيهات ═══ */
.toasts{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:10200;display:flex;flex-direction:column;
  gap:8px;pointer-events:none;
  width:calc(100% - 28px);max-width:400px;
}
.toast{
  background:var(--text);color:var(--card);
  padding:12px 18px;border-radius:14px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
  pointer-events:auto;
}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--danger);color:#fff}
.toast.warning{background:var(--warning);color:#fff}
.toast.info{background:var(--info);color:#fff}

/* ═══ التحميل ═══ */
.loader{
  position:fixed;inset:0;background:rgba(15,23,42,.4);
  backdrop-filter:blur(3px);z-index:10300;
  display:none;align-items:center;justify-content:center;
}
.loader.on{display:flex}
.spin{
  width:42px;height:42px;
  border:3px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══ شاشة الدخول ═══ */
.login-screen{
  position:fixed;inset:0;z-index:10000;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  display:none;align-items:center;justify-content:center;
  padding:20px;overflow-y:auto;
}
.login-screen.on{display:flex}
.login-card{
  background:var(--card);color:var(--text);
  border-radius:24px;padding:28px 24px;
  max-width:400px;width:100%;margin:auto;
}
.login-card .logo-lg{
  width:64px;height:64px;border-radius:20px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:32px;margin:0 auto 16px;
}
.login-card h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:4px}
.login-card .sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:24px}
.users-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto}
.login-user{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-radius:14px;
  background:var(--bg);border:2px solid transparent;cursor:pointer;
}
.login-user:active{border-color:var(--primary);background:var(--primary-soft)}

/* ═══════════════════════════════════════════════════════════════
   IndexedDB
   ═══════════════════════════════════════════════════════════════ */
let db = null;

function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORE_NAMES.forEach(n => {
        if(!d.objectStoreNames.contains(n)){
          d.createObjectStore(n, { keyPath:'id', autoIncrement:true });
        }
      });
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}

const tx = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
const dbAll = s => new Promise((res, rej) => {
  const q = tx(s).getAll();
  q.onsuccess = () => res(q.result || []);
  q.onerror = () => rej(q.error);
});
const dbGet = (s, id) => new Promise((res, rej) => {
  const q = tx(s).get(id);
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
});
const dbPut = (s, o) => new Promise((res, rej) => {
  const q = tx(s, 'readwrite').put(o);
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
});
const dbDel = (s, id) => new Promise((res, rej) => {
  const q = tx(s, 'readwrite').delete(id);
  q.onsuccess = () => res();
  q.onerror = () => rej(q.error);
});

  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')

const cleanText = v => String(v ?? '').trim().replace(/\s+/g, ' ');

const normAr = v => String(v ?? '')
  .toLowerCase().trim()
  .replace(/[أإآ]/g, 'ا')
  .replace(/ة/g, 'ه')
  .replace(/[ىي]/g, 'ي')
  .replace(/[ًٌٍَُِّْـ]/g, '');

const cleanPhone = v => {
  if(!v) return '';
  let s = String(v).trim()
    .replace(/\.0+$/, '')
    .replace(/[\s\-\(\)\u200f\u200e]/g, '');
  if(s.startsWith('+963')) s = '0' + s.slice(4);
  return s;
};

const today = () => new Date().toISOString().slice(0, 10);

const debounce = (fn, d = 250) => {
  let t;
  return (...a) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...a), d);
  };
};

function fmtDate(d){
  if(!d) return '—';
  try {
    return new Date(d).toLocaleDateString('ar-EG', {
      year:'numeric', month:'short', day:'numeric'
    });
  } catch(e){ return d; }
}

function toDate(v){
  if(!v) return '';
  if(typeof v === 'string' && v.trim().startsWith('=')) return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if(typeof v === 'number'){
    const d = new Date((v - 25569) * 86400000);
    return isNaN(d) ? '' : d.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  const m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]|$)/);
  if(m1) return `${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;
  const m2 = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m2) return `${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
  const d = new Date(s);
  if(!isNaN(d) && d.getFullYear() > 1900 && d.getFullYear() < 2100){
    return d.toISOString().slice(0, 10);
  }
  return '';
}

function fmtNum(n){
  if(n === null || n === undefined || n === '') return '0';
  const num = Number(n);
  if(isNaN(num)) return '0';
  return num.toLocaleString('en-US');
}

function fmtShort(n){
  if(!n && n !== 0) return '0';
  const num = Number(n);
  if(num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
  if(num >= 1000) return (num / 1000).toFixed(1) + 'K';
  return String(num);
}

    setTimeout(() => {

      if(el) el.focus();

function canSeeFund(fund){
  if(!S.currentUser) return false;
  const r = S.currentUser.role;
  if(r === 'manager' || r === 'president' || r === 'auditor') return true;
  if(r === 'assocTreasurer') return fund === 'assoc';
  if(r === 'deathTreasurer') return fund === 'death';
  if(r === 'collector'){
    const cf = S.currentUser.collectFund;
    if(!cf || cf === 'both') return true;
    return cf === fund;
  }
  if(r === 'member') return true;   // حساب خاص
  return false;
}

/* ═══════════════════════════════════════════════════════════════
   📌 [قسم 3] — الحسابات (القلب النابض)
   ✅ [FIX-001] فلترة الدفعات حسب السنة بدقة
   ⚡ [PERF-001] Cache
   ═══════════════════════════════════════════════════════════════ */

function getConstants(year){
  const c = S.constants.find(x => x.year === year);
  if(c) return c;
  const sorted = [...S.constants].sort((a, b) => b.year - a.year);
  return sorted[0] || null;
}

/* ✅ حساب مستحقات عضو لسنة واحدة */
function computeMemberYear(member, year){
  const c = getConstants(year);
  const empty = {
    year,
    assoc: { yearlyReq:0, joinReq:0, req:0, paid:0, rem:0 },
    death: { installReq:0, joinReq:0, req:0, paid:0, rem:0 }
  };
  if(!c) return empty;

  const status = member.memberStatus || 'نشط';
  const stopYear = member.stopYear || member.withdrawYear;
  if((status === 'منسحب' || status === 'متوقف') && stopYear && year >= stopYear){
    return { ...empty, skipped: true, reason: status };
  }

  const isReduced = member.memberType === 'مخفض';
  const assocYearlyFee = (isReduced && c.assocYearlyReduced)
    ? c.assocYearlyReduced : c.assocYearly;
  const joinAssocFee = (isReduced && c.joinAssocFeeReduced)
    ? c.joinAssocFeeReduced : c.joinAssocFee;
  const joinDeathFee = (isReduced && c.joinDeathFeeReduced)
    ? c.joinDeathFeeReduced : c.joinDeathFee;

  const result = {
    year,
    assoc: { yearlyReq:0, joinReq:0, req:0, paid:0, rem:0 },
    death: { installReq:0, joinReq:0, req:0, paid:0, rem:0 }
  };

  // 💰 الجمعية
  if(member.assocStartYear &&
     year >= member.assocStartYear &&
     year >= BASE_YEAR &&
     !member.assocExempt){
    result.assoc.yearlyReq += assocYearlyFee;
    if(year === member.assocStartYear && member.assocStartYear >= BASE_YEAR){
      result.assoc.joinReq += joinAssocFee;
    }
  }

  // ⚰️ الوفاة
  if(member.deathStartYear &&
     year >= member.deathStartYear &&
     year >= BASE_YEAR &&
     !member.deathExempt){
    if(year === member.deathStartYear && member.deathStartYear >= BASE_YEAR){
      result.death.joinReq += joinDeathFee;
    }
    const yearDeaths = S.deaths.filter(d => Number(d.year) === year);
    result.death.installReq += yearDeaths.length * c.deathInstallment;
  }

  result.assoc.req = result.assoc.yearlyReq + result.assoc.joinReq;
  result.death.req = result.death.installReq + result.death.joinReq;

  // ⭐ [FIX-001] فلترة الدفعات حسب السنة
  const memberPayments = S.payments.filter(p =>
    p.memberId === member.id &&
    (Number(p.forYear) === year || Number(p.year) === year)
  );

  result.assoc.paid = memberPayments
    .filter(p => p.fund === 'assoc')
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);

  result.death.paid = memberPayments
    .filter(p => p.fund === 'death')
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);

  result.assoc.rem = result.assoc.req - result.assoc.paid;
  result.death.rem = result.death.req - result.death.paid;

  return result;
}

/* ✅ [PERF-001] حساب كل سنوات العضو مع Cache */
function computeMemberFull(memberId){
  // ⚡ ابحث في الـ Cache أولاً
  if(CACHE.memberFull.has(memberId)){
    return CACHE.memberFull.get(memberId);
  }

  const member = getMemberById(memberId);
  if(!member) return null;

  const starts = [member.assocStartYear, member.deathStartYear].filter(x => x);
  if(!starts.length){
    const result = {
      member,
      years: [],
      total: {
        assocReq:0, assocPaid:0, assocRem:0,
        assocYearlyReq:0, assocJoinReq:0,
        deathReq:0, deathPaid:0, deathRem:0,
        deathInstallReq:0, deathJoinReq:0,
        totalRem:0, totalReq:0, totalPaid:0
      }
    };
    CACHE.memberFull.set(memberId, result);
    return result;
  }

  const firstYear = Math.max(BASE_YEAR, Math.min(...starts));
  const years = [];
  for(let y = firstYear; y <= S.currentYear; y++){
    const yd = computeMemberYear(member, y);
    yd.year = y;
    years.push(yd);
  }

  const total = years.reduce((acc, y) => ({
    assocReq:        acc.assocReq + y.assoc.req,
    assocPaid:       acc.assocPaid + y.assoc.paid,
    assocRem:        acc.assocRem + (y.assoc.req - y.assoc.paid),
    assocYearlyReq:  acc.assocYearlyReq + y.assoc.yearlyReq,
    assocJoinReq:    acc.assocJoinReq + y.assoc.joinReq,
    deathReq:        acc.deathReq + y.death.req,
    deathPaid:       acc.deathPaid + y.death.paid,
    deathRem:        acc.deathRem + (y.death.req - y.death.paid),
    deathInstallReq: acc.deathInstallReq + y.death.installReq,
    deathJoinReq:    acc.deathJoinReq + y.death.joinReq
  }), {
    assocReq:0, assocPaid:0, assocRem:0,
    assocYearlyReq:0, assocJoinReq:0,
    deathReq:0, deathPaid:0, deathRem:0,
    deathInstallReq:0, deathJoinReq:0
  });

  total.totalReq = total.assocReq + total.deathReq;
  total.totalPaid = total.assocPaid + total.deathPaid;
  total.totalRem = total.totalReq - total.totalPaid;

  const result = { member, years, total };
  CACHE.memberFull.set(memberId, result);
  return result;
}

/* ✅ إحصائيات الأعضاء — مع Cache */
function getMembersStats(year){
  const y = year || S.currentYear;
  
  if(CACHE.stats && CACHE.statsYear === y) return CACHE.stats;

  let onlyAssoc = 0, onlyDeath = 0, both = 0, none = 0, late = 0;
  let lateTotal = 0, active = 0, withdrawn = 0, deceased = 0;
  let exemptCount = 0, frozen = 0;

  for(const m of S.members){
    const st = m.memberStatus || 'نشط';
    if(st === 'نشط') active++;
    else if(st === 'منسحب') withdrawn++;
    else if(st === 'متوقف') frozen++;
    else if(st === 'متوفى') deceased++;
    else if(st === 'معفى') exemptCount++;

    const hasAssoc = m.assocStartYear &&
                     m.assocStartYear <= y &&
                     !m.assocExempt;
    const hasDeath = m.deathStartYear &&
                     m.deathStartYear <= y &&
                     !m.deathExempt;
    if(hasAssoc && hasDeath) both++;
    else if(hasAssoc) onlyAssoc++;
    else if(hasDeath) onlyDeath++;
    else none++;

    if(m.assocStartYear || m.deathStartYear){
      const full = computeMemberFull(m.id);
      if(full && full.total.totalRem > 0){
        late++;
        lateTotal += full.total.totalRem;
      }
    }
  }

  const result = {
    year: y,
    total: S.members.length,
    onlyAssoc, onlyDeath, both, none, late, lateTotal,
    active, withdrawn, deceased,
    exempt: exemptCount, frozen
  };

  CACHE.stats = result;
  CACHE.statsYear = y;
  return result;
}

/* ✅ أرصدة الصناديق */
function getFundBalances(year){
  const y = year || S.currentYear;

  if(CACHE.fundBalances && CACHE.fundBalancesYear === y){
    return CACHE.fundBalances;
  }

  const sum = (arr, key = 'amount') =>
    arr.reduce((s, x) => s + (Number(x[key]) || 0), 0);

  const assocPayments = sum(S.payments.filter(p =>
    Number(p.year) === y && p.fund === 'assoc'));
  const assocIncomes = sum(S.incomes.filter(i =>
    Number(i.year) === y && i.fund === 'assoc'));
  const assocExpenses = sum(S.expenses.filter(e =>
    Number(e.year) === y && e.fund === 'assoc'));
  const assocBalance = assocPayments + assocIncomes - assocExpenses;

  const deathPayments = sum(S.payments.filter(p =>
    Number(p.year) === y && p.fund === 'death'));
  const deathIncomes = sum(S.incomes.filter(i =>
    Number(i.year) === y && i.fund === 'death'));
  const deathExpenses = sum(S.expenses.filter(e =>
    Number(e.year) === y && e.fund === 'death'));
  const deathCompensations = sum(
    S.deaths.filter(d => Number(d.year) === y),
    'compensation'
  );
  const deathBalance = deathPayments + deathIncomes -
                       deathExpenses - deathCompensations;

  const donations = sum(S.payments.filter(p =>
    Number(p.year) === y && p.fund === 'donation'));

  const result = {
    year: y,
    assoc: {
      payments: assocPayments,
      incomes: assocIncomes,
      expenses: assocExpenses,
      balance: assocBalance
    },
    death: {
      payments: deathPayments,
      incomes: deathIncomes,
      expenses: deathExpenses,
      compensations: deathCompensations,
      balance: deathBalance
    },
    donations,
    total: assocBalance + deathBalance
  };

  CACHE.fundBalances = result;
  CACHE.fundBalancesYear = y;
  return result;
}

/* ✅ عهدة المستخدم (كم في يده) */
function getUserCustody(userId, fund = 'all'){
  let payments = S.payments.filter(p => p.collectorId === userId);
  if(fund !== 'all') payments = payments.filter(p => p.fund === fund);

  let deliveries = S.deliveries.filter(d => d.fromUserId === userId);
  if(fund !== 'all') deliveries = deliveries.filter(d => d.fund === fund);

  let received = S.deliveries.filter(d => d.toUserId === userId);
  if(fund !== 'all') received = received.filter(d => d.fund === fund);

  const collected = payments.reduce((s, p) =>
    s + (Number(p.amount) || 0), 0);
  const delivered = deliveries.reduce((s, d) =>
    s + (Number(d.amount) || 0), 0);
  const receivedSum = received.reduce((s, d) =>
    s + (Number(d.amount) || 0), 0);

  return {
    collected,
    delivered,
    received: receivedSum,
    balance: collected - delivered + receivedSum
  };
}

/* ✅ تفصيل عهدة المعتمد حسب الصندوق والسنة */
function getCollectorBreakdown(userId, year){
  const y = year || S.currentYear;
  const myPayments = S.payments.filter(p =>
    p.collectorId === userId &&
    (Number(p.forYear) === y || Number(p.year) === y)
  );
  const myDeliveries = S.deliveries.filter(d =>
    d.fromUserId === userId &&
    new Date(d.date).getFullYear() === y
  );

  const byFund = fund => ({
    collected: myPayments
      .filter(p => p.fund === fund)
      .reduce((s, p) => s + (Number(p.amount) || 0), 0),
    delivered: myDeliveries
      .filter(d => d.fund === fund)
      .reduce((s, d) => s + (Number(d.amount) || 0), 0)
  });

  const assoc = byFund('assoc');
  const death = byFund('death');
  const donation = byFund('donation');

  return {
    year: y,
    assoc:    { ...assoc,    rem: assoc.collected - assoc.delivered },
    death:    { ...death,    rem: death.collected - death.delivered },
    donation: { ...donation, rem: donation.collected - donation.delivered },
    total: {
      collected: assoc.collected + death.collected + donation.collected,
      delivered: assoc.delivered + death.delivered + donation.delivered,
      rem: (assoc.collected + death.collected + donation.collected) -
           (assoc.delivered + death.delivered + donation.delivered)
    }
  };
}

/* ✅ تفصيل كل أعوام المعتمد */
function getCollectorAllYears(userId){
  const years = [];
  for(let y = BASE_YEAR; y <= BASE_YEAR + 4; y++){
    const bd = getCollectorBreakdown(userId, y);
    if(bd.total.collected > 0 || bd.total.delivered > 0){
      years.push(bd);
    }
  }
  return years;
}

function selectLoginUser(id){
  const u = S.users.find(a => a.id === id);
  if(!u) return;
  _pinTargetUser = u;
  _pinAttempt = '';

  if(!u.hasPin){ doLogin(u); return; }

  $('loginUsers').style.display = 'none';
  $('loginPin').style.display = 'block';
  const r = ROLES[u.role] || { name: 'مستخدم', icon: '👤' };
  $('pinAvatar').textContent = r.icon;
  $('pinName').textContent = u.name;
  $('pinRole').textContent = r.name;
  $('pinError').textContent = '';
  updatePinDisplay();
}

function pinPress(d){
  if(_pinAttempt.length >= 4) return;
  _pinAttempt += d;
  updatePinDisplay();
  if(_pinAttempt.length === 4) setTimeout(checkPin, 200);
}

function pinBack(){
  _pinAttempt = _pinAttempt.slice(0, -1);
  updatePinDisplay();
}

function pinBackLogin(){
  $('loginPin').style.display = 'none';
  $('loginUsers').style.display = 'block';
  _pinAttempt = '';
  _pinTargetUser = null;
}

function updatePinDisplay(){
  $$('#pinDisplay .pin-dot').forEach((d, i) => {
    d.classList.toggle('on', i < _pinAttempt.length);
  });
}

function checkPin(){
  if(!_pinTargetUser) return;

  if(_pinAttempt === String(_pinTargetUser.pin)){
    $('pinError').textContent = '✅ صحيح';
    $('pinError').style.color = 'var(--success)';
    setTimeout(() => doLogin(_pinTargetUser), 400);
  } else {
    $('pinError').textContent = '❌ خطأ';
    $('pinError').style.color = 'var(--danger)';
    _pinAttempt = '';
    updatePinDisplay();
  }
}

async function saveFirstAdmin(){
  const name = cleanText($('fName').value);
  const pin = $('fPin').value.trim();
  const pin2 = $('fPin2').value.trim();

  if(!name){ toast('الاسم مطلوب', 'error'); return; }
  if(!/^\d{4}$/.test(pin)){ toast('كلمة المرور: 4 أرقام', 'error'); return; }
  if(pin !== pin2){ toast('كلمتا المرور غير متطابقتين', 'error'); return; }

  try{
    const user = {
      name,
      phone: cleanPhone($('fPhone').value),
      pin,
      hasPin: true,
      role: 'manager',
      createdAt: new Date().toISOString()
    };
    const newId = await dbPut('users', user);
    user.id = newId;
    S.users.push(user);
    closeSheet();
    toast('✅ تم الإنشاء', 'success', 3000);
    setTimeout(renderLogin, 400);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

function buildBottomNav(){

  if(!u) return;

  const nav = NAV_BY_ROLE[u.role] || NAV_BY_ROLE.member;
  $('appNav').innerHTML = nav.map(item => `
    <button data-pg="${item.pg}" onclick="go('${item.pg}')">

    </button>
  `).join('');

function go(page){
  S.page = page;

  // إخفاء كل الصفحات
  $$('.page').forEach(p => p.classList.remove('active'));

  // إظهار الصفحة المطلوبة
  const target = $(page);
  if(!target){
    console.warn('⚠️ صفحة غير موجودة:', page);
    return;
  }
  target.classList.add('active');

  // تحديث القائمة السفلية
  $$('.bnav button').forEach(b => {
    b.classList.toggle('on', b.dataset.pg === page);
  });

  window.scrollTo(0, 0);

  // إظهار/إخفاء الزر العائم
  const fabPages = ['pg-collect', 'pg-members', 'pg-inout'];
  $('fab').style.display = fabPages.includes(page) ? 'flex' : 'none';

  // استدعاء دالة العرض المناسبة
  const renderers = {
    'pg-home':          renderHome,
    'pg-collect':       renderCollect,
    'pg-late':          renderLate,
    'pg-my-deliveries': renderMyDeliveries,
    'pg-inbox':         renderInbox,
    'pg-inout':         renderInOut,
    'pg-members':       renderMembersPage,
    'pg-funds':         renderFundsHub,
    'pg-deaths':        renderDeathsPage,
    'pg-store':         renderStorePage,
    'pg-meetings':      renderMeetingsPage,
    'pg-reports':       renderReportsPage,
    'pg-archive':       renderArchivePage,
    'pg-admin':         renderAdminPage,
    'pg-my-account':    renderMyAccount
  };

  if(renderers[page]){
    try {
      renderers[page]();
    } catch(e){
      console.error('❌ خطأ في عرض الصفحة ' + page, e);
      target.innerHTML = `
        <div class="empty">
          <span class="ico">⚠️</span>
          <h3>خطأ في العرض</h3>
          <p>${esc(e.message)}</p>
        </div>`;
    }
  }
}

async function ensureDefaultConstants(){
  const years = [];
  for(let y = BASE_YEAR; y <= BASE_YEAR + 4; y++) years.push(y);

  let added = 0;
  for(const year of years){
    if(!S.constants.find(c => c.year === year)){
      const c = {
        year,
        assocYearly: 24000,
        assocYearlyReduced: 15000,
        deathInstallment: 5000,
        deathCompensation: 25000,
        joinAssocFee: 100000,
        joinAssocFeeReduced: 50000,
        joinDeathFee: 50000,
        joinDeathFeeReduced: 25000,
        createdAt: new Date().toISOString()
      };
      const id = await dbPut('constants', c);
      c.id = id;
      S.constants.push(c);
      added++;
    }
  }
  if(added > 0) console.log(`✅ تم إضافة ${added} سنة`);
}

async function init(){
  const savedTheme = localStorage.getItem('zt_theme');
  if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  const savedYear = localStorage.getItem('zt_year');
  if(savedYear) S.currentYear = Number(savedYear);

  try {
    await openDB();
    await loadAll();
    await ensureDefaultConstants();

    const su = restoreCurrentUser();
    if(su){
      const full = S.users.find(u => u.id === su.id);
      if(full){
        S.currentUser = full;
        showMain();
        return;
      }
      saveCurrentUser(null);
    }
    showLogin();
  } catch(e){
    console.error('init error', e);
    toast('خطأ في التحميل: ' + e.message, 'error', 5000);
  }
}

function renderCollect(){
  const u = S.currentUser;
  const isCollector = u.role === 'collector';
  
  // فلتر قيود المعتمد
  let list = S.members;
  
  if(isCollector){
    // المعتمد: فقط مشتركو قطاعه
    list = list.filter(m => {
      const cf = u.collectFund;
      if(cf === 'assoc') return m.assocStartYear;
      if(cf === 'death') return m.deathStartYear;
      return m.assocStartYear || m.deathStartYear;
    });
    if(u.sector) list = list.filter(m => m.sector === u.sector);
  }

  // الفلتر النشط
  const f = S.filters.collector || 'all';
  if(f === 'late'){
    list = list.filter(m => {
      const full = computeMemberFull(m.id);
      return full && full.total.totalRem > 0;
    });
  } else if(f === 'paid'){
    list = list.filter(m => {
      const full = computeMemberFull(m.id);
      return full && full.total.totalRem <= 0;
    });
  }

  // البحث
  if(S.search){
    const s = normAr(S.search);
    list = list.filter(m =>
      normAr(`${m.name} ${m.code||''} ${m.phone||''}`).includes(s)
    );
  }

  // الترتيب: متأخرون أولاً
  list.sort((a, b) => {
    const fa = computeMemberFull(a.id);
    const fb = computeMemberFull(b.id);
    const ra = fa?.total.totalRem || 0;
    const rb = fb?.total.totalRem || 0;
    if(ra !== rb) return rb - ra;
    return String(a.name).localeCompare(String(b.name), 'ar');
  });

  $('pg-collect').innerHTML = `
    <div class="card" style="padding:12px">
      <div class="chips">
        <button class="chip ${f === 'all' ? 'on' : ''}" onclick="setCollectorFilter('all')">📋 الكل (${countCollectorMembers(u, 'all')})</button>
        <button class="chip ${f === 'late' ? 'on' : ''}" onclick="setCollectorFilter('late')">⏳ متأخرون (${countCollectorMembers(u, 'late')})</button>
        <button class="chip ${f === 'paid' ? 'on' : ''}" onclick="setCollectorFilter('paid')">✅ مسددون (${countCollectorMembers(u, 'paid')})</button>
      </div>
    </div>

    ${list.length ? `<div class="list">
      ${list.slice(0, 500).map(m => renderCollectorMemberRow(m)).join('')}
    </div>` : `
      <div class="empty">
        <span class="ico">👥</span>
        <h3>لا يوجد أعضاء</h3>
        <p>جرّب فلتراً آخر</p>
      </div>`}
  `;
}

function countCollectorMembers(u, filter){
  let list = S.members;
  if(u.role === 'collector'){
    list = list.filter(m => {
      const cf = u.collectFund;
      if(cf === 'assoc') return m.assocStartYear;
      if(cf === 'death') return m.deathStartYear;
      return m.assocStartYear || m.deathStartYear;
    });
    if(u.sector) list = list.filter(m => m.sector === u.sector);
  }
  if(filter === 'late'){
    return list.filter(m => {
      const full = computeMemberFull(m.id);
      return full && full.total.totalRem > 0;
    }).length;
  }
  if(filter === 'paid'){
    return list.filter(m => {
      const full = computeMemberFull(m.id);
      return full && full.total.totalRem <= 0;
    }).length;
  }
  return list.length;
}

      <div class="body">

          : `<div style="color:var(--success);font-size:20px">✓</div>`}

}

      if(!m.assocStartYear && !m.deathStartYear) return false;
      if(u.sector && m.sector !== u.sector) return false;
    }
    return true;
  }).map(m => {
    const full = computeMemberFull(m.id);
    return { m, rem: full?.total.totalRem || 0 };
  }).filter(x => x.rem > 0)
    .sort((a, b) => b.rem - a.rem);

  const total = list.reduce((s, x) => s + x.rem, 0);

  $('pg-late').innerHTML = `
    <div style="padding:20px;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border-radius:20px;margin-bottom:14px;text-align:center">

      <div style="font-size:34px;font-weight:800;margin-top:4px">${fmtNum(total)}</div>
      <div style="font-size:12px;opacity:.85;margin-top:2px">عدد: ${list.length} عضو</div>
    </div>

    ${list.length ? `
      <button class="btn success block" style="margin-bottom:12px" onclick="shareLatePayersToWA()">📱 إرسال قائمة للمراجعة</button>
      <div class="list">
        ${list.map(({ m, rem }) => `
          <div class="item" onclick="openQuickPaySheet(${m.id})">
            <div class="av red">⚠️</div>
            <div class="body">
              <div class="ttl">${esc(m.name)}</div>
              <div class="sub">${esc(m.sector||'')}</div>
            </div>
            <div style="font-weight:800;color:var(--danger);font-size:14px">${fmtNum(rem)}</div>
          </div>
        `).join('')}
      </div>
    ` : `
      <div class="empty">
        <span class="ico">🎉</span>
        <h3>لا يوجد متأخرون</h3>
        <p>ممتاز! الجميع سدَّد التزاماته</p>
      </div>
    `}
  `;
}

function shareLatePayersToWA(){
  const u = S.currentUser;
  const list = S.members.filter(m => {
    if(u.role === 'collector'){
      const cf = u.collectFund;
      if(cf === 'assoc' && !m.assocStartYear) return false;
      if(cf === 'death' && !m.deathStartYear) return false;
      if(u.sector && m.sector !== u.sector) return false;
    }
    return true;
  }).map(m => {
    const full = computeMemberFull(m.id);
    return { name: m.name, code: m.code || '', rem: full?.total.totalRem || 0 };
  }).filter(x => x.rem > 0).sort((a, b) => b.rem - a.rem);

  if(!list.length){ toast('لا يوجد متأخرون', 'success'); return; }

  let txt = `⏰ *قائمة المتأخرين — ${S.currentYear}*\n`;
  txt += `عدد: ${list.length}\n`;
  if(u.sector) txt += `📍 القطاع: ${u.sector}\n`;
  txt += `\n`;
  list.forEach((p, i) => {
    txt += `${i+1}. ${p.name}`;
    if(p.code) txt += ` (${p.code})`;
    txt += ` — ${fmtNum(p.rem)} ل.س\n`;
  });
  txt += `\n_صندوق زعورة_`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

  $('pg-inbox').innerHTML = `

        <div class="card-head"><h2>🟡 بانتظار الاستلام</h2></div>
        <div class="list" style="margin:-16px;border-radius:0;border:0">
          ${pending.map(d => `
            <div class="item" style="cursor:default">
              <div class="av ${d.fund === 'death' ? 'red' : 'blue'}">📥</div>
              <div class="body">
                <div class="ttl">${esc(d.fromUserName || 'معتمد')}</div>
                <div class="sub">${fmtDate(d.date)} • ${d.notes ? esc(d.notes) : 'تسليم جديد'}</div>
              </div>
              <div style="text-align:left">
                <div style="font-weight:800;color:var(--primary);font-size:14px">${fmtNum(d.amount)}</div>
              </div>
            </div>

              <button class="btn success sm" style="flex:1" onclick="receiveDelivery(${d.id})">✅ استلمت</button>
              <button class="btn danger sm" style="flex:1" onclick="rejectDelivery(${d.id})">❌ رفض</button>
              ${d.fromUserId ? `<button class="btn ghost sm" onclick="waDelivery(${d.id})">📱</button>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    ` : `
      <div class="empty">
        <span class="ico">✅</span>
        <h3>لا توجد تسليمات معلقة</h3>
        <p>كل التسليمات مستلمة</p>
      </div>
    `}

    ${received.length ? `
      <div class="card" style="margin-top:14px">
        <div class="card-head"><h2>✅ مستلمة (آخر 30)</h2></div>
        <div style="margin:-16px;border-radius:0">
          ${received.slice(0, 30).map(d => `
            <div class="item" style="cursor:default">
              <div class="av green">✓</div>
              <div class="body">
                <div class="ttl">${esc(d.fromUserName || 'معتمد')}</div>
                <div class="sub">${fmtDate(d.date)}${d.receivedAt ? ' • استُلم ' + fmtDate(d.receivedAt) : ''}</div>
              </div>
              <div style="font-weight:800;color:var(--success);font-size:14px">${fmtNum(d.amount)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    ` : ''}
  `;
}

async function receiveDelivery(id){
  const d = S.deliveries.find(x => x.id === id);
  if(!d) return;
  if(!confirm(`استلام ${fmtNum(d.amount)} ل.س من ${d.fromUserName}؟`)) return;

  try {
    d.toUserId = S.currentUser.id;
    d.toUserName = S.currentUser.name;
    d.receivedAt = new Date().toISOString();
    d.receivedBy = S.currentUser.name;
    await dbPut('deliveries', d);
    CACHE.invalidateAll();
    toast('✅ تم استلام التسليم', 'success', 2500);
    renderInbox();
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

async function rejectDelivery(id){
  const d = S.deliveries.find(x => x.id === id);
  if(!d) return;
  const reason = prompt('سبب الرفض؟');
  if(!reason) return;

  try {
    d.rejectedAt = new Date().toISOString();
    d.rejectedBy = S.currentUser.name;
    d.rejectReason = reason;
    await dbPut('deliveries', d);
    toast('❌ تم الرفض', 'warning', 2500);
    renderInbox();
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

function waDelivery(id){
  const d = S.deliveries.find(x => x.id === id);
  if(!d) return;
  const txt = `📥 *توثيق استلام*\n\nمن: ${d.fromUserName}\nالمبلغ: ${fmtNum(d.amount)} ل.س\nالصندوق: ${d.fund === 'assoc' ? '💰 الجمعية' : '⚰️ الوفاة'}\nالتاريخ: ${fmtDate(d.date)}\n\n_صندوق زعورة_`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

function renderRecentFundOps(fund){
  const ops = [];

  S.payments.filter(p => p.fund === fund).slice(-15).forEach(p => {
    const m = p.memberId ? getMemberById(p.memberId) : null;
    ops.push({
      icon: fund === 'death' ? '⚰️' : '💰',
      name: m?.name || p.notes || 'دفعة',
      label: 'دفعة',
      amount: Number(p.amount) || 0,
      date: p.date,
      ts: new Date(p.createdAt || 0).getTime()
    });
  });

  S.incomes.filter(i => i.fund === fund).slice(-10).forEach(i => {
    ops.push({
      icon: '📥',
      name: i.notes || 'إيراد',
      label: i.category || 'إيراد',
      amount: Number(i.amount) || 0,
      date: i.date,
      ts: new Date(i.createdAt || 0).getTime()
    });
  });

  S.expenses.filter(e => e.fund === fund).slice(-10).forEach(e => {
    ops.push({
      icon: '💸',
      name: e.description,
      label: e.category || 'مصروف',
      amount: -(Number(e.amount) || 0),
      date: e.date,
      ts: new Date(e.createdAt || 0).getTime()
    });
  });

  if(fund === 'death'){
    S.deaths.slice(-10).forEach(d => {
      ops.push({
        icon: '🪦',
        name: d.deceasedName,
        label: 'تعويض',
        amount: -(Number(d.compensation) || 0),
        date: d.deathDate,
        ts: new Date(d.createdAt || 0).getTime()
      });
    });
  }

  ops.sort((a, b) => b.ts - a.ts);
  const recent = ops.slice(0, 8);

  return recent.length ? `
    <div class="list" style="margin:-16px;border-radius:0;border:0">
      ${recent.map(op => `
        <div class="item" style="cursor:default">
          <div class="av ${op.amount < 0 ? 'red' : 'green'}">${op.icon}</div>
          <div class="body">
            <div class="ttl">${esc(op.name)}</div>
            <div class="sub">${esc(op.label)} • ${fmtDate(op.date)}</div>
          </div>
          <div style="font-weight:800;font-size:13px;color:${op.amount < 0 ? 'var(--danger)' : 'var(--success)'}">
            ${op.amount < 0 ? '' : '+'}${fmtNum(Math.abs(op.amount))}
          </div>
        </div>
      `).join('')}
    </div>
  ` : '<div style="text-align:center;padding:20px;color:var(--muted);font-size:12px">لا توجد عمليات</div>';
}

function openFundPaymentForm(fund, memberId){
  const y = S.currentYear;
  const labels = {
    assoc:    { icon:'💰', name:'دفعة جمعية', color:'assoc' },
    death:    { icon:'⚰️', name:'دفعة وفاة', color:'death' },
    donation: { icon:'💚', name:'تبرع', color:'donation' }
  };
  const L = labels[fund];
  const showSearch = fund !== 'donation';

  const body = `
    <div style="padding:14px;background:var(--${L.color}-soft);border-radius:14px;margin-bottom:14px;text-align:center;border:2px solid var(--${L.color})">
      <div style="font-size:32px">${L.icon}</div>
      <div style="font-size:15px;font-weight:800;color:var(--${L.color});margin-top:4px">${L.name}</div>
    </div>

    ${showSearch ? `
      <div class="fld" style="position:relative">
        <label>العضو <span class="req">*</span></label>
        <input id="pMemberInput" placeholder="اكتب اسم العضو..." oninput="onPaymentMemberSearch('${fund}')" autocomplete="off" ${memberId ? 'disabled' : ''}>
        <input type="hidden" id="pMemberId" value="${memberId || ''}">
        <div class="options-list" id="pMemberOptions"></div>
      </div>
    ` : `
      <div class="fld"><label>اسم المتبرع</label><input id="pDonorName" placeholder="اختياري"></div>
    `}

    <div id="pDuesBox" style="display:none;margin-bottom:14px"></div>

    <div class="fld" id="pAmountField" style="display:none">
      <label>المبلغ <span class="req">*</span></label>
      <div class="amount-input">
        <input id="pAmount" type="tel" inputmode="numeric" placeholder="0">
        <span class="currency">ل.س</span>
      </div>
      <div class="amount-quick" id="pQuickButtons"></div>
    </div>

    <div class="fld-row" id="pDateRow" style="display:none">
      <div class="fld">
        <label>التاريخ</label>
        <input id="pDate" type="date" value="${today()}">
      </div>
      <div class="fld">
        <label>سنة الدفعة</label>
        <select id="pForYear">
          ${[2025,2026,2027,2028,2029].map(yy => `<option value="${yy}" ${yy === y ? 'selected' : ''}>${yy}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="fld" id="pNotesField" style="display:none">
      <label>ملاحظات</label>
      <input id="pNotes" placeholder="اختياري">
    </div>
  `;

  const foot = `
    <button class="btn ghost" onclick="closeSheet()">إلغاء</button>
    <button class="btn primary" onclick="savePaymentNew('${fund}')">💾 حفظ</button>
  `;
  openSheet(`${L.icon} ${L.name}`, body, foot, { focus: showSearch ? 'pMemberInput' : 'pDonorName' });

  window._currentFund = fund;

  if(fund === 'donation'){
    $('pAmountField').style.display = 'block';
    $('pDateRow').style.display = 'grid';
    $('pNotesField').style.display = 'block';
    $('pQuickButtons').innerHTML = `
      <button onclick="$('pAmount').value=5000">5,000</button>
      <button onclick="$('pAmount').value=10000">10,000</button>
      <button onclick="$('pAmount').value=50000">50,000</button>
      <button onclick="$('pAmount').value=100000">100,000</button>
    `;
  } else if(memberId){
    const m = getMemberById(memberId);
    if(m){
      $('pMemberInput').value = m.name;
      $('pMemberId').value = m.id;
      setTimeout(() => showPaymentDues(fund, m.id), 150);
    }
  }
}

function onPaymentMemberSearch(fund){
  const input = $('pMemberInput');
  const opts = $('pMemberOptions');
  if(!input || !opts) return;

  const q = input.value.trim();
  const isAssoc = fund === 'assoc';
  const isDeath = fund === 'death';

  let list = S.members.filter(m => {
    if(isAssoc) return m.assocStartYear && !m.assocExempt;
    if(isDeath) return m.deathStartYear && !m.deathExempt;
    return false;
  });

  // قيود المعتمد
  const u = S.currentUser;
  if(u.role === 'collector'){
    if(u.sector) list = list.filter(m => m.sector === u.sector);
  }

  if(q){
    const s = normAr(q);
    list = list.filter(m =>
      normAr(`${m.name} ${m.code||''} ${m.sector||''}`).includes(s)
    );
  }
  list = list.slice(0, 30);

  if(!list.length){
    opts.innerHTML = `<div style="padding:12px;color:var(--muted);text-align:center">${q ? 'لا نتائج' : 'اكتب اسماً'}</div>`;
  } else {
    opts.innerHTML = list.map(m => {
      const full = computeMemberFull(m.id);
      const rem = isAssoc ? (full?.total.assocRem || 0) : (full?.total.deathRem || 0);
      return `
        <div class="option-item" onclick="pickPaymentMember(${m.id},'${esc(m.name).replace(/'/g,"&#39;")}','${fund}')">
          <div style="flex:1;min-width:0">
            <div style="font-weight:700">${esc(m.name)}</div>
            <div style="font-size:10px;color:var(--muted)">${esc(m.code||'')} • ${esc(m.sector||'')}</div>
          </div>
          <small style="color:${rem > 0 ? 'var(--danger)' : 'var(--success)'};font-weight:700">
            ${rem > 0 ? 'متبقي ' + fmtShort(rem) : '✅'}
          </small>
        </div>
      `;
    }).join('');
  }
  opts.classList.add('on');
}

function pickPaymentMember(id, name, fund){
  $('pMemberInput').value = name;
  $('pMemberId').value = id;
  $('pMemberOptions').classList.remove('on');
  showPaymentDues(fund, id);
}

function showPaymentDues(fund, memberId){
  const m = getMemberById(memberId);
  if(!m) return;
  const full = computeMemberFull(memberId);
  if(!full) return;

  const isAssoc = fund === 'assoc';
  const color = isAssoc ? 'assoc' : 'death';
  const rem = isAssoc ? full.total.assocRem : full.total.deathRem;
  const req = isAssoc ? full.total.assocReq : full.total.deathReq;
  const paid = isAssoc ? full.total.assocPaid : full.total.deathPaid;

  $('pDuesBox').innerHTML = `
    <div style="padding:12px;background:var(--bg);border-radius:12px;border:2px solid var(--${color})">
      <div style="font-weight:800;font-size:15px;margin-bottom:8px">${esc(m.name)}</div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">
        <span class="muted">المطلوب</span><b>${fmtNum(req)}</b>
      </div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">
        <span class="muted">المدفوع</span><b style="color:var(--success)">${fmtNum(paid)}</b>
      </div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:2px solid var(--${color});margin-top:4px">
        <span style="font-weight:800">المتبقي</span>
        <b style="font-weight:800;color:${rem > 0 ? 'var(--danger)' : 'var(--success)'}">${fmtNum(rem)} ل.س</b>
      </div>
    </div>
  `;

  $('pDuesBox').style.display = 'block';
  $('pAmountField').style.display = 'block';
  $('pDateRow').style.display = 'grid';
  $('pNotesField').style.display = 'block';

  const buttons = [];
  if(rem > 0) buttons.push(`<button onclick="$('pAmount').value=${rem}">💰 كامل ${fmtShort(rem)}</button>`);
  buttons.push(`<button onclick="$('pAmount').value=5000">5,000</button>`);
  buttons.push(`<button onclick="$('pAmount').value=10000">10,000</button>`);
  buttons.push(`<button onclick="$('pAmount').value=25000">25,000</button>`);
  $('pQuickButtons').innerHTML = buttons.join('');
  $('pAmount').value = rem > 0 ? rem : '';
}

async function savePaymentNew(fund){
  const u = S.currentUser;
  const isDonation = fund === 'donation';
  const memberId = isDonation ? null : Number($('pMemberId').value);
  const amount = Number($('pAmount').value);
  const date = $('pDate').value;
  const forYear = Number($('pForYear').value);
  const notes = $('pNotes')?.value?.trim() || '';
  const donorName = isDonation ? ($('pDonorName')?.value?.trim() || '') : '';

  if(!isDonation && !memberId){ toast('اختر العضو', 'error'); return; }
  if(isNaN(amount) || amount < 0){ toast('المبلغ غير صحيح', 'error'); return; }
  if(!date){ toast('التاريخ مطلوب', 'error'); return; }

  if(amount === 0){
    if(!confirm('تسجيل دفعة بقيمة 0؟')) return;
  }

  showLoad(true);
  try {
    const payment = {
      memberId,
      fund,
      amount,
      date,
      year: forYear,
      forYear,
      notes: isDonation ? (donorName + (notes ? ' | ' + notes : '')) : notes,
      collectorId: u.id,
      collectorName: u.name,
      createdAt: new Date().toISOString()
    };
    const id = await dbPut('payments', payment);
    payment.id = id;
    S.payments.push(payment);

    CACHE.invalidateMember(memberId);
    await logAudit('add', 'payment', id, { fund, memberId, amount, forYear });

    toast('✅ تم تسجيل الدفعة', 'success', 2500);
    closeSheet();

    // إعادة رسم الصفحة الحالية
    go(S.page);
  } catch(e){
    console.error(e);
    toast('خطأ: ' + e.message, 'error');
  }
  showLoad(false);
}

function openDeliverySheet(){
  const u = S.currentUser;
  const bd = getCollectorBreakdown(u.id, S.currentYear);

  // المعتمد يرى فقط الأمناء المتاحين لصندوقه
  let recipientRole = 'assocTreasurer';
  if(u.collectFund === 'death') recipientRole = 'deathTreasurer';
  else if(u.collectFund === 'both') recipientRole = null; // الكل

  const recipients = S.users.filter(usr => {
    if(usr.id === u.id) return false;
    if(recipientRole && usr.role !== recipientRole) return false;
    return ['assocTreasurer', 'deathTreasurer'].includes(usr.role);
  });

  if(!recipients.length){
    toast('لا يوجد أمناء مسجلون', 'warning');
    return;
  }

  const body = `
    <div style="padding:14px;background:var(--primary-soft);border-radius:12px;margin-bottom:14px">
      <div style="font-size:11px;color:var(--muted);font-weight:700">عهدتي الحالية</div>
      <div style="font-size:26px;font-weight:800;color:var(--primary);margin-top:4px">${fmtNum(bd.total.rem)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">جمعية ${fmtShort(bd.assoc.rem)} • وفاة ${fmtShort(bd.death.rem)} • تبرع ${fmtShort(bd.donation.rem)}</div>
    </div>

    <div class="fld">
      <label>الصندوق <span class="req">*</span></label>
      <select id="delFund">
        ${bd.assoc.rem > 0 ? `<option value="assoc">💰 جمعية (${fmtNum(bd.assoc.rem)})</option>` : ''}
        ${bd.death.rem > 0 ? `<option value="death">⚰️ وفاة (${fmtNum(bd.death.rem)})</option>` : ''}
        ${bd.donation.rem > 0 ? `<option value="donation">💚 تبرع (${fmtNum(bd.donation.rem)})</option>` : ''}
        ${bd.total.rem <= 0 ? '<option value="">لا يوجد متبقي</option>' : ''}
      </select>
    </div>

    <div class="fld">
      <label>أسلّم إلى <span class="req">*</span></label>
      <select id="delTo">
        ${recipients.map(r => `<option value="${r.id}">${ROLES[r.role].icon} ${esc(r.name)}</option>`).join('')}
      </select>
    </div>

    <div class="fld">
      <label>المبلغ <span class="req">*</span></label>
      <div class="amount-input">
        <input id="delAmount" type="tel" inputmode="numeric" value="${bd.total.rem > 0 ? bd.total.rem : ''}" placeholder="0">
        <span class="currency">ل.س</span>
      </div>
    </div>

    <div class="fld">
      <label>ملاحظات</label>
      <input id="delNotes" placeholder="اختياري">
    </div>
  `;

  const foot = `
    <button class="btn ghost" onclick="closeSheet()">إلغاء</button>
    <button class="btn warning" onclick="saveDeliveryNew()">📤 تسجيل</button>
  `;
  openSheet('📤 تسليم للأمين', body, foot, { focus: 'delAmount' });
}

async function saveDeliveryNew(){
  const u = S.currentUser;
  const fund = $('delFund').value;
  const toUserId = Number($('delTo').value);
  const amount = Number($('delAmount').value);
  const notes = cleanText($('delNotes').value);

  if(!fund){ toast('اختر الصندوق', 'error'); return; }
  if(!toUserId){ toast('اختر المستلم', 'error'); return; }
  if(!amount || amount <= 0){ toast('المبلغ مطلوب', 'error'); return; }

  const toUser = S.users.find(x => x.id === toUserId);
  if(!toUser) return;

  try {
    const delivery = {
      fromUserId: u.id,
      fromUserName: u.name,
      toUserId,
      toUserName: toUser.name,
      fund,
      amount,
      notes,
      date: today(),
      createdAt: new Date().toISOString()
    };
    const id = await dbPut('deliveries', delivery);
    delivery.id = id;
    S.deliveries.push(delivery);

    CACHE.invalidateAll();
    await logAudit('add', 'delivery', id, { amount, to: toUser.name, fund });

    toast('📤 تم التسجيل', 'success', 2500);
    closeSheet();

    setTimeout(() => {
      if(confirm('📱 توثيق واتساب؟')){
        const txt = `📤 *توثيق تسليم*\n\nمن: ${u.name}\nإلى: ${toUser.name}\nالمبلغ: ${fmtNum(amount)} ل.س\nالصندوق: ${fund === 'assoc' ? '💰 الجمعية' : fund === 'death' ? '⚰️ الوفاة' : '💚 تبرع'}\nالتاريخ: ${today()}\n${notes ? 'ملاحظات: ' + notes : ''}\n\n_صندوق زعورة_`;
        window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
      }
    }, 400);

    go(S.page);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}
