<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>صندوق زعورة</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--primary:#7c3aed;--primary-2:#6d28d9;--primary-soft:#f5f3ff;--primary-dark:#4c1d95;--assoc:#2563eb;--assoc-soft:#dbeafe;--death:#dc2626;--death-soft:#fee2e2;--donation:#16a34a;--donation-soft:#dcfce7;--success:#16a34a;--danger:#dc2626;--warning:#f59e0b;--info:#2563eb;--muted:#64748b;--bg:#f8fafc;--card:#fff;--text:#0f172a;--border:#e2e8f0;--radius:16px;--shadow-sm:0 1px 3px rgba(15,23,42,.06);--shadow-lg:0 20px 60px rgba(15,23,42,.2);--safe:env(safe-area-inset-bottom,0)}
[data-theme="dark"]{--bg:#0b1220;--card:#1e293b;--text:#e2e8f0;--border:#334155;--primary-soft:#2e1065;--assoc-soft:#1e3a8a;--death-soft:#7f1d1d;--donation-soft:#14532d}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;background:var(--bg);color:var(--text);direction:rtl;font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:calc(78px + var(--safe))}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{outline:0}
.app-header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0));display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(124,58,237,.3)}
.app-header .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.app-header .logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.app-header .brand-text{flex:1;min-width:0}
.app-header h1{font-size:16px;font-weight:800}
.app-header .sub{font-size:11px;opacity:.9;font-weight:700;cursor:pointer;display:inline-block;padding:2px 8px;background:rgba(255,255,255,.15);border-radius:8px;margin-top:2px}
.app-header .icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.app-header .icon-btn:active{transform:scale(.92)}
.user-banner{background:var(--card);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;position:sticky;top:60px;z-index:29}
.user-banner .who{display:flex;align-items:center;gap:8px;color:var(--muted)}
.user-banner .who b{color:var(--text)}
.role-badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;background:var(--primary-soft);color:var(--primary)}
.search-wrap{padding:10px 12px 0;max-width:900px;margin:0 auto}
.search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow-sm)}
.search-box input{flex:1;background:none;border:0;font-size:15px;min-width:0}
.search-box .ico{color:var(--muted);font-size:17px}
.search-box .clear{color:var(--muted);font-size:18px;padding:4px}
main{max-width:900px;margin:0 auto;padding:12px}
.page{display:none}
.page.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-head h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.stats-scroll{display:flex;gap:10px;overflow-x:auto;margin:0 -12px 14px;padding:0 12px 6px;scrollbar-width:none}
.stats-scroll::-webkit-scrollbar{display:none}
.stat{flex:0 0 auto;min-width:130px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--primary)}
.stat.assoc::before{background:var(--assoc)}
.stat.death::before{background:var(--death)}
.stat.donation::before{background:var(--donation)}
.stat.green::before{background:var(--success)}
.stat.red::before{background:var(--danger)}
.stat.orange::before{background:var(--warning)}
.stat.blue::before{background:var(--info)}
.stat .val{font-size:22px;font-weight:800;line-height:1.1;color:var(--primary)}
.stat.assoc .val{color:var(--assoc)}
.stat.death .val{color:var(--death)}
.stat.donation .val{color:var(--donation)}
.stat.green .val{color:var(--success)}
.stat.red .val{color:var(--danger)}
.stat.orange .val{color:var(--warning)}
.stat.blue .val{color:var(--info)}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600}
.list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;min-height:64px}
.item:last-child{border-bottom:0}
.item:active{background:var(--bg)}
.item .av{width:46px;height:46px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--primary-soft);color:var(--primary);font-weight:800;overflow:hidden}
.item .av.blue{background:var(--assoc-soft);color:var(--assoc)}
.item .av.red{background:var(--death-soft);color:var(--death)}
.item .av.green{background:var(--donation-soft);color:var(--donation)}
.item .av.orange{background:#fef3c7;color:#92400e}
.item .av.gray{background:#f1f5f9;color:#475569}
.item .body{flex:1;min-width:0}
.item .ttl{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .sub{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .trail{color:var(--muted);font-size:20px;flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap}
.badge.success{background:#dcfce7;color:#166534}
.badge.danger{background:#fee2e2;color:#991b1b}
.badge.warning{background:#fef3c7;color:#92400e}
.badge.info{background:#dbeafe;color:#1e40af}
.badge.muted{background:#f1f5f9;color:#475569}
.badge.primary{background:var(--primary-soft);color:var(--primary)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:13px;font-size:14px;font-weight:700;min-height:44px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff}
.btn.assoc{background:var(--assoc);color:#fff}
.btn.death{background:var(--death);color:#fff}
.btn.donation{background:var(--donation);color:#fff}
.btn.success{background:var(--success);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.warning{background:var(--warning);color:#fff}
.btn.info{background:var(--info);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:12px;border-radius:10px}
.btn.block{display:flex;width:100%}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border-radius:14px;background:var(--card);border:2px solid var(--border);cursor:pointer;text-align:center}
.quick-btn:active{transform:scale(.97);border-color:var(--primary)}
.quick-btn .ico{font-size:28px;line-height:1}
.quick-btn .lbl{font-size:12px;font-weight:800}
.quick-btn.assoc{border-color:var(--assoc)}
.quick-btn.assoc .lbl{color:var(--assoc)}
.quick-btn.death{border-color:var(--death)}
.quick-btn.death .lbl{color:var(--death)}
.quick-btn.donation{border-color:var(--donation)}
.quick-btn.donation .lbl{color:var(--donation)}
.fab{position:fixed;bottom:calc(88px + var(--safe));left:18px;width:60px;height:60px;border-radius:20px;background:var(--primary);color:#fff;font-size:28px;font-weight:300;box-shadow:0 12px 32px rgba(124,58,237,.5);z-index:25;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.92)}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:10px;font-weight:700;min-width:0}
.bnav button .i{font-size:22px;line-height:1}
.bnav button.on{color:var(--primary)}
.sheet-back{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:10100;opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(3px)}
.sheet-back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:10101;background:var(--card);border-radius:24px 24px 0 0;max-height:94vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(16px + var(--safe))}
.sheet.on{transform:translateY(0)}
.sheet.wide{max-height:98vh}
.sheet-grip{width:44px;height:5px;background:var(--border);border-radius:3px;margin:12px auto 0}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2}
.sheet-hd h2{font-size:16px;font-weight:800}
.sheet-bd{padding:16px 18px}
.sheet-ft{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
.sheet-ft .btn{flex:1;min-width:90px}
.fld{margin-bottom:14px;position:relative}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld label .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{width:100%;padding:12px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;font-size:15px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--primary);background:var(--card)}
.fld textarea{resize:vertical;min-height:70px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld-hint{font-size:11px;color:var(--muted);margin-top:4px}
.fld-readonly{background:var(--primary-soft)!important;color:var(--primary);font-weight:700}
.options-list{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1.5px solid var(--primary);border-radius:12px;max-height:250px;overflow-y:auto;z-index:100;margin-top:4px;display:none}
.options-list.on{display:block}
.option-item{padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--border);font-size:14px}
.option-item:active{background:var(--primary-soft)}
.option-item:last-child{border-bottom:0}
.option-item small{color:var(--muted);font-size:11px}
.amount-input{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--primary);border-radius:14px;padding:8px 16px}
.amount-input input{flex:1;border:0;background:none;font-size:26px;font-weight:800;color:var(--primary);text-align:center;padding:8px 0}
.amount-input .currency{font-size:14px;font-weight:800;color:var(--muted)}
.amount-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.amount-quick button{padding:6px 12px;border-radius:10px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700}
.balance-block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.balance-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
.balance-row:last-child{border-bottom:0}
.balance-row .lbl{color:var(--muted)}
.balance-row .val{font-weight:800}
.balance-row .val.green{color:var(--success)}
.balance-row .val.red{color:var(--danger)}
.balance-row .val.orange{color:var(--warning)}
.progress{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:8px}
.progress > div{height:100%;border-radius:5px}
.progress.assoc > div{background:var(--assoc)}
.progress.death > div{background:var(--death)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ico{font-size:52px;opacity:.4;display:block;margin-bottom:10px}
.empty h3{font-size:15px;font-weight:700;margin-bottom:4px;color:var(--text)}
.empty p{font-size:12px}
.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10200;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 28px);max-width:400px}
.toast{background:var(--text);color:var(--card);padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);pointer-events:auto}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--danger);color:#fff}
.toast.warning{background:var(--warning);color:#fff}
.toast.info{background:var(--info);color:#fff}
.loader{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(3px);z-index:10300;display:none;align-items:center;justify-content:center}
.loader.on{display:flex}
.spin{width:42px;height:42px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-screen{position:fixed;inset:0;z-index:10000;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.login-screen.on{display:flex}
.login-card{background:var(--card);color:var(--text);border-radius:24px;padding:28px 24px;max-width:400px;width:100%;margin:auto}
.login-card .logo-lg{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;margin:0 auto 16px}
.login-card h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:4px}
.login-card .sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:24px}
.users-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto}
.login-user{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--bg);border:2px solid transparent;cursor:pointer}
.login-user:active{border-color:var(--primary);background:var(--primary-soft)}
.login-user .av{width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0}
.login-user .info{flex:1;min-width:0}
.login-user .nm{font-weight:700;font-size:14px}
.login-user .role{font-size:11px;color:var(--muted);margin-top:2px}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.pin-btn{padding:16px;border-radius:14px;background:var(--bg);font-size:20px;font-weight:800}
.pin-btn:active{transform:scale(.95);background:var(--primary-soft)}
.pin-display{display:flex;justify-content:center;gap:10px;margin:20px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--border)}
.pin-dot.on{background:var(--primary)}
@media print{.app-header,.bnav,.fab,.search-wrap,.user-banner{display:none!important}main{padding:0;max-width:100%}body{background:#fff;padding-bottom:0}}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="logo-lg">🏘️</div>
    <h1>صندوق زعورة</h1>
    <div class="sub">نظام إدارة الاشتراكات والتكافل</div>
    <div id="loginUsers">
      <div class="users-list" id="loginUsersList"></div>
      <button class="btn ghost block" style="margin-top:14px" onclick="showAddFirstAdmin()">⚙️ إعداد أول مرة</button>
    </div>
    <div id="loginPin" style="display:none">
      <div style="text-align:center;margin-bottom:12px">
        <div style="font-size:44px" id="pinAvatar">👤</div>
        <div style="font-weight:800;font-size:16px;margin-top:6px" id="pinName">—</div>
        <div style="font-size:11px;color:var(--muted)" id="pinRole">—</div>
      </div>
      <div class="pin-display" id="pinDisplay"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
      <div style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:12px;min-height:18px" id="pinError"></div>
      <div class="pin-pad">
        <button class="pin-btn" onclick="pinPress('1')">1</button><button class="pin-btn" onclick="pinPress('2')">2</button><button class="pin-btn" onclick="pinPress('3')">3</button>
        <button class="pin-btn" onclick="pinPress('4')">4</button><button class="pin-btn" onclick="pinPress('5')">5</button><button class="pin-btn" onclick="pinPress('6')">6</button>
        <button class="pin-btn" onclick="pinPress('7')">7</button><button class="pin-btn" onclick="pinPress('8')">8</button><button class="pin-btn" onclick="pinPress('9')">9</button>
        <button class="pin-btn" onclick="pinBack()">⌫</button><button class="pin-btn" onclick="pinPress('0')">0</button><button class="pin-btn" onclick="pinBackLogin()">↩️</button>
      </div>
    </div>
  </div>
</div>

<header class="app-header" id="appHeader" style="display:none">
  <div class="brand">
    <div class="logo">🏘️</div>
    <div class="brand-text">
      <h1>صندوق زعورة</h1>
      <div class="sub" id="hdrYear" onclick="openYearPicker()">السنة ▼</div>
    </div>
  </div>
  <button class="icon-btn" onclick="openStatsSheet()">📊</button>
  <button class="icon-btn" onclick="toggleTheme()">🌓</button>
  <button class="icon-btn" onclick="openSettingsSheet()">⚙️</button>
</header>

<div class="user-banner" id="userBanner" style="display:none">
  <div class="who">
    <span>👤 أنت:</span>
    <b id="currentUserName">—</b>
    <span class="role-badge" id="currentUserRole">—</span>
  </div>
  <button class="btn ghost sm" onclick="logout()">🚪 خروج</button>
</div>

<div class="search-wrap" id="searchWrap" style="display:none">
  <div class="search-box">
    <span class="ico">🔍</span>
    <input id="globalSearch" placeholder="ابحث..." oninput="globalSearch(this.value)">
    <button class="clear" onclick="clearSearch()" style="display:none" id="searchClear">✕</button>
  </div>
</div>

<main id="appMain" style="display:none">
  <section id="pg-home" class="page active">
    <div class="stats-scroll" id="homeStats"></div>
    <div class="card"><div class="card-head"><h2>⚡ إجراءات سريعة</h2></div><div class="quick-actions" id="homeQuickActions"></div></div>
    <div class="card"><div class="card-head"><h2>📊 الميزانية</h2></div><div id="budgetContent"></div></div>
    <div class="card"><div class="card-head"><h2>🕐 آخر العمليات</h2></div><div id="recentOps"></div></div>
  </section>

  <section id="pg-subscribers" class="page">
    <div class="stats-scroll" id="subStats"></div>
    <div class="card" style="padding:12px">
      <div class="chips" id="subChips"></div>
      <div class="chips" id="subSectorChips"></div>
    </div>
    <div id="subContent"></div>
  </section>

  <section id="pg-people" class="page">
    <div class="stats-scroll" id="peopleStats"></div>
    <div class="card" style="padding:12px"><div class="chips" id="peopleChips"></div></div>
    <div id="peopleContent"></div>
  </section>

  <section id="pg-payments" class="page">
    <div class="stats-scroll" id="paymentsStats"></div>
    <div class="card" style="padding:12px"><div class="chips" id="paymentsChips"></div></div>
    <div id="paymentsContent"></div>
  </section>

  <section id="pg-reports" class="page"><div id="reportsContent"></div></section>

  <section id="pg-admin" class="page">
    <div class="card"><div class="card-head"><h2>⚙️ الإدارة</h2></div><div id="adminMenu"></div></div>
  </section>
</main>

/* ═══════════════════════════════════════════════════════
   INDEXEDDB
   ═══════════════════════════════════════════════════════ */
let db = null;

function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORE_NAMES.forEach(n => {
        if(!d.objectStoreNames.contains(n)){
          d.createObjectStore(n, { keyPath:'id', autoIncrement:true });
        }
      });
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}

const tx = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
const dbAll = s => new Promise((res, rej) => { const q = tx(s).getAll(); q.onsuccess = () => res(q.result||[]); q.onerror = () => rej(q.error); });
const dbGet = (s, id) => new Promise((res, rej) => { const q = tx(s).get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const dbPut = (s, o) => new Promise((res, rej) => { const q = tx(s,'readwrite').put(o); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const dbDel = (s, id) => new Promise((res, rej) => { const q = tx(s,'readwrite').delete(id); q.onsuccess = () => res(); q.onerror = () => rej(q.error); });

/* ═══════════════════════════════════════════════════════
   أدوات
   ═══════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const cleanText = v => String(v ?? '').trim().replace(/\s+/g,' ');
const normAr = v => String(v ?? '').toLowerCase().trim().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/[ىي]/g,'ي').replace(/[ًٌٍَُِّْـ]/g,'');
const cleanPhone = v => { if(!v) return ''; let s = String(v).trim().replace(/\.0+$/,'').replace(/[\s\-\(\)\u200f\u200e]/g,''); if(s.startsWith('+963')) s = '0' + s.slice(4); return s; };
const today = () => new Date().toISOString().slice(0,10);
const debounce = (fn, d = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), d); }; };

function fmtDate(d){
  if(!d) return '—';
  try { return new Date(d).toLocaleDateString('ar-EG', { year:'numeric', month:'short', day:'numeric' }); }
  catch(e) { return d; }
}

function toDate(v){
  if(!v) return '';
  if(typeof v === 'string' && v.trim().startsWith('=')) return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number'){ const d = new Date((v-25569)*86400000); return isNaN(d)?'':d.toISOString().slice(0,10); }
  const s = String(v).trim();
  const m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]|$)/);
  if(m1) return `${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;
  const m2 = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m2) return `${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
  const d = new Date(s);
  if(!isNaN(d) && d.getFullYear() > 1900 && d.getFullYear() < 2100) return d.toISOString().slice(0,10);
  return '';
}

function calcAge(birth){
  if(!birth) return '';
  const b = new Date(birth); if(isNaN(b)) return '';
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  if(now.getMonth() < b.getMonth() || (now.getMonth() === b.getMonth() && now.getDate() < b.getDate())) age--;
  return age >= 0 ? age : '';
}

function fmtNum(n){
  if(n === null || n === undefined || n === '') return '0';
  const num = Number(n); if(isNaN(num)) return '0';
  return num.toLocaleString('en-US');
}
function fmtShort(n){
  if(!n && n !== 0) return '0';
  const num = Number(n);
  if(num >= 1000000) return (num/1000000).toFixed(1) + 'M';
  if(num >= 1000) return (num/1000).toFixed(1) + 'K';
  return String(num);
}

/* ═══════════════════════════════════════════════════════
   حساب المستحقات
   ═══════════════════════════════════════════════════════ */
function computeMemberDues(personId, year){
  const person = getPersonById(personId);
  if(!person) return null;
  const c = S.constants.find(x => x.year === year);
  if(!c) return null;

  const result = {
    year,
    assoc: { applicable:false, required:0, paid:0, remaining:0, percent:0, joinFee:0, joinFeePaid:0, joinFeeRemaining:0, isJoinYear:false },
    death: { applicable:false, required:0, paid:0, remaining:0, percent:0, installments:[], joinFee:0, joinFeePaid:0, joinFeeRemaining:0, isJoinYear:false },
    total: { required:0, paid:0, remaining:0 }
  };

  // الجمعية
  const assocStart = person.joinedAssocYear;
  if(assocStart && year >= assocStart){
    result.assoc.applicable = true;
    result.assoc.isJoinYear = (year === assocStart);

    const type = person.memberTypeAssoc || 'عادي';
    result.assoc.required = (type === 'مخفض' && c.assocYearlyReduced) ? c.assocYearlyReduced : (c.assocYearly || 24000);

    result.assoc.paid = S.assocPayments
      .filter(p => p.personId === personId && p.year === year && (!p.fund || p.fund === 'assoc'))
      .reduce((s, p) => s + (Number(p.amount) || 0), 0);

    result.assoc.remaining = Math.max(0, result.assoc.required - result.assoc.paid);
    result.assoc.percent = result.assoc.required > 0 ? Math.min(100, Math.round(result.assoc.paid / result.assoc.required * 100)) : 0;

    if(result.assoc.isJoinYear){
      result.assoc.joinFee = (type === 'مخفض' && c.joinAssocReduced) ? c.joinAssocReduced : (c.joinAssoc || 100000);
      result.assoc.joinFeePaid = S.assocPayments.filter(p => p.personId === personId && p.fund === 'joinAssoc').reduce((s, p) => s + (Number(p.amount) || 0), 0);
      result.assoc.joinFeeRemaining = Math.max(0, result.assoc.joinFee - result.assoc.joinFeePaid);
    }
  }

  // الوفاة
  const deathStart = person.joinedDeathYear;
  if(deathStart && year >= deathStart){
    result.death.applicable = true;
    result.death.isJoinYear = (year === deathStart);

    const insts = S.deathInstallments.filter(i => i.personId === personId && i.year === year);
    result.death.installments = insts.map(i => ({
      id: i.id, eventName: i.eventName, deathDate: i.deathDate,
      amount: Number(i.amount) || 0, status: i.status, paidDate: i.paidDate
    }));

    result.death.required = insts.reduce((s, i) => s + (Number(i.amount) || 0), 0);
    result.death.paid = insts.filter(i => i.status === 'paid').reduce((s, i) => s + (Number(i.amount) || 0), 0);
    result.death.remaining = result.death.required - result.death.paid;
    result.death.percent = result.death.required > 0 ? Math.min(100, Math.round(result.death.paid / result.death.required * 100)) : 0;

    if(result.death.isJoinYear){
      const type = person.memberTypeDeath || 'عادي';
      result.death.joinFee = (type === 'مخفض' && c.joinDeathReduced) ? c.joinDeathReduced : (c.joinDeath || 50000);
      result.death.joinFeePaid = S.assocPayments.filter(p => p.personId === personId && p.fund === 'joinDeath').reduce((s, p) => s + (Number(p.amount) || 0), 0);
      result.death.joinFeeRemaining = Math.max(0, result.death.joinFee - result.death.joinFeePaid);
    }
  }

  result.total.required = result.assoc.required + result.assoc.joinFee + result.death.required + result.death.joinFee;
  result.total.paid = result.assoc.paid + result.assoc.joinFeePaid + result.death.paid + result.death.joinFeePaid;
  result.total.remaining = result.total.required - result.total.paid;

  return result;
}

function computeMemberFullHistory(personId){
  const person = getPersonById(personId);
  if(!person) return null;
  const startYear = Math.min(person.joinedAssocYear || 9999, person.joinedDeathYear || 9999);
  if(startYear === 9999) return { person, history:[], grandTotal:{ required:0, paid:0, remaining:0 } };

  const history = [];
  for(let y = startYear; y <= S.currentYear; y++){
    const dues = computeMemberDues(personId, y);
    if(dues) history.push(dues);
  }

  const grandTotal = history.reduce((acc, h) => ({
    required: acc.required + h.total.required,
    paid: acc.paid + h.total.paid,
    remaining: acc.remaining + h.total.remaining
  }), { required:0, paid:0, remaining:0 });

  return { person, history, grandTotal };
}

function getSubscribersCount(year){
  const y = year || S.currentYear;
  let onlyAssoc = 0, onlyDeath = 0, both = 0, none = 0;

  for(const person of S.people){
    const hasAssoc = person.joinedAssocYear && person.joinedAssocYear <= y;
    const hasDeath = person.joinedDeathYear && person.joinedDeathYear <= y;
    if(hasAssoc && hasDeath) both++;
    else if(hasAssoc) onlyAssoc++;
    else if(hasDeath) onlyDeath++;
    else none++;
  }

  let lateCount = 0;
  for(const p of S.people){
    if(!p.joinedAssocYear && !p.joinedDeathYear) continue;
    const d = computeMemberDues(p.id, y);
    if(d && d.total.remaining > 0) lateCount++;
  }

  return {
    year: y, total: S.people.length,
    assoc: { total: onlyAssoc + both, onlyAssoc, withDeath: both, active: onlyAssoc + both },
    death: { total: onlyDeath + both, onlyDeath, withAssoc: both, active: onlyDeath + both },
    both, onlyAssoc, onlyDeath, none, lateCount
  };
}

function getFinancialSummary(year){
  const y = year || S.currentYear;
  const assocIncome = S.assocPayments.filter(p => p.year === y && (!p.fund || p.fund === 'assoc')).reduce((s,p) => s + (Number(p.amount)||0), 0);
  const joinAssocIncome = S.assocPayments.filter(p => p.year === y && p.fund === 'joinAssoc').reduce((s,p) => s + (Number(p.amount)||0), 0);
  const deathIncome = S.assocPayments.filter(p => p.year === y && p.fund === 'death').reduce((s,p) => s + (Number(p.amount)||0), 0);
  const joinDeathIncome = S.assocPayments.filter(p => p.year === y && p.fund === 'joinDeath').reduce((s,p) => s + (Number(p.amount)||0), 0);
  const donationsIncome = S.donations.filter(d => d.year === y).reduce((s,d) => s + (Number(d.amount)||0), 0);
  const assocExpenses = S.expenses.filter(e => e.year === y).reduce((s,e) => s + (Number(e.amount)||0), 0);
  const deathCompensations = S.deathEvents.filter(e => e.year === y).reduce((s,e) => s + (Number(e.compensation)||0), 0);

  const totalIncome = assocIncome + joinAssocIncome + deathIncome + joinDeathIncome + donationsIncome;
  const totalOutcome = assocExpenses + deathCompensations;

  return {
    year: y,
    assoc: {
      income: assocIncome, joins: joinAssocIncome, donations: donationsIncome, expenses: assocExpenses,
      balance: assocIncome + joinAssocIncome + donationsIncome - assocExpenses,
      totalIncome: assocIncome + joinAssocIncome + donationsIncome
    },
    death: {
      income: deathIncome, joins: joinDeathIncome, compensations: deathCompensations,
      balance: deathIncome + joinDeathIncome - deathCompensations,
      totalIncome: deathIncome + joinDeathIncome
    },
    total: { income: totalIncome, outcome: totalOutcome, balance: totalIncome - totalOutcome }
  };
}

function selectLoginUser(id){
  const u = S.admins.find(a => a.id === id);
  if(!u) return;
  _pinTargetUser = u; _pinAttempt = '';
  if(!u.hasPin){ doLogin(u); return; }
  $('loginUsers').style.display = 'none';
  $('loginPin').style.display = 'block';
  const r = ROLES[u.role] || { name:'مستخدم', icon:'👤' };
  $('pinAvatar').textContent = r.icon;
  $('pinName').textContent = u.name;
  $('pinRole').textContent = r.name;
  $('pinError').textContent = '';
  updatePinDisplay();
}

function pinPress(d){
  if(_pinAttempt.length >= 4) return;
  _pinAttempt += d;
  updatePinDisplay();
  if(_pinAttempt.length === 4) setTimeout(checkPin, 200);
}
function pinBack(){ _pinAttempt = _pinAttempt.slice(0,-1); updatePinDisplay(); }
function pinBackLogin(){ $('loginPin').style.display = 'none'; $('loginUsers').style.display = 'block'; _pinAttempt = ''; _pinTargetUser = null; }
function updatePinDisplay(){
  document.querySelectorAll('#pinDisplay .pin-dot').forEach((d,i) => d.classList.toggle('on', i < _pinAttempt.length));
}
function checkPin(){
  if(!_pinTargetUser) return;
  if(_pinAttempt === String(_pinTargetUser.pin)){
    $('pinError').textContent = '✅ صحيح';
    $('pinError').style.color = 'var(--success)';
    setTimeout(() => doLogin(_pinTargetUser), 400);
  } else {
    $('pinError').textContent = '❌ خطأ';
    $('pinError').style.color = 'var(--danger)';
    _pinAttempt = '';
    updatePinDisplay();
  }
}

function doLogin(u){
  S.currentUser = u;
  saveCurrentUser(u);
  toast('👋 مرحباً ' + u.name, 'success', 2500);
  showMainApp();
}

function openAdminsSheet(){

  const list = S.admins.map(u => {

  }).join('');
  const body = `<div style="font-size:12px;color:var(--muted);margin-bottom:12px">${S.admins.length} مستخدم</div><div class="list">${list}</div>`;

}

function openEditAdminSheet(id = null){
  const isNew = !id;
  const admin = isNew ? { role:'collector' } : S.admins.find(a => a.id === id);
  if(!admin) return;
  const roleOpts = Object.keys(ROLES).map(k => `<option value="${k}" ${admin.role === k ? 'selected' : ''}>${ROLES[k].icon} ${ROLES[k].name}</option>`).join('');
  const body = `
    <div class="fld"><label>الاسم <span class="req">*</span></label><input id="adminName" value="${esc(admin.name||'')}"></div>
    <div class="fld"><label>الهاتف</label><input id="adminPhone" value="${esc(admin.phone||'')}" inputmode="tel"></div>
    <div class="fld"><label>الدور</label><select id="adminRole">${roleOpts}</select></div>
    <div class="fld"><label>كلمة المرور</label><input id="adminPin" type="tel" placeholder="${admin.hasPin ? 'اتركها للإبقاء' : '••••'}" maxlength="4" inputmode="numeric"></div>
  `;
  const foot = isNew
    ? `<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn primary" onclick="saveAdmin()">💾</button>`
    : `<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn primary" onclick="saveAdmin(${id})">💾</button>`;
  openSheet(isNew ? '➕ إداري جديد' : '✏️ تعديل', body, foot, { focus:'adminName' });
}

async function saveAdmin(id = null){
  const name = cleanText($('adminName').value);
  const pin = $('adminPin').value.trim();
  if(!name){ toast('الاسم مطلوب','error'); return; }
  if(pin && !/^\d{4}$/.test(pin)){ toast('كلمة المرور: 4 أرقام','error'); return; }

  try{
    const old = id ? await dbGet('admins', id) : null;
    const admin = {
      name, phone: cleanPhone($('adminPhone').value), role: $('adminRole').value,
      hasPin: pin ? true : (old ? old.hasPin : false),
      pin: pin ? pin : (old ? old.pin : null),
      createdAt: old ? old.createdAt : new Date().toISOString()
    };
    if(id){
      admin.id = id;
      await dbPut('admins', admin);
      const i = S.admins.findIndex(a => a.id === id);
      if(i > -1) S.admins[i] = admin;
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('admins', admin);
      admin.id = newId;
      S.admins.push(admin);
      toast('✅ تمت الإضافة');
    }
    closeSheet();
    setTimeout(openAdminsSheet, 250);
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function deleteAdmin(id){
  if(!confirm('حذف؟')) return;
  try{
    const a = S.admins.find(x => x.id === id);
    if(a.role === 'president' && S.admins.filter(x => x.role === 'president').length <= 1){ toast('⚠️ لا يمكن حذف الرئيس الوحيد','error'); return; }
    await dbDel('admins', id);
    S.admins = S.admins.filter(x => x.id !== id);
    toast('🗑️ تم الحذف');
    openAdminsSheet();
  } catch(e){ toast('خطأ','error'); }
}

function setSubsFilter(k){ S.filters.subscribers = k; renderSubscribers(); }
function setSubsSector(k){ S.filters.subscriberSector = k; renderSubscribers(); }

function renderSubscribers(){
  const year = S.currentYear;
  const filter = S.filters.subscribers || 'all';
  const sectorFilter = S.filters.subscriberSector || 'all';
  const counts = getSubscribersCount(year);

  $('subStats').innerHTML = `
    <div class="stat assoc"><div class="val">${counts.assoc.total}</div><div class="lbl">💰 في الجمعية</div></div>
    <div class="stat death"><div class="val">${counts.death.total}</div><div class="lbl">⚰️ في الوفاة</div></div>
    <div class="stat green"><div class="val">${counts.both}</div><div class="lbl">✅ كليهما</div></div>
    <div class="stat red"><div class="val">${counts.lateCount}</div><div class="lbl">⚠️ متأخرون</div></div>
  `;

  const chips = [
    { k:'all', l:'الكل', count: counts.assoc.total + counts.onlyDeath },
    { k:'assoc', l:'💰 جمعية فقط', count: counts.onlyAssoc },
    { k:'death', l:'⚰️ وفاة فقط', count: counts.onlyDeath },
    { k:'both', l:'✅ كليهما', count: counts.both },
    { k:'late', l:'⚠️ متأخرون', count: counts.lateCount }
  ];
  $('subChips').innerHTML = chips.map(c => {
    const extra = c.count ? ` (${c.count})` : '';
    return `<button class="chip ${filter === c.k ? 'on' : ''}" onclick="setSubsFilter('${c.k}')">${c.l}${extra}</button>`;
  }).join('');

  const sectorChips = [{ k:'all', l:'كل القطاعات' }, ...S.sectors.map(s => ({ k:s.name, l:s.name }))];
  $('subSectorChips').innerHTML = sectorChips.map(c =>
    `<button class="chip ${sectorFilter === c.k ? 'on' : ''}" onclick="setSubsSector('${c.k}')">${c.l}</button>`
  ).join('');

  let list = S.people
    .filter(p => p.joinedAssocYear || p.joinedDeathYear)
    .map(p => {
      const dues = computeMemberDues(p.id, year);
      const hasAssoc = p.joinedAssocYear && p.joinedAssocYear <= year;
      const hasDeath = p.joinedDeathYear && p.joinedDeathYear <= year;
      return { person: p, dues, hasAssoc, hasDeath };
    });

  if(filter === 'assoc') list = list.filter(x => x.hasAssoc && !x.hasDeath);
  if(filter === 'death') list = list.filter(x => x.hasDeath && !x.hasAssoc);
  if(filter === 'both') list = list.filter(x => x.hasAssoc && x.hasDeath);
  if(filter === 'late') list = list.filter(x => x.dues && x.dues.total.remaining > 0);

  if(sectorFilter !== 'all') list = list.filter(x => x.person.sector === sectorFilter);

  if(S.search){
    const s = normAr(S.search);
    list = list.filter(x => normAr(`${x.person.name} ${x.person.code||''} ${x.person.sector||''}`).includes(s));
  }

  list.sort((a,b) => {
    const aRem = a.dues ? a.dues.total.remaining : 0;
    const bRem = b.dues ? b.dues.total.remaining : 0;
    if(aRem !== bRem) return bRem - aRem;
    return String(a.person.name).localeCompare(String(b.person.name),'ar');
  });

  const el = $('subContent');
  if(!list.length){
    el.innerHTML = `<div class="empty"><span class="ico">⭐</span><h3>لا يوجد مشتركون</h3><p>جرّب فلتراً آخر أو غيّر السنة</p></div>`;
    return;
  }

  el.innerHTML = `<div class="list">${list.slice(0, 200).map(({person, dues, hasAssoc, hasDeath}) => {
    const icons = [];
    if(hasAssoc) icons.push('💰');
    if(hasDeath) icons.push('⚰️');
    const hasUnpaid = dues && dues.total.remaining > 0;

    const details = [];
    if(dues && dues.assoc.remaining > 0) details.push(`💰 ${fmtShort(dues.assoc.remaining)}`);
    if(dues && dues.death.remaining > 0) details.push(`⚰️ ${fmtShort(dues.death.remaining)}`);
    const joinRem = (dues?.assoc.joinFeeRemaining || 0) + (dues?.death.joinFeeRemaining || 0);
    if(joinRem > 0) details.push(`📋 ${fmtShort(joinRem)}`);

    const types = [];
    if(hasAssoc && person.memberTypeAssoc === 'مخفض') types.push('🎓');

    return `<div class="item" onclick="openSubscriberDetail(${person.id})">
      <div class="av ${hasUnpaid ? 'red' : 'green'}">${icons.join('') || '⭐'}</div>
      <div class="body">
        <div class="ttl">${esc(person.name)} ${types.join('')}</div>
        <div class="sub">${esc(person.code||'')} • ${esc(person.sector||'')}${details.length ? ' • ' + details.join(' | ') : ' • ✅'}</div>
      </div>
      <div style="text-align:left">
        ${hasUnpaid ? `<div style="font-weight:800;color:var(--danger);font-size:13px">${fmtShort(dues.total.remaining)}</div>` : `<div style="color:var(--success);font-size:16px">✅</div>`}
      </div>
    </div>`;
  }).join('')}</div>`;
}

            <div class="progress death"><div style="width:${h.death.percent}%"></div></div>
            ${h.death.remaining > 0 ? `<div style="font-size:11px;color:var(--danger);margin-top:4px">متبقي: ${fmtNum(h.death.remaining)}</div>` : `<div style="font-size:11px;color:var(--success);margin-top:4px">✅</div>`}
          </div>
        ` : ''}

    `).join('')}

    <button class="btn ghost block" style="margin-top:16px" onclick="closeSheet();setTimeout(()=>openPersonSheet(${personId}),150)">📝 تعديل البيانات</button>
  `;
  openSheet('👤 ' + person.name, body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide:true });
}

function setPeopleFilter(k){ S.filters.people = k; renderPeople(); }

function renderPeople(){
  const alive = S.people.filter(p => p.status === 'حي').length;
  const dead = S.people.filter(p => p.status === 'متوفى').length;
  const members = S.people.filter(p => p.joinedAssocYear || p.joinedDeathYear).length;

  $('peopleStats').innerHTML = `
    <div class="stat"><div class="val">${S.people.length}</div><div class="lbl">الإجمالي</div></div>
    <div class="stat green"><div class="val">${alive}</div><div class="lbl">أحياء</div></div>
    <div class="stat red"><div class="val">${dead}</div><div class="lbl">متوفون</div></div>
    <div class="stat orange"><div class="val">${members}</div><div class="lbl">⭐ مشتركون</div></div>
  `;

  const chips = [
    { k:'all', l:'الكل' }, { k:'alive', l:'🟢 أحياء' }, { k:'dead', l:'🔴 متوفون' },
    { k:'members', l:'⭐ مشتركون' }, { k:'non', l:'⚪ غير مشتركين' }
  ];
  $('peopleChips').innerHTML = chips.map(c =>
    `<button class="chip ${S.filters.people === c.k ? 'on' : ''}" onclick="setPeopleFilter('${c.k}')">${c.l}</button>`
  ).join('');

  let list = [...S.people];
  if(S.filters.people === 'alive') list = list.filter(p => p.status === 'حي');
  if(S.filters.people === 'dead') list = list.filter(p => p.status === 'متوفى');
  if(S.filters.people === 'members') list = list.filter(p => p.joinedAssocYear || p.joinedDeathYear);
  if(S.filters.people === 'non') list = list.filter(p => !p.joinedAssocYear && !p.joinedDeathYear);

  if(S.search){
    const s = normAr(S.search);
    list = list.filter(p => normAr(`${p.name||''} ${p.code||''} ${p.phone||''} ${p.sector||''}`).includes(s));
  }

  list.sort((a,b) => String(a.name).localeCompare(String(b.name),'ar'));

  const el = $('peopleContent');
  if(!list.length){
    el.innerHTML = `<div class="empty"><span class="ico">👥</span><h3>لا يوجد أفراد</h3></div>`;
    return;
  }

  el.innerHTML = `<div class="list">${list.slice(0, 300).map(p => {
    const age = calcAge(p.birth);
    const tags = [];
    if(p.joinedAssocYear) tags.push('💰');
    if(p.joinedDeathYear) tags.push('⚰️');
    return `<div class="item" onclick="openPersonSheet(${p.id})">
      <div class="av ${p.status === 'متوفى' ? 'red' : (p.gender === 'أنثى' ? 'orange' : '')}">${p.status === 'متوفى' ? '⚰️' : (p.gender === 'أنثى' ? '👩' : '👨')}</div>
      <div class="body">
        <div class="ttl">${esc(p.name)} <span style="font-size:12px">${tags.join('')}</span></div>
        <div class="sub">${esc(p.code||'')}${age !== '' ? ' • ' + age + ' سنة' : ''} • ${esc(p.sector||'—')}</div>
      </div>
      <span class="trail">›</span>
    </div>`;
  }).join('')}</div>`;
}

async function savePerson(id = null){
  if(!hasPerm('person.manage')){ toast('غير مصرح','error'); return; }
  const name = cleanText($('pName').value);
  if(!name){ toast('الاسم مطلوب','error'); return; }

  try{
    const old = id ? await dbGet('people', id) : null;
    const person = {
      code: cleanText($('pCode').value),
      familyCode: cleanText($('pFamilyCode').value),
      name,
      gender: $('pGender').value,
      status: $('pStatus').value,
      birth: $('pBirth').value,
      sector: $('pSector').value,
      relation: $('pRelation').value,
      phone: cleanPhone($('pPhone').value),
      notes: cleanText($('pNotes').value),
      joinedAssocYear: $('pJoinedAssoc').value ? Number($('pJoinedAssoc').value) : null,
      joinedDeathYear: $('pJoinedDeath').value ? Number($('pJoinedDeath').value) : null,
      memberTypeAssoc: $('pMemberTypeAssoc').value || null,
      memberTypeDeath: $('pMemberTypeDeath').value || null,
      createdAt: old ? old.createdAt : new Date().toISOString()
    };
    if(id){
      person.id = id;
      await dbPut('people', person);
      const i = S.people.findIndex(p => p.id === id);
      if(i > -1) S.people[i] = person;
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('people', person);
      person.id = newId;
      S.people.push(person);
      toast('✅ تمت الإضافة');
    }
    closeSheet();
    renderPeople();
    if(S.page === 'pg-home') renderHome();
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function deletePerson(id){
  if(!hasPerm('person.manage')){ toast('غير مصرح','error'); return; }
  if(!confirm('حذف هذا الفرد؟')) return;
  if(!confirm('تأكيد نهائي!')) return;
  try{
    await dbDel('people', id);
    S.people = S.people.filter(x => x.id !== id);
    toast('🗑️ تم الحذف');
    closeSheet();
    renderPeople();
  } catch(e){ toast('خطأ','error'); }
}

async function importPeopleFile(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';

  showLoad(true);
  const log = $('importLog');
  log.innerHTML = '<div style="color:var(--muted)">⏳ جاري القراءة…</div>';

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });

    if(!rows.length){
      log.innerHTML = '<div style="color:var(--danger)">❌ الملف فارغ</div>';
      showLoad(false);
      return;
    }

    let added = 0, updated = 0, skip = 0;
    const existingByCode = new Map();
    const existingByName = new Map();
    for(const p of S.people){
      if(p.code) existingByCode.set(p.code, p);
      existingByName.set(normAr(p.name), p);
    }

    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const name = cleanText(gv(r, 'الاسم الثلاثي','الاسم_الثلاثي','الاسم'));
      if(!name){ skip++; continue; }

      const code = cleanText(gv(r, 'رقم الفرد','رقم_الفرد','الكود'));
      const subDateStr = gv(r, 'تاريخ الاشتراك','تاريخ_الاشتراك','تاريخ الانضمام');
      const subDate = toDate(subDateStr);
      const subYear = subDate ? new Date(subDate).getFullYear() : null;

      const subTypeStr = gv(r, 'نوع الاشتراك','نوع_الاشتراك','نوع العضو');
      let memberType = 'عادي';
      let appliesAssoc = false;
      let appliesDeath = false;

      if(subTypeStr){
        const t = normAr(subTypeStr);
        if(t.includes('كلاهما') || t.includes('كلا')) { appliesAssoc = true; appliesDeath = true; }
        else if(t.includes('جمعية') && !t.includes('وفاة')) { appliesAssoc = true; }
        else if(t.includes('وفاة') || t.includes('وفاء')) { appliesDeath = true; }
        if(t.includes('مخفض')) memberType = 'مخفض';
      }

      let existing = null;
      if(code && existingByCode.has(code)) existing = existingByCode.get(code);
      else if(existingByName.has(normAr(name))) existing = existingByName.get(normAr(name));

      if(existing){
        let changed = false;
        if(appliesAssoc && !existing.joinedAssocYear && subYear){
          existing.joinedAssocYear = subYear;
          existing.memberTypeAssoc = memberType;
          changed = true;
        }
        if(appliesDeath && !existing.joinedDeathYear && subYear){
          existing.joinedDeathYear = subYear;
          existing.memberTypeDeath = memberType;
          changed = true;
        }
        if(changed){ await dbPut('people', existing); updated++; } else skip++;
        continue;
      }

      try{
        const person = {
          code, name,
          familyCode: cleanText(gv(r, 'كود الأسرة','كود_الأسرة')),
          gender: gv(r, 'الجنس') || 'ذكر',
          status: gv(r, 'الحالة') || 'حي',
          relation: gv(r, 'صلة القرابة','صلة_القرابة') || 'رب أسرة',
          birth: toDate(gv(r, 'تاريخ الميلاد','تاريخ_الميلاد')),
          sector: gv(r, 'القطاع'),
          phone: cleanPhone(gv(r, 'الجوال','الهاتف')),
          notes: cleanText(gv(r, 'ملاحظات')),
          joinedAssocYear: appliesAssoc ? subYear : null,
          joinedDeathYear: appliesDeath ? subYear : null,
          memberTypeAssoc: appliesAssoc ? memberType : null,
          memberTypeDeath: appliesDeath ? memberType : null,
          createdAt: new Date().toISOString()
        };
        const newId = await dbPut('people', person);
        person.id = newId;
        S.people.push(person);
        if(code) existingByCode.set(code, person);
        existingByName.set(normAr(name), person);
        added++;
      } catch(e){ console.warn('صف', i+2, e); skip++; }
    }

    log.innerHTML = `<div style="padding:12px;background:#f0fdf4;border-radius:12px;color:#166534"><div style="font-weight:800;margin-bottom:6px">📊 النتيجة</div><div>➕ أُضيف: <b>${added}</b></div><div>✏️ حُدّث: <b>${updated}</b></div><div>⏭️ تُخطّي: <b>${skip}</b></div></div>`;
    toast(`✅ أُضيف ${added} | حُدّث ${updated}`, 'success', 4000);
    await loadAll();
    renderPeople();
    if(S.page === 'pg-home') renderHome();
  } catch(e){
    console.error(e);
    log.innerHTML = `<div style="color:var(--danger)">❌ ${esc(e.message)}</div>`;
    toast('خطأ: ' + e.message, 'error');
  }
  showLoad(false);
}

function gv(row, ...aliases){
  if(!row) return '';
  const normalized = {};
  for(const k of Object.keys(row)){
    normalized[normAr(k).replace(/[^\u0621-\u064Aa-z0-9]/g,'')] = row[k];
  }
  for(const a of aliases){
    const key = normAr(a).replace(/[^\u0621-\u064Aa-z0-9]/g,'');
    if(key in normalized){
      const v = normalized[key];
      if(v === null || v === undefined) continue;
      const s = String(v).trim();
      if(!s || s.startsWith('=') || s.includes('openpyxl')) continue;
      return s;
    }
  }
  return '';
}

  `;

  const foot = `<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn ${fundInfo.btnClass}" onclick="saveFundPayment('${fund}')">💾 حفظ</button>`;

}

function onPFPersonInput(fund){
  const input = $('pfPersonInput');
  const opts = $('pfPersonOptions');
  if(!input || !opts) return;
  const q = input.value.trim();
  const year = S.currentYear;
  const isAssoc = fund === 'assoc';
  const isDeath = fund === 'death';

  let list = S.people.filter(p => {
    if(isAssoc) return p.joinedAssocYear;
    if(isDeath) return p.joinedDeathYear;
    return false;
  });

  if(q){
    const s = normAr(q);
    list = list.filter(p => normAr(`${p.name} ${p.code||''} ${p.sector||''}`).includes(s));
  }
  list = list.slice(0, 30);

  if(!list.length){
    opts.innerHTML = `<div style="padding:12px;color:var(--muted);font-size:13px;text-align:center">${q ? '⚠️ لا نتائج' : 'اكتب اسماً'}</div>`;
  } else {
    opts.innerHTML = list.map(p => {
      const dues = computeMemberDues(p.id, year);
      let remaining = 0;
      if(isAssoc) remaining = dues ? (dues.assoc.remaining + dues.assoc.joinFeeRemaining) : 0;
      else if(isDeath) remaining = dues ? (dues.death.remaining + dues.death.joinFeeRemaining) : 0;
      return `<div class="option-item" onclick="selectPFPerson(${p.id},'${esc(p.name).replace(/'/g, "&#39;")}')">
        <div style="flex:1;min-width:0"><div style="font-weight:700">${esc(p.name)}</div><div style="font-size:10px;color:var(--muted)">${esc(p.code||'')} • ${esc(p.sector||'')}</div></div>
        <small style="color:${remaining > 0 ? 'var(--danger)' : 'var(--success)'};font-weight:700">${remaining > 0 ? 'متبقي ' + fmtShort(remaining) : '✅'}</small>
      </div>`;
    }).join('');
  }
  opts.classList.add('on');
}

function selectPFPerson(id, name){
  $('pfPersonInput').value = name;
  $('pfPersonId').value = id;
  $('pfPersonOptions').classList.remove('on');
  showPFDues(window._currentFund, id);
}

function showPFDues(fund, personId){
  const person = getPersonById(personId);
  if(!person) return;
  const year = Number($('pfYear')?.value) || S.currentYear;
  const dues = computeMemberDues(personId, year);
  if(!dues) return;

  const isAssoc = fund === 'assoc';
  const fundColor = isAssoc ? 'var(--assoc)' : 'var(--death)';
  const fundIcon = isAssoc ? '💰' : '⚰️';
  const data = isAssoc ? dues.assoc : dues.death;

  const html = `
    <div style="padding:14px;background:var(--bg);border-radius:12px;border:2px solid ${fundColor}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div><div style="font-weight:800;font-size:15px">${esc(person.name)}</div><div style="font-size:11px;color:var(--muted)">${esc(person.code||'')} • ${esc(person.sector||'')}</div></div>
        <div style="font-size:24px">${fundIcon}</div>
      </div>
      <div style="padding:8px;background:var(--card);border-radius:8px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span class="muted">المطلوب</span><b>${fmtNum(data.required)}</b></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span class="muted">المدفوع</span><b style="color:var(--success)">${fmtNum(data.paid)}</b></div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:2px solid ${fundColor};margin-top:4px"><span style="font-weight:800">المتبقي</span><b style="font-weight:800;color:${data.remaining > 0 ? 'var(--danger)' : 'var(--success)'}">${fmtNum(data.remaining)} ل.س</b></div>
        <div class="progress ${isAssoc ? 'assoc' : 'death'}" style="margin-top:8px"><div style="width:${data.percent}%"></div></div>
      </div>
      ${data.installments?.length ? `
        <div style="padding:8px;background:var(--card);border-radius:8px;margin-bottom:8px">
          <div style="font-size:11px;font-weight:800;color:var(--muted);margin-bottom:6px">📋 الأقساط (${data.installments.length})</div>
          ${data.installments.map(i => `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span>${esc(i.eventName || 'وفاة')}</span><span style="color:${i.status === 'paid' ? 'var(--success)' : 'var(--danger)'};font-weight:700">${i.status === 'paid' ? '✅' : '⏳'} ${fmtNum(i.amount)}</span></div>`).join('')}
        </div>
      ` : ''}
      ${data.joinFee > 0 ? `
        <div style="padding:8px;background:var(--card);border-radius:8px;border:2px solid var(--warning)">
          <div style="font-size:11px;font-weight:800;color:var(--warning);margin-bottom:6px">📋 رسوم الانضمام</div>
          <div style="display:flex;justify-content:space-between;font-size:12px"><span class="muted">المطلوب</span><b>${fmtNum(data.joinFee)}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:12px"><span class="muted">المدفوع</span><b style="color:var(--success)">${fmtNum(data.joinFeePaid)}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:4px;padding-top:4px;border-top:1px dashed var(--border)"><span style="font-weight:800">المتبقي</span><b style="color:${data.joinFeeRemaining > 0 ? 'var(--danger)' : 'var(--success)'}">${fmtNum(data.joinFeeRemaining)}</b></div>
        </div>
      ` : ''}
    </div>

  $('pfDuesBox').innerHTML = html;

  const buttons = [];
  if(totalRemaining > 0){
    buttons.push(`<button onclick="$('pfAmount').value=${totalRemaining}">💰 كامل ${fmtShort(totalRemaining)}</button>`);
    buttons.push(`<button onclick="$('pfAmount').value=${Math.round(totalRemaining / 2)}">نصف</button>`);
  }
  buttons.push(`<button onclick="$('pfAmount').value=5000">5,000</button>`);
  $('pfQuickButtons').innerHTML = buttons.join('');
  $('pfAmount').value = totalRemaining > 0 ? totalRemaining : '';
}

async function saveFundPayment(fund){
  const isDonation = fund === 'donation';
  const personId = isDonation ? null : Number($('pfPersonId').value);
  const amount = Number($('pfAmount').value);
  const date = $('pfDate').value;
  const year = Number($('pfYear').value);
  const notes = $('pfNotes')?.value?.trim() || '';
  const donorName = isDonation ? ($('pfDonorName')?.value?.trim() || '') : '';

  if(!isDonation && !personId){ toast('اختر المشترك','error'); return; }
  if(!amount || amount <= 0){ toast('المبلغ مطلوب','error'); return; }
  if(!date){ toast('التاريخ مطلوب','error'); return; }

  showLoad(true);
  try{
    let paymentInfo = null;

    if(isDonation){
      const record = {
        donorName: donorName || 'متبرع مجهول', personId: null,
        amount, date, year, notes, fund:'donation',
        collectorId: S.currentUser.id, collectorName: S.currentUser.name,
        createdAt: new Date().toISOString()
      };
      const id = await dbPut('donations', record);
      record.id = id;
      S.donations.push(record);
      paymentInfo = { personName: record.donorName, fund:'donation', amount };
    }
    else if(fund === 'assoc'){
      const record = {
        personId, fund:'assoc', amount, date, year, notes,
        collectorId: S.currentUser.id, collectorName: S.currentUser.name,
        createdAt: new Date().toISOString()
      };
      const id = await dbPut('assocPayments', record);
      record.id = id;
      S.assocPayments.push(record);
      const person = getPersonById(personId);
      paymentInfo = { personName: person.name, fund:'assoc', amount };
    }
    else if(fund === 'death'){
      const pending = S.deathInstallments
        .filter(i => i.personId === personId && i.year === year && i.status === 'pending')
        .sort((a,b) => (a.deathDate || '').localeCompare(b.deathDate || ''));

      let remaining = amount;
      let paidCount = 0;
      for(const inst of pending){
        if(remaining <= 0) break;
        const instAmount = Number(inst.amount) || 0;
        if(remaining >= instAmount){
          inst.status = 'paid';
          inst.paidDate = date;
          await dbPut('deathInstallments', inst);
          remaining -= instAmount;
          paidCount++;
        }
      }
      const record = {
        personId, fund:'death', amount, date, year, notes, paidCount,
        collectorId: S.currentUser.id, collectorName: S.currentUser.name,
        createdAt: new Date().toISOString()
      };
      const id = await dbPut('assocPayments', record);
      record.id = id;
      S.assocPayments.push(record);
      const person = getPersonById(personId);
      paymentInfo = { personName: person.name, fund:'death', amount, paidCount };
    }

    toast('✅ تم التسجيل', 'success', 3000);
    closeSheet();
    if(S.page === 'pg-home') renderHome();
    if(S.page === 'pg-subscribers') renderSubscribers();
    if(S.page === 'pg-payments') renderPayments();

  } catch(e){ console.error(e); toast('خطأ: ' + e.message, 'error'); }
  showLoad(false);
}

async function saveDeathEvent(){
  const name = cleanText($('deName').value);
  const date = $('deDate').value;
  const year = Number($('deYear').value);
  const comp = Number($('deComp').value);
  const installment = Number($('deInstallment').value);
  const recipient = cleanText($('deRecipient').value);
  const notes = cleanText($('deNotes').value);

  if(!name){ toast('الاسم مطلوب','error'); return; }
  if(!date){ toast('التاريخ مطلوب','error'); return; }
  if(!comp || comp <= 0){ toast('التعويض مطلوب','error'); return; }
  if(!installment || installment <= 0){ toast('القسط مطلوب','error'); return; }

  if(!confirm(`⚠️ سيُضاف ${fmtNum(installment)} ل.س لكل مشترك في الوفاة. متابعة؟`)) return;

  showLoad(true);
  try{
    const event = {
      deceasedName: name, deathDate: date, year, compensation: comp, installment, recipient, notes,
      createdByName: S.currentUser.name, createdAt: new Date().toISOString()
    };
    const eventId = await dbPut('deathEvents', event);
    event.id = eventId;
    S.deathEvents.push(event);

    let created = 0;
    for(const person of S.people){
      if(!person.joinedDeathYear || person.joinedDeathYear > year) continue;
      const inst = {
        personId: person.id, eventId, eventName: name, deathDate: date, year,
        amount: installment, status:'pending', paidDate: null,
        createdAt: new Date().toISOString()
      };
      const iid = await dbPut('deathInstallments', inst);
      inst.id = iid;
      S.deathInstallments.push(inst);
      created++;
    }

    toast(`⚰️ أُضيف ${created} قسط`, 'success', 4000);
    closeSheet();
    if(S.page === 'pg-home') renderHome();
    if(S.page === 'pg-payments') renderPayments();
  } catch(e){ console.error(e); toast('خطأ: ' + e.message, 'error'); }
  showLoad(false);
}

function setPaymentsFilter(k){ S.filters.payments = k; renderPayments(); }

function renderPayments(){
  const year = S.currentYear;
  const yearPayments = S.assocPayments.filter(p => p.year === year);
  const yearDonations = S.donations.filter(d => d.year === year);

  $('paymentsStats').innerHTML = `
    <div class="stat assoc"><div class="val">${yearPayments.filter(p => !p.fund || p.fund === 'assoc').length}</div><div class="lbl">💰 جمعية</div></div>
    <div class="stat death"><div class="val">${yearPayments.filter(p => p.fund === 'death').length}</div><div class="lbl">⚰️ وفاة</div></div>
    <div class="stat orange"><div class="val">${yearPayments.filter(p => p.fund === 'joinAssoc' || p.fund === 'joinDeath').length}</div><div class="lbl">📋 انضمام</div></div>
    <div class="stat donation"><div class="val">${yearDonations.length}</div><div class="lbl">💚 تبرعات</div></div>
  `;

  const chips = [
    { k:'assoc', l:'💰 جمعية' }, { k:'death', l:'⚰️ وفاة' },
    { k:'join', l:'📋 انضمام' }, { k:'donation', l:'💚 تبرعات' }, { k:'all', l:'📊 الكل' }
  ];
  $('paymentsChips').innerHTML = chips.map(c =>
    `<button class="chip ${S.filters.payments === c.k ? 'on' : ''}" onclick="setPaymentsFilter('${c.k}')">${c.l}</button>`
  ).join('');

  const filter = S.filters.payments;
  let list = [];
  if(filter === 'all'){
    list = [...yearPayments.map(p => ({...p, _type:'payment'})), ...yearDonations.map(d => ({...d, _type:'donation'}))];
  } else if(filter === 'assoc'){
    list = yearPayments.filter(p => !p.fund || p.fund === 'assoc').map(p => ({...p, _type:'payment'}));
  } else if(filter === 'death'){
    list = yearPayments.filter(p => p.fund === 'death').map(p => ({...p, _type:'payment'}));
  } else if(filter === 'join'){
    list = yearPayments.filter(p => p.fund === 'joinAssoc' || p.fund === 'joinDeath').map(p => ({...p, _type:'payment'}));
  } else if(filter === 'donation'){
    list = yearDonations.map(d => ({...d, _type:'donation'}));
  }

  if(S.search){
    const s = normAr(S.search);
    list = list.filter(p => {
      const name = p._type === 'donation' ? (p.donorName || '') : (getPersonById(p.personId)?.name || '');
      return normAr(name).includes(s);
    });
  }

  list.sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  list = list.slice(0, 200);

  const el = $('paymentsContent');
  if(!list.length){
    el.innerHTML = `<div class="empty"><span class="ico">💰</span><h3>لا توجد دفعات في ${year}</h3></div>`;
    return;
  }

  el.innerHTML = `<div class="list">${list.map(p => {
    const isDonation = p._type === 'donation';
    const person = isDonation ? null : getPersonById(p.personId);
    const name = isDonation ? (p.donorName || 'متبرع') : (person?.name || '—');
    let icon = '💰', color = 'blue', fundLabel = 'دفعة جمعية';
    if(isDonation){ icon = '💚'; color = 'green'; fundLabel = 'تبرع'; }
    else if(p.fund === 'death'){ icon = '⚰️'; color = 'red'; fundLabel = 'دفعة وفاة'; }
    else if(p.fund === 'joinAssoc'){ icon = '📋'; color = 'orange'; fundLabel = 'انضمام جمعية'; }
    else if(p.fund === 'joinDeath'){ icon = '📋'; color = 'orange'; fundLabel = 'انضمام وفاة'; }

    const canEdit = hasPerm('payments.edit');
    return `<div class="item" onclick="openPaymentDetail(${p.id}, '${isDonation ? 'donation' : 'payment'}')">
      <div class="av ${color}">${icon}</div>
      <div class="body"><div class="ttl">${esc(name)}</div><div class="sub">${fundLabel} • ${fmtDate(p.date)} • ${esc(p.collectorName || '')}</div></div>
      <div style="text-align:left;display:flex;align-items:center;gap:6px">
        <div style="font-weight:800;font-size:14px">${fmtNum(p.amount)}</div>
        ${canEdit ? `<button onclick="event.stopPropagation();editPayment(${p.id}, '${isDonation ? 'donation' : 'payment'}')" style="width:28px;height:28px;border-radius:8px;background:var(--bg);font-size:12px">✏️</button>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

    <div class="fld"><label>ملاحظات</label><textarea id="edNotes">${esc(record.notes||'')}</textarea></div>
  `;

  const foot = `<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn primary" onclick="savePaymentEdit(${id}, '${type}')">💾 حفظ</button>`;
  openSheet('✏️ تعديل دفعة', body, foot);
}

async function savePaymentEdit(id, type){
  const amount = Number($('edAmount').value);
  const date = $('edDate').value;
  const year = Number($('edYear').value);
  const notes = cleanText($('edNotes').value);
  if(!amount || amount <= 0){ toast('المبلغ مطلوب','error'); return; }
  if(!date){ toast('التاريخ مطلوب','error'); return; }

  try{
    if(type === 'donation'){
      const d = S.donations.find(x => x.id === id);
      d.amount = amount; d.date = date; d.year = year; d.notes = notes;
      if($('edDonor')) d.donorName = cleanText($('edDonor').value);
      await dbPut('donations', d);
    } else {
      const p = S.assocPayments.find(x => x.id === id);
      p.amount = amount; p.date = date; p.year = year; p.notes = notes;
      await dbPut('assocPayments', p);
    }
    toast('✅ تم التعديل');
    closeSheet();
    renderPayments();
    if(S.page === 'pg-home') renderHome();
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function deletePayment(id, type){
  if(!confirm('حذف نهائي؟')) return;
  if(!confirm('تأكيد أخير!')) return;
  try{
    if(type === 'donation'){
      await dbDel('donations', id);
      S.donations = S.donations.filter(x => x.id !== id);
    } else {
      await dbDel('assocPayments', id);
      S.assocPayments = S.assocPayments.filter(x => x.id !== id);
    }
    toast('🗑️ تم الحذف');
    closeSheet();
    renderPayments();
    if(S.page === 'pg-home') renderHome();
  } catch(e){ toast('خطأ','error'); }
}

function openReport(type){
  const year = S.currentYear;
  if(type === 'assoc') openAssocReport(year);
  else if(type === 'death') openDeathReport(year);
  else if(type === 'donation') openDonationReport(year);
  else if(type === 'sector') openSectorReport(year);
  else if(type === 'late') openLatePayerSheet();
  else if(type === 'yearly') openYearlyReport(year);
  else if(type === 'stats') openStatsSheet();
  else if(type === 'assembly') openAssemblyReport(year);
}

function openAssocReport(year){
  const payments = S.assocPayments.filter(p => p.year === year && (!p.fund || p.fund === 'assoc'));

function openLatePayerSheet(){
  const year = S.currentYear;
  const latePeople = [];
  for(const person of S.people){
    if(!person.joinedAssocYear && !person.joinedDeathYear) continue;
    const dues = computeMemberDues(person.id, year);
    if(dues && dues.total.remaining > 0) latePeople.push({ person, dues });
  }
  latePeople.sort((a,b) => b.dues.total.remaining - a.dues.total.remaining);

  if(!latePeople.length){
    openSheet('⏰ المتأخرون', `<div class="empty"><span class="ico">🎉</span><h3>لا يوجد متأخرون</h3></div>`, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>');

  const totalRemaining = latePeople.reduce((s, p) => s + p.dues.total.remaining, 0);

function shareLatePayers(){
  const year = S.currentYear;
  const late = [];
  for(const person of S.people){
    if(!person.joinedAssocYear && !person.joinedDeathYear) continue;
    const dues = computeMemberDues(person.id, year);
    if(dues && dues.total.remaining > 0) late.push({ name: person.name, code: person.code || '', remaining: dues.total.remaining });
  }
  if(!late.length){ toast('لا يوجد متأخرون','success'); return; }

  let txt = `⏰ *قائمة المتأخرين — ${year}*\nعدد: ${late.length}\n\n`;
  late.forEach((p, i) => { txt += `${i+1}. ${p.name}${p.code ? ' ('+p.code+')' : ''} — ${fmtNum(p.remaining)}\n`; });
  txt += `\n_صندوق زعورة_`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

async function saveConstant(year){
  const obj = {
    year,
    assocYearly: Number($('cAssoc').value) || 0,
    assocYearlyReduced: Number($('cAssocRed').value) || 0,
    deathInstallment: Number($('cDeathInst').value) || 0,
    deathCompensation: Number($('cDeathComp').value) || 0,
    joinAssoc: Number($('cJoinAssoc').value) || 0,
    joinAssocReduced: Number($('cJoinAssocRed').value) || 0,
    joinDeath: Number($('cJoinDeath').value) || 0,
    joinDeathReduced: Number($('cJoinDeathRed').value) || 0
  };
  try{
    const existing = S.constants.find(x => x.year === year);
    if(existing){
      obj.id = existing.id;
      await dbPut('constants', obj);
      const i = S.constants.findIndex(x => x.year === year);
      if(i > -1) S.constants[i] = obj;
      toast(`✅ تم تعديل ${year}`);
    } else {
      const newId = await dbPut('constants', obj);
      obj.id = newId;
      S.constants.push(obj);
      toast(`✅ تم إضافة ${year}`);
    }
    closeSheet();
    setTimeout(openConstantsSheet, 250);
  } catch(e){ toast('خطأ','error'); }
}

async function saveExpense(id = null){
  const description = cleanText($('expDesc').value);
  const amount = Number($('expAmount').value);
  const date = $('expDate').value;
  const year = Number($('expYear').value);
  if(!description){ toast('الوصف مطلوب','error'); return; }
  if(!amount || amount <= 0){ toast('المبلغ مطلوب','error'); return; }

  try{
    const expense = {
      description, amount, date, year,
      category: $('expCategory').value,
      notes: cleanText($('expNotes').value),
      createdByName: S.currentUser.name
    };
    if(id){
      const old = await dbGet('expenses', id);
      expense.id = id;
      expense.createdAt = old.createdAt;
      await dbPut('expenses', expense);
      const i = S.expenses.findIndex(x => x.id === id);
      if(i > -1) S.expenses[i] = expense;
      toast('✅ تم التعديل');
    } else {
      expense.createdAt = new Date().toISOString();
      const newId = await dbPut('expenses', expense);
      expense.id = newId;
      S.expenses.push(expense);
      toast('✅ تم الحفظ');
    }
    closeSheet();
    if(S.page === 'pg-home') renderHome();
  } catch(e){ toast('خطأ','error'); }
}

function openStoreItemSheet(id = null){

async function saveStoreItem(id = null){
  const name = cleanText($('stiName').value);
  if(!name){ toast('اسم المادة مطلوب','error'); return; }
  try{
    const item = {
      name,
      category: $('stiCategory').value,
      unit: cleanText($('stiUnit').value) || 'قطعة',
      quantity: Number($('stiQuantity').value) || 0,
      minQuantity: Number($('stiMin').value) || 0,
      unitPrice: Number($('stiPrice').value) || 0,
      notes: cleanText($('stiNotes').value)
    };
    if(id){
      item.id = id;
      await dbPut('storeItems', item);
      const i = S.storeItems.findIndex(x => x.id === id);
      if(i > -1) S.storeItems[i] = item;
      toast('✅ تم التعديل');
    } else {
      const newId = await dbPut('storeItems', item);
      item.id = newId;
      S.storeItems.push(item);
      toast('✅ تمت الإضافة');
    }
    closeSheet();
    setTimeout(openStoreSheet, 250);
  } catch(e){ toast('خطأ','error'); }
}

async function deleteStoreItem(id){
  if(!confirm('حذف؟')) return;
  try{
    await dbDel('storeItems', id);
    S.storeItems = S.storeItems.filter(x => x.id !== id);
    toast('🗑️');
    closeSheet();
    setTimeout(openStoreSheet, 250);
  } catch(e){ toast('خطأ','error'); }
}

function openStoreMovementSheet(){
  const items = S.storeItems;
  if(!items.length){ toast('لا توجد مواد','warning'); return; }
  const body = `
    <div class="fld"><label>المادة <span class="req">*</span></label><select id="stmItemId"><option value="">— اختر —</option>${items.map(i => `<option value="${i.id}">${esc(i.name)} (${i.quantity})</option>`).join('')}</select></div>
    <div class="fld"><label>النوع</label><select id="stmType"><option value="in">📥 وارد</option><option value="out">📤 صادر</option></select></div>
    <div class="fld"><label>الكمية <span class="req">*</span></label><input id="stmQuantity" type="tel" inputmode="numeric"></div>
    <div class="fld-row">
      <div class="fld"><label>التاريخ</label><input id="stmDate" type="date" value="${today()}"></div>
      <div class="fld"><label>المرجع</label><input id="stmRef"></div>
    </div>
    <div class="fld"><label>ملاحظات</label><textarea id="stmNotes"></textarea></div>
  `;
  const foot = `<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn primary" onclick="saveStoreMovement()">💾</button>`;
  openSheet('🔄 حركة مستودع', body, foot, { focus:'stmQuantity' });
}

async function saveStoreMovement(){
  const itemId = Number($('stmItemId').value);
  const type = $('stmType').value;
  const quantity = Number($('stmQuantity').value);
  if(!itemId){ toast('اختر المادة','error'); return; }
  if(!quantity || quantity <= 0){ toast('الكمية مطلوبة','error'); return; }

  const item = S.storeItems.find(x => x.id === itemId);
  if(!item) return;
  const oldQty = Number(item.quantity) || 0;
  const newQty = type === 'in' ? oldQty + quantity : oldQty - quantity;
  if(newQty < 0){ toast('الكمية غير كافية','error'); return; }

  try{
    const movement = {
      itemId, itemName: item.name, type, quantity,
      date: $('stmDate').value, ref: cleanText($('stmRef').value),
      notes: cleanText($('stmNotes').value),
      oldQuantity: oldQty, newQuantity: newQty,
      userName: S.currentUser.name,
      createdAt: new Date().toISOString()
    };
    await dbPut('storeMovements', movement);
    S.storeMovements.push(movement);
    item.quantity = newQty;
    await dbPut('storeItems', item);
    toast('✅ تم الحفظ');
    closeSheet();
  } catch(e){ toast('خطأ','error'); }
}

function openStoreMovementsList(){
  const list = [...S.storeMovements].sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||'')).slice(0, 200);
  const body = list.length ? `<div class="list">${list.map(m => `<div class="item" style="cursor:default"><div class="av ${m.type === 'in' ? 'green' : 'orange'}">${m.type === 'in' ? '📥' : '📤'}</div><div class="body"><div class="ttl">${esc(m.itemName)}</div><div class="sub">${fmtDate(m.date)} • ${esc(m.userName||'')}</div></div><div style="font-weight:800;color:${m.type === 'in' ? 'var(--success)' : 'var(--warning)'}">${m.type === 'in' ? '+' : '-'}${m.quantity}</div></div>`).join('')}</div>` : '<div style="text-align:center;padding:30px;color:var(--muted)">لا توجد حركات</div>';
  openSheet('📋 الحركات', body, '<button class="btn ghost" onclick="closeSheet()">إغلاق</button>', { wide:true });
}
