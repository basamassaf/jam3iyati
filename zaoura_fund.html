function buildAnnualReport(year){
  const y = year || S.currentYear;
  
  const membersStats = {
    total: S.members.length,
    activeAssoc: 0, activeDeath: 0, activeBoth: 0,
    newThisYear: 0, withdrawnThisYear: 0,
    frozenThisYear: 0, deceasedThisYear: 0
  };
  
  S.members.forEach(function(m){
    const st = m.memberStatus || 'نشط';
    const hasAssoc = m.assocStartYear && m.assocStartYear <= y && !m.assocExempt;
    const hasDeath = m.deathStartYear && m.deathStartYear <= y && !m.deathExempt;
    
    if(st !== 'منسحب' && st !== 'متوقف' && st !== 'متوفى'){
      if(hasAssoc && hasDeath) membersStats.activeBoth++;
      else if(hasAssoc) membersStats.activeAssoc++;
      else if(hasDeath) membersStats.activeDeath++;
    }
    
    if(m.assocStartYear === y || m.deathStartYear === y) membersStats.newThisYear++;
    if(st === 'منسحب' && m.stopYear === y) membersStats.withdrawnThisYear++;
    if(st === 'متوقف' && m.stopYear === y) membersStats.frozenThisYear++;
    if(st === 'متوفى' && m.deathDate){
      const dy = new Date(m.deathDate).getFullYear();
      if(dy === y) membersStats.deceasedThisYear++;
    }
  });
  
  const sum = function(arr){ return arr.reduce(function(s, x){ return s + (Number(x.amount) || 0); }, 0); };
  
  const assocYearly = getFundYears('assoc').years.find(function(v){ return v.year === y; });
  const deathYearly = getFundYears('death').years.find(function(v){ return v.year === y; });
  const donationYearly = getFundYears('donation').years.find(function(v){ return v.year === y; });
  
  const opening = getOpeningBalance();
  
  return {
    year: y,
    membersStats: membersStats,
    opening: { assoc: opening.assoc || 0, death: opening.death || 0, donation: opening.donation || 0 },
    assoc: assocYearly || { collected: 0, incomes: 0, expenses: 0, net: 0, cumulative: opening.assoc || 0 },
    death: deathYearly || { collected: 0, incomes: 0, expenses: 0, compensations: 0, net: 0, cumulative: opening.death || 0 },
    donation: donationYearly || { collected: 0, incomes: 0, expenses: 0, net: 0, cumulative: opening.donation || 0 },
    deaths: {
      count: S.deaths.filter(function(d){ return Number(d.year) === y; }).length,
      list: S.deaths.filter(function(d){ return Number(d.year) === y; }),
      totalComp: S.deaths.filter(function(d){ return Number(d.year) === y; })
        .reduce(function(s, d){ return s + (Number(d.compensation) || 0); }, 0)
    },
    collectors: getAllCollectors(y).filter(function(c){ return c.total.collected > 0; }).slice(0, 10)
  };
}

/* العائلات */
function openFamilyReport(){
  const families = {};
  S.members.forEach(function(m){
    const key = m.familyCode || 'بدون كود';
    if(!families[key]) families[key] = { code: key, members: [] };
    families[key].members.push(m);
  });
  
  Object.keys(families).forEach(function(key){
    const f = families[key];
    f.totalPaid = 0; f.totalRem = 0;
    f.members.forEach(function(m){
      const full = computeMemberFull(m.id);
      if(full){
        f.totalPaid += full.total.totalPaid;
        f.totalRem += full.total.totalRem;
      }
    });
  });
  
  const list = Object.keys(families).map(function(k){ return families[k]; })
    .sort(function(a, b){ return b.members.length - a.members.length; });
  
  let html = '<div class="list">';

  members.forEach(function(m){

  html += '<span class="val" style="color:' + (totalRem > 0 ? 'var(--death)' : 'var(--success)') + ';font-size:15px">' + fmtNum(totalRem) + '</span></div>';
  html += '</div>';

  members.forEach(function(m){
    const full = computeMemberFull(m.id);
    const rem = full ? full.total.totalRem : 0;

    html += '<div class="item" onclick="closeSheet();setTimeout(function(){openMemberDetail(' + m.id + ')},150)">';

    else html += '<div style="color:var(--success);font-size:14px">✅</div>';

function getAllLogs(filters){
  filters = filters || {};
  const y = filters.year || 'all';
  const fund = filters.fund || 'all';
  const type = filters.type || 'all';
  const logs = [];
  
  if(type === 'all' || type === 'payment'){
    S.payments.forEach(function(p){
      const py = Number(p.forYear) || Number(p.year);
      if(y !== 'all' && py !== y) return;
      if(fund !== 'all' && p.fund !== fund) return;
      const m = p.memberId ? getMemberById(p.memberId) : null;
      logs.push({
        id: 'p_' + p.id, type: 'payment',
        icon: p.fund === 'assoc' ? '💰' : p.fund === 'death' ? '⚰️' : '💚',
        color: p.fund === 'assoc' ? 'blue' : p.fund === 'death' ? 'red' : 'green',
        title: m ? m.name : (p.notes || 'دفعة'),
        subtitle: (p.fund === 'assoc' ? 'دفعة جمعية' : p.fund === 'death' ? 'دفعة وفاة' : 'تبرع') + (p.collectorName ? ' • ' + p.collectorName : ''),
        amount: Number(p.amount) || 0, positive: true,
        date: p.date, year: py, fund: p.fund,
        source: p.imported ? 'imported' : 'manual',
        details: function(){ openPaymentDetail(p.id); }
      });
    });
  }
  
  if(type === 'all' || type === 'income'){
    S.incomes.forEach(function(i){
      if(y !== 'all' && Number(i.year) !== y) return;
      if(fund !== 'all' && i.fund !== fund) return;
      logs.push({
        id: 'i_' + i.id, type: 'income', icon: '📥', color: 'green',
        title: i.notes || i.category || 'إيراد',
        subtitle: (i.category || 'إيراد') + (i.recordedByName ? ' • ' + i.recordedByName : ''),
        amount: Number(i.amount) || 0, positive: true,
        date: i.date, year: Number(i.year), fund: i.fund,
        source: i.imported ? 'imported' : 'manual',
        details: function(){ openIncomeSheetFor(i.fund, i.id); }
      });
    });
  }
  
  if(type === 'all' || type === 'expense'){
    S.expenses.forEach(function(e){
      if(y !== 'all' && Number(e.year) !== y) return;
      if(fund !== 'all' && e.fund !== fund) return;
      logs.push({
        id: 'e_' + e.id, type: 'expense', icon: '💸', color: 'red',
        title: e.description,
        subtitle: (e.category || 'مصروف') + (e.recordedByName ? ' • ' + e.recordedByName : ''),
        amount: Number(e.amount) || 0, positive: false,
        date: e.date, year: Number(e.year), fund: e.fund,
        source: e.imported ? 'imported' : 'manual',
        details: function(){ openExpenseSheetFor(e.fund, e.id); }
      });
    });
  }
  
  if(type === 'all' || type === 'death'){
    S.deaths.forEach(function(d){
      if(y !== 'all' && Number(d.year) !== y) return;
      if(fund !== 'all' && fund !== 'death') return;
      logs.push({
        id: 'd_' + d.id, type: 'death', icon: '📤', color: 'red',
        title: 'تعويض ' + (d.deceasedName || ''),
        subtitle: d.recipient ? 'استلم: ' + d.recipient : 'وفاة',
        amount: Number(d.compensation) || 0, positive: false,
        date: d.deathDate, year: Number(d.year), fund: 'death',
        source: d.imported ? 'imported' : 'manual',
        details: function(){ openDeathDetail(d.id); }
      });
    });
  }
  
  if(type === 'all' || type === 'delivery'){
    S.deliveries.forEach(function(d){
      if(y !== 'all'){
        const dy = d.date ? new Date(d.date).getFullYear() : null;
        if(dy !== y) return;
      }
      if(fund !== 'all' && d.fund !== fund) return;
      logs.push({
        id: 'dv_' + d.id, type: 'delivery',
        icon: d.receivedAt ? '✅' : '⏳',
        color: d.receivedAt ? 'green' : 'orange',
        title: (d.fromUserName || '') + ' ← ' + (d.toUserName || ''),
        subtitle: 'تسليم ' + (d.fund === 'assoc' ? 'جمعية' : d.fund === 'death' ? 'وفاة' : 'تبرع'),
        amount: Number(d.amount) || 0, positive: true,
        date: d.date, year: d.date ? new Date(d.date).getFullYear() : null,
        fund: d.fund,
        source: d.imported ? 'imported' : 'manual',
        details: function(){ openDeliveryDetail(d.id); }
      });
    });
  }
  
  logs.sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });
  return logs;
}

function renderLogs(){
  const filters = S.filters.logs;
  const logs = getAllLogs(filters);
  
  let totalIn = 0, totalOut = 0;
  logs.forEach(function(l){
    if(l.positive) totalIn += l.amount;
    else totalOut += l.amount;
  });
  
  let displayed = logs;
  if(S.search){
    const s = normAr(S.search);
    displayed = logs.filter(function(l){ return normAr(l.title + ' ' + l.subtitle).indexOf(s) > -1; });
  }
  
  const years = [2025, 2026, 2027, 2028, 2029];
  
  let html = '';
  
  html += '<div class="stats-scroll">';
  html += '<div class="stat green"><div class="val">' + fmtShort(totalIn) + '</div><div class="lbl">📥 واردات</div></div>';
  html += '<div class="stat red"><div class="val">' + fmtShort(totalOut) + '</div><div class="lbl">📤 صادرات</div></div>';
  html += '<div class="stat"><div class="val">' + logs.length + '</div><div class="lbl">📋 عدد السجلات</div></div>';
  html += '<div class="stat blue"><div class="val">' + fmtShort(totalIn - totalOut) + '</div><div class="lbl">📊 الصافي</div></div>';
  html += '</div>';
  
  html += '<div class="card" style="padding:10px">';
  html += '<div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px">📅 السنة</div>';
  html += '<div class="chips" style="margin-bottom:10px">';
  html += '<button class="chip ' + (filters.year === 'all' ? 'on' : '') + '" onclick="setLogFilter(\'year\',\'all\')">الكل</button>';
  years.forEach(function(yy){
    html += '<button class="chip ' + (filters.year === yy ? 'on' : '') + '" onclick="setLogFilter(\'year\',' + yy + ')">' + yy + '</button>';
  });
  html += '</div>';
  
  html += '<div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px">📦 الصندوق</div>';
  html += '<div class="chips" style="margin-bottom:10px">';
  html += '<button class="chip ' + (filters.fund === 'all' ? 'on' : '') + '" onclick="setLogFilter(\'fund\',\'all\')">📋 الكل</button>';
  html += '<button class="chip ' + (filters.fund === 'assoc' ? 'on' : '') + '" onclick="setLogFilter(\'fund\',\'assoc\')">💰 الجمعية</button>';
  html += '<button class="chip ' + (filters.fund === 'death' ? 'on' : '') + '" onclick="setLogFilter(\'fund\',\'death\')">⚰️ الوفاة</button>';
  html += '<button class="chip ' + (filters.fund === 'donation' ? 'on' : '') + '" onclick="setLogFilter(\'fund\',\'donation\')">💚 التبرعات</button>';
  html += '</div>';
  
  html += '<div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px">📋 النوع</div>';
  html += '<div class="chips" style="margin-bottom:0">';
  html += '<button class="chip ' + (filters.type === 'all' ? 'on' : '') + '" onclick="setLogFilter(\'type\',\'all\')">الكل</button>';
  html += '<button class="chip ' + (filters.type === 'payment' ? 'on' : '') + '" onclick="setLogFilter(\'type\',\'payment\')">💰 دفعات</button>';
  html += '<button class="chip ' + (filters.type === 'income' ? 'on' : '') + '" onclick="setLogFilter(\'type\',\'income\')">📥 إيرادات</button>';
  html += '<button class="chip ' + (filters.type === 'expense' ? 'on' : '') + '" onclick="setLogFilter(\'type\',\'expense\')">💸 مصاريف</button>';
  html += '<button class="chip ' + (filters.type === 'death' ? 'on' : '') + '" onclick="setLogFilter(\'type\',\'death\')">📤 تعويضات</button>';
  html += '<button class="chip ' + (filters.type === 'delivery' ? 'on' : '') + '" onclick="setLogFilter(\'type\',\'delivery\')">📤 تسليمات</button>';
  html += '</div></div>';
  
  if(displayed.length){
    html += '<div class="list">';
    displayed.slice(0, 500).forEach(function(l){
      html += '<div class="item" onclick="openLogDetail(\'' + l.id + '\')">';
      html += '<div class="av ' + l.color + '">' + l.icon + '</div>';
      html += '<div class="body"><div class="ttl">' + esc(l.title) + (l.source === 'imported' ? ' <span class="badge muted" style="font-size:9px">📥</span>' : '') + '</div>';
      html += '<div class="sub">' + fmtDate(l.date) + ' • ' + esc(l.subtitle) + '</div></div>';
      html += '<div style="text-align:left">';
      html += '<div style="font-weight:800;font-size:13px;color:' + (l.positive ? 'var(--success)' : 'var(--death)') + ';font-family:\'SF Mono\',monospace">' + (l.positive ? '+' : '-') + fmtShort(l.amount) + '</div>';
      html += '<div style="font-size:10px;color:var(--muted-2)">' + (l.year || '—') + '</div></div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="empty"><span class="ico">📋</span><h3>لا سجلات</h3><p>جرّب فلاتر أخرى</p></div>';
  }
  
  $('pg-logs').innerHTML = html;
}

function setLogFilter(key, value){
  S.filters.logs[key] = value;
  renderLogs();
}

function openLogDetail(logId){
  const filters = S.filters.logs;
  const logs = getAllLogs(filters);
  const log = logs.find(function(l){ return l.id === logId; });
  if(!log || !log.details) return;
  log.details();
}

async function saveUser(id){
  const name = cleanText($('uName').value);
  const pin = $('uPin').value.trim();
  if(!name){ toast('الاسم مطلوب', 'error'); return; }
  if(pin && !/^\d{4}$/.test(pin)){ toast('كلمة المرور: 4 أرقام', 'error'); return; }
  
  const role = $('uRole').value;
  const collectFund = role === 'collector' ? ($('uCollectFund') ? $('uCollectFund').value : 'both') : null;
  const sector = role === 'collector' ? ($('uSector') ? $('uSector').value : '') : '';
  const memberId = role === 'member' ? (Number($('uMemberId') ? $('uMemberId').value : 0) || null) : null;
  
  if(role === 'member' && !memberId){ toast('اربط المشترك بعضو', 'error'); return; }
  
  try {
    const old = id ? await dbGet('users', id) : null;
    const obj = {
      name: name,
      phone: cleanPhone($('uPhone').value),
      role: role,
      collectFund: collectFund,
      sector: sector,
      memberId: memberId,
      hasPin: pin ? true : (old ? old.hasPin : false),
      pin: pin ? pin : (old ? old.pin : null),
      createdAt: old ? old.createdAt : new Date().toISOString()
    };
    
    if(id){
      obj.id = id;
      await dbPut('users', obj);
      const i = S.users.findIndex(function(x){ return x.id === id; });
      if(i > -1) S.users[i] = obj;
      if(S.currentUser && S.currentUser.id === id) S.currentUser = obj;
    } else {
      const newId = await dbPut('users', obj);
      obj.id = newId;
      S.users.push(obj);
    }
    
    toast('✅');
    closeSheetAll();
    go(S.page);
  } catch(e){
    toast('خطأ', 'error');
  }
}

async function deleteUser(id){
  if(!confirm('حذف المستخدم؟')) return;
  const u = S.users.find(function(x){ return x.id === id; });
  if(u.role === 'manager' && S.users.filter(function(x){ return x.role === 'manager'; }).length <= 1){
    toast('لا يمكن حذف المدير الوحيد', 'error');
    return;
  }
  try {
    await dbDel('users', id);
    S.users = S.users.filter(function(x){ return x.id !== id; });
    toast('🗑️');
    closeSheetAll();
    go(S.page);
  } catch(e){
    toast('خطأ', 'error');
  }
}

function getCustomFields(target){
  return (S.customFields || []).filter(function(cf){
    return (cf.target || 'members') === target;
  }).sort(function(a, b){ return (a.order || 0) - (b.order || 0); });
}

function renderCustomFieldsHTML(target, values){
  const fields = getCustomFields(target);
  if(!fields.length) return '';
  
  const meta = CUSTOM_TARGETS.find(function(t){ return t.k === target; });
  
  let html = '<div style="margin:14px 0;padding:12px;background:var(--bg);border-radius:12px;border:1px dashed ' + (meta ? meta.color : 'var(--primary)') + '40">';
  html += '<div style="font-weight:800;font-size:12px;color:' + (meta ? meta.color : 'var(--primary)') + ';margin-bottom:10px">📌 حقول إضافية — ' + (meta ? meta.l : target) + '</div>';
  
  fields.forEach(function(cf){
    const v = (values && values[cf.key]) || '';
    const type = cf.fieldType || 'text';
    let input = '';
    if(type === 'textarea'){
      input = '<textarea id="cf_' + cf.key + '" placeholder="' + esc(cf.hint || '') + '">' + esc(v) + '</textarea>';
    } else {
      input = '<input id="cf_' + cf.key + '" value="' + esc(v) + '" placeholder="' + esc(cf.hint || '') + '" type="' + type + '">';
    }
    html += '<div class="fld"><label>' + (cf.icon || '📌') + ' ' + esc(cf.label) + (cf.required ? ' <span class="req">*</span>' : '') + '</label>' + input + '</div>';
  });
  
  html += '</div>';
  return html;
}

function collectCustomFields(target){
  const fields = getCustomFields(target);
  const values = {};
  fields.forEach(function(cf){
    const el = $('cf_' + cf.key);

async function saveCustomField(idx){
  const label = cleanText($('cfLabel').value);
  const key = cleanText($('cfKey').value).replace(/[^a-zA-Z0-9]/g, '');
  if(!label){ toast('الاسم مطلوب', 'error'); return; }
  if(!key){ toast('المفتاح مطلوب', 'error'); return; }
  
  const icon = cleanText($('cfIcon').value) || '📌';
  const hint = cleanText($('cfHint').value);
  const required = $('cfRequired').checked;
  const target = $('cfTarget').value;
  const fieldType = $('cfFieldType').value;
  
  const dup = S.customFields.some(function(c, i){
    return c.key === key && (c.target || 'members') === target && i !== idx;
  });
  if(dup){ toast('المفتاح مستخدم', 'error'); return; }
  
  try {
    const obj = { icon: icon, label: label, key: key, hint: hint, required: required, target: target, fieldType: fieldType, order: 100 };
    
    if(idx !== null && idx !== undefined){
      obj.id = S.customFields[idx] ? S.customFields[idx].id : undefined;
      await dbPut('customFields', obj);
      S.customFields[idx] = obj;
    } else {
      const newId = await dbPut('customFields', obj);
      obj.id = newId;
      S.customFields.push(obj);
    }
    
    toast('✅ تم الحفظ');
    closeSheetAll();
    setTimeout(openCustomFieldsSheet, 200);
  } catch(e){ toast('خطأ: ' + e.message, 'error'); }
}

async function deleteCustomField(idx){
  const cf = S.customFields[idx];
  if(!cf) return;
  if(!confirm('حذف حقل "' + cf.label + '"؟')) return;
  
  try {
    if(cf.id) await dbDel('customFields', cf.id);
    S.customFields.splice(idx, 1);
    toast('🗑️');
    closeSheetAll();
    setTimeout(openCustomFieldsSheet, 200);
  } catch(e){ toast('خطأ', 'error'); }
}

/* استيراد الأعضاء */
async function importMembers(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';
  
  showLoad(true);
  const log = $('importLog');
  log.innerHTML = '<div style="color:var(--muted)">⏳ جاري القراءة...</div>';
  
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });
    
    if(!rows.length){ log.innerHTML = '<div style="color:var(--danger)">❌ الملف فارغ</div>'; showLoad(false); return; }
    
    let added = 0, updated = 0, skip = 0;
    const tc = { both:0, assoc:0, death:0, none:0, unknown:0 };
    const statusCounts = { 'نشط':0, 'منسحب':0, 'متوقف':0, 'معفى':0, 'متوفى':0 };
    
    const existing = new Map();
    S.members.forEach(function(m){
      if(m.code) existing.set(String(m.code), m);
      existing.set(normAr(m.name), m);
    });
    
    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const name = cleanText(gv(r, 'الاسم الثلاثي','الاسم_الثلاثي','الاسم'));
      if(!name){ skip++; continue; }
      
      const code = cleanText(gv(r, 'رقم الفرد','رقم_الفرد','الكود','كود العضو'));
      const subDate = toDate(gv(r, 'تاريخ الاشتراك','تاريخ_الاشتراك','تاريخ الانضمام'));
      const subYear = subDate ? new Date(subDate).getFullYear() : null;
      
      const subTypeRaw = gv(r, 'نوع الاشتراك','نوع_الاشتراك');
      const subType = normAr(subTypeRaw || '');
      const subTypeDefined = subType.length > 0;
      
      const hasAssocWord = /جمعي/.test(subType);
      const hasDeathWord = /وفا/.test(subType);
      const isBoth = subType.indexOf('كلاهما') > -1 || subType === 'كلا' || (hasAssocWord && hasDeathWord);
      const isNone = subType.indexOf('غير') > -1 && subType.indexOf('مشترك') > -1;
      
      let hasAssoc = false, hasDeath = false;
      if(isNone){ tc.none++; }
      else if(isBoth){ hasAssoc = true; hasDeath = true; tc.both++; }
      else if(hasAssocWord){ hasAssoc = true; tc.assoc++; }
      else if(hasDeathWord){ hasDeath = true; tc.death++; }
      else { tc.unknown++; }
      
      const memberTypeStr = normAr(gv(r, 'نوع العضو','نوع_العضو') || '');
      const memberType = memberTypeStr.indexOf('مخفض') > -1 ? 'مخفض' : 'عادي';
      
      const statusRaw = cleanText(gv(r, 'حالة العضو','الحالة','الوضع'));
      let memberStatus = 'نشط';
      const stN = normAr(statusRaw);
      if(stN.indexOf('منسحب') > -1 || stN.indexOf('انسحاب') > -1) memberStatus = 'منسحب';
      else if(stN.indexOf('متوقف') > -1 || stN.indexOf('وقف') > -1) memberStatus = 'متوقف';
      else if(stN.indexOf('معف') > -1) memberStatus = 'معفى';
      else if(stN.indexOf('متوف') > -1) memberStatus = 'متوفى';
      
      statusCounts[memberStatus] = (statusCounts[memberStatus] || 0) + 1;
      
      const statusDate = toDate(gv(r, 'تاريخ الحالة','تاريخ_الحالة','تاريخ التوقف','تاريخ الانسحاب'));
      
      let found = null;
      if(code && existing.has(String(code))) found = existing.get(String(code));
      else if(existing.has(normAr(name))) found = existing.get(normAr(name));
      
      if(found){
        let changed = false;
        if(subTypeDefined && subYear){
          const newAssoc = hasAssoc ? subYear : null;
          const newDeath = hasDeath ? subYear : null;
          if(found.assocStartYear !== newAssoc){ found.assocStartYear = newAssoc; changed = true; }
          if(found.deathStartYear !== newDeath){ found.deathStartYear = newDeath; changed = true; }
        }
        if(memberStatus && found.memberStatus !== memberStatus){ found.memberStatus = memberStatus; changed = true; }
        if(changed){ await dbPut('members', found); updated++; } else skip++;
        continue;
      }
      
      try {
        const member = {
          code: code, name: name,
          familyCode: cleanText(gv(r, 'كود الأسرة','كود_الأسرة')),
          gender: gv(r, 'الجنس') || 'ذكر',
          status: gv(r, 'الحياة') || 'حي',
          relation: gv(r, 'صلة القرابة','صلة_القرابة') || 'رب أسرة',
          birth: toDate(gv(r, 'تاريخ الميلاد','تاريخ_الميلاد')),
          sector: cleanText(gv(r, 'القطاع')),
          phone: cleanPhone(gv(r, 'الجوال','الهاتف')),
          assocStartYear: hasAssoc ? subYear : null,
          deathStartYear: hasDeath ? subYear : null,
          memberType: memberType,
          memberStatus: memberStatus,
          statusDate: statusDate,
          stopYear: (memberStatus === 'منسحب' || memberStatus === 'متوقف')
            ? (statusDate ? new Date(statusDate).getFullYear() : null)
            : null,
          deathDate: memberStatus === 'متوفى' ? (statusDate || '') : '',
          assocExempt: memberStatus === 'معفى',
          deathExempt: memberStatus === 'معفى',
          custom: {},
          notes: cleanText(gv(r, 'ملاحظات')),
          createdAt: new Date().toISOString()
        };
        const newId = await dbPut('members', member);
        member.id = newId;
        S.members.push(member);
        if(code) existing.set(String(code), member);
        existing.set(normAr(name), member);
        added++;
      } catch(e){ skip++; }
    }
    
    const statusHTML = Object.keys(statusCounts).filter(function(k){ return statusCounts[k] > 0; })
      .map(function(k){ return k + ': <b>' + statusCounts[k] + '</b>'; }).join(' | ');
    
    log.innerHTML = '<div style="padding:12px;background:var(--donation-soft);border-radius:12px;color:#166534">' +
      '<div style="font-weight:800;margin-bottom:6px">📊 النتيجة</div>' +
      '<div>➕ أُضيف: <b>' + added + '</b> | ✏️ حُدّث: <b>' + updated + '</b> | ⏭️ تُخطّي: <b>' + skip + '</b></div></div>' +
      '<div style="padding:12px;background:var(--info-soft);border-radius:12px;color:#1e40af;margin-top:10px;font-size:11px">' +
      '<div><b>نوع الاشتراك:</b> ✅ ' + tc.both + ' كليهما • 💰 ' + tc.assoc + ' جمعية • ⚰️ ' + tc.death + ' وفاة • ⚪ ' + tc.none + ' غير مشترك</div>' +
      '<div style="margin-top:6px"><b>حالات:</b> ' + statusHTML + '</div></div>';
    
    toast('✅ أُضيف ' + added + ' | حُدّث ' + updated, 'success', 4000);
    CACHE.invalidateAll();
    await loadAll();
    go(S.page);
  } catch(e){
    log.innerHTML = '<div style="color:var(--danger)">❌ ' + esc(e.message) + '</div>';
  }
  showLoad(false);
}

/* استيراد الدفعات */
async function importPayments(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';
  
  showLoad(true);
  const log = $('importPayLog');
  log.innerHTML = '<div style="color:var(--muted)">⏳</div>';
  
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });
    
    const memberMap = new Map();
    S.members.forEach(function(m){
      if(m.code) memberMap.set(String(m.code), m);
      if(m.name) memberMap.set(normAr(m.name), m);
    });
    
    let added = 0, skip = 0, notFound = 0, dup = 0;
    const notFoundNames = [];
    
    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const memberName = cleanText(gv(r, 'اسم المشترك','اسم العضو','العضو','المشترك','الاسم','كود العضو'));
      if(!memberName){ skip++; continue; }
      
      const amountStr = String(gv(r, 'المبلغ','القيمة','Amount') || '').replace(/[,،\s]/g,'');
      const amount = Number(amountStr);
      if(!amount){ skip++; continue; }
      
      let member = memberMap.get(memberName) || memberMap.get(normAr(memberName));
      if(!member){
        const s = normAr(memberName);
        member = S.members.find(function(m){
          const n = normAr(m.name);
          return n === s || n.indexOf(s) > -1 || s.indexOf(n) > -1;
        });
      }
      if(!member){ notFound++; notFoundNames.push(memberName); skip++; continue; }
      
      const typeStr = normAr(gv(r, 'نوع القسط','النوع','نوع الدفعة','الصندوق') || '');
      let fund = 'assoc';
      if(/وفا/.test(typeStr)) fund = 'death';
      else if(/تبرع|صدقه/.test(typeStr)) fund = 'donation';
      
      const date = toDate(gv(r, 'التاريخ','تاريخ')) || today();
      const yearStr = String(gv(r, 'السنة','سنة','سنة الدفعة','العام') || '').replace(/[^\d]/g,'');
      const forYear = Number(yearStr) || (date ? new Date(date).getFullYear() : S.currentYear);
      
      const collectorName = cleanText(gv(r, 'اسم المعتمد','المعتمد','المحصل','الجباة')) || 'استيراد سابق';
      
      const isDup = S.payments.some(function(p){
        return p.memberId === member.id && Number(p.amount) === amount && p.date === date &&
          Number(p.forYear || p.year) === forYear && p.fund === fund;
      });
      if(isDup){ dup++; skip++; continue; }
      
      try {
        const payment = {
          memberId: member.id,
          fund: fund, amount: amount, date: date,
          year: forYear, forYear: forYear,
          notes: cleanText(gv(r, 'ملاحظات')),
          collectorId: null,
          collectorName: collectorName,
          imported: true,
          createdAt: new Date().toISOString()
        };
        const newId = await dbPut('payments', payment);
        payment.id = newId;
        S.payments.push(payment);
        added++;
      } catch(e){ skip++; }
    }
    
    const notFoundHTML = notFoundNames.length
      ? '<div style="margin-top:8px;padding:8px;background:var(--death-light);border-radius:8px;color:#991b1b;font-size:11px;max-height:120px;overflow:auto"><b>أول 10 أسماء غير موجودة:</b><br>' + notFoundNames.slice(0,10).map(function(n){ return '• ' + esc(n); }).join('<br>') + '</div>'
      : '';
    
    log.innerHTML = '<div style="padding:12px;background:var(--donation-soft);border-radius:12px;color:#166534">' +
      '<div>➕ أُضيفت: <b>' + added + '</b></div>' +
      '<div style="color:#92400e">🔁 مكرر: <b>' + dup + '</b></div>' +
      '<div>⏭️ تُخطّي: <b>' + skip + '</b></div>' +
      '<div style="color:#b91c1c">❓ غير موجود: <b>' + notFound + '</b></div>' + notFoundHTML + '</div>';
    
    toast('✅ أُضيفت ' + added + ' دفعة', 'success', 4000);
    CACHE.invalidateAll();
    await loadAll();
    go(S.page);
  } catch(e){
    log.innerHTML = '<div style="color:var(--danger)">❌ ' + esc(e.message) + '</div>';
  }
  showLoad(false);
}

/* استيراد وارد/صادر */
async function cleanImportedMovements(){
  if(!confirm('⚠️ حذف كل الحركات المالية المستوردة؟')) return;
  if(!confirm('تأكيد أخير!')) return;
  
  showLoad(true);
  try {
    let incDel = 0, expDel = 0;
    const toDelInc = S.incomes.filter(function(i){ return i.imported === true; });
    for(const inc of toDelInc){ await dbDel('incomes', inc.id); incDel++; }
    const toDelExp = S.expenses.filter(function(e){ return e.imported === true; });
    for(const exp of toDelExp){ await dbDel('expenses', exp.id); expDel++; }
    
    S.incomes = S.incomes.filter(function(i){ return i.imported !== true; });
    S.expenses = S.expenses.filter(function(e){ return e.imported !== true; });
    CACHE.invalidateAll();
    
    toast('🗑️ حُذف: ' + incDel + ' إيراد + ' + expDel + ' مصروف', 'success', 4000);
    showLoad(false);
    closeSheetAll();
    go(S.page);
  } catch(e){
    showLoad(false);
    toast('خطأ: ' + e.message, 'error');
  }
}

async function importFinance(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';
  
  showLoad(true);
  const log = $('importFinLog');
  log.innerHTML = '<div style="color:var(--muted)">⏳</div>';
  
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });
    
    let incAdded = 0, expAdded = 0, skip = 0, compUpdated = 0, compNF = 0, dup = 0;
    const notFoundComps = [];
    
    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      
      const typeStr = cleanText(gv(r, 'النوع','نوع الحركة','نوع') || '');
      const typeN = normAr(typeStr);
      const isIncome = /وارد|ايراد|إيراد|دخل/.test(typeN);
      const isExpense = /صادر|مصروف|صرف/.test(typeN);
      if(!isIncome && !isExpense){ skip++; continue; }
      
      const amountStr = String(gv(r, 'المبلغ','القيمة','Amount') || '').replace(/[,،\s]/g,'');
      const amount = Number(amountStr);
      if(!amount){ skip++; continue; }
      
      const fundStr = cleanText(gv(r, 'نوع الصندوق','نوع_الصندوق','الصندوق','صندوق') || '');
      const fundN = normAr(fundStr);
      let fund = 'assoc';
      if(/تبرع/.test(fundN)) fund = 'donation';
      else if(/وفا/.test(fundN)) fund = 'death';
      else if(/جمعي/.test(fundN)) fund = 'assoc';
      
      const category = cleanText(gv(r, 'التصنيف','الفئة') || '');
      const categoryN = normAr(category);
      const description = cleanText(gv(r, 'البيان','الوصف','التفاصيل','المصدر') || '');
      const party = cleanText(gv(r, 'الطرف','الجهة','المستفيد') || '');
      const date = toDate(gv(r, 'التاريخ','تاريخ')) || today();
      const yearStr = String(gv(r, 'العام','السنة','سنة') || '').replace(/[^\d]/g,'');
      const year = Number(yearStr) || (date ? new Date(date).getFullYear() : S.currentYear);
      
      // التعويضات
      if(isExpense && /تعويض/.test(categoryN)){
        let rawName = description;
        if(!rawName || /^تعويض\s*وفا?ة?\s*[:\-–—\.•]*\s*$/i.test(rawName.trim())){
          rawName = party;
        }
        const cleanName = rawName.replace(/^تعويض\s*وفا?ة?\s*[\:\-–—\.•]*\s*/i,'').replace(/\(.*?\)/g,'').replace(/[\:\-–—\.•]\s*$/,'').trim();
        
        let matched = S.deaths.find(function(d){ return normAr(d.deceasedName) === normAr(cleanName); });
        if(!matched){
          matched = S.deaths.find(function(d){
            const n1 = normAr(d.deceasedName);
            const n2 = normAr(cleanName);
            return n1.indexOf(n2) > -1 || n2.indexOf(n1) > -1;
          });
        }
        
        if(matched){
          if(!matched.manualEdit){
            matched.compensation = amount;
            matched.updatedFromFinance = true;
            await dbPut('deaths', matched);
            compUpdated++;
          }
        } else {
          compNF++;
          notFoundComps.push(description || party);
        }
        continue;
      }
      
      const isDup = isIncome
        ? S.incomes.some(function(inc){ return inc.fund === fund && Number(inc.amount) === amount && inc.date === date; })
        : S.expenses.some(function(ex){ return ex.fund === fund && Number(ex.amount) === amount && ex.date === date; });
      if(isDup){ dup++; skip++; continue; }
      
      try {
        if(isIncome){
          const obj = {

/* استيراد التسليمات */
async function importDeliveries(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';
  
  showLoad(true);
  const log = $('importDelivLog');
  log.innerHTML = '<div style="color:var(--muted)">⏳</div>';
  
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });
    
    let added = 0, skip = 0, dup = 0;
    
    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const collectorName = cleanText(gv(r, 'اسم المعتمد','المعتمد','من','من المعتمد','المحصل'));
      const amountStr = String(gv(r, 'المبلغ المراد تسليمه','المبلغ','القيمة') || '').replace(/[,،\s]/g,'');
      const amount = Number(amountStr);
      
      if(!collectorName || !amount){ skip++; continue; }
      
      const date = toDate(gv(r, 'التاريخ','تاريخ')) || today();
      const typeStr = normAr(gv(r, 'نوع القسط','النوع','الصندوق') || '');
      let fund = 'assoc';
      if(/وفا/.test(typeStr)) fund = 'death';
      
      const isDup = S.deliveries.some(function(d){
        return normAr(d.fromUserName) === normAr(collectorName) &&
          Number(d.amount) === amount && d.date === date;
      });
      if(isDup){ dup++; skip++; continue; }
      
      try {
        const delivery = {
          fromUserId: null,
          fromUserName: collectorName,
          toUserId: null,
          toUserName: 'أمين (استيراد)',
          fund: fund, amount: amount,
          notes: 'حركة: ' + (cleanText(gv(r, 'رقم الحركة','ID','المعرف')) || '') + ' • ' + (cleanText(gv(r, 'الحالة','حالة')) || ''),
          date: date,
          imported: true,
          createdAt: new Date().toISOString()
        };
        const newId = await dbPut('deliveries', delivery);
        delivery.id = newId;
        S.deliveries.push(delivery);
        added++;
      } catch(e){ skip++; }
    }
    
    log.innerHTML = '<div style="padding:12px;background:var(--donation-soft);border-radius:12px;color:#166534">' +
      '<div>➕ أُضيفت: <b>' + added + '</b></div>' +
      '<div style="color:#92400e">🔁 مكرر: <b>' + dup + '</b></div>' +
      '<div>⏭️ تُخطّي: <b>' + skip + '</b></div></div>';
    
    toast('✅ أُضيفت ' + added + ' تسليمة', 'success', 4000);
    CACHE.invalidateAll();
    await loadAll();
    go(S.page);
  } catch(e){
    log.innerHTML = '<div style="color:var(--danger)">❌ ' + esc(e.message) + '</div>';
  }
  showLoad(false);
}

function gv(row, ...aliases){
  if(!row) return '';
  const normalized = {};
  for(const k of Object.keys(row)){
    normalized[normAr(k).replace(/[^\u0621-\u064Aa-z0-9]/g, '')] = row[k];
  }
  for(const a of aliases){
    const key = normAr(a).replace(/[^\u0621-\u064Aa-z0-9]/g, '');
    if(key in normalized){
      const v = normalized[key];
      if(v === null || v === undefined) continue;
      const s = String(v).trim();
      if(!s || s.indexOf('=') === 0 || s.indexOf('openpyxl') > -1) continue;
      return s;
    }
  }
  return '';
}

async function importBackup(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';
  
  const text = await file.text();
  try {
    const data = JSON.parse(text);
    if(!data.members && !data.users) throw new Error('ملف غير صالح');
    if(!confirm('⚠️ سيتم استبدال كل البيانات. متابعة؟')) return;
    if(!confirm('تأكيد أخير!')) return;
    
    for(const s of STORE_NAMES){
      const store = tx(s, 'readwrite');
      await new Promise(function(res){ const q = store.clear(); q.onsuccess = res; q.onerror = res; });
    }
    
    const toRestore = ['members','payments','deaths','incomes','expenses','deliveries','storeItems','storeMovements','meetings','constants','users','customFields'];
    for(const key of toRestore){
      if(Array.isArray(data[key])){
        for(const item of data[key]){
          delete item.id;
          await dbPut(key, item);
        }
      }
    }
    
    await loadAll();
    CACHE.invalidateAll();
    toast('✅ تمت الاستعادة', 'success', 3000);
    closeSheetAll();
    setTimeout(function(){ location.reload(); }, 500);
  } catch(e){
    toast('خطأ: ' + e.message, 'error');
  }
}

/* ⭐ بناء بيانات التقرير */
function buildPaymentsReportData(){
  const f = window._payReportFilters;
  const y = f.year;
  
  /* اجمع مدفوعات كل عضو — مع تجميع حسب المحصّل */
  const memberPayments = {};
  
  S.payments.forEach(function(p){
    const py = Number(p.forYear) || Number(p.year);
    if(py !== y) return;
    if(f.fund !== 'all' && p.fund !== f.fund) return;
    if(!p.memberId) return;
    
    if(!memberPayments[p.memberId]){
      memberPayments[p.memberId] = {
        memberId: p.memberId,
        total: 0,
        count: 0,
        byFund: { assoc: 0, death: 0, donation: 0 },
        byCollector: {}
      };
    }
    
    const amount = Number(p.amount) || 0;
    memberPayments[p.memberId].total += amount;
    memberPayments[p.memberId].count++;
    memberPayments[p.memberId].byFund[p.fund] += amount;
    
    /* تجميع حسب المحصّل */
    const cKey = p.collectorName || 'غير محدد';
    if(!memberPayments[p.memberId].byCollector[cKey]){
      memberPayments[p.memberId].byCollector[cKey] = 0;
    }
    memberPayments[p.memberId].byCollector[cKey] += amount;
  });
  
  /* كل الأعضاء (بدون منسحب/متوقف/متوفى) */
  let allMembers = S.members.filter(function(m){
    const st = m.memberStatus || 'نشط';
    if(st === 'متوفى' || st === 'منسحب' || st === 'متوقف') return false;
    if(f.fund === 'assoc') return m.assocStartYear;
    if(f.fund === 'death') return m.deathStartYear;
    return m.assocStartYear || m.deathStartYear;
  });
  
  let list = allMembers.map(function(m){
    const p = memberPayments[m.id];
    return {
      member: m,
      total: p ? p.total : 0,
      count: p ? p.count : 0,
      byFund: p ? p.byFund : { assoc: 0, death: 0, donation: 0 },
      byCollector: p ? p.byCollector : {}
    };
  });
  
  /* فلترة حسب النمط */
  if(f.mode === 'paid') list = list.filter(function(x){ return x.total > 0; });
  else if(f.mode === 'unpaid') list = list.filter(function(x){ return x.total === 0; });
  
  /* البحث */
  if(f.search){
    const s = normAr(f.search);
    list = list.filter(function(x){
      return normAr(x.member.name + ' ' + (x.member.code || '')).indexOf(s) > -1;
    });
  }
  
  /* ترتيب */
  list.sort(function(a, b){ return b.total - a.total; });
  
  return list;
}

/* ⭐ عرض الجدول */
function renderPaymentsTableContent(){
  const container = $('payReportContent');
  if(!container) return;
  
  const f = window._payReportFilters;
  const y = f.year;
  const list = buildPaymentsReportData();
  
  const totalSum = list.reduce(function(s, x){ return s + x.total; }, 0);
  const paidCount = list.filter(function(x){ return x.total > 0; }).length;
  const unpaidCount = list.filter(function(x){ return x.total === 0; }).length;
  
  let html = '';
  
  /* الملخص */
  html += '<div style="padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:14px;margin-bottom:12px;text-align:center">';
  html += '<div style="font-size:11px;opacity:.85;font-weight:700">إجمالي المدفوعات — ' + y + '</div>';
  html += '<div style="font-size:28px;font-weight:800;font-family:\'SF Mono\',monospace;margin-top:4px">' + fmtNum(totalSum) + '</div>';
  html += '<div style="display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:11px">';
  html += '<span>✅ ' + paidCount + ' دفعوا</span>';
  if(unpaidCount > 0) html += '<span>⏳ ' + unpaidCount + ' لم يدفعوا</span>';
  html += '<span>📊 ' + list.length + ' إجمالي</span>';
  html += '</div></div>';
  
  if(!list.length){
    container.innerHTML = html + '<div class="empty"><span class="ico">📋</span><h3>لا توجد بيانات</h3></div>';
    return;
  }
  
  /* الجدول */
  html += '<div style="background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border)">';
  
  /* Header */
  html += '<div style="display:grid;grid-template-columns:36px 1fr 90px;gap:6px;padding:10px 12px;background:var(--primary-soft);font-weight:800;color:var(--primary);font-size:11px;border-bottom:1px solid var(--border)">';
  html += '<div>#</div>';
  html += '<div>العضو</div>';
  html += '<div style="text-align:left">المدفوع</div>';
  html += '</div>';
  
  /* Rows */
  list.forEach(function(x, i){
    const m = x.member;
    
    /* تفصيل الصناديق */
    const fundParts = [];
    if(f.fund === 'all'){
      if(x.byFund.assoc > 0) fundParts.push('💰 ' + fmtShort(x.byFund.assoc));
      if(x.byFund.death > 0) fundParts.push('⚰️ ' + fmtShort(x.byFund.death));
      if(x.byFund.donation > 0) fundParts.push('💚 ' + fmtShort(x.byFund.donation));
    }
    
    /* تفصيل المحصّلين (مجمّع) */
    const collectorParts = [];
    Object.keys(x.byCollector).sort(function(a, b){
      return x.byCollector[b] - x.byCollector[a];
    }).forEach(function(k){
      collectorParts.push(k + ': ' + fmtShort(x.byCollector[k]));
    });
    
    html += '<div onclick="openMemberDetail(' + m.id + ')" style="padding:11px 12px;border-bottom:1px solid var(--border-2);cursor:pointer;background:' + (x.total === 0 ? 'var(--warning-soft)' : 'var(--card)') + '">';
    html += '<div style="display:grid;grid-template-columns:36px 1fr 90px;gap:6px;align-items:center">';
    
    html += '<div style="font-weight:800;color:var(--muted-2);font-size:12px">' + (i + 1) + '</div>';
    
    html += '<div style="min-width:0">';
    html += '<div style="font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.name) + '</div>';
    html += '<div style="font-size:9px;color:var(--muted-2);font-family:\'SF Mono\',monospace;margin-top:2px">' + esc(m.code || '—') + ' • ' + esc(m.sector || '—') + '</div>';
    
    if(fundParts.length){
      html += '<div style="font-size:10px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap">';
      if(x.byFund.assoc > 0) html += '<span>💰 ' + fmtNum(x.byFund.assoc) + '</span>';
      if(x.byFund.death > 0) html += '<span>⚰️ ' + fmtNum(x.byFund.death) + '</span>';
      if(x.byFund.donation > 0) html += '<span>💚 ' + fmtNum(x.byFund.donation) + '</span>';
      html += '</div>';
    }
    
    if(collectorParts.length){
      html += '<div style="font-size:9.5px;color:var(--primary);margin-top:4px;line-height:1.5;background:var(--primary-soft);padding:4px 8px;border-radius:6px;display:inline-block">👤 ' + collectorParts.join('  •  ') + '</div>';
    }
    
    html += '</div>';
    
    html += '<div style="text-align:left">';
    if(x.total > 0){
      html += '<div style="font-weight:800;color:var(--success);font-family:\'SF Mono\',monospace;font-size:13px">' + fmtNum(x.total) + '</div>';
      html += '<div style="font-size:9px;color:var(--muted-2);margin-top:2px">' + x.count + ' دفعة</div>';
    } else {
      html += '<div style="font-weight:800;color:var(--warning);font-size:11px">⏳</div>';
    }
    html += '</div>';
    
    html += '</div></div>';
  });
  
  html += '</div>';
  
  container.innerHTML = html;
}

/* ⭐ مشاركة واتساب */
function sharePaymentsTableWA(){
  const f = window._payReportFilters;
  const y = f.year;
  const list = buildPaymentsReportData();
  
  if(!list.length){ toast('لا توجد بيانات', 'warning'); return; }
  
  const totalSum = list.reduce(function(s, x){ return s + x.total; }, 0);
  const paidCount = list.filter(function(x){ return x.total > 0; }).length;
  const unpaidCount = list.filter(function(x){ return x.total === 0; }).length;
  const fundLabel = f.fund === 'all' ? 'الكل' : f.fund === 'assoc' ? 'الجمعية' : f.fund === 'death' ? 'الوفاة' : 'التبرعات';
  
  let txt = '📋 *تقرير المدفوعات — ' + y + '*\n';
  txt += '📦 الصندوق: ' + fundLabel + '\n';
  txt += '━━━━━━━━━━━━━━━\n\n';
  txt += '💰 *الإجمالي: ' + fmtNum(totalSum) + ' ل.س*\n';
  txt += '✅ دفعوا: ' + paidCount + '\n';
  if(unpaidCount > 0) txt += '⏳ لم يدفعوا: ' + unpaidCount + '\n';
  txt += '\n━━━━━━━━━━━━━━━\n';
  txt += '*تفاصيل الأعضاء:*\n\n';
  
  /* أول 25 عضو */
  list.slice(0, 25).forEach(function(x, i){
    txt += (i + 1) + '. *' + x.member.name + '*';
    if(x.member.sector) txt += ' (' + x.member.sector + ')';
    txt += '\n';
    if(x.total > 0){
      txt += '   💰 ' + fmtNum(x.total) + ' ل.س • ' + x.count + ' دفعة\n';
      
      /* تفصيل المحصّلين المجمّع */
      const collectorParts = [];
      Object.keys(x.byCollector).forEach(function(k){
        collectorParts.push(k + ': ' + fmtNum(x.byCollector[k]));
      });
      if(collectorParts.length > 0){
        txt += '   👤 ' + collectorParts.join(' | ') + '\n';
      }
    } else {
      txt += '   ⏳ لم يدفع\n';
    }
    txt += '\n';
  });
  
  if(list.length > 25){
    txt += '_... + ' + (list.length - 25) + ' عضو آخر_\n\n';
  }
  
  txt += '_صندوق زعورة_';
  
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
}

/* ⭐ طباعة PDF */
function printPaymentsTable(){
  const f = window._payReportFilters;
  const y = f.year;
  const list = buildPaymentsReportData();
  
  if(!list.length){ toast('لا توجد بيانات', 'warning'); return; }
  
  const totalSum = list.reduce(function(s, x){ return s + x.total; }, 0);
  const paidCount = list.filter(function(x){ return x.total > 0; }).length;
  const unpaidCount = list.filter(function(x){ return x.total === 0; }).length;
  const fundLabel = f.fund === 'all' ? 'الكل' : f.fund === 'assoc' ? 'الجمعية' : f.fund === 'death' ? 'الوفاة' : 'التبرعات';
  
  let rowsHtml = '';
  list.forEach(function(x, i){
    const fundParts = [];
    if(f.fund === 'all'){
      if(x.byFund.assoc > 0) fundParts.push('💰 ' + fmtNum(x.byFund.assoc));
      if(x.byFund.death > 0) fundParts.push('⚰️ ' + fmtNum(x.byFund.death));
      if(x.byFund.donation > 0) fundParts.push('💚 ' + fmtNum(x.byFund.donation));
    }
    
    const collectorParts = [];
    Object.keys(x.byCollector).forEach(function(k){
      collectorParts.push(k + ': ' + fmtNum(x.byCollector[k]));
    });
    
    rowsHtml += '<tr>';
    rowsHtml += '<td style="text-align:center;font-weight:700">' + (i + 1) + '</td>';
    rowsHtml += '<td><b>' + esc(x.member.name) + '</b><br><small style="color:#666">' + esc(x.member.code || '') + ' • ' + esc(x.member.sector || '') + '</small>';
    if(fundParts.length) rowsHtml += '<br><small>' + fundParts.join(' • ') + '</small>';
    if(collectorParts.length) rowsHtml += '<br><small style="color:#7c3aed">👤 ' + collectorParts.join(' • ') + '</small>';
    rowsHtml += '</td>';
    rowsHtml += '<td style="text-align:left;font-weight:800;color:' + (x.total > 0 ? '#16a34a' : '#f59e0b') + '">';
    if(x.total > 0) rowsHtml += fmtNum(x.total) + '<br><small>' + x.count + ' دفعة</small>';
    else rowsHtml += '⏳ لم يدفع';
    rowsHtml += '</td></tr>';
  });
  
  const html = '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>تقرير المدفوعات ' + y + '</title>' +
    '<style>' +
    '@page{size:A4;margin:15mm}' +
    'body{font-family:system-ui,Tahoma;direction:rtl;padding:15px;color:#1e293b;font-size:12px}' +
    'h1{font-size:20px;color:#6d28d9;text-align:center;margin:0}' +
    '.subtitle{text-align:center;color:#64748b;font-size:12px;margin:6px 0 20px}' +
    '.summary{background:#f5f3ff;padding:16px;border-radius:10px;margin-bottom:20px;text-align:center}' +
    '.summary .total{font-size:26px;font-weight:800;color:#16a34a;font-family:monospace;margin:6px 0}' +
    '.summary .stats{display:flex;justify-content:center;gap:20px;font-size:11px;color:#64748b;margin-top:8px}' +
    'table{width:100%;border-collapse:collapse;font-size:11px}' +
    'th{background:#6d28d9;color:#fff;padding:10px 8px;text-align:right;font-size:11px}' +
    'th:first-child{text-align:center;width:40px}' +
    'th:last-child{text-align:left;width:110px}' +
    'td{padding:9px 8px;border-bottom:1px solid #e2e8f0;vertical-align:top}' +
    'tr:nth-child(even){background:#f8fafc}' +
    '.footer{text-align:center;margin-top:30px;padding-top:14px;border-top:2px solid #e2e8f0;font-size:10px;color:#94a3b8}' +
    '</style></head><body>' +
    
    '<h1>📋 تقرير المدفوعات المجمّع</h1>' +
    '<div class="subtitle">🏘️ صندوق زعورة — سنة ' + y + ' • الصندوق: ' + fundLabel + '</div>' +
    
    '<div class="summary">' +
    '<div style="font-size:11px;color:#64748b">إجمالي المدفوعات</div>' +
    '<div class="total">' + fmtNum(totalSum) + ' ل.س</div>' +
    '<div class="stats"><span>✅ ' + paidCount + ' دفعوا</span>' +
    (unpaidCount > 0 ? '<span>⏳ ' + unpaidCount + ' لم يدفعوا</span>' : '') +
    '<span>📊 ' + list.length + ' إجمالي</span></div>' +
    '</div>' +
    
    '<table>' +
    '<thead><tr><th>#</th><th>العضو — تفصيل</th><th>المبلغ المدفوع</th></tr></thead>' +
    '<tbody>' + rowsHtml + '</tbody>' +
    '</table>' +
    
    '<div class="footer">صندوق زعورة — قرية زعورة<br>تقرير بتاريخ ' + new Date().toLocaleDateString('ar-EG') + '</div>' +
    '<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script>' +
    '</body></html>';
  
  const w = window.open('', '_blank');
  if(w){ w.document.write(html); w.document.close(); }
}
