<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>صندوق زعورة</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#7c3aed;--primary-2:#6d28d9;--primary-soft:#f5f3ff;--primary-dark:#4c1d95;
  --assoc:#2563eb;--assoc-soft:#dbeafe;
  --death:#dc2626;--death-soft:#fee2e2;
  --donation:#16a34a;--donation-soft:#dcfce7;
  --success:#16a34a;--danger:#dc2626;--warning:#f59e0b;--info:#2563eb;--muted:#64748b;
  --bg:#f8fafc;--card:#ffffff;--text:#0f172a;--border:#e2e8f0;
  --radius:16px;--shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow:0 8px 24px rgba(15,23,42,.08);--shadow-lg:0 20px 60px rgba(15,23,42,.2);
  --safe:env(safe-area-inset-bottom,0);
}
[data-theme="dark"]{
  --bg:#0b1220;--card:#1e293b;--text:#e2e8f0;--border:#334155;
  --primary-soft:#2e1065;--assoc-soft:#1e3a8a;--death-soft:#7f1d1d;--donation-soft:#14532d;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;background:var(--bg);color:var(--text);direction:rtl;font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:calc(78px + var(--safe));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{outline:0}

.app-header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0));display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(124,58,237,.3)}
.app-header .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.app-header .logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.app-header .brand-text{flex:1;min-width:0}
.app-header h1{font-size:16px;font-weight:800;line-height:1.1}
.app-header .sub{font-size:10px;opacity:.85;font-weight:600;margin-top:2px}
.app-header .icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.15s;flex-shrink:0}
.app-header .icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.25)}

.user-banner{background:var(--card);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;position:sticky;top:60px;z-index:29}
.user-banner .who{display:flex;align-items:center;gap:8px;color:var(--muted)}
.user-banner .who b{color:var(--text)}
.role-badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;background:var(--primary-soft);color:var(--primary)}

.search-wrap{padding:10px 12px 0;max-width:900px;margin:0 auto}
.search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow-sm)}
.search-box .ico{color:var(--muted);font-size:17px}
.search-box input{flex:1;background:none;border:0;font-size:15px;min-width:0}
.search-box .clear{color:var(--muted);font-size:18px;padding:4px}

main{max-width:900px;margin:0 auto;padding:12px}
.page{display:none;animation:fade .2s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-head h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}

.stats-scroll{display:flex;gap:10px;overflow-x:auto;margin:0 -12px 14px;padding:0 12px 6px;scrollbar-width:none}
.stats-scroll::-webkit-scrollbar{display:none}
.stat{flex:0 0 auto;min-width:130px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--primary)}
.stat.assoc::before{background:var(--assoc)}.stat.death::before{background:var(--death)}
.stat.donation::before{background:var(--donation)}.stat.green::before{background:var(--success)}
.stat.red::before{background:var(--danger)}.stat.orange::before{background:var(--warning)}
.stat.blue::before{background:var(--info)}
.stat .val{font-size:22px;font-weight:800;line-height:1.1;color:var(--primary);word-break:break-all}
.stat.assoc .val{color:var(--assoc)}.stat.death .val{color:var(--death)}
.stat.donation .val{color:var(--donation)}.stat.green .val{color:var(--success)}
.stat.red .val{color:var(--danger)}.stat.orange .val{color:var(--warning)}.stat.blue .val{color:var(--info)}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600}

.list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s;min-height:64px}
.item:last-child{border-bottom:0}
.item:active{background:var(--bg)}
.item .av{width:46px;height:46px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--primary-soft);color:var(--primary);font-weight:800;overflow:hidden}
.item .av.blue{background:var(--assoc-soft);color:var(--assoc)}
.item .av.red{background:var(--death-soft);color:var(--death)}
.item .av.green{background:var(--donation-soft);color:var(--donation)}
.item .av.orange{background:#fef3c7;color:#92400e}
.item .av.gray{background:#f1f5f9;color:#475569}
.item .body{flex:1;min-width:0}
.item .ttl{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .sub{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .trail{color:var(--muted);font-size:20px;font-weight:300;flex-shrink:0}

.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap}
.badge.success{background:#dcfce7;color:#166534}.badge.danger{background:#fee2e2;color:#991b1b}
.badge.warning{background:#fef3c7;color:#92400e}.badge.info{background:#dbeafe;color:#1e40af}
.badge.muted{background:#f1f5f9;color:#475569}.badge.primary{background:var(--primary-soft);color:var(--primary)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--muted);transition:.15s}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:13px;font-size:14px;font-weight:700;transition:.15s;min-height:44px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff}.btn.assoc{background:var(--assoc);color:#fff}
.btn.death{background:var(--death);color:#fff}.btn.donation{background:var(--donation);color:#fff}
.btn.success{background:var(--success);color:#fff}.btn.danger{background:var(--danger);color:#fff}
.btn.warning{background:var(--warning);color:#fff}.btn.info{background:var(--info);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:12px;border-radius:10px}
.btn.block{display:flex;width:100%}

.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border-radius:14px;background:var(--card);border:2px solid var(--border);cursor:pointer;transition:.15s;text-align:center}
.quick-btn:active{transform:scale(.97);border-color:var(--primary)}
.quick-btn .ico{font-size:28px;line-height:1}
.quick-btn .lbl{font-size:12px;font-weight:800;color:var(--text)}
.quick-btn.assoc{border-color:var(--assoc)}.quick-btn.assoc .lbl{color:var(--assoc)}
.quick-btn.death{border-color:var(--death)}.quick-btn.death .lbl{color:var(--death)}
.quick-btn.donation{border-color:var(--donation)}.quick-btn.donation .lbl{color:var(--donation)}

.fab{position:fixed;bottom:calc(88px + var(--safe));left:18px;width:60px;height:60px;border-radius:20px;background:var(--primary);color:#fff;font-size:28px;font-weight:300;box-shadow:0 12px 32px rgba(124,58,237,.5);z-index:25;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.92)}

.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe));box-shadow:0 -4px 20px rgba(15,23,42,.05)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:10px;font-weight:700;transition:.15s;position:relative;min-width:0}
.bnav button .i{font-size:22px;line-height:1;transition:.15s}
.bnav button.on{color:var(--primary)}
.bnav button.on .i{transform:scale(1.1)}

.sheet-back{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:10100;opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(3px)}
.sheet-back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:10101;background:var(--card);border-radius:24px 24px 0 0;max-height:94vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(16px + var(--safe));box-shadow:0 -20px 60px rgba(15,23,42,.2)}
.sheet.on{transform:translateY(0)}
.sheet.wide{max-height:98vh}
.sheet-grip{width:44px;height:5px;background:var(--border);border-radius:3px;margin:12px auto 0}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2;border-radius:24px 24px 0 0}
.sheet-hd h2{font-size:16px;font-weight:800}
.sheet-bd{padding:16px 18px}
.sheet-ft{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
.sheet-ft .btn{flex:1;min-width:90px}

.fld{margin-bottom:14px;position:relative}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld label .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{width:100%;padding:12px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;font-size:15px;transition:.15s;font-family:inherit}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--primary);background:var(--card);box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.fld textarea{resize:vertical;min-height:70px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld-hint{font-size:11px;color:var(--muted);margin-top:4px}
.fld-readonly{background:var(--primary-soft)!important;color:var(--primary);font-weight:700}

.options-list{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1.5px solid var(--primary);border-radius:12px;max-height:250px;overflow-y:auto;z-index:100;box-shadow:var(--shadow);margin-top:4px;display:none}
.options-list.on{display:block}
.option-item{padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--border);font-size:14px}
.option-item:hover,.option-item:active{background:var(--primary-soft)}
.option-item:last-child{border-bottom:0}
.option-item small{color:var(--muted);font-size:11px;flex-shrink:0}

.amount-input{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--primary);border-radius:14px;padding:8px 16px}
.amount-input input{flex:1;border:0;background:none;font-size:26px;font-weight:800;color:var(--primary);text-align:center;padding:8px 0}
.amount-input .currency{font-size:14px;font-weight:800;color:var(--muted)}
.amount-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.amount-quick button{padding:6px 12px;border-radius:10px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700}
.amount-quick button:active{transform:scale(.95)}

.balance-block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.balance-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
.balance-row:last-child{border-bottom:0}
.balance-row .lbl{color:var(--muted)}
.balance-row .val{font-weight:800}
.balance-row .val.green{color:var(--success)}
.balance-row .val.red{color:var(--danger)}
.balance-row .val.orange{color:var(--warning)}

.progress{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:8px}
.progress > div{height:100%;border-radius:5px;transition:width .4s ease}
.progress.assoc > div{background:var(--assoc)}
.progress.death > div{background:var(--death)}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ico{font-size:52px;opacity:.4;display:block;margin-bottom:10px}
.empty h3{font-size:15px;font-weight:700;margin-bottom:4px;color:var(--text)}
.empty p{font-size:12px}

.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10200;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 28px);max-width:400px}
.toast{background:var(--text);color:var(--card);padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);animation:slideDown .25s ease;pointer-events:auto}
.toast.success{background:var(--success);color:#fff}.toast.error{background:var(--danger);color:#fff}
.toast.warning{background:var(--warning);color:#fff}.toast.info{background:var(--info);color:#fff}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

.loader{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(3px);z-index:10300;display:none;align-items:center;justify-content:center}
.loader.on{display:flex}
.spin{width:42px;height:42px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.login-screen{position:fixed;inset:0;z-index:10000;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.login-screen.on{display:flex}
.login-card{background:var(--card);color:var(--text);border-radius:24px;padding:28px 24px;max-width:400px;width:100%;box-shadow:var(--shadow-lg);margin:auto}
.login-card .logo-lg{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;margin:0 auto 16px}
.login-card h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:4px}
.login-card .sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:24px}
.users-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto}
.login-user{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--bg);border:2px solid transparent;cursor:pointer;transition:.15s}
.login-user:active{transform:scale(.98);border-color:var(--primary);background:var(--primary-soft)}
.login-user .av{width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0}
.login-user .info{flex:1;min-width:0}
.login-user .nm{font-weight:700;font-size:14px}
.login-user .role{font-size:11px;color:var(--muted);margin-top:2px}

.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.pin-btn{padding:16px;border-radius:14px;background:var(--bg);font-size:20px;font-weight:800;transition:.15s}
.pin-btn:active{transform:scale(.95);background:var(--primary-soft)}
.pin-display{display:flex;justify-content:center;gap:10px;margin:20px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--border);transition:.2s}
.pin-dot.on{background:var(--primary);transform:scale(1.2)}

@media print{.app-header,.bnav,.fab,.search-wrap,.user-banner{display:none!important}main{padding:0;max-width:100%}body{background:#fff;padding-bottom:0}}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="logo-lg">🏘️</div>
    <h1>صندوق زعورة</h1>
    <div class="sub">نظام إدارة الاشتراكات والتكافل</div>
    <div id="loginUsers">
      <div class="users-list" id="loginUsersList"></div>
      <button class="btn ghost block" style="margin-top:14px" onclick="showAddFirstAdmin()">⚙️ إعداد أول مرة (إضافة مدير)</button>
    </div>
    <div id="loginPin" style="display:none">
      <div style="text-align:center;margin-bottom:12px">
        <div style="font-size:44px" id="pinAvatar">👤</div>
        <div style="font-weight:800;font-size:16px;margin-top:6px" id="pinName">—</div>
        <div style="font-size:11px;color:var(--muted)" id="pinRole">—</div>
      </div>
      <div class="pin-display" id="pinDisplay">
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
      </div>
      <div style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:12px;min-height:18px" id="pinError"></div>
      <div class="pin-pad">
        <button class="pin-btn" onclick="pinPress('1')">1</button>
        <button class="pin-btn" onclick="pinPress('2')">2</button>
        <button class="pin-btn" onclick="pinPress('3')">3</button>
        <button class="pin-btn" onclick="pinPress('4')">4</button>
        <button class="pin-btn" onclick="pinPress('5')">5</button>
        <button class="pin-btn" onclick="pinPress('6')">6</button>
        <button class="pin-btn" onclick="pinPress('7')">7</button>
        <button class="pin-btn" onclick="pinPress('8')">8</button>
        <button class="pin-btn" onclick="pinPress('9')">9</button>
        <button class="pin-btn" onclick="pinBack()" style="font-size:16px">⌫</button>
        <button class="pin-btn" onclick="pinPress('0')">0</button>
        <button class="pin-btn" onclick="pinBackLogin()" style="font-size:14px">↩️</button>
      </div>
    </div>
  </div>
</div>

<header class="app-header" id="appHeader" style="display:none">
  <div class="brand">
    <div class="logo">🏘️</div>
    <div class="brand-text">
      <h1>صندوق زعورة</h1>
      <div class="sub" id="hdrYear">— السنة</div>
    </div>
  </div>
  <button class="icon-btn" onclick="openStatsSheet()">📊</button>
  <button class="icon-btn" onclick="toggleTheme()">🌓</button>
  <button class="icon-btn" onclick="openSettingsSheet()">⚙️</button>
</header>

<div class="user-banner" id="userBanner" style="display:none">
  <div class="who">
    <span>👤 أنت:</span>
    <b id="currentUserName">—</b>
    <span class="role-badge" id="currentUserRole">—</span>
  </div>
  <button class="btn ghost sm" onclick="logout()">🚪 خروج</button>
</div>

<div class="search-wrap" id="searchWrap" style="display:none">
  <div class="search-box">
    <span class="ico">🔍</span>
    <input id="globalSearch" placeholder="ابحث بالاسم، الكود، رقم الهاتف…" oninput="globalSearch(this.value)">
    <button class="clear" onclick="clearSearch()" style="display:none" id="searchClear">✕</button>
  </div>
</div>

<main id="appMain" style="display:none">
  <section id="pg-home" class="page active">
    <div class="stats-scroll" id="homeStats"></div>
    <div class="card">
      <div class="card-head"><h2>⚡ إجراءات سريعة</h2></div>
      <div class="quick-actions" id="homeQuickActions"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>📊 أرصدة الصناديق</h2></div>

<script>
'use strict';

/* ═══════════════════════════════════════════════
   الإعدادات العامة
   ═══════════════════════════════════════════════ */
const DB_NAME='zaoura_fund_v1', DB_VERSION=1;
const STORE_NAMES=['people','sectors','admins','constants','subscriptions','assocPayments','deathEvents','deathInstallments','donations','expenses','handovers','auditLog'];

const ROLES={

  manager:{name:'مدير',icon:'🎯',color:'manager'},
  assocTreasurer:{name:'أمين الجمعية',icon:'💰',color:'treasurer'},
  deathTreasurer:{name:'أمين الوفاة',icon:'⚰️',color:'treasurer'},
  collector:{name:'معتمد',icon:'👤',color:'collector'},
  auditor:{name:'مدقق',icon:'👁️',color:'auditor'}
};

const PERMISSIONS={
  president:['payment.add','death.add','donation.add','handover.receive','person.manage','subscription.manage','exemptions.manage','constants.manage','admins.manage','expenses.manage','reports.all','audit.view'],
  manager:['payment.add','death.add','donation.add','handover.receive','person.manage','subscription.manage','exemptions.manage','expenses.manage','reports.all','audit.view'],
  assocTreasurer:['payment.add','donation.add','handover.receive','reports.assoc'],
  deathTreasurer:['payment.add','death.add','handover.receive','reports.death'],
  collector:['payment.add','reports.own'],
  auditor:['reports.all','audit.view']
};

const DEFAULT_SECTORS=[
  {id:'S1',name:'الجبل',order:1},{id:'S2',name:'الحارة1',order:2},
  {id:'S3',name:'الحارة2',order:3},{id:'S4',name:'الوادي',order:4},
  {id:'S5',name:'المنصورة',order:5},{id:'S6',name:'دمر',order:6}
];

const STATUS={
  active:{label:'نشط',icon:'✅',cls:'success'},
  exemptTemp:{label:'معاف مؤقت',icon:'⏸️',cls:'warning'},
  exemptPerm:{label:'معاف نهائي',icon:'🚫',cls:'muted'},
  withdrawn:{label:'منسحب',icon:'↩️',cls:'muted'},
  stopped:{label:'متوقف',icon:'💤',cls:'muted'}
};

const S={
  people:[], sectors:[], admins:[], constants:[], subscriptions:[],
  assocPayments:[], deathEvents:[], deathInstallments:[], donations:[],
  expenses:[], handovers:[], auditLog:[],

  filters:{ people:'all', payments:'assoc' }
};

/* ═══════════════════════════════════════════════
   IndexedDB
   ═══════════════════════════════════════════════ */
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VERSION);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      STORE_NAMES.forEach(n=>{
        if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:'id',autoIncrement:true});
      });
    };
    r.onsuccess=()=>{db=r.result;res(db)};
    r.onerror=()=>rej(r.error);
  });
}
const tx=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const dbAll=s=>new Promise((res,rej)=>{const q=tx(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)});
const dbGet=(s,id)=>new Promise((res,rej)=>{const q=tx(s).get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const dbPut=(s,o)=>new Promise((res,rej)=>{const q=tx(s,'readwrite').put(o);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const dbDel=(s,id)=>new Promise((res,rej)=>{const q=tx(s,'readwrite').delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});

/* ═══════════════════════════════════════════════
   أدوات
   ═══════════════════════════════════════════════ */
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const cleanText=v=>String(v??'').trim().replace(/\s+/g,' ');
const normAr=v=>String(v??'').toLowerCase().trim().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/[ىي]/g,'ي').replace(/[ًٌٍَُِّْـ]/g,'');
const cleanPhone=v=>{if(!v)return '';let s=String(v).trim().replace(/\.0+$/,'').replace(/[\s\-\(\)\u200f\u200e]/g,'');if(s.startsWith('+963'))s='0'+s.slice(4);return s};
const today=()=>new Date().toISOString().slice(0,10);
const debounce=(fn,d=250)=>{let t;return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),d)}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function fmtDate(d){
  if(!d)return '—';
  try{return new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'});}
  catch(e){return d;}
}
function toDate(v){
  if(!v)return '';
  if(typeof v==='string'&&v.trim().startsWith('='))return '';
  if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  if(typeof v==='number'){const d=new Date((v-25569)*86400000);return isNaN(d)?'':d.toISOString().slice(0,10);}
  const s=String(v).trim();
  const m1=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]|$)/);
  if(m1)return `${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;
  const m2=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m2)return `${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
  const d=new Date(s);
  if(!isNaN(d)&&d.getFullYear()>1900&&d.getFullYear()<2100)return d.toISOString().slice(0,10);
  return '';
}
function calcAge(birthDate){
  if(!birthDate)return '';
  const b=new Date(birthDate);
  if(isNaN(b))return '';
  const now=new Date();
  let age=now.getFullYear()-b.getFullYear();
  if(now.getMonth()<b.getMonth()||(now.getMonth()===b.getMonth()&&now.getDate()<b.getDate()))age--;
  return age>=0?age:'';
}
function fmtNum(n){
  if(n===null||n===undefined||n==='')return '0';
  const num=Number(n);
  if(isNaN(num))return '0';
  return num.toLocaleString('en-US');
}
function fmtMoney(n){return fmtNum(n)+' ل.س'}
function fmtShort(n){
  if(!n&&n!==0)return '0';
  const num=Number(n);
  if(num>=1000000)return (num/1000000).toFixed(1)+'M';
  if(num>=1000)return (num/1000).toFixed(1)+'K';
  return String(num);
}

function toast(msg,type='success',dur=2800){
  const el=document.createElement('div');
  el.className='toast '+type;
  el.textContent=msg;
  $('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='.3s';setTimeout(()=>el.remove(),300)},dur);
}
function showLoad(v){$('loader').classList.toggle('on',v)}

function openSheet(title,bodyHTML,footHTML='',opts={}){
  $('sheetTitle').textContent=title;
  $('sheetBody').innerHTML=bodyHTML;
  $('sheetFoot').innerHTML=footHTML;
  $('sheetFoot').style.display=footHTML?'flex':'none';

  $('sheet').classList.add('on');
  if(opts.wide)$('sheet').classList.add('wide');else $('sheet').classList.remove('wide');
  document.body.style.overflow='hidden';
  if(opts.focus)setTimeout(()=>{const el=$(opts.focus);if(el)el.focus()},250);

function closeSheet(){
  $('sheetBack').classList.remove('on');
  $('sheet').classList.remove('on');

  S.editing=null;
}
function toggleTheme(){
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';

/* ═══════════════════════════════════════════════
   التنقل
   ═══════════════════════════════════════════════ */

const globalSearch=debounce(q=>{

/* ═══════════════════════════════════════════════
   الجلسة
   ═══════════════════════════════════════════════ */
function saveCurrentUser(u){
  S.currentUser=u;
  if(u)localStorage.setItem('zt_fund_user',JSON.stringify({id:u.id,name:u.name,role:u.role,sectorId:u.sectorId||null}));
  else localStorage.removeItem('zt_fund_user');
}
function restoreCurrentUser(){
  try{const s=localStorage.getItem('zt_fund_user');return s?JSON.parse(s):null}catch(e){return null}
}
function hasPerm(p){
  if(!S.currentUser)return false;
  const perms=PERMISSIONS[S.currentUser.role]||[];
  return perms.includes(p);
}
function getPersonById(id){return S.people.find(p=>p.id===id)}
function getSectorById(id){return S.sectors.find(s=>s.id===id)}

/* ═══════════════════════════════════════════════
   تسجيل الدخول
   ═══════════════════════════════════════════════ */
let _pinAttempt='';
let _pinTargetUser=null;

function renderLoginScreen(){
  _pinAttempt='';
  _pinTargetUser=null;
  $('loginUsers').style.display='block';
  $('loginPin').style.display='none';
  const list=$('loginUsersList');
  if(S.admins.length===0){
    list.innerHTML=`
      <div style="text-align:center;padding:24px 12px">
        <div style="font-size:52px;margin-bottom:12px">🏘️</div>
        <div style="font-weight:800;font-size:15px;margin-bottom:6px">مرحباً بك</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.7">
          هذه أول مرة يُفتح فيها التطبيق.<br>ابدأ بإضافة مدير للنظام.
        </div>
      </div>`;
    return;
  }
  list.innerHTML=S.admins.map(u=>{
    const r=ROLES[u.role]||{name:'مستخدم',icon:'👤'};
    const sec=u.sectorId?getSectorById(u.sectorId):null;
    const secTxt=sec?' • '+sec.name:'';
    return `<div class="login-user" onclick="selectLoginUser(${u.id})">
      <div class="av">${r.icon}</div>
      <div class="info">
        <div class="nm">${esc(u.name)}</div>
        <div class="role">${r.name}${secTxt}</div>
      </div>
      ${u.hasPin?'<span style="font-size:18px;color:var(--muted)">🔒</span>':'<span style="font-size:18px;color:var(--success)">🔓</span>'}
    </div>`;
  }).join('');
}

function selectLoginUser(id){
  const u=S.admins.find(a=>a.id===id);
  if(!u)return;
  _pinTargetUser=u;
  _pinAttempt='';
  if(!u.hasPin){doLogin(u);return}
  $('loginUsers').style.display='none';
  $('loginPin').style.display='block';
  const r=ROLES[u.role]||{name:'مستخدم',icon:'👤'};
  $('pinAvatar').textContent=r.icon;
  $('pinName').textContent=u.name;
  $('pinRole').textContent=r.name;
  $('pinError').textContent='';
  updatePinDisplay();
}
function pinPress(d){
  if(_pinAttempt.length>=4)return;
  _pinAttempt+=d;
  updatePinDisplay();
  if(_pinAttempt.length===4)setTimeout(checkPin,200);
}
function pinBack(){_pinAttempt=_pinAttempt.slice(0,-1);updatePinDisplay();$('pinError').textContent=''}
function pinBackLogin(){$('loginPin').style.display='none';$('loginUsers').style.display='block';_pinAttempt='';_pinTargetUser=null}
function updatePinDisplay(){
  document.querySelectorAll('#pinDisplay .pin-dot').forEach((d,i)=>d.classList.toggle('on',i<_pinAttempt.length));
}
function checkPin(){
  if(!_pinTargetUser)return;
  if(_pinAttempt===String(_pinTargetUser.pin)){
    $('pinError').textContent='✅ صحيح';
    $('pinError').style.color='var(--success)';
    setTimeout(()=>doLogin(_pinTargetUser),400);
  }else{
    $('pinError').textContent='❌ خطأ، حاول مجدداً';
    $('pinError').style.color='var(--danger)';
    _pinAttempt='';
    updatePinDisplay();
    if(navigator.vibrate)navigator.vibrate(200);
  }
}
function doLogin(u){
  S.currentUser=u;
  saveCurrentUser(u);
  u.lastLogin=new Date().toISOString();
  dbPut('admins',u).catch(()=>{});
  logAudit('login','admin',u.id,{name:u.name});
  toast('👋 مرحباً '+u.name,'success',2500);
  showMainApp();
}

  const body=`
    <div style="text-align:center;padding:10px 0 18px">

async function saveFirstAdmin(){
  const name=cleanText($('firstAdminName').value);
  const phone=cleanPhone($('firstAdminPhone').value);
  const pin=$('firstAdminPin').value.trim();
  const pin2=$('firstAdminPin2').value.trim();
  if(!name){toast('الاسم مطلوب','error');return}
  if(!/^\d{4}$/.test(pin)){toast('كلمة المرور: 4 أرقام بالضبط','error');return}
  if(pin!==pin2){toast('كلمتا المرور غير متطابقتين','error');return}
  try{
    const admin={name,phone,pin,hasPin:true,role:'president',sectorId:null,createdAt:new Date().toISOString(),lastLogin:null,active:true};
    const newId=await dbPut('admins',admin);
    admin.id=newId;
    S.admins.push(admin);
    closeSheet();
    toast('✅ تم إنشاء المدير بنجاح','success',3000);
    setTimeout(renderLoginScreen,400);
  }catch(e){console.error(e);toast('خطأ: '+e.message,'error')}
}

function openEditAdminSheet(id=null){
  const isNew=!id;
  const admin=isNew?{role:'collector'}:S.admins.find(a=>a.id===id);
  if(!admin)return;
  S.editing={type:'admin',id:isNew?null:id};
  const secOpts=S.sectors.map(s=>`<option value="${s.id}" ${admin.sectorId===s.id?'selected':''}>${esc(s.name)}</option>`).join('');
  const roleOpts=Object.keys(ROLES).map(k=>{
    const r=ROLES[k];
    return `<option value="${k}" ${admin.role===k?'selected':''}>${r.icon} ${r.name}</option>`;
  }).join('');
  const body=`
    <div class="fld"><label>الاسم <span class="req">*</span></label>
      <input id="adminName" value="${esc(admin.name||'')}" maxlength="50"></div>
    <div class="fld"><label>الهاتف</label>
      <input id="adminPhone" value="${esc(admin.phone||'')}" inputmode="tel"></div>
    <div class="fld"><label>الدور <span class="req">*</span></label>
      <select id="adminRole">${roleOpts}</select></div>
    <div class="fld" id="adminSectorField">
      <label>القطاع <span style="color:var(--muted);font-weight:500">(للمعتمد)</span></label>
      <select id="adminSector"><option value="">— بدون —</option>${secOpts}</select></div>

      <input id="adminPin" type="tel" placeholder="${admin.hasPin?'اتركها للإبقاء':'••••'}" maxlength="4" inputmode="numeric">
      <div class="fld-hint">${admin.hasPin?'🔒 لديها PIN':'🔓 بدون PIN'}</div></div>
  `;
  const foot=isNew
    ?`<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn primary" onclick="saveAdmin()">💾 حفظ</button>`
    :`<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn primary" onclick="saveAdmin(${id})">💾 حفظ</button>`;
  openSheet(isNew?'➕ إضافة إداري':'✏️ تعديل',body,foot,{focus:'adminName'});
  const upd=()=>{$('adminSectorField').style.display=($('adminRole').value==='collector')?'block':'none'};
  $('adminRole').addEventListener('change',upd);
  upd();
}
async function saveAdmin(id=null){
  const name=cleanText($('adminName').value);
  const phone=cleanPhone($('adminPhone').value);
  const role=$('adminRole').value;
  const sectorId=$('adminSector').value||null;
  const pin=$('adminPin').value.trim();
  if(!name){toast('الاسم مطلوب','error');return}
  if(pin&&!/^\d{4}$/.test(pin)){toast('كلمة المرور: 4 أرقام بالضبط','error');return}
  try{
    const old=id?await dbGet('admins',id):null;
    const admin={
      name,phone,role,
      sectorId:role==='collector'?sectorId:null,
      hasPin:pin?true:(old?old.hasPin:false),
      pin:pin?pin:(old?old.pin:null),
      updatedAt:new Date().toISOString(),
      createdAt:old?old.createdAt:new Date().toISOString(),
      lastLogin:old?old.lastLogin:null,
      active:old?old.active:true
    };
    if(id){
      admin.id=id;
      await dbPut('admins',admin);
      const i=S.admins.findIndex(a=>a.id===id);
      if(i>-1)S.admins[i]=admin;
      logAudit('update','admin',id,{name});
      toast('✅ تم التعديل');
    }else{
      const nid=await dbPut('admins',admin);
      admin.id=nid;
      S.admins.push(admin);
      logAudit('add','admin',nid,{name});
      toast('✅ تمت الإضافة');
    }
    closeSheet();
    setTimeout(openAdminsSheet,250);
    if(S.currentUser&&S.currentUser.id===id){
      S.currentUser=admin;
      saveCurrentUser(admin);
      showMainApp();
    }
  }catch(e){console.error(e);toast('خطأ: '+e.message,'error')}
}
async function deleteAdmin(id){
  if(!confirm('حذف هذا الإداري؟'))return;
  if(!confirm('تأكيد نهائي!'))return;
  try{
    const a=S.admins.find(x=>x.id===id);
    if(!a)return;
    if(a.role==='president'){
      const presidents=S.admins.filter(x=>x.role==='president');
      if(presidents.length<=1){toast('⚠️ لا يمكن حذف الرئيس الوحيد','error',3500);return}
    }
    await dbDel('admins',id);
    S.admins=S.admins.filter(x=>x.id!==id);
    logAudit('delete','admin',id,{name:a.name});
    toast('🗑️ تم الحذف');
    openAdminsSheet();
  }catch(e){toast('خطأ: '+e.message,'error')}
}

async function logAudit(action,target,targetId,details={}){
  const entry={timestamp:new Date().toISOString(),userId:S.currentUser?S.currentUser.id:null,userName:S.currentUser?S.currentUser.name:'system',action,target,targetId,details};
  try{
    const id=await dbPut('auditLog',entry);
    entry.id=id;
    S.auditLog.push(entry);
    if(S.auditLog.length>10000){
      const old=S.auditLog.slice(0,S.auditLog.length-10000);
      for(const o of old)await dbDel('auditLog',o.id);
      S.auditLog=S.auditLog.slice(-10000);
    }
  }catch(e){console.warn(e)}
}

function setPeopleFilter(k){S.filters.people=k;renderPeople()}

function renderPeople(){
  const alive=S.people.filter(p=>p.status==='حي').length;
  const dead=S.people.filter(p=>p.status==='متوفى').length;
  const youth=S.people.filter(p=>{const a=calcAge(p.birth);return a!==''&&a>=18&&a<=30&&p.status==='حي'}).length;
  
  $('peopleStats').innerHTML=`
    <div class="stat"><div class="val">${S.people.length}</div><div class="lbl">الإجمالي</div></div>
    <div class="stat green"><div class="val">${alive}</div><div class="lbl">أحياء</div></div>
    <div class="stat red"><div class="val">${dead}</div><div class="lbl">متوفون</div></div>
    <div class="stat orange"><div class="val">${youth}</div><div class="lbl">🎓 شباب</div></div>
  `;
  
  const chips=[
    {k:'all',l:'الكل'},{k:'alive',l:'🟢 أحياء'},{k:'dead',l:'🔴 متوفون'},
    {k:'youth',l:'🎓 شباب 18-30'},{k:'head',l:'👤 رب أسرة'},
    {k:'wife',l:'💑 زوجة'},{k:'child',l:'👶 أبناء'}
  ];
  $('peopleChips').innerHTML=chips.map(c=>
    `<button class="chip ${S.filters.people===c.k?'on':''}" onclick="setPeopleFilter('${c.k}')">${c.l}</button>`
  ).join('');
  
  let list=[...S.people];
  const q=S.search;
  if(S.filters.people==='alive')list=list.filter(p=>p.status==='حي');
  if(S.filters.people==='dead')list=list.filter(p=>p.status==='متوفى');
  if(S.filters.people==='youth')list=list.filter(p=>{const a=calcAge(p.birth);return a!==''&&a>=18&&a<=30&&p.status==='حي'});
  if(S.filters.people==='head')list=list.filter(p=>p.relation==='رب أسرة');
  if(S.filters.people==='wife')list=list.filter(p=>p.relation==='زوجة');
  if(S.filters.people==='child')list=list.filter(p=>p.relation==='ابن'||p.relation==='بنت');
  
  if(q){
    const s=normAr(q);
    list=list.filter(p=>normAr(`${p.name||''} ${p.code||''} ${p.phone||''} ${p.familyCode||''} ${p.sector||''}`).includes(s));
  }
  list.sort((a,b)=>String(a.code||'zzz').localeCompare(String(b.code||'zzz'),'ar',{numeric:true}));
  
  const el=$('peopleContent');
  if(!list.length){
    el.innerHTML=`<div class="empty"><span class="ico">👥</span><h3>لا يوجد أفراد</h3><p>أضف فرداً أو استورد Excel</p></div>`;
    return;
  }
  
  el.innerHTML=`<div class="list">${list.slice(0,300).map(p=>{
    const age=calcAge(p.birth);
    const isDead=p.status==='متوفى';
    return `<div class="item" onclick="openPersonSheet(${p.id})">
      <div class="av ${isDead?'red':(p.gender==='أنثى'?'orange':'')}">${isDead?'⚰️':(p.gender==='أنثى'?'👩':'👨')}</div>
      <div class="body">
        <div class="ttl">${esc(p.name||'')}</div>
        <div class="sub">${esc(p.code||'')}${age!==''?' • '+age+' سنة':''} • ${esc(p.sector||'—')} • ${esc(p.relation||'')}</div>
      </div>
      <span class="trail">›</span>
    </div>`;
  }).join('')}</div>
  ${list.length>300?`<div style="text-align:center;padding:14px;font-size:12px;color:var(--muted)">عرض أول 300 من ${list.length}</div>`:''}`;
}

function openPersonSheet(id=null){
  const isNew=!id;
  const canManage=hasPerm('person.manage');
  const p=isNew?{gender:'ذكر',status:'حي',relation:'رب أسرة'}:S.people.find(x=>x.id===id);
  if(!p)return;
  S.editing={type:'person',id:isNew?null:id};
  const readOnly=!isNew&&!canManage;
  const sectorOpts=S.sectors.map(s=>`<option value="${esc(s.name)}" ${p.sector===s.name?'selected':''}>${esc(s.name)}</option>`).join('');
  
  const body=`
    ${readOnly?`<div style="background:var(--warning);color:#fff;padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:12px">👁️ عرض فقط</div>`:''}
    <div class="fld"><label>كود الفرد</label>
      <input id="pCode" value="${esc(p.code||'')}" ${readOnly?'readonly':''} placeholder="A001-F001" class="fld-readonly"></div>
    <div class="fld"><label>الاسم الثلاثي <span class="req">*</span></label>
      <input id="pName" value="${esc(p.name||'')}" ${readOnly?'readonly':''} placeholder="علي عساف عساف"></div>
    <div class="fld-row">
      <div class="fld"><label>الجنس</label>
        <select id="pGender" ${readOnly?'disabled':''}>
          <option ${p.gender==='ذكر'?'selected':''}>ذكر</option>
          <option ${p.gender==='أنثى'?'selected':''}>أنثى</option>
        </select></div>
      <div class="fld"><label>الحالة</label>
        <select id="pStatus" ${readOnly?'disabled':''}>
          ${['حي','متوفى','مسافر','غير معروف'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}
        </select></div>
    </div>
    <div class="fld-row">
      <div class="fld"><label>كود الأسرة</label>
        <input id="pFamilyCode" value="${esc(p.familyCode||'')}" ${readOnly?'readonly':''} placeholder="A001"></div>
      <div class="fld"><label>صلة القرابة</label>
        <select id="pRelation" ${readOnly?'disabled':''}>
          ${['رب أسرة','زوجة','زوج','ابن','بنت','أب','أم','أخ','أخت','جد','جدة','حفيد','حفيدة','أخرى'].map(r=>`<option ${p.relation===r?'selected':''}>${r}</option>`).join('')}
        </select></div>
    </div>
    <div class="fld-row">
      <div class="fld"><label>الميلاد</label>
        <input id="pBirth" type="date" value="${esc(p.birth||'')}" ${readOnly?'readonly':''}></div>
      <div class="fld"><label>القطاع</label>
        <select id="pSector" ${readOnly?'disabled':''}>
          <option value="">— بدون —</option>${sectorOpts}
        </select></div>
    </div>
    <div class="fld"><label>الهاتف</label>
      <input id="pPhone" value="${esc(p.phone||'')}" ${readOnly?'readonly':''} inputmode="tel"></div>
    <div class="fld"><label>ملاحظات</label>
      <textarea id="pNotes" ${readOnly?'readonly':''}>${esc(p.notes||'')}</textarea></div>
    ${!isNew?renderSubscriptionsBlock(p.id):''}
  `;
  
  let foot='';
  if(isNew){
    foot=`<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn primary" onclick="savePerson()">💾 حفظ</button>`;
  }else if(canManage){
    foot=`<button class="btn danger sm" onclick="deletePerson(${id})">🗑️</button>
          <button class="btn info sm" onclick="openSubscriptionsSheet(${id})">📝 اشتراكات</button>
          <button class="btn primary" onclick="savePerson(${id})">💾</button>`;
  }else{
    foot=`<button class="btn ghost" onclick="closeSheet()">إغلاق</button>`;
  }
  
  openSheet(isNew?'➕ إضافة فرد':esc(p.name||'فرد'),body,foot,{focus:isNew?'pName':null});
  
  // السجل الكامل للأفراد المُسجَّلين
  if(!isNew){
    setTimeout(()=>{
      const bd=$('sheetBody');
      if(!bd)return;
      const years=[2025,2026,2027,2028];
      const records=years.map(y=>{
        const consts=S.constants.find(c=>c.year===y);
        if(!consts)return null;
        const sub=S.subscriptions.find(s=>s.personId===id&&s.year===y);
        const assocPaid=S.assocPayments.filter(pp=>pp.personId===id&&pp.year===y).reduce((s,pp)=>s+(Number(pp.amount)||0),0);
        const assocRequired=consts.assocYearly;
        const assocRemaining=Math.max(0,assocRequired-assocPaid);
        const deathInsts=S.deathInstallments.filter(i=>i.personId===id&&i.year===y);
        const deathRequired=deathInsts.reduce((s,i)=>s+(Number(i.amount)||0),0);
        const deathPaid=deathInsts.filter(i=>i.status==='paid').reduce((s,i)=>s+(Number(i.amount)||0),0);
        const deathRemaining=deathRequired-deathPaid;
        if(assocPaid===0&&deathPaid===0&&assocRemaining===assocRequired&&deathRequired===0&&!sub)return null;
        return {year:y,sub,assocPaid,assocRequired,assocRemaining,deathRequired,deathPaid,deathRemaining,deathCount:deathInsts.length};
      }).filter(Boolean);
      
      if(!records.length)return;
      
      const blockHTML=`
        <div class="divider-dashed" style="margin-top:16px"></div>
        <div style="font-weight:800;font-size:14px;margin:12px 0">📊 السجل الكامل</div>
        ${records.map(r=>{
          const aPct=r.assocRequired>0?Math.round(r.assocPaid/r.assocRequired*100):0;
          const dPct=r.deathRequired>0?Math.round(r.deathPaid/r.deathRequired*100):0;
          return `
            <div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:8px">
              <div style="font-weight:800;font-size:14px;margin-bottom:8px">📅 ${r.year}</div>
              <div style="padding:8px;background:var(--card);border-radius:8px;margin-bottom:6px">
                <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--assoc);margin-bottom:4px">
                  <span>💰 الجمعية</span><span>${fmtNum(r.assocPaid)} / ${fmtNum(r.assocRequired)}</span>
                </div>
                <div class="progress assoc"><div style="width:${aPct}%"></div></div>
                ${r.assocRemaining>0?`<div style="font-size:11px;color:var(--danger);margin-top:4px">متبقي: ${fmtNum(r.assocRemaining)} ل.س</div>`:`<div style="font-size:11px;color:var(--success);margin-top:4px">✅ مسدَّد</div>`}
              </div>
              ${r.deathCount>0?`
                <div style="padding:8px;background:var(--card);border-radius:8px">
                  <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--death);margin-bottom:4px">
                    <span>⚰️ الوفاة (${r.deathCount})</span><span>${fmtNum(r.deathPaid)} / ${fmtNum(r.deathRequired)}</span>
                  </div>
                  <div class="progress death"><div style="width:${dPct}%"></div></div>
                  ${r.deathRemaining>0?`<div style="font-size:11px;color:var(--danger);margin-top:4px">متبقي: ${fmtNum(r.deathRemaining)} ل.س</div>`:`<div style="font-size:11px;color:var(--success);margin-top:4px">✅ مسدَّد</div>`}
                </div>`:''}
            </div>`;
        }).join('')}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
          <button class="btn assoc block" onclick="closeSheet();setTimeout(()=>openAssocPaymentSheet(${id}),150)">💰 دفعة</button>
          <button class="btn ghost block" onclick="closeSheet();setTimeout(()=>openSubscriptionsSheet(${id}),150)">📝 اشتراكات</button>
        </div>`;

async function importPeopleFile(input){
  const file=input.files[0];
  if(!file)return;
  input.value='';
  showLoad(true);
  const log=$('importLog');
  log.innerHTML='<div style="color:var(--muted)">⏳ جاري القراءة…</div>';
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
    if(!rows.length){log.innerHTML='<div style="color:var(--danger)">❌ الملف فارغ</div>';showLoad(false);return}
    let ok=0,skip=0;
    const existing=new Set(S.people.map(p=>p.code||normAr(p.name)));
    const existingNames=new Set(S.people.map(p=>normAr(p.name)));
    for(let i=0;i<rows.length;i++){
      const r=rows[i];
      const name=cleanText(gv(r,'الاسم الثلاثي','الاسم_الثلاثي','الاسم'));
      if(!name){skip++;continue}
      const code=cleanText(gv(r,'رقم الفرد','رقم_الفرد','الكود','code'));
      const key=code||normAr(name);
      if(existing.has(key)||existingNames.has(normAr(name))){skip++;continue}
      try{
        const person={
          code,name,
          gender:gv(r,'الجنس')||'ذكر',
          status:gv(r,'الحالة')||'حي',
          familyCode:cleanText(gv(r,'كود الأسرة','كود_الأسرة')),
          relation:gv(r,'صلة القرابة','صلة_القرابة')||'رب أسرة',
          birth:toDate(gv(r,'تاريخ الميلاد','تاريخ_الميلاد')),
          sector:gv(r,'القطاع'),
          phone:cleanPhone(gv(r,'الجوال','الهاتف')),
          notes:cleanText(gv(r,'ملاحظات')),
          createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
        };
        const newId=await dbPut('people',person);
        person.id=newId;
        S.people.push(person);
        existing.add(key);
        existingNames.add(normAr(name));
        ok++;
      }catch(e){console.warn('صف '+(i+2),e);skip++}
    }
    log.innerHTML=`<div style="padding:12px;background:#f0fdf4;border-radius:12px;color:#166534">
      <div style="font-weight:800;margin-bottom:6px">📊 النتيجة</div>
      <div>✅ نجح: <b>${ok}</b></div><div>⏭️ تُخطّي: <b>${skip}</b></div>
    </div>`;
    toast(`✅ استيراد ${ok} فرد`,'success',3500);
    renderPeople();
    if(S.page==='pg-home')renderHome();
  }catch(e){
    console.error(e);
    log.innerHTML=`<div style="color:var(--danger)">❌ ${esc(e.message)}</div>`;
    toast('خطأ: '+e.message,'error');
  }
  showLoad(false);
}

function gv(row,...aliases){
  if(!row)return '';
  const normalized={};
  for(const k of Object.keys(row)){
    normalized[normAr(k).replace(/[^\u0621-\u064Aa-z0-9]/g,'')]=row[k];
  }
  for(const a of aliases){
    const key=normAr(a).replace(/[^\u0621-\u064Aa-z0-9]/g,'');
    if(key in normalized){
      const v=normalized[key];
      if(v===null||v===undefined)continue;
      const s=String(v).trim();
      if(!s||s.startsWith('=')||s.includes('openpyxl'))continue;
      return s;
    }
  }
  return '';
}

function updatePayBalance(personId){
  const p=getPersonById(personId);
  if(!p)return;
  const year=Number($('payYear')?.value)||S.currentYear;
  const consts=S.constants.find(c=>c.year===year);
  const yearly=consts?consts.assocYearly:24000;
  const paid=S.assocPayments.filter(x=>x.personId===personId&&x.year===year).reduce((s,x)=>s+(Number(x.amount)||0),0);
  const remaining=Math.max(0,yearly-paid);
  
  $('payBalanceBox').style.display='block';
  $('payPersonName').textContent=p.name;
  $('payPersonInfo').textContent=`${p.code||''} • ${p.sector||''} • ${p.relation||''}`;
  $('payYearly').textContent=fmtNum(yearly);
  $('payPaid').textContent=fmtNum(paid);
  $('payRemaining').textContent=fmtNum(remaining);
  $('payAmount').value=remaining>0?remaining:yearly;
}

/* ═══════════════════════════════════════════════
   التبرعات
   ═══════════════════════════════════════════════ */
function openDonationSheet(){
  if(!hasPerm('donation.add')){toast('غير مصرح','error');return}
  const body=`
    <div class="fld"><label>اسم المتبرع</label>
      <input id="doDonor" placeholder="اختياري"></div>
    <div class="fld"><label>المبلغ <span class="req">*</span></label>
      <div class="amount-input">
        <input id="doAmount" type="tel" inputmode="numeric" placeholder="0">
        <span class="currency">ل.س</span>
      </div>
    </div>
    <div class="fld-row">
      <div class="fld"><label>التاريخ</label><input id="doDate" type="date" value="${today()}"></div>
      <div class="fld"><label>القطاع</label>
        <select id="doSector"><option value="">— بدون —</option>
          ${S.sectors.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}
        </select></div>
    </div>
    <div class="fld"><label>ملاحظات</label>
      <input id="doNotes" placeholder="اختياري"></div>
  `;
  const foot=`<button class="btn ghost" onclick="closeSheet()">إلغاء</button>
    <button class="btn donation" onclick="saveDonation()">💚 حفظ</button>`;
  openSheet('💚 تسجيل تبرع',body,foot,{focus:'doAmount'});
}

async function saveDonation(){
  const donorName=cleanText($('doDonor').value);
  const amount=Number($('doAmount').value);
  const date=$('doDate').value;
  const sector=$('doSector').value;
  const notes=cleanText($('doNotes').value);
  if(!amount||amount<=0){toast('المبلغ مطلوب','error');return}
  if(!date){toast('التاريخ مطلوب','error');return}
  try{
    const donation={donorName:donorName||'متبرع مجهول',amount,date,sector,notes,year:new Date(date).getFullYear(),collectorId:S.currentUser.id,collectorName:S.currentUser.name,createdAt:new Date().toISOString()};
    const id=await dbPut('donations',donation);
    donation.id=id;
    S.donations.push(donation);
    logAudit('add','donation',id,{amount});
    toast('💚 تم تسجيل التبرع','success',3000);
    closeSheet();
    renderHome();
    if(S.page==='pg-payments')renderPayments();
  }catch(e){console.error(e);toast('خطأ: '+e.message,'error')}
}

/* ═══════════════════════════════════════════════
   صفحة الدفعات
   ═══════════════════════════════════════════════ */
function setPaymentsFilter(k){S.filters.payments=k;renderPayments()}

function renderPayments(){
  const year=S.currentYear;
  const assocYear=S.assocPayments.filter(p=>p.year===year);
  const deathYear=S.deathInstallments.filter(i=>i.year===year);
  const donYear=S.donations.filter(d=>d.year===year);
  
  const totalAssoc=assocYear.reduce((s,p)=>s+(Number(p.amount)||0),0);
  const totalDeath=deathYear.filter(i=>i.status==='paid').reduce((s,i)=>s+(Number(i.amount)||0),0);
  const totalDon=donYear.reduce((s,d)=>s+(Number(d.amount)||0),0);
  const pendingDeath=deathYear.filter(i=>i.status==='pending').length;
  
  $('paymentsStats').innerHTML=`
    <div class="stat assoc"><div class="val">${fmtShort(totalAssoc)}</div><div class="lbl">💰 جمعية ${year}</div></div>
    <div class="stat death"><div class="val">${fmtShort(totalDeath)}</div><div class="lbl">⚰️ وفاة ${year}</div></div>
    <div class="stat orange"><div class="val">${pendingDeath}</div><div class="lbl">⏳ معلقة</div></div>
    <div class="stat donation"><div class="val">${fmtShort(totalDon)}</div><div class="lbl">💚 تبرعات</div></div>
  `;
  
  const chips=[
    {k:'assoc',l:'💰 جمعية'},{k:'death',l:'⚰️ وفاة'},{k:'donation',l:'💚 تبرعات'}
  ];
  $('paymentsChips').innerHTML=chips.map(c=>
    `<button class="chip ${S.filters.payments===c.k?'on':''}" onclick="setPaymentsFilter('${c.k}')">${c.l}</button>`
  ).join('');
  
  const el=$('paymentsContent');
  
  if(S.filters.payments==='assoc'){
    let list=[...S.assocPayments].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const q=S.search;
    if(q){
      const s=normAr(q);
      list=list.filter(p=>{const pe=getPersonById(p.personId);return pe&&normAr(pe.name).includes(s)});
    }
    list=list.slice(0,200);
    if(!list.length){el.innerHTML=`<div class="empty"><span class="ico">💰</span><h3>لا توجد دفعات جمعية</h3><p>سجّل دفعة أو استورد بيانات</p></div>`;return}
    el.innerHTML=`<div class="list">${list.map(p=>{
      const person=getPersonById(p.personId);
      return `<div class="item" style="cursor:default">
        <div class="av blue">💰</div>
        <div class="body">
          <div class="ttl">${esc(person?person.name:'—')}</div>
          <div class="sub">${fmtDate(p.date)} • ${esc(p.collectorName||'')}${p.year?' • '+p.year:''}</div>
        </div>
        <div style="font-weight:800;color:var(--assoc);font-size:14px">${fmtNum(p.amount)}</div>
      </div>`;
    }).join('')}</div>`;
  }
  else if(S.filters.payments==='death'){
    let list=[...S.deathInstallments].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    const q=S.search;
    if(q){
      const s=normAr(q);
      list=list.filter(i=>{const pe=getPersonById(i.personId);return pe&&normAr(pe.name).includes(s)});
    }
    list=list.slice(0,200);
    if(!list.length){el.innerHTML=`<div class="empty"><span class="ico">⚰️</span><h3>لا توجد أقساط وفاة</h3><p>لم تُسجَّل وفيات بعد</p></div>`;return}
    el.innerHTML=`<div class="list">${list.map(i=>{
      const person=getPersonById(i.personId);
      const isPaid=i.status==='paid';
      return `<div class="item" onclick="openDeathInstallmentSheet(${i.id})">
        <div class="av ${isPaid?'green':'red'}">${isPaid?'✅':'⏳'}</div>
        <div class="body">
          <div class="ttl">${esc(person?person.name:'—')}</div>
          <div class="sub">وفاة: ${esc(i.eventName||'')} • ${fmtDate(i.deathDate)}</div>
        </div>
        <div style="font-weight:800;color:${isPaid?'var(--success)':'var(--danger)'};font-size:14px">${fmtNum(i.amount)}</div>
      </div>`;
    }).join('')}</div>`;
  }
  else if(S.filters.payments==='donation'){
    let list=[...S.donations].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const q=S.search;
    if(q){
      const s=normAr(q);
      list=list.filter(d=>normAr(d.donorName||'').includes(s));
    }
    list=list.slice(0,200);
    if(!list.length){el.innerHTML=`<div class="empty"><span class="ico">💚</span><h3>لا توجد تبرعات</h3><p>لم تُسجَّل تبرعات بعد</p></div>`;return}
    el.innerHTML=`<div class="list">${list.map(d=>`
      <div class="item" style="cursor:default">
        <div class="av green">💚</div>
        <div class="body">
          <div class="ttl">${esc(d.donorName||'متبرع')}</div>
          <div class="sub">${fmtDate(d.date)}${d.notes?' • '+esc(d.notes):''}</div>
        </div>
        <div style="font-weight:800;color:var(--donation);font-size:14px">${fmtNum(d.amount)}</div>
      </div>
    `).join('')}</div>`;
  }
}

function openDeathInstallmentSheet(id){
  const inst=S.deathInstallments.find(i=>i.id===id);
  if(!inst)return;
  const person=getPersonById(inst.personId);
  const isPaid=inst.status==='paid';
  
  const body=`
    <div style="padding:14px;background:var(--death-soft);border-radius:12px;margin-bottom:14px">
      <div style="font-weight:800;font-size:15px;color:var(--death)">${esc(person?person.name:'—')}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(person?.code||'')} • ${esc(person?.sector||'')}</div>
    </div>
    <div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:14px;font-size:13px">
      <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">المتوفى</span><b>${esc(inst.eventName)}</b></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">تاريخ الوفاة</span><b>${fmtDate(inst.deathDate)}</b></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">المبلغ</span><b style="color:var(--death);font-size:15px">${fmtNum(inst.amount)} ل.س</b></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--border);margin-top:6px;padding-top:8px">
        <span class="muted">الحالة</span>
        <b style="color:${isPaid?'var(--success)':'var(--danger)'}">${isPaid?'✅ مدفوع':'⏳ معلّق'}</b></div>
      ${isPaid?`<div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">تاريخ السداد</span><b>${fmtDate(inst.paidDate)}</b></div>`:''}
    </div>
  `;
  
  let foot='';
  if(isPaid){foot=`<button class="btn ghost" onclick="closeSheet()">إغلاق</button>`}
  else if(hasPerm('payment.add')){foot=`<button class="btn ghost" onclick="closeSheet()">إلغاء</button><button class="btn death" onclick="markDeathPaid(${id})">✅ تسجيل السداد</button>`}
  else{foot=`<button class="btn ghost" onclick="closeSheet()">إغلاق</button>`}
  
  openSheet('⚰️ قسط وفاة',body,foot);
}

async function markDeathPaid(id){
  if(!hasPerm('payment.add')){toast('غير مصرح','error');return}
  if(!confirm('تأكيد السداد؟'))return;
  try{
    const inst=S.deathInstallments.find(i=>i.id===id);
    if(!inst)return;
    inst.status='paid';
    inst.paidDate=today();
    inst.collectorId=S.currentUser.id;
    inst.collectorName=S.currentUser.name;
    inst.updatedAt=new Date().toISOString();
    await dbPut('deathInstallments',inst);
    logAudit('update','deathInstallment',id,{paid:true});
    toast('✅ تم تسجيل السداد');
    closeSheet();
    renderPayments();
    renderHome();
  }catch(e){console.error(e);toast('خطأ: '+e.message,'error')}
}

/* ═══════════════════════════════════════════════
   التسليم
   ═══════════════════════════════════════════════ */
function openHandoverSheet(){
  if(!hasPerm('handover.receive')&&S.currentUser?.role!=='collector'){toast('غير مصرح','error');return}
  
  const myCollected=S.assocPayments.filter(p=>p.collectorId===S.currentUser.id).reduce((s,p)=>s+(Number(p.amount)||0),0);
  const myDelivered=S.handovers.filter(h=>h.fromUserId===S.currentUser.id).reduce((s,h)=>s+(Number(h.amount)||0),0);
  const myBalance=myCollected-myDelivered;
  
  const body=`
    <div style="padding:14px;background:var(--primary-soft);border-radius:12px;margin-bottom:14px">
      <div style="font-size:12px;color:var(--muted)">الرصيد في عهدتك</div>
      <div style="font-size:28px;font-weight:800;color:var(--primary);margin-top:4px">${fmtNum(myBalance)} ل.س</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">حصّلت: ${fmtNum(myCollected)} • سلّمت: ${fmtNum(myDelivered)}</div>
    </div>
    <div class="fld"><label>أسلّم إلى <span class="req">*</span></label>
      <select id="hoToUser"><option value="">— اختر —</option>
        ${S.admins.filter(a=>['assocTreasurer','deathTreasurer','manager','president'].includes(a.role)).map(a=>`<option value="${a.id}">${ROLES[a.role].icon} ${esc(a.name)}</option>`).join('')}
      </select></div>
    <div class="fld"><label>المبلغ <span class="req">*</span></label>
      <div class="amount-input">
        <input id="hoAmount" type="tel" inputmode="numeric" value="${myBalance>0?myBalance:''}" placeholder="0">
        <span class="currency">ل.س</span>
      </div>
    </div>
    <div class="fld"><label>الصندوق</label>
      <select id="hoFund"><option value="assoc">💰 صندوق الجمعية</option><option value="death">⚰️ صندوق الوفاة</option></select></div>
    <div class="fld"><label>ملاحظات</label>
      <input id="hoNotes" placeholder="اختياري"></div>
  `;
  const foot=`<button class="btn ghost" onclick="closeSheet()">إلغاء</button>
    <button class="btn success" onclick="saveHandover()">📤 تسجيل التسليم</button>`;
  openSheet('📤 تسليم الأموال',body,foot,{focus:'hoAmount'});
}

async function saveHandover(){
  const toUserId=Number($('hoToUser').value);
  const amount=Number($('hoAmount').value);
  const fund=$('hoFund').value;
  const notes=cleanText($('hoNotes').value);
  if(!toUserId){toast('اختر المستلم','error');return}
  if(!amount||amount<=0){toast('المبلغ مطلوب','error');return}
  const toUser=S.admins.find(a=>a.id===toUserId);
  if(!toUser)return;
  try{
    const handover={fromUserId:S.currentUser.id,fromUserName:S.currentUser.name,toUserId,toUserName:toUser.name,amount,fund,notes,date:today(),createdAt:new Date().toISOString()};
    const id=await dbPut('handovers',handover);
    handover.id=id;
    S.handovers.push(handover);
    logAudit('add','handover',id,{amount,to:toUser.name});
    toast('📤 تم تسجيل التسليم');
    closeSheet();
    renderHome();
  }catch(e){console.error(e);toast('خطأ: '+e.message,'error')}
}

  const years=[2025,2026,2027,2028];
  const list=years.map(y=>{
    const c=S.constants.find(x=>x.year===y);
    return `<div class="item" onclick="openEditConstantSheet(${y})">
      <div class="av ${c?'green':'gray'}">${c?'✅':'📝'}</div>

        <div class="ttl">سنة ${y}</div>
        <div class="sub">${c?`💰 ${fmtNum(c.assocYearly)} • ⚰️ ${fmtNum(c.deathInstallment)} • 📤 ${fmtNum(c.deathCompensation)}`:'لم تُحدَّد — اضغط لإضافة'}</div>

function openEditConstantSheet(year){
  if(!hasPerm('constants.manage')){toast('غير مصرح','error');return}
  const c=S.constants.find(x=>x.year===year)||{year,assocYearly:24000,deathInstallment:5000,deathCompensation:25000,joinAssoc:100000,joinDeath:50000,joinReduced:50000};
  const isNew=!S.constants.find(x=>x.year===year);
  
  const body=`
    <div style="padding:12px;background:var(--primary-soft);border-radius:12px;margin-bottom:14px;text-align:center">
      <div style="font-size:28px;font-weight:800;color:var(--primary)">سنة ${year}</div>
    </div>
    <div class="fld"><label>💰 قسط الجمعية السنوي</label>
      <div class="amount-input"><input id="cAssoc" type="tel" inputmode="numeric" value="${c.assocYearly}"><span class="currency">ل.س</span></div>
    </div>
    <div class="fld"><label>⚰️ قسط الوفاة (لكل وفاة)</label>
      <div class="amount-input"><input id="cDeathInst" type="tel" inputmode="numeric" value="${c.deathInstallment}"><span class="currency">ل.س</span></div>
    </div>
    <div class="fld"><label>📤 تعويض الوفاة للعائلة</label>
      <div class="amount-input"><input id="cDeathComp" type="tel" inputmode="numeric" value="${c.deathCompensation}"><span class="currency">ل.س</span></div>
    </div>
    <div style="height:1px;border-top:2px dashed var(--border);margin:16px 0"></div>
    <div style="font-size:12px;font-weight:800;color:var(--muted);margin-bottom:8px">🎓 رسوم الانضمام</div>
    <div class="fld"><label>رسوم انضمام الجمعية</label>
      <div class="amount-input"><input id="cJoinAssoc" type="tel" inputmode="numeric" value="${c.joinAssoc}"><span class="currency">ل.س</span></div>
    </div>
    <div class="fld-row">
      <div class="fld"><label>انضمام الوفاة (عادي)</label>
        <input id="cJoinDeath" type="tel" inputmode="numeric" value="${c.joinDeath}"></div>
      <div class="fld"><label>انضمام الوفاة (مخفض)</label>
        <input id="cJoinReduced" type="tel" inputmode="numeric" value="${c.joinReduced}"></div>
    </div>
  `;
  const foot=isNew
    ?`<button class="btn ghost" onclick="closeSheet();setTimeout(openConstantsSheet,150)">رجوع</button><button class="btn primary" onclick="saveConstant(${year})">💾 حفظ ${year}</button>`
    :`<button class="btn danger sm" onclick="deleteConstant(${year})">🗑️</button><button class="btn ghost" onclick="closeSheet();setTimeout(openConstantsSheet,150)">رجوع</button><button class="btn primary" onclick="saveConstant(${year})">💾 حفظ</button>`;
  openSheet('💰 تعديل ثوابت '+year,body,foot);
}

async function saveConstant(year){
  if(!hasPerm('constants.manage'))return;
  const obj={
    year,
    assocYearly:Number($('cAssoc').value)||0,
    deathInstallment:Number($('cDeathInst').value)||0,
    deathCompensation:Number($('cDeathComp').value)||0,
    joinAssoc:Number($('cJoinAssoc').value)||0,
    joinDeath:Number($('cJoinDeath').value)||0,
    joinReduced:Number($('cJoinReduced').value)||0,
    updatedAt:new Date().toISOString()
  };
  try{
    const existing=S.constants.find(x=>x.year===year);
    if(existing){
      obj.id=existing.id;
      await dbPut('constants',obj);
      const i=S.constants.findIndex(x=>x.year===year);
      if(i>-1)S.constants[i]=obj;
      toast(`✅ تم تعديل ثوابت ${year}`);
    }else{
      const newId=await dbPut('constants',obj);
      obj.id=newId;
      S.constants.push(obj);
      toast(`✅ تم إضافة ثوابت ${year}`);
    }
    logAudit('update','constant',year,obj);
    closeSheet();
    setTimeout(openConstantsSheet,250);
  }catch(e){console.error(e);toast('خطأ: '+e.message,'error')}
}

async function deleteConstant(year){
  if(!hasPerm('constants.manage'))return;
  if(!confirm(`حذف ثوابت ${year}؟`))return;
  try{
    const c=S.constants.find(x=>x.year===year);
    if(!c)return;
    await dbDel('constants',c.id);
    S.constants=S.constants.filter(x=>x.year!==year);
    toast('🗑️ تم الحذف');
    closeSheet();
    setTimeout(openConstantsSheet,250);
  }catch(e){toast('خطأ','error')}
}

/* ═══════════════════════════════════════════════
   الإحصائيات
   ═══════════════════════════════════════════════ */
function openStatsSheet(){
  const year=S.currentYear;
  const allPeople=S.people;
  const subs=S.subscriptions.filter(s=>s.year===year);
  const assocActive=subs.filter(s=>s.assocStatus==='active').length;
  const assocExemptTemp=subs.filter(s=>s.assocStatus==='exemptTemp').length;
  const assocExemptPerm=subs.filter(s=>s.assocStatus==='exemptPerm').length;
  const assocWithdrawn=subs.filter(s=>s.assocStatus==='withdrawn').length;
  const assocStopped=subs.filter(s=>s.assocStatus==='stopped').length;
  const assocNoSub=allPeople.length-subs.length;
  
  const assocPaidPeople=new Set();
  S.assocPayments.filter(p=>p.year===year).forEach(p=>assocPaidPeople.add(p.personId));
  const assocFullyPaid=[...assocPaidPeople].filter(pid=>{
    const consts=S.constants.find(c=>c.year===year);
    const yearly=consts?consts.assocYearly:24000;
    const paid=S.assocPayments.filter(p=>p.personId===pid&&p.year===year).reduce((sum,p)=>sum+(Number(p.amount)||0),0);
    return paid>=yearly;
  }).length;
  const assocPartial=assocPaidPeople.size-assocFullyPaid;
  const assocNotPaid=Math.max(0,assocActive-assocPaidPeople.size);
  
  const deathActive=subs.filter(s=>s.deathStatus==='active').length;
  const deathExempt=subs.filter(s=>s.deathStatus==='exemptTemp'||s.deathStatus==='exemptPerm').length;
  const yearDeaths=S.deathEvents.filter(e=>e.year===year);
  const yearInsts=S.deathInstallments.filter(i=>i.year===year);
  const paidInsts=yearInsts.filter(i=>i.status==='paid').length;
  const pendingInsts=yearInsts.length-paidInsts;
  
  const body=`
    <div style="text-align:center;padding:12px 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px">
      <div style="font-size:12px;color:var(--muted)">إحصائيات</div>
      <div style="font-size:32px;font-weight:800;color:var(--primary)">${year}</div>
    </div>
    <div style="font-weight:800;font-size:14px;margin-bottom:10px;color:var(--assoc)">💰 صندوق الجمعية</div>
    <div class="balance-block">
      <div class="balance-row"><span class="lbl">إجمالي الأفراد</span><span class="val">${allPeople.length}</span></div>
      <div class="balance-row"><span class="lbl">✅ مشتركون نشطون</span><span class="val green">${assocActive}</span></div>
      <div class="balance-row"><span class="lbl">⏸️ معافون مؤقتاً</span><span class="val orange">${assocExemptTemp}</span></div>

/* ═══════════════════════════════════════════════
   المتأخرون
   ═══════════════════════════════════════════════ */
function openLatePayerSheet(){
  const year=S.currentYear;
  const consts=S.constants.find(c=>c.year===year);
  const yearly=consts?consts.assocYearly:24000;
  const activeSubs=S.subscriptions.filter(s=>s.year===year&&s.assocStatus==='active');
  const latePeople=[];
  for(const sub of activeSubs){
    const person=getPersonById(sub.personId);
    if(!person)continue;
    const paid=S.assocPayments.filter(p=>p.personId===sub.personId&&p.year===year).reduce((s,p)=>s+(Number(p.amount)||0),0);
    if(paid<yearly){
      latePeople.push({person,paid,remaining:yearly-paid,percent:Math.round(paid/yearly*100)});
    }
  }
  latePeople.sort((a,b)=>b.remaining-a.remaining);
  if(!latePeople.length){
    openSheet('⏰ المتأخرون',`<div class="empty"><span class="ico">🎉</span><h3>لا يوجد متأخرون</h3></div>`,'<button class="btn ghost" onclick="closeSheet()">إغلاق</button>');
    return;
  }
  const totalRemaining=latePeople.reduce((s,p)=>s+p.remaining,0);
  const body=`
    <div style="padding:14px;background:var(--death-soft);border-radius:12px;margin-bottom:14px;text-align:center">
      <div style="font-size:12px;color:var(--muted)">إجمالي المتبقي</div>
      <div style="font-size:24px;font-weight:800;color:var(--death);margin-top:4px">${fmtNum(totalRemaining)} ل.س</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">عدد المتأخرين: <b>${latePeople.length}</b></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <button class="btn success block" onclick="shareLatePayers()">📱 واتساب</button>
      <button class="btn ghost block" onclick="window.print()">🖨️ طباعة</button>
    </div>
    <div class="list">
      ${latePeople.slice(0,100).map(({person,paid,remaining,percent})=>`
        <div class="item" onclick="closeSheet();setTimeout(()=>openPersonSheet(${person.id}),150)">
          <div class="av ${percent>0?'orange':'red'}">${percent>0?'📊':'❌'}</div>
          <div class="body">
            <div class="ttl">${esc(person.name)}</div>
            <div class="sub">${esc(person.code||'')} • ${esc(person.sector||'')} • دفع ${fmtNum(paid)}/${fmtNum(yearly)}</div>
            <div class="progress" style="margin-top:4px"><div style="width:${percent}%;background:${percent>50?'var(--warning)':'var(--danger)'}"></div></div>
          </div>
          <div style="text-align:left;font-weight:800;color:var(--danger);font-size:13px">${fmtShort(remaining)}</div>
        </div>
      `).join('')}
    </div>
    ${latePeople.length>100?`<div style="text-align:center;padding:14px;font-size:12px;color:var(--muted)">عرض أول 100 من ${latePeople.length}</div>`:''}
  `;
  openSheet(`⏰ المتأخرون — ${year}`,body,'<button class="btn ghost" onclick="closeSheet()">إغلاق</button>',{wide:true});
}

function shareLatePayers(){
  const year=S.currentYear;
  const consts=S.constants.find(c=>c.year===year);
  const yearly=consts?consts.assocYearly:24000;
  const activeSubs=S.subscriptions.filter(s=>s.year===year&&s.assocStatus==='active');
  const late=[];
  for(const sub of activeSubs){
    const person=getPersonById(sub.personId);
    if(!person)continue;
    const paid=S.assocPayments.filter(p=>p.personId===sub.personId&&p.year===year).reduce((s,p)=>s+(Number(p.amount)||0),0);
    if(paid<yearly){
      late.push({name:person.name,code:person.code||'',remaining:yearly-paid});
    }
  }
  if(!late.length){toast('لا يوجد متأخرون','success');return}
  let txt=`⏰ *قائمة المتأخرين — ${year}*\nعدد: ${late.length}\n\n`;
  late.forEach((p,i)=>{txt+=`${i+1}. ${p.name}${p.code?' ('+p.code+')':''} — ${fmtNum(p.remaining)} ل.س\n`});
  txt+=`\n_صندوق زعورة_`;
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank');
}

/* ═══════════════════════════════════════════════
   تقارير
   ═══════════════════════════════════════════════ */
function openReport(type){
  const year=S.currentYear;
  if(type==='assoc')openAssocReport(year);
  else if(type==='death')openYearlyDeathsSheet();
  else if(type==='donation')openDonationReport(year);
  else if(type==='sector')openSectorReport(year);
  else if(type==='late')openLatePayerSheet();
  else if(type==='yearly')openYearlyReport(year);
  else if(type==='stats')openStatsSheet();
  else if(type==='handovers')openHandoversSheet();
  else if(type==='audit')openAuditSheet();
}

function openAssocReport(year){
  const payments=S.assocPayments.filter(p=>p.year===year);
  const totalAmount=payments.reduce((s,p)=>s+(Number(p.amount)||0),0);
  const uniquePeople=new Set(payments.map(p=>p.personId)).size;
  const bySector={};
  payments.forEach(p=>{
    const person=getPersonById(p.personId);
    const sector=person?.sector||'غير محدد';
    if(!bySector[sector])bySector[sector]={total:0,count:0};
    bySector[sector].total+=Number(p.amount)||0;
    bySector[sector].count++;
  });
  const body=`
    <div style="text-align:center;padding:12px 0 16px">
      <div style="font-size:32px;font-weight:800;color:var(--assoc)">${fmtNum(totalAmount)} ل.س</div>
      <div style="font-size:12px;color:var(--muted)">إجمالي المحصّل في ${year}</div>
    </div>
    <div class="balance-block">
      <div class="balance-row"><span class="lbl">عدد الدفعات</span><span class="val">${payments.length}</span></div>
      <div class="balance-row"><span class="lbl">عدد الدافعين</span><span class="val">${uniquePeople}</span></div>
      <div class="balance-row"><span class="lbl">المتوسط</span><span class="val">${payments.length?fmtNum(Math.round(totalAmount/payments.length)):0}</span></div>
    </div>
    <div style="font-weight:800;font-size:13px;margin:16px 0 10px">📍 حسب القطاع</div>
    <div class="balance-block">
      ${Object.entries(bySector).sort((a,b)=>b[1].total-a[1].total).map(([sector,data])=>`
        <div class="balance-row"><span class="lbl">${esc(sector)} (${data.count})</span><span class="val" style="color:var(--assoc)">${fmtNum(data.total)}</span></div>
      `).join('')}
    </div>
  `;
  openSheet(`💰 تقرير الجمعية — ${year}`,body,'<button class="btn ghost" onclick="closeSheet()">إغلاق</button>',{wide:true});
}

function openDonationReport(year){
  const donations=S.donations.filter(d=>d.year===year);

    <div style="text-align:center;padding:12px 0 16px">
      <div style="font-size:32px;font-weight:800;color:var(--donation)">${fmtNum(total)} ل.س</div>
      <div style="font-size:12px;color:var(--muted)">إجمالي التبرعات في ${year}</div>
    </div>

function openSectorReport(year){
  const data=S.sectors.map(s=>{
    const people=S.people.filter(p=>p.sector===s.name&&p.status==='حي');
    const activeAssoc=S.subscriptions.filter(sub=>{const p=getPersonById(sub.personId);return p&&p.sector===s.name&&sub.year===year&&sub.assocStatus==='active'}).length;
    const activeDeath=S.subscriptions.filter(sub=>{const p=getPersonById(sub.personId);return p&&p.sector===s.name&&sub.year===year&&sub.deathStatus==='active'}).length;
    const collected=S.assocPayments.filter(p=>p.year===year).filter(p=>{const person=getPersonById(p.personId);return person&&person.sector===s.name}).reduce((sum,p)=>sum+(Number(p.amount)||0),0);
    return {sector:s,people:people.length,activeAssoc,activeDeath,collected};
  });
  const body=`
    <div style="text-align:center;padding:12px 0 16px">
      <div style="font-size:32px;font-weight:800;color:var(--primary)">${S.sectors.length}</div>
      <div style="font-size:12px;color:var(--muted)">قطاعات</div>
    </div>
    ${data.map(d=>`
      <div class="balance-block" style="margin-bottom:12px">

        <div class="balance-row"><span class="lbl">⚰️ في الوفاة</span><span class="val" style="color:var(--death)">${d.activeDeath}</span></div>
        <div class="balance-row"><span class="lbl">💵 محصّل ${year}</span><span class="val" style="color:var(--assoc)">${fmtNum(d.collected)}</span></div>
      </div>
    `).join('')}
  `;
  openSheet(`🗺️ تقرير القطاعات — ${year}`,body,'<button class="btn ghost" onclick="closeSheet()">إغلاق</button>',{wide:true});
}

async function ensureDefaultConstants(){
  const years=[2025,2026,2027,2028];
  let added=0;
  for(const year of years){
    const existing=S.constants.find(c=>c.year===year);
    if(!existing){
      const c={year,assocYearly:24000,deathInstallment:5000,deathCompensation:25000,joinAssoc:100000,joinDeath:50000,joinReduced:50000,createdAt:new Date().toISOString()};
      const id=await dbPut('constants',c);
      c.id=id;
      S.constants.push(c);
      added++;
    }
  }
  if(added>0)console.log(`✅ تم إضافة ${added} سنة افتراضية`);
}

      dbAll('handovers').then(d=>S.handovers=d),
      dbAll('auditLog').then(d=>S.auditLog=d)
    ]);
